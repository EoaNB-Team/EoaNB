l_english:
 ## France 1854-1857: tooltips, ideas, decisions
 v54_tt_fra_stance_war: "France joined Britain against Russia in the Eastern crisis"
 v54_tt_fra_stance_mediation: "France chose to mediate in the Eastern crisis"
 v54_tt_fra_stance_neutral: "France chose to stand aside in the Eastern crisis"
 v54_tt_fra_stance_russia: "France chose an understanding with Russia in the Eastern crisis"
 FRA_v54_idea_army_of_the_east: "The Army of the East"
 FRA_v54_idea_army_of_the_east_desc: "Tens of thousands of Frenchmen are besieging a Russian fortress on the far side of the Black Sea."
 FRA_v54_idea_allied_fleets: "The Allied Fleets"
 FRA_v54_idea_allied_fleets_desc: "French and British squadrons operate together in the Baltic and the Black Sea."
 FRA_v54_idea_official_candidates: "Official Candidates"
 FRA_v54_idea_official_candidates_desc: "The prefects name the candidates, and the Corps Législatif votes as it is told."
 FRA_v54_idea_church_and_empire: "The Church and the Empire"
 FRA_v54_idea_church_and_empire_desc: "The Catholic party supports the regime in return for schools, charities and the garrison in Rome."
 FRA_v54_idea_credit_mobilier: "The Crédit Mobilier"
 FRA_v54_idea_credit_mobilier_desc: "A great investment bank gathers the savings of the middle class to build railways and factories."
 FRA_v54_idea_railway_companies: "The Great Railway Companies"
 FRA_v54_idea_railway_companies_desc: "Six great networks, each with a guaranteed return, spread across France."
 FRA_v54_idea_imperial_guard: "The Imperial Guard"
 FRA_v54_idea_imperial_guard_desc: "An elite corps of picked men guards the Emperor and sets the army's tone."
 FRA_v54_idea_steam_navy: "The Steam Navy"
 FRA_v54_idea_steam_navy_desc: "The dockyards of Toulon, Brest and Cherbourg build the first steam battle fleet in the world."
 FRA_v54_idea_nationalities: "The Principle of Nationalities"
 FRA_v54_idea_nationalities_desc: "The Emperor holds that peoples should govern themselves, a doctrine that pleases liberals and alarms the neighbours."
 FRA_v54_idea_haussmann_paris: "Haussmann's Paris"
 FRA_v54_idea_haussmann_paris_desc: "A prefect and an Emperor are rebuilding the capital on a scale never seen before."
 FRA_v54_idea_suez_company: "The Suez Company"
 FRA_v54_idea_suez_company_desc: "French capital and a French diplomat dig a canal between two seas."
 v54_decisions_category_fra_1854: "France in 1854"
 v54_decisions_category_fra_1854_desc: "The war, the capital and the routine of the Empire in the years of the Eastern war."
 v54_fra_dec_reinforce_the_crimea: "Drafts for the Crimea"
 v54_fra_dec_reinforce_the_crimea_desc: "Another draft of conscripts and reservists sails from Marseille for the Black Sea."
 v54_fra_dec_haussmann_works: "New Boulevards and Sewers"
 v54_fra_dec_haussmann_works_desc: "The prefect of the Seine opens another section of his great plan."
 v54_fra_dec_official_candidates: "Manage the Elections"
 v54_fra_dec_official_candidates_desc: "The prefects see to it that the right candidates are returned and the wrong ones are not."
 v54_fra_dec_imperial_tour: "An Imperial Tour"
 v54_fra_dec_imperial_tour_desc: "The Emperor travels the provinces to bless railways, inspect works and be seen."
 v54_fra_dec_railway_concessions: "New Railway Concessions"
 v54_fra_dec_railway_concessions_desc: "A new line is granted to one of the great companies, with a guaranteed return."

 ## Events
 v54_fra.50.t: "Paris and the Eastern Question"
 v54_fra.50.d: "The Emperor has championed the Catholic claim to the Holy Places, and the Ottoman Empire has been bullied by Russia. At the Tuileries the Empress, the clergy and the military party want a French role in the East, while the finance minister and the old Orleanist diplomats counsel prudence.\n\nThe Emperor has not said what he will do. He thinks mainly of how to be received as an equal by Britain."
 v54_fra.50.a: "The Emperor will decide."
 v54_fra.51.t: "The Alliance of 10 April"
 v54_fra.51.d: "Britain and France are ready to sign a treaty of alliance with the Ottoman Empire. It would bind the two nations for the duration of the war and put their forces under a joint plan, and it would be the first formal alliance between them in a generation. Napoleon III hopes that it will outlast the war."
 v54_fra.51.a: "$V54_HISTORICAL_MARK$ Sign the alliance.\n§gHistorically: the treaty of 10 April 1854 allied France, Britain and the Ottoman Empire, and the Anglo-French understanding became the keystone of the Emperor's foreign policy until the end of the decade.§!"
 v54_fra.51.b: "Limit the treaty to the duration of the war."
 v54_fra.54.t: "The Army of the East"
 v54_fra.54.d: "The army has gathered at Varna, where cholera and boredom are killing more men than the Russians. The generals want a decisive stroke, and the British want Sevastopol. An expedition to the Crimea would be a gamble across the Black Sea in the autumn, with an army that has not fought in Europe since 1815."
 v54_fra.54.a: "$V54_HISTORICAL_MARK$ Land in the Crimea and besiege Sevastopol.\n§gHistorically: the Allies landed in September 1854, won the battle of the Alma and began the siege. Saint-Arnaud died a week after the battle.§!"
 v54_fra.54.b: "Hold the line of the Danube."
 v54_fra.57.t: "Peace Feelers"
 v54_fra.57.d: "Sevastopol has fallen and Russia's resources are strained, but the French army has lost nearly a hundred thousand men to the war and the winters. Austria offers mediation, and Britain wants the war to continue until the Russian fleet is destroyed.\n\nThe Emperor wants peace, and his prestige needs a victory that looks complete."
 v54_fra.57.a: "$V54_HISTORICAL_MARK$ Accept the Austrian mediation and negotiate.\n§gHistorically: after the fall of Sevastopol in September 1855 France pressed for peace, and the armistice followed in February 1856.§!"
 v54_fra.57.b: "Continue the war with Britain for another campaign."
 v54_fra.58.t: "The Congress of Paris"
 v54_fra.58.d: "The congress meets in Paris with Walewski in the chair. The Emperor can use the occasion to appear as the mediator of Europe, or to raise the questions that interest him: Italy, the Principalities, Poland. Cavour has been admitted to speak, and Clarendon is anxious that France not raise questions that divide the victors."
 v54_fra.58.a: "$V54_HISTORICAL_MARK$ Allow Italy and the Principalities to be raised.\n§gHistorically: Walewski let Cavour denounce Austrian rule in Italy, and the congress discussed the Principalities and the Italian question without any immediate result.§!"
 v54_fra.58.b: "Keep the congress strictly to the peace."
 v54_fra.60.t: "A Son for the Emperor"
 v54_fra.60.d: "On 16 March the Empress gives birth to a son. The cannon of the Invalides fire a hundred and one salvoes and the Emperor weeps. The Bonapartist dynasty, until now a bet on one man's life, is a family, and the plenipotentiaries assembled in Paris are invited to the baptism."
 v54_fra.60.a: "The dynasty has an heir."
 v54_fra.61.t: "The State Visit to Windsor"
 v54_fra.61.d: "The Emperor and Empress have crossed to England and been received at Windsor by Queen Victoria. The Queen, who had expected a parvenu, finds a courteous man of simple manners, and the Empress charms the court. The Garter is conferred, and the newspapers talk of a new era of friendship."
 v54_fra.61.a: "The entente is sealed."
 v54_fra.62.t: "The Exposition Universelle"
 v54_fra.62.d: "The Palace of Industry opens on the Champs-Élysées in May. In August Queen Victoria and Prince Albert arrive for a state visit, and the Emperor shows them the new Paris, Napoleon's tomb and Versailles. The Exposition is a triumph of French taste, and the visitors who came to be astonished leave astonished.\n\nHow much should it cost?"
 v54_fra.62.a: "$V54_HISTORICAL_MARK$ Spare no expense. The Exposition must outshine London's.\n§gHistorically: the Exposition Universelle of 1855 drew some five million visitors and the Queen's visit crowned it.§!"
 v54_fra.62.b: "Hold a modest exhibition."
 v54_fra.63.t: "Haussmann's Paris"
 v54_fra.63.d: "The prefect lays his plans before the Emperor: a great east-west axis, a ring of boulevards, new water mains and sewers, and the clearance of whole districts. The cost is enormous and the Emperor is not worried by it; the Council of Paris is. The prefect proposes to finance the works by loans that the Crédit Foncier will help to place."
 v54_fra.63.a: "$V54_HISTORICAL_MARK$ Approve the great plan.\n§gHistorically: Haussmann's transformation of Paris went on until 1870, became a model for European cities, and was a source of debt and discontent.§!"
 v54_fra.63.b: "Approve a smaller programme."
 v54_fra.65.t: "The Concession of Said Pasha"
 v54_fra.65.d: "Ferdinand de Lesseps has the Viceroy's firman for a canal company of which the Emperor is expected to be a friend. Palmerston calls the project a French design against the road to India, and British engineers say that it cannot be built.\n\nThe Emperor may support Lesseps openly or leave him to find his own backers."
 v54_fra.65.a: "$V54_HISTORICAL_MARK$ Support Lesseps and the canal company.\n§gHistorically: Said Pasha granted the concession on 30 November 1854, and the Suez Canal Company was founded in 1858 with French capital.§!"
 v54_fra.65.b: "Stay out. It is a private matter."
 v54_fra.66.t: "Tariffs or Free Trade?"
 v54_fra.66.d: "The Emperor has received two memoranda. Michel Chevalier proposes to replace prohibitions with moderate duties and to open the market to British iron and coal; the ironmasters of the north and the Legislature warn that French industry will not survive the competition. The Emperor, who sets tariffs by decree, must decide."
 v54_fra.66.a: "$V54_HISTORICAL_MARK$ Lower the tariffs on coal, iron and raw materials by decree.\n§gHistorically: the Empire cut many duties between 1853 and 1856 and in 1860 signed the Cobden-Chevalier treaty, to the anger of the protectionists.§!"
 v54_fra.66.b: "Keep the protective system."
 v54_fra.67.t: "Faidherbe Goes to Senegal"
 v54_fra.67.d: "Louis Faidherbe, a captain of engineers, is appointed governor of Senegal at the end of 1854. He arrives with orders to protect the trading posts and a private determination to turn them into a colony. The river is long, the garrisons are small and the traders' interests are many."
 v54_fra.67.a: "$V54_HISTORICAL_MARK$ Give him the means to extend French control on the river.\n§gHistorically: Faidherbe governed Senegal from 1854 to 1865, with a break, and built a colony on the river.§!"
 v54_fra.67.b: "Keep the posts as trading stations."
 v54_fra.68.t: "The Imperial Guard Restored"
 v54_fra.68.d: "By decree of 1 May the Imperial Guard of the first Empire is re-established, with grenadiers, voltigeurs, chasseurs and cavalry picked from the line and paid better. It is a glittering escort for the Emperor and an elite at the centre of the army."
 v54_fra.68.a: "The eagles are back."
 v54_fra.69.t: "The Death of Saint-Arnaud"
 v54_fra.69.d: "The commander-in-chief, worn out by cholera and by the strain of command, has died at sea a week after the victory on the Alma. The army needs a new commander and must decide quickly how to besiege a city it has barely seen."
 v54_fra.69.a: "$V54_HISTORICAL_MARK$ Canrobert takes command.\n§gHistorically: Canrobert assumed command and was replaced by Pélissier in May 1855.§!"
 v54_fra.69.b: "Bosquet takes command."
 v54_fra.70.t: "The Garrison in Rome"
 v54_fra.70.d: "The French garrison in Rome has held the city for the Pope since 1849. The Catholics demand that it stay, the liberals and the Piedmontese demand that it leave, and the Emperor, who knows how little the Pope listens to advice, would like to be able to do both."
 v54_fra.70.a: "$V54_HISTORICAL_MARK$ Keep the garrison.\n§gHistorically: the French garrison stayed in Rome until 1866 and returned in 1867.§!"
 v54_fra.70.b: "Plan a withdrawal."
 v54_fra.72.t: "The Union of the Principalities"
 v54_fra.72.d: "The Congress has left the future of the Principalities to a commission and to assemblies of the Romanians themselves. France, Sardinia and Russia favour union, while Austria, Britain and the Ottoman Empire oppose it. The Emperor can make union a French cause or let it wait."
 v54_fra.72.a: "$V54_HISTORICAL_MARK$ Support the union, within limits.\n§gHistorically: Napoleon III supported the union of Moldavia and Wallachia, and in 1859 both elected Alexander Cuza as their prince.§!"
 v54_fra.72.b: "Leave it to the commission."