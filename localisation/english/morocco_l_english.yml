l_english:

 MOR_END_OF_NEW_BEG_DESC: "Morocco is navigating a turbulent era marked by internal and external pressures. The country struggles with political fragmentation, economic difficulties, and an outdated military structure. The ruling Alaouite dynasty faces challenges in maintaining authority, and the need for modernization is increasingly pressing.\n\nExternally, European powers, particularly France and Spain, are expanding their influence in North Africa, viewing Morocco's strategic Atlantic and Mediterranean coastline as a valuable prize. The threat of foreign intervention looms as European interests grow, putting Morocco's sovereignty at risk.\n\nAt this crossroads, Morocco's leadership must balance the push for reform with the preservation of its independence as the country grapples with the demands of modernization and the risk of colonial encroachment. Every reform risks angering entrenched interests, while every delay gives foreign powers more time to tighten their grip. How Morocco navigates these pressures will determine whether the Sultanate renews its strength or falls under European domination."


 MOR_outdated_army: "Outdated Army"
 MOR_outdated_army_desc: "Morocco's army remains a mixture of regular forces and tribal levies, with uneven training, organization, and equipment. The defeat at Isly has shown the danger of relying on older methods while European armies continue to modernize. Without permanent formations, dependable supply, and a trained officer corps, the Sultan cannot be certain that courage alone will protect the kingdom."
 MOR_idea_trans_saharan_wealth1: "Trans-Saharan Wealth"
 MOR_idea_trans_saharan_wealth1_desc: "Growing commercial activity across the Sahara is opening new markets for Moroccan merchants. Better access to southern trade routes allows the kingdom to turn distant resources and crafts into a more dependable source of wealth. Each protected caravan strengthens the commercial ties linking the royal cities with Saharan communities and the markets of West Africa."
  ###NATIONAL SPIRITS###

 MOR_bled_es_siba: "Bled es-Siba"
 MOR_bled_es_siba_desc: "Beyond the cities and plains firmly held by the Makhzen, many tribes govern their own affairs and resist regular taxation. They still recognize the Sultan's religious authority, but his officials cannot enforce every order in the mountains and southern hinterlands. This division limits revenue, complicates recruitment, and forces the court to rely on negotiation or costly military expeditions whenever local disputes become open defiance."
 MOR_rampant_corruption: "Rampant Corruption"
 MOR_rampant_corruption_desc: "Offices, tax farms, and provincial commands too often serve private fortunes rather than the Sultanate. Bribery and favoritism drain the treasury, weaken public trust, and obstruct every serious attempt at reform. Officials who profit from confusion have little reason to keep accurate records or surrender privileges that depend upon weak oversight."
 MOR_a_loyal_makhzen: "The Makhzen"
 MOR_a_loyal_makhzen_desc: "The Sultan rules through the Makhzen, a network of ministers, palace officials, governors, and military households bound to the Alaouite throne. This system preserves dynastic authority, but its dependence on personal loyalty makes reform slow and uneven. So long as these servants remain faithful, they provide the dynasty with a flexible government capable of surviving crises that would break a more rigid state."
 MOR_mothballed_navy: "Mothballed Navy"
 MOR_mothballed_navy_desc: "Morocco's once-formidable maritime power has declined into a small collection of aging vessels and neglected facilities. With European fleets operating along both coasts, rebuilding the navy is becoming a matter of sovereignty rather than prestige. Until new ships, trained crews, and functioning dockyards are available, the kingdom must watch foreign warships enter its waters with little means of response."
 MOR_modifier_winds_of_change: "Winds of Change"
 MOR_modifier_winds_of_change_desc: "A generation of officials, scholars, and officers is urging the court to study foreign methods and strengthen the state. Their influence gives the Makhzen new tools for reform, even as established interests defend the old order. The struggle between cautious adaptation and determined resistance now shapes nearly every question placed before the Sultan."
 MOR_winds_change_1: "Winds of Change"
 MOR_winds_change_1_desc: "Reform-minded advisers are gaining influence at court, while steam power, modern schools, and new methods of administration offer a glimpse of a different future. Morocco is beginning the long effort to narrow the widening gap with Europe. Progress remains cautious, but the idea that foreign knowledge can serve Moroccan independence is becoming harder for conservative officials to dismiss."
 MOR_winds_change_2: "Winds of Change"
 MOR_winds_change_2_desc: "Modern schools, imported machinery, and officials trained in foreign methods are changing how the Sultanate produces goods and conducts its affairs. Reform is no longer confined to plans at court; it is beginning to reshape Morocco's economy and institutions. Each successful project creates the expertise and political confidence required to attempt changes that once appeared impossible."
 MOR_idea_growing_cotton_exports: "Growing Cotton Exports"
 MOR_idea_growing_cotton_exports_desc: "Expanded cultivation is producing enough cotton to supply local workshops and reach foreign markets. The new export trade brings merchants greater profits and gives the treasury another source of customs revenue. Rural producers also gain a valuable cash crop, drawing farming districts more closely into the commercial life of the ports and imperial cities."
 MOR_cotton_trade: "Cotton Trade"
 MOR_cotton_trade_desc: "Cotton connects Morocco's farms, merchants, ports, and textile workshops to a wider Mediterranean market. Maintaining a steady supply is essential to both domestic cloth production and the growth of overseas trade. The industry remains vulnerable to poor harvests and foreign competition, making secure cultivation and transport a continuing concern of the Makhzen."
 MOR_jaysh_al_sultan_0: "Army of the Sultan"
 MOR_jaysh_al_sultan_0_desc: "The Sultan's army combines palace troops, tribal contingents, and a small regular force whose training and equipment vary widely. It can preserve order at home, but it remains poorly prepared for another war against a modern European army. Rival commands, irregular pay, and incompatible weapons prevent these forces from acting as a single dependable instrument of state power."
 MOR_jaysh_al_sultan_1: "Army of the Sultan"
 MOR_jaysh_al_sultan_1_desc: "New weapons and regular drill are beginning to strengthen the Sultan's professional forces. The army still depends heavily on older formations, but a disciplined core is taking shape around the Askar Nizami. These battalions provide a model that can gradually spread common training, organization, and standards throughout the wider military establishment."
 MOR_jaysh_al_sultan_2: "Army of the Sultan"
 MOR_jaysh_al_sultan_2_desc: "Standardized equipment, trained officers, and permanent battalions give the Makhzen a more dependable army. These reforms allow the Sultan to project authority farther from the royal cities and meet foreign threats with organized resistance. Tribal contingents still serve beside the regulars, but they now operate within a clearer structure of command and supply."
 MOR_jaysh_al_sultan_3: "Army of the Sultan"
 MOR_jaysh_al_sultan_3_desc: "The reformed Jaysh al-Sultan stands as a modern instrument of the Moroccan state. Its regular infantry, artillery, and officer corps give the kingdom a force capable of defending its sovereignty and enforcing the Sultan's authority. Morocco can now meet invasion with coordinated resistance rather than another improvised host assembled only after the enemy has crossed the frontier."
 MOR_idea_al_rudani_printing_machine: "ar-Rudani Printing Machine"
 MOR_idea_al_rudani_printing_machine_desc: "Muhammad ibn al-Tayyib ar-Rudani brings the printing press to Morocco from Egypt in 1864, opening a new avenue for spreading religious, scientific, and technical knowledge. The press allows scholars to reproduce works more widely while preserving the distinctive Moroccan tradition of manuscript writing. Government notices, translated manuals, and educational texts can now reach officials and students with a speed no copying workshop can match."
 MOR_idea_infrastructure_efforts: "Infrastructure Efforts"
 MOR_idea_infrastructure_efforts_desc: "State subsidies are extending roads between Fez, the ports, provincial markets, and the interior. Better connections speed trade and communication while reducing the Makhzen's dependence on unreliable local intermediaries. Troops, tax officials, and royal correspondence can travel more regularly, giving the central government a presence in districts once reached only with difficulty."
 MOR_idea_reinvest_in_commerce: "Reinvest in Commerce"
 MOR_idea_reinvest_in_commerce_desc: "Revenue from recent growth is being directed back into markets, workshops, and transport. Sustained investment gives Moroccan merchants the capital and infrastructure needed to compete in an increasingly open economy. The resulting cycle of trade and reinvestment keeps more wealth circulating within the Sultanate instead of passing directly into foreign hands."
 MOR_idea_tackle_the_financial_crisis: "Tackle the Financial Crisis"
 MOR_idea_tackle_the_financial_crisis_desc: "Stricter accounts, more reliable taxation, and limits on private enrichment are slowly restoring order to the treasury. The reforms provoke resistance from officials and provincial notables, but fiscal recovery is essential to every other state project. A government that cannot measure its revenue or honor its obligations will remain dependent on emergency levies and dangerous foreign loans."
 MOR_idea_take_control_of_the_economy0: "Take Control of the Economy"
 MOR_idea_take_control_of_the_economy0_desc: "Foreign merchants and treaty privileges increasingly shape Moroccan commerce. The Makhzen is beginning to recover its influence over currency, taxation, and investment before economic dependence becomes political submission. Success requires stronger institutions capable of supervising markets without driving away the trade and expertise on which modernization presently depends."
 MOR_idea_take_control_of_the_economy1: "Take Control of the Economy."
 MOR_idea_take_control_of_the_economy1_desc: "Measures against inflation and unreliable currency are restoring confidence in Moroccan markets. Greater price stability strengthens purchasing power and gives the government room to challenge foreign commercial influence. Merchants can plan transactions with less risk, while taxes paid in sound money provide the treasury with revenue it can actually use."
 MOR_idea_take_control_of_the_economy2: "Take Control of the Economy"
 MOR_idea_take_control_of_the_economy2_desc: "The currency is stable, state revenue is recovering, and domestic investment is no longer entirely at the mercy of foreign interests. Morocco now possesses the financial foundation needed to pursue reform on its own terms. Economic sovereignty does not remove every foreign pressure, but it gives the Sultanate far greater freedom to decide where its resources are directed."
 MOR_idea_trans_saharan_wealth: "Trans-Saharan Wealth"
 MOR_idea_trans_saharan_wealth_desc: "Caravan routes across the Atlas and Sahara carry gold, salt, livestock, textiles, and other valuable goods between Morocco and West Africa. Firmer control over the southern trade allows the Makhzen to direct more of this wealth toward the kingdom. Protected wells, secure roads, and cooperative tribal leaders help preserve a commerce threatened by disorder and the growing diversion of trade toward European ports."
 MOR_idea_administration_overhaul: "Administration Overhaul" 
 MOR_idea_administration_overhaul_desc: "The court is replacing corrupt intermediaries with officials expected to keep records, obey royal orders, and answer for the revenue they collect. A more capable administration gives the Sultan the means to turn reforming decrees into policy throughout the kingdom. Regular reporting also makes it harder for provincial authorities to conceal abuses behind distance, custom, or personal connections at court."
 MOR_idea_justice_for_moroccans: "Justice for Moroccans!"
 MOR_idea_justice_for_moroccans_desc: "Reforming the courts gives ordinary Moroccans greater confidence that disputes will be settled by law rather than influence or arbitrary punishment. A more consistent system of justice also strengthens the authority of the Makhzen. When subjects can appeal abuses and expect enforcement, obedience to the state rests upon legitimacy as well as fear of punishment."
 MOR_idea_appointed_tribes: "Appointed Representatives of the Tribes"
 MOR_idea_appointed_tribes_desc: "Recognized representatives can give the tribes a direct channel to the Makhzen while allowing the Sultan to keep closer watch over provincial affairs. This arrangement strengthens cooperation without demanding immediate control over every local matter. Disputes, taxes, and military obligations can be negotiated through men who possess authority in both their communities and the royal administration."
 MOR_idea_qaid_network: "Qaid Network"
 MOR_idea_qaid_network_desc: "A network of trained qaids gives the Makhzen reliable local officials through whom orders, taxes, and justice can reach the countryside. Their growing presence ties provincial administration more closely to the Sultan. The quality of their rule will determine whether centralization appears as orderly government or merely a more efficient form of local exploitation."
 MOR_idea_qaid_training: "Qaid Training"
 MOR_idea_qaid_training_desc: "The new generation of qaids must be trained to administer provinces, collect revenue, maintain order, and answer to the Makhzen. Better prepared officials will make central authority more effective beyond the major cities. Instruction in records, law, and finance gives them the practical skills needed to govern without relying entirely on inherited custom or personal patronage."
 MOR_idea_local_madrass: "Local Madrass"
 MOR_idea_local_madrass_desc: "Supporting local madrasas strengthens Morocco's traditional centers of learning while giving scholars the means to teach a wider range of subjects. Religious education can remain at the heart of public life while new knowledge is carefully introduced. Their graduates supply the courts and administration with literate men who can connect reforming institutions to respected Moroccan traditions."
 MOR_idea_profiting_off_lands: "Profiting Off Lands"
 MOR_idea_profiting_off_lands_desc: "Much of Morocco's land and natural wealth remains only lightly integrated into the state economy. Bringing these resources into productive use can increase exports, strengthen public revenue, and give the Makhzen a greater stake in the countryside. Careful management is required so that development enriches local communities and the treasury instead of creating new monopolies for officials or foreign investors."
 MOR_idea_rural_justice: "Rural Justice"
 MOR_idea_rural_justice_desc: "Justice must not end at the walls of Morocco's great cities. Extending dependable courts and legal authority into rural areas can curb abuses by local officials and give the countryside a stronger connection to the central government. Every fair judgment strengthens the claim that the Sultan's protection reaches subjects who rarely see a royal official."
 MOR_idea_integrated_markets: "Integrated Markets"
 MOR_idea_integrated_markets_desc: "Better connected markets allow goods to move more freely between Morocco's regions. A more integrated domestic economy strengthens trade, improves access to resources, and gives merchants greater reason to invest. Common measures, safer roads, and fewer local barriers help turn scattered commercial centers into a national market."
 MOR_coinage_crisis: "Coinage Crisis"
 MOR_coinage_crisis_desc: "Foreign silver and copper coins circulate alongside Moroccan currency, while the value of local coinage continues to fluctuate. The resulting uncertainty complicates taxation, trade, and everyday transactions, making monetary reform increasingly difficult to avoid. Counterfeit pieces and inconsistent exchange rates allow speculators to profit while workers, farmers, and the treasury absorb the losses."
 MOR_study_european_industry: "Study European Industries"
 MOR_study_european_industry_desc: "European factories demonstrate how machinery, specialized labor, and concentrated production can transform a national economy. Moroccan observers will study these methods and determine which can be adapted without surrendering control of domestic industry. The goal is not blind imitation, but the creation of productive institutions suited to Morocco's resources, workforce, and political needs."
 MOR_idea_madrassa_al_muhandiseer: "Madrassa Al Muhandiseer"
 MOR_idea_madrassa_al_muhandiseer_desc: "An engineering school gives Moroccan students practical knowledge in mathematics, construction, mechanics, and other useful sciences. Educating a new generation of engineers will help the country turn imported ideas into projects of its own. Graduates can supervise roads, fortifications, machines, and arsenals without requiring a foreign adviser at every stage."
 MOR_idea_renegade_officers: "Renegade Officers"
 MOR_idea_renegade_officers_desc: "Some officers are willing to abandon old habits and learn from the military changes taking place around Morocco. Bringing these men into positions of influence can give the army instructors who understand the need for reform. Their unfamiliar backgrounds arouse suspicion, but practical experience with modern weapons and organization is too valuable for the Sultanate to ignore."
 MOR_idea_dar_al_makhzen: "Dar Al Makhzen"
 MOR_idea_dar_al_makhzen_desc: "A military school under the authority of the Dar al-Makhzen can provide officers with a more consistent education in organization, planning, and command. A professional officer corps will give the Sultan a stronger instrument of state power. Shared instruction also creates a common military culture among men who previously learned their duties through separate households and provincial traditions."
 MOR_idea_foreign_commerce_0: "Foerign Commerce"
 MOR_idea_foreign_commerce_0_desc: "The ports are becoming busier as Morocco enters a more open commercial world. Encouraging foreign trade can bring new revenue and goods into the country, but it also gives European merchants greater influence over Moroccan commerce. The Makhzen must strengthen its customs service and domestic merchants if openness is to enrich the kingdom without eroding its economic independence."

###FOCUS TREE###

 MOR_winds_of_change: "Winds of Change"
 MOR_winds_of_change_desc: "Military defeat and growing European pressure have convinced many at court that Morocco cannot preserve its independence through tradition alone. Reforming officials, scholars, and officers now look for ways to strengthen the Sultanate without abandoning its character. Their challenge is to make adaptation appear as a defense of Morocco rather than a surrender to the powers threatening it."
 MOR_fiscal_crisis: "Financial Crisis"
 MOR_fiscal_crisis_desc: "Weak tax collection, unstable currency, and expanding foreign privileges are draining the treasury. Unless the Makhzen restores order to its finances, Morocco will have neither the money to reform nor the strength to resist European demands. A government forced to borrow for every emergency soon finds its policies dictated by the merchants and diplomats willing to provide credit."
 MOR_crackdown_counterfeiting: "Crackdown on Counterfeinting"
 MOR_crackdown_counterfeiting_desc: "Counterfeit coins and inconsistent weights undermine every market transaction and deprive the treasury of reliable revenue. The government must punish illegal minting and restore public confidence in Moroccan currency. Trusted coinage will make taxes easier to collect and protect ordinary buyers from losses imposed by dishonest money changers."
 MOR_attempt_combat_inflation: "Attempt to Combat Inflation"
 MOR_attempt_combat_inflation_desc: "Rising prices are eroding wages, disrupting trade, and deepening resentment against the government. Careful control of spending and currency must begin before the crisis spreads further. Even limited stabilization will reassure merchants and households that the Makhzen recognizes the danger and is prepared to act."
 MOR_increase_efforts_inflation: "Increase Efforts Against Inflation"
 MOR_increase_efforts_inflation_desc: "The first measures have slowed the crisis but have not restored stable prices. Stronger fiscal discipline and firmer control of the money supply are needed to protect households and merchants from further losses. The policy will be painful, but continued hesitation would allow every new price increase to weaken confidence in the state."
 MOR_trans_saharan_wealth: "Trans-Saharan Wealth"
 MOR_trans_saharan_wealth_desc: "The caravan routes beyond the Atlas link Moroccan markets with the trade of the western Sahara and West Africa. Protecting these routes and strengthening southern authority will direct more gold, livestock, salt, and crafted goods toward the royal cities. Secure wells and negotiated passage with desert communities are as important to this commerce as any market or customs post."
 MOR_export_luxury_goods: "Export Luxury Goods"
 MOR_export_luxury_goods_desc: "Moroccan leather, carpets, jewelry, ceramics, and other fine goods already command respect in foreign markets. Encouraging their export will enrich local craftsmen and bring valuable customs revenue into the treasury. Stronger commercial connections can turn the reputation of these crafts into dependable prosperity for workshops throughout the kingdom."
 MOR_infrastructure_expansion: "Expand Infrastructure"
 MOR_infrastructure_expansion_desc: "Poor roads isolate markets, delay royal orders, and make the movement of troops and goods unnecessarily costly. A national program of construction will bind the ports, imperial cities, and interior more closely together. The same routes that carry commerce will also allow officials and soldiers to answer distant crises before local disorder can spread."
 MOR_connect_major_cities: "Connect Major Cities"
 MOR_connect_major_cities_desc: "Fez, Marrakesh, Meknes, Rabat, Tangier, and the Atlantic ports form the political and commercial heart of Morocco. Reliable roads between them will shorten journeys, expand trade, and help the Makhzen govern from one end of the kingdom to the other. Frequent movement between these centers will also spread information and technical knowledge beyond the court and the largest merchant houses."
 MOR_reinvest_commerce: "Reinvest in Commerce"
 MOR_reinvest_commerce_desc: "New roads are already increasing the flow of goods between the interior and the coast. Reinvesting the resulting revenue in markets, warehouses, and transport will turn an initial improvement into lasting commercial growth. Merchants who see public revenue returned to useful works gain greater confidence in both the state and the future of Moroccan trade."
 MOR_roads_rural: "Develop Rural Roads"
 MOR_roads_rural_desc: "The first construction programs favor the imperial cities and major ports, leaving much of the countryside isolated. Extending roads into rural districts will open local markets, improve communication, and carry the Sultan's authority beyond the traditional centers of power. Villages that can reach larger markets gain more reason to produce a surplus and participate in the national economy."
 MOR_ubl_railway_offer: "UBL Railway Offer"
 MOR_ubl_railway_offer_desc: "A foreign-backed company offers to finance and construct Morocco's first major railways. Its engineers promise faster travel and trade, but the proposed concessions would place vital infrastructure under outside control. The decision therefore concerns more than transport, for whoever controls the rails may also control the flow of Moroccan wealth."
 MOR_reject: "Reject the Offer"
 MOR_reject_desc: "Foreign capital may build railways quickly, but ownership of the lines would give European interests lasting leverage over Moroccan commerce. The offer will be rejected, and the kingdom will pursue development without surrendering control of its future. Progress may come more slowly, yet infrastructure built under Moroccan authority will serve national priorities instead of distant shareholders."
 MOR_begin_construction_railline: "Begin the Construction of the Rail Lines"
 MOR_begin_construction_railline_desc: "Morocco lacks the capital and technical experience to build a railway network alone. By accepting the offer while negotiating firm limits on foreign control, the Makhzen can obtain modern transport without openly abandoning its sovereignty. Careful contracts and supervision must ensure that temporary dependence upon foreign engineers does not become permanent political influence."
 MOR_keeping_pace: "Keeping Pace"
 MOR_keeping_pace_desc: "Steam power, mechanized production, and modern weapons are widening the distance between industrial states and those that depend on older methods. Morocco must master these technologies if it intends to remain sovereign in an age of expanding empires. Every useful machine learned, repaired, and reproduced at home reduces the kingdom's vulnerability to foreign pressure."
 MOR_engineering_education: "Engineering Education"
 MOR_engineering_education_desc: "Imported machines are of little value without people who understand how to build, operate, and repair them. Training Moroccan engineers in mathematics, mechanics, surveying, and construction will give the reform program a skilled foundation. These students can eventually replace costly foreign specialists and adapt unfamiliar designs to the materials and conditions available within Morocco."
 MOR_translate_western_books: "Translate Western Books"
 MOR_translate_western_books_desc: "European works on engineering, medicine, mathematics, and military science contain knowledge that few Moroccan students can presently access. Translating selected texts into Arabic will place these ideas in the hands of local scholars and officials. Careful translation also allows foreign concepts to be debated, corrected, and incorporated through the intellectual language already used in Moroccan institutions."
 MOR_import_ottoman_egyptian_knowledge: "Import Ottoman-Egyptian Knowledge"
 MOR_import_ottoman_egyptian_knowledge_desc: "The Ottoman Empire and Egypt have already adapted foreign technology and institutions to Muslim societies. Their manuals, instructors, and practical experience offer Morocco a path to reform that does not depend entirely on European advisers. Their successes and mistakes provide lessons that are easier to apply within Morocco's religious, legal, and political traditions."
 MOR_build_steam_engine: "Build Steam Engines"
 MOR_build_steam_engine_desc: "The court's engineers now possess the knowledge needed to assemble a working steam engine in Morocco. Building it will demonstrate that foreign machinery can be understood, reproduced, and eventually put to use by Moroccan hands. A successful engine will serve both as a practical machine and as a powerful symbol of the country's capacity for technical renewal."
 MOR_al_rudani_printing_machine: "The ar-Rudani Printing Machine"
 MOR_al_rudani_printing_machine_desc: "Muhammad ibn al-Tayyib ar-Rudani returns from Egypt with a lithographic press and the expertise required to operate it. State printing will allow religious, scientific, and technical works to circulate far more widely than handwritten copies permit. Once printers and supplies are established, the press can support schools, government offices, and the wider exchange of ideas across the Sultanate."
 MOR_economic_revitalization: "Economic Revitalization"
 MOR_economic_revitalization_desc: "The Sultan and his advisers agree that military and administrative reform cannot succeed on an exhausted economic base. The state will coordinate investment in agriculture, crafts, commerce, and infrastructure to restore lasting growth. Prosperity will provide the revenue, skilled workers, and public confidence needed to sustain every other part of the national program."
 MOR_new_agricultural_techniques: "New Agricultural Techniques"
 MOR_new_agricultural_techniques_desc: "Improved irrigation, crop rotation, tools, and seed selection can raise output without placing Moroccan land in foreign hands. Adapting useful methods to local conditions will strengthen rural livelihoods and provide more raw materials for domestic industry. Agricultural reform must earn the confidence of cultivators who cannot afford to risk an entire harvest on an untested practice."
 MOR_invest_unused_land: "Invest in Unused Lands"
 MOR_invest_unused_land_desc: "Large areas remain outside regular cultivation because water, roads, and access to markets are limited. Targeted investment can bring suitable land into production while encouraging settlement and stronger administration in lightly governed districts. New farms will succeed only where irrigation, secure tenure, and dependable transport develop alongside the clearing of the land itself."
 MOR_european_cotton_plantations: "European Cotton Plantations"
 MOR_european_cotton_plantations_desc: "European planters possess capital, seed stock, and commercial experience that could expand Moroccan cotton production quickly. Granting them a limited role may benefit the textile trade, but the Makhzen must prevent investment from becoming control over the land. Regulations will be needed to protect Moroccan cultivators and ensure that a fair share of the profits remains within the kingdom."
 MOR_investments_atlas_regions: "Investments in Atlas Regions"
 MOR_investments_atlas_regions_desc: "The Atlas regions possess farmland, forests, minerals, and trade routes that remain poorly connected to the royal cities. Roads, irrigation, and local markets will draw their resources more fully into the national economy. Development also gives the Makhzen new opportunities to cooperate with mountain communities whose loyalty cannot be secured through taxation alone."
 MOR_cultivate_cotton: "Cultivate Cotton"
 MOR_cultivate_cotton_desc: "A larger domestic cotton crop will reduce the textile trade's dependence on foreign suppliers. The state will encourage suitable farms to adopt the crop and provide the seed, water, and market access needed to make it profitable. Reliable domestic production will connect rural cultivators directly with expanding mills and workshops in Morocco's commercial centers."
 MOR_introduce_cotton_al_haouz: "Introduce Cotton to al-Haouz"
 MOR_introduce_cotton_al_haouz_desc: "The irrigated plain of al-Haouz offers one of Morocco's best opportunities for expanding cotton cultivation. Introducing the crop around Marrakesh will supply nearby artisans and create a valuable new source of trade. Close supervision will help farmers balance this profitable crop with the food production upon which the region continues to depend."
 MOR_focus_wool: "Focus on Wool"
 MOR_focus_wool_desc: "Sheep and wool already suit Morocco's climate, pastoral communities, and established crafts. Concentrating on this familiar resource offers a safer foundation for textile growth than forcing cotton into unsuitable land. Better collection, grading, and processing can raise the value of an existing industry without demanding a sudden transformation of rural life."
 MOR_import_cotton: "Import Cotton"
 MOR_import_cotton_desc: "Domestic farms cannot yet supply every loom and workshop with the cotton they require. Reliable imports will keep the textile industry working while Morocco develops the capacity to produce more raw material at home. Diversifying suppliers will prevent any single foreign merchant community from controlling the flow of this essential commodity."
 MOR_new_production_techniques: "Use New Production Techniques"
 MOR_new_production_techniques_desc: "Moroccan workshops rely on skilled labor but often lack standardized tools and organized workflows. Introducing improved looms, machinery, and production methods will increase output without discarding the knowledge of local craftsmen. Combining mechanical efficiency with traditional expertise can produce goods in greater numbers while preserving the quality for which Moroccan crafts are known."
 MOR_aid_textile_making: "Aid Textile Industries"
 MOR_aid_textile_making_desc: "Textile production supports farmers, dyers, spinners, weavers, and merchants across the kingdom. Credit, equipment, and protected market access will help these trades expand into a stronger national industry. Coordinated assistance ensures that growth in one stage of production is not wasted through shortages or bottlenecks in another."
 MOR_study_european_industries: "Study European Industries"
 MOR_study_european_industries_desc: "Factories abroad reveal how machinery and specialized labor can produce goods on a scale traditional workshops cannot match. Moroccan observers will examine these systems and adapt the most useful practices to local needs. Reports from these missions will guide investment and help the Makhzen avoid costly experiments based only on foreign promises."
 MOR_massive_artisan_investments: "Massive Artisan Investments"
 MOR_massive_artisan_investments_desc: "Morocco's artisans preserve generations of expertise in leatherwork, metalwork, ceramics, jewelry, and cloth. Providing them with capital, tools, and larger markets will strengthen production while keeping economic growth in Moroccan hands. Strong workshops can become the foundation of broader industry without destroying the guilds and family trades that sustain urban society."
 MOR_modern_textile_mill: "A Modern Textile Mill"
 MOR_modern_textile_mill_desc: "A mechanized textile mill will bring spinning and weaving together under one roof, greatly increasing the amount of cloth Morocco can produce. It will also serve as a school for workers learning modern industrial methods. Its success will demonstrate whether large-scale machinery can operate profitably alongside the kingdom's established artisan economy."
 MOR_acquire_european_factories: "Acquire European Industries"
 MOR_acquire_european_factories_desc: "Purchasing foreign machinery and contracting experienced technicians offers the fastest route to industrial production. The arrangement carries risks, but it can give Morocco factories that would otherwise take many years to develop. Moroccan apprentices must learn every stage of operation so that the investment produces lasting knowledge rather than permanent dependence."
 MOR_local_industrial_investments: "Local Industrial Investments"
 MOR_local_industrial_investments_desc: "Support domestic industry rather than allowing foreign capital to dominate Morocco's development. Investment in Moroccan businesses will build productive capacity that remains under national influence. Local owners may advance more cautiously, but their profits and experience remain within the communities that bear the cost of modernization."
 MOR_local_industrial_investments_dec: "Local Industrial Investments."
 MOR_funds_back_to_treasury: "Send Funds Back to the Treasury"
 MOR_funds_back_to_treasury_desc: "Industrial investment has begun to produce returns, but the treasury still bears the cost of reform. Redirecting part of the new revenue to the state will stabilize its finances and prepare the next stage of modernization. A stronger reserve also reduces the danger that an unexpected war or harvest failure will force the government into foreign debt."
 MOR_administrative_overhaul: "Administrative Overhaul"
 MOR_administrative_overhaul_desc: "Reform cannot advance through offices weakened by bribery, poor records, and divided authority. The Makhzen must clarify responsibilities, improve oversight, and make provincial officials answerable to the Sultan. A more orderly administration will ensure that royal commands produce measurable results instead of disappearing into layers of private negotiation."
 MOR_investigate_corruption: "Investigate Corruption"
 MOR_investigate_corruption_desc: "Rumors of bribery and stolen revenue are widespread, but reform requires evidence rather than accusation. Royal investigators will inspect accounts, question officials, and identify the networks profiting from public office. A thorough inquiry will distinguish genuine abuse from political rivalry and give the Sultan firm grounds for dismissals or prosecution."
 MOR_draft_solutions: "Draft Solutions"
 MOR_draft_solutions_desc: "The investigation has exposed how corruption survives through weak records, personal patronage, and unchecked tax collection. The court will now prepare practical rules to close these openings and punish future abuses. Reform must change the incentives of office as well as remove individual offenders, or new officials will soon repeat the same practices."
 MOR_drummond_hays_plan: "Drummond-Hays Plan"
 MOR_drummond_hays_plan_desc: "British minister John Drummond Hay urges the Sultan to regularize taxation, restrain abusive officials, and open government to closer supervision. His advice may strengthen the state, though it also reflects Britain's growing influence over Moroccan affairs. The Makhzen must separate genuinely useful recommendations from proposals designed primarily to protect British merchants and diplomatic interests."
 MOR_judiciary_reform: "Judiciary Reform"
 MOR_judiciary_reform_desc: "Uneven procedures and local abuses weaken confidence in justice across the Sultanate. Clearer authority and stronger oversight will make the courts more dependable while reinforcing the Sultan's duty to protect his subjects. Reform will command respect only if it supports recognized law and prevents powerful officials from placing themselves beyond judgment."
 MOR_crack_down_kangaroo_courts: "Crackdown on Kangaroo Courts"
 MOR_crack_down_kangaroo_courts_desc: "Local tribunals that serve powerful families or issue arbitrary judgments undermine both justice and royal authority. The Makhzen will suppress these abuses and require disputes to pass through recognized courts. Subjects who have suffered from private vengeance or corrupt judgment must see that the new rules are enforced in practice."
 MOR_empower_qaids: "Empower Qaids"
 MOR_empower_qaids_desc: "Qaids act as the Sultan's provincial governors, collecting taxes, maintaining order, and transmitting royal commands. Granting reliable qaids greater authority will extend the reach of the Makhzen beyond the imperial cities. Their expanded power must be matched by oversight, since an unaccountable governor can become as dangerous as the local rivals he replaces."
 MOR_centralize_courts: "Centralize Courts"
 MOR_centralize_courts_desc: "A fragmented judicial system allows local influence to outweigh consistent law. Bringing the courts under firmer central supervision will make judgments more predictable and abuses easier to correct. Regular communication with the royal cities will also allow judges to receive guidance and submit difficult cases for review."
 MOR_effective_justice_system: "Effective Judicial System"
 MOR_effective_justice_system_desc: "Recognized courts, accountable judges, and dependable enforcement now form a more coherent system of justice. Subjects can seek redress with greater confidence, and the Sultan's authority rests on law as well as force. By reducing arbitrary rule, the new system strengthens public order and makes cooperation with the wider reform program more likely."
 MOR_enforce_borders_north: "Enforce Northern Border Demarcations"
 MOR_enforce_borders_north_desc: "Unclear boundaries around the Spanish enclaves invite raids, reprisals, and diplomatic crises. Marking and enforcing the northern frontier will restrain local violence while denying Madrid an easy pretext for intervention. Patrols and recognized crossing points will demonstrate that Morocco can maintain order along its own border without foreign occupation."
 MOR_expand_administration: "Expand Administration"
 MOR_expand_administration_desc: "Royal policy cannot reach distant provinces without officials capable of carrying it out. Expanding the administrative service will improve records, revenue collection, communication, and the enforcement of the Sultan's decrees. New offices will also create a class of trained servants whose careers depend upon the effectiveness of the central state."
 MOR_begin_general_centralization: "Begin General Centralization"
 MOR_begin_general_centralization_desc: "Foreign pressure and internal division expose the weakness of authority based on occasional expeditions and personal bargains. The Makhzen will begin replacing this patchwork with institutions that answer more directly to the Sultan. The process will be gradual, for moving too quickly could unite provincial leaders and tribal communities in resistance."
 MOR_decentralization: "Decentralization"
 MOR_decentralization_desc: "Morocco's tribes and towns possess traditions of local government that cannot be swept aside without resistance. Preserving their autonomy while negotiating loyalty to the Sultan offers a slower but less disruptive path to stability. The Makhzen will govern through agreements and respected intermediaries, accepting limited uniformity in exchange for cooperation and peace."
 MOR_respect_sheikhs_and_amghar: "Respect the Sheikhs and Amghars"
 MOR_respect_sheikhs_and_amghar_desc: "Sheikhs and amghars command loyalties that distant officials cannot easily replace. Recognizing their authority will secure cooperation, preserve local order, and tie influential communities to the throne through negotiation rather than coercion. Respect from the court gives these leaders a reason to defend the existing order against rebels and foreign agents alike."
 MOR_appoint_representative_tribes: "Appoint Tribe Representatives"
 MOR_appoint_representative_tribes_desc: "Chosen representatives will give tribal communities a recognized voice before the Makhzen. In return, the Sultan gains dependable intermediaries through whom taxes, disputes, and military obligations can be negotiated. Regular audiences will make distant communities part of the political system without requiring the immediate replacement of their own institutions."
 MOR_deal_with_problematic_tribes: "Deal with Problematic Tribes"
 MOR_deal_with_problematic_tribes_desc: "Some tribes use distance and difficult terrain to evade taxes, raid their neighbors, or reject royal commands. The government will combine negotiation, pressure, and selective force to restore a workable relationship with them. The goal is dependable peace and obedience, not a costly cycle of punitive expeditions that produces only temporary submission."
 MOR_volunteers_tribes: "Tribe Volunteers"
 MOR_volunteers_tribes_desc: "Tribal warriors remain an important source of manpower and local military knowledge. By calling for volunteers through respected leaders, the Sultan can reinforce the army without imposing an immediately unpopular system of conscription. Service under familiar chiefs also makes these men easier to mobilize, though integrating them with regular troops remains difficult."
 MOR_begin_qaidization: "Begin the Qaidization Process"
 MOR_begin_qaidization_desc: "The Makhzen will place appointed qaids over districts that have long managed their affairs beyond regular royal supervision. Each new governor extends taxation, justice, and administration, but also risks resistance from established local authorities. Success depends upon selecting men whose competence and restraint can make central government appear preferable to the disorder it replaces."
 MOR_train_qaids: "Train Qaids"
 MOR_train_qaids_desc: "Provincial authority requires more than loyalty to the throne. Future qaids will learn recordkeeping, revenue collection, legal procedure, and the duties expected of a representative of the Sultan. Shared training will create more consistent administration and make it easier for the court to judge whether each governor is fulfilling his responsibilities."
 MOR_replace_local_chiefs: "Replace Local Chiefs"
 MOR_replace_local_chiefs_desc: "Independent chiefs obstruct the creation of a uniform administration and may place local interests above royal policy. Replacing the most defiant leaders with appointed qaids will bring their districts under closer Makhzen control. The transition must be secured quickly, since a displaced notable can easily turn personal resentment into organized resistance."
 MOR_crush_rebellious_tribes: "Crush Rebellious Tribes"
 MOR_crush_rebellious_tribes_desc: "Negotiation has failed to bring the most defiant tribes into obedience. A royal expedition will break organized resistance and demonstrate that open rebellion against the Sultan carries a decisive cost. Victory must be followed by stable administration, or the same grievances will produce another uprising as soon as the army withdraws."
 MOR_introduce_justice_rural: "Introduce Rural Justice"
 MOR_introduce_justice_rural_desc: "Villages far from the imperial cities often depend on powerful local figures for judgment and protection. Extending recognized courts into the countryside will curb arbitrary rule and give rural subjects a direct link to the Sultan's justice. Fair rulings will do more to establish lasting loyalty than tax collectors or soldiers acting without legal restraint."
 MOR_tribal_manpower: "Tribal Manpower"
 MOR_tribal_manpower_desc: "The tribes can field large numbers of experienced horsemen and fighters when their leaders answer the Sultan's call. Organizing this obligation more carefully will make their strength available without relying on improvised levies. Clear terms of service, supply, and command will reduce disputes that otherwise weaken the army during a campaign."
 MOR_support_local_madrasas: "Support Local Madrasas"
 MOR_support_local_madrasas_desc: "Local madrasas preserve religious learning and provide many of the literate men needed by courts and government offices. Greater patronage will strengthen these institutions while gradually widening the subjects available to their students. Reform rooted in respected schools is less likely to appear as an alien project imposed by foreign advisers."
 MOR_profiting_off_lands: "Land Profits"
 MOR_profiting_off_lands_desc: "The kingdom's lands contain resources and productive potential that remain underused. Bringing more of this wealth into the formal economy can strengthen both commerce and state revenue. Surveys and clear agreements with local communities will help the Makhzen develop these assets without provoking unnecessary conflict over ownership."
 MOR_expropriate_forests: "Expropriate Florests"
 MOR_expropriate_forests_desc: "Timber is needed for construction, workshops, fuel, and shipbuilding, yet valuable forests remain controlled by local interests. Bringing selected woodland under state management will secure supplies while increasing royal revenue. Regulated cutting and guarded reserves are necessary if immediate demand is not to destroy the resource upon which future growth depends."
 MOR_integrate_markets: "Integrate Markets"
 MOR_integrate_markets_desc: "Regional tolls, poor roads, and inconsistent measures divide Morocco into separate commercial zones. Removing these barriers will allow goods and capital to move more freely between the interior, imperial cities, and ports. A merchant able to trade across the kingdom under familiar rules is more likely to invest in larger and more dependable enterprises."
 MOR_reform_agriculture: "Agricultural Reform"
 MOR_reform_agriculture_desc: "Modernize Moroccan agriculture to raise yields and make better use of the kingdom's fertile regions. More productive farms will support the population and provide additional goods for domestic industry and trade. Irrigation, better tools, and practical instruction must be introduced in ways that cultivators can afford and maintain through changing seasons."
 MOR_jaysh_al_sultan: "Jaysh al-Sultan"
 MOR_jaysh_al_sultan_desc: "The Sultan commands palace guards, tribal levies, traditional cavalry, and the developing Askar Nizami. These forces must be brought into a more coherent army if Morocco is to enforce royal authority and survive another European war. A common system of command, recruitment, and supply will allow their different strengths to serve a single national strategy."
 MOR_traditional_army: "Traditional Army"
 MOR_traditional_army_desc: "Morocco's military traditions provide mobile cavalry and warriors accustomed to local terrain, but they lack the drill and concentrated firepower of modern infantry. Reform must preserve their strengths while correcting the weaknesses exposed at Isly. Men will fight more effectively when unfamiliar discipline is presented as an improvement to respected service rather than a rejection of it."
 MOR_equipment_acquisition: "Equipment Acquisition"
 MOR_equipment_acquisition_desc: "The army cannot modernize while its soldiers carry a mixture of obsolete and incompatible weapons. Foreign purchases will provide rifles, artillery, uniforms, and supplies until Morocco can support larger production at home. Every contract must balance immediate military need against the diplomatic influence and financial obligations demanded by the seller."
 MOR_continue_british_import: "Continue British Imports"
 MOR_continue_british_import_desc: "British merchants already offer access to modern arms and equipment through Gibraltar and the Atlantic ports. Continuing this relationship gives the army a dependable supplier without tying every reform to France or Spain. The short sea route also simplifies delivery, replacement parts, and the instruction needed to keep imported equipment in service."
 MOR_new_infantry_weapons: "New Infantry Weapons"
 MOR_new_infantry_weapons_desc: "Modern infantry depends on accurate firearms, reliable ammunition, and troops trained to use both in disciplined formation. Acquiring improved weapons will give Moroccan battalions the firepower needed to face contemporary armies. Standard patterns will make ammunition supply and battlefield instruction far more dependable than the present collection of mismatched arms."
 MOR_import_british_cannons: "Import British Cannons"
 MOR_import_british_cannons_desc: "The defeat at Isly revealed the devastating advantage of well-served modern artillery. British guns and ammunition will strengthen Morocco's batteries while local crews learn the skills required to employ them effectively. The purchase must include instruction and technical support, since an advanced cannon is useless without trained gunners and a secure supply of shells."
 MOR_british_uniforms: "Acquisiton of British Uniforms"
 MOR_british_uniforms_desc: "Standard British-style uniforms will distinguish regular battalions from temporary levies and simplify the issue of clothing and equipment. A common appearance also reinforces discipline and the identity of a permanent royal army. Durable patterns adapted to Morocco's climate will matter more than ceremonial imitation of troops serving in northern Europe."
 MOR_deal_with_french: "Deals with France"
 MOR_deal_with_french_desc: "France is Morocco's most immediate military threat, but its arms industry also produces the weapons the army urgently needs. Carefully negotiated purchases may strengthen the Sultanate without granting Paris influence over its command. Buying from a rival is dangerous, yet understanding French equipment may also prepare Moroccan troops to face it in war."
 MOR_french_rifles: "Purchase French Rifles"
 MOR_french_rifles_desc: "French rifles embody many of the advances that gave European infantry its battlefield advantage. Purchasing them will improve the range and reliability of Moroccan units while new training turns imported weapons into effective combat power. Armorers must learn to maintain these arms locally so that a diplomatic dispute cannot render entire battalions ineffective."
 MOR_french_heavy_weaponry: "Import French Heavy Weaponry"
 MOR_french_heavy_weaponry_desc: "Field guns and other heavy weapons are too complex for Morocco to produce in sufficient numbers at present. Imports from France will equip new batteries and provide models that Moroccan armorers can study. Familiarity with their construction will support repairs immediately and may eventually provide the foundation for domestic production."
 MOR_french_uniforms: "Acquisition of French Uniforms"
 MOR_french_uniforms_desc: "French-style uniforms and equipment offer a tested standard for organizing regular infantry. Adopting them will make supply easier, strengthen unit identity, and visibly separate the new army from older irregular formations. Moroccan materials and climate must shape the final design if the uniform is to remain practical during long campaigns."
 MOR_lessons_of_isly: "Lessons of Isly"
 MOR_lessons_of_isly_desc: "At Isly in 1844, disciplined French infantry and artillery scattered a much larger Moroccan host. Studying that defeat makes the need for regular battalions, coordinated command, and modern firepower impossible to ignore. Honest examination of the battle will challenge proud officers, but concealing failure would condemn the army to repeat it."
 MOR_study_infantry_weapons: "Study Infantry Weapons"
 MOR_study_infantry_weapons_desc: "Imported firearms should become more than expensive tools that Morocco cannot repair or reproduce. Armorers and officers will examine their mechanisms, ammunition, and battlefield use to build a domestic body of military knowledge. Workshops that master replacement parts and common repairs will keep weapons useful long after the original foreign contract has ended."
 MOR_madrassa_al_muhandiseen: "Madrassa al-Muhandiseen"
 MOR_madrassa_al_muhandiseen_desc: "A school of military engineering in Fez will teach mathematics, surveying, fortification, mechanics, and artillery science. Its graduates will give the Sultanate officers capable of directing modern works without permanent foreign supervision. Their expertise will serve not only the army, but also the roads, workshops, and public projects upon which a stronger state depends."
 MOR_support_battalions: "Create Support Battalions"
 MOR_support_battalions_desc: "Infantry cannot fight effectively without engineers, artillery crews, medical personnel, and organized supply. Dedicated support battalions will give the regular army the specialists required for sustained campaigns. These formations will keep the fighting troops moving, equipped, and cared for when distance and difficult terrain begin to weaken an advance."
 MOR_expand_askar_nizami: "Expand Askar Nizami"
 MOR_expand_askar_nizami_desc: "The Askar Nizami forms the disciplined infantry core created after the disaster at Isly. Recruiting additional tabors will give the Sultan a permanent force trained in regular drill and less dependent on temporary tribal contingents. Reliable pay and supply must accompany expansion, or the new battalions will suffer the same desertion and disorder that weakened earlier experiments."
 MOR_incite_renegade_officers: "Incite Renegade Officers"
 MOR_incite_renegade_officers_desc: "Foreign soldiers who convert, defect, or enter Moroccan service possess knowledge that few local officers can yet obtain. Quietly encouraging capable men to join us will bring valuable expertise in artillery, engineering, and drill. Their recruitment must remain discreet, since European governments may treat the loss of trained personnel as a diplomatic provocation."
 MOR_promote_renegade_officers: "Promote Renegade Officers"
 MOR_promote_renegade_officers_desc: "Experienced foreign-born officers cannot reform the army if they remain curiosities at court. Granting the most capable among them real commands will spread their knowledge through the ranks, despite opposition from traditional commanders. Advancement based on ability will signal that service to Morocco matters more than birthplace, provided these officers prove their loyalty."
 MOR_modern_cavalry_corps: "Modern Cavalry Corps"
 MOR_modern_cavalry_corps_desc: "Moroccan horsemen possess mobility and knowledge of difficult terrain, but courage alone cannot defeat disciplined firepower. Regular organization, firearms training, and coordinated tactics will turn them into a modern cavalry arm. Used for reconnaissance, screening, and pursuit, they can exploit strengths that European armies may struggle to match in Moroccan country."
 MOR_sideline_abid_al_bukhari: "Sideline Abid al-Bukhari"
 MOR_sideline_abid_al_bukhari_desc: "The Abid al-Bukhari remain closely associated with palace service and the defense of the dynasty, but their old privileges complicate the creation of a uniform army. Reducing their independent role will place military authority more firmly in reformed institutions. Their loyalty and experience should be preserved where possible, even as hereditary obligations give way to regular service."
 MOR_retraining_settling_slave_troops: "Retraining Settling Slave Troops"
 MOR_retraining_settling_slave_troops_desc: "Men formerly bound to hereditary military service will be retrained for regular duty or settled into civilian life. This transition weakens an outdated institution while preserving useful experience within the new army. Land, pay, and recognized status will give these men a secure future and reduce the risk that reform turns loyal soldiers into embittered opponents."
 MOR_reconstitute_askar: "Reconstitute Askar"
 MOR_reconstitute_askar_desc: "Earlier attempts to build regular infantry suffered from desertion, uneven support, and hostility toward unfamiliar discipline. The Askar will be rebuilt with clearer organization, dependable pay, and modern equipment. Permanent cadres of trained officers and noncommissioned leaders will help new recruits become soldiers rather than another temporary levy."
 MOR_equipment_production: "National Arms Production"
 MOR_equipment_production_desc: "Dependence on foreign arsenals leaves Morocco vulnerable to embargoes, political pressure, and wartime shortages. Expanding domestic workshops into a national arms industry will provide ammunition, small arms, and repairs under Moroccan control. Production may begin modestly, but every weapon completed at home strengthens the technical base required for future independence."
 MOR_standardize_uniform: "Standardize Uniforms"
 MOR_standardize_uniform_desc: "A single system of uniforms and field equipment will replace the confusing variety used by different formations. Standardization simplifies supply, reinforces discipline, and gives every regular soldier a visible place in the Sultan's army. Practical clothing suited to local weather and available materials will ensure that appearance supports military effectiveness rather than competing with it."
 MOR_recruitment_system: "Improve the Recruitment System"
 MOR_recruitment_system_desc: "Irregular levies provide numbers but cannot guarantee trained replacements when war begins. A recorded and supervised recruitment system will distribute obligations more consistently and keep the regular battalions at strength. Clear terms of service and reliable pay will make enlistment less arbitrary and reduce desertion among men separated from their communities."
 MOR_dar_al_makhzen_military_school: "Dar al-Makhzen Military School"
 MOR_dar_al_makhzen_military_school_desc: "The Dar al-Makhzen will house a permanent school for officers loyal to the Sultan and educated in modern command. Its curriculum will combine drill, logistics, engineering, artillery, and the administrative duties of military leadership. Graduates will share professional standards that bind the army together more securely than family connection or provincial patronage."
 MOR_muslim_officers: "Muslim Officers"
 MOR_muslim_officers_desc: "Morocco can learn modern warfare without leaving its army dependent on European instructors. Officers from Algeria, Tunisia, Egypt, and the Ottoman world offer military experience together with a shared religious and cultural foundation. Their presence demonstrates that technical reform can strengthen an Islamic state without requiring political or cultural submission to Europe."
 MOR_modernize_military_doctrines: "Modernize Military Doctrines"
 MOR_modernize_military_doctrines_desc: "New weapons will achieve little if commanders continue to employ them according to older habits. Revised doctrine will coordinate infantry, cavalry, artillery, engineers, and supply around the demands of modern battle. Field exercises will turn written principles into common practice before the army is forced to learn them under enemy fire."
 MOR_officer_training_gibraltar: "Officer Training in Gibraltar"
 MOR_officer_training_gibraltar_desc: "Gibraltar gives selected Moroccan officers access to British artillery practice, fortifications, and military instruction close to home. They will return with practical knowledge that can be passed through the new schools and battalions. Careful selection will ensure that the mission produces capable instructors rather than a small circle of men impressed by foreign ceremony."
 MOR_new_calvary_tactics: "New Cavalry Tactics"
 MOR_new_calvary_tactics_desc: "Cavalry must no longer rely on massed charges against disciplined riflemen. Training for reconnaissance, screening, rapid movement, and attacks against exposed positions will preserve the value of Morocco's mounted forces. These roles use the horsemen's mobility while reducing needless losses against prepared infantry and artillery."
 MOR_modern_artillery_doctrine: "Adapt Modern Artillery Doctrines"
 MOR_modern_artillery_doctrine_desc: "Modern guns require trained crews, accurate observation, secure ammunition supply, and coordination with infantry. A dedicated artillery doctrine will turn isolated batteries into a decisive arm of the field army. Standard commands and repeated exercises will allow Moroccan gunners to concentrate fire where it can have the greatest effect."
 MOR_new_army: "The New Moroccan Army"
 MOR_new_army_desc: "The reforms begun after Isly now produce a permanent army of regular infantry, trained cavalry, artillery, engineers, and educated officers. Morocco finally possesses a force designed for the wars of the present rather than the campaigns of the past. Its existence strengthens the Sultan's authority at home and warns foreign powers that intervention will no longer meet scattered resistance."
 MOR_reform_ports: "Reform the Ports"
 MOR_reform_ports_desc: "Morocco's ports are the kingdom's gateways to foreign trade, diplomacy, and maritime defense. Better administration, docks, warehouses, and customs facilities will increase revenue while supporting the revival of naval power. Effective port authorities must manage this growth without allowing foreign consuls and protected merchants to escape Moroccan supervision."
 MOR_buy_convoys: "Purchase Modern Convoys"
 MOR_buy_convoys_desc: "A growing maritime economy requires merchant vessels capable of moving goods and supplies between Moroccan ports and foreign markets. Purchasing modern convoys will expand trade immediately while domestic shipbuilding develops. These ships can also support military transport and coastal supply during emergencies, giving them value beyond ordinary commerce."
 MOR_expand_port_infrastructure: "Expand Port Infrastructure"
 MOR_expand_port_infrastructure_desc: "Deeper anchorages, improved docks, repair facilities, and larger warehouses will allow Moroccan ports to handle more shipping. These works serve both commercial expansion and the future needs of the navy. Local labor and craftsmen will gain experience from construction that can later support shipbuilding and industrial projects elsewhere."
 MOR_expand_foreign_commerce: "Expand Foreign Commerce"
 MOR_expand_foreign_commerce_desc: "The commercial treaties opening Morocco to foreign trade cannot simply be reversed. By improving its ports and supporting its own merchants, the Sultanate can seize a larger share of that commerce rather than leaving every advantage to Europe. Greater trade must strengthen the treasury and domestic enterprise if it is to justify the political risks of an open economy."
 MOR_empower_merchants: "Empower Merchants"
 MOR_empower_merchants_desc: "Moroccan merchants need credit, legal protection, and a voice in commercial policy if they are to compete with protected foreign firms. Strengthening them will keep more profits within the kingdom and broaden support for economic reform. Their experience can also help the Makhzen identify regulations that obstruct honest trade without providing useful revenue or security."
 MOR_delay_naval_reform: "Delay Naval Reform"
 MOR_delay_naval_reform_desc: "Ships, dockyards, and trained crews demand money the strained treasury cannot presently spare. Postponing the naval program will release funds for urgent needs, though Morocco's coasts remain exposed in the meantime. The delay must remain temporary, since neglected skills and facilities become more expensive to restore with every passing year."
 MOR_additional_funds_treasury: "Additional Funds for the National Treasury"
 MOR_additional_funds_treasury_desc: "The pause in naval spending gives the Makhzen a rare opportunity to rebuild its reserves. Directing the savings into the treasury will reduce immediate pressure and make later reforms easier to finance. Sound reserves also give the Sultan greater freedom to answer a crisis without immediately seeking loans or extraordinary taxation."
 MOR_take_necessary_debts: "Take Necessary Loans"
 MOR_take_necessary_debts_desc: "Morocco cannot rebuild a fleet from current revenue alone. Loans will provide the necessary capital at once, but foreign creditors will gain another means of influencing the Sultanate if repayment falters. Borrowed money must therefore create useful ships and facilities quickly enough to justify the long burden placed upon the treasury."
 MOR_reestablish_navy: "Re-establish the Moroccan Navy"
 MOR_reestablish_navy_desc: "With improved ports, new vessels, and a stable source of funding, Morocco can once again maintain a permanent naval force. The reborn fleet will protect commerce and show that the kingdom intends to defend both its Atlantic and Mediterranean coasts. It cannot rival Europe's greatest navies, but it can patrol Moroccan waters, deter lesser threats, and support diplomacy with visible strength."

### BOP Decisions ###
 MOR_decision_placate_the_goverment: "Placate to the Government"
 MOR_decision_placate_the_goverment_desc: "Reassure wavering officials that their positions and legitimate interests remain secure under the present government. Their renewed loyalty will strengthen the Makhzen against organized unrest. Carefully distributed favors can steady the administration, though excessive concessions may reward the very obstruction that helped create the crisis."
 MOR_decision_reach_out_to_the_revolters: "Negotiate with the Revolters"
 MOR_decision_reach_out_to_the_revolters_desc: "Open talks with the movement's leaders and offer limited concessions in exchange for an end to agitation. A negotiated settlement may divide moderates from those determined to continue the revolt. If discussions succeed, the government can isolate the most uncompromising opponents without driving every dissatisfied group into their camp."
 MOR_decision_earn_the_support_of_the_sultan: "Earn the support of the Sultan"
 MOR_decision_earn_the_support_of_the_sultan_desc: "Demonstrate that the government remains the strongest defender of the dynasty and public order. The Sultan's open support will lend legitimacy to its actions and discourage uncertain officials from defecting. Royal endorsement also warns the opposition that resistance to the ministry may soon be treated as resistance to the throne itself."

 MOR_decision_placate_to_the_revolters: "Placate to the Revolters"
 MOR_decision_placate_to_the_revolters_desc: "Address selected grievances and promise restraint in order to calm the revolt's less committed supporters. Every concession carries a cost, but reducing popular anger may prevent a wider confrontation. Visible improvements must follow these promises quickly, or the effort will be dismissed as another attempt to delay meaningful action."
 MOR_decision_earn_the_support_of_the_people: "Earn the support of the People"
 MOR_decision_earn_the_support_of_the_people_desc: "Present the movement's demands as a defense of justice, faith, and local rights against an unresponsive administration. Greater public sympathy will give the opposition the confidence to challenge the government directly. Support in the markets, mosques, and countryside can turn an elite dispute into a national political crisis."
 MOR_decision_have_a_strike: "Go on a strike"
 MOR_decision_have_a_strike_desc: "Organize a coordinated stoppage to disrupt commerce and demonstrate the depth of opposition to the government. The strike will increase pressure on the Makhzen, but it may also provoke a forceful response. Its success depends upon merchants and workers accepting immediate hardship in the hope of securing wider political concessions."

