### DECISIONS ###

 MOR_decision_category_industry: "The Moroccan Industry"
 MOR_decision_category_industry_desc: "Direct state funds toward workshops, farms, roads, railways, ports, and other projects that can expand Morocco's productive capacity and strengthen the national economy."
 MOR_decision_invest_in_unused_lands: "Invest in Unused Lands"
 MOR_decision_invest_in_unused_lands_desc: "Open underused land to development and create room for new economic activity. Bringing neglected areas into production will give the kingdom more space to grow."
 MOR_decision_cultivate_cotton: "Cultivate Cotton"
 MOR_decision_cultivate_cotton_desc: "Expand cotton cultivation in suitable Moroccan lands. A larger domestic supply can support textile production and create another valuable export for Moroccan merchants."
 MOR_decision_european_cotton_plantations: "European Cotton Plantations"
 MOR_decision_european_cotton_plantations_desc: "Invest in larger cotton plantations using methods and expertise drawn from European agriculture. The aim is to increase output while tying the growing cotton trade to Morocco's wider economic development."
 MOR_decision_cotton_farms_in_marakesh: "Cotton Farms in Marrakesh"
 MOR_decision_cotton_farms_in_marakesh_desc: "Encourage the expansion of cotton farms around Marrakesh, where irrigation and established agriculture can support greater production. More cotton will feed both domestic industry and foreign trade."
 MOR_decision_develop_tangier: "Develop Tangier"
 MOR_decision_develop_tangier_desc: "Develop Tangier as Morocco's principal gateway to the Strait of Gibraltar and European markets. Better facilities will help merchants, encourage investment, and increase the city's commercial importance."
 MOR_decision_develop_building_slots: "Artisan Investments"
 MOR_decision_develop_building_slots_desc: "Prepare additional space for construction in the countryside so that new workshops and other enterprises can be established. Expanding the available building capacity is a small but necessary step toward industrial growth."
 MOR_decision_modern_textile_mill: "Build a Modern Textile Mill"
 MOR_decision_modern_textile_mill_desc: "Establish a modern textile mill and bring more mechanized production to Morocco. The new industry can turn domestic raw materials into finished goods while creating skilled employment."
 MOR_decision_acquire_european_factories: "Acquire European Factories"
 MOR_decision_acquire_european_factories_desc: "Acquire European industrial equipment and expertise to expand manufacturing in Morocco. Foreign technology can accelerate development, provided the benefits ultimately strengthen Moroccan industry."
 MOR_decision_acquire_local_european_factories: "Local Industry Investments"
 MOR_decision_acquire_local_european_factories_desc: "Bring a locally established European industrial enterprise into Morocco's growing manufacturing base. This provides immediate industrial capacity while increasing the country's experience with modern production."
 MOR_decision_berber_jewelry_market: "Berber Jewelry Market"
 MOR_decision_berber_jewelry_market_desc: "Encourage the growing market for Berber jewelry and other regional crafts. A stronger market for these goods can draw merchants into Morocco's commercial networks and increase the value of trans-Saharan trade."
 MOR_decision_acquire_land_factories: "Acquire Land Factories"
 MOR_decision_acquire_land_factories_desc: "Set aside additional land for industrial construction in the country's main commercial center. Making room for new factories will help Moroccan industry grow beyond its existing limits."
 MOR_decision_acquire_land_local_factories: "Acquire Land Local Factories"
 MOR_decision_acquire_land_local_factories_desc: "Prepare more land for locally based industrial investment. Giving Moroccan businesses room to expand will make it easier for domestic industry to compete with foreign enterprises."
 MOR_decision_category_military: "The Moroccan Army"
 MOR_decision_category_military_desc: "Use the kingdom's resources to equip the army, expand its manpower, improve military production, and rebuild the navy."
 MOR_decision_acquire_cannons: "Acquire British Cannons"
 MOR_decision_acquire_cannons_desc: "Purchase modern British artillery to strengthen the army's firepower. Imported guns can give Moroccan troops a more effective answer to the artillery used by European armies."
 MOR_decision_acquire_british_uniforms: "Acquire British Uniforms"
 MOR_decision_acquire_british_uniforms_desc: "Import British-style uniforms and equipment for the army. Standardized dress will improve discipline and give the regular forces a more professional appearance."
 MOR_decision_acquire_french_rifles: "Acquire French Rifles"
 MOR_decision_acquire_french_rifles_desc: "Purchase modern French rifles to improve the army's small-arms equipment. Foreign weapons provide a practical way to narrow the technological gap with European forces."
 MOR_decision_acquire_french_uniforms: "Acquire French Uniforms"
 MOR_decision_acquire_french_uniforms_desc: "Acquire French-style uniforms and equipment to modernize the appearance and organization of the regular army. Standardization will make the growing force easier to train and administer."
 MOR_decision_connect_major_cities_marrakesh: "Connect Major Cities (Marrakesh)"
 MOR_decision_connect_major_cities_marrakesh_desc: "Improve the infrastructure around Marrakesh and connect the city more closely to the kingdom's wider network. Better roads and facilities will make trade and movement faster and more reliable."
 MOR_decision_connect_major_cities_morocco: "Connect Major Cities (Morocco)"
 MOR_decision_connect_major_cities_morocco_desc: "Strengthen the links between Morocco's principal cities by improving roads and other infrastructure. A more connected kingdom will be easier to administer and more profitable to trade across."
 MOR_decision_rural_roads_er_rif: "Rural Roads (Er Rif)"
 MOR_decision_rural_roads_er_rif_desc: "Build better roads through the Rif so that people, goods, and government officials can move more easily through the region. Improved connections will also strengthen the central government's reach."
 MOR_decision_rural_roads_cape_juby: "Rural Roads (Cape Juby)"
 MOR_decision_rural_roads_cape_juby_desc: "Extend basic road infrastructure toward Cape Juby and the southern frontier. Better routes will improve access to remote settlements and make it easier to bring distant regions into the national economy."
 MOR_decision_tangier_fes_line: "Tangier-Fès line"
 MOR_decision_tangier_fes_line_desc: "Begin work on a railway linking Tangier with Fez. Connecting the international port with the political heartland would shorten travel times and open a new route for people, goods, and ideas."
 MOR_decision_casablanca_marrakech_line: "Casablanca-Marrakech line"
 MOR_decision_casablanca_marrakech_line_desc: "Build a railway between Casablanca and Marrakesh to connect the Atlantic coast with the interior. The line will strengthen trade between the coast and the agricultural regions around Marrakesh."
 MOR_decision_fes_rabat_line: "Fès-Rabat line"
 MOR_decision_fes_rabat_line_desc: "Link Fez and Rabat by rail, creating a faster connection between the inland capital and the Atlantic coast. Such a route would improve administration as well as commercial traffic."
 MOR_decision_marrakech_agadir_line: "Marrakech-Agadir line"
 MOR_decision_marrakech_agadir_line_desc: "Extend railway infrastructure south from Marrakesh toward Agadir. The route will open new possibilities for trade between the interior, the southern coast, and the wider Atlantic market."
 MOR_decision_rabat_tangier_line: "Rabat-Tangier line"
 MOR_decision_rabat_tangier_line_desc: "Connect Rabat and Tangier by rail along the northern Atlantic corridor. A direct link between these important ports and political centers would strengthen commerce and national cohesion."
 MOR_decision_crackdown_counterfeiting: "Crackdown Counterfeiting"
 MOR_decision_crackdown_counterfeiting_desc: "Crack down on counterfeit and unreliable currency to restore confidence in Moroccan money. A more dependable currency will make trade and state finances easier to manage."
 MOR_decision_combat_inflation: "Combat Inflation"
 MOR_decision_combat_inflation_desc: "Take direct measures to reduce inflation and restore purchasing power. Stabilizing prices is essential if the government is to rebuild confidence in the currency and the wider economy."
 MOR_decision_increase_deflation: "Increase Deflation Efforts"
 MOR_decision_increase_deflation_desc: "Continue the fight against rising prices with stronger deflationary measures. The goal is to bring the currency back under control and remove the monetary pressures weighing on the country."
 MOR_decision_tribal_manpower: "Tribal Manpower"
 MOR_decision_tribal_manpower_desc: "Call on Morocco's tribal communities to provide additional manpower for the army. Tribal levies remain an important source of military strength when the state needs to raise men quickly."
 MOR_decision_expropriate_forests: "Expropriate forests"
 MOR_decision_expropriate_forests_desc: "Bring additional forest resources under state control and make better use of Morocco's timber. Managed access to these resources will increase the supply of wood available to the growing economy."
 MOR_decision_expand_askar_nizami: "Expand Askar Nizami"
 MOR_decision_expand_askar_nizami_desc: "Recruit more soldiers into the Askar Nizami, the Sultan's regular forces. Expanding the regular army will give the Makhzen a more dependable military instrument than temporary levies alone."
 MOR_decision_equipment_production: "Expand Equipment Production"
 MOR_decision_equipment_production_desc: "Establish a stronger domestic base for military equipment production. Producing arms at home will reduce dependence on foreign suppliers and give the army a more reliable supply."
 MOR_decision_develop_building_slots_for_military_factory: "Developing the country for Arms Factories"
 MOR_decision_develop_building_slots_for_military_factory_desc: "Prepare additional space for an arms factory in the country's industrial center. Expanding military production requires room as well as money and machinery."
 MOR_decision_naval_investments: "Naval Investments"
 MOR_decision_naval_investments_desc: "Commit funds to the long-term rebuilding of the Moroccan navy. Naval reform requires patience, training, and sustained investment before the benefits become visible."
 MOR_decision_buy_convoys: "Buy Convoys"
 MOR_decision_buy_convoys_desc: "Acquire new convoys to support overseas trade, transport, and supply. A reliable merchant fleet will help Morocco take fuller advantage of its coastal position."
 MOR_decision_develop_the_ports: "Develop the Ports"
 MOR_decision_develop_the_ports_desc: "Expand Morocco's port facilities to support both commercial shipping and naval activity. Better ports will make it easier to handle trade and maintain a modern fleet."
 MOR_decision_develop_ship_building: "Develop the Port Areas"
 MOR_decision_develop_ship_building_desc: "Prepare additional industrial capacity for shipbuilding. Expanding the facilities available to shipwrights is an important step toward rebuilding Morocco's naval industry."
 MOR_decision_develop_the_ports_2: "Develop the Ports"
 MOR_decision_develop_the_ports_2_desc: "Further expand the main naval facilities so that larger operations and a growing fleet can be supported. Continued investment will strengthen Morocco's position on the Atlantic and Mediterranean."
 MOR_decision_develop_ship_building_2: "Develop the Port Areas"
 MOR_decision_develop_ship_building_2_desc: "Continue expanding the facilities and industrial capacity needed for domestic shipbuilding. A stronger maritime industry will make future naval expansion less dependent on foreign yards."

