### Events ###
 morocco.3.t: "UBL Railway Offer"
 morocco.3.d: "A foreign-backed company has approached the Makhzen with an ambitious railway proposal. The promised lines would improve travel and commerce, but accepting foreign ownership would also give European interests a deeper foothold in the Moroccan economy."
 morocco.3.a: "Reject this Offer"
 morocco.3.b: "Begin constructing the railway lines"

 morocco.4.t: "Fabric market in Marrakesh"
 morocco.4.d: "Merchants in Marrakesh report a growing market for local fabrics and finished goods. With trade expanding, the Makhzen has an opportunity to encourage production and turn the city's craftsmen into a larger source of national wealth."
 morocco.4.a: "This will make us rich"

 morocco.5.t: "Time to Redo the Administration"
 morocco.5.d: "Years of complaints about bribery, tax abuses, and inefficient administration have finally forced reform onto the agenda. The Sultan’s advisers argue that the government cannot modernize while offices remain a source of private enrichment."
 morocco.5.a: "We shall destroy coruption"

 morocco.6.t: "The arrival of the Drummond-Hays plan"
 morocco.6.d: "Sir John Drummond Hay has presented ideas for reorganizing Morocco’s administration and improving the collection of taxes. His proposals emphasize accountable officials, regular oversight, and an end to practices that drain revenue from the treasury."
 morocco.6.a: "We shall destroy coruption"

 morocco.7.t: "Judicial Reform"
 morocco.7.d: "The state's courts are in need of reform. Inconsistent judgments and abuses of authority undermine confidence in government, while a more orderly judicial system could strengthen both the Sultan's legitimacy and the security of his subjects."
 morocco.7.a: "Enact Judicial Reforms"

 morocco.8.t: "Begin General Centralization"
 morocco.8.d: "Central authority remains uneven across the Sultanate. The government must decide whether to strengthen its control through appointed qaids or preserve a greater role for local leaders and their traditional institutions."
 morocco.8.a: "Begin Qaidization"
 morocco.8.b: "Decentralization"

 morocco.9.t: "Respecting the authority of local leaders"
 morocco.9.d: "Local sheikhs and amghars still hold considerable influence over their communities. Working with them can preserve order and reduce resistance, but it also means accepting that the Makhzen cannot exercise complete authority everywhere."
 morocco.9.a: "We shall cooperrate with them"

 morocco.10.t: "We will start training our own local leaders"
 morocco.10.d: "The government plans to train a new generation of qaids who can administer provinces in the Sultan's name. Better educated local officials could bring greater stability and prosperity, but they will also extend the reach of the central government into communities accustomed to local rule."
 morocco.10.a: "This will bring prosperity to our country"

 morocco.11.t: "Delay the Naval Reforms"
 morocco.11.d: "The treasury is under pressure, and the planned naval reforms require money that could be used elsewhere. The government must decide whether to postpone the program until its finances are stronger or press ahead despite the cost."
 morocco.11.a: "We need this money elsewhere"

 morocco.12.t: "Navy another day"
 morocco.12.d: "Time has passed since the naval reforms were postponed, and the treasury is in a better position to act. The question is whether the government can finally return to the work of rebuilding a navy capable of defending Morocco’s long coastline."
 morocco.12.a: "We have the money now"

 morocco.13.t: "A New Navy..."
 morocco.13.d: "After years of neglect, plans for a new Moroccan navy are finally becoming reality. New ships, equipment, and training can give the Sultanate a maritime force worthy of its position between the Atlantic and Mediterranean."
 morocco.13.a: "We shall rule the wawes of Africa"

 morocco.14.t: "Mellah of Teutan Sacked"
 morocco.14.d: "As Spanish forces enter Tétouan during the war of 1859–1860, the city descends into disorder. The Mellah, home to much of the city's Jewish community, is looted and many families flee for safety. The violence leaves a lasting mark on the community and on Morocco's relations with Europe."
 morocco.14.a: "Okay"

 morocco.15.t: "Moses Montefiore and the Morocco Relief committee collect over 14,000 pounds for Jews in Morocco."
 morocco.15.d: "The war in northern Morocco sends Jewish refugees toward Gibraltar and other safe ports. Sir Moses Montefiore and the Morocco Relief Committee organize a major relief effort, raising more than £14,000 for Jewish communities affected by the conflict."
 morocco.15.a: "Okay"

 morocco.16.t: "Moses Montefiore hears about the boy executed in Saffi, and the man executed in Tangier"
 morocco.16.d: "Reports reach Sir Moses Montefiore of the execution of Jewish prisoners in Saffi and Tangier. The cases cause alarm among Jewish communities abroad and prompt the British diplomatic mission to consider how it can intervene on behalf of those still at risk."
 morocco.16.a: "Okay"

 morocco.17.t: "Spanish authorities in Saffi torture and execute a Jewish boy suspected of Murder and another Jewish man"
 morocco.17.d: "News from Saffi describes the torture and execution of Jewish prisoners after accusations surrounding the death of a Spaniard. The affair causes outrage among Moroccan Jews and draws the attention of European governments and Jewish organizations."
 morocco.17.a: "Okay"

 morocco.18.t: "Moses Montefiore gets a letter of distress from Jews in Gibraltar"
 morocco.18.d: "Jewish leaders in Gibraltar send Sir Moses Montefiore an urgent appeal describing the danger facing Jews in Morocco. Their request adds to growing pressure for a direct intervention with the Moroccan authorities."
 morocco.18.a: "Okay"

 morocco.19.t: "Sir Moses Montefiore leaves for Morocco"
 morocco.19.d: "The appeals have convinced Sir Moses Montefiore to undertake a mission to Morocco. At an advanced age, the prominent British philanthropist prepares to travel through Spain and Gibraltar before seeking an audience with the Sultan himself."
 morocco.19.a: "Okay"

 morocco.20.t: "Sir Moses arrives in Madrid"
 morocco.20.d: "Sir Moses Montefiore has arrived in Madrid on his journey to Morocco. Before continuing to Tangier, he seeks the support of the Spanish government for his efforts to secure the release and protection of Moroccan Jews."
 morocco.20.a: "Okay"

 morocco.21.t: "Sir Moses received by the Queen of Spain"
 morocco.21.d: "Montefiore is received by Queen Isabella II and presents the case of Morocco’s persecuted Jewish subjects. Spanish support could strengthen his mission, but Madrid also has its own interests in the region and may see an opportunity to increase its influence over Morocco."
 morocco.21.a: "Support him"
 morocco.21.b: "Dismiss him"

 morocco.22.t: "Sir Moses arrives in Tangier and meets with the Hay Mission"
 morocco.22.d: "Montefiore has reached Tangier and met with the British mission led by John Drummond Hay. Two Jewish prisoners have been released by the Spanish minister at Tangier, giving the mission an early success while the wider question of Jewish protection remains unresolved."
 morocco.22.a: "Okay"

 morocco.23.t: "Sir Moses received by the Sultan"
 morocco.23.d: "Sir Moses Montefiore has reached the Sultan’s court and is received by Muhammad IV. He now has the opportunity to present his demands directly to the ruler, who must balance foreign diplomatic pressure against the wishes of his own officials and subjects."
 morocco.23.a: "Okay"

 morocco.24.t: "The Sultan pledges to support the Jews of Morocco"
 morocco.24.a: "Okay"

 morocco.25.t: "Sultan decides whether or not to issue the decree"
 morocco.25.d: "The Sultan must decide whether to transform his pledge into a formal decree protecting Morocco's Jewish subjects. Such an order could improve relations with Britain and strengthen the security of Jewish communities, but conservative opponents warn that foreign-inspired reforms could provoke unrest."
 morocco.25.a: "Support this idea"
 morocco.25.b: "This would just lead to unrest"

 morocco.26.t: "The Sultan supports the Jews"
 morocco.26.d: "The Sultan has chosen to issue a decree affirming protection and justice for Morocco's Jewish subjects. The decision wins praise abroad and marks an important statement of the Makhzen's willingness to defend its subjects, even as conservative voices remain uneasy."
 morocco.26.a: "Okay"

 morocco.27.t: "The Sultan declines support for the Jews"
 morocco.27.d: "The Sultan has decided against issuing the proposed decree. The choice avoids an immediate confrontation with conservative elements at court, but it disappoints Montefiore and risks damaging Morocco's relations with Britain and other European powers."
 morocco.27.a: "Okay"

 morocco.28.t: "Hotel Cecil built in Tangier"
 morocco.28.d: "A new hotel has been established in Tangier as the city's European population and international traffic continue to grow. Such establishments make the port increasingly attractive to diplomats, merchants, and travelers crossing the Strait of Gibraltar."
 morocco.28.a: "Okay"

 morocco.29.t: "Hotel Continental built in Tangier"
 morocco.29.d: "The Hotel Continental joins Tangier's growing collection of European-style establishments. The city's position at the entrance to the Strait makes it a natural meeting place for merchants, diplomats, and travelers from across the Mediterranean."
 morocco.29.a: "Okay"

 morocco.30.t: "El Eco de Teutan"
 morocco.30.d: "A Spanish-language newspaper, El Eco de Tetuán, has appeared in the city during the Spanish occupation. Its arrival marks the beginning of regular newspaper printing in Morocco and provides a new channel through which the country’s affairs can be reported to a wider audience."
 morocco.30.a: "Okay"

 morocco.31.t: "Ulema Revolt"
 morocco.31.d: "Tension between the Makhzen and the ulema has reached a dangerous point. Religious scholars and their supporters fear that rapid administrative and economic reforms will weaken Morocco's traditions, while the government sees reform as necessary to preserve the state in an increasingly competitive world."
 morocco.31.a: "What are we going to do about it?"


morocco.1.t: "The Death of Sultan Abd al-Rahman"
morocco.1.d: "After a reign of nearly four decades, Sultan Abd al-Rahman has died. His passing leaves the Alaouite throne to his son Muhammad, who now inherits a kingdom facing foreign pressure, financial difficulties, and the difficult task of preserving the authority of the Makhzen."
morocco.1.a: "Long live Sultan Muhammad IV"

morocco.24.d: "Sultan Muhammad IV gives a public pledge that Morocco's Jewish subjects should receive protection and justice. The promise comes after months of diplomatic pressure and follows Sir Moses Montefiore's mission to the kingdom. The Sultan must now decide whether to turn his pledge into a formal decree, despite the resistance such a measure may provoke among conservative officials and scholars."
 ###Opinion Modifiers
 eoanb_om_MOR_TUN_trade_treaty: "The Anglo-Moroccan Treaty of 1856"

 ### Characters ###
 MOR_character_abd_al_rahman_ibn_hisham: "Abd al-Rahman ibn Hisham"
 MOR_character_abd_al_rahman_ibn_hisham_desc: "Sultan Abd al-Rahman has ruled Morocco since 1822, preserving Alaouite authority through tribal revolts, European pressure, and the French conquest of neighboring Algeria. His support for Abd al-Qadir brings war with France and defeat at Isly in 1844, leaving the aging Sultan determined to protect Moroccan independence while remaining cautious of reforms that might unsettle the kingdom."
 MOR_character_muhammad_ibn_abderrahamane_alawite: "Muhammad ibn Abd al-Rahman al-Alawi"
 MOR_character_muhammad_ibn_abderrahamane_alawite_desc: "Mawlay Muhammad, the Sultan's eldest son and heir, commands the Moroccan army and bears the lessons of its defeat at Isly. Since 1845 he has promoted regular infantry, European-style drill, modern artillery, and technical education, believing that a stronger state and army are essential to resisting foreign encroachment."
 MOR_character_abba_al_alawi: "Abbas ibn Abd al-Rahman al-Alawi"
 MOR_character_abba_al_alawi_desc: "Mawlay Abbas is a son of Sultan Abd al-Rahman and one of the dynasty's senior military commanders. His royal standing gives him authority over tribal contingents and regular troops alike, making him an important link between the palace and the forces expected to defend northern Morocco."
 MOR_character_ahmed_al_alawi: "Ahmed al-Alawi"
 MOR_character_ahmed_al_alawi_desc: "Ahmed al-Alawi is an Alaouite prince serving among the Sultan's field commanders. His ties to the ruling house secure the loyalty of his men, while service in the provinces gives him experience managing the difficult relationship between royal authority and tribal military power."
 MOR_character_hassan_al_alawi: "Hassan al-Alawi"
 MOR_character_hassan_al_alawi_desc: "Hassan al-Alawi is a young commander of the Alaouite house whose aggressive instincts suit Morocco's mobile style of warfare. He represents a generation of royal officers who must learn to combine traditional cavalry and tribal levies with the discipline demanded by a modern army."
 MOR_muhammad_bin_abdullah_al_saffar: "Muhammad ibn Abd Allah al-Saffar"
 MOR_muhammad_bin_abdullah_al_saffar_desc: "Muhammad al-Saffar is a jurist, royal scribe, and diplomat educated at al-Qarawiyyin. As secretary to the Moroccan embassy sent to France after the defeat at Isly, he carefully records French society, government, industry, and military organization, giving the Makhzen one of its most thoughtful accounts of European power."
 MOR_tayeb_bouachrine: "Tayeb ibn al-Yamani Bouachrine"
 MOR_tayeb_bouachrine_desc: "Tayeb Bouachrine is a court scholar and tutor entrusted with the education of members of the Alaouite household. His influence comes through the classroom and palace, where his command of religion, letters, and statecraft helps prepare princes for the responsibilities of rule."
 MOR_muhhamad_al_salawi: "Muhammad al-Salawi"
 MOR_muhhamad_al_salawi_desc: "Muhammad al-Salawi is a religious scholar whose knowledge of Maliki law and the traditions of Moroccan learning gives him considerable standing at court. He counsels the Makhzen on how reform can be pursued without severing government from the legal and religious foundations of the Sultanate."
 MOR_abd_al_rahman_al_ali: "Abd al-Rahman al-Ali"
 MOR_abd_al_rahman_al_ali_desc: "Born Joseph de Saulty, Abd al-Rahman al-Ali is a former French artillery officer who enters Moroccan service after leaving Algeria and embracing Islam. His expertise in gunnery, engineering, and European military science makes him a valuable instructor in the schools and arsenals created by Mawlay Muhammad."
 MOR_muhammad_bargash: "Muhammad Bargash"
 MOR_muhammad_bargash_desc: "Muhammad Bargash serves the Makhzen in its increasingly complex dealings with foreign consuls and merchants. Familiar with European diplomatic practice, he works to defend the Sultan's authority while balancing rival powers whose commercial privileges steadily expand inside Morocco."
 MOR_muhammad_zebdi: "Muhammad Zebdi"
 MOR_muhammad_zebdi_desc: "Muhammad Zebdi is an experienced administrator and diplomat who serves Sultan Abd al-Rahman in both provincial and foreign affairs. His knowledge of European courts and Moroccan government makes him a useful envoy as the Sultanate searches for support without surrendering its freedom of action."
 MOR_ahmed_ibn_khalid_an_nasiri: "Ahmad ibn Khalid al-Nasiri"
 MOR_ahmed_ibn_khalid_an_nasiri_desc: "Ahmad ibn Khalid al-Nasiri is a young scholar from Sale and a member of the learned Nasiri family. His study of Morocco's past and the wider Islamic West develops into a powerful defense of historical scholarship at a time when foreign pressure forces Moroccans to reconsider the sources of state strength."
 MOR_advisor_muhammad_bin_abdullah_al_saffar: "Muhammad ibn Abd Allah al-Saffar"
 MOR_advisor_muhammad_bin_abdullah_al_saffar_desc: "A jurist, royal scribe, and diplomat whose account of France gives the Makhzen valuable insight into European institutions and technology."
 MOR_advisor_tayeb_bouachrine: "Tayeb ibn al-Yamani Bouachrine"
 MOR_advisor_tayeb_bouachrine_desc: "A respected court tutor whose learning and access to the royal household give him influence over the education of the Alaouite princes."
 MOR_advisor_muhhamad_al_salawi: "Muhammad al-Salawi"
 MOR_advisor_muhhamad_al_salawi_desc: "A religious scholar who uses Maliki law and Morocco's intellectual traditions to guide reform within an accepted Islamic framework."
 MOR_advisor_abd_al_rahman_al_ali: "Abd al-Rahman al-Ali"
 MOR_advisor_abd_al_rahman_al_ali_desc: "A former French artillery officer whose knowledge of gunnery, engineering, and military schools supports the modernization of Morocco's army."
 MOR_advisor_muhammad_bargash: "Muhammad Bargash"
 MOR_advisor_muhammad_bargash_desc: "An experienced diplomat who manages relations with foreign representatives and defends the Sultanate against the excesses of consular privilege."
 MOR_advisor_muhammad_zebdi: "Muhammad Zebdi"
 MOR_advisor_muhammad_zebdi_desc: "A provincial administrator and envoy whose familiarity with European courts helps Morocco navigate an increasingly dangerous diplomatic environment."
 MOR_advisor_ahmed_ibn_khalid_an_nasiri: "Ahmad ibn Khalid al-Nasiri"
 MOR_advisor_ahmed_ibn_khalid_an_nasiri_desc: "A historian and scholar whose study of Morocco and the Islamic West strengthens the court's understanding of statecraft, society, and reform."

 ###Traits
 MOR_trait_muhammad_bin_abdullah_al_saffar: "Moroccan jurist, clerk, and diplomat"
 MOR_trait_muhammad_bin_abdullah_al_saffar_desc: "Al-Saffar combines a jurist's education with firsthand knowledge of France, helping the government understand foreign institutions and new fields of study."
 MOR_trait_ahmed_ibn_khalid_an_nasiri: "Historian and Scholar"
 MOR_trait_ahmed_ibn_khalid_an_nasiri_desc: "Al-Nasiri's command of history and Islamic scholarship strengthens research into Moroccan society, statecraft, and the lessons of earlier dynasties."
 MOR_trait_muhammad_zebdi: "Moroccan Diplomat"
 MOR_trait_muhammad_zebdi_desc: "Zebdi's administrative experience and familiarity with European courts make him a capable representative of Moroccan interests abroad."
 MOR_trait_tayeb_bouachrine: "The Teacher of the Moroccan Sultans"
 MOR_trait_tayeb_bouachrine_desc: "Bouachrine's position as a court tutor gives him quiet influence over the education and outlook of the Alaouite princes."
 MOR_trait_muhhamad_al_salawi: "Religious Scholar"
 MOR_trait_muhhamad_al_salawi_desc: "Al-Salawi draws on Maliki law and Morocco's scholarly traditions to guide reform within an accepted religious framework."
 MOR_trait_abd_al_rahman_al_ali: "Commander and Advisor"
 MOR_trait_abd_al_rahman_al_ali_desc: "Al-Ali brings practical knowledge of artillery, engineering, and European military organization into Moroccan service."
 MOR_trait_muhammad_bargash: "Minister of Foreign Relations"
 MOR_trait_muhammad_bargash_desc: "Bargash manages relations with the foreign representatives in Tangier and works to limit the political cost of their expanding privileges."