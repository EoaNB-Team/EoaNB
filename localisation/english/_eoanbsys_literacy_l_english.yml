 eoanb_decision_literacy_campaign: "Launch a Literacy Campaign"
 eoanb_decision_literacy_campaign_desc: "Evening classes, primers by the cartload and a teacher in every parish hall that will have one. A campaign cannot do the work of a school system, but it reaches the adults the schools never will."
 eoanb_decision_literacy_teacher_seminaries: "Found Teacher Seminaries"
 eoanb_decision_literacy_teacher_seminaries_desc: "A school is only as good as whoever stands at the front of it, and at present that is anyone who will take the wage. Seminaries to train schoolmasters properly will tell in every classroom for a generation."
 eoanb_decision_literacy_regimental_schools: "Open Regimental Schools"
 eoanb_decision_literacy_regimental_schools_desc: "Every year the barracks take in thousands of young men who cannot read their own orders. Teach them their letters between drills and the army sends them home as something the village has never had."

