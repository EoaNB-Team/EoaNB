l_english:
 literacy_level: "Literacy"

 eoanb_literacy_mass_illiteracy: "Mass Illiteracy"
 eoanb_literacy_mass_illiteracy_desc: "Fewer than one in five can read. Letters belong to priests, clerks and merchants; the law reaches the village by word of mouth, and a decree is whatever the man reading it aloud says it is.[ROOT.EOANB_GetLiteracyStatusBlock]"
 eoanb_literacy_broad_illiteracy: "Broad Illiteracy"
 eoanb_literacy_broad_illiteracy_desc: "A clear majority cannot read or write. There are schools, and a reading public in the towns, but the countryside signs its contracts with a cross and the workshops go short of men who can follow a written instruction.[ROOT.EOANB_GetLiteracyStatusBlock]"
 eoanb_literacy_modest_illiteracy: "Modest Illiteracy"
 eoanb_literacy_modest_illiteracy_desc: "About half the population can read. The schoolhouse is a familiar sight and the newspaper has found its public, though a great many children still leave for the fields or the mill before they have their letters.[ROOT.EOANB_GetLiteracyStatusBlock]"
 eoanb_literacy_limited_illiteracy: "Limited Illiteracy"
 eoanb_literacy_limited_illiteracy_desc: "Most people can read, and those who cannot are mainly the old and the remote. Recruits can be handed a manual and voters a pamphlet, and employers no longer think a literate hand worth remarking on.[ROOT.EOANB_GetLiteracyStatusBlock]"
 eoanb_literacy_negligible_illiteracy: "Negligible Illiteracy"
 eoanb_literacy_negligible_illiteracy_desc: "Nine in ten or more can read and write, and the few who cannot are a matter for the census rather than the cabinet. An educated public is the nation's to draw on, and it reads whatever it likes.[ROOT.EOANB_GetLiteracyStatusBlock]"
 eoanb_literacy_national_spirit: "Illiteracy"
 eoanb_literacy_national_spirit_desc: "Illiteracy in [ROOT.GetNameDef] is already described by a national spirit of its own, so nothing further applies here. The literacy rate below goes on changing with the nation's laws, and the usual tier takes over once that spirit is gone.[ROOT.EOANB_GetLiteracyStatusBlock]"
 eoanb_literacy_unassessed: "Literacy Not Yet Assessed"
 eoanb_literacy_unassessed_desc: "Nobody has counted yet. The figures will be in within the month."

