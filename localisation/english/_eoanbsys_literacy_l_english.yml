 EOANB_LITERACY_TOPBAR_TT_DELAYED: "The share of the population that can read and write. It grows each month at the pace set by the §YEducation System§! law and the other laws listed, and its level decides the §YLiteracy§! entry under Government Issues:\n\nUnder 20%: §YMass Illiteracy§!\n20% to 45%: §YBroad Illiteracy§!\n45% to 70%: §YModest Illiteracy§!\n70% to 90%: §YLimited Illiteracy§!\n90% and above: §YNegligible Illiteracy§!"

