### Decision Categories ###
USA_decision_category_billy_bowlegs_war: "Billy Bowlegs' War"
USA_decision_category_billy_bowlegs_war_desc: "Mr. President, the Seminole situation in Florida remains a serious and active concern. Small but determined bands under Billy Bowlegs continue to raid frontier settlements, burning crops and threatening families attempting to establish farms in southern Florida. These warriors have withdrawn deep into the Big Cypress Swamp and the Everglades, where the difficult terrain makes them extremely hard to reach. Colonel Gustavus Loomis, commanding the Department of Florida, reports that his regular troops are stretched thin and has requested additional Florida volunteers and militia. Mobile boat patrols using metallic flat-bottomed boats are being prepared to push into the sawgrass and tree islands, along with operations to locate and destroy hidden Seminole fields and camps in order to cut off their supplies. The swamps heavily favor the Seminoles, and the situation continues to be slow, expensive, and hazardous, with both sides engaged in an ongoing contest for control of the region."

### Decisions ###
USA_decision_request_regular_reinforcements_from_other_departments: "Request Regular Reinforcements from Other Departments"
USA_decision_request_regular_reinforcements_from_other_departments_desc: "The stubborn resistance of the Seminoles in Florida continues to strain our local forces beyond their capacity. To bring this conflict to a successful conclusion, we must call upon regular army units currently stationed in other departments of the Union and redirect them southward. These seasoned troops will significantly strengthen our efforts, though their transfer will leave other regions temporarily more vulnerable."
USA_decision_authorize_new_boat_companies: "Authorize New Boat Companies"
USA_decision_authorize_new_boat_companies_desc: "The shallow rivers, lakes, and marshlands of Florida have shown the great value of small, mobile companies equipped with flat-bottomed alligator boats. These units have proven capable of reaching areas inaccessible to regular troops. It is therefore prudent to authorize the raising of another company of Florida volunteers, properly armed and equipped with these vessels, so that we may more effectively patrol the inland waters and pursue the Seminoles into their hidden refuges."
USA_decision_strengthen_fort_brooke: "Strengthen Fort Brooke"
USA_decision_strengthen_fort_brooke_desc: "Fort Brooke, located near Tampa Bay, serves as one of the principal military posts in Florida. Its current fortifications are insufficient to withstand determined attack or serve as a secure base for operations. It is necessary to allocate resources and labor to repair and strengthen its defenses, improve its garrison quarters, and ensure it can better support our troops in central and southern Florida."
USA_decision_rebuild_fort_myers: "Rebuild Fort Myers"
USA_decision_rebuild_fort_myers_desc: "Fort Myers, situated along the Caloosahatchee River, has suffered repeated damage and neglect during the course of the conflict. Rebuilding and strengthening this important position will provide a vital anchor for operations in southwest Florida, help secure river supply lines, and offer greater protection to nearby settlements."
USA_decision_conduct_aggressive_swamp_patrols: "Conduct Aggresive Swamp Patrols"
USA_decision_conduct_aggressive_swamp_patrols_desc: "Our present operations in Florida have been too cautious and reactive, allowing the Seminoles to move freely through the swamps and launch sudden attacks at their convenience. It is necessary to adopt a more vigorous approach. Patrols must be pushed deeper into the Big Cypress and the Everglades to strike at hidden camps, destroy food stores, and deny the enemy the sanctuary he has long enjoyed. Though this will place greater strain upon our troops, it offers the best prospect of breaking the remaining resistance."
USA_decision_call_for_florida_volunteers: "Call for Florida Volunteers"
USA_decision_call_for_florida_volunteers_desc: "The regular forces stationed in Florida are spread too thinly across the vast and difficult terrain to provide adequate protection to our settlements. It is both prudent and necessary to call upon the loyal citizens of Florida to form additional volunteer companies. These men, though less experienced than regular troops, know the local country well and are strongly motivated to defend their homes and families against the remaining Seminole bands."
USA_decision_garrison_fort_denaud: "Garrison Fort Denaud"
USA_decision_garrison_fort_denaud_desc: "Fort Denaud, situated along the Caloosahatchee River, occupies a vital position for controlling movement through southwestern Florida. Its current garrison is inadequate and the works require strengthening. It is proposed to allocate eighty thousand dollars for the improvement of its defenses and to furnish it with a stronger complement of troops so that it may better serve as a base for operations against the Seminoles in that district."
USA_decision_establish_fort_kissimmee_outpost: "Establish Fort Kissimmee Outpost"
USA_decision_establish_fort_kissimmee_outpost_desc: "Fort Kissimmee, located near the headwaters of the Kissimmee River, is of strategic importance for controlling access to the upper Everglades and supporting boat operations. At present the position is little more than a temporary camp. It is proposed to allocate one hundred and twenty thousand dollars for the construction of a proper outpost with barracks, storehouses, and defensive works."
USA_decision_reinforce_fort_capron: "Reinforce Fort Capron"
USA_decision_reinforce_fort_capron_desc: "Fort Capron stands as an important link in the chain of posts guarding the eastern approaches to the Seminole strongholds. Its defenses have deteriorated and its garrison is too small for the responsibilities placed upon it. It is proposed to allocate ninety thousand dollars for the repair and strengthening of its fortifications and to increase its complement of troops."
USA_decision_request_emergency_arms_shipments: "Request Emergency Arms Shipments"
USA_decision_request_emergency_arms_shipments_desc: "The troops engaged in the Florida campaign are expending arms, ammunition, and other military stores at a rate far greater than originally anticipated. Shortages of rifles, powder, and essential equipment have begun to appear, impairing the effectiveness of our operations against the Seminoles. It is necessary to request emergency shipments from northern arsenals and manufacturers so that our forces may continue to prosecute the campaign without interruption."
USA_decision_launch_major_offensive_sweep: "Launch Major Offensive Sweep"
USA_decision_launch_major_offensive_sweep_desc: "The time has come for a decisive and final effort to bring the Florida conflict to an end. Colonel Loomis has proposed concentrating all available forces for a major offensive sweep through the Big Cypress and the Everglades. This campaign will involve deep patrols, the systematic destruction of hidden Seminole settlements and food stores, and the relentless pursuit of the remaining hostile bands. Though this operation will place severe strain upon our troops and resources, it offers the best prospect of crushing the last vestiges of organized resistance and securing the territory for peaceful settlement."

