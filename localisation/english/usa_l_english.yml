### Ideas ###
USA_third_seminole_war: "The Third Seminole War"
USA_third_seminole_war_desc: "The Third Seminole War drags on in the swamps of southern Florida, where Seminole warriors under Billy Bowlegs evade our forces with masterful guerrilla tactics. American troops patrol the Everglades and Big Cypress, suffering heavy attrition from disease, heat, and ambushes while unable to force decisive engagements or penetrate deep into enemy territory.\n\n“a succession of boggy marshes, small lakes, lily ponds, cypress swamps, cabbage and oak hammocks, connected and entirely impassable, even at dry seasons, for man or horse.” - Captain Joseph C. Ives, U.S. Army"
USA_third_seminole_war_2: "The Third Seminole War"
USA_third_seminole_war_2_desc: "The Third Seminole War drags on in the swamps of southern Florida, where Seminole warriors under Billy Bowlegs evade our forces with masterful guerrilla tactics. American troops patrol the Everglades and Big Cypress, suffering heavy attrition from disease, heat, and ambushes while unable to force decisive engagements or penetrate deep into enemy territory.\n\n“a succession of boggy marshes, small lakes, lily ponds, cypress swamps, cabbage and oak hammocks, connected and entirely impassable, even at dry seasons, for man or horse.” - Captain Joseph C. Ives, U.S. Army"
USA_the_florida_quagmire: "The Florida Quagmire"
USA_the_florida_quagmire_desc: "After more than three million dollars spent and years of effort, the United States has failed to fully remove the Seminoles from Florida. An informal suspension of major operations has taken hold, with patrols restricted and the last scattered bands permitted to remain in the deepest parts of the Everglades and Big Cypress. What was intended as a swift frontier campaign has become a long, expensive embarrassment that continues to drain political will and resources.\n\n“With neither side able to force a final result, a quiet suspension of major operations has taken hold.” - Colonel Gustavus Loomis, Department of Florida"
USA_congressional_funding_for_florida: "Congressional Funding for Florida"
USA_congressional_funding_for_florida_desc: "President Buchanan has signed the Florida Indian Appropriation Act into law. After passing both Houses of Congress, substantial new resources have been secured for Colonel Gustavus Loomis and the Department of Florida. These funds will support sustained operations, improved supply lines, and stronger pressure against the remaining Seminole bands in the Big Cypress Swamp and the Everglades.\n\n“The Government cannot shrink from its duty to protect its citizens and maintain order within its borders, however distant or difficult the task may be.” - President James Buchanan"
USA_florida_campaign_commitment: "Florida Campaign Commitment"
USA_florida_campaign_commitment_desc: ""
USA_aggressive_swamp_patrols: "Aggressive Swamp Patrols"
USA_aggressive_swamp_patrols_desc: "Colonel Loomis has ordered a more aggressive posture throughout the Florida theater. American forces are now conducting deeper and more frequent patrols into the Big Cypress and the Everglades, actively seeking out Seminole camps and destroying their hidden stores of food and supplies. Though this places greater strain upon our troops and increases the risk of ambush, it has markedly raised the pressure on the remaining hostile bands.\n\n“We must carry the war into the enemy’s own fastnesses. Half-measures will no longer suffice.” - Colonel Gustavus Loomis, Department of Florida"
USA_public_confidence_in_the_florida_campaign: "Public Confidence in the Florida Campaign"
USA_public_confidence_in_the_florida_campaign_desc: "Through careful explanation of the necessity of securing the frontier and protecting American settlements, the Administration has worked to sustain public support for the operations in Florida. While opposition remains in some quarters, a measure of confidence has been restored regarding the conduct and purpose of the campaign\n\n“The Government has a solemn duty to protect its citizens and uphold the authority of the Union in every portion of our territory, however distant or difficult the undertaking may prove.” - President James Buchanan"
USA_major_florida_offensive: "Major Florida Offensive"
USA_major_florida_offensive_desc: "A large-scale offensive has been launched throughout the Big Cypress Swamp and the Everglades. American forces are conducting aggressive deep patrols, destroying Seminole food stores and hidden camps, and pressing the remaining hostile bands with renewed determination. While this effort places considerable strain upon our troops and heightens the risk of ambush, it constitutes the strongest attempt yet to crush the last organized resistance in Florida.\n\n“We have driven them from many of their hiding places. Continued pressure will soon render them unable to maintain any further resistance.” - Colonel Gustavus Loomis, Department of Florida"
