### Events ###
usa.1.t: "Captain Mickler's Boat Company"
usa.1.d: "On the 5th of July, 1857, at Fort Brooke on Tampa Bay, Capt. Jacob Mickler mustered us, 45 Florida volunteers, into federal service under Col. Gustavus Loomis. We was one of the first boat companies for this Seminole trouble. Our orders was to hunt the Seminoles in the swamps and rivers where they hide.\n\nThey paid us three dollars a day plus rations and give us nine metallic 'gator boats; shallow iron things, 20-30 feet long, built special for these narrow creeks and marshes. We hauled 'em 85 hard miles by wagon to Fort Kissimmee, then launched north toward the big Lake Okeechobee. It felt like entering the great unknown wilderness of the Everglades, where few white men had gone with such purpose.\n\nThis morning, a 30-man detachment under Capt. Mickler come upon a Seminole camp on the north shore. Using the early mist and thick sawgrass for cover, we surprised 'em, overran the place and took 15-20 women and children. These prisoners are leverage now, each worth a $250 bounty to pressure the warriors, 'specially Billy Bowlegs' band, to give up. Our boat company showed we can strike deep and flush 'em out. God willing, this war ends soon."
usa.1.a: "The little fleet has done its work."
usa.2.t: "The Raid on Billy Bowlegs' Stronghold"
usa.2.d: "Today, Capt. William Cone led us, mostly boys from Columbia and Alachua Counties, following an Indian trail deep into the swamp west of the Okaloacoochee and south of Fort Doane. We come upon a cluster of Seminole dwellings. Two guards tried to raise the alarm but we killed 'em quick. Then we took one wounded warrior, five women, and thirteen young'uns.\n\nAmong the plunder we found personal things that belonged to Billy Bowlegs hisself: a suit of clothes, his 1852 tintype from Washington, a fancy shotbag, and that turban he always wore. Proved it was his main band and headquarters we hit.\n\nWe went on and burned several villages, near forty dwellings in all, along with fifty bushels of corn, a hundred of rice, pumpkins, oxen, hoes, and such. We laid waste a big 40-acre field near Royal Palm Hammock too. This ought to starve 'em out this winter. God willing, it breaks Billy Bowlegs and ends this war."
usa.2.a: "We have struck the enemy where it hurts."
usa.3.t: "Renewed Incursions into the Big Cypress Swamp"
usa.3.d: "Headquarters, Department of Florida\nFort Brooke, Tampa Bay\n\nSir,\n\nWith the close of the wet season and the return of drier winter conditions, I have ordered a vigorous resumption of offensive operations against the remaining Seminole bands.\n\nApproximately eight hundred troops, comprising companies of the regular Army and federalized Florida militia, have advanced in coordinated columns into the heart of the Big Cypress Swamp. These movements are supported by alligator boats upon the navigable waters and foot detachments cutting through hammocks and prairies. Our objective is to discover and destroy any rebuilt camps, hidden fields, and supply caches, to prevent the enemy from regrouping, and to maintain unrelenting pressure upon them.\n\nEarly reports from the advance columns indicate favorable progress. Several small abandoned camps have been located and burned, together with limited stores of coontie root and other provisions. The terrain continues to present great difficulties, dense vegetation, hidden water holes, and the constant risk of ambush, yet the renewed activity has visibly raised the morale of the command after the enforced inactivity of the wet months.\n\nI have the honor to remain,\nYour obedient servant,\n\nGustavus Loomis\nColonel, 5th Infantry\nCommanding Department of Florida"
usa.3.a: "The pressure is renewed."
usa.4.t: "Arrival of the Western Seminole Delegation"
usa.4.d: "Sir,\n\nI have the honor to report that the delegation of Western Seminoles and Creeks, sent by authority of the Government to induce the remaining Florida bands to emigrate, arrived here today after their long journey from the Indian Territory.\n\nThe party consists of about forty Seminoles and six Creeks, led by Chief John Jumper of the Western Seminoles and accompanied by the Creek leader Halleck Tustenuggee. They travel under Colonel Samuel Rutherford, Seminole agent, together with Colonel W. H. Garrett, Creek Agent, and under the general superintendence of Elias Rector, Superintendent of Indian Affairs.\n\nThese friendly Indians bear messages from relatives and friends already removed, together with liberal offers of money and guarantees of safe passage and support in the West. They will proceed inland without delay toward the southern swamps where Billy Bowlegs and the principal bands are reported to remain.\n\nThis mission, joined with the continued military pressure in the Big Cypress, marks an important step toward a peaceful and voluntary removal of the last hostile parties. I shall keep the Department informed of our progress."
usa.4.a: "The delegation has arrived."
usa.5.t: "Formal Negotiations with the Seminoles Succeed"
usa.5.d: "Sir,\n\nI have the honor to report that the council opened on the 15th instant near Fort Myers, between Superintendent Elias Rector and the principal remaining Seminole bands, has this day reached a successful conclusion.\n\nBilly Bowlegs, together with Assinwar and the sub-chiefs Nocose Emathla, Foos Hadjo, and others, have formally accepted the terms offered by the United States. After twelve days of deliberation, the chiefs have agreed to emigrate voluntarily to the Indian Territory with their people.\n\nThe arrangement provides substantial compensation: seven thousand five hundred dollars to Billy Bowlegs, one thousand dollars each to four named sub-chiefs, five hundred dollars to each warrior, and one hundred dollars to each woman and child. The total sum for the assembled group is estimated at fifteen to twenty thousand dollars. In return, the Indians will prepare for removal under guarantees of safe passage and protection, with no further military pursuit once they depart.\n\nThis agreement, achieved through patient negotiation and supported by the continued pressure of our forces in the swamps, marks the effective end of organized resistance in Florida.\n\nI shall furnish further particulars as arrangements for assembly and transport are made."
usa.5.a: "The agreement is reached."
usa.6.t: "Formal Negotiations with the Seminoles Fail"
usa.6.d: "Sir,\n\nI have the honor to report that the council opened on the 15th instant near Fort Myers, between Superintendent Elias Rector and the principal remaining Seminole bands under Billy Bowlegs, has this day concluded without agreement.\n\nAfter twelve days of deliberation, Billy Bowlegs, Assinwar, and the sub-chiefs Nocose Emathla, Foos Hadjo, and others have rejected the terms proposed by the United States. The offered compensation: seven thousand five hundred dollars to Billy Bowlegs, one thousand dollars each to four named sub-chiefs, five hundred dollars to each warrior, and one hundred dollars to each woman and child, for an estimated total of fifteen to twenty thousand dollars, was refused. The chiefs instead demanded permanent land guarantees in Florida, which the Government cannot provide.\n\nThis arrangement, framed as a voluntary emigration agreement with safe passage west, has therefore not been accepted. The Seminoles will not prepare for relocation under the proposed conditions.\n\nColonel Gustavus Loomis has been informed of the failure. With diplomacy exhausted, military operations against the remaining bands must now be renewed with full intensity.\n\nI shall keep the Department advised of further developments."
usa.6.a: "The council has broken up."
usa.7.t: "Renewed Seminole Ambushes"
usa.7.d: "Today, near Billy's Creek and the edge of the Big Cypress, a party of 20 or 30 Seminoles under Bowlegs or Assinwar laid a smart ambush on one of our supply columns. Them red devils used the thick brush and hammocks for cover, then hit us hard from all sides with rifles and close fighting. They killed eight of our boys, wounded several more, and made off with powder, rations, medicine, and whatever else they could carry. Then they slipped back into the sawgrass before we could catch 'em.\n\nWord reached Col. Loomis quick. He's calling up more militia companies, stepping up the 'gator boat patrols on the rivers, and sending extra foot parties through the prairies. They're strengthening the supply lines too so this don't happen again. After them chiefs turned down the March talks, it looks like the fight ain't over yet. We'll have to root 'em out the hard way. God help us in these cursed swamps."
usa.7.a: "The enemy has renewed hostilities."
usa.8.t: "General Orders No. 4"
usa.8.d: "The steamer Grey Cloud having sailed from Fort Myers on the 4th instant with Billy Bowlegs, Assinwar, and the principal men of their bands, together with thirty-eight warriors and eighty-five women and children, and having received at Egmont Key an additional forty-one captured Seminoles, the total number removed reaches approximately one hundred and sixty-three souls. The stipulated payments were duly made at Fort Myers prior to embarkation.\n\nBilly Bowlegs' War is hereby declared at an end.\n\nThe officers, soldiers, and Florida volunteers are commended for their untiring zeal and energy in penetrating the swamps and Everglades in every direction, driving the enemy from their strongest positions, destroying their magazines of stores and provisions, and capturing more than forty men, women, and children. According to Billy Bowlegs' own acknowledgment, more than forty warriors have been killed during the contest. The remaining Indians have been rendered hopeless of maintaining themselves in safety in Florida, thus facilitating the peaceful emigration just accomplished.\n\nVolunteer companies will be mustered out without delay. The regular forces in this Department will be reduced as rapidly as practicable. Active offensive operations will cease immediately. Remaining troops will secure the interior for future settlement.\n\nBy order of Colonel Gustavus Loomis,\nCommanding Department of Florida"
usa.8.a: "The war is declared over."
usa.9.t: "Seminole Counter-Actions"
usa.9.d: "Today, the wet season has hit us full force. Heavy rains every day, water rising fast, turning the Big Cypress and Everglades into a flooded mess. Our patrols and 'gator boats can hardly move anymore.\n\nThem Seminoles under Billy Bowlegs and Assinwar, who turned down the March talks, know this country better than we ever will. They're laying low in hidden hammocks and sawgrass islands, planting little patches of coontie root and living off fish and game while they rebuild their stores.\n\nLast night a band of 15 to 25 warriors slipped through the rain and hit our outpost near Fort Myers, the one holding captured women and children. They kilt three sentries, wounded several more, freed 15 or 20 of their people, and made off with some powder and rations before we could rally. They vanished back into the swamps like ghosts.\n\nCol. Loomis has pulled us back to defending the main lines. The cursed wet season has give the Seminoles breathing room. We'll have to wait for drier ground to go after 'em again. God willing, this war ends before another summer."
usa.9.a: "The swamps have turned against us."
usa.10.t: "Ambush at Fort Denaud"
usa.10.d: "Today, Col. Loomis ordered a tighter blockade along the coast and Caloosahatchee River. We been stopping Cuban fishermen and Bahamian boats that was trading powder, shot, and supplies to the Seminoles for hides and plumes. Trying to cut off their lifeline for good.\n\nLate this afternoon, a big party of 40 or 50 warriors under Bowlegs or Assinwar hit us hard at Fort Denaud on the river. They hid in the thick cypress and river brush, then come at us from all sides with rifle fire and a rush. They kilt twelve of our boys, wounded several more, and burned or carried off wagons full of rations, powder, and medicine. Then they slipped back into the swamps before reinforcements could get there.\n\nThem Seminoles still hit hard when they want to. Col. Loomis is sending more men to guard the river posts and supply trains. This war ain't dying easy. We'll keep fighting through these damn hammocks till they're all gone or we are."
usa.10.a: "We must choke their lifeline."
usa.11.t: "Weighing a Second Peace Overture"
usa.11.d: "Headquarters, Department of Florida\nFort Brooke, Tampa Bay\n\nSir,\n\nWith the close of the wet season and the return of drier winter conditions, I have ordered a vigorous resumption of offensive operations against the remaining Seminole bands.\n\nApproximately eight hundred troops, comprising companies of the regular Army and federalized Florida militia, have advanced in coordinated columns into the heart of the Big Cypress Swamp. These movements are supported by alligator boats upon the navigable waters and foot detachments cutting through hammocks and prairies. Our objective is to discover and destroy any rebuilt camps, hidden fields, and supply caches, to prevent the enemy from regrouping, and to maintain unrelenting pressure upon them.\n\nEarly reports from the advance columns indicate favorable progress. Several small abandoned camps have been located and burned, together with limited stores of coontie root and other provisions. The terrain continues to present great difficulties, dense vegetation, hidden water holes, and the constant risk of ambush, yet the renewed activity has visibly raised the morale of the command after the enforced inactivity of the wet months.\n\nI have the honor to remain,\nYour obedient servant,\n\nGustavus Loomis\nColonel, 5th Infantry\nCommanding Department of Florida"
usa.11.a: "Send the emissaries with better terms."
usa.11.b: "Press the campaign without compromise."
usa.12.t: "The Secondary Removal Wave"
usa.12.d: "Headquarters, Department of Florida\nFort Brooke, Tampa Bay\n\nSir,\n\nI have the honor to report that approximately seventy-five Seminoles, consisting of captured holdouts, stragglers who voluntarily surrendered at Fort Myers and Tampa, and a few influenced by the example of those previously removed, were assembled at Egmont Key.\n\nThis group, comprising men, women, and children from various scattered family bands, embarked today under military escort aboard vessels bound for New Orleans and thence to the Indian Territory. Payments according to the established scale, five hundred dollars to each warrior, one hundred dollars to each woman and child, and lesser amounts to stragglers, were disbursed prior to departure. The embarkation was conducted in an orderly manner with no incidents.\n\nThis secondary removal constitutes the final organized effort to clear the remaining Seminoles from Florida. Any scattered fugitives who may still linger in the deepest portions of the Everglades and Big Cypress are too few and too isolated to present an organized threat. Patrols will accordingly be further reduced, and the troops will shift their attention to securing the interior for future settlement and development.\n\nI have the honor to remain,\nYour obedient servant,\n\nGustavus Loomis\nColonel, 5th Infantry\nCommanding Department of Florida"
usa.12.a: "The last of them are gone."
usa.13.t: "Acceptance of the Second Peace Overtures"
usa.13.d: "Sir,\n\nI have the honor to report that the second peace overtures made by the United States to the remaining Seminole bands have today been accepted.\n\nAfter weeks of deliberation, Billy Bowlegs, Assinwar, and their principal men have agreed to the revised terms of voluntary emigration. The new arrangement provides a personal payment of ten thousand dollars to Billy Bowlegs, fifteen hundred dollars each to four named sub-chiefs, seven hundred and fifty dollars to each warrior, and one hundred and fifty dollars to each woman and child, for an estimated total of twenty to twenty-five thousand dollars. Stronger assurances of safe and expedited transport, together with additional provisions for the journey, have been included.\n\nThe bands will begin assembling near Fort Myers in the coming days. Colonel Gustavus Loomis has ordered all offensive patrols to stand down in the area and to provide security for the emigration process. Preparations are underway to receive the Indians, disburse the payments, and escort them to the waiting vessels.\n\nThis acceptance marks a most gratifying step toward the final and peaceful conclusion of the long conflict in Florida."
usa.13.a: "They have finally agreed to go west."
usa.14.t: "Rejection of the Second Peace Overtures"
usa.14.d: "Sir,\n\nI have the honor to report that the second peace overtures made by the United States to the remaining Seminole bands have today been rejected.\n\nAfter weeks of deliberation, Billy Bowlegs, Assinwar, and their principal men have refused the revised terms. The proposed compensation, ten thousand dollars to Billy Bowlegs, fifteen hundred dollars each to four named sub-chiefs, seven hundred and fifty dollars to each warrior, and one hundred and fifty dollars to each woman and child, for an estimated total of twenty to twenty-five thousand dollars, has not been accepted. Stronger assurances of safe transport and additional provisions were likewise declined. The chiefs continue to demand permanent land guarantees in Florida, which the Government cannot provide.\n\nThis arrangement, framed as a voluntary emigration agreement, has therefore not been accepted. The Seminoles will not prepare for relocation under the proposed conditions.\n\nWith diplomacy once more exhausted, Colonel Gustavus Loomis has ordered the continuation and intensification of military operations in the Big Cypress Swamp and Everglades. Patrols will press deeper to maintain unrelenting pressure upon the remaining bands.\n\nI shall keep the Department informed of further developments."
usa.14.a: "They have rejected our offer once more."
usa.15.t: "Final Emigration of the Seminole Bands"
usa.15.d: "Headquarters, Department of Florida\nFort Brooke, Tampa Bay\n\nSir,\n\nI have the honor to report the successful embarkation of the final major body of Seminoles from Florida.\n\nFollowing the acceptance of revised terms on the 18th of February last, the bands under Billy Bowlegs, Assinwar, and their associated groups gradually assembled at Fort Myers. Today the principal remaining body, estimated at between one hundred and eighty and two hundred and twenty individuals, together with additional captives who joined at Egmont Key, completed their embarkation. The total number removed in this final emigration is approximately two hundred and fifty souls.\n\nPayments in accordance with the revised agreement, ten thousand dollars to Billy Bowlegs, fifteen hundred dollars each to four named sub-chiefs, seven hundred and fifty dollars to each warrior, and one hundred and fifty dollars to each woman and child, were duly disbursed at Fort Myers prior to departure. Additional provisions for the journey and guarantees of no further military pursuit were furnished as agreed. The operation proceeded in an orderly manner with no significant incidents.\n\nWith the principal Seminole bands now removed, organized resistance in Florida has effectively ended. Patrols will be reduced to minimal levels, volunteer companies mustered out, and the remaining forces shifted to securing the interior for settlement and development. Any scattered fugitives still in the deepest swamps are too few and too isolated to constitute an organized threat.\n\nI have the honor to remain,\nYour obedient servant,\n\nGustavus Loomis\nColonel, 5th Infantry\nCommanding Department of Florida"
usa.15.a: "They have departed for the West."
usa.16.t: "Seminoles Capture of U.S. Arms Cache"
usa.16.d: "Today, them Seminoles under Billy Bowlegs and Assinwar, who turned down every offer to go west, have turned bolder. They're hitting our supply lines and outposts hard now, trying to keep their fight alive.\n\nThis morning a party of 40 to 60 warriors struck one of our arms caches a short ways inland from Tampa Bay. They come in with the early fog and thick scrub for cover, opened up with rifles from all sides, then charged in close. They kilt six of our boys, wounded several more, and made off with a big haul of rifles, powder, shot, cartridge boxes, and gear, enough to arm fifty more warriors. Then they melted back into the wetlands before we could catch 'em.\n\nCol. Loomis is rushing more men to guard the depots and strengthening the convoys. This raid stings bad, they took our own guns to use against us. With trouble brewing up in Kansas and Washington, it feels like the Government ain't paying us much mind down here. We got to stay sharp in these damn swamps or they'll bleed us dry."
usa.16.a: "They have armed themselves with our own weapons."
usa.17.t: "Weighing a Final Peace Overture"
usa.17.d: "Headquarters, Department of Florida\nFort Brooke, Tampa Bay\n\nSir,\n\nThe financial and logistical strain upon this Department has become severe. The cost of maintaining alligator boats, extended supply lines, reinforced outposts, and constant patrols now exceeds two and a half million dollars. While our operations have inflicted heavy damage upon the enemy, the Seminoles under Bowlegs and Assinwar continue to show stubborn resilience, especially after capturing arms and ammunition in recent months.\n\nTwo courses now lie before the Government.\n\nTo make one final diplomatic effort: A new and more liberal offer, higher payments, stronger logistical support for removal, and the tacit understanding that any very small family groups remaining in the most remote swamps may be left unmolested, might induce the weary bands to emigrate. Success would spare further expense, reduce the force in Florida, and bring the contest to a close without additional bloodshed.\n\nTo continue military operations with full intensity: Renewed and aggressive action, supported by the blockade, could eventually crush the last resistance by force. However, the approaching wet season will again limit our movements, expose supply lines to ambush, and require still greater expenditures at a time when national attention is drawn elsewhere.\n\nI respectfully solicit the instructions of the War Department and the Superintendent of Indian Affairs as to which course should be adopted.\n\nI have the honor to remain,\nYour obedient servant,\n\nGustavus Loomis\nColonel, 5th Infantry\nCommanding Department of Florida"
usa.17.a: "Send the final emissaries."
usa.17.b: "No more offers, press the campaign."
usa.18.t: "Acceptance of the Final Peace Overtures"
usa.18.d: "Sir,\n\nI have the honor to report that the final peace overtures extended by the United States to the remaining Seminole bands have today been accepted.\n\nAfter enduring severe hardship from continued military pressure, Billy Bowlegs, Assinwar, and their principal men have agreed to the revised terms of voluntary emigration. The new agreement provides a personal payment of twelve thousand five hundred dollars to Billy Bowlegs, two thousand dollars each to four named sub-chiefs, one thousand dollars to each warrior, and two hundred dollars to each woman and child, for an estimated total of twenty-five to thirty thousand dollars. Stronger assurances of expedited transport and additional provisions for the journey west have also been granted.\n\nThe bands will begin assembling near Fort Myers in the coming days. Colonel Gustavus Loomis has ordered all offensive patrols to stand down in the area and to furnish security for the emigration process. Preparations are underway to receive the Indians, disburse the payments, and escort them to the waiting vessels.\n\nThis acceptance brings to a successful close the long and costly conflict in Florida."
usa.18.a: "They have finally accepted."
usa.19.t: "Rejection of the Final Peace Overtures"
usa.19.d: "Sir,\n\nI have the honor to report that the final peace overtures extended by the United States to the remaining Seminole bands have today been rejected.\n\nDespite severe hardship from sustained military pressure, starvation, and the destruction of their hidden gardens and provisions, Billy Bowlegs, Assinwar, and their principal men have refused the revised terms. The proposed compensation, twelve thousand five hundred dollars to Billy Bowlegs, two thousand dollars each to four named sub-chiefs, one thousand dollars to each warrior, and two hundred dollars to each woman and child, for an estimated total of twenty-five to thirty thousand dollars, has not been accepted. Stronger assurances of expedited transport and additional provisions were likewise declined. The chiefs continue to demand permanent land guarantees in Florida, which the Government cannot provide.\n\nThis arrangement, framed as a voluntary emigration agreement, has therefore not been accepted. The Seminoles will not prepare for relocation under the proposed conditions.\n\nWith diplomacy once more exhausted, Colonel Gustavus Loomis has ordered the continuation and intensification of military sweeps into the Big Cypress Swamp and Everglades. Patrols will press deeper to maintain unrelenting pressure upon the remaining bands.\n\nI shall keep the Department informed of further developments."
usa.19.a: "They refuse even our final offer."
usa.20.t: "The Death of Billy Bowlegs"
usa.20.d: "Today, our patrol of about 35 men, led by the Lieutenant, struck a party of 20-5 Seminoles foraging near a hammock in the middle of the Big Cypress. They opened fire quick and tried to melt back into the thick stuff, but we give 'em a hot fight at close range.\n\nIn the scrap, we kilt Billy Bowlegs hisself, the big chief that's been leading the holdouts. We knowed it was him by his fancy shotbag and other truck we picked up. His boys carried the body off into the swamp so we couldn't get it, but he's dead sure enough.\n\nWe only had two boys wounded. Picked up a few of their guns too. Col. Loomis has been told. Losing Billy Bowlegs is a hard lick for them Seminoles. Without him to hold the bands together, the rest under Assinwar will likely break apart. This might be the beginning of the end in these godforsaken swamps. Thank the Lord."
usa.20.a: "Bowlegs is no more."
usa.21.t: "Final Emigration of the Seminole Bands"
usa.21.d: "Headquarters, Department of Florida\nFort Brooke, Tampa Bay\n\nSir,\n\nI have the honor to report the successful embarkation of the final major body of Seminoles from Florida.\n\nFollowing the acceptance of the revised terms on the 15th of October last, the bands under Billy Bowlegs, Assinwar, and associated sub-chiefs assembled at Fort Myers. Today the principal remaining body, estimated at between one hundred and eighty and two hundred and twenty individuals, together with additional captives and stragglers who joined at Egmont Key, completed their embarkation. The total number removed in this final party is approximately two hundred and fifty souls.\n\nPayments according to the accepted terms, twelve thousand five hundred dollars to Billy Bowlegs, two thousand dollars each to four named sub-chiefs, one thousand dollars to each warrior, and two hundred dollars to each woman and child, were duly disbursed at Fort Myers prior to departure. Additional provisions and guarantees of no further military pursuit were furnished as agreed. The operation proceeded in an orderly manner with scenes of family reunion aboard the vessels and no significant incidents.\n\nWith the principal Seminole bands now removed, organized resistance in Florida has effectively ended. Active patrols will be reduced, remaining volunteer companies mustered out, and the troops shifted to securing the interior for settlement and development. Any scattered fugitives still in the deepest swamps are too few and too isolated to constitute a threat.\n\nI have the honor to remain,\nYour obedient servant,\n\nGustavus Loomis\nColonel, 5th Infantry\nCommanding Department of Florida"
usa.21.a: "They have departed for the West."
usa.22.t: "Introduction of the Florida Indian Appropriation Act"
usa.22.d: "My Dear Sir,\n\nToday Representative George S. Hawkins of Florida rose in the House and formally introduced “An Act making Appropriations for the Suppression of Indian Hostilities in Florida.” The bill calls for a substantial increase in funds to sustain Colonel Loomis and the Department of Florida against the Seminoles still holding out in the Big Cypress and Everglades.\n\nHawkins made a strong case that, notwithstanding the earlier declaration that the war had ended, the Seminoles continue their raids upon settlements and supply lines. He requested additional troops, better support for the alligator boats, more outposts, and fresh supplies of powder, shot, and rations.\n\nThe measure immediately drew fire. Mr. Laurence M. Keitt of South Carolina gave it warm support, declaring: “The Seminoles have not accepted defeat. They continue to lurk in the swamps and strike at our people. Florida is part of the South, and we must defend it as we would any other state.”\n\nIn reply, Mr. Thaddeus Stevens of Pennsylvania cut back sharply: “We are being asked to pour more treasure into the Florida sands while American taxpayers foot the bill for a conflict that was supposed to have ended. This is not a war for the nation; it is a war for Southern interests.”\n\nThe bill has been referred to the Committee on Military Affairs. Debate promises to be lively, with Southern members pressing hard for passage and many Northern men questioning the wisdom of pouring still more money into those endless swamps.\n\nI shall keep you advised as matters develop."
usa.22.a: "The bill has been introduced."
usa.23.t: "Opening House Debate on the Florida Indian Appropriation Act"
usa.23.d: "My Dear Sir,\n\nThe House today opened formal debate on the Florida Indian Appropriation Act introduced by Mr. Hawkins of Florida on the 12th instant. The bill seeks a large additional sum to sustain Colonel Loomis and the Department of Florida against the Seminoles still active in the Big Cypress and Everglades.\n\nThe chamber was tense and sharply divided. Mr. Laurence M. Keitt of South Carolina rose early in strong support, declaring: “The blood of Southern settlers cries out from the Florida frontier! If this Government will not protect its citizens in the South from these lurking savages, then it is no government at all. We demand the means to finish this war.”\n\nHis words drew hearty applause from the Southern Democrats. Mr. Thaddeus Stevens of Pennsylvania answered with characteristic sharpness: “Gentlemen, we are once again being asked to squander Northern treasure on a Southern swamp war that refuses to die. Millions have already vanished into those fever-ridden wilds with nothing to show for it but more graves. The people of this Republic will not stand as paymasters for endless Southern adventures.”\n\nThe debate revealed deep sectional fissures. Southern members and Fire-Eaters insist the bill is essential for Southern security, while Republicans, Radicals especially, denounce it as an endless drain on the Treasury. Northern Democrats and Opposition men are urging strict limits and closer oversight.\n\nThe session ran several hours. The bill now rests with the Committee on Military Affairs, and sharper exchanges are expected in the days ahead.”"
usa.23.a: "Support Representative Keitt's Position."
usa.23.b: "Support Representative Stevens' Criticism."
usa.24.t: "Key House Speeches on the Florida Indian Appropriation Act"
usa.24.d: "My Dear Sir,\n\nDebate on the Florida Indian Appropriation Act has grown still more intense in the House. After the opening exchanges in December, several strong speeches today laid bare the deep sectional divisions on the question of continued funding for Colonel Loomis's operations against the Seminoles in the Big Cypress and Everglades.\n\nMr. James L. Orr of South Carolina spoke with force in favor of the bill, declaring: “The Seminoles remain a threat to the safety of Florida's citizens. This appropriation is necessary to protect American lives and property in the South and to finally bring an end to their raids.”His words were warmly received by the Southern Democrats. In reply, Mr. Justin S. Morrill of Vermont offered a firm Moderate Republican rebuttal: “We are being asked to fund yet another escalation in the Florida swamps. The campaign has already dragged on for years with limited results. The House should not approve further funds for this ongoing conflict.”\n\nHis words were warmly received by the Southern Democrats. In reply, Mr. Justin S. Morrill of Vermont offered a firm Moderate Republican rebuttal: “We are being asked to fund yet another escalation in the Florida swamps. The campaign has already dragged on for years with limited results. The House should not approve further funds for this ongoing conflict.”\n\nLater, Mr. John A. Gilmer of North Carolina, speaking for the Opposition, took a more cautious middle ground: “While the government has a duty to protect its citizens, we must ensure that this appropriation is strictly limited in scope and subject to careful oversight. Prolonged Indian wars have proven both expensive and inconclusive in the past.”\n\nThe fault lines are now unmistakable. Southern men demand the money as a matter of honor and security, while Republicans and many Opposition members resist what they see as another bottomless drain on the Treasury. The final vote is expected within days, and feeling runs high on both sides.\n\nI shall write again as soon as there is movement."
usa.24.a: "Support Representative Orr's Position."
usa.24.b: "Support Representative Morrill's Opposition."
usa.24.c: "Align with Representative Gilmer's Cautious Middle Ground."
usa.25.t: "Closing House Debate on the Florida Indian Appropriation Act"
usa.25.d: "My Dear Sir,\n\nThe House has now entered the final stage of debate on the Florida Indian Appropriation Act. After weeks of heated discussion, members delivered their closing arguments today, with the decisive vote scheduled for the 15th instant.\n\nMr. Laurence M. Keitt of South Carolina closed strongly for the bill, declaring: “The safety of Florida and the honor of the South demand that we support our troops. The Seminoles have not surrendered — they must be subdued. This bill is necessary and just.”\n\nHis remarks drew loud applause from the Southern Democrats and Fire-Eaters. In sharp reply, Mr. Thaddeus Stevens of Pennsylvania delivered a powerful rebuttal: “This is not a national war. It is a costly and endless struggle in the swamps that serves only narrow interests. The House should refuse to approve further funds for this ill-advised campaign.”\n\nTension in the chamber ran high. Southern members continue to press the bill as a matter of honor and the defense of Southern soil, while Republicans and many Opposition men insist the campaign has already swallowed too much money with too little result. The House remains deeply divided as the final vote approaches.\n\nI will write again the moment the result is known."
usa.25.a: "Support Representative Keitt's Position."
usa.25.b: "Support Representative Stevens' Opposition."
usa.26.t: "House Passes the Florida Indian Appropriation Act"
usa.26.d: "My Dear Sir,\n\nAfter weeks of heated and often acrimonious debate, the House of Representatives today passed the Florida Indian Appropriation Act by a narrow margin.\n\nThe bill, which grants substantial new funding for Colonel Loomis and the Department of Florida to press the campaign against the remaining Seminoles, survived determined opposition. The close vote revealed just how deeply this question has split the chamber.\n\nMr. Laurence M. Keitt of South Carolina closed with great passion in favor, declaring: “The frontier families of Florida live in constant terror. We cannot abandon them to the tomahawk while the Government still has strength to act. This appropriation is a solemn duty to the South and to the Union itself.”\n\nIn fierce reply, Mr. Thaddeus Stevens of Pennsylvania thundered against the bill: “How many millions must disappear into those mosquito-infested swamps before reason prevails? This is throwing good money after bad in pursuit of a phantom victory. The House has no right to burden the taxpayers of this nation for a regional conflict without end.”\n\nThe bill now proceeds to the Senate. Southern Democrats are claiming a victory for Southern security, while many Northern members view it as yet another wasteful concession. The divisions here grow sharper by the week.\n\nI will advise you as soon as the Senate begins its deliberations."
usa.26.a: "The bill advances to the Senate."
usa.27.t: "House Rejects the Florida Indian Appropriation Act"
usa.27.d: "My Dear Sir,\n\nAfter weeks of heated and often acrimonious debate, the House of Representatives today rejected the Florida Indian Appropriation Act.\n\nThe bill, which sought substantial new funding for Colonel Loomis and the Department of Florida to continue operations against the Seminoles in the Big Cypress and Everglades, failed to pass. The close but decisive vote revealed the depth of opposition that had built against the measure.\n\nMr. Laurence M. Keitt of South Carolina closed with great passion in favor, declaring: “The frontier families of Florida live in constant terror. We cannot abandon them to the tomahawk while the Government still has strength to act. This appropriation is a solemn duty to the South and to the Union itself.”\n\nIn fierce reply, Mr. Thaddeus Stevens of Pennsylvania thundered against the bill: “How many millions must disappear into those mosquito-infested swamps before reason prevails? This is throwing good money after bad in pursuit of a phantom victory. The House has no right to burden the taxpayers of this nation for a regional conflict without end.”\n\nThe bill is now dead in the House. Colonel Loomis and his command must make do with existing resources. Many Northern members and Republicans view this as a victory of fiscal restraint, while Southern Democrats are bitterly disappointed. The decision leaves the Florida campaign in a more difficult position.\n\nI shall keep you informed of any further developments."
usa.27.a: "Funding denied."
usa.28.t: "Opening Senate Debate on the Florida Indian Appropriation Act"
usa.28.d: "My Dear Sir,\n\nThe Senate today opened formal debate on the Florida Indian Appropriation Act, which passed the House by a narrow margin. The bill seeks substantial additional funding for Colonel Loomis and the Department of Florida in their continuing operations against the Seminoles in the Big Cypress and Everglades.\n\nThe chamber was solemn and clearly divided. Senator Jefferson Davis of Mississippi rose early in strong support, declaring: “The Seminoles continue to defy American authority in Florida. We must provide the necessary resources to Colonel Loomis to protect Southern soil and bring this resistance to an end.”\n\nHis remarks were well received by Southern Democrats. In reply, Senator William H. Seward of New York offered a pointed Republican counterargument: “We are being asked to approve yet more funds for a conflict that has already dragged on far too long. The Senate should carefully consider whether additional spending on this distant campaign serves the national interest.”\n\nThe opening session ran several hours. Southern Senators continue to press the bill as a matter of honor and sectional duty, while Republicans and some Opposition members question the wisdom of pouring still more money into the Florida swamps. Debate is expected to stretch over several weeks.\n\nI will keep you informed as matters progress."
usa.28.a: "Support Senator Jefferson Davis' Position."
usa.28.b: "Support Senator William H. Seward's Criticism."
usa.29.t: "Key Senate Speeches on the Florida Indian Appropriation Act"
usa.29.d: "My Dear Sir,\n\nDebate on the Florida Indian Appropriation Act has grown more intense in the Senate since its passage in the House. Several powerful speeches today have exposed the sharp divisions that persist on the question of further funding for Colonel Loomis's operations against the Seminoles in the Big Cypress and Everglades.\n\nSenator James Henry Hammond of South Carolina, a leading Fire-Eater, spoke strongly in favor of the bill, declaring: “Florida is Southern territory. If we allow the Seminoles to remain defiant, we invite chaos on our frontiers. This appropriation is essential to maintain order and protect American settlements.”\n\nHis words drew strong approval from the Southern Democrats. In direct reply, Senator Lyman Trumbull of Illinois offered a firm Moderate Republican rebuttal: “The Seminole campaign has already consumed vast sums with little to show for it. We cannot continue pouring money into the Florida swamps while more urgent matters demand the attention of this body.”\n\nLater, Senator John J. Crittenden of Kentucky, speaking for the Opposition, took a cautious middle position: “While the government has a duty to protect its citizens, we must ensure that this appropriation is strictly limited in scope and subject to careful oversight. Prolonged Indian wars have proven both expensive and inconclusive in the past.”\n\nThe fault lines are now very clear. Southern Senators press hard for the funds as a matter of sectional honor, while Republicans and many Opposition members continue to resist what they see as another wasteful expenditure. The final vote is expected within days."
usa.29.a: "Support Senator Hammond's Position."
usa.29.b: "Support Senator Trumbull's Opposition."
usa.29.c: "Align with Senator Crittenden's Cautious Stance."
usa.30.t: "Closing Senate Debate on the Florida Indian Appropriation Act"
usa.30.d: "My Dear Sir,\n\nThe Senate has entered the final stage of debate on the Florida Indian Appropriation Act. With the decisive vote now imminent, senators delivered their closing arguments today.\n\nSenator Jefferson Davis of Mississippi made one of the most forceful speeches in support of the bill, declaring: “The Seminole war is a direct challenge to the sovereignty of the United States in the South. We must give Colonel Loomis and our soldiers the means to crush this resistance once and for all, or admit that the Federal Government is powerless to protect its own citizens.”\n\nHis words drew loud applause from Southern Democrats and Fire-Eaters. In sharp contrast, Senator Charles Sumner of Massachusetts delivered a powerful closing attack against the measure, stating: “This wretched swamp war has become a sinkhole for public money and a stain upon the Republic. The Senate must put an end to this folly and refuse to waste another dollar on a conflict that serves no national purpose.”\n\nTension ran high throughout the session. Southern members continue to insist the appropriation is a matter of honor and security, while Republicans and Opposition Senators warn that the campaign has become an endless and ruinous expense. The Senate remains bitterly divided as the final vote approaches on February 10.\n\nI will inform you immediately of the outcome."
usa.30.a: "Support Senator Jefferson Davis' Position."
usa.30.b: "Support Senator Charles Sumner's Opposition."
usa.31.t: "Senate Passes the Florida Indian Appropriation Act"
usa.31.d: "My Dear Sir,\n\nAfter weeks of vigorous and often bitter debate, the Senate today passed the Florida Indian Appropriation Act by a narrow margin.\n\nThe bill, which provides substantial additional funding for Colonel Loomis and the Department of Florida to continue operations against the Seminoles in the Big Cypress and Everglades, survived strong opposition from Republicans and several Opposition members. The close vote once again demonstrated the deep sectional divisions on this question.\n\nSenator Jefferson Davis of Mississippi spoke with great force in favor during the proceedings, declaring: “The Seminole war is a direct challenge to the sovereignty of the United States in the South. We must give Colonel Loomis and our soldiers the means to crush this resistance once and for all, or admit that the Federal Government is powerless to protect its own citizens.”\n\nIn sharp opposition, Senator Charles Sumner of Massachusetts delivered one of the strongest attacks against the measure, stating: “This wretched swamp war has become a sinkhole for public money and a stain upon the Republic. The Senate must put an end to this folly and refuse to waste another dollar on a conflict that serves no national purpose.”\n\nThe bill now goes to the President for his signature. Southern Democrats are claiming a victory for Southern security, while many Northern Senators remain deeply dissatisfied. This narrow passage will allow the campaign in Florida to continue with reinforced resources.\n\nI shall write again once the President acts upon the measure."
usa.31.a: "The bill advances to the President."
usa.32.t: "Senate Rejects the Florida Indian Appropriation Act"
usa.32.d: "My Dear Sir,\n\nAfter weeks of vigorous and often contentious debate, the Senate today rejected the Florida Indian Appropriation Act.\n\nThe bill, which sought substantial additional funding for Colonel Loomis and the Department of Florida to continue operations against the Seminoles in the Big Cypress and Everglades, failed to pass. The narrow but decisive vote once again exposed the deep sectional divisions in the chamber.\n\nSenator Jefferson Davis of Mississippi argued passionately in favor during the proceedings, declaring: “The Seminole war is a direct challenge to the sovereignty of the United States in the South. We must give Colonel Loomis and our soldiers the means to crush this resistance once and for all, or admit that the Federal Government is powerless to protect its own citizens.”\n\nIn sharp opposition, Senator Charles Sumner of Massachusetts delivered one of the strongest attacks against the measure, stating: “This wretched swamp war has become a sinkhole for public money and a stain upon the Republic. The Senate must put an end to this folly and refuse to waste another dollar on a conflict that serves no national purpose.”\n\nThe bill is now dead. Colonel Loomis and his command will have to make do with existing resources. Southern Democrats are bitterly disappointed, while Republicans and many Opposition Senators view this as a victory for fiscal prudence. The decision leaves the Florida campaign in a significantly more constrained position.\n\nI shall keep you advised of any further developments in this matter."
usa.32.a: "Funding denied."
usa.33.t: "President Signs the Florida Indian Appropriation Act"
usa.33.d: "My Dear Sir,\n\nI have the honor to inform you that President Buchanan today signed the Florida Indian Appropriation Act into law.\n\nAfter a long and bitterly contested legislative journey, introduced in the House on December 12th, passed narrowly there on January 15th, and approved by the Senate on February 10th, the bill has finally become law. It authorizes substantial additional funding for Colonel Loomis and the Department of Florida to sustain and intensify operations against the remaining Seminole bands in the Big Cypress and Everglades.\n\nIn his brief statement upon signing, President Buchanan remarked: “The government has a duty to protect its citizens and maintain order within its territories. This appropriation will enable our forces in Florida to bring the Seminole conflict to a final and successful conclusion.”\n\nSouthern Democrats are well pleased with the outcome, while many Republicans continue to grumble about the expense. Colonel Loomis will now have greater resources for patrols, alligator boats, outposts, and supplies. Whether this will finally bring the long and costly Florida campaign to an end remains to be seen.\n\nI shall keep you advised of how matters develop in the field."
usa.33.a: "The bill is now law."
usa.34.t: "Armistice Negotiations"
usa.34.d: "Headquarters, Department of Florida\nFort Brooke, Tampa Bay\n\nSir,\n\nI have the honor to report that after more than two and a half years of low-intensity but costly operations, a de facto armistice has been established with the remaining Seminole bands under Assinwar and associated family groups.\n\nSince the failure of negotiations in March 1858, sustained pressure through the coastal blockade, repeated sweeps, and the destruction of hidden provisions has left the enemy severely weakened by famine, disease, and desertion. The death of Billy Bowlegs in November 1859 further diminished their ability to maintain organized resistance. Their numbers are now estimated at between 300 and 500 souls, scattered and increasingly unable to sustain the fight.\n\nIn light of the critical national situation and the urgent demands upon the Army, emissaries were dispatched with modified terms. Informal discussions have today produced a practical truce. The Seminoles have agreed to cease active hostilities, while this command has suspended offensive sweeps and pursuit into the deepest portions of the Big Cypress and Everglades. Patrols will be limited to defensive positions.\n\nThis arrangement, though not a formal treaty, offers a necessary respite for both sides given the exhaustion of our resources and the unsettled state of the Union.\n\nI have the honor to remain,\nYour obedient servant,\n\nGustavus Loomis\nColonel, 5th Infantry\nCommanding Department of Florida"
usa.34.a: "An end, of sorts, has been reached."
usa.35.t: "Defeat of the Seminole Holdouts"
usa.35.d: "Today, after years of hard marching, fighting, and chasing through these cursed swamps, we finally done it. Our columns, backed by the 'gator boats on the rivers and creeks, pushed deep into the Big Cypress and Everglades like never before. We cut through hammocks and sawgrass, burned out their hidden camps, destroyed their little gardens and food caches, and hunted down the last organized bands.\n\nThem Seminoles, worn out by hunger and constant pressure, put up a fight in a few sharp scrapes, but they was too weak and scattered to hold. We broke their last groups. Key chiefs like Assinwar and others have been captured, along with near 220 men, women, and children. The few that's left are either surrendering or hiding so deep they ain't no threat no more.\n\nWe lost only a few boys in these final fights. Col. Loomis has reported the good news. Organized resistance is finished. They're mustering out the volunteer companies soon, and the rest of us will shift to guarding the settlements. After all this blood and sweat since '55, Florida finally belongs to us."
usa.35.a: "The Seminoles are conquered at last."
usa.36.t: "Removal of Assinwar and the Last Captives"
usa.36.d: "Headquarters, Department of Florida\nFort Brooke, Tampa Bay\n\nSir,\n\nI have the honor to report the successful completion of the final roundup and removal of the remaining Seminole holdouts.\n\nFollowing the complete defeat of their last organized bands, Assinwar and other surviving sub-chiefs, together with approximately two hundred and twenty men, women, and children from the scattered family groups, have been brought under military guard to Fort Myers. Today the final group has been embarked aboard steamers under strict escort. They will proceed first to Egmont Key and thence to New Orleans for relocation to the Indian Territory. No payments or concessions were made.\n\nThe operation was conducted in an orderly manner with no incidents. Captured leaders, including Assinwar, were kept under close supervision throughout.\n\nWith the removal of these last captives, organized Seminole resistance in Florida has been entirely eliminated. Any remaining fugitives in the deepest swamps are too few and too scattered to pose any meaningful threat. Patrols will now be reduced to minimal levels, volunteer companies mustered out, and the remaining forces shifted to securing the interior for settlement and development.\n\nThe long and costly conflict is now fully concluded by decisive military action.\n\nI have the honor to remain,\nYour obedient servant,\n\nGustavus Loomis\nColonel, 5th Infantry\nCommanding Department of Florida"
usa.36.a: "The last captives have been removed."
usa_news.1.t: "THE FLORIDA WAR ENDED"
usa_news.1.d: "§HOfficial Proclamation by Col. Loomis - Billy Bowlegs and His Band Removed to the West§!\n\nIntelligence received by steamer from Tampa Bay announces that the long and harassing conflict with the Seminole Indians in Florida has at last been brought to a close.\n\nOn the 4th instant, the sidewheel steamer Grey Cloud departed Fort Myers with Billy Bowlegs, Assinwar, and the principal men of their bands, accompanied by thirty-eight warriors and eighty-five women and children. At Egmont Key, an additional forty-one captured Seminoles joined the party, making a total of approximately one hundred and sixty-three souls removed in this final embarkation. The stipulated payments were made at Fort Myers prior to sailing.\n\nOn the 8th instant, at Fort Brooke, Colonel Gustavus Loomis, commanding the Department of Florida, issued General Orders No. 4, formally declaring Billy Bowlegs' War at an end. In his proclamation, the Colonel warmly commends the officers, regulars, and Florida volunteers for their untiring zeal in penetrating the swamps and Everglades, destroying the enemy's stores and provisions, and compelling the hostile bands to accept emigration.\n\nWith the principal chiefs and their followers now on their way to New Orleans and thence to the Indian Territory, active operations have ceased. Volunteer companies are being mustered out, regular forces reduced, and the remaining posts prepared for decommissioning. The interior of Florida is at last open to peaceful settlement and development.\n\nThe final removal of Billy Bowlegs, long regarded as the last formidable chief in the peninsula, marks the practical completion of the Indian question in Florida after more than twenty years of intermittent strife."
usa_news.1.a: "Further details are expected by the next mail."
usa_news.2.t: "THE LAST OF THE SEMINOLES"
usa_news.2.d: "§HFinal Emigration of Billy Bowlegs and His Band - The Florida War at an End§!\n\nBy steamer from Tampa Bay we have received intelligence that the long and vexatious Seminole War in Florida has at last been brought to a final close.\n\nOn the 20th of April, the principal remaining body of Seminoles, estimated at between 180 and 220 souls, together with additional captives who joined them at Egmont Key, completed their embarkation at Fort Myers. The total number removed in this final party is approximately 200 to 250 men, women, and children. They sailed under military escort for New Orleans, en route to their new homes in the Indian Territory.\n\nLiberal payments were made at Fort Myers in accordance with the revised agreement of February last: ten thousand dollars to Billy Bowlegs personally, fifteen hundred dollars to each of four sub-chiefs, seven hundred and fifty dollars to each warrior, and one hundred and fifty dollars to each woman and child. Additional provisions for the journey and guarantees of protection were furnished. The embarkation is described as orderly, with affecting scenes of family reunion aboard the steamers.\n\nColonel Gustavus Loomis, commanding the Department of Florida, has officially declared that organized resistance in the peninsula has ended. Patrols are being reduced, volunteer companies mustered out, and the remaining troops will now protect the interior for settlement and development. Only a handful of scattered fugitives are believed to remain in the deepest recesses of the Everglades and Big Cypress, too few to cause further trouble.\n\nThus ends a conflict that has cost the Government more than two and a half million dollars and occupied the attention of the Republic for nearly three years. The stubborn resistance of these Florida Indians, the last armed native opposition east of the Mississippi, has finally yielded to the combined pressure of arms and diplomacy.\n\nThis intelligence will be received with satisfaction throughout the United States and in the capitals of Europe, where the Seminole campaigns have long been watched with curiosity."
usa_news.2.a: "Further particulars are expected by the next arrival."
usa_news.3.t: "DEATH OF BILLY BOWLEGS"
usa_news.3.d: "§HPrincipal Seminole Chief Killed in Skirmish in the Big Cypress - A Severe Blow to the Remaining Hostiles§!\n\nIntelligence received by steamer from Tampa Bay brings important news from the Florida frontier. On the 12th instant, a U.S. patrol of thirty-five men, operating in the central Big Cypress Swamp, engaged a band of twenty to twenty-five Seminole warriors near a hidden hammock.\n\nIn a sharp and close-fought skirmish, the Indians were surprised while foraging. A brisk exchange of rifle fire followed, after which the Seminoles attempted to withdraw into the dense cypress and sawgrass. During the retreat, Billy Bowlegs, the principal war chief and most prominent leader of the Florida Seminoles, was mortally wounded by rifle fire. His warriors succeeded in carrying off his body, but his identity was clearly established by a distinctive shotbag and other personal effects recovered on the field.\n\nThe patrol suffered only two men wounded. Several Seminole weapons were taken.\n\nColonel Gustavus Loomis, commanding the Department of Florida, has been notified. The death of Billy Bowlegs, long the rallying figure of Seminole resistance, is regarded as a most serious blow to the remaining bands. With their chief gone, the hostile parties under Assinwar and other sub-leaders are expected to fragment further, weakening their ability to coordinate further resistance in the swamps.\n\nThis event may well prove the decisive turning point in the protracted and costly Florida campaign. While a few small parties may linger in the deepest Everglades, organized opposition appears to be nearing its end."
usa_news.3.a: "Further details are anxiously awaited by the next mail."
usa_news.4.t: "THE FINAL REMOVAL OF THE SEMINOLES"
usa_news.4.d: "§HBilly Bowlegs and the Last Bands Sail for the West - Organized Resistance in Florida Ended§!\n\nBy the latest arrival from Tampa Bay we are informed that the protracted Seminole difficulty has at length been brought to a complete and satisfactory termination.\n\nOn the 10th instant, the final major body of Seminoles, numbering between one hundred and eighty and two hundred and twenty souls, together with additional captives and stragglers who joined them at Egmont Key, embarked at Fort Myers aboard Government steamers. The total removed in this last emigration is estimated at two hundred and fifty men, women, and children.\n\nLiberal payments were made at Fort Myers according to the October agreement: twelve thousand five hundred dollars to Billy Bowlegs personally, two thousand dollars each to four sub-chiefs, one thousand dollars to each warrior, and two hundred dollars to each woman and child, an estimated total of twenty-five to thirty thousand dollars. Additional provisions for the journey and guarantees of protection were furnished. The embarkation was orderly, marked by affecting scenes of family reunions aboard the vessels.\n\nColonel Gustavus Loomis, commanding the Department of Florida, has formally declared that organized Seminole resistance in the peninsula has ended. Active patrols are being reduced, volunteer companies mustered out, and the remaining forces will secure the interior for settlement and development. Only a handful of scattered fugitives, if any, are believed to linger in the deepest recesses of the Everglades and Big Cypress, too few to cause further trouble.\n\nThus, after nearly four years of harassing and expensive warfare, the Indian question in Florida is finally closed. The rich lands of the interior now lie open to the enterprising settler, and the power of the United States has once more prevailed.\n\nThis intelligence will be received with much satisfaction throughout the country."
usa_news.4.a: "Further particulars expected by next mail."
usa_news.5.t: "THE SEMINOLE WAR PRACTICALLY ENDED"
usa_news.5.d: "§HDe Facto Armistice Reached in Florida - Hostilities Suspended After More Than Two and a Half Years§!\n\nIntelligence received from Tampa Bay announces that the long, harassing, and expensive conflict with the Seminole Indians in Florida has virtually come to a close.\n\nAfter more than two years and a half of low-intensity but exhausting warfare, a de facto armistice has been established between U.S. forces under Colonel Gustavus Loomis and the remaining Seminole bands. The Indians, now reduced to between 300 and 500 souls under Assinwar and scattered family groups, have been severely weakened by prolonged famine, disease, and relentless pressure. The death of the celebrated chief Billy Bowlegs in a skirmish last November dealt a final heavy blow to their resistance.\n\nIn view of the critical state of national affairs, with the Presidential election near at hand and rumors of secession filling the South, emissaries were sent forward with modified terms. Informal discussions have resulted in a practical truce. The Seminoles have agreed to cease active hostilities and withdraw deeper into the inaccessible portions of the Big Cypress and Everglades. In return, offensive operations and pursuits into the deepest swamps have been suspended.\n\nNo formal treaty has been signed, but both sides have stood down from major operations. Colonel Loomis has ordered patrols to defensive positions only.\n\nThis arrangement, born of mutual exhaustion and the pressing needs of the Republic, brings what is hoped to be a final termination to a conflict that has cost the Government more than three million dollars. The interior of Florida may now at last be opened to settlement with comparative safety.\n\nThis intelligence will be received with relief by the American people after so many years of fruitless expenditure in those pestilential swamps."
usa_news.5.a: "Further particulars are expected by the next steamer."
usa_news.6.t: "COMPLETE TRIUMPH IN FLORIDA"
usa_news.6.d: "§HLast Seminole Bands Captured and Removed - The Indian War Finally at an End§!\n\nIntelligence from Tampa Bay brings the welcome intelligence that the Seminole War in Florida has been brought to a complete and decisive conclusion by the strong arm of the military.\n\nFollowing the final defeat of the last organized Seminole bands in the Big Cypress and Everglades, United States forces conducted a thorough roundup of the remaining scattered Indians. Assinwar, the principal surviving chief, together with other sub-chiefs and approximately two hundred and twenty men, women, and children, have been brought under guard to Fort Myers.\n\nToday the final group was embarked aboard steamers under strict military escort. They will proceed first to Egmont Key and thence to New Orleans for removal to the Indian Territory. No payments or concessions were granted. The operation was carried out in an orderly manner with no disturbances.\n\nColonel Gustavus Loomis, commanding the Department of Florida, has officially reported that organized Seminole resistance is now entirely broken. Any few scattered fugitives who may still linger in the deepest swamps are too insignificant to threaten the peace. Volunteer companies are being mustered out, patrols reduced, and the troops will now turn their attention to protecting the interior for settlement and development.\n\nThus ends a long, difficult, and expensive contest that has occupied the Government since 1855. The rich lands of southern Florida, long harassed by Indian depredations, are at last open to the American settler without fear of molestation.\n\nThis final victory will be received with great satisfaction throughout the country."
usa_news.6.a: "Further details expected by next arrival."


### Focuses ###
USA_focus_the_seminole_resistance_persists: "The Seminole Resistance Persists"
USA_focus_the_seminole_resistance_persists_desc: "It is a source of profound regret that, despite the sincere exertions of this Government and the liberal offers of removal extended to them, certain bands of the Seminole people continue in a state of open defiance within the Territory of Florida. Taking advantage of the almost impenetrable swamps and everglades, these scattered parties persist in their depredations upon our settlements and troops, imposing a heavy and unnecessary burden upon the public treasury and the patience of the nation."
USA_focus_reinforce_florida_command: "Reinforce Florida Command"
USA_focus_reinforce_florida_command_desc: "The operations in Florida have made it abundantly clear that the forces presently employed, though faithful and courageous, are insufficient in number and coordination to overawe the elusive foe and restore tranquility to the settlements. It is therefore my determination that the military command in that department must be strengthened without delay by the addition of regular troops and competent officers, so that the authority of the United States may be more firmly asserted and the campaign prosecuted with greater vigor and unity of purpose."
USA_focus_expand_the_boat_companies: "Expand the Boat Companies"
USA_focus_expand_the_boat_companies_desc: "The singular character of the Florida country, intersected by numerous shallow rivers, lakes, and marshes, has proven the great utility of small companies equipped with light, flat-bottomed boats. These mobile units have repeatedly succeeded in penetrating regions inaccessible to ordinary columns. It is therefore my determination that this valuable arm of the service should be enlarged by the raising of additional volunteer companies, properly armed and equipped, that they may more effectively patrol the inland waters and deny the enemy his accustomed places of refuge."
USA_focus_secure_key_forts: "Secure Key Forts"
USA_focus_secure_key_forts_desc: "The safety of our troops and settlements in Florida depends in no small degree upon the strength and security of our principal military stations. Fort Brooke, Fort Myers, Fort Denaud, and others have too often stood exposed to sudden attack. It is therefore my determination that these important posts should be promptly repaired, strengthened, and adequately garrisoned, so as to serve both as firm bases for offensive operations and as reliable shields for the surrounding country."
USA_focus_develop_swamp_warfare_tactics: "Develop Swamp Warfare Tactics"
USA_focus_develop_swamp_warfare_tactics_desc: "The experience of several campaigns has shown that the ordinary rules of military science are frequently inadequate amid the swamps, hammocks, and tangled waterways of Florida. The enemy, intimately acquainted with the terrain, continues to evade our larger bodies and strike where we are least prepared. It is therefore my determination that our officers and men must diligently study and adopt new methods of warfare adapted to this difficult theater, including the more skillful employment of scouts, small detachments, and coordinated movements by land and water."
USA_focus_raise_local_militia: "Raise Local Militia"
USA_focus_raise_local_militia_desc: "The vast extent of the Florida territory and the scattered nature of its settlements render it impossible for the regular army alone to afford complete protection to all our citizens. In such circumstances, it is both just and prudent to call upon the loyal inhabitants of Florida to bear a larger share in the defense of their own homes and families. It is therefore my determination that the raising and organization of additional militia companies from among the local population should be encouraged and supported with all proper means."
USA_focus_fortify_the_frontier: "Fortify the Frontier"
USA_focus_fortify_the_frontier_desc: "The long continuance of disturbances in Florida has demonstrated the absolute necessity of strengthening our line of frontier posts. Many of these stations remain vulnerable, allowing the enemy to move with comparative freedom through the surrounding country. It is therefore my determination that the principal points along the frontier should be placed in a proper state of defense, repaired where necessary, and furnished with sufficient garrisons to serve as anchors for our operations and bulwarks for the settlements beyond."
USA_focus_escalate_supply_operations: "Escalate Supply Operations"
USA_focus_escalate_supply_operations_desc: "The greatest impediment to success in Florida has often been not the strength of the enemy, but the extreme difficulty of furnishing our troops with regular and adequate supplies amid so inhospitable a region. Great distances, swollen rivers, and miry trails have too frequently left our soldiers in want. It is therefore my determination that the logistical support of the Florida command must be placed upon a more certain and energetic footing, with increased shipments of arms, ammunition, and provisions forwarded by every practicable means."
USA_focus_maintain_public_confidence_in_the_florida_campaign: "Maintain Public Confidence in the Florida Campaign"
USA_focus_maintain_public_confidence_in_the_florida_campaign_desc: "The prolonged conflict in Florida has become a subject of growing discussion and criticism throughout the country. Many citizens, particularly in the Northern States, have begun to question the wisdom and expense of continued operations against the Seminoles. It is therefore essential that the Administration exert every proper effort to maintain public confidence in the necessity and justice of our actions in Florida. Through clear communication of the facts, emphasis upon the protection of American settlements, and steady demonstration of progress, we must sustain the moral and material support of the people for the successful prosecution of this campaign."
USA_focus_final_pacification_drive: "Final Pacification Drive"
USA_focus_final_pacification_drive_desc: "The time has at length arrived when the Florida difficulty must be brought to a decisive termination. Half-measures and protracted operations have failed to extinguish the last embers of resistance. It is therefore my determination that a final and vigorous pacification drive shall be undertaken with all the force and energy the Government can command. Every available resource must be directed toward the complete subjugation of the remaining hostile bands, that peace and security may at last be restored to the Territory of Florida and the long suffering of the nation ended."

### Ideas ###
USA_idea_billy_bowlegs_war: "Billy Bowlegs' War"
USA_idea_billy_bowlegs_war_desc: "Billy Bowlegs' War drags on in the swamps of southern Florida, where Seminole warriors under Billy Bowlegs evade our forces with masterful guerrilla tactics. American troops patrol the Everglades and Big Cypress, suffering heavy attrition from disease, heat, and ambushes while unable to force decisive engagements or penetrate deep into enemy territory.\n\n“a succession of boggy marshes, small lakes, lily ponds, cypress swamps, cabbage and oak hammocks, connected and entirely impassable, even at dry seasons, for man or horse.” - Captain Joseph C. Ives, U.S. Army"
USA_idea_billy_bowlegs_war_2: "Billy Bowlegs' War"
USA_idea_billy_bowlegs_war_desc: "Billy Bowlegs' War drags on in the swamps of southern Florida, where Seminole warriors under Billy Bowlegs evade our forces with masterful guerrilla tactics. American troops patrol the Everglades and Big Cypress, suffering heavy attrition from disease, heat, and ambushes while unable to force decisive engagements or penetrate deep into enemy territory.\n\n“a succession of boggy marshes, small lakes, lily ponds, cypress swamps, cabbage and oak hammocks, connected and entirely impassable, even at dry seasons, for man or horse.” - Captain Joseph C. Ives, U.S. Army"
USA_idea_the_florida_quagmire: "The Florida Quagmire"
USA_idea_the_florida_quagmire_desc: "After more than three million dollars spent and years of effort, the United States has failed to fully remove the Seminoles from Florida. An informal suspension of major operations has taken hold, with patrols restricted and the last scattered bands permitted to remain in the deepest parts of the Everglades and Big Cypress. What was intended as a swift frontier campaign has become a long, expensive embarrassment that continues to drain political will and resources.\n\n“With neither side able to force a final result, a quiet suspension of major operations has taken hold.” - Colonel Gustavus Loomis, Department of Florida"
USA_idea_congressional_funding_for_florida: "Congressional Funding for Florida"
USA_idea_congressional_funding_for_florida_desc: "President Buchanan has signed the Florida Indian Appropriation Act into law. After passing both Houses of Congress, substantial new resources have been secured for Colonel Gustavus Loomis and the Department of Florida. These funds will support sustained operations, improved supply lines, and stronger pressure against the remaining Seminole bands in the Big Cypress Swamp and the Everglades.\n\n“The Government cannot shrink from its duty to protect its citizens and maintain order within its borders, however distant or difficult the task may be.” - President James Buchanan"
USA_idea_florida_campaign_commitment: "Florida Campaign Commitment"
USA_idea_florida_campaign_commitment_desc: "The Administration has affirmed that operations in Florida remain a standing duty of government. Direction has been given that the Department of Florida is to prosecute the campaign with steadiness rather than neglect. This commitment has stiffened official purpose, though it has not by itself supplied new appropriations.\n\n“It is the duty of the Government to protect its citizens on the frontier and to maintain the authority of the Union in every portion of our territory, however distant or difficult the undertaking may prove.” - President James Buchanan"
USA_idea_aggressive_swamp_patrols: "Aggressive Swamp Patrols"
USA_idea_aggressive_swamp_patrols_desc: "Colonel Loomis has ordered a more aggressive posture throughout the Florida theater. American forces are now conducting deeper and more frequent patrols into the Big Cypress and the Everglades, actively seeking out Seminole camps and destroying their hidden stores of food and supplies. Though this places greater strain upon our troops and increases the risk of ambush, it has markedly raised the pressure on the remaining hostile bands.\n\n“We must carry the war into the enemy's own fastnesses. Half-measures will no longer suffice.” - Colonel Gustavus Loomis, Department of Florida"
USA_idea_public_confidence_in_the_florida_campaign: "Public Confidence in the Florida Campaign"
USA_idea_public_confidence_in_the_florida_campaign_desc: "Through careful explanation of the necessity of securing the frontier and protecting American settlements, the Administration has worked to sustain public support for the operations in Florida. While opposition remains in some quarters, a measure of confidence has been restored regarding the conduct and purpose of the campaign\n\n“The Government has a solemn duty to protect its citizens and uphold the authority of the Union in every portion of our territory, however distant or difficult the undertaking may prove.” - President James Buchanan"
USA_idea_major_florida_offensive: "Major Florida Offensive"
USA_idea_major_florida_offensive_desc: "A large-scale offensive has been launched throughout the Big Cypress Swamp and the Everglades. American forces are conducting aggressive deep patrols, destroying Seminole food stores and hidden camps, and pressing the remaining hostile bands with renewed determination. While this effort places considerable strain upon our troops and heightens the risk of ambush, it constitutes the strongest attempt yet to crush the last organized resistance in Florida.\n\n“We have driven them from many of their hiding places. Continued pressure will soon render them unable to maintain any further resistance.” - Colonel Gustavus Loomis, Department of Florida"