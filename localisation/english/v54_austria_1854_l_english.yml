 ## Austria 1854-1857: tooltips, ideas, modifiers
 v54_tt_aus_stance_armed: "Austria chose armed neutrality in the Eastern crisis"
 v54_tt_aus_stance_russia: "Austria chose to stand by Russia in the Eastern crisis"
 v54_tt_aus_stance_west: "Austria joined the Western powers in the Eastern crisis"
 v54_tt_aus_stance_mediation: "Austria chose to mediate in the Eastern crisis"
 AUS_v54_idea_bach_system: "The Bach System"
 AUS_v54_idea_bach_system_desc: "A single administrative system in German governs every crown land from Vienna."
 AUS_v54_idea_court_camarilla: "The Court Camarilla"
 AUS_v54_idea_court_camarilla_desc: "The adjutant-general and the court circle decide promotions and policy, to the army's cost."
 AUS_v54_idea_creditanstalt: "The Creditanstalt"
 AUS_v54_idea_creditanstalt_desc: "A great joint-stock bank finances industry across the Empire."
 AUS_v54_idea_danube_steam: "Danube Steam Navigation"
 AUS_v54_idea_danube_steam_desc: "Steamships carry the grain and timber of the lower Danube to Vienna and the Black Sea."
 AUS_v54_idea_mobilisation_1854: "The Mobilisation of 1854"
 AUS_v54_idea_mobilisation_1854_desc: "More than three hundred thousand men are under arms, and the treasury feels it."
 AUS_v54_idea_hess_plans: "Hess's War Plans"
 AUS_v54_idea_hess_plans_desc: "The quartermaster-general's plans give the army a doctrine and a timetable."
 AUS_v54_idea_radetzky_in_italy: "The Old Marshal"
 AUS_v54_idea_radetzky_in_italy_desc: "Radetzky's name keeps the Italian army loyal and the provinces quiet."
 AUS_v54_idea_the_quadrilateral: "The Quadrilateral"
 AUS_v54_idea_the_quadrilateral_desc: "The fortresses of Verona, Legnago, Mantua and Peschiera cover the road to the Alps."
 AUS_v54_idea_principalities_occupation: "Occupation of the Principalities"
 AUS_v54_idea_principalities_occupation_desc: "Austrian garrisons hold Moldavia and Wallachia, at a cost in men and money."
 v54_om_trade_treaty: "Trade Treaty"
 v54_om_principalities_occupier: "Occupier of the Principalities"
 v54_om_december_treaty: "The Treaty of 2 December"
 v54_decisions_category_aus_1854: "The Empire in 1854"
 v54_decisions_category_aus_1854_desc: "The army, the German states and the Danube in the years of the Eastern war."

 ## Events
 v54_aus.50.t: "Vienna and the Eastern Question"
 v54_aus.50.d: "Count Buol's policy rests on three principles: no help to Russia that would make her master of the Danube, no break with the Tsar that Austria cannot afford, and no war that the finances cannot bear. The Emperor's advisers agree on the principles and quarrel over their application: the generals want mobilisation, Bach wants peace and the court is divided between gratitude and fear.\n\nWhatever is decided, it will be decided in Vienna."
 v54_aus.50.a: "The Empire must choose its course."
 v54_aus.51.t: "The Four Points"
 v54_aus.51.d: "Vienna, London and Paris have agreed on the conditions on which they will negotiate. Russia is to give up her protectorate over the Principalities, the Danube is to be free to all, the Straits convention is to be revised and the Sultan's Christian subjects are to be placed under a collective guarantee. St Petersburg has not accepted, and may refuse.\n\nShould Austria press the terms as they stand, or soften them to keep the Tsar at the table?"
 v54_aus.51.a: "$V54_HISTORICAL_MARK$ Press the Four Points as the basis of peace.\n§gHistorically: the Four Points of August 1854 became the basis of the Vienna Conferences and, in the end, of the Peace of Paris.§!"
 v54_aus.51.b: "Soften the terms to keep Russia at the table."
 v54_aus.52.t: "The Imperial Wedding"
 v54_aus.52.d: "On 24 April the Emperor marries his cousin Elisabeth of Bavaria in the Augustinerkirche. The bride is sixteen and the bridegroom twenty-three. Vienna, which has had little to celebrate since 1848, celebrates now."
 v54_aus.52.a: "A moment of joy for the dynasty."
 v54_aus.53.a: "The wedding takes place."
 v54_aus.54.t: "The Treaty of 20 April"
 v54_aus.54.d: "Prussia has proposed an alliance: the two powers will defend each other's German territory and support one another in the Principalities if Russia does not withdraw. Vienna would gain a partner in the Confederation, and Berlin a claim to be consulted. The other German states are expected to follow.\n\nCount Buol doubts that Prussia will go as far as she promises."
 v54_aus.54.a: "$V54_HISTORICAL_MARK$ Sign the defensive alliance with Prussia.\n§gHistorically: Austria and Prussia signed the treaty on 20 April 1854. The other German states acceded in the course of the year, but Prussia never gave the support that Vienna hoped for.§!"
 v54_aus.54.b: "Decline. Austria will keep its hands free."
 v54_aus.55.t: "The Convention of 14 June"
 v54_aus.55.d: "The Porte has agreed that Austrian troops may occupy the Principalities once the Russians have left, and that the Ottomans will not return without Vienna's consent. Russia has been told that Austria will not stand by while the Danube is closed to her trade.\n\nThe convention would give Austria the lower Danube without a shot, and the Tsar a reason to remember it."
 v54_aus.55.a: "$V54_HISTORICAL_MARK$ Sign the convention.\n§gHistorically: Austria and the Ottoman Empire signed on 14 June 1854. The Russians evacuated the Principalities that summer, and Austrian troops entered them.§!"
 v54_aus.55.b: "Delay and keep the Empire's options open."
 v54_aus.56.t: "Austrian Troops in the Principalities"
 v54_aus.56.d: "The Russians have crossed the Pruth and Austrian columns march into Moldavia and Wallachia. The boyars welcome protection against Russia and fear what Vienna may ask in return, while Britain and France want no more than a guarantee of Ottoman rights.\n\nThe occupation can be total or limited to the Danube line."
 v54_aus.56.a: "$V54_HISTORICAL_MARK$ Occupy both Principalities until a general peace.\n§gHistorically: Austrian troops held the Principalities from the autumn of 1854 until 1857.§!"
 v54_aus.56.b: "Occupy only the Danube line."
 v54_aus.57.t: "The Treaty of 2 December"
 v54_aus.57.d: "Britain and France have asked Austria to commit herself in writing. The three powers would guarantee the Principalities and consult on further measures if Russia rejects the Four Points; Austria would defend the Principalities if Russia attacked them.\n\nIt is the closest the Empire has come to a Western alliance, and the Tsar will take note."
 v54_aus.57.a: "$V54_HISTORICAL_MARK$ Sign the treaty.\n§gHistorically: the treaty of 2 December 1854 bound Austria to the Western powers on paper. Austria did not go to war, and Prussia refused to join, but St Petersburg was forced to take the Four Points seriously.§!"
 v54_aus.57.b: "Sign a weaker declaration without a commitment."
 v54_aus.58.t: "The Vienna Conferences"
 v54_aus.58.d: "The conferences have opened. The third of the Four Points, the limitation of Russian naval power in the Black Sea, is the stumbling block. Austria could propose a compromise that Britain and France consider too weak and Russia too strong, or take the Allies' side, or the Tsar's.\n\nWhatever Vienna says, one side will remember it."
 v54_aus.58.a: "$V54_HISTORICAL_MARK$ Propose a compromise on the Black Sea.\n§gHistorically: Austria proposed a compromise. The conferences broke down in June 1855, and the Western powers lost patience with Vienna.§!"
 v54_aus.58.b: "Side with the Allies on the Black Sea."
 v54_aus.58.c: "Support Russia's objections."
 v54_aus.59.t: "A Letter to the Tsar"
 v54_aus.59.d: "A confidential message from the Emperor to Nicholas assures him that no Austrian soldier will move against Russia as long as the Russian army keeps within its frontiers. The Western chancelleries will hear of it, in time."
 v54_aus.59.a: "Send the letter."
 v54_aus.59.b: "Withhold it. The Empire's options stay open."
 v54_aus.60.t: "A Budget in Deficit"
 v54_aus.60.d: "The finance minister reports a deficit for the third year running. The army of 1849, the railways and the pensions of the Empire's officials cost more than the Empire collects. Three remedies are proposed: new taxes, new loans or cuts, and each has its advocates in the Council."
 v54_aus.60.a: "Raise taxes."
 v54_aus.60.b: "Borrow."
 v54_aus.60.c: "Cut spending."
 v54_aus.61.t: "The Marshal Retires"
 v54_aus.61.d: "Radetzky, in his ninety-first year, has asked to be relieved of the command in Italy. The Emperor wishes to send an archduke, the army wants a soldier and the Italians would prefer anyone who speaks their language and is not a general.\n\nThe choice will show how Vienna means to govern Lombardy-Venetia."
 v54_aus.61.a: "$V54_HISTORICAL_MARK$ Appoint Archduke Maximilian governor-general.\n§gHistorically: Archduke Ferdinand Maximilian, the Emperor's brother, became governor-general of Lombardy-Venetia in 1857 with a mandate for a more conciliatory course, which Vienna did not allow him to follow.§!"
 v54_aus.61.b: "Appoint a general to succeed the marshal."
 v54_aus.63.t: "The Ultimatum"
 v54_aus.63.d: "Count Esterházy has been instructed to present the Tsar's government with a short and final demand: accept the Four Points, with the Black Sea clause, as the basis of peace within a few weeks, or Austria will break off relations. The Emperor hopes it will be enough."
 v54_aus.63.a: "$V54_HISTORICAL_MARK$ Send the ultimatum.\n§gHistorically: the ultimatum of December 1855 persuaded the Russian council to accept the Four Points as the basis of peace, and the Congress of Paris followed.§!"
 v54_aus.63.b: "Postpone it."
 v54_aus.64.t: "Austria at the Congress"
 v54_aus.64.d: "The conference in Paris decides the fate of the Principalities. Britain and Austria oppose their union under a single prince; France and Russia favour it, and Sardinia has been admitted to speak. Count Buol and Baron Hübner must avoid being left alone.\n\nAustria can oppose the union, or accept it under a foreign prince."
 v54_aus.64.a: "$V54_HISTORICAL_MARK$ Oppose the union of the Principalities.\n§gHistorically: Austria opposed the union at Paris. The question was left to the Principalities, and in 1859 they elected the same prince.§!"
 v54_aus.64.b: "Accept union under a foreign prince."
 v54_aus.65.t: "The Semmering Opens"
 v54_aus.65.d: "On 17 July the first trains cross the Semmering pass on Carl von Ghega's railway. Its viaducts and tunnels climb a mountain that engineers had thought impassable, and Vienna is joined to Trieste by rail."
 v54_aus.65.a: "A triumph of engineering."
 v54_aus.66.t: "The Creditanstalt"
 v54_aus.66.d: "The Creditanstalt für Handel und Gewerbe, founded by the Rothschilds and their partners, opens in Vienna. Modelled on the Crédit Mobilier of Paris, it promises to finance the railways and factories that the state cannot."
 v54_aus.66.a: "The Empire has its first great bank."
 v54_aus.71.t: "The Hungarian Question"
 v54_aus.71.d: "A report on Hungary describes the kingdom as quiet and sullen. The gentry pay their taxes and speak to nobody; the peasantry, freed from serfdom in 1848, are loyal to the Emperor who confirmed their freedom. Archduke Albrecht's administration has kept order, but a careful reader of the report would ask for how long.\n\nShould the system continue unchanged, or should the gentry be given a role in the counties?"
 v54_aus.71.a: "$V54_HISTORICAL_MARK$ Leave the administration as it is.\n§gHistorically: the Bach system and Archduke Albrecht's administration continued unchanged until the defeat of 1859 forced a change of course.§!"
 v54_aus.71.b: "Offer the gentry a role in the counties."
 v54_aus.75.t: "The Emperor in Italy"
 v54_aus.75.d: "The Emperor and Empress visit the Italian provinces. Crowds are polite and the aristocracy stays at home. The Emperor can mark the visit with an amnesty for political prisoners and the lifting of the sequestrations, or insist that order must come first."
 v54_aus.75.a: "$V54_HISTORICAL_MARK$ Proclaim an amnesty.\n§gHistorically: the Emperor pardoned political prisoners and lifted the sequestrations during his visit of 1856-57, without changing the Italians' feelings.§!"
 v54_aus.75.b: "Order first: no amnesty."
 v54_eur.60.t: "The Austrian Ultimatum"
 v54_eur.60.d: "Austria has presented the Tsar's government with a short and final demand: accept the Four Points as the basis of negotiation, or face a break in relations. Sevastopol has fallen, the finances are strained and Prussia has not moved. The council must decide whether to accept or to risk Austria's entry into the war."
 v54_eur.60.a: "$V54_HISTORICAL_MARK$ Accept the ultimatum.\n§gHistorically: after a council in Saint Petersburg in January 1856 Alexander II accepted the Four Points. The armistice followed, and the Congress of Paris met in February.§!"
 v54_eur.60.b: "Reject the ultimatum."
 v54_eur.61.t: "The Death of Nicholas I"
 v54_eur.61.d: "The Tsar has died at the Winter Palace. Nicholas I had ruled for thirty years and stood for the conservative order of Europe; his son Alexander II inherits a lost war and an empire in need of reform. The new Tsar must decide whether to continue the war or to seek peace."
 v54_eur.61.a: "$V54_HISTORICAL_MARK$ Continue the war while looking for a way out.\n§gHistorically: Alexander II continued the war until Sevastopol fell in September 1855 and accepted peace terms in early 1856.§!"
 v54_eur.61.b: "Seek peace at once."

 ## Decisions
 v54_aus_dec_mobilise_galicia: "Reinforce the Galician Frontier"
 v54_aus_dec_mobilise_galicia_desc: "More regiments are sent to Galicia and Transylvania, to watch the Russian army and to show that Austria's neutrality is armed."
 v54_aus_dec_gendarmerie_patrols: "Gendarmerie Patrols"
 v54_aus_dec_gendarmerie_patrols_desc: "Mounted gendarmes ride through the provinces. Order is kept and complaints are not heard."
 v54_aus_dec_bamberg_conference: "Rally the Middle German States"
 v54_aus_dec_bamberg_conference_desc: "The governments of Bavaria, Saxony, Württemberg and Hesse meet at Bamberg and are persuaded to support Austria's Eastern policy in the Federal Diet, against the neutrality that Prussia prefers."
 v54_aus_dec_sell_state_railways: "Sell State Railway Lines"
 v54_aus_dec_sell_state_railways_desc: "Lines built by the state are offered to private companies, mostly French and Viennese, for a lump sum that the treasury needs."
 v54_aus_dec_withdraw_from_principalities: "Withdraw from the Principalities"
 v54_aus_dec_withdraw_from_principalities_desc: "With the peace signed, the garrisons march home, as Vienna promised, and the boyars send their thanks."