 ## Prussian opening branch 1854-1857
 PRS_v54_the_eastern_crisis: "Prussia and the Eastern Crisis"
 PRS_v54_the_eastern_crisis_desc: "Russia is at war with the Ottoman Empire, Britain and France are preparing to join the Sultan, and every capital wants to know where Prussia stands. The King regards the Tsar as family and the Western powers as heirs of the Revolution, but Berlin cannot afford to be on the losing side of a great war."
 PRS_v54_manteuffels_neutrality: "Manteuffel's Neutrality"
 PRS_v54_manteuffels_neutrality_desc: "The Minister-President will keep Prussia out of the war and out of every alliance that could drag her in. Neutrality is not heroic, but it spares the army, the finances and the King's conscience, and it leaves Berlin free to move when the other powers are exhausted.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_russian_party: "The Russian Party"
 PRS_v54_the_russian_party_desc: "The Gerlach brothers and the Kreuzzeitung circle hold that the monarchical powers must stand together against the West. The King listens, and the Tsar is assured of a benevolent neutrality that costs Prussia nothing on the Vistula and a good deal in London."
 PRS_v54_the_western_party: "The Western Party"
 PRS_v54_the_western_party_desc: "Bunsen, Bethmann-Hollweg and the liberal conservatives of the Wochenblatt see in Britain Prussia's natural partner and in Russian autocracy her natural rival. They persuade the Prince of Prussia, but not the King."
 PRS_v54_the_bonin_affair: "The Bonin Affair"
 PRS_v54_the_bonin_affair_desc: "General von Bonin, the Minister of War, has spoken openly for an understanding with the Western powers, and Bunsen in London has sent the King a memorandum urging the same. The court is outraged, and the King must decide how to answer the two men who tell him what he does not want to hear.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_april_treaty: "The Treaty of 20 April"
 PRS_v54_the_april_treaty_desc: "Vienna proposes a defensive alliance: the two German powers would guarantee each other's German territory and act together in the Principalities if Russia does not withdraw. Manteuffel wants a treaty that binds Austria without binding Prussia.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_frankfurt_diet: "The Federal Diet"
 PRS_v54_the_frankfurt_diet_desc: "Austria asks the Confederation to endorse her Eastern policy and to prepare its contingents. Prussia's young envoy in Frankfurt warns that the Confederation must not become Vienna's army, and Berlin must decide how far to follow him.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_bamberg_states: "The Bamberg Conference"
 PRS_v54_the_bamberg_states_desc: "Bavaria, Saxony, Württemberg, Hesse and others meet at Bamberg and declare for Austria. A bloc of middle states under Vienna's leadership is exactly what Prussian policy has tried to prevent since Olmütz.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_excluded_from_vienna: "Excluded from Vienna"
 PRS_v54_excluded_from_vienna_desc: "The conferences at Vienna are held without Prussia. Neutrality has kept her out of the war and out of the councils of the great powers, and the King feels the slight more than his ministers do."
 PRS_v54_admission_to_the_congress: "Admission to the Congress of Paris"
 PRS_v54_admission_to_the_congress_desc: "The victors agree, after some hesitation, to invite Prussia to sign the peace as one of the powers that signed the Treaty of Vienna of 1815. Manteuffel goes to Paris to sign a settlement he had no hand in making.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_manteuffel_ministry: "The Manteuffel Ministry"
 PRS_v54_the_manteuffel_ministry_desc: "Otto von Manteuffel has governed Prussia since 1850 on the principle that the King rules and the ministers obey. The constitution of 1850 is kept in the letter and ignored in spirit, the Landtag is managed, and every liberal in the kingdom waits for the old King to die.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_legacy_of_olmutz: "The Legacy of Olmütz"
 PRS_v54_legacy_of_olmutz_desc: "In 1850 Prussia gave way to Austrian demands rather than risk war over Hesse and the Union of Erfurt. Four years later the officers and the nationalists have not forgotten the retreat, and the ministers who signed it have not forgotten that they signed it."
 PRS_v54_the_herrenhaus: "The Herrenhaus"
 PRS_v54_the_herrenhaus_desc: "The elected First Chamber is to be replaced by a House of Lords of hereditary and royal members. The conservatives see in it the pillar of the monarchy, the liberals the end of what remains of the constitution.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_kreuzzeitung_party: "The Kreuzzeitung Party"
 PRS_v54_the_kreuzzeitung_party_desc: "The King listens to Ernst Ludwig von Gerlach, to his brother the general-adjutant and to the writers of the Neue Preußische Zeitung. Church, Crown and a Christian state are their programme, and they regard Manteuffel as a bureaucrat and Bismarck as a useful man."
 PRS_v54_the_wochenblatt_party: "The Wochenblatt Party"
 PRS_v54_the_wochenblatt_party_desc: "Moritz August von Bethmann-Hollweg and the liberal conservatives of the Preußisches Wochenblatt want a strong state under law, an orderly Landtag and an understanding with Britain. They are loyal, educated and patient, and they have the Prince of Prussia's ear."
 PRS_v54_police_and_censorship: "Police and the Press"
 PRS_v54_police_and_censorship_desc: "Hinckeldey's Berlin police and Stieber's informants watch the clubs and the newspapers. Order is kept, and the memory of 1848 is kept alive on both sides of the watching."
 PRS_v54_the_stiehl_regulations: "The Stiehl Regulations"
 PRS_v54_the_stiehl_regulations_desc: "Ferdinand Stiehl's regulations for the elementary schools put religion and the catechism at the centre of the curriculum and limit the teacher training colleges to the three Rs. The conservatives call it the cure for 1848, and the teachers call it something else.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_prince_of_prussia: "The Prince of Prussia"
 PRS_v54_the_prince_of_prussia_desc: "Wilhelm, the King's brother and heir presumptive, was the man who fled to London in 1848 and returned a soldier. He commands the Rhine army, dislikes the camarilla and distrusts the Western liberals, and he thinks about the army more than anything else."
 PRS_v54_the_landtag_elections: "The Elections of 1855"
 PRS_v54_the_landtag_elections_desc: "The Landtag is to be elected under the three-class franchise. The Eastern war has divided the conservatives, and the Landräte have been reminded which candidates the King prefers.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_kings_illness: "The King's Illness"
 PRS_v54_the_kings_illness_desc: "Friedrich Wilhelm IV has suffered a stroke and his mind is no longer what it was. The court is divided about who should act in his name, and the army, the ministers and the liberals each have a candidate.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_zollverein_in_1854: "The Zollverein in 1854"
 PRS_v54_the_zollverein_in_1854_desc: "The customs union that Prussia founded in 1834 now covers nearly all of Germany outside Austria and the Hanseatic towns. It pays for itself, it binds the middle states to Berlin more firmly than any treaty, and Vienna has tried and failed to break it."
 PRS_v54_hanover_joins: "Hanover Joins the Zollverein"
 PRS_v54_hanover_joins_desc: "The Steuerverein of Hanover, Oldenburg and their neighbours has been dissolved and its members have entered the Zollverein. The north German coast is now inside the Prussian customs system, and the old rivalry between the two blocs is over.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_trade_treaty_with_austria: "The Trade Treaty with Austria"
 PRS_v54_trade_treaty_with_austria_desc: "The treaty of 1853 gave Austria a privileged tariff and Prussia a promise that Vienna would not insist on membership. It is a compromise that neither side loves and both can live with."
 PRS_v54_railway_boom: "The Railway Boom"
 PRS_v54_railway_boom_desc: "Lines are being opened across Prussia as fast as the engineers can lay them. Berlin is joined to the Rhine, to Silesia and to the Baltic ports, and the locomotive works of Borsig and Egells cannot keep up with the orders.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_berlin_banks: "Banks for Berlin"
 PRS_v54_berlin_banks_desc: "Joint-stock banks open in Berlin on the French model: the Berliner Handels-Gesellschaft, the Disconto-Gesellschaft's expansion, and the Darmstädter Bank in the Rhine towns. Railways, mines and ironworks find the capital they need, and the Prussian bourse grows rich on their shares.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_ruhr_and_silesia: "The Ruhr and Silesia"
 PRS_v54_the_ruhr_and_silesia_desc: "Coal and iron in Westphalia and Upper Silesia are the foundation of Prussian power. New pits and ironworks are opened every year, supported by railways, German engineers and a growing army of workers from the countryside."
 PRS_v54_the_jade_treaty: "The Jade Treaty"
 PRS_v54_the_jade_treaty_desc: "In 1853 Oldenburg ceded a strip of the Jade Bight to Prussia for a naval harbour on the North Sea. The land is a marsh, and Prince Adalbert sees in it the future of the Prussian fleet."
 PRS_v54_the_army_in_1854: "The Prussian Army in 1854"
 PRS_v54_the_army_in_1854_desc: "The army that stood down at Olmütz and enforced order in Baden is a conscript force with a small cadre and a large Landwehr. The King distrusts the Landwehr, the Prince of Prussia distrusts the liberals, and the budget has not changed in a decade."
 PRS_v54_partial_mobilisation: "Partial Mobilisation"
 PRS_v54_partial_mobilisation_desc: "Several corps are placed on a war footing along the eastern frontier and in Silesia. The King does not intend to fight; he wishes to be taken seriously by Vienna and Petersburg. The cost is paid in gold and in the patience of the reservists."
 PRS_v54_the_needle_gun: "The Needle Gun"
 PRS_v54_the_needle_gun_desc: "Dreyse's breech-loading Zündnadelgewehr has been in service since 1841, and by the 1850s most of the line infantry carry it. No other army has anything like it, and the Prussian General Staff is only beginning to understand what it means for tactics.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_general_staff_under_reyher: "The General Staff under Reyher"
 PRS_v54_the_general_staff_under_reyher_desc: "General von Reyher, the Chief of the General Staff, is a careful and conservative officer who keeps the plans up to date and the railways surveyed. The Staff has not yet become what it will be, but the habits that will make it are in place."
 PRS_v54_the_landwehr_question: "The Landwehr Question"
 PRS_v54_the_landwehr_question_desc: "The Landwehr, the citizen reserve created in 1813, is the army's second line and the liberals' favourite. The King and the Prince of Prussia want it reduced; its supporters say that it is the nation in arms. The argument will come to a head in the next reign."
 PRS_v54_roons_memoranda: "Roon's Memoranda"
 PRS_v54_roons_memoranda_desc: "Colonel Albrecht von Roon, geographer, soldier and devout Lutheran, has written a series of papers on how the army ought to be organised: a longer term of service, a stronger line and a Landwehr kept in the second rank. They are not for publication.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_moltke_chief_of_staff: "A New Chief of the General Staff"
 PRS_v54_moltke_chief_of_staff_desc: "Reyher has died and the King must name a successor. Helmuth von Moltke, who has served in Turkey and as adjutant to Prince Friedrich Wilhelm, is the candidate of the younger officers; the court would prefer someone less clever.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_prince_adalberts_fleet: "Prince Adalbert's Fleet"
 PRS_v54_prince_adalberts_fleet_desc: "Prince Adalbert, the King's cousin, commands the small Prussian navy: a few sailing frigates, a number of gunboats and the hopes of every patriot who looks at the Baltic. The Jade Bight is the next step, and the King is not sure he wants to pay for it."
 PRS_v54_prussia_in_the_confederation: "Prussia in the Confederation"
 PRS_v54_prussia_in_the_confederation_desc: "Austria holds the presidency of the German Confederation and the middle states look to Vienna. Prussia has the Zollverein, the army and the north, and the memory of Olmütz. The Federal Diet in Frankfurt is where the two powers measure each other every day."
 PRS_v54_bismarck_in_frankfurt: "Bismarck in Frankfurt"
 PRS_v54_bismarck_in_frankfurt_desc: "The envoy to the Federal Diet, a Pomeranian Junker of thirty-nine, has gone to Frankfurt as an admirer of Austria and is learning that Austria treats Prussia as a junior partner. His dispatches are brilliant, frank and unwelcome, and Manteuffel does not know what to do with him.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_middle_states: "The Middle States"
 PRS_v54_the_middle_states_desc: "Bavaria, Saxony, Württemberg and Hanover want to preserve their independence of both great powers and are happiest when the two cancel each other out. Prussia cannot win them against Austria, but it can make them less certain of Vienna."
 PRS_v54_the_gotha_liberals: "The Gotha Liberals"
 PRS_v54_the_gotha_liberals_desc: "The men of the Union of Erfurt, defeated in 1850, have not given up their plan for a lesser Germany under the Hohenzollerns. They meet at Gotha, publish in the Grenzboten and wait for a Prussian government that wants what they want."
 PRS_v54_the_duchies_question: "The Duchies Question"
 PRS_v54_the_duchies_question_desc: "Copenhagen has promulgated a common constitution for the Kingdom and the duchies, and German opinion in Holstein and the Confederation reacts angrily. The London Protocol of 1852, which Prussia signed, has settled the succession; it has not settled the argument.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_english_marriage: "A Match with England"
 PRS_v54_the_english_marriage_desc: "Prince Friedrich Wilhelm, the Prince of Prussia's son, has gone to Balmoral and come back engaged to Victoria, the Princess Royal. The liberals are delighted, the camarilla is not, and Queen Victoria has expectations of what the match will do for Germany.\n\n$V54_HISTORICAL_PATH$"
 PRS_v54_the_neuchatel_crisis: "The Neuchâtel Crisis"
 PRS_v54_the_neuchatel_crisis_desc: "The King of Prussia is also, by an old arrangement, Prince of Neuchâtel, a Swiss canton that has been a republic since 1848. A royalist rising has failed, the Swiss hold the prisoners, and Berlin has to decide how far to go for a principality that nobody in Prussia really wants.\n\n$V54_HISTORICAL_PATH$"
