l_english:

 VIN_cochinchina_expedition_resolve: "DEBUG: The Court Holds"
 VIN_cochinchina_expedition_resolve_desc: "Cancels the bankruptcy surrender_limit malus while the Cochinchina Expedition is running, so [VIN.GetName] cannot collapse the moment Hue falls."

 ###########################################################
 # Decisions & Missions
 ###########################################################
 FRA_cochinchina_expedition_support_malina_port: "Assist Spanish Port Investment"
 FRA_cochinchina_expedition_support_malina_port_desc: "Manila is the only anchorage in the eastern seas deep enough to stage an expedition from. If the Spanish will not pay to deepen it, we shall."
 FRA_cochinchina_expedition_support_malina_port_tooltip: "\nThe §Y[FRA.GetName]§! and the §Y[SPR.GetName]§! gain §YImproved Relations§!, which grants a change of §G+25§! Opinion between both nations.\n"
 SPR_develop_manila_port_decision_started: "Has started expanding Manila's port infrastructure"
 SPR_interest_in_cochinchina_expedition_trigger: "Still has interest in the §YCochinchina Expedition§!"
 SPR_cochinchina_expedition_has_not_began: "The §YCochinchina Expedition§! has not started"

 SPR_cochinchina_expedition_ready_for_invasion: "Ready for Cochinchina Expedition"
 SPR_cochinchina_expedition_ready_for_invasion_desc: "Powder, transports and marines are gathered at the staging port. Once the preparations are declared complete, our partners will be told that we are ready to sail."

 SPR_cochinchina_expedition_begin_invasion: "Begin the Cochinchina Expedition"
 SPR_cochinchina_expedition_begin_invasion_desc: "Once the Cochinchina Expedition is prepared, a joint invasion of Cochinchina will begin by those that agreed to it."
 SPR_cochinchina_expedition_begin_invasion_ready_trigger: "The §YCochinchina Expedition§! is ready to start"
 SPR_cochinchina_expedition_begin_invasion_trigger: "§YSpain§! gives the order to begin the expedition"
 FRA_cochinchina_expedition_begin_invasion_trigger: "§YFrance§! gives the order to begin the expedition"

 SPR_cochinchina_expedition_take_port_mission: "Invasion on Cochinchina"
 SPR_cochinchina_expedition_dai_nam_broken_trigger: "§Y[VIN.GetName]§! has been broken and sues for terms"
 SPR_cochinchina_expedition_take_port_mission_desc: "Sai Gon commands the rice of the delta, Hue holds the Court, and the northern cities hold the rest. Nothing short of breaking [VIN.GetName] outright will bring the Emperor to the table - and if the expedition cannot manage it, it will be called home."

 SPR_cochinchina_expedition_sail_for_saigon: "Sail South for Sai Gon"
 SPR_cochinchina_expedition_sail_for_saigon_desc: "Tourane cannot be broken out of. The anchorage is a graveyard, fever is doing what the Vietnamese guns cannot, and no Christian rising is coming to meet us.\n\nThe squadron can lift the whole corps and put it ashore before the citadel of Sai Gon instead - but the beachhead here will be given up to do it."
 SPR_cochinchina_expedition_holds_tourane_trigger: "The corps still holds the beachhead at §YTourane§!"
 SPR_cochinchina_expedition_not_the_senior_partner_trigger: "The §Ysenior partner§! commands the squadron"
 SPR_cochinchina_expedition_state_controlled_trigger: "Is controlled by a §YEuropean§! participant"
 SPR_cochinchina_expedition_state_not_controlled_trigger: "Is not controlled by §Y[VIN.GetName]§!"
 VIN_cochinchina_expedition_hold_the_ports_trigger: "Hold §YSai Gon§! until the foreign expedition exhausts itself"

 ###########################################################
 # Events
 ###########################################################
 cochinchina_expedition.2.t: "Rising Catholic Influence in [286.GetName]!"
 cochinchina_expedition.2.d: "The foreign missions have grown bold. Their converts number in the hundreds of thousands, they answer to bishops in Paris and Madrid rather than to the Court, and the mandarins warn that a faith with a foreign master is an army with a foreign flag. The priests are within our reach - what is to be done with them?"
 cochinchina_expedition.2.a: "Crack down and execute the missionaries!"
 cochinchina_expedition.2.b: "Let them be."

 cochinchina_expedition.3.t: "Missionaries Killed in [286.GetName]!"
 cochinchina_expedition.3.d: "Word has reached us that two of our missionaries have been put to death by order of the Court at Hue. Such affronts have been swallowed before, but our squadrons are already in eastern waters, and there are voices at court arguing that an insult of this kind is precisely the opening an empire waits for."
 cochinchina_expedition.3.a: "Maybe we should intervene in Cochinchina?"
 cochinchina_expedition.3.b: "This is an outrage!"

 cochinchina_expedition.4.t: "[FROM.GetName] Outraged By Missionary Execution!"
 cochinchina_expedition.4.d: "[FROM.GetName] shares our fury at the executions, yet stops short of sailing. A single flag over the expedition means a single flag over whatever it wins - but two flags mean twice the marines, and the Court at Hue can count."
 cochinchina_expedition.4.a: "Let's ask [FROM.GetName] for a joint intervention."
 cochinchina_expedition.4.b: "We can do this alone."

 cochinchina_expedition.5.t: "[FROM.GetName] Requests Joint Expedition in Cochinchina!"
 cochinchina_expedition.5.d: "[FROM.GetName] proposes that our two nations act together against the Court at Hue: a joint squadron, a joint landing, and a joint settlement at the end of it. Our missionaries died alongside theirs, and their transports would carry our marines - but the senior partner in such a venture is rarely the one that supplies the fewer ships."
 cochinchina_expedition.5.a: "Tell them we're with them."
 cochinchina_expedition.5.b: "We will not intervene in Cochinchina."

 cochinchina_expedition.6.t: "[FROM.GetName] Joins the Cochinchina Expedition!"
 cochinchina_expedition.6.d: "[FROM.GetName] has agreed to sail with us. Their squadron will join ours, and the expedition will go east under two flags."
 cochinchina_expedition.6.a: "Onwards to Cochinchina!"

 cochinchina_expedition.7.t: "[FROM.GetName] Declines the Cochinchina Intervention!"
 cochinchina_expedition.7.d: "[FROM.GetName] will not sail. Whatever is taken in the east will be taken by our marines alone - and kept by us alone."
 cochinchina_expedition.7.a: "We didn't need them anyway!"

 cochinchina_expedition.8.t: "[FROM.GetName] Funds Manila's Port Expansion!"
 cochinchina_expedition.8.d: "[FROM.GetName] has quietly settled the bill for deepening the anchorage and enlarging the magazines at Manila. It is a generous gesture between allies, and an expensive reminder of who is paying for this expedition."
 cochinchina_expedition.8.a: "Much appreciated!"

 cochinchina_expedition.18.t: "Begin the Cochinchina Expedition!"
 cochinchina_expedition.18.d: "The squadron has its orders. The marines are aboard, the gunboats are coaled, and the bay of Tourane lies open before us. There will be no declaration beyond the first broadside."
 cochinchina_expedition.18.a: "To War!"

 cochinchina_expedition.19.t: "Franco-Spanish Force Lands at Tourane!"
 cochinchina_expedition.19.d: "The squadron stood into the bay at dawn, silenced the forts with a few hours' fire and put the marines ashore. The town was in European hands by evening. What no one aboard yet understands is that taking Tourane and leaving Tourane are two very different problems."
 cochinchina_expedition.19.a: "The beachhead is ours."
 cochinchina_expedition.19.b: "Contain them on the sand. Let the fever do the rest."
 cochinchina_expedition.19.c: "So it begins in the east as well."

 cochinchina_expedition.20.t: "The Expedition Sails South!"
 cochinchina_expedition.20.d: "Tourane is abandoned. The corps has been taken aboard, carried down the coast and landed at the mouth of the Sai Gon river, where the granaries of the delta lie open and the citadel is the only thing standing between the expedition and the Court's supply of rice."
 cochinchina_expedition.20.a: "On to the citadel!"
 cochinchina_expedition.20.b: "They have gone for the granaries!"
 cochinchina_expedition.20.c: "A shrewd change of front."

 cochinchina_expedition.23.t: "Cochinchina Landing Fails!"
 cochinchina_expedition.23.d: "The landing has achieved nothing. Fever has done more damage to our regiments than the enemy's guns, the promised Christian rising never came, and the garrison is pinned to the beach with no prospect of moving inland. There is nothing left to win here."
 cochinchina_expedition.23.a: "Call off the expedition!"

 cochinchina_expedition.24.t: "Cochinchina Landing Success!"
 cochinchina_expedition.24.d: "The foreign squadron has weighed anchor and gone. Their marines never broke out of the sand and the swamp, and the ports they came for remain ours. Let the Court record that the barbarians were outlasted."
 cochinchina_expedition.24.a: "We have succeeded!"

 cochinchina_expedition.26.t: "The Citadel of Hue is Stormed!"
 cochinchina_expedition.26.d: "The imperial capital has fallen. The Court fled inland ahead of our columns, the dynastic seals were left behind in the palace, and the mandarinate has watched the Son of Heaven driven out of his own citadel by three thousand marines.\n\nWe will not keep the city - the treaty will be about the southern provinces, as it was always going to be. But an army that has taken Hue can ask for whatever it likes."
 cochinchina_expedition.26.a: "The Emperor has no capital."

 cochinchina_expedition.27.t: "Sai Gon Falls!"
 cochinchina_expedition.27.d: "The citadel on the river is ours and the granaries with it. The delta no longer feeds the imperial army - but the Court has not yet asked for terms, and until it does the expedition has not won anything it can keep."
 cochinchina_expedition.27.a: "Now make them ask for peace."

 cochinchina_expedition.364.t: "[VIN.GetName] Capitulates!"
 cochinchina_expedition.364.d: "It is over. The imperial armies have broken, the provinces are overrun, and the Court has sent word that it will hear our terms. What those terms are is now entirely a European question."
 cochinchina_expedition.364.a: "Excellent!"

 cochinchina_expedition.365.t: "The Ultimatum to [VIN.GetName]"
 cochinchina_expedition.365.d: "The terms are drafted: the free practice of the faith, the cession of the southern provinces, an indemnity, and open ports. The only question left is whose signatures will appear at the bottom of the treaty."
 cochinchina_expedition.365.a: "Leave Spain out of the peace negotiations."
 cochinchina_expedition.365.b: "Invite Spain to the peace negotiations."
 cochinchina_expedition.365.c: "May the peace negotiations commence."

 cochinchina_expedition.3655.t: "France Leaves Spain Out of Negotiations!"
 cochinchina_expedition.3655.d: "Our ambassador has been informed, with every courtesy, that his presence at the negotiations will not be required. Spanish blood took those forts and Filipino troops broke the counterattack, and this is the accounting we are offered."
 cochinchina_expedition.3655.a: "Maldita Sea! Those French have betrayed us!"
 cochinchina_expedition.3655.b: "They couldn't do this without us! Press the issue!"

 cochinchina_expedition.3656.t: "Spain Demands Attendance!"
 cochinchina_expedition.3656.d: "Madrid protests, loudly and in public. They are not wrong about the fighting, and a quarrel aired in the European press would cost us more than a seat at a table ever could - but a share of the table is a share of the spoils."
 cochinchina_expedition.3656.a: "We don't want to sower the relations further..."
 cochinchina_expedition.3656.b: "What can they do about it? We're stronger."

 cochinchina_expedition.3657.t: "France Invites Spain to the Negotiations!"
 cochinchina_expedition.3657.d: "Paris has relented. Our plenipotentiary will sit at the table as an equal, and the settlement will bear a Spanish signature as well as a French one."
 cochinchina_expedition.3657.a: "Just as agreed!"

 cochinchina_expedition.3658.t: "France Doubles Down!"
 cochinchina_expedition.3658.d: "Paris will not move. We are thanked for our assistance, offered a share of the indemnity, and shown the door. Our soldiers died for a footnote in someone else's treaty."
 cochinchina_expedition.3658.a: "We will never forget this betrayal!"

 cochinchina_expedition.366.t: "Surrender and End the Expedition?"
 cochinchina_expedition.366.d: "The southern citadels have fallen one after another, the delta is lost, and there is a rising in Tonkin that will not wait for us to finish this war. The barbarians offer terms. They are humiliating, and they are the only ones we will be offered."
 cochinchina_expedition.366.a: "We have no other choice..."

 cochinchina_expedition.21.t: "[VIN.GetName] Accepts Demands!"
 cochinchina_expedition.21.d: "The plenipotentiaries of the Court have come aboard and signed. The provinces are ceded, the faith is legalised, the ports are opened and the indemnity is agreed. The expedition is over."
 cochinchina_expedition.21.a: "The expedition is over."

 cochinchina_expedition.3611.t: "End of the Cochinchina Expedition!"
 cochinchina_expedition.3611.d: "The war in the eastern seas has ended with a treaty signed aboard a warship at anchor. A European colony now sits astride the mouth of the Mekong, and the Court at Hue has learned what a punitive expedition costs."
 cochinchina_expedition.3611.a: "Interesting."
 cochinchina_expedition.3611.b: "To the new colonies!"
 cochinchina_expedition.3611.c: "This is terrible!"