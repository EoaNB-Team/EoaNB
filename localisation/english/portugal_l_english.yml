 ##########################################################################
 # EVENTS - MINISTRY OF OVERSEAS TERRITORIES
 ##########################################################################
 portugal.50.t: "The Colonial Reforms of 1859"
 portugal.50.d: "The vastness of Portugal's overseas empire demands a centralised and efficient administrative body. With the Ministry of Overseas Territories now standing, the reforms of this year must decide how far Lisbon truly intends to govern.\n\nThe governors of Angola, Mozambique, Goa and Macau have for generations enjoyed a freedom that owed more to distance than to law. To bind them to a single ministry is to promise better governance, more reliable resource extraction and a coherent defence of our possessions - and to accept the resentment of every captaincy that profits from the present disorder."
 portugal.50.a: "Order shall be imposed from Lisbon"
 portugal.50.b: "Leave the governors to their own devices"

 portugal.51.t: "Silva Porto's Expeditions"
 portugal.51.d: "António Francisco Ferreira da Silva Porto, sertanejo and trader, has once more set out from Benguela into the interior. Where the Crown hesitates, men such as he simply go.\n\nHis caravans have already crossed lands no Portuguese official has ever seen, and the maps he brings back are worth more than a squadron. If Lisbon will support him, the 'Hinterland' between Angola and Mozambique may yet be claimed by right of occupation rather than by argument in a European conference hall."
 portugal.51.a: "Chart the interior"
 portugal.51.b: "Lisbon has no coin for adventurers"

 ##########################################################################
 # EVENTS - THE PORTUGUESE-CHINESE FRIENDSHIP TREATY
 ##########################################################################
 portugal.52.t: "The Portuguese Offer Us a Treaty"
 portugal.52.d: "The note was brought today from the Portuguese representation in Macau. The requests are obvious - the Portuguese want to conclude a treaty with us for cooperation and trade. Faced with the difficult choice of trying to resist foreign influences in our politics, or to acquiesce and lean on foreigners, our Empire stands divided.\n\nOn the one hand, signing such a treaty would improve our relations with Portugal. On the other hand, however, such a treaty could lead to the complete looting and destruction of our country as we know it."
 portugal.52.a: "We should accept it"
 portugal.52.b: "Better to prolong it"
 portugal.52.c: "We will not negotiate with the Portuguese"

 portugal.53.t: "Portuguese-Chinese Friendship Treaty"
 portugal.53.d: "The Treaty of Friendship and Trade between Portugal and China strengthens our trade relations and formalises the growing interactions between our nations. It provides our merchants with clearer opportunities to conduct business in China, reflecting our shared commitment to facilitating commerce and mutual prosperity.\n\nA key aspect of the treaty addresses Macau. While it avoids directly mentioning sovereignty, it recognises our administrative role in the territory, allowing us to maintain order and ensure stability without unnecessary political disputes.\n\nFor us, this treaty represents an important step in securing our position in East Asia. It reaffirms our commitment to a stable and cooperative relationship with China while ensuring the continuation of our economic and diplomatic endeavours in the region."
 portugal.53.a: "A good day for Portugal"

 portugal.54.t: "The Qing Court Delays"
 portugal.54.d: "The Zongli Yamen has neither signed nor refused. Our representative in Macau reports that the draft has been passed from bureau to bureau, each of which finds it easier to add a marginal note than to take a decision.\n\nThe treaty is not dead. It is merely waiting, and it will wait until either Beijing is persuaded or Lisbon runs out of patience. Gifts, envoys and the careful cultivation of the right officials will decide which comes first."
 portugal.54.a: "We shall press our case in Beijing"

 portugal.55.t: "Increasing Tension on the Macau Border"
 portugal.55.d: "The Qing court has rejected our approach outright, and the mood beyond the barrier gate has hardened accordingly. Imperial troops have appeared in the villages of the Passaleão road, customs officials have begun to obstruct our lorchas, and the Chinese population of the peninsula has grown noticeably confident.\n\nThe governor requests instructions. There are none to give beyond the obvious: hold the gate."
 portugal.55.a: "Reinforce the barrier gate"

 portugal.56.t: "The Qing Ratifies the Treaty"
 portugal.56.d: "The Qing court formally ratified the Portuguese-Chinese Friendship Treaty, solidifying the agreements reached between Portugal and China. This treaty emphasises mutual cooperation in trade and governance while clarifying Macau's political and juridical status, although it carefully avoids addressing the sensitive issue of sovereignty.\n\nWith the ratification, Portugal secures an important step toward stabilising its presence in Macau, ensuring smoother commercial exchanges and a framework for diplomatic relations. For the Qing Empire, the treaty offers a way to regulate interactions with Portugal while maintaining broader control over its regional interests.\n\nThe ratification marks a formal acknowledgment of the treaty's terms and establishes a foundation for future relations. While not a moment of great fanfare, it is a significant milestone in fostering understanding and cooperation between the two nations."
 portugal.56.a: "At last"

 portugal.57.t: "The Qing Refuses to Ratify the Treaty"
 portugal.57.d: "In a surprising turn of events, the Qing court declined to ratify the Portuguese-Chinese Friendship Treaty, leaving the agreements between Portugal and China unresolved. This decision introduces uncertainty regarding Macau's status and complicates the intended framework for trade and diplomatic cooperation.\n\nFor Portugal, the refusal is a setback in its efforts to secure a formalised and stable presence in the region. The lack of ratification delays opportunities to establish clearer terms of engagement and heightens tensions over unresolved issues. On the Qing side, the decision likely reflects internal deliberations or concerns over the treaty's implications for sovereignty and control.\n\nThough not the outcome Portugal had anticipated, this refusal leaves open the possibility for future negotiation. It also serves as a reminder of the complexities in navigating relations with an empire balancing external pressures and internal priorities."
 portugal.57.a: "We shall try again later"
 portugal.57.b: "The Qing shall not dictate Portugal's path to glory!"

 portugal.58.t: "The Passaleão Incident Repeats All Over Again..."
 portugal.58.d: "Tensions flare once more as echoes of the Passaleão incident return to haunt Macau. Disputes between Portuguese authorities and Qing forces escalate, with misunderstandings and confrontations threatening the fragile peace in the region. This new wave of unrest revives memories of the earlier conflict, where territorial claims and sovereignty were hotly contested.\n\nBoth sides tread cautiously, knowing the risks of allowing these disputes to spiral further. For Portugal, it is a challenge to maintain its authority in Macau without provoking greater resistance from the Qing. For the Chinese Empire, it represents a delicate balance of asserting its dominance while avoiding the appearance of instability to foreign powers.\n\nThe repetition of these events underscores the lingering tensions that treaties and agreements have failed to fully resolve. It is a reminder that Macau remains a contentious frontier where cultural, political, and territorial interests collide."
 portugal.58.a: "Hold the barrier gate"

 portugal.59.t: "The Passaleão Incident Repeats All Over Again..."
 portugal.59.d: "Tensions flare once more as echoes of the Passaleão incident return to haunt Macau. Disputes between our officials and the Portuguese authorities escalate, with misunderstandings and confrontations threatening the fragile peace of the peninsula.\n\nFor our Empire this is a delicate balance: to assert our dominance over a territory that has never ceased to be ours, while avoiding any appearance of instability before the foreign powers who watch every quarrel on the coast with hungry interest."
 portugal.59.a: "Macau will not be surrendered to the barbarians"

 portugal.60.t: "Victory at the Barrier Gate"
 portugal.60.d: "The confrontation on the Passaleão road has ended in our favour. The Qing detachments have withdrawn beyond the barrier, the customs obstructions have quietly ceased, and the mandarins of Canton have discovered a sudden willingness to discuss the treaty they had refused to read.\n\nWe negotiate now not as supplicants but from the position we have always claimed and rarely enjoyed. The terms shall reflect it."
 portugal.60.a: "Dictate our terms"

 portugal.61.t: "Macau is Lost..."
 portugal.61.d: "The unthinkable has come to pass - Macau, the cornerstone of Portugal's presence in the East, slips from our grasp. What was once a symbol of Portuguese endurance and maritime ambition is now a stark reminder of shifting tides and the fragility of overseas holdings.\n\nUnder mounting pressure from the Qing authorities and increasing isolation from local allies, Portugal finds itself unable to maintain effective control. The promises of treaties and diplomatic assurances prove insufficient against the realities of geopolitical change.\n\nMacau's loss is not just territorial but symbolic, marking a turning point in Portugal's role on the global stage. It calls into question our ability to sustain influence in distant lands, leaving behind the echoes of a proud legacy and a future clouded by uncertainty."
 portugal.61.a: "A stain upon the Crown"

 portugal.62.t: "The Loss in Macau"
 portugal.62.d: "The bitter taste of defeat lingers as our forces suffer a loss in Macau against the Portuguese. Despite the strength of our numbers and the justness of our cause, the enemy's strategic advantages and stubborn resolve turn the tide against us.\n\nThis setback is a harsh reminder of the challenges we face in protecting our sovereignty. The loss of lives and resources weighs heavily, and the Portuguese, emboldened by their victory, strengthen their grip on this vital territory. The humiliation of losing on our own soil deepens the wounds already inflicted by foreign encroachments.\n\nYet this loss does not mark the end of our resolve. It serves as a lesson and a call to action, urging us to strengthen our forces and renew our strategies. Macau remains a symbol of the struggle for our empire's dignity, and though we falter today, the fight for justice is far from over."
 portugal.62.a: "A lesson, not an ending"

 ##########################################################################
 # EVENTS - THE TIMOR GOVERNANCE
 ##########################################################################
 portugal.63.t: "The Portuguese Proposal?"
 portugal.63.d: "Today, the Portuguese Government offered us a solution to the pressing issue of the island of Timor and the Indonesian region. On the basis of preserving peace and tranquillity in the region, the Dutch and Portuguese Governments must come to some kind of definitive consensus on this matter.\n\nWhether this will have a positive effect for us is, however, of the utmost importance for the further development of our country and our colonies in Asia. The Portuguese, though well-meaning in coming to us, must not be trusted. The future of the region depends on our decision."
 portugal.63.a: "Accept the Portuguese terms"
 portugal.63.b: "Refuse"

 portugal.64.t: "The Treaty of Demarcation and Trade"
 portugal.64.d: "The Treaty of Demarcation and Exchange shall mark a turning point in the delicate balance of power between Portugal and the Netherlands in the distant Archipelago of Solor and Timor. Long have these islands been a source of contention, their fertile lands and strategic harbours coveted by both our realms. Yet, through this accord, a new chapter shall be written - one of order and mutual recognition.\n\nPortugal, steadfast in its mission to preserve its foothold in these islands, shall maintain dominion over key territories in Timor. These lands, a testament to our enduring influence, shall remain under our governance, serving as a bastion for our missions and a symbol of our sovereignty. Meanwhile the Netherlands, with its focus on commercial expansion, shall claim Solor and its surrounding isles, securing a vital link in its spice trade network.\n\nThis treaty, carefully negotiated, aims not only to resolve disputes but also to avert future conflict. The boundaries drawn upon these distant shores shall stand as an acknowledgment of each nation's rightful sphere of influence, respecting the strength and aspirations of both Portugal and the Netherlands. It is an agreement born not of conquest but of prudence, recognising that the cost of endless rivalry outweighs the benefits of cooperation.\n\nBy this accord, peace shall be preserved, allowing each of our empires to focus on the greater endeavours that lie ahead. Let this treaty not be seen as a division of land but as a pact of wisdom, ensuring prosperity and stability for both nations in this contested corner of the world."
 portugal.64.a: "The eastern frontier is settled"

 portugal.65.t: "The Treaty of Demarcation and Trade"
 portugal.65.d: "The Treaty of Demarcation and Exchange shall mark a turning point in the delicate balance of power between Portugal and the Netherlands in the distant Archipelago of Solor and Timor. Long have these islands been a source of contention, their fertile lands and strategic harbours coveted by both our realms. Yet, through this accord, a new chapter shall be written - one of order and mutual recognition.\n\nThe Netherlands, steadfast in its mission to preserve its foothold in these islands, shall maintain dominion over key territories in Timor and Indonesia. These lands, a testament to our enduring influence, shall remain under our governance, serving as a bastion for our missions and a symbol of our sovereignty, while our commercial expansion shall claim Solor and its surrounding isles, securing a vital link in our spice trade network.\n\nThis treaty, carefully negotiated, aims not only to resolve disputes but also to avert future conflict. The boundaries drawn upon these distant shores shall stand as an acknowledgment of each nation's rightful sphere of influence, respecting the strength and aspirations of both the Netherlands and Portugal. It is an agreement born not of conquest but of prudence, recognising that the cost of endless rivalry outweighs the benefits of cooperation.\n\nBy this accord, peace shall be preserved, allowing each of our empires to focus on the greater endeavours that lie ahead."
 portugal.65.a: "Solor is ours"

 portugal.66.t: "The Netherlands Refused the Treaty!"
 portugal.66.d: "After not-so-lengthy talks with the Dutch, we have not been able to reach an adequate solution regarding the Timor region. It is not known why the Dutch Government refused our offer, but it is certain that we must continue to press for a permanent solution in order to ensure peace in the region.\n\nThe change of mood in Dutch political life with regard to this treaty and to our country are indicative of the shifting geopolitical layers that are detrimental to our country."
 portugal.66.a: "Do something about it"
 portugal.66.b: "There is nothing to be done"

 portugal.67.t: "The Portuguese Suggest a New Territorial Treaty"
 portugal.67.d: "Our refusal the first time did not stop the Portuguese government from trying a second time. The news that has come from Lisbon relates to more favourable provisions in the treaty for us. Perhaps now is the time to accept this offer.\n\nThere is a chance that we will not be given this opportunity in the future, but we must not let our guard down. The Portuguese are prepared to do anything to get their way..."
 portugal.67.a: "Accept"
 portugal.67.b: "Refuse"

 portugal.68.t: "The Timor Territorial Exchange"
 portugal.68.d: "The Treaty of Demarcation and Exchange shall mark a turning point in the delicate balance of power between Portugal and the Netherlands in the distant Archipelago of Solor and Timor. Long have these islands been a source of contention, their fertile lands and strategic harbours coveted by both our realms.\n\nPortugal shall maintain dominion over key territories in Timor, serving as a bastion for our missions and a symbol of our sovereignty, while the Netherlands shall claim Solor and its surrounding isles. It is an agreement born not of conquest but of prudence, recognising that the cost of endless rivalry outweighs the benefits of cooperation."
 portugal.68.a: "Signed at last"

 portugal.69.t: "The Timor Territorial Exchange"
 portugal.69.d: "The Treaty of Demarcation and Exchange settles the long quarrel over the Archipelago of Solor and Timor. The Netherlands shall retain its dominion in Timor and Indonesia and shall claim Solor and its surrounding isles, securing a vital link in our spice trade network.\n\nIt is an agreement born not of conquest but of prudence, recognising that the cost of endless rivalry outweighs the benefits of cooperation."
 portugal.69.a: "Signed at last"

 portugal.70.t: "The Dutch Government Didn't Come to an Agreement with Us"
 portugal.70.d: "Once more, discussions with the Dutch have ended without a resolution. Despite our efforts to present reasonable terms, their government remains unyielding, and no agreement has been reached regarding the issues surrounding the Timor region. The reasons behind their continued reluctance remain unclear, but it is evident that this impasse threatens the stability we aim to uphold.\n\nThis repeated failure to find common ground underscores a concerning shift in Dutch attitudes toward our nation. Such changes in their political stance not only hinder progress but also highlight the growing complexities in regional geopolitics. We must persist in seeking a fair and lasting solution to secure peace and stability in the region, regardless of the challenges posed by their government's indecision."
 portugal.70.a: "Do something about it"
 portugal.70.b: "There is nothing to be done"

 portugal.71.t: "Demilitarization in Portuguese Timor?"
 portugal.71.d: "In an effort to resolve longstanding tensions with the Dutch regarding the Timor region, the Portuguese government has put forward a proposal for mutual demilitarisation. This initiative seeks to establish a framework for peace and stability by reducing military presence in the area while focusing on the urgent matter of defining clear borderlines between our territories.\n\nThe proposal underscores their commitment to diplomacy and cooperation, aiming to eliminate the causes of conflict and promote goodwill between the two nations. In return, they expect us to engage constructively and agree to a definitive demarcation of borders, ensuring that both sides can uphold their respective sovereignty without further disputes.\n\nWhile the success of this initiative depends on our response, such an agreement would mark a significant step toward peace in the region and set a precedent for resolving future conflicts through dialogue rather than force."
 portugal.71.a: "Accept"
 portugal.71.b: "Refuse"

 portugal.72.t: "The Timor Demarcation"
 portugal.72.d: "Both Portugal and the Netherlands have reached a mutual agreement to resolve the territorial uncertainties in Timor through a treaty of demarcation and demilitarisation. While not a groundbreaking moment in history, this practical step brings clarity to a previously contentious issue, ensuring peaceful coexistence and reducing potential for conflict.\n\nThe treaty establishes definitive borders between Portuguese and Dutch holdings in Timor and sets provisions for the reduction of military presence in the region. This compromise reflects the shared commitment of both nations to stability and cooperation, avoiding unnecessary escalation and fostering trust.\n\nAs the agreement comes into effect, both Portugal and the Netherlands can move forward with greater confidence in the governance of their territories. This accord serves as a modest yet meaningful step in maintaining peace and demonstrating the value of diplomacy in addressing regional challenges."
 portugal.72.a: "Peace on the frontier"

 portugal.73.t: "The Timor Demarcation"
 portugal.73.d: "Both the Netherlands and Portugal have reached a mutual agreement to resolve the territorial uncertainties in Timor through a treaty of demarcation and demilitarisation. This practical step brings clarity to a previously contentious issue, ensuring peaceful coexistence and reducing potential for conflict.\n\nAs the agreement comes into effect, both nations can move forward with greater confidence in the governance of their territories. This accord serves as a modest yet meaningful step in maintaining peace and demonstrating the value of diplomacy in addressing regional challenges."
 portugal.73.a: "Peace on the frontier"

 portugal.74.t: "Yet Another Failure..."
 portugal.74.d: "Negotiations with the Dutch have once again concluded without success. Despite our efforts to propose fair and balanced terms, their government has shown no willingness to reach an understanding. The exact reasons for their resistance remain unclear, but this continued stalemate jeopardises the prospects of stability in the Timor region.\n\nThis persistent inability to find agreement points to a troubling shift in the Dutch political approach toward us. Their reluctance not only delays progress but also reflects the increasingly complex and unfavourable dynamics in regional relations. We remain committed to pursuing a solution that ensures lasting peace and order, despite these ongoing challenges."
 portugal.74.a: "The frontier remains undrawn"

 portugal.75.t: "Increasing Resistance in Timor"
 portugal.75.d: "Reports from Timor indicate growing unrest among the local population, threatening the stability of Portuguese governance in the region. Its fertile lands and strategic position affirm our presence in Southeast Asia; yet the resilience of its people, coupled with external pressures, now poses a challenge that cannot be ignored.\n\nThe resistance manifests in various forms, from sporadic uprisings to coordinated defiance of colonial authority. Tribal leaders, emboldened by the rugged terrain and the deep-rooted traditions of their communities, refuse to yield to measures of control and taxation. While Portugal has sought to bring order to Timor, these efforts are met with suspicion and hostility by those who view our presence as an encroachment upon their autonomy.\n\nAdding to the complexity are whispers of foreign influence, as rival powers seek to undermine our authority by fostering dissent among the local populace. The island's strategic value makes it a prize not only for its resources but as a foothold in the broader contest for dominance in the region.\n\nIn response, measures must be taken to reinforce Portuguese rule. Diplomatic overtures to tribal leaders, combined with strategic military action, may help quell the unrest. Equally vital is the promotion of education, infrastructure and trade, to demonstrate the benefits of alignment with the Portuguese Crown."
 portugal.75.a: "The liurai must be brought to heel"

 ##########################################################################
 # EVENTS - STAND IN CENTRAL AFRICA
 ##########################################################################
 portugal.76.t: "Portugal Advances in Kongo's Inlands!"
 portugal.76.d: "Portuguese columns have moved inland from the coast, planting the flag in the valleys of the Zaire that our kings have claimed since the days of the first Christian rulers of São Salvador. They come with treaties in one hand and muskets in the other, and they do not intend to leave.\n\nThe court is divided. Some counsel resistance while there is still a kingdom to defend; others observe, with more truth than comfort, that the men who resist will be the same men who starve when the coast is closed to us."
 portugal.76.a: "Do something about it"
 portugal.76.b: "There's nothing we can do"

 portugal.77.t: "Álvaro XIII Takes the Throne"
 portugal.77.d: "The great houses have spoken and the escravos de igreja have laid down the royal insignia before Álvaro XIII Ndongo. The Portuguese candidate has been abandoned by all but his own family, and Lisbon's envoys have withdrawn to Ambriz with nothing to show for their coin.\n\nKongo remains a kingdom, and remains its own. Whether it will remain either for long is another question entirely."
 portugal.77.a: "Kongo endures"

 portugal.78.t: "Pedro V Elelo Takes the Throne"
 portugal.78.d: "Dom Pedro has been crowned at São Salvador, and the Portuguese flag flies over the fort that overlooks the ceremony. The Kivuzi family has its king, Lisbon has its client, and the kingdom has a sovereign who cannot rule for a week without the coast remaining open to him.\n\nThe forms of Kongolese kingship are preserved in every particular. Only the substance has changed."
 portugal.78.a: "The Kivuzi have their king"

 portugal.79.t: "Our Candidate Has Failed"
 portugal.79.d: "Álvaro XIII Ndongo has been crowned at São Salvador. Every escudo spent, every envoy sent and every crate of muskets landed at Ambriz has bought us nothing but the enmity of the man who now wears the crown.\n\nThere remains one instrument we have not yet employed."
 portugal.79.a: "Then it shall be settled by arms"

 portugal.80.t: "Dom Pedro is Crowned"
 portugal.80.d: "Our candidate sits upon the throne of São Salvador. The kingdom of Kongo remains, in name, an independent Christian monarchy of ancient lineage; in practice it is administered from Luanda and its revenues flow through Portuguese hands.\n\nIt is, on the whole, a considerably cheaper arrangement than conquest."
 portugal.80.a: "Our candidate sits upon the throne"

 portugal.81.t: "The Kongo Slips Away"
 portugal.81.d: "The garrisons were never assembled. Fever, distance and the eternal shortage of transports have done what no Kongolese army could, and the men who were to hold the interior are still waiting at Luanda for ships that did not come.\n\nLisbon has no choice but to release its hold and pretend the decision was its own."
 portugal.81.a: "Lisbon lets go"

 portugal.82.t: "The Kongo Held"
 portugal.82.d: "Twenty thousand men stand between São Salvador and the sea, and every chief from the Zaire to the Kwango has understood the arithmetic. The world is evolving, and Portugal has demonstrated that it can evolve with it.\n\nThe Empire holds."
 portugal.82.a: "The Empire holds"

 ##########################################################################
 # FLAVOUR EVENTS
 ##########################################################################
 portugal.83.t: "Café Leão d'Ouro"
 portugal.83.d: "The history of the Café Leão d'Ouro begins with the name Comuna. The origin of this name is due to the fact that it is rumoured to be a meeting place for liberals, republicans and socialists, and for this reason it was frequently watched by the police.\n\nIt brought together the liberals of the time who, in carefree conversations, discussed and prepared elaborate conspiracies. This reality meant that the police were there almost every day... We should look more closely at this place."
 portugal.83.a: "Let the police keep their notebooks"

 portugal.84.t: "The King's Royal Train"
 portugal.84.d: "The Comboio Real Português stands as a remarkable symbol of nineteenth-century engineering and regal sophistication. Introduced to serve the Portuguese monarchy, this train combines luxury with practicality, offering a means of travel befitting the royal family while showcasing the advancements of the national railway system.\n\nDesigned with the utmost attention to detail, the Comboio Real features elegant interiors, plush seating and ornate decor, reflecting the grandeur expected of royal accommodations. Its use underscores the monarchy's embrace of modern transportation technologies, ensuring both convenience and prestige as the train transports the royal family across the country.\n\nMore than a mode of transport, the Comboio Real Português represents the intersection of Portugal's rich traditions and its aspirations for modernisation."
 portugal.84.a: "Awesome!"

 portugal.85.t: "Palácio Castelo Melhor"
 portugal.85.d: "The Palácio Castelo Melhor, recently completed in Lisbon, is a testament to Portuguese architectural excellence and the ambitions of the noble Castelo Melhor family. This newly constructed residence, though not among the largest in the city, embodies a refinement and elegance that reflect the family's social stature.\n\nThe palace features a harmonious blend of classical Portuguese design and modern touches, with its intricate stone façades and tastefully arranged interiors marking it as a model of contemporary aristocratic taste.\n\nAs one of the city's latest architectural accomplishments, the Palácio Castelo Melhor speaks to a future where tradition and innovation coexist, underscoring the family's enduring influence and their contribution to Lisbon's ever-evolving urban landscape."
 portugal.85.a: "A beacon of noble heritage"

 portugal.86.t: "The Jesuit College in Campolide"
 portugal.86.d: "The Colégio Jesuíta de Campolide, established by the Jesuits in 1858 in Lisbon, stands as a prominent educational institution dedicated to providing rigorous and faith-oriented instruction. Located in the Campolide area, the college serves as a hub for intellectual and spiritual development, embodying the Jesuit mission of combining academic excellence with moral and religious guidance.\n\nEducating the sons of Portugal's elite, the college shapes future leaders grounded in Catholic values. Its curriculum emphasises classical studies, philosophy and theology, fostering discipline and moral integrity among its students. Beyond its role as a school, the institution symbolises the Jesuit influence in Portuguese society during a time of significant political and social change."
 portugal.86.a: "Knowledge, faith and service"

 portugal.87.t: "Mercantil Union Company"
 portugal.87.d: "The Companhia União Mercantil, a modest enterprise established during a time of growing commercial activity, serves primarily as a facilitator of small-scale trade and local manufacturing. Focused on regional markets, it plays a quiet but functional role in supporting merchants and connecting them to broader supply chains.\n\nThough its impact is limited and its operations unremarkable in the larger scheme of things, the company represents the entrepreneurial spirit of the time - a period when even small ventures sought to carve out a niche in Portugal's evolving economy."
 portugal.87.a: "The entrepreneurial spirit of the age"

 portugal.88.t: "Teatro Baquet"
 portugal.88.d: "The Teatro Baquet, newly opened in the heart of Porto, marks a vibrant addition to the city's cultural life. Built to accommodate the growing appetite for theatrical performances and artistic expression, this elegant venue is already becoming a focal point for entertainment and social gatherings.\n\nDesigned with a keen eye for both function and beauty, the theatre boasts a richly adorned interior with comfortable seating and excellent acoustics, creating an inviting atmosphere for audiences. Its opening heralds a new chapter for Porto's artistic community."
 portugal.88.a: "Porto deserves a stage"

 portugal.89.t: "Custódio Cardoso Pereira"
 portugal.89.d: "Custódio Cardoso Pereira stands out as a meticulous artisan and innovator in the field of scientific instruments. His work, rooted in precision and functionality, has made him a notable figure in Portuguese craftsmanship. Operating during a time of increasing industrial and scientific progress, Pereira's instruments embody both utility and artistry, serving researchers, educators and navigators alike.\n\nThe quality and accuracy of his creations reflect a dedication to the burgeoning needs of science and education. From finely calibrated compasses to other essential tools, his contributions support Portugal's ambitions to remain at the forefront of maritime and academic advancements."
 portugal.89.a: "Craft in the service of science"

 portugal.90.t: "Casa Bancária Fonseca"
 portugal.90.d: "The Casa Bancária Fonseca emerges as an emblem of entrepreneurial ambition within the Portuguese financial sector. Operating as a private banking house, it offers an array of services tailored to the needs of local businesses and individual clients, particularly during a period of growing economic activity.\n\nFounded by individuals with a clear vision for providing reliable and personalised financial solutions, the bank plays a key role in supporting trade, commerce and development projects. It is known for its discretion, trustworthiness and adaptability, attributes that make it a respected institution among its clientele."
 portugal.90.a: "Discretion and trust"

 portugal.91.t: "Casa Havaneza"
 portugal.91.d: "Casa Havaneza stands as a symbol of refinement and distinction in Lisbon, offering an exceptional selection of cigars and tobacco products since its founding. Known as a haven for connoisseurs, it has cultivated a reputation as a place where quality and tradition come together to serve discerning tastes.\n\nThe shop, with its inviting atmosphere and dedication to the finest products, attracts a loyal clientele, including notable figures and aficionados. Casa Havaneza is more than just a tobacco shop - it is a cultural landmark, embodying Lisbon's cosmopolitan spirit."
 portugal.91.a: "A cultural landmark"

 portugal.92.t: "Rafael Castro Ordoñez Photographs the Cape Verde Islands"
 portugal.92.d: "Rafael Castro Ordoñez's visit to the Cape Verde Islands, during which he took a series of photographs, provides a modest but insightful glimpse into the region during his time. His work captured elements of daily life, landscapes and colonial architecture, offering a visual record of the islands under Portuguese rule.\n\nWhile not a groundbreaking event, these photographs contribute to a broader understanding of Cape Verde's cultural and environmental context in the nineteenth century. Ordoñez's images, though not widely influential, serve as a quiet testament to the role of photography in documenting the colonial world."
 portugal.92.a: "Cool"

 portugal.93.t: "A Fire in Lisbon"
 portugal.93.d: "This night, a tragic fire engulfed Antiga Casa Baltresqui, a well-known establishment in Lisbon, leaving the community in shock. This renowned shop, celebrated for its fine selection of goods and distinguished clientele, was more than a retail space - it was a symbol of Lisbon's evolving commercial elegance.\n\nThe blaze causes extensive damage, reducing years of craftsmanship, tradition and commerce to ashes. The loss resonates deeply, as the shop was not merely a business but a part of the city's cultural and economic fabric. The exact cause of the fire remains under investigation.\n\nDespite the devastation, the event underscores the resilience of Lisbon's commercial community, which has already begun rallying support for rebuilding."
 portugal.93.a: "Lisbon will rebuild"

 portugal.94.t: "Teatro do Príncipe Real"
 portugal.94.d: "The Teatro do Príncipe Real, a notable addition to Lisbon's cultural tapestry, rises as a beacon of artistic expression and entertainment. Built to serve the city's growing appetite for theatre and opera, this venue is a centrepiece for the performing arts, reflecting Lisbon's ambition to elevate its cultural standing.\n\nKnown for its architectural elegance, the theatre offers a welcoming space for performers and audiences alike. Its repertoire ranges from dramatic productions to musical spectacles, attracting both local talent and international acclaim."
 portugal.94.a: "A cherished institution"

 portugal.95.t: "Lisbon Astronomical Observatory"
 portugal.95.d: "The Observatório Astronómico de Lisboa, located in Tapada da Ajuda, is established as part of Portugal's efforts to modernise its scientific infrastructure. Primarily focused on timekeeping and astronomy, the observatory plays a practical role in supporting navigation, a field essential to Portugal's maritime tradition.\n\nDesigned by the French architect Jean Colson and inaugurated with the guidance of the Portuguese mathematician and astronomer Frederico Augusto Oom, the observatory includes instruments and resources to assist in astronomical observations. Though it is not a leading centre of global innovation, it contributes to improving navigation and cartography, aligning with Portugal's historical strengths."
 portugal.95.a: "Timekeeping for the fleet"

 portugal.96.t: "New Cadres from the Navy Academy"
 portugal.96.d: "The Navy Academy's newest cadres, including the promising young officer Roberto Ivens, represent the fresh wave of talent destined to shape Portugal's maritime and colonial ambitions. Known for his keen intellect and adventurous spirit, Ivens has already attracted attention as a figure poised to take part in expeditions of great significance - perhaps even to Angola, a region central to Portugal's colonial aspirations.\n\nWhile no expedition has yet been confirmed, whispers within naval circles suggest that Ivens's training and aptitude make him an ideal candidate for such an undertaking. His preparation at the Navy Academy, blending rigorous maritime discipline with advanced scientific studies, ensures that he is equipped not only to navigate but to document and explore the untamed interior of Portugal's African holdings.\n\nShould such a mission come to pass, it would exemplify the Academy's role in producing officers capable of serving both the Crown and the broader interests of the nation."
 portugal.96.a: "Cool"

 portugal.97.t: "Vapros Lisbonenses"
 portugal.97.d: "Vapros Lisbonenses, established in 1860, emerges as a key shipbuilding company at a time when Portugal is seeking to revitalise its maritime industry and assert itself on the global stage. Founded in Lisbon, the heart of Portugal's maritime tradition, this enterprise reflects a renewed ambition to modernise the fleet and reinforce the nation's presence on the seas.\n\nThe company was born out of the pressing need to adapt to advancements in naval technology and to meet the demands of both commercial and military seafaring. As steam-powered vessels begin to dominate global waters, Vapros Lisbonenses takes on the mission of constructing modern ships that can compete with those of other European powers.\n\nEarly endeavours focus on crafting merchant ships and smaller military vessels, utilising both traditional shipwright skills and newer techniques that incorporate iron and steam propulsion. The shipyard has quickly become a centre of innovation and employment, contributing to Lisbon's economy and providing a tangible boost to Portugal's naval capabilities."
 portugal.97.a: "A modern yard for a modern fleet"

 portugal.98.t: "Vapros Lisbonenses Changes!"
 portugal.98.d: "In 1888, Frederico Burnay Sucessores incorporated the old Vapros Lisbonenses, marking a significant milestone for the regional shipbuilding industry. Building on its founder's vision, the company focuses on constructing and maintaining ships, catering primarily to local shipping companies and maritime enterprises operating around Lisbon and nearby ports.\n\nWhile its influence does not extend far beyond the region, the incorporation allows Frederico Burnay Sucessores to establish a stronger foothold in the competitive shipbuilding market. The formalisation of its operations underscores the ongoing evolution of Portuguese industry during the late nineteenth century."
 portugal.98.a: "Consolidation"

 portugal.99.t: "The Lisbon Steamship Partnership"
 portugal.99.d: "In 1899, the Lisbon Steamship Partnership took a decisive step in expanding its operations by incorporating Frederico Burnay Sucessores into its portfolio. This acquisition marks a strategic move to consolidate regional shipbuilding resources and enhance the partnership's capacity to meet the increasing demand for modern steam-powered vessels.\n\nWhile Frederico Burnay Sucessores had primarily been a regional shipbuilder with a modest footprint, its incorporation provides the Lisbon Steamship Partnership with valuable infrastructure and technical expertise. This merger allows the partnership to streamline production processes, secure a steadier supply of vessels and strengthen its competitive position within the maritime sector of southern Europe.\n\nBy absorbing Frederico Burnay Sucessores, the Lisbon Steamship Partnership fortifies its role as a key player in Portugal's shipping landscape."
 portugal.99.a: "Steam is the standard"

 portugal.100.t: "The Portuguese Expedition to São Salvador"
 portugal.100.d: "The Portuguese Expedition to São Salvador is a delicate mission, framed within the intricate and volatile politics of the Kingdom of Kongo. As the kingdom faces a critical succession crisis, Lieutenant Zacharias da Silva Cruz leads a Portuguese delegation to São Salvador, tasked with facilitating the late king's Christian burial. This act, central to Kongo's customs and governance, would pave the way for the election of a new ruler.\n\nThe Portuguese contingent, accompanied by two priests, set out from Bembe, navigating a tense political landscape. Along their journey they encountered the Marquis of Katendi and Álvaro, the Duke of Mbamba, who claimed to be safeguarding the royal insignia outside the capital. This controversial move was said to honour Henrique II's wishes but raised suspicions of undermining São Salvador's traditional authority.\n\nUpon arrival in the near-deserted capital - its population dramatically diminished due to fears of impending conflict - the Portuguese were greeted by armed followers of the two main rivals for the throne: Dom Pedro and Álvaro Ndongo. The situation was fraught with tension, as both candidates refused to yield. Ndongo, perceived as the popular choice with significant backing from Kongo's elite, had heavily armed his supporters, while Pedro relied on the influential Kivuzi family and his connections to Portugal.\n\nDespite our declared impartiality, tensions simmer, with Ndongo openly accusing Portugal of favouring his rival."
 portugal.100.a: "We stand impartial - officially"
 portugal.100.b: "Back Dom Pedro openly"

 portugal.101.t: "The Second Zambezi Expedition"
 portugal.101.d: "The Second Zambezi Expedition, under the command of Dr. David Livingstone, represents another ambitious step by the British Empire in its pursuit of exploration, commerce and civilising influence in Africa. This mission, focused on the vast Zambezi River and its surrounding territories, is more than an exploratory venture - it is a testament to Britain's enduring commitment to the ideals of progress and moral responsibility.\n\nLivingstone's charge is not only to map the river and assess its potential as a commercial highway but also to extend the Empire's influence by spreading Christian values and combating the entrenched horrors of the slave trade. The Zambezi, with its tributaries and fertile lands, is seen as a lifeline to open up the interior of the continent to British trade and civilisation.\n\nThe expedition is not without its challenges. The terrain is unforgiving, disease looms as an ever-present threat, and the local dynamics are complex, requiring diplomacy as much as determination. Yet these obstacles are met with the resolve characteristic of British endeavours."
 portugal.101.a: "The British Empire rules the Zambezi"

 portugal.102.t: "Livingstone on the Zambezi"
 portugal.102.d: "The movements of David Livingstone along the Zambezi River, under the banner of the British Empire, are met with careful scrutiny from Portugal. This region, historically tied to Portuguese exploration and influence, remains central to our interests in Africa, particularly as we maintain claims over the lands and peoples along the Zambezi and its tributaries.\n\nLivingstone's mission, cloaked in the language of exploration and philanthropy, is understood by Portugal as part of Britain's broader ambitions to expand its presence in territories traditionally within our sphere. His endeavours to open trade routes and bring the interior under British sway cannot be viewed in isolation; they signal a challenge to the stability of Portuguese influence.\n\nWhile Portugal recognises the value of exploration and the importance of combating the scourge of the slave trade, we remain cautious of any actions that undermine our sovereignty or diminish our legacy as pioneers in Africa."
 portugal.102.a: "Worrying..."

 portugal.103.t: "A British Expansion in Mozambique"
 portugal.103.d: "We have set our sights firmly on Maputo Bay, recognising its immense potential as a strategic and commercial hub within southern Africa. This region, rich in resources and offering unparalleled access to vital trade routes, cannot be left solely in the hands of the Portuguese - a power whose influence in the area wanes with each passing year.\n\nOur traders and representatives, with the full support of British enterprise, have begun to establish a foothold along the bay. These efforts, while primarily driven by commerce, carry a broader significance. A stronger British presence in Maputo Bay not only bolsters our influence in Mozambique but also secures a critical position in the wider network of southern African trade.\n\nThe Portuguese, ever protective of their diminishing claims, may view our actions with suspicion. Yet we proceed with the confidence that our endeavours are justified by the principles of free trade and by the evident incapacity of their administration to fully realise the bay's potential."
 portugal.103.a: "Nothing will stop us"

 portugal.104.t: "A British Expansion in Mozambique"
 portugal.104.d: "The British encroach upon our rightful holdings in Mozambique, their actions in Maputo Bay growing bolder with each passing day. They come under the guise of trade, establishing posts and deploying their ships, but their intent is clear - to challenge our sovereignty in a land that has been Portuguese for centuries.\n\nWe see their ambition for what it is: an attempt to weaken our influence and claim a strategic foothold in southern Africa. Maputo Bay is not just a point on the map; it is a vital artery of trade and governance, a testament to our enduring legacy in Africa.\n\nTheir actions demand a response. We cannot allow the British, with their ever-expanding empire, to dictate terms in Mozambique. We must fortify our presence, strengthen our defences, and make clear through both diplomacy and action that our sovereignty is not to be trifled with."
 portugal.104.a: "Worrying, but they are our allies after all..."

 portugal.105.t: "Smallpox Epidemic in Kongo and Angola"
 portugal.105.d: "The smallpox epidemic sweeping through the Kingdom of Kongo and Angola is a devastating episode, marking one of the most severe public health crises in the region's recent history. The disease spreads rapidly, leaving a trail of death and despair in its wake, as local communities struggle to comprehend and contain the outbreak.\n\nTrade routes, both along the coast and into the interior, have become unintentional conduits for the disease. The epidemic does not discriminate, affecting rulers and subjects alike, and causing significant disruptions to governance and social order. Entire villages are abandoned as survivors flee the contagion.\n\nIn Angola, under Portuguese administration, efforts to curb the outbreak are hampered by limited medical resources and an incomplete understanding of the disease. Quarantine measures are inconsistent and often ineffective, with local populations wary of colonial interference.\n\nDespite the devastating human toll, the epidemic also highlights the resilience of the affected communities. Families and neighbours band together to care for the sick and bury the dead."
 portugal.105.a: "Quarantine what we can"

 # --- events with broken or absent keys ---
 portugal.23.t: "A Cruiser Worthy of the Name"
 portugal.23.d: "The Arsenal has laid down the plans for a heavy cruiser of our own design. She is to carry the name of the navigator who opened the sea road to the Indies, and she is to be the yardstick against which every later Portuguese warship is measured."
 portugal.23.a: "Lay down the Vasco da Gama"
 portugal.34.d: "The fort at São Salvador is the only masonry the Crown owns beyond the Angolan coast, and it is falling down. The garrison commander asks whether Lisbon intends to hold the place or abandon it, and he is entitled to an answer."


