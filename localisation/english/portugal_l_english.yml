 POR_mission_qing_ratification: "Await the Qing Ratification"
 POR_mission_qing_ratification_desc: "The Qing court has neither signed nor refused. Six successful approaches should be enough to move it - if we run out of time, the treaty dies unratified."
 POR_decision_send_gifts_to_beijing: "Send Gifts to the Emperor in Beijing"
 POR_decision_send_gifts_to_beijing_desc: "A well-chosen tribute has opened more doors in Beijing than any number of gunboats."
 POR_decision_diplomatic_mission_to_qing: "Convey a Diplomatic Mission to the Qing Capital"
 POR_decision_diplomatic_mission_to_qing_desc: "Our envoys shall travel north and argue the case for ratification before the Zongli Yamen itself."
 POR_mission_macau_border_tension: "Increasing Tension on the Macau Border"
 POR_mission_macau_border_tension_desc: "Qing troops gather beyond the barrier gate. Whatever happens next, it will not be settled by letters."

 ##########################################################################
 # DECISIONS - TIMOR
 ##########################################################################
 POR_decision_timor_missionary_outreach: "Send Missionaries into the Interior"
 POR_decision_timor_missionary_outreach_desc: "Where the flag cannot yet go, the cross may. Our missions have long been the true instrument of Portuguese authority in the archipelago."
 POR_decision_timor_sandalwood_trade: "Revive the Sandalwood Trade"
 POR_decision_timor_sandalwood_trade_desc: "Sandalwood first brought us to Timor. Reviving the trade will bind the coastal chiefs to Dili rather than to Kupang."
 POR_decision_timor_subsidize_liurai: "Subsidise the Loyal Liurai"
 POR_decision_timor_subsidize_liurai_desc: "The liurai - the petty kings of the island - will follow whoever pays them best."
 POR_decision_offer_dutch_favouring_agreement: "Offer a Dutch-Favouring Agreement"
 POR_decision_offer_dutch_favouring_agreement_desc: "If The Hague will not take our terms, we shall offer terms of theirs."
 POR_decision_propose_timor_demilitarization: "Propose a Demilitarised Zone in Timor"
 POR_decision_propose_timor_demilitarization_desc: "Mutual demilitarisation would remove the cause of the quarrel even where the boundary itself remains disputed."
 POR_decision_propose_timor_demilitarization_tt: "§YThe Dutch government will be approached regarding a mutual withdrawal in Timor.§!"
 POR_decision_repress_the_local_natives: "Repress the Local Natives"
 POR_decision_repress_the_local_natives_desc: "Diplomatic overtures to the tribal leaders have failed. The column will march instead."

 ##########################################################################
 # DECISIONS - KONGO
 ##########################################################################
 POR_decision_destroy_the_opposition: "Destroy the Opposition"
 POR_decision_destroy_the_opposition_desc: "Álvaro's partisans in São Salvador can be broken, quietly and thoroughly."
 POR_decision_provide_military_aid_to_the_rebels: "Provide Military Aid to Our Candidate"
 POR_decision_provide_military_aid_to_the_rebels_desc: "Muskets shipped up from Ambriz will do more for Dom Pedro than any letter from Lisbon."
 POR_decision_send_diplomatic_envoy_to_kongo: "Send a Diplomatic Envoy to São Salvador"
 POR_decision_send_diplomatic_envoy_to_kongo_desc: "A Portuguese officer at the side of the pretender is worth a great deal in a kingdom that measures legitimacy by ceremony."
 POR_decision_impose_taxes_on_rubber_export: "Impose Taxes on the Rubber Export"
 POR_decision_impose_taxes_on_rubber_export_desc: "With a friendly king in São Salvador, the rubber leaving the interior can at last be taxed at the coast."
 POR_decision_subjugate_kongo: "Bring Kongo to Heel"
 POR_decision_subjugate_kongo_desc: "Álvaro sits upon the throne and answers to no one. That can be corrected."
 POR_mission_station_troops_in_kongo: "Garrison the Kongo"
 POR_mission_station_troops_in_kongo_desc: "Lisbon must show that it can hold what it claims. Twenty thousand men in the Kongo, and the world will believe us."
 KON_decision_unite_the_local_tribesmen: "Unite the Local Tribesmen"
 KON_decision_unite_the_local_tribesmen_desc: "The Mbamba and Katendi levies will follow the old king's insignia - if they are called quickly enough."
 KON_decision_increase_the_slave_trade: "Increase the Slave Trade"
 KON_decision_increase_the_slave_trade_desc: "The trade is a poison, but it is also the only coin that buys powder at Ambriz."
 KON_decision_meet_with_the_local_aristocrats: "Meet with the Local Aristocrats"
 KON_decision_meet_with_the_local_aristocrats_desc: "The escravos de igreja and the great houses of São Salvador still decide who is crowned."
 ENG_decision_operation_maputo_bay: "Conduct a Special Operation in Maputo Bay"
 ENG_decision_operation_maputo_bay_desc: "Maputo Bay offers unparalleled access to the trade routes of southern Africa, and it cannot be left solely in Portuguese hands."

