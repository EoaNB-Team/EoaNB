 POR_consumption_tax_rate_5: "Consumption Tax: 5%"
 POR_consumption_tax_rate_7: "Consumption Tax: 7%"
 POR_fontes_naval_reforms: "Fontes Naval Reforms"
 POR_sailor_corps: "The Sailors Corps"
 POR_traditional_schools_1: "Traditional Schools"
 POR_traditional_schools_2: "Traditional Schools"
 POR_open_schools_1: "Open Schools"
 POR_open_schools_2: "Open Schools"
 POR_Regeneration: "Regeneração"
 POR_Regeneration_desc: "After the end of the Septembrist government in 1851 Portugal has entered a phase of political instability and industrial modernization, will Portugal see it's rebirth or will it fall into anarchy?"
 POR_Fontes_Pereira_de_Melo: "Fontes Pereira de Melo"
 POR_Luis: "Rei D. Luis"
 POR_Early_Constitution: "Portuguese Constitution"
 POR_Early_Constitution_desc: "The new Portuguese constitution expands the rights of its citizens while also allowing for quicker reforms."
 POR_Research: "Scientific Reforms"
 POR_Research_desc: "Reforms in the area of scientific research allow for faster advancement."
 POR_Flames_of_the_civilwar: "Legacy of the Gramido Convention"
 POR_Flames_of_the_civilwar_desc: "Signed in 1847, the Gramido Convention marked the end of the state of chaos and civil war Portugal faced between 1846 and 1847. The aftermath of this period still smoulders over the Kingdom of Portugal and with it the political struggles and conflicts. The road to solving the problems within the country can only be paved with future reforms"
 POR_alexandre_de_serpa_pinto_political_advisor: "Alexandre de Serpa Pinto"
 POR_alexandre_de_serpa_pinto_political_advisor_desc: "If we appoint him as the governor of Mozambique, there is a lower chance for a big uprising to fire in the region!"
 POR_Changes_in_the_Navy: "Changes in the Navy Structure"
 POR_idea_banco_nacional_ultramarino: "Banco Nacional Ultramarino"
 POR_idea_trading_in_indian_ocean: "Trading in the Indian Ocean"
 POR_idea_transition_from_slave_trade: "The Transition from Slave Trade"
 POR_idea_trade_treaty_with_japan: "Trade Treaty with Japan"
 POR_KON_idea_the_new_atlantic_commerce: "The New Atlantic Commerce"
 POR_KON_idea_recently_destroyed_landowners: "Recently destroyed Landowners"
 POR_idea_humiliation_in_macau: "The Humiliation in Macau"
 POR_idea_humiliation_in_macau_desc: "The loss of Macau is not merely territorial but symbolic. Our ability to sustain influence in distant lands is now openly questioned in every chancellery of Europe."
 POR_idea_colonial_reforms_of_1859: "The Colonial Reforms of 1859"
 POR_idea_colonial_reforms_of_1859_desc: "The Ministry of Overseas Territories has begun to impose order on a patchwork of governors, captaincies and chartered privileges. Governance is slower to change than paper, but the paper has changed."
 POR_idea_sino_portuguese_friendship: "Portuguese-Chinese Friendship Treaty"
 POR_idea_sino_portuguese_friendship_desc: "The Treaty of Friendship and Trade gives our merchants clearer opportunities in China and recognises our administrative role in Macau, carefully avoiding the question of sovereignty."
 POR_idea_banco_nacional_ultramarino_desc: "The holder of the important financial monopolies of the overseas empire, and both an instrument of penetration of the Portuguese State and a means of tying the colonial economies to Lisbon."
 POR_idea_trade_treaty_with_japan_desc: "The commerce treaty with the Tokugawa Shogunate opens the Far East to Portuguese hulls and gives our yards a reason to keep building them."
 POR_idea_trading_in_indian_ocean_desc: "Goa is once again a working entrepôt rather than a monument, and the customs receipts show it."
 POR_idea_transition_from_slave_trade_desc: "International pressure has forced the Empire to begin dismantling the transatlantic trade. The moral credit is considerable; the economic dislocation in the colonies is no less so."
 POR_KON_idea_the_new_atlantic_commerce_desc: "The Atlantic trade is no longer the trade Portugal once dominated. Adapting to it pays well, but the adjustment is felt at home."
 POR_KON_idea_recently_destroyed_landowners_desc: "The great houses of the Kongo have been broken and nothing has yet replaced them. Revenue and order both suffer while the vacuum lasts."

