 ##########################################################################
 # CHARACTERS AND ADVISORS
 ##########################################################################
 KON_Pedro_V_Elelo: "Pedro V Elelo"
 KON_Alvaro_XIII_Ndongo: "Álvaro XIII Ndongo"
 POLITICS_NUNO_JOSE_SEVERO_DESC: "Nuno José Severo de Mendoça Rolim, first Duke of Loulé is a leading political figure in Portugal. Being the leader of the Partido Histórico, founded in 1852 in opposition to the left wing Partido Regenerador, he is serving as Prime Minister under the constitutional monarchy of the house of Bargaza. Having lived through the great economic decline of previous decades in the Kingdom of Portugal, he is a prominent industrialist with ideas for reform and progress. He has responded accordingly to various issues, thanks to his diplomatic abilities, what could be considered as stability has returned to the nation."

 ### ADVISORS ###
 POR_alexandre_herculano_political_advisor: "Alexandre Herculano"
 POR_antonio_jose_de_avila_political_advisor: "António José de Ávila"
 POR_augusto_carlos_teixeira_de_aragao_high_command: "Carlos Teixeira de Aragão"
 POR_fontes_pereira_de_melo_political_advisor: "Fontes Pereira de Melo"
 POR_francisco_de_azeredo_teixeira_de_aguilar_samodaes_political_advisor: "Francisco de Azeredo Teixeira de Aguilar Samodães"
 POR_francisco_maria_de_sousa_brandao: "Francisco Maria de Sousa Brandão"
 POR_jacintho_nunes_leite_political_advisor: "Jacintho Nunes Leite"
 POR_joao_crisostomo_de_abreu_e_sousa_high_command: "João Crisóstomo de Abreu e Sousa"
 POR_rodrigo_de_andrade_barbosa_political_advisor: "Rodrigo de Sousa Coutinho Teixeira de Andrade Barbosa"
 POR_joao_baptista_de_andrade: "João Baptista de Andrade"
 POR_jose_baptista_de_andrade_political_advisor: "João Baptista de Andrade"
 POR_jose_baptista_de_andrade_political_advisor_desc: "A career officer of the overseas service who has governed in both Angola and India, and who knows exactly how much of a governor's despatch Lisbon actually reads."
 POR_roberto_ivens: "Roberto Ivens"
 POR_roberto_ivens_high_command: "Roberto Ivens"
 POR_roberto_ivens_high_command_desc: "A young officer of the Navy Academy whose intellect and adventurous spirit mark him out for expeditions of great significance."

 ###Focuses
 portugal_focus: "Portuguese Focus Tree"
 POR_Consolidate_Regeneracao: "Consolidate the Regeneração"
 POR_Consolidate_Regeneracao_desc: "Our country has spent its last years in the Regeneração, an ongoing revolution in which aims to modernize our industry. However the movement finds itself in an unstable political environment. We must focus on mending that phase to our will."
 POR_Internal_Reform: "Internal Reform"
 POR_Internal_Reform_desc: "We must stabilize our country and unite our people before we can do any major reforms."
 POR_British_Ties: "Ties with Britain"
 POR_British_Ties_desc: "Great Britain is one of our oldest and best allies. We should renew our ties with them."
 POR_Prepare_Constitution: "The New Constitution"
 POR_Prepare_Constitution_desc: "Our country's current constitution is considered backwards in comparison to our neighbours. Portugal is only to benefit from a new constitution!"
 POR_Power_to_King: "Power to the King"
 POR_Power_to_King_desc: "We should expand the power of the king in order to rule our country more easily."
 POR_Regeneracao_continue: "The Regeneracão Must Continue"
 POR_Regeneracao_continue_desc: "The Regeneração has granted us many industrial benefits, it would be unwise to stop it."
 POR_ENG_Focus: "Declaration of Friendship"
 POR_ENG_Focus2: "Broke ties to the Pope"
 POR_ENG_Focus3: "Broke Church Ties"
 POR_Revoke_Const: "Revoke the Constitution"
 POR_Revoke_Const_desc: "The Constitution does nothing but stand in the way of our imperial ambitions. It must go!"
 POR_Break_Catholic_Ties: "Break Catholic Ties"
 POR_Break_Catholic_Ties_desc: "We don't wish to be affiliated with matters of the Catholic Church anymore. Not only will this bring us closer to Britain, but it will also show the Pope that he has no power anymore."
 POR_Claim_Olivenza: "Olivenza is ours!"
 POR_Claim_Olivenza_desc: "The Region of Olivenza is rightful Portugese territory, currently owned by Spain. We will ask them to give it back to us."
 POR_Imperial_Ambition: "Imperial Ambitions"
 POR_Imperial_Ambition_desc: "The Portugese Empire must be established - it's about time we had our place in the sun."
 POR_Greater_Portugal: "Greater Portugal"
 POR_Greater_Portugal_desc: "The time has come to claim Galicia from Spain and reform into Greater Portugal!"
 POR_KingRetireFocus: "§YPortugal will retire its head of state.§!"
 POR_Retire_King: "Retire the King!"
 POR_Retire_King_desc: "It is time to retire our King - Portugal will be free from royal oppression!"
 POR_PowerCouncilFocus: "§GGain two Infantry Divisions in Lisboa.§!"
 POR_Power_to_Council: "Power to the Council!"
 POR_Power_to_Council_desc: "In order to stay in power and control the country, we must expand our military might."
 POR_helps_USA: "Support in the Civil War"
 POR_War_USA: "The War in the West"
 POR_War_USA_desc: "Civil war has erupted in the United States of America! We should pick a side to exert political influence..."
 POR_War_help_USA: "Help the USA"
 POR_War_help_USA_desc: "We should side with the United States of America."
 POR_War_help_CSA: "Help the CSA"
 POR_War_help_CSA_desc: "We should side with the Confederate States Army."
 POR_Fontes_Reform: "The Fontes-Pereira Reform"
 POR_Fontes_Reform_desc: "We need to reform our industrial system in the spirit of the Regeneracao!"
 POR_MilFacs1: "Produce Weaponry"
 POR_MilFacs1_desc: "We must expand our military production capabilities!"
 POR_MilFacs2: "War Machinery"
 POR_MilFacs2_desc: "We must further expand our military production capabilities!"
 POR_Infra1: "Railway Projects"
 POR_Infra1_desc: "We need to expand our Railways."
 POR_Infra2: "The Interior Railway"
 POR_Infra2_desc: "We need to further expand our Railways."
 POR_Research_Focus: "Spirit of Science"
 POR_Research_Focus_desc: "We must advance in the scientific areas to remain relevant in the world."
 POR_focus_consolidate_regeneration: "Consolidate Regeneration"
 POR_focus_consolidate_regeneration_desc: "As we strive to renew our dysfunctional political system and firmly entrench liberalism in this country, much work remains to be done in all spheres of public life, even though great steps were already taken, such as the constitutional amendment of 1852."
 POR_focus_ministry_of_the_public_works: "Creation of The Ministry Of Public Works"
 POR_focus_ministry_of_the_public_works_desc: "The esablishment of a new ministry, dedicated to the investment in public works, commerce and industry, is vital for the ‘Regeneration’ of the country. Of particularly pressing need is the construction and maintenance of roads and ports, vital infrastructures the lack of which would leave Portugal unable to call itself a modern country."
 POR_focus_the_arsenal: "The Arsenal"
 POR_focus_the_arsenal_desc: "Concerns from highest levels of government about the provision and maintenance of equipment of our soldiers has led to a reorganization of the Army Arsenal, which was divided into several factories, each of them specialized in supplying the vital needs of the Portuguese Army."
 POR_focus_santa_clara_royal_workshop: "The Santa Clara Royal Workshop"
 POR_focus_santa_clara_royal_workshop_desc: "This is a critical new factory of the Army Arsenal, dedicated to carpentry and the making and repairing of small arms."
 POR_focus_the_santa_apolonia_workshop: "The Santa Apolonia Royal Workshop"
 POR_focus_the_santa_apolonia_workshop_desc: "Another key component of the Army Arsenal, this workshop is dedicated to the training of apprentices and the assembly of explosive munitions."
 POR_focus_barcarena_workshop: "The Barcarena Royal Workshop"
 POR_focus_barcarena_workshop_desc: "As one of the most vital factories of the Army Arsenal, this workshop is solely dedicated to the production of gunpowder, a vital material with consistently high demand."
 POR_focus_lisboa_carregado_railway: "Lisbon-Carregado Railway"
 POR_focus_lisboa_carregado_railway_desc: "Commissioned in 1852 by minister Fontes Pereira de Melo, and sadly plagued with several issues since its inception, the project is finally nearing its inauguration. This railway shall be the first of its kind in Portugal, the herald of the many more railways to come, railways which will bind the country together and connect it to its European partners."
 POR_focus_lisbon_porto_railway: "Lisbon-Porto Railway"
 POR_focus_lisbon_porto_railway_desc: "The two most important cities in Portugal by far, Lisboa and Porto, are currently separated by hundreds of kilometres of ill-maintained roads and occasionally rough terrain, making them somewhat akin to two strangers who happen to live in the same country. To connect these twin engines of Portugal's economy and main drivers of its socio-cultural development, we shall construct a modern railway, befitting of a modern European nation, and its pay-off in the long-term will surely be immense."
 POR_focus_lisbon_madrid_connection_desc: " Even though this is a complicated project on a technical level, given the terrain in question and the need to adopt our Spanish neighbours' railway gauge (which differs from the European standard gauge), it is undoubtedly of paramount importance if we are to mitigate our geographic isolation from the rest of Europe and open up new markets from our exports."
 POR_focus_civilian_investments: "Civilian Investments"
 POR_focus_civilian_investments_desc: "Our economy, once upon a time buoyed by stupendous trading profits to cover an unhealthy overreliance on imports, finds itself in current times considerably less wealthy and in desperate need to reduce its negative trade balance. Ambitious investments must be made in very profitable industries and on the production of nationally vital products, if we are to reverse our downward trend."
 POR_focus_invicta_fabric_factory: "The Invicta Fabric Factory"
 POR_focus_invicta_fabric_factory_desc: "This factory in Porto (nicknamed the 'Cidade Invicta', meaning “Unvanquished City”), dedicated to the production of fabrics from various raw materials, is one of several textile factories Portuguese industrialists have established in the country, implementing the latest technological advancements and contributing to Portugal's development."
 POR_focus_tabacco_processing: "Tabacco Processing"
 POR_focus_tabacco_processing_desc: "This is a booming industry in our country, and one of its main sources of revenue due to exports, with Portuguese industrialists opening up several new factories to cash in on this opportunity and our government fostering the sector with a range of protectionist policies."
 POR_focus_new_industries: "New Industries"
 POR_focus_new_industries_desc: "In order to diversify our industrial sector, we need promote the creation of new industries which can also complement the current needs of the economy."
 POR_focus_fertilizers_production: "Fertilizers Production"
 POR_focus_fertilizers_production_desc: "The current demographic boom and accompanying nutritional needs has created a new impetus to boost agricultural productivity. This translates, among other things, in a skyrocketing demand for fertilizers, which makes their production a prime candidate for industrial investment."
 POR_focus_porcelain_factory: "Porcelain Factory of Vista Alegre"
 POR_focus_porcelain_factory_desc: "Legally established in 1824, this factory is a shining example which other Portuguese industrialists should seek to emulate. Since its establishment, it has helped to significantly reduce our porcelain imports from China, and its artistry and success is such that it has been dubbed a 'Royal Factory' in 1832. If it diversifies and perfects its products, perhaps even incorporating the contribution of foreign artists, the future of Vista Alegre is sure to be bright."
 POR_focus_cement_production: "Cement Production"
 POR_focus_cement_production_desc: "Our numerous and ambitious building projects require massive amounts of building materials to complete, such as cement, for which we are overly reliant on foreign partners. It would be wise to invest in national cement production, which would have the twin benefits of growing our industrial sector and reduce our import needs."
 POR_focus_nationalwide_education_debate: "Start Nationwide Education Debate"
 POR_focus_skillfull_workforce: "Skillful Workforce"
 POR_focus_primary_school: "Free and Mandatory Primary Schools"
 POR_focus_tradicional_education: "Traditional Education"
 POR_focus_expensive_schools: "Expensive Schools"
 POR_focus_the_rotative_system: "The Rotative System"
 POR_focus_election_law: "Election Law"
 POR_focus_political_stability: "Political Stability"
 POR_focus_continoue_the_reforms: "Continoue The Reforms"
 POR_focus_enact_scientist_reforms: "Enact Scientist Reforms"
 POR_focus_scientific_reforms: "Scientific Reforms"
 POR_focus_not_behind: "We Shall Not Remain Behind!"
 POR_focus_new_tax_laws: "New Tax Laws"
 POR_focus_consumption_tax: "Consumption Tax"
 POR_focus_pay_reforms: "We Need To Pay The Reforms"
 POR_focus_british_loans: "British Loans"
 POR_focus_land_reforms: "Land Reforms"
 POR_focus_land_reforms_desc: "A legacy of cronyism and outdated laws, coupled with foreign invasion and civil war, has crippled the agricultural potential of Portugal. Decisive reforms must be undertaken in order to revitalize the countryside and catch up with our fellow European powers."
 POR_focus_ban_morgardios: "Ban Morgadios"
 POR_focus_ban_morgardios_desc: "Originating in Castilian legislation and formalized into Portuguese law with the Filipine Ordinances of 1603, the 'Morgadio' is an institution dictating the rules of land property management and inheritance. Intended to counter the economic degradation of a family's main branch by repeated inheritances, it granted several privileges to the 'Morgado', the land holder, and caused the effective impoverishment of non-firstborn children. It is imperative that we put an end to this archaic institution."
 POR_focus_land_confiscation: "Land Confiscation"
 POR_focus_land_confiscation_desc: "Many fertile lands lie abandoned by their noble landholders, who accumulated them over time through strategic marriage alliances and now find themselves unable or unwilling to properly manage their vast properties. With the proportion of unexplored arable fields in Portugal at historic highs, these properties need to be seized from their negligent owners and handed to those who will make good use of them."
 POR_focus_new_fertilizers_1: "Introduction Of Quimical Fertilizers"
 POR_focus_new_fertilizers_1_desc: "Just like our efforts to increase the area of cultivated lands, the need for an increase in the productivity of our farmers through the use of the best fertilizers available is paramount if we are to become competitive exporters of agricultural produce."
 POR_focus_new_tools: "Introduction Of New Tools"
 POR_focus_new_tools_desc: "Our agricultural practices, hampered by decades of war and instability, can finally start modernizing, with the adoption of the newest agricultural tools being vital for our continued progress."
 POR_focus_new_agro_laws: "New AgroEconomics Law"
 POR_focus_new_agro_laws_desc: "The legislative reforms on land property and the encouragement of novel land clearance practices are now starting to pay off, with the area of cultivated lands noticeably on the rise."
 POR_focus_expand_vineyards: "Expand Vineyards"
 POR_focus_expand_vineyards_desc: "Port wine and other prestigious vintages are renowned internationally, and count among the few world-class products that our European lands currently export. Given their quality, volume of demand and high profitability margin, coupled with the extent of suitable plots of land that are currently unused, it is an obvious area of our economy that merits sizable investment. The efforts we make to the expand of our vineyards are sure to yield very profitable returns."
 POR_focus_expand_pork_production: "Expand Pork Production"
 POR_focus_expand_pork_production_desc: "There is a silver lining to the vast tracts of currently unused land: the widespread availability of land for animal grazing. Pork, in particular, already a popular staple in Portuguese traditional gastronomy, is very likely to be a successful bet both on the internal market and abroad."
 POR_focus_comunications: "Communications"
 POR_focus_the_telegraph: "The Telegraph"
 POR_focus_national_post_service: "National Post Service"
 POR_focus_comunication_research: "Communication Research"
 POR_focus_janeirinha_coup: "The Janeirinha Coup"
 POR_focus_political_discorder: "Political Disorder"
 POR_focus_enact_counter_reforms: "Enact Counter Reforms"
 POR_focus_economical_failure: "Economical Failure"
 POR_focus_bankrupt: "Bankrupt"
 POR_focus_population_is_discontent: "Population is Discontent"
 POR_focus_hindsight_of_napoleonic_invasion: "Hindsight of the Napoleonic Invasion"
 POR_focus_hindsight_of_napoleonic_invasion_desc: "After the napoleonic invasion and the loss of Brazil strong political instability effected Portugal which led to the army not being as good as it could be. We will start by studying the invasion of Napoleon and start the reforms."
 POR_focus_work_with_britain: "Work with the British"
 POR_focus_work_with_britain_desc: "We have been allies with the British 1386 and with the British being present in our Army why not work with them even further, they would surly also do some benefical trade?"
 POR_focus_end_british_presence: "End British Military Presence"
 POR_focus_end_british_presence_desc: "We may have the oldest alliance in the world with the Brits but this does not excuse the fact that they are influencing our army, if we want to be great again than we can't be a puppet of other's."
 POR_focus_reconstruct_forte_conde_de_lippe: "Reconstruct Fort Conde de Lippe"
 POR_focus_reconstruct_forte_conde_de_lippe_desc: "As long as we have claim on Olivenza we can't be safe from a war with Spain. We shall reconstruct the fort of de Lippe to be safe and to master the art of constructing fort and military factories."
 POR_focus_learn_from_others: "Learn from other"
 POR_focus_escola_pratica_de_artilharia: "Escola Prática de Artilharia"
 POR_focus_escola_pratica_de_artilharia_desc: "Artillery seems to be the future of fighting, whilst we have been doing some research into artillery it still could be better so let's make it better!"
 POR_focus_learn_from_others_desc: "With Europe and the Americas getting increasingly closer and closer to wars we could use this tension to learn from these events. We'll send our great general Saldanha to gether as much information as possible."
 POR_focus_unite_the_army: "Unite the Army"
 POR_focus_unite_the_army_desc: "The army is a mess since the small civil war, but with the new reform it should be once again one well organized and strong unified Portuguese army."
 POR_focus_inevitable_militarization: "Inevitable Militarization"
 POR_focus_inevitable_militarization_desc: "The Portuguese militarization is unavoidable, its clear that for a succesful army that we need to become as militaristic as our fellow European nations."
 POR_focus_the_railway_plan: "The Railway Plan"
 POR_focus_the_railway_plan_desc: "The heart of every army is logistic so lets upgrade our railway system."
 POR_focus_military_surgery: "Military Surgery"
 POR_focus_military_surgery_desc: "The latest reform in the Portuguese army will be about our outdated surgeries which will be brought to the latest standards."
 POR_focus_barcarena_military_development: "Barcarena Military Development"
 POR_focus_barcarena_military_development_desc: "In order for the nations military reform new factories will be constructed to increase our output of weapons."
 POR_focus_santa_apolonia_rolay_workshop: "Santa Apolonia Rolay Workshop"
 POR_focus_santa_apolonia_rolay_workshop_desc: "In Santa Apolonia a small military workshop is forming, this is a perfect oppertunity for us to subsidize it and make our army production grow even larger."
 POR_focus_appoint_bernardo_figueiredo: "Appoint Bernardo Figueiredo"
 POR_focus_appoint_bernardo_figueiredo_desc: "Bernardo Figueirdo is one of our most skilled army commanders which led to the decision of appointing him as our army theorist and him becoming a general."
 POR_focus_spanish_portuguese_project: "The Spanish-Portuguese Project"
 POR_focus_spanish_portuguese_project_desc: "The relationship between Portugal and Spain had their ups and downs and still are complicated but this won't hinder us from developing our puplic transport together. We will propose an interstate railway to boost the trade and travel between Spain and Portugal."
 POR_focus_improving_army_rations: "Improving Army rations "
 POR_focus_improving_army_rations_desc: "The a new propsal for the army reform is an ubgrade of the army rations which would slower attritioning in our division."
 POR_focus_the_artillery_corps: "The Artillery Corps"
 POR_focus_the_artillery_corps_desc: "In the attempts of improving our knowladge and skills with artillery a new unite specialised with artillery usage was made."
 POR_focus_change_in_the_ranks: "Change in the ranks"
 POR_focus_change_in_the_ranks_desc: "In an effort to reform the Portuguese army it was decided to change our conscrption which currently isn't as good as we wish."
 POR_focus_secure_the_capitals_transport: "Secure the capital's transport"
 POR_focus_secure_the_capitals_transport_desc: "Lisbon is undoubtably the most important city of Portugal being the hub of the nation amnd to ensure that it keeps being so the capital transport will be secured."
 POR_focus_new_uniform_reform: "New Uniform Reform"
 POR_focus_new_uniform_reform_desc: "The Uniform's of Portuguese soldieres is behing the ones of the rest of europe and in the case of war the Soldiers wouldn't keep up with the enemies."
 POR_focus_special_military_education: "Special Military Education"
 POR_focus_special_military_education_desc: "The Military education of the genrals and soldier needs to be improved and modernized if Portugal ever wants to win a war."
 POR_focus_reform_the_officer_corps: "Reform the Officer Corps"
 POR_focus_reform_the_officer_corps_desc: "When the wind of change hit Europe the armies of the nation had to change too, the time to reform the officer corps has come."
 POR_focus_colonial_training: "Colonial Training"
 POR_focus_colonial_training_desc: "The Portuguese empire is a colonial empire with colonies in Africa and Asia and with much more potential colonise for us to gain. To keep the colonial empire intact and prevent lossing colonies like in Brazil its clear that the army need to specialize with colonial training."
 POR_focus_european_training: "European Training"
 POR_focus_european_training_desc: "Portugal is and will forever be an European nation with European threats, Spanish relation always go up and down and as Napoleon has shown us there is no need for a border with us to invade us." 
 POR_focus_colonial_garrisons: "Colonial Garrisons"
 POR_focus_colonial_garrisons_desc: "It is clear that if Portugal wants to keep his colonies safe from revolts that it need to garriosn them."
 POR_focus_reorganize_the_military_school: "Reorganize the Military School"
 POR_focus_reorganize_the_military_school_desc: "One of the final reforms of the army of Portugal would be to reorganize the millitary school."
 POR_focus_forbid_capital_punishment: "Forbid Capital Punishment"
 POR_focus_forbid_capital_punishment_desc: "The time has come to abolish the Capitol punishment as it has no place in our nation anymore"
 POR_focus_portuguese_navy: "The Portuguese Navy"
 POR_focus_portuguese_navy_desc: "The oceans have long been Portugal's lifeline, connecting us to our vast empire and global trade routes. The Portuguese Navy, though proud in tradition, now faces challenges to its relevance and strength in the modern era. By revitalizing our fleet, we can ensure our control over key maritime routes, protect our colonies, and reassert Portugal as a maritime power on the world stage."
 POR_focus_side_with_france: "Side with the French"
 POR_focus_side_with_france_desc: "Though our alliance with Britain has endured for centuries, the changing tides of European politics present an opportunity for Portugal to align with France. By siding with the French Republic, we can secure our position on the continent, modernize our military, and ensure the protection of our colonial empire through closer ties with one of Europe’s great powers."
 POR_focus_old_ways: "The Old Ways"
 POR_focus_old_ways_desc: "Portugal's naval tradition has been the backbone of its empire for centuries, forged in the Age of Exploration and tempered by wars of survival. While the world modernizes its fleets and tactics, some within the Admiralty argue that the old ways of seamanship, privateering, and dominance through cunning still hold value. By relying on proven traditions, we can maintain Portugal’s maritime presence without succumbing to costly modernization drives."
 POR_focus_defensive_pact_of_current_year: "Defensive Pact of [GetYear]"
 POR_focus_defensive_pact_of_current_year_desc: " This agreement guarantees mutual protection in the face of aggression and strengthens military and economic cooperation. With France’s military might and Portugal’s strategic positioning, this pact ensures the security of both nations and their respective empires."
 POR_focus_ship_exchange_campaign: "The Ship exchange Campaign"
 POR_focus_ship_exchange_campaign_desc: "Portugal’s naval fleet, while storied and full of tradition, suffers from outdated designs. Recognizing the need for modernization, a campaign has been initiated to negotiate with France for the transfer of modern ships in exchange for colonial resources and dockyard support. This partnership will ensure Portugal’s naval relevance while strengthening Franco-Portuguese ties."
 POR_focus_defend_our_shores: "Defend our Shores"
 POR_focus_defend_our_shores_desc: "By fortifying key positions and investing in coastal defense, we ensure that Portugal’s sovereignty and trade routes remain secure against any threat."
 POR_focus_navy_brigade: "Navy Brigades"
 POR_focus_navy_brigade_desc: "Portugal’s naval tradition runs deep, but the tides of modern warfare demand more than ships alone. By creating the Navy Brigade, we establish a force of versatile marines trained for amphibious warfare and coastal defense. These elite soldiers will protect our shores, secure vital ports, and spearhead future naval invasions to defend and expand Portugal's global reach."
 POR_focus_silva_innovations: "The Silva Innovations"
 POR_focus_silva_innovations_desc: "Known for Da Silva's innovative approaches to engineering, naval construction, and industrial design, investing in their projects will propel Portugal’s military and industrial capabilities into the modern age. "
 POR_focus_artillery_training_ship: "Artillery Training Ships"
 POR_focus_artillery_training_ship_desc: "Establishing a dedicated artillery training ship will provide the next generation of sailors with the expertise required to operate advanced naval weaponry. This project not only ensures a welltrained crew but also enhances Portugal’s ability to defend its waters and support its allies."
 POR_focus_bartolomeu_dias: "Bartolomeu Dias"
 POR_focus_bartolomeu_dias_desc: "The Bartolomeu Dias symbolizes Portugal's enduring legacy of maritime prowess. By commissioning this modern ship, Portugal will assert its determination to reclaim a prominent position on the world's oceans, combining advanced technology with centuries of naval tradition."
 POR_focus_revolution_in_shipbuilding: "Revolution in Shipbuilding"
 POR_focus_revolution_in_shipbuilding_desc: " Through the introduction of cutting-edge techniques, modernized facilities, and bold new designs, Portugal will transform its naval industry into a powerhouse of shipbuilding. This revolution will allow Portugal to not only bolster its naval fleet but also establish itself as a dominant force in maritime trade and warfare."
 POR_focus_modern_naval_technology: "Modern Naval Technology"
 POR_focus_modern_naval_technology_desc: " In order to secure Portugal’s future as a maritime power, a concerted effort to develop and adopt the latest innovations in naval technology is essential. By prioritizing cutting-edge technologies—such as advanced radar systems, improved ship armor, and more powerful engines—Portugal can ensure that its fleet remains competitive and ready to face modern naval warfare"
 POR_focus_side_with_british: "Side with the British"
 POR_focus_expand_lisbon_polytechnic_school: "Expand the Lisbon Polytechnich school"
 POR_focus_expand_lisbon_polytechnic_school_desc: "Expanding the Lisbon Polytechnic school facilities and curriculum will not only train the next generation of engineers, scientists, and military experts but will also lay the groundwork for Portugal's rise as a regional technological leader."
 POR_focus_british_technology_inventions: "British Technology Inventions"
 POR_focus_british_technology_inventions_desc: " As a global leader in the Industrial Revolution, Britain has long been at the forefront of technological innovations. By investing in and adopting British inventions, Portugal can modernize its industries, enhance its military, and bring its infrastructure up to the standards of the most advanced nations. Leveraging British technology will allow Portugal to strengthen its economy and military capabilities."
 POR_focus_reform_arsenal_da_marina: "Reform the Arsenal da Marina"
 POR_focus_reform_arsenal_da_marina_desc: "By investing in modernizing the Arsenal da Marinha infrastructure and adopting the latest naval technologies, Portugal can transform the Arsenal into a world-class facility. This reform will ensure that Portugal can produce the most advanced warships, submarine fleets, and naval equipment, strengthening the country's naval power for years to come."
 POR_focus_overseas_armada: "The Overseas Armada"
 POR_focus_overseas_armada_desc: "The Overseas Armada, a fleet dedicated to protecting and maintaining these vast colonies, is critical to Portugal’s empire. By expanding and modernizing this fleet, we ensure our ability to defend our interests abroad and assert dominance over key global trade routes. With a stronger Overseas Armada, Portugal will preserve its colonial holdings and ensure its continued prosperity."
 POR_focus_fleet_back_to_greatness: "Rebirth of the Portuguese Navy"
 POR_focus_elections_1868: "The Elections Of 1868"
 POR_focus_fontes_is_back: "Fontes Is Back"
 POR_focus_stay_in_control: "Try To Stay In Control"
 POR_focus_success: "Success!"
 POR_focus_start_fontismo: "Start Fontismo"
 POR_focus_failure: "Failure!"
 POR_focus_new_leader: "New Leader Appears"
 POR_focus_political_debate: "Political Debate"
 POR_focus_true_democracy: "Time For A True Democracy?"
 POR_focus_absolutism: "Absolutism Is The Answer?"
 POR_focus_more_power_to_parliament: "More Power To Parliament"
 POR_focus_remove_luis: "Remove Luis I Of Portugal"
 POR_focus_liberal_republic: "A Liberal Republic"
 POR_focus_conservative_republic: "A Conservative Republic"
 POR_focus_invite_maria: "Invite Maria Assunção"
 POR_focus_dissolve_parliament: "Dissolve The Parliament"
 POR_focus_i_am_portugal: "I Am Portugal"
 POR_focus_our_ultramarine_empire: "Our Ultramarine Empire"
 POR_focus_our_ultramarine_empire_desc: "Portugal was the first world Superpower, it was a pioneer in the Era of Explorations and expanded its influence and culture throughout the globe. The loss of Brazil shows we must expand our efforts to develop our remaining possesions."
 POR_focus_mozambique_resources: "Mozambique Resources"
 POR_focus_develop_macau: "Invest In Macau"
 POR_focus_casinos: "Expand Macau Casinos"
 POR_focus_the_islands: "Develop the Islands"
 POR_focus_develop_cape_verde: "Develop Cape Verde"
 POR_focus_deleop_macaronesia: "Develop Macaronesia"
 POR_focus_reform_colonial_administration: "Ministry of Overseas Territories"
 POR_focus_reform_colonial_administration_desc: "The vastness of Portugal's overseas empire demands a centralized and efficient administrative body. By establishing the Ministry of Overseas Territories, we can ensure better governance, resource extraction, and defense of our colonial possessions."
 POR_focus_ultramarine_national_bank: "Banco Nacional Ultramarino"
 POR_focus_ultramarine_national_bank_desc: "This institution will become the holder of important financial monopolies and will develop into both an instrument of penetration of the Portuguese State and a way of helping the development of the colonial economies and their bonds with Portugal."
 POR_focus_the_hinterland_question: "The 'Hinterland' Question"
 POR_stand_central_africa: "Stand in Central Africa"
 POR_focus_goa_outpost: "The Goa Outpost"
 POR_focus_goa_outpost_desc: "In the 19th century, the Indian Ocean remains a theater of strategic importance, and our control over Goa is a vital symbol of Portugal’s enduring influence in the region. However, growing tensions and pressures from local powers and foreign empires threaten our presence. Strengthening the Goa Outpost with military fortifications, trade improvements, and cultural outreach will cement Portugal's hold over this jewel of the East."
 POR_focus_sino_portuguese_treaty: "Portuguese-Chinese Friendship Treaty"
 POR_focus_sino_portuguese_treaty_desc: "The Treaty of Friendship and Trade between Portugal and China strengthens our trade relations and formalizes the growing interactions between our nations."
 POR_focus_colonial_army: "Exército Colonial"
 POR_focus_colonial_army_desc: "The far-flung territories of the Portuguese Empire require a specialized and capable military force to defend against uprisings, enforce colonial authority, and deter foreign incursions. By reorganizing and strengthening the Exército Colonial, we can create a more effective force suited for the unique challenges of maintaining control in Africa, India, and Southeast Asia."
 POR_focus_slave_trade: "The Slave Trade"
 POR_focus_slave_trade_desc: "By the mid-19th century, international pressure and moral arguments against slavery had intensified. The Portuguese Empire faces demands to curtail the transatlantic slave trade. While the economic repercussions are significant, adapting to these changes could present an opportunity to modernize and transition toward more sustainable economic systems in our colonies."
 POR_focus_naval_base_timor: "The Timor Governance"
 POR_focus_naval_base_timor_desc: "Timor, located at the eastern edge of the Portuguese Empire, remains a distant and often neglected colony. Strengthening governance in this isolated region will require reforms to administrative structures, investment in local infrastructure, and efforts to integrate Timor more effectively into the broader empire."
 POR_focus_commerce_treaty_japan: "Commerce Treaty with Japan"
 POR_focus_commerce_treaty_japan_desc: "Spreading our influence to the Far East might turn out helpful in the future..."
 POR_focus_reform_prazo_system: "Reform the Prazo System"
 POR_focus_reform_prazo_system_desc: "The Prazo system has long been a burden to our colonies in Mozambique. It is time for that to change!"
 POR_focus_treaty_of_lisbon_1864: "Treaty of Lisbon of 1864"
 POR_focus_treaty_of_lisbon_1864_desc: "The border dispute in the northern parts of Portugal and the Galician province of Spain has long been a barrier between the relations of the two nations. It is time to fix that!"
 POR_focus_kingdom_and_the_empire: "The Kingdom and the Empire"
 POR_focus_kingdom_and_the_empire_desc: "We should still keep good relations with our lost colony Brazil. The friendships between the two nations will always thrive and bloom."
 POR_one_empire_one_law: "One Empire - One Law "
 POR_one_empire_one_law_desc: "The Empire of Portugal stands united against the repressors. Our laws should be enforced all over the territory of our nation."
 POR_focus_nationalwide_education_debate_desc: "Barely a fifth of the kingdom can read. The Cortes has begun to argue over whether that is a scandal or simply the natural order, and the answer will shape a generation."
 POR_focus_skillfull_workforce_desc: "Industry needs hands that can read a gauge. Schooling aimed at the workshop rather than the seminary would give it to them."
 POR_focus_primary_school_desc: "A parish school in every município. Expensive, slow, and the only way the countryside will ever catch up with Lisbon."
 POR_focus_tradicional_education_desc: "The Church has taught Portugal for three centuries and sees no reason to stop. Leaving the schools in its hands is cheap and keeps the bishops quiet."
 POR_focus_expensive_schools_desc: "Fewer schools, better ones. The sons of the notables will be properly taught even if the labourer's son is not taught at all."
 POR_focus_the_rotative_system_desc: "Regenerators and Historicals have agreed, without ever saying so aloud, to hand the government back and forth between them. It is not democracy, but it is stability of a sort."
 POR_focus_election_law_desc: "The franchise, the constituencies and the counting of votes are all due for revision - and every clause of it will be written by whoever holds the pen."
 POR_focus_political_stability_desc: "Two decades of pronunciamentos have taught the political class that nobody wins a civil war in a country this poor. Let the rotation do the work instead."
 POR_focus_continoue_the_reforms_desc: "The Regeneração was never finished. Roads, schools and tariffs all wait on a government willing to spend the political capital."
 POR_focus_enact_scientist_reforms_desc: "The Academy of Sciences wants money, chairs and a say in policy. Granting it would put Portugal back into a European conversation it left a century ago."
 POR_focus_scientific_reforms_desc: "Endow the laboratories, send students abroad, and stop pretending that the Polytechnic can be run on enthusiasm alone."
 POR_focus_not_behind_desc: "Portugal will not be the last kingdom in Europe to industrialise. Whatever the cost, the gap must be closed."
 POR_focus_new_tax_laws_desc: "The revenue system is a patchwork of exemptions inherited from the old regime. Rewriting it will make enemies of everyone who currently pays nothing."
 POR_focus_consumption_tax_desc: "Taxing what people buy rather than what they own is simpler to collect and far harder to avoid - and it falls hardest on those least able to complain."
 POR_focus_pay_reforms_desc: "The civil service and the officer corps have not seen a rise in years, and unpaid men make poor servants of the Crown."
 POR_focus_british_loans_desc: "The City of London will lend to us at a price. The price is not only interest."
 POR_focus_comunications_desc: "A kingdom cannot be governed from Lisbon if news from Bragança takes four days to arrive."
 POR_focus_the_telegraph_desc: "Wires along the railway lines will put every district capital within minutes of the ministries."
 POR_focus_national_post_service_desc: "A single postal administration, uniform rates and a stamp bearing the King's head - modest things that make a state feel like one."
 POR_focus_comunication_research_desc: "Our engineers should be building the instruments rather than importing them."
 POR_focus_elections_1868_desc: "The rotation has faltered and the country goes to the polls in an atmosphere of open contempt for both parties."
 POR_focus_fontes_is_back_desc: "Fontes Pereira de Melo returns to office with the same programme he never finished: railways, roads, ports, and borrowed money to pay for all three."
 POR_focus_stay_in_control_desc: "Holding a ministry together in Lisbon requires patronage, nerve and a Cortes that can be persuaded not to look too closely."
 POR_focus_success_desc: "The government survives its critics. For the moment the programme continues and the loans keep coming."
 POR_focus_failure_desc: "The ministry falls. The King must send for someone else, and the whole weary business begins again."
 POR_focus_start_fontismo_desc: "Fontismo in full: public works on credit, a railway to every province, and a national debt that our grandchildren will still be servicing."
 POR_focus_new_leader_desc: "A new man is called to the Paço. Whether he is an improvement is a question the country has stopped expecting a good answer to."
 POR_focus_political_debate_desc: "The quarrel has moved past ministries and budgets. What is now argued in the Cortes is what kind of state Portugal ought to be."
 POR_focus_true_democracy_desc: "Widen the franchise, curb the Crown, and let the Cortes answer to the country rather than to the Paço."
 POR_focus_absolutism_desc: "Parliamentary government has produced thirty years of paralysis. A firm hand at the top would at least be able to decide something."
 POR_focus_more_power_to_parliament_desc: "Ministers responsible to the Cortes, a Crown that reigns without governing, and a budget nobody may spend without a vote."
 POR_focus_remove_luis_desc: "The King has become the obstacle rather than the arbiter. Removing him is the last step before the question of the monarchy itself is opened."
 POR_focus_liberal_republic_desc: "A republic of the ballot box, the free press and the secular school - and of the men of property who intend to run it."
 POR_focus_conservative_republic_desc: "A republic in name, an oligarchy in practice: the throne removed, everything else carefully left where it stands."
 POR_focus_invite_maria_desc: "A candidate of unimpeachable legitimacy and no political convictions whatsoever is exactly what the court requires."
 POR_focus_dissolve_parliament_desc: "The Cortes is sent home. What replaces it will be decided by whoever still holds the palace guard."
 POR_focus_i_am_portugal_desc: "The Crown, the ministry and the state are one. Portugal has had this arrangement before, and remembers how it ended."
 POR_focus_side_with_british_desc: "The old alliance has kept Portugal in existence since the fourteenth century. It has also kept her dependent for just as long."
 POR_focus_fleet_back_to_greatness_desc: "The navy that once charted the world now struggles to police its own colonies. Rebuilding it is a matter of standing as much as of strategy."

 ##########################################################################
 # PORTUGUESE COLONIAL EMPIRE - FOCUSES
 ##########################################################################
 POR_focus_memories_of_passaleao: "Memories of the Passaleão Incident"
 POR_focus_memories_of_passaleao_desc: "The barrier gate has run red once more. Whatever the outcome, the ghosts of Governor Ferreira do Amaral's war will never again leave the streets of Macau."
 POR_focus_the_macau_tragedy: "The Macau Tragedy"
 POR_focus_the_macau_tragedy_desc: "Macau is gone. The oldest European settlement in the Far East has slipped from our hands, and with it a great deal of the confidence that Portugal can hold anything at all beyond the Cape."
 POR_focus_sino_portuguese_treaty_tt: "§YThe Qing court will be presented with the draft Treaty of Friendship and Trade.§!"
 POR_KON_a_change_in_course_mission_tt: "§YIf Kongo is not yet fully integrated, Lisbon must garrison the Kongo with §H20,000§!§Y men within §H220§!§Y days.§!"
 POR_focus_develop_macau_desc: "Macau has been ours since the sixteenth century, and it has been allowed to decay for very nearly as long. Investment in the harbour, the customs house and the gaming concessions would turn the enclave from an embarrassment into a source of revenue."
 POR_focus_mozambique_resources_desc: "Beyond the coastal factories lies a province whose coal and mineral wealth has never been surveyed with any seriousness. If Mozambique is to pay for itself, the work must begin now."
 POR_focus_the_hinterland_question_desc: "Possession of the coast no longer suffices. The other powers now insist that a claim is only valid where it is effectively occupied, and the interior between Angola and Mozambique is precisely where our claim is thinnest."
 POR_stand_central_africa_desc: "Portugal's presence in Central Africa has long been a cornerstone of its colonial ambitions, centred on Angola and Mozambique. With increasing global competition and local resistance, it is time to solidify our position. By strengthening our military presence, improving infrastructure and fostering economic development, we can assert our authority over Central Africa."
 
 # Shared Focuses
 POR_KON_under_a_new_management: "Under a New Management"
 POR_KON_under_a_new_management_desc: "Portugal and Kongo are now united. This can only be fruitful for both our nations!"
 POR_KON_power_decentralization: "Power Decentralization"
 POR_KON_power_decentralization_desc: "The decentralization is the most optimal way to go as of now. Portugal is capable of ensuring safety in the region."
 POR_KON_empower_the_kivuzi_agua_rosada_coalition: "Empower the Kivuzi-Agua Rosada coalition"
 POR_KON_empower_the_kivuzi_agua_rosada_coalition_desc: "We need to have stable leadership inside the nation. That way we will put aside internal conflicts."
 POR_KON_exploit_the_kongolese: "Exploit the Kongolese"
 POR_KON_exploit_the_kongolese_desc: "This is the best way to ensure stability in the nation."
 POR_KON_keep_relative_autonomy: "Keep Relative Autonomy"
 POR_KON_keep_relative_autonomy_desc: "The best way to ensure stability is to give more freedom to the local institutions in the region. Therefore they can manage their own problem without Portugal's intervention"
 POR_KON_the_catholic_spread: "The Catholic Spread"
 POR_KON_the_catholic_spread_desc: "In the last century the spread of Catholicism in Central Africa has been increasing ever so. There is nothing we can do to stop it."
 POR_KON_the_portuguese_supervision: "The Portuguese Supervision"
 POR_KON_the_portuguese_supervision_desc: "The Portuguese army is unstopable and will secure Kongo's possesions in Central Africa."
 POR_KON_the_tax_army: "The Tax Army"
 POR_KON_the_tax_army_desc: "Kongo can manage its own territories withouth the help of Portugal. The Empire has other problems."
 POR_KON_colonial_manpower_transfer: "Colonial Manpower Transfer"
 POR_KON_colonial_manpower_transfer_desc: "The colonies can help the Portuguese empire. Manpower is a thing that is always needed!"
 POR_KON_the_new_atlantic_commerce: "The New Atlantic Commerce"
 POR_KON_the_new_atlantic_commerce_desc: "Going into the second half of the 19th century the trade in the Atlantic ocean has changed. It is not the same as it was centuries ago when Portugal dominated the seas. We have to adapt to the new way of commerce..."
 POR_KON_the_wild_rubber_production: "The Wild Rubber Production"
 POR_KON_the_wild_rubber_production_desc: "Rubber prices are going wild. Thus, increasing the extraction rates of rubber will increase our main income."
 POR_KON_the_new_industries: "The New Industries"
 POR_KON_the_new_industries_desc: "Kongo should rely on the new industrial innovation to survive in Africa and keep the integrity of its territories."
 POR_KON_destroy_the_local_landowners: "Destroy the Local Landowners"
 POR_KON_destroy_the_local_landowners_desc: "The local landowners are a poison to our lands. We should focus on foreign investments"
 POR_KON_a_change_in_course: "A Change in the Course"
 POR_KON_a_change_in_course_desc: "The world is evolving and so do we. We need to embrace the change and hope for the best."

 
