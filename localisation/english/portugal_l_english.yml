 POR_timor_influence_bar_tt: "§YInfluence over the Solor and Timor Archipelago§!\n\n[POR.GetFlag] Portugal: §G[?POR.POR_timor_influence|0]%§!\n[INS.GetFlag] The Netherlands: §O[?POR.POR_timor_influence_dutch|0]%§!\n\n[GetPORTimorInitiative]\n\n§LInfluence moves only through decisions and events. Whichever power stands above 50% gains a further +0.10% each week.\n\nStates change hands the moment a threshold is crossed, in either direction. Completing The Timor Governance makes the result permanent and gives Portugal cores on everything it holds.§!"
 POR_timor_influence_sphere_tooltip: "§YWhat each threshold is worth§!\n\n§Y30%§! §HPortuguese Timor§!\n§Y55%§! the §HLesser Sundas§!\n§Y70%§! §HKupang§!\n§Y80%§! §HMataram§!\n\n§LCrossing a threshold hands the state to Portugal at once. Slipping back below it returns the state to whoever held it before, and below 30% Batavia takes Portuguese Timor itself.\n\nOecusse is an enclave inside Portuguese Timor rather than a state of its own, so it moves nothing on the campaign map. Sumba is governed from the Lesser Sundas and changes hands with them.§!"

