 portugal.33.t: "Assault on Coloane Island Begins"
 portugal.33.d: "Today marks the start of the assoult against Coloane Island"
 portugal.33.a: "Ok"

 portugal.34.t: "Our Fort in Kongo"
 portugal.34.a: "We should expand it!"
 portugal.34.b: "Let it be as it is now"
 portugal.34.c: "It costs too much!"
 portugal.34.d: "The fort at São Salvador is the only masonry the Crown owns beyond the Angolan coast, and it is falling down. The garrison commander asks whether Lisbon intends to hold the place or abandon it, and he is entitled to an answer."

 # Event 35 has no loc

 portugal.36.t: "The Ningpo Massacre"
 portugal.36.d: "Cantonese pirates have massacred portugese pirates and sacked the consulate in Ningbo."
 portugal.36.a: "Horrible."

 portugal.37.t: "The Treaty of Tianjin - Macau"
 portugal.37.d: "Macau, our holding in China, has long been difficult to maintain. We have put effort in to develop it, now should we attempt to strengthen our governance there?"
 portugal.37.a: "We must deal with the Macau question."
 portugal.37.b: "We don't care."

 portugal.38.t: "The Treaty of Tianjin - Macau"
 portugal.38.d: "After the question has recently arisen, it's time to make a decision on Macau."
 portugal.38.a: "Macau is ours."
 portugal.38.b: "They can have it."

 portugal.39.t: "Research Progress"
 portugal.39.d: "We have just recived great news from are ressearches bringing us the latest technological advancements needed for war"
 portugal.39.a: "Ok"

 portugal.40.t: "Saldanha's Report"
 portugal.40.d: "Today Saldanha returned from an information gathering trip to Rome. He talked about the recent military changes in the Italian states, their innovations, tactics and equipment. We could surly use this newly aquired information to change our not so great army."
 portugal.40.a: "Great News!"

 portugal.41.t: "O Palácio de Cristal"
 portugal.41.d: "As we enter the 6th decade of the 19th century, Portugal needs something to show its past greatness. Although our financial opportunities and our coffers are woefully empty, we return that our country needs such a building. The creation of such a building would enhance our standing on the international stage and, therefore, help our country out of the bad situation it currently finds itself in."
 portugal.41.a: "A sign of superiority"
 portugal.41.b: "We don't have the economical base for the constuction"

 portugal.42.t: "Exposição Internacional do Porto"
 portugal.42.d: "After long and arduous preparations the world exhibition in Porto is now a fact.. The exhibition being housed inside the grand Palácio de Cristal, which was modelled on the synonymous Crystal Palace erected for The Great Exhibition held during 1851 in London. The exhibition is inaugurated in the presence of the Portuguese king, Luís I and his consort Maria Pia of Savoy. Upon inauguration, it marks the first in history world exhibition to occur on the Iberian Peninsula. As of now the exhibition hosts 3,139 exhibitors, of which 499 were French, 265 German, 107 British, 89 Belgian, 62 Brazilian, 24 Spanish, and 16 Danish. Russia, the Netherlands, Turkey, the United States and Japan are also represented. The main theme of the event is industrial and trade innovations with an emphasis in primary materials, machinery, manufacture and fine arts."
 portugal.42.a: "Let's hope this eases the processes in Portugal"

 portugal.43.t: "New Cadres influx in the Military"
 portugal.43.d: "Serpa, whom got promoted as the first student Battalion Commander last year, is an ambitious explorer and a great administrator, knowing a lot about the various tribes in our great empire. Recently he got assigned to our colony in Mozambique to improve our governance over the region."
 portugal.43.a: "His skills are hightly needed!"

 portugal.44.t: "The New Generation of Sailors"
 portugal.44.d: "A new era stirs in Portugal—a generation of sailors born not just from the waves, but from the power of knowledge and innovation. At the heart of this transformation stands the establishment of the Lisbon Polytechnic School, a beacon of progress that promises to reshape the nation’s maritime future. Here, the age-old tradition of Portuguese seafaring is married to modern science and engineering, preparing a new breed of sailors who are not only skilled in the art of navigation but in the technologies that drive the vessels of tomorrow.\n\nThe school, conceived as a center of higher learning, opens its doors to young minds eager to embrace the winds of change. No longer will the sea be conquered solely by instinct and tradition. The curriculum blends classical navigation with the study of mathematics, mechanics, and the natural sciences—crafting a new type of sailor, one who understands not only the ocean's unpredictable temperament but the very principles that govern the ships and tools they command.\n\nThis institution, founded in the mid-19th century, marks a turning point for Portugal, a nation whose golden age of exploration is now a distant memory. The creation of the Lisbon Polytechnic School is a clear response to the nation’s declining influence in global maritime affairs, a conscious effort to revive Portugal's once-vaunted naval prowess in the face of growing competition from other European powers.\n\nAs young men from across Portugal flock to Lisbon to study, a new generation of sailors prepares to venture forth—not as mere voyagers, but as innovators and scientists. They will carry with them not only the spirit of adventure but also the knowledge to steer their nation back toward prominence on the world stage. In this new age of exploration, the sailors of Portugal will be equipped not just with courage, but with the intellect to master the seas."
 portugal.44.a: "Yes"
 portugal.44.b: "No"

 portugal.45.t: "A New Era for the Portuguese Navy"
 portugal.45.d: "A new era dawns for the Portuguese Navy, as the winds of change sweep through its ranks, bringing with them an infusion of modernity and ambition. The once-glorious maritime empire, which once commanded vast stretches of the globe, now faces the challenge of reinvigorating its naval power in an age where global competition for sea dominance is fiercer than ever. In this context, the establishment of the Lisbon Polytechnic School becomes a crucial milestone—ushering in a generation of sailors and officers trained in the latest scientific and technological advancements.\n\nNo longer bound solely to the traditions of exploration and trade that once defined Portugal's naval identity, the new Portuguese Navy looks toward the future with a focus on innovation. The Polytechnic School serves as the foundation for this transformation, offering a curriculum that blends practical seamanship with advanced studies in engineering, navigation, and naval tactics. The next generation of naval officers and sailors is not only learning to sail the ships but also to design and command them with cutting-edge technologies that reflect the growing importance of steam-powered vessels, new weapons systems, and global strategic positioning.\n\nThis new approach to naval training and warfare represents a decisive shift from the past. The Navy, while still holding a deep respect for the traditions that saw the Portuguese reach the farthest corners of the Earth, is adapting to the realities of a rapidly changing world. The aim is clear: to rebuild Portugal’s influence on the seas and restore its maritime prowess.\n\nWith a reinvigorated sense of purpose, the Portuguese Navy embarks on this new era, ready to confront the challenges ahead. This is not just a revival; it is a renaissance, an attempt to secure Portugal's place in the modern age of naval power and international diplomacy. The sailors of tomorrow will sail not only with the wind at their backs but with the knowledge and skill to navigate a world of new possibilities."
 portugal.45.a: "Ok"

