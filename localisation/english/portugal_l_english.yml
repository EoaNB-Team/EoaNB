 POR_railway_upgrade: "Upgrade of Portuguese Railways"
 POR_railway_upgrade_desc: "Our railway network is not up to the task of supporting let alone encouraging a modern industry anymore. Upgrading and expanding it would not only fix this problem, it would also grant our industry important contracts and the possibility for trade expansion."
 POR_decision_porcelain_factory: "Porcelain Factory of Vista Alegre"
 POR_decision_lonia_workshop: "The Santa Apolina Workshop"
 POR_decision_de_lippe_forts: "Reconstruction of the de Lippe fort"
 POR_decision_send_saldanha_to_rome: "Send Saldanha to Rome"
 POR_decision_research_lisbons_outskirts: "Research the outskirts of Lisobon"
 POR_decision_build_military_hospital: "Build the Military Hospital"
 POR_mission_cristal_palace: "Cristal Palace Construction"
 POR_decision_division_lisbon_1: "Recruit Division in Lisbon"
 POR_decision_division_lisbon_2: "The Artillery Corps"
 POR_decision_division_beja: "Recruit Division in Beja"
 POR_decision_defend_our_shores: "Fortify the Atlantic coast"
 POR_decision_schedule_gunnery_drills: "Schedule Gunnery Drills"
 POR_decision_develop_advanced_naval_gunnery_simulators: "Develop Advanced Naval Gunnery Simulators"
 POR_mission_coastal_fort_lisbon: "Develop the coastal region of Lisbon"
 POR_decision_sagresh_into_sea: "Release Sagresh into the sea"
 POR_decision_estefania_into_exploitation: "Put Estefania into exploitation"
 POR_decision_expand_bembe_mines: "Expand the Bembe mines"
 POR_decision_boost_trade_in_indian_ocean: "Boost Trade in the Indian Ocean"
 POR_decision_increase_inland_rubber_production: "Increase the inland rubber production"
 POR_decision_take_control_coloane_island_desc: "Coloane sits at the mouth of our harbour and is held by no one in particular. Establishing a garrison there would close the last gap in the defence of Macau."
 POR_decision_mozambique_coal_depots_desc: "Surveys have identified workable coal in the Mozambican interior. Developing the depots would supply our squadrons in the Indian Ocean without recourse to British bunkers."
 POR_decision_mozambique_aluminium_desc: "The bauxite of the Mozambican coast can be worked with modern methods, giving the Empire a source of light metal of its own."
 POR_decision_expand_bembe_mines_desc: "The copper of Bembe was the reason Portuguese columns first pushed inland from Ambriz. Expanding the workings will justify the expedition at last."
 POR_decision_boost_trade_in_indian_ocean_desc: "A season of subsidised sailings and reduced harbour dues at Goa would remind the merchants of the Konkan coast that Portugal is still in the business."
 POR_decision_increase_inland_rubber_production_desc: "Rubber prices are climbing. Pressing the interior harder will fill the Lisbon treasury, whatever it does to the Kongo."
 POR_decision_research_lisbons_outskirts_desc: "Surveying the land around the capital would show where the new quarters, workshops and lines can actually be put."
 POR_decision_invicta_fabric_factory_desc: "Porto's cotton mills are the one modern industry the kingdom possesses. Expanding the Invicta works would double their output."
 POR_decision_portuguese_vineyards_desc: "The Douro vineyards are Portugal's most reliable export. Replanting and modernising them protects the one trade the country genuinely leads."
 POR_decision_santa_clara_royal_workshop_desc: "The royal workshop at Santa Clara can be turned from a curiosity into a working arsenal."
 POR_decision_lonia_workshop_desc: "Refitting the Lóia workshop would give the army a second source of small arms outside Lisbon."
 POR_decision_barcarena_workshop_desc: "The powder mills and gun works at Barcarena have served the Crown since the sixteenth century and are showing every one of those years."
 POR_decision_porcelain_factory_desc: "Vista Alegre porcelain sells in every capital in Europe. A larger works would turn a court indulgence into an export."
 POR_decision_land_confiscation_desc: "The entailed estates and the remaining religious lands can be broken up and sold. The revenue is immediate; the enemies are permanent."
 POR_decision_de_lippe_forts_desc: "The Lippe fortifications on the Spanish frontier have not been touched since the Peninsular War."
 POR_decision_lisbon_porto_railway_line_desc: "The trunk line between the two cities is the backbone of the whole railway programme."
 POR_decision_build_military_hospital_desc: "The army loses more men to fever in barracks than to any enemy. A proper hospital would change that arithmetic."
 POR_decision_defend_our_shores_desc: "Coastal batteries and a squadron kept in home waters, so that the next power to threaten Lisbon has to think about it first."
 POR_decision_buy_guns_desc: "Modern rifles bought abroad, since our own works cannot yet make them in numbers."
 POR_decision_division_beja_desc: "Raising a division in the Alentejo gives the south a garrison and gives the peasantry a reason to stay."
 POR_decision_schedule_gunnery_drills_desc: "Powder spent in practice is cheaper than ships lost for want of it."
 POR_decision_develop_advanced_naval_gunnery_simulators_desc: "Training crews on shore, at a fraction of the cost of taking a squadron to sea."
 POR_decision_sagresh_into_sea_desc: "The Sagres is to be recommissioned and sent back to sea, where a training ship belongs."
 POR_decision_estefania_into_exploitation_desc: "The Estefânia enters service, and the navy has a modern hull to show the flag with."
 POR_mission_cristal_palace_desc: "The Palácio de Cristal is rising in Porto. Until it opens, the works will absorb both money and civilian capacity."
 POR_mission_coastal_fort_lisbon_desc: "The new coastal works guarding the Tagus estuary will take years to complete."

