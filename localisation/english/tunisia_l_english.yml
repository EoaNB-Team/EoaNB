  TUN_Modifier_Mayor_of_Tunis: "Municipal Leadership of General Husayn"
  TUN_Modifier_Mayor_of_Tunis_desc: "General Husayn's presidency gives Tunis a permanent municipal authority capable of handling duties that previously fell between older offices and local notables. The council supervises streets, markets, sanitation, public works, commercial regulation, and the physical expansion of the capital while remaining closely tied to the Bey's government. Its creation marks an important shift from personal administration toward specialized civic institutions and provides the machinery needed for the ambitious modernization projects planned for Tunis."

### CHARACTER LOCALISATION ###

  TUN_muhammad_ii_ibn_alhusayn: "Muhammad II ibn al-Husayn"
  TUN_muhammad_ii_ibn_alhusayn_desc: "Muhammad II ibn al-Husayn is the eleventh Bey of the Husainid dynasty and has ruled Tunisia since May 1855. Trained in military affairs and elevated within the Ottoman military hierarchy before his accession, he inherits a state shaped by Ahmad Bey's costly reforms and by a treasury increasingly unable to support them. His instinct is cautious and conservative, but the Batto Sfez affair and mounting British and French pressure force him to confront questions of legal equality, foreign privilege, and the future of the Beylic. The Fundamental Pact of 1857 becomes the defining measure of his short reign, opening the door to reforms that neither he nor his successors will be able to ignore."
  TUN_muhammad_iii_alsadiq: "Muhammad III al-Sadiq"
  TUN_muhammad_iii_alsadiq_desc: "Muhammad III al-Sadiq, widely known as Sadok Bey, becomes the twelfth Bey of the Husainid dynasty in September 1859. He inherits the Fundamental Pact, an ambitious reform movement, a divided court, and a state whose finances are increasingly dependent on loans and extraordinary taxation. His reign sees the Constitution of 1861, the growth of new ministries and councils, the Mejba Revolt of 1864, and ever deeper intervention by European creditors and diplomats. Sadok Bey must balance reform against royal authority, fiscal survival against popular unrest, and Tunisia's formal Ottoman ties against the growing power of France, Britain, and Italy in the Mediterranean."
  TUN_mustapha_khaznadar: "Mustapha Khaznadar"
  TUN_mustapha_khaznadar_desc: "Mustapha Khaznadar is one of the most powerful men in the Beylic, serving for decades at the center of Tunisian finance and eventually as Grand Vizier. Born on Chios and brought into the Husainid household as a mamluk, he rises through the treasury and becomes indispensable to successive Beys because of his ability to find money for their armies, palaces, and reforms. That talent comes at a severe price. His administration is associated with opaque accounts, harsh taxation, costly foreign loans, and extensive personal enrichment. In 1857 he represents both the experience of the old regime and many of the financial practices that reformers believe are pushing Tunisia toward disaster."
  TUN_al_fariq_osman: "Al Fariq Osman"
  TUN_al_fariq_osman_desc: "Al Fariq Osman is a senior officer of the Beylic army serving during a period when Tunisia's military establishment is caught between older provincial methods and the regular forces created by nineteenth-century reform. Surviving records available for this project provide little detail on his personal career, so his role is best understood through the command he holds: an experienced general expected to keep regular formations disciplined and dependable while the army struggles with limited money, uneven training, and competing foreign models of modernization."
  TUN_mohamed_baccouche: "Mohamed Baccouche"
  TUN_mohamed_baccouche_desc: "Mohamed Baccouche belongs to the emerging class of Tunisian officials whose careers combine technical education with service to the Beylic. Trained in engineering, he spends time in northern France and gains practical experience connected with railway construction before returning to Tunisia. He later serves as an officer, secretary to Mustapha Khaznadar, and an official in foreign affairs. Baccouche therefore brings together engineering knowledge, administrative experience, and familiarity with European financial circles, making him useful to a government attempting to modernize without possessing enough trained specialists of its own."
  TUN_mohammed_bouattour: "Mohammed Aziz Bouattour"
  TUN_mohammed_bouattour_desc: "Mohammed Aziz Bouattour comes from a prominent Tunisian family associated with scholarship, the notarial profession, and the state chancellery. Educated at the Zaytuna, he follows his relatives into government service and develops the careful habits of a professional secretary. His career places him within the administrative machinery that reformers are trying to regularize rather than destroy. Bouattour is not the most radical voice at court, but his knowledge of correspondence, law, and bureaucratic procedure makes him exactly the kind of official a more organized state requires."
  TUN_hayreddin_pasha: "Hayreddin Pasha"
  TUN_hayreddin_pasha_desc: "Hayreddin Pasha is one of the most important reformers in nineteenth-century Tunisia. Raised within the Husainid mamluk establishment and trained for military service, he gains experience in diplomacy, administration, and Europe before becoming minister of the navy in 1857. Hayreddin argues that Muslim states can adopt useful European institutions without abandoning their religious or political identity, provided reform strengthens justice, education, public finance, and effective government. His reputation for discipline and his hostility to corruption make him a natural rival to Mustapha Khaznadar and a central figure in any serious attempt to rescue the Beylic from financial and administrative decline."
  TUN_ahmad_diyaf: "Ahmad ibn Abi Diyaf"
  TUN_ahmad_diyaf_desc: "Ahmad ibn Abi Diyaf is a Tunisian jurist, historian, secretary, and statesman whose career places him close to the Husainid court for decades. Educated at the Zaytuna and trained in the chancery, he becomes known for the quality of his Arabic prose and for his belief that rulers should govern through law rather than arbitrary personal authority. He is closely associated with the intellectual language of the 1857 Fundamental Pact and with the broader constitutional reform movement. His historical writings and administrative experience give him unusual perspective on the strengths and weaknesses of the state he is helping to reform."
  TUN_yusuf_jait: "Youssef Djaït"
  TUN_yusuf_jait_desc: "Youssef Djaït comes from a respected family of religious scholars and receives a traditional education at the Zaytuna before entering government service. Rather than remaining solely within the scholarly establishment, he joins the developing chancery and foreign administration of the Beylic, where knowledge of law, Arabic correspondence, and formal procedure is increasingly valuable. Djaït represents a generation able to move between the learned institutions of Tunis and the modernizing bureaucracy. His cautious administrative outlook offers reform without the sharp break from tradition feared by many conservative officials."
  TUN_salem_bouhageb: "Salem Bouhageb"
  TUN_salem_bouhageb_desc: "Salem Bouhageb is a jurist, scholar, poet, and one of the leading Tunisian reformist intellectuals of the nineteenth century. Rooted in the country's Islamic scholarly tradition, he nevertheless argues that useful modern knowledge is compatible with religion and that Tunisia must engage seriously with science, education, and changing political conditions. Bouhageb's importance lies less in command of a ministry than in the intellectual foundation he gives reform. He helps make modernization a Tunisian debate conducted through Arabic learning and Islamic jurisprudence rather than something presented only as an imported European program."
  TUN_nassim_shamama: "Nassim Shamama"
  TUN_nassim_shamama_desc: "Nassim Shamama is a wealthy Tunisian Jewish financier, communal leader, and one of the most influential men connected with the Beylic treasury. Rising from commerce into tax collection and public finance, he becomes Receiver General and later Director of Finance, accumulating an extraordinary private fortune along the way. His skill with accounts, credit, and revenue makes him valuable to a government constantly searching for cash, but his wealth and political connections also make him a symbol of the blurred line between public money and private enrichment. During fiscal crisis he can provide resources few others possess, yet reliance on him carries serious political and financial risks."
  TUN_jean_baptiste_campenon: "Jean-Baptiste Campenon"
  TUN_jean_baptiste_campenon_desc: "Jean-Baptiste Campenon is a French staff officer with direct experience of Tunisia and the Bardo Military School. Trained at Saint-Cyr and in staff work, he is sent to Tunis in the 1850s and becomes familiar with the army the Husainid state is attempting to modernize. After further service in the Crimean War, Algeria, Italy, and China, he returns as part of France's military involvement in Tunisian reform. Campenon can provide valuable instruction in organization, drill, weapons, and staff practice, but his presence also serves a wider French objective: ensuring that Tunisia looks to Paris rather than rival powers for military guidance."
  TUN_ecole_militare_bardo: "École Militaire du Bardo"
  TUN_ecole_militare_bardo_desc: "The École Militaire du Bardo is one of the most important institutions created by Ahmad Bey's modernization program. Established to train a professional officer corps, it exposes Tunisian cadets to mathematics, engineering, artillery, topography, languages, and military science alongside the intellectual traditions of the country. The school produces officers and administrators who later become central to reform, including men whose careers reach far beyond the army. Maintaining the institution is expensive, but without trained officers and technical specialists the Beylic will remain dependent on foreign advisers for every major military project."
  TUN_ahmed_zarrouk: "Ahmed Zarrouk"
  TUN_ahmed_zarrouk_desc: "Ahmed Zarrouk is a mamluk general and provincial administrator whose career is closely tied to the Husainid court and to Mustapha Khaznadar. Educated within the Bardo military environment, he holds important provincial commands and becomes one of the government's most forceful military servants. During the Mejba Revolt of 1864 he is entrusted with extraordinary authority and leads the harsh repression of resistance in the Sahel, using regular infantry and artillery to break the insurgency and impose heavy fines. Zarrouk is effective, disciplined, and feared, a commander whose methods can restore government control but leave lasting bitterness behind them."
  TUN_mohammad_chaouch: "Mohammed Chaouch"
  TUN_mohammad_chaouch_desc: "Mohammed Chaouch is an officer within the Beylic's military establishment whose surviving documentation in the material available for this project is limited. His appointment to the high command nevertheless reflects the practical needs of the Tunisian army: maintaining unit cohesion, restoring formations after setbacks, and keeping soldiers supplied and organized during difficult operations. He is best represented as a dependable professional rather than a celebrated battlefield reformer, a commander valued for steadiness at a time when the army's institutions are still being rebuilt."
  TUN_general_rustum: "Général Rustum"
  TUN_general_rustum_desc: "General Rustum is a Circassian mamluk raised at the Bardo palace and educated at the Bardo Military School alongside other leading reform-era officers. He commands the Beylical Guard and later rises to senior political and military office, eventually serving as Minister of the Interior and Minister of War. During the Mejba Revolt he leads one of the government columns used to restore control in the northwest. Rustum combines the loyalties of the palace household with the training of the reformed army, making him a capable and politically connected commander whose career reflects the close relationship between military service and high office in the Husainid state."
