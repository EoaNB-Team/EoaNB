l_english:

### COUNTRY DESCRIPTION ###

  TUN_END_OF_NEW_BEG_DESC: "In 1857, the Regency of Tunis is a semi-autonomous Ottoman state ruled by Muhammad II Bey of the Husainid dynasty. Ahmad Bey's earlier military reforms left behind new institutions but also heavy expenses, while corruption, weak administration, and an agrarian economy strain the treasury. France dominates neighboring Algeria, Britain protects important Mediterranean interests, and European merchants and consuls press ever more deeply into Tunisian affairs.\n\nThe Batto Sfez affair has brought the question of legal reform to a crisis. Tunisia must decide how far to modernize its government, army, economy, and society while preserving the authority of the Bey and the autonomy of the state. Reform may strengthen the country, but debt and foreign pressure could just as easily place its future in European hands."

### LEADERS DESCRIPTION ###

  POLITICS_MUHAMMAD_II_IBN_AL_HUSAYN: "Muhammad II ibn al-Husayn is the eleventh Bey of the Husainid dynasty and has ruled Tunisia since May 1855. Trained in military affairs and elevated within the Ottoman military hierarchy before his accession, he inherits a state shaped by Ahmad Bey's costly reforms and by a treasury increasingly unable to support them. His instinct is cautious and conservative, but the Batto Sfez affair and mounting British and French pressure force him to confront questions of legal equality, foreign privilege, and the future of the Beylic. The Fundamental Pact of 1857 becomes the defining measure of his short reign, opening the door to reforms that neither he nor his successors will be able to ignore."
  POLITICS_MUHAMMAD_III_AL_SADIQ: "Muhammad III al-Sadiq, widely known as Sadok Bey, becomes the twelfth Bey of the Husainid dynasty in September 1859. He inherits the Fundamental Pact, an ambitious reform movement, a divided court, and a state whose finances are increasingly dependent on loans and extraordinary taxation. His reign sees the Constitution of 1861, the growth of new ministries and councils, the Mejba Revolt of 1864, and ever deeper intervention by European creditors and diplomats. Sadok Bey must balance reform against royal authority, fiscal survival against popular unrest, and Tunisia's formal Ottoman ties against the growing power of France, Britain, and Italy in the Mediterranean."
### EVENTS ###

  tunisia.1.t: "Last Appeal in Batto Sfez Affair"
  tunisia.1.d: "The Batto Sfez affair has become more than a criminal case. Sfez, a Jewish coachman accused of blasphemy after a street dispute and accident, now faces a death sentence that has alarmed Tunisia's Jewish community and drawn the attention of the European consuls. Nassim Shamama and other notables press the court for clemency, while many Muslim subjects insist that the sentence must be upheld and that foreign representatives have no right to interfere. Muhammad II Bey is being forced to decide a case that now touches law, religion, communal security, and the independence of his government."
  tunisia.1.a: "His fate will be decided"

  tunisia.2.t: "Bey Decides His Fate"
  tunisia.2.d: "The arguments have been heard and the decision now rests with the Bey. Pardoning Batto Sfez could calm the non-Muslim community and answer the demands of Britain and France, but it would also be condemned by many subjects as surrender to foreign pressure and interference with Islamic justice. Allowing the sentence to stand would demonstrate the authority of the court and the government, yet it could provoke a diplomatic confrontation at exactly the moment Tunisia can least afford one. Whatever Muhammad II chooses, the affair will not end quietly."
  tunisia.2.a: "Execute him"
  tunisia.2.b: "Freed him"

  tunisia.3.t: "Muslims Outraged"
  tunisia.3.d: "News of Batto Sfez's pardon spreads quickly through Tunis and the surrounding towns. Many Muslim subjects see the decision not as an act of mercy but as proof that European consuls can overturn Tunisian justice whenever their interests are involved. Preachers, merchants, and ordinary townspeople condemn the government for weakness, while rumors exaggerate both the scale of foreign pressure and the privileges supposedly granted to non-Muslims. The Bey has avoided one crisis only to risk creating another in the streets."
  tunisia.3.a: "What will a protest achieve?"

  tunisia.4.t: "Muslim Streets Riots"
  tunisia.4.d: "The protests have broken into open street violence. Crowds gather around markets, mosques, and government offices, while attacks and threats against officials, Jews, and Christian foreigners spread fear through the capital. Religious agitation mixes with anger at foreign interference and resentment toward the Bey's decision. Troops are being called out to restore order, but every soldier in the streets risks making the confrontation worse. Tunis now faces the danger that a legal dispute may become a wider communal and political crisis."
  tunisia.4.a: "This is not looking good ..."

  tunisia.5.t: "Non-muslims Outraged"
  tunisia.5.d: "The execution of Batto Sfez has deeply alarmed Tunisia's non-Muslim communities. Jewish notables fear that the case signals their vulnerability before the law, while European residents and merchants increasingly look to their consuls for protection. The government insists that the sentence followed legal procedure, but foreign representatives are treating the affair as evidence that stronger guarantees for life, property, worship, and equality are required. The Bey has upheld the judgment, yet the political cost is only beginning to appear."
  tunisia.5.a: "What will a protest achieve?"

  tunisia.6.t: "Non-muslims Ask Consuls for Support"
  tunisia.6.d: "Representatives of the Jewish and Christian communities have appealed directly to the French and British consuls for protection. Richard Wood and Léon Roches are already deeply involved in Tunisian affairs, and the Batto Sfez case gives them a powerful argument for demanding formal guarantees from the Bey. What began as domestic unrest is becoming an international dispute over the rights of non-Muslims and foreigners inside the Regency. If London and Paris decide to act together, Tunisia will have little room to ignore them."
  tunisia.6.a: "We have to be ready to deliver a swift answer"

  tunisia.7.t: "Tunisian Delegations Audience in front of Emperor Napoleon"
  tunisia.7.d: "The Tunisian delegation has succeeded in carrying its appeal beyond the consulates of Tunis and into the court of Napoleon III. Its members describe the fears of the non-Muslim population and ask France to press the Bey for stronger guarantees of security and equality. Their audience gives the affair a visibility that the government hoped to avoid. We can only wait to learn whether the Emperor will dismiss the petition as a local matter or use it as justification for a more forceful French policy toward Tunisia."
  tunisia.7.a: "They think He will listen to their pleas?"

  tunisia.8.t: "Tunisian Delegations Audience in front of Emperor Napoleon"
  tunisia.8.d: "A delegation from Tunisia has reached the court of Napoleon III and asks France to intervene on behalf of the Regency's non-Muslim inhabitants. Their petition offers Paris an opportunity to present itself as protector of European interests and religious minorities while expanding French influence beside Algeria. Ignoring them would avoid an unnecessary confrontation, but supporting their demands could force the Bey to accept reforms favorable to France. The decision now belongs to the Emperor and his ministers."
  tunisia.8.a: "Ignore them"
  tunisia.8.b: "Support them"

  tunisia.9.t: "French Emperor Ignores Them"
  tunisia.9.d: "Word has arrived that Napoleon III will not turn the Batto Sfez affair into an immediate confrontation. For the moment, the danger of French military pressure appears to be receding, and the court celebrates what it sees as a victory for Tunisian autonomy. Yet the underlying dispute has not disappeared. European consuls still demand legal guarantees, foreign merchants still seek greater privileges, and the Bey knows that the next crisis may bring a less favorable response from Paris."
  tunisia.9.a: "We are victorious"

  tunisia.10.t: "French Fleet Spotted Near Our Coasts"
  tunisia.10.d: "French warships have appeared off La Goulette in an unmistakable demonstration of force. Their commander claims that France intends to support the Bey in granting security and liberty to his subjects, but the hundreds of guns facing the approaches to Tunis make the message clear. British consul Richard Wood has also warned that a British squadron at Malta is prepared to respond if French pressure becomes a direct threat to the Regency. Muhammad II now stands between rival European powers, each claiming to defend reform while advancing its own interests."
  tunisia.10.a: "This is a dangeorus game..."

  tunisia.20.t: "French Fleet Spotted Near Tunisian Coasts"
  tunisia.20.d: "This morning, Tunis woke up to the news of an unexpected visit from the French Navy. Nine ships armed with seven hundred cannons have been displaced in La Goulette. Their commanding admiral says they are here to help the Bey against any person who prevents him from granting freedom to his subjects and to assure them of the peace and security of their persons and their property. Meanwhile, rumours spread that British Consul Richard Wood had a British squadron anchored in Malta awaiting his order if tensions flared between the Bey and admiral or if any threats by the fleet were formulated against the town."
  tunisia.20.a: "This is not good for Tunisia"

  tunisia.21.t: "French Force us to Create Fundamental Pact"
  tunisia.21.d: "It has been a while since the consuls of Britain and France (Richard Wood and Leon Roches) started putting pressure on us for a new bill of rights to ensure the security of both Tunisians and foreigners. Their influence over our government is rising every day. We must choose a side. Their demands have been condensed into eleven points composing the Ahd Al-Amane (Fundamental Pact), which will open our market to foreign capitalists and will ensure basic human rights for everyone."
  tunisia.21.a: "No land to foreign capitalists!"
  tunisia.21.b: "Accept their demands"

  tunisia.22.t: "Naval Bombing of Tunis"
  tunisia.22.d: "Tonight, the French fleet, which has been stationed near Tunis, has opened fire on the city. There is chaos all around the town, with many deaths have been reported."
  tunisia.22.a: "This is outrageous"

  tunisia.23.t: "Start Creating Fundamental Pact"
  tunisia.23.d: "Today both delegations sit for the first time in front of one table on the topic of Ahd Al-Amane (Fundamental Pact). It will be the new bill of rights to ensure the security of both Tunisians and foreigners. Their demands have been condensed into eleven points, which will open our market to foreign capitalists and will ensure basic human rights for everyone."
  tunisia.23.a: "This is the beggining of something great"

  tunisia.24.t: "Fundamental Pact Signed "
  tunisia.24.d: "After a few days of intense negotiations, both sides struck a deal. Bey of Tunisia will sign Ahd Al-Amane (Fundamental Pact). This new bill of rights ensures the security of both Tunisians and foreigners. This will greatly open Tunisia to the modern world and show that we have a right to place between modern civilized nations."
  tunisia.24.a: "This will greatly benefit the future of Tunis"

  tunisia.11.t: "Khazdanar Scandal"
  tunisia.11.d: "Fresh accusations surrounding Mustapha Khaznadar have again thrown the government into embarrassment. His long control over finance and administration gives him unmatched experience, but it has also tied his name to opaque accounts, private enrichment, expensive borrowing, and the growing burden of public debt. Reformers argue that the Beylic cannot restore confidence while the same men and methods remain at the center of government. The scandal strengthens those at court who want Hayreddin Pasha and a more disciplined administration to replace the old financial order."
  tunisia.11.a: "From bad to worst."

  tunisia.12.t: "The Grand Vizier Question"
  tunisia.12.d: "The question of who should direct the government can no longer be avoided. Mustapha Khaznadar offers long experience, extensive financial connections, and continuity at court, but his administration is inseparable from corruption and mounting debt. Hayreddin Pasha promises a more disciplined reformist course, though his appointment would threaten powerful interests. The Bey must choose his Grand Vizier."
  tunisia.12.a: "Keep Khaznadar as Grand Vizier"
  tunisia.12.b: "Enough of His Corruption, Appoint Hayreddin Pasha"
  
  tunisia.13.t: "Naval Budget"
  tunisia.13.d: "The fleet cannot modernize without money, yet the treasury is already under severe pressure. Ministers now present the Bey with a stark choice: keep naval expenditure restrained and preserve scarce funds, or commit additional resources to ships, crews, docks, and training."
  tunisia.13.a: "Do Not Expand the Budget"
  tunisia.13.b: "Expand the Naval Budget"

  tunisia.14.t: "Palace Renovation"
  tunisia.14.d: "Work on the royal palace has been completed. New rooms, repaired halls, and improved administrative spaces give the Bey a more imposing seat from which to conduct government and receive the dignitaries of Tunisia and foreign powers."
  tunisia.14.a: "A Worthy Seat of Government"

  tunisia.15.t: "Completion of the Mosque of Tunis Renovation"
  tunisia.15.d: "The renovation of the Great Mosque of Tunis is complete. The restored complex once again reflects the importance of one of the capital's foremost religious and educational institutions, strengthening both civic pride and the prestige of the government that sponsored the work."
  tunisia.15.a: "A Monument Worth Preserving"

  tunisia.17.t: "Spreading the Tunisian Culture Abroad"
  tunisia.17.d: "Tunisian scholars, merchants, officers, and travelers are carrying the reputation of the Beylic beyond its shores. By presenting our literature, crafts, learning, and customs abroad, they are building contacts that may return home with political influence and useful knowledge."
  tunisia.17.a: "Let Tunisia Be Known Abroad"

  tunisia.18.t: "Our Travellers Bring News"
  tunisia.18.d: "Travelers returning from Europe and the Ottoman world bring more than stories. They report on new schools, factories, weapons, institutions, books, and political ideas, giving Tunisian reformers a clearer view of how rapidly the wider world is changing."
  tunisia.18.a: "There Is Much We Can Learn"

  tunisia.19.t: "European Inventions Brought to Tunisia"
  tunisia.19.d: "Foreign machines, scientific instruments, medical practices, and technical books are beginning to reach Tunis in greater numbers. What was recently a distant curiosity can now be studied, copied, and adapted to local needs."
  tunisia.19.a: "Put These Inventions to Use"

  tunisia.25.t: "General Husayn Takes Office"
  tunisia.25.d: "The new Municipal Council of Tunis has begun its work, and General Husayn has taken office as its president. The capital will now have a permanent body responsible for urban administration, public order, markets, streets, sanitation, and improvements that once depended on a patchwork of older authorities."
  tunisia.25.a: "The Municipality Has Work to Do"

  tunisia.26.t: "General Husayn Announces Phase One"
  tunisia.26.d: "General Husayn has presented the first phase of his plan for modernizing Tunis. Before construction begins, the city must be surveyed, mapped, counted, and discussed with the ulema, local notables, and foreign specialists so that future works rest on reliable information."
  tunisia.26.a: "Begin the Surveys"

  tunisia.27.t: "General Husayn Announces Phase Two"
  tunisia.27.d: "With the initial surveys and plans complete, General Husayn has announced Phase Two. The government will now turn to the physical city itself by improving roads and water, reorganizing urban jurisdictions, opening space for new districts, supporting printing, and preparing modern defenses."
  tunisia.27.a: "Begin the Works"

  tunisia.28.t: "The Tunisian Official Journal"
  tunisia.28.d: "General Husayn has overseen the establishment of an official Tunisian journal, al-Ra'id al-Tunisi. Government announcements, laws, administrative notices, and articles can now circulate through a regular printed publication, giving reform a public voice and the state a modern instrument of communication."
  tunisia.28.a: "Put the Presses to Work"

  tunisia.29.t: "General Husayn Announces Phase Three"
  tunisia.29.d: "General Husayn has unveiled the final phase of the capital's modernization. The next projects will focus on sanitation, street lighting, rail transport, education, greenery, and the attraction of skilled teachers and industrialists, bringing everyday urban life into the reform program."
  tunisia.29.a: "Complete the Modernization of Tunis"

  tunisia.30.t: "The Telegraph Concession" 
  tunisia.30.d: "A proposal has arrived to connect Tunisia to the expanding Mediterranean telegraph network. French companies offer the capital, equipment, and technical expertise needed to lay lines linking Tunis with its ports and, eventually, with foreign stations across the sea. The concession would greatly accelerate military orders, commercial news, and administrative communication, but it would also place another strategic service in foreign hands. Modern communications promise greater control of the country, provided Tunisia does not lose control of the system itself."
  tunisia.30.a: "Technology is coming to Africa!"

  tunisia.31.t: "The Constitution"
  tunisia.31.d: "After years of debate following the Fundamental Pact, the new Tunisian Constitution is ready to enter into force. Its 114 articles define the powers of the Bey and his ministers, create a Grand Council with substantial authority, regularize the courts, and place new limits on the use of state finances. Tunisia is attempting one of the boldest constitutional experiments in the Arab and Islamic world. Reformers celebrate a government increasingly bound by written law, while opponents fear that the new institutions weaken both the Bey and the traditional order."
  tunisia.31.a: "Not everyone seems to be happy ..."

  tunisia.32.t: "Invite Northern Reformists"
  tunisia.32.d: "The court is gathering the men most closely associated with Tunisia's reform movement. Officials, scholars, soldiers, and administrators who have studied Ottoman and European institutions argue that the Beylic can borrow useful methods without surrendering its religion or independence. Their advice will touch education, administration, finance, law, diplomacy, and the military. Inviting them closer to power begins a new stage of reform, but it also ensures resistance from officials whose influence depends on the old system."
  tunisia.32.a: "They will accept for sure."

  tunisia.33.t: "Cultural Reforms"
  tunisia.33.d: "Tunisia's survival cannot depend on new rifles and tax regulations alone. The state needs schools capable of teaching mathematics and science, a press able to circulate laws and ideas, and scholars willing to debate how useful foreign knowledge can be reconciled with the country's own traditions. Cultural reform will widen the intellectual foundations of modernization and give the next generation of officials a different education from their predecessors. The change will be gradual, but once begun it will reach far beyond the palace."
  tunisia.33.a: "In the name of science!"

  tunisia.34.t: "Trans-Saharan Network"
  tunisia.34.d: "Slavery was formally abolished under Ahmad Bey in 1846, but the decree did not immediately destroy the commercial networks that carried enslaved people north across the Sahara. Smugglers, caravan interests, and local intermediaries continue to profit from a trade that survives beyond effective government supervision. If abolition is to mean more than a declaration issued in Tunis, the state must police the routes, punish illegal traders, and cooperate with authorities along the southern approaches to the Regency."
  tunisia.34.a: "No one should be allowed to trade illegally in our nation!"

  tunisia.100.t: "Mejba Revolt"
  tunisia.100.d: "The first reports are confused, but the news is unmistakable: General Farhat has been killed while attempting to enforce the government's authority in the interior. Resistance to the Mejba has spread far beyond tax evasion, and tribal fighters are rallying around Ali Ben Ghedhahem, already celebrated by supporters as the people's bey. Officials in Tunis can no longer dismiss the unrest as a local disturbance. The countryside is moving toward general revolt, and every delay gives the insurgents more time to organize."
  tunisia.100.a: "Khra...!"

  tunisia.101.t: "Rural Nobles Revolt against New Tax"
  tunisia.101.d: "News of the new Mejba levy has reached the countryside, where rural notables and taxpayers denounce the burden as intolerable. Refusals to pay are spreading, and local leaders warn that attempts to collect the tax by force may provoke open resistance. General Farhat will be sent to restore obedience."
  tunisia.101.a: "Send General Farhat"

  tunisia.102.t: "The Mejba Rate Is Doubled"
  tunisia.102.d: "The government has decided that the existing revenue is insufficient and has doubled the rate of the Mejba. Officials expect the measure to strengthen the treasury, but in the countryside the decision is being received as proof that Tunis intends to make ordinary taxpayers carry the cost of the state's financial crisis."
  tunisia.102.a: "The Treasury Needs the Revenue"

  tunisia.103.t: "General Farhat Is Killed"
  tunisia.103.d: "General Farhat's mission has ended in disaster. His column has been attacked by insurgents, and the general himself has been killed. The news is spreading rapidly through the interior, where opposition to the Mejba is turning from tax resistance into armed revolt."
  tunisia.103.a: "The Revolt Is Spreading"

  tunisia.104.t: "El Kef Falls"
  tunisia.104.d: "El Kef has fallen to the insurgents. Government authority in the northwest is collapsing as rebels seize arms, rally local support, and cut communications. The loss of such an important town makes clear that this is no longer a disturbance that can be handled by a few officials and soldiers."
  tunisia.104.a: "This Is a Disaster"

  tunisia.105.t: "The Mejba Revolt"
  tunisia.105.d: "A major revolt has broken out in Tunisia. Resistance to the Mejba tax has united tribal groups and rural communities against the Bey's government, while Ali Ben Ghedhahem emerges as the most prominent leader of the uprising. The crisis now threatens both Tunisian stability and the interests of the European powers watching from across the Mediterranean."
  tunisia.105.a: "Tunisia Has Erupted"

  tunisia.106.t: "Establish Contact with the Rebels"
  tunisia.106.d: "The revolt in Tunisia offers France both a danger and an opportunity. French interests could be threatened by prolonged disorder, but contact with the insurgents would also give Paris leverage over the Bey. Discreet channels will be opened while we assess which side best serves French interests."
  tunisia.106.a: "Open Discreet Channels"

  tunisia.109.t: "Pressure the Bey to Avoid a Wider Revolt"
  tunisia.109.d: "French officials fear that uncontrolled rebellion could endanger lives, property, trade, and France's political position in Tunisia. Pressure will be applied to the Bey to make concessions and prevent the crisis from escalating further."
  tunisia.109.a: "The Bey Must Make Concessions"

  tunisia.107.t: "Intervention in Tunisia?"
  tunisia.107.d: "The upheaval in Tunisia has revived Italian ambitions across the narrow channel. A weak Beylic might offer an opportunity to secure influence or territory before another power does. Military preparations are being considered in case intervention becomes possible."
  tunisia.107.a: "Prepare for Intervention"

  tunisia.108.t: "Plans Exposed"
  tunisia.108.d: "Our preparations have not remained secret. Reports of possible Italian intervention in Tunisia have reached foreign diplomats, threatening to turn a regional crisis into an international confrontation before any troops have even sailed."
  tunisia.108.a: "The Secret Is Out"

  tunisia.110.t: "Italy Has Plans for Tunisia"
  tunisia.110.d: "London has learned of Italian preparations concerning Tunisia. Britain has no desire to see one Mediterranean power overturn the regional balance while the Beylic is weakened by rebellion, and diplomatic pressure must be brought to bear before an intervention begins."
  tunisia.110.a: "We Cannot Allow This"

  tunisia.111.t: "British Anger"
  tunisia.111.d: "British opposition has made the risks of unilateral action unmistakable. Proceeding against Tunisia could provoke a wider diplomatic crisis and leave Italy isolated. For now, intervention plans will be shelved rather than challenge London over the fate of the Beylic."
  tunisia.111.a: "Do Not Provoke Britain"

  tunisia.112.t: "European Intervention"
  tunisia.112.d: "The Mejba Revolt has drawn the attention of every major power with interests in Tunisia. French pressure, Italian ambitions, British concern, and Ottoman claims now overlap around the crisis. What began as a dispute over taxation is becoming an international question."
  tunisia.112.a: "Tunisia Has Become an International Question"

  tunisia.113.t: "Nassim Shamama Flees with the Treasury"
  tunisia.113.d: "Nassim Shamama, one of the most powerful figures in Tunisian finance, has fled with government records and an enormous fortune reported at roughly twenty million piastres. At the worst possible moment, the treasury has lost both money and a man who knows its accounts better than almost anyone."
  tunisia.113.a: "A Catastrophe for the Treasury"

  tunisia.114.t: "French Pressure for Negotiations"
  tunisia.114.d: "France now insists that negotiations begin before the Tunisian crisis produces a wider conflict. With the rebellion unresolved and foreign powers maneuvering around us, refusing talks may leave the Beylic facing intervention on terms it cannot control."
  tunisia.114.a: "We Have Little Choice but to Negotiate"

  tunisia.115.t: "Non-Intervention Agreement"
  tunisia.115.d: "The interested powers have agreed that none should exploit the Tunisian crisis through unilateral intervention while negotiations continue. The arrangement offers the Beylic a temporary breathing space, but it also confirms that Tunisia's internal affairs have become a matter for foreign diplomacy."
  tunisia.115.a: "No Power Will Intervene Alone"

  tunisia.116.t: "Negotiations Begin"
  tunisia.116.d: "Negotiations are beginning under intense pressure. Rebel grievances, the authority of the Bey, European interests, and the future of recent reforms are all on the table. Each concession may calm the countryside, but too many concessions could leave the government unable to govern."
  tunisia.116.a: "We Must Be Patient"

  tunisia.117.t: "Repeal the Mejba Tax?"
  tunisia.117.d: "The first major demand concerns the Mejba itself. The rebels insist that the tax which helped ignite the uprising be repealed. Abolishing it would remove a central grievance but deprive the treasury of badly needed revenue; refusing may convince the countryside that negotiation is meaningless."
  tunisia.117.a: "Repeal the Tax"
  tunisia.117.b: "The Treasury Cannot Afford It"

  tunisia.118.t: "Suspend the Constitution?"
  tunisia.118.d: "Attention now turns to the constitution. Its institutions and restraints have become entangled with the financial and political crisis, and opponents demand that the government abandon the experiment. Accepting would restore greater freedom of action to the Bey, while refusal could harden resistance."
  tunisia.118.a: "Suspend It"
  tunisia.118.b: "The Constitution Must Stand"

  tunisia.119.t: "Remove Foreign Influence?"
  tunisia.119.d: "The negotiators now demand a reduction of foreign influence within the administration and economy. Removing foreign advisers and interests would answer a powerful nationalist grievance, but it could also cost Tunisia expertise, credit, and the diplomatic support on which the government increasingly relies."
  tunisia.119.a: "Tunisia Must Govern Itself"
  tunisia.119.b: "We Still Need Foreign Investment"

  tunisia.120.t: "Restore Slavery?"
  tunisia.120.d: "A radical demand has entered the negotiations: the restoration of slavery, abolished under Ahmad Bey in 1846. Accepting would appease the most reactionary elements among the rebels but reverse one of Tunisia's most celebrated reforms and provoke outrage from the European powers."
  tunisia.120.a: "Accept the Demand"
  tunisia.120.b: "Slavery Will Not Return"

  tunisia.121.t: "Bribe the Tribal Leaders?"
  tunisia.121.d: "Not every tribal chief is equally committed to the revolt, and money may succeed where threats have failed. The government can offer generous payments to peel leaders away from the insurgency, spend a smaller sum in hopes of weakening them, or refuse to purchase loyalty at all."
  tunisia.121.a: "Pay Whatever It Takes"
  tunisia.121.b: "Offer a Reasonable Sum"
  tunisia.121.c: "We Will Not Buy Their Loyalty"

  tunisia.122.t: "The Reckoning"
  tunisia.122.d: "The negotiations are over and the countryside is waiting. Every concession, refusal, bribe, and act of defiance has altered the strength of the rebel coalition. Now the government will learn whether enough grievances have been answered to restore order, or whether Tunisia is about to descend into a full civil war."
  tunisia.122.a: "Now We Learn the Result"

### FOCUSES ###

  ### FOCUSES AR-RASHID BRANCH ###

  TUN_the_great_prince: "The Great Prince"
  TUN_the_great_prince_desc: "Muhammad II Bey inherits a Tunisia exhausted by the expense of earlier reforms but still determined to preserve its autonomy. He is cautious by temperament, yet the crisis surrounding foreign pressure and domestic unrest demands firmer leadership from the palace. By strengthening the authority of the Bey and restoring confidence in the government, Tunisia can gain the political stability needed to decide its own course rather than have reform dictated from abroad."
  TUN_with_friends_leon_roche: "Friendship with Léon Roche"
  TUN_with_friends_leon_roche_desc: "Ever since France first laid its sights on North Africa, our national sovereignty has been at risk. If we wish to fare better than our neighbours, we must arm ourselves with quill and paper and begin establishing friendly relations with the new dominant power of the region. Thankfully, our great Sultan has made friends with French diplomat and interpreter Léon Roches, which will certainly aid our diplomatic effort."

  TUN_french_investors: "Invite French Investors"
  TUN_french_investors_desc: "France's conquest of neighboring Algeria has made French capital increasingly important across the western Mediterranean. Merchants, bankers, engineers, and concession seekers see opportunities in Tunisian ports, agriculture, infrastructure, and public finance. Inviting their investment can provide money and expertise that the treasury lacks, but every profitable enterprise also gives French interests a larger stake in the country. We must use foreign capital without allowing it to become foreign control."
  TUN_the_old_order: "The Old Order"
  TUN_the_old_order_desc: "The rapid reforms of recent years have unsettled officials, religious authorities, provincial notables, and ordinary subjects who fear that Tunisia is abandoning institutions that have governed the Beylic for generations. The safest path may be to defend the authority of the dynasty, the established social order, and the traditional relationship between ruler and subject. Modernization can be accepted where necessary, but it must never be allowed to overturn the foundations on which Tunisian independence rests."
  TUN_tunisia_first: "Tunisia First"
  TUN_tunisia_first_desc: "Foreign advisers and investments may be useful, but every reform must ultimately serve Tunisian independence and the stability of the Beylic. Outside influence will be accepted only when it strengthens our ability to stand on our own."

  TUN_relegalize_slavery: "Relegalize slavery"
  TUN_relegalize_slavery_desc: "Ahmad Bey abolished slavery in Tunisia in 1846, but reactionaries continue to resent the decree and some economic interests have never stopped profiting from clandestine traffic. Restoring the institution would satisfy the most conservative elements and reopen sources of private wealth at a time of severe financial distress. It would also reverse one of the most important reforms of the Husainid state, inflame domestic divisions, and provoke immediate condemnation from the European powers watching Tunisia for any excuse to intervene."
  TUN_in_name_of_Allah: "In The Name of Allah"
  TUN_in_name_of_Allah_desc: "Reform has raised a deeper question about the moral basis of government. Tunisia is an Islamic state, and no political program can succeed if it appears to treat religion as an obstacle to progress. By presenting order, justice, charity, and responsible rule as obligations rooted in faith, the Bey can rally religious authorities and ordinary believers behind a distinctly Tunisian path. Modern institutions may be useful, but they must be justified in a language that the country recognizes as its own."
  TUN_social_reforms: "Social Reforms"
  TUN_social_reforms_desc: "The social order of the Beylic cannot remain untouched while its laws, schools, army, and administration are being remade. Reformers argue that justice requires more consistent treatment of subjects, stronger protection of life and property, and a government less dependent on inherited privilege. Conservative scholars warn that change must remain compatible with Islamic law and custom. Tunisia must therefore pursue social reform carefully, presenting it not as imitation of Europe but as an effort to govern more justly and effectively."
  TUN_the_fundamental_pact: "The Fundamental Pact"
  TUN_the_fundamental_pact_desc: "The Fundamental Pact will guarantee security of person and property, equality before taxation and the law, freedom of worship, and freer commerce. It answers European pressure, but it also commits Tunisia to a far-reaching reordering of government and society."

  TUN_political_reform: "Political Reforms"
  TUN_political_reform_desc: "The old machinery of government was built for a smaller and less demanding state. Ministries overlap, provincial authority is uneven, court influence often substitutes for written procedure, and foreign consuls exploit every weakness they can find. Political reform will clarify responsibilities, strengthen administration, and give the Bey better instruments for carrying policy beyond Tunis. A more organized state may limit arbitrary power in some areas, but it will also make central authority far more capable of acting throughout the country."
  TUN_municipality_of_tunis: "Establish Municipality of Tunis"
  TUN_municipality_of_tunis_desc: "Tunis is growing too large and complex to be governed through the scattered arrangements of the past. In 1858 a new Municipal Council can bring streets, markets, sanitation, public works, and urban regulation under a permanent civic administration headed by General Husayn. The municipality will not end the authority of the Bey. Instead, it will give the government a practical institution for managing the capital every day, allowing local problems to be addressed before they become matters for the palace itself."
  TUN_stabilize_the_nation: "Stabilize the Nation"
  TUN_stabilize_the_nation_desc: "Reform has little value if the state cannot enforce its laws. The government must reduce arbitrary local practices, restore confidence in public authority, and ensure that decrees issued in Tunis are respected throughout the Beylic."

  TUN_expand_the_royal_palace: "Expand the Dar al-Taj palace"
  TUN_expand_the_royal_palace_desc: "The royal palace is more than the residence of the Bey. It is a seat of administration, ceremony, diplomacy, and dynastic authority, where ministers, provincial officials, foreign representatives, and petitioners all encounter the power of the Husainid state. Expanding the Dar al-Taj will provide additional space for a government whose responsibilities are growing with each reform. It will also project confidence at a time when Tunisia must demonstrate that modernization strengthens the dynasty rather than diminishes it."
  TUN_richard_wood: "Partnership with Richard Wood"
  TUN_richard_wood_desc: "While it is true that France is an immediate threat to our sovereignty, we must also acknowledge Britain's superior fleet, which, thanks to their naval bases in Malta and Gibraltar, projects power throughout the Western Mediterranean. As such, it is imperative that we establish diplomatic ties with London moreover, the English are a more enterprising people, always eager to pounce at any opportunity for profit, and we hope they can bring that spirit to our lands."

  TUN_anglo_tunisia_bank: "Create Anglo-Tunisian Bank"
  TUN_anglo_tunisia_bank_desc: "Our efforts to bring ourselves closer to Britain have bore fruit. In a moment of historical significance, the Anglo-Tunisian Bank has opened its gates as the first modern centre of finance in our Nation, bringing us ever closer to modernity."

  TUN_streamlined_tax_collection: "Streamlined Tax Collection"
  TUN_streamlined_tax_collection_desc: "The treasury loses too much revenue between the taxpayer and Tunis. Tax farming, inconsistent provincial records, exemptions, corruption, and private arrangements allow money to disappear before it ever reaches the state. Streamlining collection will place clearer rules and accounting around the process, reduce opportunities for abuse, and provide the government with a more predictable income. Better collection cannot solve every fiscal problem, but without it even the most carefully designed budget will remain little more than an estimate."
  TUN_improved_agriculture_infastructure: "Modernize Agricultural Infrastructure"
  TUN_improved_agriculture_infastructure_desc: "Agriculture remains the foundation of Tunisian wealth, yet cultivators depend on roads, wells, canals, storage, animals, and tools that are often poorly maintained or beyond their means. Directing investment toward rural infrastructure can raise production without simply increasing the taxes demanded from the countryside. Better irrigation and transport will connect farms to markets, reduce losses, and broaden the revenue base. If the state wishes to collect more from agriculture, it must first help agriculture produce more."
  TUN_agriculture_canals: "Expand Agricultural Canals"
  TUN_agriculture_canals_desc: "Tunisia's countryside depends upon wells, channels, and seasonal waterworks that have too often been neglected. Repairing old canals and extending irrigation will bring more land under cultivation, improve harvests, and strengthen the tax base."

  TUN_renovate_madrasas: "Renovate Madrasas"
  TUN_renovate_madrasas_desc: "The madrasas remain among the great institutions of Tunisian learning, but many suffer from poor funding and aging facilities. Renovating them will preserve religious scholarship while giving a new generation of students better conditions in which to study."

  TUN_issue_debased_currency: "Issue Debased Currency"
  TUN_issue_debased_currency_desc: "The shortage of sound coin and the pressure of government obligations tempt the treasury toward a dangerous expedient. By reducing the precious-metal content of new currency, the state can stretch its reserves and meet payments that would otherwise be impossible. The immediate relief may be substantial, but confidence in the currency will suffer if the measure is abused. Prices may rise, merchants may demand harder money, and the very policy intended to ease the fiscal crisis could deepen the monetary disorder."
  TUN_tunis_bizerte_road: "Renovate Tunis-Bizerte Road"
  TUN_tunis_bizerte_road_desc: "Bizerte is one of the Beylic's most important northern ports, yet movement between it and Tunis remains slow and vulnerable to poor weather and neglected roads. Renovating the route will accelerate trade, military movement, postal traffic, and the work of provincial administration. A dependable road also prepares the corridor for future projects that require materials and machinery to move inland. Infrastructure is expensive, but a state that cannot move goods, officials, and soldiers efficiently cannot hope to modernize anything else."
  TUN_the_dar_al_bey: "Restore Dar al-Bey"
  TUN_the_dar_al_bey_desc: "Built-in the 17th century by Muradid Bey Hammuda Pasha Bey and having a floor added in 1795, The Dar al-Bey quickly became the main office of the tunisian government and a symbol of power. The beautiful Moorish royal house continues to loyally serve our Sultan."

  TUN_palace_renovations: "Palace Renovations"
  TUN_palace_renovations_desc: "Years of heavy use have left parts of the Bey's palaces in need of repair. Restoring halls, offices, courtyards, and reception rooms will improve the practical center of government while preserving the architectural prestige of the Husainid dynasty. Foreign diplomats judge states by symbols as readily as armies, and Tunisian subjects also read the condition of the palace as a reflection of the ruler. Renovation will show that reform and financial strain have not reduced the dignity of the throne."
  TUN_la_goulette_port_improvements: "La Goulette Port Improvements"
  TUN_la_goulette_port_improvements_desc: "La Goulette is the maritime gateway to Tunis, serving merchants, foreign visitors, naval vessels, and the movement of goods into the capital. Its growing importance demands better quays, storage, repair facilities, roads, and harbor administration. Improvements will increase commercial capacity and support the fleet, but they also have strategic value: whichever power can use La Goulette most effectively can exert enormous influence over Tunis. The port must become more modern while remaining firmly in Tunisian hands."
  TUN_great_mosque_of_tunis_renovations: "The Great Mosque of Tunis Renovations"
  TUN_great_mosque_of_tunis_renovations_desc: "The Great Mosque is an important place of worship, and, just like with the Goulette Port and the Dar al-Bey, we must seek to improve it to show our people the prosperity brought upon us by our glorious Sultan."
 
  ### FOCUSES AL-SADIQ BRANCH ###

  TUN_the_reformist: "Muhammad III The Reformer"
  TUN_the_reformist_desc: "Muhammad II is dead and his brother Muhammad III al-Sadiq succeeds him as Bey. The new ruler inherits the Fundamental Pact, a fragile treasury, ambitious reformers, entrenched court interests, and growing European pressure."

  TUN_cultural_reforms: "Cultural Reforms"
  TUN_cultural_reforms_desc: "Political reform will remain shallow if the intellectual life of the country does not change with it. Tunisia needs officials who can understand new sciences, languages, laws, and administrative methods, as well as scholars capable of judging which foreign ideas are useful and which threaten the country's traditions. Cultural reform will encourage education, printing, translation, and public debate while preserving the central place of Arabic and Islamic learning. Modernization must become part of Tunisian society, not merely a collection of decrees from the palace."
  TUN_school_for_science_and_math: "Expand Schools for Math and Science"
  TUN_school_for_science_and_math_desc: "A modern administration and army require surveyors, engineers, doctors, and officers trained in more than traditional learning. Schools devoted to mathematics and the sciences will provide the practical knowledge needed to reform the state."

  TUN_secular_subjects: "Secularize School Subjects"
  TUN_secular_subjects_desc: "Religious instruction will retain its honored place, but Tunisian schools must also teach mathematics, geography, history, languages, law, and the natural sciences. A broader curriculum will prepare students for service in a changing state."

  TUN_european_architecture_and_fashion: "Popularize European Architecture and Fashion"
  TUN_european_architecture_and_fashion_desc: "Tunis stands at the meeting point of the Mediterranean. New buildings, public spaces, clothing, and tastes arriving from Europe are becoming symbols of modernity, and the court can encourage their adoption without abandoning Tunisia's own character."

  TUN_first_tunisian_newspaper: "Create Tunisian Newspapers"
  TUN_first_tunisian_newspaper_desc: "A reforming state needs a reliable way to publish laws, official appointments, administrative notices, and news beyond the walls of the palace. Al-Ra'id al-Tunisi will provide the government with a regular printed voice and create a new forum for educated readers in the capital. The press will remain supervised, but even a censored newspaper changes how information moves through society. Once decrees and ideas can circulate in print, the relationship between government and public life will never be quite the same."
  TUN_support_tunisian_literature: "Support Tunisian Literature"
  TUN_support_tunisian_literature_desc: "Reform cannot be sustained by decrees alone. Patronage for writers, scholars, translators, and printers will strengthen Tunisian letters and give the country's intellectual life a voice of its own."

  TUN_european_art_influences: "Encourage European Art Influence"
  TUN_european_art_influences_desc: "Artists and craftsmen are increasingly exposed to styles circulating through Marseille, Livorno, Malta, and Istanbul. Encouraging these influences may refresh Tunisian art, though conservatives will view the fashion with suspicion."

  TUN_tunisian_culture_in_europe: "Spread Tunisian Culture Through Europe"
  TUN_tunisian_culture_in_europe_desc: "European influence need not move in only one direction. Through exhibitions, publications, merchants, and diplomatic missions, Tunisia can present its own culture to audiences across the Mediterranean."

  TUN_enforce_slave_trade_ban: "Enforce Slave Trade Ban"
  TUN_enforce_slave_trade_ban_desc: "Abolition in 1846 ended the legal institution of slavery, but it did not instantly eliminate the networks that had supplied enslaved people to Tunisian markets. Smuggling and clandestine sales continue wherever officials lack the will or ability to intervene. Enforcing the ban means inspecting routes, punishing traders, and confronting interests that profit from the traffic. If the Husainid government wants credit for abolition, it must prove that the decree applies beyond Tunis and that illegal commerce will no longer be tolerated."
  TUN_Trans_Saharan_networks: "Close Trans-Saharan Road"
  TUN_Trans_Saharan_networks_desc: "The most persistent channels of the illegal slave trade run southward through the trans-Saharan caravan networks that connect Tunisia with the interior of Africa. Closing these routes to human trafficking will require patrols, cooperation with local authorities, tighter controls at markets and oases, and a willingness to challenge merchants with powerful connections. The desert cannot simply be sealed, but the government can make the trade more dangerous, less profitable, and increasingly difficult to conduct openly."
  TUN_succession_reforms: "Enforce Succession Reforms"
  TUN_succession_reforms_desc: "Uncertainty over succession invites court intrigue at precisely the moments when the state is weakest. The Husainid dynasty traditionally favors seniority within the ruling house, but the principle must be stated and enforced clearly if future disputes are to be avoided. Formalizing succession around the eldest eligible prince will give ministers, officers, foreign diplomats, and the population a predictable answer when a Bey dies. A stable throne is an essential foundation for every other reform the government hopes to preserve."
  TUN_organize_the_ministries: "Reorganize The Ministries"
  TUN_organize_the_ministries_desc: "The government has accumulated offices faster than it has developed rules for how they should work together. Responsibilities overlap, records are scattered, ministers rely heavily on personal networks, and important decisions can disappear between the palace and the provinces. Reorganizing the ministries will define jurisdictions, improve record keeping, and make senior officials answerable for specific areas of policy. Tunisia cannot build a modern state while its executive administration remains a collection of competing households and improvised offices."
  TUN_invite_reformists: "Invite The Reformists"
  TUN_invite_reformists_desc: "Tunisia already possesses a generation of officials and scholars who believe that useful reform can be reconciled with the country's religion and political traditions. Men such as Hayreddin Pasha, Ahmad ibn Abi Diyaf, General Husayn, Mahmoud Kabadou, and other administrators bring experience from the Bardo school, the Ottoman world, and Europe. Drawing them into government will give the reform program intellectual direction and practical expertise. It will also threaten men whose wealth and influence depend upon the old methods of administration."
  TUN_the_constitution: "Draft the Constitution"
  TUN_the_constitution_desc: "The promises of the Fundamental Pact must be transformed into institutions. A written constitution will define the powers of the Bey and ministers, establish the Grand Council, organize the courts, and place state finances under clearer legal rules."

  TUN_grand_council: "Form Grand Council"
  TUN_grand_council_desc: "The reforms promised by the Fundamental Pact require institutions able to restrain arbitrary rule and supervise the government. A Grand Council of state advisers will share legislative authority, examine taxation and budgets, and hold ministers to account."

  TUN_sign_it_for_the_people: "Sign It For The People"
  TUN_sign_it_for_the_people_desc: "A constitution will turn promises of reform into a permanent framework of government. By accepting limits on the Bey's authority and recognizing defined rights and institutions, the state may gain legitimacy at home and credibility abroad."

  TUN_centralize_the_government: "Centralize Government"
  TUN_centralize_the_government_desc: "Provincial officials, tax farmers, court favorites, and overlapping offices have left the state difficult to control. Clear chains of authority and stronger ministries will allow Tunis to govern the country more consistently."

  TUN_ministry_of_defense: "Form Ministry of Defense"
  TUN_ministry_of_defense_desc: "Military reform cannot remain scattered among palace officials and individual commanders. A dedicated Ministry of Defense will coordinate recruitment, supply, fortifications, training, and the expenditure required to maintain the Beylic's forces."

  TUN_ministry_of_finance: "Formalize Ministry of Finance"
  TUN_ministry_of_finance_desc: "The treasury is weakened by confused accounts, tax farming, private influence, and mounting obligations. A formal Ministry of Finance will centralize revenue, expenditure, and state bookkeeping under a single authority."

  TUN_european_diplomatic_protocols: "Adopt European Diplomatic Protocols"
  TUN_european_diplomatic_protocols_desc: "Tunisia's position increasingly depends upon skilled dealings with the great powers. Adopting modern diplomatic procedures, permanent correspondence, and clearer treaty practice will make our foreign service more effective."

  TUN_improve_relations_with_french: "Improve Relations with French"
  TUN_improve_relations_with_french_desc: "France's power in neighboring Algeria makes good relations with Paris impossible to ignore. A deliberate diplomatic approach may reduce immediate pressure and open access to investment, expertise, and trade."

  TUN_anglo_tunisian_relations: "Extend Anglo-Tunisian Relations"
  TUN_anglo_tunisian_relations_desc: "Britain has long maintained commercial and diplomatic interests in Tunis and often serves as a counterweight to French influence. Closer relations with London can widen our room for maneuver in the Mediterranean."

  TUN_mission_to_rome: "Send Delegation to Italy"
  TUN_mission_to_rome_desc: "The Italian states and the large Italian community in Tunisia are increasingly important to our trade and politics. A mission across the Mediterranean will cultivate these ties and prepare for the changing balance on the peninsula."

  TUN_host_diplomats: "Host Foreign Diplomats"
  TUN_host_diplomats_desc: "Foreign consuls already exercise considerable influence in Tunis. By receiving diplomats according to regular protocol and making the court a center of formal negotiation, we can turn unavoidable foreign attention to our advantage."

  TUN_recognize_diplomatic_immunities: "Recognize Diplomatic Immunities"
  TUN_recognize_diplomatic_immunities_desc: "Modern diplomacy rests upon accepted rules for envoys and consular representatives. Recognizing diplomatic immunities will reassure foreign governments and place Tunisian practice closer to the standards used by the powers with whom we negotiate."

  TUN_economical_reforms: "Economic Reforms"
  TUN_economical_reforms_desc: "The treasury cannot sustain military modernization, urban projects, and ordinary government while revenue remains inefficient and debt continues to grow. Taxation, accounting, credit, agriculture, and public finance all require reform."

  TUN_efforts_reduce_corruption: "Fight Against Corruption"
  TUN_efforts_reduce_corruption_desc: "Public offices have too often been treated as sources of private income. Audits, dismissal of abusive officials, clearer salaries, and tighter supervision can begin restoring confidence in the administration."

  TUN_equitable_taxes: "Enforce Equitable Taxes"
  TUN_equitable_taxes_desc: "The Fundamental Pact promises equality before taxation, yet collection remains uneven and vulnerable to privilege. A more equitable system will spread obligations more consistently across the population and reduce arbitrary exactions."

  TUN_standartized_rate_across_provinces: "Standardize Rates Across Our Provinces"
  TUN_standartized_rate_across_provinces_desc: "Different provinces and collectors impose different burdens, encouraging evasion and resentment. Standard rates and central records will make taxation more predictable and easier for the government to supervise."

  TUN_farming_equipment_subsidies: "Subsidise Farming Equipment"
  TUN_farming_equipment_subsidies_desc: "Most Tunisians still draw their livelihood from agriculture. Subsidizing improved tools and equipment will help cultivators raise output while giving the government a stronger rural economy from which to draw revenue."

  TUN_bank_of_tunisia_founding: "Found Bank of Tunisia"
  TUN_bank_of_tunisia_founding_desc: "The state needs institutions capable of managing credit, payments, deposits, and public finance on a more reliable basis. A Bank of Tunisia can support commerce and give the government an alternative to improvised borrowing."

  TUN_french_and_italian_financial_experts: "Invite French and Italian Finance Experts"
  TUN_french_and_italian_financial_experts_desc: "European financiers possess experience in modern accounting, banking, and public credit that our administration lacks. Inviting French and Italian experts may strengthen the treasury, although dependence on foreign advice carries risks of its own."

  TUN_renew_old_infrastructures: "Repair Old Infrastructure"
  TUN_renew_old_infrastructures_desc: "Years of uneven maintenance have left roads, waterworks, and public facilities in poor condition. Repairing what already exists is cheaper and faster than building everything anew, and gives future projects a firmer foundation."

  TUN_influences_from_the_north: "Spread Influences From the North"
  TUN_influences_from_the_north_desc: "Across the Mediterranean, European cities are being reshaped by new roads, ports, engineering works, financial institutions, and systems of urban administration. Tunisia does not need to copy every foreign fashion, but it cannot ignore techniques that make neighboring states wealthier and more effective. Engineers, investors, and technical advisers from France, Britain, and Italy can help us repair infrastructure and plan new projects. The challenge is to import knowledge without importing political dependence along with it."
  TUN_the_telegraph_concession: "Sign The Telegraph Concessions"
  TUN_the_telegraph_concession_desc:  "The electric telegraph is transforming government and commerce by reducing messages that once required days of travel to minutes. A concession allowing foreign specialists to construct lines in Tunisia would connect the capital more closely with La Goulette, provincial authorities, and the wider Mediterranean network. Faster communication will strengthen administration and military response, but strategic dependence on a foreign-built system carries obvious risks. We must embrace the technology while ensuring the state retains authority over its use."
  TUN_the_marseille_of_the_desert: "The Marseille of the Desert"
  TUN_the_marseille_of_the_desert_desc: "Tunis should no longer appear to foreign visitors as a capital separated from the great commercial cities of the Mediterranean. With surveys, improved roads, sanitation, lighting, new schools, better port connections, and carefully planned expansion beyond the old walls, the city can become a showcase for the reforming Beylic. French engineers may provide useful expertise, but the project must serve Tunisian needs first. A modern capital will strengthen commerce, administration, and the prestige of the state at the same time."
  TUN_industrialize_the_country:  "Industrialize the Country"
  TUN_industrialize_the_country_desc: "An agrarian economy leaves the state dangerously dependent on harvests, customs receipts, and foreign manufactured goods. Workshops and factories can process Tunisian raw materials at home, create new sources of employment, broaden the tax base, and reduce the need to import every finished product from Europe. Industrialization will require capital, skilled labor, machinery, and better transport, none of which can be created overnight. Even modest progress, however, will give Tunisia more tools with which to confront its growing financial weakness."
  TUN_tunis_la_goulette_railway: "Build Tunis-La Goulette Railway"
  TUN_tunis_la_goulette_railway_desc: "A railway between Tunis and La Goulette would bind the capital directly to its principal port. Goods, officials, soldiers, and passengers could move rapidly between the city and the coast, transforming commerce around the capital."

  TUN_the_monetary_issue: "Quell Monetary Issue"
  TUN_the_monetary_issue_desc: "Tunisia's fiscal crisis is becoming a monetary crisis as well. Hard coin is scarce, confidence in government finance is weakening, and every new loan or debasement creates further uncertainty for merchants and taxpayers. Corruption inside the administration makes the problem worse by obscuring how much money the state truly receives and owes. Before the treasury can regain stability, the government must confront the condition of the currency, the quality of its accounts, and the officials who profit from confusion."
  TUN_politics: "The Grand Vizier Question"
  TUN_politics_desc: "The Grand Vizier's office stands at the center of the Beylic's administration. Mustapha Khaznadar offers experience, money, and continuity, while Hayreddin Pasha represents a more disciplined reformist course. The court must decide who will guide the state."

  TUN_introduce_state_courts: "Introduce State Courts"
  TUN_introduce_state_courts_desc: "The Fundamental Pact promises security and equality before the law, but such guarantees require institutions to enforce them. New state courts will provide more regular criminal and commercial justice alongside existing religious jurisdictions."

  TUN_khezdanar_is_fine: "Keep Khezdanar"
  TUN_khezdanar_is_fine_desc: "Mustapha Khaznadar has dominated Tunisian government for years and knows how to raise money when others cannot. Keeping him preserves continuity and access to his networks, even if corruption and costly financial expedients continue to shadow his rule."

  TUN_Hayreddin_Pasha: "Appoint Hayreddin Pasha"
  TUN_Hayreddin_Pasha_desc: "Hayreddin Pasha combines military experience, knowledge of Europe, and a belief that reform can strengthen an Islamic state without surrendering its independence. Entrusting him with greater authority will challenge entrenched interests but may steady the Beylic."

  TUN_deal_with_national_debts: "Deal with National Debt"
  TUN_deal_with_national_debts_desc: "Years of military expenditure, court spending, ambitious reforms, weak revenue collection, and increasingly expensive borrowing have left the Beylic with obligations it cannot simply ignore. New loans may postpone the crisis, but foreign creditors are already using Tunisia's need for money to gain political and economic influence. The government must find a way to raise revenue, renegotiate obligations, and impose discipline on expenditure before debt becomes the instrument through which outsiders take control of Tunisian policy."
  TUN_mejba_tax: "Introduce Mejba Tax"
  TUN_mejba_tax_desc: "The treasury needs dependable revenue, and the Mejba head tax offers a direct source of income from the countryside. Yet increasing the burden on rural communities risks turning fiscal reform into open resistance."

  TUN_issue_bonds: "Issue New Bonds"
  TUN_issue_bonds_desc: "Government bonds can provide the money needed to meet immediate obligations and continue reform. The relief is only temporary, however, for every new issue adds interest payments and exposes Tunisia further to foreign creditors."

  TUN_negotiate_with_europeans: "Negotiate with Europeans"
  TUN_negotiate_with_europeans_desc: "Our financial difficulties cannot be solved without dealing with European creditors and governments. Careful negotiation may reduce the immediate burden, though each concession risks giving outsiders a greater voice in Tunisian affairs."

  TUN_equal_treatment_europeans_and_tunisians: "Equal Treatment of All Citizens"
  TUN_equal_treatment_europeans_and_tunisians_desc: "The state has pledged security and equality before the law regardless of religion or nationality. Applying those principles consistently to Tunisians and Europeans alike may calm foreign pressure while strengthening the legitimacy of reform."

  TUN_double_the_rate: "Double the Tax Rate"
  TUN_double_the_rate_desc: "The government can force more money from the Mejba by doubling its rate, but the arithmetic is easier than the politics. Rural taxpayers already consider the levy oppressive, and a sharper burden may turn anger into rebellion."

  TUN_populous_response: "Popular Response"
  TUN_populous_response_desc: "The countryside has answered fiscal pressure with defiance. Petitions, refusals to pay, tribal mobilization, and armed resistance are beginning to merge into a broader challenge to the authority of the Bey."

  TUN_double_entry_bookkeeping: "Use Double Entry Bookkeeping"
  TUN_double_entry_bookkeeping_desc: "The treasury cannot be reformed while revenue and expenditure remain buried in inconsistent ledgers. Double-entry bookkeeping will make accounts easier to audit, reveal losses, and impose greater discipline on public finance."

  TUN_an_actual_budget: "Create State Budget"
  TUN_an_actual_budget_desc: "For too long, the state has spent according to immediate need and court demand rather than a coherent plan. A formal annual budget will force ministries to compare expected revenue with their obligations before money is committed."

  TUN_creation_of_state_treasury: "Creation of State Treasury"
  TUN_creation_of_state_treasury_desc: "A centralized state treasury will separate public funds from the personal finances of officials and the court. Revenues can then be recorded, guarded, and disbursed according to government priorities rather than private convenience."
 
  ### FOCUSES AFTERMATH OF MAJBA REBELION BRANCH ###

  TUN_contain_bled_el_majba_revolt: "Contain the Bled el Majba Revolt"
  TUN_contain_bled_el_majba_revolt_desc: "Resistance to the Mejba is spreading through the interior and threatens to escape the government's control. Tunis must isolate the rebels, secure the roads, and prevent local grievances from becoming a general uprising against the Bey."

  TUN_seek_ottoman_funds: "Seek Ottoman Funds"
  TUN_seek_ottoman_funds_desc: "Tunisia still acknowledges the suzerainty of the Ottoman Sultan, and Istanbul has an interest in preventing the Beylic from falling under European control. Financial assistance from the Porte could buy us precious time, though it will not come without political expectations."

  TUN_negotiate_autonomy: "Negotiate Autonomy"
  TUN_negotiate_autonomy_desc: "Our relationship with the Ottoman Empire is deliberately ambiguous, combining formal allegiance with broad practical independence. A new understanding with Istanbul could secure support while defining the autonomy the Beylic intends to preserve."

  TUN_khaznader_bribes_rebels: "Send Khaznader to Bribe Rebel Leaders"
  TUN_khaznader_bribes_rebels_desc: "Khaznadar understands that loyalty can sometimes be purchased more cheaply than victory can be won. Money offered to chiefs and local notables may fracture the revolt before the army is forced into a long campaign."

  TUN_pit_tribes_against_each_other: "Play Tribes Against Each Other"
  TUN_pit_tribes_against_each_other_desc: "The rebel coalition is not a single united body. Old rivalries between tribes and local leaders can be exploited, turning potential allies against one another and denying the uprising the unity it needs."

  TUN_ask_for_anglo_french_assistance: "Ask for Anglo-French Assistance"
  TUN_ask_for_anglo_french_assistance_desc: "If the Beylic cannot restore order alone, Britain and France may be persuaded to support the established government. Their assistance could end the crisis, but inviting the great powers into an internal conflict will deepen their influence over Tunisia."

  TUN_french_intervention_focus: "Lobby for French Intervention"
  TUN_french_intervention_focus_desc: "French officers, rifles, uniforms, and political backing could give the government a decisive advantage against the rebels. Accepting such aid will strengthen the army in the short term while making French pressure much harder to resist afterward."

  TUN_anglo_tunisian_convention: "Sign Anglo-Tunisian Convention"
  TUN_anglo_tunisian_convention_desc: "British support can be secured through commercial concessions. A convention reducing barriers to British trade may provide diplomatic backing and investment, but it will also limit our freedom to protect local revenue and commerce."

  TUN_buy_british_gunboats: "Buy British Gunboats"
  TUN_buy_british_gunboats_desc: "British yards can supply small steam-powered gunboats suited to patrol, coastal defense, and harbor service. Purchasing them will expand the fleet quickly without waiting for Tunisian shipbuilding capacity to catch up."

  TUN_revoke_the_constitution: "Revoke Constitution"
  TUN_revoke_the_constitution_desc: "The constitutional experiment has become entangled with fiscal crisis and rebellion. Suspending it will return wider authority to the Bey and ministers, allowing the government to act quickly, though at the cost of the political guarantees recently proclaimed."

  TUN_plunder_te_sahil: "Plunder Sahil Region"
  TUN_plunder_te_sahil_desc: "The prosperous towns and villages of the Sahel can be made to pay for their resistance. Seizures and punitive levies will refill the treasury, but they will leave bitterness long after the soldiers have departed."

  TUN_conscript_sahil_locals: "Force Conscription of Sahil Locals"
  TUN_conscript_sahil_locals_desc: "The army needs manpower, and the Sahel can be compelled to provide it. Forced conscription will strengthen government forces while punishing communities suspected of aiding the revolt."

  TUN_aftermath_of_the_revolt: "Aftermath of the Mejba Rebellion"
  TUN_aftermath_of_the_revolt_desc: "The revolt has shaken the authority of the Bey, devastated parts of the countryside, and exposed the weakness of the treasury. Restoring order is only the beginning; the state must decide what lessons to draw from the crisis."

  TUN_future_of_the_beylic: "Future of Beylik"
  TUN_future_of_the_beylic_desc: "Tunisia has survived reform, fiscal crisis, foreign pressure, and rebellion, but none of the questions facing the Beylic have disappeared. The course chosen now will determine whether Tunis preserves meaningful independence or drifts further into dependence."
 
  ### FOCUSES ARMY BRANCH ###

  TUN_armee_de_tunis: "Army of Tunis"
  TUN_armee_de_tunis_desc: "The army inherited from Ahmad Bey's reforms contains regular infantry, cavalry, artillery, and officers trained at the Bardo, but its organization remains uneven and expensive. A new reform program can turn these scattered foundations into a more reliable Army of Tunis."

  TUN_tunis_fortification: "Adapt Fortification of Tunis"
  TUN_tunis_fortification_desc: "Tunis is the political heart of the Beylic and must be protected accordingly. Modernizing the capital's defenses will strengthen old works, improve their fields of fire, and prepare them for increasingly powerful artillery."

  TUN_la_goulette_fortifications: "Expand La Goulette Port Fortification"
  TUN_la_goulette_fortifications_desc: "La Goulette guards the sea approach to Tunis and anchors the capital's maritime lifeline. Expanding its fortifications will make any hostile fleet think twice before attempting to force the harbor."

  TUN_ravelins_and_lunettes: "Ravelins and Lunettes"
  TUN_ravelins_and_lunettes_desc: "Modern forts depend on layered defenses rather than a single wall. Ravelins and lunettes placed before the main works will break up assaults, protect vulnerable approaches, and make better use of defensive artillery."

  TUN_military_administration: "Military Administration"
  TUN_military_administration_desc: "A modern army requires more than brave soldiers. Registers, pay offices, supply departments, standardized orders, and clear responsibility between commanders will give the military an administration capable of sustaining operations."

  TUN_european_military_laws: "Adapt European Military Laws"
  TUN_european_military_laws_desc: "European armies increasingly rely on formal regulations governing service, promotion, discipline, and command. Adapting useful parts of these systems will reduce arbitrary practice and make our forces easier to organize."

  TUN_new_developments: "New Developments"
  TUN_new_developments_desc: "Small arms are changing rapidly as improved ignition systems, rifling, ammunition, and manufacturing methods spread across Europe. Tunisia must study these developments before its infantry falls hopelessly behind."

  TUN_medical_improvments: "Medical Improvements"
  TUN_medical_improvments_desc: "Disease and untreated wounds can destroy an army as surely as enemy fire. Better medical organization, sanitation, trained attendants, and reliable supplies will keep more soldiers alive and in the ranks."

  TUN_implement_field_hospitals: "Implement Field Hospitals"
  TUN_implement_field_hospitals_desc: "Permanent hospitals cannot follow an army on campaign. Organized field hospitals will bring surgeons, medicines, and basic sanitation closer to the fighting and improve the chances of wounded soldiers surviving."

  TUN_rifled_cannons: "Rifled Cannons"
  TUN_rifled_cannons_desc: "Rifled artillery promises greater range and accuracy than traditional smoothbore guns. Mastering the new weapons will allow Tunisian batteries to strike harder and make better use of scarce ammunition."

  TUN_european_pattered_rifles: "European-Pattern Rifles"
  TUN_european_pattered_rifles_desc: "Standardized rifles and uniforms modeled on successful European patterns will simplify supply and training while improving the firepower and cohesion of our regular infantry."

  TUN_french_army_advisor: "French Army Advisors"
  TUN_french_army_advisor_desc: "France maintains the strongest military presence in North Africa and possesses officers experienced in modern campaigning. A French advisory mission can accelerate reform, though foreign instruction will inevitably bring foreign influence."

  TUN_european_drill: "European Drill"
  TUN_european_drill_desc: "Regular drill turns individual soldiers into units capable of maneuvering under fire. Standard commands, formations, and exercises will improve discipline and help officers control their men on the battlefield."

  TUN_creation_of_artillery_units: "Creation of Artillery Units"
  TUN_creation_of_artillery_units_desc: "Artillery should no longer be treated as guns attached wherever convenient. Dedicated batteries with trained crews, horses, ammunition trains, and officers will give the army dependable fire support."

  TUN_infantry_regiments: "Infantry Regiments"
  TUN_infantry_regiments_desc: "The infantry must be organized into permanent regiments with predictable strength, officers, equipment, and training. Stable formations will be easier to mobilize and command than improvised collections of troops."

  TUN_hierarchical_system: "Hierarchical System"
  TUN_hierarchical_system_desc: "Clear ranks and chains of command are essential to a professional army. Defining authority from the high command down to company officers will improve planning, discipline, and battlefield coordination."

  TUN_supply_chais_and_depots: "Supply Chains and Depots"
  TUN_supply_chais_and_depots_desc: "Campaigns fail when food, powder, ammunition, and replacement equipment do not reach the troops. A network of depots and organized supply chains will allow the army to operate farther from Tunis with less waste."

  TUN_beylic_light_infantry: "Beylic Light Infantry"
  TUN_beylic_light_infantry_desc: "Tunisia's terrain favors troops able to move quickly outside rigid line formations. Specialized light infantry can screen the main army, skirmish, patrol difficult ground, and respond rapidly to unrest."

  TUN_beylic_engineers: "Beylic Engineers"
  TUN_beylic_engineers_desc: "Engineers are needed to build roads, bridges, fieldworks, camps, and fortifications. Training a dedicated corps will give commanders the technical manpower required by a modern army."

  TUN_restructured_beylic_cavalry: "Restructured Beylic Cavalry"
  TUN_restructured_beylic_cavalry_desc: "Mounted troops remain valuable for reconnaissance, rapid movement, policing, and operations across open country. Reorganizing the Beylic cavalry will preserve these strengths while imposing more regular training and command."

  TUN_mounted_rifles: "Mounted Rifles"
  TUN_mounted_rifles_desc: "Mounted riflemen combine the mobility of cavalry with the firepower of modern infantry. They can ride quickly to threatened areas, dismount to fight, and cover distances that ordinary foot soldiers cannot."

  TUN_beylic_gendarmerie: "Found Beylic Gendarmerie"
  TUN_beylic_gendarmerie_desc: "The army should not be the only instrument available whenever disorder breaks out. A national gendarmerie will police roads and rural districts, pursue banditry, and extend government authority beyond the major towns."

  TUN_reorganize_the_police_force: "Reorganize Police Force"
  TUN_reorganize_the_police_force_desc: "Urban policing remains fragmented and too dependent on local arrangements. Reorganization will establish clearer commands, responsibilities, and procedures for maintaining public order in Tunisia's growing towns."

  ### FOCUSES NAVY BRANCH ###

  TUN_focus_navy: "Tunisian Navy"
  TUN_focus_navy_desc: "Tunisia's navy is a proud but costly institution whose ships and facilities are struggling to keep pace with the steam age. Reforming the fleet and its shore establishments is essential if the Beylic is to defend its coast and maritime trade."

  TUN_wrestle_with_budget: "Wrestle with Budget"
  TUN_wrestle_with_budget_desc: "Ships consume money even when they remain in harbor. Before the fleet can be rebuilt, the government must decide how much of its strained treasury can realistically be devoted to naval ambitions."

  TUN_no_budget_expansion: "No Budget Expansion"
  TUN_no_budget_expansion_desc: "The treasury cannot support every reform at once. Holding naval expenditure at its present level will preserve scarce funds, even if it means accepting a smaller and slower modernization program."

  TUN_all_power_to_navy: "All Power to Navy"
  TUN_all_power_to_navy_desc: "A credible fleet requires sustained spending on crews, maintenance, ammunition, docks, and new vessels. We will make the navy a priority and accept the financial burden that comes with it."

  TUN_introduction_of_steamships: "Introduce Steamships"
  TUN_introduction_of_steamships_desc: "Steam power frees warships from dependence on wind and gives commanders greater control over movement in confined waters. Acquiring the knowledge and machinery to operate steamships is the first step toward a modern fleet."

  TUN_aquire_the_sultan: "Acquire the Sultan"
  TUN_aquire_the_sultan_desc: "A new corvette bearing the name Sultan will provide the fleet with a useful modern warship and a visible symbol of Tunisia's continuing naval ambitions."

  TUN_el_rahman: "El Rahman"
  TUN_el_rahman_desc: "The fleet needs more than a single showpiece. Commissioning the corvette El Rahman will expand our effective squadron and give Tunisian crews further experience with newer ship types."

  TUN_bizerte_repair_shops: "Bizerte Repair Shops"
  TUN_bizerte_repair_shops_desc: "Bizerte's excellent natural harbor can serve more than passing ships. Repair shops there will allow damaged vessels to receive routine maintenance without returning to La Goulette or relying on foreign yards."

  TUN_expanding_la_goulette_shipyards: "Expand La Goulette Shipyards"
  TUN_expanding_la_goulette_shipyards_desc: "La Goulette is the center of Tunisian naval activity. Enlarged workshops, slips, storage, and dock facilities will improve the fleet's ability to maintain vessels and support future construction."

  TUN_european_naval_architecture: "European Port Architecture"
  TUN_european_naval_architecture_desc: "European ports and naval yards are being rebuilt around steam machinery, heavier ships, and more specialized facilities. Adapting their engineering practices will help Tunisian harbors serve a changing fleet."

  TUN_european_naval_practices: "Oversee European Naval Exercise"
  TUN_european_naval_practices_desc: "Observing European exercises will expose our officers to modern signaling, formation keeping, gunnery routines, and fleet maneuver. Lessons taken at sea can then be adapted to Tunisian conditions."

  TUN_french_naval_mission: "French Naval Mission"
  TUN_french_naval_mission_desc: "French naval officers possess extensive experience in steam navigation, gunnery, and Mediterranean operations. Inviting a mission to Tunis will provide valuable instruction while further tightening military links with France."

  TUN_tunisian_naval_academy: "Found Tunisian Naval Academy"
  TUN_tunisian_naval_academy_desc: "The navy cannot modernize without officers who understand navigation, mathematics, engineering, gunnery, and administration. A permanent naval academy will create a professional corps trained for the steam age."

  TUN_squadron_organization: "Squadron Organization"
  TUN_squadron_organization_desc: "Individual ships are of limited value if they cannot operate together. Formal squadron organization, standardized commands, and regular exercises will allow the fleet to maneuver as a coherent force."

  TUN_european_style_regulations: "European Style Regulations"
  TUN_european_style_regulations_desc: "Clear regulations for discipline, watchkeeping, maintenance, promotion, and shipboard routine will make naval service more predictable and professional from the quarterdeck to the lower decks."

  TUN_modern_naval_artillery: "Modern Naval Artillery"
  TUN_modern_naval_artillery_desc: "Warships are carrying heavier and more accurate guns, making old batteries increasingly obsolete. Modern naval artillery and improved gunnery practice will keep our ships dangerous in a fight."

  TUN_european_ship_design: "European Ship Design"
  TUN_european_ship_design_desc: "Foreign shipyards are rapidly improving hull forms, internal arrangements, propulsion, and protection. Studying their designs will shorten the path toward vessels better suited to modern naval warfare."

  TUN_steam_adapted_hulls: "Steam Adapted Hulls"
  TUN_steam_adapted_hulls_desc: "Steam engines impose new demands on hull strength, weight distribution, machinery spaces, and fuel storage. Adapting ship construction to these requirements will make our future vessels more reliable and efficient."

  TUN_ship_telegraphy: "Ship Telegraphy"
  TUN_ship_telegraphy_desc: "Electrical telegraphy can transform communication between ports, headquarters, and naval installations. Faster transmission of orders and reports will help the fleet prepare and respond before events overtake it."

  TUN_coastal_artillery: "Coastal Artillery"
  TUN_coastal_artillery_desc: "Tunisia cannot match every European fleet ship for ship. Strong coastal batteries around vital harbors can still deny an enemy easy access and allow the navy to fight under the protection of land-based guns."

  TUN_immigrant_labour_force: "Immigrant Labour Force"
  TUN_immigrant_labour_force_desc: "French, Italian, Maltese, and other Mediterranean communities bring merchants, craftsmen, sailors, and skilled labor to Tunisia. Encouraging immigration can enlarge the workforce needed for ports, workshops, construction, and trade."

  TUN_promenade_de_la_marine: "Promenade de la Marine"
  TUN_promenade_de_la_marine_desc: "Improving the waterfront of Tunis will create a more attractive commercial promenade linking the city to its maritime life. The project can encourage trade and advertise the capital's growing openness to the Mediterranean world."

  TUN_the_italian_trade: "Italian Trade"
  TUN_the_italian_trade_desc: "Ties with ports on the Italian peninsula already shape Tunisian commerce and migration. Expanding these connections will bring more merchants and goods across the narrow waters between our shores."

  TUN_the_tuscan_jews: "Tuscan Jews"
  TUN_the_tuscan_jews_desc: "Jewish merchant families connected to Tunis and Livorno have long linked North Africa with Italian and wider Mediterranean markets. Encouraging these commercial networks can bring capital, contacts, and expertise into the Beylic."

  TUN_we_go_forward_with_italy: "Forward with Italy"
  TUN_we_go_forward_with_italy_desc: "Closer naval and commercial ties with the new Italian state offer access to nearby shipyards, officers, and maritime knowledge. Cooperation with Italy can provide a counterweight to excessive dependence on France."

  TUN_empower_the_french: "Empower the French"
  TUN_empower_the_french_desc: "France possesses the dominant naval and military presence in the western Mediterranean. Relying on French expertise can accelerate the development of larger warships, but it will give Paris another avenue of influence in Tunis."

  TUN_sultans_orders: "Sultans Orders"
  TUN_sultans_orders_desc: "The Beylic remains formally tied to the Ottoman Sultan, and requests from Istanbul cannot be dismissed lightly. Meeting the Sultan's maritime expectations will demonstrate loyalty while binding Tunisian naval policy more closely to the empire."

  TUN_the_winter_matter: "Winter Matter"
  TUN_the_winter_matter_desc: "Maintaining an active fleet through winter requires crews, stores, sheltered anchorages, and dependable maintenance. We will confront the seasonal burden directly rather than allow the squadron to decay in harbor."

  TUN_a_season_harbour: "Season Harbour"
  TUN_a_season_harbour_desc: "Instead of sustaining full operations in every season, our principal harbor can be organized around the rhythms of weather, trade, and maintenance. A seasonal system will concentrate resources when they are most useful."

  TUN_hayreddin_pashas_reforms: "Hayreddin Pashas Reforms"
  TUN_hayreddin_pashas_reforms_desc: "Hayreddin Pasha understands that a navy depends as much on administration, ports, training, and finance as on ships. His reform program will impose greater discipline on the fleet and connect naval modernization to the wider renewal of the state."

### MISSIONS & DECISIONS ###

  tunisia_defense_category: "Tunisian Army"

  TUN_mission_bardo_school_finances: "Financing École militaire du Bardo"
  TUN_mission_bardo_school_finances_desc: "The École militaire du Bardo cannot train officers on prestige alone. Stable funding is needed for instructors, classrooms, equipment, languages, mathematics, engineering, and the military sciences that underpin the Beylic's reform program."

  TUN_decision_the_marseille_of_the_desert: "Modern Capital Investments"
  TUN_decision_the_marseille_of_the_desert_desc: "Tunis can become a modern Mediterranean capital, but such ambitions require sustained investment in streets, public works, administration, sanitation, schools, and commercial infrastructure."

  TUN_decision_establish_municipality_of_tunis: "Modern Administrative Districts"
  TUN_decision_establish_municipality_of_tunis_desc: "A permanent municipal administration will give Tunis officials specifically responsible for streets, markets, sanitation, public works, and the day-to-day management of a rapidly changing capital."

  TUN_decision_renew_old_infrastructures: "Renew Old Infrastructures"
  TUN_decision_renew_old_infrastructures_desc: "Roads, waterworks, public buildings, and other basic infrastructure have suffered from years of piecemeal maintenance. Renewing them will provide a sound foundation for later modernization."

  tunisia_economy_category: "Tunisian Economy"
  tunisia_economy_category_desc: "The Tunisian economy remains overwhelmingly agrarian while the government struggles with weak revenues, limited infrastructure, and growing foreign commercial influence. These measures can expand production and modernize the country, but every project must be balanced against the treasury's fragile condition."
  
  TUN_develop_tunis: "Expand Tunisian Farmlands"
  TUN_develop_tunis_desc: "Land around Tunis can support greater production if it is cleared, irrigated, and brought under more regular cultivation. Expanding the capital region's farmland will strengthen local food supplies and agricultural revenue."
  
  TUN_develop_tunis_agriculture: "Develop the Tunis Agriculture"
  TUN_develop_tunis_agriculture_desc: "Improved irrigation, tools, organization, and access to markets can raise agricultural output around Tunis. The state will direct resources toward making the region's farms more productive."
  
  TUN_renovate_the_madrasas: "Renovate the Madrasas"
  TUN_renovate_the_madrasas_desc: "Repairs, books, and better facilities will restore the capital's madrasas as functioning centers of learning and prepare them to support a broader program of educational reform."
  
  TUN_decsion_issue_debased_currency: "Issue Debased Currency"
  TUN_decsion_issue_debased_currency_desc: "Reducing the precious-metal content of the currency can stretch the treasury's reserves and meet immediate obligations. The price will be lower confidence in the money and greater inflationary pressure."
  
  TUN_decision_tunis_bizerte_road: "Construct Tunis-Bizerte Road"
  TUN_decision_tunis_bizerte_road_desc: "A dependable road between Tunis and Bizerte will improve trade, administration, military movement, and communication with one of the Beylic's most important northern ports."
  
  TUN_decision_school_science_and_math: "Build Schools for Science and Math"
  TUN_decision_school_science_and_math_desc: "New schools devoted to mathematics and the sciences will train the surveyors, engineers, physicians, officials, and officers required by a modernizing state."
  
  TUN_decision_issue_bonds: "New Government Bonds"
  TUN_decision_issue_bonds_desc: "The government will seek fresh credit by issuing bonds. The money can meet urgent expenses now, but future budgets will carry the interest and repayment obligations."
  
  tunisia_revolt_category: "Majba Revolt"
  tunisia_revolt_category_desc: "If you have 0 points after the crisis ends, then the Civil War is §Gaverted§!.\n If the revolt has more than 1 points then the Civil War will §Rescalate§!. Every point you have will be turned into a division, with the revolt §Yhaving at max 9 divisions§! !\n ---------------------------\n Current points: [?Mejba_Revolt_var|Y]"

  tunisia_revolt_mission: "General Discontent"
  tunisia_revolt_mission_desc: "An integralist upraising is spreading in our country, this is probably due to the high debts and the political events of our time. \n Current upset level is [?Mejba_Revolt_var|G]% "

  tunisia_debt_mission: "The Mejba Revolt"
  tunisia_debt_mission_desc: "A fundamentalist revolt is spreading in our country, this is probably due to the new taxes we are trying to impose and the blocking of the slave trade. \n Current upset level is [?Mejba_Revolt_var|G]% "

  TUN_Increase_Military_Presence: "Increase Military Presence"
  TUN_Increase_Military_Presence_desc: "Reports from the interior suggest that tax resistance and political agitation are spreading faster than local officials can contain them. Reinforcing vulnerable towns, roads, collection points, and government offices with regular troops may deter hesitant rebels and reassure loyal notables. The deployment also carries a danger: soldiers sent to intimidate the countryside can turn resentment into open revolt if commanders behave harshly. We must show that the state is present without convincing every dissatisfied community that war has already begun."
  TUN_Manipulate_Inland_Economy: "Manipulate Inland Economy"
  TUN_Manipulate_Inland_Economy_desc: "The government can reduce unrest without relying entirely on soldiers. By redirecting grain, credit, contracts, transport, and local tax arrangements, Tunis can reward cooperative districts and place pressure on leaders who encourage resistance. Economic intervention may split the opposition and ease the worst grievances before they become revolutionary demands. Such manipulation is less dramatic than military repression, but if handled carefully it may prove cheaper and far less destructive than fighting the countryside into submission."
  TUN_decision_british_gunboats: "Buy British Gunboats"
  TUN_decision_british_gunboats_desc: "A British-built gunboat can be acquired more quickly than an equivalent vessel can be constructed at home. The purchase will strengthen coastal patrols while giving Tunisian crews practical experience with foreign steam machinery."

  TUN_bizerte_repair_shop: "Bizerte Repair Shops"
  TUN_bizerte_repair_shop_desc: "Workshops at Bizerte will give naval vessels a second center for repair and maintenance, reducing the fleet's dependence on La Goulette and foreign facilities."

  TUN_la_goulette_shipyard: "Expanding La Goulette Shipyards"
  TUN_la_goulette_shipyard_desc: "Expanding La Goulette's naval workshops and slips will increase the capacity to maintain, refit, and eventually support the construction of modern vessels."

  TUN_build_forts_Tunis: "Build Tunis Fortifications"
  TUN_build_forts_Tunis_desc: "New defensive works around Tunis will strengthen the capital against a landward assault and provide positions suited to modern artillery."

  TUN_build_coastal_forts_Tunis: "Build La Goulette Fortifications"
  TUN_build_coastal_forts_Tunis_desc: "Fortifications at La Goulette will protect the entrance to Tunis from hostile ships and make the capital's principal harbor much harder to force."

  TUN_build_coastal_artillery: "Build Coastal Artillery"
  TUN_build_coastal_artillery_desc: "Permanent coastal batteries will place heavy guns where they can defend important approaches and support the fleet from protected positions ashore."

  TUN_decision_conscript_sahil_locals: "Conscript Sahil Locals"
  TUN_decision_conscript_sahil_locals_desc: "Military authorities will compel men from the Sahel into government service. The measure will provide manpower quickly, but resentment in the region will deepen."

  TUN_shipyard_in_tunis: "Invest in Tunis Shipyards"
  TUN_shipyard_in_tunis_desc: "Investment in shipbuilding and repair facilities around Tunis will strengthen the maritime economy and give the navy more dependable support close to the capital."

  TUN_decision_renovate_palace: "Renovate the Royal Palace"
  TUN_decision_renovate_palace_desc: "Renovating the Bey's palace will improve the seat of government and project an image of authority at a time when the prestige of the dynasty is closely tied to the success of reform."

  TUN_decision_renovate_great_mosque: "Renovate the Great Mosque of Tunis"
  TUN_decision_renovate_great_mosque_desc: "The Great Mosque of Tunis remains one of the foremost religious and educational institutions of the capital. Renovation will preserve its buildings and reinforce the government's relationship with the religious establishment."

  TUN_decision_partner_anglo_tunisia_bank: "Expand the Anglo-Tunisia Bank"
  TUN_decision_partner_anglo_tunisia_bank_desc: "A partnership with British financial interests can provide capital and commercial connections that the Tunisian treasury cannot supply alone. It will also give London a larger stake in our economy."

  TUN_decision_support_anglo_tunisia_bank: "Ask for Anglo-Tunisian Bank Investment"
  TUN_decision_support_anglo_tunisia_bank_desc: "We will seek additional British investment for the Anglo-Tunisian banking venture, trading greater foreign involvement for access to credit and financial expertise."

  TUN_decision_cherish_french_immigrantion: "Cherish French Immigration"
  TUN_decision_cherish_french_immigrantion_desc: "French settlers, merchants, technicians, and craftsmen can provide labor and capital for new enterprises. Encouraging their arrival will help development while increasing France's social and economic presence in Tunisia."

  TUN_decision_open_to_italians: "Open to Italians"
  TUN_decision_open_to_italians_desc: "Italian merchants, laborers, artisans, and families already form an important Mediterranean link with Tunisia. Easing their settlement can enlarge the workforce and deepen commercial ties with the peninsula."

  TUN_mission_cultural_reforms: "Cultural Reforms"
  TUN_mission_cultural_reforms_desc: "The government's cultural program seeks to strengthen education and Tunisian intellectual life while selectively adopting useful influences from abroad. Success will require balancing reformist ambition with established religious and social institutions."

  #Modernization Decisions

  tunisia_modernizing_category: "Marseille of the Desert"
  tunisia_modernizing_category_desc: "Tunis City is our national capital and also our biggest city with great strategic importance, sitting right next to the Mediterranean Sea. But a city which in the past held glory and many richest of the known world is now undeveloped and could be compared to towns in the middle of nowhere. We need to invest great funds and attract specialists from all our Europe to bring it back to its greatest days when Cartage ruled the waves so we could rival the greatest hubs in Europe and become Marseille of the Desert."

  TUN_mission_preparing_modernazition_plans: "Preparing Modernization Plans"
  TUN_mission_preparing_modernazition_plans_desc: "Before rebuilding Tunis, the government must know what it intends to build. Officials, ulema, engineers, and foreign specialists will be brought into a common planning process for the capital."

  TUN_mission_finish_phase_one: "Finish Phase One"
  TUN_mission_finish_phase_one_desc: "The first phase must be completed before plans lose momentum. Surveys, maps, population estimates, and urban proposals will provide the information needed for physical reconstruction."

  TUN_mission_finish_phase_two: "Finish Phase Two"
  TUN_mission_finish_phase_two_desc: "The second phase turns paper plans into visible works. Roads, water, walls, printing, institutions, and new districts must be advanced before the modernization program can move on."

  TUN_mission_finish_phase_three: "Finish Phase Three"
  TUN_mission_finish_phase_three_desc: "The final phase will equip Tunis with the utilities, education, transport, greenery, and industrial connections expected of a modern Mediterranean capital."

  TUN_decision_discuss_plans_with_ulemas: "Discuss Plans with Ulemas"
  TUN_decision_discuss_plans_with_ulemas_desc: "The ulema possess immense religious and social authority. Consulting them before major urban reforms can reduce opposition and reconcile modernization with established institutions."

  TUN_decision_make_new_city_maps: "Make New City Maps"
  TUN_decision_make_new_city_maps_desc: "Accurate maps are essential for streets, property records, utilities, defenses, and future construction. Surveyors will prepare a modern plan of Tunis and its surroundings."

  TUN_decision_conduct_land_survey: "Conduct Land Survey"
  TUN_decision_conduct_land_survey_desc: "A systematic land survey will establish boundaries, identify usable property, and give planners the measurements needed for new roads, districts, and public works."

  TUN_decision_discuss_plans_with_the_europeans: "Discuss Plans with Europeans"
  TUN_decision_discuss_plans_with_the_europeans_desc: "European engineers, consuls, merchants, and residents have experience with modern municipal works and strong interests in the capital. Their advice may be useful, even if their priorities are not always our own."

  TUN_decision_prepare_urban_plans_for_the_city: "Prepare Urban Plans for the City"
  TUN_decision_prepare_urban_plans_for_the_city_desc: "The information gathered from surveys and consultations will be turned into a coherent urban plan covering roads, districts, public buildings, defenses, and future expansion."

  TUN_decision_conduct_town_people_estimates: "Conduct Town People Estimates"
  TUN_decision_conduct_town_people_estimates_desc: "The government lacks reliable knowledge of how many people live in Tunis and where they reside. Population estimates will help plan taxation, policing, water, sanitation, and public services."

  TUN_decision_finish_phase_1: "Finish Phase One"
  TUN_decision_finish_phase_1_desc: "With the surveys, maps, consultations, and estimates complete, the planning phase can be formally closed and construction can begin."

  TUN_start_phase_2: "Start Phase Two"
  TUN_start_phase_2_desc: "The capital now has a plan. Phase Two will begin the physical transformation of Tunis through roads, waterworks, institutions, fortifications, and new urban space."

  TUN_tear_down_the_old_walls: "Tear Down Old City Walls"
  TUN_tear_down_the_old_walls_desc: "Parts of the old defenses restrict circulation and expansion without providing adequate protection against modern artillery. Removing selected walls will open space for roads and new districts."

  TUN_invite_european_specialists: "Invite European Specialists"
  TUN_invite_european_specialists_desc: "Engineers, architects, surveyors, printers, and technicians from Europe can provide expertise that is scarce in Tunisia. Their contracts will be costly, but they can accelerate difficult projects."

  TUN_reform_town_jurisdical_system: "Reform the Town Judicial System"
  TUN_reform_town_jurisdical_system_desc: "Overlapping authorities make urban government slow and inconsistent. Clarifying the city's judicial and administrative jurisdictions will give residents and officials a more predictable system."

  TUN_laid_down_foundations: "Lay Foundations for New Suburbs"
  TUN_laid_down_foundations_desc: "New suburbs require streets, plots, drainage, and public services before houses and businesses can safely spread beyond the old city. We will prepare the ground for orderly expansion."

  TUN_create_tunisian_printing_house: "Create Tunisian Printing House"
  TUN_create_tunisian_printing_house_desc: "A state-backed printing house will allow decrees, textbooks, administrative forms, and scholarly works to be produced in Tunis rather than depending entirely on imported printing."

  TUN_prepare_modern_fortifications: "Prepare Modern Tunis Fortification"
  TUN_prepare_modern_fortifications_desc: "Engineers will survey the approaches to Tunis and design defensive works suited to modern guns, giving future construction a coherent plan rather than a collection of isolated forts."

  TUN_renovate_main_roads: "Renovate Main Roads"
  TUN_renovate_main_roads_desc: "The principal roads of Tunis carry officials, soldiers, merchants, carts, and everyday traffic. Repairing and widening them will improve movement through the capital and connect new districts to the old city."

  TUN_build_new_aquaduct: "Build a New Town Aqueduct"
  TUN_build_new_aquaduct_desc: "A growing capital needs a dependable water supply. New aqueduct works will carry more water into Tunis and support households, fountains, institutions, and future expansion."

  TUN_decision_finish_phase_two: "Finish Phase Two"
  TUN_decision_finish_phase_two_desc: "The principal construction works of Phase Two are sufficiently advanced. The government can now turn from basic reconstruction toward the services and institutions of a modern city."

  TUN_start_phase_3: "Start Phase Three"
  TUN_start_phase_3_desc: "Phase Three will concentrate on sanitation, lighting, rail transport, education, public greenery, and industrial development, completing the modernization of the capital."

  TUN_construct_sewage_system: "Construct Sewage System"
  TUN_construct_sewage_system_desc: "Waste and stagnant water threaten public health in dense neighborhoods. A planned sewer system will improve sanitation and make further urban growth less dangerous."

  TUN_install_gas_streetlamps: "Install Gas Street Lamps"
  TUN_install_gas_streetlamps_desc: "Gas lighting will extend useful activity after sunset, improve safety on major streets, and provide Tunis with one of the most visible signs of a modern urban administration."

  TUN_tunis_goulette_railway: "Tunis-Goulette Railway"
  TUN_tunis_goulette_railway_desc: "A rail connection between Tunis and La Goulette will speed passengers, goods, officials, and military traffic between the capital and its principal port."

  TUN_sadiki_college: "Sadiki College"
  TUN_sadiki_college_desc: "A new college combining Arabic and Islamic learning with mathematics, languages, sciences, and administrative subjects can train the educated officials required by a reforming Tunisian state."

  TUN_ulema_teachers: "Task Ulemas To Search for Teachers"
  TUN_ulema_teachers_desc: "The religious establishment contains scholars capable of supporting educational reform from within Tunisian tradition. The ulema will be asked to identify teachers who can serve the new institutions."

  TUN_invite_european_teachers: "Invite European Teachers"
  TUN_invite_european_teachers_desc: "Foreign teachers can introduce technical subjects, languages, and methods not yet widely available in Tunisia. Their expertise will complement rather than replace local scholarship."

  TUN_expand_towns_greenery: "Expand Towns Greenery"
  TUN_expand_towns_greenery_desc: "Gardens, planted avenues, and public green spaces will make the expanding capital healthier and more pleasant while giving new districts a deliberate civic character."

  TUN_invite_european_industrialists: "Invite European Industrialists"
  TUN_invite_european_industrialists_desc: "Foreign entrepreneurs can bring machinery, capital, technical knowledge, and access to overseas markets. Inviting them to establish enterprises in Tunis may accelerate industrial growth at the price of greater foreign influence."

  TUN_finish_phase_3: "Finish Phase Three"
  TUN_finish_phase_3_desc: "The final projects are complete. Tunis has gained the plans, infrastructure, services, schools, transport, and institutions needed to stand as a far more modern capital."

### IDEAS ###

  TUN_preparing_modernization_plans: "Preparing Modernization Plans"
  TUN_preparing_modernization_plans_desc: "Officials are assembling surveys, maps, estimates, engineering advice, and political support for the modernization of Tunis. Until the plans are complete, the government must devote time and administrative attention to the project."

  TUN_modifier_winds_of_change: "Winds of Change"
  TUN_modifier_winds_of_change_desc: "A new wind of reform seeking advisors with competence in mind and ideas of modernization has blessed the royal courts and palaces of our lands."

  TUN_modifier_seasonal_harbour: "Seasonal Harbour"
  TUN_modifier_seasonal_harbour_desc: "Port activity, maintenance, and naval readiness are being organized around the seasons, concentrating labor and supplies when weather and traffic make them most valuable."

  TUN_modifier_marseille_of_the_desert: "Marseille of the Desert"
  TUN_modifier_marseille_of_the_desert_desc: "Tunis is being reshaped into a better connected, better administered, and more modern Mediterranean capital through sustained investment in public works, transport, education, sanitation, and commerce."

  TUN_idea_streamlined_tax_collection: "Streamlined Tax Collection"
  TUN_idea_streamlined_tax_collection_desc: "Clearer registers, standardized procedures, and direct supervision reduce the opportunities for collectors to conceal revenue or impose arbitrary charges. More of what is assessed will now reach the state treasury."

  TUN_dar_al_bay: "The Dar al Bey"
  TUN_dar_al_bay_desc: "The Dar al-Bey serves as a central seat of government in Tunis. Strengthening the palace administration gives ministers and officials a more effective center from which to direct the affairs of the Beylic."

  TUN_idea_la_goulette_port_improvements: "La Goulette Port Improvements"
  TUN_idea_la_goulette_port_improvements_desc: "Expanded workshops, storage, quays, and naval facilities at La Goulette allow ships to be serviced more quickly and make the port better able to support both commerce and the fleet."

  TUN_idea_school_science_and_math: "New Schools for Science and Math"
  TUN_idea_school_science_and_math_desc: "New instruction in mathematics and the sciences is creating a small but growing pool of surveyors, engineers, officers, and officials with the practical skills required by a modern state."

  TUN_idea_secular_subjects: "Secularizing School Subjects"
  TUN_idea_secular_subjects_desc: "Tunisian education is broadening beyond its traditional curriculum to include mathematics, geography, history, languages, law, and the natural sciences, giving future officials a wider intellectual foundation."

  TUN_farming_subsidies: "Farming Subsidies"
  TUN_farming_subsidies_desc: "Government support for tools and agricultural improvements reduces the burden on cultivators who wish to increase production, helping farms modernize without bearing the full cost themselves."

  TUN_bank_of_tunis: "Bank of Tunis"
  TUN_bank_of_tunis_desc: "A national banking institution provides a more orderly channel for credit, deposits, payments, and state finance, reducing the government's dependence on improvised arrangements and individual moneylenders."

  TUN_Manipulate_Inland_Economy_idea: "Manipulate the Inland Economy"
  TUN_Manipulate_Inland_Economy_idea_desc: "The government is intervening heavily in inland trade and production to protect revenue and direct scarce resources. The policy gives Tunis greater control, but it distorts commerce and raises costs for consumers."

  TUN_reforming_kingdom: "Reforming Regional Power"
  TUN_reforming_kingdom_desc: "Tunisia is in the midst of a difficult transformation. New laws, institutions, schools, courts, and administrative practices promise a stronger state, but they also disrupt old arrangements and provoke resistance from those who stand to lose."

  TUN_french_military_pressure: "French Fleet Near Our Coast"
  TUN_french_military_pressure_desc: "French warships and diplomatic demands make clear how narrow Tunisia's freedom of action has become. The government must make policy while knowing that refusal may carry consequences it is poorly equipped to resist."

  TUN_unorganized_ministries: "Unorganized ministries"
  TUN_unorganized_ministries_desc: "Responsibilities are divided among overlapping offices, court favorites, and officials whose authority is often poorly defined. Decisions are slow, records are inconsistent, and reform is harder to carry through than it should be."

  TUN_corrupted_ministers: "Corrupted Ministers"
  TUN_corrupted_ministers_desc: "Some ministers and senior officials treat public office as a source of private enrichment. Bribes, favoritism, and diverted revenues weaken the treasury and undermine confidence in the government."

  TUN_administrative_corruption: "Administrative Corruption"
  TUN_administrative_corruption_desc: "Corruption reaches beyond individual ministers into tax collection, procurement, appointments, and provincial administration. Money disappears before reaching Tunis, while influence often matters more than competence."

  TUN_idea_ministry_of_defense: "Ministry of Defense"
  TUN_idea_ministry_of_defense_desc: "A dedicated defense ministry is coordinating military administration, planning, fortifications, and expenditure, giving the Beylic a more coherent system for managing its armed forces."

  TUN_idea_ministry_of_finance: "Ministry of Finance"
  TUN_idea_ministry_of_finance_desc: "The Ministry of Finance is beginning to centralize accounts and revenue, but the new institution still has to impose order on a system shaped by debt, tax farming, and powerful private interests."

  TUN_idea_ministry_of_finance2: "Ministry of Finance"
  TUN_idea_ministry_of_finance2_desc: "With a functioning treasury, regular budgets, and improved bookkeeping, the Ministry of Finance can exercise much firmer control over state revenue and expenditure."

  TUN_idea_european_style_diplomacy: "European-Style Diplomacy"
  TUN_idea_european_style_diplomacy_desc: "Tunisia is adopting more regular diplomatic correspondence, negotiation, and protocol in its dealings with foreign powers, helping the court respond to an increasingly complex international environment."

  TUN_idea_european_style_diplomacy2: "Professional Diplomatic Service"
  TUN_idea_european_style_diplomacy2_desc: "Regular contact with foreign representatives and a more professional diplomatic routine are giving Tunisian officials greater experience in treaties, consular questions, and interstate negotiation."

  TUN_idea_european_style_diplomacy3: "Established Diplomatic Protocols"
  TUN_idea_european_style_diplomacy3_desc: "Diplomatic procedure has become an established part of government. Tunisia can now negotiate with foreign powers through clearer institutions, recognized immunities, and officials accustomed to European protocol."

  TUN_reformism: "Reformism"
  TUN_reformism_desc: "A reformist current within the state argues that Tunisia must borrow useful institutions and knowledge from abroad while preserving its religion, sovereignty, and social order. Its program inspires hope, but also serious resistance."

  TUN_integralist_uprising: "Integralist Uprising"
  TUN_integralist_uprising_desc: "Opponents of the reform program have rallied around the defense of established religious and social authority. Their mobilization gives them considerable fighting spirit and local support against a government seen as abandoning tradition."

  TUN_idea_equitable_taxes: "Equitable Taxes"
  TUN_idea_equitable_taxes_desc: "Tax obligations are being made more uniform so that privilege, religion, nationality, or local custom no longer determine who bears the state's burden. The reform is fairer in principle and easier to defend politically."

  TUN_idea_mejba_tax: "Mejba Tax"
  TUN_idea_mejba_tax_desc: "The Mejba provides the treasury with direct revenue from adult male subjects, but the tax falls heavily on rural communities. Its collection is increasingly associated with debt, coercion, and resentment toward the central government."
  
  dynmod_TUN_euro_based_army: "[Army_dynmod_name]"
  dynmod_TUN_euro_based_army_desc: "The Tunisian army is being reshaped through centralized administration, European drill, improved weapons, clearer ranks, modern supply practices, and technical military education. Each reform moves the force further from its older organization."
  TUN_loc_euro_based_army: "European-Based Army"
  TUN_loc_tunisian_army: "Tunisian Army"

  TUN_max_planning_modifier: "Max Planning Factor"
  TUN_max_planning_modifier_desc: "Improved communications and staff procedures allow naval and military commanders to prepare operations with greater care before committing their forces."

  TUN_supply_and_depots: "Supply and depots"
  TUN_supply_and_depots_desc: "Permanent depots and a more organized supply network make it easier to move food, ammunition, equipment, and replacements where the army needs them."

  TUN_ravelins_and_lunettes_idea: "Ravelins and Lunettes"
  TUN_ravelins_and_lunettes_idea_desc: "New outer works, including ravelins and lunettes, give Tunisian fortifications greater depth and make frontal assaults more difficult against defended positions."

  TUN_naval_training: "Naval Training"
  TUN_naval_training_desc: "Regular exercises are giving Tunisian sailors and officers more consistent experience in seamanship, gunnery, signaling, and shipboard discipline."

  TUN_naval_training_1: "Naval Training"
  TUN_naval_training_1_desc: "The establishment of more advanced naval instruction is creating a professional officer corps familiar with navigation, engineering, gunnery, and the demands of steam-powered warships."

  TUN_majba_revolt: "Mejba Revolt"
  TUN_majba_revolt_desc: "Resistance to the Mejba has become a broad rural revolt. Tribal forces, tax grievances, and anger at the central government are combining into a crisis that threatens the authority of the Bey."

  TUN_french_intervention: "French Intervention"
  TUN_french_intervention_desc: "French assistance provides rifles, uniforms, advisers, and political support to the Bey's government. The immediate military advantage is real, but so is the additional leverage France gains over Tunisian affairs."

  TUN_british_lower_tariffs: "Lower Tariffs"
  TUN_british_lower_tariffs_desc: "Commercial concessions to Britain have lowered barriers to British trade. The arrangement improves relations with London and encourages commerce while reducing the government's ability to protect its own market."

  TUN_street_riots: "Street Riots"
  TUN_street_riots_desc: "Political and religious tension has spilled into the streets. Crowds, communal fear, and attacks on officials and minorities have forced the government to divert attention and troops toward restoring public order."

  TUN_creating_the_fundementalist_pact: "Preparing the Fundamental Pact"
  TUN_creating_the_fundementalist_pact_desc: "Under pressure from European consuls and warships, the Bey's government is preparing a Fundamental Pact that promises security, equality before the law, freedom of worship, and freer commerce. The charter may calm foreign demands, but it will reshape the internal order of Tunisia."

  TUN_the_marseille_of_the_desert_1: "Marseille of the Desert"
  TUN_the_marseille_of_the_desert_1_desc: "The first works of Tunis's urban transformation are under way. Better surveys, roads, administration, and planning are beginning to give the capital the foundations of a modern Mediterranean city."

  TUN_the_marseille_of_the_desert_2: "Marseille of the Desert"
  TUN_the_marseille_of_the_desert_2_desc: "New infrastructure, institutions, and public works are changing the physical face of Tunis. The capital is becoming easier to administer, healthier, and better connected to its port and surrounding districts."

  TUN_the_marseille_of_the_desert_3: "Marseille of the Desert"
  TUN_the_marseille_of_the_desert_3_desc: "Tunis now possesses a growing network of modern roads, utilities, schools, public spaces, and transport links. The city has become a showcase for the reforming ambitions of the Beylic."

  TUN_Mejba_Revolt_Modifier: "Mejba Revolt Intensity"
  TUN_Mejba_Revolt_Modifier_desc: "Every concession, refusal, bribe, and act of repression alters the balance between Tunis and the rebellious countryside. If hostility rises too far, local resistance may erupt into a full civil conflict."

  TUN_idea_orders_east: "Orders East"
  TUN_idea_orders_east_desc: "Obligations to the Ottoman Sultan are drawing Tunisian attention and resources eastward. Honoring these demands reinforces the Beylic's place within the Ottoman world, but limits freedom to concentrate entirely on local priorities."


### ADDITIONAL TUNISIAN LOCALISATION ###

  tunisia.120.c: "Refuse to Bribe Them"
  TUN_madrasas_renovated: "Renovated Madrasas"
  TUN_madrasas_renovated_desc: "Repairs, new books, and renewed teaching facilities have restored the madrasas as active centers of Tunisian learning, strengthening education without severing it from the country's religious traditions."
  TUN_FRA_ENG_trades_go_up: "Closer Anglo-French Trade"
  TUN_FRA_ENG_trades_go_up_desc: "Our commercial policies make Tunisia a more attractive partner for both France and Britain, increasing their willingness to trade with the Beylic."
  TUN_FRA_ENG_trades_go_down: "Strained Anglo-French Trade"
  TUN_FRA_ENG_trades_go_down_desc: "Recent policies have made Tunisian commerce less attractive to France and Britain, reducing their willingness to trade on favorable terms."
  TUN_royal_palace: "Expanded Royal Palace"
  TUN_royal_palace_desc: "The enlarged palace provides the Bey with a more imposing seat of government and reinforces the authority of the dynasty at a time of rapid political change."
  TUN_Mohamed_Bayram_IV: "Mohamed Bayram IV"
  TUN_Mohamed_Bayram_IV_desc: "Mohamed Bayram IV is a prominent member of Tunisia's religious establishment and an influential adviser at court. His learning and standing among the ulema give the government a respected voice on questions where reform, law, and religion meet."
  TUN_Mahmoud_Kabadou: "Mahmoud Kabadou"
  TUN_Mahmoud_Kabadou_desc: "Mahmoud Kabadou is a reform-minded theologian and educator who teaches Arabic and Islamic studies at the Bardo Military School. Familiar with Ottoman reform currents, he argues that modern sciences and useful knowledge can strengthen rather than undermine Tunisian society."
  TUN_theorist_tunisian_naval_academy: "Tunisian Naval Academy"
  TUN_theorist_tunisian_naval_academy_desc: "The Tunisian Naval Academy represents the attempt to give naval reform a permanent institutional base rather than depending forever on foreign missions. Its students are expected to learn navigation, mathematics, gunnery, engineering, seamanship, signaling, and the administration required to maintain increasingly complex steam-powered vessels. A professional officer corps will take years to develop, but every graduate reduces the fleet's dependence on foreign captains and technicians and gives Tunisia a better chance of sustaining a modern navy with its own personnel."
  TUN_al_fariq_hussein: "General Husayn"
  TUN_al_fariq_hussein_desc: "General Husayn is a Circassian mamluk officer, reformer, and administrator educated at the Bardo Military School alongside Hayreddin Pasha and General Rustum. In 1858 he becomes the first president of the new Municipal Council of Tunis, placing him at the center of efforts to regulate streets, markets, sanitation, public works, and the expansion of the capital. He later takes on important responsibilities in foreign affairs and justice. Husayn combines military discipline with an unusually broad interest in civil administration, making him one of the clearest examples of the reforming official produced by the Husainid state."
  TUN_advisor_mohamed_baccouche: "Mohamed Baccouche"
  TUN_advisor_mohamed_baccouche_desc: "Mohamed Baccouche belongs to the emerging class of Tunisian officials whose careers combine technical education with service to the Beylic. Trained in engineering, he spends time in northern France and gains practical experience connected with railway construction before returning to Tunisia. He later serves as an officer, secretary to Mustapha Khaznadar, and an official in foreign affairs. Baccouche therefore brings together engineering knowledge, administrative experience, and familiarity with European financial circles, making him useful to a government attempting to modernize without possessing enough trained specialists of its own."
  TUN_mohamed_baccouche_high_command: "Mohamed Baccouche"
  TUN_mohamed_baccouche_high_command_desc: "Mohamed Baccouche's value to the high command comes from a background broader than that of a conventional officer. His engineering studies and practical railway experience in northern France give him an understanding of transport, infrastructure, and technical organization, while his later service in the Beylic administration familiarizes him with government procedure and foreign contacts. He is therefore well suited to questions of logistics, supply, and military administration, fields in which Tunisia's reforming army often suffers more from weak organization than from lack of courage."
  TUN_advisor_mohammed_bouattour: "Mohammed Aziz Bouattour"
  TUN_advisor_mohammed_bouattour_desc: "Mohammed Aziz Bouattour comes from a prominent Tunisian family associated with scholarship, the notarial profession, and the state chancellery. Educated at the Zaytuna, he follows his relatives into government service and develops the careful habits of a professional secretary. His career places him within the administrative machinery that reformers are trying to regularize rather than destroy. Bouattour is not the most radical voice at court, but his knowledge of correspondence, law, and bureaucratic procedure makes him exactly the kind of official a more organized state requires."
  TUN_advisor_hayreddin_pasha: "Hayreddin Pasha"
  TUN_advisor_hayreddin_pasha_desc: "Hayreddin Pasha is one of the most important reformers in nineteenth-century Tunisia. Raised within the Husainid mamluk establishment and trained for military service, he gains experience in diplomacy, administration, and Europe before becoming minister of the navy in 1857. Hayreddin argues that Muslim states can adopt useful European institutions without abandoning their religious or political identity, provided reform strengthens justice, education, public finance, and effective government. His reputation for discipline and his hostility to corruption make him a natural rival to Mustapha Khaznadar and a central figure in any serious attempt to rescue the Beylic from financial and administrative decline."
  TUN_advisor_ahmad_diyaf: "Ahmad ibn Abi Diyaf"
  TUN_advisor_ahmad_diyaf_desc: "Ahmad ibn Abi Diyaf is a Tunisian jurist, historian, secretary, and statesman whose career places him close to the Husainid court for decades. Educated at the Zaytuna and trained in the chancery, he becomes known for the quality of his Arabic prose and for his belief that rulers should govern through law rather than arbitrary personal authority. He is closely associated with the intellectual language of the 1857 Fundamental Pact and with the broader constitutional reform movement. His historical writings and administrative experience give him unusual perspective on the strengths and weaknesses of the state he is helping to reform."
  TUN_advisor_yusuf_jait: "Youssef Djaït"
  TUN_advisor_yusuf_jait_desc: "Youssef Djaït comes from a respected family of religious scholars and receives a traditional education at the Zaytuna before entering government service. Rather than remaining solely within the scholarly establishment, he joins the developing chancery and foreign administration of the Beylic, where knowledge of law, Arabic correspondence, and formal procedure is increasingly valuable. Djaït represents a generation able to move between the learned institutions of Tunis and the modernizing bureaucracy. His cautious administrative outlook offers reform without the sharp break from tradition feared by many conservative officials."
  TUN_advisor_salem_bouhageb: "Salem Bouhageb"
  TUN_advisor_salem_bouhageb_desc: "Salem Bouhageb is a jurist, scholar, poet, and one of the leading Tunisian reformist intellectuals of the nineteenth century. Rooted in the country's Islamic scholarly tradition, he nevertheless argues that useful modern knowledge is compatible with religion and that Tunisia must engage seriously with science, education, and changing political conditions. Bouhageb's importance lies less in command of a ministry than in the intellectual foundation he gives reform. He helps make modernization a Tunisian debate conducted through Arabic learning and Islamic jurisprudence rather than something presented only as an imported European program."
  TUN_advisor_nassim_shamama: "Nassim Shamama"
  TUN_advisor_nassim_shamama_desc: "Nassim Shamama is a wealthy Tunisian Jewish financier, communal leader, and one of the most influential men connected with the Beylic treasury. Rising from commerce into tax collection and public finance, he becomes Receiver General and later Director of Finance, accumulating an extraordinary private fortune along the way. His skill with accounts, credit, and revenue makes him valuable to a government constantly searching for cash, but his wealth and political connections also make him a symbol of the blurred line between public money and private enrichment. During fiscal crisis he can provide resources few others possess, yet reliance on him carries serious political and financial risks."
  TUN_jean_baptiste_campenon_token: "Jean-Baptiste Campenon"
  TUN_jean_baptiste_campenon_token_desc: "Jean-Baptiste Campenon is a French staff officer with direct experience of Tunisia and the Bardo Military School. Trained at Saint-Cyr and in staff work, he is sent to Tunis in the 1850s and becomes familiar with the army the Husainid state is attempting to modernize. After further service in the Crimean War, Algeria, Italy, and China, he returns as part of France's military involvement in Tunisian reform. Campenon can provide valuable instruction in organization, drill, weapons, and staff practice, but his presence also serves a wider French objective: ensuring that Tunisia looks to Paris rather than rival powers for military guidance."
  TUN_theorist_ecole_militare_bardo: "École Militaire du Bardo"
  TUN_theorist_ecole_militare_bardo_desc: "The École Militaire du Bardo is one of the most important institutions created by Ahmad Bey's modernization program. Established to train a professional officer corps, it exposes Tunisian cadets to mathematics, engineering, artillery, topography, languages, and military science alongside the intellectual traditions of the country. The school produces officers and administrators who later become central to reform, including men whose careers reach far beyond the army. Maintaining the institution is expensive, but without trained officers and technical specialists the Beylic will remain dependent on foreign advisers for every major military project."
  TUN_ahmed_zarrouk_high_command: "Ahmed Zarrouk"
  TUN_ahmed_zarrouk_high_command_desc: "Ahmed Zarrouk is a mamluk general and provincial administrator whose career is closely tied to the Husainid court and to Mustapha Khaznadar. Educated within the Bardo military environment, he holds important provincial commands and becomes one of the government's most forceful military servants. During the Mejba Revolt of 1864 he is entrusted with extraordinary authority and leads the harsh repression of resistance in the Sahel, using regular infantry and artillery to break the insurgency and impose heavy fines. Zarrouk is effective, disciplined, and feared, a commander whose methods can restore government control but leave lasting bitterness behind them."
  TUN_mohammad_chaouch_high_command: "Mohammed Chaouch"
  TUN_mohammad_chaouch_high_command_desc: "Mohammed Chaouch is an officer within the Beylic's military establishment whose surviving documentation in the material available for this project is limited. His appointment to the high command nevertheless reflects the practical needs of the Tunisian army: maintaining unit cohesion, restoring formations after setbacks, and keeping soldiers supplied and organized during difficult operations. He is best represented as a dependable professional rather than a celebrated battlefield reformer, a commander valued for steadiness at a time when the army's institutions are still being rebuilt."
  TUN_trait_mohamed_baccouche: "European-Trained Engineer"
  TUN_trait_mohammed_bouattour: "Beylical Chancellor"
  TUN_trait_hayreddin_pasha: "Reformist Statesman"
  TUN_trait_hayreddin_pasha_naval: "Naval Reformer"
  TUN_trait_ahmad_ibn_abi_diyaf: "Constitutional Reformist"
  TUN_trait_yusuf_jait: "Zaytuna Administrator"
