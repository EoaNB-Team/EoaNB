l_english:
 ## British opening branch 1854-1857
 ENG_v54_the_eastern_question: "The Eastern Question"
 ENG_v54_the_eastern_question_desc: "Russian troops are in the Principalities and the Ottoman fleet has been burnt at Sinope. Lord Aberdeen wants peace, Palmerston and Russell want firmness, and The Times wants war. The road to India runs through Constantinople, or so every Englishman has been taught."
 ENG_v54_for_the_sultan: "For the Sultan"
 ENG_v54_for_the_sultan_desc: "Britain stands with the Ottoman Empire. The government declares war, the fleet is sent to the Baltic and the Black Sea, and a small army embarks for Turkey. Few in London know where Sevastopol is, and fewer still what the war will cost.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_vienna_notes: "The Vienna Notes"
 ENG_v54_the_vienna_notes_desc: "Clarendon and the Austrian chancery draft note after note, each a little less offensive to the Tsar and a little less acceptable to the Sultan. Britain will not fight until every phrase has been tried, and the radical press says that the phrases are all that the government has."
 ENG_v54_the_peace_party: "The Peace Party"
 ENG_v54_the_peace_party_desc: "Cobden and Bright speak for the Manchester school: trade, not war, is the business of England, and the Turk is not worth a single English life. The government agrees, for the moment, and the Tsar is not displeased."
 ENG_v54_an_understanding_with_the_tsar: "An Understanding with the Tsar"
 ENG_v54_an_understanding_with_the_tsar_desc: "Some in the Cabinet remember that in 1844 Nicholas himself spoke to Aberdeen of the sick man of Europe and of what should happen to his estate. An agreement with Russia might give Britain Egypt and Crete and spare the Treasury a war."
 ENG_v54_the_expeditionary_force: "The Expeditionary Force"
 ENG_v54_the_expeditionary_force_desc: "Lord Raglan, who has not commanded in the field since Waterloo, takes a small army to Turkey. The Guards, the Highland brigade and the Light Division are good troops, the Commissariat is not, and no one has estimated how many men a siege will need.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_baltic_fleet: "The Baltic Fleet"
 ENG_v54_the_baltic_fleet_desc: "Sir Charles Napier takes the finest fleet Britain has assembled since the Napoleonic wars into the Baltic. Its steam battleships are a wonder, its admiral's temper is not, and Kronstadt turns out to be better defended than anyone had said."
 ENG_v54_the_winter_before_sevastopol: "The Winter before Sevastopol"
 ENG_v54_the_winter_before_sevastopol_desc: "Cholera, frost and bad supply are killing the army faster than the Russians. Russell's dispatches in The Times tell England what the ministers had hoped would remain unsaid, and the House asks why the Commissariat has no boots, no huts and no hospital.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_florence_nightingale: "Florence Nightingale"
 ENG_v54_florence_nightingale_desc: "Sidney Herbert asks a woman of thirty-four, the superintendent of a London nursing home, to take nurses to Scutari. She finds a hospital in which more men die of fever than of wounds, and she sets about making the army's doctors, officers and clerks understand it.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_land_transport_corps: "The Land Transport Corps"
 ENG_v54_the_land_transport_corps_desc: "The army has no transport of its own and the Commissariat cannot move a ton of biscuit from Balaclava to the trenches. A new Land Transport Corps is raised, a railway is laid up from the harbour, and the men are, at last, fed."
 ENG_v54_the_roebuck_motion: "The Sebastopol Committee"
 ENG_v54_the_roebuck_motion_desc: "Roebuck moves for a committee to inquire into the state of the army before Sevastopol. The government that has sent the army and failed to supply it cannot survive a division, and the question is who will govern in its place.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_war_office: "Reform of the War Department"
 ENG_v54_the_war_office_desc: "The Secretary at War, the Ordnance, the Commissariat and the Horse Guards each control a piece of the army and nobody controls the whole. A single Secretary of State for War is appointed, the Commissariat is moved under him, and the first lessons are learned.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_declaration_of_paris: "The Declaration of Paris"
 ENG_v54_the_declaration_of_paris_desc: "At Paris the great powers adopt rules for war at sea: privateering is abolished, a neutral flag covers enemy goods and blockades must be effective. The Admiralty regards the second clause as a gift to the enemy, the Foreign Office as a price worth paying for the other three.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_aberdeen_coalition: "The Aberdeen Coalition"
 ENG_v54_the_aberdeen_coalition_desc: "Lord Aberdeen governs with a coalition of Peelites and Whigs, with Gladstone at the Exchequer, Russell at the Council and Palmerston at the Home Office. It is the ablest cabinet of the century and the least united, and the Eastern crisis is the test it was not built for.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_gladstones_budget: "Gladstone's Budget"
 ENG_v54_gladstones_budget_desc: "The Chancellor believes that wars should be paid for out of taxation, not borrowing, and that every shilling the government spends should be accounted for. The war budget of 1854 doubles the income tax and the Chancellor does not apologise.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_northcote_trevelyan: "The Northcote-Trevelyan Report"
 ENG_v54_northcote_trevelyan_desc: "Two senior officials propose that the civil service be recruited by open examination and promoted on merit, not by patronage. The proposal alarms every minister who has a nephew to place, and it is the first step toward an administration that works.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_russells_reform_bill: "Russell's Reform Bill"
 ENG_v54_russells_reform_bill_desc: "Lord John Russell, the author of the Reform Act of 1832, brings in a bill to extend the franchise and to redistribute seats. The war has made it unpopular in the House, and the Prime Minister is half relieved at the prospect of its withdrawal.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_press_and_public_opinion: "The Fourth Estate"
 ENG_v54_the_press_and_public_opinion_desc: "The stamp duty on newspapers has been reduced and The Times sells forty thousand copies a day. Delane's leaders are read in the Cabinet, and his correspondents tell the country more of the war than the War Office knows."
 ENG_v54_the_radical_opposition: "The Manchester School"
 ENG_v54_the_radical_opposition_desc: "Cobden and Bright oppose the war from the benches below the gangway, with petitions from Lancashire and speeches that are heard in silence and read with respect. They are out of tune with the country and in tune with the ledger."
 ENG_v54_the_irish_question: "Ireland after the Famine"
 ENG_v54_the_irish_question_desc: "A million Irish have died or emigrated, the Tenant League demands fair rents and tenant right, and the Irish Brigade in the Commons holds the balance between the parties. Whoever governs must decide whether the land question can be left to the landlords."
 ENG_v54_the_palmerston_ministry: "The Palmerston Ministry"
 ENG_v54_the_palmerston_ministry_desc: "The old Viscount, seventy years old and the most popular man in England, forms a ministry to win the war. He believes that Britain has a mission to defend liberty abroad, with a fleet and with words, and that the people are behind him.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_prince_albert: "Prince Albert"
 ENG_v54_prince_albert_desc: "The Prince Consort reads every dispatch, writes memoranda on everything and presses for science, for education and for the improvement of the working classes. The press says that he meddles in foreign policy, and the ministers learn that he is usually right."
 ENG_v54_a_prussian_marriage: "The Princess Royal's Engagement"
 ENG_v54_a_prussian_marriage_desc: "Prince Friedrich Wilhelm of Prussia has come to Balmoral and, in a walk on the heather, proposed to the Princess Royal. Victoria and Albert hope that the match will bind Prussia to Britain and make the liberal cause in Germany the cause of the dynasty.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_workshop_of_the_world: "The Workshop of the World"
 ENG_v54_workshop_of_the_world_desc: "Britain produces more coal, iron, cotton cloth and ships than the rest of Europe together. The Exhibition of 1851 showed it to the world, and the Crimean war now tests whether the workshop can also supply an army."
 ENG_v54_free_trade: "Free Trade"
 ENG_v54_free_trade_desc: "The Corn Laws were repealed in 1846 and the Navigation Acts in 1849, and the tariff has been reduced to a handful of revenue duties. Free trade is no longer a policy but a creed, and the Chancellor is its high priest.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_railways_of_the_empire: "The Railway Network"
 ENG_v54_railways_of_the_empire_desc: "Ten thousand miles of railway have been laid in twenty years, and the network is nearly complete. The companies amalgamate, the Railway Clearing House settles their accounts and the first lines are being built in India, Canada and Australia.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_telegraph_in_war: "The Telegraph in the Crimea"
 ENG_v54_the_telegraph_in_war_desc: "A cable is laid across the Black Sea and Raglan's headquarters are in touch with Downing Street. For the first time ministers can give orders to a general in the field, and the general can answer them the same day.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_war_budget: "Paying for the War"
 ENG_v54_the_war_budget_desc: "The income tax is doubled, the National Debt is increased by loans and the Bank of England is asked to discount more paper than it likes. The Chancellor reckons that Britain can pay for a war of a few years without ruin, and the war is lasting longer than a few years."
 ENG_v54_the_shipyards: "The Clyde and the Thames"
 ENG_v54_the_shipyards_desc: "The yards of the Clyde, the Tyne and the Thames build ships for the Navy and for every merchant fleet in the world. Iron hulls, screw propellers and compound engines are tried and adopted faster than the Admiralty can write specifications."
 ENG_v54_limited_liability: "Limited Liability"
 ENG_v54_limited_liability_desc: "Parliament allows companies to limit the liability of their shareholders to the capital they have subscribed. Investors who had stayed away from risk may now take part, and the City discovers a new way of raising capital.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_coal_and_iron: "Coal and Iron"
 ENG_v54_coal_and_iron_desc: "The pits of Durham, South Wales and Lancashire, and the ironworks of Staffordshire and Clydeside, produce half the world's coal and iron. Bessemer's converter is being tried, and the price of steel is about to fall."
 ENG_v54_the_army_in_1854: "The Army in 1854"
 ENG_v54_the_army_in_1854_desc: "The British Army is a small, long-service, volunteer force: a few brilliant regiments, many bad ones, and an officer corps in which rank is bought and promotion is a matter of purse and connection. It has not fought a European enemy since 1815."
 ENG_v54_the_enfield_rifle: "The Enfield Rifle"
 ENG_v54_the_enfield_rifle_desc: "The Pattern 1853 Enfield rifle-musket takes the Minié bullet and hits a man at six hundred yards. The infantry will be re-armed at the Royal Small Arms Factory, and the East India Company will order its own Enfields for the sepoy army.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_horse_guards: "The Horse Guards"
 ENG_v54_horse_guards_desc: "The Commander-in-Chief, Lord Hardinge, and the Horse Guards control promotion and discipline. They are honest, old-fashioned and suspicious of reform, and they have the Queen's ear and the Duke of Cambridge's sympathy."
 ENG_v54_purchase_of_commissions: "The Purchase System"
 ENG_v54_purchase_of_commissions_desc: "Commissions in the cavalry and infantry are bought and sold at regulated prices. The system keeps the army officered by gentlemen who have a stake in the country and, its critics say, by men who have never studied their profession.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_abolish_purchase: "Abolish Purchase"
 ENG_v54_abolish_purchase_desc: "A group of reformers argues that commissions should be given for merit, and that the Crimea has shown what the purchase system costs. The aristocracy sees an attack on its position, and the Treasury sees a very large compensation bill."
 ENG_v54_the_steam_navy: "The Steam Navy"
 ENG_v54_the_steam_navy_desc: "The Royal Navy has converted its line-of-battle ships to steam, and the screw battleship Agamemnon is the finest warship afloat. The French are building their own, and the Admiralty is determined not to be caught napping.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_gunboats_and_mortars: "Gunboats and Mortar Vessels"
 ENG_v54_gunboats_and_mortars_desc: "The Baltic campaign shows that the Navy needs shallow-draught gunboats and mortar vessels to attack coastal fortresses. A hundred are ordered within months, built by every yard that has a slipway."
 ENG_v54_armstrong_and_whitworth: "Armstrong and Whitworth"
 ENG_v54_armstrong_and_whitworth_desc: "William Armstrong, a Newcastle lawyer and hydraulic engineer, offers the War Office a breech-loading rifled gun of unheard-of accuracy, and Joseph Whitworth a rifle of his own design. The ordnance board is divided, and the army learns that the arms trade has rules of its own.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_militia: "The Militia"
 ENG_v54_the_militia_desc: "The Militia Act of 1852 revived the old county militia as a reserve against invasion. With the army abroad it is embodied and its battalions are sent to garrison the fortresses, and some of its best men are persuaded to enlist in the line."
 ENG_v54_the_staff_college: "The Staff College"
 ENG_v54_the_staff_college_desc: "Sandhurst and the Staff College at Camberley are to teach the sciences of war to the officers who will conduct the next one. The first graduates will serve in the Crimea and the next in the Mutiny."
 ENG_v54_john_company_india: "John Company's India"
 ENG_v54_john_company_india_desc: "The East India Company rules two hundred million people with a few thousand British officials and a Bengal army of two hundred thousand native soldiers. Lord Dalhousie, the Governor-General, has annexed the Punjab, Pegu, Satara, Nagpur and Jhansi, and the Company's charter is renewed every twenty years."
 ENG_v54_the_doctrine_of_lapse: "The Doctrine of Lapse"
 ENG_v54_the_doctrine_of_lapse_desc: "When a native prince dies without a natural heir, his state lapses to the Company, and adopted sons do not inherit. The doctrine has brought Satara, Jhansi and Nagpur under British rule, and has made the princes of India wonder which of them is next.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_oudh_question: "The Oudh Question"
 ENG_v54_the_oudh_question_desc: "The kingdom of Oudh, the Company's oldest ally, is badly governed by a king who writes poetry and keeps a thousand dancers. Dalhousie wishes to annex it in the name of good government, and the Sepoys of Bengal, many of whom are Oudh Brahmins, are not consulted.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_general_service_act: "The General Service Enlistment Act"
 ENG_v54_the_general_service_act_desc: "Lord Canning wants new recruits for the Bengal army to serve wherever they are sent, including overseas. The sea is polluted for the high-caste Hindu, and the existing sepoys, who are not covered by the act, suspect that their turn will come.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_enfield_cartridge: "The Enfield Cartridge"
 ENG_v54_the_enfield_cartridge_desc: "The new Enfield rifle needs a cartridge that must be bitten open, and the paper is greased with tallow. A rumour runs through the Bengal army that the grease is beef fat and pig fat, polluting Hindu and Muslim alike, and that the Company means to destroy the sepoys' faith.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_bengal_army: "The Bengal Army"
 ENG_v54_the_bengal_army_desc: "The sepoys of Bengal are largely high-caste Hindus from Oudh and Bihar, proud of their caste and their regiments, and separated from their British officers by language, religion and an increasing indifference. A wise commander would pay attention to what they say."
 ENG_v54_education_and_reform_in_india: "Education and Reform in India"
 ENG_v54_education_and_reform_in_india_desc: "Wood's Education Despatch of 1854 plans universities at Calcutta, Bombay and Madras and a system of vernacular schools. The Widow Remarriage Act follows. The reformers believe that India will be remade by reason, and the orthodox believe that it is being remade by conquest.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_burma_and_pegu: "Burma and Pegu"
 ENG_v54_burma_and_pegu_desc: "The second Burmese war of 1852 has given the Company the province of Pegu, with Rangoon, and cut Upper Burma off from the sea. The king at Ava will not make a treaty, and the Company is not in a hurry to oblige him."
 ENG_v54_the_persian_question: "The Persian Question"
 ENG_v54_the_persian_question_desc: "A Persian army has seized Herat, the key to Afghanistan and the gateway to India, in breach of a treaty with Britain. The Government of India sends an expedition to the Gulf, and the Foreign Office wonders whether the Shah is acting for himself or for St Petersburg.\n\n$V54_HISTORICAL_PATH$"
 ENG_v54_the_arrow_incident: "The Arrow Incident"
 ENG_v54_the_arrow_incident_desc: "Chinese officials board the lorcha Arrow at Canton, haul down her British flag and arrest her crew. Sir John Bowring and Admiral Seymour see an insult that demands redress, and the House of Commons will soon be asked whether it agrees.\n\n$V54_HISTORICAL_PATH$"
