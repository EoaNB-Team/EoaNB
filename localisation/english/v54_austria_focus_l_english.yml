l_english:
 ## Austrian opening branch 1854-1857
 AUS_v54_eastern_crisis: "The Eastern Crisis"
 AUS_v54_eastern_crisis_desc: "Russian troops occupy the Danubian Principalities, the Ottoman fleet has been destroyed at Sinope and the Western powers are drifting toward war. Count Buol must steer an Empire that owes its throne in Hungary to the Tsar yet cannot accept Russian power on the lower Danube."
 AUS_v54_armed_neutrality: "Armed Neutrality"
 AUS_v54_armed_neutrality_desc: "Vienna will neither fight for the Tsar nor for the Sultan. The army is placed on a war footing along the Galician and Transylvanian frontiers, and Russia is invited to leave the Principalities. The Empire speaks as a power whose neutrality has a price.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_tsars_friend: "Faithful to the Tsar"
 AUS_v54_tsars_friend_desc: "In 1849 Russian divisions saved the Habsburgs in Hungary. Whatever Paris and London say, Vienna will not repay that debt with an ultimatum. The Emperor assures Nicholas of the Empire's benevolent neutrality, and Russian garrisons in Poland are free to look elsewhere."
 AUS_v54_western_alliance: "With the Western Powers"
 AUS_v54_western_alliance_desc: "Austria has joined Britain and France against Russia. The decision gives Vienna a place at the table and a claim on the Principalities, and it costs the friendship of the one power that had stood by the Empire in 1849."
 AUS_v54_good_offices: "Good Offices"
 AUS_v54_good_offices_desc: "Vienna offers itself as the honest broker between the belligerents. The Vienna Note of 1853 failed, but the Empire has interests on both sides and the means to try again."
 AUS_v54_secret_assurances: "Assurances to St Petersburg"
 AUS_v54_secret_assurances_desc: "A confidential exchange with the Tsar's ministers leaves no doubt of Austria's intentions: no hostile act while Russia keeps the Pruth. The Western chancelleries will learn of it sooner or later."
 AUS_v54_convention_with_the_porte: "The Convention with the Porte"
 AUS_v54_convention_with_the_porte_desc: "Austria and the Ottoman Empire agree that Austrian troops may enter the Principalities once the Russians have left. For Vienna it is a way to keep the Danube closed to Russia without firing a shot; for the Sultan it is a lesser evil.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_four_points: "The Four Points"
 AUS_v54_four_points_desc: "Britain, France and Austria set out the conditions on which they will negotiate: an end to the Russian protectorate over the Principalities, free navigation of the Danube, a revision of the Straits convention and a common guarantee for the Sultan's Christian subjects. Russia is to be offered peace on terms that keep her great-power status."
 AUS_v54_occupy_the_principalities: "Occupation of the Principalities"
 AUS_v54_occupy_the_principalities_desc: "As the Russians withdraw across the Pruth, Austrian divisions march into Moldavia and Wallachia. The Empire now holds both banks of the lower Danube, and no Romanian patriot or Russian diplomat doubts that Vienna intends to keep a say in their future.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_december_treaty: "The Treaty of 2 December"
 AUS_v54_december_treaty_desc: "Austria binds itself to Britain and France: if Russia does not accept the Four Points, the three powers will consult on further measures, and Vienna promises to defend the Principalities. It is the closest the Empire comes to a Western alliance, and the Tsar takes note.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_vienna_conferences: "The Vienna Conferences"
 AUS_v54_vienna_conferences_desc: "Delegates of the belligerents and of Austria meet in Vienna to discuss the Four Points. The third point, the limitation of Russian naval power in the Black Sea, is the stumbling block, and every capital watches to see which way Austria will lean."
 AUS_v54_the_ultimatum: "The Ultimatum to St Petersburg"
 AUS_v54_the_ultimatum_desc: "The war has dragged on and Austria is ready to bring it to an end. Vienna presents the Tsar with a short and final choice: accept the Four Points as the basis of peace, or face a break in relations and the possibility of an Austrian declaration of war.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_congress_of_paris: "Austria at the Congress of Paris"
 AUS_v54_congress_of_paris_desc: "The plenipotentiaries gather in Paris. Austria has no territory to gain, but a great deal to defend: the Principalities must not be united under a Russian or French protégé, and the Danube must remain open to Austrian trade.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_new_order_on_the_danube: "A New Order on the Danube"
 AUS_v54_new_order_on_the_danube_desc: "With peace restored, Austria must decide how to use its position at the mouth of the Danube: withdraw from the Principalities as promised, open the river to trade, and court the new rulers in Bucharest and Jassy."
 AUS_v54_sylvester_patent: "The Sylvester Patent"
 AUS_v54_sylvester_patent_desc: "Since the patent of 31 December 1851 the Emperor has ruled without a constitution. Franz Joseph, at twenty-three, believes that a single will at the centre is what the Empire needs after 1848. The task is now to turn that belief into administration.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_bach_system: "The Bach System"
 AUS_v54_bach_system_desc: "Alexander von Bach's officials, the 'Bach hussars', administer every crown land by the same German-language rules. Taxes are collected, roads are built and justice is uniform, and the Hungarians, Czechs and Italians learn what it means to be governed from Vienna.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_imperial_marriage: "The Emperor's Marriage"
 AUS_v54_imperial_marriage_desc: "The young Emperor has chosen his cousin Elisabeth of Bavaria over his mother's candidate. The wedding in the Augustinerkirche is a rare moment of public affection for the dynasty, and the Empress will in time become the Hungarians' most sympathetic voice at court.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_concordat_negotiations: "Negotiations with the Holy See"
 AUS_v54_concordat_negotiations_desc: "Cardinal Rauscher and the Emperor's Catholic advisers want to settle the relations between Church and State once and for all. The price will be paid in schools, courts and marriage law, and the Josephinist bureaucracy is watching.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_police_and_censorship: "Police and Censorship"
 AUS_v54_police_and_censorship_desc: "A gendarmerie modelled on the French one watches the provinces, the press is licensed and the theatre is read before it is played. Order is kept, and the price is paid in resentment that does not show on the surface."
 AUS_v54_end_the_state_of_siege: "End the State of Siege"
 AUS_v54_end_the_state_of_siege_desc: "The martial law proclaimed in 1848 is lifted in the Italian provinces and in Hungary. The Emperor wishes to show that the Empire has returned to normal, and Radetzky, who still commands in Milan, agrees that the moment has come.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_keep_martial_law: "Keep Martial Law"
 AUS_v54_keep_martial_law_desc: "The Italian provinces and Hungary remain under military administration. Officers who restored the Empire in 1849 see no reason to trust the calm, and the Emperor does not contradict them."
 AUS_v54_imperial_council: "The Imperial Council"
 AUS_v54_imperial_council_desc: "The Reichsrat of 1851 is an advisory body of the Emperor's own choosing: it sits in secret, speaks when asked and has no vote. It is nevertheless the nearest thing the Empire has to a parliament, and the officials who staff it will be the Empire's ministers for a decade."
 AUS_v54_hungary_under_bach: "Hungary under Bach"
 AUS_v54_hungary_under_bach_desc: "Hungary has lost its diet, its counties and its historic constitution. German-speaking officials, Czech clerks and Austrian gendarmes govern the kingdom of St Stephen. The Magyar gentry have not forgotten 1848, and they have time."
 AUS_v54_court_camarilla: "The Court Camarilla"
 AUS_v54_court_camarilla_desc: "Count Grünne, the Emperor's adjutant-general, and the circle around the Archduchess Sophie decide who is promoted, who is heard and who is forgotten. The Emperor prefers to have men he knows around him, and the army pays for the preference."
 AUS_v54_state_of_the_finances: "The State of the Finances"
 AUS_v54_state_of_the_finances_desc: "Revenue grows but spending outruns it. The Empire is paying for the army of 1849, the railways and the pensions of its officials, and the Crimean mobilisation will add to the bill. Finance ministers speak of a deficit that no budget of the 1850s has closed."
 AUS_v54_national_loan: "The National Loan of 1854"
 AUS_v54_national_loan_desc: "To pay for the mobilisation, Vienna appeals to the patriotism of its subjects. A voluntary national loan is opened, with subscriptions in every crown land and official encouragement in every parish. Rothschild and the great houses take a share; the rest is raised from people who would rather not be asked twice.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_railway_policy: "Railway Policy"
 AUS_v54_railway_policy_desc: "The state owns the main lines but cannot afford to finish them. Ministers argue whether to continue as builder or to sell to private companies, and foreign capital, above all French, is waiting to buy.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_trade_treaty_with_prussia: "The Austro-Prussian Trade Treaty"
 AUS_v54_trade_treaty_with_prussia_desc: "Bruck's plan of a customs union of all Central Europe has failed, but the treaty of 1853 has given Austria a privileged position next to the Zollverein. Berlin has agreed to talk about further tariff reductions, and the south German states are watching."
 AUS_v54_semmering_railway: "The Semmering Railway"
 AUS_v54_semmering_railway_desc: "Carl von Ghega's line across the Semmering pass, the first mountain railway in the world, joins Vienna to Trieste by rail. Its viaducts and tunnels are a triumph of engineering and a promise of what the state can build.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_creditanstalt: "The Creditanstalt"
 AUS_v54_creditanstalt_desc: "Anselm von Rothschild and his partners found the Creditanstalt für Handel und Gewerbe, modelled on the Parisian Crédit Mobilier. Government licences, French capital and Viennese ambition will finance industry across the Empire.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_danube_steam_navigation: "The Danube Steamship Company"
 AUS_v54_danube_steam_navigation_desc: "The Danube Steam Navigation Company carries grain, timber and passengers from Vienna to the Black Sea. Whoever controls the lower Danube controls the outlet of Hungary's wheat, and the company is as much an arm of policy as of commerce."
 AUS_v54_army_in_1854: "The Imperial Army in 1854"
 AUS_v54_army_in_1854_desc: "The army that won in Italy and Hungary is long-serving, disciplined and badly paid. Its officers are drawn from the nobility and the military frontier, its regiments speak a dozen languages, and the budget has not changed since Radetzky's victories."
 AUS_v54_mobilisation_of_1854: "The Mobilisation of 1854"
 AUS_v54_mobilisation_of_1854_desc: "Reservists are called up, horses requisitioned and depots filled. More than three hundred thousand men are put under arms, a show of force that no neighbour can ignore and no finance minister can afford.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_economise_on_the_army: "Economise on the Army"
 AUS_v54_economise_on_the_army_desc: "The treasury cannot sustain a war footing. Regiments are kept at peace strength, furloughs are extended and the army's share of the budget is held down. The Emperor accepts the reasoning, and the generals do not."
 AUS_v54_lorenz_rifle: "The Lorenz Rifle"
 AUS_v54_lorenz_rifle_desc: "Lieutenant Josef Lorenz's muzzle-loading rifle, adopted in 1854, is accurate at long range and takes the Minie ball. The infantry will be re-armed regiment by regiment as the arsenals can manage.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_hess_and_the_general_staff: "Hess and the General Staff"
 AUS_v54_hess_and_the_general_staff_desc: "Baron Hess, the quartermaster-general, is the best planner in the army and the author of its war plans. He distrusts the camarilla and is distrusted by it. Whether his plans are carried out depends on whether the Emperor decides to listen."
 AUS_v54_army_of_observation: "The Army of Observation"
 AUS_v54_army_of_observation_desc: "Two armies are posted, one in Galicia and one in Transylvania, with orders to watch the Russians and to be ready. Their presence ties down Russian divisions that would otherwise be sent south, and their upkeep ties down Austrian gold."
 AUS_v54_military_frontier: "The Military Frontier"
 AUS_v54_military_frontier_desc: "The Croatian and Serbian borderers, farmers in peace and soldiers in war, supply the Empire with its toughest infantry. Their privileges cost little and their regiments fight well, and Vienna has no wish to see either change."
 AUS_v54_demobilisation: "Demobilisation"
 AUS_v54_demobilisation_desc: "The danger has passed and the money has run out. Regiments are sent home, depots are emptied and the army budget is cut to the bone. The savings are real, and so is the loss of the army's edge.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_lombardy_venetia: "Lombardy-Venetia"
 AUS_v54_lombardy_venetia_desc: "The richest provinces of the Empire are also the least reconciled. The Italian middle classes read Piedmontese newspapers, the aristocracy stays at home, and Marshal Radetzky rules from Milan with the army at his back."
 AUS_v54_the_old_marshal: "The Old Marshal"
 AUS_v54_the_old_marshal_desc: "Radetzky is in his late eighties and still in the saddle. His name keeps the army loyal and the Italians quiet, and nobody in Vienna wants to think about who will follow him."
 AUS_v54_sequestration_of_exiles_estates: "Maintain the Sequestration"
 AUS_v54_sequestration_of_exiles_estates_desc: "The estates of Lombard exiles who took Piedmontese citizenship have been sequestrated since 1853, and Turin has withdrawn its envoy in protest. Vienna will not give way to what it regards as an effort to open a door to revolution.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_conciliate_the_exiles: "Conciliate the Exiles"
 AUS_v54_conciliate_the_exiles_desc: "The sequestration is lifted for those who return and submit. Some of the Lombard families come back, Turin restores its envoy, and the case for patience is argued in Vienna by those who remember how quickly the provinces turned in 1848."
 AUS_v54_the_quadrilateral: "The Quadrilateral"
 AUS_v54_the_quadrilateral_desc: "Verona, Legnago, Mantua and Peschiera, between the Mincio and the Adige, form the fortress belt on which every Austrian plan for Italy depends. The forts are kept in repair and the garrisons are never reduced."
 AUS_v54_amnesty_of_1857: "The Amnesty of 1857"
 AUS_v54_amnesty_of_1857_desc: "To mark the Emperor's visit to the Italian provinces, political prisoners are pardoned and the sequestrations are lifted. The gesture is generous, the reception is polite, and nobody supposes that it will change the Italians' minds.\n\n$V54_HISTORICAL_PATH$"
 AUS_v54_radetzkys_successor: "A Successor for Radetzky"
 AUS_v54_radetzkys_successor_desc: "The marshal asks to be relieved and the Emperor must choose a successor for Italy. The army wants a soldier, the court wants a prince, and the Italians would prefer a man who speaks their language.\n\n$V54_HISTORICAL_PATH$"
