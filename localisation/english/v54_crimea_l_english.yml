l_english:
 ## War, category, mission
 V54_WAR_EASTERN_QUESTION_NAME: "The Crimean War"
 v54_decisions_category_crimea: "The Eastern War"
 v54_decisions_category_crimea_desc: "Russia is at war with the Ottoman Empire, and the Western powers may join. Peace will come through the armies, or through exhaustion."
 v54_mission_crimean_peace: "Peace in the East"
 v54_mission_crimean_peace_desc: "The war will end when one side is defeated or when both are exhausted. The terms depend on who has won."
 v54_mission_crimean_peace_tt: "Russia is defeated, or the Ottoman Empire is defeated"

 ## Ideas and opinion modifiers
 v54_idea_black_sea_neutralised: "Black Sea Neutralised"
 v54_idea_black_sea_neutralised_desc: "The Treaty of Paris forbids war fleets and arsenals on the Black Sea coast."
 v54_om_crimean_comrades_in_arms: "Comrades in Arms"
 v54_om_crimean_enemy: "Enemy in the Crimean War"
 v54_om_crimean_sympathy: "Sympathy in the Eastern Crisis"
 v54_om_crimean_disfavour: "Disfavour in the Eastern Crisis"

 ## 1 - hidden
 v54_eur.1.a: "The war begins."

 ## 2 - Britain
 v54_eur.2.t: "The Eastern Ultimatum"
 v54_eur.2.d: "The Ottoman Empire is at war with Russia, Russian troops occupy the Danubian Principalities, and the destruction of an Ottoman squadron at Sinope has aroused the press. In the Cabinet, voices for a firm answer meet colleagues who doubt that Britain can fight on the Continent after four decades of peace.\n\nIf the Sultan falls, the balance of power in the East and the road to India fall with him. The French Emperor is waiting to see what London will do."
 v54_eur.2.a: "$V54_HISTORICAL_MARK$ We stand with the Sultan. The balance of power is at stake.\n§gHistorically: Britain declared war on Russia in March 1854, alongside France, and fought in the Crimea until the Peace of Paris in 1856.§!"
 v54_eur.2.b: "Press for mediation through a conference at Vienna."
 v54_eur.2.c: "Britain will not fight for the Ottoman Empire."
 v54_eur.2.e: "Seek an understanding with the Tsar."

 ## 3 - France
 v54_eur.3.t: "Prestige in the East"
 v54_eur.3.d: "Napoleon III has championed Catholic claims to the Holy Places and sees in Russian pressure on the Sultan a chance to end French isolation since 1815 and to stand beside Britain as an equal.\n\nThe regime needs prestige abroad, but France has few interests on the Danube, and a long war could strain the finances and the loyalty of the army and of the Church."
 v54_eur.3.a: "$V54_HISTORICAL_MARK$ France will stand with Britain and the Sultan.\n§gHistorically: France declared war on Russia in March 1854, alongside Britain. The Congress of Paris in 1856 raised the prestige of the Second Empire.§!"
 v54_eur.3.b: "Seek a settlement through a conference at Vienna."
 v54_eur.3.c: "France will keep out of an Eastern war."
 v54_eur.3.e: "Seek a rapprochement with Russia."

 ## 4 - mediation fails
 v54_eur.4.t: "Mediation Fails"
 v54_eur.4.d: "The notes drafted at Vienna have satisfied neither the Tsar nor the Sultan. Every week without a settlement strengthens those at home who demand action, and the Ottoman army cannot be expected to hold alone.\n\nThe government must now say whether it will fight."
 v54_eur.4.a: "$V54_HISTORICAL_MARK$ Mediation has failed. We must fight.\n§gHistorically: The Vienna negotiations failed, and Britain and France declared war in March 1854.§!"
 v54_eur.4.b: "We will remain neutral."

 ## 5 - notification
 v54_eur.5.t: "The War Widens"
 v54_eur.5.d: "[FROM.GetNameDef] has entered the war against Russia on the side of the Ottoman Empire. The conflict is no longer confined to the Danube and the Black Sea."
 v54_eur.5.a: "The war widens."

 ## 10 - Austria
 v54_eur.10.t: "The Danubian Principalities"
 v54_eur.10.d: "Russian troops occupy Moldavia and Wallachia, on the very frontier of the Empire. Austria owes much to Russian help in Hungary in 1849, but a Russian army on the lower Danube threatens Austrian trade and security.\n\nThe Emperor's ministers disagree about whether gratitude or interest should guide the Empire, and every capital is watching Vienna."
 v54_eur.10.a: "$V54_HISTORICAL_MARK$ Mobilise on the frontier and demand Russian withdrawal, while remaining formally neutral.\n§gHistorically: Austria mobilised and occupied the Principalities after the Russian withdrawal, but never fought. Russia saw it as ingratitude.§!"
 v54_eur.10.b: "Austria will stand by Russia, our friend of 1849."
 v54_eur.10.c: "Join the Western powers against Russia."
 v54_eur.10.e: "Offer mediation and keep the Empire out of the war."

 ## 15 - Prussia
 v54_eur.15.t: "Prussia and the Eastern Question"
 v54_eur.15.d: "The court of Friedrich Wilhelm IV is divided: conservatives feel bound to Russia, while liberals and many diplomats look to Britain.\n\nPrussia has no direct interest on the Black Sea, but each of the powers wants its support or at least its silence. How Berlin uses its neutrality will help decide its standing among the great powers."
 v54_eur.15.a: "$V54_HISTORICAL_MARK$ Remain neutral and keep Prussia free of entanglements.\n§gHistorically: Prussia stayed neutral. It was left out of the early peace talks and admitted to the Congress of Paris only late.§!"
 v54_eur.15.b: "Offer Russia a benevolent neutrality."
 v54_eur.15.c: "Lean toward the Western powers."

 ## 20, 21 - Sardinia-Piedmont
 v54_eur.20.t: "The Western Invitation"
 v54_eur.20.d: "Britain and France are looking for further allies in the East. A small Sardinian force would cost money and lives in a war far from Italy, and Parliament is divided.\n\nBut Piedmont's ministers believe that fighting beside the Western powers may win the Italian question a hearing that Austria has so far denied it."
 v54_eur.20.a: "$V54_HISTORICAL_MARK$ Send an expeditionary force to the Crimea.\n§gHistorically: Piedmont joined in January 1855 and sent about 15,000 men. Cavour won a seat at the Congress of Paris.§!"
 v54_eur.20.b: "Decline. Piedmont's resources are needed at home."
 v54_eur.21.t: "A Seat at the Congress"
 v54_eur.21.d: "Piedmont has been admitted to the peace congress at Paris. The great powers have not agreed to discuss Italy, but a seat at the table gives the government a chance to bring the condition of the peninsula before Europe, at the risk of offending Vienna."
 v54_eur.21.a: "$V54_HISTORICAL_MARK$ Raise the Italian question before the Congress.\n§gHistorically: Cavour raised the Italian question at Paris, to Austria's displeasure, without any immediate result.§!"
 v54_eur.21.b: "Avoid giving offence to Austria."

 ## 30 - the peace
 v54_eur.30.t: "The Peace of Paris"
 v54_eur.30.d.allied: "The Tsar's government has accepted terms. Russia gives up southern Bessarabia, the Black Sea is neutralised, and the Danubian Principalities are placed under the collective guarantee of the powers.\n\nThe Ottoman Empire is saved but deeply in debt, and the victors have restored the prestige of their governments at Russia's expense."
 v54_eur.30.d.russian: "The war has ended on terms favourable to Russia. The Sultan has accepted the loss of Kars, and the Principalities are placed under the collective guarantee of the powers.\n\nThe Western powers have failed to halt Russian pressure on the Ottoman Empire, and the prestige of their governments has suffered."
 v54_eur.30.d.negotiated: "Neither side can win decisively, and the powers have agreed a settlement. The Principalities are evacuated and placed under a collective guarantee, and the Ottoman Empire emerges weakened and in debt.\n\nRussia keeps its territory, and the future of the Black Sea remains uncertain."
 v54_eur.30.a: "The war is over."

 ## 35 - the Pontic clauses
 v54_eur.35.t: "The Pontic Clauses"
 v54_eur.35.d: "Prince Gorchakov argues that the neutralisation of the Black Sea, imposed after the Crimean War, can no longer bind Russia now that the European order has changed.\n\nA circular repudiating the clauses would challenge the Treaty of Paris, but the other powers are in no position to enforce it."
 v54_eur.35.a: "$V54_HISTORICAL_MARK$ Repudiate the Black Sea clauses.\n§gHistorically: Russia repudiated the Black Sea clauses in October 1870, and the London Conference of 1871 accepted the change.§!"
 v54_eur.35.b: "Respect the treaty for now."

 ## 100-104 - 1859 reactions
 v54_eur.100.t: "The Italian Setback"
 v54_eur.100.d: "Austria has held Lombardy and Venetia, and the army has returned without the victory that Paris had promised. The Emperor's authority rests partly on success, and the opposition is quick to say so.\n\nNapoleon III must decide whether to answer failure with firmer control or with concessions."
 v54_eur.100.a: "Tighten control. The regime cannot appear weak."
 v54_eur.100.b: "Open the regime to a wider public."
 v54_eur.101.t: "Victory in Italy"
 v54_eur.101.d: "Austrian arms have held Lombardy and Venetia, and the prestige of the Empire has risen. The provinces remain restless, however, and the lesson drawn in Vienna will shape the course of the Empire elsewhere.\n\nThe government must decide what to do with its victory."
 v54_eur.101.a: "Rule the Italian provinces firmly. Order must be kept."
 v54_eur.101.b: "Offer the Italian provinces a measure of autonomy."
 v54_eur.102.t: "Momentum Lost"
 v54_eur.102.d: "The campaign has failed and the Italian cause has lost its momentum. Cavour's policy is attacked in some quarters, but national feeling has not disappeared, and the government has time to choose its next step.\n\nThe question is whether Piedmont should rebuild quietly or encourage patriots across the peninsula."
 v54_eur.102.a: "Rebuild the army and wait for a better moment."
 v54_eur.102.b: "Turn to the National Society and the patriots of the central duchies."
 v54_eur.103.t: "Defeat in Italy"
 v54_eur.103.d: "Lombardy is lost and the Emperor's prestige is damaged. The treasury is empty, and the old system of government is blamed in Vienna and in Budapest.\n\nReform can no longer be postponed, but its direction is disputed between those who want a constitution and those who want to preserve the existing order."
 v54_eur.103.a: "$V54_HISTORICAL_MARK$ Turn toward constitutional reform.\n§gHistorically: The October Diploma (1860) and the February Patent (1861) followed, as Vienna tried a constitutional course.§!"
 v54_eur.103.b: "Preserve the existing system with minor adjustments."
 v54_eur.104.t: "Prestige in Italy"
 v54_eur.104.d: "The Emperor's army has won on Italian soil, and the Empire's standing in Europe has risen. Success abroad has strengthened the regime, but the speed of Piedmont's growth worries many in Paris, and the Catholic party is uneasy about the fate of the Pope.\n\nNapoleon III must decide how to use his prestige at home."
 v54_eur.104.a: "Strengthen the authority of the Empire."
 v54_eur.104.b: "$V54_HISTORICAL_MARK$ Use the moment to open the regime.\n§gHistorically: from 1860 Napoleon III began to widen the powers of the legislature, the first steps of the Liberal Empire.§!"

 ## 200-620 - continental crises
 v54_eur.200.t: "War in Schleswig"
 v54_eur.200.d: "Prussian and Austrian troops have entered Schleswig, and Denmark appeals to the powers that signed the London Protocol of 1852. Britain, a signatory, has strong sympathies for Denmark but no army to send to the Continent.\n\nThe Cabinet must decide whether to speak, to act or to stay out."
 v54_eur.200.a: "$V54_HISTORICAL_MARK$ Call a conference in London and protest to the German powers.\n§gHistorically: Britain called the London Conference in 1864. It failed, and Denmark lost the duchies.§!"
 v54_eur.200.b: "Press the German powers to halt their advance."
 v54_eur.200.c: "Stay out of a quarrel that is not ours."
 v54_eur.300.t: "Prussia's Triumph"
 v54_eur.300.d: "Prussia has beaten Austria in a matter of weeks and the old German Confederation is gone. The Emperor's policy of balancing the two German powers has failed, and public opinion in Paris speaks of compensation on the Rhine.\n\nNapoleon III must choose how France should answer a new power on her frontier."
 v54_eur.300.a: "Contain Prussia by building alliances against her."
 v54_eur.300.b: "Seek an accommodation with Berlin."
 v54_eur.300.c: "Support Austria's recovery."
 v54_eur.300.e: "$V54_HISTORICAL_MARK$ Preserve the balance through diplomacy and press for compensation.\n§gHistorically: Napoleon III sought compensation on the Rhine and later in Luxembourg. He obtained none, and relations with Prussia worsened.§!"
 v54_eur.300.f: "Prepare for a decisive war."
 v54_eur.310.t: "Prussia After Defeat"
 v54_eur.310.d: "The Prussian army has been beaten and the policy of the Crown is in ruins. The Landtag, the generals and the court blame one another, and the position of the ministry is uncertain.\n\nThe kingdom's course in Germany must now be decided."
 v54_eur.310.a: "Reform the kingdom: liberalise and rebuild the army."
 v54_eur.310.b: "Prepare a revanche against Vienna."
 v54_eur.310.c: "Abandon German hegemony and concentrate on Prussia."
 v54_eur.310.e: "Reconcile with Vienna and accept an Austrian-led order."
 v54_eur.311.t: "The Balance Reassessed"
 v54_eur.311.d: "Austria has defeated Prussia, and the German balance that Paris long hoped for has been restored in an unexpected way. The Emperor's advisers disagree about whether to welcome the Austrian settlement or to treat a strengthened Habsburg Germany as a new danger."
 v54_eur.311.a: "Welcome the settlement and improve relations with Vienna."
 v54_eur.311.b: "Stay watchful and keep our options open."
 v54_eur.320.t: "The German War"
 v54_eur.320.d: "Austria and Prussia are at war over the leadership of Germany. Britain has no direct interest in the outcome, but the balance of power in Central Europe and the position of Belgium and the Low Countries are not matters of indifference.\n\nParliament wants to know whether the government will act."
 v54_eur.320.a: "$V54_HISTORICAL_MARK$ Remain neutral and watch the Low Countries.\n§gHistorically: Britain stayed neutral in the war of 1866.§!"
 v54_eur.320.b: "Offer mediation to both powers."
 v54_eur.600.t: "France Has Won"
 v54_eur.600.d: "The French army has prevailed and the road to German unification has closed. The southern states look to Paris as much as to Berlin, and the military reputation of Prussia is shaken.\n\nThe court and the government must decide how to recover."
 v54_eur.600.a: "Rebuild the army and prepare a revanche."
 v54_eur.600.b: "Seek a settlement with Paris and consolidate the North."
 v54_eur.600.c: "Turn to the German liberals and the southern states."
 v54_eur.601.t: "The Imperial Triumph"
 v54_eur.601.d: "Napoleon III has defeated Prussia, and the Empire stands higher than at any time since 1815. The Emperor must decide how to use his triumph: to strengthen the dynasty, to continue the liberal reforms of recent years, or to press the advantage over Germany."
 v54_eur.601.a: "Strengthen the dynasty and the position of the Prince Imperial."
 v54_eur.601.b: "Continue the Liberal Empire."
 v54_eur.601.c: "Press the advantage over Germany."
 v54_eur.620.t: "War in the West"
 v54_eur.620.d: "France and Prussia are at war. Britain intends to stay out, but the neutrality of Belgium, guaranteed in 1839, is at stake. Ministers must decide how firmly to say so."
 v54_eur.620.a: "$V54_HISTORICAL_MARK$ Secure Belgian neutrality and remain neutral.\n§gHistorically: In August 1870 Britain secured treaties from both belligerents respecting Belgian neutrality, and stayed out of the war.§!"
 v54_eur.620.b: "Offer mediation to both belligerents."
 v54_eur.620.c: "Press the aggressor to stop."
