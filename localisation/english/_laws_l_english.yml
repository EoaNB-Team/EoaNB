 ### Laws ###
 
 # Government Issues
 no_police: "No Police"
 no_police_desc: "There is no standing force charged with keeping the peace. Order rests on custom, kinship and the private retainers of whoever can afford them, and justice is whatever a community is willing to enforce for itself."
 local_police: "Local Police Force"
 local_police_desc: "Constables and night watchmen are hired by the town or parish that pays them. They are enough to break up a brawl or run down a thief, but they keep no records, hold no jurisdiction beyond the parish boundary, and answer to local notables rather than to the state."
 dedicated_police: "Dedicated Police Force"
 dedicated_police_desc: "A uniformed, professional service walks a regular beat, keeps files, and investigates crime as a full-time occupation. Public order becomes a branch of administration rather than a matter of local goodwill, and the state can reach into the poorest quarter of any city it governs."
 police_state: "Police State"
 police_state_desc: "The police answer to the government rather than to the law. Informants, political dossiers and preventive arrest keep the streets remarkably quiet, and every citizen learns to be careful about who might be listening."

 no_healthcare: "No Healthcare"
 no_healthcare_desc: "The sick are tended at home by family, midwives and folk remedy. Physicians serve the wealthy, epidemics are met with prayer and quarantine, and a bad winter is simply survived or not."
 charitable_healthcare: "Charitable Healthcare"
 charitable_healthcare_desc: "Hospitals are founded by religious orders and private benefactors, offering almshouse care to the destitute. Treatment costs nothing and is worth roughly that much, since its quality depends entirely on the piety and purse of the donors."
 private_healthcare: "Private Healthcare"
 private_healthcare_desc: "Medicine is a trade like any other, sold at a fee to those who can meet it. Standards climb as physicians organise their profession and licence their own, but an illness in the family can still ruin a working household."
 public_healthcare: "Public Healthcare"
 public_healthcare_desc: "Sanitation boards, public dispensaries and state-funded hospitals treat the health of the population as a national asset rather than a private misfortune. Deaths from cholera and typhus fall sharply; so does the treasury balance."

 oral_tradition: "Oral Tradition"
 oral_tradition_desc: "Knowledge passes from parent to child and from master to apprentice, carried in memory, craft and song. There are no schools worth the name, and letters are the preserve of a small clerical few."
 church_sponsored_education: "Church Sponsored Education"
 church_sponsored_education_desc: "Parish and monastic schools teach the young their letters, their numbers and their catechism. The clergy decide what is worth knowing, and the salvation of the soul ranks a good deal higher on that list than arithmetic."
 traditional_ulama: "Traditional Ulama"
 traditional_ulama_desc: "Maktabs and madrasas instruct students under religious scholars, grounding them in scripture, jurisprudence and the classical sciences. The system produces learned and literate men in abundance, though very few of them are engineers."
 private_education: "Private Education"
 private_education_desc: "Schooling is a service bought and sold, from village tutors to endowed academies with waiting lists. Those with means are educated superbly, and everyone else is educated not at all."
 public_schooling_system: "Public Schooling System"
 public_schooling_system_desc: "The state builds the schools, trains the teachers and compels attendance. Literacy becomes an expectation rather than an accomplishment, and every child in the country is taught the same history out of the same book."

 disarmed_nation: "Disarmed Nation"
 disarmed_nation_desc: "The nation fields no army worth the name, whether by treaty, by principle or by poverty. Defence rests on fortifications, diplomacy and the continued goodwill of the neighbours."
 early_conscription: "Early Conscription"
 early_conscription_desc: "Men are called up by levy and local obligation rather than from any national register, mustered by landowners and town councils when the crown demands it. The host is numerous, slow to gather, and drilled only as well as whoever raised it saw fit."
 volunteer_only: "Volunteer Only"
 volunteer_only_desc: "The ranks are filled by men who choose to enlist, drawn by the bounty, the uniform or the want of other work. A small, long-serving professional army: expensive per head, excellent in the field, and impossible to expand in a hurry."
 limited_conscription: "Limited Conscription"
 limited_conscription_desc: "Each year's cohort draws lots for a short term of service, with substitutes purchasable and exemptions widely available to those who know how to ask. Enough to maintain a trained reserve without emptying the fields at harvest."
 extensive_conscription: "Extensive Conscription"
 extensive_conscription_desc: "Every fit young man is registered and expected to serve his term, with narrow exemptions and few deferments. The army becomes the institution through which the entire male population passes, and it teaches them rather more than drill."
 service_by_requirement: "Service by Requirement"
 service_by_requirement_desc: "Call-up classes are widened or narrowed by decree as the fighting demands. Age limits stretch, medical standards relax, and reserved occupations shrink with every campaign that goes badly."
 all_adults_serve: "All Adults Serve"
 all_adults_serve_desc: "Military obligation extends to the whole adult population, women included. Civilian life persists only where it directly serves the war, and the distinction between the front and the home front becomes largely administrative."
 scraping_the_barrel: "Scraping the Barrel"
 scraping_the_barrel_desc: "Boys, greybeards and the barely fit are put into uniform because there is nobody else to put there. Every soldier raised is a worker lost, and the nation has begun consuming the generation it will need afterward."

 # Government Structure
 no_elections: "No Elections"
 no_elections_desc: "Authority descends from the throne, the party or the junta; it is not asked for and it is not surrendered. Politics still happens, but in antechambers and barracks rather than at any ballot box."
 landed_voting: "Landed Voting"
 landed_voting_desc: "The franchise belongs to those who hold land, on the theory that property is the only reliable proof a man has a stake in the country. The electorate is small, rural and comfortably predictable."
 weighted_wealth_voting: "Weighted Wealth Voting"
 weighted_wealth_voting_desc: "Votes are counted by the tax a man pays or the class he is sorted into. Everyone is represented; a few thousand of them are represented as heavily as several million of the others."
 universal_male_suffrage: "Universal Male Suffrage"
 universal_male_suffrage_desc: "Every adult man votes, whatever his property or income. Half the population now decides for all of it, and the parties must learn to speak to the factory floor as fluently as to the drawing room."
 universal_suffrage: "Universal Suffrage"
 universal_suffrage_desc: "Every adult citizen votes on equal terms. The electorate has stopped being a privileged fraction of the nation and become the nation itself, with all the volatility that implies."

 national_supremacy: "National Supremacy"
 national_supremacy_desc: "The state recognises one people as its own and treats everyone else as a guest at best. Minorities are shut out of office, out of the professions and out of the law's interest in whether they come to harm."
 racial_segregation: "Racial Segregation"
 racial_segregation_desc: "Minorities may live and work in the country, but strictly apart: separate districts, separate schools, separate carriages, separate and unequal in every particular the statute book can reach. The doctrine claims to divide without ranking; the funding says otherwise."
 limited_equality: "Limited Equality"
 limited_equality_desc: "The law's protections now extend past the dominant group, though on conditions, and assimilation is expected of anyone who wants the benefit of them. Rights on paper continue to outrun rights in practice."
 full_equality: "Full Equality"
 full_equality_desc: "The law draws no distinction of origin, ancestry or creed, and every citizen stands in the same relation to the state. What the neighbours privately think is no longer the state's business to enforce."

 theocracy: "Theocracy"
 theocracy_desc: "Religious authority and civil authority are the same authority. Doctrine has the force of statute, clerics sit as magistrates, and heresy is prosecuted as a crime against the state itself."
 state_religion: "State Religion"
 state_religion_desc: "One confession is established and endowed, its clergy salaried from the treasury and its calendar made official. Other faiths may be tolerated, but tolerance is a favour granted rather than a right held."
 freedom_of_religion: "Freedom of Religion"
 freedom_of_religion_desc: "No one is punished for their beliefs and no congregation is barred from worship. The state keeps its historic favourite and its old endowments, but it no longer keeps a monopoly."
 total_seperation: "Total Separation"
 total_seperation_desc: "The state neither funds religion nor answers to it. Churches become private associations, sovereign in their own sphere and without standing in the public one, and the registry office replaces the parish record."
 state_atheism: "State Atheism"
 state_atheism_desc: "Organised religion is treated as a rival authority and suppressed accordingly: endowments seized, seminaries closed, clergy watched or worse. Belief retreats into the household, where it proves considerably harder to legislate away."

 politicized_courts: "Politicized Courts"
 politicized_courts_desc: "Judges rule as the government requires them to rule. The verdict is settled before the trial opens, and the proceedings exist to give it a paper trail."
 corrupt_courthouse: "Corrupt Courthouse"
 corrupt_courthouse_desc: "The law is available to whoever can pay for it. Money reaches the bench, the clerk and the witness box alike, and a poor man's case is decided long before anyone hears it."
 aristocratic_courts: "Aristocratic Courts"
 aristocratic_courts_desc: "Justice is dispensed by men of rank sitting in judgement over their social inferiors. The law is applied honestly enough, so long as nobody of consequence is standing in the dock."
 quasi_jury_court: "Quasi-Jury System"
 quasi_jury_court_desc: "Lay assessors sit beside professional judges, checking the bench without displacing it. Their view can be overruled on appeal, but it can no longer simply be ignored."
 full_jury_court: "Full-Jury Court"
 full_jury_court_desc: "Guilt is decided by a jury of one's peers under rules of evidence that bind the prosecution as tightly as the defence. Before the state may punish anyone, it must first persuade twelve ordinary people."

 # Economy Laws
 traditional_economy: "Traditional Economy"
 traditional_economy_desc: "Production follows custom: households make what they have always made, and exchange runs on obligation, tribute and barter as much as on coin. Markets exist at the edges of an economy that is not organised around them."
 agrarian_economy: "Agrarian Economy"
 agrarian_economy_desc: "The land is the economy. Landowners set the terms of production, the towns exist to service the countryside, and industry is a curiosity rather than an engine."
 interventionist_economy: "Interventionist Economy"
 interventionist_economy_desc: "Private ownership persists, but the state steers it with tariffs, subsidies, charters and the occasional nationalisation. Capital goes where the ministry wants it, which is not always where it would earn the most."
 laissez_faire_economy: "Laissez Faire Economy"
 laissez_faire_economy_desc: "The government enforces contracts, guards the currency and otherwise stands well back. Investment flows to wherever the return is highest, and the consequences, the fortunes and the ruin alike, are left where they fall."
 planned_economy: "Planned Economy"
 planned_economy_desc: "The means of production belong to the state and output is set by plan rather than by price. Nothing is left to the market, including the correction of the plan's mistakes."

 isolationism: "Isolationism"
 isolationism_desc: "Foreign goods are kept out and domestic goods kept home. Trade is treated as a channel for foreign influence to be sealed rather than a source of wealth to be tapped."
 protectionism: "Protectionism"
 protectionism_desc: "High tariffs shelter domestic industry from foreign competition. Home producers grow large, profitable and comfortable, and the consumer pays for every year of that comfort."
 mercantilism: "Mercantilism"
 mercantilism_desc: "Trade is managed as an instrument of state power through chartered companies, navigation acts and a balance of exports kept firmly in the nation's favour. Wealth is understood as something to be won from rivals rather than created with them."
 free_trade: "Free Trade"
 free_trade_desc: "Tariffs fall and goods move to wherever they are wanted. Consumers get cheap imports and exporters get open markets, and whichever industries cannot meet the world price do not survive the decade."

 serfdom: "Serfdom"
 serfdom_desc: "Peasants are bound to the estate they work and owe labour, dues and deference to its owner. They cannot leave, cannot bargain, and are counted with the land when it changes hands."
 tenant_farmers: "Tenant Farmers"
 tenant_farmers_desc: "The peasantry is legally free and practically landless, renting its plots and surrendering a share of every harvest. Free to leave the estate, and with nowhere in particular to go."
 farmer_owned_land: "Farmer Owned Land"
 farmer_owned_land_desc: "The men who work the fields own them. Smallholdings dominate the countryside and produce a stubbornly independent, self-sufficient and deeply conservative peasantry that no minister can safely ignore."
 capitalist_agriculture: "Capitalist Agriculture"
 capitalist_agriculture_desc: "Holdings are consolidated and farmed for the market with hired hands, fertiliser and machinery. Yields rise sharply and so does the number of families walking to the cities because the estate no longer needs them."
 state_owned_farmland: "State Owned Farmland"
 state_owned_farmland_desc: "Farmland belongs to the nation and is worked collectively under state direction. Quotas replace rents, the harvest is disposed of by the plan, and the peasant discovers he has exchanged one landlord for a larger one."

 demobilised_economy: "Demobilised Economy"
 demobilised_economy_desc: "Industry produces for civilians. The armed forces take what the peacetime budget allows them and are told to make it last."
 low_level_mobilisation: "Low Mobilisation"
 low_level_mobilisation_desc: "A modest share of industry works on military contracts while ordinary production continues largely undisturbed. Enough to keep a standing army equipped; nowhere near enough to fight a long war."
 partial_mobilisation: "Partial Mobilisation"
 partial_mobilisation_desc: "War orders take precedence over civilian ones, factories retool and the first ration cards appear. The economy is on a war footing without yet being consumed by the war."
 war_economy: "War Economy"
 war_economy_desc: "Production is directed to the front, consumer goods are rationed to the minimum and labour is allocated where the ministry says it is needed. The country makes what the army requires and learns to do without the rest."
 total_mobilisation: "Total Mobilisation"
 total_mobilisation_desc: "Every factory, field and pair of hands is committed to the war. Civilian life is stripped to bare subsistence, capital is consumed rather than replaced, and the economy is being spent rather than run."

 no_limit: "No Limit"
 no_limit_desc: "Hours are whatever the employer sets and the worker can endure. Sixteen-hour shifts are perfectly legal, and exhaustion is treated as a defect of character."
 hours_14: "14 Hours"
 hours_14_desc: "The working day is capped at fourteen hours. A first concession, and one that leaves a labourer just enough of the day to sleep in and return from."
 hours_12: "12 Hours"
 hours_12_desc: "Twelve hours is the legal maximum, with a half day common on Saturdays. A real reform, if an unambitious one, and the inspectorate is finally given somebody to inspect."
 hours_10: "10 Hours"
 hours_10_desc: "Ten hours by statute, and the evening starts to belong to the worker: reading rooms, meeting halls, night classes and the beginnings of a life outside the factory gate."
 hours_8: "8 Hours"
 hours_8_desc: "Eight hours labour, eight hours recreation, eight hours rest. The demand that filled a century of union banners, at last written into the statute book."

 # Human Rights Laws
 no_freedom_of_speech: "No Freedom of Speech"
 no_freedom_of_speech_desc: "Criticising the government is a crime and gathering to do so is another one. Dissent survives in private letters, coffee houses and exile, and everyone knows the difference between what may be said and what may be thought."
 government_only_gatherings: "Government Only Gatherings"
 government_only_gatherings_desc: "Public meetings require a permit, granted freely to loyal organisations and refused to everyone else. Official parades are enormous and impeccably attended; opposition rallies do not take place at all."
 free_assembly: "Free Assembly"
 free_assembly_desc: "Citizens may meet, march and petition without asking anyone's permission. The authorities may police a demonstration and route it away from the palace, but they may not forbid it."
 protected_speech: "Protected Speech"
 protected_speech_desc: "Speech and assembly are guaranteed against the government itself, and the courts will strike down any minister who forgets it. Even seditious opinion is answered with argument rather than arrest."

 prohibited_trade_unions: "Prohibited Trade Unions"
 prohibited_trade_unions_desc: "Combination among workers is illegal. Organisers are dismissed, blacklisted and prosecuted as conspirators, and wages are settled by the employer talking to himself."
 state_controlled_unions: "State Controlled Unions"
 state_controlled_unions_desc: "Workers are enrolled in official syndicates that answer to the government rather than to the membership. They process grievances, distribute holiday funds and never, under any circumstances, call a strike."
 free_regulatory_bodies: "Free Regulatory Bodies"
 free_regulatory_bodies_desc: "Unions are legal and may bargain collectively, within the limits the law places on strikes, pickets and political funds. Labour has been given a voice, and a leash to go with it."
 worker_controlled_unions: "Worker Controlled Unions"
 worker_controlled_unions_desc: "Unions are independent, self-governing and free to withdraw their labour. Wages and conditions are settled across a table rather than handed down, and both sides of it know what a general strike would cost."

 legal_guardianship: "Legal Guardianship"
 legal_guardianship_desc: "A woman passes from her father's authority to her husband's and holds no legal standing of her own. Her property, her wages and her children belong to the man legally responsible for her."
 property_rights_for_women: "Property Rights for Women"
 property_rights_for_women_desc: "Women may own property, sign contracts and keep their own earnings, married or not. Legal personhood arrives a long generation before political equality does."
 women_in_the_workforce: "Women in the Workforce"
 women_in_the_workforce_desc: "Women may enter the trades and the professions on their own account, without a husband's or father's consent. The pay is unequal and the offices are hostile, but the door is legally open."
 womens_suffrage: "Women's Suffrage"
 womens_suffrage_desc: "Women vote and stand for office on the same terms as men. The electorate has doubled overnight, and every party is suddenly interested in questions it spent a century calling domestic."

 closed_borders: "Closed Borders"
 closed_borders_desc: "Entry is barred to all but a handful of vetted visitors, and leaving is often no easier. The nation is sealed in both directions, and the frontier is guarded against its own population as much as anyone else's."
 strict_border_control: "Strict Border Control"
 strict_border_control_desc: "Immigration is capped, screened and admitted only where the state can see a use for it. Papers are demanded at the frontier and refused often enough to keep the queue short."
 loose_borders: "Loose Borders"
 loose_borders_desc: "Migrants may come and settle with little more than a formality at the frontier post. Restrictions exist mostly on paper and are enforced mostly when someone makes a fuss."
 open_borders: "Open Borders"
 open_borders_desc: "Anyone may come, work and settle. The border becomes a line on a map and a customs house rather than a barrier, and the cities fill with people who were not born in them."

 legacy_slavery: "Legacy Slavery"
 legacy_slavery_loc: "Legacy Slavery"
 legacy_slavery_desc: "[GetLegacySlaveryDesc]"
 slave_trade: "Slave Trade"
 slave_trade_desc: "Human beings are bought, shipped and sold as property, and the traffic itself is a pillar of the economy. Whole fortunes rest on cargo that has to be chained to keep it aboard, and the ledgers record the losses as spoilage."
 debt_slavery: "Debt Slavery"
 debt_slavery_desc: "The open trade is abolished, but a debt can still be worked off with a lifetime and the obligation still passes to one's children. Bondage survives by contract instead of by capture, and the contracts are written by the creditor."
 freedom_of_the_womb: "Freedom of the Womb"
 freedom_of_the_womb_desc: "Children born to enslaved mothers are free, and the institution is left to die out with the generation already enduring it. Abolition promised, deferred by forty years, and paid for entirely by the people asked to wait."
 slavery_banned: "Slavery Banned"
 slavery_banned_desc: "Slavery is abolished outright and holding a person as property is a crime. Emancipation is immediate; equality is not, and the freed are left to claim the rest of it themselves against owners who have lost nothing but the title."
 
 legal_child_labour: "Legal Child Labour"
 legal_child_labour_desc: "Children work the same shifts as adults for a fraction of the wage, small hands being useful around machinery and cheap everywhere else. Childhood ends at whatever age a family can no longer afford to feed one."
 restricted_child_labour: "Restricted Child Labour"
 restricted_child_labour_desc: "Minimum ages and hour limits keep the youngest out of the mills and the mines, at least wherever an inspector actually goes. Enforcement is thin and convenient errors in the parish register are common."
 banned_child_labour: "Banned Child Labour"
 banned_child_labour_desc: "Employing children is illegal and the schoolroom replaces the factory floor. Poor families lose a wage they were counting on, and their children gain a decade of their lives."

 no_press: "No Printed Press"
 no_press_desc: "There is no printed press to regulate. News travels by rumour, pulpit and proclamation, and it travels at the speed of a man on a horse."
 state_controlled_press: "State Controlled Press"
 state_controlled_press_desc: "Every title is an organ of the government and the news is whatever the ministry has decided the news should be. Reading between the lines becomes a national accomplishment."
 censored_press: "Censored Press"
 censored_press_desc: "Private papers publish, but a censor reads them first. Offending editions are seized and offending editors are fined, jailed or quietly ruined, and the blank columns tell the reader most of what was cut."
 regulated_press: "Regulated Press"
 regulated_press_desc: "The press prints freely and answers for it afterwards, bound by libel, sedition and licensing law. The latitude is broad, and its edges are discovered the usual way, by editors who go too far."
 free_press: "Free Press"
 free_press_desc: "Newspapers publish without licence or prior restraint, and a government that dislikes the coverage has no more recourse than any other libel plaintiff. Serious journalism, cheap scandal and outright scurrility all arrive together."