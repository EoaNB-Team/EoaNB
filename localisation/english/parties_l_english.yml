 TSH_han_domain_choshu_party: "Mōri Clan"
 TSH_han_domain_choshu_party_long: "Mōri Clan of Hagi Chōshū\n§YFounded: 1600§!\n§LThe Mōri family rules the Chōshū domain from Hagi and becomes one of the most important opponents of the Tokugawa shogunate in the 1860s. Chōshū leaders promote military modernization, ally with Satsuma, and supply many of the political and military leaders of the Meiji Restoration.§!\n"
 TSH_han_domain_date_party: "Sendai Clan"
 TSH_han_domain_date_party_long: "Sendai Clan of Mutsu Sendai\n§YFounded: 1600§!\n§LThe Date family rules Sendai domain in northeastern Japan throughout the Tokugawa period. The domain is a major northern power and, during the Boshin War, become a leader of the Northern Alliance opposing the new imperial government's military advance.§!\n"
 TSH_han_domain_mito_party: "Mito Branch Clan"
 TSH_han_domain_mito_party_long: "Mito Branch Clan of the Tokugawa\n§YFounded: 1609§!\n§LThe Mito Tokugawa are one of the three great cadet houses eligible to provide a shogun. Mito becomes an important center of loyalist and nationalist thought through the Mito school, and its internal factional struggles help radicalize late-Tokugawa politics.§!\n"
 TSH_han_domain_saga_party: "Nabeshima Clan"
 TSH_han_domain_saga_party_long: "Nabeshima Clan of Hizen Shōni\n§YFounded: 1607§!\n§LThe Nabeshima family rules Saga domain in Hizen during the Tokugawa era. Saga becomes noted in the late shogunate for technical and military modernization, including Western-style artillery, and later contributes officials and soldiers to the Meiji state.§!\n"
 TSH_han_domain_satsuma_party: "Shimazu Clan"
 TSH_han_domain_satsuma_party_long: "Shimazu Clan of Kagoshima Minamoto\n§YFounded: 1602§!\n§LThe Shimazu family rules Satsuma domain in southern Kyushu. Satsuma combines unusual autonomy and economic resources with rapid military modernization and, after first clashing with foreign powers, join Chōshū in the alliance that overthrew the Tokugawa shogunate.§!\n"
 TSH_han_domain_shonai_party: "Sakai Clan"
 TSH_han_domain_shonai_party_long: "Sakai Clan of Tsuruoka Minamoto\n§YFounded: 1622§!\n§LThe Sakai family rules Shōnai domain from Tsuruoka. The domain remains strongly loyal to the Tokugawa shogunate and fights with the Northern Alliance during the Boshin War before submitting to the imperial government.§!\n"
 TSH_han_domain_tosa_party: "Yamauchi Clan"
 TSH_han_domain_tosa_party_long: "Yamauchi Clan of Tosa Hokke\n§YFounded: 1600§!\n§LThe Yamauchi family rules Tosa domain on Shikoku throughout the Tokugawa period. Tosa produces influential late-shogunate reformers and activists, including Sakamoto Ryōma, and domain leaders help broker the shogun's resignation in 1867.§!\n"
 TSH_han_domain_tsu_party: "Tōdō Clan"
 TSH_han_domain_tsu_party_long: "Tōdō Clan of Tsu\n§YFounded: 1608§!\n§LThe Tōdō family rules Tsu domain in Ise and Iga. Like many domains it navigates between Tokugawa obligations and the rising imperial coalition during the final crisis of the shogunate, eventually supporting the new Meiji government.§!\n"

 COL_centrism_party: "Partido Liberal"
 COL_centrism_party_long: "Partido Liberal\n§YFounded: 1848§!\n§LThe Colombian Liberal Party is organized in 1848 around a program published by Ezequiel Rojas. It becomes, alongside the Conservative Party founded the following year, one of Colombia's two enduring political traditions and advocates reforms including freer trade, federalism, civil liberties, and reductions in inherited corporate privilege.§!\n"
 COL_chauvinist_populism_party: "Military Junta"
 COL_chauvinist_populism_party_long: "Military Junta\n§YFounded: c. 1848§!\n§LThe political weight of Military Junta rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise. Its political weight rests on command of the armed forces and the loyalty of the officer corps, allowing military authority to become decisive whenever civilian institutions fail to contain a national crisis.§!\n"
 COL_anarchism_party: "Anarquistas Colombianos"
 COL_anarchism_party_long: "Anarquistas Colombianos\n§YFounded: c. 1910§!\n§LAt the heart of Anarquistas Colombianos is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 COL_fundamentalism_party: "Iglesia Episcopal en Colombia"
 COL_fundamentalism_party_long: "Iglesia Episcopal en Colombia\n§YFounded: 1963§!\n§LThe Catholic hierarchy in Colombia exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

 MEX_centrism_party: "Partido Liberal"
 MEX_centrism_party_long: "Partido Liberal\n§YFounded: c. 1854§!\n§LMexico's Liberal movement becomes one of the two great political camps of the mid-nineteenth century. Liberals such as Benito Juárez, Miguel Lerdo de Tejada, and Melchor Ocampo seek federalism, civil equality, reduction of corporate church and military privileges, and the Reform laws that produce the War of the Reform against the Conservatives.§!\n"
 MEX_traditional_conservatism_party: "Partido Conservador"
 MEX_traditional_conservatism_party_long: "Partido Conservador\n§YFounded: 1849§!\n§LMexico's Conservatives defend a stronger central state, the social and institutional position of the Catholic Church, and traditional corporate privileges against the Liberal Reform. Conservative leaders fight the Liberals in the War of the Reform and later support the French-back monarchy of Emperor Maximilian.§!\n"
 MEX_radical_democracy_party: "Military Junta"
 MEX_radical_democracy_party_long: "Military Junta\n§YFounded: c. 1854§!\n§LThe political weight of Military Junta rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise. Its political weight rests on command of the armed forces and the loyalty of the officer corps, allowing military authority to become decisive whenever civilian institutions fail to contain a national crisis.§!\n"
 MEX_autocracy_party: "House of Habsburg"
 MEX_autocracy_party_long: "House of Habsburg\n§YFounded: 1864§!\n§LThe House of Habsburg-Lorraine is the ruling dynasty of the Austrian Empire and, after 1867, Austria-Hungary. The dynasty stands above party politics and governs through the imperial court, ministers, bureaucracy, army, and negotiates constitutional arrangements with the monarchy's many lands and nationalities.§!\n"
 MEX_anarchism_party: "Anarquistas Mexicanos"
 MEX_anarchism_party_long: "Anarquistas Mexicanos\n§YFounded: 1861§!\n§LAt the heart of Anarquistas Mexicanos is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 MEX_fundamentalism_party: "Conferencia del Episcopado Mexicano"
 MEX_fundamentalism_party_long: "Conferencia del Episcopado Mexicano\n§YFounded: 1955§!\n§LThe Catholic hierarchy in Mexico exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

 MEC_fundamentalism_party: "Conferencia del Episcopado Mexicano"
 MEC_fundamentalism_party_long: "Conferencia del Episcopado Mexicano\n§YFounded: 1955§!\n§LThe Conferencia del Episcopado Mexicano draws political weight from the country's Catholic bishops and the wider institutions of the Church, giving the episcopate a collective voice in national religious and social affairs. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 MEC_autocracy_party: "House of Habsburg"
 MEC_autocracy_party_long: "House of Habsburg\n§YFounded: 1864§!\n§LThe House of Habsburg-Lorraine is the ruling dynasty of the Austrian Empire and, after 1867, Austria-Hungary. The dynasty stands above party politics and governs through the imperial court, ministers, bureaucracy, army, and negotiates constitutional arrangements with the monarchy's many lands and nationalities.§!\n"
 MEC_traditional_conservatism_party: "Partido Conservador"
 MEC_traditional_conservatism_party_long: "Partido Conservador\n§YFounded: 1849§!\n§LThe name Partido Conservador is used by distinct nineteenth-century Latin American conservative parties and factions. These movements generally defend social order, property, the influence of the Catholic Church, and cautious constitutionalism, but their organization and programs vary greatly from country to country.§!\n"
 MEC_radical_democracy_party: "Military Government"
 MEC_radical_democracy_party_long: "Military Government\n§YFounded: c. 1854§!\n§LThe political weight of Military Government rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise. Its political weight rests on command of the armed forces and the loyalty of the officer corps, allowing military authority to become decisive whenever civilian institutions fail to contain a national crisis.§!\n"

 CHL_centrism_party: "Partido Liberal"
 CHL_centrism_party_long: "Partido Liberal\n§YFounded: 1849§!\n§LChile's Liberal Party is founded in 1849 from the older pipiolo liberal tradition and opposition to the authoritarian features of the conservative republic. It defends civil and political liberties and becomes a major parliamentary force, later participating in the liberal-conservative alliance that brings José Joaquín Pérez to the presidency in 1861.§!\n"
 CHL_radical_democracy_party: "Military Junta"
 CHL_radical_democracy_party_long: "Military Junta\n§YFounded: c. 1849§!\n§LThe political weight of Military Junta rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise. Its political weight rests on command of the armed forces and the loyalty of the officer corps, allowing military authority to become decisive whenever civilian institutions fail to contain a national crisis.§!\n"
