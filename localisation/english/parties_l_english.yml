 COS_anarchism_party: "Anarquistas Centro Americanos"
 COS_anarchism_party_long: "Anarquistas Centro Americanos\n§YFounded: c. 1890§!\n§LAt the heart of Anarquistas Centro Americanos is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 COS_fundamentalism_party: "Conferencia Episcopal de Costa Rica"
 COS_fundamentalism_party_long: "Conferencia Episcopal de Costa Rica\n§YFounded: 22 June 1964§!\n§LThe Catholic hierarchy in Costa Rica exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

 AUS_autocracy_party: "Klerikalabsolutisten"
 AUS_autocracy_party_long: "Klerikalabsolutisten\n§YFounded: 1860§!\n§LKlerikalabsolutisten rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 AUS_autocracy_party_1: "Haus von Habsburg"
 AUS_autocracy_party_1_long: "Haus von Habsburg\n§YFounded: c. 1020§!\n§LThe House of Habsburg-Lorraine is the ruling dynasty of the Austrian Empire and, after 1867, Austria-Hungary. The dynasty stands above party politics and governs through the imperial court, ministers, bureaucracy, army, and negotiates constitutional arrangements with the monarchy's many lands and nationalities.§!\n"
 AUS_centrism_party: "Deutschliberale Partei"
 AUS_centrism_party_long: "Deutschliberale Partei\n§YFounded: 1861§!\n§LGerman Liberal politics in the Habsburg monarchy becomes a major parliamentary force after the constitutional reforms of the 1860s. Deutschliberale Partei brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 AUS_ideology_social_liberalism_party: "Verfassungspartei"
 AUS_ideology_social_liberalism_party_long: "Verfassungspartei\n§YFounded: 1861§!\n§LThe Austrian Constitutional Party is the principal German-liberal parliamentary force of the late 1860s and 1870s. It defends the December Constitution, parliamentary government, a relatively centralized Cisleithanian state, and liberal civil institutions, while opposing federalist and clerical rivals.§!\n"
 AUS_radical_democracy_party: "Reichsrat"
 AUS_radical_democracy_party_long: "Reichsrat\n§YFounded: 1861§!\n§LThe Austrian Reichsrat is the imperial legislature creates in the constitutional transformations of the 1860s, with a House of Deputies and House of Lords.§!\n"
 AUS_traditional_conservatism_party: "Föderalistische Partei"
 AUS_traditional_conservatism_party_long: "Föderalistische Partei\n§YFounded: 1860§!\n§LFederalist politics in the Habsburg monarchy unites various conservative, clerical, aristocratic, and non-German national interests that want greater autonomy for the crown lands. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 AUS_social_egalitarianism_party: "Gemäßigte Arbeiterbewegung"
 AUS_social_egalitarianism_party_long: "Gemäßigte Arbeiterbewegung\n§YFounded: 1867§!\n§LGemäßigte Arbeiterbewegung brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 AUS_ideology_radical_socialism_party: "Radikale Arbeiterbewegung"
 AUS_ideology_radical_socialism_party_long: "Radikale Arbeiterbewegung\n§YFounded: 1867§!\n§LRadikale Arbeiterbewegung brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 AUS_anarchism_party: "Anarchisten"
 AUS_anarchism_party_long: "Anarchisten\n§YFounded: c. 1882§!\n§LAt the heart of Anarchisten is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 AUS_chauvinist_populism_party: "Kirchenzeitungspartei"
 AUS_chauvinist_populism_party_long: "Kirchenzeitungspartei\n§YFounded: 1860§!\n§LKirchenzeitungspartei gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 AUS_fundamentalism_party: "Kathol. Gesellenverein"
 AUS_fundamentalism_party_long: "Kathol. Gesellenverein\n§YFounded: 1855§!\n§LThe Catholic journeymen's associations associated with Adolph Kolping grow from the late 1840s as religious and mutual-aid organizations for craftsmen. Gesellenverein draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 HAI_autocracy_party: "House of Haiti"
 HAI_autocracy_party_long: "House of Haiti\n§YFounded: 1849§!\n§LSupporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power. House of Haiti bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites.§!\n"
 HAI_social_egalitarianism_party: "Parti Libéral"
 HAI_social_egalitarianism_party_long: "Parti Libéral\n§YFounded: 19 February 1870§!\n§LParti Libéral brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 HAI_centrism_party: "Parti National"
 HAI_centrism_party_long: "Parti National\n§YFounded: c. 1870§!\n§LHaiti's National Party becomes a major political organization in the 1870s and draws much of its strength from rural and military networks, presenting itself as the rival of the urban-oriented Liberal Party. It is therefore a later nineteenth-century organization.§!\n"
 HAI_anarchism_party: "Anarchistes haitiens"
 HAI_anarchism_party_long: "Anarchistes haitiens\n§YFounded: c. 1870§!\n§LAt the heart of Anarchistes haitiens is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 HAI_fundamentalism_party: "Eglise épiscopale d'Haiti"
 HAI_fundamentalism_party_long: "Eglise épiscopale d'Haiti\n§YFounded: 1861§!\n§LThe Episcopal Church in Haiti grows from the mission of James Theodore Holly, an African-American Episcopal priest who arrives with Black emigrants in 1861. Holly establishes a permanent Haitian Episcopal community in Port-au-Prince, and the church develops as a Haitian-led Anglican institution.§!\n"

 VEN_autocracy_party: "La Corona Venezolana"
 VEN_autocracy_party_long: "La Corona Venezolana\n§YFounded: c. 1840§!\n§LLa Corona Venezolana rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 VEN_traditional_conservatism_party: "Partido Conservador"
 VEN_traditional_conservatism_party_long: "Partido Conservador\n§YFounded: 1840§!\n§LVenezuelan Conservatives represent the political establishment that dominates the early republic after independence, associated particularly with José Antonio Páez, central government, property-owning elites, and cautious constitutional rule. They face the organized Liberal opposition that emerges around Antonio Leocadio Guzmán in the 1840s.§!\n"
 VEN_social_egalitarianism_party: "Partido Igualitario"
 VEN_social_egalitarianism_party_long: "Partido Igualitario\n§YFounded: c. 1840§!\n§LPartido Igualitario brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 VEN_centrism_party: "Partido Liberal"
 VEN_centrism_party_long: "Partido Liberal\n§YFounded: 20 August 1840§!\n§LVenezuela's Liberal Party emerges in 1840 around Antonio Leocadio Guzmán and opposition to the conservative political establishment associated with José Antonio Páez. It advocates political and economic reforms and later feeds into the Federalist cause that fights the Federal War of 1859-1863.§!\n"
 VEN_chauvinist_populism_party: "Unidad Nacional Venezolana"
 VEN_chauvinist_populism_party_long: "Unidad Nacional Venezolana\n§YFounded: c. 1840§!\n§LUnidad Nacional Venezolana gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 VEN_anarchism_party: "Asociación Venezolana Anarquista"
 VEN_anarchism_party_long: "Asociación Venezolana Anarquista\n§YFounded: 1919§!\n§LAsociación Venezolana Anarquista draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 VEN_fundamentalism_party: "Iglesia Episcopal de Venezuela"
 VEN_fundamentalism_party_long: "Iglesia Episcopal de Venezuela\n§YFounded: 14 July 1973§!\n§LThe Catholic hierarchy in Venezuela exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"
 VEN_ideology_radical_socialism_party: "Liga Constitucional de la Clase Obrera"
 VEN_ideology_radical_socialism_party_long: "Liga Constitucional de la Clase Obrera\n§YFounded: c. 1840§!\n§LLiga Constitucional de la Clase Obrera brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 VEN_ideology_social_liberalism_party: "Partido Revolucionario Comunista"
 VEN_ideology_social_liberalism_party_long: "Partido Revolucionario Comunista\n§YFounded: 5 March 1931§!\n§LPartido Revolucionario Comunista occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 VEN_radical_democracy_party: "Partido Democrático Unido"
 VEN_radical_democracy_party_long: "Partido Democrático Unido\n§YFounded: c. 1840§!\n§LPartido Democrático Unido gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"

 ECU_social_egalitarianism_party: "Republican Union Party"
 ECU_social_egalitarianism_party_long: "Republican Union Party\n§YFounded: 1883§!\n§LThe Republican Union Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 ECU_centrism_party: "Partido Liberal"
 ECU_centrism_party_long: "Partido Liberal\n§YFounded: 1890§!\n§LLiberalism is an important nineteenth-century Ecuadorian political current, but the organized Radical Liberal movement associated with Eloy Alfaro becomes decisive only later in the century and triumphs in the Liberal Revolution of 1895.\n\nPartido Liberal brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 ECU_chauvinist_populism_party: "Provissional Government"
 ECU_chauvinist_populism_party_long: "Provissional Government\n§YFounded: c. 1890§!\n§LProvisional governments arise during coups, revolutions, and constitutional crises, gathering officials, military leaders, and political notables around the immediate task of preserving authority and establishing a new constitutional settlement.\n\nProvissional Government gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 ECU_anarchism_party: "Anarquistas Ecuatorianos"
 ECU_anarchism_party_long: "Anarquistas Ecuatorianos\n§YFounded: 1899§!\n§LAt the heart of Anarquistas Ecuatorianos is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 ECU_fundamentalism_party: "Iglesia Episcopal de Equador"
 ECU_fundamentalism_party_long: "Iglesia Episcopal de Equador\n§YFounded: c. 1960§!\n§LThe Catholic hierarchy in Ecuador exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

 HON_social_egalitarianism_party: "Partido Liberal"
 HON_social_egalitarianism_party_long: "Partido Liberal\n§YFounded: 5 February 1891§!\n§LLiberal movements generally promotes constitutional government, limits on inherited corporate privilege, freer commerce, and varying degrees of secular reform. Partido Liberal brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 HON_centrism_party: "La Democracia"
 HON_centrism_party_long: "La Democracia\n§YFounded: c. 1891§!\n§LLa Democracia brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 HON_chauvinist_populism_party: "Miltary Junta"
 HON_chauvinist_populism_party_long: "Miltary Junta\n§YFounded: c. 1890§!\n§LThe political weight of Miltary Junta rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise. Its political weight rests on command of the armed forces and the loyalty of the officer corps, allowing military authority to become decisive whenever civilian institutions fail to contain a national crisis.§!\n"
 HON_anarchism_party: "Anarquistas Centro Americanos"
 HON_anarchism_party_long: "Anarquistas Centro Americanos\n§YFounded: c. 1900§!\n§LAt the heart of Anarquistas Centro Americanos is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 HON_fundamentalism_party: "Iglesia Episcopal Hondureña"
 HON_fundamentalism_party_long: "Iglesia Episcopal Hondureña\n§YFounded: 1967§!\n§LThe Catholic hierarchy in Honduras exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

