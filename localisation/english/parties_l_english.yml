 LIB_chauvinist_populism_party_long: "American Colonization Party\n§YFounded: 1816§!\n§LThe American Colonization Society, founded in 1816, promotes the emigration of free African Americans to West Africa and plays a central role in the establishment of Liberia; it is a private colonization organization.\n\nAmerican Colonization Party gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
