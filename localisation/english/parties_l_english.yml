# USA Generic Parties
 USA_centrism_party: "Liberals"
 USA_centrism_party_long: "Liberals\n§YFounded: c. 1850§!\n§LThe Liberals gathers constitutional liberals, commercial interests, lawyers, journalists, and reform-minded notables who want political change without revolutionary upheaval. The faction favors representative institutions, civil liberties, freer commerce, and gradual administrative reform.\n\nIts strength rests among urban professionals and local elites who see constitutional government as the surest road to a stronger and more modern state. The party balances its appetite for reform against the need to preserve stability, placing it between entrenched reaction and the revolutionary left.§!\n"
 USA_traditional_conservatism_party: "Conservatives"
 USA_traditional_conservatism_party_long: "Conservatives\n§YFounded: c. 1850§!\n§LThe Conservatives represent defenders of established institutions, property, religion, and social order. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 USA_social_egalitarianism_party: "Progressives"
 USA_social_egalitarianism_party_long: "Progressives\n§YFounded: c. 1850§!\n§LOrganized Progressivism becomes a major reform current around the turn of the twentieth century and produces the Progressive Party of 1912; earlier reformers use different party and movement labels. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 USA_ideology_radical_socialism_party: "Socialists"
 USA_ideology_radical_socialism_party_long: "Socialists\n§YFounded: c. 1848§!\n§LOrganized socialist politics develops later through immigrant and labor organizations, the Socialist Labor Party, and eventually the Socialist Party of America. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 USA_ideology_social_liberalism_party: "Liberals"
 USA_ideology_social_liberalism_party_long: "Liberals\n§YFounded: c. 1850§!\n§LThe Liberals occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 USA_chauvinist_populism_party: "Chauvinists"
 USA_chauvinist_populism_party_long: "Chauvinists\n§YFounded: c. 1850§!\n§LSupporters of Chauvinists channel regional interests and public loyalties into a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 USA_autocracy_party: "Monarchists"
 USA_autocracy_party_long: "Monarchists\n§YFounded: c. 1850§!\n§LThe Monarchists gathers court loyalists, landed elites, officers, officials, and other defenders of hereditary sovereignty around the authority of the ruler. Its political outlook stresses continuity, hierarchy, dynastic legitimacy, and the ability of a strong crown to stand above competing factions.\n\nSupporters regard the sovereign as the natural center of the state and the chief safeguard against disorder. Reform is acceptable when it strengthens the monarchy, but representative institutions remain subordinate to the ruler, the court, and the traditional pillars of government.§!\n"
 USA_fundamentalism_party: "Fundamentalists"
 USA_fundamentalism_party_long: "Fundamentalists\n§YFounded: c. 1850§!\n§LThe Fundamentalists draws political authority from clergy, religious scholars, devotional networks, and communities that look to faith as a foundation of public order. Its influence extends beyond worship into education, charity, family life, customary law, and the moral expectations placed upon government.\n\nSupporters seek to preserve the place of religion at the center of society and resist reforms they regard as hostile to established belief. Political action is therefore understood not simply as a contest for office, but as a defense of the spiritual and social order on which the community rests.§!\n"
 USA_radical_democracy_party: "Reactionaries"
 USA_radical_democracy_party_long: "Reactionaries\n§YFounded: c. 1815§!\n§LThe Reactionaries gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 USA_anarchism_party: "Anarchists"
 USA_anarchism_party_long: "Anarchists\n§YFounded: c. 1840§!\n§LAmerican anarchism develops as a recognizable movement later in the nineteenth century among individualist, immigrant, labor, and revolutionary circles. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
# USA Parties 1857 - 1865
 USA_republican_party: "Republicans (Moderates)"
 USA_republican_party_long: "The Republican Party\n§YFounded: 1854§!\n§LThe Republican Party draws together opponents of the Kansas-Nebraska Act and the expansion of slavery. Its moderate wing opposes slavery's extension but often favors constitutional and gradual means, seeks to hold together a broad northern coalition, and becomes the party of Abraham Lincoln in 1860.§!\n"
 USA_radical_republican_party: "Republicans (Radical)"
 USA_radical_republican_party_long: "The Republican Party\n§YFounded: 1854§!\n§LThe Radical Republicans are the most uncompromising anti-slavery and Reconstruction wing of the Republican Party. During and after the Civil War they press for immediate emancipation, stronger federal protection of freedpeople, civil and political rights for Black Americans, and harsher terms for former Confederate leaders.§!\n"
 USA_democrat_party: "Democrats"
 USA_democrat_party_long: "Democratic Party\n§YFounded: 1828§!\n§LThe Democratic Party is one of the two great national parties of the nineteenth-century United States. Rooted in the Jacksonian coalition, it emphasizes popular politics, states' rights, and limited federal government, but sectional conflict over slavery splits northern and southern Democrats in 1860 and reshapes the party during and after the Civil War.§!\n"
 USA_northern_democrat_party: "Democrats"
 USA_northern_democrat_party_long: "The Democratic Party\n§YFounded: 1828§!\n§LNorthern Democrats remain part of the Democratic Party but divide sharply during the Civil War between War Democrats who support preservation of the Union and Peace Democrats who demand a negotiated settlement. Their prewar base combines urban machines, immigrant voters, and Jacksonian traditions of limited federal government.§!\n"
 USA_southern_democrat_party: "Democrats (Southern)"
 USA_southern_democrat_party_long: "The Democratic Party\n§YFounded: 1828§!\n§LSouthern Democrats are the dominant party current across much of the slaveholding South before 1860. Their leaders increasingly defend slavery and states' rights against perceived northern threats, and the sectional wing that nominates John C. Breckinridge in 1860 helps demonstrate the final collapse of the old national Democratic coalition.§!\n"
 USA_know_nothing_party: "Know Nothings"
 USA_know_nothing_party_long: "The American Party\n§YFounded: 1854§!\n§LThe American Party, commonly called the Know Nothing movement, grows rapidly in the 1850s from secretive nativist organizations. It opposes mass immigration and Catholic political influence, briefly becomes a major national force after the collapse of the Whigs, and then fragments as the slavery crisis displaces nativism as the central political issue.§!\n"
 USA_constitutional_union_party: "Constitutional Unionists"
 USA_constitutional_union_party_long: "Constitutional Union Party\n§YFounded: 1860§!\n§LThe Constitutional Union Party is organized in 1860 by former Whigs, Know Nothings, and other conservatives who hope to avert sectional rupture. Its platform deliberately centers on the Constitution, the Union, and enforcement of the laws rather than taking a clear sectional position on slavery; John Bell is its presidential candidate.§!\n"
 USA_national_union_party: "National Unionists"
 USA_national_union_party_long: "National Union Party\n§YFounded: 1864§!\n§LThe National Union Party is the electoral coalition used by Abraham Lincoln in 1864 to unite Republicans with War Democrats and other Unionists. It is a wartime expedient. National Union Party gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 # USA Parties 1865 - 1880
 USA_stalwart_republican_party: "Stalwart Republicans"
 USA_stalwart_republican_party_long: "Republican Party\n§YFounded: c. 1872§!\n§LThe Stalwarts are a Republican faction of the 1870s and early 1880s associated with Roscoe Conkling and loyalty to Ulysses S. They defend party patronage and the spoils system against civil-service reformers while also retaining a strong identification with the Republican Reconstruction legacy.§!\n"
 USA_half_breed_party: "Half-Breed Republicans"
 USA_half_breed_party_long: "Republican Party\n§YFounded: 1877§!\n§LThe Half-Breeds are the reform-oriented Republican faction opposed to the Stalwarts in the 1870s and early 1880s. Blaine and supporters of President James Garfield favor civil-service reform and resist the patronage power of Senator Roscoe Conkling's machine.§!\n"
 USA_dixiecrat_party: "Dixiecrats"
 USA_dixiecrat_party_long: "Dixiecrat Party\n§YFounded: 1948§!\n§LThe Dixiecrats are the States' Rights Democratic Party of 1948, which forms when southern Democrats break with the national party over civil-rights policy and nominate Strom Thurmond for president.§!\n"
 USA_war_democrats: "War Democrats"
 USA_war_democrats_long: "Democratic Party\n§YFounded: 1861§!\n§LWar Democrats are Democrats who support the Union war effort after secession while remaining outside the Republican Party. Abraham Lincoln deliberately courts them, and the 1864 National Union ticket places War Democrat Andrew Johnson on the vice-presidential ticket to symbolize a broader pro-Union coalition.§!\n"
 USA_prohibitionist_party: "Prohibitionists"
 USA_prohibitionist_party_long: "National Prohibition Party\n§YFounded: 1869§!\n§LThe Prohibition Party is founded in 1869 to make legal prohibition of alcoholic beverages a national political issue. It draws support from temperance activists and evangelical reformers and remains a persistent minor party into the twentieth century, also adopting positions on social and political reforms beyond temperance.§!\n"
 USA_greenback_party_long: "Greenback Party\n§YFounded: 1874§!\n§LThe Greenback movement arises after the Civil War in opposition to contraction of the paper money issued during the conflict. As national organization develops in the 1870s, it demands an expanded currency not rigidly tied to gold, attracts farmers and workers hurt by debt and deflation, and later overlaps with labor and agrarian reform movements.§!\n"
 USA_greenback_party: "Greenbacks"
 # USA Parties 1880 -2050
 USA_bull_moose_party: "Progressives"
 USA_bull_moose_party_long: "Progressive 'Bull Moose' Party\n§YFounded: 1912§!\n§LThe Progressive Party of 1912, popularly called the Bull Moose Party, is created after Theodore Roosevelt breaks with President William Howard Taft and the Republican organization. Its platform advocates stronger regulation of corporations, direct-democracy reforms, social insurance, and other Progressive measures; after Roosevelt's defeat the party quickly declines as a national force.§!\n"
 USA_progressive_democrat_long: "Democratic Party (Progressives)\n§YFounded: c. 1896§!\n§L'Progressive Democrats' describes a reform current within the Democratic Party. In the late nineteenth and early twentieth centuries Democratic reformers such as William Jennings Bryan and, later, Woodrow Wilson combine different mixtures of anti-monopoly, electoral, monetary, and administrative reform; the label is an umbrella factional term.§!\n"
 USA_progressive_democrat: "Progressive Democrats"
 USA_radical_socialist_party_long: "Socialist Labor Party of America\n§YFounded: 1876§!\n§LThe Socialist Labor Party traces its origin to the Workingmen's Party of the United States, which is founded in 1876 and takes its new name in 1877. It becomes an early Marxist party in the United States, later strongly associated with Daniel De Leon and a program combining political action with revolutionary industrial unionism.§!\n"
 USA_radical_socialist_party: "Radical Socialists"
 USA_liberal_republican_party_long: "Liberal Republican Party\n§YFounded: 1872§!\n§LThe Liberal Republican movement breaks from the Republican Party in 1872. Its leaders oppose the Grant administration, criticize corruption and continue federal intervention in the South, advocate civil-service reform and reconciliation, and nominate Horace Greeley for president before rapidly dissolving after the election.§!\n"
 USA_liberal_republican_party: "Liberal Republicans"
 USA_mugwumps_long: "Republican Party\n§YFounded: 1884§!\n§LThe Mugwumps are reform-minded Republicans who break with their party in the 1884 presidential election and support Democrat Grover Cleveland. They emphasize civil-service reform, personal integrity, and opposition to machine politics.§!\n"
 USA_mugwumps: "Mugwump Republicans"
 USA_farmer_labor_long: "Farmer-Labor Party\n§YFounded: 1920§!\n§LFarmer-Labor politics becomes an organized American movement after the First World War, seeking to unite farmers and organized labor against corporate and financial power.\n\nA national Farmer-Labor Party nominates Parley P. Farmer-Labor Party brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 USA_farmer_labor: "Farmer-Labors"
 USA_communist_party_long: "Communist Party of America\n§YFounded: 1919§!\n§LThe name Communist Party of America belongs to organizations created after the 1919 split in the American socialist movement following the Bolshevik Revolution.\n\nCommunist Party of America brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 USA_communist_party: "Communists"
 USA_america_first_party_long: "America First Party\n§YFounded: 1940§!\n§LSeveral twentieth-century American organizations use the 'America First' label. The best-known prewar America First Committee is founded in 1940 as an isolationist pressure group, while an America First Party is organized later in the 1940s.§!\n"
 USA_america_first_party: "AFP Supporters"
 USA_populist_party_long: "Populist 'People's' Party\n§YFounded: 1891§!\n§LThe People's Party, usually called the Populist Party, is formed in 1891-1892 from agrarian reform alliances and labor-oriented movements. It calls for monetary expansion, regulation or public control of railroads and other infrastructure, political reforms, and measures intended to curb concentrated corporate and financial power.§!\n"
 USA_populist_party: "Populists"
 USA_bourbon_democrats_party_long: "Democratic Party (Bourbons)\n§YFounded: c. 1870§!\n§LThe Bourbon Democrats are a late-nineteenth-century conservative, pro-business current within the Democratic Party. Associated with leaders such as Grover Cleveland, they favor fiscal restraint, the gold standard, limited government, and resistance to agrarian and inflationary reform movements.§!\n"
 USA_bourbon_democrats_party: "Bourbon Democrats"

 NEG_social_egalitarianism_party_long: "Radical Republican Party\n§YFounded: c. 1857§!\n§LLeaders such as Thaddeus Stevens and Charles Sumner press for the destruction of slavery, strong federal Reconstruction, and civil and political rights for freedpeople.\n\nRadical Republican Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 NEG_social_egalitarianism_party: "Radical Republicans"
 NEG_centrism_party_long: "Republican Party\n§YFounded: 1854§!\n§LThe Republican Party emerges in the mid-1850s from anti-slavery Whigs, Free Soilers, and other opponents of the extension of slavery into the western territories. It rapidly becomes the principal political organization of the North, elects Abraham Lincoln in 1860, leads the Union during the Civil War, and then dominates much of Reconstruction politics.§!\n"
 NEG_centrism_party: "Republicans"
 NEG_stalwarts_party_long: "Stalwart Republican Party\n§YFounded: 1870§!\n§LThe Stalwarts are a Republican faction of the 1870s and 1880s associated above all with Senator Roscoe Conkling. They defend the party patronage system, generally support Ulysses S. Grant, and resist the civil-service reforms promoted by their Half-Breed rivals.§!\n"
 NEG_stalwarts_party: "Stalwarts"
 NEG_traditional_conservatism_party_long: "Democrat Party\n§YFounded: 1828§!\n§LThe Democratic Party is one of the two dominant political parties of the nineteenth-century United States. Its coalition changes greatly over time, but before the Civil War it draws substantial strength from the South and from urban immigrant voters and generally emphasizes states' rights and limited federal government.§!\n"
 NEG_traditional_conservatism_party: "Democrats"
 NEG_chauvinist_populism_party_long: "Democratic National Party\n§YFounded: c. 1857§!\n§LThe Democratic National Party gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 NEG_chauvinist_populism_party: "Democratic Nationals"
 NEG_whig_party_long: "Reformed Whig Party\n§YFounded: c. 1857§!\n§LThe Reformed Whig Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 NEG_whig_party: "Free Whigs"
 NEG_radical_democracy_party_long: "Free America Front\n§YFounded: c. 1857§!\n§LThe Free America Front gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 NEG_radical_democracy_party: "FAFs"
 NEG_populist_party_long: "New Englander Populist Party\n§YFounded: c. 1857§!\n§LThe New Englander Populist Party gathers the local notables, activists, institutional interests, and personal networks that sustain its political influence. Its leaders seek to turn these connections into a coherent voice capable of shaping appointments, legislation, and the wider direction of government.\n\nThe movement draws strength from the loyalties of its supporters rather than from a rigid national machine. Its future depends on whether those scattered interests can be held together as political competition becomes more organized and the demands placed upon the state continue to grow.§!\n"
 NEG_populist_party: "Populists"
 NEG_ideology_radical_socialism_party_long: "Bulwark Socialist Party\n§YFounded: c. 1857§!\n§LThe Bulwark Socialist Party brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 NEG_ideology_radical_socialism_party: "Socialist"
 NEG_progressive_party_long: "Progressive Party\n§YFounded: 1913§!\n§LThe Progressive Party of 1912, popularly called the Bull Moose Party, is formed after Theodore Roosevelt breaks with the Republican Party. Its platform calls for stronger regulation of corporations, political reforms, social insurance, labor protections, and a more active federal government.§!\n"
 NEG_progressive_party: "Progressivists"

 ASA_centrism_party_long: "Stalwart Republican Caucus\n§YFounded: c. 1857§!\n§LThe Stalwarts are a Republican faction of the 1870s and 1880s associated above all with Senator Roscoe Conkling. They defend the party patronage system, generally support Ulysses S. Grant, and resist the civil-service reforms promoted by their Half-Breed rivals. The word 'Caucus' here represents that historical faction.§!\n"
 ASA_centrism_party: "Stalwart Republicans"
 ASA_traditional_conservatism_party_long: "Democratic Party\n§YFounded: 1828§!\n§LThe Democratic Party is one of the two great national parties of the nineteenth-century United States. Rooted in the Jacksonian coalition, it emphasizes popular politics, states' rights, and limited federal government, but sectional conflict over slavery splits northern and southern Democrats in 1860 and reshapes the party during and after the Civil War.§!\n"
 ASA_traditional_conservatism_party: "Democrats"
