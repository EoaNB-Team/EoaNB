 HES_autocracy_party: "Haus von Hessen-Kassel"
 HES_autocracy_party_long: "Haus von Hessen-Kassel\n§YFounded: 1567§!\n§LThe House of Hesse-Kassel rules the Electorate of Hesse. Elector Frederick William governs during years of sharp constitutional conflict between the crown and the representative assembly, until Prussia annexes the electorate in 1866 after the Austro-Prussian War.§!\n"
 HES_centrism_party: "Nationalliberale Bewegung"
 HES_centrism_party_long: "Nationalliberale Bewegung\n§YFounded: c. 1848§!\n§LNationalliberale Bewegung brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 HES_traditional_conservatism_party: "Konservative Bewegung"
 HES_traditional_conservatism_party_long: "Konservative Bewegung\n§YFounded: c. 1848§!\n§LKonservative Bewegung rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"
 HES_radical_democracy_party: "Fraktion der Grundbesitzer"
 HES_radical_democracy_party_long: "Fraktion der Grundbesitzer\n§YFounded: c. 1848§!\n§LFraktion der Grundbesitzer gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"

 HSD_autocracy_party: "Haus von Hessen-Darmstadt"
 HSD_autocracy_party_long: "Haus von Hessen-Darmstadt\n§YFounded: 1567§!\n§LThe House of Hesse-Darmstadt rules the Grand Duchy of Hesse. Its grand dukes presides over a constitutional monarchy whose politics includes liberal, conservative, and democratic currents, and the state survives German unification as a constituent monarchy of the German Empire.§!\n"
