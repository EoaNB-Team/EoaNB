 BUE_traditional_conservatism_party_long: "Partido Federal\n§YFounded: c. 1824§!\n§LArgentina's Federalists are the broad nineteenth-century current that defends provincial autonomy against Unitarian centralization. Federal politics are organized through provincial caudillos and personal alliances. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 BUE_centrism_party: "Partido Unitario"
 BUE_centrism_party_long: "Partido Unitario\n§YFounded: c. 1824§!\n§LArgentina's Unitarians are a nineteenth-century political current that favors a strong centralized national government based in Buenos Aires. They fight prolonged political and military struggles against the Federalists during the decades after independence; their strength rests on provincial leaders, military allies, and networks of political supporters.§!\n"
 BUE_chauvinist_populism_party: "Junta Militar"
 BUE_chauvinist_populism_party_long: "Junta Militar\n§YFounded: c. 1824§!\n§LMilitary interventions are common in nineteenth-century Latin American politics, but each actual junta has its own leaders and circumstances. Its strength rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise.§!\n"
 BUE_anarchism_party: "Anarquista Platense"
 BUE_anarchism_party_long: "Anarquista Platense\n§YFounded: 1872§!\n§LAnarquista Platense draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 BUE_fundamentalism_party: "Conferencia Episcopal Argentina"
 BUE_fundamentalism_party_long: "Conferencia Episcopal Argentina\n§YFounded: c. 1955§!\n§LThe Catholic hierarchy in Buenos Aires exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

 BOV_social_egalitarianism_party: "Partido Democratico"
 BOV_social_egalitarianism_party_long: "Partido Democratico\n§YFounded: 1849§!\n§LSpain's Democratic Party emerges in 1849 from the more radical wing of Progressivism. It advocates a much broader democratic program, including universal male suffrage and stronger civil liberties, and contains republican as well as constitutional-democratic tendencies.§!\n"
 BOV_centrism_party: "Partido Liberal"
 BOV_centrism_party_long: "Partido Liberal\n§YFounded: 1883§!\n§LBolivia's Liberal Party becomes a formal national force only in the later nineteenth century, especially from the 1880s, and eventually displaces the Conservatives after the Federal War of 1899.\n\nPartido Liberal brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 BOV_chauvinist_populism_party: "Miltary Junta"
 BOV_chauvinist_populism_party_long: "Miltary Junta\n§YFounded: c. 1880§!\n§LThe political weight of Miltary Junta rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise. Its political weight rests on command of the armed forces and the loyalty of the officer corps, allowing military authority to become decisive whenever civilian institutions fail to contain a national crisis.§!\n"
 BOV_anarchism_party: "Anarquistas Bolivianos"
 BOV_anarchism_party_long: "Anarquistas Bolivianos\n§YFounded: 1906§!\n§LAt the heart of Anarquistas Bolivianos is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
