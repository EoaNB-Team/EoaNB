 WVG_centrism_party_long: "Republican Party\n§YFounded: 1854§!\n§LWest Virginia enters the Union in 1863 under a strongly Unionist political leadership, and Republicans becomes the dominant party of the new state during the Civil War and early Reconstruction. The party supports the Union war effort, emancipation, and the postwar constitutional order, though political restrictions on former Confederates later becomes a major state issue.§!\n"
 WVG_centrism_party: "Republicans"
 WVG_radical_democracy_party_long: "Reformed Virginia Coalition\n§YFounded: c. 1857§!\n§LThe Reformed Virginia Coalition brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 WVG_radical_democracy_party: "Reformed Virginia Coalition"
 WVG_traditional_conservatism_party: "Democrats"
 WVG_traditional_conservatism_party_long: "Democratic Party\n§YFounded: 1828§!\n§LWest Virginia Democrats reorganize after statehood and draw increasing support from former Confederates and voters opposed to Republican wartime and Reconstruction policies. By the early 1870s Democrats recover substantial political power as restrictions on ex-Confederates are relaxed.§!\n"

 USAROD_military_party: "Reconstruction Government"
 USAROD_military_party_long: "Reconstruction Government\n§YFounded: 1867§!\n§LCongressional Reconstruction places the former Confederate states under new political requirements after the Civil War. The Reconstruction Acts of 1867 divide most of the former Confederacy into five military districts where United States Army commanders supervise order, voter registration, and constitutional reconstruction; this is an occupation and administrative system.§!\n"
 USAROD_Military_party_long: "United States Army Occupational Administration\n§YFounded: 1867§!\n§LThe Reconstruction Acts of 1867 place most former Confederate states under five United States military districts. Army commanders supervise civil order, voter registration, constitutional conventions, and the transition to reconstructed state governments; this is a temporary military-administrative regime.§!\n"

 MHC_social_egalitarianism_party_long: "Radical Republican Party\n§YFounded: c. 1857§!\n§LThe Radical Republican Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 MHC_social_egalitarianism_party: "Radical Republicans"
 MHC_anarchism_party_long: "Individualist Sovereign Party\n§YFounded: c. 1857§!\n§LThe Individualist Sovereign Party draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 MHC_anarchism_party: "Mutualists"
 MHC_ideology_radical_socialism_party_long: "Owenist Commune Party\n§YFounded: c. 1857§!\n§LThe Owenist Commune Party brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 MHC_ideology_radical_socialism_party: "Owenists"
 MHC_ideology_social_liberalism_party_long: "Proletariat First Party\n§YFounded: c. 1857§!\n§LThe Proletariat First Party brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 MHC_ideology_social_liberalism_party: "Marxists"
 MHC_centrism_party_long: "Republican Party\n§YFounded: 1854§!\n§LThe Republican Party emerges in the mid-1850s from anti-slavery Whigs, Free Soilers, and other opponents of the extension of slavery into the western territories. It rapidly becomes the principal political organization of the North, elects Abraham Lincoln in 1860, leads the Union during the Civil War, and then dominates much of Reconstruction politics.§!\n"
 MHC_centrism_party: "Republicans"
 MHC_traditional_conservatism_party_long: "Free Market Party\n§YFounded: c. 1857§!\n§LThe Free Market Party rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"
 MHC_traditional_conservatism_party: "Free Marketeers"
 MHC_chauvinist_populism_party_long: "The Gilded League\n§YFounded: c. 1857§!\n§LThe Gilded League gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 MHC_chauvinist_populism_party: "Corporative Lobbyists"
 MHC_autocracy_party_long: "Yorker Empire Party\n§YFounded: c. 1857§!\n§LThe Yorker Empire Party rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 MHC_autocracy_party: "Imperial Yorkers"
 MHC_fundamentalism_party_long: "American Peace Society\n§YFounded: 1828§!\n§LThe American Peace Society is founded in 1828 by the consolidation of several local peace societies, with William Ladd among its central organizers. American Peace Society draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 MHC_fundamentalism_party: "Christian Pacifists"

 UTA_social_egalitarianism_party_long: "Liberal Party of Utah (Radicals)\n§YFounded: 1870§!\n§LUtah's Liberal Party is organized in 1870 by opponents of the political power of the Church of Jesus Christ of Latter-day Saints and of the Mormon-backs People's Party. It draws heavily from non-Mormon residents and campaigns on questions including church influence, plural marriage, and the political integration of Utah with national institutions.§!\n"
 UTA_social_egalitarianism_party: "Radical Liberals"
 UTA_centrism_party_long: "Liberal Party of Utah\n§YFounded: 1870§!\n§LUtah's Liberal Party is organized in 1870 by opponents of the political power of the Church of Jesus Christ of Latter-day Saints and of the Mormon-backs People's Party. It draws heavily from non-Mormon residents and campaigns on questions including church influence, plural marriage, and the political integration of Utah with national institutions.§!\n"
 UTA_centrism_party: "Moderate Liberals"
 UTA_traditional_conservatism_party_long: "People's Party of Utah (Moderates)\n§YFounded: 1870§!\n§LUtah's People's Party is organized in 1870 and represents the political interests of the territory's Mormon majority and the leadership associated with the Church of Jesus Christ of Latter-day Saints. It dominates territorial elections until national pressure and the decline of plural marriage politics leads to its dissolution in 1891.§!\n"
 UTA_traditional_conservatism_party: "Moderate Mormons"
 UTA_fundamentalism_party_long: "People's Party of Utah (Conservatives)\n§YFounded: 1870§!\n§LUtah's People's Party is organized in 1870 and represents the political interests of the territory's Mormon majority and the leadership associated with the Church of Jesus Christ of Latter-day Saints. It dominates territorial elections until national pressure and the decline of plural marriage politics leads to its dissolution in 1891.§!\n"
 UTA_fundamentalism_party: "Conservative Utahns"

 CAL_ideology_social_liberalism_party_long: "Socialist Party of California (Radicals)\n§YFounded: 1 January 1902§!\n§LThe Socialist Party of California (Radicals) brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 CAL_ideology_social_liberalism_party: "Radical Socialists"
 CAL_ideology_radical_socialism_party_long: "Socialist Party of California (Moderates)\n§YFounded: 1 January 1902§!\n§LThe Socialist Party of California (Moderates) brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 CAL_ideology_radical_socialism_party: "Socialists"
 CAL_social_egalitarianism_party_long: "California Progressive Party\n§YFounded: 1912§!\n§LThe California Progressive Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 CAL_social_egalitarianism_party: "Progressives"
 CAL_centrism_party_long: "Republican Party of California\n§YFounded: 1856§!\n§LCalifornia Republicans organize during the national party's rise in the 1850s and win the state for Abraham Lincoln in 1860. The party draws anti-slavery and Unionist voters, becomes dominant during the Civil War, and remains a major force in the state's postwar politics.§!\n"
 CAL_centrism_party: "California Republicans"
 CAL_traditional_conservatism_party_long: "Democratic Party of California\n§YFounded: 1846§!\n§LCalifornia's Democratic Party is a major force from statehood in 1850 and is deeply divided by the national sectional crisis. Pro-Union and pro-southern Democratic factions compete during the Civil War, after which the party remains one of California's two principal political organizations.§!\n"
 CAL_traditional_conservatism_party: "California Democrats"
 CAL_radical_democracy_party_long: "Military Government of California\n§YFounded: 7 July 1846§!\n§LThe political weight of Military Government of California rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise. Its political weight rests on command of the armed forces and the loyalty of the officer corps, allowing military authority to become decisive whenever civilian institutions fail to contain a national crisis.§!\n"
 CAL_radical_democracy_party: "Military Junta"
 CAL_autocracy_party_long: "House of Norton\n§YFounded: 1859§!\n§LThe House of Norton bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 CAL_autocracy_party: "Norton Loyalists"
 CAL_chauvinist_populism_party_long: "Fascist Party of California\n§YFounded: c. 1857§!\n§LThe Fascist Party of California gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 CAL_chauvinist_populism_party: "Fascists"

 ORE_ideology_social_liberalism_party_long: "Socialist Party of Oregon (Radicals)\n§YFounded: 25 September 1901§!\n§LThe Socialist Party of Oregon (Radicals) brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 ORE_ideology_social_liberalism_party: "Radical Socialists"
 ORE_ideology_radical_socialism_party_long: "Socialist Party of Oregon (Moderates)\n§YFounded: 25 September 1901§!\n§LThe Socialist Party of Oregon (Moderates) brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 ORE_ideology_radical_socialism_party: "Socialists"
 ORE_social_egalitarianism_party_long: "Progressive Party of Oregon\n§YFounded: 1912§!\n§LThe Progressive Party of Oregon brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 ORE_social_egalitarianism_party: "Progressives"
 ORE_centrism_party_long: "Liberal Party of Oregon\n§YFounded: c. 1857§!\n§LThe Liberal Party of Oregon brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 ORE_centrism_party: "Liberals"
 ORE_traditional_conservatism_party_long: "Conservative Party of Oregon\n§YFounded: 1852§!\n§LThe Conservative Party of Oregon rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"
 ORE_traditional_conservatism_party: "Conservatives"
 ORE_radical_democracy_party_long: "Unconditional Union Party\n§YFounded: 1861§!\n§L'Unconditional Union' is a Civil War-era label used by political coalitions that demand preservation of the Union without compromise with secession.\n\nUnconditional Union Party gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 ORE_radical_democracy_party: "Unionists"
 ORE_autocracy_party_long: "House of Cascadia\n§YFounded: c. 1857§!\n§LThe House of Cascadia bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 ORE_autocracy_party: "Cascadian Imperialists"
 ORE_chauvinist_populism_party_long: "Cascadian Nationalist Party\n§YFounded: c. 1857§!\n§LThe Cascadian Nationalist Party gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 ORE_chauvinist_populism_party: "Cascadian Nationalists"

 TEX_ideology_social_liberalism_party_long: "Radical Socialist Party of Texas\n§YFounded: 1906§!\n§LThe Radical Socialist Party of Texas occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 TEX_ideology_social_liberalism_party: "Radical Socialists"
 TEX_ideology_radical_socialism_party_long: "Socialist Party of Texas\n§YFounded: 1906§!\n§LThe Socialist Party of Texas draws together workers, artisans, radical intellectuals, and organizers who see economic power as inseparable from political power. Its program stresses labor organization, social ownership or cooperation, and a decisive challenge to the privileges of wealth and inherited hierarchy.\n\nThe movement looks beyond ordinary constitutional reform and seeks a deeper transformation of society. Its supporters disagree over the pace and method of change, but share the conviction that the existing economic order leaves working people without the power or security promised by political liberty.§!\n"
 TEX_ideology_radical_socialism_party: "Socialists"
 TEX_social_egalitarianism_party_long: "Radical Party of Texas\n§YFounded: 1868§!\n§LThe Radical Party of Texas brings together progressive reformers, workers, professionals, and social activists who argue that political liberty must be matched by wider social opportunity. The movement favors education, labor reform, broader participation in government, and a more active public role in confronting poverty and inequality.\n\nIts supporters regard reform as a means of strengthening society rather than overturning it. They press the established political order to answer the demands of industrialization and urban growth while competing with both laissez-faire liberals and revolutionary socialist currents.§!\n"
 TEX_social_egalitarianism_party: "Radicals"
 TEX_centrism_party_long: "Republican Party of Texas\n§YFounded: 4 July 1867§!\n§LThe Republican Party of Texas is organized during Reconstruction, especially from 1867 onward, by Unionists, freedmen, northern migrants, and supporters of congressional Reconstruction. It governs the state under Governor Edmund J. Davis before Democrats regain control in the 1870s.§!\n"
 TEX_centrism_party: "Texan Republicans"
 TEX_traditional_conservatism_party_long: "Democratic Party of Texas\n§YFounded: 1846§!\n§LTexas Democrats become the dominant political organization of the state after Reconstruction. Before the Civil War most Texas politicians already belong to the national Democratic tradition, and after 1873 the state Democratic Party builds a long-lasting political dominance tied to white conservative rule.§!\n"
 TEX_traditional_conservatism_party: "Texan Democrats"
 TEX_radical_democracy_party_long: "Unconditional Union Party\n§YFounded: 1861§!\n§L'Unconditional Union' is a Civil War-era label used by political coalitions that demand preservation of the Union without compromise with secession.\n\nUnconditional Union Party gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 TEX_radical_democracy_party: "Unionists"
 TEX_autocracy_party_long: "House of Bourbon\n§YFounded: 1272§!\n§LThe House of Bourbon rules several European monarchies and branches of the house governs Spain and, until 1861, the Kingdom of the Two Sicilies. A Bourbon royal house is a dynasty.\n\nHouse of Bourbon bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 TEX_autocracy_party: "Spanish Loyalists"
 TEX_chauvinist_populism_party_long: "All-Texan Nationalist Party\n§YFounded: c. 1857§!\n§LThe All-Texan Nationalist Party gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 TEX_chauvinist_populism_party: "Texan Nationalists"

 ASH_autocracy_party: "House of Oyoko"
 ASH_autocracy_party_long: "House of Oyoko\n§YFounded: c. 1670§!\n§LAsante kings belong to the Oyoko matrilineal clan, from which the Asantehene is selected.\n\nThe Golden Stool, royal court, chiefs, and clan institutions forms the political order of the Asante Empire; the Oyoko lineage is a ruling clan. House of Oyoko bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

 ARO_autocracy_party: "Eze Aro Faction"
 ARO_autocracy_party_long: "Eze Aro Faction\n§YFounded: c. 1690§!\n§LThe Eze Aro is the sacred king of Arochukwu and a central ritual figure within the network commonly called the Aro Confederacy. His authority is intertwined with lineage, priestly institutions, merchant networks, and autonomous Aro settlements; this is a traditional office.§!\n"
 ARO_radical_democracy_party: "Okpankpo Faction"
 ARO_radical_democracy_party_long: "Okpankpo Faction\n§YFounded: c. 1690§!\n§LThe Okpankpo is a council associated with Aro political and judicial authority. Aro governance depends on councils, lineages, titled elders, priests, and the dispersed network of Aro settlements.§!\n"
 ARO_fundamentalism_party: "Ibini Ukpabi Faction"
 ARO_fundamentalism_party_long: "Ibini Ukpabi Faction\n§YFounded: c. 1690§!\n§LIbini Ukpabi, known to Europeans as the Long Juju, is the famous oracle and religious institution at Arochukwu. It has major judicial, ritual, and commercial importance within Aro society and regional networks, but it is a religious institution.§!\n"

 KOY_autocracy_party: "Bai's Faction"
 KOY_autocracy_party_long: "Bai's Faction\n§YFounded: c. 1505§!\n§LThe Bai's Faction rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"

 SOT_autocracy_party: "House of Bamokoteli"
 SOT_autocracy_party_long: "House of Bamokoteli\n§YFounded: 1820§!\n§LThe Bamokoteli lineage is associated with the Moshoeshoe royal house of the Basotho. Nineteenth-century Basotho politics centers on Moshoeshoe I, subordinate chiefs, kinship, and councils. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

#Napoleonian France
 FRA_ideology_social_liberalism_party: "Républicains"
 FRA_ideology_social_liberalism_party_long: "Républicains\n§YFounded: 1848§!\n§LFrench republicans oppose the Bonapartist Second Empire and seek restoration of representative republican government. During the 1860s their parliamentary strength increases as the Empire liberalizes, and after Napoleon III's fall in 1870 republican factions become the dominant currents of the new Third Republic.§!\n"
 FRA_ideology_radical_socialism_party: "Marxistes"
 FRA_ideology_radical_socialism_party_long: "Marxistes\n§YFounded: 1848§!\n§LMarxist politics in France develops gradually through socialist clubs, sections of the International Workingmen's Association, and later workers' parties after the 1870s. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 FRA_social_egalitarianism_party: "Socialistes"
 FRA_social_egalitarianism_party_long: "Socialistes\n§YFounded: c. 1830§!\n§LFrench socialism in the mid-nineteenth century is divided among Proudhonists, Blanquists, followers of earlier utopian schools, labor activists, and other republican-socialist currents. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 FRA_centrism_party: "Modérés"
 FRA_centrism_party_long: "Modérés\n§YFounded: c. 1871§!\n§LThe label 'Moderates' describes the moderate republican tendency that becomes particularly important after 1870. Often called Opportunist Republicans in the early Third Republic, they favor consolidating republican institutions through gradual reforms rather than revolutionary confrontation.§!\n"
 FRA_traditional_conservatism_party: "Conservateurs Libéraux"
 FRA_traditional_conservatism_party_long: "Conservateurs Libéraux\n§YFounded: c. 1830§!\n§LLiberal conservative opposition to Napoleon III draws especially from Orléanist constitutional monarchists and other notables who favor parliamentary government, property rights, and political liberties without embracing radical republicanism.§!\n"
 FRA_radical_democracy_party: "Radicalistes"
 FRA_radical_democracy_party_long: "Radicalistes\n§YFounded: 1901§!\n§LRadical republicans represent the more democratic, anticlerical, and socially reformist wing of French republicanism. They press for broader suffrage, secular institutions, stronger parliamentary rule, and civic liberties; the formal Radical Party is not creates until 1901, so nineteenth-century 'Radicals' are a current and parliamentary family.§!\n"
 FRA_autocracy_party: "Bonapartistes"
 FRA_autocracy_party_long: "Bonapartistes\n§YFounded: c. 1815§!\n§LBonapartists support the political legacy and dynastic claims of Napoleon Bonaparte and his family. Under Napoleon III they form the governing basis of the Second Empire, combining plebiscitary popular legitimacy with a strong executive; after 1870 they remain a significant monarchist-imperial current in early Third Republic politics.§!\n"
 FRA_chauvinist_populism_party: "Militaristes"
 FRA_chauvinist_populism_party_long: "Militaristes\n§YFounded: c. 1852§!\n§LSupporters of Militaristes channel regional interests and public loyalties into a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 FRA_anarchism_party: "Anarchistes"
 FRA_anarchism_party_long: "Anarchistes\n§YFounded: c. 1840§!\n§LFrench anarchism develops from the revolutionary and mutualist traditions associated with figures such as Pierre-Joseph Proudhon and later from the anti-authoritarian wing of the workers' movement. It becomes a conspicuous movement in the late nineteenth century.§!\n"
 FRA_fundamentalism_party: "Eglise Catholique de France"
 FRA_fundamentalism_party_long: "Eglise Catholique de France\n§YFounded: c. 177§!\n§LThe Catholic Church in France is a major religious and social institution. During the nineteenth century French Catholics range from ultramontane and monarchist currents to more liberal Catholic tendencies, and church-state relations become one of the central conflicts of republican politics.§!\n"

#IIIe Republic France - Franco-Prussian War
 FRA_iii_traditional_conservatism_party: "Défense Nationale"
 FRA_iii_traditional_conservatism_party_long: "Défense Nationale\n§YFounded: 1870§!\n§LThe Government of National Defence is the emergency republican government proclaimed in Paris on 4 September 1870 after the collapse of Napoleon III's empire. It attempts to continue the war against Prussia while organizing a new republican state, and it is a provisional government.§!\n"

#IIIe Republic France - 1871 Election
 FRA_iii_1871_traditional_conservatism_party: "Monarchistes"
 FRA_iii_1871_traditional_conservatism_party_long: "Monarchistes\n§YFounded: 1871§!\n§LThe monarchist majority elects to the French National Assembly in 1871 consists principally of Legitimists and Orléanists. They hope to restore the monarchy after the fall of Napoleon III, but disagreement over the claimant, flag, and constitutional settlement help prevent restoration and allow the Third Republic to consolidate.§!\n"
 FRA_iii_1871_radical_democracy_party: "Union Républicaine"
 FRA_iii_1871_radical_democracy_party_long: "Union Républicaine\n§YFounded: 1871§!\n§LThe Republican Union is a political coalition of moderate republicans in the early Third Republic, associated particularly with Léon Gambetta. It seeks to consolidate the republic while distinguishing itself from both conservative monarchists and the more radical republican leaves.§!\n"
 
#Paris Commune and Socialist France
 FRA_CPR_ideology_radical_socialism_party: "Commune Council"
 FRA_CPR_ideology_radical_socialism_party_long: "Commune Council\n§YFounded: 1871§!\n§LThe Council of the Paris Commune is the elects governing body of revolutionary Paris from March to May 1871. Commune Council brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"


 BWR_ideology_social_liberalism_party: "Marxist Workers Party"
 BWR_ideology_social_liberalism_party_long: "Marxist Workers Party\n§YFounded: c. 1857§!\n§LThe Marxist Workers Party brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 BWR_ideology_radical_socialism_party: "United Trade Councils"
 BWR_ideology_radical_socialism_party_long: "United Trade Councils\n§YFounded: c. 1857§!\n§LThe United Trade Councils draw their influence from organized labor and the growing demand for collective political action. Their program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 BWR_social_egalitarianism_party: "Socialist Democratic Party of Britain"
 BWR_social_egalitarianism_party_long: "Socialist Democratic Party of Britain\n§YFounded: c. 1857§!\n§LThe Socialist Democratic Party of Britain brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 BWR_centrism_party: "Liberal Republican Party"
 BWR_centrism_party_long: "Liberal Republican Party\n§YFounded: 1872§!\n§LThe Liberal Republican movement breaks from the Republican Party in 1872. Its leaders oppose the Grant administration, criticize corruption and continue federal intervention in the South, advocate civil-service reform and reconciliation, and nominate Horace Greeley for president before rapidly dissolving after the election.§!\n"
 BWR_traditional_conservatism_party: "Old Republicans"
 BWR_traditional_conservatism_party_long: "Old Republicans\n§YFounded: c. 1857§!\n§LThe Old Republicans represent defenders of established institutions, property, religion, and social order. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 BWR_radical_democracy_party: "Free Revolutionary Council"
 BWR_radical_democracy_party_long: "Free Revolutionary Council\n§YFounded: c. 1857§!\n§LThe Free Revolutionary Council occupies an established place in the political life of the state. Its authority rests on its place within the governing institutions of the state, where leading families, officials, and local interests bargain over appointments, law, revenue, and the exercise of political power.§!\n"
 BWR_autocracy_party: "Monarchist Opposition"
 BWR_autocracy_party_long: "Monarchist Opposition\n§YFounded: c. 1857§!\n§LMonarchist Opposition rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 BWR_chauvinist_populism_party: "Radical National Party of Britain"
 BWR_chauvinist_populism_party_long: "Radical National Party of Britain\n§YFounded: c. 1857§!\n§LThe Radical National Party of Britain brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 BWR_anarchism_party: "League of Free Communities"
 BWR_anarchism_party_long: "League of Free Communities\n§YFounded: c. 1857§!\n§LAt the heart of League of Free Communities is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 BWR_fundamentalism_party: "Theocratic Opposition"
 BWR_fundamentalism_party_long: "Theocratic Opposition\n§YFounded: c. 1857§!\n§LTheocratic Opposition draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 RUS_autocracy_party: "Dom Romanovykh"
 RUS_autocracy_party_long: "House of Romanov\n§YFounded: 21 February 1613§!\n§LThe House of Romanov rules Russia from 1613 until the abdication of Nicholas II in 1917. In the nineteenth century the emperors govern an autocratic empire supports by the bureaucracy, army, Orthodox Church, and landed elite; the dynasty is the ruling house.§!\n"
 RUS_fundamentalism_party: "Chernye Sotny"
 RUS_fundamentalism_party_long: "Chernye Sotny\n§YFounded: 1905§!\n§LThe Black Hundreds are monarchist, ultranationalist, and violently antisemitic organizations that appear during and after the Russian Revolution of 1905. Chernye Sotny draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 RUS_ideology_social_liberalism_party: "Zapadniki"
 RUS_ideology_social_liberalism_party_long: "Westerners\n§YFounded: c. 1861§!\n§LThe Westerners occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 RUS_centrism_party: "Slavyanophiles"
 RUS_centrism_party_long: "Slavophiles\n§YFounded: c. 1840§!\n§LThe Slavophiles are a nineteenth-century Russian intellectual movement that idealizes elements of pre-Petrine Russian society, Orthodox spirituality, and communal traditions while criticizing excessive imitation of Western Europe. They are a circle of writers and thinkers.§!\n"
 RUS_traditional_conservatism_party: "Dvoryanstvo"
 RUS_traditional_conservatism_party_long: "Political Nobility\n§YFounded: c. 1839§!\n§LThe Russian nobility, or dvoryanstvo, is a legally privileged estate. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 RUS_social_egalitarianism_party: "Narodniki"
 RUS_social_egalitarianism_party_long: "Narodnikists\n§YFounded: c. 1840§!\n§LThe Narodnik, or populist, movement develops among Russian radicals in the 1860s and 1870s. It looks to the peasant commune as a possible foundation for a socialist future and inspires campaigns to 'go to the people'; later revolutionary and socialist organizations grow from its diverse currents.§!\n"
 RUS_ideology_radical_socialism_party: "Socialisty"
 RUS_ideology_radical_socialism_party_long: "Socialists\n§YFounded: c. 1861§!\n§LThe Socialists draws together workers, artisans, radical intellectuals, and organizers who see economic power as inseparable from political power. Its program stresses labor organization, social ownership or cooperation, and a decisive challenge to the privileges of wealth and inherited hierarchy.\n\nThe movement looks beyond ordinary constitutional reform and seeks a deeper transformation of society. Its supporters disagree over the pace and method of change, but share the conviction that the existing economic order leaves working people without the power or security promised by political liberty.§!\n"
 RUS_radical_democracy_party: "Kazachestvo"
 RUS_radical_democracy_party_long: "Cossacks\n§YFounded: c. 1550§!\n§LThe Cossacks are military-frontier communities of the Russian Empire with distinctive self-governing traditions and service obligations. By the nineteenth century major hosts are integrated into imperial military and administrative structures; they are a social-military estate.§!\n"
 RUS_chauvinist_populism_party: "Chauvenist Circles"
 RUS_chauvinist_populism_party_long: "Chauvenist Circles\n§YFounded: 1905§!\n§LSupporters of Chauvenist Circles channel regional interests and public loyalties into a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 RUS_anarchism_party: "Chyornoe Znamya"
 RUS_anarchism_party_long: "Black Banners\n§YFounded: 1903§!\n§LThe Black Banner, or Chernoe Znamia, is an anarchist-communist current that appears in the Russian Empire after 1903 and favors violent direct action against the state and bourgeois order. It belongs to the revolutionary politics of the early twentieth century, not the mid-nineteenth century.§!\n"


 ZUL_autocracy_party: "King's Faction"
 ZUL_autocracy_party_long: "King's Faction\n§YFounded: c. 1816§!\n§LZulu political authority centers on the king and the royal house. Kings such as Mpande and Cetshwayo rule through networks of chiefs, izinduna, royal homesteads, and amabutho, with succession and court factions often shaping political alignments.§!\n"
 ZUL_anarchism_party: "iNkatha Yezwe"
 ZUL_anarchism_party_long: "iNkatha Yezwe\n§YFounded: c. 1816§!\n§LINkatha Yezwe draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 ZUL_chauvinist_populism_party: "UWK"
 ZUL_chauvinist_populism_party_long: "Umphakathi Wokuvikelwa Kazwelonke\n§YFounded: c. 1816§!\n§LUmphakathi Wokuvikelwa Kazwelonke gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 ZUL_fundamentalism_party: "Sangoma Faction"
 ZUL_fundamentalism_party_long: "Sangoma Faction\n§YFounded: c. 1816§!\n§LSangoma are diviners and healers within southern African religious traditions. Spiritual specialists could hold considerable community authority, but nineteenth-century Zulu state politics is organized through the king, chiefs, councils, and military-age regiments.§!\n"
 ZUL_social_egalitarianism_party: "IYOK"
 ZUL_social_egalitarianism_party_long: "iNkululeko yoKuzihlanganisa\n§YFounded: c. 1816§!\n§LINkululeko yoKuzihlanganisa brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 ZUL_ideology_radical_socialism_party: "MK"
 ZUL_ideology_radical_socialism_party_long: "umKhonto weUhlanga\n§YFounded: c. 1816§!\n§LUmKhonto weUhlanga brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 ZUL_ideology_social_liberalism_party: "UK"
 ZUL_ideology_social_liberalism_party_long: "Ukusebenzisana kwaBantu\n§YFounded: c. 1816§!\n§LUkusebenzisana kwaBantu occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 ZUL_centrism_party: "IYYEq"
 ZUL_centrism_party_long: "Inhlangano yenTando yenIngi eqHubekayo\n§YFounded: c. 1816§!\n§LInhlangano yenTando yenIngi eqHubekayo brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 ZUL_traditional_conservatism_party: "Imifino"
 ZUL_traditional_conservatism_party_long: "Imifino\n§YFounded: c. 1816§!\n§LSupporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 ZUL_radical_democracy_party: "Umkhandlu Omkhulu"
 ZUL_radical_democracy_party_long: "Umkhandlu Omkhulu\n§YFounded: c. 1816§!\n§LUmkhandlu Omkhulu gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"

 NKO_autocracy_party: "Omugabe's Faction"
 NKO_autocracy_party_long: "Omugabe's Faction\n§YFounded: c. 1460§!\n§LThe Omugabe's Faction rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"

 TYO_autocracy_party: "King's Faction"
 TYO_autocracy_party_long: "King's Faction\n§YFounded: 1830§!\n§LThe King's Faction rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"

 SER_centrism_party: "Liberals"
 SER_centrism_party_long: "Liberals\n§YFounded: c. 1858§!\n§LSerbian liberalism develops as a recognizable political current before it becomes a formally organized party. Associated especially with Jovan Ristić, the liberals combine constitutional ideas with Serbian nationalism, support for the Obrenović dynasty, and close ties to the Serbian Orthodox Church; a formal Liberal Party is organized in the 1880s.§!\n"
 SER_traditional_conservatism_party: "Defenders of the Constitution"
 SER_traditional_conservatism_party_long: "Defenders of the Constitution\n§YFounded: 1838§!\n§LDefenders of the Constitution are the Serbian Ustavobranitelji, a political oligarchy of notables who oppose Prince Miloš Obrenović's personal rule. They help impose constitutional limits on the prince, dominate Serbia in the 1840s and 1850s, and support bureaucratic state-building under the rival Karađorđević dynasty.§!\n"
 SER_autocracy_party: "Absolutists"
 SER_autocracy_party_long: "Absolutists\n§YFounded: c. 1839§!\n§LIn the mid-nineteenth century Serbian politics repeatedly turns on the scope of princely authority, the power of the State Council and assembly, and rival dynastic networks around the Obrenović and Karađorđević houses. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"

 PRS_ideology_radical_socialism_party: "Sozialrevolutionäre"
 PRS_ideology_radical_socialism_party_long: "Sozialrevolutionäre\n§YOnly loosely Established§!\n§LThe Sozialrevolutionäre are a small fraction of the left, combining radical socialist ideals inspired by the writings of Karl Marx and Friedrich Engels. Instead of gradual reform via participation in parliament like the Sozialreformer, the Sozialrevolutionäre aim for a socialist revolution and a communist society as a result.§!\n"
 PRS_social_egalitarianism_party: "Sozialreformer"
 PRS_social_egalitarianism_party_long: "Sozialreformer\n§YOnly loosely Established§!\n§LThe Sozialreformer are a faction comprised of delegates with Christian‑social and early reformist socialist tendencies that want legal equality and state protection for the poor via gradual reform, not a full-scale revolution.§!\n"
 PRS_centrism_party: "Wochenblattpartei"
 PRS_centrism_party_long: "Wochenblattpartei\n§YFounded: early 1850s§!\n§LThe Wochenblattpartei is a moderate conservative-liberal movement coalescing around the Preußisches Wochenblatt, a Prussian newspaper outlet. Their delegates unite bourgeois elites who accept monarchy but want to transform it into a truly constitutional state that ensures economic liberty. The party champions Prussia's leadership in a small-German unification while seeking to balance tradition with measured liberal progress.§!\n"
 PRS_ideology_social_liberalism_party: "Altliberale"
 PRS_ideology_social_liberalism_party_long: "Altliberale\n§YFounded: 1850s§!\n§LThe Altliberale have originated in the moderate liberal “Fraktion Vincke” of the 1850s, aiming to continue the constitutional liberalism of the 1848 revolutions. They seek a lawful constitutional monarchy, civil rights, and gradual reform progress within Prussia.§!\n"
 PRS_ideology_social_liberalism_party_long_old: "Altliberale\n§YFounded: 1850s§!\n§LFortschrittler are supporters of the German Progress Party, founded in Prussia in 1861. They defend parliamentary rights, constitutional government, legal equality, and German national unification and become Bismarck's principal liberal opponents during the Prussian constitutional conflict.§!\n"
 PRS_traditional_conservatism_party: "Kreuzzeitungspartei"
 PRS_traditional_conservatism_party_long: "Konservative Partei\n§YFounded: 1848§!\n§LThe Kreuzzeitungspartei grew out of the ultra‑conservative circle around the Neue Preußische Zeitung (nicknamed “Kreuzzeitung” because of the Iron Cross prominently placed in the paper's header) and the Prussian Junker aristocracy. It defends a sort of neo-absolute monarchy, the traditional estate order, and close ties between church, crown, and Junker landowners, whilst opposing constitutional limitations and German national unification that could threaten Prussia's distinct identity in the eyes of most of the party's delegates.§!\n"
 PRS_radical_democracy_party: "Polnischer Kreis"
 PRS_radical_democracy_party_long: "Polish Circle\n§YFounded: 1849§!\n§LThe Polnischer Kreis, Polish Circle, is an umbrella term for delegates, political clubs and organizations which advocate minority rights for the Polish citizens of Prussia.§!\n"
 PRS_autocracy_party: "Königstreue"
 PRS_autocracy_party_long: "Königstreue\n§YFounded: 1848§!\n§Under the slogan 'For God, King, and Order', the Königstreue faction evokes the ultra‑conservative, neo-absolutist court and archconservative circles around [VL_name] and the Manteuffel ministry.§!\n"
 PRS_chauvinist_populism_party: "Antisemitische Bewegung"
 PRS_chauvinist_populism_party_long: "Antisemitische Bewegung\n§YOnly loosely Established§!\n§LBased on a deep mistrust and even hatred of Jews, the Antisemitische Bewegung aims to turn antisemitic ideas in German-speaking Europe into an electoral program and, thus, political action. Through agitation and inner-communal activities, the movement gathers supporters around national unity, sovereignty, and the future direction of the state as a counter-image to strive and division as sowed by the assumed pariahs.§!\n"
 PRS_anarchism_party: "Anarchisten"
 PRS_anarchism_party_long: "Anarchisten\n§YOnly loosely Established§!\n§LInspired by international anarchist idols like Pierre-Joseph Proudhon or Michail Bakunin, the Anarchisten strive for anarchist ideals and oppose any form of hierarchical society or leadership.§!\n"
 PRS_fundamentalism_party: "Katholische Fraktion"
 PRS_fundamentalism_party_long: "Katholische Fraktion\n§YFounded: 1852§!\n§LThe Katholische Fraktion have formed in the Prussian Landtag in 1852 to defend Catholic interests after state restrictions on missions and theological study. It fights to protect church rights, especially Catholic influence over schools, while otherwise remaining moderately liberal.§!\n"

 PRS_ideology_social_liberalism_progressive_party: "DFP"
 PRS_ideology_social_liberalism_progressive_party_long: "Deutsche Fortschrittspartei\n§YFounded: 1861§!\n§LThe German Progress Party was founded in Prussia in 1861 by liberal and democratic deputies. It defends constitutional government, parliamentary rights, legal equality, and German national unification.§!\n"
 #PRS_centrism_republic_party: "FDNV"
 #PRS_centrism_republic_party_long: "Freier Deutscher Nationalverein"
 PRS_centrism_national_liberal_party: "NLP"
 PRS_centrism_national_liberal_party_long: "Nationalliberale Partei\n§YFounded: 1867§!\n§LThe National Liberal Party emerged when liberals who prioritize national unification split from the German Progress Party. Despite its conservative nature, the Nationalliberale Partei supports the German unification as envisioned by [PRS.GetLeader] whilst pressing for constitutional modernization and economic liberty at the same time.§!\n"
 PRS_adav_party: "ADAV"
 PRS_adav_party_long: "Allgemeiner Deutscher Arbeiterverein\n§YFounded: 1863§!\n§LThe General German Workers' Association was founded in Leipzig in 1863 under Ferdinand Lassalle and is commonly regarded as the first fully-established German workers' party. It advocates universal male suffrage and state-assisted workers' cooperatives.§!\n"
 PRS_vdav_party: "VDAV"
 PRS_vdav_party_long: "Vereinstag Deutscher Arbeitervereine\n§YFounded: 1863§!\n§LThe Association of German Workers' Associations has developed from liberal workers' educational societies. Under leadership of August Bebel it moves toward socialist politics and helps provide the political framework for a revolutionary movement of workers.§!\n"
 PRS_sdap_party: "SDAP"
 PRS_sdap_party_long: "Sozialdemokratische Arbeiterpartei\n§YFounded: 1869§!\n§LThe Social Democratic Workers' Party was founded at Eisenach in 1869 by August Bebel, Wilhelm Liebknecht, and their allies. Influenced by Marxism and the First International, it competes with Lassalle's ADAV for the workers' approval.§!\n"
 PRS_sap_party: "SAP"
 PRS_sap_party_long: "Sozialistische Arbeiterpartei Deutschlands\n§YFounded: 1875§!\n§LThe Socialist Workers' Party of Germany was created at the Gotha congress of 1875 by the merger of the ADAV and the Social Democratic Workers' Party. The movement aims to pool the strength of the workers' movement in Germany in order to achieve its goals.§!\n"
 PRS_spd_party: "SPD"
 PRS_spd_party_long: "Sozialdemokratische Partei Deutschlands\n§YFounded: 1890§!\n§LThe Social Democratic Party of Germany adopted its present name in 1890. Descended from the Lassallean and Eisenach workers' movements, it is the largest mass socialist party in Germany and combines Marxist doctrine with extensive electoral, trade-union, press, and associational organization.§!\n"
 PRS_fundamentalism_NGC_party: "Fraktion des Zentrums"
 PRS_fundamentalism_NGC_party_long: "Fraktion des Zentrums\n§YFounded: 1859§!\n§LThe Fraktion des Zentrum has formed as an answer to increasingly anti-Catholic tendencies in Prussian politics during the so-called New Era. It fights to protect church rights, especially Catholic influence over schools, while otherwise remaining moderate and open for cooperation on non-religious questions.§!\n"
 PRS_zentrum_party: "Zentrum"
 PRS_zentrum_party_long: "Zentrumspartei\n§YFounded: 1870§!\n§LThe German Centre Party arose in 1870 to represent Catholic political interests in a Germany dominated by Protestants. It defends the constitutional and confessional rights of Catholics, opposes much of [PRS.GetLeader]'s internal policies and has quickly become a mass party able to cooperate with different governments on non-religious questions.§!\n"

 DEN_ideology_social_liberalism_party: "Bondevennernes Selskab"
 DEN_ideology_social_liberalism_party_long: "Bondevennernes Selskab\n§YFounded: 5 May 1846§!\n§LBondevennernes Selskab, the Society of Friends of the Peasants, is founded in Denmark in 1846 to advance the political and economic interests of farmers and smallholders. It becomes an important force in the transition from absolutism to constitutional politics and helps mobilize rural voters after the 1849 constitution.§!\n"
 DEN_ideology_radical_socialism_party: "Radikale Socialistiske Arbejderbevægelse"
 DEN_ideology_radical_socialism_party_long: "Radikale Socialistiske Arbejderbevægelse\n§YFounded: 15 October 1871§!\n§LRadical socialist organization in Denmark belongs mainly to the later nineteenth-century labor movement. Radikale Socialistiske Arbejderbevægelse brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 DEN_social_egalitarianism_party: "Socialistiske Arbejderbevægelse"
 DEN_social_egalitarianism_party_long: "Socialistiske Arbejderbevægelse\n§YFounded: 15 October 1871§!\n§LThe organized Danish socialist labor movement develops in the 1870s around Louis Pio, Harald Brix, Paul Geleff, trade unions, and the Danish section of the First International.\n\nSocialistiske Arbejderbevægelse brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 DEN_centrism_party: "Nationalliberale"
 DEN_centrism_party_long: "Nationalliberale\n§YFounded: c. 1842§!\n§LDenmark's National Liberals are a mid-nineteenth-century political movement drawn largely from the educated urban middle class. They champion constitutional government and Danish nationalism, play a leading role in the 1848-1849 constitutional transition, and strongly support the 'Denmark to the Eider' national program in the Schleswig question.§!\n"
 DEN_traditional_conservatism_party: "Højre"
 DEN_traditional_conservatism_party_long: "Højre\n§YFounded: c. 1835§!\n§LThe Danish Højre is formed in the 1880s from conservative landowner and National Liberal elements and becomes the principal conservative party of the constitutional monarchy. Under Estrup, it defends the monarchy, the upper chamber, and conservative resistance to the parliamentary demands of Venstre.§!\n"
 DEN_radical_democracy_party: "Landstinget"
 DEN_radical_democracy_party_long: "Landstinget\n§YFounded: 1849§!\n§LThe Landsting is the upper chamber of the Danish Rigsdag established by the Constitution of 1849. Its electoral rules favor wealthier and more conservative interests, especially after the constitutional revision of 1866, but it is a legislative chamber.§!\n"
 DEN_autocracy_party: "Huset Oldenborg"
 DEN_autocracy_party_long: "Huset Oldenborg\n§YFounded: 1448§!\n§LThe House of Oldenburg is Denmark's royal dynasty from 1448 until the death of Frederick VII in 1863. The monarchy's role changes fundamentally with the Constitution of 1849, which ends absolutism and establishes constitutional government.§!\n"
 DEN_chauvinist_populism_party: "Chauvinistisk Bevægelse"
 DEN_chauvinist_populism_party_long: "Chauvinistisk Bevægelse\n§YFounded: 1842§!\n§LDanish politics around the constitutional transition of 1848-1849 is organized through movements and political coalitions such as National Liberals and the Friends of the Peasants before modern disciplined parties develop.\n\nChauvinistisk Bevægelse gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 DEN_anarchism_party: "Anarkistisk Bevægelse"
 DEN_anarchism_party_long: "Anarkistisk Bevægelse\n§YFounded: 7 November 1890§!\n§LDanish politics around the constitutional transition of 1848-1849 is organized through movements and political coalitions such as National Liberals and the Friends of the Peasants before modern disciplined parties develop.\n\nAnarkistisk Bevægelse draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 DEN_fundamentalism_party: "Danske Folkekirke"
 DEN_fundamentalism_party_long: "Danske Folkekirke\n§YFounded: 1849§!\n§LThe Evangelical Lutheran Church of Denmark is the established national church recognizes by the Constitution of 1849. Danske Folkekirke draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 # Sweden
 SWE_ideology_social_liberalism_party: "Sveriges Kommunistiska Parti"
 SWE_ideology_social_liberalism_party_long: "Sveriges Kommunistiska Parti\n§YFounded: 1917§!\n§LSweden's communist party originates in the leaves wing that splits from the Social Democrats in 1917 and joins the Communist International. The organization adopts the name Sveriges kommunistiska parti in 1921; its organization and doctrine place it among the major currents of twentieth-century Swedish politics.§!\n"
 SWE_ideology_radical_socialism_party: "Vänsterpartiet"
 SWE_ideology_radical_socialism_party_long: "Vänsterpartiet\n§YFounded: 1889§!\n§LThe modern Swedish Leaves Party descends from the Social Democratic Leaves Party founded in 1917 and from the communist organization that follows. Vänsterpartiet brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 SWE_social_egalitarianism_party: "Sveriges socialdemokratiska arbetareparti"
 SWE_social_egalitarianism_party_long: "Sveriges socialdemokratiska arbetareparti\n§YFounded: 1889§!\n§LThe Swedish Social Democratic Workers' Party is founded in Stockholm in 1889 by delegates from trade unions, workers' clubs, and socialist associations. It becomes the principal organization of the Swedish labor movement and campaigns for universal suffrage and social reform before emerging as the dominant party of twentieth-century Sweden.§!\n"
 SWE_centrism_party: "Ministriella Partiet"
 SWE_centrism_party_long: "Ministriella Partiet\n§YFounded: 1866§!\n§LThe Ministerial Party is one of the parliamentary groups that form in Sweden's newly created Second Chamber after the 1866 representation reform. From 1867, it draws largely on urban representatives supportive of the ministry and stands alongside the much larger rural Lantmanna Party in the first years of the bicameral Riksdag.§!\n"
 SWE_radical_democracy_party: "Sveriges riksdag"
 SWE_radical_democracy_party_long: "Sveriges riksdag\n§YFounded: 1435§!\n§LThe Riksdag is Sweden's legislature. Its political importance rests on its role as a forum where the leading interests of the state debate law, taxation, appointments, and the balance between central authority and local privilege.§!\n"
 SWE_traditional_conservatism_party: "Lantmannapartiet"
 SWE_traditional_conservatism_party_long: "Lantmannapartiet\n§YFounded: 1867§!\n§LThe Lantmanna Party is formed in the Swedish Second Chamber in 1867, immediately after parliamentary reform replaces the old Riksdag of the Estates. It represents mainly rural landowning and farming interests, advocates thrift and lower taxes, and becomes one of the most important political coalitions of the late nineteenth century.§!\n"
 SWE_autocracy_party: "House of Bernadotte"
 SWE_autocracy_party_long: "House of Bernadotte\n§YFounded: 1818§!\n§LThe House of Bernadotte rules Sweden from 1818 onward, founded by the former French marshal Jean-Baptiste Bernadotte, King Charles XIV John. The dynasty also rules Norway during the Swedish-Norwegian union until 1905; it is the royal house.\n\nHouse of Bernadotte bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 SWE_chauvinist_populism_party: "Svenska nationalsocialistiska partiet"
 SWE_chauvinist_populism_party_long: "Svenska nationalsocialistiska partiet\n§YFounded: 1 October 1930§!\n§LSwedish national-socialist parties appear only in the interwar twentieth century. Svenska nationalsocialistiska partiet brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 SWE_anarchism_party: "Nysvenska Rörelsen"
 SWE_anarchism_party_long: "Nysvenska Rörelsen\n§YFounded: 1941§!\n§LNysvenska Rörelsen is a twentieth-century Swedish far-right movement associated with Per Engdahl and corporatist nationalism. Nysvenska Rörelsen draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 SWE_fundamentalism_party: "Svenska kyrkan"
 SWE_fundamentalism_party_long: "Svenska kyrkan\n§YFounded: 1593§!\n§LThe Church of Sweden is the established Lutheran church of the Swedish state throughout the nineteenth century. Svenska kyrkan draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 # Norway
 NOR_ideology_social_liberalism_party: "Unorganized"
 NOR_ideology_social_liberalism_party_long: "Unorganized\n§YFounded: 1859§!\n§LUnorganized occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 NOR_social_egalitarianism_party: "Unorganized"
 NOR_social_egalitarianism_party_long: "Unorganized\n§YFounded: 27 December 1848§!\n§LUnorganized brings together progressive reformers, workers, professionals, and social activists who argue that political liberty must be matched by wider social opportunity. The movement favors education, labor reform, broader participation in government, and a more active public role in confronting poverty and inequality.\n\nIts supporters regard reform as a means of strengthening society rather than overturning it. They press the established political order to answer the demands of industrialization and urban growth while competing with both laissez-faire liberals and revolutionary socialist currents.§!\n"
 NOR_ideology_radical_socialism_party: "Unorganized"
 NOR_ideology_radical_socialism_party_long: "Unorganized\n§YFounded: 27 December 1848§!\n§LUnorganized draws together workers, artisans, radical intellectuals, and organizers who see economic power as inseparable from political power. Its program stresses labor organization, social ownership or cooperation, and a decisive challenge to the privileges of wealth and inherited hierarchy.\n\nThe movement looks beyond ordinary constitutional reform and seeks a deeper transformation of society. Its supporters disagree over the pace and method of change, but share the conviction that the existing economic order leaves working people without the power or security promised by political liberty.§!\n"
 NOR_fundamentalism_party: "Unorganized"
 NOR_fundamentalism_party_long: "Unorganized\n§YFounded: 1796§!\n§LUnorganized draws political authority from clergy, religious scholars, devotional networks, and communities that look to faith as a foundation of public order. Its influence extends beyond worship into education, charity, family life, customary law, and the moral expectations placed upon government.\n\nSupporters seek to preserve the place of religion at the center of society and resist reforms they regard as hostile to established belief. Political action is therefore understood not simply as a contest for office, but as a defense of the spiritual and social order on which the community rests.§!\n"
 NOR_chauvinist_populism_party: "Unorganized"
 NOR_chauvinist_populism_party_long: "Unorganized\n§YFounded: 1814§!\n§LUnorganized gathers nationalists, conservative activists, military-minded patriots, and other supporters who place national unity and state power above ordinary factional compromise. The movement emphasizes sovereignty, social cohesion, and a forceful defense of the nation against internal division and foreign pressure.\n\nIts appeal rests on the promise that a stronger national community can overcome political paralysis and regional rivalry. Supporters favor disciplined government and a more assertive public life, while treating liberal individualism and revolutionary internationalism with deep suspicion.§!\n"
 NOR_radical_democracy_party: "Unorganized"
 NOR_radical_democracy_party_long: "Unorganized\n§YFounded: 1859§!\n§LUnorganized gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 NOR_anarchism_party: "Unorganized"
 NOR_anarchism_party_long: "Unorganized\n§YFounded: 1877§!\n§LUnorganized brings together radical critics of centralized government, inherited privilege, and coercive political authority. Its supporters place voluntary association, local autonomy, mutual aid, and individual or communal freedom above the claims of the state.\n\nThe movement remains diverse, ranging from individualist currents to more social and labor-oriented tendencies. What unites them is a belief that durable liberty cannot be created simply by replacing one ruling party with another, but requires a fundamental reduction of compulsory authority itself.§!\n"
 NOR_autocracy_party: "House of Bernadotte"
 NOR_autocracy_party_long: "House of Bernadotte\n§YFounded: 1818§!\n§LThe House of Bernadotte rules Sweden from 1818 onward, founded by the former French marshal Jean-Baptiste Bernadotte, King Charles XIV John. The dynasty also rules Norway during the Swedish-Norwegian union until 1905; it is the royal house.\n\nHouse of Bernadotte bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 NOR_centrism_party: "Bønder"
 NOR_centrism_party_long: "Bønder\n§YFounded: 1833§!\n§LFrom the 1830s, elected Norwegian farmers increasingly form a recognizable opposition to the official and bureaucratic elite in the Storting. Rural representatives press for economy in government, protection of local interests, and greater influence for the broad farming population.§!\n"
 NOR_traditional_conservatism_party: "Embedsmenn"
 NOR_traditional_conservatism_party_long: "Embedsmenn\n§YFounded: 1814§!\n§LNorway's embetsmenn, or state officials, form the educated administrative elite that dominates much early nineteenth-century political life. Embedsmenn represent defenders of established institutions, property, religion, and social order. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 NOR_venstre_party: "Venstre"
 NOR_venstre_party_long: "Venstre\n§YFounded: 28 January 1884§!\n§LVenstre is formally founded in 1884 and is regarded as Norway's first modern political party. It grows from the alliance of farmers and urban liberals that challenge the official elite, and its victory in the constitutional struggle helps establish parliamentarism and ministerial responsibility.§!\n"
 NOR_hoyre_party: "Høire"
 NOR_hoyre_party_long: "Høire\n§YFounded: 25 August 1884§!\n§LHøyre, originally written Høire, is founded in 1884 by conservative supporters of the existing constitutional order during the struggle over parliamentarism. It becomes Norway's principal conservative party, representing many officials, urban property owners, and business interests.§!\n"
 NOR_dfna_egal_party: "DfnA - M"
 NOR_dfna_radical_socialism_party: "Dfna - R"
 NOR_dfna_egal_party_long: "Det forenede norske Arbeiderparti - Moderate Wing\n§YFounded: 21 August 1887§!\n§LThe Det forenede norske Arbeiderparti - Moderate Wing gathers the local notables, activists, institutional interests, and personal networks that sustain its political influence. Its leaders seek to turn these connections into a coherent voice capable of shaping appointments, legislation, and the wider direction of government.\n\nThe movement draws strength from the loyalties of its supporters rather than from a rigid national machine. Its future depends on whether those scattered interests can be held together as political competition becomes more organized and the demands placed upon the state continue to grow.§!\n"
 NOR_dfna_radical_socialism_party_long: "Det forenede norske Arbeiderparti - Radical Wing\n§YFounded: 21 August 1887§!\n§LThe Det forenede norske Arbeiderparti - Radical Wing brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"

 SPR_ideology_social_liberalism_party: "Partido Marxista"
 SPR_ideology_social_liberalism_party_long: "Partido Marxista\n§YFounded: 2 May 1879§!\n§LPartido Marxista brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 SPR_ideology_radical_socialism_party: "Partido Socialista Obrero"
 SPR_ideology_radical_socialism_party_long: "Partido Socialista Obrero\n§YFounded: 2 May 1879§!\n§LThe Spanish Socialist Workers' Party, PSOE, is founded in Madrid in 1879 by Pablo Iglesias and a small group of socialist workers and intellectuals. It develops alongside the organized labor movement and becomes Spain's principal Marxist and social-democratic party.§!\n"
 SPR_social_egalitarianism_party: "Partido Progresista"
 SPR_social_egalitarianism_party_long: "Partido Progresista\n§YFounded: 1834§!\n§LSpain's Progressive Party is one of the principal liberal currents of the reign of Isabella II. It defends national sovereignty, a broader franchise, the National Militia, and stronger guarantees of individual and municipal rights than the Moderates, and it governs most notably during the Progressive Biennium of 1854-1856.§!\n"
 SPR_centrism_party: "Unión Liberal"
 SPR_centrism_party_long: "Unión Liberal\n§YFounded: 1858§!\n§LThe Liberal Union is formed around General Leopoldo O'Donnell in the 1850s as a centrist coalition drawing moderate Progressives and less doctrinaire Moderates. It governs Spain for much of 1858-1863, seeking administrative stability, economic development, and a middle course within the Isabeline constitutional system.§!\n"
 SPR_radical_democracy_party: "Partido Democratico"
 SPR_radical_democracy_party_long: "Partido Democratico\n§YFounded: 1849§!\n§LSpain's Democratic Party emerges in 1849 from the more radical wing of Progressivism. It advocates a much broader democratic program, including universal male suffrage and stronger civil liberties, and contains republican as well as constitutional-democratic tendencies.§!\n"
 SPR_traditional_conservatism_party: "Moderados"
 SPR_traditional_conservatism_party_long: "Moderados\n§YFounded: 1834§!\n§LThe Spanish Moderate Party dominates much of Isabella II's reign, especially the Moderate Decade from 1844 to 1854. It favors a restricted franchise, a strong crown and central administration, social order, and the constitutional settlement embodied in the Constitution of 1845.§!\n"
 SPR_autocracy_party: "House of Bourbon"
 SPR_autocracy_party_long: "House of Bourbon\n§YFounded: 1272§!\n§LThe House of Bourbon rules several European monarchies and branches of the house governs Spain and, until 1861, the Kingdom of the Two Sicilies. A Bourbon royal house is a dynasty.\n\nHouse of Bourbon bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 SPR_chauvinist_populism_party: "Partido Radical"
 SPR_chauvinist_populism_party_long: "Partido Radical\n§YFounded: 6 January 1908§!\n§LSpain's best-known Partido Republicano Radical is founded by Alejandro Lerroux in 1908, long after the reign of Isabella II. Partido Radical brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 SPR_anarchism_party: "Confederacion Nacional del Trabajo"
 SPR_anarchism_party_long: "Confederacion Nacional del Trabajo\n§YFounded: 1 November 1910§!\n§LThe Confederación Nacional del Trabajo is founded in Barcelona in 1910 as an anarcho-syndicalist trade-union confederation. Confederacion Nacional del Trabajo draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 SPR_fundamentalism_party: "Iglesia Española Episcopal"
 SPR_fundamentalism_party_long: "Iglesia Española Episcopal\n§YFounded: 1880§!\n§LThe Spanish Reforms Episcopal Church is organized in the late nineteenth century by Spanish Protestant reformers and is formally constituted in 1880.\n\nIt is a small religious denomination. Iglesia Española Episcopal draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 GAL_autocracy_party: "House of Bourbon"
 GAL_autocracy_party_long: "House of Bourbon\n§YFounded: 1272§!\n§LThe House of Bourbon rules several European monarchies and branches of the house governs Spain and, until 1861, the Kingdom of the Two Sicilies. A Bourbon royal house is a dynasty.\n\nHouse of Bourbon bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 GAL_centrism_party: "Uniòn Liberal"
 GAL_centrism_party_long: "Uniòn Liberal\n§YFounded: 1858§!\n§LThe Liberal Union is a Spanish national centrist coalition creates around General Leopoldo O'Donnell in the 1850s, combining moderate Progressives with less doctrinaire Moderates. Uniòn Liberal brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
