 NVS_social_egalitarianism_party_long: "Reformers\n§YFounded: 1860§!\n§LThe Reformers brings together progressive reformers, workers, professionals, and social activists who argue that political liberty must be matched by wider social opportunity. The movement favors education, labor reform, broader participation in government, and a more active public role in confronting poverty and inequality.\n\nIts supporters regard reform as a means of strengthening society rather than overturning it. They press the established political order to answer the demands of industrialization and urban growth while competing with both laissez-faire liberals and revolutionary socialist currents.§!\n"
 NVS_centrism_party: "Liberal Branch of the Confederation Party"
 NVS_centrism_party_long: "Liberal Branch of the Confederation Party\n§YFounded: c. 1864§!\n§LThe Liberal Branch of the Confederation Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 NVS_radical_democracy_party: "Anti-Confederates"
 NVS_radical_democracy_party_long: "Anti-Confederates\n§YFounded: 1867§!\n§LNova Scotia's Anti-Confederation movement becomes the dominant organized opposition after the colony enters Confederation in 1867. With Joseph Howe as its most prominent leader, it argues that union is imposed without a popular mandate and seeks repeal or renegotiation of Nova Scotia's place in Canada.§!\n"
 NVS_traditional_conservatism_party: "Conservative Branch of the Confederation Party"
 NVS_traditional_conservatism_party_long: "Conservative Branch of the Confederation Party\n§YFounded: c. 1864§!\n§LThe Conservative Branch of the Confederation Party rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"
 NVS_autocracy_party: "British Crown"
 NVS_autocracy_party_long: "British Crown\n§YFounded: 1707§!\n§LBritish Crown is the legal and constitutional source of executive authority in Britain's colonies, represent locally by governors and responsible ministers as self-government develop. British Crown rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 NVS_chauvinist_populism_party: "Imperial Loyalists"
 NVS_chauvinist_populism_party_long: "Imperial Loyalists\n§YFounded: 1860§!\n§LSupporters of Imperial Loyalists channel regional interests and public loyalties into a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 NVS_anarchism_party: "Anarchist Circles"
 NVS_anarchism_party_long: "Anarchist Circles\n§YFounded: 1860§!\n§LAt the heart of Anarchist Circles is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 NVS_fundamentalism_party: "Diocese of Bathurst"
 NVS_fundamentalism_party_long: "Diocese of Bathurst\n§YFounded: 8 May 1860§!\n§LDiocese of Bathurst draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 NFL_ideology_social_liberalism_party: "Liberal Party"
 NFL_ideology_social_liberalism_party_long: "Liberal Party\n§YFounded: 1855§!\n§LNewfoundland's Liberal Party is one of the main parties of the responsible-government era. It draws substantial Catholic support in the 1850s, supports responsible government, and competes with the Conservatives in a political system where denominational identities and patronage remains unusually important.§!\n"
 NFL_ideology_radical_socialism_party: "Socialist Circles"
 NFL_ideology_radical_socialism_party_long: "Socialist Circles\n§YFounded: 3 November 1908§!\n§LThe Socialist Circles draws together workers, artisans, radical intellectuals, and organizers who see economic power as inseparable from political power. Its program stresses labor organization, social ownership or cooperation, and a decisive challenge to the privileges of wealth and inherited hierarchy.\n\nThe movement looks beyond ordinary constitutional reform and seeks a deeper transformation of society. Its supporters disagree over the pace and method of change, but share the conviction that the existing economic order leaves working people without the power or security promised by political liberty.§!\n"
 NFL_social_egalitarianism_party: "Liberal Reformers"
 NFL_social_egalitarianism_party_long: "Liberal Reformers\n§YFounded: 1850§!\n§LThe Liberal Reformers brings together progressive reformers, workers, professionals, and social activists who argue that political liberty must be matched by wider social opportunity. The movement favors education, labor reform, broader participation in government, and a more active public role in confronting poverty and inequality.\n\nIts supporters regard reform as a means of strengthening society rather than overturning it. They press the established political order to answer the demands of industrialization and urban growth while competing with both laissez-faire liberals and revolutionary socialist currents.§!\n"
 NFL_centrism_party: "Liberal Anti-Confederates"
 NFL_centrism_party_long: "Liberal Anti-Confederates\n§YFounded: 1865§!\n§LThe Liberal Anti-Confederates gathers constitutional liberals, commercial interests, lawyers, journalists, and reform-minded notables who want political change without revolutionary upheaval. The faction favors representative institutions, civil liberties, freer commerce, and gradual administrative reform.\n\nIts strength rests among urban professionals and local elites who see constitutional government as the surest road to a stronger and more modern state. The party balances its appetite for reform against the need to preserve stability, placing it between entrenched reaction and the revolutionary left.§!\n"
 NFL_radical_democracy_party: "Radical Reformers"
 NFL_radical_democracy_party_long: "Radical Reformers\n§YFounded: 1850§!\n§LThe Radical Reformers gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 NFL_traditional_conservatism_party: "Conservative Party"
 NFL_traditional_conservatism_party_long: "Conservative Party\n§YFounded: 1832§!\n§LNewfoundland's Conservative Party emerges in the responsible-government era as one of the colony's principal political organizations. In the 1850s and 1860s its support is strongly shaped by Protestant-Catholic and denominational divisions as well as debates over responsible government and Confederation.§!\n"
 NFL_autocracy_party: "British Crown"
 NFL_autocracy_party_long: "British Crown\n§YFounded: 1707§!\n§LBritish Crown is the legal and constitutional source of executive authority in Britain's colonies, represent locally by governors and responsible ministers as self-government develop. British Crown rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 NFL_chauvinist_populism_party: "Orange Order"
 NFL_chauvinist_populism_party_long: "Orange Order\n§YFounded: 1863§!\n§LThe Orange Order is a Protestant fraternal organization. In nineteenth-century British North America its lodges could exercise substantial electoral and social influence, especially among Irish Protestants, and are associated with loyalty to the British connection and resistance to Catholic political power.§!\n"
 NFL_anarchism_party: "Anarchist Circles"
 NFL_anarchism_party_long: "Anarchist Circles\n§YFounded: c. 1855§!\n§LAt the heart of Anarchist Circles is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 NFL_fundamentalism_party: "Diocese of St. John's"
 NFL_fundamentalism_party_long: "Diocese of St. John's\n§YFounded: 4 June 1847§!\n§LJohn's is the center of Roman Catholic ecclesiastical authority in Newfoundland, but the diocese is a church institution. Catholic clergy exercise significant political influence during the responsible-government era, particularly because electoral politics often follows denominational lines.§!\n"

 OFS_ideology_social_liberalism_party: "Vanguard Branch of the Volksraad"
 OFS_ideology_social_liberalism_party_long: "Vanguard Branch of the Volksraad\n§YFounded: 1854§!\n§LThe Volksraad is a real republican legislature. Political alignments in the Boer republics are personal, regional, religious, and issue-based. Its strength rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise.§!\n"
 OFS_ideology_radical_socialism_party: "Socialist Branch of the Volksraad"
 OFS_ideology_radical_socialism_party_long: "Socialist Branch of the Volksraad\n§YFounded: 1854§!\n§LThe Volksraad is a real republican legislature.\n\nPolitical alignments in the Boer republics are personal, regional, religious, and issue-based. Socialist Branch of the Volksraad brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 OFS_social_egalitarianism_party: "Progressive Volksraad"
 OFS_social_egalitarianism_party_long: "Progressive Volksraad\n§YFounded: 1854§!\n§LThe Volksraad is a real republican legislature. Political alignments in the Boer republics are personal, regional, religious, and issue-based. Progressive Volksraad brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 OFS_centrism_party: "Liberal Branch of the Volksraad"
 OFS_centrism_party_long: "Liberal Branch of the Volksraad\n§YFounded: 1854§!\n§LThe Volksraad is a real republican legislature. Political alignments in the Boer republics are personal, regional, religious, and issue-based. Liberal Branch of the Volksraad brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 OFS_radical_democracy_party: "Independent Burghers"
 OFS_radical_democracy_party_long: "Independent Burghers\n§YFounded: 1854§!\n§LThe Independent Burghers gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 OFS_traditional_conservatism_party: "Conservative Branch of the Volksraad"
 OFS_traditional_conservatism_party_long: "Conservative Branch of the Volksraad\n§YFounded: 1854§!\n§LThe Volksraad is a real republican legislature. Political alignments in the Boer republics are personal, regional, religious, and issue-based. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 OFS_autocracy_party: "Royalist Branch of the Volksraad"
 OFS_autocracy_party_long: "Royalist Branch of the Volksraad\n§YFounded: 1854§!\n§LThe Volksraad is a real republican legislature.\n\nPolitical alignments in the Boer republics are personal, regional, religious, and issue-based. Royalist Branch of the Volksraad gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 OFS_chauvinist_populism_party: "Boer Nationalists"
 OFS_chauvinist_populism_party_long: "Boer Nationalists\n§YFounded: 1854§!\n§LThe Orange Free State is governed through an elected Volksraad and a small burgher political community. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 OFS_anarchism_party: "Anarchist Circles"
 OFS_anarchism_party_long: "Anarchist Circles\n§YFounded: c. 1880s§!\n§LThe Orange Free State is governed through an elected Volksraad and a small burgher political community. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 OFS_fundamentalism_party: "Dutch Reformed Church"
 OFS_fundamentalism_party_long: "Dutch Reformed Church\n§YFounded: 30 November 1848§!\n§LThe Dutch Reforms Church is a central religious institution among the Boer population of southern Africa. Dutch Reforms Church draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 TRV_ideology_social_liberalism_party: "Lydenburg Liberals"
 TRV_ideology_social_liberalism_party_long: "Lydenburg Liberals\n§YFounded: c. 1854§!\n§LEarly Transvaal politics revolves around the Volksraad, commandos, regional leaders, churches, and personal factions such as those surrounding Pretorius. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 TRV_ideology_radical_socialism_party: "Socialist Circles"
 TRV_ideology_radical_socialism_party_long: "Socialist Circles\n§YFounded: 1908§!\n§LEarly Transvaal politics revolves around the Volksraad, commandos, regional leaders, churches, and personal factions such as those surrounding Pretorius. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 TRV_social_egalitarianism_party: "Volksraad Progressives"
 TRV_social_egalitarianism_party_long: "Volksraad Progressives\n§YFounded: 1848§!\n§LThe Volksraad is a real republican legislature. Political alignments in the Boer republics are personal, regional, religious, and issue-based. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 TRV_centrism_party: "Liberal Branch of the Volksraad"
 TRV_centrism_party_long: "Liberal Branch of the Volksraad\n§YFounded: 1848§!\n§LThe Volksraad is a real republican legislature. Political alignments in the Boer republics are personal, regional, religious, and issue-based. Liberal Branch of the Volksraad brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 TRV_radical_democracy_party: "Voortrekkers"
 TRV_radical_democracy_party_long: "Voortrekkers\n§YFounded: c. 1835§!\n§LThe Voortrekkers are Dutch-speaking settlers who leave the Cape Colony in the Great Trek of the 1830s and 1840s and found several Boer republics.§!\n"
 TRV_traditional_conservatism_party: "Conservative Branch of the Volksraad"
 TRV_traditional_conservatism_party_long: "Conservative Branch of the Volksraad\n§YFounded: 1848§!\n§LThe Volksraad is a real republican legislature. Political alignments in the Boer republics are personal, regional, religious, and issue-based. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 TRV_autocracy_party: "Pretorius Supporters"
 TRV_autocracy_party_long: "Pretorius Supporters\n§YFounded: c. 1848§!\n§LAndries Pretorius and later his son Marthinus Wessel Pretorius are central figures in early Boer republican politics, and supporters organize around leadership, regional interests, and disputes over the consolidation of the South African Republic.§!\n"
 TRV_chauvinist_populism_party: "Boer Nationalists"
 TRV_chauvinist_populism_party_long: "Boer Nationalists\n§YFounded: 1880§!\n§LEarly Transvaal politics revolves around the Volksraad, commandos, regional leaders, churches, and personal factions such as those surrounding Pretorius. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 TRV_anarchism_party: "Anarchist Circles"
 TRV_anarchism_party_long: "Anarchist Circles\n§YFounded: c. 1880s§!\n§LEarly Transvaal politics revolves around the Volksraad, commandos, regional leaders, churches, and personal factions such as those surrounding Pretorius. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 TRV_fundamentalism_party: "Nederduitsch Hervormde Kerk"
 TRV_fundamentalism_party_long: "Nederduitsch Hervormde Kerk\n§YFounded: 8 August 1853§!\n§LNederduitsch Hervormde Kerk becomes closely associated with the South African Republic and is recognized in the 1858 constitution as the state's established Reformed church. Nederduitsch Hervormde Kerk draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 GRE_ideology_radical_socialism_party: "Radical Socialist Party"
 GRE_ideology_radical_socialism_party_long: "Radical Socialist Party\n§YFounded: 1876§!\n§LThe Radical Socialist Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 GRE_social_egalitarianism_party: "Socialist Party"
 GRE_social_egalitarianism_party_long: "Socialist Party\n§YFounded: 1876§!\n§LThe Socialist Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 GRE_centrism_party: "English Party"
 GRE_centrism_party_long: "English Party\n§YFounded: 1824§!\n§LThe English Party is one of the three great foreign-aligned political groupings of early independent Greece, alongside the French and Russian parties. Associated with leaders such as Alexandros Mavrokordatos, it favors close relations with Britain and tends to support constitutional and comparatively liberal state-building. Its influence rests on personal patronage, elite networks, and regional loyalties.§!\n"
 GRE_radical_democracy_party: "Russian Party"
 GRE_radical_democracy_party_long: "Russian Party\n§YFounded: 1825§!\n§LThe Russian Party is one of the three principal factions of early independent Greece and draws particular support from conservative and Orthodox circles that favor close relations with the Russian Empire. Like the English and French parties, its influence rests on patronage, regional loyalties, and close ties to Orthodox conservative circles.§!\n"
 GRE_autocracy_party: "House of Wittelsbach"
 GRE_autocracy_party_long: "House of Wittelsbach\n§YFounded: 1832§!\n§LThe House of Wittelsbach is Bavaria's ruling dynasty until 1918 and also supplies King Otto of Greece from 1832 to 1862. House of Wittelsbach bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 GRE_traditional_conservatism_party: "French Party"
 GRE_traditional_conservatism_party_long: "French Party\n§YFounded: 1824§!\n§LThe French Party is one of the three principal political groupings of early independent Greece. Associated above all with Ioannis Kolettis, it looks to France as Greece's preferred great-power patron and operates through personal, regional, and patronage networks.§!\n"
 GRE_anarchism_party: "Hellenic Anarchist"
 GRE_anarchism_party_long: "Hellenic Anarchist\n§YFounded: 1876§!\n§LHellenic Anarchist draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 GRE_chauvinist_populism_party: "Hellenic Nationalist Party"
 GRE_chauvinist_populism_party_long: "Hellenic Nationalist Party\n§YFounded: 1865§!\n§LThe Hellenic Nationalist Party gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 GRE_autocracy_house_glucksburg: "House Glücksburg"
 GRE_autocracy_house_glucksburg_long: "House Glücksburg\n§YFounded: 1863§!\n§LThe Greek branch of the House of Glücksburg begins when the Danish prince William is chosen as King George I of the Hellenes in 1863 after the deposition of Otto. His dynasty rules Greece, with interruptions, until the abolition of the monarchy in the twentieth century; it is the royal house.§!\n"
 GRE_autocracy_house_saxe_coburg: "Saxe-Coburg Gotha"
 GRE_autocracy_house_saxe_coburg_long: "Saxe-Coburg Gotha\n§YFounded: 1826§!\n§LThe House of Saxe-Coburg and Gotha supplies monarchs to several nineteenth-century European states. Saxe-Coburg Gotha rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 GRE_autocracy_junta: "Military Junta"
 GRE_autocracy_junta_long: "Military Junta\n§YFounded: October 1862§!\n§LGreece experiences repeated military interventions in politics. Its strength rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise.§!\n"
 GRE_autocracy_council: "Greek Council"
 GRE_autocracy_council_long: "Greek Council\n§YFounded: October 1862§!\n§LEarly Greek government operates through the crown, ministries, parliament, court networks, and the English, French, and Russian patronage factions; Greek Council rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 GRE_autocracy_bavaria_barty: "Bavarian Party"
 GRE_autocracy_bavaria_barty_long: "The Bavaria Party\n§YFounded: 1833§!\n§LThe Bavaria Party rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"

 BRA_autocracy_party: "House of Bragança"
 BRA_autocracy_party_long: "House of Bragança\n§YFounded: 30 December 1442§!\n§LThe House of Braganza is the ruling dynasty of independent Brazil from 1822 to 1889, first under Pedro I and then Pedro II. Imperial Brazilian politics operates through the constitutional monarchy and organizes Liberal and Conservative parties; the dynasty itself is the royal house.§!\n"
 BRA_radical_democracy_party: "Conservatives (Reactionary)"
 BRA_radical_democracy_party_long: "Conservative Party (Reactionary)\n§YFounded: 1836§!\n§LBrazil's Conservative Party emerges in the late 1830s and becomes, with the Liberals, one of the two great parties of the Empire. It favors political order, a strong central state, the monarchy, and the interests of major landowners. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 BRA_traditional_conservatism_party: "Conservatives (Moderates)"
 BRA_traditional_conservatism_party_long: "Conservative Party (Moderates)\n§YFounded: 1836§!\n§LBrazil's Conservative Party emerges in the late 1830s and becomes, with the Liberals, one of the two great parties of the Empire. It favors political order, a strong central state, the monarchy, and the interests of major landowners. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 BRA_centrism_party: "Liberals (Moderates)"
 BRA_centrism_party_long: "Liberal Party (Moderates)\n§YFounded: 1837§!\n§LBrazil's Liberal Party takes shape in the late 1830s and alternates in office with the Conservatives under the constitutional monarchy. Liberals generally favor greater provincial autonomy and political reform, although the party remain an elite organization and shared many social assumptions with its Conservative rivals.§!\n"
 BRA_ideology_social_liberalism_party: "Liberals (Radicals)"
 BRA_ideology_social_liberalism_party_long: "Liberal Party (Radicals)\n§YFounded: 1837§!\n§LBrazil's Liberal Party takes shape in the late 1830s and alternates in office with the Conservatives under the constitutional monarchy. Liberals generally favor greater provincial autonomy and political reform, although the party remain an elite organization and shared many social assumptions with its Conservative rivals.§!\n"
 BRA_anarchism_party: "Brazilian Anarchists"
 BRA_anarchism_party_long: "Brazilian Anarchists\n§YFounded: 1892§!\n§LAnarchism becomes an important current in the Brazilian labor movement mainly from the late nineteenth century into the early twentieth, especially among urban workers and immigrant communities. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 BRA_fundamentalism_party: "Brazilian Apostolic Catholic Church"
 BRA_fundamentalism_party_long: "Brazilian Apostolic Catholic Church\n§YFounded: 3 July 1945§!\n§LThe Brazilian Catholic Apostolic Church is founded in 1945 by the excommunicated bishop Carlos Duarte Costa. Brazilian Apostolic Catholic Church draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 BRA_social_egalitarianism_party: "Progressives"
 BRA_social_egalitarianism_party_long: "Progressive League\n§YFounded: 6 June 1864§!\n§LBrazil's Progressive League emerges in the early 1860s as a parliamentary coalition of moderate Liberals and dissident Conservatives. Progressive League brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"

 URG_traditional_conservatism_party: "Partido Nacional"
 URG_traditional_conservatism_party_long: "Partido Nacional\n§YFounded: 10 August 1836§!\n§LUruguay's National Party, historically the Blanco Party, originates around Manuel Oribe's followers in the 1830s. It draws particular strength from rural and conservative interests, and its long rivalry with the Colorados is a central axis of Uruguayan politics and civil conflict.§!\n"
 URG_centrism_party: "Partido Colorado"
 URG_centrism_party_long: "Partido Colorado\n§YFounded: 17 September 1836§!\n§LUruguay's Colorado Party originates in the 1830s around followers of Fructuoso Rivera and becomes one of the country's two historic parties. Its rivalry with the Blancos shapes the Uruguayan civil wars and continues to define national politics long after the mid-nineteenth century.§!\n"
 URG_anarchism_party: "Anarquistas Platences"
 URG_anarchism_party_long: "Anarquistas Platences\n§YFounded: 1872§!\n§LAt the heart of Anarquistas Platences is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 URG_fundamentalism_party: "Conferencia Episcopal de Uruguay"
 URG_fundamentalism_party_long: "Conferencia Episcopal de Uruguay\n§YFounded: c. 1958§!\n§LThe Catholic hierarchy in Uruguay exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

 # Japan
 TSH_tokugawa_shogunate_absolute_party: "Bakufu Tokugawa"
 TSH_tokugawa_shogunate_absolute_party_long: "Bakufu Tokugawa Faction\n§YFounded: 1603§!\n§LDuring the late shogunate, senior Tokugawa branches, domain lords, and bakufu officials form shifting factions around succession, reform, foreign policy, and the survival of shogunal authority.§!\n"
 TSH_tokugawa_shogunate_hito_party: "Bakufu Hitosubashi"
 TSH_tokugawa_shogunate_hito_party_long: "Bakufu Hitosubashi Faction\n§YFounded: 1735§!\n§LDuring the late shogunate, senior Tokugawa branches, domain lords, and bakufu officials form shifting factions around succession, reform, foreign policy, and the survival of shogunal authority.§!\n"
 TSH_tokugawa_shogunate_kii_party: "Bakufu Kii"
 TSH_tokugawa_shogunate_kii_party_long: "Bakufu Kii Faction\n§YFounded: 1619§!\n§LDuring the late shogunate, senior Tokugawa branches, domain lords, and bakufu officials form shifting factions around succession, reform, foreign policy, and the survival of shogunal authority.§!\n"
 TSH_westerning_party: "Tokugawa Bakumatsu"
 TSH_westerning_party_long: "Tokugawa Shogunate of Nippon\n§YFounded: 1603§!\n§LThe Tokugawa shogunate is Japan's military government from 1603 to 1867. Political authority rests with the shogun, the Tokugawa house, the domain lords, and a status-based bureaucracy; it is a regime and administrative order.§!\n"
 TSH_imperial_house_party: "Sonno Joi Party"
 TSH_imperial_house_party_long: "Imperial House of Nippon\n§YFounded: c. 500§!\n§LJapan's Imperial House is the hereditary dynasty of the Japanese monarchy. During the late Tokugawa era the emperor remains at Kyoto with major ritual legitimacy but limited direct political power; imperial loyalists later make restoration of imperial government the central principle of the Meiji Restoration.§!\n"
 TSH_freedom_party: "Jiyū Minken Undō"
 TSH_freedom_party_long: "Freedom and People's Rights Party (Jiyū Minken Undō)\n§YFounded: 1874§!\n§LThe Freedom and People's Rights Movement is a broad Japanese political movement of the 1870s and 1880s demanding an elects national assembly, a constitution, and expands political participation.\n\nThe movement produces influential organizations such as Itagaki Taisuke's Liberal Party in 1881 and helps place constitutional government and representative institutions at the center of Japanese political debate.§!\n"
 TSH_fundamentalism_party: "Buddhist Fundamentals"
 TSH_fundamentalism_party_long: "Buddhist Fundamentalist Party\n§YFounded: 1868§!\n§LThe Buddhist Fundamentalist Party draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 TSH_social_egalitarianism_party: "Liberal Party"
 TSH_social_egalitarianism_party_long: "Liberal Party of Nippon\n§YFounded: 18 October 1881§!\n§LThe Liberal Party of Nippon brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 TSH_centrism_party: "Taiseikai"
 TSH_centrism_party_long: "Taiseikai\n§YFounded: 1890§!\n§LTaiseikai is a Japanese political party forms in 1890 around supporters of the government and conservative parliamentary interests during the opening of the Imperial Diet. Taiseikai brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 TSH_anarchism_party: "Anakizumu"
 TSH_anarchism_party_long: "Anakizumu\n§YFounded: 1906§!\n§LAnakizumu draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 TSH_shinto_party: "Shinto Fundamentalists"
 TSH_shinto_party_long: "Shinto Fundamentalists\n§YFounded: 13 March 1868§!\n§LThe Shinto Fundamentalists gathers the local notables, activists, institutional interests, and personal networks that sustain its political influence. Its leaders seek to turn these connections into a coherent voice capable of shaping appointments, legislation, and the wider direction of government.\n\nThe movement draws strength from the loyalties of its supporters rather than from a rigid national machine. Its future depends on whether those scattered interests can be held together as political competition becomes more organized and the demands placed upon the state continue to grow.§!\n"
 JAP_autocracy_party: "Japanese Oligarchs"
 JAP_autocracy_party_long: "The Yamato Imperial Dynasty\n§YFounded: c. 500§!\n§LJapan's Imperial House is the hereditary dynasty of the Japanese monarchy. During the late Tokugawa era the emperor remains at Kyoto with major ritual legitimacy but limited direct political power; imperial loyalists later make restoration of imperial government the central principle of the Meiji Restoration.§!\n"
 JAP_centrism_party: "Jiyū Minken Undō"
 JAP_centrism_party_long: "Freedom and People's Rights Party (Jiyū Minken Undō)\n§YFounded: 1874§!\n§LThe Freedom and People's Rights Movement is a broad Japanese political movement of the 1870s and 1880s demanding an elects national assembly, a constitution, and expands political participation.\n\nThe movement produces influential organizations such as Itagaki Taisuke's Liberal Party in 1881 and helps place constitutional government and representative institutions at the center of Japanese political debate.§!\n"
