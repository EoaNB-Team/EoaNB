 LCK_ideology_social_liberalism_party: "Fraktion der Handwerker"
 LCK_ideology_social_liberalism_party_long: "Fraktion der Handwerker\n§YFounded: c. 1848§!\n§LFraktion der Handwerker occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 LCK_traditional_conservatism_party: "Fraktion der Gelehrten"
 LCK_traditional_conservatism_party_long: "Fraktion der Gelehrten\n§YFounded: c. 1848§!\n§LFraktion der Gelehrten rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"
 LCK_radical_democracy_party: "Fraktion der Grundbesitzer"
 LCK_radical_democracy_party_long: "Fraktion der Grundbesitzer\n§YFounded: c. 1848§!\n§LFraktion der Grundbesitzer gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"

 GEC_ideology_social_liberalism_party_long: "Deutsche Volkspartei\n§YFounded: 1868§!\n§LDeutsche Volkspartei is founded in 1868 from democratic and leaves-liberal currents in southern Germany. It opposes Prussian domination of German unification, favors federalism and parliamentary reform, and continues the political traditions of many southern German democrats of 1848.§!\n"
 GEC_ideology_social_liberalism_party: "DVP"

 SKT_autocracy_party: "House of Dan Fodio"
 SKT_autocracy_party_long: "House of Dan Fodio\n§YFounded: 1804§!\n§LThe descendants of Usman dan Fodio supply the caliphs and many ruling elites of the Sokoto Caliphate created by the jihad of 1804-1808.\n\nAuthority rests on emirates, Islamic scholarship, and dynastic-religious legitimacy. House of Dan Fodio bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

