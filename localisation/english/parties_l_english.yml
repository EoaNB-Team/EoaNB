 GUA_centrism_party_long: "Partido Liberal\n§YFounded: 1848§!\n§LLiberal movements generally promotes constitutional government, limits on inherited corporate privilege, freer commerce, and varying degrees of secular reform. Partido Liberal brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
