 ASA_chauvinist_populism_party_long: "Pan-America League\n§YFounded: c. 1857§!\n§LThe Pan-America League gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 ASA_chauvinist_populism_party: "Pan-Americanists"
 ASA_populist_party_long: "Populist Party\n§YFounded: 1892§!\n§LThe People's Party, commonly called the Populist Party, emerges from the Farmers' Alliance and related agrarian reform movements and organizes nationally in the early 1890s. Its Omaha Platform demands measures such as railroad regulation or public control, monetary expansion, a graduated income tax, and political reforms intended to curb concentrated economic power.§!\n"
 ASA_populist_party: "Populists"
 ASA_autocracy_party_long: "McClellan Personality Cult\n§YFounded: c. 1857§!\n§LMcClellan Personality Cult rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 ASA_autocracy_party: "McClellanites"
 ASA_progressive_party_long: "Progressive Party\n§YFounded: 1913§!\n§LThe Progressive Party of 1912, popularly called the Bull Moose Party, is organized by supporters of Theodore Roosevelt after his break with the Republican Party. It advocates direct-democratic reforms, tighter corporate regulation, labor protections, social insurance, and an expanded federal role in economic and social policy.§!\n"
 ASA_progressive_party: "Progressives"
 ASA_fundamentalism_party_long: "American Peace Society\n§YFounded: 1828§!\n§LThe American Peace Society is founded in 1828 by the consolidation of several local peace societies, with William Ladd among its central organizers. American Peace Society draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 ASA_fundamentalism_party: "Christian Pacifists"
