 NAS_autocracy_party: "Haus von Nassau"
 NAS_autocracy_party_long: "Haus von Nassau\n§YFounded: 1093§!\n§LThe House of Nassau rules the Duchy of Nassau until its annexation by Prussia in 1866.\n\nDuke Adolphe later becomes Grand Duke of Luxembourg in 1890, beginning the Nassau-Weilburg line there; the house is a dynasty. Haus von Nassau bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
