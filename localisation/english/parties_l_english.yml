 GUA_anarchism_party_long: "Anarquistas Centro Americanos\n§YFounded: c. 1900§!\n§LAt the heart of Anarquistas Centro Americanos is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 GUA_fundamentalism_party: "Conferencia Episcopal de Guatemala"
 GUA_fundamentalism_party_long: "Conferencia Episcopal de Guatemala\n§YFounded: c. 1958§!\n§LThe Catholic hierarchy in Guatemala exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

 PRU_social_egalitarianism_party: "Partido Civilsta"
 PRU_social_egalitarianism_party_long: "Partido Civilsta\n§YFounded: 1871§!\n§LPeru's Civil Party, or Partido Civil, is founded in 1871 around Manuel Pardo as a civilian alternative to the long dominance of military caudillos. Pardo wins the presidency in 1872, and Civilismo becomes one of Peru's most influential political movements of the late nineteenth and early twentieth centuries.§!\n"
 PRU_centrism_party: "Partido Costitutional"
 PRU_centrism_party_long: "Partido Costitutional\n§YFounded: 1882§!\n§LPeru's Constitutional Party is founded in the 1880s around General Andrés Avelino Cáceres after the War of the Pacific. Partido Costitutional brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 PRU_chauvinist_populism_party: "Miltary Junta"
 PRU_chauvinist_populism_party_long: "Miltary Junta\n§YFounded: c. 1871§!\n§LThe political weight of Miltary Junta rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise. Its political weight rests on command of the armed forces and the loyalty of the officer corps, allowing military authority to become decisive whenever civilian institutions fail to contain a national crisis.§!\n"
 PRU_anarchism_party: "Anarquistas de los Andes"
 PRU_anarchism_party_long: "Anarquistas de los Andes\n§YFounded: 1904§!\n§LAt the heart of Anarquistas de los Andes is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 PRU_fundamentalism_party: "Conferencia Episcopal de Peru"
 PRU_fundamentalism_party_long: "Conferencia Episcopal de Peru\n§YFounded: c. 1946§!\n§LThe Catholic hierarchy in Peru exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

 HAW_autocracy_party: "House of Kamehameha"
 HAW_autocracy_party_long: "House of Kamehameha\n§YFounded: 1795§!\n§LThe House of Kamehameha rules the Hawaiian Kingdom from its unification under Kamehameha I until the death of Kamehameha V in 1872. House of Kamehameha bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 HAW_chauvinist_populism_party: "Hawaiian League"
 HAW_chauvinist_populism_party_long: "Hawaiian League\n§YFounded: January 1887§!\n§LThe Hawaiian League is a secret political organization that forms in the 1880s largely by American and European businessmen and their allies in the Hawaiian Kingdom. Backed by the Honolulu Rifles, it forces King Kalākaua to accept the 1887 'Bayonet Constitution,' which sharply reduces royal power and restricts the political rights of many Native Hawaiian and Asian residents.§!\n"
 HAW_anarchism_party: "Polynesian Anarchist"
 HAW_anarchism_party_long: "Polynesian Anarchist\n§YFounded: c. 1840§!\n§LPolynesian Anarchist draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"

 OTO_autocracy_party: "House of Osman"
 OTO_autocracy_party_long: "House of Osman\n§YFounded: c. 1299§!\n§LThe House of Osman is the Ottoman imperial dynasty, ruling from the late thirteenth century until the abolition of the sultanate in 1922. In the nineteenth century the sultan remains the dynastic center of an empire increasingly governs through ministries, bureaucracy, provincial administration, and Tanzimat reforms.§!\n"
 OTO_chauvinist_populism_party: "Committee of Ottoman Union"
 OTO_chauvinist_populism_party_long: "Committee of Ottoman Union\n§YFounded: 2 June 1889§!\n§LThe Committee of Ottoman Union gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 OTO_fundamentalism_party: "Seriat Government"
 OTO_fundamentalism_party_long: "Seriat Government\n§YFounded: c. 1856§!\n§LOttoman governance combines sultanic law, sharia institutions, the ulema hierarchy, and imperial bureaucracy; Seriat Government draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 OTO_centrism_party: "Young Ottomans"
 OTO_centrism_party_long: "Young Ottomans\n§YFounded: 1865§!\n§LThe Young Ottomans are a circle of Ottoman intellectuals and officials form in the 1860s who seek to reconcile constitutional government with Ottoman and Islamic political traditions. Writers such as Namık Kemal criticizes bureaucratic absolutism and helps prepare the intellectual ground for the Ottoman constitution of 1876.§!\n"
 OTO_traditional_conservatism_party: "The Sublime Porte"
 OTO_traditional_conservatism_party_long: "The Sublime Porte\n§YFounded: c. 1650§!\n§LThe Sublime Porte is the central government and ministerial bureaucracy of the Ottoman Empire, named for the gate of the grand vizier's offices in Istanbul. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"

 KOR_autocracy_party: "House of Lee"
 KOR_autocracy_party_long: "House of Lee\n§YFounded: 1392§!\n§LKorea is ruled by the Joseon dynasty of the Jeonju Yi clan from 1392 to 1910; House of Lee bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites.\n\nSupporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

#MOL_autocracy_party: "House of Sturdza"

 LUX_autocracy_party: "House of Nassau-Weilburg"
 LUX_autocracy_party_long: "House of Nassau-Weilburg\n§YFounded: 1344§!\n§LThe House of Nassau-Weilburg becomes Luxembourg's reigning dynasty in 1890 when Grand Duke Adolphe succeeds after the end of the personal union with the Dutch crown. House of Nassau-Weilburg bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites.\n\nSupporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

 HOL_autocracy_party: "House of Oranje-Nassau"
 HOL_autocracy_party_long: "House of Oranje-Nassau\n§YFounded: 15 July 1544§!\n§LThe House of Orange-Nassau becomes the royal dynasty of the Netherlands in 1815. In the nineteenth-century constitutional monarchy the king remains an important political actor, but the dynasty stands apart from the increasingly organized liberal, conservative, Protestant, and Catholic party currents.§!\n"
 HOL_social_egalitarianism_party: "Liberalen"
 HOL_social_egalitarianism_party_long: "Liberalen\n§YFounded: 1881§!\n§LDutch Liberals dominate much mid-nineteenth-century parliamentary reform after the Constitution of 1848, but for decades they remain loose personal and political coalitions. Thorbecke's followers are especially influential in shaping this liberal constitutional tradition.§!\n"
 HOL_centrism_party: "Thorbeckianen"
 HOL_centrism_party_long: "Thorbeckianen\n§YFounded: 13 February 1849§!\n§LThe Thorbeckians are the liberal parliamentary followers of Johan Rudolph Thorbecke, architect of the Dutch constitutional reform of 1848. They are a loose personal and ideological grouping. Thorbeckianen brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 HOL_traditional_conservatism_party: "Anti-Revolutionairen"
 HOL_traditional_conservatism_party_long: "Anti-Revolutionairen\n§YFounded: 1840§!\n§LThe Dutch Anti-Revolutionary current grows from orthodox Protestant opposition to the secular principles of the French Revolution and to liberal state-building. In the mid-nineteenth century it is a movement. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 HOL_fundamentalism_party: "Nederlandsche Hervormde Kerk"
 HOL_fundamentalism_party_long: "Nederlandsche Hervormde Kerk\n§YFounded: 1816§!\n§LThe Dutch Reforms Church is the largest Protestant denomination in the nineteenth-century Netherlands and retains a privileged historical relationship with the state even after constitutional liberalization.\n\nNederlandsche Hervormde Kerk draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 HOL_anarchism_party: "Anarchisten"
 HOL_anarchism_party_long: "Anarchisten\n§YFounded: c. 1885§!\n§LAt the heart of Anarchisten is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 HOL_chauvinist_populism_party: "Chauvinisten"
 HOL_chauvinist_populism_party_long: "Chauvinisten\n§YFounded: c. 1848§!\n§LChauvinisten gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 HOL_ideology_social_liberalism_party: "Revolutionaire Voorhoede"
 HOL_ideology_social_liberalism_party_long: "Revolutionaire Voorhoede\n§YFounded: c. 1848§!\n§LRevolutionaire Voorhoede occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 HOL_ideology_radical_socialism_party: "Collectieve Socialisten"
 HOL_ideology_radical_socialism_party_long: "Collectieve Socialisten\n§YFounded: 7 July 1878§!\n§LOrganized socialism develops through local workers' societies, the Social Democratic League from 1881, and later the Social Democratic Workers' Party. Collectieve Socialisten brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 HOL_radical_democracy_party: "Radicaal Democraten"
 HOL_radical_democracy_party_long: "Radicaal Democraten\n§YFounded: 1848§!\n§LRadicaal Democraten gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 HOL_traditional_conservatism_party_ARP: "ARP"
 HOL_traditional_conservatism_party_ARP_long: "Anti-Revolutionaire Partij\n§YFounded: 3 April 1879§!\n§LThe Anti-Revolutionary Party is founded in 1879 under Abraham Kuyper and is generally regards as the Netherlands' first modern nationwide political party. It represents orthodox Protestant politics, defends confessional education, and becomes a pillar of the later system of Dutch denominational politics.§!\n"
 HOL_ideology_social_liberalism_party_SDB_long: "Sociaal-Democratische Bond\n§YFounded: 19 March 1882§!\n§LThe Sociaal-Democratische Bond is founded in 1881 and become the first important national socialist organization in the Netherlands. Under Ferdinand Domela Nieuwenhuis it moves increasingly toward revolutionary and anti-parliamentary positions, and divisions over electoral participation eventually helps produce the Social Democratic Workers' Party in 1894.§!\n"
 HOL_ideology_social_liberalism_party_SDB: "SDB"
 HOL_ideology_radical_socialism_SDV_long: "Sociaal-Democratische Vereeniging\n§YFounded: 7 July 1878§!\n§LThe name Sociaal-Democratische Vereeniging belongs to pioneering Dutch socialist associations in the late nineteenth century. An early workers' association adopts the name and the Gotha socialist program in 1878, while an Amsterdam socialist group again uses it in 1894 before participating in the formation of the SDAP.§!\n"
 HOL_ideology_radical_socialism_SDV: "SDV"

 PER_autocracy_party: "House of Qajar"
 PER_autocracy_party_long: "House of Qajar\n§YFounded: 1789§!\n§LThe House of Qajar rules Iran from 1789 to 1925. Nineteenth-century Qajar government rests on the shah, court, provincial governors, tribal and military networks, and bargaining with the powerful Shi'a clergy.\n\nHouse of Qajar bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 PER_fundamentalism_party: "Ulema"
 PER_fundamentalism_party_long: "Ulema\n§YFounded: c. 8th century§!\n§LUlema are the learned Shi'a clergy and jurists of Qajar Iran. Their authority rests on religious learning, courts, mosques, endowments, and networks independent of the state, giving leading clerics substantial influence in public disputes and later in the Constitutional Revolution.§!\n"

 OMA_autocracy_party: "House of Al Said"
 OMA_autocracy_party_long: "House of Al Said\n§YFounded: 1744§!\n§LThe Al Bu Said dynasty rules Oman from 1744 onward. In the nineteenth century its sultans control a maritime empire linking Oman with Zanzibar and East African commerce, while dynastic divisions eventually separate the Omani and Zanzibari branches; it is a ruling house.§!\n"

 ETH_autocracy_party: "House of Solomon"
 ETH_autocracy_party_long: "House of Solomon\n§YFounded: 1270§!\n§LThe Ethiopian Solomonic dynasty claims descent from the biblical union of Solomon and the Queen of Sheba and provides the empire's monarchs for centuries. Nineteenth-century Ethiopian politics revolves around the emperor, regional nobles, church, and military followings.§!\n"

 AFG_autocracy_party: "House of Barakzai"
 AFG_autocracy_party_long: "House of Barakzai\n§YFounded: 1826§!\n§LThe House of Barakzai becomes the principal ruling house of Afghanistan under Dost Mohammad Khan in the nineteenth century. Its rulers seek to consolidate authority among competing tribal and regional interests while navigating pressure from the British and Russian empires; it is a dynasty.§!\n"

 QNG_autocracy_party: "House of Aisin-Gioro"
 QNG_autocracy_party_long: "House of Aisin-Gioro\n§YFounded: 1571§!\n§LThe Aisin Gioro clan is the Manchu imperial house of the Qing dynasty, which rules China from 1644 until the 1912 abdication. In the nineteenth century imperial authority operates through the court, banner institutions, civil bureaucracy, provincial officials, and the Confucian state.§!\n"
 QNG_traditional_conservatism_party: "Yángwù Reformers faction"
 QNG_traditional_conservatism_party_long: "Yángwù Reformers faction\n§YFounded: 1861§!\n§LThe Yangwu, or Self-Strengthening, movement is a loose coalition of Qing officials who from the 1860s seek to strengthen the dynasty by adopting Western military technology, arsenals, shipyards, schools, and selected industrial methods. It is an official reform tendency.§!\n"
 QNG_centrism_party: "Constitutionalists faction"
 QNG_centrism_party_long: "Constitutionalists faction\n§YFounded: 1898§!\n§LQing constitutionalism becomes an organized reform current mainly after the 1898 reform crisis and especially during the New Policies of the early twentieth century. Constitutionalists faction brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 QNG_social_egalitarianism_party: "Tongmenghui"
 QNG_social_egalitarianism_party_long: "Tongmenghui\n§YFounded: 20 August 1905§!\n§LThe Chinese Revolutionary Alliance, or Tongmenghui, is founded in Tokyo in 1905 under Sun Yat-sen by merging several anti-Qing revolutionary groups. It advocates overthrow of the Qing dynasty and establishment of a republic and becomes a principal precursor of the Kuomintang.§!\n"
 QNG_ideology_social_liberalism_party: "Progressive Party"
 QNG_ideology_social_liberalism_party_long: "Progressive Party\n§YFounded: 1913§!\n§LChina's Progressive Party is a Republican-era organization forms in 1913 through the merger of constitutionalist groups associated with figures including Liang Qichao. Progressive Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 QNG_ideology_radical_socialism_party: "Communist Party of China"
 QNG_ideology_radical_socialism_party_long: "Communist Party of China\n§YFounded: 23 July 1921§!\n§LThe Communist Party of China is founded in 1921 by Chinese Marxists influences by the May Fourth movement and the Russian Revolution. Communist Party of China brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 QNG_fundamentalism_party: "Duke Yansheng Restorationists"
 QNG_fundamentalism_party_long: "Duke Yansheng Restorationists\n§YFounded: c. 1861§!\n§LThe Duke Yansheng Restorationists draws political authority from clergy, religious scholars, devotional networks, and communities that look to faith as a foundation of public order. Its influence extends beyond worship into education, charity, family life, customary law, and the moral expectations placed upon government.\n\nSupporters seek to preserve the place of religion at the center of society and resist reforms they regard as hostile to established belief. Political action is therefore understood not simply as a contest for office, but as a defense of the spiritual and social order on which the community rests.§!\n"
 QNG_chauvinist_populism_party: "Blue Shirts Society"
 QNG_chauvinist_populism_party_long: "Blue Shirts Society\n§YFounded: 1932§!\n§LThe Blue Shirts Society is a secretive ultranationalist organization associated with the Kuomintang in the 1930s. Blue Shirts Society gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 QNG_anarchism_party: "New World Society"
 QNG_anarchism_party_long: "New World Society\n§YFounded: c. 1906§!\n§LThe New World Society draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 QNG_radical_democracy_party: "Beiyang Clique"
 QNG_radical_democracy_party_long: "Beiyang Clique\n§YFounded: 1912§!\n§LThe Beiyang Clique is the network of military leaders and officials that develop from Yuan Shikai's Beiyang Army in the late Qing and early Republic. After Yuan's death it fragments into rival warlord factions that dominate much of Chinese politics in the 1910s and 1920s.§!\n"

 TAI_ideology_social_liberalism_party: "Hong Rengan's Faction"
 TAI_ideology_social_liberalism_party_long: "Hong Rengan's Faction\n§YFounded: 1859§!\n§LHong Rengan, a cousin of Hong Xiuquan, becomes a senior Taiping leader after reaching Nanjing in 1859. His reform proposals in the New Treatise advocates administrative, technological, and economic innovations influences by his experience in Hong Kong.§!\n"
 TAI_fundamentalism_party: "Hong Xiuquan's Court"
 TAI_fundamentalism_party_long: "Hong Xiuquan's Court\n§YFounded: 1851§!\n§LHong Xiuquan is the Heavenly King and religious-political ruler of the Taiping Heavenly Kingdom.\n\nHis court at Nanjing combines a heterodox Christian theology with a highly centralized sacred monarchy; it is the regime's ruling court. Hong Xiuquan's Court draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 SIA_social_egalitarianism_party: "SD"
 SIA_social_egalitarianism_party_long: "SD\n§YFounded: c. 1855§!\n§LSD brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 SIA_centrism_party: "DA"
 SIA_centrism_party_long: "DA\n§YFounded: c. 1855§!\n§LDA brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 SIA_traditional_conservatism_party: "TC"
 SIA_traditional_conservatism_party_long: "TC\n§YFounded: c. 1855§!\n§LSupporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 SIA_autocracy_party: "House of Chakri"
 SIA_autocracy_party_long: "House of Chakri\n§YFounded: 6 April 1782§!\n§LThe House of Chakri rules Siam, later Thailand, from 1782 onward. In the nineteenth century kings Mongkut and Chulalongkorn pursue diplomatic and administrative reforms to preserve Siamese independence amid European imperial expansion; the dynasty is the monarchy.§!\n"

 MRN_autocracy_party: "House of Hova"
 MRN_autocracy_party_long: "House of Hova\n§YFounded: c. 1540§!\n§LThe Hova are a social and political stratum of the Merina kingdom of Madagascar.\n\nHouse of Hova bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

 VIN_autocracy_party: "House of Nguyen"
 VIN_autocracy_party_long: "House of Nguyen\n§YFounded: 1802§!\n§LThe Nguyễn dynasty rules Vietnam from 1802 to 1945. In the mid-nineteenth century Emperor Tự Đức presides over a Confucian monarchy facing internal rebellions, missionary disputes, and escalating French intervention; political authority rests in the court and bureaucracy.§!\n"

 JAI_fundamentalism_party: "Elementalists"
 JAI_fundamentalism_party_long: "Jarai Masters of the Elements\n§YFounded: c. 1857§!\n§LThe Jarai Masters of the Elements draws political authority from clergy, religious scholars, devotional networks, and communities that look to faith as a foundation of public order. Its influence extends beyond worship into education, charity, family life, customary law, and the moral expectations placed upon government.\n\nSupporters seek to preserve the place of religion at the center of society and resist reforms they regard as hostile to established belief. Political action is therefore understood not simply as a contest for office, but as a defense of the spiritual and social order on which the community rests.§!\n"
 JAI_water_tribe: "Water Tribe"
 JAI_water_tribe_long: "Masters of Water\n§YFounded: c. 1857§!\n§LMasters of Water gathers the local notables, activists, institutional interests, and personal networks that sustain its political influence. Its leaders seek to turn these connections into a coherent voice capable of shaping appointments, legislation, and the wider direction of government.\n\nThe movement draws strength from the loyalties of its supporters rather than from a rigid national machine. Its future depends on whether those scattered interests can be held together as political competition becomes more organized and the demands placed upon the state continue to grow.§!\n"
 JAI_fire_tribe: "Fire Tribe"
 JAI_fire_tribe_long: "Masters of Fire\n§YFounded: c. 1857§!\n§LMasters of Fire gathers the local notables, activists, institutional interests, and personal networks that sustain its political influence. Its leaders seek to turn these connections into a coherent voice capable of shaping appointments, legislation, and the wider direction of government.\n\nThe movement draws strength from the loyalties of its supporters rather than from a rigid national machine. Its future depends on whether those scattered interests can be held together as political competition becomes more organized and the demands placed upon the state continue to grow.§!\n"
 JAI_earth_tribe: "Earth Tribe"
 JAI_earth_tribe_long: "Masters of Earth\n§YFounded: c. 1857§!\n§LMasters of Earth gathers the local notables, activists, institutional interests, and personal networks that sustain its political influence. Its leaders seek to turn these connections into a coherent voice capable of shaping appointments, legislation, and the wider direction of government.\n\nThe movement draws strength from the loyalties of its supporters rather than from a rigid national machine. Its future depends on whether those scattered interests can be held together as political competition becomes more organized and the demands placed upon the state continue to grow.§!\n"
 JAI_wind_tribe: "Wind Tribe"
 JAI_wind_tribe_long: "Masters of Wind\n§YFounded: c. 1857§!\n§LMasters of Wind gathers the local notables, activists, institutional interests, and personal networks that sustain its political influence. Its leaders seek to turn these connections into a coherent voice capable of shaping appointments, legislation, and the wider direction of government.\n\nThe movement draws strength from the loyalties of its supporters rather than from a rigid national machine. Its future depends on whether those scattered interests can be held together as political competition becomes more organized and the demands placed upon the state continue to grow.§!\n"

 ACE_autocracy_party: "House of Aceh"
 ACE_autocracy_party_long: "House of Aceh\n§YFounded: 1496§!\n§LAceh in the nineteenth century is ruled by sultans of a complex courtly and aristocratic order. The sultanate remains an important independent Muslim state in northern Sumatra until the long Dutch-Aceh War begins in 1873; The sultan's court, aristocratic houses, and Islamic authority anchor Acehnese politics.§!\n"

 NEP_autocracy_party: "House of Shah"
 NEP_autocracy_party_long: "House of Shah\n§YFounded: 1559§!\n§LNepal's nineteenth-century royal dynasty is the Shah dynasty, founded in Gorkha and establishes over unified Nepal by Prithvi Narayan Shah. After 1846 effective power is largely holds by hereditary Rana prime ministers, while the Shah kings remain monarchs.§!\n"

 BHU_autocracy_party: "House of Palden"
 BHU_autocracy_party_long: "House of Palden\n§YFounded: 1627§!\n§LThe House of Palden bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

 BRM_autocracy_party: "House of Konbaung"
 BRM_autocracy_party_long: "House of Konbaung\n§YFounded: 29 February 1752§!\n§LThe House of Konbaung rules Burma from 1752 until the British annexation of the kingdom in 1885. Its nineteenth-century kings attempt administrative and military reform while fighting successive wars with the British Empire; the dynasty is the royal house.§!\n"

 MOR_autocracy_party: "House of Alaouite"
 MOR_autocracy_party_long: "House of Alaouite\n§YFounded: 1631§!\n§LThe House of Alaouite rules Morocco from the seventeenth century onward. Nineteenth-century Moroccan government centers on the sultan, makhzen administration, tribal relationships, religious legitimacy, and regional power.\n\nHouse of Alaouite bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

 EGY_autocracy_party: "House of Muhammad Ali"
 EGY_autocracy_party_long: "House of Muhammad Ali\n§YFounded: 1805§!\n§LThe dynasty founded by Muhammad Ali governs Egypt from the early nineteenth century until 1952, formally under Ottoman suzerainty for much of that period. Its rulers build a centralized army and bureaucracy and pursue economic and territorial ambitions; the dynasty is the ruling house.§!\n"

#ROM_autocracy_party: "House of Cuza"

 LBA_autocracy_party: "House of Osman"
 LBA_autocracy_party_long: "House of Osman\n§YFounded: c. 1299§!\n§LThe House of Osman is the Ottoman imperial dynasty. In nineteenth-century Libya the provinces of Tripolitania, Cyrenaica, and Fezzan are governed within the Ottoman imperial system, especially after direct Ottoman rule is restored in Tripoli in 1835; loyalty to the dynasty represents imperial authority.§!\n"
 
 TAI_fundamentalist_party: "God Worshipping Society"
 TAI_fundamentalist_party_long: "God Worshipping Society\n§YFounded: c. 1843§!\n§LThe God Worshipping Society is the religious movement founded around Hong Xiuquan's teachings in southern China in the 1840s. It becomes the organizational nucleus of the Taiping movement, whose forces proclaim the Taiping Heavenly Kingdom in 1851 and seize Nanjing in 1853.§!\n"
 TAI_autocracy_party: "House of Hong"
 TAI_autocracy_party_long: "House of Hong\n§YFounded: 1851§!\n§LThe Taiping Heavenly Kingdom is led by Hong Xiuquan, who proclaims himself the Heavenly King, and several of his relatives occupy senior positions in the regime.\n\nHouse of Hong bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

 MNT_autocracy_party: "House of Petrovic-Njegos"
 MNT_autocracy_party_long: "House of Petrovic-Njegos\n§YFounded: 1697§!\n§LThe Petrović-Njegoš dynasty rules Montenegro from the late seventeenth century until 1918, first through prince-bishops and later secular princes and kings. In the mid-nineteenth century Danilo I transforms the polity into a hereditary secular principality; the dynasty is the ruling house.§!\n"
 
 #Finland 
 FIN_autocracy_party: "Suomen Senaatti"
 FIN_autocracy_party_long: "Suomen Senaatti\n§YFounded: 18 August 1809§!\n§LThe Senate of Finland is the central governing institution of the autonomous Grand Duchy of Finland under the Russian emperor. It combines administrative and judicial functions and is staffed by Finnish officials; it is a state institution.§!\n"
 FIN_ideology_social_liberalism_party: "Wrightiläinen työväenliike"
 FIN_ideology_social_liberalism_party_long: "Wrightiläinen työväenliike\n§YFounded: 1883§!\n§LThe Wrightian labor movement in Finland refers to the late-nineteenth-century worker associations encourages by reform-minded employers and bourgeois figures before independent socialist organization becomes dominant. It belongs mainly to the 1880s and 1890s and is a social movement.§!\n"
 FIN_social_egalitarianism_party: "Unorganized"
 FIN_social_egalitarianism_party_long: "Unorganized\n§YFounded: 17 July 1899§!\n§LUnorganized brings together progressive reformers, workers, professionals, and social activists who argue that political liberty must be matched by wider social opportunity. The movement favors education, labor reform, broader participation in government, and a more active public role in confronting poverty and inequality.\n\nIts supporters regard reform as a means of strengthening society rather than overturning it. They press the established political order to answer the demands of industrialization and urban growth while competing with both laissez-faire liberals and revolutionary socialist currents.§!\n"
 FIN_ideology_radical_socialism_party: "Unorganized"
 FIN_ideology_radical_socialism_party_long: "Unorganized\n§YFounded: 17 July 1899§!\n§LUnorganized draws together workers, artisans, radical intellectuals, and organizers who see economic power as inseparable from political power. Its program stresses labor organization, social ownership or cooperation, and a decisive challenge to the privileges of wealth and inherited hierarchy.\n\nThe movement looks beyond ordinary constitutional reform and seeks a deeper transformation of society. Its supporters disagree over the pace and method of change, but share the conviction that the existing economic order leaves working people without the power or security promised by political liberty.§!\n"
 FIN_fundamentalism_party: "Unorganized"
 FIN_fundamentalism_party_long: "Unorganized\n§YFounded: c. 1860§!\n§LUnorganized draws political authority from clergy, religious scholars, devotional networks, and communities that look to faith as a foundation of public order. Its influence extends beyond worship into education, charity, family life, customary law, and the moral expectations placed upon government.\n\nSupporters seek to preserve the place of religion at the center of society and resist reforms they regard as hostile to established belief. Political action is therefore understood not simply as a contest for office, but as a defense of the spiritual and social order on which the community rests.§!\n"
 FIN_chauvinist_populism_party: "Unorganized"
 FIN_chauvinist_populism_party_long: "Unorganized\n§YFounded: 1870§!\n§LUnorganized gathers nationalists, conservative activists, military-minded patriots, and other supporters who place national unity and state power above ordinary factional compromise. The movement emphasizes sovereignty, social cohesion, and a forceful defense of the nation against internal division and foreign pressure.\n\nIts appeal rests on the promise that a stronger national community can overcome political paralysis and regional rivalry. Supporters favor disciplined government and a more assertive public life, while treating liberal individualism and revolutionary internationalism with deep suspicion.§!\n"
 FIN_radical_democracy_party: "Unorganized"
 FIN_radical_democracy_party_long: "Unorganized\n§YFounded: 1878§!\n§LUnorganized gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 FIN_anarchism_party: "Unorganized"
 FIN_anarchism_party_long: "Unorganized\n§YFounded: c. 1906§!\n§LUnorganized brings together radical critics of centralized government, inherited privilege, and coercive political authority. Its supporters place voluntary association, local autonomy, mutual aid, and individual or communal freedom above the claims of the state.\n\nThe movement remains diverse, ranging from individualist currents to more social and labor-oriented tendencies. What unites them is a belief that durable liberty cannot be created simply by replacing one ruling party with another, but requires a fundamental reduction of compulsory authority itself.§!\n"
 FIN_centrism_party: "Unorganized"
 FIN_centrism_party_long: "Unorganized\n§YFounded: 1863§!\n§LUnorganized gathers constitutional liberals, commercial interests, lawyers, journalists, and reform-minded notables who want political change without revolutionary upheaval. The faction favors representative institutions, civil liberties, freer commerce, and gradual administrative reform.\n\nIts strength rests among urban professionals and local elites who see constitutional government as the surest road to a stronger and more modern state. The party balances its appetite for reform against the need to preserve stability, placing it between entrenched reaction and the revolutionary left.§!\n"
 FIN_traditional_conservatism_party: "Unorganized"
 FIN_traditional_conservatism_party_long: "Unorganized\n§YFounded: 1870§!\n§LUnorganized rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"
 FIN_1862_Finnish_Party: "Suomalainen puolue (SP)"
 FIN_1862_Finnish_Party_long: "Suomalainen puolue (SP)\n§YFounded: 1863§!\n§LThe Finnish Party grows from the Fennoman movement in the 1860s, which seek to elevate the Finnish language and build a Finnish national culture within the Russian Grand Duchy. Associated with thinkers such as J. Snellman, it later becomes the conservative 'Old Finnish' current, generally favoring legal and cautious accommodation with imperial authority while advancing Finnish-language institutions.§!\n"

 KHI_autocracy_party: "House of Qungrat"
 KHI_autocracy_party_long: "House of Qungrat\n§YFounded: 1804§!\n§LThe Qungrat, or Kungrad, dynasty rules the Khanate of Khiva from the early nineteenth century until the khanate's abolition in 1920.\n\nIts authority rests on the khan, tribal elites, court officials, and regional power networks. House of Qungrat bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

 BAD_autocracy_party: "Haus von Baden"
 BAD_autocracy_party_long: "Haus von Baden\n§YFounded: c. 1112§!\n§LThe ruling house of Baden belongs to the Zähringen dynasty.\n\nIn the nineteenth century its grand dukes rule the Grand Duchy of Baden under a constitution first granted in 1818; the dynasty is a royal house. Haus von Baden bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 BAD_centrism_party: "Liberale Fraktion"
 BAD_centrism_party_long: "Liberale Fraktion\n§YFounded: 1831§!\n§LWithin nineteenth-century German-speaking legislatures, Liberale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.\n\nLiberale Fraktion brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 BAD_ideology_social_liberalism_party: "Linksliberale Fraktion"
 BAD_ideology_social_liberalism_party_long: "Linksliberale Fraktion\n§YFounded: December 1865§!\n§LWithin nineteenth-century German-speaking legislatures, Linksliberale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.\n\nLinksliberale Fraktion brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 BAD_traditional_conservatism_party: "Konservative Fraktion"
 BAD_traditional_conservatism_party_long: "Konservative Fraktion\n§YFounded: 1831§!\n§LWithin nineteenth-century German-speaking legislatures, Konservative Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 BAD_fundamentalism_party: "Ultramontane Fraktion"
 BAD_fundamentalism_party_long: "Ultramontane Fraktion\n§YFounded: 1846§!\n§LThe Ultramontanes are the Catholic political current in Baden, defending the rights and institutional independence of the Roman Catholic Church against liberal state church policies. They emerge as a recognizable Catholic faction in the Second Chamber of the Baden Estates and become an important voice in conflicts over church rights and state authority.§!\n"

 BAV_social_egalitarianism_party: "Gemäßigte Arbeiterbewegung"
 BAV_social_egalitarianism_party_long: "Gemäßigte Arbeiterbewegung\n§YFounded: 23 August 1848§!\n§LBavarian politics in the mid-nineteenth century develops through parliamentary liberal, conservative, Catholic, and national factions; durable mass parties form gradually. Gemäßigte Arbeiterbewegung brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 BAV_traditional_conservatism_party: "Bayerische Patriotenpartei"
 BAV_traditional_conservatism_party_long: "Bayerische Patriotenpartei\n§YFounded: 1868§!\n§LThe Bavarian Patriot Party develops in 1868-1869 as a Catholic-conservative and federalist force opposed to Prussian domination and to a centralized 'small German' nation-state. It wins strong rural and clerical support, becomes the leading force in the Bavarian Landtag, and later reorganizes as the Bavarian Centre Party.§!\n"
 BAV_radical_democracy_party: "Kammer der Landsräte"
 BAV_radical_democracy_party_long: "Kammer der Landsräte\n§YFounded: 1818§!\n§LKammer der Landsräte gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 BAV_autocracy_party: "Haus von Wittelsbach"
 BAV_autocracy_party_long: "Haus von Wittelsbach\n§YFounded: 1180§!\n§LThe House of Wittelsbach is Bavaria's ruling dynasty until 1918 and also supplies King Otto of Greece from 1832 to 1862.\n\nHaus von Wittelsbach bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 BAV_fundamentalism_party: "Klerikale Fraktion"
 BAV_fundamentalism_party_long: "Klerikale Fraktion\n§YFounded: 1869§!\n§LBavarian politics in the mid-nineteenth century develops through parliamentary liberal, conservative, Catholic, and national factions; durable mass parties form gradually. Klerikale Fraktion draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 BAV_centrism_party: "Liberale Fraktion"
 BAV_centrism_party_long: "Liberale Fraktion\n§YFounded: 1863§!\n§LWithin nineteenth-century German-speaking legislatures, Liberale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.\n\nLiberale Fraktion brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 BAV_chauvinist_populism_party: "Deutscher Reformverein"
 BAV_chauvinist_populism_party_long: "Deutscher Reformverein\n§YFounded: 26 October 1862§!\n§LThe Deutscher Reformverein, founded in 1862, promotes a Greater German solution to the German Question that would include Austria rather than place a unified Germany under Prussian leadership. It draws particular support in the southern German states and advocates reform of the German Confederation.§!\n"
 BAV_anarchism_party: "Anarchisten"
 BAV_anarchism_party_long: "Anarchisten\n§YFounded: c. 1840§!\n§LBavarian politics in the mid-nineteenth century develops through parliamentary liberal, conservative, Catholic, and national factions; durable mass parties form gradually. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 BAV_ideology_radical_socialism_party: "Radikale Arbeiterbewegung"
 BAV_ideology_radical_socialism_party_long: "Radikale Arbeiterbewegung\n§YFounded: 23 August 1848§!\n§LBavarian politics in the mid-nineteenth century develops through parliamentary liberal, conservative, Catholic, and national factions; durable mass parties form gradually. Radikale Arbeiterbewegung brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 BAV_ideology_social_liberalism_party: "Linksliberale Fraktion"
 BAV_ideology_social_liberalism_party_long: "Linksliberale Fraktion\n§YFounded: 1863§!\n§LWithin nineteenth-century German-speaking legislatures, Linksliberale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.\n\nLinksliberale Fraktion brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"

 WUR_autocracy_party: "Haus von Württemberg"
 WUR_autocracy_party_long: "Haus von Württemberg\n§YFounded: 1083§!\n§LThe House of Württemberg rules the Kingdom of Württemberg until 1918. By the mid-nineteenth century the monarchy operates under a constitutional framework with a Landtag, while liberal, democratic, conservative, and confessional currents competes in public life; the royal house itself is a dynasty.§!\n"
 WUR_centrism_party: "Liberale Fraktion"
 WUR_centrism_party_long: "Liberale Fraktion\n§YFounded: 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Liberale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.\n\nLiberale Fraktion brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 WUR_fundamentalism_party: "Christlich-Konservative Fraktion"
 WUR_fundamentalism_party_long: "Christlich-Konservative Fraktion\n§YFounded: c. 1848§!\n§LThe Christlich-Konservative Fraktion draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 WUR_radical_democracy_party: "Radikale Fraktion"
 WUR_radical_democracy_party_long: "Radikale Fraktion\n§YFounded: 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Radikale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.§!\n"
 WUR_traditional_conservatism_party: "Konservative Fraktion"
 WUR_traditional_conservatism_party_long: "Konservative Fraktion\n§YFounded: 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Konservative Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 WUR_chauvinist_populism_party: "Deutscher Reformverein"
 WUR_chauvinist_populism_party_long: "Deutscher Reformverein\n§YFounded: 26 October 1862§!\n§LThe Deutscher Reformverein, founded in 1862, promotes a Greater German solution to the German Question that would include Austria rather than place a unified Germany under Prussian leadership. It finds much of its support in the southern and middle German states before declining after Prussia's victory in 1866.§!\n"
 WUR_anarchism_party: "Anarchisten"
 WUR_anarchism_party_long: "Anarchisten\n§YFounded: c. 1840§!\n§LAt the heart of Anarchisten is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 WUR_ideology_radical_socialism_party: "Radikale Arbeiterbewegung"
