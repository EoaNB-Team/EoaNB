 MSQ_House_of_Miskito: "House of Miskito"
 MSQ_House_of_Miskito_long: "The House of Miskito\n§YFounded: c. 1637§!\n§LThe Miskito Kingdom on the Caribbean coast of Central America has hereditary kings and a political elite closely connected with Britain. In the nineteenth century the monarchy survives under strong British influence until the Miskito Reserve is incorporated into Nicaragua in 1894.§!\n"

 TUK_fundamentalism_party: "The Tijaniyya order"
 TUK_fundamentalism_party_long: "at-Tariqah at-Tijaniyyah fi Bilad as-Sudan\n§YFounded: c. 1781§!\n§LThe Tijaniyya is a Sufi order founded in North Africa in the late eighteenth century and spreads widely through West Africa in the nineteenth century. Umar Tall becomes one of its most important propagators in the Western Sudan and builds a jihad state in the 1850s and 1860s; the order is a religious brotherhood.§!\n"
 TUK_autocracy_party: "Tall dynasty"
 TUK_autocracy_party_long: "Tall dynasty\n§YFounded: 1852§!\n§LThe Tall family rules the Toucouleur Empire founded by al-Hajj Umar Tall in the western Sudan during the mid-nineteenth century. After Umar's death in 1864, his son Ahmadu Tall rules from Ségou amid internal rivalry and expanding French pressure; the dynasty is a ruling lineage.§!\n"

 HMD_autocracy_party: "Lobo dynasty"
 HMD_autocracy_party_long: "Lobo dynasty\n§YFounded: c. 1750§!\n§LThe ruling family of the Massina Empire descended from Seku Amadu Lobbo, who founds the Fulani Islamic state in the Inland Niger Delta after a jihad beginning in 1818. The empire is governed through Islamic institutions and provincial administration until its conquest by Umar Tall's forces in 1862.§!\n"

 SGO_autocracy_party: "Ngolosi dynasty"
 SGO_autocracy_party_long: "Ngolosi dynasty\n§YFounded: 1712§!\n§LNgolo Diarra seizes power in Ségou in the eighteenth century and founds the Ngolosi, or Diarra, dynasty that rules the Bambara kingdom until the nineteenth-century jihads overturn it.\n\nThe dynasty is a ruling lineage, Ngolosi dynasty bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

 KND_autocracy_party: "Traore dynasty"
 KND_autocracy_party_long: "Traore dynasty\n§YFounded: c. 1650§!\n§LThe Traoré dynasty rules the Kénédougou kingdom in the western Sudan, with Sikasso becoming its principal center in the nineteenth century. Under rulers including Tiéba and Babemba Traoré, Kénédougou resist both regional rivals and French expansion until its conquest in 1898.§!\n"

 WTR_autocracy_party: "Wattara dynasty"
 WTR_autocracy_party_long: "Wattara dynasty\n§YFounded: c. 1710§!\n§LThe Wattara, or Ouattara, dynasty founds and rules the Kong Empire from the early eighteenth century. Kong is a decentralized commercial state linking Dyula trading networks across West Africa; the dynasty's authority is dynastic and mercantile.§!\n"

 DGB_autocracy_party: "Gbewaa dynasty"
 DGB_autocracy_party_long: "Gbewaa dynasty\n§YFounded: c. 1250§!\n§LThe Gbewaa dynastic tradition underlies several Mole-Dagbani kingdoms of northern Ghana and neighboring regions, including Dagbon, Mamprugu, and Nanumba.\n\nPolitical authority is hereditary and organize through royal lineages and chiefs. Gbewaa dynasty bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"

 BNA_autocracy_party: "Awlad Siyad"
 BNA_autocracy_party_long: "Awlad Siyad\n§YFounded: c. 1650§!\n§LAwlad Siyad rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"

 MRT_autocracy_party: "Awlad Ahmad ould Daman"
 MRT_autocracy_party_long: "Awlad Ahmed ould Daman\n§YFounded: c. 1640§!\n§LAwlad Ahmed ould Daman rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"

 KAG_autocracy_party: "Kel Ghela"
 KAG_autocracy_party_long: "Kel Ghela\n§YFounded: c. 1750§!\n§LKel Ghela are the pre-eminent noble clan of the Kel Ahaggar Tuareg confederation. The amenukal, or supreme chief of the Ahaggar, is chosen from the Kel Ghela, giving the clan a leading political role in the central Sahara; it is a kinship and aristocratic group.§!\n"

 KAD_autocracy_party: "Kel Afella"
 KAD_autocracy_party_long: "Kel Afella\n§YFounded: c. 1750§!\n§LKel Afella rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"

 AIR_autocracy_party: "Kel Owey"
 AIR_autocracy_party_long: "Kel Owey\n§YFounded: c. 1750§!\n§LKel Owey are a powerful Tuareg confederation that dominates much of the Aïr Mountains from the eighteenth century into the colonial era. They control important trans-Saharan caravan routes, exert influence over Agadez, and remain a major regional political and commercial force through the nineteenth century.§!\n"

 SAL_fundamentalism_party: "The Tijaniyya order"
 SAL_fundamentalism_party_long: "at-Tariqah at-Tijaniyyah fi Bilad as-Sudan\n§YFounded: c. 1781§!\n§LThe Tijaniyya is a Sufi order that expands rapidly in nineteenth-century West Africa. Umar Tall's preaching and jihad help spread the order across the Senegal and upper Niger regions, where Tijani religious networks remains influential long after his political state declines.§!\n"