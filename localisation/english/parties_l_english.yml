 BAS_anarchism_party: "Movimento de Libertação Nacional Basco"
 BAS_anarchism_party_long: "Movimento de Libertação Nacional Basco\n§YFounded: c. 1869§!\n§LMovimento de Libertação Nacional Basco draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"

 CAT_centrism_party: "Uniòn Liberal"
 CAT_centrism_party_long: "Uniòn Liberal\n§YFounded: 1858§!\n§LThe Liberal Union is a Spanish national centrist coalition creates around General Leopoldo O'Donnell in the 1850s, combining moderate Progressives with less doctrinaire Moderates. Uniòn Liberal brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 CAT_social_egalitarianism_party: "Partido Progressista"
 CAT_social_egalitarianism_party_long: "Partido Progressista\n§YFounded: June 1838§!\n§LPartido Progressista brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 CAT_anarchism_party: "Anarquistes catalans"
 CAT_anarchism_party_long: "Anarquistes catalans\n§YFounded: 2 May 1869§!\n§LAt the heart of Anarquistes catalans is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"

 POR_ideology_social_liberalism_party: "Comuna De Lisboa"
 POR_ideology_social_liberalism_party_long: "Comuna De Lisboa\n§YFounded: c. 1871§!\n§LComuna De Lisboa occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 POR_ideology_radical_socialism_party: "Partido Socialista Portugues"
 POR_ideology_radical_socialism_party_long: "Partido Socialista Portugues\n§YFounded: 10 January 1875§!\n§LThe Portuguese Socialist Party of the nineteenth century is founded in 1875 by socialist activists influences by the First International and European labor politics. It remains a small movement, working through newspapers, associations, and labor organization rather than becoming a major parliamentary force under the monarchy.§!\n"
 POR_social_egalitarianism_party: "Regenerados"
 POR_social_egalitarianism_party_long: "Regenerados\n§YFounded: 1851§!\n§LPortugal's Regenerator Party develops from the Regeneration political settlement that begins in 1851. It becomes one of the two principal constitutional-monarchist parties of the later nineteenth century, favoring material improvement, public works, administrative stability, and pragmatic parliamentary government.§!\n"
 POR_centrism_party: "Reformistas"
 POR_centrism_party_long: "Reformistas\n§YFounded: 1868§!\n§LPortugal's Reformist Party emerges from political realignments of the 1860s and is associated with reformist constitutional monarchists including the Marquis of Sá da Bandeira. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 POR_radical_democracy_party: "Oligarquia Portuges"
 POR_radical_democracy_party_long: "Oligarquia Portuges\n§YFounded: 1852§!\n§LOligarquia Portuguesa denotes elite rule. The constitutional monarchy is dominated by networks of parliamentary notables, the Regenerator and Historical parties, the crown, and local patronage.§!\n"
 POR_traditional_conservatism_party: "Partido Histórico"
 POR_traditional_conservatism_party_long: "Partido Histórico\n§YFounded: 1852§!\n§LPortugal's Historical Party is organized in the 1850s from the opposition to the Regenerator governments and becomes the other major constitutional-monarchist force of the period. It draws on the liberal tradition associated with the Septemberists and competes with the Regenerators until later party realignments.§!\n"
 POR_autocracy_party: "Miguelistas"
 POR_autocracy_party_long: "Miguelistas\n§YFounded: 1828§!\n§LThe Miguelists are supporters of Dom Miguel and the legitimist, absolutist line that fights the constitutional liberals in the Portuguese Civil War of 1828-1834. After defeat they remain a legitimist and traditionalist political current.§!\n"
 POR_chauvinist_populism_party: "Comissão Imperial"
 POR_chauvinist_populism_party_long: "Comissão Imperial\n§YFounded: c. 1857§!\n§LComissão Imperial gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 POR_anarchism_party: "Avilistas"
 POR_anarchism_party_long: "Avilistas\n§YFounded: c. 1885§!\n§LThe term 'Avilistas' refers to followers of the Portuguese statesman António José de Ávila, later Duke of Ávila and Bolama. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 POR_fundamentalism_party: "Conferencia Episcopal Portugesa"
 POR_fundamentalism_party_long: "Conferencia Episcopal Portugesa\n§YFounded: c. 1958§!\n§LThe Catholic hierarchy in Portugal exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

 PIE_ideology_radical_socialism_party: "L'Estrema"
 PIE_ideology_radical_socialism_party_long: "L'Estrema\n§YFounded: 1861§!\n§LL'Estrema, or the Extreme Leaves, is the radical democratic and republican political current in post-unification Italy. It includes republicans, radicals, and later some socialist-oriented deputies, becoming one of the most distinctive currents of the later nineteenth-century Italian leaves.§!\n"
 PIE_social_egalitarianism_party: "Partito d'Azione"
 PIE_social_egalitarianism_party_long: "Partito d'Azione\n§YFounded: 1853§!\n§LGiuseppe Mazzini founds the Action Party in 1853 as a republican revolutionary organization dedicated to Italian national unification. It seeks insurrection and democratic republican government; during the Risorgimento its name and ideas are associated with Mazzinians and with radical supporters of Giuseppe Garibaldi.§!\n"
 PIE_centrism_party: "Destra Storica"
 PIE_centrism_party_long: "Destra Storica\n§YFounded: 1849§!\n§LThe Right is the loose liberal-conservative political coalition that governs the Kingdom of Italy after unification. Drawn largely from moderate elites of the Risorgimento, it emphasizes centralized administration, fiscal consolidation, free trade, and completion of national unification; it is a political current whose strength rests on parliamentary leaders, regional networks, and elite support.§!\n"
 PIE_autocracy_party: "Casa Savoia"
 PIE_autocracy_party_long: "Casa Savoia\n§YFounded: c. 1003§!\n§LThe House of Savoy rules the Kingdom of Sardinia-Piedmont and becomes the royal dynasty of unified Italy in 1861. Casa Savoia rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 PIE_anarchism_party: "Estrema Radicale"
 PIE_anarchism_party_long: "Estrema Radicale\n§YFounded: 1861§!\n§LThe Italian 'Extreme Radical' current belongs to the democratic-republican leaves Radical and republican deputies push secularism, broader suffrage, and democratic reform, while organized anarchism develops separately through Bakuninist and labor networks.§!\n"
 PIE_fundamentalism_party: "Chiesa Cattolica Romana"
 PIE_fundamentalism_party_long: "Chiesa Cattolica Romana\n§YFounded: c. 1st century§!\n§LThe Roman Catholic Church is a central religious and social institution in nineteenth-century Italy. Clergy, bishops, lay Catholic associations, and pro-papal conservatives exercise political influence, while after Italian unification the papacy's Non Expedit policy for a time discourages Catholics from participating fully in national parliamentary elections.§!\n"
 PIE_radical_democracy_party: "Regia Armata Sarda"
 PIE_radical_democracy_party_long: "Regia Armata Sarda\n§YFounded: 1720§!\n§LThe Royal Sardinian Army is the army of the Kingdom of Sardinia-Piedmont and becomes the core of the Royal Italian Army after unification. Its strength rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise.§!\n"
 PIE_traditional_conservatism_party: "Cattolici Conservatori"
 PIE_traditional_conservatism_party_long: "Cattolici Conservatori\n§YFounded: 1848§!\n§LRelations between the Savoy state and the Catholic Church are deeply strained by secularization and the seizure of papal territories during unification. Cattolici Conservatori draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 PIE_ideology_social_liberalism_party: "Sinistra Storica"
 PIE_ideology_social_liberalism_party_long: "Sinistra Storica\n§YFounded: 1849§!\n§LThe Left is the broad liberal parliamentary opposition that succeeds the Historical Right in government in 1876. Its politicians favor wider suffrage, some decentralizing and social reforms, and a less rigid fiscal policy, though the group remains an elite parliamentary formation.§!\n"

 PIE_habsburg_autocracy_party: "Haus von Habsburg"
 PIE_habsburg_autocracy_party_long: "Haus von Habsburg\n§YFounded: c. 1020§!\n§LThe House of Habsburg-Lorraine is the ruling dynasty of the Austrian Empire and, after 1867, Austria-Hungary. The dynasty stands above party politics and governs through the imperial court, ministers, bureaucracy, army, and negotiates constitutional arrangements with the monarchy's many lands and nationalities.§!\n"

 TUS_social_egalitarianism_party: "Sinistra Italiana"
 TUS_social_egalitarianism_party_long: "Sinistra Italiana\n§YFounded: 1849§!\n§LSinistra Italiana brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 TUS_traditional_conservatism_party: "Destra Toscana"
 TUS_traditional_conservatism_party_long: "Destra Toscana\n§YFounded: c. 1848§!\n§LDestra Toscana rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"
 TUS_autocracy_party: "Casata Degli Asburgo"
 TUS_autocracy_party_long: "Casata Degli Asburgo\n§YFounded: 1737§!\n§LThe House of Habsburg-Lorraine is the ruling dynasty of the Austrian Empire and, after 1867, Austria-Hungary. The dynasty stands above party politics and governs through the imperial court, ministers, bureaucracy, army, and negotiates constitutional arrangements with the monarchy's many lands and nationalities.§!\n"

 SAR_centrism_party: "Historical-Left"
 SAR_centrism_party_long: "Historical-Left\n§YFounded: 1849§!\n§LThe Left is the broad liberal parliamentary opposition that succeeds the Historical Right in government in 1876. Its politicians favor wider suffrage, some decentralizing and social reforms, and a less rigid fiscal policy, though the group remains an elite parliamentary formation.§!\n"
 SAR_traditional_conservatism_party: "Historical-Right"
 SAR_traditional_conservatism_party_long: "Historical-Right\n§YFounded: 1849§!\n§LThe Right is the loose liberal-conservative political coalition that governs the Kingdom of Italy after unification. Drawn largely from moderate elites of the Risorgimento, it emphasizes centralized administration, fiscal consolidation, free trade, and completion of national unification; it is a political current whose strength rests on parliamentary leaders, regional networks, and elite support.§!\n"
 SAR_social_egalitarianism_party: "Anti-Monarchists"
 SAR_social_egalitarianism_party_long: "Anti-Monarchists\n§YFounded: July 1831§!\n§LThe Anti-Monarchists brings together progressive reformers, workers, professionals, and social activists who argue that political liberty must be matched by wider social opportunity. The movement favors education, labor reform, broader participation in government, and a more active public role in confronting poverty and inequality.\n\nIts supporters regard reform as a means of strengthening society rather than overturning it. They press the established political order to answer the demands of industrialization and urban growth while competing with both laissez-faire liberals and revolutionary socialist currents.§!\n"
 SAR_ideology_radical_socialism_party: "Sardinian Socialist Party"
 SAR_ideology_radical_socialism_party_long: "Sardinian Socialist Party\n§YFounded: 14 August 1892§!\n§LThe Sardinian Socialist Party brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 SAR_ideology_social_liberalism_party: "Communist Party"
 SAR_ideology_social_liberalism_party_long: "Communist Party\n§YFounded: 21 January 1921§!\n§LThe Communist Party brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 SAR_autocracy_party: "House of Savoy"
 SAR_autocracy_party_long: "House of Savoy\n§YFounded: c. 1003§!\n§LThe House of Savoy rules the Kingdom of Sardinia-Piedmont and becomes the royal dynasty of unified Italy in 1861. House of Savoy bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 SAR_radical_democracy_party: "Reactionary Party"
 SAR_radical_democracy_party_long: "Reactionary Party\n§YFounded: c. 1848§!\n§LThe Reactionary Party gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 SAR_anarchism_party: "Anarchists"
 SAR_anarchism_party_long: "Anarchists\n§YFounded: 31 January 1869§!\n§LAt the heart of Anarchists is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 SAR_chauvinist_populism_party: "Piedmontese Party"
 SAR_chauvinist_populism_party_long: "Piedmontese Party\n§YFounded: c. 1848§!\n§LThe Piedmontese Party gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 SAR_fundamentalism_party: "Neo-Guelphist Party"
 SAR_fundamentalism_party_long: "Neo-Guelphist Party\n§YFounded: 1843§!\n§LNeo-Guelphism is a nineteenth-century Italian Catholic-national current, most famously associated with Vincenzo Gioberti's proposal for an Italian federation under papal moral leadership.\n\nIt is an intellectual and political tendency. Neo-Guelphist Party draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 MOD_autocracy_party: "House of Habsburg"
 MOD_autocracy_party_long: "House of Habsburg\n§YFounded: c. 1020§!\n§LThe House of Habsburg-Lorraine is the ruling dynasty of the Austrian Empire and, after 1867, Austria-Hungary. The dynasty stands above party politics and governs through the imperial court, ministers, bureaucracy, army, and negotiates constitutional arrangements with the monarchy's many lands and nationalities.§!\n"
 MOD_centrism_party: "Destra Storica"
 MOD_centrism_party_long: "Destra Storica\n§YFounded: 1849§!\n§LThe Right is the loose liberal-conservative political coalition that governs the Kingdom of Italy after unification. Drawn largely from moderate elites of the Risorgimento, it emphasizes centralized administration, fiscal consolidation, free trade, and completion of national unification; it is a political current whose strength rests on parliamentary leaders, regional networks, and elite support.§!\n"
 MOD_social_egalitarianism_party: "Sinistra Storica"
 MOD_social_egalitarianism_party_long: "Sinistra Storica\n§YFounded: 1849§!\n§LThe Left is the broad liberal parliamentary opposition that succeeds the Historical Right in government in 1876. Its politicians favor wider suffrage, some decentralizing and social reforms, and a less rigid fiscal policy, though the group remains an elite parliamentary formation.§!\n"
 MOD_anarchism_party: "Anarchisti di Modena"
 MOD_anarchism_party_long: "Anarchisti di Modena\n§YFounded: 31 January 1869§!\n§LAnarchisti di Modena draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 MOD_fundamentalism_party: "Chiesa Cattolica Romana"
 MOD_fundamentalism_party_long: "Chiesa Cattolica Romana\n§YFounded: c. 1st century§!\n§LThe Roman Catholic Church is a central religious and social institution in nineteenth-century Italy. Clergy, bishops, lay Catholic associations, and pro-papal conservatives exercise political influence, while after Italian unification the papacy's Non Expedit policy for a time discourages Catholics from participating fully in national parliamentary elections.§!\n"

 PRM_autocracy_party: "House Bourbon"
 PRM_autocracy_party_long: "House Bourbon\n§YFounded: 1272§!\n§LThe Bourbon dynasty rules several European monarchies and branches of the house governs Spain and, until 1861, the Kingdom of the Two Sicilies.\n\nA Bourbon royal house is a dynasty. House Bourbon bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 PRM_centrism_party: "Destra Storica"
 PRM_centrism_party_long: "Destra Storica\n§YFounded: 1849§!\n§LThe Right is the loose liberal-conservative political coalition that governs the Kingdom of Italy after unification. Drawn largely from moderate elites of the Risorgimento, it emphasizes centralized administration, fiscal consolidation, free trade, and completion of national unification; it is a political current whose strength rests on parliamentary leaders, regional networks, and elite support.§!\n"
