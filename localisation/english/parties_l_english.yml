 LVN_autocracy_party: "House of Habsburg"
 LVN_autocracy_party_long: "House of Habsburg\n§YFounded: c. 1020§!\n§LThe House of Habsburg-Lorraine is the ruling dynasty of the Austrian Empire and, after 1867, Austria-Hungary. The dynasty stands above party politics and governs through the imperial court, ministers, bureaucracy, army, and negotiates constitutional arrangements with the monarchy's many lands and nationalities.§!\n"
 LVN_radical_democracy_party: "Serenissimi"
 LVN_radical_democracy_party_long: "Serenissimi\n§YFounded: 25 January 1987§!\n§LSerenissimi gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 LVN_anarchism_party: "Anarchisti Lombardo-Veneti"
 LVN_anarchism_party_long: "Anarchisti Lombardo-Veneti\n§YFounded: 31 January 1869§!\n§LThe Anarchisti Lombardo-Veneti draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 LVN_fundamentalism_party: "Chiesa Cattolica Romana"
 LVN_fundamentalism_party_long: "Chiesa Cattolica Romana\n§YFounded: c. 1st century§!\n§LThe Roman Catholic Church is a central religious and social institution in nineteenth-century Italy. Clergy, bishops, lay Catholic associations, and pro-papal conservatives exercise political influence, while after Italian unification the papacy's Non Expedit policy for a time discourages Catholics from participating fully in national parliamentary elections.§!\n"

 NSC_autocracy_party: "Casa di Borbone"
 NSC_autocracy_party_long: "Casa di Borbone delle Due Sicilie (House of Bourbon-Two Sicilies)\n§LThe House of Bourbon-Two Sicilies stands as the rightful guardian of southern Italy’s proud legacy, sovereignty, and Catholic tradition. Under their leadership, the kingdom has maintained its independence amidst rising tides of revolution and foreign intrigue. Advocating a strong monarchy, centralized governance, and loyalty to the Church, the Bourbons of Naples and Sicily oppose the radical liberalism threatening the old order. Their rule promises stability, order, and resistance against northern aggression and republican subversion. As Europe trembles with the winds of change, the Two Sicilies stand firm, determined to chart their own course beneath the banner of legitimacy and divine right.§!\n"
 NSC_traditional_conservatism_party: "Tradizionalisti"
 NSC_traditional_conservatism_party_long: "Tradizionalisti (Traditionalists)\n§LThe Traditionalists form the backbone of the Bourbon monarchy’s political and social support, championing the preservation of established institutions, Catholic values, and the existing social hierarchy. Loyal to the crown and wary of foreign ideologies, they see political stability and deference to authority as the foundations of order. Opposed to constitutionalism and mass politics, the Traditionalists seek to maintain the Kingdom as it has long stood — governed by divine right, guided by the Church, and protected from the disruptive forces of liberalism and revolution.§!\n"
 NSC_centrism_party: "Riformisti"
 NSC_centrism_party_long: "Riformisti (Reformists)\n§LThe Reformists advocate measured modernization while preserving the monarchy’s authority and the social order. Favoring economic development, administrative efficiency, and limited legal reforms, they seek to adapt the Kingdom to the changing currents of Europe without embracing radical politics. Often drawn from the educated elite and royal bureaucracy, the Riformisti see themselves as a stabilizing force — guiding the Two Sicilies toward progress at a cautious pace, ensuring that tradition and reform move hand in hand.§!\n"
 NSC_ideology_social_liberalism_party: "Riformisti Radicali"
 NSC_ideology_social_liberalism_party_long: "Riformisti Radicali (Radical Reformists)\n§LThe Radical Reformists are a loose coalition of intellectuals, professionals, and moderate nationalists seeking to modernize the Kingdom through constitutional limits on royal power, expanded civil rights, and economic development. Inspired by liberal movements across Europe, they advocate gradual reform over violent revolution, though their calls for change place them at odds with conservative elements of the monarchy and clergy. Operating through private salons, newspapers, and discreet political circles, they aim to steer the Two Sicilies toward a more open and representative form of governance without dismantling the state entirely.§!\n"
 NSC_social_egalitarianism_party: "Repubblicani del Mezzogiorno"
 NSC_social_egalitarianism_party_long: "Repubblicani del Mezzogiorno (Southern Republicans)\n§LInfluenced by the ideals of the Risorgimento and the writings of Giuseppe Mazzini, the Republicans of the Mezzogiorno advocate the abolition of the monarchy and the establishment of a unified Italian republic. They call for representative government, civil liberties, and national self-determination, seeing the Bourbon crown as an obstacle to both progress and unity. Operating through clandestine cells, secret societies, and exile networks, they coordinate with northern revolutionaries while seeking to ignite uprisings across southern Italy in pursuit of their vision for a free and united nation.§!\n"
 NSC_ideology_radical_socialism_party: "Socialisti del Mezzogiorno"
 NSC_ideology_radical_socialism_party_long: "Socialisti del Mezzogiorno (Southern Socialists)\n§LEmerging from the growing discontent of workers, peasants, and radical intellectuals, the Socialists of the Mezzogiorno call for sweeping social and economic change. Influenced by new socialist writings from Europe and local struggles over land ownership and labor rights, they envision a society based on equality, collective ownership, and the redistribution of wealth. Without a unified leadership, their ideas spread through informal networks, secret gatherings, and pamphlets, finding support among those who see the monarchy and landowning elites as obstacles to a fairer future.§!\n"
 NSC_anarchism_party: "Anarchisti del Mezzogiorno"
 NSC_anarchism_party_long: "Anarchisti del Mezzogiorno (Southern Anarchists)\n§LActive in secret across the hills of Calabria, the alleys of Naples, and the countryside of Sicily, the Anarchists of the Mezzogiorno are a loose collection of radicals, workers, and intellectuals united by opposition to centralized authority. Inspired by emerging anarchist thought from abroad and fueled by local struggles over land, labor, and liberty, they advocate a society built on voluntary cooperation, mutual aid, and the absence of rulers. Though small in number, their ideas spread through pamphlets, clandestine meetings, and the solidarity of the poor, offering a vision of freedom beyond both monarchy and parliament.§!\n"
 NSC_fundamentalism_party: "Chiesa Cattolica Romana"
 NSC_fundamentalism_party_long: "Chiesa Cattolica Romana (Roman Catholic Church)\n§LThe Roman Catholic Church plays a central role in the political and cultural life of our state. Closely tied to the Holy See and the Pope in Rome, it provides spiritual guidance, supports social order, and influences education, law, and governance. For many in the South, the Church is both a source of moral authority and a unifying symbol of identity. Its leadership seeks to uphold established traditions and protect the religious foundations of society during an era marked by political change and competing ideologies.§!\n"
 NSC_traditional_conservatism_party_PCN: "PCN"
 NSC_traditional_conservatism_party_PCN_long: "Partito Conservatore Nazionale (National Conservative Party)\n§LRooted in loyalty to the throne, the Church, and the moral fabric of Neapolitan society, the Partito Conservatore Nazionale champions a vision of order, duty, and cultural unity. They believe in a strong, paternalistic monarchy guided by divine authority, where social hierarchy and Catholic values safeguard the kingdom from the chaos of liberalism and revolution. Advocating limited reforms only when necessary to preserve stability, the party resists foreign influence and northern ambitions. In a world torn between radical change and imperial ambition, the Conservatives offer a steadfast defense of the Two Sicilies’ sacred traditions and national identity.§!\n"
 NSC_centrism_party_UC: "UC"
 NSC_centrism_party_UC_long: "Unione Costituzionale (Constitutional Union)\n§LThe Unione Costituzionale represents a growing voice among moderate reformers who seek to modernize the Kingdom without dismantling its foundations. Favoring a constitutional monarchy, gradual liberal reforms, and economic modernization, the party envisions a future where the Bourbon dynasty coexists with a representative parliament and civil liberties. While loyal to the crown and skeptical of radical republicanism, the Unione urges the court to adapt to the changing times before revolution forces its hand. In an era of upheaval, they offer a middle path—one that preserves tradition while embracing progress.§!\n"
 NSC_ideology_social_liberalism_party_PdPN: "PdPN"
 NSC_ideology_social_liberalism_party_PdPN_long: "Partito del Progresso Nazionale (National Progress Party)\n§LThe Partito del Progresso Nazionale envisions a modern, enlightened Two Sicilies built on civil liberties, education, and responsive governance. Inspired by the liberal ideals sweeping across Europe, the party advocates for constitutional reform, freedom of the press, expansion of suffrage, and state-backed development. While maintaining respect for the monarchy, they argue that progress, not repression, is the key to national strength and unity. Rejecting both absolutism and radical revolution, the Progressisti offer a bold but peaceful path forward, where the Kingdom may evolve into a beacon of southern Italian prosperity and modernity.§!\n"

 PAP_autocracy_party: "Zelanti"
 PAP_autocracy_party_long: "Zelanti (The Zealous)\n§LThe Zelanti represent the hardline defenders of papal absolutism, rejecting compromise with modern ideologies and demanding the full preservation of the Pope’s temporal and spiritual authority. Rooted in the conviction that Church and State are inseparable, they oppose liberal reforms, constitutional experiments, and any erosion of clerical power. For the Zelanti, obedience to the Holy Father is both a political duty and a divine mandate, making them the staunch guardians of the Papal State’s traditional order.§!\n"
 PAP_traditional_conservatism_party: "Tradizionalisti"
 PAP_traditional_conservatism_party_long: "Tradizionalisti (Traditionalists)\n§LThe Traditionalists embody the conservative heart of the Papal State, defending the temporal power of the Pope, the authority of the clergy, and the sanctity of established institutions. They champion stability, hierarchy, and obedience as the cornerstones of society, resisting the tide of foreign ideologies and modern doctrines. Opposed to constitutionalism and popular politics, the Traditionalists seek to preserve the Papal government as it has long stood — ordained by divine authority, safeguarded by tradition, and protected against the disruptive forces of liberalism and revolution.§!\n"
 PAP_centrism_party: "Riformisti"
 PAP_centrism_party_long: "Riformisti (Reformists)\n§LThe Reformists promote cautious modernization while upholding the Pope’s temporal authority and the established social order. Favoring economic development, administrative efficiency, and limited legal reforms, they seek to adapt the Papal State to the shifting currents of Europe without embracing radical change. Often drawn from the educated elite and clerical bureaucracy, the Riformisti present themselves as a stabilizing force — guiding the Papal government toward progress at a careful pace, ensuring that tradition and reform advance together.§!\n"
 PAP_ideology_social_liberalism_party: "Riformisti Radicali"
 PAP_ideology_social_liberalism_party_long: "Riformisti Radicali (Radical Reformists)\n§LThe Radical Reformists are a loose circle of intellectuals, professionals, and moderate nationalists who call for the modernization of the Papal State. Seeking limits on clerical authority, expanded civil rights, and economic development, they draw inspiration from liberal movements across Europe while rejecting the path of violent revolution. Their discreet activity in salons, journals, and private societies puts them at odds with the traditionalist hierarchy, yet they envision a future in which reform and progress can temper papal rule without overturning the state entirely.§!\n"
 PAP_social_egalitarianism_party: "Repubblicani dello Stato Pontificio (Republicans of the Papal State)"
 PAP_social_egalitarianism_party_long: "Repubblicani dello Stato Pontificio (Republicans of the Papal State)\n§LOperating in secrecy within Romagna, the Marches, and other restless provinces of the Papal States, the Republicans are inspired by the ideals of Giuseppe Mazzini and the Risorgimento. They call for the abolition of papal temporal power and the creation of a unified Italian republic founded on liberty, national unity, and popular sovereignty. Organized through clandestine cells and secret societies, they conspire with exiles and northern revolutionaries, seeking to rally the discontented against both the monarchy and the Church’s worldly rule.§!\n"
 PAP_ideology_radical_socialism_party: "Socialisti dello Stato Pontificio"
 PAP_ideology_radical_socialism_party_long: "Socialisti dello Stato Pontificio (Socialists of the Papal State)\n§LSpread through workshops, printing presses, and rural communities of the Papal States, the Socialists form an informal network of workers, peasants, and intellectuals seeking social and economic transformation. Inspired by new socialist writings from Europe and driven by grievances over land ownership and inequality, they call for equality, collective welfare, and the redistribution of wealth. Though lacking centralized leadership, their movement grows through clandestine meetings and pamphlets, offering a vision of justice that challenges both princely power and clerical authority.§!\n"
 PAP_anarchism_party: "Anarchici dello Stato Pontificio"
 PAP_anarchism_party_long: "Anarchici dello Stato Pontificio (Anarchists of the Papal State)\n§LActive in secret across the towns of Romagna, the countryside of Umbria, and the backstreets of the Papal States, the Anarchists are a loose collection of radicals, workers, and intellectuals united by their rejection of all authority, both secular and clerical. Inspired by emerging anarchist thought from abroad and fueled by local struggles over land, labor, and liberty, they envision a society built on voluntary cooperation, mutual aid, and the absence of rulers. Though small in number, their ideas spread through clandestine gatherings, underground pamphlets, and the solidarity of the discontented, offering a vision of freedom beyond both throne and altar.§!\n"
 PAP_fundamentalism_party: "Chiesa Cattolica Romana"
 PAP_fundamentalism_party_long: "Chiesa Cattolica Romana (Roman Catholic Church)\n§LThe Roman Catholic Church is the foundation of the Papal State, with the Pope holding both spiritual and temporal authority. As guardian of faith and ruler of the land, it shapes law, education, and governance, ensuring that society remains bound to religious tradition. In an age of growing liberal and national movements, the Church stands as a defender of divine order and a symbol of unity for the faithful, determined to preserve its role against the challenges of modern ideologies.§!\n"

 BEL_ideology_social_liberalism_party: "Syndicalist Proudhonistes"
 BEL_ideology_social_liberalism_party_long: "Syndicalist Proudhonistes\n§YFounded: 28 August 1865§!\n§LThe Syndicalist Proudhonistes occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 BEL_ideology_radical_socialism_party: "Parti Communiste de Belgique"
 BEL_ideology_radical_socialism_party_long: "Parti Communiste de Belgique\n§YFounded: 1921§!\n§LThe Communist Party of Belgium is founded in 1921 from the merger of communist groups influences by the Russian Revolution and the Communist International.\n\nParti Communiste de Belgique brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 BEL_social_egalitarianism_party: "Parti Ouvrier Belge"
 BEL_social_egalitarianism_party_long: "Parti Ouvrier Belge\n§YFounded: 5 April 1885§!\n§LThe Belgian Labour Party is founded in 1885 by socialist, workers', cooperative, and trade-union organizations. It campaigns for universal suffrage and social reform, becoming the principal party of the Belgian working class and a major force behind the expansion of the franchise.§!\n"
 BEL_radical_democracy_party: "Belgian Parliament"
 BEL_radical_democracy_party_long: "Belgian Parliament\n§YFounded: 1831§!\n§LBelgium's Parliament consists of the legislative institutions create under the 1831 constitution. Its political importance rests on its role as a forum where the leading interests of the state debate law, taxation, appointments, and the balance between central authority and local privilege.§!\n"
 BEL_centrism_party: "Parti Liberal"
 BEL_centrism_party_long: "Parti Liberal\n§YFounded: 14 June 1846§!\n§LThe Belgian Liberal Party is organized nationally in 1846 and becomes one of the country's two great nineteenth-century parties. It represents anticlerical and bourgeois liberalism, defends constitutional liberties and secular public institutions, and competes principally with the Catholic political current.§!\n"
 BEL_traditional_conservatism_party: "Catholics"
 BEL_traditional_conservatism_party_long: "Catholics\n§YFounded: 1830§!\n§LBelgian Catholic politicians form one of the two great political camps of the nineteenth century. For decades they operate through parliamentary, clerical, and electoral networks. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 BEL_autocracy_party: "House of Saxe-Coburg and Gotha"
 BEL_autocracy_party_long: "House of Saxe-Coburg and Gotha\n§YFounded: 1831§!\n§LThe House of Saxe-Coburg and Gotha is a German dynasty whose branches supply monarchs to Belgium and several other European states; Britain's royal house adopts the name in 1901 before changing it to Windsor in 1917. House of Saxe-Coburg and Gotha bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites.\n\nSupporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 BEL_chauvinist_populism_party: "Belgian Populists"
 BEL_chauvinist_populism_party_long: "Belgian Populists\n§YFounded: c. 1830§!\n§LSupporters of Belgian Populists channel regional interests and public loyalties into a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 BEL_anarchism_party: "Rex"
 BEL_anarchism_party_long: "Rex\n§YFounded: 1935§!\n§LRex is a Belgian far-right authoritarian Catholic movement leads by Léon Degrelle in the 1930s. Rex draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 BEL_fundamentalism_party: "Catholics"
 BEL_fundamentalism_party_long: "Catholics\n§YFounded: 1830§!\n§LBelgian Catholic politicians form one of the two great political camps of the nineteenth century. For decades they operate through parliamentary, clerical, and electoral networks. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 SWI_centrism_party: "Liberale Fraktion"
 SWI_centrism_party_long: "Liberale Fraktion\n§YFounded: 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Liberale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.\n\nLiberale Fraktion brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 SWI_ideology_social_liberalism_party: "Radikale Fraktion"
 SWI_ideology_social_liberalism_party_long: "Radikale Fraktion\n§YFounded: 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Radikale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.§!\n"
 SWI_traditional_conservatism_party: "Konservative Fraktion"
 SWI_traditional_conservatism_party_long: "Konservative Fraktion\n§YFounded: 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Konservative Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 SWI_radical_democracy_party: "Reaktionäre Fraktion"
 SWI_radical_democracy_party_long: "Reaktionäre Fraktion\n§YFounded: 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Reaktionäre Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.§!\n"
 SWI_anarchism_party: "Unorganized"
 SWI_anarchism_party_long: "Unorganized\n§YFounded: 1871§!\n§LUnorganized brings together radical critics of centralized government, inherited privilege, and coercive political authority. Its supporters place voluntary association, local autonomy, mutual aid, and individual or communal freedom above the claims of the state.\n\nThe movement remains diverse, ranging from individualist currents to more social and labor-oriented tendencies. What unites them is a belief that durable liberty cannot be created simply by replacing one ruling party with another, but requires a fundamental reduction of compulsory authority itself.§!\n"
 SWI_ideology_radical_socialism_party: "Unorganized"
 SWI_ideology_radical_socialism_party_long: "Unorganized\n§YFounded: 6 May 1838§!\n§LUnorganized draws together workers, artisans, radical intellectuals, and organizers who see economic power as inseparable from political power. Its program stresses labor organization, social ownership or cooperation, and a decisive challenge to the privileges of wealth and inherited hierarchy.\n\nThe movement looks beyond ordinary constitutional reform and seeks a deeper transformation of society. Its supporters disagree over the pace and method of change, but share the conviction that the existing economic order leaves working people without the power or security promised by political liberty.§!\n"
 SWI_social_egalitarianism_party: "Unorganized"
 SWI_social_egalitarianism_party_long: "Unorganized\n§YFounded: 6 May 1838§!\n§LUnorganized brings together progressive reformers, workers, professionals, and social activists who argue that political liberty must be matched by wider social opportunity. The movement favors education, labor reform, broader participation in government, and a more active public role in confronting poverty and inequality.\n\nIts supporters regard reform as a means of strengthening society rather than overturning it. They press the established political order to answer the demands of industrialization and urban growth while competing with both laissez-faire liberals and revolutionary socialist currents.§!\n"
 SWI_chauvinist_populism_party: "Unorganized"
 SWI_chauvinist_populism_party_long: "Unorganized\n§YFounded: 1848§!\n§LUnorganized gathers nationalists, conservative activists, military-minded patriots, and other supporters who place national unity and state power above ordinary factional compromise. The movement emphasizes sovereignty, social cohesion, and a forceful defense of the nation against internal division and foreign pressure.\n\nIts appeal rests on the promise that a stronger national community can overcome political paralysis and regional rivalry. Supporters favor disciplined government and a more assertive public life, while treating liberal individualism and revolutionary internationalism with deep suspicion.§!\n"
 SWI_autocracy_party: "Unorganized"
 SWI_autocracy_party_long: "Unorganized\n§YFounded: 1848§!\n§LUnorganized gathers court loyalists, landed elites, officers, officials, and other defenders of hereditary sovereignty around the authority of the ruler. Its political outlook stresses continuity, hierarchy, dynastic legitimacy, and the ability of a strong crown to stand above competing factions.\n\nSupporters regard the sovereign as the natural center of the state and the chief safeguard against disorder. Reform is acceptable when it strengthens the monarchy, but representative institutions remain subordinate to the ruler, the court, and the traditional pillars of government.§!\n"
 SWI_fundamentalism_party: "Unorganized"
 SWI_fundamentalism_party_long: "Unorganized\n§YFounded: 1845§!\n§LUnorganized draws political authority from clergy, religious scholars, devotional networks, and communities that look to faith as a foundation of public order. Its influence extends beyond worship into education, charity, family life, customary law, and the moral expectations placed upon government.\n\nSupporters seek to preserve the place of religion at the center of society and resist reforms they regard as hostile to established belief. Political action is therefore understood not simply as a contest for office, but as a defense of the spiritual and social order on which the community rests.§!\n"

 ENG_ideology_social_liberalism_party: "Reform League"
 ENG_ideology_social_liberalism_party_long: "Reform League\n§YFounded: 23 February 1865§!\n§LThe Reform League is founded in 1865 as a working-class reform organization campaigning for manhood suffrage and the secret ballot. It organizes large demonstrations in London and helps create public pressure for the Second Reform Act of 1867; it is a pressure movement.§!\n"
 ENG_ideology_radical_socialism_party: "Social Democratic Federation"
 ENG_ideology_radical_socialism_party_long: "Social Democratic Federation\n§YFounded: 7 June 1881§!\n§LSocial Democratic Federation is founded in 1881 and become Britain's first enduring organized Marxist political body. Hyndman, it advocates socialism through political agitation, but internal disputes produces several splits and limited its electoral influence.§!\n"
 ENG_social_egalitarianism_party: "Labour Party"
 ENG_social_egalitarianism_party_long: "Labour Party\n§YFounded: 27 February 1900§!\n§LThe Labour Party develops from the Labour Representation Committee founded in 1900 by trade unions and socialist organizations seeking independent working-class representation in Parliament. It adopts the Labour Party name in 1906 and gradually displaces the Liberals as the principal non-Conservative party during the early twentieth century.§!\n"
 ENG_centrism_party: "Liberal Party"
 ENG_centrism_party_long: "Liberal Party\n§YFounded: 6 June 1859§!\n§LBritain's Liberal Party takes shape in the mid-nineteenth century from Whigs, Peelites, Radicals, and other reformers. It becomes a major governing party under leaders such as Lord Palmerston and William Gladstone, supporting parliamentary reform, free trade, civil and religious liberties, and, in varying forms, retrenchment and nonconformist causes.§!\n"
 ENG_radical_democracy_party: "British Military Junta"
 ENG_radical_democracy_party_long: "British Military Junta\n§YFounded: c. 1857§!\n§LThe political weight of British Military Junta rests on the armed forces, centralized administration, and a willingness to place stability and state survival above ordinary factional compromise. Its political weight rests on command of the armed forces and the loyalty of the officer corps, allowing military authority to become decisive whenever civilian institutions fail to contain a national crisis.§!\n"
 ENG_traditional_conservatism_party: "Conservatism and Unionist Party"
 ENG_traditional_conservatism_party_long: "Conservatism and Unionist Party\n§YFounded: December 1834§!\n§LThe British Conservative Party grows out of the Tory tradition and the parliamentary organization rebuilt by Robert Peel in the 1830s.\n\nThe formal 'Conservative and Unionist' identity belongs to the later alliance with Liberal Unionists and the defense of the union with Ireland; in the nineteenth century the party combines defense of established institutions with gradual adaptation to electoral reform.§!\n"
 ENG_autocracy_party: "House of Saxe-Coburg and Gotha"
 ENG_autocracy_party_long: "House of Saxe-Coburg and Gotha\n§YFounded: 1901§!\n§LThe House of Saxe-Coburg and Gotha is a German dynasty whose branches supply monarchs to Belgium and several other European states; Britain's royal house adopts the name in 1901 before changing it to Windsor in 1917. House of Saxe-Coburg and Gotha bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites.\n\nSupporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
 ENG_chauvinist_populism_party: "New-Roundheads"
 ENG_chauvinist_populism_party_long: "New-Roundheads\n§YFounded: c. 1857§!\n§LSupporters of New-Roundheads channel regional interests and public loyalties into a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 ENG_anarchism_party: "Anarchist Party"
 ENG_anarchism_party_long: "Anarchist Party\n§YFounded: 1881§!\n§LThe Anarchist Party draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 ENG_fundamentalism_party: "Church of England"
 ENG_fundamentalism_party_long: "Church of England\n§YFounded: 1534§!\n§LThe Church of England is England's establishes church, with the monarch as Supreme Governor and bishops represents in the House of Lords. Church of England draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 CSA_ideology_social_liberalism_party: "CPCSA"
 CSA_ideology_social_liberalism_party_long: "Communist Party CSA\n§YFounded: c. 1861§!\n§LThe Communist Party CSA brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 CSA_ideology_radical_socialism_party: "Socialist Party"
 CSA_ideology_radical_socialism_party_long: "Socialist Party of Dixie\n§YFounded: c. 1861§!\n§LThe Socialist Party of Dixie brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 CSA_social_egalitarianism_party: "Radical Unionists"
 CSA_social_egalitarianism_party_long: "Republican Party\n§YFounded: 1854§!\n§LThe Republican Party has virtually no organized electoral presence in the states that form the Confederacy, since southern secessionists identify it with northern opposition to the expansion of slavery.\n\nRepublican Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 CSA_centrism_party: "Unionists"
 CSA_centrism_party_long: "Republican Party\n§YFounded: 1854§!\n§LThe Republican Party has virtually no organized electoral presence in the states that form the Confederacy, since southern secessionists identify it with northern opposition to the expansion of slavery.\n\nRepublican Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 CSA_whig_party: "New Whigs"
 CSA_whig_party_long: "Whig Party\n§YFounded: 1833§!\n§LThe American Whig Party collapses during the 1850s before the Confederate States are created. Many former southern Whigs become Constitutional Unionists, conditional Unionists, or secessionists, and they remain influential as individuals.§!\n"
 CSA_radical_democracy_party: "Radical Democrats"
 CSA_radical_democracy_party_long: "Democratic Party\n§YFounded: 1828§!\n§LFormer Democrats continue to share networks and political assumptions, yet wartime politics divides more by support or opposition to Jefferson Davis, state interests, conscription, taxation, and military policy than by a functioning Democratic Party organization.§!\n"
 CSA_traditional_conservatism_party: "Moderate Democrats"
 CSA_traditional_conservatism_party_long: "Democratic Party\n§YFounded: 1828§!\n§LFormer Democrats continue to share networks and political assumptions, yet wartime politics divides more by support or opposition to Jefferson Davis, state interests, conscription, taxation, and military policy than by a functioning Democratic Party organization.§!\n"
 CSA_dixiecrat_party: "Dixiecrats"
 CSA_dixiecrat_party_long: "Dixiecrat Party\n§YFounded: 1948§!\n§LThe Dixiecrats are the States' Rights Democratic Party form in 1948 in opposition to the national Democratic Party's civil-rights program. They are a twentieth-century segregationist movement.§!\n"
 CSA_autocracy_party: "Radical Aristocrats"
 CSA_autocracy_party_long: "King Cotton Party\n§YFounded: c. 1861§!\n§LThe King Cotton Party rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 CSA_chauvinist_populism_party: "Southern Nationalists"
 CSA_chauvinist_populism_party_long: "Knights of the Golden Circle\n§YFounded: 1854§!\n§LKnights of the Golden Circle is a real secretive pro-slavery organization active before and during the Civil War. It promotes the expansion of slaveholding power into Mexico, Central America, and the Caribbean and is associated with secessionist and Confederate sympathies, but it is a clandestine movement.§!\n"
 CSA_anarchism_party: "Anarchists"
 CSA_anarchism_party_long: "Anarchist Party\n§YFounded: c. 1861§!\n§LAnarchist currents in the United States becomes more visible later in the nineteenth century through individualist, immigrant, and labor movements that challenge centralized authority and conventional political organization.\n\nAnarchist Party draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 CSA_fundamentalism_party: "Evangelical Democrats"
 CSA_fundamentalism_party_long: "Democratic Party\n§YFounded: 1828§!\n§LFormer Democrats continue to share networks and political assumptions, yet wartime politics divides more by support or opposition to Jefferson Davis, state interests, conscription, taxation, and military policy than by a functioning Democratic Party organization.§!\n"

