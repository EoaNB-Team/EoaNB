 MOL_ideology_social_liberalism_party_long: "Comuna Românească\n§YFounded: 1857§!\n§LComuna Românească occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 MOL_ideology_radical_socialism_party_long: "Partidul Socialist Radical\n§YFounded: 31 March 1893§!\n§LPartidul Socialist Radical brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 MOL_social_egalitarianism_party_long: "Partidul Social Democrat\n§YFounded: 1893§!\n§LOrganized Romanian social democracy emerges only in the later nineteenth century. Partidul Social Democrat brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 MOL_centrism_party_long: "Partida Natională\n§YFounded: c. 1856§!\n§LThe Partida Națională is the unionist movement that brings together former 1848 revolutionaries, liberals, progressives, and other supporters of the union of Moldavia and Wallachia. In Moldavia it secures a strong position in the 1859 elective assembly and unites behind Alexandru Ioan Cuza, whose election is followed by his election in Wallachia.§!\n"
 MOL_traditional_conservatism_party_long: "Partidul Conservator\n§YFounded: 3 February 1880§!\n§LRomanian conservative groupings exist well before organized movement, but the Partidul Conservator is established in 1880 after the union of the principalities. It becomes a major party of the Romanian kingdom, associated with figures such as Lascăr Catargiu and with gradualist, landowner-oriented conservatism.§!\n"
 MOL_radical_democracy_party_long: "Partida Liberală Radicală\n§YFounded: 1861§!\n§LPartida Liberală Radicală brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 MOL_autocracy_party_long: "Căimăcămie\n§YFounded: 1858§!\n§LA Căimăcămie is a temporary regency or provisional administration. In Moldavia the three-member regency preceding the 1859 election includes Anastase Panu and Vasile Sturdza, who favors the unionist National Party, alongside the conservative Ștefan Catargiu.§!\n"
 MOL_chauvinist_populism_party_long: "Partidul Nationalist Democrat\n§YFounded: 1910§!\n§LThe Nationalist Democratic Party is a Romanian party founds in 1910 by Nicolae Iorga and A. Partidul Nationalist Democrat gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 MOL_anarchism_party_long: "Anarhistii\n§YFounded: 1884§!\n§LAnarhistii draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 MOL_fundamentalism_party_long: "Partidul Tării\n§YFounded: 1856§!\n§LPartidul Tării draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 LEB_centrism_party_long: "An-Nahdiyyuun\n§YFounded: c. 1840§!\n§LThe An-Nahdiyyuun brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 LEB_centrism_party: "Nahdists"
 LEB_ideology_radical_socialism_party_long: "Al-Harakat Al-Fellahiat Al-Jumhuriyya\n§YFounded: c. 1840§!\n§LThe Al-Harakat Al-Fellahiat Al-Jumhuriyya brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 LEB_ideology_radical_socialism_party: "Fellahinist movement"
 LEB_radical_democracy_party_long: "Al-Aitalaf Al-Maruuni\n§YFounded: c. 1840§!\n§LThe Al-Aitalaf Al-Maruuni gathers authoritarian reformers, officers, reactionary notables, and other figures who distrust the compromises of ordinary party government. It favors disciplined administration, decisive executive authority, and the preservation of the state against factionalism, revolution, and political disorder.\n\nIts supporters differ over how far constitutional forms should survive, but agree that order comes before unrestricted political competition. The movement gains strength wherever established institutions appear too weak to contain crisis or enforce a coherent national policy.§!\n"
 LEB_radical_democracy_party: "Maronite Coalition"
 LEB_autocracy_party: "Shihabids"
 LEB_autocracy_party_long: "Al-Shihabiyuun\n§YFounded: 1697§!\n§LThe Shihab dynasty supplies the emirs of Mount Lebanon from the late seventeenth century until 1842. Its most prominent nineteenth-century ruler, Bashir II, strengthens his authority through alliances with local notables and the Maronite clergy before being deposed in 1840; the dynasty is a ruling family.§!\n"

 TUN_autocracy_party: "House of Husainid"
 TUN_autocracy_party_long: "House of Husainid\n§YFounded: 1705§!\n§LThe House of Husainid rules the Regency of Tunis from 1705 until the abolition of the monarchy in 1957. In the nineteenth century the beys pursue military, administrative, and constitutional reforms while facing growing European financial and political intervention; the house is the ruling dynasty.§!\n"

 FTJ_fundamentalism_party: "Alfaya"
 FTJ_fundamentalism_party_long: "Alfaya\n§YFounded: c. 1770§!\n§LAlfaya is one of the two major political factions of the Imamate of Futa Jallon. It supports the clerical successors of the jihad leader Karamoko Alfa and competes for power with the Soriya, which represents the successors of the military leader Ibrahim Sori; the rivalry shapes the imamate's politics for generations.§!\n"
 FTJ_autocracy_party: "Soriya"
 FTJ_autocracy_party_long: "Soriya\n§YFounded: c. 1770§!\n§LSoriya is one of the two major political factions of the Imamate of Futa Jallon. It supports the successors of the military leader Ibrahim Sori and competes with the Alfaya, the faction of Karamoko Alfa's clerical successors; their rivalry becomes a durable feature of Futa Jallon's political order.§!\n"

 SRW_autocracy_party: "White Rajahs"
 SRW_autocracy_party_long: "White Rajahs\n§YFounded: 1841§!\n§LThe Brooke dynasty, known as the White Rajahs, rules Sarawak from 1841 to 1946 after James Brooke receives the territory from the Sultan of Brunei. Their state is a personal dynastic regime with its own administration and forces. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"

 GLM_traditional_conservatism_party: "Stronnictwo Konserwatywne"
 GLM_traditional_conservatism_party_long: "Stronnictwo Konserwatywne\n§YFounded: 1866§!\n§LPolish conservative organization in Galicia develops among landed elites who favor social order, Catholicism, and negotiates autonomy under Habsburg rule. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"
 GLM_centrism_party: "Towarzystwo Narodowo-Demokratyczne"
 GLM_centrism_party_long: "Towarzystwo Narodowo-Demokratyczne\n§YFounded: 1886§!\n§LPolish national-democratic organization becomes a major political current only in the late nineteenth century, developing through nationalist societies and eventually the National Democratic movement associated with Roman Dmowski.\n\nTowarzystwo Narodowo-Demokratyczne brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"

 BTS_BTS_Party: "BTS"
 BTS_BTS_Party_long: "BTS\n§YFounded: c. 1857§!\n§LBTS gathers the local notables, activists, institutional interests, and personal networks that sustain its political influence. Its leaders seek to turn these connections into a coherent voice capable of shaping appointments, legislation, and the wider direction of government.\n\nThe movement draws strength from the loyalties of its supporters rather than from a rigid national machine. Its future depends on whether those scattered interests can be held together as political competition becomes more organized and the demands placed upon the state continue to grow.§!\n"
 BTS_BTS_Party_Long: "BTS\n§LTaking shape around 1857, BTS gathers the local notables, activists, institutional interests, and personal networks that sustain its political influence. Its leaders seek to turn these connections into a coherent voice capable of shaping appointments, legislation, and the wider direction of government.\n\nThe movement draws strength from the loyalties of its supporters rather than from a rigid national machine. Its future depends on whether those scattered interests can be held together as political competition becomes more organized and the demands placed upon the state continue to grow.§!\n"
