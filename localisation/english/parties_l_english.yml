 ELS_fundamentalism_party: "Conferencia Episcopal de El Salvador"
 ELS_fundamentalism_party_long: "Conferencia Episcopal de El Salvador\n§YFounded: 1958§!\n§LThe Catholic hierarchy in El Salvador exercises political influence through dioceses, bishops, clergy, religious orders, schools, charities, and close ties to local communities. Church leaders defend their role in education, family life, public morality, and the relationship between faith and the state.§!\n"

 GUA_social_egalitarianism_party: "Partido Egalitario"
 GUA_social_egalitarianism_party_long: "Partido Egalitario\n§YFounded: c. 1871§!\n§LPartido Egalitario brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
