 OLD_autocracy_party: "Haus von Oldenburg"
 OLD_autocracy_party_long: "Haus von Oldenburg\n§YFounded: 1091§!\n§LThe House of Oldenburg is the ruling dynasty of the Grand Duchy of Oldenburg. In the nineteenth century the grand duke governs within a constitutional order that develops after the revolutions of 1848, while the dynasty remains a monarchical institution.§!\n"
 OLD_centrism_party: "Liberale Fraktion"
 OLD_centrism_party_long: "Liberale Fraktion\n§YFounded: 1 September 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Liberale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.\n\nLiberale Fraktion brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
