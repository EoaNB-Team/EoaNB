 ROM_ideology_social_liberalism_party_long: "Comuna Românească\n§YFounded: 1857§!\n§LComuna Românească occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 ROM_ideology_radical_socialism_party_long: "Partidul Socialist Radical\n§YFounded: 31 March 1893§!\n§LPartidul Socialist Radical brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 ROM_social_egalitarianism_party_long: "Partidul Social Democrat\n§YFounded: 1893§!\n§LOrganized Romanian social democracy emerges from socialist clubs and publications of the late nineteenth century. In 1893 activists found the Social Democratic Workers' Party of Romania, which demands universal suffrage, free education, an eight-hour working day, progressive taxation, and other labor and democratic reforms.§!\n"
 ROM_centrism_party_long: "Partida Natională\n§YFounded: c. 1856§!\n§LThe Partida Națională is the unionist political grouping that brings together former 1848 revolutionaries, liberals, progressives, and other supporters of uniting Moldavia and Wallachia. In 1859 its organization and parliamentary maneuvering are central to the double election of Alexandru Ioan Cuza and the de facto creation of the United Principalities.§!\n"
 ROM_traditional_conservatism_party_long: "Partidul Conservator\n§YFounded: 3 February 1880§!\n§LRomanian conservative groupings exist from the era of the United Principalities, but the formal Partidul Conservator is organized in Bucharest in 1880. It becomes one of the kingdom's two principal governing parties, drawing heavily on landowners and conservative elites and favoring gradual, organic reform rather than rapid social transformation.§!\n"
 ROM_radical_democracy_party_long: "Partida Liberală Radicală\n§YFounded: 1861§!\n§LPartida Liberală Radicală brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 ROM_autocracy_party_long: "Căimăcămie\n§YFounded: 1858§!\n§LA Căimăcămie is a temporary regency or provisional administration.\n\nUnder the arrangements preceding the elections of 1859, Wallachia is governed by a three-member regency while the elective assembly prepares to choose a new prince. Căimăcămie rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 ROM_chauvinist_populism_party_long: "Partidul Nationalist Democrat\n§YFounded: 1910§!\n§LThe Nationalist Democratic Party is founded in 1910 by Nicolae Iorga and A. It combines Romanian nationalism with a program appealing to intellectuals, small proprietors, artisans, and peasants; its nationalist program becomes an important current in early twentieth-century Romanian politics.§!\n"
 ROM_anarchism_party_long: "Anarhistii\n§YFounded: 1884§!\n§LAnarhistii draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 ROM_fundamentalism_party_long: "Partidul Tării\n§YFounded: 1856§!\n§LPartidul Tării draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

