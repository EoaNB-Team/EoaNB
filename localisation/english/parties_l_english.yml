 HSD_fundamentalism_party: "Zentrumsfraktion"
 HSD_fundamentalism_party_long: "Zentrumsfraktion\n§YFounded: 1870§!\n§LThe German Centre Party arises around 1870-1871 to represent Catholic political interests in the new German Empire. It defends the constitutional and confessional rights of Catholics, opposes much of Bismarck's Kulturkampf, and becomes a durable mass party able to cooperate with different governments on non-religious questions.§!\n"

 MCK_autocracy_party: "Haus von Mecklenburg"
 MCK_autocracy_party_long: "Haus von Mecklenburg\n§YFounded: 1131§!\n§LThe houses ruling Mecklenburg-Schwerin and Mecklenburg-Strelitz are branches of the long-establish Mecklenburg dynasty. Their grand dukes governs unusually conservative states whose representative institutions remains dominates by the landed estates.§!\n"
