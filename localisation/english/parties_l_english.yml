 BUE_social_egalitarianism_party: "Partido Social Egalitario"
 BUE_social_egalitarianism_party_long: "Partido Social Egalitario\n§YFounded: c. 1824§!\n§LPartido Social Egalitario brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
