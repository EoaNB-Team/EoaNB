 GENAMER_trade_company_1: "Hudson Bay Company"
 GENAMER_trade_company_1_long: "Hudson Bay Trading Company\n§YFounded: 1670§!\n§LThe Hudson's Bay Company is chartered in 1670 and for two centuries combines the fur trade with extensive territorial and administrative powers in Rupert's Land. It is a commercial corporation.§!\n"

 CAN_ideology_social_liberalism_party: "Communist Party of Canada"
 CAN_ideology_social_liberalism_party_long: "Communist Party of Canada\n§YFounded: 1921§!\n§LThe Communist Party of Canada is founded in 1921, initially operating under conditions of legal repression and using other organizational names for public activity. Communist Party of Canada brings together workers and social reformers who argue that political liberty must be matched by economic security. Its program emphasizes labor organization, cooperation, social reform, and a larger public role in confronting the inequalities of industrial society.§!\n"
 CAN_ideology_radical_socialism_party: "Parti Rouge"
 CAN_ideology_radical_socialism_party_long: "Parti Rouge\n§YFounded: 1847§!\n§LParti Rouge is the radical reform current of Canada East in the 1840s and 1850s, drawing on the republican and democratic inheritance of the Patriote movement. Rouges favor wider democracy, secularization and reduction of clerical influence, and other liberal reforms; they later help form the Quebec wing of the Liberal Party.§!\n"
 CAN_social_egalitarianism_party: "Reform Party"
 CAN_social_egalitarianism_party_long: "Reform Party\n§YFounded: c. 1848§!\n§LThe pre-Confederation Reform movement in Canada West is a broad liberal coalition. Reformers press for responsible government and later divide over representation, secularization, and constitutional questions; George Brown's Clear Grit tendency becomes increasingly influential in the 1850s.§!\n"
 CAN_centrism_party: "Clear Grits"
 CAN_centrism_party_long: "Clear Grits\n§YFounded: c. 1849§!\n§LThe Clear Grits are a radical Reform movement in Canada West that emerges around 1849-1850. Their program includes broader representation, retrenchment in government, secularization of the clergy reserves, and other democratic reforms; under George Brown their supporters become central to the pre-Confederation Reform movement and later Canadian Liberalism.§!\n"
 CAN_radical_democracy_party: "Anti-Confederates"
 CAN_radical_democracy_party_long: "Anti-Confederates\n§YFounded: c. 1864§!\n§LThe Anti-Confederate movement opposes the terms or principle of Canadian Confederation, most powerfully in Nova Scotia and also in New Brunswick and Newfoundland. Its supporters fear loss of local autonomy, new fiscal burdens, or political domination by the larger Canadian provinces.§!\n"
 CAN_traditional_conservatism_party: "Parti Bleu"
 CAN_traditional_conservatism_party_long: "Parti Bleu\n§YFounded: 1854§!\n§LParti Bleu emerges in Canada East during the 1850s as a conservative French-Canadian coalition associated with George-Étienne Cartier. It defends Catholic and French-Canadian institutional interests, favors political order and economic development, and becomes an important component of the Liberal-Conservative coalition that helps create Confederation.§!\n"
 CAN_autocracy_party: "British Crown"
 CAN_autocracy_party_long: "British Crown\n§YFounded: 1707§!\n§LBritish Crown is the legal and constitutional source of executive authority in Britain's colonies, represent locally by governors and responsible ministers as self-government develop. British Crown rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 CAN_chauvinist_populism_party: "Orange Order"
 CAN_chauvinist_populism_party_long: "Orange Order\n§YFounded: 1795§!\n§LThe Orange Order is a Protestant fraternal organization. In nineteenth-century British North America its lodges could exercise substantial electoral and social influence, especially among Irish Protestants, and are associated with loyalty to the British connection and resistance to Catholic political power.§!\n"
 CAN_anarchism_party: "Anarchist Circles"
 CAN_anarchism_party_long: "Anarchist Circles\n§YFounded: c. 1870s§!\n§LAnarchist ideas and organizations become more visible in Canada later in the nineteenth and early twentieth centuries, especially through immigrant and labor networks. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 CAN_fundamentalism_party: "Archdiocese of Ottawa"
 CAN_fundamentalism_party_long: "Archdiocese of Ottawa\n§YFounded: 25 June 1847§!\n§LThe Roman Catholic Diocese of Bytown is created in 1847, renamed the Diocese of Ottawa in 1860, and raised to an archdiocese only in 1886.\n\nArchdiocese of Ottawa draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 BRK_ideology_social_liberalism_party: "Liberal Reformers"
 BRK_ideology_social_liberalism_party_long: "Liberal Reformers\n§YFounded: 20 May 1848§!\n§LThe Liberal Reformers occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 BRK_ideology_radical_socialism_party: "Socialist Circles"
 BRK_ideology_radical_socialism_party_long: "Socialist Circles\n§YFounded: July 1902§!\n§LThe Socialist Circles draws together workers, artisans, radical intellectuals, and organizers who see economic power as inseparable from political power. Its program stresses labor organization, social ownership or cooperation, and a decisive challenge to the privileges of wealth and inherited hierarchy.\n\nThe movement looks beyond ordinary constitutional reform and seeks a deeper transformation of society. Its supporters disagree over the pace and method of change, but share the conviction that the existing economic order leaves working people without the power or security promised by political liberty.§!\n"
 BRK_social_egalitarianism_party: "Reformers"
 BRK_social_egalitarianism_party_long: "Reformers\n§YFounded: 20 May 1848§!\n§LThe Reformers brings together progressive reformers, workers, professionals, and social activists who argue that political liberty must be matched by wider social opportunity. The movement favors education, labor reform, broader participation in government, and a more active public role in confronting poverty and inequality.\n\nIts supporters regard reform as a means of strengthening society rather than overturning it. They press the established political order to answer the demands of industrialization and urban growth while competing with both laissez-faire liberals and revolutionary socialist currents.§!\n"
 BRK_centrism_party: "Liberal Branch of the Confederation Party"
 BRK_centrism_party_long: "Liberal Branch of the Confederation Party\n§YFounded: c. 1864§!\n§LThe Liberal Branch of the Confederation Party brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 BRK_radical_democracy_party: "Anti-Confederates"
 BRK_radical_democracy_party_long: "Anti-Confederates\n§YFounded: 1865§!\n§LNew Brunswick's anti-Confederation movement is a real electoral force in the mid-1860s. Opponents of the Quebec Resolutions fear higher taxes, reduced provincial autonomy, and unfavorable terms; however, Confederation cuts across older personal and factional lines.§!\n"
 BRK_traditional_conservatism_party: "Conservative Branch of the Confederation Party"
 BRK_traditional_conservatism_party_long: "Conservative Branch of the Confederation Party\n§YFounded: c. 1864§!\n§LThe Conservative Branch of the Confederation Party rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"
 BRK_autocracy_party: "British Crown"
 BRK_autocracy_party_long: "British Crown\n§YFounded: 1707§!\n§LBritish Crown is the legal and constitutional source of executive authority in Britain's colonies, represent locally by governors and responsible ministers as self-government develop. British Crown rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 BRK_chauvinist_populism_party: "Imperial Loyalists"
 BRK_chauvinist_populism_party_long: "Imperial Loyalists\n§YFounded: 1784§!\n§LSupporters of Imperial Loyalists channel regional interests and public loyalties into a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 BRK_anarchism_party: "Anarchist Circles"
 BRK_anarchism_party_long: "Anarchist Circles\n§YFounded: c. 1848§!\n§LAt the heart of Anarchist Circles is a commitment to voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 BRK_fundamentalism_party: "Diocese of Bathurst"
 BRK_fundamentalism_party_long: "Diocese of Bathurst\n§YFounded: 8 May 1860§!\n§LDiocese of Bathurst draws political weight from religious institutions, clergy, scholars, and the communities that look to them for moral authority. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"

 NVS_ideology_social_liberalism_party: "Liberal Party"
 NVS_ideology_social_liberalism_party_long: "Liberal Party\n§YFounded: c. 1848§!\n§LBritain's Liberal Party takes shape in the mid-nineteenth century from Whigs, Peelites, Radicals, and other reformers. It becomes a major governing party under leaders such as Lord Palmerston and William Gladstone, supporting parliamentary reform, free trade, civil and religious liberties, and, in varying forms, retrenchment and nonconformist causes.§!\n"
