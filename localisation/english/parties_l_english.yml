 SAX_radical_democracy_party: "Sächsischer Landtag"
 SAX_radical_democracy_party_long: "Sächsischer Landtag\n§YFounded: 1831§!\n§LThe Sächsischer Landtag is the representative legislature of the Kingdom of Saxony. Under the constitutional settlement of 1831 it provides the institutional arena in which conservative, liberal, democratic, and later socialist representatives contest Saxon politics.§!\n"
 SAX_autocracy_party: "Haus von Wettin"
 SAX_autocracy_party_long: "Haus von Wettin\n§YFounded: c. 965§!\n§LThe House of Wettin is one of Germany's oldest dynasties and rules Saxony through its Albertine branch. The kings of Saxony presides over a constitutional monarchy after 1831, while parliamentary politics increasingly develops among liberals, conservatives, democrats, and workers' movements.§!\n"
 SAX_fundamentalism_party: "Evangelische Kirche Sachsens"
 SAX_fundamentalism_party_long: "Evangelische Kirche Sachsens\n§YFounded: c. 1922§!\n§LThe Evangelical Lutheran church is a central institution of the Kingdom of Saxony and retains the character of a territorial state church under the monarchy. Their influence reaches into education, family life, customary law, charity, and the relationship between faith and the state.§!\n"
 SAX_chauvinist_populism_party: "Antisemitische Bewegung"
 SAX_chauvinist_populism_party_long: "Antisemitische Bewegung\n§YFounded: 1878§!\n§LThe organized antisemitic movement in German-speaking Europe emerges mainly from the late 1870s, when agitators and small parties turns religious and increasingly racial antisemitism into an electoral program.\n\nAntisemitische Bewegung gathers supporters around national unity, sovereignty, and the future direction of the state. The movement seeks to bind regional interests and public loyalties to a common political purpose, presenting national strength as the answer to division and foreign pressure.§!\n"
 SAX_anarchism_party: "Anarchistische Bewegung"
 SAX_anarchism_party_long: "Anarchistische Bewegung\n§YFounded: c. 1878§!\n§LAnarchistische Bewegung draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"

 SAX_ideology_social_liberalism_progressive_party: "Fortschrittsverein"
 SAX_ideology_social_liberalism_progressive_party_long: "Sächsischer Fortschrittsverein\n§YFounded: c. 1861§!\n§LSächsischer Fortschrittsverein occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 SAX_social_egalitarianism_adav_party: "ADAV"
 SAX_social_egalitarianism_adav_party_long: "Allgemeiner Deutscher Arbeiterverein\n§YFounded: 23 May 1863§!\n§LThe General German Workers' Association is founded in Leipzig in 1863 under Ferdinand Lassalle and is commonly regarded as the first enduring German workers' party. It advocates universal male suffrage and state-assisted workers' cooperatives and later merges with the Social Democratic Workers' Party at Gotha in 1875.§!\n"

 THU_autocracy_party: "Haus von Sachsen-Weimar-Eisenach"
 THU_autocracy_party_long: "Haus von Sachsen-Weimar-Eisenach\n§YFounded: 1741§!\n§LThe grand dukes of Saxe-Weimar-Eisenach belong to the Ernestine branch of the House of Wettin. The state has a constitutional tradition dating from 1816 and is associated with German cultural liberalism, but the ruling house remains a dynasty.§!\n"
 THU_centrism_party: "Liberale Fraktion"
 THU_centrism_party_long: "Liberale Fraktion\n§YFounded: c. 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Liberale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.\n\nLiberale Fraktion brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 THU_ideology_social_liberalism_party: "Linksliberale Fraktion"
 THU_ideology_social_liberalism_party_long: "Linksliberale Fraktion\n§YFounded: c. 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Linksliberale Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm.\n\nLinksliberale Fraktion brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 THU_traditional_conservatism_party: "Konservative Fraktion"
 THU_traditional_conservatism_party_long: "Konservative Fraktion\n§YFounded: c. 1848§!\n§LWithin nineteenth-century German-speaking legislatures, Konservative Fraktion takes shape as one of the loose political groupings through which deputies coordinate before durable mass parties and permanent national organizations become the norm. Supporters favor cautious reform, strong government, and preservation of the traditions they believe hold society together.§!\n"

 BRE_centrism_party: "Fraktion der Kaufleute"
 BRE_centrism_party_long: "Fraktion der Kaufleute\n§YFounded: c. 1848§!\n§LFraktion der Kaufleute brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 BRE_ideology_social_liberalism_party: "Fraktion der Handwerker"
 BRE_ideology_social_liberalism_party_long: "Fraktion der Handwerker\n§YFounded: c. 1848§!\n§LFraktion der Handwerker occupies the reforming wing of liberal politics, combining support for constitutional government and civil liberties with a willingness to use the state to widen opportunity. Its supporters favor education, legal equality, freer public debate, and measured social reform alongside commercial development.\n\nThe party seeks to modernize existing institutions rather than destroy them. It therefore competes for the loyalty of professionals, merchants, reform-minded officials, and urban voters who reject both rigid conservatism and revolutionary politics.§!\n"
 BRE_traditional_conservatism_party: "Fraktion der Gelehrten"
 BRE_traditional_conservatism_party_long: "Fraktion der Gelehrten\n§YFounded: c. 1848§!\n§LFraktion der Gelehrten rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"

