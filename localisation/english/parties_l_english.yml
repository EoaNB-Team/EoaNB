 SCH_autocracy_party: "Haus von Oldenburg"
 SCH_autocracy_party_long: "Haus von Oldenburg\n§YFounded: 1091§!\n§LThe House of Oldenburg is the dynasty historically connected with the Danish crown and the duchies of Schleswig and Holstein. Its dynastic claims lie at the center of the Schleswig-Holstein succession dispute that helps produce the First and Second Schleswig Wars.§!\n"
 SCH_autocracy_party_augustenburg: "Haus von Augustenburg"
 SCH_autocracy_party_augustenburg_long: "Haus von Augustenburg\n§YFounded: 1647§!\n§LThe House of Schleswig-Holstein-Sonderburg-Augustenburg is a cadet branch of the House of Oldenburg. Duke Christian August and later his son Frederick advance hereditary claims to Schleswig and Holstein, making the Augustenburg cause a major focus of the German national movement during the Schleswig-Holstein conflicts.§!\n"
 SCH_autocracy_party_provisional: "Provisional Government"
 SCH_autocracy_party_provisional_long: "Provisional Government\n§YFounded: c. 1848§!\n§LProvisional governments arise during coups, revolutions, and constitutional crises, gathering officials, military leaders, and political notables around the immediate task of preserving authority and establishing a new constitutional settlement.\n\nProvisional Government rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 SCH_autocracy_party_prussia: "Haus von Hohenzollern"
 SCH_autocracy_party_prussia_long: "Haus von Hohenzollern\n§YFounded: 1061§!\n§LThe House of Hohenzollern rules Prussia and, from 1871, supplies the German emperors. The dynasty stands at the monarchical center of the Prussian state, supported by the army, bureaucracy, and landed elite.§!\n"
 SCH_centrism_party: "Nationalliberale Bewegung"
 SCH_centrism_party_long: "Nationalliberale Bewegung\n§YFounded: c. 1848§!\n§LNationalliberale Bewegung brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 SCH_traditional_conservatism_party: "Konservative Bewegung"
 SCH_traditional_conservatism_party_long: "Konservative Bewegung\n§YFounded: c. 1848§!\n§LKonservative Bewegung rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"
 
 HLS_autocracy_party: "Haus von Oldenburg"
 HLS_autocracy_party_long: "Haus von Oldenburg\n§YFounded: 1091§!\n§LThe House of Oldenburg is the dynasty historically connected with the Danish crown and the duchies of Schleswig and Holstein. Its dynastic rights and the disputed succession in the duchies form part of the Schleswig-Holstein Question, one of the central constitutional and national conflicts of nineteenth-century Germany and Denmark.§!\n"
 HLS_autocracy_party_augustenburg: "Haus von Augustenburg"
 HLS_autocracy_party_augustenburg_long: "Haus von Augustenburg\n§YFounded: 1647§!\n§LThe House of Schleswig-Holstein-Sonderburg-Augustenburg is a cadet branch of the House of Oldenburg whose members claims succession rights in Schleswig and Holstein. Frederick of Augustenburg becomes the principal German claimant to the duchies during the crisis surrounding the Second Schleswig War.§!\n"
 HLS_autocracy_party_provisional: "Provisional Government"
 HLS_autocracy_party_provisional_long: "Provisional Government\n§YFounded: c. 1848§!\n§LProvisional governments arise during coups, revolutions, and constitutional crises, gathering officials, military leaders, and political notables around the immediate task of preserving authority and establishing a new constitutional settlement.\n\nProvisional Government rallies supporters of hereditary authority and the political traditions surrounding the crown. Its adherents argue that strong sovereign authority offers continuity, legitimacy, and a stabilizing center in an age of constitutional and revolutionary change.§!\n"
 HLS_autocracy_party_austria: "Haus von Habsburg"
 HLS_autocracy_party_austria_long: "Haus von Habsburg\n§YFounded: c. 1020§!\n§LThe House of Habsburg-Lorraine is the ruling dynasty of the Austrian Empire and, after 1867, Austria-Hungary. The dynasty stands above party politics and governs through the imperial court, ministers, bureaucracy, army, and negotiates constitutional arrangements with the monarchy's many lands and nationalities.§!\n"
 HLS_centrism_party: "Nationalliberale Bewegung"
 HLS_centrism_party_long: "Nationalliberale Bewegung\n§YFounded: c. 1848§!\n§LNationalliberale Bewegung brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 HLS_traditional_conservatism_party: "Konservative Bewegung"
 HLS_traditional_conservatism_party_long: "Konservative Bewegung\n§YFounded: c. 1848§!\n§LKonservative Bewegung rallies landowners, clergy, officials, and traditional notables around the defense of established institutions. It favors public order, property, religious influence, and cautious reform carried out through a strong and legitimate government.\n\nThe party presents itself as a guardian of continuity in an age of rapid political and social change. Its leaders accept reform when they believe it is necessary to preserve stability, but resist measures that threaten hierarchy, local authority, or the foundations of the existing state.§!\n"

 HAN_autocracy_party: "Haus von Hannover"
 HAN_autocracy_party_long: "Haus von Hannover\n§YFounded: 1635§!\n§LThe House of Hanover, a branch of the Welf dynasty, rules the Kingdom of Hanover after its separation from the British crown in 1837.\n\nKing George V reigns from 1851 until Prussia annexes Hanover in 1866; the house is a ruling dynasty. Haus von Hannover bases its authority on dynastic legitimacy, court patronage, and the loyalty of officials and traditional elites. Supporters of the ruling house see it as a source of continuity and political order as constitutional and nationalist movements challenge older structures of power.§!\n"
