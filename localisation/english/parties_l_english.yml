 GAL_social_egalitarianism_party_long: "Partido Progressista\n§YFounded: June 1838§!\n§LPartido Progressista brings together reformers who press for a more responsive state, broader civil rights, and modernization of public institutions. Supporters look to constitutional reform, education, commerce, and wider political participation as the path toward national strength.§!\n"
 GAL_anarchism_party: "Anarquistas de Galicia"
 GAL_anarchism_party_long: "Anarquistas de Galicia\n§YFounded: c. 1870§!\n§LAnarquistas de Galicia draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"

