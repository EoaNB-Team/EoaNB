 ASA_radical_democracy_party: "Military Lobbyists"
 ASA_corporatism_party_long: "The Gilded League\n§YFounded: c. 1857§!\n§LThe Gilded League gathers the local notables, activists, institutional interests, and personal networks that sustain its political influence. Its leaders seek to turn these connections into a coherent voice capable of shaping appointments, legislation, and the wider direction of government.\n\nThe movement draws strength from the loyalties of its supporters rather than from a rigid national machine. Its future depends on whether those scattered interests can be held together as political competition becomes more organized and the demands placed upon the state continue to grow.§!\n"
 ASA_corporatism_party: "Corporate Lobbyists"
 ASA_anarchism_party_long: "Individualist Sovereign Party\n§YFounded: c. 1857§!\n§LThe Individualist Sovereign Party draws support from radical critics of centralized authority and inherited privilege. Its adherents favor voluntary association, local autonomy, and sweeping limits on coercive government, placing individual and communal freedom at the center of political life.§!\n"
 ASA_anarchism_party: "Mutualists"

 LIB_centrism_party_long: "Republican Party\n§YFounded: 1854§!\n§LLiberia's Republican Party is the dominant political organization of the early republic and produces presidents including Joseph Jenkins Roberts. It represents much of the Americo-Liberian governing elite until the True Whig Party displaces it in 1878, after which Republican influence rapidly declines.§!\n"
 LIB_centrism_party: "Republicans"
 LIB_traditional_conservatism_party_long: "True Whig Party\n§YFounded: 1869§!\n§LThe True Whig Party is founded in 1869 and becomes Liberia's dominant political organization after the 1870s. Closely associated with the Americo-Liberian elite, it controls national government for more than a century until the military coup of 1980 ends its long monopoly on power.§!\n"
 LIB_traditional_conservatism_party: "Whigs"
