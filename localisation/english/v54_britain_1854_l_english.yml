l_english:
 ## Britain 1854-1857: tooltips, ideas, decisions, opinion modifiers
 v54_tt_gbr_stance_war: "Britain went to war against Russia in the Eastern crisis"
 v54_tt_gbr_stance_mediation: "Britain chose to mediate in the Eastern crisis"
 v54_tt_gbr_stance_neutral: "Britain chose to stand aside in the Eastern crisis"
 v54_tt_gbr_stance_russia: "Britain chose an understanding with Russia in the Eastern crisis"
 v54_tt_gbr_pm_palmerston: "Lord Palmerston has become Prime Minister"
 v54_tt_gbr_unrest_above_zero: "There is unrest in the Bengal army"
 v54_om_royal_match: "Royal Match"
 v54_om_persian_war: "Persian War"
 v54_om_arrow_war: "The Arrow War"
 v54_decisions_category_gbr_1854: "Britain in 1854"
 v54_decisions_category_gbr_1854_desc: "The war, the Raj and the Empire in the years before the Mutiny."

 ENG_v54_idea_baltic_fleet: "The Baltic Fleet"
 ENG_v54_idea_baltic_fleet_desc: "The greatest fleet since Trafalgar has cruised the Baltic, and a generation of officers has learned to handle steam battleships in company."
 ENG_v54_idea_nightingale: "The Lady with the Lamp"
 ENG_v54_idea_nightingale_desc: "Miss Nightingale and her nurses have made the army hospitals fit for the men in them, and the public wants more of it."
 ENG_v54_idea_land_transport: "The Land Transport Corps"
 ENG_v54_idea_land_transport_desc: "The army has its own carts, mules and a railway, and the men are fed."
 ENG_v54_idea_horse_guards: "The Horse Guards"
 ENG_v54_idea_horse_guards_desc: "The Commander-in-Chief's office controls promotion and discipline and distrusts novelty."
 ENG_v54_idea_coalition_cabinet: "The Coalition Cabinet"
 ENG_v54_idea_coalition_cabinet_desc: "Peelites and Whigs share the Treasury Bench, with ability in abundance and unity in short supply."
 ENG_v54_idea_public_opinion: "The Fourth Estate"
 ENG_v54_idea_public_opinion_desc: "The Times and its rivals tell the country what the government is doing, and the government reads them for the same reason."
 ENG_v54_idea_manchester_school: "The Manchester School"
 ENG_v54_idea_manchester_school_desc: "Cobden and Bright believe that trade, not war, is Britain's business, and Lancashire agrees."
 ENG_v54_idea_palmerston_ministry: "The Palmerston Ministry"
 ENG_v54_idea_palmerston_ministry_desc: "The most popular man in England governs, and the war is prosecuted with a will."
 ENG_v54_idea_prince_albert: "The Prince Consort"
 ENG_v54_idea_prince_albert_desc: "Prince Albert reads every dispatch and presses for science, education and improvement."
 ENG_v54_idea_free_trade: "Free Trade"
 ENG_v54_idea_free_trade_desc: "The tariff has been reduced to a handful of revenue duties, and Britain's merchants trade with the world on equal terms."
 ENG_v54_idea_shipyards: "The Clyde and the Thames"
 ENG_v54_idea_shipyards_desc: "Iron hulls, screw propellers and compound engines are built faster than the Admiralty can specify them."
 ENG_v54_idea_limited_liability: "Limited Liability"
 ENG_v54_idea_limited_liability_desc: "Shareholders may risk only what they invest, and the City discovers a new way of raising capital."
 ENG_v54_idea_coal_and_iron: "Coal and Iron"
 ENG_v54_idea_coal_and_iron_desc: "Half the world's coal and iron come from British pits and furnaces."
 ENG_v54_idea_merit_commissions: "Commissions by Merit"
 ENG_v54_idea_merit_commissions_desc: "Officers are chosen for what they know. The aristocracy does not like it."
 ENG_v54_idea_steam_navy: "The Steam Navy"
 ENG_v54_idea_steam_navy_desc: "The line-of-battle ships have been converted to steam, and the Admiralty is determined not to be caught napping."
 ENG_v54_idea_gunboats: "Gunboats and Mortar Vessels"
 ENG_v54_idea_gunboats_desc: "A hundred shallow-draught vessels have been built to attack coastal fortresses."
 ENG_v54_idea_staff_college: "The Staff College"
 ENG_v54_idea_staff_college_desc: "Officers learn the sciences of war before they have to practise them."
 ENG_v54_idea_expeditionary_army: "The Army of the East"
 ENG_v54_idea_expeditionary_army_desc: "A British army has been shipped to the far side of the Black Sea, with a supply system that was designed for peace."
 ENG_v54_idea_crimean_winter: "The Winter before Sevastopol"
 ENG_v54_idea_crimean_winter_desc: "Frost, cholera and bad supply kill the army faster than the Russians do."
 ENG_v54_idea_army_scandal: "The Army Scandal"
 ENG_v54_idea_army_scandal_desc: "The government has tried to explain the Crimean winter away, and no one believes it."
 ENG_v54_idea_income_tax_doubled: "The Doubled Income Tax"
 ENG_v54_idea_income_tax_doubled_desc: "The war is paid for out of taxation, and taxpayers are not pleased."
 ENG_v54_idea_civil_service_reform: "The Civil Service Commission"
 ENG_v54_idea_civil_service_reform_desc: "Clerks are appointed by examination, and patronage is no longer what it was."
 ENG_v54_idea_tenant_right: "Tenant Right"
 ENG_v54_idea_tenant_right_desc: "Irish tenants have a legal claim on the improvements they make, and Irish landlords have a legal grievance."
 ENG_v54_idea_paris_declaration: "The Declaration of Paris"
 ENG_v54_idea_paris_declaration_desc: "Privateering is abolished, and a neutral flag covers enemy goods. Trade gains and the Admiralty grumbles."
 ENG_v54_idea_sanitary_reform: "Sanitary Reform"
 ENG_v54_idea_sanitary_reform_desc: "London's water companies are made to draw their water above the tideway."
 ENG_v54_idea_victoria_cross: "The Victoria Cross"
 ENG_v54_idea_victoria_cross_desc: "A simple bronze cross is awarded for valour to officers and men alike."
 ENG_v54_idea_bessemer: "Bessemer Steel"
 ENG_v54_idea_bessemer_desc: "Steel can be made in minutes instead of days, and the price of it begins to fall."

 v54_gbr_dec_reinforce_the_crimea: "Reinforce the Crimea"
 v54_gbr_dec_reinforce_the_crimea_desc: "Draft more men to the army before Sevastopol. The Treasury notices."
 v54_gbr_dec_foreign_legions: "The Foreign Legions"
 v54_gbr_dec_foreign_legions_desc: "The Foreign Enlistment Act allows recruiting German, Swiss and Italian legions, and the American minister will complain.\n\n$V54_HISTORICAL_MARK$ §gHistorically: some fifteen thousand foreigners were enlisted, mostly Germans and Swiss.§!"
 v54_gbr_dec_visit_to_paris: "The Queen in Paris"
 v54_gbr_dec_visit_to_paris_desc: "Victoria and Albert visit the Emperor and Empress at the Exhibition in Paris.\n\n$V54_HISTORICAL_MARK$ §gHistorically: the visit took place in August 1855 and was a great social success.§!"
 v54_gbr_dec_spithead_review: "The Spithead Review"
 v54_gbr_dec_spithead_review_desc: "The fleet that went to the Baltic and the Black Sea is reviewed by the Queen in the Solent.\n\n$V54_HISTORICAL_MARK$ §gHistorically: the review took place on 23 April 1856, with more than two hundred ships, many of them steam gunboats.§!"
 v54_gbr_dec_garrison_for_india: "European Regiments for Bengal"
 v54_gbr_dec_garrison_for_india_desc: "More British regiments and fewer native ones make the presidency safer and the Treasury poorer. Lowers the unrest in the Bengal army."
 v54_gbr_dec_bengal_army_inquiry: "Inquiry into the Bengal Army"
 v54_gbr_dec_bengal_army_inquiry_desc: "A commission is sent to hear the grievances of the sepoys: pay, promotion, caste and the loss of the old privileges. Lowers the unrest in the Bengal army."
 v54_gbr_dec_public_works_in_india: "Public Works in India"
 v54_gbr_dec_public_works_in_india_desc: "Railways, telegraphs and canals are built across the subcontinent. They make money and they make the old order uneasy. Raises the unrest in the Bengal army slightly."

 ## Britain 1854-1857: events
 v54_gbr.50.t: "The Eastern Question"
 v54_gbr.50.d: "Russian troops are in the Principalities, the Turkish fleet has been burnt at Sinope and the Czar claims a protectorate over the Sultan's Christian subjects. Lord Aberdeen wants peace, Palmerston and Russell want firmness, and The Times wants war.\n\nThe road to India runs through Constantinople, or so every Englishman has been taught, and the Cabinet is divided on whether the Czar's intentions are a threat to it."
 v54_gbr.50.a: "The Cabinet will decide."
 v54_gbr.51.t: "War Aims"
 v54_gbr.51.d: "The Cabinet has agreed to fight, and now it must agree what for. The Prime Minister wishes only to protect the Ottoman Empire and the Straits. The First Lord of the Admiralty and the Press want Sevastopol and the Russian fleet destroyed. The Foreign Secretary privately wishes for a good deal more."
 v54_gbr.51.a: "$V54_HISTORICAL_MARK$ Destroy the Russian fleet and take Sevastopol.\n§gHistorically: the army was sent to the Crimea with the object of taking Sevastopol, and the Four Points were the diplomatic basis of the peace.§!"
 v54_gbr.51.b: "Defend the Ottoman Empire and the Straits, and no more."
 v54_gbr.51.c: "Break Russia's power: Poland, Finland and the Crimea."
 v54_gbr.52.t: "The Baltic Campaign"
 v54_gbr.52.d: "Sir Charles Napier has taken the finest fleet in British history into the Baltic. Kronstadt is better defended than the charts suggest, the Admiral's temper is not improving, and the Press wants a victory. The Russian fortress of Bomarsund, on the Aaland Islands, is within reach."
 v54_gbr.52.a: "$V54_HISTORICAL_MARK$ Take Bomarsund and withdraw before winter.\n§gHistorically: Bomarsund fell to British and French forces in August 1854. Napier did not attack Kronstadt, and he was relieved of his command that winter.§!"
 v54_gbr.52.b: "Attack Kronstadt, as the Press demands."
 v54_gbr.52.c: "Blockade the coast and let the timber and hemp rot."
 v54_gbr.53.t: "The Charge of the Light Brigade"
 v54_gbr.53.d: "At Balaclava a misunderstood order sent six hundred and seventy-three men of the Light Brigade against a battery of Russian guns at the end of a mile-long valley. Two hundred and seventy-eight were killed, wounded or taken. The French General Bosquet watched, and said that it was magnificent, but it was not war.\n\nEngland reads the news with horror and pride."
 v54_gbr.53.a: "Someone had blundered, but the men were splendid."
 v54_gbr.53.b: "Open an inquiry into who gave the order."
 v54_gbr.54.t: "The Expeditionary Force"
 v54_gbr.54.d: "Lord Raglan, who has not commanded in the field since Waterloo, takes an army to Turkey. The Guards, the Highland Brigade and the Light Division are good troops, the Commissariat is not, and no one has estimated how many men a siege will need.\n\nThe question is whether to send the whole army, or a smaller force to hold the Straits."
 v54_gbr.54.a: "$V54_HISTORICAL_MARK$ Send the whole army, and land it in the Crimea.\n§gHistorically: some 26,000 British troops landed at Calamita Bay in September 1854, and the army in the Crimea grew to about 50,000 men by 1856.§!"
 v54_gbr.54.b: "Send a small force, and keep the Straits."
 v54_gbr.55.t: "The Death of Lord Raglan"
 v54_gbr.55.d: "The Commander-in-Chief has died in his headquarters outside Sevastopol, of cholera and of exhaustion. Lord Raglan was a gentleman and a loyal servant, and he was criticised every day of the winter by the very men who had sent him.\n\nThe Horse Guards propose General Simpson, the senior officer. The army wants Colin Campbell, an old soldier who led the Highland Brigade at the Alma and Balaclava and who has been kept in brigade commands for want of friends."
 v54_gbr.55.a: "$V54_HISTORICAL_MARK$ Appoint General Simpson.\n§gHistorically: Simpson, the Chief of Staff, took command. He was replaced by General Codrington in November 1855.§!"
 v54_gbr.55.b: "Give the command to Sir Colin Campbell."
 v54_gbr.56.t: "The Winter before Sevastopol"
 v54_gbr.56.d: "Frost, cholera and bad supply are killing the army faster than the Russians. Russell's dispatches in The Times tell England what the ministers had hoped would remain unsaid, and the House asks why the Commissariat has no boots, no huts and no hospitals.\n\nThe Secretary of State for War must decide what to tell the public."
 v54_gbr.56.a: "$V54_HISTORICAL_MARK$ Send a commission of inquiry and a party of nurses.\n§gHistorically: Sidney Herbert sent Florence Nightingale to Scutari in October 1854, and a Sanitary Commission followed in the spring.§!"
 v54_gbr.56.b: "Deny the worst of it and trust the Commissariat."
 v54_gbr.57.t: "The Roebuck Motion"
 v54_gbr.57.d: "Mr Roebuck has moved for a select committee to inquire into the conduct of the war, and the House has carried it by 305 votes to 148. The Aberdeen coalition cannot survive a vote of censure by its own supporters, and the Prime Minister has gone to Windsor.\n\nThe Queen must find a minister who can win the war."
 v54_gbr.57.a: "$V54_HISTORICAL_MARK$ Lord Palmerston forms a government.\n§gHistorically: the Queen turned first to Lord Derby, then to Lord John Russell, and finally to Palmerston, who became Prime Minister on 6 February 1855. The Peelites resigned a fortnight later.§!"
 v54_gbr.57.b: "Lord John Russell forms a government."
 v54_gbr.57.c: "Lord Aberdeen fights on with a reshuffled Cabinet."
 v54_gbr.58.t: "The Declaration of Paris"
 v54_gbr.58.d: "The Congress of Paris has adopted four rules of maritime law: privateering is abolished, a neutral flag covers enemy goods, neutral goods are not liable to capture under an enemy flag, and blockades must be effective to be binding. The Admiralty regards the second article as a gift to the enemy, and the Foreign Office regards it as a small price for the other three.\n\nShould Britain accept all four articles?"
 v54_gbr.58.a: "$V54_HISTORICAL_MARK$ Accept all four articles.\n§gHistorically: Britain signed the Declaration on 16 April 1856. The United States refused, since it wanted to keep privateering for its small navy.§!"
 v54_gbr.58.b: "Accept with reservations, to keep belligerent rights."
 v54_gbr.60.t: "Russell's Reform Bill"
 v54_gbr.60.d: "Lord John Russell has introduced a bill to extend the franchise and to redistribute seats from the smallest boroughs. It is a decent bill, and it has no friends in a House that is thinking about the war. The Prime Minister is half relieved at the prospect of its withdrawal."
 v54_gbr.60.a: "$V54_HISTORICAL_MARK$ Withdraw the bill.\n§gHistorically: Russell withdrew the bill on 11 April 1854 with tears in his eyes, citing the war that was about to begin.§!"
 v54_gbr.60.b: "Press the bill to a vote."
 v54_gbr.61.t: "Gladstone's War Budget"
 v54_gbr.61.d: "The Chancellor believes that wars should be paid for out of taxation, not borrowing, and that every shilling the government spends should be accounted for. The budget of 1854 doubles the income tax for six months to pay for the war and the Chancellor does not apologise."
 v54_gbr.61.a: "$V54_HISTORICAL_MARK$ Double the income tax.\n§gHistorically: Gladstone doubled the income tax to 14d in the pound in March 1854. As the war lasted longer, later Chancellors borrowed.§!"
 v54_gbr.61.b: "Borrow the money."
 v54_gbr.62.t: "Ireland after the Famine"
 v54_gbr.62.d: "A million Irish have died or emigrated since 1845, the Tenant League demands fair rents and compensation for improvements, and the Irish Brigade in the Commons holds a balance between the parties. Whoever governs must decide whether the land question can be left to the landlords."
 v54_gbr.62.a: "$V54_HISTORICAL_MARK$ Leave the land question to the landlords.\n§gHistorically: the Tenant League faded away in the later 1850s without success, and the land question was not tackled until Gladstone's act of 1870.§!"
 v54_gbr.62.b: "Bring in a Tenant Right bill."
 v54_gbr.62.c: "Strengthen the garrison and keep order."
 v54_gbr.63.t: "The Northcote-Trevelyan Report"
 v54_gbr.63.d: "Two senior officials have proposed that the civil service be recruited by open examination and promoted on merit, not by patronage. The proposal alarms every minister who has a nephew to place, and it is the first step toward an administration that works."
 v54_gbr.63.a: "$V54_HISTORICAL_MARK$ Create a Civil Service Commission.\n§gHistorically: an Order in Council of 21 May 1855 created the Commission, though open competition did not become general until 1870.§!"
 v54_gbr.63.b: "Shelve the report."
 v54_gbr.64.t: "Cholera in Soho"
 v54_gbr.64.d: "Cholera has broken out in Broad Street, and more than five hundred people have died in ten days. A doctor named John Snow has plotted the cases on a map and says that they cluster around a single pump. The Board of Health believes that the disease is carried by bad air.\n\nShould the Board accept Snow's theory of a waterborne disease?"
 v54_gbr.64.a: "$V54_HISTORICAL_MARK$ Remove the pump handle, but keep to the miasma theory.\n§gHistorically: the parish removed the handle on 8 September 1854. The Board of Health published a report that rejected Snow's theory, and the Great Stink of 1858 persuaded Parliament to build the sewers.§!"
 v54_gbr.64.b: "Accept Snow's theory and reform the water supply."
 v54_gbr.65.t: "The Princess Royal's Engagement"
 v54_gbr.65.d: "Prince Friedrich Wilhelm of Prussia has been the guest of the Queen at Balmoral, and on a walk on the heather he has proposed to the Princess Royal. Victoria and Albert hope that the match will bind Prussia to Britain and make the liberal cause in Germany the cause of the dynasty.\n\nThe Princess is fourteen, and the Prussian court is less enthusiastic than the English one."
 v54_gbr.65.a: "$V54_HISTORICAL_MARK$ Approve the engagement, and defer the marriage.\n§gHistorically: the engagement was made at Balmoral in September 1855, kept private until after the Princess's confirmation in 1856, and the marriage took place on 25 January 1858.§!"
 v54_gbr.65.b: "Defer the whole matter."
 v54_gbr.66.t: "The Victoria Cross"
 v54_gbr.66.d: "The Queen proposes a new decoration for valour in the face of the enemy. It would be open to every rank of the army and the navy, and it would be made of bronze from a Russian gun. The Horse Guards would prefer to extend the old orders of knighthood, which are for officers."
 v54_gbr.66.a: "$V54_HISTORICAL_MARK$ Institute the Victoria Cross for all ranks.\n§gHistorically: the Victoria Cross was instituted by a Royal Warrant of 29 January 1856, and the first awards were made in 1857.§!"
 v54_gbr.66.b: "Extend the existing orders to the officers."
 v54_gbr.67.t: "Bessemer's Converter"
 v54_gbr.67.d: "At the Cheltenham meeting of the British Association an inventor named Henry Bessemer has described a process for making steel by blowing air through molten iron. The ironmasters are interested, the old puddlers are not, and the War Office, which wants better guns, is the most interested of all."
 v54_gbr.67.a: "$V54_HISTORICAL_MARK$ License the process to the ironmasters.\n§gHistorically: the ironmasters took licences in the autumn of 1856, found that the process failed with phosphoric ore, and Bessemer set up his own works in Sheffield. Steel was cheap by the 1860s.§!"
 v54_gbr.67.b: "Back the existing puddling interests."
 v54_gbr.70.t: "The Doctrine of Lapse"
 v54_gbr.70.d: "When a native prince dies without a natural heir, his state lapses to the Company, and adopted sons do not inherit. The doctrine has brought Satara, Jhansi and Nagpur under British rule, and has made the princes of India wonder which of them is next.\n\nThe Governor-General wishes to apply it again."
 v54_gbr.70.a: "$V54_HISTORICAL_MARK$ Apply the doctrine of lapse.\n§gHistorically: Dalhousie annexed Satara in 1848 and Jhansi and Nagpur in 1853-54, and the Rani of Jhansi became a leader of the Mutiny.§!"
 v54_gbr.70.b: "Recognise the adoptions."
 v54_gbr.71.t: "The Annexation of Oudh"
 v54_gbr.71.d: "The kingdom of Oudh, the Company's oldest ally, is badly governed by a king who writes poetry and keeps a thousand dancers. The Resident reports that the people are oppressed and that the treaty of 1801 has been broken. The Governor-General wishes to annex it in the name of good government.\n\nThe sepoys of Bengal, many of whom are Oudh Brahmins, are not consulted."
 v54_gbr.71.a: "$V54_HISTORICAL_MARK$ Annex Oudh.\n§gHistorically: the annexation was proclaimed on 13 February 1856. The pensions of the taluqdars were cut, and Oudh became the heart of the rebellion a year later.§!"
 v54_gbr.71.b: "Leave the King on his throne under a stronger Resident."
 v54_gbr.72.t: "The General Service Enlistment Act"
 v54_gbr.72.d: "Lord Canning wants new recruits for the Bengal army to serve wherever they are sent, including overseas. The sea pollutes the high-caste Hindu, and the existing sepoys, who are not covered by the act, suspect that their turn will come."
 v54_gbr.72.a: "$V54_HISTORICAL_MARK$ Pass the Act for new recruits.\n§gHistorically: the General Service Enlistment Act was passed in July 1856. It did not apply to men already in the service, but they thought that it would.§!"
 v54_gbr.72.b: "Exempt the Bengal army from overseas service."
 v54_gbr.73.t: "The Enfield Cartridge"
 v54_gbr.73.d: "The new Enfield rifle needs a cartridge that must be bitten open, and the paper is greased with tallow. A rumour has run through the Bengal army that the grease is beef fat and pig fat, polluting Hindu and Muslim alike, and that the Company means to destroy the sepoys' faith.\n\nThe officers say that it is nonsense, and the sepoys have heard that before."
 v54_gbr.73.a: "$V54_HISTORICAL_MARK$ Deny the rumour and continue the issue.\n§gHistorically: the authorities issued reassurances. The grease was changed in January and February 1857, but too late to remove the distrust.§!"
 v54_gbr.73.b: "Withdraw the greased cartridges at once."
 v54_gbr.73.c: "Order an inquiry into the grease."
 v54_gbr.74.t: "The Persian Question"
 v54_gbr.74.d: "A Persian army has seized Herat, the key to Afghanistan and the gateway to India, in breach of a treaty with Britain. The Government of India proposes to send an expedition to the Gulf, and the Foreign Office wonders whether the Shah is acting for himself or for St Petersburg."
 v54_gbr.74.a: "$V54_HISTORICAL_MARK$ Send an expedition to the Gulf.\n§gHistorically: war was declared on 1 November 1856, Bushire was taken in December and the Peace of Paris of March 1857 obliged the Persians to leave Herat. The troops returned to India in time for the Mutiny.§!"
 v54_gbr.74.b: "Protest through the Foreign Office."
 v54_gbr.75.t: "The Arrow Incident"
 v54_gbr.75.d: "Chinese officials have boarded the lorcha Arrow at Canton, hauled down her British flag and arrested her crew. Sir John Bowring and Admiral Seymour see an insult that demands redress, and the House of Commons will soon be asked whether it agrees."
 v54_gbr.75.a: "$V54_HISTORICAL_MARK$ Demand redress and bombard Canton.\n§gHistorically: Seymour bombarded Canton at the end of October 1856. Cobden carried a vote of censure in March 1857, and Palmerston dissolved Parliament and won the so-called Chinese election.§!"
 v54_gbr.75.b: "Disavow the incident."
 v54_gbr.76.t: "Rumours in the Bazaars"
 v54_gbr.76.d: "Officers' wives write home about strange chapatis passing from village to village, and the Commissioners of the North-Western Provinces report that the sepoys talk of the cartridge, of the annexation and of a prophecy that the Company's rule will end in its hundredth year after Plassey. General Hearsey has warned the Commander-in-Chief."
 v54_gbr.76.a: "$V54_HISTORICAL_MARK$ Pay no attention.\n§gHistorically: Hearsey's warnings were not heeded, and the passing of the chapatis was thought to be a harmless local custom.§!"
 v54_gbr.76.b: "Send inspectors to the cantonments."
 v54_gbr.77.t: "Mangal Pandey at Barrackpore"
 v54_gbr.77.d: "A sepoy of the 34th Native Infantry named Mangal Pandey has seized a musket on the parade ground at Barrackpore and fired at his British officers, calling on his comrades to rise. They did not, but they did not help to restrain him either.\n\nThe General wants to make an example of him, and of the regiment."
 v54_gbr.77.a: "$V54_HISTORICAL_MARK$ Hang Pandey and disband the regiment.\n§gHistorically: Pandey was hanged on 8 April 1857 and the 34th Native Infantry was disbanded on 6 May, and the disbanded men carried the news home.§!"
 v54_gbr.77.b: "Court-martial Pandey and keep the regiment."
 v54_gbr.81.t: "The Mutiny at Meerut"
 v54_gbr.81.d: "On Sunday evening, 10 May, the sepoys of Meerut broke open the gaol, killed their officers and marched on Delhi. By the morning they had proclaimed the Mughal Emperor and the rebellion had begun. Telegraph wires to Delhi have been cut, and the Commander-in-Chief is in the hills.\n\nThe greater part of the Bengal army is in arms, and Oudh with it."
 v54_gbr.81.a: "$V54_HISTORICAL_MARK$ Hold the Punjab and recall every available regiment.\n§gHistorically: John Lawrence held the Punjab, troops were recalled from Persia and the Cape, and Delhi was retaken in September 1857.§!"
 v54_gbr.81.b: "Offer clemency to those who lay down their arms."
 v54_gbr.82.t: "The Meerut Mutiny is Contained"
 v54_gbr.82.d: "On Sunday evening, 10 May, a few regiments at Meerut rose and marched on Delhi. Because the grievances had been addressed or answered, they found no support: the rest of the Bengal army stayed in its lines, and the Punjab and the princes remained loyal. By the end of the month the rebels have been dispersed.\n\nThe Governor-General must decide what to do with the Bengal army."
 v54_gbr.82.a: "Reform the Bengal army.\n§gThere is no historical precedent: in reality the Mutiny spread. After it the Company's army was reorganised, the proportion of European troops was increased and the artillery became a purely British arm.§!"
 v54_gbr.82.b: "Make an example of the mutineers."
