# Character Localisation
POLITICS_LEO_XIII_DESC: "A skilled diplomat and experienced churchman, Leo XIII inherits the Papacy after the long and turbulent reign of Pius IX. He seeks to defend the independence and teaching authority of the Holy See while engaging more carefully with the political and social questions reshaping Europe. Less confrontational in style than his predecessor but no less committed to Papal sovereignty, Leo must guide the Church through an age of nationalism, industrialization, and uneasy relations with the modern state."
PAP_cardinal_de_merode_political_advisor: "Federico Francesco Saverio de Mérode"
PAP_cardinal_de_merode_political_advisor_desc: "A Belgian prelate and energetic organizer, Federico de Mérode argues that the Holy See must possess a credible military force of its own. His influence encourages recruitment, fortification, and administrative action, though his activist approach often clashes with the more cautious diplomacy of Cardinal Antonelli."
PAP_giovanni_zappi_high_command: "Giovanni Battista Zappi"
PAP_giovanni_zappi_high_command_desc: "Giovanni Battista Zappi is an experienced Papal officer whose knowledge of local terrain and defensive warfare makes him a valuable member of the high command. His advice emphasizes prepared positions, discipline, and the practical defense of the remaining Papal territory."

# National Spirits and Companies
PAP_Widespreaad_Illiteracy: "Widespread Illiteracy"
PAP_Widespreaad_Illiteracy_desc: "Education in much of the Papal countryside remains limited, and large sections of the population lack the literacy required by a modern administration and industrial economy. Parish institutions provide important instruction, but the state still suffers from a narrow technical base and a shortage of trained specialists."
PAP_Societa_Romane: "Società Romana"
PAP_Societa_Romane_desc: "Roman contractors and construction interests provide the government with a local partner for public works. Their experience can support roads, urban improvements, and state building projects, even if the scale of Papal industry remains modest."
PAP_vic_idea_Cholera_2_desc: "Public works and improved sanitation have begun to contain the worst economic disruption caused by cholera, but the disease still threatens the population. Until clean water and effective public health measures reach more communities, recurring outbreaks will continue to take lives."
PAP_vic_idea_Cholera_3_desc: "The deadliest effects of the epidemic have been reduced, yet cholera continues to disrupt agriculture and local production in affected districts. Further investment in sanitation, drainage, and clean water is needed before the disease can be considered under control."
PAP_vic_idea_Failing_Finances_2_desc: "The first emergency measures have slowed the deterioration of Papal finances, but the treasury remains burdened by debt, weak revenue collection, and high obligations. More fundamental reform is needed before confidence can return."
PAP_vic_idea_Failing_Finances_3_desc: "Tax reforms and tighter management are beginning to improve the flow of money into the treasury. Inflation and structural inefficiency remain serious problems, but the state is no longer sliding as quickly toward insolvency."
PAP_vic_idea_Failing_Finances_4_desc: "Monetary reform has removed some of the most immediate instability from Papal finances. The treasury still collects revenue inefficiently, however, and years of debt cannot be erased by a change of currency alone."
PAP_vic_idea_Failing_Finances_5_desc: "Spending controls and administrative reforms are gradually narrowing the fiscal gap. The government remains financially constrained, but waste and disorder no longer consume resources at the same rate as before."
PAP_vic_idea_Failing_Finances_6_desc: "A more disciplined treasury and improving revenues are restoring a measure of stability. The Papal States still carry heavy obligations, yet the danger of immediate financial collapse is receding."
PAP_vic_idea_Failing_Finances_7_desc: "Continued reform has reduced many of the worst fiscal distortions inherited by the Papal administration. Revenue collection remains weaker than that of more modern states, but the treasury can increasingly plan rather than merely react."
PAP_vic_idea_Failing_Finances_8_desc: "The financial system is approaching a sustainable footing after years of reform. Persistent inefficiencies and debt still weigh on the state, but confidence in Papal credit and administration is recovering."
PAP_vic_idea_Failing_Finances_9_desc: "The crisis of the Papal treasury has largely been brought under control, though some structural weaknesses remain. Completing the reform of taxation and administration can finally replace emergency financing with a stable fiscal order."
PAP_Austerity_Measures_desc: "With debt pressing upon the treasury, the government has imposed stricter controls on expenditure and administrative costs. Austerity frees resources for essential obligations, but every saving is a reminder of how limited the state's finances remain."
PAP_vic_idea_italian_patriots_desc: "Nationalist committees, veterans, students, and clandestine societies challenge Papal rule in the name of Italian unity. Their agitation undermines stability, drains manpower away from loyal institutions, and ensures that political unrest can quickly become armed revolt."
PAP_vic_idea_royal_confederation_of_italian_states_desc: "The Italian peninsula has been reorganized as a confederation of legitimate states rather than a centralized Savoyard kingdom. Cooperation in defense and commerce offers greater stability while preserving regional rulers, though the arrangement requires constant negotiation among its members."
PAP_Infant_Military_1_desc: "The Papal Army is small, underfunded, and divided among formations of uneven quality. Its officer corps and supply system are not prepared for a modern national war, leaving Rome dangerously dependent on foreign protection."
PAP_Infant_Military_2_desc: "Initial reforms have begun to improve drill, readiness, and administrative oversight, but the army remains far from a modern field force. Equipment shortages and weak organization still limit its ability to respond to a major crisis."
PAP_Infant_Military_3_desc: "Defensive preparations and new investment are giving the army a firmer institutional base. The force remains small, but its units are becoming easier to supply, command, and concentrate in an emergency."
PAP_Infant_Military_4_desc: "The Italian crisis has forced the Papal Army to reform faster than peacetime politics ever allowed. Mobilization and practical experience are exposing weaknesses while creating a more serious military establishment."
PAP_Infant_Military_5_desc: "Under de Mérode, the Papal military is becoming a deliberate instrument of state rather than a collection of ceremonial and local forces. Recruitment, administration, and defense planning are improving, though foreign expertise remains essential."
PAP_Infant_Military_6_desc: "Professional leadership and the arrival of experienced foreign officers are giving the army greater cohesion. Training and organization are improving enough for Papal troops to operate as a field force rather than merely a garrison."
PAP_Infant_Military_7_desc: "Expanded recruitment has filled the ranks and created new formations for the defense of the state. Integrating regulars and international volunteers remains difficult, but the army can now place substantially more men in the field."
PAP_Infant_Military_8_desc: "The combination of professional command and larger recruitment has produced a more capable Papal Army. Its divisions are still modest beside those of the great powers, yet they can no longer be dismissed as an insignificant force."
PAP_Infant_Military_9_desc: "Selected Austrian methods of drill, staff work, and organization have been absorbed into Papal practice. The army now possesses a more modern structure and can make better use of its limited manpower and equipment."
PAP_Infant_Military_10_desc: "Defeat and hard experience have completed the transformation of the Papal Army into a smaller but more professional force. It remains outnumbered by the armies of Italian nationalism, yet its surviving officers and volunteers understand the demands of modern war."
PAP_Withdrawl_Austrian_Forces_desc: "The withdrawal of Austrian troops from Papal territory removes a shield that local authorities had relied upon to suppress unrest and deter intervention. Papal forces must now cover a wider area with fewer experienced soldiers at a moment of growing nationalist agitation."
PAP_Ninth_Crusade_desc: "The defense of the Holy See has been presented to Catholics abroad as a sacred international cause. Volunteers and donations arrive from across Europe, giving the Papal States manpower and morale that its own population could never provide alone."
PAP_Ninth_Crusade_2_desc: "The appeal to Catholic solidarity has grown into a broad international movement. A steady stream of volunteers now reaches Rome, allowing the Papal Army to replace losses and form new units around men motivated by religion as much as politics."
PAP_Zouaves_desc: "The Papal Zouaves form an elite corps of international Catholic volunteers bound together by distinctive dress, strict discipline, and personal devotion to the Pope. Their presence raises morale and provides a reliable force for the defense of threatened Papal territory."
PAP_Zouaves_1_desc: "The Zouaves have matured into the most famous international formation in Papal service. Veterans and new volunteers from many countries give the corps greater depth, making it both a military asset and a symbol of worldwide Catholic support for Rome."
PAP_Our_Own_desc: "Foreign powers have their own interests and cannot be expected to defend Rome indefinitely. The Papal States must prepare to stand on their own strength, relying on loyal troops, volunteers, and the determination to preserve the Pope's temporal sovereignty."
PAP_Naval_Buildup_desc: "A program of rapid naval modernization is expanding facilities and introducing steam vessels faster than the service can fully absorb them. The investment promises a stronger fleet, but inexperienced crews, new machinery, and heavy costs strain the small Papal Navy."
PAP_Holy_Fleet_desc: "Years of investment have turned the Papal Navy into a small but coherent modern service. Better-trained crews, steam experience, and improved facilities allow the fleet to patrol the coast with confidence and uphold the maritime dignity of the Holy See."
PAP_Juchault_Mission_desc: "Louis Juchault de Lamoricière has been entrusted with reorganizing the Papal Army along more professional lines. His mission emphasizes discipline, coherent command, and field readiness, giving the state's mixed force of regulars and volunteers a stronger military framework."
PAP_Volunteer_Army_desc: "A large share of the Papal Army now consists of men who have volunteered out of loyalty to the Church rather than ordinary national service. Their motivation is strong and they defend stubbornly, but differences in training, language, and experience complicate offensive operations."
PAP_Railroad_desc: "The Papal government has committed itself to an ambitious program of railway construction. New lines will require substantial investment, but they promise faster transport, stronger internal markets, and closer administrative control over the provinces."
PAP_Monetary_Union_desc: "Papal coinage has been aligned with the standards used by the Latin Monetary Union, making transactions with neighboring economies easier and increasing confidence in the lira. Greater monetary integration encourages trade, though it also reduces the freedom to pursue an entirely independent coinage policy."
PAP_idea_Vatican_Ecumenical_Council_desc: "Preparatory commissions are gathering theological material, consulting bishops, and drafting proposals for a general council of the Catholic Church. The work consumes political attention in Rome, but it promises to clarify doctrine and strengthen the Church's response to the modern age."
PAP_idea_Ongoing_Ecumenical_Council_desc: "Bishops from around the world are assembled in Rome for the First Vatican Council. Debate over doctrine and Papal authority dominates the attention of the Holy See, drawing administrative energy away from ordinary temporal affairs."
PAP_idea_Church_Influence_1_desc: "The Catholic Church stands at the center of public life in the Papal States, shaping education, charity, law, and political legitimacy. Its influence provides stability and social cohesion, while tying the government closely to the priorities of the clergy."
PAP_idea_Church_Influence_2_desc: "The doctrinal work of the Vatican Council has reinforced the Church's authority and given the Papacy greater confidence in confronting the intellectual currents of the century. Religious institutions exercise a stronger influence over the political and social life of the state."
PAP_idea_Church_Influence_3_desc: "The definition of Papal primacy and infallibility has strengthened the spiritual authority of the Roman Pontiff throughout the Catholic world. Even as temporal sovereignty faces unprecedented danger, the religious influence of the Holy See reaches far beyond the borders of the Papal States."
PAP_idea_Housing_Bourbons_desc: "The Bourbon royal family and its supporters have found refuge in Papal territory after losing the Kingdom of the Two Sicilies. Their presence strengthens legitimist resistance to Italian unification and raises Papal prestige among conservatives, but supporting an exile court places additional strain on the treasury."
PAP_Thames_Ironworks_desc: "British industrial expertise offers the Papal Navy access to modern shipbuilding methods and heavy engineering that cannot yet be reproduced in Rome. Cooperation with Thames Ironworks can accelerate naval construction, although foreign contracts add to the cost of maintaining the fleet."
PAP_idea_Societa_Ferrate_Romane_desc: "The Società per le Strade Ferrate Romane brings specialized railway engineering and management to the Papal modernization program. Its expertise can speed construction and improve the technical quality of new lines across central Italy."
PAP_idea_Societa_Ferrate_Romane_2_desc: "Closer cooperation with the Società per le Strade Ferrate Romane has created a deeper pool of technical knowledge inside the state. Railway projects now serve not only transport needs but also the spread of mechanical engineering and modern industrial practice."
PAP_idea_bank_of_the_four_legations_desc: "The Bank of the Four Legations provides credit and financial organization to regions that have long lacked strong modern institutions. By concentrating capital and supporting investment, it can stimulate development while tying provincial economic interests more closely to Papal rule."
dynmod_PAP_inefficient_administration_desc: "The Papal administration relies on overlapping offices, local privileges, clerical authorities, and procedures that vary from province to province. This fragmentation slows construction, weakens revenue collection, and makes it difficult for Rome to turn policy into effective local action."
dynmod_PAP_inefficient_administration_2_desc: "Administrative reform has reduced some of the worst delays and duplication, but provincial government remains cumbersome. Local institutions still struggle to carry out large programs with the speed expected of a modern state."
dynmod_PAP_inefficient_administration_3_desc: "The administration is becoming more coherent as procedures are standardized and local bottlenecks are addressed. Important inefficiencies remain, yet Rome can increasingly direct resources and reforms across its territories with greater consistency."

# Balance of Power
PAP_Papal_Influence_category_decisions_desc: "Two competing approaches shape Papal policy. Cardinal Giacomo Antonelli favors cautious diplomacy, political stability, and reliance on the European balance of power, while Federico de Mérode presses for military preparation, public mobilization, and a more active defense of temporal sovereignty."