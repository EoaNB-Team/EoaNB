### Decisions ###

# Army Decisions
PAP_decisions_category_papal_army: "Esercito dello Stato Pontificio"
PAP_decisions_category_papal_army_desc: "The Papal Army must defend both the temporal sovereignty of the Holy See and the approaches to Rome. Foreign volunteers, imported weapons, and careful reform can strengthen a force that remains small beside the armies of the great powers."
PAP_decision_immacolata_concezione: "Purchase Immacolata Concezione"
PAP_decision_immacolata_concezione_desc: "The Papal Navy cannot rely forever on a handful of aging vessels. Commissioning the Immacolata Concezione will provide a modern steam-assisted warship capable of carrying the flag of the Holy See throughout the Mediterranean."
PAP_decision_expand_papal_navy_port: "Expand Papal Navy Port"
PAP_decision_expand_papal_navy_port_desc: "Civitavecchia is Rome's principal gateway to the sea, but its naval facilities remain modest. Enlarging the harbor and its military installations will give the Papal fleet a more secure base for repair, supply, and future expansion."
PAP_decision_roma_steamer: "Purchase the Roma steamer"
PAP_decision_roma_steamer_desc: "Steam propulsion is transforming naval warfare and coastal transport. Purchasing the Roma will give the Papal Navy practical experience with modern machinery while improving its ability to patrol the Tyrrhenian coast."
PAP_decision_prussian_ship: "Commission the Sanctus Bonifatius"
PAP_decision_prussian_ship_desc: "Prussian shipbuilding offers a practical route toward a more modern fleet. Once the Sanctus Bonifatius is completed and brought into Papal service, it will strengthen our patrol force and reduce our dependence on sailing craft."
PAP_decision_order_mazzocchi_rifles: "Order Mazzocchi Rifles"
PAP_decision_order_mazzocchi_rifles_desc: "The workshops of Fratelli Mazzocchi can help arm our soldiers with domestically produced firearms. A substantial order will improve the army's supply of modern rifles while supporting a valuable Papal arms industry."
PAP_decision_invest_mazzocchi: "Invest into F.Ili Mazzocchi"
PAP_decision_invest_mazzocchi_desc: "A state contract alone will not create a durable arms industry. By investing in Fratelli Mazzocchi, we can expand local production, improve tooling, and reduce the army's long-term dependence on foreign suppliers."
PAP_decision_battalion_st_patrick: "St. Patrick's Battalion"
PAP_decision_battalion_st_patrick_desc: "Catholic volunteers from Ireland have answered the call to defend the Holy Father. Organizing them into the Battalion of St. Patrick will turn religious enthusiasm into a disciplined formation ready for service in the Papal Army."
PAP_decision_franco_belgian_division: "The Franco-Belgian Division"
PAP_decision_franco_belgian_division_desc: "Volunteers from France and Belgium are arriving to defend the temporal power of the Pope. Grouping these men into a dedicated formation will make better use of their experience, shared language, and strong Catholic commitment."
PAP_decision_austrian_bersaglieri: "Austrian Bersaglieri"
PAP_decision_austrian_bersaglieri_desc: "Austrian-trained volunteers and veterans can provide the Papal Army with a body of mobile light infantry. Their organization and drill will help reinforce threatened sectors and stiffen less experienced Papal formations."
PAP_decision_papal_zouaves: "Papal Zouaves"
PAP_decision_papal_zouaves_desc: "The international Catholic volunteers serving Rome need a permanent elite formation. Establishing the Papal Zouaves will unite men of many nations under a common uniform, discipline, and devotion to the defense of the Holy See."
PAP_decision_charette_zouaves: "Appoint Athanase Charles Marie de Charette as Zouaves Commander"
PAP_decision_charette_zouaves_desc: "Athanase de Charette has distinguished himself among the foreign volunteers and possesses the energy needed to inspire the Zouaves. Entrusting him with command will give the formation a capable and devoted leader."
PAP_decision_antibes_legion: "Legion of Antibes"
PAP_decision_antibes_legion_desc: "With French regular troops no longer guaranteed to remain in Rome, volunteers recruited under French auspices can help fill the gap. The Legion of Antibes will provide a disciplined foreign contingent for the defense of Papal territory."
PAP_decision_foreign_battalions: "Foreign Battalions"
PAP_decision_foreign_battalions_desc: "Catholics from across Europe have offered their service to the Holy Father. Organizing these volunteers into national and linguistic battalions will make them easier to train, supply, and deploy alongside the regular Papal Army."
PAP_decision_defenses_against_garibaldi: "Defenses Against the Garibaldists"
PAP_decision_defenses_against_garibaldi_desc: "Garibaldian volunteers have repeatedly shown that they can move quickly and strike before conventional armies are ready. Strengthening the approaches to Rome and other vulnerable positions will give our troops a better chance to halt another incursion."

# Economy Decisions
PAP_decisions_category_papal_financing: "Papal Financing"
PAP_decisions_category_papal_financing_desc: "The Papal treasury carries heavy obligations while its tax system and administration struggle to produce reliable revenue. A program of fiscal reform, new sources of income, and tighter spending can restore confidence without surrendering the independence of the Holy See."
PAP_decision_taxation_reform: "Taxation Reform"
PAP_decision_taxation_reform_desc: "Uneven assessments, exemptions, and inefficient collection weaken the treasury and foster resentment. Reforming taxation will improve revenue collection while placing Papal finances on a more predictable foundation."
PAP_decision_adopt_lira: "Adopt the Lira"
PAP_decision_adopt_lira_desc: "The old monetary system complicates commerce with neighboring Italian states. Adopting a decimal lira will simplify accounting, facilitate trade, and prepare Papal coinage for closer alignment with the monetary standards spreading across Europe."
PAP_decision_peters_pence: "Peter's Pence"
PAP_decision_peters_pence_desc: "Catholics throughout the world are willing to support the Holy See when its temporal resources fall short. Encouraging Peter's Pence will turn that devotion into a dependable stream of voluntary contributions for Rome."
PAP_decision_making_use_of_the_donations: "Make Use of the Donations"
PAP_decision_making_use_of_the_donations_desc: "We will invest our donations into civilian industry"
PAP_decisions_category_papal_railway: "Papal States Railway Network"
PAP_decisions_category_papal_railway_desc: "Railways can bind Rome more closely to its provinces, ports, and neighboring states. A coherent Papal network will stimulate commerce, shorten journeys, and make it easier to move troops and supplies during a crisis."
PAP_decision_rome_civitavecchia_line: "The Rome - Civitavecchia Line"
PAP_decision_rome_civitavecchia_line_desc: "The route from Rome to Civitavecchia links the capital with its principal Tyrrhenian port. Completing and improving this railway will accelerate passenger traffic, commerce, mail, and the movement of military supplies."
PAP_decision_ancona_falconara_line: "The Ancona - Falconara Line"
PAP_decision_ancona_falconara_line_desc: "A railway between Ancona and Falconara will strengthen communications along the Adriatic and connect an important port with the developing inland network. The line will serve both trade and the rapid movement of Papal forces."
PAP_decision_rome_orte_line: "The Rome - Orte Line"
PAP_decision_rome_orte_line_desc: "Orte occupies a vital position north of Rome and can serve as the junction for lines toward Umbria and the Adriatic. Building the Rome-Orte connection will open the way for a truly integrated central railway network."
PAP_decision_orte_falconara_line: "The Orte - Falconara Line"
PAP_decision_orte_falconara_line_desc: "Connecting Orte with Falconara will carry the railway across the Apennines and join Rome to the Adriatic system. The project is difficult and expensive, but its economic and strategic value is considerable."
PAP_decisions_category_papal_countryside_reform: "Countryside Reform"
PAP_decisions_category_papal_countryside_reform_desc: "Much of the Papal economy remains rural, with poor roads, fragmented holdings, unhealthy marshlands, and uneven access to markets. Practical improvements in the countryside can raise productivity while easing the grievances that feed unrest."
PAP_decision_reduce_wasteful_spendings: "Reduce Government Waste"
PAP_decision_reduce_wasteful_spendings_desc: "Patronage, duplication, and inefficient administration consume money that the treasury can no longer spare. Cutting unnecessary expenditure will free resources for essential services, infrastructure, and defense."
PAP_decision_expand_fishing_market: "Expand the Fishing Market"
PAP_decision_expand_fishing_market_desc: "The Papal coastline can provide more than customs revenue. Better landing facilities, markets, and transport links will allow fishing communities to sell a larger catch and supply growing urban populations."
PAP_decision_consolidate_land: "Consolidate Land"
PAP_decision_consolidate_land_desc: "Scattered and fragmented holdings make cultivation inefficient and discourage investment. Consolidating parcels and clarifying ownership will allow farms to use land, labor, and equipment more effectively."
PAP_decision_modernize_road_network: "Modernize Road Network"
PAP_decision_modernize_road_network_desc: "Many provincial roads are poorly surfaced and difficult to use in bad weather. Repairing bridges, improving routes, and maintaining major roads will lower transport costs and make the countryside more accessible to both commerce and government."
PAP_decision_drain_marshes: "Drain the Marshes"
PAP_decision_drain_marshes_desc: "Marshlands waste fertile ground and contribute to persistent disease. Drainage works can reclaim agricultural land, improve local health, and make neglected districts more productive."
PAP_decision_expand_ports: "Expand the Ports"
PAP_decision_expand_ports_desc: "The ports of the Papal States must handle growing commercial traffic as well as the needs of the navy. Expanding quays, warehouses, and harbor facilities will improve trade while strengthening our maritime position."
PAP_decision_rome_naples_line: "Connect the railways with two Sicilies"
PAP_decision_rome_naples_line_desc: "In order to increase trade, we need to improve the railways with our southern neighbors"

PAP_decision_improve_water_access: "Improve water access for the citizens"
PAP_decision_improve_water_access_desc: "Rome's ancient aqueducts remain essential to the life of the capital, but population growth and uneven distribution place increasing pressure on the system. Improving access to clean water will strengthen public health and reduce the danger posed by epidemic disease."
PAP_decision_modernise_the_southern_road_network: "Modernise the Southern Road Network"
PAP_decision_modernise_the_southern_road_network_desc: "The southern districts depend on roads that are often narrow, damaged, or poorly maintained. A focused modernization campaign will improve local trade, government access, and the movement of troops between Rome and the Neapolitan frontier."
PAP_decision_invest_into_sicilian_infrastructure: "Invest Into Sicilian Infrastructure"
PAP_decision_invest_into_sicilian_infrastructure_desc: "Closer economic ties with the Kingdom of the Two Sicilies require more than diplomacy. Supporting roads and transport links across the southern frontier will encourage commerce and deepen the practical connection between the two states."

# Bop Decisions
PAP_Papal_Influence_category_decisions: "Battle for Influence"
PAP_decision_bop_hold_a_military_parade: "Hold a Military Parade"
PAP_decision_bop_hold_a_military_parade_desc: "A grand parade through Rome will place the reorganized Papal Army before the public and demonstrate the influence of the military reformers around de Mérode. The spectacle may strengthen confidence in the army, but it also shifts the balance within the Papal government."
PAP_decision_bop_agressive_foreign_policy: "Aggressive Foreign Policy"
PAP_decision_bop_agressive_foreign_policy_desc: "The survival of the Papal States may require a more forceful answer to Piedmontese expansion and revolutionary agitation. Adopting an aggressive foreign policy will please those who favor active resistance, though it risks diplomatic isolation and domestic unease."
PAP_decision_bop_stir_the_flames_of_the_counter_risorgimento: "Stir the flames of the Counter Risorgimento"
PAP_decision_bop_stir_the_flames_of_the_counter_risorgimento_desc: "Italian nationalism does not speak for every Italian. By supporting legitimists, clerical networks, and opponents of Savoyard expansion, we can turn scattered resistance into a broader Counter-Risorgimento movement."
PAP_decision_bop_secure_diplomatic_backings: "Secure Diplomatic Backings"
PAP_decision_bop_secure_diplomatic_backings_desc: "The Papal States cannot confront every threat alone. Appeals to Catholic courts and friendly governments can secure political backing for Rome and strengthen the hand of those who favor diplomacy over reckless confrontation."
PAP_decision_bop_flexible_foreign_policy: "Flexible foreign policy"
PAP_decision_bop_flexible_foreign_policy_desc: "Rigid commitments can become liabilities as the Italian crisis evolves. A flexible policy will allow Cardinal Antonelli to maneuver between France, Austria, and the Italian states, preserving room for negotiation even at the cost of appearing indecisive."
PAP_replace_the_french: "Replace the French"
PAP_replace_the_french_desc: "French troops have long formed the strongest shield around Rome, but their continued presence cannot be assumed. Catholic volunteers from abroad can replace part of that protection and demonstrate that defense of the Holy See is an international cause."
  
