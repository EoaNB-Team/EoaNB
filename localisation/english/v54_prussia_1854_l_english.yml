l_english:
 ## Prussia 1854-1857: tooltips, ideas, decisions
 v54_tt_pru_stance_neutral: "Prussia chose neutrality in the Eastern crisis"
 v54_tt_pru_stance_russia: "Prussia leaned toward Russia in the Eastern crisis"
 v54_tt_pru_stance_west: "Prussia leaned toward the Western powers in the Eastern crisis"
 PRS_v54_idea_manteuffel_ministry: "The Manteuffel Ministry"
 PRS_v54_idea_manteuffel_ministry_desc: "The King rules and the ministers obey; the constitution is kept in the letter."
 PRS_v54_idea_olmutz_legacy: "The Legacy of Olmütz"
 PRS_v54_idea_olmutz_legacy_desc: "The retreat of 1850 rankles in the army and among the nationalists."
 PRS_v54_idea_kreuzzeitung_camarilla: "The Kreuzzeitung Camarilla"
 PRS_v54_idea_kreuzzeitung_camarilla_desc: "The Gerlach circle shapes the King's decisions, in the interest of throne and altar."
 PRS_v54_idea_wochenblatt_party: "The Wochenblatt Party"
 PRS_v54_idea_wochenblatt_party_desc: "Liberal conservatives press for a strong state under law."
 PRS_v54_idea_railway_boom: "The Railway Boom"
 PRS_v54_idea_railway_boom_desc: "New lines open every year, carrying coal, iron and soldiers."
 PRS_v54_idea_ruhr_and_silesia: "The Ruhr and Silesia"
 PRS_v54_idea_ruhr_and_silesia_desc: "Coal and iron pits in Westphalia and Upper Silesia drive Prussian industry."
 PRS_v54_idea_jade_bight: "The Jade Bight"
 PRS_v54_idea_jade_bight_desc: "A North Sea harbour is planned on the land bought from Oldenburg."
 PRS_v54_idea_partial_mobilisation: "Partial Mobilisation"
 PRS_v54_idea_partial_mobilisation_desc: "Several corps are on a war footing, to be taken seriously by Vienna and Petersburg."
 PRS_v54_idea_general_staff_habits: "The General Staff under Reyher"
 PRS_v54_idea_general_staff_habits_desc: "The Staff keeps its plans and its railway surveys up to date."
 PRS_v54_idea_adalbert_fleet: "Prince Adalbert's Fleet"
 PRS_v54_idea_adalbert_fleet_desc: "A small navy and a large ambition."
 PRS_v54_idea_moltke_staff: "Moltke's General Staff"
 PRS_v54_idea_moltke_staff_desc: "A new Chief of the General Staff turns planning into a science."
 PRS_v54_idea_bismarck_at_frankfurt: "Bismarck at Frankfurt"
 PRS_v54_idea_bismarck_at_frankfurt_desc: "Frank dispatches from the Federal Diet shape Berlin's view of Austria."
 v54_decisions_category_pru_1854: "Prussia in 1854"
 v54_decisions_category_pru_1854_desc: "The Zollverein, the army and the German states in the years of the Eastern war."
 v54_pru_dec_zollverein_conference: "The Zollverein Conference"
 v54_pru_dec_zollverein_conference_desc: "The customs union's governments meet in Berlin. Tariffs are discussed, shares of the revenue are settled, and Prussia's leadership is acknowledged."
 v54_pru_dec_railway_concession: "Railway Concessions"
 v54_pru_dec_railway_concession_desc: "A new concession is granted to a company that promises to lay its line within two years."
 v54_pru_dec_police_surveillance: "Police Surveillance"
 v54_pru_dec_police_surveillance_desc: "The police keep watch over clubs, taverns and printing houses."
 v54_pru_dec_army_inspection: "Army Inspection Tours"
 v54_pru_dec_army_inspection_desc: "The King and the Prince of Prussia review regiments and inspect fortresses."
 v54_pru_dec_court_the_middle_states: "Court the Middle States"
 v54_pru_dec_court_the_middle_states_desc: "Envoys and gifts go to Munich, Dresden, Stuttgart and Hanover to remind them that Prussia is also a German power."

 ## Events
 v54_pru.50.t: "Berlin and the Eastern Question"
 v54_pru.50.d: "Berlin's court is divided. The King, who regards the Tsar as family and the Western powers as heirs of the Revolution, would like peace at almost any price. His ministers want neutrality but cannot agree on its terms, the Wochenblatt party looks toward London, and the Kreuzzeitung party toward Saint Petersburg.\n\nManteuffel hopes to keep Prussia out of the war and at the table when it ends."
 v54_pru.50.a: "The King's government must find its way."
 v54_pru.51.t: "The Bonin Affair"
 v54_pru.51.d: "General von Bonin, the Minister of War, has spoken openly for an understanding with the Western powers, and Bunsen in London has sent the King a memorandum urging the same. The court is outraged, and the King must decide how to answer the two men who tell him what he does not want to hear."
 v54_pru.51.a: "$V54_HISTORICAL_MARK$ Dismiss Bonin and let Bunsen go.\n§gHistorically: Bonin left the War Ministry in 1854 and Bunsen resigned as ambassador in London, and Prussia kept to neutrality.§!"
 v54_pru.51.b: "Keep Bonin and listen to the Western party."
 v54_pru.54.t: "The Treaty of 20 April"
 v54_pru.54.d: "Vienna proposes a defensive alliance: the two German powers would guarantee each other's German territory and act together in the Principalities if Russia does not withdraw. Prussia would gain a voice in Austrian policy and lose some freedom of action.\n\nManteuffel wants a treaty that binds Austria without binding Prussia."
 v54_pru.54.a: "$V54_HISTORICAL_MARK$ Sign, with reservations.\n§gHistorically: Prussia signed on 20 April 1854 but never gave the support Vienna hoped for, and the other German states acceded in the course of the year.§!"
 v54_pru.54.b: "Decline the alliance."
 v54_pru.54.c: "Sign and promise full support."
 v54_pru.55.t: "The Federal Diet"
 v54_pru.55.d: "Austria asks the Confederation to endorse her Eastern policy and to prepare its contingents. Prussia's young envoy in Frankfurt warns that the Confederation must not become Vienna's army, and the middle states look to Austria for leadership.\n\nBerlin must decide how far to resist."
 v54_pru.55.a: "$V54_HISTORICAL_MARK$ Resist: the Confederation is not Austria's army.\n§gHistorically: with Bismarck's active help Prussia blocked any commitment of the Confederation to the war.§!"
 v54_pru.55.b: "Support Austria's motion, with reservations."
 v54_pru.55.c: "Leave the question to the Diet."
 v54_pru.56.t: "The Bamberg Conference"
 v54_pru.56.d: "The governments of Bavaria, Saxony, Württemberg, Hesse and others have met at Bamberg and declared their support for Austria's policy. Berlin sees a bloc of middle states forming under Vienna's leadership, exactly what Prussian policy has tried to prevent since Olmütz."
 v54_pru.56.a: "$V54_HISTORICAL_MARK$ Ignore the Bamberg states and keep Prussia neutral.\n§gHistorically: Prussia refused to be drawn into the Bamberg states' policy, and the bloc lost its purpose as the danger of war faded.§!"
 v54_pru.56.b: "Court the middle states with an offer on the Zollverein."
 v54_pru.56.c: "Denounce the conference."
 v54_pru.57.t: "Excluded from Vienna"
 v54_pru.57.d: "The conferences at Vienna are held without Prussia. Neutrality has kept her out of the war and out of the councils of the great powers, and the King feels the slight more than his ministers do."
 v54_pru.57.a: "$V54_HISTORICAL_MARK$ Accept the exclusion and wait.\n§gHistorically: Prussia was left out of the Vienna conferences and admitted to the Congress of Paris only in March 1856.§!"
 v54_pru.57.b: "Protest loudly in London and Paris."
 v54_pru.57.c: "Offer Russia Prussian mediation."
 v54_pru.58.t: "Prussia at the Congress of Paris"
 v54_pru.58.d: "The victors have agreed, after some hesitation, to invite Prussia to sign the peace as one of the powers that signed the Treaty of Vienna of 1815. Manteuffel goes to Paris to sign a settlement he had no hand in making."
 v54_pru.58.a: "$V54_HISTORICAL_MARK$ Attend and sign.\n§gHistorically: Prussia was admitted late, in March 1856, and signed the general treaty without having shaped it.§!"
 v54_pru.58.b: "Decline the invitation."
 v54_pru.60.t: "The Herrenhaus"
 v54_pru.60.d: "The elected First Chamber is to be replaced by a House of Lords of hereditary and royal members. The conservatives see in it the pillar of the monarchy, the liberals the end of what remains of the constitution."
 v54_pru.60.a: "$V54_HISTORICAL_MARK$ Create the Herrenhaus.\n§gHistorically: the Herrenhaus replaced the First Chamber by royal ordinance in October 1854.§!"
 v54_pru.60.b: "Keep the elected First Chamber."
 v54_pru.61.t: "The Elections of 1855"
 v54_pru.61.d: "The Landtag is elected under the three-class franchise. The Eastern war has divided the conservatives, and the Landräte have been reminded which candidates the King prefers."
 v54_pru.61.a: "$V54_HISTORICAL_MARK$ Let the Landräte guide the voters.\n§gHistorically: the elections of late 1855 returned a large conservative majority, with the Kreuzzeitung party in command.§!"
 v54_pru.61.b: "Remain neutral in the elections."
 v54_pru.62.t: "The King's Illness"
 v54_pru.62.d: "Friedrich Wilhelm IV has suffered a stroke and his mind is no longer what it was. The court is divided about who should act in his name: Prince Wilhelm, the heir presumptive, has the army and little patience with the camarilla, and the Queen's circle wants a delay."
 v54_pru.62.a: "$V54_HISTORICAL_MARK$ Appoint the Prince of Prussia as the King's deputy.\n§gHistorically: Wilhelm was appointed deputy in October 1857 and regent a year later.§!"
 v54_pru.62.b: "Keep the King's government in being."
 v54_pru.63.t: "A Duel in the Tiergarten"
 v54_pru.63.d: "Hinckeldey, the Berlin police chief who made himself feared by the nobility, has been killed in a duel by a conservative officer. The King wanted the duellist punished and could not command it. The police that Berlin had learnt to fear has lost its chief, and the aristocracy has kept its code."
 v54_pru.63.a: "The court has had its way."
 v54_pru.65.t: "The Zollverein Grows"
 v54_pru.65.d: "Hanover and Oldenburg, long outside the Zollverein under the Steuerverein, have entered it at the beginning of the year. Prussia's customs union now covers almost all of Germany outside Austria and the Hanseatic towns."
 v54_pru.65.a: "A victory for Prussian trade policy."
 v54_pru.66.t: "Banks for Berlin"
 v54_pru.66.d: "New joint-stock banks have opened in Berlin on the French model, among them the Berliner Handels-Gesellschaft. Railways, mines and ironworks find the capital they need, and the Prussian bourse grows rich on their shares."
 v54_pru.66.a: "Capital comes to Prussian industry."
 v54_pru.68.t: "A New Chief of the General Staff"
 v54_pru.68.d: "Reyher has died and the King must name a successor. Helmuth von Moltke, who has served in Turkey and as adjutant to Prince Friedrich Wilhelm, is the candidate of the younger officers. The court would prefer someone less clever."
 v54_pru.68.a: "$V54_HISTORICAL_MARK$ Appoint Moltke.\n§gHistorically: Moltke became Chief of the General Staff in October 1857.§!"
 v54_pru.68.b: "Appoint a senior general."
 v54_pru.69.t: "Roon's Memoranda"
 v54_pru.69.d: "Colonel Albrecht von Roon has written a series of papers on the organisation of the army: a longer term of service, a stronger line and a Landwehr kept in the second rank. They have reached the Prince of Prussia, who reads them with approval."
 v54_pru.69.a: "$V54_HISTORICAL_MARK$ Circulate the memoranda to the Prince of Prussia.\n§gHistorically: Roon's memoranda of the later 1850s set out the plan carried out in the army reform of 1860.§!"
 v54_pru.69.b: "Shelve them."
 v54_pru.70.t: "Letters from Frankfurt"
 v54_pru.70.d: "Bismarck, once an ultra-conservative and an admirer of Austria, has found in the Federal Diet that Vienna treats Prussia as a junior partner. His letters to Berlin warn that Prussia must break Austria's presidency or be broken by it. Manteuffel is irritated, the King amused, and the Prince of Prussia reads them with care."
 v54_pru.70.a: "$V54_HISTORICAL_MARK$ Back Bismarck's line in Frankfurt.\n§gHistorically: Bismarck's views hardened during his years in Frankfurt, from 1851 to 1859, and prepared his later policy.§!"
 v54_pru.70.b: "Restrain Bismarck and seek Austrian cooperation."
 v54_pru.72.t: "The Danish Constitution of 1855"
 v54_pru.72.d: "Copenhagen has promulgated a common constitution for the Kingdom and the duchies. German opinion in Holstein and the Confederation reacts angrily, and the Diet in Frankfurt is asked to protest."
 v54_pru.72.a: "$V54_HISTORICAL_MARK$ Protest at the Diet.\n§gHistorically: the Diet protested, and in 1858 federal pressure forced Copenhagen to withdraw the constitution for Holstein.§!"
 v54_pru.72.b: "Leave it to Austria."
 v54_pru.80.t: "The Neuchâtel Coup"
 v54_pru.80.d: "Royalists in Neuchâtel have seized the castle in the name of the King of Prussia, who is also, by an old arrangement, Prince of Neuchâtel. The Swiss Confederation has sent troops, and the royalists are in prison. The King is furious and the Swiss republicans are jubilant. Berlin does not want a war, but cannot accept the humiliation."
 v54_pru.80.a: "$V54_HISTORICAL_MARK$ Demand the release of the prisoners and prepare to mobilise.\n§gHistorically: Prussia demanded their release and ordered mobilisation in December 1856, and then accepted the mediation of Napoleon III.§!"
 v54_pru.80.b: "Invade Switzerland."
 v54_pru.80.c: "Abandon the royalists."
 v54_pru.81.t: "The Mediation of Napoleon III"
 v54_pru.81.d: "Switzerland has agreed to release the prisoners if Prussia gives up its claim, and the Emperor of the French has offered to arrange the settlement in Paris. The King must decide whether to renounce his title as Prince of Neuchâtel."
 v54_pru.81.a: "$V54_HISTORICAL_MARK$ Accept the mediation and renounce the title.\n§gHistorically: the prisoners were released in January 1857, and in May Prussia renounced its claim to Neuchâtel.§!"
 v54_pru.81.b: "Refuse and mobilise the army."
 v54_pru.85.t: "A Match with England"
 v54_pru.85.d: "At Balmoral the Prince of Prussia's son, Friedrich Wilhelm, has become engaged to Victoria, the Princess Royal. The liberals in Prussia are delighted and the Kreuzzeitung party is not. The marriage will join the Hohenzollerns to the British royal house, and the Crown Prince will have a wife who believes in parliamentary government."
 v54_pru.85.a: "$V54_HISTORICAL_MARK$ A liberal match.\n§gHistorically: the engagement was made at Balmoral in September 1855, and the marriage took place in January 1858.§!"