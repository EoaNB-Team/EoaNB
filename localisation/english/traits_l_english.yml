####### ARMY LEADER TRAITS #######
##################################

### Common Personality Traits ###
## Descent
noble_lineage: "Noble Lineage"
noble_lineage_desc: "§LBorn into aristocracy, this leader's high military command is viewed as a birthright as much as a career.§!"
bourgeois_background: "Bourgeois Background"
bourgeois_background_desc: "§LOriginating from the urban middle class, this officer relies on education, wealth, and pragmatic talent rather than aristocratic heritage.§!"
working_class_roots: "Working-Class Roots"
working_class_roots_desc: "§LHaving risen from modest origins, this commander understands the plight of the common soldier and leads with practical grit.§!"

## Education and Staff Background
army_academy_graduate: "Army Academy Graduate"
army_academy_graduate_desc: "§LFormally educated at a prestigious military academy, this officer has been thoroughly schooled in modern tactics and staff work.§!"
career_officer: "Career Officer"
career_officer_desc: "§LDedicated to the life as an officer, with ambitions to match.§!"
colonial_veteran: "Colonial Veteran"
colonial_veteran_desc: "§LTempered in the harsh conditions of overseas campaigns, this officer is well-versed in asymmetric warfare and difficult terrain.§!"
war_hero: "War Hero"
war_hero_desc: "§LHailed as a hero from their actions in war.§!"

## Connections
media_personality: "Media Personality"
media_personality_desc: "§LThis general will go out of his way to talk to the media and will always try to be in the limelight.§!"
politically_connected: "Politically Connected"
politically_connected_desc: "§LThis leader has political connections which has smoothed the way for his career.§!"
industry_connections: "Industry Connections"
industry_connections_desc: "§LClose ties to industrial magnates and arms manufacturers ensure this officer's forces are well-equipped and prioritized for supply.§!"

## Command Philosophy
old_guard: "Old Guard"
old_guard_desc: "§LWhile not the most brilliant officer, he is unlikely to cause trouble.§!"
trait_cautious: "Cautious"
trait_cautious_desc: "§LTakes their time and plans carefully.§!"
trait_reckless: "Reckless"
trait_reckless_desc: "§LA good officer needs to lead from the front.§!"
harsh_leader: "Harsh Leader"
harsh_leader_desc: "§LDiscipline is necessary to lead an army, but some leaders take it a bit too far.§!"
quick_marcher: "Quick Marcher"
quick_marcher_desc: "§LThis officer is known for being over-punctual.§!"

## Branch of Service
infantry_officer: "Infantry Officer"
infantry_officer_desc: "§LTrained as an infantry officer.§!"
cavalry_officer: "Cavalry Officer"
cavalry_officer_desc: "§LTrained as a cavalry offier.§!"
artillery_officer: "Artillery Officer"
artillery_officer_desc: "§LTrained as an artillery officer.§!"
engineer_officer: "Engineer Officer"
engineer_officer_desc: "§LTrained as an engineer officer.§!"

### Earned Traits ###
## Leadership Qualities
brilliant_strategist: "Brilliant Strategist"
brilliant_strategist_desc: "§LA natural born strategist that is able to adapt to the dynamics of the battlefield.§!"
brilliant_strategist_trigger_tt: "§HWinning§! land battles as §Hattacker.§!"
iron_bastion: "Iron Bastion"
iron_bastion_desc: "§LA leader exceptionally skilled at defending against enemy advances.§!"
iron_bastion_trigger_tt: "§HWinning§! land battles as §Hdefender.§!"
organizer: "Organizer"
organizer_desc: "§LAble to plan and organize the movement of large armies.§!"
skilled_staffer: "Skilled Staffer"
skilled_staffer_desc: "§LSurrounded by some of the best staff, this leader is able to organize and manage a larger number of units.§!"
trickster: "Trickster"
trickster_desc: "§LDoing the unexpected in combat can give you a large advantage.§!"
commando: "Commando"
commando_desc: "§LSkilled in leading special forces in special conditions - this general is a man of many talents.§!"
special_ratio_over_80: "Special forces ratio > §H80%§!"
naval_invader: "Naval Invader"
naval_invader_desc: "§LAn expert in performing naval invasions. The perfect guy for preparing an invasion of a hostile beach and carrying it out.§!"

## Branch Specialization
infantry_leader: "Infantry Leader"
infantry_leader_desc: "§LSkilled at leading infantry in combat.§!"
infantry_ratio_over_80: "Infantry ratio > §H80%§!"
cavalry_leader: "Cavalry Leader"
cavalry_leader_desc: "§LSkilled at using mobile forces to achieve victory.§!"
cavalary_ratio_over_40: "Cavalry, motorized and mechanized ratio > §H40%§!"
artillery_leader: "Artillery Leader"
artillery_leader_desc: "§LSkilled at commanding artillery in combat.§!"
artillery_ratio_over_10: "Artillery ratio > §H10%§!"
trait_engineer: "Engineer"
trait_engineer_desc: "§LAdept in the arts of crossing rivers and constructing field fortifications.§!"

### Assignable Traits ###
## Leadership Specialties
clockwork_planner: "Clockwork Planner"
clockwork_planner_desc: "§LTreats military operations like a precision timepiece, refusing to launch an offensive until every battalion and shell casing is accounted for.§!"
depot_master: "Depot Master"
depot_master_desc: "§LSystematically builds forward supply magazines and distribution depots, ensuring corps never face equipment exhaustion during long sieges or marches.§!"
sweeper: "Sweeper"
sweeper_desc: "§LNot easily fazed, this officer is an expert at dealing with chaos and a broken frontline.§!"
inspector_general: "Inspector General"
inspector_general_desc: "§LInspects encampments, drills, and barracks with an uncompromising eye, raising overall combat readiness and subordinate training standards.§!"
quartermaster: "Quartermaster"
quartermaster_desc: "§LKeeps army supply lines moving smoothly across trackless wilderness and choked rail hubs through strict supervision.§!"
expert_motivator: "Expert Motivator"
expert_motivator_desc: "§LHas a knack for inspiring peers and subordinates alike. Under his leadership, even broken soldiers regain their trust in victory.§!"
night_stalker: "Night Stalker"
night_stalker_desc: "§LPrefers the cover of darkness and dense fog to launch terrifying surprise attacks on sleeping enemy encampments.§!"
expert_improviser: "Improvisation Expert"
expert_improviser_short: "Improv. Expert"
expert_improviser_desc: "§LAn expert in solving problems with whatever means are available.§!"
guerilla_fighter: "Guerilla Fighter"
guerilla_fighter_desc: "§LThe skilled guerilla fighter is an expert at using natural terrain and obstacles to their advantage.§!"
skirmisher: "Skirmisher"
skirmisher_desc: "§LSkilled at using probing attacks to test the enemy's strength and to wear them down.§!"
ibex: "Ibex"
ibex_desc: "§LFeels at home where most would perish. The steeper the hill, the better the view.§!"
stormtrooper_captain: "Stormtrooper Captain"
stormtrooper_captain_short: "Stormtrooper Cpt."
stormtrooper_captain_desc: "§LPioneers aggressive close-quarters raiding techniques with grenades and trench weaponry to clear enemy redoubts.§!"
trait_amphibious: "Amphibious"
trait_amphibious_desc: "§LNaval invasions may need to fight for a long time before resupply can arrive. Nothing this general would be concerned about.§!"
beachhead_badger: "Beachhead Badger"
beachhead_badger_desc: "§LSecures captured ports and landing sites like a badger, rapidly constructing perimeter redoubts against enemy counter-attacks.§!"
naval_liason: "Naval Liason"
naval_liason_desc: "§LA good relationship with the navy will ensure that naval fire support will be more plentiful.§!"

## Branch Specialization
ambusher: "Ambusher"
ambusher_desc: "§LSpecializes in light infantry tactics, sharp-shooting, and utilizing terrain to harass advancing lines.§!"
drillmaster: "Drillmaster"
drillmaster_desc: "§LRefuses to let battle lines bow or break, drilling men until receiving fire becomes second nature to his men.§!"
cold_steel: "Cold Steel"
cold_steel_desc: "§LBelieves no rifle shot can match the terror of six inches of cold bayonet steel surging from the smoke.§!"
sabreur: "Sabreur"
sabreur_desc: "§LLives for the thunder of hooves and the flash of drawn sabers sweeping into a broken enemy's flank.§!"
dragoon_specialist: "Dragoon Specialist"
dragoon_specialist_desc: "§LRides hard to outflank the enemy, dismounting to unleash disciplined rifle volleys from unexpected angles.§!"
phantom_rider: "Phantom Rider"
phantom_rider_desc: "§LStrikes silently behind enemy lines to provide reconnaissance, burn supply depots, and vanish before the enemy even knows he was there.§!"
hammer_fist: "Hammer Fist"
hammer_fist_desc: "§LConcentrates dozens of field batteries into a single crushing barrage that pulverizes enemy formations.§!"
fortress_crusher: "Fortress Crusher"
fortress_crusher_desc: "Assaulting a fortress holds no terror for this officer."
iron_hail: "Iron Hail"
iron_hail_desc: "§LDevastating shrapnel bursts directly over the enemy positions, silencing both men and mice.§!"
sapper: "Sapper"
sapper_desc: "§LDigs sap trenches directly beneath the enemy's fortifications to plant breaching charges under fire.§!"
trench_digger: "Trench Digger"
trench_digger_desc: "§LCan turn a muddy hillside into an unassailable system of trenches and redoubts overnight.§!"
trailblazer: "Trailblazer"
trailblazer_desc: "§LSpans swollen rivers with pontoon bridges and restores destroyed railway lines in record time.§!"

### Field Marshal Traits ###
offensive_doctrine: "Offensive Doctrine"
offensive_doctrine_desc: "LMore offensive-minded than most.§!"
defensive_doctrine: "Defensive Doctrine"
defensive_doctrine_desc: "LEspecially skilled in fighting on the defensive.§!"
thorough_planner: "Thorough Planner"
thorough_planner_desc: "§LA strategic mastermind. Given time, the well-laid plan will be the strongest.§!"
logistics_wizard: "Logistics Wizard"
logistics_wizard_desc: "§LSupplies are never late, nor ever early, they arrive precisely when this officer mean them to.§!"
fast_planner: "Fast Planner"
fast_planner_desc: "§LKnows all the shortcuts when preparing for battle - efficiency is key!§!"
organizational_leader: "Organization First"
organizational_leader_desc: "§LKnows every trick to get reinforcements faster than anyone.§!"
expert_delegator: "Expert Delegator"
expert_delegator_desc: "§LThe art of delegation allows this leader to efficiently command several armies.§!"
inspirational_leader: "Charismatic"
inspirational_leader_desc: "§LA natural leader. Men will face their worst fears when backed by a powerful leader.§!"
#ace_up_their_sleeve: "Ace Up Their Sleeve"
#ace_up_their_sleeve_desc: "§LWhatever happens, they always seem to have an ace up their sleeve.§!"
shadow_marshal: "Shadow Marshal"
shadow_marshal_desc: "§LDirects entire army groups to strike from the shadows, coordinating asymmetric ambushes, deep raids, and partisan warfare across whole theaters of war.§!"
expeditionary_expert: "Expeditionary Expert"
expeditionary_expert_short: "Expedit. Expert"
expeditionary_expert_desc: "§LMastermind behind grand amphibious campaigns and overseas expeditions, projecting imperial force seamlessly from ship to shore across vast distances.§!"
aggressive_assaulter: "Aggressive Assaulter"
aggressive_assaulter_short: "Aggr. Assaulter"
aggressive_assaulter_desc: "§LThe best defence is a strong offence.§!"
unyielding_defender: "Unyielding Defender"
unyielding_defender_desc: "§LRetreat is not an option.§!"

### Terrain Traits ###
desert_fox: "Desert Fox"
desert_fox_desc: "§LEntirely at home when fighting in a desert.§!"
swamp_fox: "Swamp Fox"
swamp_fox_desc: "§LWhile somewhat soggy, the swamp Fox knows his way around swamps and marshes.§!"
hill_fighter: "Hill Fighter"
hill_fighter_desc: "§LExcels at fighting in hilly terrain.§!"
trait_mountaineer: "Mountaineer"
trait_mountaineer_desc: "§LAn excellent climber and skilled at mountain warfare.§!"
urban_assault_specialist: "Urban Assaulter"
urban_assault_specialist_desc: "§LAn expert in street fighting and urban warfare.§!"
ranger: "Ranger"
ranger_desc: "§LRangers lead the way, especially when it involves fighting in forest areas.§!"
jungle_rat: "Jungle Rat"
jungle_rat_desc: "§LUndeterred by rodents of unusual size, and skilled in jungle warfare.§!"
winter_specialist: "Winter Specialist"
winter_specialist_desc: "§LPossesses an intuitive understanding of the difficulties of fighting in cold conditions.§!"
adaptable: "Adaptable"
adaptable_desc: "§LA natural understanding of how to fight in various terrains and adapt to different environments.§!"
winter_expert: "Winter Expert"
winter_expert_desc: "§LHard earned experience has taught this leader how to fight in harsh winter conditions.§!"


