# Qing Traits #
QNG_conservative_officer: "Conservative"
QNG_conservative_officer_desc: "This officer is opposed to reforms."
QNG_reformist_officer: "Reformer"
QNG_reformist_officer_desc: "This officer is favourable to reforms."
QNG_neutral_officer: "Politically Neutral"
QNG_neutral_officer_desc: "This officer is neutral in regard to politics."
QNG_provincial_official: "Provincial Official"
QNG_provincial_official_desc: "These officials besides the Princes hold the most power, they are generally liberal and want to implement western style reforms. However, they will resist centralisation reforms intensely and will try to undermine them whenever possible."
QNG_central_official: "Central Official"
QNG_central_official_desc: "The Central Civil Service are conservative politically but do desire stronger centralisation of power."
QNG_manchu_noble: "Manchu Noble"
QNG_manchu_noble_desc: "The Nobles are generally apathetic to regular politics but are fiercely loyal to the dynasty and will defend the banner institutions and will resist reforms that undermine them."
QNG_imperial_prince: "Imperial Prince"
QNG_imperial_prince_desc: "The Princes desire strong centralisation and will back reforms that achieve that, they will oppose anything seen as undermining the dynasty's stability, including reforms."