 NAVALMTG_SUBTITLE_PRIMITIVE_DESCRIPTION: "These naval technologies are for §Ytribal§! or §Yuncivilized§! nations only. They will only be researchable if you are an §YAgrarian§! nation and in the §YPre-Industrial Era§!.\n\nHaving more than §G1§! §YResearch Slots§! §Rblocks§! these technologies from being researched.\n\nThese technologies will never be ahead of time, regardless of their position in the tree."
 ship_hull_primitive_rowboat: "Primitive Rowboats"
 ship_hull_primitive_rowboat_desc: "small wooden boat construction improves carrying capacity, stability, and durability while remaining dependent on human-powered oars for movement."
 ship_hull_primitive_rowboat_0: "Early Primitive Rowboat"
 ship_hull_primitive_rowboat_0_desc: "A simple open wooden boat propelled by oars, suitable for fishing, ferrying small groups, and short coastal journeys where speed and protection are unimportant."
 ship_hull_primitive_rowboat_1: "Primitive Rowboat"
 ship_hull_primitive_rowboat_1_desc: "A sturdier rowboat with improved construction and carrying capacity, better suited to regular transport, coastal work, and service alongside larger sailing vessels."
 ship_engine_primitive_oars: "Primitive Oars"
 ship_engine_primitive_oars_desc: "Well-shaped oars and stronger thole or rowing arrangements transfer human effort into propulsion more efficiently. They give small boats dependable maneuverability when wind is absent, at the cost of crew endurance."
 ship_engine_primitive_oars_0: "Primitive Oars"
 ship_engine_primitive_oars_0_short: "Primitive Oars I"
 ship_engine_primitive_oars_0_desc: "Oars convert human effort directly into propulsion, giving small boats dependable movement independent of wind at the cost of limited speed, endurance, and carrying capacity."
 ship_engine_primitive_oars_1: "Improved Primitive Oars"
 ship_engine_primitive_oars_1_short: "Primitive Oars II"
 ship_engine_primitive_oars_1_desc: "Simple oars to propel a rowboat. These ones have a better shape that allows for more efficient power translation."
 ship_hull_primitive_sailing_boat: "Primitive Sailing Boats"
 ship_hull_primitive_sailing_boat_desc: "simple sailing-boat construction improves hull shape, rig support, and seaworthiness, allowing small craft to exploit wind power for longer coastal journeys."
 ship_hull_primitive_sailing_boat_0: "Early Primitive Sailing Boat"
 ship_hull_primitive_sailing_boat_0_desc: "simple sailing-boat construction improves hull shape, rig support, and seaworthiness, allowing small craft to exploit wind power for longer coastal journeys."
 ship_hull_primitive_sailing_boat_1: "Primitive Sailing Boat"
 ship_hull_primitive_sailing_boat_1_desc: "simple sailing-boat construction improves hull shape, rig support, and seaworthiness, allowing small craft to exploit wind power for longer coastal journeys."
 ship_hull_primitive_sailing_boat_2: "Late Primitive Sailing Boat"
 ship_hull_primitive_sailing_boat_2_desc: "simple sailing-boat construction improves hull shape, rig support, and seaworthiness, allowing small craft to exploit wind power for longer coastal journeys."
 ship_engine_primitive_sails: "Primitive Sails"
 ship_engine_primitive_sails_desc: "A simple mast and sail convert wind into propulsion, extending the range of small boats without constant rowing. Better cloth, rigging, and sail shape improve control and useful speed along coasts and rivers."
 ship_engine_primitive_sails_0: "Primitive Sail"
 ship_engine_primitive_sails_0_short: "Primitive Sail I"
 ship_engine_primitive_sails_0_desc: "A simple mast and sail convert wind into propulsion, extending the range of small boats without constant rowing. Better cloth, rigging, and sail shape improve control and useful speed along coasts and rivers."
 EQ_MOD_CAT_ship_primitive_armament_archers_TITLE: "Boat Archers"
 EQ_MOD_CAT_ship_primitive_armament_armed_crew_TITLE: "Armed Crewmen"
 ship_primitive_armament_archers: "Boat Archers"
 ship_primitive_armament_archers_desc: "Placing archers aboard small vessels gives them a simple ranged attack against exposed crews, lightly protected boats, and targets close to shore."
 ship_primitive_armament_archers_0: "Boat Archers"
 ship_primitive_armament_archers_0_short: "Boat Archers I"
 ship_primitive_armament_archers_0_desc: "Boat-borne archers provide a basic form of naval firepower, using massed arrows to harass enemy crews before boarding or disengagement."
 ship_primitive_armament_armed_crew: "Armed Crewmen"
 ship_primitive_armament_armed_crew_desc: "Ship crew armed with primitive weapons.\n\nThese units need to board the enemy in order to damage them, allowing for much more devastating attack capabilities at the cost of the ship being sunk very easily."
 ship_primitive_armament_armed_crew_0: "Armed Crewmen"
 ship_primitive_armament_armed_crew_0_short: "Armed Crewmen I"
 ship_primitive_armament_armed_crew_0_desc: "Ship crew armed with primitive weapons.\n\nThese units don't deal a large amount of damage, but can stay a safe distance from the enemy."
 NAVAL_TITLE_CARRIERS: "CARRIERS"
 carrier: "Carrier"
 carrier_desc: "Aircraft carriers exchange much of the direct gun armament of a capital ship for aviation facilities. Their embarked aircraft can scout, strike targets far beyond the horizon, and extend fleet air power across the sea."
 EQ_MOD_CAT_ship_engine_carrier_TITLE: "Carrier Engines"
 ship_hull_carrier: "Carriers"
 ship_hull_carrier_desc: "Large ships, but with little armament or defences. Their main purpose is to carry naval air vessels."
 ship_hull_carrier_0: "Early Seaplane Carrier"
 ship_hull_carrier_0_desc: "carrier construction devotes hull volume to aviation facilities, deck handling, fuel, workshops, and aircraft storage while maintaining enough speed and endurance to operate with the fleet."
 ship_hull_carrier_1: "1918 Seaplane Carrier"
 ship_hull_carrier_1_desc: "Early twentieth-century carrier construction devotes hull volume to aviation facilities, deck handling, fuel, workshops, and aircraft storage while maintaining enough speed and endurance to operate with the fleet."
 ship_hull_carrier_2: "1922 Seaplane Carrier"
 ship_hull_carrier_2_desc: "A purpose-built seaplane carrier hull provides greater aviation capacity, improved handling facilities, and enough speed and endurance to support reconnaissance aircraft with the fleet."
 ship_engine_carrier: "Carrier Engine"
 ship_engine_carrier_desc: "Carrier propulsion must move a large flight deck at fleet speed while providing the electrical power, endurance, and internal space needed to sustain intensive aviation operations."
 ship_engine_carrier_0: "18,000 Shp Carrier Engine"
 ship_engine_carrier_0_short: "Carrier Engine I"
 ship_engine_carrier_0_desc: "An engine rated at 18,000 shaft horsepower, providing the propulsion needed for aircraft carriers that need sustained fleet speed despite their large flight decks and aviation facilities. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_carrier_1: "25,000 Shp Carrier Engine"
 ship_engine_carrier_1_short: "Carrier Engine II"
 ship_engine_carrier_1_desc: "An engine rated at 25,000 shaft horsepower, providing the propulsion needed for aircraft carriers that need sustained fleet speed despite their large flight decks and aviation facilities. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_deck_space: "Deck Space"
 ship_deck_space_desc: "Dedicated aviation deck space provides room to park, prepare, launch, and recover naval aircraft. Better deck layout and handling arrangements increase sortie generation and the number of aircraft a carrier can operate effectively."
 ship_deck_space_0: "Simple Deck Space"
 ship_deck_space_0_short: "Deck Space I"
 ship_deck_space_0_desc: "Dedicated aviation deck space provides room to park, prepare, launch, and recover naval aircraft. Better deck layout and handling arrangements increase sortie generation and the number of aircraft a carrier can operate effectively."
 ship_turret_light_1: "100mm Light Turret"
 ship_turret_light_1_short: "Light Turret I"
 ship_turret_light_1_desc: "A 100 mm light turret combines improved traverse, loading arrangements, and crew protection for rapid fire against destroyers, torpedo craft, and shore targets."
 ship_turret_light_2: "120mm Light Turret"
 ship_turret_light_2_short: "Light Turret I"
 ship_turret_light_2_desc: "A 120 mm light turret offers heavier shells and improved fire-control integration while retaining the rate of fire needed against fast surface targets."
 ship_turret_light_3: "140mm Light Turret"
 ship_turret_light_3_short: "Light Turret III"
 ship_turret_light_3_desc: "A 140 mm light turret pushes light-battery firepower toward cruiser calibers, combining substantial shell weight with rapid train and elevation."
 ship_turret_medium_1: "180mm Medium Turret"
 ship_turret_medium_1_short: "Medium Turret I"
 ship_turret_medium_1_desc: "A 180 mm medium turret provides cruisers with a powerful protected weapon capable of defeating lighter ships and damaging armored opponents at useful battle ranges."
 ship_turret_medium_2: "220mm Medium Turret"
 ship_turret_medium_2_short: "Medium Turret II"
 ship_turret_medium_2_desc: "A 220 mm medium turret increases shell weight and penetration while improved loading and recoil systems keep the weapon practical for cruiser-sized hulls."
 ship_turret_medium_3: "250mm Medium Turret"
 ship_turret_medium_3_short: "Medium Turret III"
 ship_turret_medium_3_desc: "A 250 mm medium turret approaches capital-ship firepower, demanding stronger mountings but giving large cruisers a serious long-range punch."
 ship_secondary_guns_1: "Superfire Secondary Guns"
 ship_secondary_guns_1_short: "Support Guns II"
 ship_secondary_guns_1_desc: "Small naval artillery guns of light caliber to support the ship's main cannons. Their design has been improved."
 ship_secondary_guns_2: "1910 Model Secondary Guns"
 ship_secondary_guns_2_short: "Support Guns III"
 ship_secondary_guns_2_desc: "Small naval artillery guns of light caliber to support the ship's main cannons. Their design has been improved."
 ship_secondary_guns_3: "1915 Model Secondary Guns"
 ship_secondary_guns_3_short: "Support Guns IV"
 ship_secondary_guns_3_desc: "Small naval artillery guns of light caliber to support the ship's main cannons. Their design has been improved."
 ship_light_battery_2: "150mm Light Naval Battery"
 ship_light_battery_2_short: "Light Battery I"
 ship_light_battery_2_desc: "A 150 mm light naval battery delivers rapid, accurate fire against destroyers and lightly protected ships while remaining compact enough for smaller combatants."
 ship_light_battery_3: "160mm Light Naval Battery"
 ship_light_battery_3_short: "Light Battery II"
 ship_light_battery_3_desc: "A 160 mm light battery uses improved mountings and ammunition handling to deliver heavier shells without giving up the responsiveness expected of a light naval weapon."
 ship_medium_battery: "Medium Naval Gun Battery"
 ship_medium_battery_desc: "A ship battery of medium caliber. Batteries, compared to turrets, can not be adjusted quite as much but boast more firepower."
 ship_medium_battery_0: "280mm Medium Naval Battery"
 ship_medium_battery_0_short: "Medium Battery I"
 ship_medium_battery_0_desc: "A 280 mm medium naval battery gives cruisers and secondary capital-ship positions enough shell weight to threaten armored opponents at long range."
 ship_medium_battery_1: "300mm Medium Naval Battery"
 ship_medium_battery_1_short: "Medium Battery II"
 ship_medium_battery_1_desc: "A 300 mm medium battery combines heavier projectiles with improved fire control and loading arrangements, greatly increasing destructive power against armored ships."
 ship_heavy_battery: "Heavy Naval Gun Battery"
 ship_heavy_battery_desc: "A ship battery of heavy caliber. Batteries, compared to turrets, can not be adjusted quite as much but boast more firepower."
 ship_heavy_battery_0: "380mm Heavy Naval Battery"
 ship_heavy_battery_0_short: "Heavy Battery I"
 ship_heavy_battery_0_desc: "A 380 mm heavy naval battery is a true capital-ship weapon, capable of penetrating thick armor and delivering devastating high-explosive shells at long range."
 ship_heavy_battery_1: "410mm Heavy Naval Battery"
 ship_heavy_battery_1_short: "Heavy Battery II"
 ship_heavy_battery_1_desc: "A 410 mm heavy battery provides exceptional armor penetration and shell weight, making it suitable for the main armament of the largest battleships."
 eoanb_tt_technology_mtg_naval_propulsion_tech: "While §YPropulsion Technology§! may sometimes unlock new §YModules§! or give boosts to your ship stats, the main purpose of this technology tree is establishing a technological foundation for later hulls to be designed upon.\n\nWithout researching this tree, you will find the later hulls unavailable."
 ship_mine_layer: "Minelaying Equipment"
 ship_mine_layer_desc: "Minelaying equipment allows ships to carry, prepare, and release naval mines in controlled patterns, turning narrow seas and approaches into dangerous areas for enemy movement."
 ship_mine_layer_0: "Basic Minelaying Equipment"
 ship_mine_layer_0_short: "Minelaying Equipment I"
 ship_mine_layer_0_desc: "Basic mine rails, handling gear, and storage arrangements allow surface ships to deploy simple contact mines in planned defensive fields."
 ship_mine_layer_1: "1875 Minelaying Equipment"
 ship_mine_layer_1_short: "Minelaying Equipment II"
 ship_mine_layer_1_desc: "Improved mine-handling equipment lets crews lay larger fields more quickly and safely while using more reliable detonators and deployment methods."
 ship_mine_layer_2: "1918 Minelaying Equipment"
 ship_mine_layer_2_short: "Minelaying Equipment III"
 ship_mine_layer_2_desc: "Advanced minelaying systems support rapid deployment of sophisticated mines, improving the density, reliability, and tactical flexibility of naval minefields."
 ship_mine_sweeper: "Minesweeping Equipment"
 ship_mine_sweeper_desc: "Minesweeping equipment helps ships detect and cut moored mines or trigger them at a safe distance, reopening sea lanes that would otherwise remain too dangerous to use."
 ship_mine_sweeper_0: "Basic Minesweeping Equipment"
 ship_mine_sweeper_0_short: "Minesweeping Equipment I"
 ship_mine_sweeper_0_desc: "Basic sweeps use cables, cutters, and specialized towing gear to sever the moorings of contact mines so they can be destroyed on the surface."
 ship_mine_sweeper_1: "1875 Minesweeping Equipment"
 ship_mine_sweeper_1_short: "Minesweeping Equipment II"
 ship_mine_sweeper_1_desc: "Improved sweeping gear and procedures increase the speed and reliability with which ships can clear larger and more complex defensive minefields."
 ship_mine_sweeper_2: "1918 Minesweeping Equipment"
 ship_mine_sweeper_2_short: "Minesweeping Equipment III"
 ship_mine_sweeper_2_desc: "Advanced minesweeping systems combine improved mechanical sweeps with techniques for defeating influence mines, making heavily mined waters more manageable."
 ship_torpedo: "Torpedoes"
 ship_torpedo_desc: "Self-propelled torpedoes allow small and medium warships to threaten heavily armored capital ships below the waterline. Launch tubes, aiming systems, and increasingly reliable propulsion turn them into a central weapon of close naval attack."
 ship_torpedo_0: "Whitehead Torpedo Launcher"
 ship_torpedo_0_short: "Torpedo I"
 ship_torpedo_0_desc: "Whitehead Torpedo Launcher improves the number, reliability, or handling of self-propelled torpedoes carried by surface ships. A successful torpedo hit can cripple a capital ship with far less weight than a comparable gun battery."
 ship_torpedo_1: "Twin Tube Torpedo Launcher"
 ship_torpedo_1_short: "Torpedo II"
 ship_torpedo_1_desc: "Twin Tube Torpedo Launcher improves the number, reliability, or handling of self-propelled torpedoes carried by surface ships. A successful torpedo hit can cripple a capital ship with far less weight than a comparable gun battery."
 ship_torpedo_tesla: "Early Radio-Guided Torpedo"
 ship_torpedo_tesla_short: "\"Tesla\" Torpedo"
 ship_torpedo_tesla_desc: "Experimental radio-control concepts attempt to guide a torpedo after launch rather than relying entirely on a preset course. The idea promises greater accuracy, but contemporary electronics and communications make practical control difficult."
 ship_torpedo_submarine: "Submarine Torpedoes"
 ship_torpedo_submarine_desc: "Submarine torpedo systems combine internal tubes, compressed-air launch gear, storage racks, and fire-control procedures so a submerged boat can attack surface vessels without exposing itself to gunfire."
 ship_torpedo_submarine_0: "Submarine Whitehead Torpedo Launcher"
 ship_torpedo_submarine_0_short: "Submarine Torpedo I"
 ship_torpedo_submarine_0_desc: "Submarine Whitehead Torpedo Launcher provides submerged torpedo tubes and handling arrangements suited to the confined bow of a submarine. Improved launch gear lets boats attack larger surface ships while remaining concealed below the waterline."
 ship_torpedo_submarine_1: "Submarine Twin Tube Torpedo Launcher"
 ship_torpedo_submarine_1_short: "Submarine Torpedo II"
 ship_torpedo_submarine_1_desc: "Submarine Twin Tube Torpedo Launcher provides submerged torpedo tubes and handling arrangements suited to the confined bow of a submarine. Improved launch gear lets boats attack larger surface ships while remaining concealed below the waterline."
 ship_torpedo_submarine_tesla: "Early Radio-Guided Submarine Torpedo"
 ship_torpedo_submarine_tesla_short: "Submarine \"Tesla\" Torpedo"
 ship_torpedo_submarine_tesla_desc: "Experimental radio-control concepts attempt to guide a torpedo after launch rather than relying entirely on a preset course. The idea promises greater accuracy, but contemporary electronics and communications make practical control difficult."
 ship_anti_air: "Anti-Air Armament"
 ship_anti_air_desc: "Shipboard anti-aircraft weapons use high-angle mounts and rapid fire to defend a vessel against reconnaissance aircraft, bombers, and torpedo planes. Effective protection requires both suitable guns and increasingly sophisticated sights."
 ship_anti_air_0: "Single AA Cannon"
 ship_anti_air_0_short: "Anti-Air Guns I"
 ship_anti_air_0_desc: "A single-purpose anti-aircraft cannon gives ships a basic defense against low-flying aircraft, though limited tracking and rate of fire restrict its effectiveness."
 ship_anti_air_1: "Dual AA Cannon"
 ship_anti_air_1_short: "Anti-Air Guns II"
 ship_anti_air_1_desc: "Twin anti-aircraft mountings increase the volume of fire and improve the chance of disrupting or destroying attacking aircraft before they release their weapons."
 ship_anti_air_2: ".50cal AA Gun"
 ship_anti_air_2_short: "Anti-Air Guns III"
 ship_anti_air_2_desc: "Heavy machine guns and rapid-firing automatic weapons create a denser close-range anti-aircraft screen, particularly against low-level strafing and torpedo attacks."
 EQ_MOD_CAT_ship_mine_layer_submarine_TITLE: "Submarine Minelaying Equipment"
 ship_mine_layer_submarine: "Submarine Minelaying Equipment"
 ship_mine_layer_submarine_desc: "Submarine minelaying equipment stores and releases naval mines through specialized tubes or external arrangements, allowing covert minefields to be placed near enemy harbors and shipping routes."
 ship_mine_layer_submarine_0: "Early Submarine Minelaying Equipment"
 ship_mine_layer_submarine_0_short: "Sub Minelayer I"
 ship_mine_layer_submarine_0_desc: "Early submarine minelaying equipment allows a boat to deploy mines covertly near enemy harbors and shipping lanes, creating hazards without exposing a surface minelayer."
 ship_armor_screen_hardwood: "Hardwood Screen Ship Armor"
 ship_armor_screen_hardwood_desc: "Reinforced hardwood around vital sections can reduce splinter damage and resist very light weapons on smaller warships. It is cheap and easy to repair, but cannot substitute for metal armor against modern naval artillery."
 ship_armor_screen_hardwood_0: "Hardwood Screen Ship Armor"
 ship_armor_screen_hardwood_0_short: "Hardwood Reinforcements"
 ship_armor_screen_hardwood_0_desc: "Reinforced hardwood around vital sections can reduce splinter damage and resist very light weapons on smaller warships. It is cheap and easy to repair, but cannot substitute for metal armor against modern naval artillery."
 ship_armor_screen_harvey: "Harvey Screen Ship Armor"
 ship_armor_screen_harvey_desc: "Harveyized armor hardens the face of a steel plate while retaining a tougher backing, giving screen ships better resistance for a given weight than ordinary homogeneous plate."
 ship_armor_screen_harvey_0: "Light Harvey Armor Plating"
 ship_armor_screen_harvey_0_short: "Harvey Light Armor I"
 ship_armor_screen_harvey_0_desc: "Light Harvey-process armor gives cruisers and other screen ships improved resistance to shell fragments and medium-caliber gunfire without overwhelming their displacement."
 ship_armor_screen_krupp: "Krupp Screen Ship Armor"
 ship_armor_screen_krupp_desc: "Krupp cemented armor uses improved alloy steel and face-hardening methods to increase resistance to armor-piercing shells. Lighter plates can provide protection comparable to much thicker earlier armor."
 ship_armor_screen_krupp_0: "Light Krupp Armor Plating"
 ship_armor_screen_krupp_0_short: "Krupp Light Armor I"
 ship_armor_screen_krupp_0_desc: "Light Krupp-process armor provides screen ships with stronger protection for less weight than older plate, preserving speed while improving survivability."
 ship_depth_charge: "Anti-Submarine-Warfare"
 ship_depth_charge_desc: "Anti-submarine weapons such as depth charges attack submerged boats by detonating explosive charges at a selected depth, forcing submarines to evade or risk catastrophic hull damage."
 ship_depth_charge_0: "Simple Depth Charges"
 ship_depth_charge_0_short: "Depth Charges I"
 ship_depth_charge_0_desc: "Early depth charges provide surface ships with a practical weapon for attacking submarines once their approximate submerged position has been identified."
 ship_depth_charge_1: "Improved Depth Charges"
 ship_depth_charge_1_short: "Depth Charges II"
 ship_depth_charge_1_desc: "Improved fuzes, larger explosive charges, and better deployment methods increase the lethal radius and reliability of depth-charge attacks."
 ship_depth_charge_2: "Advanced Depth Charges"
 ship_depth_charge_2_short: "Depth Charges III"
 ship_depth_charge_2_desc: "More accurate depth settings and heavier charges make coordinated anti-submarine attacks more dangerous to boats attempting to hide below the surface."
 ship_depth_charge_3: "Depth Charge Racks"
 ship_depth_charge_3_short: "Depth Charges IV"
 ship_depth_charge_3_desc: "Dedicated depth-charge racks and improved launch patterns allow escorts to place multiple explosives around a suspected submarine position in rapid succession."
 ship_sonar: "Sonar Installations"
 ship_sonar_desc: "Hydrophones and later active sonar give warships a means to detect submerged submarines through sound. Improved listening equipment, signal processing, and operator training make underwater contacts easier to locate and track."
 ship_sonar_0: "Early Hydrophones"
 ship_sonar_0_short: "Ship Sonar I"
 ship_sonar_0_desc: "Hydrophones and later active sonar give warships a means to detect submerged submarines through sound. Improved listening equipment, signal processing, and operator training make underwater contacts easier to locate and track."
 ship_sub_snorkel: "Snorkels"
 ship_sub_snorkel_desc: "A submarine snorkel allows diesel engines to draw air while the boat remains at periscope depth. This reduces the dangerous time spent fully surfaced and lets batteries recharge with a smaller visual signature."
 ship_sub_snorkel_0: "Early Submarine Snorkel"
 ship_sub_snorkel_0_short: "Sub Snorkel I"
 ship_sub_snorkel_0_desc: "An early submarine snorkel lets diesel engines draw air while the boat remains at shallow depth, reducing the time it must spend fully surfaced and exposed to detection."
 
 
 mtb_1: "Main Battle Tank I"
 mtb_1_short: "MBT I"
 mtb_1_desc: "Early main battle tanks combine the mobility of medium tanks with the protection and firepower once reserved for heavy designs, creating a single versatile frontline platform."
 mtb_2: "Main Battle Tank II"
 mtb_2_short: "MBT II"
 mtb_2_desc: "Improved main battle tanks add stronger guns, better stabilization, and more effective armor while retaining the mobility required for fast operational maneuver."
 mtb_3: "Main Battle Tank III"
 mtb_3_short: "MBT III"
 mtb_3_desc: "Composite protection, advanced fire control, and more powerful engines make this generation of main battle tank both harder to kill and more lethal on the move."
 mtb_4: "Main Battle Tank IV"
 mtb_4_short: "MBT IV"
 mtb_4_desc: "Digital sights, thermal imaging, and improved ammunition allow this main battle tank to detect, identify, and engage targets effectively in poor visibility and at long range."
 mtb_5: "Main Battle Tank V"
 mtb_5_short: "MBT V"
 mtb_5_desc: "Modular protection, networked electronics, and refined powertrains increase survivability and battlefield awareness without sacrificing the main battle tank's offensive role."
 mtb_6: "Main Battle Tank VI"
 mtb_6_short: "MBT VI"
 mtb_6_desc: "Advanced sensors, active protection, and highly integrated fire-control systems make this generation a centerpiece of combined-arms warfare against both conventional and asymmetric threats."
 
 apc_equipment_1: "Armored Personal Carrier I"
 apc_equipment_1_short: "APC I"
 apc_equipment_1_desc: "Early armored personnel carriers give infantry protected mobility against small-arms fire and shell fragments, allowing troops to keep pace with mobile armored formations."
 apc_equipment_2: "Armored Personal Carrier II"
 apc_equipment_2_short: "APC II"
 apc_equipment_2_desc: "Improved armored personnel carriers use more reliable engines, better suspension, and stronger protection to move infantry safely across increasingly dangerous battlefields."
 apc_equipment_3: "Armored Personal Carrier III"
 apc_equipment_3_short: "APC III"
 apc_equipment_3_desc: "Greater cross-country mobility and improved troop compartments make this generation of carrier better suited to rapid mechanized operations and dismounted infantry support."
 apc_equipment_4: "Armored Personal Carrier IV"
 apc_equipment_4_short: "APC IV"
 apc_equipment_4_desc: "Modern armored personnel carriers add improved armor, communications, and weapon stations while preserving the capacity to move a full infantry section under protection."
 apc_equipment_5: "Armored Personal Carrier V"
 apc_equipment_5_short: "APC V"
 apc_equipment_5_desc: "Advanced armored personnel carriers combine modular protection, better situational awareness, and improved automotive performance for sustained operations in both open and urban terrain."
 FRA_apc_equipment_1: "Panhard M3 VTT 60B"
 FRA_apc_equipment_1_desc: "The Panhard M3 is a wheeled armored personnel carrier derived from proven Panhard automotive components. It provides infantry with protected road mobility, simple maintenance, and useful cross-country performance at relatively low cost."
 FRA_apc_equipment_1_short: "Panhard M3"
 FRA_apc_equipment_2: "Panhard VCR"
 FRA_apc_equipment_2_desc: "The Panhard VCR is a wheeled armored carrier designed for rapid troop movement and reconnaissance. Its compact layout and road speed suit mobile formations that need protection without the weight of a tracked vehicle."
 FRA_apc_equipment_2_short: "Panhard VCR"
 FRA_apc_equipment_3: "VAC Véhicule de Transport de Troupes"
 FRA_apc_equipment_3_desc: "This French armored troop carrier is designed to move infantry under protection while remaining mobile enough for mechanized operations. Its wheeled chassis emphasizes road speed, range, and economical deployment."
 FRA_apc_equipment_3_short: "VAB VTT"
 FRA_apc_equipment_4: "VAB Véhicule de Combat de l'Infanterie"
 FRA_apc_equipment_4_desc: "The VAB family provides wheeled armored mobility for infantry with a robust amphibious-capable chassis and flexible mission equipment. Combat-oriented versions add heavier weapons while retaining troop-carrying capacity."
 FRA_apc_equipment_4_short: "VAB VCI"
 FRA_apc_equipment_5: "Véhicule Blindé de Combat de l'Infanterie"
 FRA_apc_equipment_5_desc: "The VBCI is a modern wheeled infantry combat vehicle combining protected troop transport, high road mobility, digital systems, and a turreted cannon. It supports infantry directly after carrying them into the battle area."
 FRA_apc_equipment_5_short: "VBCI"

 
 apc_equipment_6: "Fighting Armored Personal Carrier I"
 apc_equipment_6_short: "FAPC I"
 apc_equipment_6_desc: "Fighting armored personnel carriers blur the line between troop carrier and infantry fighting vehicle, combining protected transport with heavier weapons. They can deliver infantry and remain close enough to provide meaningful direct fire support."
 apc_equipment_7: "Fighting Armored Personal Carrier II"
 apc_equipment_7_short: "FAPC II"
 apc_equipment_7_desc: "A fighting armored personnel carrier adds heavier armament and improved protection, allowing the vehicle to support dismounted troops more directly after delivering them into combat."
 apc_equipment_8: "Fighting Armored Personal Carrier III"
 apc_equipment_8_short: "FAPC III"
 apc_equipment_8_desc: "Later fighting armored personnel carriers integrate stabilized weapons, improved sensors, and modular defenses to provide protected transport and useful fire support in the same platform."
 FRA_apc_equipment_6: "Véhicule Blindé de Combat de l'Infanterie 2"
 FRA_apc_equipment_6_desc: "The VBCI is a modern wheeled infantry combat vehicle combining protected troop transport, high road mobility, digital systems, and a turreted cannon. It supports infantry directly after carrying them into the battle area."
 FRA_apc_equipment_6_short: "VBCI 2"
 FRA_apc_equipment_7: "Engin blindé de reconnaissance et de combat"
 FRA_apc_equipment_7_desc: "The EBRC Jaguar is a modern wheeled reconnaissance and combat vehicle equipped with advanced sensors, a medium-caliber cannon, and guided missiles. It is intended to scout, identify, and engage threats while remaining highly mobile."
 FRA_apc_equipment_7_short: "EBRC Jaguar"
 FRA_apc_equipment_8: "Engin blindé de reconnaissance et de combat 2"
 FRA_apc_equipment_8_desc: "The EBRC Jaguar is a modern wheeled reconnaissance and combat vehicle equipped with advanced sensors, a medium-caliber cannon, and guided missiles. It is intended to scout, identify, and engage threats while remaining highly mobile."
 FRA_apc_equipment_8_short: "EBRC 2"
 
 ifv_equipment_1: "Infantry Fighting Vehicle I"
 ifv_equipment_1_short: "IFV I"
 ifv_equipment_1_desc: "Early infantry fighting vehicles combine protected troop transport with an autocannon or other support weapon, allowing mechanized infantry to fight alongside tanks rather than merely ride behind them."
 ifv_equipment_2: "Infantry Fighting Vehicle II"
 ifv_equipment_2_short: "IFV II"
 ifv_equipment_2_desc: "Improved infantry fighting vehicles add stronger weapons, better mobility, and more effective troop protection, increasing their value in combined-arms formations."
 ifv_equipment_3: "Infantry Fighting Vehicle III"
 ifv_equipment_3_short: "IFV III"
 ifv_equipment_3_desc: "Modern fire-control systems and anti-armor weapons allow this generation of infantry fighting vehicle to engage both infantry and armored threats while carrying troops under protection."
 ifv_equipment_4: "Infantry Fighting Vehicle IV"
 ifv_equipment_4_short: "IFV IV"
 ifv_equipment_4_desc: "Advanced sensors, stabilized weapons, and improved armor make this infantry fighting vehicle an effective mobile fighting platform before and after its infantry dismounts."
 ifv_equipment_5: "Infantry Fighting Vehicle V"
 ifv_equipment_5_short: "IFV V"
 ifv_equipment_5_desc: "Networked electronics, modular protection, and modern weapon stations allow this generation of infantry fighting vehicle to support infantry with accurate fire in complex battlefield conditions."
 FRA_ifv_equipment_1: "Panhard EBR FL10"
 FRA_ifv_equipment_1_desc: "The Panhard EBR FL10 is a highly mobile French wheeled armored reconnaissance vehicle using an oscillating turret. Its road speed, cross-country mobility, and useful gun armament make it effective for screening and long-range reconnaissance."
 FRA_ifv_equipment_1_short: "EBR-10"
 FRA_ifv_equipment_2: "Panhard EBR FL11"
 FRA_ifv_equipment_2_desc: "The Panhard EBR FL11 is a highly mobile French wheeled armored reconnaissance vehicle using an oscillating turret. Its road speed, cross-country mobility, and useful gun armament make it effective for screening and long-range reconnaissance."
 FRA_ifv_equipment_2_short: "EBR-11"
 FRA_ifv_equipment_3: "Panhard ERC 90"
 FRA_ifv_equipment_3_desc: "The Panhard ERC 90 is a light wheeled armored reconnaissance vehicle armed with a 90 mm gun. High strategic mobility and a compact chassis allow it to provide scouting and direct fire without the logistical burden of a tank."
 FRA_ifv_equipment_3_short: "ERC-90"
 FRA_ifv_equipment_4: "AMX-10 Roues-Canon"
 FRA_ifv_equipment_4_desc: "The AMX-10 Roues-Canon is a wheeled armored reconnaissance and fire-support vehicle armed with a powerful 105 mm gun. It combines long road range and amphibious mobility with enough firepower to threaten heavier armored targets."
 FRA_ifv_equipment_4_short: "AMX-10 RC"
 FRA_ifv_equipment_5: "AMX 10 Roues-Canon Revalorisé"
 FRA_ifv_equipment_5_desc: "The AMX 10 Roues-Canon Revalorisé is a wheeled armored reconnaissance and fire-support vehicle armed with a powerful 105 mm gun. It combines long road range and amphibious mobility with enough firepower to threaten heavier armored targets."
 FRA_ifv_equipment_5_short: "AMX-10 RCR"

 anti_air_equipment_0: "Simple Anti-Air"
 anti_air_equipment_0_desc: "Early anti-aircraft weapons adapt quick-firing guns to high-angle mounts with simple sights. They are crude against fast aircraft, but concentrated fire can threaten low-flying reconnaissance planes and early bombers."
 anti_air_equipment_0_short: "Early Anti-Air"
 rocket_artillery_equipment_2: "Rocket Artillery I"
 rocket_artillery_equipment_2_short: "Rocket Artillery I"
 rocket_artillery_equipment_2_desc: "Early multiple-rocket launchers trade pinpoint accuracy for the ability to saturate a wide area with explosive fire in only a few seconds."
 rocket_artillery_equipment_3: "Rocket Artillery II"
 rocket_artillery_equipment_3_short: "Rocket Artillery II"
 rocket_artillery_equipment_3_desc: "Improved rocket artillery uses better launch rails, propellants, and fire-control methods to deliver heavier and more accurate salvos against concentrated enemy positions."
 
 technical_equipment_5: "Technical V"
 technical_equipment_5_desc: "Advanced technicals use modern utility vehicles, stabilized or remote weapon mounts, and improved sensors to turn simple light trucks into flexible combat platforms."
 technical_equipment_4: "Technical IV"
 technical_equipment_4_desc: "Later technicals pair reliable off-road vehicles with heavier weapons, improved communications, and field modifications that increase survivability during mobile operations."
 technical_equipment_3: "Technical III"
 technical_equipment_3_desc: "A more capable technical combines reinforced civilian chassis with heavy machine guns, recoilless rifles, or similar weapons to deliver substantial firepower at very low cost."
 technical_equipment_2: "Technical II"
 technical_equipment_2_desc: "Improved technicals use stronger vehicles and heavier mounted weapons, giving irregular or lightly equipped forces a fast platform for raids, escort, and mobile fire support."
 technical_equipment_1: "Technical I"
 technical_equipment_1_desc: "An improvised fighting vehicle built by mounting a light weapon on a civilian truck or utility vehicle, providing inexpensive mobility and firepower where purpose-built armor is unavailable."
 
 transport_plane_equipment_2: "Transport Plane II"
 transport_plane_equipment_2_desc: "Improved transport aircraft carry larger payloads over greater distances, making airborne supply, troop movement, and paratrooper operations more reliable and strategically useful."
 
 EQ_MOD_CAT_ship_cruise_missile_TITLE: "Cruise Missile Battery"
 EQ_MOD_CAT_ship_missile_TITLE: "Missile Battery"
 
 helicopter_tech: "Helicopters"
 helicopter_tech_desc: "Practical helicopters use powered rotors to take off and land vertically, hover over a fixed point, and operate without prepared runways. These abilities open new possibilities for reconnaissance, transport, evacuation, and close air support."
 tech_infantry_mortar_4: "Mortar IV"
 tech_infantry_mortar_4_desc: "Advanced infantry mortars combine improved baseplates, sights, communications, and ammunition with faster fire-direction methods, giving small units responsive indirect fire against concealed and entrenched targets."
 heli_equipment_1: "Attack Helicopter I"
 heli_equipment_1_desc: "Early attack helicopters combine rotary-wing mobility with machine guns, rockets, or guided weapons, allowing them to hover, use terrain for cover, and provide direct fire support to troops and armored formations."
 heli_equipment_1_short: "Attack Heli I"
 
 train_equipment: "Train Equipment"
 train_equipment_short: "Train Equipment"
 train_equipment_desc: "Military trains move troops, equipment, fuel, and supplies in quantities impossible for road transport alone, making rail networks vital to large-scale logistics."
 train_equipment_1: "Simple Steam Train"
 train_equipment_1_desc: "Simple steam locomotives provide reliable bulk transport of troops, coal, food, ammunition, and industrial goods along established railways, vastly exceeding the carrying capacity of horse-drawn road transport."
 train_equipment_2: "Early Steam Train"
 train_equipment_2_desc: "Improved steam locomotives use stronger boilers, better valve gear, and more standardized rolling stock to haul heavier trains more efficiently over expanding national railway networks."
 train_equipment_3: "Advanced Steam Train"
 train_equipment_3_desc: "Advanced steam locomotives combine high-pressure boilers, improved braking, and mature railway engineering to move heavier military and industrial loads at greater speed and reliability."
 
 railway_gun_equipment_1: "Railway Gun I"
 railway_gun_equipment_1_desc: "Railway guns mount extremely heavy artillery on reinforced rail carriages, using the railway itself to carry weapons too large for normal field transport. They can bombard fortifications and distant targets with shells of exceptional weight and range."

 EQUIPMENT_DESCRIPTION: "$NAME$"

 # EoaNB repository coverage - equipment and modules
 # Added from direct comparison against common/units/equipment and equipment/modules.
 # Every active equipment/module ID below has both a display name and a description.

 # Missing equipment localization
 advanced_railway_gun_equipment_1: "Advanced Railway Gun I"
 advanced_railway_gun_equipment_1_desc: "Advanced railway artillery applies improved metallurgy, high-capacity recoil systems, and carefully engineered firing platforms to weapons of exceptional caliber. These guns can batter major fortifications and strategic targets from great distance, provided an intact rail network can support them."
 advanced_railway_gun_equipment_2: "Advanced Railway Gun II"
 advanced_railway_gun_equipment_2_desc: "The final development of conventional railway artillery combines powerful long-range guns with sophisticated fire direction, stronger carriages, and mechanized ammunition handling. Its immense destructive power is offset by extreme logistical demands and dependence on suitable track."
 anti_tank_equipment_0: "Early Anti-Tank Gun"
 anti_tank_equipment_0_desc: "The appearance of armored fighting vehicles creates a need for guns optimized for direct fire against protected targets. High-velocity projectiles, armor-piercing ammunition, and low-profile field mountings give infantry a practical means of stopping early tanks."
 armor_train_1: "1880 Armored Train"
 armor_train_1_desc: "Purpose-built armored locomotives and protected wagons turn the railway into a mobile strongpoint. Early armored trains carry infantry, machine guns, and light artillery while shielding crews from small-arms fire and shell fragments."
 armor_train_2: "1890 Armored Train"
 armor_train_2_desc: "Improved armor plate, stronger locomotives, and better-organized fighting cars allow armored trains to carry heavier weapons without sacrificing too much mobility. They can rapidly reinforce threatened rail corridors and support troops with concentrated firepower."
 armor_train_3: "1910 Armored Train"
 armor_train_3_desc: "Mature armored-train design combines armored command cars, quick-firing guns, machine-gun positions, and protected troop compartments. Better communications and brakes make these formations more responsive during operations along contested railway networks."
 armor_train_4: "1915 Armored Train"
 armor_train_4_desc: "Great War armored trains incorporate heavier artillery, improved observation positions, and more extensive protection against rifle, machine-gun, and shell fire. They are especially useful for guarding rail lines, supporting offensives, and operating in regions with sparse roads."
 armor_train_5: "1920 Armored Train"
 armor_train_5_desc: "Postwar armored trains refine compartmentalization, fire control, communications, and locomotive protection. Although tied to the rails, they remain formidable mobile fortresses wherever a secure railway network allows their concentrated weapons to be brought to bear."
 artillery_equipment_0: "1900 Artillery"
 artillery_equipment_0_desc: "Turn-of-the-century field artillery brings together steel breech-loading guns, smokeless propellant, modern shell designs, and increasingly effective recoil systems. Batteries can fire faster and more accurately while remaining mobile enough to accompany field armies."
 artillery_equipment_1: "Horse-Drawn Artillery"
 artillery_equipment_1_desc: "Horse-drawn batteries pair quick-firing field guns with standardized limbers, ammunition wagons, and trained teams. This gives armies mobile artillery support before motor transport is reliable enough to replace horses on a large scale."
 artillery_equipment_2: "Heavy Horse-Drawn Artillery"
 artillery_equipment_2_desc: "Heavy horse-drawn artillery uses larger guns, reinforced carriages, and bigger teams to deliver heavier shells without abandoning tactical mobility. The added firepower is valuable against fortifications and massed enemy positions, though movement is slower and more demanding."
 artillery_equipment_3: "Towed Artillery"
 artillery_equipment_3_desc: "Motor vehicles and improved towing gear free field artillery from exclusive dependence on horses. Pneumatic tires, stronger carriages, and standardized tractors allow batteries to move farther and redeploy more rapidly across modern road networks."
 artillery_equipment_4: "Interwar Artillery"
 artillery_equipment_4_desc: "Interwar artillery incorporates lessons from mass industrial warfare: split trails, improved recoil mechanisms, better optical sights, standardized ammunition, and increasingly common motor towing. These changes give batteries greater traverse, range, and responsiveness."
 artillery_equipment_5: "Improved Artillery"
 artillery_equipment_5_desc: "Improved artillery combines refined gun metallurgy, better high-explosive and armor-piercing ammunition, and more coordinated fire-control procedures. Faster displacement and more reliable communications allow batteries to concentrate fire where it is needed most."
 artillery_equipment_6: "Advanced Artillery"
 artillery_equipment_6_desc: "Advanced artillery emphasizes longer effective range, higher muzzle velocity, stronger recoil systems, and improved ballistic calculation. Better shells and fire direction make each battery more lethal against both troops and fortified positions."
 artillery_equipment_7: "Modern Artillery I"
 artillery_equipment_7_desc: "Modern artillery integrates high-performance barrels, efficient recoil mechanisms, improved communications, and increasingly sophisticated fire-direction methods. Batteries can shift targets quickly and deliver accurate massed fire with less preparation than earlier generations."
 artillery_equipment_8: "Modern Artillery II"
 artillery_equipment_8_desc: "Further advances in metallurgy, ammunition, rangefinding, and fire-direction equipment make modern guns more accurate and durable under sustained use. Improved mobility and standardized logistics allow heavy fire support to follow mechanized formations more effectively."
 artillery_equipment_9: "Modern Artillery III"
 artillery_equipment_9_desc: "Postwar artillery design combines powerful but lighter gun systems with mature ballistic computation, efficient towing, and modern ammunition. The result is long-range fire support that can deploy rapidly, sustain high rates of fire, and respond to changing battlefield demands."
 battle_cruiser_1: "1922 Battlecruiser"
 battle_cruiser_1_desc: "A battlecruiser mounts capital-ship guns on a faster hull, accepting lighter protection in exchange for speed and operational reach. It can hunt cruisers, scout for the fleet, and choose favorable engagements, but should avoid prolonged battles with heavily armored battleships."
 battleship_1: "1922 Battleship"
 battleship_1_desc: "A modern battleship concentrates heavy armor and large-caliber guns on a hull intended to survive and dominate fleet engagements. Improved fire control and propulsion increase fighting range and tactical flexibility compared with earlier dreadnoughts."
 biplane_bomber_equipment: "Biplane Bomber"
 biplane_bomber_equipment_desc: "Biplane bombers exploit the high lift and structural strength of two-wing designs to carry useful bomb loads with relatively modest engines. Their speed is limited, but they provide an important early capability for battlefield interdiction and attacks behind the front."
 biplane_fighter_equipment: "Biplane Fighter"
 biplane_fighter_equipment_desc: "Biplane fighters use two braced wings to obtain strong, lightweight structures and excellent low-speed maneuverability with the engines available in the 1910s. Fitted with forward-firing machine guns, they become the first widely practical purpose-built air-superiority aircraft."
 civil_war_field_gear: "Civil War Field Gear"
 civil_war_field_gear_desc: "Mid-nineteenth-century field gear combines standardized cartridge boxes, haversacks, canteens, blankets, entrenching tools, and basic medical supplies. Better organization of individual equipment reduces confusion on campaign and helps large conscript armies remain supplied in the field."
 cv_biplane_fighter_equipment: "Carrier Biplane Fighter"
 cv_biplane_fighter_equipment_desc: "Carrier biplane fighters combine the strong low-speed handling of the biplane layout with reinforced landing gear, arresting equipment, and naval corrosion protection. Their forgiving approach characteristics make them well suited to the short flight decks of early aircraft carriers."
 cv_fighter_equipment_-1: "Late Carrier Biplane Fighter"
 cv_fighter_equipment_-1_desc: "Late carrier biplane fighters refine deck handling, synchronized armament, engine power, and structural strength. They provide reliable fleet defense and scouting while naval aviation transitions toward faster carrier monoplanes."
 cv_seaplane_fighter_equipment_1: "Early Seaplane Fighter"
 cv_seaplane_fighter_equipment_1_desc: "An early seaplane fighter uses floats or a boat-like hull so it can operate without a conventional runway. This gives fleets and remote bases useful reconnaissance and limited fighter coverage, though the added drag reduces speed and agility."
 cv_seaplane_fighter_equipment_2: "Improved Seaplane Fighter"
 cv_seaplane_fighter_equipment_2_desc: "Improved seaplane fighters use lighter floats, stronger engines, and cleaner aerodynamics to reduce the performance penalty of water operations. They remain slower than land-based fighters but can defend fleets and isolated stations where runways are unavailable."
 cv_small_plane_airframe: "Carrier Small Airframe"
 cv_small_plane_airframe_desc: "A carrier small airframe adapts light combat aircraft to the severe demands of naval aviation. Reinforced landing gear, arresting equipment, compact dimensions, and corrosion-resistant construction allow aircraft to operate repeatedly from short, moving flight decks."
 cv_small_plane_airframe_0: "Interwar Carrier Small Airframe"
 cv_small_plane_airframe_0_desc: "Interwar carrier airframes reinforce light aircraft for hard deck landings while incorporating arrestor hooks and navalized structures. Early carrier operations remain demanding, but these adaptations make routine shipboard fighter and scout aviation possible."
 cv_small_plane_airframe_1: "Basic Carrier Small Airframe"
 cv_small_plane_airframe_1_desc: "Basic carrier airframes improve landing gear, arresting points, wing structure, and corrosion protection. Better deck-handling characteristics allow naval fighters to operate more safely and reliably from increasingly capable aircraft carriers."
 cv_small_plane_airframe_2: "Improved Carrier Small Airframe"
 cv_small_plane_airframe_2_desc: "Improved carrier airframes combine stronger structures with more efficient folding arrangements and higher-performance engines. They can carry greater armament and fuel while surviving the repeated stresses of takeoff, landing, and deck handling at sea."
 cv_small_plane_airframe_3: "Advanced Carrier Small Airframe"
 cv_small_plane_airframe_3_desc: "Advanced carrier airframes are designed from the outset for high-speed naval combat, with strong landing structures, compact deck footprints, and efficient control at low approach speeds. They support heavier weapons without compromising the demanding handling needed for carrier operations."
 cv_small_plane_airframe_4: "Modern Carrier Small Airframe"
 cv_small_plane_airframe_4_desc: "Modern carrier airframes integrate late-war aerodynamic refinement with strengthened naval structures and improved deck compatibility. They provide the speed, range, payload, and ruggedness required for sustained high-tempo operations from fleet carriers."
 fighter_equipment_-1: "Late Biplane Fighter"
 fighter_equipment_-1_desc: "Late biplane fighters refine synchronized armament, engine power, visibility, and control response into a mature combat aircraft. Their maneuverability remains excellent, but increasing speed and aerodynamic efficiency begin to favor more advanced monoplane designs."
 heavy_tank_chassis: "Heavy Tank Chassis"
 heavy_tank_chassis_desc: "A heavy tank chassis provides the hull, running gear, engine space, armor structure, and turret ring needed to build heavily protected breakthrough vehicles carrying large weapons. The basic chassis determines how much weight and equipment the final vehicle can carry while remaining mechanically reliable."
 heavy_tank_chassis_0: "Interwar Heavy Tank Chassis"
 heavy_tank_chassis_0_desc: "Interwar heavy tank design applies early lessons in tracked suspension, armor layout, engine installation, and turret construction. The chassis is still mechanically immature, but provides a practical foundation for developing heavily protected breakthrough vehicles carrying large weapons."
 howitzer_equipment_2: "1880 Howitzer"
 howitzer_equipment_2_desc: "Improved steel howitzers fire heavy shells on steep trajectories, allowing batteries to strike troops, earthworks, and positions hidden behind terrain. Stronger breeches, better carriages, and more reliable fuzes improve both range and destructive effect."
 howitzer_equipment_3: "1890 Howitzer"
 howitzer_equipment_3_desc: "Late nineteenth-century howitzers combine more powerful propellants, better recoil management, and improved high-explosive shells. Their high-angle fire makes them especially valuable against entrenched troops and targets that direct-fire field guns cannot easily reach."
 large_plane_airframe: "Large Airframe"
 large_plane_airframe_desc: "A large airframe provides the structural foundation, internal volume, and load-bearing strength needed for strategic bombers and other long-range heavy aircraft. Its design determines how much engine power, fuel, armament, protection, and mission equipment can be carried effectively."
 large_plane_airframe_0: "Interwar Large Airframe"
 large_plane_airframe_0_desc: "Interwar large airframe design applies increasingly mature all-metal construction, enclosed crew stations, and more reliable engines to the needs of strategic bombers and other long-range heavy aircraft. It provides a practical foundation for the rapid advances in military aviation expected during the coming decade."
 large_plane_airframe_1: "Basic Large Airframe"
 large_plane_airframe_1_desc: "Basic large airframe construction standardizes stressed-skin structures, stronger landing gear, and more efficient aerodynamic layouts. The resulting airframe can carry better engines, weapons, and fuel while remaining practical for mass production."
 large_plane_airframe_2: "Improved Large Airframe"
 large_plane_airframe_2_desc: "Improved large airframe design uses stronger alloys, refined aerodynamics, and better internal arrangement to carry greater loads at higher speed and altitude. More efficient structures leave additional weight available for fuel, armament, protection, and specialized equipment."
 large_plane_airframe_3: "Advanced Large Airframe"
 large_plane_airframe_3_desc: "Advanced large airframe construction incorporates wartime experience in structural strength, aerodynamics, cockpit layout, and high-powered engines. The airframe is designed to remain effective under heavier loads and at the much greater speeds demanded by modern air combat."
 large_plane_airframe_4: "Modern Large Airframe"
 large_plane_airframe_4_desc: "Modern large airframe design pushes piston-era and early high-speed aircraft construction toward its practical limits, using refined structures, high-performance systems, and efficient internal packaging. It supports heavier weapons and mission equipment without sacrificing the speed and range expected of late-war aviation."
 light_tank_chassis: "Light Tank Chassis"
 light_tank_chassis_desc: "A light tank chassis provides the hull, running gear, engine space, armor structure, and turret ring needed to build fast reconnaissance, exploitation, and infantry-support vehicles. The basic chassis determines how much weight and equipment the final vehicle can carry while remaining mechanically reliable."
 light_tank_chassis_0: "Interwar Light Tank Chassis"
 light_tank_chassis_0_desc: "Interwar light tank design applies early lessons in tracked suspension, armor layout, engine installation, and turret construction. The chassis is still mechanically immature, but provides a practical foundation for developing fast reconnaissance, exploitation, and infantry-support vehicles."
 medium_plane_airframe: "Medium Airframe"
 medium_plane_airframe_desc: "A medium airframe provides the structural foundation, internal volume, and load-bearing strength needed for tactical bombers, heavy fighters, and reconnaissance aircraft. Its design determines how much engine power, fuel, armament, protection, and mission equipment can be carried effectively."
 medium_plane_airframe_0: "Interwar Medium Airframe"
 medium_plane_airframe_0_desc: "Interwar medium airframe design applies increasingly mature all-metal construction, enclosed crew stations, and more reliable engines to the needs of tactical bombers, heavy fighters, and reconnaissance aircraft. It provides a practical foundation for the rapid advances in military aviation expected during the coming decade."
 medium_plane_airframe_1: "Basic Medium Airframe"
 medium_plane_airframe_1_desc: "Basic medium airframe construction standardizes stressed-skin structures, stronger landing gear, and more efficient aerodynamic layouts. The resulting airframe can carry better engines, weapons, and fuel while remaining practical for mass production."
 medium_plane_airframe_2: "Improved Medium Airframe"
 medium_plane_airframe_2_desc: "Improved medium airframe design uses stronger alloys, refined aerodynamics, and better internal arrangement to carry greater loads at higher speed and altitude. More efficient structures leave additional weight available for fuel, armament, protection, and specialized equipment."
 medium_plane_airframe_3: "Advanced Medium Airframe"
 medium_plane_airframe_3_desc: "Advanced medium airframe construction incorporates wartime experience in structural strength, aerodynamics, cockpit layout, and high-powered engines. The airframe is designed to remain effective under heavier loads and at the much greater speeds demanded by modern air combat."
 medium_plane_airframe_4: "Modern Medium Airframe"
 medium_plane_airframe_4_desc: "Modern medium airframe design pushes piston-era and early high-speed aircraft construction toward its practical limits, using refined structures, high-performance systems, and efficient internal packaging. It supports heavier weapons and mission equipment without sacrificing the speed and range expected of late-war aviation."
 medium_tank_chassis: "Medium Tank Chassis"
 medium_tank_chassis_desc: "A medium tank chassis provides the hull, running gear, engine space, armor structure, and turret ring needed to build balanced armored fighting vehicles combining mobility, protection, and firepower. The basic chassis determines how much weight and equipment the final vehicle can carry while remaining mechanically reliable."
 medium_tank_chassis_0: "Interwar Medium Tank Chassis"
 medium_tank_chassis_0_desc: "Interwar medium tank design applies early lessons in tracked suspension, armor layout, engine installation, and turret construction. The chassis is still mechanically immature, but provides a practical foundation for developing balanced armored fighting vehicles combining mobility, protection, and firepower."
 monoplane_equipment_0: "Early Monoplane Fighter"
 monoplane_equipment_0_desc: "An early monoplane abandons the drag and bracing of multiple wings in favor of a single main wing. The simpler aerodynamic form promises higher speed and better efficiency, though contemporary structures and engines still limit performance and reliability."
 monoplane_equipment_1: "Improved Monoplane Fighter"
 monoplane_equipment_1_desc: "Improved monoplane construction uses stronger spars, better control surfaces, and more reliable engines to turn the single-wing layout into a practical military aircraft. Greater speed and climb performance make it increasingly suitable for interception and reconnaissance."
 pre_modern_support_equipment: "Pre-Modern Support Equipment"
 pre_modern_support_equipment_desc: "Pre-modern armies rely on a broad collection of practical field gear rather than standardized industrial support kits. Entrenching tools, medical supplies, signaling equipment, ammunition containers, and camp necessities improve an army’s ability to operate away from fixed bases."
 railway_gun_equipment: "Railway Artillery"
 railway_gun_equipment_desc: "Railway artillery mounts exceptionally heavy guns on reinforced rail carriages, using existing track to move weapons far too large for ordinary field transport. Such guns can bombard fortifications and distant targets with shells of extraordinary weight, but require prepared rail infrastructure and careful logistical support."
 railway_gun_equipment_2: "Railway Gun II"
 railway_gun_equipment_2_desc: "Improved railway artillery uses stronger mountings, better recoil absorption, and more efficient loading equipment to handle heavier shells without damaging the carriage or track. Better fire-control methods improve the usefulness of these enormous weapons against distant fortified targets."
 railway_gun_equipment_3: "Railway Gun III"
 railway_gun_equipment_3_desc: "Advanced railway guns combine very heavy barrels with reinforced multi-bogie carriages, improved traverse arrangements, and specialized ammunition handling. They remain strategically cumbersome, but can deliver destructive long-range bombardment beyond the reach of ordinary field artillery."
 rifled_cannon_equipment_3: "1895 Field Gun"
 rifled_cannon_equipment_3_desc: "Late nineteenth-century field guns combine steel construction, rifled barrels, reliable breech mechanisms, and increasingly powerful smokeless charges. Better sights and ammunition handling let batteries engage targets faster and more accurately than older muzzle-loading artillery."
 scout_plane_equipment_0: "Monoplane Scout"
 scout_plane_equipment_0_desc: "A dedicated monoplane scout emphasizes range, stability, visibility, and reliable communications over heavy armament. Aerial observation gives commanders timely information on enemy movements, artillery positions, and terrain far beyond the view of ground patrols."
 ship_destroyer_0: "Torpedo Boat Destroyer"
 ship_destroyer_0_desc: "The 1890 destroyer combines high speed, quick-firing guns, and torpedoes in a hull designed to screen larger warships. Better machinery and seakeeping improve its ability to hunt torpedo craft, escort fleets, and perform reconnaissance in rough conditions."
 ship_destroyer_1: "1900 Destroyer"
 ship_destroyer_1_desc: "The 1900 destroyer combines high speed, quick-firing guns, and torpedoes in a hull designed to screen larger warships. Better machinery and seakeeping improve its ability to hunt torpedo craft, escort fleets, and perform reconnaissance in rough conditions."
 ship_destroyer_2: "1910 Destroyer"
 ship_destroyer_2_desc: "The 1910 destroyer combines high speed, quick-firing guns, and torpedoes in a hull designed to screen larger warships. Better machinery and seakeeping improve its ability to hunt torpedo craft, escort fleets, and perform reconnaissance in rough conditions."
 ship_destroyer_3: "1914 Destroyer"
 ship_destroyer_3_desc: "The 1914 destroyer combines high speed, quick-firing guns, and torpedoes in a hull designed to screen larger warships. Better machinery and seakeeping improve its ability to hunt torpedo craft, escort fleets, and perform reconnaissance in rough conditions."
 ship_destroyer_4: "1916 Destroyer"
 ship_destroyer_4_desc: "The 1916 destroyer combines high speed, quick-firing guns, and torpedoes in a hull designed to screen larger warships. Better machinery and seakeeping improve its ability to hunt torpedo craft, escort fleets, and perform reconnaissance in rough conditions."
 ship_frigate_0: "Early Frigate"
 ship_frigate_0_desc: "A sailing frigate is a fast, single-deck cruising warship built for scouting, commerce protection, raiding, and independent patrols. It cannot stand in the main battle line, but its speed and range make it one of the most flexible warships of the age of sail."
 ship_frigate_1: "1850 Frigate"
 ship_frigate_1_desc: "Mid-century frigates refine hull lines, artillery, and sailing rigs while beginning to adopt auxiliary steam power. They remain valuable long-range cruisers during the transition from sail to fully steam-driven warships."
 ship_frigate_2: "1865 Frigate"
 ship_frigate_2_desc: "Steam-era frigates combine screw propulsion with traditional cruising endurance and increasingly powerful rifled guns. They offer a practical ocean-going warship for fleets that do not require the armor and expense of an ironclad."
 ship_heavy_cruiser_0: "Early Heavy Cruiser"
 ship_heavy_cruiser_0_desc: "An early heavy cruiser combines long cruising range with substantial guns and armor, making it suitable for commerce protection, colonial service, and independent operations. It sacrifices some speed for the ability to fight lighter cruisers on favorable terms."
 ship_heavy_cruiser_1: "1880 Heavy Cruiser"
 ship_heavy_cruiser_1_desc: "Improved heavy cruisers use better steel, machinery, and breech-loading guns to increase combat power without reaching battleship size. Their range and endurance make them useful for distant stations and independent cruising."
 ship_heavy_cruiser_2: "1890 Heavy Cruiser"
 ship_heavy_cruiser_2_desc: "Late nineteenth-century heavy cruisers combine protected machinery spaces, heavier quick-firing guns, and more powerful steam plants. They can scout for the fleet, protect trade, and overpower most lighter vessels encountered at sea."
 ship_heavy_cruiser_3: "1905 Heavy Cruiser"
 ship_heavy_cruiser_3_desc: "Early twentieth-century heavy cruisers refine armor, fire control, and turbine-era propulsion into a fast armored warship. They bridge the gap between traditional armored cruisers and the later heavy-cruiser concept."
 ship_hull_carrier_conversion_bb: "Converted Battleship Carrier Hull"
 ship_hull_carrier_conversion_bb_desc: "Converting an existing battleship hull into an aircraft carrier reuses a large, sturdy hull and powerful machinery while replacing much of the gun armament with aviation facilities. The result can carry a substantial air group, though internal layout and deck arrangement are constrained by the original design."
 ship_hull_carrier_conversion_ca: "Converted Cruiser Carrier Hull"
 ship_hull_carrier_conversion_ca_desc: "A cruiser conversion creates an aircraft carrier more quickly and cheaply than a purpose-built design by adding a flight deck and hangar to an existing hull. The smaller hull limits aircraft capacity, but provides a useful way to expand naval aviation rapidly."
 ship_hull_heavy: "Heavy Ship Hull"
 ship_hull_heavy_desc: "A heavy ship hull is designed to carry major-caliber guns, thick armor, powerful machinery, and the large crews required for capital-ship warfare. Its size provides enormous combat potential but demands substantial industrial capacity, dockyard time, and resources."
 ship_hull_heavy_1: "1922 Heavy Ship Hull"
 ship_hull_heavy_1_desc: "Postwar heavy hull design incorporates improved compartmentalization, oil-fired machinery, stronger armor layouts, and lessons from dreadnought combat. It provides a flexible basis for powerful battleships and battlecruisers of the interwar generation."
 ship_hull_light_1: "1922 Light Ship Hull"
 ship_hull_light_1_desc: "A modern light-ship hull emphasizes speed, maneuverability, economical construction, and flexible weapon arrangements. It forms the basis for destroyers and other screening vessels responsible for scouting, escort, torpedo attack, and anti-submarine work."
 ship_hull_pre_dreadnought: "Pre-Dreadnought Hull"
 ship_hull_pre_dreadnought_desc: "The pre-dreadnought combines a heavily armored hull with a mixed battery of a few large main guns and numerous smaller weapons. It represents the mature battleship formula of the late nineteenth century before all-big-gun dreadnoughts make the type obsolete."
 ship_ironclad_0: "Early Ironclad"
 ship_ironclad_0_desc: "Early ironclads combine steam propulsion, heavy guns, and iron protection to survive fire that would devastate wooden warships. Their engines, armor layouts, and handling are still experimental, but they mark a decisive break with the age of sail."
 ship_ironclad_1: "1865 Ironclad"
 ship_ironclad_1_desc: "Improved ironclads use stronger armor schemes, more reliable steam machinery, and better gun arrangements. Naval architects increasingly design the entire vessel around armored protection rather than simply adding iron plate to traditional wooden forms."
 ship_ironclad_2: "1870 Ironclad"
 ship_ironclad_2_desc: "Mature ironclads refine armored citadels, turret or central-battery arrangements, and efficient steam propulsion. They can engage at greater range and withstand far heavier punishment than the transitional armored ships of the previous decade."
 ship_light_cruiser_0: "1875 Light Cruiser"
 ship_light_cruiser_0_desc: "The 1875 light cruiser emphasizes speed, scouting range, and a substantial battery of rapid-firing guns. It can lead screening forces, protect trade, and defeat smaller vessels while remaining cheaper and faster than heavily armored cruisers."
 ship_light_cruiser_1: "1880 Light Cruiser"
 ship_light_cruiser_1_desc: "The 1880 light cruiser emphasizes speed, scouting range, and a substantial battery of rapid-firing guns. It can lead screening forces, protect trade, and defeat smaller vessels while remaining cheaper and faster than heavily armored cruisers."
 ship_light_cruiser_2: "1890 Light Cruiser"
 ship_light_cruiser_2_desc: "The 1890 light cruiser emphasizes speed, scouting range, and a substantial battery of rapid-firing guns. It can lead screening forces, protect trade, and defeat smaller vessels while remaining cheaper and faster than heavily armored cruisers."
 ship_light_cruiser_3: "1900 Light Cruiser"
 ship_light_cruiser_3_desc: "The 1900 light cruiser emphasizes speed, scouting range, and a substantial battery of rapid-firing guns. It can lead screening forces, protect trade, and defeat smaller vessels while remaining cheaper and faster than heavily armored cruisers."
 ship_light_cruiser_4: "1910 Light Cruiser"
 ship_light_cruiser_4_desc: "The 1910 light cruiser emphasizes speed, scouting range, and a substantial battery of rapid-firing guns. It can lead screening forces, protect trade, and defeat smaller vessels while remaining cheaper and faster than heavily armored cruisers."
 ship_lineship_0: "Early Ship of the Line"
 ship_lineship_0_desc: "The mature sailing ship of the line carries multiple enclosed gun decks in a large wooden hull built for close-order fleet battle. It can deliver devastating broadsides, but depends entirely on wind and requires extensive crews and rigging."
 ship_lineship_1: "1850 Ship of the Line"
 ship_lineship_1_desc: "Late ships of the line refine hull construction, artillery arrangement, and sailing performance while retaining the traditional multi-deck broadside layout. They represent the peak of wooden capital-ship design immediately before steam power and armor transform naval warfare."
 ship_torpedo_boat_0: "1875 Torpedo Boat"
 ship_torpedo_boat_0_desc: "The 1875 torpedo boat is a small, fast attack craft built around the ability to threaten much larger warships with self-propelled torpedoes. Improvements in machinery, hull strength, and torpedo handling make each generation faster, more seaworthy, and more dangerous."
 ship_torpedo_boat_1: "1880 Torpedo Boat"
 ship_torpedo_boat_1_desc: "The 1880 torpedo boat is a small, fast attack craft built around the ability to threaten much larger warships with self-propelled torpedoes. Improvements in machinery, hull strength, and torpedo handling make each generation faster, more seaworthy, and more dangerous."
 ship_torpedo_boat_2: "1890 Torpedo Boat"
 ship_torpedo_boat_2_desc: "The 1890 torpedo boat is a small, fast attack craft built around the ability to threaten much larger warships with self-propelled torpedoes. Improvements in machinery, hull strength, and torpedo handling make each generation faster, more seaworthy, and more dangerous."
 ship_torpedo_boat_3: "1905 Torpedo Boat"
 ship_torpedo_boat_3_desc: "The 1905 torpedo boat is a small, fast attack craft built around the ability to threaten much larger warships with self-propelled torpedoes. Improvements in machinery, hull strength, and torpedo handling make each generation faster, more seaworthy, and more dangerous."
 ship_torpedo_boat_4: "1915 Torpedo Boat"
 ship_torpedo_boat_4_desc: "The 1915 torpedo boat is a small, fast attack craft built around the ability to threaten much larger warships with self-propelled torpedoes. Improvements in machinery, hull strength, and torpedo handling make each generation faster, more seaworthy, and more dangerous."
 small_plane_airframe: "Small Airframe"
 small_plane_airframe_desc: "A small airframe provides the structural foundation, internal volume, and load-bearing strength needed for fighter and light attack aircraft. Its design determines how much engine power, fuel, armament, protection, and mission equipment can be carried effectively."
 small_plane_airframe_0: "Interwar Small Airframe"
 small_plane_airframe_0_desc: "Interwar small airframe design applies increasingly mature all-metal construction, enclosed crew stations, and more reliable engines to the needs of fighter and light attack aircraft. It provides a practical foundation for the rapid advances in military aviation expected during the coming decade."
 small_plane_airframe_1: "Basic Small Airframe"
 small_plane_airframe_1_desc: "Basic small airframe construction standardizes stressed-skin structures, stronger landing gear, and more efficient aerodynamic layouts. The resulting airframe can carry better engines, weapons, and fuel while remaining practical for mass production."
 small_plane_airframe_2: "Improved Small Airframe"
 small_plane_airframe_2_desc: "Improved small airframe design uses stronger alloys, refined aerodynamics, and better internal arrangement to carry greater loads at higher speed and altitude. More efficient structures leave additional weight available for fuel, armament, protection, and specialized equipment."
 small_plane_airframe_3: "Advanced Small Airframe"
 small_plane_airframe_3_desc: "Advanced small airframe construction incorporates wartime experience in structural strength, aerodynamics, cockpit layout, and high-powered engines. The airframe is designed to remain effective under heavier loads and at the much greater speeds demanded by modern air combat."
 small_plane_airframe_4: "Modern Small Airframe"
 small_plane_airframe_4_desc: "Modern small airframe design pushes piston-era and early high-speed aircraft construction toward its practical limits, using refined structures, high-performance systems, and efficient internal packaging. It supports heavier weapons and mission equipment without sacrificing the speed and range expected of late-war aviation."
 submarine_1: "1922 Submarine"
 submarine_1_desc: "An interwar submarine combines improved pressure-hull construction, diesel-electric propulsion, better torpedoes, and more reliable periscopes. Greater range and endurance allow submarines to conduct sustained commerce raiding and reconnaissance far from their home bases."
 support_equipment_4: "Modern Support Equipment"
 support_equipment_4_desc: "Modern support equipment standardizes radios, field tools, medical supplies, engineering stores, grenades, optical instruments, and other specialist gear needed by a mechanized army. Better packaging and mass production make these items easier to distribute and replace in sustained operations."
 tac_bomber_equipment_-1: "Early Tactical Bomber"
 tac_bomber_equipment_-1_desc: "Early tactical bombers combine greater range and payload with enclosed crew stations, more powerful engines, and dedicated bomb stowage. They can attack railways, supply centers, troop concentrations, and other operational targets beyond the immediate battlefield."
 technical_equipment: "Technicals"
 technical_equipment_desc: "Technicals are improvised fighting vehicles created by mounting machine guns, autocannons, recoilless rifles, or other weapons on civilian utility vehicles. They trade armor and protection for very low cost, high road speed, and the ability to bring mobile firepower to lightly equipped forces."
 train_equipment_4: "1875 Steam Train"
 train_equipment_4_desc: "More powerful boilers, stronger frames, and improved braking allow late nineteenth-century locomotives to haul heavier military and industrial trains over expanding rail networks. Increased reliability makes rail transport even more central to mobilization and supply."
 train_equipment_5: "1885 Steam Train"
 train_equipment_5_desc: "Compound steam technology, better valve gear, and improved steel construction increase locomotive efficiency and tractive effort. Heavier trains can be moved farther with less fuel and more dependable schedules."
 train_equipment_6: "1890 Steam Train"
 train_equipment_6_desc: "Mature late-century locomotives use high-pressure boilers, stronger running gear, improved brakes, and standardized rolling stock. These advances increase throughput on busy rail corridors and make large-scale military logistics more reliable."
 transport_plane_equipment: "Transport Aircraft"
 transport_plane_equipment_desc: "Transport aircraft devote internal volume to passengers, cargo, and military supplies rather than weapons. Even early transports can move personnel and urgent material over obstacles and poor roads, laying the groundwork for airborne logistics and troop movement."
 uniform_equipment_11: "1936 Combat Uniform"
 uniform_equipment_11_desc: "Interwar combat uniforms increasingly favor practical field colors, durable fabrics, standardized web equipment, and protection from weather over parade-ground appearance. Better pockets, boots, and load carriage improve a soldier’s comfort and endurance during prolonged operations."
 uniform_equipment_12: "1940 Combat Uniform"
 uniform_equipment_12_desc: "Wartime uniforms refine camouflage, layered clothing, helmets, web gear, and field tailoring for large mechanized armies. Standardized production and lessons from active combat improve protection and mobility across a wider range of climates."
 uniform_equipment_13: "1942 Combat Uniform"
 uniform_equipment_13_desc: "Midwar combat clothing places greater emphasis on camouflage, durable field fabrics, improved helmets, and practical load-bearing equipment. Specialized cold-weather and tropical garments help troops remain effective under harsher operational conditions."
 uniform_equipment_14: "1945 Combat Uniform"
 uniform_equipment_14_desc: "Late-war combat uniforms combine mature camouflage practice, improved protective helmets, efficient web gear, and clothing designed for mechanized warfare. Practicality and mass production take precedence over elaborate service dress."
 uniform_equipment_15: "Semi-Modern Combat Uniform"
 uniform_equipment_15_desc: "Postwar field uniforms apply wartime experience to standardized camouflage, modular load carriage, weather-resistant materials, and improved protective equipment. The result is a more functional system intended for sustained operations in varied terrain and climates."
 zeppelin_equipment_1: "Zeppelin"
 zeppelin_equipment_1_desc: "Rigid airships use an internal framework to support large gas cells, engines, crew spaces, and payloads without losing their aerodynamic shape. Their endurance and lifting capacity make them useful for long-range reconnaissance, transport, and strategic bombing, though they remain vulnerable to weather and hostile aircraft."
 zeppelin_equipment_2: "High-Altitude Zeppelin"
 zeppelin_equipment_2_desc: "Improved structural weight, engines, gas-cell management, and control surfaces allow rigid airships to operate at greater altitude and range. Flying higher reduces exposure to some ground defenses and extends reconnaissance coverage, but oxygen, weather, and structural stresses become increasingly important limitations."

 # Missing equipment module localization
 additional_machine_guns: "Additional Machine Guns"
 additional_machine_guns_desc: "Extra hull and turret machine guns increase a tank’s ability to suppress infantry and engage close targets without using the main cannon. The additional mounts improve defensive fire but consume ammunition, crew attention, and internal space."
 amphibious_drive: "Amphibious Drive"
 amphibious_drive_desc: "Sealed hull fittings, flotation arrangements, and water propulsion allow an armored vehicle to cross rivers and calm coastal waters without a bridge. The equipment adds weight and complexity, but greatly expands tactical mobility during amphibious and river-crossing operations."
 armor_skirts: "Armor Skirts"
 armor_skirts_desc: "Thin spaced plates mounted outside the main hull armor can disrupt certain projectiles before they reach the primary armor surface. Skirts also protect running gear from fragments, though they add width, weight, and maintenance burden."
 auto_loader: "Automatic Loader"
 auto_loader_desc: "A mechanical loading system moves ammunition from ready racks into the gun, reducing manual work and allowing a smaller turret crew or higher sustained rate of fire. The mechanism requires careful ammunition stowage and adds considerable mechanical complexity."
 dozer_blade: "Dozer Blade"
 dozer_blade_desc: "A front-mounted dozer blade lets a tank clear rubble, prepare firing positions, fill obstacles, and improve rough approaches under armor protection. It turns the vehicle into a useful battlefield engineering asset at the cost of extra weight and bulk."
 easy_maintenance: "Ease of Maintenance"
 easy_maintenance_desc: "Standardized fittings, accessible service panels, simplified components, and attention to field repair reduce the time required to keep armored vehicles operational. Good maintainability is especially valuable during long campaigns where workshops and spare parts are limited."
 extra_ammo_storage: "Extra Ammunition Storage"
 extra_ammo_storage_desc: "Additional racks increase the number of main-gun rounds carried into battle, reducing dependence on immediate resupply. Unless carefully protected, however, extra ammunition also increases the amount of explosive material inside the fighting compartment."
 fire_control_system_5: "Improved Director Control"
 fire_control_system_5_desc: "Improved director control centralizes rangefinding, target tracking, and gun orders so multiple turrets can fire as a coordinated battery. Better plotting equipment reduces errors as range and relative motion change during battle."
 fire_control_system_6: "Gyro-Stabilized Fire Control"
 fire_control_system_6_desc: "Gyro stabilization and improved mechanical computation help naval directors maintain an accurate firing solution while both target and firing ship maneuver. This sharply improves long-range accuracy in rough seas and high-speed engagements."
 fire_control_system_7: "Radar-Assisted Fire Control"
 fire_control_system_7_desc: "Radar ranging supplements optical instruments with electronic distance and bearing information, allowing accurate gunfire in darkness, haze, and poor visibility. Fire-control computers can update solutions faster and with less dependence on visual observation."
 fire_control_system_8: "Advanced Radar Fire Control"
 fire_control_system_8_desc: "Advanced radar fire control integrates precise electronic tracking with mature analog computation and centralized directors. Ships can acquire targets faster, maintain solutions during maneuver, and deliver effective fire under conditions that would defeat purely optical systems."
 flamethrower: "Tank Flamethrower"
 flamethrower_desc: "A vehicle-mounted flamethrower projects burning fuel into bunkers, trenches, and buildings that may resist ordinary small-arms fire. Armor protects the operator better than a man-portable system, but fuel tanks and short range remain serious hazards."
 mtg_missile_pods: "Missile Pods"
 mtg_missile_pods_desc: "External missile pods give an armored vehicle access to guided or unguided rockets without requiring a large conventional gun. They provide powerful standoff fire, but exposed launchers and limited ready ammunition make protection and resupply important concerns."
 secondary_turret_hmg: "Heavy Machine-Gun Secondary Turret"
 secondary_turret_hmg_desc: "A small auxiliary turret carrying a heavy machine gun adds all-around fire against infantry, light vehicles, and low-flying aircraft. The extra position increases fighting flexibility but requires additional crew space and complicates the vehicle layout."
 secondary_turret_small_cannon: "Small-Cannon Secondary Turret"
 secondary_turret_small_cannon_desc: "An auxiliary turret armed with a small cannon gives a large tank a second weapon for engaging infantry and light vehicles independently of the main gun. The concept increases fire coverage but adds weight, crew requirements, and mechanical complexity."
 ship_anti_air_3: "Automatic Anti-Aircraft Battery"
 ship_anti_air_3_desc: "Automatic anti-aircraft cannon mountings provide a dense close- and medium-range curtain of fire against dive bombers and torpedo aircraft. Higher rates of fire, better sights, and powered mounts make the battery much more effective against fast-moving aerial targets."
 ship_armor_capital_ironclad_0: "Ironclad Capital Armor"
 ship_armor_capital_ironclad_0_desc: "Early ironclad armor uses thick wrought-iron plates backed by heavy timber to protect machinery, magazines, and gun positions from contemporary shellfire. The protection is extremely heavy, forcing naval architects to balance armor coverage against speed and stability."
 ship_armor_screen_ironclad_0: "Ironclad Screen Armor"
 ship_armor_screen_ironclad_0_desc: "Wrought-iron plating gives smaller armored ships useful protection against rifles, shell fragments, and lighter naval guns. Because weight is limited on screen-sized hulls, armor must be concentrated around machinery and the most important fighting spaces."
 ship_deck_space_1: "Early Flight Deck Space"
 ship_deck_space_1_desc: "Dedicated flight-deck areas and simple handling arrangements give a carrier room to park, prepare, launch, and recover a small air group. Early layouts are inefficient but establish the basic workflow of shipboard aviation."
 ship_deck_space_2: "Expanded Flight Deck Space"
 ship_deck_space_2_desc: "Expanded deck and hangar arrangements increase the number of aircraft that can be stored and moved without blocking flight operations. Better elevators and deck handling raise sortie generation during sustained operations."
 ship_deck_space_3: "Improved Flight Deck Space"
 ship_deck_space_3_desc: "Improved carrier deck design combines efficient elevators, hangar organization, fueling points, and aircraft spotting procedures. More aircraft can be prepared and launched in less time while keeping deck congestion under control."
 ship_deck_space_4: "Advanced Flight Deck Space"
 ship_deck_space_4_desc: "Advanced flight-deck arrangements improve aircraft flow from hangar to launch position, reduce turnaround time, and provide more efficient servicing areas. A carrier can operate a larger air group at a higher tempo."
 ship_deck_space_5: "Large Flight Deck Space"
 ship_deck_space_5_desc: "Large, mature flight-deck and hangar arrangements maximize aircraft capacity while preserving efficient launch and recovery cycles. Better deck handling, elevators, and servicing spaces allow sustained high-tempo carrier operations."
 ship_depth_charge_4: "Depth Charge System V"
 ship_depth_charge_4_desc: "Throwers and improved racks allow escorts to spread charges across a wider pattern instead of dropping them only directly astern. This makes it harder for a submarine to evade once its approximate position is known."
 ship_depth_charge_5: "Depth Charge System VI"
 ship_depth_charge_5_desc: "Heavier charges, more reliable depth pistols, and coordinated attack patterns increase the lethal volume around a suspected submarine. Escorts can maintain pressure while reducing the chance that a small depth-setting error spoils the attack."
 ship_depth_charge_6: "Depth Charge System VII"
 ship_depth_charge_6_desc: "Forward-projecting anti-submarine weapons let escorts attack a submerged contact without immediately passing over and losing sonar contact. Concentrated patterns of explosives greatly improve the chance of damaging a maneuvering submarine."
 ship_depth_charge_7: "Depth Charge System VIII"
 ship_depth_charge_7_desc: "Mature anti-submarine projectile systems combine rapid launchers, accurate depth settings, and coordinated sonar fire control. They can place dense explosive patterns around a contact before the submarine has time to escape."
 ship_engine_diesel_capital_1: "Capital Ship Diesel Engine I"
 ship_engine_diesel_capital_1_desc: "Diesel propulsion offers the capital ship excellent fuel economy, long cruising range, and efficient low-speed operation without the boiler plant required by steam machinery. The engines are heavier for a given peak power, but their endurance and reliability are valuable on long deployments."
 ship_engine_diesel_carrier_1: "Carrier Diesel Engine I"
 ship_engine_diesel_carrier_1_desc: "Diesel propulsion offers the carrier excellent fuel economy, long cruising range, and efficient low-speed operation without the boiler plant required by steam machinery. The engines are heavier for a given peak power, but their endurance and reliability are valuable on long deployments."
