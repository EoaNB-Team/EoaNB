 ship_hull_corvette: "Corvettes"
 ship_hull_corvette_desc: "corvette construction favors economy, range, and maneuverability in a small ocean-going escort suited to patrol, dispatch work, convoy protection, and screening duties."
 ship_hull_corvette_0: "Early Corvette Hull"
 ship_hull_corvette_0_desc: "corvette construction favors economy, range, and maneuverability in a small ocean-going escort suited to patrol, dispatch work, convoy protection, and screening duties."
 ship_hull_corvette_1: "1857 Corvette Hull"
 ship_hull_corvette_1_desc: "Early industrial-era corvette construction favors economy, range, and maneuverability in a small ocean-going escort suited to patrol, dispatch work, convoy protection, and screening duties."
 ship_hull_corvette_2: "1860 Corvette Hull"
 ship_hull_corvette_2_desc: "Mid-nineteenth-century corvette construction favors economy, range, and maneuverability in a small ocean-going escort suited to patrol, dispatch work, convoy protection, and screening duties."
 ship_hull_corvette_3: "1868 Ironclad Corvette Hull"
 ship_hull_corvette_3_desc: "Mid-nineteenth-century corvette construction favors economy, range, and maneuverability in a small ocean-going escort suited to patrol, dispatch work, convoy protection, and screening duties."
 ship_engine_sail: "Sails"
 ship_engine_sail_desc: "Sailing rigs convert wind into propulsion without consuming fuel, giving warships exceptional endurance but making speed and direction dependent on weather. Better mast arrangements, sail plans, and rigging improve handling until steam power finally supersedes sail."
 ship_engine_sail_0: "Two-Mast Sails"
 ship_engine_sail_0_short: "Sails I"
 ship_engine_sail_0_desc: "A two-masted sailing rig is compact and economical, giving smaller warships useful maneuverability and range without the weight or fuel demands of steam machinery."
 ship_engine_sail_1: "Three-Mast Sails"
 ship_engine_sail_1_short: "Sails II"
 ship_engine_sail_1_desc: "A three-masted rig spreads more sail area across the hull, improving endurance and speed under favorable winds while remaining manageable for ocean-going crews."
 ship_engine_sail_2: "Four-Mast Sails"
 ship_engine_sail_2_short: "Sails III"
 ship_engine_sail_2_desc: "A four-masted rig provides a large sail plan for heavy vessels, maximizing wind-powered endurance before steam propulsion becomes dominant."
 ship_hull_torpedo_boat: "Torpedo Boats"
 ship_hull_torpedo_boat_desc: "Small vessels armed with torpedoes. They barely even act as screens, and their purpose in combat is to launch torpedoes at enemy capital vessels."
 ship_hull_torpedo_boat_0: "Early Torpedo Boat Hull"
 ship_hull_torpedo_boat_0_desc: "An early torpedo boat hull. Torpedo boats are small vessels carrying torpedoes to launch at enemy capital ships."
 ship_hull_torpedo_boat_1: "1884 Torpedo Boat Hull"
 ship_hull_torpedo_boat_1_desc: "A small, lightly built torpedo-boat hull sacrifices protection and endurance for the speed needed to close on larger ships and launch self-propelled torpedoes."
 ship_hull_torpedo_boat_2: "1890 Torpedo Boat Hull"
 ship_hull_torpedo_boat_2_desc: "A small, lightly built torpedo-boat hull sacrifices protection and endurance for the speed needed to close on larger ships and launch self-propelled torpedoes."
 ship_hull_torpedo_boat_3: "1905 Torpedo Boat Hull"
 ship_hull_torpedo_boat_3_desc: "Improved machinery and seakeeping let this torpedo boat operate farther from port while carrying more reliable torpedoes and a modest defensive gun armament."
 ship_hull_torpedo_boat_4: "1915 Torpedo Boat Hull"
 ship_hull_torpedo_boat_4_desc: "A mature torpedo-boat design combines high speed, improved torpedo armament, and better seaworthiness for rapid attacks against larger surface ships."
 ship_engine_torpedo_boat: "Torpedo Boat Ship Engines"
 ship_engine_torpedo_boat_desc: "Torpedo-boat engines emphasize high power in a small hull, allowing lightly built attack craft to close rapidly, launch torpedoes, and escape before heavier ships can respond."
 ship_engine_torpedo_boat_0: "1,500 Shp Torpedo Boat Engine"
 ship_engine_torpedo_boat_0_short: "Torpedo Boat Engine I"
 ship_engine_torpedo_boat_0_desc: "Rated at roughly 1,500 shaft horsepower, this machinery packs as much power as possible into a very small hull, giving torpedo craft the acceleration and speed needed to close on larger ships and disengage quickly."
 ship_engine_torpedo_boat_1: "2,000 Shp Torpedo Boat Engine"
 ship_engine_torpedo_boat_1_short: "Torpedo Boat Engine II"
 ship_engine_torpedo_boat_1_desc: "Rated at roughly 2,000 shaft horsepower, this machinery packs as much power as possible into a very small hull, giving torpedo craft the acceleration and speed needed to close on larger ships and disengage quickly."
 ship_engine_torpedo_boat_2: "2,600 Shp Torpedo Boat Engine"
 ship_engine_torpedo_boat_2_short: "Torpedo Boat Engine III"
 ship_engine_torpedo_boat_2_desc: "Rated at roughly 2,600 shaft horsepower, this machinery packs as much power as possible into a very small hull, giving torpedo craft the acceleration and speed needed to close on larger ships and disengage quickly."
 ship_engine_torpedo_boat_3: "3,200 Shp Torpedo Boat Engine"
 ship_engine_torpedo_boat_3_short: "Torpedo Boat Engine IV"
 ship_engine_torpedo_boat_3_desc: "Rated at roughly 3,200 shaft horsepower, this machinery packs as much power as possible into a very small hull, giving torpedo craft the acceleration and speed needed to close on larger ships and disengage quickly."
 ship_engine_torpedo_boat_4: "4,000 Shp Torpedo Boat Engine"
 ship_engine_torpedo_boat_4_short: "Torpedo Boat Engine V"
 ship_engine_torpedo_boat_4_desc: "Rated at roughly 4,000 shaft horsepower, this machinery packs as much power as possible into a very small hull, giving torpedo craft the acceleration and speed needed to close on larger ships and disengage quickly."
 ship_hull_destroyer: "Destroyers"
 ship_hull_destroyer_desc: "destroyer construction combines high speed, quick-firing guns, torpedoes, and improving seakeeping in a versatile fleet screen able to escort, scout, and attack."
 ship_hull_destroyer_0: "1890 Destroyer Hull"
 ship_hull_destroyer_0_desc: "Late-nineteenth-century destroyer construction combines high speed, quick-firing guns, torpedoes, and improving seakeeping in a versatile fleet screen able to escort, scout, and attack."
 ship_hull_destroyer_1: "1900 Destroyer Hull"
 ship_hull_destroyer_1_desc: "A fast destroyer hull developed to counter torpedo boats, combining quick-firing guns, torpedoes, and the speed needed to screen larger warships."
 ship_hull_destroyer_2: "1910 Destroyer Hull"
 ship_hull_destroyer_2_desc: "A fast destroyer hull developed to counter torpedo boats, combining quick-firing guns, torpedoes, and the speed needed to screen larger warships."
 ship_hull_destroyer_3: "1914 Destroyer Hull"
 ship_hull_destroyer_3_desc: "Improved seakeeping, machinery, and weapon layout make this destroyer more capable of fleet screening, torpedo attacks, and high-speed escort work in rough conditions."
 ship_hull_destroyer_4: "1916 Destroyer Hull"
 ship_hull_destroyer_4_desc: "Improved seakeeping, machinery, and weapon layout make this destroyer more capable of fleet screening, torpedo attacks, and high-speed escort work in rough conditions."
 ship_hull_destroyer_5: "1922 Destroyer Hull"
 ship_hull_destroyer_5_desc: "A mature destroyer hull provides greater range, stronger armament, and better habitability, allowing the class to expand from torpedo-boat defense into escort and fleet reconnaissance."
 ship_engine_destroyer: "Destroyer Ship Engine"
 ship_engine_destroyer_desc: "Destroyer engines prioritize sustained high speed, giving escorts the ability to screen fleets, hunt torpedo craft, and maneuver aggressively around larger capital ships."
 ship_engine_destroyer_0: "3,400 Shp Destroyer Engine"
 ship_engine_destroyer_0_short: "Destroyer Engine I"
 ship_engine_destroyer_0_desc: "An engine rated at 3,400 shaft horsepower, providing the propulsion needed for fast destroyers and escorts, where acceleration and sustained fleet speed are essential. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_destroyer_1: "4,400 Shp Destroyer Engine"
 ship_engine_destroyer_1_short: "Destroyer Engine II"
 ship_engine_destroyer_1_desc: "An engine rated at 4,400 shaft horsepower, providing the propulsion needed for fast destroyers and escorts, where acceleration and sustained fleet speed are essential. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_destroyer_2: "5,200 Shp Destroyer Engine"
 ship_engine_destroyer_2_short: "Destroyer Engine III"
 ship_engine_destroyer_2_desc: "An engine rated at 5,200 shaft horsepower, providing the propulsion needed for fast destroyers and escorts, where acceleration and sustained fleet speed are essential. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_destroyer_3: "6,000 Shp Destroyer Engine"
 ship_engine_destroyer_3_short: "Destroyer Engine IV"
 ship_engine_destroyer_3_desc: "An engine rated at 6,000 shaft horsepower, providing the propulsion needed for fast destroyers and escorts, where acceleration and sustained fleet speed are essential. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_destroyer_4: "6,500 Shp Destroyer Engine"
 ship_engine_destroyer_4_short: "Destroyer Engine V"
 ship_engine_destroyer_4_desc: "An engine rated at 6,500 shaft horsepower, providing the propulsion needed for fast destroyers and escorts, where acceleration and sustained fleet speed are essential. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_hull_frigate: "Frigates"
 ship_hull_frigate_desc: "A large warship, but a dying breed ever since technology is threatening to make it obsolete. Nevertheless, extremely powerful."
 ship_hull_frigate_0: "Early Frigate Hull"
 ship_hull_frigate_0_desc: "frigate construction balances ocean-going range, speed, and a substantial gun battery for independent cruising, commerce protection, and patrol beyond the main battle line."
 ship_hull_frigate_1: "1850 Frigate Hull"
 ship_hull_frigate_1_desc: "Early industrial-era frigate construction balances ocean-going range, speed, and a substantial gun battery for independent cruising, commerce protection, and patrol beyond the main battle line."
 ship_hull_lineship: "Ships of the Line"
 ship_hull_lineship_desc: "ship-of-the-line construction uses a large, strongly framed hull to carry multiple gun decks and endure broadside combat as part of the main battle fleet."
 ship_hull_lineship_0: "Early Lineship Hull"
 ship_hull_lineship_0_desc: "ship-of-the-line construction uses a large, strongly framed hull to carry multiple gun decks and endure broadside combat as part of the main battle fleet."
 ship_hull_lineship_1: "1857 Lineship Hull"
 ship_hull_lineship_1_desc: "Early industrial-era ship-of-the-line construction uses a large, strongly framed hull to carry multiple gun decks and endure broadside combat as part of the main battle fleet."
 ship_armor_capital_hardwood: "Hardwood Ship Armor"
 ship_armor_capital_hardwood_desc: "Thick hardwood timbers absorb splinters and some light shot while remaining cheap and easy to repair, but they offer little protection against heavy explosive shells or modern naval guns."
 ship_armor_capital_hardwood_0: "Hardwood Ship Armor"
 ship_armor_capital_hardwood_0_short: "Hardwood Armor I"
 ship_armor_capital_hardwood_0_desc: "Hardwood Ship Armor uses thick structural timber and reinforcement to absorb splinters and light shot around vital areas. It is inexpensive and repairable, but rapidly becomes inadequate against rifled guns and explosive shells."
 ship_armor_capital_hardwood_1: "Reinforced Hardwood Ship Armor"
 ship_armor_capital_hardwood_1_short: "Hardwood Armor II"
 ship_armor_capital_hardwood_1_desc: "Reinforced Hardwood Ship Armor uses thick structural timber and reinforcement to absorb splinters and light shot around vital areas. It is inexpensive and repairable, but rapidly becomes inadequate against rifled guns and explosive shells."
 ship_hull_ironclad: "Ironclads"
 ship_hull_ironclad_desc: "Heavily Armored Warships with iron or steel hulls. They sometimes even use rams to damage enemy vessels."
 ship_hull_ironclad_0: "Early Ironclad Hull"
 ship_hull_ironclad_0_desc: "ironclad construction combines steam propulsion, heavy guns, and iron armor to survive explosive shellfire that would devastate traditional wooden warships."
 ship_hull_ironclad_1: "Ironclad Hull"
 ship_hull_ironclad_1_desc: "A purpose-built ironclad hull combines steam propulsion with extensive iron armor, allowing a warship to survive gunfire that would devastate traditional wooden vessels."
 ship_hull_ironclad_2: "Late Ironclad Hull"
 ship_hull_ironclad_2_desc: "ironclad construction combines steam propulsion, heavy guns, and iron armor to survive explosive shellfire that would devastate traditional wooden warships."
 ship_engine_ironclad: "Ironclad Ship Engine"
 ship_engine_ironclad_desc: "Ironclad propulsion must move much heavier armored hulls without relying on wind, making increasingly powerful steam machinery essential to practical armored warships."
 ship_engine_ironclad_0: "1,400 Shp Ironclad Engine"
 ship_engine_ironclad_0_short: "Ironclad Engine I"
 ship_engine_ironclad_0_desc: "An engine rated at 1,400 shaft horsepower, providing the propulsion needed for armored ironclads whose heavy plating demands substantially more power than wooden warships. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_ironclad_1: "1,800 Shp Ironclad Engine"
 ship_engine_ironclad_1_short: "Ironclad Engine II"
 ship_engine_ironclad_1_desc: "An engine rated at 1,800 shaft horsepower, providing the propulsion needed for armored ironclads whose heavy plating demands substantially more power than wooden warships. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_ironclad_2: "2,400 Shp Ironclad Engine"
 ship_engine_ironclad_2_short: "Ironclad Engine III"
 ship_engine_ironclad_2_desc: "An engine rated at 2,400 shaft horsepower, providing the propulsion needed for armored ironclads whose heavy plating demands substantially more power than wooden warships. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_module_ram: "Rams"
 ship_module_ram_desc: "A reinforced naval ram extends the bow into a weapon intended to pierce an enemy hull below or near the waterline. It can inflict catastrophic damage at close range, but attempting a ram exposes the attacking ship to severe danger."
 ship_module_ram_0: "Simple Iron Ram"
 ship_module_ram_0_short: "Naval Ram I"
 ship_module_ram_0_desc: "A simple naval ram to be attached to, for example, ironclad ships. They can be used to ram enemy naval vessels, causing massive damage. The cost of the ordeal is that the own ship is put at danger - once by the act of ramming and once again by having to approach and expose itself to enemy fire."
 ship_hull_cruiser_light: "Light Cruisers"
 ship_hull_cruiser_light_desc: "Light cruisers trade heavy armor for speed, range, and rapid-firing guns, making them useful for scouting, commerce protection, and screening larger warships."
 ship_hull_cruiser_light_0: "Early Unprotected Cruiser Hull"
 ship_hull_cruiser_light_0_desc: "light-cruiser construction prioritizes speed, range, and rapid-firing guns over heavy armor, producing an effective fleet scout and screen for larger ships."
 ship_hull_cruiser_light_1: "1880 Unprotected Cruiser Hull"
 ship_hull_cruiser_light_1_desc: "Late-nineteenth-century light-cruiser construction prioritizes speed, range, and rapid-firing guns over heavy armor, producing an effective fleet scout and screen for larger ships."
 ship_hull_cruiser_light_2: "1888 Unprotected Cruiser Hull"
 ship_hull_cruiser_light_2_desc: "Late-nineteenth-century light-cruiser construction prioritizes speed, range, and rapid-firing guns over heavy armor, producing an effective fleet scout and screen for larger ships."
 ship_engine_cruiser_light: "Light Cruiser Ship Engine"
 ship_engine_cruiser_light_desc: "Light-cruiser engines balance speed, range, and weight so that scouting and screening vessels can operate independently without sacrificing too much space to machinery."
 ship_engine_cruiser_light_0: "2,000 Shp Light Cruiser Engine"
 ship_engine_cruiser_light_0_short: "Light Cruiser Engine I"
 ship_engine_cruiser_light_0_desc: "Rated at roughly 2,000 shaft horsepower, this machinery balances speed, weight, and endurance for a scouting cruiser expected to patrol widely, screen fleets, and engage smaller vessels without sacrificing too much hull volume to machinery."
 ship_engine_cruiser_light_1: "2,500 Shp Light Cruiser Engine"
 ship_engine_cruiser_light_1_short: "Light Cruiser Engine II"
 ship_engine_cruiser_light_1_desc: "Rated at roughly 2,500 shaft horsepower, this machinery balances speed, weight, and endurance for a scouting cruiser expected to patrol widely, screen fleets, and engage smaller vessels without sacrificing too much hull volume to machinery."
 ship_hull_cruiser_heavy: "Heavy Cruisers"
 ship_hull_cruiser_heavy_desc: "protected and heavy-cruiser construction adds armor and larger guns while preserving enough speed and range for independent operations and long-range fleet work."
 ship_hull_cruiser_heavy_0: "Early Protected Cruiser Hull"
 ship_hull_cruiser_heavy_0_desc: "protected and heavy-cruiser construction adds armor and larger guns while preserving enough speed and range for independent operations and long-range fleet work."
 ship_hull_cruiser_heavy_1: "1880 Protected Cruiser Hull"
 ship_hull_cruiser_heavy_1_desc: "Late-nineteenth-century protected and heavy-cruiser construction adds armor and larger guns while preserving enough speed and range for independent operations and long-range fleet work."
 ship_engine_cruiser_heavy: "Heavy Cruiser Ship Engine"
 ship_engine_cruiser_heavy_desc: "Heavy-cruiser engines provide the power needed to move larger, better-armed cruisers at fleet speeds while preserving the endurance required for long-range operations."
 ship_engine_cruiser_heavy_0: "2,800 Shp Heavy Cruiser Engine"
 ship_engine_cruiser_heavy_0_short: "Heavy Cruiser Engine I"
 ship_engine_cruiser_heavy_0_desc: "Rated at roughly 2,800 shaft horsepower, this machinery delivers the additional power required by a larger armored cruiser while preserving the endurance needed for independent operations and long-distance fleet service."
 ship_engine_cruiser_heavy_1: "3,500 Shp Heavy Cruiser Engine"
 ship_engine_cruiser_heavy_1_short: "Heavy Cruiser Engine II"
 ship_engine_cruiser_heavy_1_desc: "Rated at roughly 3,500 shaft horsepower, this machinery delivers the additional power required by a larger armored cruiser while preserving the endurance needed for independent operations and long-distance fleet service."
 ship_hull_cruiser: "Cruisers"
 ship_hull_cruiser_desc: "cruiser construction balances speed, endurance, armament, and moderate protection in a flexible surface combatant used for scouting, commerce protection, raiding, and escort."
 ship_hull_cruiser_0: "Prototype Cruiser Hull"
 ship_hull_cruiser_0_desc: "cruiser construction balances speed, endurance, armament, and moderate protection in a flexible surface combatant used for scouting, commerce protection, raiding, and escort."
 ship_hull_cruiser_1: "1905 Cruiser Hull"
 ship_hull_cruiser_1_desc: "A steel cruiser hull balances speed, range, armament, and moderate protection for scouting, commerce protection, and independent operations across long distances."
 ship_hull_cruiser_2: "1910 Cruiser Hull"
 ship_hull_cruiser_2_desc: "A steel cruiser hull balances speed, range, armament, and moderate protection for scouting, commerce protection, and independent operations across long distances."
 ship_hull_cruiser_3: "1915 Cruiser Hull"
 ship_hull_cruiser_3_desc: "Improved hull strength, fire control, and machinery let this cruiser carry heavier weapons and more fuel while maintaining the speed needed for fleet scouting and trade protection."
 ship_hull_cruiser_4: "1918 Cruiser Hull"
 ship_hull_cruiser_4_desc: "Improved hull strength, fire control, and machinery let this cruiser carry heavier weapons and more fuel while maintaining the speed needed for fleet scouting and trade protection."
 ship_hull_cruiser_5: "1920 Cruiser Hull"
 ship_hull_cruiser_5_desc: "Improved hull strength, fire control, and machinery let this cruiser carry heavier weapons and more fuel while maintaining the speed needed for fleet scouting and trade protection."
 ship_hull_cruiser_6: "1935 Cruiser Hull"
 ship_hull_cruiser_6_desc: "A modern cruiser hull incorporates better compartmentalization, anti-aircraft defenses, and high-speed machinery, making it a versatile escort, scout, and surface-combat platform."
 ship_hull_cruiser_7: "1940 Cruiser Hull"
 ship_hull_cruiser_7_desc: "A modern cruiser hull incorporates better compartmentalization, anti-aircraft defenses, and high-speed machinery, making it a versatile escort, scout, and surface-combat platform."
 ship_hull_cruiser_8: "1944 Cruiser Hull"
 ship_hull_cruiser_8_desc: "A modern cruiser hull incorporates better compartmentalization, anti-aircraft defenses, and high-speed machinery, making it a versatile escort, scout, and surface-combat platform."
 ship_hull_cruiser_9: "1950 Cruiser Hull"
 ship_hull_cruiser_9_desc: "Postwar cruiser design increasingly emphasizes sensors, command facilities, guided weapons, and endurance, creating a large surface combatant able to coordinate and defend a fleet formation."
 ship_hull_cruiser_10: "1955 Cruiser Hull"
 ship_hull_cruiser_10_desc: "Postwar cruiser design increasingly emphasizes sensors, command facilities, guided weapons, and endurance, creating a large surface combatant able to coordinate and defend a fleet formation."
 ship_hull_cruiser_11: "1960 Cruiser Hull"
 ship_hull_cruiser_11_desc: "Postwar cruiser design increasingly emphasizes sensors, command facilities, guided weapons, and endurance, creating a large surface combatant able to coordinate and defend a fleet formation."
 ship_engine_cruiser: "Cruiser Ship Engine"
 ship_engine_cruiser_desc: "Cruiser propulsion is designed for both sustained cruising range and high combat speed, supporting ships expected to scout, raid commerce, and operate far from friendly bases."
 ship_engine_cruiser_0: "5,000 Shp Cruiser Engine"
 ship_engine_cruiser_0_short: "Cruiser Engine I"
 ship_engine_cruiser_0_desc: "An engine rated at 5,000 shaft horsepower, providing the propulsion needed for long-range cruisers that must combine endurance with enough speed to scout, raid, and screen. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_cruiser_1: "6,500 Shp Cruiser Engine"
 ship_engine_cruiser_1_short: "Cruiser Engine II"
 ship_engine_cruiser_1_desc: "An engine rated at 6,500 shaft horsepower, providing the propulsion needed for long-range cruisers that must combine endurance with enough speed to scout, raid, and screen. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_cruiser_2: "7,500 Shp Cruiser Engine"
 ship_engine_cruiser_2_short: "Cruiser Engine III"
 ship_engine_cruiser_2_desc: "An engine rated at 7,500 shaft horsepower, providing the propulsion needed for long-range cruisers that must combine endurance with enough speed to scout, raid, and screen. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_cruiser_3: "9,500 Shp Cruiser Engine"
 ship_engine_cruiser_3_short: "Cruiser Engine IV"
 ship_engine_cruiser_3_desc: "An engine rated at 9,500 shaft horsepower, providing the propulsion needed for long-range cruisers that must combine endurance with enough speed to scout, raid, and screen. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_cruiser_4: "12,000 Shp Cruiser Engine"
 ship_engine_cruiser_4_short: "Cruiser Engine V"
 ship_engine_cruiser_4_desc: "An engine rated at 12,000 shaft horsepower, providing the propulsion needed for long-range cruisers that must combine endurance with enough speed to scout, raid, and screen. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_hull_cruiser_battle: "Battlecruisers"
 ship_hull_cruiser_battle_desc: "armored-cruiser and battlecruiser construction combines capital-ship guns with high speed, using mobility as part of its protection against stronger but slower opponents."
 ship_hull_cruiser_battle_0: "Early Armored Cruiser Hull"
 ship_hull_cruiser_battle_0_desc: "An early armored-cruiser hull combines long-range cruising ability with belt armor and heavy guns, creating a warship intended to defeat lighter cruisers while avoiding battleships."
 ship_hull_cruiser_battle_1: "1888 Armored Cruiser Hull"
 ship_hull_cruiser_battle_1_desc: "Improved armored-cruiser construction adds stronger armor, heavier guns, and more powerful machinery, foreshadowing the battlecruiser concept of speed-backed capital-ship firepower."
 ship_engine_cruiser_battle: "Battlecruiser Ship Engine"
 ship_engine_cruiser_battle_desc: "Armored-cruiser and battlecruiser engines trade machinery weight and fuel consumption for very high speed, allowing heavily armed ships to outrun stronger opponents and overpower weaker ones."
 ship_engine_cruiser_battle_0: "4,000 Shp Battlecruiser Engine"
 ship_engine_cruiser_battle_0_short: "Battlecruiser Engine I"
 ship_engine_cruiser_battle_0_desc: "An engine rated at 4,000 shaft horsepower, providing the propulsion needed for large armored cruisers and battlecruisers that rely on speed as an important part of their protection. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_cruiser_battle_1: "5,500 Shp Battlecruiser Engine"
 ship_engine_cruiser_battle_1_short: "Battlecruiser Engine II"
 ship_engine_cruiser_battle_1_desc: "An engine rated at 5,500 shaft horsepower, providing the propulsion needed for large armored cruisers and battlecruisers that rely on speed as an important part of their protection. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_hull_battleship: "Battleships"
 ship_hull_battleship_desc: "A large class of warship, heavily armed and armoured. Bested in single combat only by the finest battlecruisers, other battleships or the gargantuan dreadnought."
 ship_hull_battleship_0: "Protoytpe Battleship Hull"
 ship_hull_battleship_0_desc: "A prototype battleship hull brings heavy armor, large guns, and steam propulsion together in a purpose-built capital ship designed to dominate the battle line."
 ship_hull_battleship_1: "1922 Battleship Hull"
 ship_hull_battleship_1_desc: "A mature early battleship hull combines stronger armor, improved fire control, and more efficient machinery to support heavy guns in sustained fleet combat."
 ship_hull_battleship_2: "1936 Battleship Hull"
 ship_hull_battleship_2_desc: "A treaty-era battleship hull balances heavy armor, large-caliber guns, improved fire control, and efficient machinery within the displacement limits of modern capital-ship design."
 ship_hull_battleship_3: "1940 Battleship Hull"
 ship_hull_battleship_3_desc: "Wartime battleship design strengthens anti-aircraft defenses, radar integration, compartmentalization, and machinery while retaining the armor and guns needed for surface action."
 ship_hull_battleship_4: "1944 Battleship Hull"
 ship_hull_battleship_4_desc: "Wartime battleship design strengthens anti-aircraft defenses, radar integration, compartmentalization, and machinery while retaining the armor and guns needed for surface action."
 ship_hull_battleship_5: "1950 Battleship Hull"
 ship_hull_battleship_5_desc: "A late battleship hull incorporates improved radar, damage control, and anti-aircraft protection, adapting the heavily armored gun platform to an era increasingly dominated by aircraft and missiles."
 ship_hull_battleship_6: "1970 Battleship Hull"
 ship_hull_battleship_6_desc: "A modernized battleship concept combines a heavily protected gun platform with contemporary sensors, electronics, and missile systems to extend the usefulness of large surface combatants."
 ship_hull_battleship_7: "1985 Battleship Hull"
 ship_hull_battleship_7_desc: "A modernized battleship concept combines a heavily protected gun platform with contemporary sensors, electronics, and missile systems to extend the usefulness of large surface combatants."
 ship_hull_battleship_8: "2000 Battleship Hull"
 ship_hull_battleship_8_desc: "An advanced battleship concept integrates long-range precision weapons, modern sensors, electronic warfare, and improved survivability into a very large surface-combat hull."
 ship_hull_battleship_9: "2020 Battleship Hull"
 ship_hull_battleship_9_desc: "An advanced battleship concept integrates long-range precision weapons, modern sensors, electronic warfare, and improved survivability into a very large surface-combat hull."
 ship_hull_battleship_10: "2030 Battleship Hull"
 ship_hull_battleship_10_desc: "A future battleship hull emphasizes networked sensors, long-range precision firepower, automation, and layered defenses, seeking to make a large surface combatant survivable in high-intensity missile warfare."
 ship_hull_battleship_11: "2045 Battleship Hull"
 ship_hull_battleship_11_desc: "A future battleship hull emphasizes networked sensors, long-range precision firepower, automation, and layered defenses, seeking to make a large surface combatant survivable in high-intensity missile warfare."
 ship_engine_battleship: "Battleship Engine"
 ship_engine_battleship_desc: "Battleship engines must propel immense armored hulls while providing enough endurance for fleet operations, demanding powerful and increasingly efficient machinery."
 ship_engine_battleship_0: "8,000 Shp Battleship Engine"
 ship_engine_battleship_0_short: "Early Battleship Engine"
 ship_engine_battleship_0_desc: "An engine rated at 8,000 shaft horsepower, providing the propulsion needed for heavily armored battleships whose size and weight demand powerful machinery. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_module_seaplane_launcher: "Seaplane Launcher"
 ship_module_seaplane_launcher_desc: "Special launching devices installed on ships to launch seaplanes. These planes can be used for reconnaissance tasks."
 ship_module_seaplane_launcher_0: "Light Seaplane Launcher"
 ship_module_seaplane_launcher_0_short: "Seaplane Launcher I"
 ship_module_seaplane_launcher_0_desc: "An early shipboard launching arrangement allows a reconnaissance seaplane to be deployed without requiring a harbor. The aircraft extends the ship's visual horizon for scouting, gunnery spotting, and search missions."
 ship_armor_capital_50_mm: "50mm Capital Ship Armor"
 ship_armor_capital_50_mm_desc: "Fifty millimeters of iron or steel armor gives early capital ships meaningful resistance to light and medium gunfire without imposing the extreme weight of later armored belts. It is a first step toward systematic protected warship design."
 ship_armor_capital_50_mm_0: "50mm Capital Ship Armor"
 ship_armor_capital_50_mm_0_short: "50mm Armor I"
 ship_armor_capital_50_mm_0_desc: "A 50 mm belt of iron or steel plating gives capital ships meaningful protection against light naval gunfire and splinters without imposing the weight of heavier armor schemes."
 ship_armor_capital_70_mm: "70mm Capital Ship Armor"
 ship_armor_capital_70_mm_desc: "Seventy millimeters of capital-ship armor provides stronger protection over machinery, magazines, and the waterline. The additional weight demands better hull structure and propulsion but substantially improves survival under gunfire."
 ship_armor_capital_70_mm_0: "70mm Capital Ship Armor"
 ship_armor_capital_70_mm_0_short: "70mm Armor I"
 ship_armor_capital_70_mm_0_desc: "Seventy millimeters of capital-ship armor provides stronger resistance to medium-caliber fire, though the added weight demands a more powerful hull and propulsion system."
 ship_armor_capital_harvey: "Harvey Model Capital Ship Armor"
 ship_armor_capital_harvey_desc: "Capital ship armor made after the harvey model has reinforced front plates and is therefore more resilient."
 ship_armor_capital_harvey_0: "Harvey Armor Plating"
 ship_armor_capital_harvey_0_short: "Harvey Armor I"
 ship_armor_capital_harvey_0_desc: "Harvey armor hardens the face of nickel-steel plate so that shells are more likely to shatter or deform on impact, improving protection without an equal increase in weight."
 ship_armor_capital_harvey_1: "Heavy Harvey Armor Plating"
 ship_armor_capital_harvey_1_short: "Harvey Armor II"
 ship_armor_capital_harvey_1_desc: "Thicker and better-manufactured Harvey armor extends face-hardening to heavier plates, improving capital-ship resistance against increasingly powerful naval artillery."
 ship_armor_capital_krupp: "Krupp Model Capital Ship Armor"
 ship_armor_capital_krupp_desc: "The Krupp Model dictates that about 1% of chromium must be mixed into the armor alloy to make the armor more sturdy. This armor was constructed using this method."
 ship_armor_capital_krupp_0: "Krupp Armor Plating"
 ship_armor_capital_krupp_0_short: "Krupp Armor I"
 ship_armor_capital_krupp_0_desc: "Krupp cemented armor improves on earlier face-hardened plate with better alloying and heat treatment, offering superior protection for a given weight."
 ship_armor_capital_krupp_1: "Heavy Krupp Armor Plating"
 ship_armor_capital_krupp_1_short: "Krupp Armor II"
 ship_armor_capital_krupp_1_desc: "Heavier Krupp armor uses improved metallurgy and carefully controlled hardening to resist large-caliber armor-piercing shells on the most exposed parts of a capital ship."
 EQ_MOD_CAT_ship_module_seaplane_launcher_TITLE: "Seaplane Launchers"
 ship_hull_dreadnought: "Dreadnoughts"
 ship_hull_dreadnought_desc: "The titans of sea warfare. These gargantuan ships bring such a mass of armor and weaponry to the fight that they almost seem like legendary creatures to be slain in an epic tale, and should two of those ever come to clash, it would be devastation of the highest order."
 ship_hull_dreadnought_0: "Pre-Dreadnought Hull"
 ship_hull_dreadnought_0_desc: "The pre-dreadnought hull carries a mixed battery of heavy and medium guns behind substantial armor, representing the final stage of capital-ship design before the all-big-gun revolution."
 ship_hull_dreadnought_1: "Early Dreadnought Hull"
 ship_hull_dreadnought_1_desc: "An early dreadnought hull adopts a uniform heavy main battery and powerful turbine propulsion, allowing accurate long-range fire and higher fleet speed."
 ship_hull_dreadnought_2: "1910 Dreadnought Hull"
 ship_hull_dreadnought_2_desc: "An improved all-big-gun dreadnought hull combines heavier armor, better subdivision, and more powerful machinery while retaining a uniform main battery for long-range battle."
 ship_hull_dreadnought_3: "1914 Dreadnought Hull"
 ship_hull_dreadnought_3_desc: "Wartime dreadnought design strengthens armor protection, fire-control positions, and internal subdivision to survive longer in line-of-battle engagements."
 ship_hull_dreadnought_4: "1916 Dreadnought Hull"
 ship_hull_dreadnought_4_desc: "Wartime dreadnought design strengthens armor protection, fire-control positions, and internal subdivision to survive longer in line-of-battle engagements."
 ship_hull_dreadnought_5: "1918 Dreadnought Hull"
 ship_hull_dreadnought_5_desc: "A late dreadnought hull applies wartime lessons in armor distribution, damage control, rangefinding, and machinery to produce a more balanced capital ship."
 ship_engine_dreadnought: "Dreadnought Ship Engine"
 ship_engine_dreadnought_desc: "Dreadnought propulsion combines very high power with the endurance needed for battle-fleet operations, driving large all-big-gun warships at tactically useful speeds."
 ship_engine_dreadnought_0: "11,000 Shp Dreadnought Engine"
 ship_engine_dreadnought_0_short: "Early Dreadnought Engine"
 ship_engine_dreadnought_0_desc: "An engine rated at 11,000 shaft horsepower, providing the propulsion needed for all-big-gun dreadnoughts that require high output to maneuver with the battle fleet. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_dreadnought_1: "14,000 Shp Dreadnought Engine"
 ship_engine_dreadnought_1_short: "Dreadnought Engine I"
 ship_engine_dreadnought_1_desc: "An engine rated at 14,000 shaft horsepower, providing the propulsion needed for all-big-gun dreadnoughts that require high output to maneuver with the battle fleet. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_dreadnought_2: "18,000 Shp Dreadnought Engine"
 ship_engine_dreadnought_2_short: "Dreadnought Engine II"
 ship_engine_dreadnought_2_desc: "An engine rated at 18,000 shaft horsepower, providing the propulsion needed for all-big-gun dreadnoughts that require high output to maneuver with the battle fleet. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_dreadnought_3: "22,000 Shp Dreadnought Engine"
 ship_engine_dreadnought_3_short: "Dreadnought Engine III"
 ship_engine_dreadnought_3_desc: "An engine rated at 22,000 shaft horsepower, providing the propulsion needed for all-big-gun dreadnoughts that require high output to maneuver with the battle fleet. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_dreadnought_4: "25,000 Shp Dreadnought Engine"
 ship_engine_dreadnought_4_short: "Dreadnought Engine IV"
 ship_engine_dreadnought_4_desc: "An engine rated at 25,000 shaft horsepower, providing the propulsion needed for all-big-gun dreadnoughts that require high output to maneuver with the battle fleet. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
