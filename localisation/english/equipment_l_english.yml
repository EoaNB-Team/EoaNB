 #SPR
 SPR_infantry_equipment_rifle_3: "Spanish 1859/67 Berdan Infantry Rifle"
 SPR_infantry_equipment_rifle_3_desc: "The Spanish 1859/67 Berdan Infantry Rifle is a metallic-cartridge breechloading rifle of the Berdan family, giving infantry greater reliability, faster loading, and better long-range performance than percussion muzzle-loaders."
 SPR_infantry_equipment_rifle_3_short: "1859/67 Berdan Infantry Rifle"
 SPR_infantry_equipment_rifle_4: "Spanish M1871/89 Remington rifle"
 SPR_infantry_equipment_rifle_4_desc: "The Spanish M1871/89 Remington rifle develops the proven rolling-block system into a more modern service arm. A strong metallic-cartridge breech and later ammunition improvements provide dependable, accurate fire with simple maintenance."
 SPR_infantry_equipment_rifle_4_short: "M1871/89 Remington rifle"
