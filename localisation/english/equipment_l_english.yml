 ship_hull_submarine_18: "2045 Submarine Hull"
 ship_hull_submarine_18_desc: "A contemporary submarine hull integrates advanced acoustic reduction, automated combat systems, modern sensors, and improved underwater endurance for sustained stealth operations."
 ship_engine_submarine: "Submarine Ship Engine"
 ship_engine_submarine_desc: "Submarine propulsion must work efficiently both on the surface and underwater, balancing compact machinery, battery capacity, range, and acoustic discretion within a pressure hull."
 ship_engine_submarine_0: "100 Shp Submarine Engine"
 ship_engine_submarine_0_short: "Submarine Engine I"
 ship_engine_submarine_0_desc: "An engine rated at 100 shaft horsepower, providing the propulsion needed for submarines, where compact machinery must balance range, underwater endurance, and limited internal volume. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_engine_submarine_1: "350 Shp Submarine Engine"
 ship_engine_submarine_1_short: "Submarine Engine II"
 ship_engine_submarine_1_desc: "An engine rated at 350 shaft horsepower, providing the propulsion needed for submarines, where compact machinery must balance range, underwater endurance, and limited internal volume. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
