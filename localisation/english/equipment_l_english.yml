 plane_naval_upgrade: "Attack"
 plane_naval_upgrade_desc: "Stronger hardpoints and improved stores handling allow aircraft to carry a heavier and more effective load of torpedoes, bombs, and other anti-ship weapons."
 cv_plane_naval_upgrade: "Attack"
 cv_plane_naval_upgrade_desc: "Carrier aircraft fitted with stronger hardpoints and improved stores handling can deliver heavier anti-ship ordnance without sacrificing safe deck operations."
 plane_bomb_upgrade: "Bombing"
 plane_bomb_upgrade_desc: "Bigger bomb bay to deliver more payload."
 plane_tac_bomb_upgrade: "Bombing"
