 #CSA
 CSA_infantry_equipment_rifle_0: "Model 1842 Percussion Musket"
 CSA_infantry_equipment_rifle_0_desc: "The Model 1842 percussion musket is a robust muzzle-loading infantry arm, replacing older flintlock ignition with the more dependable percussion-cap system."
 CSA_infantry_equipment_rifle_2: "Model 1861 Percussion Rifle-Musket"
 CSA_infantry_equipment_rifle_2_desc: "The Model 1861 percussion rifle-musket combines reliable cap ignition with a rifled barrel and Minié ammunition. It provides accurate infantry fire at ranges far beyond the smoothbore muskets it replaces."
 CSA_infantry_equipment_rifle_2_short: "Richmond Musket"
 CSA_infantry_equipment_rifle_3: "Springfield Model 1866"
 CSA_infantry_equipment_rifle_3_desc: "The Springfield Model 1866 uses the Allin trapdoor conversion to turn a rifled muzzle-loader into a metallic-cartridge breechloader. It dramatically improves loading speed while allowing existing arms and production capacity to remain useful."
 CSA_infantry_equipment_rifle_3_short: "Springfield Rifle"
 CSA_machine_gun_equipment_0: "Gorgas Gun"
 CSA_machine_gun_equipment_0_desc: "The Gorgas Gun is an early rapid-fire weapon intended to increase the volume of fire available to a small crew. Though mechanically cumbersome by later standards, it points toward the battlefield role eventually filled by true machine guns."
 CSA_cannon_equipment_0: "Model 1841 6-pounder Gun"
 CSA_cannon_equipment_0_desc: "The Model 1841 6-pounder Gun is a muzzle-loading smoothbore field gun valued for reliability and flexibility. It can fire solid shot, explosive shell, or canister, giving artillery useful effects against infantry and field positions at typical battle ranges."
 CSA_cannon_equipment_0_short: "6pdr Gun"
 CSA_cannon_equipment_1: "Model 1857 12-pounder Napoleon"
 CSA_cannon_equipment_1_desc: "The Model 1857 12-pounder Napoleon is a muzzle-loading smoothbore field gun valued for reliability and flexibility. It can fire solid shot, explosive shell, or canister, giving artillery useful effects against infantry and field positions at typical battle ranges."
 CSA_cannon_equipment_1_short: "12pdr Napoleon"
 CSA_rifled_cannon_equipment_0: "10-pounder Parrot Rifled Muzzle-Loader"
 CSA_rifled_cannon_equipment_0_desc: "The 10-pounder Parrot Rifled Muzzle-Loader uses rifling and a reinforced breech to fire elongated projectiles with greater range and accuracy than smoothbore artillery. Heavy versions can batter fortifications from distances previously difficult for field guns."
 CSA_rifled_cannon_equipment_0_short: "10pdr Parrot Rifle"
 CSA_rifled_cannon_equipment_1: "12-pounder Whitworth Breech-Loading Gun"
 CSA_rifled_cannon_equipment_1_desc: "The 12-pounder Whitworth Breech-Loading Gun uses precision rifling and an elongated projectile to achieve exceptional accuracy at long range. Its advanced manufacture and ammunition are expensive, but the gun can engage targets beyond the reach of ordinary field pieces."
 CSA_rifled_cannon_equipment_1_short: "12pdr Whitworth"
 CSA_siege_gun_0: "200-pounder Parrot Rifled Muzzle-Loader"
 CSA_siege_gun_0_desc: "The 200-pounder Parrot Rifled Muzzle-Loader uses rifling and a reinforced breech to fire elongated projectiles with greater range and accuracy than smoothbore artillery. Heavy versions can batter fortifications from distances previously difficult for field guns."
 CSA_siege_gun_0_short: "200pdr Parrot Rifle"
 CSA_howitzer_equipment_0: "Model 1841 12-pounder Howitzer"
 CSA_howitzer_equipment_0_desc: "The Model 1841 12-pounder Howitzer is a heavy howitzer intended to throw large explosive shells on a high trajectory against fortifications, trenches, and other protected targets that direct-fire guns cannot easily reach."
 CSA_howitzer_equipment_0_short: "12pdr Howitzer"
 CSA_howitzer_equipment_1: "12-pounder Dahlgren Boat Howitzer"
 CSA_howitzer_equipment_1_desc: "The 12-pounder Dahlgren Boat Howitzer combines a compact naval-style howitzer with a carriage suitable for boats and landing parties. It can deliver shell or canister in support of troops operating near rivers and coastlines."
 CSA_howitzer_equipment_1_short: "12pdr Dahlgren"
 #DEN

 DEN_infantry_equipment_rifle_0: "Danish Model 1848 Tapriffel"
 DEN_infantry_equipment_rifle_0_desc: "The Danish Model 1848 Tapriffel is a rifled percussion muzzle-loader using the Thouvenin pillar system to expand its bullet into the rifling. It offers excellent accuracy for its day, though the Minié system soon makes the loading method obsolete."
 DEN_infantry_equipment_rifle_0_short: "M/1848 Tapriffel"
 DEN_infantry_equipment_rifle_1: "Danish 1853/66 Snider Rifle"
 DEN_infantry_equipment_rifle_1_desc: "The Danish 1853/66 Snider Rifle converts an existing percussion rifle-musket into a metallic-cartridge breechloader using the Snider action. The conversion greatly increases rate of fire while making economical use of weapons already in service."
 DEN_infantry_equipment_rifle_1_short: "1853/66 Snider Rifle"
 DEN_infantry_equipment_rifle_6: "Krag-Jørgensen M1889"
 DEN_infantry_equipment_rifle_6_desc: "The Krag-Jørgensen M1889 is a smooth-operating magazine-fed bolt-action rifle designed for modern small-caliber ammunition. Its side-loading magazine and refined action provide reliable repeating fire for late nineteenth-century infantry."
 DEN_infantry_equipment_rifle_6_short: "Krag-Jørgensen M1889"
 #ENG
 ENG_cv_jet_fighter_equipment_1: "Hawker Sea-Fury"
 ENG_cv_jet_fighter_equipment_1_short: "Sea Fury"
 ENG_cv_jet_fighter_equipment_1_desc: "The Hawker Sea Fury is a powerful carrier-borne piston fighter combining high speed, heavy armament, and rugged handling for operations from naval flight decks."
 ENG_cv_jet_fighter_equipment_2: "de Havilland Sea-Vampire"
 ENG_cv_jet_fighter_equipment_2_short: "Sea Vampire"
 ENG_cv_jet_fighter_equipment_2_desc: "The de Havilland Sea Vampire adapts early jet-fighter technology to carrier operations, bringing much higher speed to naval aviation at the cost of short range and demanding deck handling."
 ENG_cv_jet_fighter_equipment_3: "de Havilland Sea-Vixen"
 ENG_cv_jet_fighter_equipment_3_short: "Sea Vixen"
 ENG_cv_jet_fighter_equipment_3_desc: "A radar-equipped, twin-engine naval fighter designed for all-weather interception, combining high speed with the sensors and endurance needed to defend a carrier group."
 ENG_cv_jet_fighter_equipment_4: "Hawker Siddeley Harrier"
 ENG_cv_jet_fighter_equipment_4_short: "Harrier"
 ENG_cv_jet_fighter_equipment_4_desc: "The Hawker Siddeley Harrier uses vectored thrust for vertical or short takeoff and landing, allowing fixed-wing air power to operate from small carriers and improvised forward sites."
 ENG_cv_jet_fighter_equipment_5: "de Havilland Javelin"
 ENG_cv_jet_fighter_equipment_5_short: "Javelin"
 ENG_cv_jet_fighter_equipment_5_desc: "A later-generation carrier fighter built around improved radar, guided weapons, and high-speed interception, extending fleet air defense far beyond visual range."
 ENG_jet_fighter_equipment_3: "Gloster Javelin"
 ENG_jet_fighter_equipment_3_short: "Javelin"
 ENG_jet_fighter_equipment_3_desc: "The Gloster Javelin is a twin-engine, delta-wing all-weather interceptor built around radar guidance and a heavy missile armament for defending British airspace."
 ENG_jet_fighter_equipment_4: "Hawker Hunter"
 ENG_jet_fighter_equipment_4_short: "Hunter"
 ENG_jet_fighter_equipment_4_desc: "The Hawker Hunter is a swept-wing transonic fighter combining strong performance, excellent handling, and a heavy cannon armament in a versatile postwar design."
 ENG_jet_fighter_equipment_5: "English Electric Lightning"
 ENG_jet_fighter_equipment_5_short: "Lightning"
 ENG_jet_fighter_equipment_5_desc: "The English Electric Lightning is a high-performance supersonic interceptor designed for rapid climb and fast attacks against hostile bombers and reconnaissance aircraft."
 ENG_jet_fighter_equipment_6: "Panavia Tornado ECR"
 ENG_jet_fighter_equipment_6_short: "Tornado ECR"
 ENG_jet_fighter_equipment_6_desc: "The Tornado ECR is a specialized electronic-combat aircraft equipped to locate, suppress, and attack enemy air-defense radars while supporting strike packages at low level."
 ENG_jet_fighter_equipment_9: "Eurofighter Typhoon"
 ENG_jet_fighter_equipment_9_short: "Typhoon"
 ENG_jet_fighter_equipment_9_desc: "The Eurofighter Typhoon is a highly agile multirole combat aircraft optimized for air superiority while retaining advanced sensors and precision-strike capability."
 ENG_modern_tank_equipment_2: "Centurion Mk3"
 ENG_modern_tank_equipment_2_desc: "The Centurion Mk 3 combines a powerful 20-pounder gun, good armor, and excellent cross-country mobility in a balanced postwar tank. Its design becomes a benchmark for the emerging main battle tank concept."
 ENG_modern_tank_equipment_2_short: "Centurion Mk3"
 ENG_mtb_1: "FV4201 Chieftain"
 ENG_mtb_1_short: "Chieftain"
 ENG_mtb_1_desc: "The FV4201 Chieftain emphasizes a powerful main gun and heavy frontal protection, establishing a British main battle tank designed to fight effectively from prepared positions."
 ENG_mtb_2: "FV4201 Chieftain Mk.5"
 ENG_mtb_2_short: "Chieftain Mk.5"
 ENG_mtb_2_desc: "The Chieftain Mk.5 improves the original design with greater engine reliability and refinements to fire control, while retaining its heavy armor and powerful 120 mm gun."
 ENG_mtb_3: "FV4030/4 Challenger 1"
 ENG_mtb_3_short: "Challenger 1"
 ENG_mtb_3_desc: "The Challenger 1 combines composite armor, a 120 mm rifled gun, and improved fire-control systems to provide a more survivable and accurate British main battle tank."
 ENG_mtb_4: "FV4034 Challenger 2"
 ENG_mtb_4_short: "Challenger 2"
 ENG_mtb_4_desc: "The Challenger 2 pairs advanced composite protection with a highly accurate 120 mm rifled gun and modern digital fire control for sustained frontline operations."
 ENG_mtb_5: "FV4034 Challenger 2E"
 ENG_mtb_5_short: "Challenger 2E"
 ENG_mtb_5_desc: "The Challenger 2E represents an export-oriented modernization with improved automotive performance, digital systems, and battlefield awareness while retaining the Challenger's protection and firepower."
 ENG_mtb_6: "FV4034 Challenger 2 StreetFighter"
 ENG_mtb_6_short: "Challenger 2S"
 ENG_mtb_6_desc: "The Challenger 2 Streetfighter concept adds improved sensors, remote weapon systems, and urban-survivability features intended to make the tank more effective in dense and irregular combat environments."
 ENG_future_tank_1: "FV4034 Challenger 2 Black Night"
 ENG_future_tank_1_short: "C2 Black Night"
 ENG_future_tank_1_desc: "The Challenger 2 Black Night modernization concept integrates active protection, improved night-fighting sensors, and upgraded electronics to extend the platform's effectiveness against modern threats."
 ENG_infantry_equipment_smg_3: "Lanchester"
 ENG_infantry_equipment_smg_3_desc: "The Lanchester is a sturdy blowback-operated submachine gun chambered for pistol ammunition, providing naval and security troops with a reliable close-range automatic weapon."
 #FRA
 FRA_infantry_equipment_rifle_0: "Delvigne Rifle"
 FRA_infantry_equipment_rifle_0_short: "Delvigne Rifle"
 FRA_infantry_equipment_rifle_0_desc: "In 1826, the Lieutenant Henri-Gustave Delvigne invented a new method for rifled guns. The chamber of the rifle was smaller than the bore, with which it was connected by a spherical surface equal in radius to the ball used. The powder was poured from the muzzle into the chamber, upon which the ball rested when dropped into the bore. When forced against the chamber rim by ramming (with three strokes of a heavy ram), the bullet would become deformed and flatten, so as to expand in diameter against the inside of the bore, allowing the bullet to press against the rifling grooves. When fired, the bullet would accompany the rifling and spin."
 FRA_infantry_equipment_rifle_1: "P1851 Minié"
 FRA_infantry_equipment_rifle_1_short: "P1851 Minié"
 FRA_infantry_equipment_rifle_1_desc: "The captain Claude-Étienne Minié and Henri-Gustave Delvigne have invented the Minié ball in 1847. The Pattern 1851 Minié use this muzzle-loading spin-stabilized bullet."
 FRA_infantry_equipment_rifle_2: "17.8mm Model 1857 Infantry Rifle"
 FRA_infantry_equipment_rifle_2_short: "Model 1857"
 FRA_infantry_equipment_rifle_2_desc: "The Model 1857 is an improvement of the Model 1853 with a rifled barrel."
 FRA_infantry_equipment_rifle_3: "Chassespot"
 FRA_infantry_equipment_rifle_3_short: "Chassespot"
 FRA_infantry_equipment_rifle_3_desc: "The Chassespot has been designed by Antoine Alphonse Chassepot who experimented some forms of breech-loaders. The success of the Prussian rifles, Dreyse, in the Sadowa battle have encouraged the French army to choose the Chassepot as the Model 1866."
 FRA_infantry_equipment_rifle_4: "Gras"
 FRA_infantry_equipment_rifle_4_short: "Gras"
 FRA_infantry_equipment_rifle_4_desc: "The defeat in the Franco-Prussian war has shown the problems of the Chassepot. In addition, in 1871, the Prussian have a rifle with metallic cartridges, the Mauser. The French army decided to use the metallic cartridges and so need to change their rifles. Adopt a new rifle like the one designed by De Beaumont is too expensive. The Chassepot transformation proposed by the Colonel Basile Gras has been chosen."
 FRA_infantry_equipment_rifle_5: "Lebel"
 FRA_infantry_equipment_rifle_5_short: "Lebel"
 FRA_infantry_equipment_rifle_5_desc: "The marine used the Kropatschek (model 1878), a repeating rifle designed by an Austrian. The Model 1884 and 1885 are derived from it using the same cartridges than the Gras. But in 1884, Paul Vieille invented the smokeless gunpowder which allow ammunition smaller than 11mm. The war minister, general Boulanger, asked to do a new rifle the Model 1886. The Lt Colonel Nicolas Lebel invented a 8mm flat nosed FMJ bullet. The colonel Gras designed a new rifle with these inventions."
 FRA_infantry_equipment_rifle_6: "Lebel M93"
 FRA_infantry_equipment_rifle_6_short: "Lebel M93"
 FRA_infantry_equipment_rifle_6_desc: "The most useful improvement was a modification of the bolt head so it would divert away from the shooter's face any hot gases escaping from a ruptured cartridge case. The fixation of the rear sight onto the barrel was also substantially improved in the 1893 modification."
 FRA_infantry_equipment_rifle_7: "Lebel M98"
 FRA_infantry_equipment_rifle_7_short: "Lebel M98"
 FRA_infantry_equipment_rifle_7_desc: "In 1898, the growth board was adapted to the change of ammunition from the Model 1886 M cartridge to the Model 1886 D cartridge."
 FRA_infantry_equipment_rifle_8: "Berthier 07"
 FRA_infantry_equipment_rifle_8_short: "Berthier 07"
 FRA_infantry_equipment_rifle_8_desc: "A French civilian engineer in the Algerian railways, Emile Berthier, proposed a new system to increase the reloading speed. The Berthier carbine was adopted by French army in 1890. The French army adapted it in 1907 to produce the Berthier rifle."
 FRA_infantry_equipment_rifle_9: "Berthier 15"
 FRA_infantry_equipment_rifle_9_short: "Berthier 15"
 FRA_infantry_equipment_rifle_9_desc: "With the First World War, the French army need a new rifle. The army have a lot of Lebel but the Berthier 07 is better in the trenches. Th Berthier 07 is modified with some element of the Lebel to become the model 1907/15."
 FRA_infantry_equipment_rifle_10: "Berthier 16"
 FRA_infantry_equipment_rifle_10_short: "Berthier 16"
 FRA_infantry_equipment_rifle_10_desc: "The Model 1916 Berthier rifle was introduced with a five-round en-bloc clip. The clip discharge opening at the bottom of the protruding magazine was replaced by a spring loaded trapdoor to keep out dirt and debris."
 FRA_infantry_equipment_mg_0: "Chauchat M1915"
 FRA_infantry_equipment_mg_0_short: "CSRG 1915"
 FRA_infantry_equipment_mg_0_desc: "The colonel Louis Chauchat has made a machine gunner prototype in 1911 with the weapon controller Charles Sutter. In 1915, the France ask to Paul Ribeyrolles who lead the Cycles Gladiator factory to produce this MG (FM in French) in series. This MG is also known as CSRG for Chauchat, Sutter, Ribeyrolles and Gladiator"
 FRA_infantry_equipment_mg_1: "FM Chauchat M1918"
 FRA_infantry_equipment_mg_1_short: "FM Chauchat M1918"
 FRA_infantry_equipment_mg_1_desc: "The Chauchat M1915 has been adapted in the 1918 for the US army. It was a failure which was reaplaced by the Browning BAR (Browning Automatic Rifle) M1918"
 FRA_infantry_equipment_smg_0: "Chauchat-Ribeyrolles 1918 sub-machine gun"
 FRA_infantry_equipment_smg_0_short: "Ribeyrolles 1918"
 FRA_infantry_equipment_smg_0_desc: "Chauchat, Ribeyrolles and Sutter who have designed machine gunners, presented in 1918 a sub-machine gunner. This weapon should be used for close-range protection for the French tank crews."
 FRA_howitzer_equipment_0: "Canon obusier de campagne de 12 livres, modèle 1853"
 FRA_howitzer_equipment_0_short: "12-pounder Napoleon"
 FRA_howitzer_equipment_0_desc: "The 12-pounder Napoleon is a type of canon-obusier (literally \"shell-gun cannon\" or \"gun-howitzer\") developed by France in 1853. Its performance and versatility, including the ability to fire ball, shell, canister, or grapeshot, allowed it to replace earlier French field guns and howitzers."
 FRA_howitzer_equipment_1: "Canon de 12 La Hitte, Modele 1859"
 FRA_howitzer_equipment_1_short: "12-pounder La Hitte"
 FRA_howitzer_equipment_1_desc: "The La Hitte system, named after the French general Ducos, Count de La Hitte, was an artillery system designed in March 1858 to implement rifled muzzle-loading guns in the French Army. La Hitte implemented the principle designed by the Lieutenant-colonel Treuille de Beaulieu."
 FRA_rifled_cannon_equipment_2: "Canon de 24 La Hitte, Modele 1867"
 FRA_rifled_cannon_equipment_2_short: "Aubépine"
 FRA_rifled_cannon_equipment_2_desc: "The La Hitte system, named after the French general Ducos, Count de La Hitte, was an artillery system designed in March 1858 to implement rifled muzzle-loading guns in the French Army. La Hitte implemented the principle designed by the Lieutenant-colonel Treuille de Beaulieu."
 FRA_helmet_equipment_0: "M15 Adrian Helmet"
 FRA_helmet_equipment_0_short: "M15 Adrian Helmet"
 FRA_helmet_equipment_0_desc: "With the trench warfare, the head casualties are the main death causes. The Intendant-General August-Louis Adrian has designed a helmet to protect soldiers from the shrapnel of exploding artillery shells. The helmet has not been designed to protect from direct impact by rifle or machine gun bullets. His thickness is 0.7mm and his weight 0.7kg. These characteristics are weaker than the Stahlhelm M 1916 (German helmet) and the Brodie (British helmet)."
 FRA_armor_equipment_bicycle_0: "Vélocipède Michaux"
 FRA_armor_equipment_bicycle_0_short: "Vélocipède Michaux"
 FRA_armor_equipment_bicycle_0_desc: "In 1818, Karl Drais has invented a dandy horse, the draisine, a human powered vehicle. Pierre Michaux, a blacksmith, adapted the draisine by adding cranks and pedals on the front wheel. He founded Michaux & Cie the first company which produced bicycles called velocipede or Michaudine."
 FRA_armor_equipment_steam_car_0: "La Mancelle"
 FRA_armor_equipment_steam_car_0_short: "La Mancelle"
 FRA_armor_equipment_steam_car_0_desc: "Bellfounder Amédée-Ernest Bollée became an important pioneer of French steam road vehicles. His 1873 L'Obéissante could carry twelve passengers at roughly 30 km/h, while the later La Mancelle introduced rear-wheel drive and independent suspension and became one of the earliest automobiles produced in a small series."
 FRA_twelve_frigate: "Pallas Class"
 FRA_twelve_frigate_desc: "The Pallas-class frigate is a conventional sailing warship built for independent cruising and a substantial broadside. Its combination of range, speed under sail, and gun power makes it useful for patrol and commerce protection."
 FRA_foureight_frigate: "Gomer Class"
 FRA_foureight_frigate_desc: "The Gomer class represents the late development of the French sailing frigate, combining a large hull and strong battery with the endurance needed for ocean service during the transition toward steam propulsion."
 FRA_fivesix_frigate: "Gloire Class"
 FRA_fivesix_frigate_desc: "The Gloire class combines a wooden hull, steam propulsion, and extensive iron armor to create one of the first practical ocean-going ironclads. It renders traditional wooden battle fleets increasingly vulnerable and obsolete."
 FRA_sixone_frigate: "Magenta Class"
 FRA_sixone_frigate_desc: "The Magenta class develops the ocean-going ironclad with heavier armor, powerful broadside guns, and steam propulsion in a large capital-ship hull. It reflects the rapid experimentation that follows the first armored frigates."
 FRA_monoplane_equipment_1: "Morane-Saulnier L"
 FRA_monoplane_equipment_1_short: "MoS-3"
 FRA_monoplane_equipment_1_desc: "The Morane-Saulnier L is a parasol-wing monoplane used for reconnaissance and early air combat, representing the transition from unarmed observation aircraft to purpose-armed military aviation."
 FRA_biplane_fighter_equipment: "Nieuport 11"
 FRA_biplane_fighter_equipment_short: "Nieuport 11"
 FRA_biplane_fighter_equipment_desc: "The Nieuport 11 is a light and highly maneuverable sesquiplane fighter whose compact airframe and forward-firing gun make it effective in the close-range air battles of the First World War."
 FRA_jet_fighter_equipment_2: "Dassault MD.452 Mystere"
 FRA_jet_fighter_equipment_2_short: "Mystere"
 FRA_jet_fighter_equipment_2_desc: "The Dassault Mystère is a swept-wing jet fighter that advances French aviation into transonic performance with improved aerodynamics and heavier armament."
 FRA_jet_fighter_equipment_3: "Dassault Super Mystere B2"
 FRA_jet_fighter_equipment_3_short: "SM B2"
 FRA_jet_fighter_equipment_3_desc: "The Super Mystère B2 is a more powerful swept-wing fighter capable of supersonic flight in a dive and equipped for both interception and ground-attack missions."
 FRA_jet_fighter_equipment_4: "Dassault Mirage III"
 FRA_jet_fighter_equipment_4_short: "Mirage III"
 FRA_jet_fighter_equipment_4_desc: "The Mirage III is a delta-wing supersonic fighter built for high-altitude interception, combining strong climb performance with radar-guided weapons and multirole flexibility."
 FRA_jet_fighter_equipment_5: "Dassault Mirage G"
 FRA_jet_fighter_equipment_5_short: "Mirage G"
 FRA_jet_fighter_equipment_5_desc: "The Mirage G explores variable-sweep wings to combine high-speed performance with better low-speed handling, range, and takeoff characteristics."
 FRA_jet_fighter_equipment_6: "Dassault Mirage 2000"
 FRA_jet_fighter_equipment_6_short: "Mirage 2000"
 FRA_jet_fighter_equipment_6_desc: "The Mirage 2000 is a lightweight delta-wing multirole fighter with fly-by-wire controls, modern radar, and the speed and agility needed for both interception and strike missions."
 FRA_jet_fighter_equipment_7: "Dassault Mirage IIING"
 FRA_jet_fighter_equipment_7_short: "Mirage IIING"
 FRA_jet_fighter_equipment_7_desc: "The Mirage IIING is an advanced experimental development of the Mirage family, combining a refined delta wing with canards and modern flight-control technology."
 FRA_jet_fighter_equipment_9: "Dassault Rafale"
 FRA_jet_fighter_equipment_9_short: "Rafale"
 FRA_jet_fighter_equipment_9_desc: "The Dassault Rafale is an advanced multirole fighter combining modern sensors, electronic warfare systems, precision weapons, and strong performance in both air-to-air and strike missions."
 FRA_jet_tactical_bomber_equipment_1_short: "SO-4000"
 FRA_jet_tactical_bomber_equipment_1: "SNCASO SO-4000"
 FRA_jet_tactical_bomber_equipment_1_desc: "The SNCASO SO-4000 is a French postwar jet-bomber prototype designed to explore swept-wing high-speed flight and heavy jet propulsion. The program advances French experience with large modern combat aircraft even without entering full service."
 FRA_jet_tactical_bomber_equipment_2_short: "Vautour IIB"
 FRA_jet_tactical_bomber_equipment_2: "SNCASO SO-4050 Vautour IIB"
 FRA_jet_tactical_bomber_equipment_2_desc: "The Vautour IIB is a twin-engine jet bomber designed for fast medium-range strike missions. Its swept wings and substantial payload give France a modern conventional bombing platform for the early jet age."
 FRA_jet_tactical_bomber_equipment_3_short: "Vautour IIN"
 FRA_jet_tactical_bomber_equipment_3: "SNCASO SO-4050 Vautour IIN"
 FRA_jet_tactical_bomber_equipment_3_desc: "The Vautour IIN adapts the Vautour airframe for all-weather interception with radar and a two-man crew. High speed and heavy armament make it suitable for defending airspace beyond visual range in poor conditions."
 FRA_light_tank_equipment_4: "AMX-13 75 Modèle 51"
 FRA_light_tank_equipment_4_short: "AMX-13"
 FRA_light_tank_equipment_4_desc: "The AMX-13 is a compact light tank built around an oscillating turret and autoloading 75 mm gun, giving it substantial firepower without sacrificing mobility."
 FRA_light_tank_equipment_5: "Char de 25 Tonnes Batignolles-Chatillon"
 FRA_light_tank_equipment_5_desc: "The Batignolles-Châtillon 25-ton project explores a fast French medium tank with an oscillating turret and autoloading gun. It emphasizes mobility and firepower while keeping weight below that of contemporary heavy tanks."
 FRA_light_tank_equipment_5_short: "Char 25 Tonnes" 
 FRA_gw_tank_equipment: "Schneider CA1"
 FRA_gw_tank_equipment_desc: "The Schneider CA1 is an early French assault tank intended to cross wire and support infantry against fortified positions. Its short hull and limited mobility are crude, but armor and a hull-mounted gun provide protection and close fire support."
 FRA_gw_tank_equipment_short: "Schneider CA1"
 FRA_iw_tank_equipment: "Renault FT Canon"
 FRA_iw_tank_equipment_desc: "The Renault FT establishes the classic tank layout of a front driver, rear engine, and fully rotating turret. Small size and flexible armament make it far more tactically adaptable than earlier box-like assault tanks."
 FRA_iw_tank_equipment_short: "Renault FT"
 FRA_modern_tank_equipment_2: "AMX 50 Tonnes"
 FRA_modern_tank_equipment_2_desc: "The AMX-50 is a French heavy-tank project combining an oscillating turret, autoloading gun, and powerful chassis. It seeks heavy firepower with greater mobility than traditional postwar heavy tanks."
 FRA_modern_tank_equipment_2_short: "AMX 50"
 FRA_mtb_1: "AMX-30"
 FRA_mtb_1_desc: "The AMX-30 reflects the French preference for a mobile main battle tank with a powerful gun and relatively light protection. Good strategic mobility and firepower are prioritized over the very heavy armor of some contemporaries."
 FRA_mtb_1_short: "AMX-30"
 FRA_mtb_2: "AMX-30 B"
 FRA_mtb_2_desc: "The AMX-30 B reflects the French preference for a mobile main battle tank with a powerful gun and relatively light protection. Good strategic mobility and firepower are prioritized over the very heavy armor of some contemporaries."
 FRA_mtb_2_short: "AMX-30 B"
 FRA_mtb_3: "AMX-40"
 FRA_mtb_3_desc: "The AMX-40 is an advanced French main battle tank design featuring improved composite protection, a 120 mm gun, and modern fire control while retaining the mobility emphasized by earlier French tank doctrine."
 FRA_mtb_3_short: "AMX-40"
 FRA_mtb_4: "Leclerc Série 1"
 FRA_mtb_4_desc: "The Leclerc Série 1 is a modern French main battle tank emphasizing high mobility, an autoloaded 120 mm gun, advanced fire control, and modular protection. Digital systems improve first-shot accuracy and battlefield awareness."
 FRA_mtb_4_short: "Leclerc 1"
 FRA_mtb_5: "Leclerc Série 2"
 FRA_mtb_5_desc: "The Leclerc Série 2 is a modern French main battle tank emphasizing high mobility, an autoloaded 120 mm gun, advanced fire control, and modular protection. Digital systems improve first-shot accuracy and battlefield awareness."
 FRA_mtb_5_short: "Leclerc 2"
 FRA_mtb_6: "Leclerc Séries Série XXI"
 FRA_mtb_6_desc: "The Leclerc Séries Série XXI is a modern French main battle tank emphasizing high mobility, an autoloaded 120 mm gun, advanced fire control, and modular protection. Digital systems improve first-shot accuracy and battlefield awareness."
 FRA_mtb_6_short: "Leclerc XXI"
 FRA_future_tank_1: "Leclerc XLR"
 FRA_future_tank_1_desc: "The Leclerc XLR is a modern French main battle tank emphasizing high mobility, an autoloaded 120 mm gun, advanced fire control, and modular protection. Digital systems improve first-shot accuracy and battlefield awareness."
 FRA_future_tank_1_short: "Leclerc XLR"
 FRA_future_tank_2: "Euro Main Battle Tank"
 FRA_future_tank_2_desc: "The Euro Main Battle Tank concept combines French and German armored-vehicle technologies in an experimental common platform. It explores how modern protection, firepower, sensors, and modular design could shape a future European tank."
 FRA_future_tank_2_short: "EMBT"
 #HAM

 HAM_infantry_equipment_rifle_0: "Dreyse Zündnadelgewehr M/41"
 HAM_infantry_equipment_rifle_0_desc: "The Dreyse needle gun uses a bolt-operated breech and self-contained paper cartridge ignited by a long firing needle. Soldiers can reload while prone and fire far faster than troops armed with conventional muzzle-loaders."
 HAM_infantry_equipment_rifle_0_short: "Dreyse M/41"
