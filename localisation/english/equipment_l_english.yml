 ship_torpedo_submarine_2: "Submarine Torpedo System III"
 ship_torpedo_submarine_2_desc: "Submarine Torpedo System III refines internal tubes, compressed-air launch equipment, reload arrangements, and torpedo fire control. More reliable and capable torpedoes let submerged boats attack valuable surface targets from safer positions and with a better chance of a decisive hit."
 ship_torpedo_submarine_3: "Submarine Torpedo System IV"
 ship_torpedo_submarine_3_desc: "Submarine Torpedo System IV refines internal tubes, compressed-air launch equipment, reload arrangements, and torpedo fire control. More reliable and capable torpedoes let submerged boats attack valuable surface targets from safer positions and with a better chance of a decisive hit."
