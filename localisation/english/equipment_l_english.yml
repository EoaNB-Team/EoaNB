 ship_module_seaplane_launcher_1: "Seaplane Catapult"
 ship_module_seaplane_launcher_1_desc: "A shipboard catapult launches reconnaissance seaplanes without requiring a long takeoff run, greatly expanding the scouting horizon of cruisers and capital ships. Recovery still requires the aircraft to land on water and be hoisted aboard."
 ship_secondary_guns_4: "Secondary Battery V"
 ship_secondary_guns_4_desc: "Secondary Battery V gives larger warships a rapid-firing armament for engaging destroyers, torpedo boats, aircraft at favorable angles, and other targets too small for the main guns. Improved directors and ammunition handling allow faster, more coordinated defensive fire."
 ship_secondary_guns_5: "Secondary Battery VI"
 ship_secondary_guns_5_desc: "Secondary Battery VI gives larger warships a rapid-firing armament for engaging destroyers, torpedo boats, aircraft at favorable angles, and other targets too small for the main guns. Improved directors and ammunition handling allow faster, more coordinated defensive fire."
 ship_secondary_guns_6: "Secondary Battery VII"
 ship_secondary_guns_6_desc: "Secondary Battery VII gives larger warships a rapid-firing armament for engaging destroyers, torpedo boats, aircraft at favorable angles, and other targets too small for the main guns. Improved directors and ammunition handling allow faster, more coordinated defensive fire."
 ship_sonar_1: "Ship Sonar II"
 ship_sonar_1_desc: "Improved hydrophones use better transducers, amplification, and operator stations to detect the machinery and propeller noise of submerged submarines. More precise bearings make it easier for escorts to localize a contact before beginning an attack."
 ship_sonar_2: "Ship Sonar III"
 ship_sonar_2_desc: "Improved hydrophones use better transducers, amplification, and operator stations to detect the machinery and propeller noise of submerged submarines. More precise bearings make it easier for escorts to localize a contact before beginning an attack."
 ship_sonar_3: "Ship Sonar IV"
 ship_sonar_3_desc: "Active sonar sends controlled sound pulses into the water and measures returning echoes, allowing escorts to estimate both bearing and range to submerged targets. Better transmitters and receivers improve detection in difficult sea conditions."
 ship_sonar_4: "Ship Sonar V"
 ship_sonar_4_desc: "Active sonar sends controlled sound pulses into the water and measures returning echoes, allowing escorts to estimate both bearing and range to submerged targets. Better transmitters and receivers improve detection in difficult sea conditions."
 ship_sonar_5: "Ship Sonar VI"
 ship_sonar_5_desc: "Active sonar sends controlled sound pulses into the water and measures returning echoes, allowing escorts to estimate both bearing and range to submerged targets. Better transmitters and receivers improve detection in difficult sea conditions."
 ship_sonar_6: "Ship Sonar VII"
 ship_sonar_6_desc: "Advanced sonar combines more powerful emitters, sensitive receivers, improved displays, and increasingly sophisticated signal processing. It can maintain contact at greater range and discriminate submarines from background noise more reliably."
 ship_sonar_7: "Ship Sonar VIII"
 ship_sonar_7_desc: "Advanced sonar combines more powerful emitters, sensitive receivers, improved displays, and increasingly sophisticated signal processing. It can maintain contact at greater range and discriminate submarines from background noise more reliably."
 ship_sonar_8: "Ship Sonar IX"
 ship_sonar_8_desc: "Advanced sonar combines more powerful emitters, sensitive receivers, improved displays, and increasingly sophisticated signal processing. It can maintain contact at greater range and discriminate submarines from background noise more reliably."
 ship_superheavy_battery_1: "Super-Heavy Naval Battery I"
 ship_superheavy_battery_1_desc: "Super-heavy battery I mounts exceptionally large-caliber guns intended to defeat the thickest capital-ship armor and deliver enormous explosive shells at long range. Reinforced mountings, loading machinery, and fire-control systems are essential to handle the weapon’s extreme weight and recoil."
 ship_superheavy_battery_2: "Super-Heavy Naval Battery II"
 ship_superheavy_battery_2_desc: "Super-heavy battery II mounts exceptionally large-caliber guns intended to defeat the thickest capital-ship armor and deliver enormous explosive shells at long range. Reinforced mountings, loading machinery, and fire-control systems are essential to handle the weapon’s extreme weight and recoil."
