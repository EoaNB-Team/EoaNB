 ship_engine_gunboat_0_short: "Gunboat Engine I"
 ship_engine_gunboat_0_desc: "Rated at roughly 12 shaft horsepower, this machinery is optimized for compact coastal warships, where reliability, shallow-draft operation, and economical cruising matter more than raw fleet speed."
