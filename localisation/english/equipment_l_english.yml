 ship_engine_steam_screw_capital: "Capital Ship Steam Screw Engine I"
 ship_engine_steam_screw_capital_desc: "Steam-driven screw propulsion places the propeller below the waterline, freeing deck and broadside space while giving the capital ship better efficiency and maneuverability than paddle wheels. It allows a more compact and seaworthy machinery arrangement while retaining familiar reciprocating steam engines."
 ship_engine_steam_screw_capital_2: "Capital Ship Steam Screw Engine II"
 ship_engine_steam_screw_capital_2_desc: "Steam-driven screw propulsion places the propeller below the waterline, freeing deck and broadside space while giving the capital ship better efficiency and maneuverability than paddle wheels. Refined boilers, engines, shafts, and propeller geometry improve sustained speed and reliability as the system matures."
