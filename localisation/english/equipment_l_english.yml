 ship_heavy_battery_2_desc: "Heavy Naval Battery III uses improved barrels, mountings, ammunition handling, and fire-control integration to deliver heavier and more accurate fire against capital ships and heavily armored targets. Successive improvements increase practical range, rate of fire, and reliability without requiring a completely new weapon concept."
