 coastal_submarine: "Coastal Submarine"
 coastal_submarine_desc: "Coastal submarines sacrifice oceanic range and habitability for a smaller, cheaper hull suited to ambushes, harbor defense, and short patrols in confined waters near friendly bases."
 ship_hull_coastal_submarine: "Coastal Submarines"
 ship_hull_coastal_submarine_desc: "coastal-submarine construction uses a small pressure hull optimized for short patrols, ambushes, and defense of nearby waters rather than long oceanic endurance."
 ship_hull_coastal_submarine_0: "Early Coastal Submarine Hull"
 ship_hull_coastal_submarine_0_desc: "coastal-submarine construction uses a small pressure hull optimized for short patrols, ambushes, and defense of nearby waters rather than long oceanic endurance."
 ship_engine_coastal_submarine: "Coastal Submarine Ship Engine"
 ship_engine_coastal_submarine_desc: "Coastal-submarine engines emphasize compactness and reliability for short patrols near friendly bases, where endurance matters less than fitting useful power into a small hull."
 ship_engine_coastal_submarine_0: "400 Shp Coastal Submarine Engine"
 ship_engine_coastal_submarine_0_short: "Coastal Submarine Engine I"
 ship_engine_coastal_submarine_0_desc: "An engine rated at 400 shaft horsepower, providing the propulsion needed for small coastal submarines designed for short patrols and operations near friendly bases. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
 ship_turret_light_0: "90mm Early Turret"
 ship_turret_light_0_short: "Early Light Turret"
 ship_turret_light_0_desc: "An early light naval turret protects a small-caliber gun crew while allowing wide traverse and faster target engagement than open deck mounts."
 ship_turret_medium_0: "150mm Early Turret"
 ship_turret_medium_0_short: "Early Medium Turret"
 ship_turret_medium_0_desc: "An early medium naval turret encloses a heavier gun in a rotating armored mount, improving protection and allowing the weapon to engage targets across a broad arc."
 ship_turret_heavy_0: "280mm Early Turret"
 ship_turret_heavy_0_short: "Early Heavy Turret"
 ship_turret_heavy_0_desc: "An early heavy naval turret mounts a large-caliber gun behind armor, concentrating capital-ship firepower in a protected rotating installation."
 ship_secondary_guns_0: "Early Secondary Guns"
 ship_secondary_guns_0_short: "Support Guns I"
 ship_secondary_guns_0_desc: "Early Secondary Guns provides a secondary battery for engaging destroyers, torpedo boats, and other targets unsuited to the main guns. Improved loading and fire control increase the volume and responsiveness of defensive fire."
 primitive_sailing_boat: "Primitive Sailing Boat"
 primitive_sailing_boat_desc: "A simple sailing craft uses wind power to travel farther and carry more than an equivalent rowboat. Limited construction and rigging keep it suitable mainly for fishing, transport, and sheltered-water service."
 primitive_rowboat: "Primitive Rowboat"
 primitive_rowboat_desc: "A small open rowboat provides basic transport across rivers, lakes, and sheltered coastal waters. Human-powered oars make it independent of wind but limit speed, endurance, cargo, and combat value."
