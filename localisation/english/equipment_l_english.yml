 ship_hull_monitor_6: "1922 Monitor Hull"
 ship_hull_monitor_6_desc: "A refined monitor hull emphasizes heavy shore-bombardment guns, stronger protection, and better fire control for supporting operations close to hostile coastlines."
 ship_hull_monitor_7: "1944 Monitor Hull"
 ship_hull_monitor_7_desc: "A later monitor concept combines heavy fire support with improved sensors, damage control, and propulsion, preserving the class's role as a compact platform for sustained coastal bombardment."
 ship_hull_monitor_8: "1960 Monitor Hull"
