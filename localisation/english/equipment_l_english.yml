 ship_torpedo_2: "Surface Torpedo System III"
 ship_torpedo_2_desc: "Surface Torpedo System III improves launcher arrangements, torpedo reliability, warhead effectiveness, and fire-control procedures for surface ships. Better weapons can be launched more rapidly and remain dangerous at greater range, giving small ships the ability to threaten far larger opponents."
 ship_torpedo_3: "Surface Torpedo System IV"
