 ship_engine_monitor: "Monitor Ship Engine"
 ship_engine_monitor_desc: "Monitor engines are compact propulsion systems intended to move heavily armed, shallow-draft warships whose displacement is dominated by armor and guns."
 ship_engine_monitor_0: "500 Shp Monitor Engine"
 ship_engine_monitor_0_short: "Monitor Engine I"
 ship_engine_monitor_0_desc: "An engine rated at 500 shaft horsepower, providing the propulsion needed for low-profile monitor ships while preserving displacement for armor and heavy guns. Improvements in machinery efficiency and reliability make this generation more practical for sustained naval service."
