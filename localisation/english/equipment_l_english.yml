 ship_engine_oil_turbines_capital_1: "Capital Ship Oil-Fired Turbine Engine I"
 ship_engine_oil_turbines_capital_1_desc: "Oil-fired boilers eliminate coal handling and provide cleaner, faster, and more controllable combustion for turbine machinery. On a capital ship, this improves acceleration, cruising flexibility, and the ability to sustain high operational speeds over long deployments."
 ship_engine_oil_turbines_capital_2: "Capital Ship Oil-Fired Turbine Engine II"
 ship_engine_oil_turbines_capital_2_desc: "Improved oil-fired boilers and turbine stages increase power while reducing the machinery weight and crew labor needed for a given speed. On a capital ship, this improves acceleration, cruising flexibility, and the ability to sustain high operational speeds over long deployments."
 ship_engine_oil_turbines_capital_3: "Capital Ship Oil-Fired Turbine Engine III"
 ship_engine_oil_turbines_capital_3_desc: "Higher steam pressures, better gearing, and improved metallurgy extract more useful power from oil-fired turbine plants while extending machinery life. On a capital ship, this improves acceleration, cruising flexibility, and the ability to sustain high operational speeds over long deployments."
 ship_engine_oil_turbines_capital_4: "Capital Ship Oil-Fired Turbine Engine IV"
 ship_engine_oil_turbines_capital_4_desc: "Mature high-output oil turbine machinery combines efficient boilers, refined reduction gearing, and robust materials to deliver excellent power density and sustained fleet speed. On a capital ship, this improves acceleration, cruising flexibility, and the ability to sustain high operational speeds over long deployments."
