 PRS_biplane_fighter_equipment_short: "E.III"
 PRS_biplane_fighter_equipment_desc: "The Fokker E.III Eindecker is an early single-seat fighter whose synchronized forward-firing machine gun lets the pilot aim the entire aircraft directly at a target."
