 #NOR
 NOR_infantry_equipment_rifle_0: "M1807 Infanterimuskett"
 NOR_infantry_equipment_rifle_0_desc: "The M1807 Infanterimuskett is a standardized flintlock infantry musket of the early nineteenth century. Reliable manufacture and disciplined volley fire matter more than individual accuracy, which remains limited by the smoothbore barrel."
 NOR_infantry_equipment_rifle_0_short: "M1807 Infanterimuskett"
 NOR_infantry_equipment_rifle_1: "M1825 Infanterimuskett"
 NOR_infantry_equipment_rifle_1_desc: "The M1825 Infanterimuskett is a standardized flintlock infantry musket of the early nineteenth century. Reliable manufacture and disciplined volley fire matter more than individual accuracy, which remains limited by the smoothbore barrel."
 NOR_infantry_equipment_rifle_1_short: "M1825 Infanterimuskett"
 NOR_infantry_equipment_rifle_2: "M1860 Kammerladningsgevær"
 NOR_infantry_equipment_rifle_2_desc: "The M1860 Kammerladningsgevær is a Scandinavian chamber-loading rifle that can be loaded from the breech far faster than a conventional muzzle-loader. It gives infantry an important transitional advantage before metallic-cartridge rifles become standard."
 NOR_infantry_equipment_rifle_2_short: "M1860 Kammerladningsgevær"
 NOR_infantry_equipment_rifle_3: "M1860/67 Kammerladningsgevær"
 NOR_infantry_equipment_rifle_3_desc: "The M1860/67 Kammerladningsgevær is a Scandinavian chamber-loading rifle that can be loaded from the breech far faster than a conventional muzzle-loader. It gives infantry an important transitional advantage before metallic-cartridge rifles become standard."
 NOR_infantry_equipment_rifle_3_short: "M1860/67 Kammerladningsgevær"
 NOR_infantry_equipment_rifle_4: "M1867 Remington"
 NOR_infantry_equipment_rifle_4_desc: "The M1867 Remington uses the simple and exceptionally strong Remington rolling-block action. Metallic cartridges and a robust breech make it reliable, easy to maintain, and well suited to mass military service."
 NOR_infantry_equipment_rifle_4_short: "M1867 Remington"
 NOR_infantry_equipment_rifle_5: "M1876 Krag Petersson"
 NOR_infantry_equipment_rifle_5_desc: "The Krag–Petersson is an early repeating rifle using a tubular magazine and falling-block action. It demonstrates the growing military value of magazine fire before bolt-action repeaters become dominant."
 NOR_infantry_equipment_rifle_5_short: "M1876 Krag Petersson"
 #SER
 SER_infantry_equipment_rifle_0: "Balkan Musket"
 SER_infantry_equipment_rifle_0_desc: "The Balkan musket represents the mixed flintlock and percussion shoulder arms common in regional service before full standardization. Simple construction makes it easy to maintain, but range and rate of fire remain limited."
 SER_infantry_equipment_rifle_0_short: "Balkan Musket"
 SER_infantry_equipment_rifle_2: "Francotte-Blaznavac Musket"
 SER_infantry_equipment_rifle_2_desc: "The Francotte–Blaznavac rifle is a Serbian service arm derived from Belgian Minié-pattern percussion rifles. Rifling and expanding ammunition provide much greater accuracy and range than older smoothbore muskets."
 SER_infantry_equipment_rifle_2_short: "Francotte-Blaznavac Musket"
 SER_infantry_equipment_rifle_3: "M1868 Peabody Rifle"
 SER_infantry_equipment_rifle_3_desc: "The M1868 Peabody Rifle uses a strong falling-block breech with metallic cartridges, giving infantry reliable and rapid single-shot fire. Its simple action is well suited to armies transitioning away from percussion muzzle-loaders."
 SER_infantry_equipment_rifle_3_short: "M1868 Peabody Rifle"
 #RAJ
 RAJ_modern_tank_equipment_2: "Centurion Mk3"
 RAJ_modern_tank_equipment_2_desc: "The Centurion Mk 3 combines a powerful 20-pounder gun, good armor, and excellent cross-country mobility in a balanced postwar tank. Its design becomes a benchmark for the emerging main battle tank concept."
 RAJ_modern_tank_equipment_2_short: "Centurion Mk3"
 RAJ_mtb_1: "Vijayanta"
 RAJ_mtb_1_short: "Vijayanta"
 RAJ_mtb_1_desc: "The Vijayanta is an Indian-produced main battle tank based on the Vickers design, combining a 105 mm gun with relatively light weight and straightforward domestic manufacture."
 RAJ_mtb_2: "T-72M Ajeya"
 RAJ_mtb_2_short: "Ajeya"
 RAJ_mtb_2_desc: "The T-72M Ajeya gives Indian armored forces a low-profile, heavily armed main battle tank with composite protection and a 125 mm autoloading gun."
 RAJ_mtb_3: "T-72M Ajeya Mk.2"
 RAJ_mtb_3_short: "Ajeya Mk.2"
 RAJ_mtb_3_desc: "The Ajeya Mk.2 modernizes the T-72M with improved fire control, protection, and electronics to extend its effectiveness against newer armored threats."
 RAJ_mtb_4: "Arjun"
 RAJ_mtb_4_short: "Arjun"
 RAJ_mtb_4_desc: "The Arjun is an indigenous Indian main battle tank emphasizing heavy protection, a 120 mm rifled gun, and modern fire-control systems for accurate long-range engagement."
 RAJ_mtb_5: "Arjun Mk.2"
 RAJ_mtb_5_short: "Arjun Mk.2"
 RAJ_mtb_5_desc: "The Arjun Mk.2 develops the original platform with improved protection, electronics, and weapon integration while retaining its powerful rifled main gun."
 #SAX
 SAX_infantry_equipment_rifle_0: "Infanteriegewehr Modell 1842 Augustin"
 SAX_infantry_equipment_rifle_0_desc: "The Infanteriegewehr Modell 1842 Augustin is an Austrian-pattern muzzle-loading infantry arm using tube-lock ignition. More dependable than a flintlock in poor weather, it represents an important transitional step before percussion-cap rifles dominate."
 SAX_infantry_equipment_rifle_0_short: "Augustin M/1842"
 SAX_infantry_equipment_rifle_1: "Lütticher Gewehr M/1854"
 SAX_infantry_equipment_rifle_1_desc: "The Lütticher Gewehr M/1854 is a mid-century percussion rifle-musket manufactured to provide Saxon infantry with improved rifled accuracy and dependable cap ignition. It brings line troops closer to contemporary European small-arms standards."
 SAX_infantry_equipment_rifle_1_short: "Gewehr M/1854"
 SAX_infantry_equipment_rifle_2: "Infanteriegewehr Modell 1862 Lorenz"
 SAX_infantry_equipment_rifle_2_desc: "The Infanteriegewehr Modell 1862 Lorenz is an Austrian-pattern percussion rifle-musket using a rifled barrel and expanding projectile. It gives line infantry substantially greater effective range and accuracy than older smoothbore muskets."
 SAX_infantry_equipment_rifle_2_short: "Lorenz M/1862"
 SAX_infantry_equipment_rifle_3: "Dreyse Zündnadelbüchse M/65"
 SAX_infantry_equipment_rifle_3_desc: "The Dreyse needle gun uses a bolt-operated breech and self-contained paper cartridge ignited by a long firing needle. Soldiers can reload while prone and fire far faster than troops armed with conventional muzzle-loaders."
 SAX_infantry_equipment_rifle_3_short: "Dreyse M/65"
 SAX_infantry_equipment_rifle_4: "Gewehr 71"
 SAX_infantry_equipment_rifle_4_desc: "The Mauser Model 1871 is a robust single-shot bolt-action rifle firing a metallic black-powder cartridge. Its strong breech and simple action provide faster loading, better sealing, and greater reliability than converted muzzle-loaders."
 SAX_infantry_equipment_rifle_5: "Gewehr 88"
 SAX_infantry_equipment_rifle_5_desc: "The Gewehr 88 is a magazine-fed bolt-action service rifle developed for small-caliber smokeless-powder ammunition. Charger loading and a flatter trajectory give infantry much greater sustained fire and effective range."
 #RUS
 RUS_mtb_1: "T-64"
 RUS_mtb_1_desc: "The T-64 represents a Soviet or Russian main battle tank generation built around a compact silhouette, powerful smoothbore gun, and increasingly sophisticated armor and fire control. Each successive model improves protection, mobility, and target engagement while retaining a relatively small crew and hull."
 RUS_mtb_1_short: "T-64"
 RUS_mtb_2: "T-72"
 RUS_mtb_2_desc: "The T-72 represents a Soviet or Russian main battle tank generation built around a compact silhouette, powerful smoothbore gun, and increasingly sophisticated armor and fire control. Each successive model improves protection, mobility, and target engagement while retaining a relatively small crew and hull."
