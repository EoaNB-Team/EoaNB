 PRS_monoplane_equipment_1: "Fokker M.5"
 PRS_monoplane_equipment_1_short: "M.5"
 PRS_monoplane_equipment_1_desc: "The Fokker M.5 is a lightweight monoplane whose clean layout and maneuverability provided an important foundation for Germany's first purpose-built armed monoplanes."
