 ship_engine_paddle_capital: "Capital Ship Paddle-Wheel Engine"
 ship_engine_paddle_capital_desc: "Paddle-wheel steam machinery gives the capital ship mechanical propulsion independent of wind, a major advantage over pure sailing power. The exposed side wheels are bulky and vulnerable, but they provide a practical bridge between sail and more efficient screw propulsion."
 ship_engine_paddle_carrier: "Carrier Paddle-Wheel Engine"
 ship_engine_paddle_carrier_desc: "Paddle-wheel steam machinery gives the carrier mechanical propulsion independent of wind, a major advantage over pure sailing power. The exposed side wheels are bulky and vulnerable, but they provide a practical bridge between sail and more efficient screw propulsion."
 ship_engine_paddle_cruiser: "Cruiser Paddle-Wheel Engine"
 ship_engine_paddle_cruiser_desc: "Paddle-wheel steam machinery gives the cruiser mechanical propulsion independent of wind, a major advantage over pure sailing power. The exposed side wheels are bulky and vulnerable, but they provide a practical bridge between sail and more efficient screw propulsion."
