 PRS_infantry_equipment_rifle_0_desc: "The Dreyse Zündnadelgewehr M/41 gives Prussian infantry a revolutionary bolt-operated breech-loader using a self-contained paper cartridge ignited by a long needle-like firing pin. Soldiers can reload while prone and fire much faster than muzzle-loaded opponents, fundamentally changing infantry tactics."
 PRS_infantry_equipment_rifle_1_desc: "The Dreyse Zündnadelbüchse M/54 is a shorter, handier needle-fire variant intended for specialized rifle troops. It retains the rapid breech-loading system of the M/41 while improving mobility and practical handling for soldiers expected to skirmish, maneuver, and deliver deliberate fire."
 PRS_infantry_equipment_rifle_2_desc: "The Dreyse Zündnadelgewehr M/62 refines Prussia's standard needle rifle with a shorter, lighter pattern informed by two decades of service experience. Improved handling and sights preserve the weapon's decisive rate-of-fire advantage while making it better suited to increasingly mobile infantry combat."
 PRS_infantry_equipment_rifle_3_desc: "The Dreyse Zündnadelbüchse M/65 develops the needle-gun system for Jäger and other precision-oriented troops. A handier rifle and more refined sighting arrangement improve deliberate shooting while retaining the breech-loading speed that made the Dreyse family central to Prussian infantry doctrine."
 PRS_infantry_equipment_rifle_4_desc: "The Mauser M/71 replaces the paper-cartridge needle gun with a strong bolt action firing a self-contained metallic cartridge. Though still a single-shot weapon, its better gas sealing, durability, and ballistic consistency provide a more reliable foundation for the next generation of German service rifles."
 PRS_infantry_equipment_rifle_5_desc: "The Mauser M71/84 converts the proven Model 1871 system into a repeating rifle by adding a tubular magazine beneath the barrel. Infantry can now fire several aimed shots before reloading, greatly improving close-range firepower while retaining the familiar Mauser bolt and full-power service cartridge."
 PRS_infantry_equipment_rifle_6_desc: "The Gewehr 88 brings German infantry into the smokeless-powder era with a small-bore 8 mm cartridge and rapid packet loading. Its higher velocity, flatter trajectory, reduced ammunition weight, and magazine-fed action represent a major leap beyond the large-caliber black-powder rifles it replaces."
 PRS_infantry_equipment_rifle_7_desc: "The Mauser Gewehr 98 combines a very strong turn-bolt action with a five-round internal magazine loaded from stripper clips and modern 7.92 mm smokeless ammunition. Reliable extraction, secure locking, and excellent long-range performance make it one of the defining military rifle systems of its era."
 PRS_infantry_equipment_rifle_8_desc: "The Karabiner 98A adapts the Mauser 98 action into a shorter and handier weapon for mounted troops, artillerymen, and other soldiers who find a full-length infantry rifle cumbersome. It preserves the strength and charger loading of the Gewehr 98 while improving mobility in confined conditions."
 PRS_infantry_equipment_rifle_9_desc: "The Karabiner 98AZ further refines the compact Mauser short-rifle concept with improved fittings and battlefield handling. Its shortened form is easier to carry through trenches, towns, forests, and mounted service while retaining the dependable action and powerful cartridge of the Gewehr 98 family."
 PRS_infantry_equipment_rifle_10_desc: "The Karabiner 98b modernizes the Gewehr 98 family with updated handling features while retaining the proven Mauser action and full-power service cartridge. It offers the reliability of the older long rifle in a pattern better suited to the evolving training and field requirements of a modern army."
 PRS_siege_gun_0: "9 cm Kanone C/79"
 PRS_siege_gun_0_desc: "The 9 cm Kanone C/79 is a steel breechloading artillery piece built for accurate long-range fire. Strong construction and improved ammunition handling allow heavier charges and more reliable service than older muzzle-loading guns."
 PRS_siege_gun_1: "15 cm Ring Kanone C/72"
 PRS_siege_gun_1_desc: "The 15 cm Ring Kanone C/72 is a steel breechloading artillery piece built for accurate long-range fire. Strong construction and improved ammunition handling allow heavier charges and more reliable service than older muzzle-loading guns."
 PRS_siege_gun_2: "15 cm Ring Kanone C/92"
 PRS_siege_gun_2_desc: "The 15 cm Ring Kanone C/92 is a steel breechloading artillery piece built for accurate long-range fire. Strong construction and improved ammunition handling allow heavier charges and more reliable service than older muzzle-loading guns."
 PRS_siege_gun_3: "28 cm Haubitze L/12"
 PRS_siege_gun_3_desc: "The 28 cm Haubitze L/12 is a heavy howitzer intended to throw large explosive shells on a high trajectory against fortifications, trenches, and other protected targets that direct-fire guns cannot easily reach."
 PRS_siege_gun_4: "28 cm Haubitze L/14 i.R."
 PRS_siege_gun_4_desc: "The 28 cm Haubitze L/14 i.R. is a heavy howitzer intended to throw large explosive shells on a high trajectory against fortifications, trenches, and other protected targets that direct-fire guns cannot easily reach."
 #FIN
 FIN_infantry_equipment_rifle_0: "Flintlåsgevär m/1799"
 FIN_infantry_equipment_rifle_0_desc: "The Flintlåsgevär m/1799 is a standardized flintlock infantry musket of the early nineteenth century. Reliable manufacture and disciplined volley fire matter more than individual accuracy, which remains limited by the smoothbore barrel."
 FIN_infantry_equipment_rifle_0_short: "Flintlåsgevär m/1799"
 FIN_infantry_equipment_rifle_1: "Model 1857 Six Line"
 FIN_infantry_equipment_rifle_1_desc: "The Model 1857 Six-Line rifle is a Russian-pattern muzzle-loading service rifle adopted during the transition to rifled infantry arms. Percussion ignition and a rifled barrel provide more reliable, accurate fire than earlier smoothbore muskets."
 FIN_infantry_equipment_rifle_1_short: "Model 1857 Six Line"
 FIN_infantry_equipment_rifle_2: "Krnka M1867"
 FIN_infantry_equipment_rifle_2_desc: "The Krnka M1867 converts existing muzzle-loading rifles into metallic-cartridge breechloaders using a hinged breech system. The conversion greatly increases rate of fire while allowing large stocks of older weapons to remain useful."
 FIN_infantry_equipment_rifle_2_short: "Krnka M1867"
 FIN_infantry_equipment_rifle_3: "Berdan kivääri nro. 2 'Pertaani'"
 FIN_infantry_equipment_rifle_3_desc: "The Berdan kivääri nro. 2 'Pertaani' is a metallic-cartridge breechloading rifle of the Berdan family, giving infantry greater reliability, faster loading, and better long-range performance than percussion muzzle-loaders."
