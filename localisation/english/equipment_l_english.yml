 ship_hull_submarine: "Submarines"
 ship_hull_submarine_desc: "Naval vessels capable of going underwater and causing huge damage to capital ships with their torpedoes."
 ship_hull_submarine_0: "Prototype Submarine Hull"
 ship_hull_submarine_0_desc: "submarine construction develops stronger pressure hulls, safer ballast systems, greater range, and improved internal arrangements for torpedoes, batteries, and machinery."
 ship_hull_submarine_1: "Early Submarine Hull"
 ship_hull_submarine_1_desc: "An early submarine hull combines a watertight pressure vessel, ballast tanks, and compact machinery, making controlled submergence practical for short-range naval operations."
 ship_hull_submarine_2: "1900 Submarine Hull"
 ship_hull_submarine_2_desc: "A stronger pressure hull and improved ballast arrangements increase the safety, range, and submerged endurance of this early submarine design."
 ship_hull_submarine_3: "1905 Submarine Hull"
 ship_hull_submarine_3_desc: "A stronger pressure hull and improved ballast arrangements increase the safety, range, and submerged endurance of this early submarine design."
 ship_hull_submarine_4: "1914 Submarine Hull"
 ship_hull_submarine_4_desc: "Better internal layout, diesel-electric machinery, and larger batteries make this submarine more practical for offensive patrols beyond immediate coastal waters."
 ship_hull_submarine_5: "1922 Submarine Hull"
 ship_hull_submarine_5_desc: "Better internal layout, diesel-electric machinery, and larger batteries make this submarine more practical for offensive patrols beyond immediate coastal waters."
 ship_hull_submarine_6: "1935 Submarine Hull"
 ship_hull_submarine_6_desc: "Improved hydrodynamics, stronger pressure construction, and better torpedo handling increase this submarine's range, diving performance, and combat endurance."
 ship_hull_submarine_7: "1940 Submarine Hull"
 ship_hull_submarine_7_desc: "Improved hydrodynamics, stronger pressure construction, and better torpedo handling increase this submarine's range, diving performance, and combat endurance."
 ship_hull_submarine_8: "1944 Submarine Hull"
 ship_hull_submarine_8_desc: "Improved hydrodynamics, stronger pressure construction, and better torpedo handling increase this submarine's range, diving performance, and combat endurance."
 ship_hull_submarine_9: "1950 Submarine Hull"
 ship_hull_submarine_9_desc: "Postwar submarine design focuses on underwater speed, quiet machinery, better sonar, and longer submerged endurance, making the boat far more dangerous beneath the surface than on it."
 ship_hull_submarine_10: "1955 Submarine Hull"
 ship_hull_submarine_10_desc: "Postwar submarine design focuses on underwater speed, quiet machinery, better sonar, and longer submerged endurance, making the boat far more dangerous beneath the surface than on it."
 ship_hull_submarine_11: "1970 Submarine Hull"
 ship_hull_submarine_11_desc: "Postwar submarine design focuses on underwater speed, quiet machinery, better sonar, and longer submerged endurance, making the boat far more dangerous beneath the surface than on it."
 ship_hull_submarine_12: "1980 Submarine Hull"
 ship_hull_submarine_12_desc: "A refined submarine hull uses improved acoustic quieting, hydrodynamics, sensors, and automation to remain concealed while hunting ships and other submarines at long range."
 ship_hull_submarine_13: "1990 Submarine Hull"
 ship_hull_submarine_13_desc: "A refined submarine hull uses improved acoustic quieting, hydrodynamics, sensors, and automation to remain concealed while hunting ships and other submarines at long range."
 ship_hull_submarine_14: "2000 Submarine Hull"
 ship_hull_submarine_14_desc: "A contemporary submarine hull integrates advanced acoustic reduction, automated combat systems, modern sensors, and improved underwater endurance for sustained stealth operations."
 ship_hull_submarine_15: "2010 Submarine Hull"
 ship_hull_submarine_15_desc: "A contemporary submarine hull integrates advanced acoustic reduction, automated combat systems, modern sensors, and improved underwater endurance for sustained stealth operations."
 ship_hull_submarine_16: "2020 Submarine Hull"
