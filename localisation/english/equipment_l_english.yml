 #Japan
 CHO_infantry_equipment_pike_and_shot_0: "Tanegashima"
 CHO_infantry_equipment_pike_and_shot_0_desc: "The Tanegashima is a Japanese matchlock arquebus descended from Portuguese firearms introduced in the sixteenth century. Simple local manufacture made it a durable standard for gun-armed infantry long after more modern locks appeared elsewhere."
