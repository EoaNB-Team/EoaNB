 PIE_infantry_equipment_rifle_3: "Vetterli Mod. 1870"
 PIE_infantry_equipment_rifle_3_desc: "The Vetterli Mod. 1870 is a metallic-cartridge breechloading rifle that brings reliable rapid fire to line infantry. Its robust action represents a major step beyond percussion muzzle-loaders and early conversion rifles."
 PIE_infantry_equipment_rifle_3_short: "Vetterli Mod. 1870"
 PIE_infantry_equipment_rifle_4: "Vetterli-Vitali Mod. 1870/87"
 PIE_infantry_equipment_rifle_4_desc: "The Vetterli-Vitali Mod. 1870/87 updates the Vetterli system with a box magazine and improved ammunition handling. It turns a proven breechloading rifle into a more effective repeater suited to late nineteenth-century infantry tactics."
 PIE_infantry_equipment_rifle_4_short: "Vetterli-Vitali Mod. 1870/87"
 PIE_infantry_equipment_rifle_5: "Càrcano Mod. 91"
 PIE_infantry_equipment_rifle_5_desc: "The Carcano Model 1891 is a small-caliber smokeless-powder bolt-action rifle using an en-bloc clip. Light ammunition and repeating fire make it well suited to mass issue in a modern conscript army."
 PIE_infantry_equipment_rifle_5_short: "Càrcano Mod. 91"
