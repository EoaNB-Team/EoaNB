 infantry_equipment_rifle_0: "Flintlock Smoothbore Musket"
 infantry_equipment_rifle_0_desc: "Flintlock Smoothbore Muskets are more accurate and have a longer range than previous iterations of muskets, and are more reliable than earlier matchlocks.\n\n §RRequires at least Victorian Army Era or 40% Industrialization Institution.§!"
 infantry_equipment_rifle_1: "Minié Rifle"
 infantry_equipment_rifle_1_desc: "The Minié rifle combines a rifled barrel with an expanding-base projectile that can be loaded nearly as quickly as a smoothbore musket. Line infantry can now deliver far more accurate fire at several times the practical range of older muskets."
 infantry_equipment_rifle_2: "Pattern 1853 Enfield Rifle-Musket"
 infantry_equipment_rifle_2_short: "Enfield Rifle"
 infantry_equipment_rifle_2_desc: "The Pattern 1853 Enfield rifle-musket refines the Minié system with standardized sights, a reliable percussion lock, and excellent long-range accuracy. It represents the mature form of the muzzle-loading service rifle."
 infantry_equipment_rifle_2_short_desc: "A mature percussion rifle-musket using Minié ammunition, combining practical muzzle-loading with greatly improved battlefield accuracy and range."
 infantry_equipment_rifle_3: "Snider-Enfield Rifle"
 infantry_equipment_rifle_3_desc: "The Snider-Enfield converts proven Enfield rifle-muskets into cartridge-firing breechloaders. Soldiers can reload much faster, including while prone, while retaining much of the accuracy of the earlier rifle."
 infantry_equipment_rifle_4: "Martini-Henry Rifle"
 infantry_equipment_rifle_4_desc: "The Martini-Henry pairs a powerful metallic cartridge with a robust falling-block breech. Its simple action, long effective range, and rapid loading make it a major advance over converted muzzle-loaders."
 infantry_equipment_rifle_5: "Lee-Metford Rifle"
 infantry_equipment_rifle_5_desc: "The Lee-Metford combines a smooth bolt action, detachable box magazine, and Metford rifling in a repeating service rifle. Magazine fire gives infantry a much higher sustained rate of fire than single-shot breechloaders."
 infantry_equipment_rifle_6: "Mosin–Nagant Rifle"
 infantry_equipment_rifle_6_desc: "The Mosin–Nagant is a rugged magazine-fed bolt-action rifle built around smokeless-powder ammunition. Its strong action, long range, and stripper-clip loading make it suitable for mass issue to modern conscript armies."
 infantry_equipment_rifle_7: "MLE Carbine Rifle"
 infantry_equipment_rifle_7_desc: "The Magazine Lee-Enfield carbine combines bolt-action magazine fire with a shorter, handier weapon for mounted and mobile troops. Rapid operation and improved ammunition handling make sustained aimed fire practical."
 infantry_equipment_rifle_8: "SMLE No.1"
 infantry_equipment_rifle_8_desc: "The Short Magazine Lee-Enfield standardizes a compact service rifle around a ten-round magazine and exceptionally smooth bolt action. Its balance of speed, reliability, and accuracy makes rapid rifle fire a core infantry capability."
 infantry_equipment_rifle_9: "Pattern 1914 Enfield Rifle"
 infantry_equipment_rifle_9_desc: "The Pattern 1914 Enfield emphasizes a strong Mauser-style action, excellent sights, and long-range accuracy. It is a robust wartime rifle well suited to precision shooting and mass battlefield service."
 infantry_equipment_rifle_10: "Rifle No.1 Mk.III"
 infantry_equipment_rifle_10_desc: "The Rifle No. 1 Mk III refines the Short Magazine Lee-Enfield with standardized sights, controls, and wartime production features. It provides trained infantry with a dependable platform for very rapid aimed fire."
 infantry_equipment_smg_0: "MP18"
 infantry_equipment_smg_0_desc: "The MP 18 introduces a compact automatic weapon firing pistol cartridges from a detachable magazine. Its high rate of fire is especially useful in trenches, buildings, and assault actions where rifle length and range matter less."
 infantry_equipment_mg_0: "Lewis Gun"
 infantry_equipment_mg_0_desc: "The Lewis gun is a portable, air-cooled light machine gun that can move with advancing infantry. Its pan magazine and comparatively low weight provide squads with automatic fire without the heavy mount of earlier machine guns."
 infantry_equipment_mg_1: "M1918 Browning"
 infantry_equipment_mg_1_desc: "The M1918 Browning Automatic Rifle gives individual infantrymen a shoulder-fired automatic weapon capable of moving with an assault. It provides mobile suppressive fire between the rifle and the crew-served machine gun."

 flamethrower_equipment: "Flamethrowers"
 flamethrower_equipment_desc: "Flamethrowers project burning fuel into trenches, bunkers, and other close defensive positions where ordinary small-arms fire may be ineffective. Their short range and exposed fuel systems make them dangerous weapons for both target and operator."
 flamethrower_equipment_0: "Early Flamethrower"
 flamethrower_equipment_0_desc: "Early flamethrowers use pressurized fuel to project a short-ranged stream of fire, making them dangerous but effective weapons against trenches and fortified positions."
 flamethrower_equipment_1: "Flamethrower"
 flamethrower_equipment_1_desc: "Improved fuel systems, ignition mechanisms, and pressure vessels make flamethrowers more reliable and effective against bunkers, trenches, and close-range infantry targets."
 machine_gun_equipment: "Machine Guns"
 machine_gun_equipment_desc: "Crew-served machine guns provide sustained automatic fire that can dominate open ground, suppress enemy infantry, and anchor defensive positions. Their effectiveness depends on prepared positions, ammunition supply, and trained gun crews."
 machine_gun_equipment_0: "Gatling Gun"
 machine_gun_equipment_0_desc: "The hand-cranked Gatling gun uses multiple rotating barrels to achieve a rate of fire impossible for conventional rifles. Heavy and cumbersome, it is best employed from prepared positions against massed infantry."
 DEN_machine_gun_equipment_0: "Espingoles"
 DEN_machine_gun_equipment_0_desc: "The Espingoles is an early rapid-fire weapon intended to increase the volume of fire available to a small crew. Though mechanically cumbersome by later standards, it points toward the battlefield role eventually filled by true machine guns."
 machine_gun_equipment_1: "Mitrailleuse"
 machine_gun_equipment_1_desc: "The Mitrailleuse is a multi-barrel rapid-fire weapon capable of delivering concentrated volleys far faster than conventional infantry firearms."
 machine_gun_equipment_2: "Maxim Gun"
 machine_gun_equipment_2_desc: "The Maxim gun uses recoil energy to cycle a belt-fed action automatically, producing sustained fire with minimal mechanical effort from the crew. Water cooling allows long bursts that can make exposed infantry attacks ruinously costly."
 machine_gun_equipment_3: "Vickers MG"
 machine_gun_equipment_3_desc: "The water-cooled, belt-fed Vickers machine gun provides sustained automatic fire and can dominate exposed approaches when supplied with ammunition and a prepared firing position."
 cannon_equipment: "Cannons"
 cannon_equipment_desc: "Field cannons provide direct and indirect fire support with explosive or solid projectiles, giving armies the means to break formations, batteries, and fortifications at range."
 cannon_equipment_0: "Bore Gun"
 cannon_equipment_0_desc: "Traditional bore guns are smoothbore field pieces firing round shot, shell, and canister from relatively simple carriages. They remain dependable battlefield artillery, but accuracy and range are limited by the absence of rifling."
 cannon_equipment_1: "Smoothbore Gun"
 cannon_equipment_1_desc: "Refined smoothbore field guns use improved metallurgy, powder charges, carriages, and ammunition to extend useful range and reliability. They represent the final development of traditional cannon before rifled artillery becomes dominant."
 rifled_cannon_equipment_0: "RML Field Gun"
 rifled_cannon_equipment_0_desc: "Rifled muzzle-loading field guns spin their projectiles for greater range and accuracy, bringing a major improvement over traditional smoothbore artillery."
 rifled_cannon_equipment_0_improved: "RML Field Gun"
 rifled_cannon_equipment_0_improved_desc: "Refined rifling, stronger barrels, and improved ammunition increase the accuracy, range, and reliability of rifled muzzle-loading field guns."
 rifled_cannon_equipment_1: "RBL Field Gun"
 rifled_cannon_equipment_1_desc: "Rifled breech-loading field guns combine spin-stabilized projectiles with loading from the rear of the barrel. Crews can fire faster while remaining behind the gun, and elongated shells provide greater range and accuracy."
 rifled_cannon_equipment_2: "1870 Field Gun"
 rifled_cannon_equipment_2_desc: "Modern steel field guns employ stronger breech mechanisms, improved shells, and more reliable firing systems. Faster loading and better ballistic performance allow batteries to deliver accurate, sustained fire at ranges earlier artillery could not reach."
 siege_gun_0: "Siege Gun"
 siege_gun_0_desc: "Heavy siege guns use large-caliber shells to batter masonry forts, earthworks, and other fixed defenses that ordinary field artillery struggles to defeat."
 siege_gun_1: "Siege Gun II"
 siege_gun_1_desc: "Improved siege artillery uses stronger barrels and better ammunition to deliver heavier shells with greater range and accuracy against fortified positions."
 siege_gun_2: "Siege Gun III"
 siege_gun_2_desc: "More advanced recoil systems and carriages make heavy siege guns easier to serve while increasing sustained fire against trenches, forts, and hardened targets."
 siege_gun_3: "Siege Gun IV"
 siege_gun_3_desc: "Modernized siege pieces combine improved metallurgy, high-explosive shells, and better fire control to demolish deep fieldworks and reinforced defensive positions."
 siege_gun_4: "Siege Gun V"
 siege_gun_4_desc: "Heavy siege artillery with long-range fire-control methods can strike fortifications from safer positions while concentrating destructive fire on selected strongpoints."
 siege_gun_5: "Siege Gun VI"
 siege_gun_5_desc: "Late-generation siege guns represent the peak of conventional super-heavy artillery, combining enormous shells, improved mounting systems, and precise survey methods for deliberate bombardment."
 howitzer_equipment_0: "Howitzer"
 howitzer_equipment_0_desc: "Early howitzers fire explosive shells on a high, curved trajectory, allowing batteries to strike troops and fortifications hidden behind terrain or fieldworks. Their shorter barrels make them lighter than comparable siege guns."
 howitzer_equipment_1: "Rifled Howitzer"
 howitzer_equipment_1_desc: "Rifling gives the howitzer improved accuracy and range while retaining the high-angle fire that makes it valuable against entrenchments and reverse-slope positions. Better shells further increase its destructive effect."
 rocket_artillery_equipment_0: "Congreve Rocket"
 rocket_artillery_equipment_0_desc: "Congreve rockets provide artillery with a light, portable weapon capable of carrying incendiary or explosive warheads over considerable distance. Accuracy is poor, but massed launches can disrupt troops, fortifications, and urban targets."
 rocket_artillery_equipment_1: "Hale Rocket"
 rocket_artillery_equipment_1_desc: "Hale rockets use spin stabilization rather than a long guide stick, improving accuracy and simplifying handling. The design makes rocket artillery more practical for field use while retaining its ability to deliver sudden salvos."
 cavalry_equipment_0: "Horse and Tack"
 cavalry_equipment_0_desc: "Military saddles, bridles, tack, and field gear allow cavalry mounts to carry riders and equipment efficiently over long marches and during combat."
 camel_equipment: "Camels"
 camel_equipment_desc: "Camels provide reliable military transport and cavalry mobility across deserts and arid regions where horses require more water and fodder. Proper saddles, tack, and handling equipment turn them into effective operational mounts."
 camel_equipment_0: "Camels"
 camel_equipment_0_short: "Camels"
 camel_equipment_0_desc: "Military camel equipment includes saddles, tack, packs, and specialized handling gear for mounted troops. It allows cavalry and scouts to travel long distances through hot, dry terrain with a smaller logistical burden."
 transport_equipment_0: "Covered Wagon"
 transport_equipment_0_desc: "Covered wagons protect food, ammunition, medical stores, and other supplies from weather while moving with an army. Standardized wagons and harnesses form the backbone of pre-motorized military logistics."
 horse_artillery_equipment: "Horse Limber"
 horse_artillery_equipment_desc: "Horse artillery uses teams, limbers, ammunition chests, and light field pieces organized for rapid movement. Mounted crews can redeploy with cavalry or exploit gaps far faster than conventional foot artillery."
 horse_artillery_equipment_0: "Horse Limber"
 horse_artillery_equipment_0_desc: "A horse-drawn limber carries ammunition and allows a gun crew to move artillery rapidly enough to support mobile formations in the field."
 uniform_equipment_0: "Napoleonic Uniform"
 uniform_equipment_0_desc: "Napoleonic-era uniforms emphasize standardized coats, headgear, leather equipment, and visible unit distinctions. They improve organization and discipline, but offer little protection and place appearance above field concealment."
 uniform_equipment_1: "Victorian Uniform"
 uniform_equipment_1_desc: "Mid-century field uniforms simplify earlier parade dress and improve belts, cartridge boxes, packs, and footwear. Better load carriage helps soldiers march farther while keeping ammunition and personal equipment accessible."
 uniform_equipment_2: "1850 Uniform"
 uniform_equipment_2_desc: "Improved cloth, stitching, boots, and web gear make uniforms more durable under campaign conditions. Practical field wear increasingly replaces elaborate dress features that add cost without helping the soldier fight."
 uniform_equipment_3: "1864 Uniform"
 uniform_equipment_3_desc: "The 1860s uniform places greater emphasis on mobility, weather protection, and standardized field equipment. Lighter garments and better load-bearing gear reduce fatigue during long marches and extended campaigning."
 uniform_equipment_4: "1872 Uniform"
 uniform_equipment_4_desc: "Late nineteenth-century uniforms begin adopting subdued colors and simpler cuts as rifled weapons make conspicuous dress increasingly dangerous. Improved packs and field equipment support longer operations away from depots."
 uniform_equipment_5: "1878 Uniform"
 uniform_equipment_5_desc: "More practical field uniforms use hard-wearing cloth, improved boots, and increasingly standardized web equipment. Reduced ornamentation and muted colors reflect the growing importance of concealment on the modern battlefield."
 uniform_equipment_6: "1887 Uniform"
 uniform_equipment_6_desc: "Industrial textile production allows armies to issue durable, standardized uniforms in large numbers. Better pockets, load carriage, and weather protection help soldiers sustain longer periods in the field."
 uniform_equipment_7: "1895 Uniform"
 uniform_equipment_7_desc: "Turn-of-the-century field dress increasingly favors khaki, gray, and other low-visibility colors. Improved webbing and equipment distribution let soldiers carry ammunition and necessities without relying on cumbersome leather systems."
 uniform_equipment_8: "1912 Uniform"
 uniform_equipment_8_desc: "Modern field uniforms are designed around concealment, mobility, and mass production rather than parade appearance. Stronger fabrics and standardized load-bearing equipment improve endurance during industrial warfare."
 uniform_equipment_9: "1915 Uniform"
 uniform_equipment_9_desc: "Prewar uniforms incorporate practical field colors, improved webbing, and better protection from weather and terrain. Equipment is arranged for rapid access as infantry tactics place greater demands on individual soldiers."
 uniform_equipment_10: "1918 Uniform"
 uniform_equipment_10_desc: "Great War field uniforms adapt to trench combat with simpler cuts, durable cloth, improved packs, and equipment meant for prolonged exposure. Visibility and practicality matter far more than the brightly colored traditions of earlier armies."

 #AFG
 AFG_infantry_equipment_rifle_0: "Jezail"
 AFG_infantry_equipment_rifle_0_desc: "The jezail is a long-barreled Afghan muzzle-loading firearm valued for deliberate long-range shooting in mountainous terrain. Often individually made, its reach and accuracy reward skilled marksmen more than rapid volley fire."
 AFG_infantry_equipment_rifle_0_short: "Jezail"

 #ARG
 ARG_infantry_equipment_rifle_6: "Argentinean Mauser Rifle M1891"
 ARG_infantry_equipment_rifle_6_desc: "The Argentine Model 1891 Mauser is a magazine-fed bolt-action rifle built for smokeless-powder ammunition. Its strong action, charger loading, and flat-shooting cartridge give infantry a modern repeating service arm."
 ARG_infantry_equipment_rifle_6_short: "Mauser Rifle M1891"

 #AUS
 AUS_infantry_equipment_rifle_0: "Infanteriegewehr Modell 1842 Augustin"
 AUS_infantry_equipment_rifle_0_short: "Augustin M/1842"
 AUS_infantry_equipment_rifle_1: "Infanteriegewehr Modell 1854 Lorenz"
 AUS_infantry_equipment_rifle_1_short: "Lorenz M/1854"
 AUS_infantry_equipment_rifle_2: "Infanteriegewehr Modell 1862 Lorenz"
 AUS_infantry_equipment_rifle_2_short: "Lorenz M/1862"
 AUS_infantry_equipment_rifle_3: "Werndl-Holub Modell 1867"
 AUS_infantry_equipment_rifle_3_short: "Werndl–Holub M/1867"
 AUS_infantry_equipment_rifle_4: "Werndl-Holub Modell 1873/77"
 AUS_infantry_equipment_rifle_4_short: "Werndl–Holub M/73/77"
 AUS_infantry_equipment_rifle_5: "Mannlicher Modell 1886"
 AUS_infantry_equipment_rifle_5_short: "Mannlicher M/1886"
 AUS_infantry_equipment_rifle_6: "Mannlicher Modell 1890"
 AUS_infantry_equipment_rifle_6_short: "Mannlicher M/1890"
 AUS_infantry_equipment_rifle_7: "Mannlicher Modell 1895"
 AUS_infantry_equipment_rifle_7_short: "Mannlicher M/1895"
 AUS_infantry_equipment_rifle_8: "Mannlicher–Schönauer Repeating Rifle Model 1903"
 AUS_infantry_equipment_rifle_8_short: "Mannlicher–Schönauer M/1903"
 AUS_infantry_equipment_rifle_9: "Mannlicher Repeaiting Rifle Model 1913"
 AUS_infantry_equipment_rifle_9_short: "Mannlicher M/1913"
 AUS_infantry_equipment_rifle_10: "Mauser Repeaiting Rifle Model 1898"
 AUS_infantry_equipment_rifle_10_short: "Gewehr 98"
 AUS_infantry_equipment_rifle_0_desc: "The Augustin M1842 is a muzzle-loading Austrian infantry arm using the Augustin tube-lock ignition system, a final refinement of an older generation of military firearms. Reliable enough for mass service, it is nevertheless slow to load and increasingly outclassed by percussion-cap rifles."
 AUS_infantry_equipment_rifle_1_desc: "The Lorenz M1854 replaces older Austrian tube-lock arms with a percussion-lock rifled musket designed for accurate long-range infantry fire. Its rifled barrel and modern conical ammunition give line infantry substantially better range and precision than earlier smoothbore weapons."
 AUS_infantry_equipment_rifle_2_desc: "The Lorenz M1862 is a revised form of Austria's successful percussion rifle-musket, incorporating refinements learned from years of field service and mass production. It represents the mature muzzle-loading infantry rifle just as breech-loading weapons begin to make the entire system obsolete."
 AUS_infantry_equipment_rifle_3_desc: "The Werndl-Holub M1867 marks Austria-Hungary's decisive move to metallic-cartridge breech-loaders. Its distinctive rotating-drum breech allows a soldier to reload far more quickly and reliably than with a muzzle-loader, greatly increasing practical battlefield firepower despite remaining a single-shot rifle."
 AUS_infantry_equipment_rifle_4_desc: "The improved Werndl M1873/77 adapts the proven rotating-drum action to a more powerful service cartridge and revised sights. Better ballistics and more mature manufacture extend the useful life of the single-shot Werndl system while the army prepares for magazine-fed repeating rifles."
 AUS_infantry_equipment_rifle_5_desc: "The Mannlicher M1886 introduces a straight-pull bolt and a five-round en-bloc packet magazine to Austro-Hungarian service. Instead of loading each shot individually, infantry can rapidly cycle and replenish the rifle, producing a dramatic increase in sustained fire over the Werndl."
 AUS_infantry_equipment_rifle_6_desc: "The Mannlicher M1890 refines the straight-pull system around smaller-bore 8 mm ammunition, improved sights, and a strengthened action. Clip loading and rapid bolt operation allow trained infantry to maintain a high rate of accurate fire with a lighter, flatter-shooting cartridge."
 AUS_infantry_equipment_rifle_7_desc: "The Mannlicher M1895 is the mature Austro-Hungarian straight-pull service rifle. Its robust action and five-round en-bloc clip can be worked with exceptional speed, while modern 8 mm ammunition provides the range and striking power expected of a turn-of-the-century infantry rifle."
 AUS_infantry_equipment_rifle_8_desc: "The Mannlicher-Schönauer Model 1903 combines an Austrian-designed turn-bolt action with Otto Schönauer's exceptionally smooth rotary magazine. Although most famous for its adoption by Greece, the design demonstrates how precise feeding, compact cartridges, and refined engineering can produce an unusually smooth and accurate repeating rifle."
 AUS_infantry_equipment_rifle_9_desc: "The Mannlicher Model 1913 represents a late attempt to modernize the repeating service rifle for the demands of industrial warfare. A stronger action, improved sights, and modern small-bore ammunition emphasize reliability, accuracy, and ease of mass issue over the more intricate features of earlier designs."
 AUS_infantry_equipment_rifle_10_desc: "Adopting the Gewehr 98 pattern provides a rugged Mauser turn-bolt action, a five-round internal magazine loaded by charger, and powerful smokeless-powder ammunition. Its strength, reliability, and simple battlefield handling make it an excellent standard for modern mass infantry armies."

 #BAD
 BAD_infantry_equipment_rifle_0: "Infanteriegewehr M/1842"
 BAD_infantry_equipment_rifle_0_desc: "The Infanteriegewehr M/1842 represents the mid-century transition toward more reliable percussion infantry arms. Its service pattern improves ignition reliability and battlefield handling while retaining the familiar muzzle-loading drill of earlier muskets."
 BAD_infantry_equipment_rifle_0_short: "Gewehr M/1842"
 BAD_infantry_equipment_rifle_1: "Vereinsgewehr M/1857"
 BAD_infantry_equipment_rifle_1_desc: "The Vereinsgewehr M/1857 was a standardized South German percussion rifle-musket using Minié-type ammunition. Its rifled barrel and common pattern improved accuracy, ammunition compatibility, and logistical standardization among adopting states."
 BAD_infantry_equipment_rifle_1_short: "Gewehr M/1857"
 BAD_infantry_equipment_rifle_2: "Badisches Infanteriegewehr M/1861"
 BAD_infantry_equipment_rifle_2_desc: "The Badisches Infanteriegewehr M/1861 is a percussion rifle-musket developed for Baden service as rifled infantry arms become standard. Improved sights, rifling, and expanding ammunition give line troops greater accuracy and useful range than earlier smoothbores."
 BAD_infantry_equipment_rifle_2_short: "Gewehr M/1861"
 BAD_infantry_equipment_rifle_3: "Dreyse Zündnadelbüchse M/65"
 BAD_infantry_equipment_rifle_3_desc: "The Dreyse needle gun uses a bolt-operated breech and self-contained paper cartridge ignited by a long firing needle. Soldiers can reload while prone and fire far faster than troops armed with conventional muzzle-loaders."
 BAD_infantry_equipment_rifle_3_short: "Dreyse M/65"

 #BAV
 BAV_infantry_equipment_rifle_0: "Infanteriegewehr M/1842"
 BAV_infantry_equipment_rifle_0_desc: "The Infanteriegewehr M/1842 represents the mid-century transition toward more reliable percussion infantry arms. Its service pattern improves ignition reliability and battlefield handling while retaining the familiar muzzle-loading drill of earlier muskets."
 BAV_infantry_equipment_rifle_0_short: "Gewehr M/1842"
 BAV_infantry_equipment_rifle_1: "Infanteriegewehr M/1858"
 BAV_infantry_equipment_rifle_1_desc: "The Bavarian Infanteriegewehr M/1858 is a percussion rifle-musket built around the Minié-era doctrine of accurate long-range infantry fire. Rifling and standardized ammunition substantially improve performance over smoothbore service muskets."
 BAV_infantry_equipment_rifle_1_short: "Gewehr M/1858"
 BAV_infantry_equipment_rifle_2: "Infanteriegewehr M1842/60"
 BAV_infantry_equipment_rifle_2_desc: "The Bavarian Infanteriegewehr M1842/60 modernizes an older infantry-musket pattern with mid-century ignition and rifling improvements. The conversion extends the useful life of existing arms while giving troops better reliability and accuracy."
 BAV_infantry_equipment_rifle_2_short: "Gewehr M1842/60"
 BAV_infantry_equipment_rifle_3: "Werder-Gewehr M/1869"
 BAV_infantry_equipment_rifle_3_desc: "The Werder rifle is a fast-operating single-shot breechloader using a metallic cartridge. Its mechanically efficient action gives Bavarian infantry a much higher practical rate of fire than muzzle-loading rifle-muskets."
 BAV_infantry_equipment_rifle_3_short: "Gewehr M/1869"
 BAV_infantry_equipment_rifle_4: "Mauser Modell M/71"
 BAV_infantry_equipment_rifle_4_desc: "The Mauser Model 1871 is a robust single-shot bolt-action rifle firing a metallic black-powder cartridge. Its strong breech and simple action provide faster loading, better sealing, and greater reliability than converted muzzle-loaders."
 BAV_infantry_equipment_rifle_4_short: "Mauser M/71"
 BAV_infantry_equipment_rifle_5: "Gewehr 88"
 BAV_infantry_equipment_rifle_5_desc: "The Gewehr 88 is a magazine-fed bolt-action service rifle developed for small-caliber smokeless-powder ammunition. Charger loading and a flatter trajectory give infantry much greater sustained fire and effective range."

