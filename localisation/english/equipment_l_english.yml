 RUS_future_tank_1: "T-14 Armata"
 RUS_future_tank_1_desc: "The T-14 Armata introduces an unmanned turret, protected crew capsule, modern sensors, and provision for active-protection systems. Its layout seeks to improve crew survivability while preserving high-caliber firepower and mobility."
 RUS_future_tank_1_short: "Armata"
 RUS_future_tank_2: "T-95"
 RUS_future_tank_2_desc: "The T-95 represents a Soviet or Russian main battle tank generation built around a compact silhouette, powerful smoothbore gun, and increasingly sophisticated armor and fire control. Each successive model improves protection, mobility, and target engagement while retaining a relatively small crew and hull."
 RUS_future_tank_2_short: "T-95"
 RUS_jet_fighter_equipment_3: "Mikoyan-Gurevich MiG-19"
 RUS_jet_fighter_equipment_3_desc: "The MiG-19 is a twin-engine supersonic fighter combining swept wings, powerful cannon armament, and high climb performance. It marks the transition from first-generation jets to routine supersonic air combat."
 RUS_jet_fighter_equipment_3_short: "MiG-19"
 RUS_jet_fighter_equipment_4: "Mikoyan-Gurevich MiG-21"
 RUS_jet_fighter_equipment_4_desc: "The MiG-21 is a lightweight supersonic interceptor built around a delta wing, compact radar, and guided missiles. Its speed, simplicity, and large production run make it one of the defining fighters of the Cold War."
 RUS_jet_fighter_equipment_4_short: "MiG-21"
