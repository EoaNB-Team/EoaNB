 #JAP
 JAP_infantry_equipment_rifle_0: "Tanegashima"
 JAP_infantry_equipment_rifle_0_desc: "The Tanegashima is a Japanese matchlock arquebus descended from Portuguese firearms introduced in the sixteenth century. Simple local manufacture made it a durable standard for gun-armed infantry long after more modern locks appeared elsewhere."
