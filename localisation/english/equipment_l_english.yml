 ship_engine_steam_turbines_capital_1: "Capital Ship Steam Turbine Engine I"
 ship_engine_steam_turbines_capital_1_desc: "Steam turbines convert high-pressure steam directly into smooth rotary power, reducing vibration and allowing much greater sustained output than large reciprocating engines. Early turbine installations give the capital ship higher speed at the cost of considerable fuel consumption and demanding machinery."
 ship_engine_steam_turbines_capital_2: "Capital Ship Steam Turbine Engine II"
 ship_engine_steam_turbines_capital_2_desc: "Steam turbines convert high-pressure steam directly into smooth rotary power, reducing vibration and allowing much greater sustained output than large reciprocating engines. Improved turbine stages, gearing, and boiler practice raise efficiency and power density, letting the capital ship maintain high speed more economically and reliably."
