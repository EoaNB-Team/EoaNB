 #PIE/ITA
 PIE_infantry_equipment_rifle_1: "M1844/60 Piedmontese Percussion Rifled Musket"
 PIE_infantry_equipment_rifle_1_desc: "The M1844/60 Piedmontese percussion rifled musket modernizes an older service pattern with rifling and cap ignition. It gives infantry improved reliability and range while remaining a conventional muzzle-loader familiar to existing troops."
