 #HAN

 HAN_infantry_equipment_rifle_0: "Perkussionsbüchse M/1843"
 HAN_infantry_equipment_rifle_0_desc: "The Perkussionsbüchse M/1843 represents the mid-century transition toward more reliable percussion infantry arms. Its service pattern improves ignition reliability and battlefield handling while retaining the familiar muzzle-loading drill of earlier muskets."
 HAN_infantry_equipment_rifle_0_short: "Crause M/43"
 HAN_infantry_equipment_rifle_1: "Pickel-Infanteriegewehr M/1854"
 HAN_infantry_equipment_rifle_1_desc: "The Pickel-Infanteriegewehr M/1854 is a Hanoverian percussion infantry rifle from the transition away from smoothbore muskets. Rifling, improved sights, and more reliable cap ignition support accurate deliberate fire at greater range."
 HAN_infantry_equipment_rifle_1_short: "Pickel M/54"
 HAN_infantry_equipment_rifle_2: "Infanteriegewehr Modell 1862 Lorenz"
 HAN_infantry_equipment_rifle_2_desc: "The Infanteriegewehr Modell 1862 Lorenz is an Austrian-pattern percussion rifle-musket using a rifled barrel and expanding projectile. It gives line infantry substantially greater effective range and accuracy than older smoothbore muskets."
 HAN_infantry_equipment_rifle_2_short: "Lorenz M/1862"
 HAN_infantry_equipment_rifle_3: "Hannoversches Gewehr M/66"
 HAN_infantry_equipment_rifle_3_desc: "The Hannoversches Gewehr M/66 represents Hanoverian efforts to keep pace with the rapid shift toward breechloading infantry weapons. Faster loading and improved ammunition handling increase the volume of accurate fire available to line troops."
 HAN_infantry_equipment_rifle_3_short: "Gewehr M/66"
 #HES
 HES_infantry_equipment_rifle_0: "Infanteriegewehr M/1842"
 HES_infantry_equipment_rifle_0_desc: "The Infanteriegewehr M/1842 represents the mid-century transition toward more reliable percussion infantry arms. Its service pattern improves ignition reliability and battlefield handling while retaining the familiar muzzle-loading drill of earlier muskets."
 HES_infantry_equipment_rifle_0_short: "Gewehr M/1842"
 HES_infantry_equipment_rifle_1: "Vereinsgewehr M/1857"
 HES_infantry_equipment_rifle_1_desc: "The Vereinsgewehr M/1857 was a standardized South German percussion rifle-musket using Minié-type ammunition. Its rifled barrel and common pattern improved accuracy, ammunition compatibility, and logistical standardization among adopting states."
 HES_infantry_equipment_rifle_1_short: "Gewehr M/1857"
 HES_infantry_equipment_rifle_2: "Hessisches Vereinsgewehr M/1860"
 HES_infantry_equipment_rifle_2_desc: "The Vereinsgewehr M/1857 was a standardized South German percussion rifle-musket using Minié-type ammunition. Its rifled barrel and common pattern improved accuracy, ammunition compatibility, and logistical standardization among adopting states."
 HES_infantry_equipment_rifle_2_short: "Gewehr M/1860"
 HES_infantry_equipment_rifle_3: "Dreyse Zündnadelbüchse M/65"
 HES_infantry_equipment_rifle_3_desc: "The Dreyse needle gun uses a bolt-operated breech and self-contained paper cartridge ignited by a long firing needle. Soldiers can reload while prone and fire far faster than troops armed with conventional muzzle-loaders."
 HES_infantry_equipment_rifle_3_short: "Dreyse M/65"
 HES_infantry_equipment_rifle_4: "Gewehr 71"
 HES_infantry_equipment_rifle_4_desc: "The Mauser Model 1871 is a robust single-shot bolt-action rifle firing a metallic black-powder cartridge. Its strong breech and simple action provide faster loading, better sealing, and greater reliability than converted muzzle-loaders."
 HES_infantry_equipment_rifle_5: "Gewehr 88"
 HES_infantry_equipment_rifle_5_desc: "The Gewehr 88 is a magazine-fed bolt-action service rifle developed for small-caliber smokeless-powder ammunition. Charger loading and a flatter trajectory give infantry much greater sustained fire and effective range."
