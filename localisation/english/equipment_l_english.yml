 #USA
 USA_infantry_equipment_rifle_0: "Springfield Musket M1795"
 USA_infantry_equipment_rifle_0_desc: "The Springfield Model 1795 is a flintlock, muzzle-loading musket patterned on contemporary European service arms and produced for the expanding United States Army."
 USA_infantry_equipment_rifle_1: "Springfield Rifled Musket Model 1855"
 USA_infantry_equipment_rifle_1_desc: "The Springfield Model 1855 combines percussion ignition with rifled accuracy and the Minié-type projectile, greatly extending the effective range of standard infantry fire."
 USA_infantry_equipment_rifle_2: "Model 1861 Percussion Rifle-Musket"
 USA_infantry_equipment_rifle_2_short: "Springfield Rifle-Musket"
 USA_infantry_equipment_rifle_2_desc: "The Model 1861 percussion rifle-musket is a reliable rifled infantry weapon capable of accurate fire at ranges far beyond older smoothbore muskets."
 USA_infantry_equipment_rifle_3: "Springfield Model 1866"
 USA_infantry_equipment_rifle_3_short: "Springfield Rifle"
 USA_infantry_equipment_rifle_3_desc: "The Springfield Model 1866 converts the proven muzzle-loading rifle-musket into a breech-loading weapon, allowing soldiers to reload and fire substantially faster."
 USA_infantry_equipment_rifle_7: "M1897 Trench"
 USA_infantry_equipment_rifle_7_desc: "The M1897 pump-action shotgun delivers devastating close-range fire, making it particularly effective in trenches, raids, and other confined combat environments."
 USA_machine_gun_equipment_0: "Agar Gun"
 USA_machine_gun_equipment_0_desc: "The Agar Gun is an early rapid-fire weapon intended to increase the volume of fire available to a small crew. Though mechanically cumbersome by later standards, it points toward the battlefield role eventually filled by true machine guns."
 USA_cannon_equipment_0: "Model 1841 6-pounder Gun"
 USA_cannon_equipment_0_desc: "The Model 1841 6-pounder Gun is a muzzle-loading smoothbore field gun valued for reliability and flexibility. It can fire solid shot, explosive shell, or canister, giving artillery useful effects against infantry and field positions at typical battle ranges."
 USA_cannon_equipment_0_short: "6pdr Gun"
 USA_cannon_equipment_1: "Model 1857 12-pounder Napoleon"
 USA_cannon_equipment_1_desc: "The Model 1857 12-pounder Napoleon is a muzzle-loading smoothbore field gun valued for reliability and flexibility. It can fire solid shot, explosive shell, or canister, giving artillery useful effects against infantry and field positions at typical battle ranges."
 USA_cannon_equipment_1_short: "12pdr Napoleon"
 USA_rifled_cannon_equipment_0: "10-pounder Parrot Rifled Muzzle-Loader"
 USA_rifled_cannon_equipment_0_desc: "The 10-pounder Parrot Rifled Muzzle-Loader uses rifling and a reinforced breech to fire elongated projectiles with greater range and accuracy than smoothbore artillery. Heavy versions can batter fortifications from distances previously difficult for field guns."
 USA_rifled_cannon_equipment_0_short: "10pdr Parrot Rifle"
 USA_siege_gun_0: "200-pounder Parrot Rifled Muzzle-Loader"
 USA_siege_gun_0_desc: "The 200-pounder Parrot Rifled Muzzle-Loader uses rifling and a reinforced breech to fire elongated projectiles with greater range and accuracy than smoothbore artillery. Heavy versions can batter fortifications from distances previously difficult for field guns."
 USA_siege_gun_0_short: "200pdr Parrot Rifle"
 USA_howitzer_equipment_0: "Model 1841 12-pounder Howitzer"
 USA_howitzer_equipment_0_desc: "The Model 1841 12-pounder Howitzer is a heavy howitzer intended to throw large explosive shells on a high trajectory against fortifications, trenches, and other protected targets that direct-fire guns cannot easily reach."
 USA_howitzer_equipment_0_short: "12pdr Howitzer"
 USA_howitzer_equipment_1: "12-pounder Dahlgren Boat Howitzer"
 USA_howitzer_equipment_1_desc: "The 12-pounder Dahlgren Boat Howitzer combines a compact naval-style howitzer with a carriage suitable for boats and landing parties. It can deliver shell or canister in support of troops operating near rivers and coastlines."
 USA_howitzer_equipment_1_short: "12pdr Dahlgren"
 USA_modern_tank_equipment_2: "M48 Patton"
 USA_modern_tank_equipment_2_short: "M48"
 USA_modern_tank_equipment_2_desc: "The M48 Patton improves American postwar armored design with a more powerful gun, better armor layout, and refined fire-control systems in a conventional turreted tank."
 USA_mtb_1: "M60 Patton"
 USA_mtb_1_short: "M60"
 USA_mtb_1_desc: "The M60 Patton combines a 105 mm gun, improved armor, and a powerful diesel engine to create a dependable main battle tank for prolonged frontline service."
 USA_mtb_2: "MBT-70"
 USA_mtb_2_short: "MBT-70"
 USA_mtb_2_desc: "The MBT-70 is an ambitious joint main battle tank project featuring advanced suspension, a low-profile crew arrangement, and a gun-launcher system intended to defeat modern armor at long range."
 USA_mtb_3: "M1A1 Abrams"
 USA_mtb_3_short: "M1A1"
 USA_mtb_3_desc: "The M1A1 Abrams combines composite armor, a gas-turbine powerplant, and a 120 mm smoothbore gun to deliver high mobility, survivability, and accurate fire on the modern battlefield."
 USA_mtb_4: "M1A2 Abrams"
 USA_mtb_4_short: "M1A2"
 USA_mtb_4_desc: "The M1A2 Abrams adds improved thermal sights, digital battlefield systems, and enhanced armor to the proven Abrams platform, strengthening both situational awareness and first-shot lethality."
 USA_mtb_5: "M1A2 System Enhancement Package"
 USA_mtb_5_short: "M1A2 SEP"
 USA_mtb_5_desc: "The M1A2 System Enhancement Package improves armor, thermal imaging, electrical generation, and digital networking to keep the Abrams effective in increasingly sensor-driven warfare."
 USA_mtb_6: "M1A2C System Enhancement Package v3"
 USA_mtb_6_short: "M1A2C"
 USA_mtb_6_desc: "The M1A2C SEP v3 incorporates improved protection, power management, ammunition compatibility, and electronic architecture to prepare the Abrams for new active-protection and sensor systems."
 USA_future_tank_1: "M1A3 Abrams"
 USA_future_tank_1_short: "M1A3"
 USA_future_tank_1_desc: "The M1A3 concept seeks to retain the Abrams' firepower and protection while reducing weight, improving onboard power and sensors, and integrating the next generation of active defensive systems."
