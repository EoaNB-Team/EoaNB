 ship_fire_control_system: "Fire Control System"
 ship_fire_control_system_desc: "Naval fire-control systems combine observation, range estimation, plotting, and centralized orders so multiple guns can engage the same target. Better coordination greatly improves accuracy at long battle ranges."
 fire_control_system_0: "Crows Nest"
 fire_control_system_0_short: "Early Fire Control System I"
 fire_control_system_0_desc: "Crows nests have been used on ships since ancient times. While they may not help much with fire control, they assist in spotting enemy vessels easier - although they themselves can give the ship a more detectable profile too."
 fire_control_system_1: "Crows Nest + Telescopic Sights"
 fire_control_system_1_short: "Early Fire Control System II"
 fire_control_system_1_desc: "The addition of telescopic sights devices on our ships will make it easier to direct fire and spot other vessels."
 fire_control_system_2: "Simple Optical Rangefinders"
 fire_control_system_2_short: "Early Fire Control System III"
 fire_control_system_2_desc: "Employing rangefinders along with previous methods of fire control and spotting, we can make it even easier to spot and hit enemy vessels consistently."
 fire_control_system_3: "Simple Mechanical Fire Control System"
 fire_control_system_3_short: "Fire Control System I"
 fire_control_system_3_desc: "Using mechanical devices to construct a more reliable, flexible and modern fire control system will surely prove as the right thing to do as technology progresses."
 fire_control_system_4: "Director Control System"
 fire_control_system_4_short: "Fire Control System II"
 fire_control_system_4_desc: "By putting a centralized director control system into our military ships to assist with naval fire control, we can significantly improve organization of naval gunfire and our capabilities to cause damage."
 ship_light_battery: "Light Ship Battery"
 ship_light_battery_desc: "Light naval batteries use quick-firing guns against torpedo craft, destroyers, exposed crews, and lightly protected ships. Their relatively low weight allows many mounts and a high sustained rate of fire."
 ship_cannon_battery_0: "24-Pounder Naval Gun"
 ship_cannon_battery_0_short: "Cannon I"
 ship_cannon_battery_0_desc: "24-Pounder Naval Gun represents the heavy muzzle-loading broadside guns of the transitional sailing and early steam eras. Improved casting, ammunition, and mountings increase destructive power while retaining familiar naval gunnery methods."
 ship_cannon_battery_1: "32-Pounder Naval Gun"
 ship_cannon_battery_1_short: "Cannon II"
 ship_cannon_battery_1_desc: "32-Pounder Naval Gun represents the heavy muzzle-loading broadside guns of the transitional sailing and early steam eras. Improved casting, ammunition, and mountings increase destructive power while retaining familiar naval gunnery methods."
 ship_cannon_battery_2: "32-Pounder Naval Gun"
 ship_cannon_battery_2_short: "Cannon III"
 ship_cannon_battery_2_desc: "32-Pounder Naval Gun represents the heavy muzzle-loading broadside guns of the transitional sailing and early steam eras. Improved casting, ammunition, and mountings increase destructive power while retaining familiar naval gunnery methods."
 ship_cannon_battery_3: "Super-Heavy Smoothbore Naval Gun"
 ship_cannon_battery_3_short: "SH Cannon"
 ship_cannon_battery_3_desc: "Super-Heavy Smoothbore Naval Gun represents the heavy muzzle-loading broadside guns of the transitional sailing and early steam eras. Improved casting, ammunition, and mountings increase destructive power while retaining familiar naval gunnery methods."
 ship_RML_battery_1: "RML Naval Gun"
 ship_RML_battery_1_short: "6-inch Rifled Muzzle-Loader"
 ship_RML_battery_1_desc: "A cannon firing solid projectiles or second generation naval shells 6 inches across, and spun for stability and accuracy."
 ship_RBL_battery_1: "RBL Naval Gun"
 ship_RBL_battery_1_short: "7-inch Rifled Breech-Loader"
 ship_RBL_battery_1_desc: "A cannon firing solid projectiles or second generation naval shells 7 inches across, and spun for stability and accuracy. Loaded from the breech end of the gun for faster reloading. (Early models were almost as likely to blow up in your face as the enemies)"
 ship_hull_monitor: "Monitor Ships"
 ship_hull_monitor_desc: "monitor construction concentrates armor and heavy guns in a low-profile hull intended for coastal and river fighting, accepting limited seakeeping in exchange for protection and firepower."
 ship_hull_monitor_0: "Prototype Monitor Hull"
 ship_hull_monitor_0_desc: "monitor construction concentrates armor and heavy guns in a low-profile hull intended for coastal and river fighting, accepting limited seakeeping in exchange for protection and firepower."
 ship_hull_monitor_1: "1870 Monitor Hull"
 ship_hull_monitor_1_desc: "A shallow-draft armored monitor hull built around heavy guns and a low freeboard, making it difficult to hit and well suited to coastal or river combat."
 ship_hull_monitor_2: "1880 Monitor Hull"
 ship_hull_monitor_2_desc: "A shallow-draft armored monitor hull built around heavy guns and a low freeboard, making it difficult to hit and well suited to coastal or river combat."
 ship_hull_monitor_3: "1896 Monitor Hull"
 ship_hull_monitor_3_desc: "Improved armor, turret arrangements, and steam machinery give this monitor greater endurance and firepower while retaining its low-profile coastal-warship design."
 ship_hull_monitor_4: "1908 Monitor Hull"
 ship_hull_monitor_4_desc: "Improved armor, turret arrangements, and steam machinery give this monitor greater endurance and firepower while retaining its low-profile coastal-warship design."
 ship_hull_monitor_5: "1914 Monitor Hull"
