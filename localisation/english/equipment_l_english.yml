 twelve_frigate: "1812 Model Frigate"
 twelve_frigate_desc: "The 1812-model frigate combines a sturdy sailing hull with a heavy broadside and enough speed for independent cruising, commerce protection, and long-range patrols."
 foureight_frigate: "1848 Model Frigate"
 foureight_frigate_desc: "The 1848 frigate represents the transition from the pure sailing warship toward steam-assisted naval warfare. Stronger construction and improved machinery increase reliability and tactical freedom without abandoning broadside firepower."
 fivesix_frigate: "1856 Model Frigate"
 fivesix_frigate_desc: "The 1856 frigate pairs improved steam machinery with a refined sailing hull, giving commanders greater freedom from wind while preserving ocean-going range. Better construction supports heavier guns and higher sustained speed."
 sixone_monitor: "1861 Model Monitor Ship"
 sixone_monitor_desc: "The 1861 monitor uses a low freeboard, armored hull, and concentrated heavy armament to present a very small target in coastal combat. Its design sacrifices ocean-going comfort and seaworthiness for protection and firepower."
 sixone_frigate: "Ironclad"
 sixone_frigate_desc: "Early ironclads combine steam propulsion with iron armor over a warship hull, making them far less vulnerable to explosive shells than wooden frigates. Their appearance marks a decisive break with the age of unarmored sailing fleets."
#sixfive_frigate_desc: "Ironclads are heavily armed, making it hard to breach the hull."
 sixone_coastal: "1861 Model Gunboat"
 sixone_coastal_desc: "The 1861 gunboat combines shallow draft, steam propulsion, and heavy guns for operations close to shore. It can patrol rivers and coastlines, escort transports, and deliver direct bombardment in support of land forces."
 sixfive_monitor: "1865 Model Monitor Ship"
 sixfive_monitor_desc: "The 1865 monitor improves armor distribution, gun mounting, and machinery while retaining the low-profile coastal design. Greater firepower and reliability make the type more useful in prolonged littoral operations."
 sixfive_cruiser: "1865 Model Cruiser"
 sixfive_cruiser_desc: "The 1865 cruiser is conceived as a fast, independent warship for scouting, commerce protection, and distant service. Steam power and a balanced armament allow it to undertake missions beyond the specialized battle line."
 sixfive_frigate: "1865 Model Steam Corvette"
 sixfive_frigate_desc: "The 1865 steam corvette combines a compact ocean-going hull with dependable steam propulsion and a moderate gun battery. Its speed and range make it useful for patrol, escort, colonial service, and dispatch work."
 sixfive_coastal: "1865 Model Gunboat"
 sixfive_coastal_desc: "An improved variant of the 1861 Gunboat, with more cannons to be used for naval combat as well as shore bombardment."
 sloop: "Sloop o'War"
 sloop_desc: "A sloop-of-war is a relatively small ocean-going warship with a single gun deck, valued for economy and versatility. It can escort convoys, patrol distant stations, carry dispatches, and fight lighter vessels without the expense of a frigate."
 seventy_corvette: "1870 Model Corvette"
 seventy_corvette_desc: "The 1870 corvette emphasizes speed, economical operation, and independent cruising. Improved steam machinery and lighter construction make it well suited to coastal patrol, commerce protection, and rapid-response missions."
 seventy_frigate: "1870 Model Steam Frigate"
 seventy_frigate_desc: "The 1870 steam frigate uses more powerful machinery and stronger construction to carry a heavier battery at useful fleet speeds. It represents the final development of the traditional frigate before specialized cruiser types take over its role."
 seventy_torpedo: "1870 Model Torpedo Boat"
 seventy_torpedo_desc: "The 1870 torpedo boat exploits the emerging self-propelled torpedo: a small, fast craft can threaten ships many times its size if it closes to attack range. Minimal armor and limited endurance are accepted in exchange for speed and striking power."
 category_cavalry: "Cavalry"
 category_ranged_cavalry: "Ranged Cavalry"
 machine_gun_company: "Gatling Gun Company"
 machine_gun_company_desc: "A dedicated machine-gun company concentrates crew-served automatic weapons under trained crews and officers. Proper ammunition supply and prepared firing positions let it reinforce threatened sectors with sustained suppressive fire."
 balloon_equipment: "Balloon Equipment"
 balloon_equipment_desc: "Military balloon equipment includes envelopes, gas-generation apparatus, rigging, observation baskets, winches, and repair stores. Tethered balloons give commanders a high vantage point for reconnaissance and artillery observation."
 balloon_equipment_0: "Early Recon Balloon"
 balloon_equipment_0_desc: "Early observation balloons lift scouts above the battlefield using hydrogen or hot air, providing a view beyond hills and enemy lines. Primitive handling equipment and sensitivity to weather sharply limit their usefulness."
 balloon_equipment_1: "Recon Balloon"
 balloon_equipment_1_desc: "Improved envelopes, gas systems, tethering gear, and observation equipment allow balloons to remain aloft longer and operate more reliably. Better stability makes them increasingly useful for reconnaissance and artillery spotting."
 early_armor_train: "Armored Trains"
 early_armor_train_desc: "Armored trains combine protected locomotives and railcars with infantry compartments, machine guns, and artillery. Where railways are available, they provide mobile fire support, secure supply routes, and rapidly move troops under protection."
 early_armor_train_0: "Early Armored Train"
 early_armor_train_0_desc: "Armored Trains can be used along areas with sufficient rail infrastructure and can provide significant support to an advancing infantry company through fire support. They can also be fitted to safely carry infantry along rails, even if under heavy attack."
 

 zeppelin_equipment: "Zeppelins"
 zeppelin_equipment_desc: "Rigid airships use a metal framework to contain multiple lifting-gas cells, allowing far greater size, range, and payload than ordinary balloons. They can perform long-range reconnaissance, patrol, and strategic bombing missions."
 zeppelin_equipment_0: "Early Zeppelin"
 zeppelin_equipment_0_desc: "Early rigid airships demonstrate the military potential of powered lighter-than-air flight. Their endurance and payload permit reconnaissance and bombing at distances impossible for tethered balloons, though they remain vulnerable and weather-sensitive."
 armor_equipment_bicycle: "Bicycle"
 armor_equipment_bicycle_desc: "Pedal-Driven Bicycles allow for much more energy-efficient travel. They can be used to deliver messages along the battlefield without the needs for runners or communication infrastructure like telegraph lines."
 armor_equipment_bicycle_0: "Bicycle"
 armor_equipment_bicycle_0_desc: "Military bicycles give messengers, scouts, and light infantry quiet, inexpensive mobility on roads without consuming fuel or requiring animal fodder. Folding and reinforced frames make them practical campaign equipment."
 armor_equipment_motorcycle: "Motorcycle"
 armor_equipment_motorcycle_desc: "Motorcycles give couriers, scouts, military police, and reconnaissance troops rapid road mobility with far less fuel and maintenance than a car. Sidecars can carry passengers, radios, or light weapons."
 armor_equipment_motorcycle_0_desc: "Early motorcycles adapt small internal-combustion engines to reinforced bicycle frames, creating a fast but mechanically fragile military transport. They are especially useful for dispatch riders and reconnaissance on developed roads."
 armor_equipment_motorcycle_0: "Early Motorcycle"
 armor_equipment_motorcycle_1: "Motorcycle II"
 armor_equipment_motorcycle_1_desc: "Improved motorcycles use stronger frames, more reliable engines, and better suspension, making them practical for dispatch, reconnaissance, and liaison duties over rougher military roads."
 armor_equipment_motorcycle_2: "Motorcycle III"
 armor_equipment_motorcycle_2_desc: "Mature military motorcycles combine reliable engines, rugged tires, improved suspension, and standardized sidecars. They provide fast, flexible transport for scouts, signals personnel, and mobile support teams."
 armor_equipment_steam_car: "Steam Car"
 armor_equipment_steam_car_desc: "Steam-powered road vehicles demonstrate that troops and supplies can be moved mechanically without horses. Their heavy boilers and long startup times limit battlefield flexibility, but they form an important step toward practical military motor vehicles."
 armor_equipment_steam_car_0: "Steam Car"
 armor_equipment_steam_car_0_desc: "A lightly armored vehicle with its armament being the infantry riding it. Can be used to support divisions by adding a component that can move more quickly over terrain and resist small arms fire to some degree."
 helmet_equipment: "Helmets"
 helmet_equipment_desc: "Infantry Helmets, for protection from shrapnel, bullets, and anything else that may result in head injuries."
 helmet_equipment_0: "Early Helmet"
 helmet_equipment_0_desc: "Early steel helmets protect the head from shell fragments, falling debris, and glancing impacts that cloth or leather headgear cannot stop. Even simple stamped designs can substantially reduce casualties in artillery-heavy warfare."
 sniper_equipment: "Sharpshooting Equipment"
 sniper_equipment_desc: "Precision rifles, optical sights, rangefinding tools, and observation gear allow trained sharpshooters and spotters to identify and engage important targets at long range."
 sniper_equipment_0: "M1903 Springfield"
 sniper_equipment_0_desc: "The M1903 Springfield's accuracy and strong bolt-action design make it a suitable basis for a dedicated sharpshooting rifle when paired with quality sights and ammunition."
 infantry_equipment_shotgun_0: "Winchester M1897"
 infantry_equipment_shotgun_0_desc: "The first Pump-Action Slide shotguns were constructed during the end of the 19th century, and, though proven to be extremely effective in close quarters combat, were adopted very slowly throughout the world."
 infantry_equipment_shotgun_1: "Remington Model 10"
 infantry_equipment_shotgun_1_desc: "The Remington Model 10 refines the pump-action shotgun into a compact repeating weapon with smooth cycling and substantial close-range stopping power. It is particularly useful in raids, trenches, and other confined fighting."
 siege_gun_equipment: "Siege Artillery"
 siege_gun_equipment_desc: "Heavy Artillery that can launch projectiles at high angle and for long distances, making it perfect for sieging fortified positions."
 howitzer_equipment: "Howitzers"
 howitzer_equipment_desc: "Howitzers combine high-angle fire with explosive shells, allowing artillery to attack troops, trenches, and fortifications hidden from direct view. Their trajectory complements flatter-shooting field guns and heavy siege pieces."
 grain_equipment: "Grain"
 grain_equipment_desc: "Grain is a durable staple that can be milled into flour, boiled, or processed into preserved rations. Reliable grain supplies are fundamental to feeding both civilian populations and large armies in the field."
 grain_consumable: "Baked Goods"
 grain_consumable_desc: "Bread, biscuits, and other baked grain products turn bulk cereals into portable, familiar food. Proper milling and baking improve storage, distribution, and the ability to sustain troops away from local food sources."
 grain_consumable_short: "Baked Goods"
 ship_hull_gunboat: "Gunboats"
 ship_hull_gunboat_desc: "gunboat construction emphasizes shallow draft, compact machinery, and useful gun power for rivers, colonial stations, coastal patrol, and shore bombardment."
 ship_hull_gunboat_0: "Bomb Ketch"
 ship_hull_gunboat_0_desc: "An early Gunboat, created by fitting two moderately large or a single massive low velocity mortar to the prow of a strongly reinforced ship-hull to fire explosive shells at fortifications."
 ship_hull_gunboat_1: "1850 Gunboat Hull"
 ship_hull_gunboat_1_desc: "A shallow-draft gunboat hull designed for coastal waters and riverine service, with stronger framing and steam machinery allowing heavier guns to be carried close to shore."
 ship_hull_gunboat_2: "1860 Gunboat Hull"
 ship_hull_gunboat_2_desc: "Improved iron construction and more efficient steam propulsion let this gunboat carry heavier shell guns while retaining the shallow draft needed for coastal bombardment and patrol."
 ship_hull_gunboat_3: "1868 Gunboat Hull"
 ship_hull_gunboat_3_desc: "Improved iron construction and more efficient steam propulsion let this gunboat carry heavier shell guns while retaining the shallow draft needed for coastal bombardment and patrol."
 ship_hull_gunboat_4: "1884 Gunboat Hull"
 ship_hull_gunboat_4_desc: "Improved iron construction and more efficient steam propulsion let this gunboat carry heavier shell guns while retaining the shallow draft needed for coastal bombardment and patrol."
 ship_hull_gunboat_5: "1890 Gunboat Hull"
 ship_hull_gunboat_5_desc: "A mature steel gunboat hull with better compartmentalization, range, and machinery, suited to colonial patrols, river operations, and shore bombardment."
 ship_hull_gunboat_6: "1905 Gunboat Hull"
 ship_hull_gunboat_6_desc: "A mature steel gunboat hull with better compartmentalization, range, and machinery, suited to colonial patrols, river operations, and shore bombardment."
 ship_hull_gunboat_7: "1914 Gunboat Hull"
 ship_hull_gunboat_7_desc: "A mature steel gunboat hull with better compartmentalization, range, and machinery, suited to colonial patrols, river operations, and shore bombardment."
 ship_hull_gunboat_8: "1935 Gunboat Hull"
 ship_hull_gunboat_8_desc: "A modernized gunboat hull combines steel construction, improved fire control, and better anti-aircraft protection for escort, patrol, and coastal fire-support duties."
 ship_hull_gunboat_9: "1950 Gunboat Hull"
 ship_hull_gunboat_9_desc: "Wartime lessons produce a more survivable gunboat with improved damage control, sensors, and automatic weapons while preserving the class's compact coastal-operating footprint."
 ship_hull_gunboat_10: "1970 Gunboat Hull"
 ship_hull_gunboat_10_desc: "Modern sensors, guided weapons, and efficient machinery transform the gunboat into a fast coastal combatant able to patrol, escort, and strike targets well beyond visual range."
 ship_hull_gunboat_11: "1985 Gunboat Hull"
 ship_hull_gunboat_11_desc: "Modern sensors, guided weapons, and efficient machinery transform the gunboat into a fast coastal combatant able to patrol, escort, and strike targets well beyond visual range."
 ship_hull_gunboat_12: "2000 Gunboat Hull"
 ship_hull_gunboat_12_desc: "A contemporary gunboat hull integrates networked sensors, precision weapons, improved signatures, and highly automated systems into a compact platform optimized for littoral warfare."
