 plane_gun_upgrade: "Weapons"
 plane_gun_upgrade_desc: "Better weapons to fight other planes with"
 cv_plane_gun_upgrade: "Weapons"
 cv_plane_gun_upgrade_desc: "Better weapons to fight other planes with"
