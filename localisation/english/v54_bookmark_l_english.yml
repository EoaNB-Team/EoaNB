 ## Bookmark: The Concert in Crisis (1 January 1854)
 V54_BOOKMARK_NAME: "The Concert in Crisis"
 V54_BOOKMARK_DESC: "Europe has survived the revolutions of 1848, but the settlement created after Napoleon is beginning to fracture. Russia and the Ottoman Empire are already at war. France seeks renewed prestige under Napoleon III. Austria struggles to preserve a multinational empire. Prussia waits for an opportunity to challenge Vienna. Britain intends to protect the balance of power while guarding a global empire."
 V54_AUS_BOOKMARK_DESC: "Franz Joseph came to the throne amid the revolutions of 1848 and holds his many lands together through the army, the bureaucracy and the Church. Russian help saved the Habsburgs in Hungary, but the war on the Danube now forces Vienna to choose between gratitude and its own interests in the Balkans. In Italy and in Germany, rivals are waiting for the empire to stumble."
 V54_PRS_BOOKMARK_DESC: "Prussia is the youngest of the great powers and the least secure. Friedrich Wilhelm IV rules a kingdom whose constitution he accepts reluctantly and whose army cannot yet match its ambitions. Austria presides over the German Confederation, while the Zollverein ties much of Germany's trade to Berlin. The Eastern war offers a choice between neutrality and a place at the table."
 V54_FRA_BOOKMARK_DESC: "Napoleon III has ruled France as emperor since 1852, backed by a plebiscite and by the memory of his uncle. His regime needs prestige abroad and prosperity at home. The quarrel over the Holy Places and Russian pressure on the Ottoman Empire offer a chance to end French isolation and to stand beside Britain."
 V54_ENG_BOOKMARK_DESC: "Britain is the workshop of the world and the first power at sea. Lord Aberdeen's coalition governs under Queen Victoria, but public opinion presses for action as Russia fights the Ottoman Empire and threatens the road to India. Ministers must weigh the balance of power in Europe against the cost of a war for which the army is poorly prepared."
 V54_RUS_BOOKMARK_DESC: "Nicholas I commands the largest army in Europe and sees himself as the guardian of the conservative order. His war against the Ottoman Empire has begun, but Britain and France are watching and the attitude of Austria is uncertain. Russia must decide how far it can press the Eastern Question before the other powers intervene."
 V54_PIE_BOOKMARK_DESC: "The Kingdom of Sardinia is the one Italian state with a constitution and a crown that looks beyond its borders. Victor Emmanuel II and his ministers are rebuilding the state after the defeat of 1849. A place beside the Western powers in the Eastern crisis could win Piedmont the attention it needs."
 V54_OTO_BOOKMARK_DESC: "Sultan Abdulmejid I rules an empire that Europe calls the sick man. His reforms are incomplete, his treasury is weak, and Russian troops have occupied the Danubian Principalities. Survival depends on the army and, above all, on whether Britain and France are willing to defend Constantinople."
 V54_DEN_BOOKMARK_DESC: "Frederick VII rules a monarchy that includes Danish and German lands. The London Protocol of 1852 settled the succession, but German nationalism and the status of Schleswig and Holstein remain unresolved. Copenhagen must keep the peace with larger neighbours."

