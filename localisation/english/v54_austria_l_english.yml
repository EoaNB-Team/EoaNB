 ## 40 - the Concordat of 1855
 v54_aus.40.t: "The Concordat"
 v54_aus.40.d: "Negotiations with the Holy See have reached their end. The proposed Concordat would give the Church wide authority over education and marriage law, in return for the Church's support of the throne. The Emperor and his conservative advisers value the alliance of throne and altar; liberals and many officials fear that the state is giving up powers it took from the Church in the days of Joseph II.\n\nThe Emperor must decide whether to sign."
 v54_aus.40.a: "$V54_HISTORICAL_MARK$ Sign the Concordat.\n§gHistorically: the Concordat was signed in August 1855 and gave the Church wide control over education and marriage law.§!"
 v54_aus.40.b: "Refuse. The state keeps its authority over the Church."
 v54_tt_aus_concordat_decided: "The Concordat question has been decided"
