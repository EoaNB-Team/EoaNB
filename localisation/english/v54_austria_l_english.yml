 ## Categories, tooltips
 v54_decisions_category_aus_federal_empire: "A Federal Empire"
 v54_decisions_category_aus_federal_empire_desc: "The Empire is to be reformed on federal lines, giving every crown land a voice. The work is slow, and each step costs political capital."
 v54_decisions_category_aus_german_settlement: "The German Settlement"
 v54_decisions_category_aus_german_settlement_desc: "Austria has won the German war. What it makes of the victory will decide the future of the Confederation."
 v54_tt_crimean_war_over: "The Crimean War is over"
 v54_aus_fed_progress_tt: "Federal reform has reached 75 progress"
 v54_aus_gc_progress_tt: "Confederation reform has reached 65 progress"
 v54_sww73_moderate_terms: "The duchies are restored, and Prussia keeps her lands."
 v54_sww73_moderate_terms_tt: "§GThis peace marks the end of the German War.\nAustria wins without taking Prussian territory. Schleswig and Holstein are placed under the Confederation.§!\n"

 ## Ideas and opinion modifiers
 v54_idea_aus_isolated: "Austria Stands Alone"
 v54_idea_aus_isolated_desc: "Austria refused to stand beside Russia in the Eastern crisis, and no power is ready to stand beside Austria."
 v54_idea_aus_friend_of_russia: "Friend of Russia"
 v54_idea_aus_friend_of_russia_desc: "The Tsar's government remembers that Austria stood by Russia in the Eastern crisis."
 v54_idea_aus_western_sympathy: "Western Sympathy"
 v54_idea_aus_western_sympathy_desc: "Austria joined the Western powers in the Eastern crisis, and London remembers it."
 v54_idea_aus_centralist_reaction: "Centralist Reaction"
 v54_idea_aus_centralist_reaction_desc: "Vienna has refused the Hungarian demands and governs the Empire from the centre. Authority is strong, but the nationalities are not reconciled."
 v54_idea_aus_federal_reform_underway: "Federal Reform Under Way"
 v54_idea_aus_federal_reform_underway_desc: "The government has started to rebuild the Empire on federal lines, a slow and uncertain task."
 v54_idea_aus_federal_empire: "A Federal Empire"
 v54_idea_aus_federal_empire_desc: "Every crown land has a diet and a voice in the common affairs of the Empire."
 v54_idea_aus_danubian_strategy: "Danubian Strategy"
 v54_idea_aus_danubian_strategy_desc: "Having lost Germany, Vienna looks to the Balkans and the lower Danube."
 v54_idea_aus_german_federal_reform: "The Reformed Confederation"
 v54_idea_aus_german_federal_reform_desc: "The German Confederation has a common executive, a shared defence and a customs framework, with Vienna presiding."
 v54_idea_aus_german_hegemony: "Habsburg Leadership in Germany"
 v54_idea_aus_german_hegemony_desc: "Several German states follow Vienna in military and foreign affairs."
 v54_idea_pru_humiliation: "Humiliation of Prussia"
 v54_idea_pru_humiliation_desc: "The peace imposed on Prussia has left a wish for revenge."
 v54_om_vienna_settlement_fair: "A Fair Settlement"
 v54_om_vienna_settlement_harsh: "A Harsh Settlement"
 v54_om_habsburg_leadership: "Habsburg Leadership"

 ## 1 - after Koniggratz
 v54_aus.1.t: "After Königgrätz"
 v54_aus.1.d: "The Peace of Prague has excluded Austria from Germany. Defeat has emptied the treasury, shaken the throne and strengthened those in Budapest who say that only a settlement with Hungary can save the Empire. Others in Vienna answer that concession is the first step toward dissolution, while some look instead to a federal arrangement that would give every crown land a voice.\n\nThe Emperor must choose the future of the Empire."
 v54_aus.1.a: "$V54_HISTORICAL_MARK$ Negotiate with Hungary and seek a compromise.\n§gHistorically: the Ausgleich of 1867 created the Dual Monarchy, and Franz Joseph was crowned King of Hungary.§!"
 v54_aus.1.b: "Reject the Hungarian demands and govern the Empire from Vienna."
 v54_aus.1.c: "Reform the Empire on federal lines, with a voice for every crown land."

 ## 3 - federal constitution
 v54_aus.3.t: "The Federal Constitution"
 v54_aus.3.d: "After long conferences and compromise, the Emperor has sworn to uphold a constitution that gives each crown land a diet, a share of the common budget and a seat in an Imperial Senate. Hungarian leaders accepted it with reluctance and German liberals with suspicion, but the Empire now has a framework that no nationality can easily call foreign."
 v54_aus.3.a: "The Empire is a federation."

 ## 10, 11 - diplomatic position
 v54_aus.10.t: "Austria Goes to War"
 v54_aus.10.d.isolated: "Austria refused to stand beside Russia in the Eastern crisis and did not win the friendship of the Western powers either. With war against France and Piedmont at hand, no capital offers help: Russia remembers 1854, Prussia is cautious, and Britain speaks of mediation rather than action.\n\nIf Vienna fights, it fights alone."
 v54_aus.10.d.russian: "Austria stood by Russia in the Eastern crisis, and St Petersburg has not forgotten. Russian friendship will not send armies, but it makes the Tsar's government benevolent toward Austria and gives Vienna confidence on its eastern frontier while its armies march to Italy."
 v54_aus.10.d.western: "Austria joined the Western powers against Russia in the Eastern crisis, and London remembers it with some sympathy. No promise of help has been made, however, and Russia has not forgiven the Empire. The army in Italy is Vienna's only certain resource."
 v54_aus.10.a: "The Empire will rely on its own strength."
 v54_aus.11.t: "Austria and the German War"
 v54_aus.11.d.isolated: "Austria refused to stand beside Russia in 1854, and St Petersburg has not forgotten. Italy has allied with Prussia, Prussia is ready, and the powers watch as Vienna prepares to fight for the leadership of Germany. Only the smaller German states stand with the Emperor.\n\nIsolation has its cost."
 v54_aus.11.d.russian: "Austria stood by Russia in the Eastern crisis, and the Tsar's government is friendly. Russia will not fight for Vienna, but it will not help Prussia either, and Austria can look to the German states and to its own armies."
 v54_aus.11.d.western: "Austria joined the Western powers in the Eastern crisis, and London remembers it with sympathy. But Britain has no interest in a German war, and France is watching for what it can gain. Austria must win on the battlefield."
 v54_aus.11.a: "The Empire marches to war."

 ## 20-25 - Austrian victory in 1866
 v54_aus.20.t: "The German Question Reopened"
 v54_aus.20.d: "Prussia has sued for peace and Austria's armies hold the field. The terms of the settlement will decide whether the German Confederation survives as a Habsburg-led union, becomes a real federation, or is bent to Vienna's will. The middle states fear any change, while the military party wants Prussia broken.\n\nThe Emperor must choose a peace."
 v54_aus.20.a: "Moderate restoration: restore the Confederation and let Prussia keep her lands."
 v54_aus.20.b: "Federal reform: turn the Confederation into a working federation."
 v54_aus.20.c: "Habsburg leadership: bind the German states to Vienna, one by one."
 v54_aus.20.e: "Humiliate Prussia: Silesia returns to Austria and the Prussian state is weakened."
 v54_aus.21.t: "A Habsburg Confederation"
 v54_aus.21.d: "Three German states now look to Vienna for leadership in military and foreign affairs. Their princes keep their thrones, but their armies and diplomats follow the Emperor's lead. Berlin watches in silence, and Paris with concern."
 v54_aus.21.a: "Vienna leads Germany."
 v54_aus.22.t: "The Federal Act"
 v54_aus.22.d: "The Diet has adopted the Federal Act. The Confederation now has a common executive, a shared defence and a customs framework, with Vienna presiding and the middle states holding a real voice. For the first time since 1815 the Confederation looks like a state rather than a treaty."
 v54_aus.22.a: "A federation is born."
 v54_aus.25.t: "A Moderate Peace"
 v54_aus.25.d: "Austria has not asked for Prussian land. The duchies are to be settled under the Confederation, and the old German order is to be restored with Vienna at its head. The terms are mild, but nobody in Berlin mistakes mildness for friendship."
 v54_aus.25.a: "We must accept."

 ## 30 - Germany or the Danube
 v54_aus.30.t: "Germany or the Danube?"
 v54_aus.30.d: "The Compromise has settled Austria's place in Hungary, and Germany is closed to Vienna for now. The Empire must decide where its future lies: in the Balkans and on the lower Danube, where Ottoman weakness opens opportunities and Russia is a rival, or in a return to the German question."
 v54_aus.30.a: "$V54_HISTORICAL_MARK$ Look to the Danube and the Balkans.\n§gHistorically: after 1866 Austria-Hungary renounced German leadership and turned to the Balkans, occupying Bosnia and Herzegovina in 1878.§!"
 v54_aus.30.b: "Prepare a return to Germany."

 ## Decisions
 v54_aus_fed_1: "Convene the Nationalities Conference"
 v54_aus_fed_1_desc: "Delegates of every crown land are invited to Vienna to say what they expect of a reformed Empire. Few believe that the Emperor will listen, and fewer agree with one another."
 v54_aus_fed_2: "Empower the Crown Land Diets"
 v54_aus_fed_2_desc: "The diets of Bohemia, Galicia, Croatia and the other crown lands will receive wider powers over schools, roads and local taxes, in exchange for a common imperial budget."
 v54_aus_fed_3: "Create an Imperial Senate"
 v54_aus_fed_3_desc: "An Imperial Senate with delegates from every crown land would give each nationality a voice in the common affairs of the Empire, and give the Emperor an arbiter between them."
 v54_aus_fed_4: "Proclaim the Federal Constitution"
 v54_aus_fed_4_desc: "The work of the conferences is to be set out in a constitution that the Emperor will swear to uphold."
 v54_aus_gc_1: "Federal Reform Commission"
 v54_aus_gc_1_desc: "A commission of the Confederation's governments is charged with drafting common institutions that bind the states without dissolving them."
 v54_aus_gc_2: "Common Defence and Customs"
 v54_aus_gc_2_desc: "The states are to share a defence budget and a customs framework under the Diet, with Vienna presiding."
 v54_aus_gc_3: "The Federal Act"
 v54_aus_gc_3_desc: "The Diet is asked to adopt the Federal Act and to give the Confederation a real executive."
 v54_aus_bind_BAV: "Bind [BAV.GetNameDef] to Vienna"
 v54_aus_bind_BAV_desc: "[BAV.GetNameDef] will accept Habsburg leadership in military and foreign affairs, in return for protection and guarantees."
