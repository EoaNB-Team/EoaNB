 ############ EVENTS — THE ROYAL COURT ############
 VIN_royal_court.1.t: "The Dragon Throne Must Choose"
 VIN_royal_court.1.d: "In the quiet halls of the Purple Forbidden City, Emperor Tu Duc sits upon the Dragon Throne, troubled by reports from the coast. For fifty years since Emperor Gia Long united Dai Nam, our nation has leaned on the timeless wisdom of Confucian governance, strict isolationism, and ancestral veneration.\n\nA fierce rift has split the Mandarins. The court's traditionalist faction insists that bowing to foreign pressure will destroy the moral fabric of Dai Nam and offend the ancestors. Conversely, a handful of forward-thinking scholars whisper that without Western technology, administrative reform, and open trade, Dai Nam cannot hope to defend its sovereignty. As Western warships prepare to weigh anchor, the Son of Heaven must decide the path forward."
 VIN_royal_court.1.a: "Enforce the ancient laws! Expel the foreigners and preserve our national soul!"
 VIN_royal_court.1.b: "The world moves forward. We must adapt our ways or fall to foreign guns."
 VIN_royal_court.2.t: "The Vows of the Luc Bo"
 VIN_royal_court.2.d: "In the shadow of foreign threats, Emperor Tu Duc has resolved that the strength of Dai Nam lies not in imitating barbarian institutions, but in reaffirming the eternal principles that built our Empire. Gathered before the Supreme Harmony Hall, the civil and military mandarins of the Luc Bo have renewed their sacred vows of obedience to the Throne."
 VIN_royal_court.2.a: "The ancestors are honoured."
 
 ############ EVENTS — THE SIX BOARDS ############
 VIN_six_boards.1.t: "The Six Boards"
 VIN_six_boards.1.d: "At the heart of the Imperial Citadel, the Six Ministries—Administration, Finance, Public Works, Military Affairs, Justice, and Rites—form the administrative spine of Dai Nam. Overseen by high mandarins and scholars versed in the Confucian classics, these boards manage everything from taxation and royal decrees to fortress repairs and troop levies. Yet as the world changes, these ancient institutions face mounting strain."
 VIN_six_boards.1.a: "Let each board be set in order."
 
 ############ EVENTS — THE FINANCE BOARD ############
 VIN_finance_board.1.t: "The Ministry of Revenue Convenes"
 VIN_finance_board.1.d: "Beneath the heavy tiled roofs of the Imperial Citadel, the mandarins of the Nguyen Finance Board gather for a high-stakes legislative session. Presided over by the Minister of Revenue and monitored by imperial censors, this administrative assembly dictates the economic lifeblood of Dai Nam. Operating under the strict, traditionalist Confucian mandates of Emperor Tu Duc, the Board faces the monumental task of balancing an isolationist agrarian economy against internal instability and the looming pressure of global Western expansion."
 VIN_finance_board.1.a: "Every string of cash coins shall be accounted for."
 VIN_finance_board.2.t: "The Silent Mines"
 VIN_finance_board.2.d: "The Imperial Finance Board has convened an emergency summit. Directed by the Grand Secretariat under the watchful eye of Emperor Tu Duc, this assembly brings together the empire's premier financial planners, regional tax collectors, and mint masters. The objective is singular and critical: to seamlessly integrate the newly reclaimed northern silver wealth into the national treasury, stabilizing an economy currently fractured by global trade disruptions and gathering foreign threats."
 VIN_finance_board.2.a: "Reopen the shafts."
 VIN_finance_board.3.t: "A Question of Steel"
 VIN_finance_board.3.d: "Our foundries can pour iron, but steel is another matter entirely. The Board proposes a costly experiment: import the crucibles, hire what expertise can be bought, and see whether Dai Nam can smelt its own. The mandarins are divided, and the treasury is not deep."
 VIN_finance_board.3.a: "Fund the experiment."
 VIN_finance_board.3.b: "The treasury cannot bear it."
 VIN_finance_board.4.t: "The First Attempt Fails"
 VIN_finance_board.4.d: "The crucibles cracked, the melt ran wrong, and what came out of the furnace was brittle enough to snap under a hammer. The engineers insist they understand the fault now. They ask for one more allocation."
 VIN_finance_board.4.a: "Try again."
 VIN_finance_board.4.b: "Enough has been wasted."
 VIN_finance_board.5.t: "The Second Attempt Fails"
 VIN_finance_board.5.d: "Closer this time — the melt held, but the cooling was mismanaged and the ingots came out unusable. The court's patience is nearly exhausted, though the engineers swear the process is all but solved."
 VIN_finance_board.5.a: "One final allocation."
 VIN_finance_board.5.b: "The court withdraws its support."
 VIN_finance_board.6.t: "Steel from Dai Nam Soil"
 VIN_finance_board.6.d: "The furnace at Tonkin has produced its first usable ingots. It is a modest output by European standards and the works are crude, but for the first time the Empire is not wholly dependent on imported metal."
 VIN_finance_board.6.a: "The first of many."
 VIN_finance_board.7.t: "The Court Withdraws Its Support"
 VIN_finance_board.7.d: "Three allocations spent, three failures to show for it. The Board of Revenue has closed the file, and the engineers have been reassigned. Whatever Dai Nam builds in the coming years, it will build with imported metal."
 VIN_finance_board.7.a: "A costly lesson."
 
 ############ EVENTS — THE JUSTICE BOARD ############
 VIN_justice_board.1.t: "The Catholic Question"
 VIN_justice_board.1.d: "How will we answer the Catholic question which pressures our nation and people so severely? The conservative mandarins demand ruthless enforcement of the imperial decrees and the exile of every foreign priest. Others warn that harsh suppression is precisely the pretext Paris and Madrid are waiting for."
 VIN_justice_board.1.a: "The decrees will be enforced. Let the foreigners rage."
 VIN_justice_board.1.b: "Halt the persecutions. We need time more than we need purity."
 
 ############ EVENTS — THE MILITARY AFFAIRS BOARD ############
 VIN_military_board.1.t: "Whose Designs Shall We Copy?"
 VIN_military_board.1.d: "The reverse-engineering workshops near the Imperial Citadel are ready, but they need patterns to work from. Each of the great powers would be pleased to see its rifles in Vietnamese hands — and each would expect something in return."
 VIN_military_board.1.a: "The British pattern."
 VIN_military_board.1.b: "The Prussian pattern."
 VIN_military_board.1.c: "The French pattern."
 
 ############ EVENTS — FOREIGN DIPLOMACY ############
 VIN_diplomacy.1.t: "An Approach to Bangkok"
 VIN_diplomacy.1.d: "If Dai Nam and Siam remain divided, French gunboats will swallow us piecemeal. Our emissaries stand ready to cross the western marches and propose what no Vietnamese court has ever proposed to a Siamese one: an alliance. Bangkok may well laugh them out of the audience hall."
 VIN_diplomacy.1.a: "Send the emissaries."
 VIN_diplomacy.1.b: "We will stand alone."
 VIN_diplomacy.2.t: "The Phnom Penh Summit"
 VIN_diplomacy.2.d: "Our diplomat has returned from Phnom Penh with the summit's outcome sealed in his dispatch case."
 VIN_diplomacy.2.a: "Open it."
 VIN_diplomacy.3.t: "Negotiations Remain Stagnant"
 VIN_diplomacy.3.d: "Ten weeks of talks, and neither delegation would concede the smallest point of precedence. The Khmer court remains suspended between two masters exactly as before, and both sides have gone home to sharpen their arguments for next time."
 VIN_diplomacy.3.a: "Nothing has changed."
 VIN_diplomacy.4.t: "A Kingdom Divided in Two"
 VIN_diplomacy.4.d: "Neither Hue nor Bangkok would accept the other's suzerainty, so both accepted a share of it. Cambodia remains whole on the map and hollow in fact — its court pays tribute in two directions and commands nothing of its own."
 VIN_diplomacy.4.a: "A settlement of sorts."
 VIN_diplomacy.5.t: "The Mekong Line"
 VIN_diplomacy.5.d: "Against every expectation, the summit produced a partition. The Khmer lands have been divided between the two courts, and the ancient dispute that has bled both kingdoms for generations is closed — on paper, at least."
 VIN_diplomacy.5.a: "The western flank is secure."
 
 ############ WESTERN INFLUENCE — BALANCE OF POWER ############
