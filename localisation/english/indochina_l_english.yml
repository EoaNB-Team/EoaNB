 # Characters
 VIN_character_nguyen_tu_duc_desc: "Tu Duc was not the oldest son when he became emperor which caused resentment in his older brother, Nguyen Phuc Hong Bao who subsequently tried to both seize the throne in a coup and, when that failed, to start a rebellion, he was eventually forced to commit suicide in 1854 and his four sons were banished from court, presumably to not stir anymore trouble.(One of the sons, Nguyen Phuc Ung Dao, would start a short-lived rebellion under the name Dinh Dao in 1866. The result was that all four sons were put to death, with their mother).\n\nTu Duc continued his policy of isolating Vietnam from the outside world and refusing to modernize the country. He was hostile towards Catholic missionaries and everyone who converted to Christianity fearing, not fully unfounded, that the Catholic Christians would eventually rebel against his rule.\n\nWhen Tu Duc ignored the French diplomat Charles de Montigny’s attempt to negotiate a trade deal between France and Vietnam the latter opened fire on the Vietnamese port of Da Nang as a warning to Tu Duc to stop the prosecution of Christians. Instead of heeding the warning the emperor increased the prosecution of Christians, convinced that they were plotting with foreign enemies. Despite repeated warnings that this was a suicidal policy he refused to budge and in 1859 the French, together with the Spanish, returned in force capturing Saigon. Despite fighting bravely, the Vietnamese army with antiquated weapons and tactics, didn’t stand a chance against the French. First after losing against the French in southern Vietnam, new rebellions popping up over the country and the French army marching towards his capital did Tu Duc stop the prosecution of the Catholics and liberalized his religious policies.\n\nTu Duc was forced to make humiliating concessions to the French in the treaty of Saigon in 1862 in which he was forced to cede the three southern provinces Bien Hoa, Gia  Dinh and  Dinh Tuong, the island of Poulo Condor and the city of Saigon.\n\nHumiliating as these concessions were Tu Duc preferred to make them so he could deal with the rebels that would most likely dispose and/or kill him.\n\nDespite being comprehensively defeated by the French, Tu Duc maintained his resistance to any kind of meaningful reform to open up and modernize Vietnam setting the stage for further French conquests. He did not live to see these conquests however when he died in 1883.  He would be the last independent ruler of Vietnam."
 VIN_character_nguyen_duc_duc_desc: "He was considered to decadent to rule by his uncle and predecessor, Tu Duc who had chosen another person as the successor. But Tu Duc three regents, controversially, appointed Duc Duc instead only to have him killed three days later for unclear reasons."
 VIN_character_nguyen_hiep_hoa_desc: "Hiep Hoa first task was to reassert his family’s claim to the throne after Duc Duc. He must then decide what to do regarding the so-called Black Flag Army, a group of brigands that has assisted the Nguyen emperors in the fight against the French. As late as May 19th of this year the Black Flag managed to defeat a small force at Tonkin and kill its commander this has angered France and the risk of a greater French attack cannot been ruled out. Hiep Hoa has only a short time to mend fences with the French this would of course risk a future clash with the Black Flag Army and any Vietnamese that are against French rule."
 VIN_character_nguyen_kien_phuc_desc: "As predicted and feared, Kien Phuc died after a little more than 6 months on the throne. The throne has now gone to 12-year-old Ham Nghi who is too young to lead. The French, who have become extremely irritated by the constant resistance from the Vietnamese to their rule decided it was time to gain direct rule of Vietnam. Accordingly, the new French military commander, General Count Roussel de Courcy, demands that the young emperor to come down from his throne and greet him as an equal, adding to the insult de Courcy rejected the gifts the emperor had sent him and demanded tribute from the Vietnamese!\n\nSurely this affront cannot stand. It is time to throw the arrogant French out and return Vietnam to its former glory."
 VIN_character_nguyen_ham_nghi_desc: "As predicted and feared, Kien Phuc died after a little more than 6 months on the throne. The throne has now gone to 12-year-old Ham Nghi who is too young to lead. The French, who have become extremely irritated by the constant resistance from the Vietnamese to their rule decided it was time to gain direct rule of Vietnam. Accordingly, the new French military commander, General Count Roussel de Courcy, demands that the young emperor to come down from his throne and greet him as an equal, adding to the insult de Courcy rejected the gifts the emperor had sent him and demanded tribute from the Vietnamese!\n\nSurely this affront cannot stand. It is time to throw the arrogant French out and return Vietnam to its former glory."
 VIN_character_nguyen_dong_khanh_desc: "Time and time again have our French friends showed us that the old ways have ran their course. It is time to embrace western civilization to allow Vietnam to prosper under French protection. Let the fools around Ham Nghi and all their followers suffer under the French guns."
 VIN_character_nguyen_duy_tan_desc: ""
 VIN_character_nguyen_thanh_thai_desc: "Young and intelligent, Thanh Thai knows that he is being constantly watched by the French oppressors. He can’t even feel safe in his palace, if there was only a way to fool them. Is there a possibility to make them look away so the emperor can prepare for the right moment to finally overthrow the oppressors?\n \nIt is clear now that any kind of open rebellion is nothing more than political suicide and would cause untold harm to his beloved people, but one more day of French colonial rule is one to many. Could there be a third way to resist? Something so sneaky that the French won’t know what is coming until it is too late?"

 ############ FOCUS TREE — THE ROYAL COURT ############
 VIN_the_royal_court: "The Royal Court"
 VIN_the_royal_court_desc: "The Imperial Court at Hue remains the beating heart of Dai Nam. Here, under the eaves of the Supreme Harmony Hall, the Emperor and his trusted Mandarins must address the growing fractures within our realm and set a definitive course for our nation's future."
 VIN_the_isolationists: "The Isolationists"
 VIN_the_isolationists_desc: "To protect the realm from foreign corruption, we must double down on the \"Closed-Door\" policy (Be quan toa cang). By restricting foreign trade to tightly controlled ports and expelling subversive elements, we ensure that our sacred soil remains untainted by barbarian ambition."
 VIN_imperial_roots: "Imperial Roots"
 VIN_imperial_roots_desc: "Our strength lies not in imitating foreign novelties, but in the eternal principles of our ancestors. By reaffirming the authority of the Six Ministries and the Confucian scholar-gentry across the provinces, we fortify the Mandate of Heaven against any storm."
 VIN_board_of_censors: "Board of Censors"
 VIN_board_of_censors_desc: "The Do Sat Vien—the Imperial Board of Censors—serves as the eyes and ears of the Dragon Throne. Expanding their authority allows us to root out administrative corruption, suppress illegal foreign doctrines, and enforce absolute loyalty across every level of government."
 VIN_the_western_aspirants: "The Western Aspirants"
 VIN_the_western_aspirants_desc: "A quiet faction of forward-thinking scholars and merchants argues that isolation is a death sentence. To preserve Dai Nam's sovereignty, we must cast off rigid dogma, embrace open trade, and learn the methods of the great industrial powers before it is too late."
 VIN_send_advisors_to_europe: "Send Advisors to Europe"
 VIN_send_advisors_to_europe_desc: "If we are to match the economic might of the West, we must study them directly. Dispatching diplomatic missions and promising young scholars to Berlin, London, and Vienna will allow us to bring vital modern science back to Hue."
 VIN_the_educated_emperor: "The Educated Emperor"
 VIN_the_educated_emperor_desc: "The Son of Heaven must lead by example. By expanding the monarch's education beyond classical Confucian texts to include modern statecraft, world geography, and military strategy, the throne itself becomes the primary champion of our nation's modernization."
 VIN_western_books: "Western Books"
 VIN_western_books_desc: "Knowledge is the ultimate weapon. Translating foreign treatises on engineering, metallurgy, medicine, and tactics into Sino-Vietnamese will break the intellectual isolation of our scholarly class and lay the groundwork for domestic industrial development."
 VIN_international_law: "International Law"
 VIN_international_law_desc: "Gunboats only respect treaties and international recognition. By adopting Western legal standards, establishing formal diplomatic channels, and engaging with the European law of nations, we strip foreign powers of their easy pretexts for invasion."
 
 ############ FOCUS TREE — THE SIX BOARDS ############
 VIN_the_six_boards: "The Six Boards"
 VIN_the_six_boards_desc: "At the heart of the Imperial Citadel, the Six Ministries—Administration, Finance, Public Works, Military Affairs, Justice, and Rites—form the administrative spine of Dai Nam. Overseen by high mandarins and scholars versed in the Confucian classics, these boards manage everything from taxation and royal decrees to fortress repairs and troop levies. Yet as the world changes, these ancient institutions face mounting strain. Reorganizing and empowering the Six Boards is essential if the crown is to govern efficiently and enforce its authority across every province."
 
 ############ FOCUS TREE — THE ADMINISTRATION BOARD ############
 VIN_the_administration_board: "The Administration Board"
 VIN_the_administration_board_desc: "As internal unrest and foreign threats loom, our traditional administrative machinery often struggles under the weight of slow-moving correspondence and court rivalries. Restructuring the central administration board establishes a modernized cabinet of chief ministers. By granting this unified executive body clear oversight over provincial governors, we enforce strict royal accountability, curb local corruption, and create a state apparatus built for rapid crisis management."
 VIN_confucian_foundations: "Confucian Foundations"
 VIN_confucian_foundations_desc: "By reasserting our traditional Confucian values and moral governance, we solidify the authority of the scholar-mandarins, strengthen national unity, and fortify the social fabric of the realm."
 VIN_the_vast_bureaucracy: "The Vast Bureaucracy"
 VIN_the_vast_bureaucracy_desc: "A sprawling network of scholar-mandarins and clerks controls every facet of administration across the realm. While this vast bureaucracy enforces imperial law and collects taxes down to the smallest village, its sheer weight slows government action to a crawl."
 VIN_centralized_collection: "Centralized Collection"
 VIN_centralized_collection_desc: "By bypassing local middlemen and standardizing tax registries under the Board of Finance, we ensure all provincial grain and revenue flow directly into the central treasury in Hue."
 
 ############ FOCUS TREE — THE FINANCE BOARD ############
 VIN_the_finance_board: "The Finance Board"
 VIN_the_finance_board_desc: "The Ministry of Revenue (Bo Ho) at Hue must pivot from passive ledger-keeping to aggressive economic mobilization. By streamlining the grand tax auditing (Tra hach) and expanding the authority of imperial commissioners, we will eliminate local bureaucratic corruption and establish a highly centralized treasury. This focus ensures every string of cash coins and every ounce of silver across the realm is accounted for, providing the state with the raw capital required to fund state infrastructure and secure our borders."
 VIN_expand_the_mining_industry: "Expand the Mining Industry"
 VIN_expand_the_mining_industry_desc: "Deep within the rugged mountains of the northern borderlands lie vast, untapped veins of mineral wealth. The state must assert direct control over these remote territories, funding heavy engineering projects to clear collapsed shafts and construct fortified imperial smelting outposts. By transforming the northern highlands into a regulated industrial core, we will secure a steady supply of silver, zinc, and copper—essential assets for stabilizing our domestic currency and building a modern defensive military."
 VIN_invest_in_local_markets: "Invest in Local Markets"
 VIN_invest_in_local_markets_desc: "The true strength of Dai Nam lies not in foreign luxury goods, but in the bustling daily markets of our towns and rural communes. We will slash domestic transit tariffs, dredge vital trade canals, and inject standard zinc and copper coinage directly into provincial trade hubs. Stimulating the circulation of domestic goods—such as silk, ceramics, and agricultural surplus—will foster a self-reliant economy, enrich the merchant class, and ensure the unwavering loyalty of the peasantry."
 VIN_look_to_foreign_markets: "Look to Foreign Markets"
 VIN_look_to_foreign_markets_desc: "The traditional policy of isolation (Be quan toa cang) can no longer sustain the empire in an age of global steam and iron. We must look beyond our shores and transform port cities like Tourane and Saigon into booming international emporiums. By lowering tariffs for friendly European powers, establishing state-monitored merchant consulates, and exporting our massive agricultural and mineral surpluses directly to the global stage, Dai Nam will secure the foreign gold, machinery, and modern weaponry needed to safeguard our independence."
 VIN_subsidies_for_the_mines: "Subsidies for the Mines"
 VIN_subsidies_for_the_mines_desc: "The grueling, hazardous depths of the northern mountains require an immediate injection of capital to remain profitable, but how that wealth is distributed will define the future of the frontier. We can choose to directly fund the imperial state infrastructure, establishing heavily guarded royal smelting houses and placing production firmly under the thumb of the Hue court. Alternatively, we can funnel these subsidies directly into the private coffers of the ethnic Chinese mining guilds (Hoi), offering them lucrative tax breaks and autonomy in exchange for immediate, unmatched extraction yields."
 VIN_mass_agrarianism: "Mass Agrarianism"
 VIN_mass_agrarianism_desc: "The ultimate strength of Dai Nam resides in the muddy water and golden stalks of our rice paddies. We must reaffirm our commitment to the sacred Confucian hierarchy by placing the peasant farmer above all. By launching massive state-sponsored land reclamation programs, repairing ancient river dikes, and distributing abandoned fields directly to the rural populace, we will root our empire's stability firmly in the soil. A well-fed peasantry is an unshakeable bulwark against both internal rebellion and foreign corruption."
 VIN_the_future_of_our_economy: "The Future of our Economy"
 VIN_the_future_of_our_economy_desc: "Dai Nam stands at a critical historical crossroads. Through agrarianism, we have secured our traditional core, stabilizing the countryside and honoring the sacred Confucian bonds connecting our peasantry to the land. Yet, through expanding the mining industry, we have unlocked the raw, volatile power of the northern mountains, filling our treasury with the precious metals required to survive a changing world."
 VIN_traditional_agriculture: "Traditional Agriculture"
 VIN_traditional_agriculture_desc: "Since the founding of our civilization, the rhythm of life in Dai Nam has been set by the heavy steps of the water buffalo and the seasonal rise of the rivers. The timeless methods of our ancestors—honed over generations of communal labor—remain the true foundation of imperial stability. By supporting the village communes, maintaining local irrigation ditches, and ensuring that our peasantry has undisturbed access to their ancestral plots, we preserve the social harmony mandated by heaven. A quiet and predictable countryside is the ultimate armor of the state."
 VIN_mekong_fishing: "Mekong Fishing"
 VIN_mekong_fishing_desc: "The winding, silt-rich distributaries of the Mekong Delta (Cuu Long) hold a bounty as vital to our people as the rice fields themselves. We must formalize and expand this vibrant aquatic economy. By funding the construction of larger wooden trawlers, establishing regulated riverside processing docks, and improving salt-curing networks, we can transform a decentralized artisan trade into a powerhouse food industry. Securing the riches of the Mekong will provide a cheap, abundant source of protein to sustain our growing population and fuel our national ambitions."
 VIN_rice_is_king: "Rice is King"
 VIN_rice_is_king_desc: "To rule the stomach of the peasant is to rule the heart of the empire. In the fertile floodplains of the Red River and the endless horizons of the Mekong Delta, rice is not merely a crop—it is our absolute currency, our primary export, and the ultimate measure of national power. We will decree that all agricultural focus be single-mindedly directed toward maximizing paddy yields. By standardizing the royal granary reserves and using rice to aggressively dominate regional trade, we ensure that Dai Nam remains economically unassailable."
 VIN_support_the_landlords: "Support the Landlords"
 VIN_support_the_landlords_desc: "The wealthy rural gentry and powerful land-owning clans are the true pillars of imperial order in the provinces. They possess the capital, the organization, and the local authority required to manage massive agricultural estates efficiently. Rather than disrupting this established hierarchy, the court will firmly back the landlords, granting them greater legal control over their tenants and backing their rights to collect rents. In return, these powerful families will guarantee steady, bulk tax deliveries to the imperial treasury and use their private influence to keep the rural populace strictly under control."
 VIN_support_the_communal_farmers: "Support the Communal Farmers"
 VIN_support_the_communal_farmers_desc: "The heart of our empire beats within the lang—the traditional, self-governing village communes where lands have been shared by families for generations. The greedy accumulation of property by wealthy landlords only breeds peasant landlessness, poverty, and dangerous rebellions. By enforcing strict caps on land ownership, protecting communal fields (cong dien) from being seized by elites, and offering direct imperial low-interest seed loans to village councils, we ensure that the wealth of the soil remains in the hands of those who actually toil upon it."
 VIN_contain_the_locusts: "Contain the Locusts"
 VIN_contain_the_locusts_desc: "The sky-darkening plagues that devour our fields will not be broken by prayers alone; they must be met with the same militaristic mobilization we bring to the battlefield. Imperial soldiers will be deployed to enforce emergency price ceilings on grain, preventing greedy merchants from hoarding food. By transforming the countryside into a coordinated frontline, we will crush this ecological menace, save our crops, and preserve the peace of the realm."
 VIN_combating_cholera: "Combating Cholera"
 VIN_combating_cholera_desc: "The invisible killer that poisons our lifelines and turns our crowded cities into tombs must be stamped out with absolute state authority. We will deploy the military to enforce strict quarantine zones, shutting down infested ports and sealing off contaminated water sources from the public. Imperial capital will be funneled directly to our finest traditional physicians and Western-trained medical scholars to establish emergency sanitation centers, mandate the boiling of all drinking water, and bury the victims far from living communes."
 VIN_start_the_industrial_investment: "Start the Industrial Investment"
 VIN_start_the_industrial_investment_desc: "An empire of steel requires an empire of ore. By surveying our countryside, expanding basic infrastructure, and subsidizing resource extraction, we guarantee the raw materials needed to feed our budding factories."
 VIN_invest_in_handicrafts: "Invest in Handicrafts"
 VIN_invest_in_handicrafts_desc: "Our nation's silk and cotton guilds are proven producers of wealth. By funding local artisan workshops and streamlining the distribution of raw fibers, we can maximize our traditional textile output and strengthen Dai Nam's rural economy."
 VIN_humble_factory_beginnings: "Humble Factory Beginnings"
 VIN_humble_factory_beginnings_desc: "The journey toward an industrial empire begins with a single smokestack. By constructing our first centralized manufacturing sites and introducing imported machinery, we lay the groundwork for true heavy industry."
 VIN_kick_out_chinese_competition: "Kick out Chinese Competition"
 VIN_kick_out_chinese_competition_desc: "The merchant networks of the Qing Empire dominate our domestic commerce and drain our treasury. By levying heavy foreign trade taxes, seizing key river ports, and empowering native Vietnamese merchant guilds, we reclaim control over our economy."
 VIN_early_steel_production: "Early Steel Production"
 VIN_early_steel_production_desc: "Our nation cannot modernize on imported iron alone. By combining our natural mineral reserves with modern smelting techniques, we attempt to create our first opportunity to produce industrial steel on home soil."
 VIN_hire_western_advisors: "Hire Western Advisors"
 VIN_hire_western_advisors_desc: "To build modern industry, we must learn from those who invented it. By recruiting European technical experts and industrial engineers, we dramatically accelerate the development of our mines, railways, and factories."
 VIN_tight_control_methods: "Tight Control Methods"
 VIN_tight_control_methods_desc: "To prevent foreign exploitation and civil unrest, all economic development must remain strictly under crown supervision. By enforcing rigid state monopolies and tightly controlling local production, we maintain total authority over Dai Nam's industrial future."
 
 ############ FOCUS TREE — THE PUBLIC WORKS BOARD ############
 VIN_the_public_works_board: "The Public Works Board"
 VIN_the_public_works_board_desc: "From the dikes of the Red River to the royal highways leading south to Sai Gon, Dai Nam's economic growth relies on the efficiency of the crown's builders. Reorganizing the Board of Works will centralize state labor, standardize construction materials, and grant the ministry sweeping authority to requisition timber, stone, and manpower. Through strong central planning, the empire will build the foundations of its modern future."
 VIN_the_flooding_problem: "The Flooding Problem"
 VIN_the_flooding_problem_desc: "When the river breaks its banks, the breakdown of trade and communication costs the crown vast sums in lost revenue and emergency famine relief. To secure the South, the Imperial Court must take an active role in water management. Establishing local river watch garrisons, stockpiling emergency grain in elevated granaries, and coordinating canal maintenance will ensure that when the waters rise, our order and economy do not fall with them."
 VIN_tu_ducs_tomb: "Tu Duc's Tomb"
 VIN_tu_ducs_tomb_desc: "An Emperor without an heir must carve his immortality into stone. By pouring state treasury and royal labor into a grand tomb complex, we reaffirm the eternal divine authority of the Nguyen Dynasty during a time of mounting foreign threats. The court scholars will rejoice at this grand display of tradition and piety, though the heavy taxes and brutal labor quotas risk dangerous discontent among the common folk."
 VIN_invest_in_the_rivers: "Invest in the Rivers"
 VIN_invest_in_the_rivers_desc: "Our river networks are Dai Nam's natural trade highways. Investing state capital to dredge riverbeds, construct river docks, and organize boat traffic will streamline trade and dramatically improve supply flow across the realm."
 VIN_canals_for_the_soldier_and_farmer: "Canals for the Soldier and Farmer"
 VIN_canals_for_the_soldier_and_farmer_desc: "The strength of our nation relies on moving two things efficiently: rice and troops. By directing state labor to dig new arterial canals and clear silted rivers, the Imperial Court solves two pressing challenges at once. Controlled irrigation stabilizes food supplies and protects crops from drought, while an interconnected canal network allows our garrisons to rapidly redeploy across swampy terrain that would otherwise swallow marching infantry."
 
 ############ FOCUS TREE — THE MILITARY AFFAIRS BOARD ############
 VIN_the_military_affairs_board: "The Military Affairs Board"
 VIN_the_military_affairs_board_desc: "Decades of peace have allowed military readiness to decay into bureaucratic routine. Reorganizing the Board of Military Affairs empowers senior generals to centralize command across our northern and southern military circuits. By auditing troop numbers, standardizing supply lines from imperial granaries, and inspecting coastal artillery batteries, we ensure that every garrison in Dai Nam stands ready to defend the realm at a moment's notice."
 VIN_the_centralized_military: "The Centralized Military"
 VIN_the_centralized_military_desc: "A fragmented army cannot coordinate a national defense against modern foreign invaders. Centralizing military administration under the Court in Hue allows us to establish a unified conscription registry, enforce standardized supply chains, and quickly shift strategic reserves across provincial lines. By transforming local garrisons into a professional standing army, we forge a force capable of rapid mobilization."
 VIN_perfume_river_defenses: "Perfume River Defenses"
 VIN_perfume_river_defenses_desc: "If Thuan An falls, the capital falls. By reinforcing the coastal forts guarding the entrance to the Perfume River with modern earthworks, heavy iron cannon, and riverine minefields, we create an impenetrable defensive choke point. Turning the river into a lethal kill zone buys the imperial court time to rally provincial armies and forces foreign invaders into costly, bloody land engagements."
 VIN_expanding_the_imperial_academy: "Expanding the Imperial Academy"
 VIN_expanding_the_imperial_academy_desc: "An army is only as effective as the officers who lead it. Expanding our military academies across key strategic hubs allows us to systematically train and commission professional commanders based on tactical merit rather than noble lineage. Standardizing staff officer training dramatically improves unit coordination, field planning, and battle readiness, giving our forces the tactical discipline required to turn back European expeditionary forces."
 VIN_massing_our_artillery: "Massing our Artillery"
 VIN_massing_our_artillery_desc: "In modern warfare, superior firepower dictates the battlefield. Overcoming the bottleneck of traditional metal casting, we expand our state arsenals in Hue and Gia Dinh to mass-produce heavy artillery. Standardizing gun molds, powder charges, and shot size dramatically accelerates production times, allowing us to quickly raise dedicated artillery regiments to shatter enemy formations before they reach our lines."
 VIN_matchlock_production: "Matchlock Production"
 VIN_matchlock_production_desc: "Expanding domestic matchlock manufacturing leverages local armorers to rapidly arm thousands of conscripts at minimal cost."
 VIN_look_to_western_designs: "Look to Western Designs"
 VIN_look_to_western_designs_desc: "Stubborn adherence to obsolete weapon designs is a death sentence. Overcoming traditionalist opposition, we establish dedicated reverse-engineering workshops near the Imperial Citadel. Studying Western metallurgy, lock design, and rifling techniques allows our foundries to transition from producing primitive matchlocks to modern infantry rifles, laying the groundwork for a self-sufficient domestic arms industry."
 VIN_western_gun_carriages: "Western Gun Carriages"
 VIN_western_gun_carriages_desc: "Imperial artillery has long suffered from poor mobility and slow traverse speeds. Redesigning our artillery carriages based on European field models equips our gun crews with wheeled limbers and balanced recoil systems. This crucial upgrade transforms heavy, sluggish guns into agile field batteries capable of keeping pace with infantry maneuvers and responding swiftly to enemy breakthroughs."
 VIN_supplement_with_western_stocks: "Supplement with Western Stocks"
 VIN_supplement_with_western_stocks_desc: "Relying purely on domestic foundries leaves our army dangerously under-equipped in the short term. By opening state coffers and granting trade concessions to foreign merchants, we import thousands of modern European rifles and brass ammunition. Secretly stockpiling these imported weapons across key coastal garrisons ensures our forces can meet an invading expeditionary force with modern volume of fire."
 
 ############ FOCUS TREE — THE JUSTICE BOARD ############
 VIN_the_justice_board: "The Justice Board"
 VIN_the_justice_board_desc: "A fractured nation cannot survive internal lawlessness. Banditry along rural highways, secret society subversion, and provincial malfeasance threaten to unravel the social fabric of Dai Nam. Restructuring the Board of Justice creates a modernized judicial network capable of imposing absolute state order. Through strict legal enforcement, standardized penal courts, and empowered secret police, we guarantee total obedience to Hue across every village and province."
 VIN_the_gia_long_code: "The Gia Long Code"
 VIN_the_gia_long_code_desc: "Rigorously enforcing the 398 articles of the Gia Long Code establishes a uniform legal system across Dai Nam, crushing subversion and reinforcing absolute imperial authority."
 VIN_the_catholic_situation: "The Catholic Situation"
 VIN_the_catholic_situation_desc: "The growth of the Catholic minority across Tonkin and Cochinchina has evolved from a local religious dispute into a major geopolitical crisis. While conservative mandarins demand ruthless enforcement of imperial decrees and the exile of foreign priests, harsh suppression risks provoking direct military retaliation from France and Spain. We must address the Catholic question before local unrest or foreign gunboats decide the matter for us."
 VIN_continue_persecutions: "Continue Persecutions"
 VIN_continue_persecutions_desc: "Allowing foreign enclaves to flourish in our coastal provinces is a recipe for rebellion. By empowering the Board of Justice (Bo Hinh) and local garrisons to strictly enforce anti-Christian decrees, we strip potential fifth-columnists of their networks and arrest foreign agitators before they can coordinate with European fleets. Internal security demands an iron fist, regardless of foreign outrage."
 VIN_widespread_crucifixions: "Widespread Crucifixions"
 VIN_widespread_crucifixions_desc: "Authorizing public crucifixions for foreign priests and native leaders, we unleash uncompromising brutality to obliterate underground parish networks and enforce absolute religious obedience."
 VIN_appease_the_french: "Appease the French"
 VIN_appease_the_french_desc: "By halting anti-Catholic persecutions and offering limited trade privileges to France, we defuse the immediate risk of a French invasion and buy vital time to modernize the state."
 VIN_revise_the_code: "Revise the Code"
 VIN_revise_the_code_desc: "Striking anti-Christian bans from the Gia Long Code and modernizing commercial laws aligns Dai Nam with international legal standards, safeguarding sovereignty through legal reform."
 
 ############ FOCUS TREE — THE RITES BOARD ############
 VIN_the_rites_board: "The Rites Board"
 VIN_the_rites_board_desc: "In Dai Nam, statecraft and sacred tradition are inseparable. The Bo Le stands as the supreme guardian of our cultural identity—managing everything from court rituals and ancestral rites to civil service examinations and foreign envoys. Yet in an era of encroaching Western gunboats and shifting global powers, the Board of Rites must be more than a caretaker of tradition. By reorganizing its halls, we sharpen both our ideological defense at home and our diplomatic posturing abroad."
 VIN_advisor_competency_examinations: "Advisor Competency Examinations"
 VIN_advisor_competency_examinations_desc: "A sprawling administrative state easily breeds complacency, senility, and entrenched corruption among senior councillors. Mandating mandatory competency examinations across all advisory boards forces our statesmen to stay sharp and accountable to central directives. By auditing their governance records and testing their practical knowledge, we purge dead weight from the ministry halls and streamline imperial decision-making."
 VIN_reform_education: "Reform Education"
 VIN_reform_education_desc: "The world is changing, and an educational system frozen in antiquity guarantees our collapse. Overcoming fierce resistance from conservative scholar-mandarins, the Board of Rites mandates that state-funded schools incorporate Western sciences alongside Confucian ethics. By establishing modern printing presses to translate European technical treatises and funding stipends for technical scholars, we lay the intellectual foundation required to fuel our military and economic survival."
 VIN_traditional_education: "Traditional Education"
 VIN_traditional_education_desc: "Reinforcing Neo-Confucian orthodoxy across national examinations purges foreign ideological influence and secures absolute loyalty to the Imperial Crown."
 VIN_securing_confucianism: "Securing Confucianism"
 VIN_securing_confucianism_desc: "When foreign empires seek to divide and conquer through alien doctrines, ideological hesitation is fatal. Enforcing total Confucian orthodoxy across every province allows us to weld the peasantry, the scholar-class, and the military into a single, cohesive body. By stripping heterodox sympathizers of their titles and enforcing strict adherence to imperial rites, we eliminate domestic dissent and turn traditional morality into our greatest asset against foreign invaders."
 
 ############ FOCUS TREE — NAVAL / TRADE ############
 VIN_a_ship_based_economy: "A Ship-based Economy"
 VIN_a_ship_based_economy_desc: "In a country where land transport across mountainous terrain is slow and hazardous, the sea is our primary highway. Expanding our naval economy means building state-backed shipyards, regulating coastal customs ports, and incentivizing private merchant shipping. By establishing a thriving maritime economy, we expand our revenue base through customs tariffs while creating a massive fleet of civilian vessels and experienced mariners that can be drafted into naval transport duties during times of war."
 VIN_salt_sugar_and_silks: "Salt, Sugar, and Silks"
 VIN_salt_sugar_and_silks_desc: "To build a modern industrial economy, we must first capitalize on our traditional strengths. Expanding state-backed silk workshops and granting tax credits to sugar refineries allows us to flood regional markets in East Asia with high-grade exports. Maximizing our trade surplus in these key commodities generates the steady capital required to fund heavy industrial foundries."
 VIN_expand_manufactured_trade: "Expand Manufactured Trade"
 VIN_expand_manufactured_trade_desc: "True economic independence requires selling finished manufactured products rather than raw crops. By subsidizing urban workshops in Gia Dinh, Hue, and Hanoi, we scale up the production of processed goods. Exporting manufactured textiles and iron wares to neighboring kingdoms builds a robust industrial base while insulating our economy from volatile global raw material prices."
 VIN_secure_the_singapore_trade: "Secure the Singapore Trade"
 VIN_secure_the_singapore_trade_desc: "Isolation is a slow death. By cementing formal trade agreements with British and neutral merchants operating out of Singapore, we secure a vital economic pipeline. Exchanging our rich agricultural surplus for British steel, steam parts, and telegraph equipment gives us direct access to the fruits of the Industrial Revolution without ceding sovereign territory."
 VIN_import_rubber_trees: "Import Rubber Trees"
 VIN_import_rubber_trees_desc: "Cultivating imported rubber tree saplings in the fertile southern red soils builds a vital strategic resource for future industrialization."
 VIN_the_naval_effort: "The Naval Effort"
 VIN_the_naval_effort_desc: "Reopening state shipyards and reorganizing naval administration lays the foundation to rebuild Dai Nam's coastal and riverine fleets."
 VIN_rebuild_the_great_warships: "Rebuild the Great Warships"
 VIN_rebuild_the_great_warships_desc: "Laying down heavy frigates and reinforced war junks gives Dai Nam ocean-going capital ships capable of breaking foreign blockades."
 VIN_the_brown_water_navy: "The Brown-water Navy"
 VIN_the_brown_water_navy_desc: "Our geography is our greatest weapon. By building a dedicated 'Brown-water Navy' tailored for narrow riverways and mangrove swamps, we strip foreign steam-gunboats of their tactical advantages. Equipping lightweight river vessels with heavy swivel guns, mortar barges, and submerged river-boom operators gives us absolute control over internal waterways, allowing rapid troop movement while cutting off invading forces from their coastal supply ships."
 
 ############ FOCUS TREE — FOREIGN DIPLOMACY ############
 VIN_the_imminent_conflict: "The Imminent Conflict"
 VIN_the_imminent_conflict_desc: "The looming threat from Paris is as much a war of notes and demands as it is one of ironclads. French diplomats maneuver to isolate Dai Nam on the world stage, using the safety of missionaries as a pretext for territorial coercion. In response, the Board of Rites (Bo Le) and foreign emissaries must launch an immediate counter-diplomatic campaign. By sending urgent dispatches to Peking, sounding out British intentions in Singapore, and presenting a firm, unified sovereign front, we attempt to negotiate from a position of strength before shot and shells decide our fate."
 VIN_two_birds_with_one_stone: "Two Birds with One Stone"
 VIN_two_birds_with_one_stone_desc: "The French appetite for influence in Indochina is insatiable, but direct conflict with Paris risks the destruction of our empire. Yet, every crisis carries opportunity. By quietly acceding to select French commercial demands and mission privileges, we neuter their pretext for invading our coastline. Better still, we redirect their aggressive ambitions westward toward the Kingdom of Siam—our bitter rival for control over Cambodia and Laos. By indulging European greed, we secure our northern and coastal borders while watching French gunboats shatter Siamese influence across the Mekong."
 VIN_rooster_diplomacy: "Rooster Diplomacy"
 VIN_rooster_diplomacy_desc: "Dealing with French envoys requires a keen understanding of their national pride: puff up their feathers, applaud their grand speeches, and let them believe they rule the barnyard. Our mandarins dub this strategy 'Rooster Diplomacy.' By feeding the Parisian press victory headlines and flattering their puffed-up colonial ego, we manage to keep the combative French rooster appeased with mere appearances—turning what could have been a lethal invasion into little more than loud, harmless strutting."
 VIN_the_deal_with_the_devil: "The Deal with the Devil"
 VIN_the_deal_with_the_devil_desc: "To save the tree, we have chosen to sever its branches. Recognizing that an open war with France will end in the total destruction of the Nguyen Dynasty, the Court signs a fateful treaty with Paris. We yield control of our foreign affairs, trade tariffs, and coastal garrisons, willingly stepping into the shadow of French Indochina. It is a Faustian bargain written in imperial ink: we trade our sovereign pride to preserve the dynasty, curb French military devastation, and gain the protective shield of Western steam and iron against all other foes."
 VIN_an_immovable_object: "An Immovable Object"
 VIN_an_immovable_object_desc: "Divide and conquer is the oldest trick in the European playbook. If Dai Nam and Siam remain divided, French gunboats will swallow us piecemeal. By sending high-level emissaries across the western marches, we propose a historic anti-colonial alliance with Siam. Joining our vast infantry forces with Siam's regional manpower creates a formidable regional bloc—putting a definitive halt to French expansion and proving that the sovereign kingdoms of Asia will not yield."
 VIN_the_common_enemy: "The Common Enemy"
 VIN_the_common_enemy_desc: "The royal court at Bangkok has answered our call. Recognizing that French gunboats threaten the Mekong just as ominously as the Menam, King Rama IV has agreed to bury our generations-old rivalry over Cambodia and Laos. For the first time in history, the armies of Hue and Bangkok march under a shared banner. We face a foe whose ironclads and rifles outmatch our traditional arsenals, but bound together by a common threat and fighting on home soil, our joint forces will turn every riverbend and jungle track into a death trap for foreign invaders."
 VIN_siamese_negotiations: "Siamese Negotiations"
 VIN_siamese_negotiations_desc: "True statecraft lies in knowing when to pause an ancient feud. As Western warships mass in the South China Sea, our mandarins engage in delicate talks with Siamese ministers to de-escalate tension across the western marches. A mutual non-aggression treaty guarantees that neither kingdom will exploit the other's distraction. In exchange for respecting current border demarcation lines in the Mekong basin, we secure our rear and gain a stable neighbor while we confront European coercion."
 VIN_settle_cambodia: "Settle Cambodia"
 VIN_settle_cambodia_desc: "Formalizing a territorial agreement with Siam over Cambodia settles vassal disputes, creates a stable buffer state, and secures our western flank."
 VIN_stand_defiant: "Stand Defiant"
 VIN_stand_defiant_desc: "History will record that when the shadow of Western conquest fell across Asia, the Nguyen Dynasty did not bow. Embracing a doctrine of total solitary defense, we prepare to bleed the French expeditionary force through attrition. By fortifying our coastal mouth at Da Nang, lining our rivers with heavy ironwood stakes, and rallying local partisan networks (Nghia Quan) across the provinces, we transform our land into a meatgrinder. France may command the sea, but the soil of Dai Nam belongs to us."
 VIN_power_to_the_privy_council: "Power to the Privy Council"
 VIN_power_to_the_privy_council_desc: "In times of existential crisis, the empire must speak and act with a single voice. Expanding the jurisdiction of the Secret Council concentrates emergency war powers directly into the hands of our most decisive ministers. From requisitioning grain supplies to declaring martial law in vulnerable coastal provinces, the Privy Council bypasses traditional administrative friction—transforming the imperial government into a lean, highly efficient instrument of war."
 VIN_the_war_arrives: "The War Arrives"
 VIN_the_war_arrives_desc: "Foreign gunboats no longer linger in the distance; their troops are ashore and their cannons are aimed at our cities. The unprovoked bombardment of Da Nang marks the definitive opening of hostilities with Napoleon III's empire. Reeling from the initial shock, Emperor Tu Duc dispatches his most trusted commander, Nguyen Tri Phuong, to establish defensive lines and rally the provincial garrisons. The realm is thrust into a struggle for its very existence."
 
 ############ NATIONAL SPIRITS ############
 VIN_Spirit_The_Locust_Infestation: "The Locust Infestation"
 VIN_Spirit_The_Locust_Infestation_desc: "A deafening, dark cloud hangs over the jewel of our agricultural empire. Driven by unseasonable climate shifts, massive swarms of migratory locusts have descended upon our most fertile river valleys, stripping entire provinces of their crops in a matter of days. Paddies that should be heavy with grain are reduced to barren, chewed stalks. As the insects multiply unchecked, food prices are skyrocketing in local markets, and desperate, starving peasants are fleeing their villages in search of relief."
 VIN_Spirit_Flooding_Of_The_Mekong: "Flooding of the Mekong"
 VIN_Spirit_Flooding_Of_The_Mekong_desc: "The annual monsoon surge of the Mekong River brings fertile silt to the southern fields, but renders ground transportation and infrastructure construction nearly impossible throughout the delta."
 VIN_Spirit_Catholic_Missionaries: "Catholic Missionaries"
 VIN_Spirit_Catholic_Missionaries_desc: "French and Spanish Catholic missionaries have operated across Tonkin and Cochinchina for generations, establishing underground networks, printing presses, and clandestine parishes. While their presence brings European medical and technological knowledge, the court in Hue views them with deep suspicion. The missionaries' fierce loyalty to Rome, rejection of Confucian ancestor rites, and ties to Western gunboat diplomacy create a constant threat of local insubordination and foreign intervention."
 VIN_Spirit_Northern_Opium_Infiltration: "Northern Opium Infiltration"
 VIN_Spirit_Northern_Opium_Infiltration_desc: "Across the rugged mountain passes of Lao Cai and Lang Son, a silent poison flows south into the valleys of Bac Ky. Black-market opium, cultivated in the turbulent provinces of southern China, is carried into imperial territory by well-armed smuggling syndicates and corrupt border officials. What began as a lucrative luxury for wealthy merchants has spiraled into a rampant epidemic, bleeding the peasantry of their meager savings and dampening the fighting spirit of our northern garrisons."
 VIN_Spirit_A_Crusade_Of_Purity: "A Crusade of Purity"
 VIN_Spirit_A_Crusade_Of_Purity_desc: "The passes are shut, the fields are burned, and the syndicates are broken. The realm has paid for its purity in coin and administrative effort, but the peasantry keeps its savings and the northern garrisons have found their spine again."
 VIN_Spirit_Regulated_Opium_Trade: "Regulated Opium Trade"
 VIN_Spirit_Regulated_Opium_Trade_desc: "If the poison cannot be stopped, it can at least be taxed. The crown has seized the trade from the smuggling syndicates and turned it into a state monopoly — a river of silver flowing into the treasury, and a slow rot flowing everywhere else."
 VIN_Spirit_Curious_Of_The_West: "Curious of the West"
 VIN_Spirit_Curious_Of_The_West_desc: "Our scholars have returned from Berlin, London, and Vienna with notebooks full of engineering diagrams and a taste for foreign method. The court does not entirely trust them, but it can no longer do without them."
 VIN_Spirit_Centralized_Administration: "Centralized Administration"
 VIN_Spirit_Centralized_Administration_desc: "Provincial grain and revenue now flow directly into the central treasury at Hue, bypassing the local middlemen who fattened themselves on the difference."
 VIN_Spirit_Rekindled_Mining: "Rekindled Mining"
 VIN_Spirit_Rekindled_Mining_desc: "Capital has reached the northern shafts at last. The smelting houses run day and night, and the frontier that was lawless a year ago now answers to the crown."
 VIN_Spirit_Expanding_Mining_Operations: "Expanding Mining Operations"
 VIN_Spirit_Expanding_Mining_Operations_desc: "Surveys, cleared shafts, and subsidized extraction have turned the countryside into a supplier for our budding industry."
 VIN_Spirit_The_Western_Influx: "The Western Influx"
 VIN_Spirit_The_Western_Influx_desc: "European engineers walk the halls of the Imperial Citadel, and our mines and workshops move faster for it. The traditionalist mandarins watch them with open contempt, and the ideas they bring do not stay confined to the workshops."
 VIN_Spirit_Tight_Economic_Control: "Tight Economic Control"
 VIN_Spirit_Tight_Economic_Control_desc: "Every foundry, every workshop, every ounce of production answers to the crown. Nothing is exploited by foreigners because nothing moves without a seal from Hue."
 VIN_Spirit_Defense_Canals: "Defense Canals"
 VIN_Spirit_Defense_Canals_desc: "The new arterial canals carry rice to the granaries and soldiers to the frontier. Terrain that would swallow a marching column is now a highway for our garrisons."
 VIN_Spirit_Centralized_Army: "Centralized Army"
 VIN_Spirit_Centralized_Army_desc: "A unified conscription registry, standardized supply chains, and strategic reserves that can cross provincial lines. The provincial garrisons are becoming an army."
 VIN_Spirit_Traditional_Justice: "Traditional Justice"
 VIN_Spirit_Traditional_Justice_desc: "Strict legal enforcement, standardized penal courts, and an empowered censorate guarantee obedience to Hue across every village and province."
 VIN_Spirit_Traditional_Justice2: "Traditional Justice"
 VIN_Spirit_Traditional_Justice2_desc: "The 398 articles of the Gia Long Code are now enforced uniformly across the realm, and the scholars who study them have begun to study other things besides."
 VIN_Spirit_Justice_For_All: "Justice for All"
 VIN_Spirit_Justice_For_All_desc: "The anti-Christian bans are struck from the Code and our commercial law now speaks a language European courts recognize. Sovereignty defended with paper instead of powder."
 VIN_Spirit_Traditional_Education: "Traditional Education"
 VIN_Spirit_Traditional_Education_desc: "Neo-Confucian orthodoxy is enforced across every national examination. Heterodox sympathizers have been stripped of their titles, and the peasantry, the scholar-class, and the military speak with one voice."
 VIN_Spirit_Curious_Academics: "Curious Academics"
 VIN_Spirit_Curious_Academics_desc: "State-funded schools now teach Western sciences alongside Confucian ethics, and the printing presses at Hue turn out translated technical treatises faster than the censors can read them."
 VIN_Spirit_The_Maritime_Bounty: "The Maritime Bounty"
 VIN_Spirit_The_Maritime_Bounty_desc: "Silk workshops and sugar refineries flood the regional markets of East Asia with high-grade exports, and the trade surplus flows back into the treasury."
 VIN_Spirit_The_Maritime_Bounty2: "The Maritime Bounty"
 VIN_Spirit_The_Maritime_Bounty2_desc: "With the Singapore pipeline secured, our exports reach every port the British flag touches — and British steel and steam parts flow back the other way."
 VIN_Spirit_Brown_Water_Navy: "Brown Water Navy"
 VIN_Spirit_Brown_Water_Navy_desc: "Lightweight river vessels with heavy swivel guns, mortar barges, and submerged booms give us absolute command of the internal waterways. Let the foreign ironclads keep the open sea."
 VIN_Spirit_Cambodian_Tribute: "Cambodian Tribute"
 VIN_Spirit_Cambodian_Tribute_desc: "The court at Phnom Penh pays into two treasuries now, and ours is one of them."
 VIN_Spirit_Cambodia_Dual_Puppet: "A Kingdom with Two Masters"
 VIN_Spirit_Cambodia_Dual_Puppet_desc: "Neither Bangkok nor Hue would yield, so both were satisfied. The Khmer court answers to two thrones, funds two treasuries, and commands nothing of its own."
 VIN_Spirit_The_Buffalo_Stands: "The Buffalo Stands"
 VIN_Spirit_The_Buffalo_Stands_desc: "The expeditionary force is gone, the gunboats have withdrawn, and the Nguyen Dynasty did not bow. Every riverbend and jungle track held. The realm has learned what it is capable of."
 VIN_Spirit_March_Of_The_Elephants: "March of the Elephants"
 VIN_Spirit_March_Of_The_Elephants_desc: "For the first time in history the armies of Bangkok and Hue marched under a shared banner, and the generations-old rivalry over Cambodia and Laos ended in something neither court expected: victory."
 VIN_Spirit_Disaster_In_Indochina: "Disaster in Indochina"
 VIN_Spirit_Disaster_In_Indochina_desc: "The expeditionary force to Dai Nam has been broken. The press demands explanations, the deputies demand accounting, and the colonial ministry has none to give."
 VIN_Spirit_The_Siamese_Fiasco: "The Siamese Fiasco"
 VIN_Spirit_The_Siamese_Fiasco_desc: "Two Asian kingdoms that were supposed to be swallowed piecemeal instead joined hands, and our expeditionary force paid for the miscalculation."
 VIN_Spirit_French_Judicial_Intervention: "French Judicial Intervention"
 VIN_Spirit_French_Judicial_Intervention_desc: "French consular courts now sit in judgment over French subjects on Siamese soil, and the Kingdom's own magistrates have been quietly informed of the limits of their authority."
 VIN_Spirit_French_Humiliation: "French Humiliation"
 VIN_Spirit_French_Humiliation_desc: "The Treaty of Saigon has been signed. The southern provinces are gone, the indemnity is crushing, and the court that swore the barbarians would never set foot on sacred soil must now explain itself."
 VIN_Spirit_Missionaries_Avenged: "Missionaries Avenged"
 VIN_Spirit_Missionaries_Avenged_desc: "The persecutions have been answered. The faithful of Tonkin and Cochinchina may worship openly, and the pulpits at home have found a victory worth preaching."
 VIN_Spirit_Cochinchina_Colony: "Cochinchina Colony"
 VIN_Spirit_Cochinchina_Colony_desc: "The delta is ours. Rice, rubber, and river trade flow out through Saigon under the tricolour, and the map of Indochina has begun to redraw itself."
 
 ############ COUNTRY LEADER TRAITS ############
 VIN_trait_tempered_monarch: "Tempered Monarch"
 VIN_trait_tempered_monarch_desc: "A ruler still distrusted by his court, but no longer openly resented. The classical rites have been reaffirmed, and the mandarins have decided to be patient."
 
 ############ DYNAMIC MODIFIER ############
 VIN_Agrarian_Roots: "Agrarian Roots"
 VIN_Agrarian_Roots_desc: "The rhythm of life in Dai Nam is set by the heavy steps of the water buffalo and the seasonal rise of the rivers."
 
