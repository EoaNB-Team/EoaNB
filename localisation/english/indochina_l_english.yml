 ############ WESTERN INFLUENCE — DECISIONS ############
 VIN_western_influence_category: "Western Influence"
 VIN_western_influence_category_desc: "Imperialist pressure pushes Dai Nam toward Western Ideals on its own. Holding the line against it — or leaning into it — is a matter of deliberate policy."
 VIN_wi_persecute_christians: "Persecute Christians"
 VIN_wi_persecute_christians_desc: "Enforce the anti-Christian decrees in the coastal provinces and let the foreign priests understand who governs here."
 VIN_wi_round_up_missionaries: "Round up Missionaries"
 VIN_wi_round_up_missionaries_desc: "Sweep the clandestine parishes of Tonkin and Cochinchina and put the foreign clergy on ships bound anywhere but here."
 VIN_wi_burn_western_books: "Burn Western Books"
 VIN_wi_burn_western_books_desc: "Foreign treatises circulating among the scholar-gentry are a slower poison than opium and twice as difficult to seize. Burn what can be found."
 VIN_wi_promote_isolationist_policies: "Promote Isolationist Policies"
 VIN_wi_promote_isolationist_policies_desc: "Tighten the Closed-Door policy, restrict foreign hulls to a handful of watched ports, and remind the provinces why the door was shut."
 VIN_wi_appoint_traditionalist_advisors: "Appoint Traditionalist Advisors"
 VIN_wi_appoint_traditionalist_advisors_desc: "Fill the vacant ministry seats with men who studied nothing but the classics and are proud of it."
 VIN_wi_censored_literature: "Censored Literature"
 VIN_wi_censored_literature_desc: "The Do Sat Vien extends its authority over what may be printed, copied and read within the realm."
 VIN_wi_westerners_in_the_court: "Westerners in the Court"
 VIN_wi_westerners_in_the_court_desc: "Seat foreign engineers and interpreters where the mandarins must look at them daily, and let familiarity do the work argument cannot."
 VIN_wi_undermine_traditional_authority: "Undermine Traditional Authority"
 VIN_wi_undermine_traditional_authority_desc: "Quietly strip the most obstructive of the classical scholars of their appointments and let the rest draw the obvious conclusion."
 VIN_wi_philosophical_discussion: "Philosophical Discussion"
 VIN_wi_philosophical_discussion_desc: "Convene the court to debate foreign ideas openly. Some arguments are won simply by being permitted."
 VIN_wi_train_diplomats: "Train Diplomats"
 VIN_wi_train_diplomats_desc: "Establish a formal corps of envoys schooled in European languages, protocol and law — men who can meet a foreign minister as an equal."
 
 ############ OPIUM MECHANIC ############
 VIN_opium_category: "The Opium Question"
 VIN_opium_category_desc: "Black-market opium crosses the passes of Lao Cai and Lang Son faster than the border officials can be bribed to notice. The court must decide what it intends to do about it."
 VIN_opium_a_course_of_action: "A Course of Action"
 VIN_opium_a_course_of_action_desc: "The Board of Justice and the Ministry of Revenue have submitted opposing memorials on the northern opium trade. The Emperor must read one of them."
 VIN_opium_troops_at_the_border_pass: "Troops at the Border Pass"
 VIN_opium_troops_at_the_border_pass_desc: "Garrison the mountain crossings in force. The syndicates are well armed, so the detachments must be too."
 VIN_opium_burn_fields: "Burn Fields"
 VIN_opium_burn_fields_desc: "Send columns across the northern frontier to put the poppy fields to the torch before the harvest reaches our valleys."
 VIN_opium_port_patrols: "Port Patrols"
 VIN_opium_port_patrols_desc: "What cannot cross the mountains will come by sea. Board and search every junk working the northern coast."
 VIN_opium_large_scale_crackdown: "Large-scale Crackdown"
 VIN_opium_large_scale_crackdown_desc: "Move against the dens, the dealers and the officials who protected them, all at once and in every province at the same hour."
 VIN_opium_monopolize_the_trade: "Monopolize the Trade"
 VIN_opium_monopolize_the_trade_desc: "If the trade cannot be stopped, it can be owned. The crown takes the syndicates' business and their routes with it."
 VIN_opium_high_taxes_on_dealers: "High Taxes on Dealers"
 VIN_opium_high_taxes_on_dealers_desc: "Licence the dealers, register them, and tax them at a rate only a monopoly could survive."
 VIN_opium_back_room_dealings: "Back-room Dealings"
 VIN_opium_back_room_dealings_desc: "Quiet accommodations with the syndicate heads and the border officials already on their payroll. Nobody signs anything."
 
 VIN_opium.1.t: "The Northern Poison"
 VIN_opium.1.d: "Across the rugged passes of Lao Cai and Lang Son, a silent poison flows south into the valleys of Bac Ky. What began as a lucrative luxury for wealthy merchants has spiraled into a rampant epidemic, bleeding the peasantry of their savings and dampening the fighting spirit of our northern garrisons.\n\nThe Board of Justice demands the passes be shut and the trade broken. The Ministry of Revenue observes, more quietly, that a trade this profitable is a strange thing for a treasury as thin as ours to be giving away."
 VIN_opium.1.a: "Crack Down on the Smuggling of Opium"
 VIN_opium.1.b: "Profit and Regulate the Trade"
 VIN_opium.2.t: "A Crusade of Purity"
 VIN_opium.2.d: "The passes are garrisoned, the fields are ash, the coast is watched and the dens are shuttered. It cost the treasury a great deal and the Ministry of Revenue has not stopped saying so — but the peasantry keeps its savings, and the northern garrisons have found their spine again."
 VIN_opium.2.a: "The realm is clean."
 VIN_opium.3.t: "The Regulated Trade"
 VIN_opium.3.d: "The syndicates work for the crown now, the dealers are licensed and taxed, and silver flows into the treasury in quantities the Board of Revenue had not dared to project. The Board of Justice has stopped submitting memorials on the subject. The dens remain open."
 VIN_opium.3.a: "The treasury does not ask where it came from."
 
 ############ SILVER MECHANIC ############
 VIN_silver_category: "The Silver Mines"
 VIN_silver_category_desc: "Silver held: §Y[?VIN_Silver|0]§!\nMonthly yield: §G[?VIN_Silver_Income|0]§!"
 VIN_silver_increase_border_security: "Increase Border Security"
 VIN_silver_increase_border_security_desc: "The spillover from the Taiping Rebellion has left the northern frontier lawless. Nothing reopens until the border is held."
 VIN_silver_supplement_chinese_manpower: "Supplement Chinese Manpower"
 VIN_silver_supplement_chinese_manpower_desc: "The shafts need hands that know them. The loyalist Chinese mining guilds have hands, and terms."
 VIN_silver_arrest_bandits: "Arrest Bandits"
 VIN_silver_arrest_bandits_desc: "The highlands are thick with men who have made a living off the closed mines. They will not welcome their reopening."
 VIN_silver_severe_punishments: "Severe Punishments"
 VIN_silver_severe_punishments_desc: "Make an example of the first offenders and the rest of the frontier will draw its own conclusions."
 VIN_silver_tax_incentives: "Tax Incentives"
 VIN_silver_tax_incentives_desc: "No guild will sink capital into a collapsed shaft without relief from the imperial assessors."
 VIN_silver_lower_initial_quotas: "Lower Initial Quotas"
 VIN_silver_lower_initial_quotas_desc: "Demand less of the first seasons and the mines may survive long enough to give more later."
 VIN_silver_prospect_for_more_silver: "Prospect for more Silver"
 VIN_silver_prospect_for_more_silver_desc: "Survey deeper into the Ngan Son massif for veins the old workings never reached."
 VIN_silver_sell_in_english_markets: "Sell in English Markets"
 VIN_silver_sell_in_english_markets_desc: "British bullion brokers in Singapore and Hong Kong will take everything we can ship."
 VIN_silver_sell_in_french_markets: "Sell in French Markets"
 VIN_silver_sell_in_french_markets_desc: "Selling to Paris is not without irony, but their coin spends the same as anyone's."
 VIN_silver_qing_trade_agreement: "Qing Trade Agreement"
 VIN_silver_qing_trade_agreement_desc: "The Middle Kingdom's demand for silver is bottomless and its prices reflect it."
 VIN_silver_trade_negotiations_with_siam: "Trade Negotiations with Siam"
 VIN_silver_trade_negotiations_with_siam_desc: "Bangkok will pay well, and a shared ledger is a quieter kind of diplomacy than a shared border."
 VIN_silver_foreign_banking: "Foreign Banking"
 VIN_silver_foreign_banking_desc: "Deposit bullion with the foreign houses and let it earn while it sits. It comes back heavier."
 VIN_silver_infrastructure_investments: "Infrastructure Investments"
 VIN_silver_infrastructure_investments_desc: "Turn bullion into roads, docks and the room to build on. Silver in the ground does nothing for the realm."
 VIN_silver_increase_mine_access: "Increase Mine Access"
 VIN_silver_increase_mine_access_desc: "Cut new adits and haulage roads so the ore reaches the smelters instead of sitting at the shaft head."
 VIN_silver_increase_mine_security: "Increase Mine Security"
 VIN_silver_increase_mine_security_desc: "Every ounce that leaves by the wrong road is an ounce the treasury never sees."
 VIN_silver_attract_chinese_labor: "Attract Chinese Labor"
 VIN_silver_attract_chinese_labor_desc: "Recruit openly across the border. The workings fill quickly, and so do the frontier towns."
 
 VIN_silver.1.t: "The Mines of Ngan Son Reopen"
 VIN_silver.1.d: "Against all geopolitical odds, the imperial court of Emperor Tu Duc has successfully reclaimed, fortified, and reopened the fabled silver mines of Ngan Son. Following years of devastating border lawlessness driven by the spillover of the Taiping Rebellion, this grand reopening marks a triumphant restoration of imperial authority over the northern highlands. By securing the region with elite royal troops and establishing a new joint-venture framework with loyalist Chinese mining guilds, Dai Nam has officially revived its most vital domestic source of silver bullion."
 VIN_silver.1.a: "Let the smelters run."
 
 ############ FOCUS-UNLOCKED DECISIONS ############
 VIN_royal_court_category: "The Royal Court"
 VIN_royal_court_category_desc: "Missions abroad, the language our envoys will speak, and the treaties that decide whether the powers treat us as a state or a coastline."
 VIN_finance_category: "The Finance Board"
 VIN_finance_category_desc: "Land, capital and the choices between them."
 VIN_public_works_category: "Public Works"
 VIN_public_works_category_desc: "Roads, dikes and canals — the crown's builders at work."
 VIN_justice_category: "The Justice Board"
 VIN_justice_category_desc: "Enforcement of the imperial decrees, province by province."
 VIN_rites_category: "The Rites Board"
 VIN_rites_category_desc: "Examinations, rituals and envoys — the Bo Le at work."
 VIN_military_category: "Military Affairs"
 VIN_military_category_desc: "Arsenals, foundries and the rifles we cannot yet make ourselves."
 VIN_naval_category: "The Naval Effort"
 VIN_naval_category_desc: "Shipyards, plantations and the sea road south."
 VIN_war_category: "The War Effort"
 VIN_war_category_desc: "Emergency measures for a war on our own soil."
 VIN_advisors_to_britain: "Send Advisors to Britain"
 VIN_advisors_to_britain_desc: "Dispatch our brightest scholars to London to study what an industrial power actually looks like from the inside."
 VIN_advisors_to_prussia: "Send Advisors to Prussia"
 VIN_advisors_to_prussia_desc: "Berlin's technical schools are the finest in Europe and its ministries are willing to show them off."
 VIN_advisors_to_austria: "Send Advisors to Austria"
 VIN_advisors_to_austria_desc: "Vienna receives our mission with elaborate courtesy and unexpected candour."
 VIN_foreign_investments_return: "Foreign Investments Return"
 VIN_foreign_investments_return_desc: "Our scholars are home, and the capital they attracted has followed them to Da Nang."
 VIN_diplomats_learn_french: "Train our Diplomats in French"
 VIN_diplomats_learn_french_desc: "The language of the power most likely to invade us is the language most worth knowing."
 VIN_diplomats_learn_english: "Train our Diplomats in English"
 VIN_diplomats_learn_english_desc: "London and Washington are far away, which is precisely what recommends them."
 VIN_diplomats_learn_chinese: "Train our Diplomats in Chinese"
 VIN_diplomats_learn_chinese_desc: "The Middle Kingdom remains our oldest correspondent, and the classical tongue our scholars already own."
 VIN_the_declaration_of_paris: "The Declaration of Paris"
 VIN_the_declaration_of_paris_desc: "Accede to the maritime law the powers wrote for themselves, and gain the protections that come with it."
 VIN_formally_abolish_the_slave_trade: "Formally Abolish the Slave Trade"
 VIN_formally_abolish_the_slave_trade_desc: "A costly signature at home, and an enormously valuable one abroad."
 VIN_extradition_conventions: "Extradition Conventions"
 VIN_extradition_conventions_desc: "Formal channels for the handing over of fugitives strip the consulates of a favourite pretext."
 VIN_sai_gon_building_slot: "Clear Ground at Sai Gon"
 VIN_sai_gon_building_slot_desc: "Survey and clear land in the southern capital for the state farms to come."
 VIN_sai_gon_farm: "State Farm at Sai Gon"
 VIN_sai_gon_farm_desc: "Fund the reclamation works and put the cleared ground under rice."
 VIN_can_tho_building_slot: "Clear Ground at Can Tho"
 VIN_can_tho_building_slot_desc: "The delta soil is the richest in the realm and the least organised."
 VIN_can_tho_farm: "State Farm at Can Tho"
 VIN_can_tho_farm_desc: "Dikes, sluices and seed loans turn floodplain into granary."
 VIN_focus_on_agriculture: "Focus our Efforts: Agriculture"
 VIN_focus_on_agriculture_desc: "Remain a self-reliant agrarian empire and treat heavy industry as the corrupting foreign influence the mandarins insist it is."
 VIN_focus_on_industry: "Focus our Efforts: Industry"
 VIN_focus_on_industry_desc: "Fields alone cannot forge the cannon needed to defend our sovereignty."
 VIN_invest_in_expanding_our_resources: "Invest in Expanding our Resources"
 VIN_invest_in_expanding_our_resources_desc: "Zinc, copper and iron are the lifeblood of everyday commerce. Put the treasury behind extraction."
 VIN_save_our_treasury: "Save our Treasury"
 VIN_save_our_treasury_desc: "The mines can wait. The court's reserves cannot be spent twice."
 VIN_humble_factory_instalment: "Fund the Works at Tonkin"
 VIN_humble_factory_instalment_desc: "Another instalment toward the Empire's first centralised manufacturing site."
 VIN_update_the_mandarin_road: "Update the Mandarin Road"
 VIN_update_the_mandarin_road_desc: "The royal highway from Hue to Sai Gon has carried couriers for fifty years and been repaired for thirty."
 VIN_red_river_dikes: "Red River Dikes"
 VIN_red_river_dikes_desc: "The dikes of the north hold back a river that has drowned dynasties."
 VIN_the_bao_dinh_canal: "The Bao Dinh Canal"
 VIN_the_bao_dinh_canal_desc: "Clear and widen the old canal so the delta's rice can reach the sea without crossing a province of mud."
 VIN_crucify_catholics_sai_gon: "Crucify Catholics in Sai Gon"
 VIN_crucify_catholics_sai_gon_desc: "Public executions in the southern capital, where the parishes are thickest."
 VIN_crucify_catholics_hue: "Crucify Catholics in Hue"
 VIN_crucify_catholics_hue_desc: "Under the walls of the citadel itself, so that no one mistakes the court's position."
 VIN_crucify_catholics_ha_noi: "Crucify Catholics in Ha Noi"
 VIN_crucify_catholics_ha_noi_desc: "The northern congregations are older and better hidden. They will be found."
 VIN_crucify_catholics_can_tho: "Crucify Catholics in Can Tho"
 VIN_crucify_catholics_can_tho_desc: "The last of the delta networks, and the end of the matter."
 VIN_observe_the_quoc_tu_giam: "Observe the Quoc Tu Giam"
 VIN_observe_the_quoc_tu_giam_desc: "The Imperial Academy has taught the realm's administrators for centuries. It is worth the court's attention."
 VIN_legacy_of_nguyen_van_thanh: "Legacy of Nguyen Van Thanh"
 VIN_legacy_of_nguyen_van_thanh_desc: "The general who codified our law also codified our drill. Recover what was set aside."
 VIN_reform_geographical_views: "Reform Geographical Views"
 VIN_reform_geographical_views_desc: "Our maps of the world beyond the South China Sea are decorative rather than useful."
 VIN_modern_instruments: "Modern Instruments"
 VIN_modern_instruments_desc: "Chronometers, theodolites and telegraph sets for the ministries that need them."
 VIN_allow_embassies: "Allow Embassies"
 VIN_allow_embassies_desc: "Permit permanent foreign legations at Hue. It is a concession, and it is also a channel."
 VIN_shift_our_export_focus: "Shift our Export Focus"
 VIN_shift_our_export_focus_desc: "Redirect the export trade toward what the foreign markets actually want."
 VIN_ensure_advisor_conformity: "Ensure Advisor Conformity"
 VIN_ensure_advisor_conformity_desc: "Every councillor reaffirms the classical curriculum, in writing."
 VIN_traditional_rites: "Traditional Rites"
 VIN_traditional_rites_desc: "Restore the full calendar of court ceremony. The provinces are watching."
 VIN_legacy_of_confucius: "Legacy of Confucius"
 VIN_legacy_of_confucius_desc: "A grand endowment for the temples and the scholar-gentry who staff them."
 VIN_hue_arms_building_slot: "Clear Ground at Hue"
 VIN_hue_arms_building_slot_desc: "Survey the ground near the citadel for the arsenal to come."
 VIN_hue_arms_factory: "The Hue Arsenal"
 VIN_hue_arms_factory_desc: "A state armoury under the walls of the capital, turning out matchlocks by the thousand."
 VIN_purchase_western_rifles: "Purchase Western Rifles"
 VIN_purchase_western_rifles_desc: "Another consignment of Minie rifles, quietly landed and quietly distributed."
 VIN_plant_the_rubber_saplings: "Plant the Rubber Saplings"
 VIN_plant_the_rubber_saplings_desc: "The southern red soils will take them. In a decade they will matter."
 VIN_naval_slot_sai_gon: "Clear Ground at Sai Gon Port"
 VIN_naval_slot_sai_gon_desc: "Ground for a yard on the Ben Nghe."
 VIN_dockyard_sai_gon: "Sai Gon Dockyard"
 VIN_dockyard_sai_gon_desc: "Slipways, sheds and a workforce that has not built a warship in a generation."
 VIN_naval_slot_hue: "Clear Ground at Thuan An"
 VIN_naval_slot_hue_desc: "Ground for a yard at the mouth of the Perfume River."
 VIN_dockyard_hue: "Thuan An Dockyard"
 VIN_dockyard_hue_desc: "The capital's own yard, under the guns of its own forts."
 VIN_naval_slot_ha_noi: "Clear Ground at Ha Noi"
 VIN_naval_slot_ha_noi_desc: "Ground for a river yard on the Red River."
 VIN_dockyard_ha_noi: "Ha Noi Dockyard"
 VIN_dockyard_ha_noi_desc: "Shallow-draught hulls for the northern waterways."
 VIN_war_coordinated_planning: "Coordinated Planning"
 VIN_war_coordinated_planning_desc: "The provincial commands answer to one staff for the duration."
 VIN_war_river_ambushes: "River Ambushes"
 VIN_war_river_ambushes_desc: "Ironwood stakes, sunken booms and militia waiting on both banks."
 VIN_war_mekong_control: "Mekong Control"
 VIN_war_mekong_control_desc: "Every crossing, every sandbar and every fishing village is ours and known to us."
 VIN_war_night_attacks: "Night Attacks"
 VIN_war_night_attacks_desc: "Foreign troops fight badly in the dark on ground they have never seen."
 VIN_war_for_the_emperor: "For the Emperor!"
 VIN_war_for_the_emperor_desc: "The Son of Heaven's own standard goes forward with the columns."
 VIN_war_raise_the_militia: "Raise the Militia"
 VIN_war_raise_the_militia_desc: "Call out the Nghia Quan across the provinces. They will be poorly armed and they will be numerous."
 VIN_war_train_regulars: "Train Regulars"
 VIN_war_train_regulars_desc: "A properly drilled formation, raised where the front most needs it."
 VIN_war_sai_gon_defences: "Sai Gon Defences"
 VIN_war_sai_gon_defences_desc: "Earthworks and heavy iron cannon commanding the southern approaches."
 VIN_Spirit_Declaration_Of_Paris: "The Declaration of Paris"
 VIN_Spirit_Declaration_Of_Paris_desc: "Our flag is now covered by the maritime law the powers wrote for one another, and their own courts must acknowledge it."
 VIN_Spirit_Slave_Trade_Abolished: "The Slave Trade Abolished"
 VIN_Spirit_Slave_Trade_Abolished_desc: "A signature that cost the rural gentry a great deal and bought Dai Nam a hearing in every European chancery."
 VIN_Spirit_Extradition_Conventions: "Extradition Conventions"
 VIN_Spirit_Extradition_Conventions_desc: "Fugitives now move between jurisdictions by treaty rather than by gunboat."
 
 ############ ADVISORS, GENERALS AND TRAITS ############
 VIN_character_truong_dang_que: "Truong Dang Que"
 VIN_character_nguyen_truong_to: "Nguyen Truong To"
 VIN_character_pham_phu_thu: "Pham Phu Thu"
 VIN_character_phan_thanh_gian: "Phan Thanh Gian"
 VIN_character_truong_dinh: "Truong Dinh"
 VIN_character_le_dinh_ly: "Le Dinh Ly"
 VIN_character_truong_dang_que_desc: "Grand Secretary under three emperors and the steadiest hand in the Hue court. He has outlasted every faction that tried to remove him by the simple method of never appearing to belong to one."
 VIN_character_nguyen_truong_to_desc: "A Catholic convert who studied in Penang, Rome and Paris, and returned convinced that Dai Nam's only route to survival runs through the very institutions the court despises. He has submitted dozens of reform memorials. The court has read few of them."
 VIN_character_pham_phu_thu_desc: "A mandarin who saw Europe with his own eyes on the 1863 embassy and came back arguing that the realm should industrialise on its own terms rather than anyone else's."
 VIN_character_phan_thanh_gian_desc: "The first southerner to hold the doctorate, and the man the court sends when a negotiation cannot be allowed to fail. He is not optimistic about the ones ahead."
 VIN_character_truong_dinh_desc: "A landowner turned partisan commander in the southern provinces, who understands that an army which cannot beat the French in the field can still make the delta uninhabitable for them."
 VIN_character_le_dinh_ly_desc: "A veteran of the northern garrisons, entrusted with the coastal works guarding the approach to the capital."
 VIN_trait_safe_hands: "Safe Hands"
 VIN_trait_safe_hands_desc: "Decades in the Grand Secretariat have taught him that the court is steadied by continuity and unsettled by speed."
 VIN_trait_tenacious_negotiator: "Tenacious Negotiator"
 VIN_trait_tenacious_negotiator_desc: "He has argued the same case to the throne for twenty years without once losing his temper or his argument."
 VIN_trait_agrarian_nationalist: "Agrarian Nationalist"
 VIN_trait_agrarian_nationalist_desc: "Industry, he insists, must serve the countryside rather than empty it."
 VIN_trait_diplomat: "Diplomat"
 VIN_trait_diplomat_desc: "He knows precisely what the foreign ministers want and precisely how little of it he is authorised to give."
 VIN_trait_mhc_guerilla_fighter: "Guerilla Fighter"
 VIN_trait_mhc_guerilla_fighter_desc: "Columns that live off the delta need neither depots nor roads, and cannot be cut off from either."
 VIN_trait_vigilant_fort_commander: "Vigilant Fort Commander"
 VIN_trait_vigilant_fort_commander_desc: "He has walked every embrasure of the Thuan An works and can name the gunner on each."
 
