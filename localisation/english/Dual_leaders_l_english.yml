  ### (PIE) Sardinia-Piedmont ###
  PIE_Victor_Emmanuel_II: "Victor Emmanuel II"
  PIE_characters_Victor_desc: "§YAutocratic Imperialist§!\n - £war_support_texticon War Support: §G+5%§!\n - £stability_texticon Stability: §G+5%§!\n\n§YBorn:§! §LMarch 14th 1820, Turin, Kingdom of Sardinia§!\n§YBackground:§! §LRe di Sardegna (King of Sardinia), Victor Emmanuel II has exercised sovereign authority since 23 March 1849, ascending the throne following the abdication of his father Charles Albert in the aftermath of military defeat by Austria. Inheriting a state shaken by war and internal division, he confirmed the constitutional charter granted during the revolutions of 1848, anchoring his rule in legality at a moment when reaction prevailed across much of Europe.\n\nFormed by military service and the hard lessons of defeat, Victor Emmanuel II governs with a pragmatic blend of dynastic authority and constitutional restraint. His reign has been shaped by close cooperation with parliamentary leaders and a deliberate effort to strengthen Sardinia-Piedmont’s standing among the Great Powers, most notably through participation in the Crimean War. Within Italy, his crown has become a focal point for liberal and national aspirations, positioning the Sardinian state as a leading force in the political reordering of the peninsula, while the king himself stands as a soldier-sovereign balancing caution, ambition, and the burdens of leadership in an unsettled age.§!"

  ### (PRS) Prussia ###
  PRS_Friedrich_Wilhelm_IV: "Friedrich Wilhelm IV"
  PRS_VL_Friedrich_Wilhelm_IV: "Friedrich Wilhelm IV"
  PRS_Friedrich_Wilhelm_IV_desc: "§YSickly§!\n - £stability_texticon Stability: §R-5%§!\n - £pol_power Legislative Power Gain: §R-0.05§!\n\n§YBorn:§! §LOctober 15th 1795, Berlin, Kingdom of Prussia§!\n§YBackground:§! §LThe eldest son of King Friedrich Wilhelm III, Friedrich Wilhelm IV was shaped by Romanticism, religion and a deep admiration for Prussia's centuries-old traditions. Ascending the throne in 1840, he initially inspired hopes of reform, yet his vision of a Christian and estate-based monarchy soon clashed with the growing liberal and national movements of the Vormärz. The March Revolution of 1848 forced the king to accept constitutional government, though he rejected the imperial crown offered by the Frankfurt Parliament in the year after and subsequently strengthened Prussia's conservative order. Since the mid-1850s, his rule has become increasingly reactionary, while his declining health gradually weakens his ability to govern. Having produced no heir and in poor health, Friedrich Wilhelm now stands at the twilight of his reign, leaving Prussia's future in the hands of his brother and heir presumptive, Crown Prince Wilhelm...§!"
  PRS_VL_Friedrich_Wilhelm_IV_sick: "Friedrich Wilhelm IV"
  PRS_Friedrich_Wilhelm_IV_sick_desc: "§YPartially Paralyzed§!\n - £stability_texticon Stability: §R-8%§!\n - £stability_texticon Stability Weekly: §R-0.1%§!\n - £pol_power Legislative Power Gain: §R-0.1§!\n\n§YBorn:§! §LOctober 15th 1795, Berlin, Kingdom of Prussia§!\n§YBackground:§! §LThe eldest son of King Friedrich Wilhelm III, Friedrich Wilhelm IV was shaped by Romanticism, religion and a deep admiration for Prussia's centuries-old traditions. Ascending the throne in 1840, he initially inspired hopes of reform, yet his vision of a Christian and estate-based monarchy soon clashed with the growing liberal and national movements of the Vormärz. The March Revolution of 1848 forced the king to accept constitutional government, though he rejected the imperial crown offered by the Frankfurt Parliament in the year after and subsequently strengthened Prussia's conservative order. Since the mid-1850s, his rule has become increasingly reactionary, while his declining health gradually weakens his ability to govern. Since July 1857, the King has suffered a series of strokes that make it almost impossible for him to conduct the day-to-day duties of a monarch governing and representing the country. Having produced no heir and in very poor health, Friedrich Wilhelm now stands at the twilight of his reign, leaving Prussia's future in the hands of his brother and heir presumptive, Crown Prince Wilhelm...§!"
  PRS_Wilhelm_I: "Wilhelm I"
  PRS_VL_Wilhelm_I: "Wilhelm I"
  PRS_Wilhelm_I_desc: "§YPopular Monarch§!\n - £stability_texticon Stability: §G+5%§!\n\n§YBorn:§! §LMarch 22nd 1797, Berlin, Kingdom of Prussia§!\n§YBackground:§! §LThe second son of King Friedrich Wilhelm III and Queen Luise, Wilhelm was never expected to inherit the Prussian throne. Raised in the shadow of the Napoleonic Wars, he received a strict military education and entered the army at an early age, eventually taking part in the campaigns against France. After the accession of his childless elder brother Friedrich Wilhelm IV in 1840, Wilhelm became Prince of Prussia and heir presumptive. A staunchly conservative soldier, he gained a reputation for discipline, loyalty to the monarchy and opposition to revolutionary movements, with his decisive counterrevolutionary actions earning him the nickname 'Kartätschenprinz' (Prince of the Cannonballs). When his brother's declining health made him incapable of ruling, Wilhelm assumed the regency in 1858, taking responsibility for the kingdom's future. Following Friedrich Wilhelm's death, he has officially ascended the Prussian throne as King Wilhelm I.§!"
  PRS_Friedrich_III: "Friedrich III"
  PRS_VL_Friedrich_III_young: "Friedrich III"
  PRS_Friedrich_III_young_desc: "§YModernization Enthusiast§!\n - Daily Conservative Liberalism Support: §G+0.01§!\n - Daily Social Liberalism Support: §G+0.01§!\n - £pol_power Legislative Power Gain: §G+0.05§!\n\n§YBorn:§! §LOctober 18th 1831, Potsdam, Kingdom of Prussia§!\n§YBackground:§! §LSon of King Wilhelm I and nephew of the late King Friedrich Wilhelm IV, young Friedrich was raised in the traditional Prussian way, involving both military and classical education. His experiences during the tumultuous period of the German Vormärz and his parents' failing marriage meant that the prince soon broke with the Hohenzollern tradition and pursued a formal education at the University of Bonn, in the heart of the more liberal Prussian Rhine Province. Here, Friedrich became acquainted with the liberal arts and progressive forms of governing, forming his rather liberal outlook on Prussian and German politics as a whole - a controversial stance among noblemen from high aristocracy. Both, his political persuasion and the engagement to Victoria, Princess Royal of the British Crown, were encouraged by monarchs of related families such as King Leopold I of Belgium and Prince Albert of Saxe-Coburg and Gotha, Prince Consort to Queen Victoria, in an attempt to liberalize the Kingdom of Prussia and Germany from the inside. The young monarch now holds the keys to Prussia's future and only time will tell whether he can fulfill his destiny...§!"
  PRS_VL_Friedrich_III_old: "Friedrich III"
  PRS_VL_Friedrich_III_old_desc: "§YTerminally Ill§!\n - £stability_texticon Stability: §R-7%§!\n - £pol_power Legislative Power Gain: §R-0.1§!\n\n§YBorn:§! §LOctober 18th 1831, Potsdam, Kingdom of Prussia§!\n§YBackground:§! §LFriedrich III, the Prussian monarch, is committed to modernize the country. In part because of his wife, a daughter of Queen Victoria, and his personal experiences but also due to the recent success of the country, Friedrich has an admiration for British constitutionalism. He sympathizes with establishing a constitutional monarchy in Prussia through liberal reforms and greater civic freedoms, setting him apart from the views of his father.\n\nHowever, Friedrich's time to bring change to Prussian politics will most probably be cut short, because he is suffering from throat cancer in a state beyond cure. His terminal illness means that after waiting decades to take over the throne from his father, Friedrich will have very little time to influence his country's political path...§!"
  PRS_Wilhelm_II: "Wilhelm II"
  PRS_VL_Wilhelm_II: "Wilhelm II"
  PRS_VL_Wilhelm_II_desc: "§YExcentric Monarch§!\n - £stability_texticon Stability: §R-3%§!\n - £pol_power Legislative Power Gain: §R-0.03§!\n - £war_support_texticon War Support: §G+5%§!\n\n§YBorn:§! §LJanuary 27th 1859, Berlin, Kingdom of Prussia§!\n§YBackground:§! §LBorn as the eldest son of Crown Prince Friedrich of Prussia and Princess Victoria, daughter of Queen Victoria of the United Kingdom, Wilhelm Friedrich Viktor Albert entered the world under auspicious circumstances — yet his birth was marred by a traumatic delivery that left his left arm permanently withered.\n\nThe year 1888 — now known as the Dreikaiserjahr (Year of Three Emperors) — has thrust Wilhelm onto the throne sooner than anyone anticipated. His grandfather Wilhelm I died on 9 March at age 90, and his father Friedrich III ascended as German Emperor and King of Prussia. But Friedrich was already stricken with incurable throat cancer; after a reign of only 99 days, he succumbed to the disease on 15 June.\n\nWilhelm's understanding of monarchic rule is deeply reactionary: he believes fervently in the divine nature of kingship and the personal authority of the emperor. His excentric personality and the privileges vested in him as the German monarch, position him to exercise considerable power.Yet beneath the confident exterior lies a volatile, impressionable character. Wilhelm is intelligent and dashing, but also impulsive, vain, and prone to grandiose notions. He possesses a narcissistic coldness and dynastic arrogance that have already manifested in wounding remarks about political opponents and democratic aspirations. His thirst for glory, overweening nationalism, and pronounced militaristic tendencies — particularly his passion for naval expansion — suggest ambitions that may reshape Germany's place in the world.§!"

  ### (SAX) Saxony ###
  SAX_Johann: "Johann von Sachsen"
  SAX_VL_Johann: "Johann von Sachsen"
  SAX_KING_JOHANN_LEADER_DESC: "§YPopular Monarch§!\n - £stability_texticon Stability: §G+5%§!\n\n§YBorn:§! §LDecember 12th 1801, Dresden, Kingdom of Saxony§!\n§YBackground:§! §LBorn as the third son of Hereditary Prince Maximilian of Saxony, Johann received an extensive education in law, administration, and the humanities that would shape his entire career. Under the pseudonym 'Philalethes' (Friend of Truth), he published a highly regarded German translation of Dante's Divine Comedy between 1839 and 1849, earning him recognition as a scholar even before ascending the throne.\n\nJohann took an active role in Saxon politics long before becoming king. He helped pacify the country during the 1848 revolutions, served as commandant of the new national guard, and worked energetically in the upper chamber on legal and constitutional matters.\n\nUpon his brother Friedrich August II's death in 1854, Johann ascended to the Saxon throne as King Johann. His reign has thus far been marked by a genuine liberal bent in social and educational policy, reflecting his scholarly temperament and deep interest in law. King Johann is no young monarch, but his health remains sound and his intellectual vigor undiminished. His reign has only just begun, and the question remains whether his liberal inclinations will prove strong enough to guide Saxony through the challenges ahead — or whether the pressures of realpolitik will force him onto a more conservative path.§!"

  ### (SWE) Sweden ###
  SWE_Oscar_I: "Oscar I"
  SWE_characters_Oscar_I_desc: "§YPopular Monarch§!\n - £stability_texticon Stability: §G+5%§!\n\n§YBorn:§! §L4 July 1799, Paris, French Republic§!\n§YBackground:§! §LKonung av Sverige (King of Sweden), Oscar I has exercised sovereign authority since 8 March 1844, succeeding his father Charles XIV John as ruler of the united kingdoms of Sweden and Norway. As the son of the Bernadotte dynasty’s founder, he was raised within the institutions of the Swedish monarchy and prepared for rule through education in governance, law, and military affairs shaped by both French origin and Swedish state tradition.\n\nSince his accession, Oscar I has governed in cooperation with the Riksdag, advancing measures affecting legal, economic, and social life within the kingdom while maintaining the constitutional framework established in earlier decades. His reign has coincided with a period of measured reform and political adjustment, requiring balance between royal initiative and representative authority. Within Sweden, he stands as a monarch attentive to orderly progress and the preservation of stability, guiding the kingdom through change while upholding the authority and continuity of the Crown.§!"

  SWE_Charles_XV: "Charles XV"
  SWE_characters_Charles_XV_desc: "§YPopular Monarch§!\n - £stability_texticon Stability: §G+5%§!\n\n§YBorn:§! §L3 May 1826, Stockholm, Kingdom of Sweden§!\n§YBackground:§! §LKonung av Sverige (King of Sweden), Charles XV has exercised sovereign authority since 25 September 1857 as Regent, assuming the direction of government during the prolonged illness of his father, King Oscar I. As Crown Prince of the House of Bernadotte, he was raised within the institutions of the Swedish state, educated in law, the arts, and military affairs, and entrusted from an early age with prominent public roles, including the chancellorship of the kingdom’s universities and academies.\n\nHis elevation to regency marks the rise of a new generation shaped entirely within Sweden’s constitutional order. Entering rule at a time when the authority of the Crown is increasingly balanced by the influence of the Riksdag, Charles XV governs within a framework defined by law, representation, and gradual political change. Direct in manner and experienced in both administrative and ceremonial duties, he stands as an active figure of royal authority, maintaining continuity while adapting to the evolving relationship between monarchy and state in mid-nineteenth century Sweden.§!"
 
  ### (THU) Thuringia ###
  THU_Carl_Alexander_von_Sachsen_Weimar_Eisenach: "C. A. von Sachs.-Weim.-Eisen."
  THU_VL_Carl_Alexander_von_Sachsen_Weimar_Eisenach: "C. A. von Sachsen-Weimar-Eisenach"
  THU_Carl_Alexander_von_Sachsen_Weimar_Eisenach_desc: "§YPopular Monarch§!\n - £stability_texticon Stability: §G+5%§!\n\n§YBorn:§! §LJune 24th 1818, Weimar, Grand Duchy of Saxony-Weimar-Eisenach§!\n§YBackground:§! §LAs the only surviving son of Grand Duke Carl Friedrich and Grand Duchess Maria Pawlowna (daughter of Russian Emperor Paul I), Carl Alexander received an education befitting both his aristocratic heritage and the intellectual legacy of his homeland. Tutored in the spirit of Weimar Classicism by Goethe's own secretary Johann Peter Eckermann, he studied law, history, and natural sciences at Leipzig and Jena, earning a doctorate in 1841.\n\nCarl Alexander's liberal views made him something of an outsider in aristocratic circles, but they served him well during the turbulent years of 1848–49. When Weimar citizens protested in March 1848 demanding democratic reforms and improved living conditions, Carl Alexander—already acting as regent due to his father's failing health—responded with measured concessions rather than repression.\n\nUpon his father's death in July 1853, Carl Alexander formally ascended as Grand Duke of Saxe-Weimar-Eisenach. His reign has thus far balanced seemingly contradictory impulses: conservative yet liberal, constitutional yet progressive. This pragmatic approach has allowed him to preserve traditional institutions while embracing reform—a necessity for ruling a composite realm that now encompasses not only Weimar-Eisenach but also the Thuringian duchies of Saxe-Altenburg, Saxe-Coburg-Gotha, and Saxe-Meiningen, along with the principalities of Schwarzburg-Rudolstadt and Schwarzburg-Sondershausen.\n\nGrand Duke Carl Alexander remains vigorous and intellectually engaged. A patron of the arts who has restored the Wartburg Castle and established the Weimar Museum of Art, he continues to champion the cultural legacy of his realm while steering it through uncertain political waters. Whether his liberal inclinations will prove strong enough to guide Thuringia toward constitutional government, or whether the pressures of Prussian and Austrian rivalry will force him onto a different path, remains to be seen.§!"

  ### (TSH) Tokugawa Shogunate ###
  JAP_komei: "Kōmei"
  JAP_characters_emperor_komei_desc: "§YHeadstrong§!\n - £pol_power Legislative Power Gain: §G+0.15§!\n - £stability_texticon Stability: §R-3%§!\n\n§LKōmei, born Osahito, is the 121st Emperor of Japan. A staunch traditionalist, he has consistently opposed the opening of Japan to foreign powers and the unequal treaties signed by the Shogunate. Though his power is largely ceremonial under the Tokugawa regime, his views carry significant moral weight among those who wish to restore direct imperial rule.§!"
  
