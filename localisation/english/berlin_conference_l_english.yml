l_english:

 berlin_conference.1.t: "The Brussels Geographic Conference"
 berlin_conference.1.d: "King Leopold II has invited the explorers and geographers of Europe to his palace in Brussels: Nachtigal, Rohlfs, Cameron, Schweinfurth and many others. The King speaks of opening up central Africa and of striking at the slave trade. After three days of speeches, the conference founds the International African Association, with national committees across Europe and the King as its president.\n\nThe scientists go home satisfied. The King has found a respectable cover for a private ambition."
 berlin_conference.1.a: "A noble undertaking."
 berlin_conference.2.t: "The Comité d'Études du Haut-Congo"
 berlin_conference.2.d: "Henry Morton Stanley has emerged at Boma after following the Congo from Nyangwe to the sea, and the London papers cannot get enough of him. London has shown little interest in his proposal to open the river to British trade. In Brussels the King has listened more carefully.\n\nA new Committee for the Study of the Upper Congo, funded mostly from the royal purse, will send Stanley back up the river to build stations and sign treaties. On paper it is a commercial study group. In practice it answers to one man."
 berlin_conference.2.a: "Send Stanley back."
 berlin_conference.3.t: "The Anglo-Portuguese Treaty"
 berlin_conference.3.d: "After long negotiation, London has agreed to recognise Portugal's old claim to the mouth of the Congo, between 5°12' and 8° south. In exchange Portugal guarantees free navigation and low tariffs for British trade. For Lisbon it is a triumph: centuries of claims to the Kongo coast at last acknowledged by the world's greatest naval power.\n\nBut the treaty has many enemies. Merchants in Manchester fear Portuguese customs houses, Leopold's agents fear being cut off from the sea, and both Paris and Berlin have said they will not accept a settlement of the river arranged between two powers alone."
 berlin_conference.3.a: "The Congo is Portuguese, as it always has been."
 berlin_conference.4.t: "Washington Recognises the Association"
 berlin_conference.4.d: "Henry Shelton Sanford, Leopold's agent in America and a former minister to Brussels, spent the winter lobbying senators with talk of free states, free trade and a refuge for freed slaves. It has worked. Secretary of State Frelinghuysen has declared that the United States recognises the flag of the International Association of the Congo as that of a friendly government.\n\nIt is the first recognition of its kind by any power, and the Association is not a state in any ordinary sense."
 berlin_conference.4.a: "A friend of free trade is a friend of ours."
 berlin_conference.5.t: "The Congo Treaty Collapses"
 berlin_conference.5.d: "The treaty with Portugal has not survived Parliament and the press. The chambers of commerce of Liverpool and Manchester have condemned it, as have missionary societies and humanitarians who distrust Portuguese rule, and France and Germany have refused to recognise it. Lord Granville has informed Lisbon that Her Majesty's Government will not ratify.\n\nIt now looks as though the Congo question will have to be settled by a wider meeting of the powers."
 berlin_conference.5.a: "Let the powers settle it together."
 berlin_conference.6.t: "A Conference on West Africa"
 berlin_conference.6.d_germany: "Bismarck has found an unexpected partner in the French premier, Jules Ferry. Both resent Britain's attempt to settle the Congo with Portugal behind their backs, and both like the idea of a meeting where London could be outvoted.\n\nInvitations are now going out to the capitals of Europe and to Washington for a conference in Berlin on three questions: freedom of trade in the Congo basin, freedom of navigation on the Congo and the Niger, and the formalities to be observed before new occupations on the African coast count as effective. No African ruler has been invited."
 berlin_conference.6.d_prussia: "Berlin and Paris both resent Britain's attempt to settle the Congo with Portugal behind their backs, and both like the idea of a meeting where London could be outvoted.\n\nInvitations are now going out to the capitals of Europe and to Washington for a conference in Berlin on three questions: freedom of trade in the Congo basin, freedom of navigation on the Congo and the Niger, and the formalities to be observed before new occupations on the African coast count as effective. No African ruler has been invited."
 berlin_conference.6.d_other: "No power is willing to let Britain and Portugal decide the fate of the Congo between them, and [ROOT.GetNameDef] has offered to host a gathering of the powers instead.\n\nInvitations are now going out to the capitals of Europe and to Washington for a conference on three questions: freedom of trade in the Congo basin, freedom of navigation on the Congo and the Niger, and the formalities to be observed before new occupations on the African coast count as effective. No African ruler has been invited."
 berlin_conference.6.a: "Send the invitations."
 berlin_conference.7.t: "An Invitation from [FROM.GetNameDef]"
 berlin_conference.7.d: "[FROM.GetNameDef] invites our government to send plenipotentiaries to a conference on the affairs of West Africa, opening in [GetBerlinConferenceCity] in mid-November. The agenda is limited to trade on the Congo, navigation on the Congo and the Niger, and the rules for new occupations on the coast. Officially no territory is to be divided.\n\nFew believe that. Whatever is agreed will shape every claim to African land for a generation, and a power that stays away will have no voice in it."
 berlin_conference.7.d_usa: "[FROM.GetNameDef] invites the United States to send plenipotentiaries to a conference on the affairs of West Africa, opening in [GetBerlinConferenceCity] in mid-November. The State Department is hesitant, since the republic has no African colonies and wants none. But American merchants and the Association's friends argue that the United States cannot be absent when the rules of trade on the Congo are written.\n\nOur minister in Berlin, John Kasson, will attend, with Henry Sanford as his colleague. His instructions are to commit the United States to nothing the Senate would not accept."
 berlin_conference.7.a: "We will attend."
 berlin_conference.7.tt: "We will take part in the conference and sign its §YGeneral Act§!."
 berlin_conference.8.t: "The [GetBerlinConferenceName] Opens"
 berlin_conference.8.d_berlin: "On the Wilhelmstrasse in Berlin, plenipotentiaries from across Europe and from the United States have gathered around a large map of Africa. The opening speech promised commerce and civilisation for the African interior and an end to the slave trade, and the conference has agreed to begin with the question of free trade on the Congo.\n\nHenry Morton Stanley has been attached to the American delegation as an expert adviser. No African is present."
 berlin_conference.8.d_other: "Plenipotentiaries from across Europe and from the United States have gathered in [GetBerlinConferenceCity] around a large map of Africa. The opening speech, delivered on behalf of [berlin_conference_host.GetNameDef], promised commerce and civilisation for the African interior and an end to the slave trade, and the conference has agreed to begin with the question of free trade on the Congo.\n\nHenry Morton Stanley has been attached to the American delegation as an expert adviser. No African is present."
 berlin_conference.8.a: "Our delegation takes its seat."
 berlin_conference.8.b: "The powers divide their maps."
 berlin_conference.10.t: "The Niger and the Association"
 berlin_conference.10.d: "Our delegation in [GetBerlinConferenceCity] has been occupied with two questions. On the Niger, George Goldie's National African Company has bought out its French rivals and signed treaties all along the lower river. Our representatives have persuaded the conference that Britain alone should oversee navigation on the lower Niger. There will be no international commission at Lokoja.\n\nOn the Congo, Portugal's cause is lost. London has today recognised the International Association as a friendly state, on the understanding that British trade will pass freely through its territory."
 berlin_conference.10.a: "The Niger stays British."
 berlin_conference.10.b: "Trade, not flags, is our interest."
 berlin_conference.12.t: "What Makes a Claim?"
 berlin_conference.12.d: "The conference has agreed the rule that will govern every future claim to the African coast. A power that takes possession of new coastal territory, or declares a protectorate over it, must notify the other signatories so that they may object. It must also establish enough authority there to protect existing rights and, where required, freedom of trade.\n\nLawyers will call this effective occupation. The rule applies only to the coasts and says nothing about the interior, or about the consent of the people already living there."
 berlin_conference.12.a: "We will observe the formalities."
 berlin_conference.12.b: "A lawyer's partition."
 berlin_conference.14.t: "The Association Recognised"
 berlin_conference.14.d: "One after another the powers have recognised the International Association of the Congo as a sovereign state: Germany in November; Britain, Italy, Austria-Hungary and the Netherlands in December; Spain in January; France and Russia this month; then Sweden-Norway, Portugal and finally Denmark and Belgium. Its borders, drawn in separate agreements with each neighbour, cover most of the Congo basin.\n\nOfficially the Association is a philanthropic enterprise. In law it has become a state without a nation, and its founder and paymaster is the King of the Belgians."
 berlin_conference.14.a: "His Majesty's work is crowned."
 berlin_conference.15.t: "The General Act of [GetBerlinConferenceCity]"
 berlin_conference.15.d: "After three months the plenipotentiaries have signed a General Act of thirty-eight articles. Trade in the Congo basin is to be free to all nations, without import duties or monopolies. Navigation on the Congo and the Niger is to be open. The slave trade is condemned. New occupations on the African coast must be notified to the other powers and made effective. The International Association, now recognised on all sides, has acceded to the Act.\n\nNothing in the Act divides Africa. Everything in it explains how Africa may now be divided, and the race to do so has already begun."
 berlin_conference.15.a: "Sign the Act."
 berlin_conference.15.b: "So it begins."
 berlin_conference.15.tt: "The §YScramble for Africa§! has begun. Colonial technologies that require it are now available to the historical colonial powers."
 berlin_conference.16.t: "The Senate and the Berlin Act"
 berlin_conference.16.d: "Kasson signed the General Act in Berlin, but President Cleveland's new administration is uneasy. The Act binds its signatories to guarantees on a continent where the republic has no possessions, and the old warning against entangling alliances still carries weight in the Senate. The treaty has been withdrawn from consideration.\n\nThe United States will trade on the Congo like any other nation, but it will not be party to the Act it helped to write."
 berlin_conference.16.a: "No entangling alliances."
 berlin_conference.16.b: "We still have friends in Brussels."
 berlin_conference.17.t: "The King's Second Crown"
 berlin_conference.17.d: "The King has asked Parliament for permission to become sovereign of the new Congo state as well. The constitution requires its consent before the King can head another state, and many deputies fear that Belgium will be dragged into African debts and wars.\n\nLeopold's assurance is simple: the union will be purely personal, and it will cost Belgium nothing. Both houses have voted overwhelmingly in favour. The Congo will belong not to Belgium but to Leopold II."
 berlin_conference.17.a: "A personal union, at no cost to Belgium."
 berlin_conference.18.t: "The Congo Free State"
 berlin_conference.18.d: "At Banana, at the mouth of the river, the Association's officials have read out the proclamation: the Congo Free State is founded, with Leopold II as its sovereign. Its territory stretches from the Atlantic to the Great Lakes and from the Ubangi to the Zambezi watershed, far more land than its few dozen stations can control. Boma will be its capital.\n\nIn Brussels the King's advisers are already drafting decrees that declare all vacant land the property of the state."
 berlin_conference.18.a: "Long live the King-Sovereign."
 berlin_conference.18.b: "Start with the stations on the river."
 berlin_conference.18.tt: "§YCongo Basin§!, §YKongo§!, §YKuba§! and §YLuba§! come under the rule of the Free State."
 berlin_conference.19.t: "A Free State on the Congo"
 berlin_conference.19.d: "The International Association of the Congo has proclaimed itself the Congo Free State, with the King of the Belgians as its sovereign in a purely personal union. Its borders, agreed with France and Portugal in the weeks around the conference, give it most of the Congo basin.\n\nMerchants have been promised free trade, and missionaries an end to the slave trade. What the new state will actually do with its million square miles remains to be seen."
 berlin_conference.19.a: "Long live the King."
 berlin_conference.19.b: "A king's private empire."
 berlin_conference.20.t: "The British Ultimatum"
 berlin_conference.20.d: "Lord Salisbury's telegram leaves no room for doubt. Unless Portuguese forces under Serpa Pinto withdraw from the Shire and from Mashonaland, the British minister will leave Lisbon and the fleet will act. The Rose-Coloured Map, the dream of a Portuguese Africa stretching from Angola to Mozambique, cannot be defended against the Royal Navy.\n\nThe government has given way. In the streets of Lisbon, crowds have turned their anger on the monarchy that backed down."
 berlin_conference.20.a: "We have no choice but to yield."
 berlin_conference.20.b: "Yield, but let the nation remember."
 berlin_conference.21.t: "The Anglo-German Agreement"
 berlin_conference.21.d: "Britain and Germany have settled their African differences in a single agreement. Germany gives up its protectorate at Witu and its hopes for Uganda, and accepts a British protectorate over Zanzibar. Britain recognises German East Africa up to the great lakes and Rwanda, gives South West Africa a narrow corridor to the Zambezi, and fixes the borders of Togo and Kamerun.\n\nImperialists in both countries are disappointed. The new German chancellor, Caprivi, has made clear that he values good relations with London more than a few more square miles of Africa."
 berlin_conference.21.a: "A sensible settlement."
 berlin_conference.22.t: "Marchand at Fashoda"
 berlin_conference.22.d: "After two years and four thousand kilometres from the Atlantic, Captain Jean-Baptiste Marchand and his Senegalese tirailleurs have raised the tricolour over the ruined Egyptian fort at Fashoda on the White Nile. Paris hopes that a French presence on the Upper Nile will force Britain to reopen the Egyptian question.\n\nBut Kitchener's Anglo-Egyptian army is advancing on Omdurman. When it has finished with the Mahdists, it will come south."
 berlin_conference.22.a: "Hold Fashoda."
 berlin_conference.23.t: "The Fashoda Incident"
 berlin_conference.23.d: "Fresh from destroying the Mahdist army at Omdurman, General Kitchener has steamed up the Nile to Fashoda with gunboats and several battalions. There he found Marchand's small French garrison. Over whisky and champagne the two officers agreed to refer the matter to their governments, and for now both flags fly over the town.\n\nIn London and Paris the press talks of war. The Royal Navy is preparing. The French fleet is not ready."
 berlin_conference.23.a: "Paris must decide."
 berlin_conference.23.b: "The Nile is ours."
 berlin_conference.23.c: "Two empires stare each other down."
 berlin_conference.24.t: "Leaving Fashoda"
 berlin_conference.24.d: "Foreign Minister Delcassé has faced the facts. France cannot fight Britain at sea, Russia will not go to war over a fort on the Nile, and the Dreyfus Affair has divided the country. Marchand has been ordered to withdraw.\n\nThe humiliation is bitter, but Delcassé intends to make use of it. If France must give way on the Nile, he wants an understanding with London that leaves France free to act elsewhere."
 berlin_conference.24.a: "Withdraw, and seek an understanding with London."
 berlin_conference.24.b: "Withdraw under protest."
 berlin_conference.25.t: "The Nile-Chad Declaration"
 berlin_conference.25.d: "In a declaration added to their Niger convention of last year, Britain and France have divided the lands between the Nile and Lake Chad. The watershed between the Nile and the Congo basins is to be the boundary. The Bahr al-Ghazal and Darfur lie in the British sphere, while Wadai, Bagirmi and Kanem lie in the French.\n\nFashoda is settled, and with it the last great quarrel between the two empires in Africa."
 berlin_conference.25.a: "The line is drawn."
 berlin_conference.26.t: "Belgium Takes the Congo"
 berlin_conference.26.d: "Four years after Roger Casement's report on the Free State's rubber regime, and three years after a commission of inquiry confirmed much of it, the campaign by missionaries, journalists and politicians across Europe and America has achieved its goal. Leopold II has handed his Congo to Belgium.\n\nParliament has passed the annexation law, and the Free State becomes the Belgian Congo, governed under a colonial charter and answerable to Parliament rather than to the King."
 berlin_conference.26.a: "The colony belongs to the nation now."
 berlin_conference.27.t: "The Belgian Congo"
 berlin_conference.27.d: "Belgium has formally annexed the Congo Free State, ending Leopold II's personal rule after years of international outrage over forced labour in the rubber trade. The new Belgian Congo will be governed under a colonial charter by a ministry in Brussels.\n\nReformers hope the worst abuses will end with the handover. Sceptics point out that many of the same men will remain in charge."
 berlin_conference.27.a: "A new chapter for the colony."
 berlin_conference.27.b: "Too little, too late."
 berlin_conference.28.t: "The Morocco-Congo Treaty"
 berlin_conference.28.d: "The Agadir crisis has ended in a bargain. Germany recognises France's freedom of action in Morocco. In return France hands over about 275,000 square kilometres of French Equatorial Africa to Kamerun, including strips reaching the Congo and the Ubangi that the Germans call Neukamerun, while Germany gives up a small area near Lake Chad.\n\nNationalists in both capitals call it a betrayal."
 berlin_conference.28.a: "Peace, at a price."
 berlin_conference.29.t: "A Continent Partitioned"
 berlin_conference.29.d: "Twenty-nine years after the plenipotentiaries met in [GetBerlinConferenceCity], almost the whole of Africa has been drawn into European empires by treaty, purchase and conquest. Lines sketched on maps in European capitals have become frontiers patrolled by African soldiers in European pay.\n\nThe conference promised free trade, an end to the slave trade and the advance of civilisation. What it delivered was a set of rules for dividing a continent among powers that never asked its people's consent. The empires it created look permanent. They are younger than many of the men who govern them."
 berlin_conference.29.a: "The age of partition is over."

 # 12 March 1878
 scramble_africa.1.t: "Walvis Bay"
 scramble_africa.1.d: "Commander Dyer of HMS Industry has hoisted the Union flag over Walvis Bay, the only good deep-water anchorage on the long, empty coast between the Orange and the Kunene. The Cape government wanted the whole coastline taken under British rule; London has agreed only to the bay and a small strip of land around it. The hinterland, with its Herero and Nama peoples and its handful of missionaries and traders, has been left to look after itself."
 scramble_africa.1.a: "A harbour is all we need."
 scramble_africa.1.tt: "§YWalvis Bay§! comes under British rule, administered by the Cape if it is our subject."
 # 5 July 1882
 scramble_africa.2.t: "Assab Becomes a Colony"
 scramble_africa.2.d: "Thirteen years ago the Rubattino shipping company bought the bay of Assab from local Afar sultans as a coaling station on the way to Suez. The station never prospered, and the government has now bought out the company and placed Assab under direct state rule. It is a strip of hot coast with a few huts and a jetty, but it is the first territory the Kingdom of Italy has ever held outside Europe."
 scramble_africa.2.a: "Italy has a foothold in Africa."
 scramble_africa.2.tt: "§YAssab§! comes under our rule."
 # c. October 1882
 scramble_africa.3.t: "The Rivières du Sud"
 scramble_africa.3.d: "French merchants have traded on the Rio Nunez, the Rio Pongo and the Mellacorée for decades under the guns of a small fort at Boké. To keep out traders from neighbouring Sierra Leone, Paris has now detached these coastal rivers from Senegal and organised them as a separate colony, the Rivières du Sud, under their own lieutenant governor."
 scramble_africa.3.a: "Fly the flag over the southern rivers."
 scramble_africa.3.tt: "§YSoso§! comes under our rule."
 # 30 November 1882
 scramble_africa.4.t: "The Makoko Treaty Ratified"
 scramble_africa.4.d: "Two years ago, Pierre Savorgnan de Brazza persuaded Iloo I, the Makoko of the Teke, to place his lands on the north bank of the Malebo Pool under French protection. Brazza came home to a hero's welcome, and the Chamber has now ratified his treaties by acclamation. His treaties, together with the posts he founded along the Ogooué, including Franceville, and the Orungu country at the river's mouth, form the basis of a new French Congo. Across the Pool, Stanley's men working for the King of the Belgians watch with some alarm."
 scramble_africa.4.a: "Vive Brazza!"
 scramble_africa.4.b: "Fund another expedition up the Ogooué."
 scramble_africa.4.tt: "§YAnziku§!, §YTio§!, §YOuter Gabon§!, §YMitsogo§! and §YOrungu§! come under our rule."
 # 1 February 1883
 scramble_africa.5.t: "The Tricolour at Bamako"
 scramble_africa.5.d: "Colonel Borgnis-Desbordes has completed the line of forts that runs from Kayes on the Senegal, through Bafoulabé and Kita, to the Niger. Today his column raised the tricolour at Bamako and began building a fort on the riverbank. The Toucouleur sultan Ahmadu at Ségou protests, Samori's war bands are raiding to the south, and the planned railway is barely started. But France has reached the Niger."
 scramble_africa.5.a: "On to the Niger!"
 scramble_africa.5.tt: "§YKhasso§!, §YBambouk§! and §YBeledougou§! come under our rule."
 # c. March 1883
 scramble_africa.6.t: "The Loango Coast"
 scramble_africa.6.d: "Lieutenant Cordier has signed a treaty with the Ma Loango placing his kingdom and the coast around Pointe-Noire under French protection. The treaty gives Brazza's inland territories an outlet to the sea at the mouth of the Kouilou, and it closes the coast to the agents of Leopold's Association, who have been signing treaties of their own along the Niari valley."
 scramble_africa.6.a: "The Kouilou is ours."
 scramble_africa.6.tt: "§YLoango§! comes under our rule."
 # c. April 1883
 scramble_africa.7.t: "Porto-Novo Under Protection Again"
 scramble_africa.7.d: "King Toffa of Porto-Novo is caught between the British at Lagos and his powerful neighbour Dahomey. He has asked France to renew the protectorate first agreed in 1863 and allowed to lapse five years later. The tricolour flies over the lagoon port once more, and Porto-Novo becomes the base from which France watches Abomey."
 scramble_africa.7.a: "Restore our protection."
 scramble_africa.7.tt: "§YPorto-Novo§! comes under our rule."
 # 5 July 1884
 scramble_africa.8.t: "Togoland"
 scramble_africa.8.d: "Gustav Nachtigal, travelling along the coast aboard the gunboat Möwe as Imperial Commissioner, has signed a treaty of protection with Mlapa III at Togoville. The German trading firms at Little Popo and Lomé now have a flag to shelter under, and the Reich has its first protectorate in West Africa. Its borders inland are undefined; the British at the Gold Coast and the French at Porto-Novo will have opinions about them."
 scramble_africa.8.a: "The Reich has come to Africa."
 scramble_africa.8.tt: "§YTogo§! and §YVolta§! come under our rule."
 # 14 July 1884
 scramble_africa.9.t: "Kamerun"
 scramble_africa.9.d: "Hamburg firms such as Woermann have long traded with the Duala kings on the Cameroon estuary. On 12 July the kings Bell and Akwa signed treaties with Nachtigal, and two days later the imperial flag was raised. The British consul Hewett, sent to secure the same coast for Britain, arrived five days too late, a mishap that has already earned him a nickname in the trading houses."
 scramble_africa.9.a: "A colony on the Cameroon river."
 scramble_africa.9.tt: "§YBafoussam§! and §YMamfe§! come under our rule."
 # 7 August 1884
 scramble_africa.10.t: "Lüderitzland"
 scramble_africa.10.d: "The Bremen merchant Adolf Lüderitz bought the bay of Angra Pequena and a strip of coast from Joseph Fredericks of Bethanie last year, measured in German geographical miles that are almost five times as long as the English miles the Nama chief believed he was selling. In April the Chancellor telegraphed that the purchase stands under imperial protection, and today the warships Elisabeth and Leipzig hoisted the flag. London, which never claimed the coast, has accepted it with bad grace."
 scramble_africa.10.a: "Raise the flag at Angra Pequena."
 scramble_africa.10.tt: "§YNamibian Desert§! comes under our rule."
 # c. September 1884
 scramble_africa.11.t: "The Gulf of Tadjoura"
 scramble_africa.11.d: "Egypt has withdrawn its garrisons from the Red Sea coast since the Mahdist rising, and the Gulf of Aden is full of empty forts. Léonce Lagarde, recently arrived at Obock, has signed a protectorate treaty with the sultan of Tadjoura, giving France the whole southern shore of the gulf. The Ottomans claim the coast on paper, but they have no means of enforcing it. France finally has its own coaling station on the road to Indochina."
 scramble_africa.11.a: "A French port at the mouth of the Red Sea."
 scramble_africa.11.tt: "§YDjibouti§! comes under our rule."
 # 26 December 1884
 scramble_africa.12.t: "Río de Oro"
 scramble_africa.12.d: "Lieutenant Emilio Bonelli's small expedition has landed on the Dakhla peninsula and set up a trading post among the Saharawi fishing camps. A royal order now places the coast from Cape Bojador to Cape Blanc under Spanish protection. It is mostly sand, but it protects the rich fishing grounds of the Canaries, and Madrid has made sure the powers meeting in Berlin are informed."
 scramble_africa.12.a: "Spain returns to Africa."
 scramble_africa.12.tt: "§YRio de Oro§! comes under our rule."
 # 5 February 1885
 scramble_africa.13.t: "Massawa"
 scramble_africa.13.d: "Colonel Saletta's troops have landed at Massawa as the Egyptian garrison withdraws. London, eager to keep France out of the Red Sea and unable to defend the port itself, raised no objection. Foreign Minister Mancini has told the Chamber that the keys to the Mediterranean lie in the Red Sea. In the highlands, the Emperor Yohannes IV and his commander Ras Alula are watching the new arrivals with suspicion."
 scramble_africa.13.a: "The Red Sea is the key."
 scramble_africa.13.tt: "§YInner Eritrea§! comes under our rule."
 # 5 February 1885
 scramble_africa.14.t: "Convention with the Association"
 scramble_africa.14.d: "While the conference sits, France has made its own agreement with Leopold's International Association. Paris recognises the Association as a friendly state. In return the Association gives up the stations its agents founded in the Niari-Kouilou valley and accepts the Congo and Ubangi rivers as the boundary between them. France also keeps the right of first refusal should the King ever sell his African domain."
 scramble_africa.14.a: "A border on the Congo."
 scramble_africa.14.tt: "§YKota§! comes under our rule."
 # 14 February 1885
 scramble_africa.15.t: "Cabinda and the South Bank"
 scramble_africa.15.d: "The Anglo-Portuguese treaty is dead, and Lisbon has had to settle for less. On 1 February, princes of Ngoyo signed the Treaty of Simulambuco placing Cabinda under the Portuguese crown. Today Portugal signed a convention with the Association. Portugal keeps the Cabinda enclave and the south bank of the river up to Noqui, together with the old Kongo capital at São Salvador. The north bank, with Boma and the road to the Pool, goes to Leopold."
 scramble_africa.15.a: "Cabinda is Portuguese."
 scramble_africa.15.tt: "§YZaire§! and §YNgoyo§! come under our rule."
 # 27 February 1885
 scramble_africa.16.t: "The Imperial Charter for East Africa"
 scramble_africa.16.d: "Last November Carl Peters and two companions of his Society for German Colonisation travelled inland from the Zanzibar coast. In a few weeks they collected treaties from chiefs in Usagara, Nguru and Ukami, who had little idea what they were signing. The day after the General Act was signed in Berlin, the Kaiser issued a charter placing these lands under imperial protection. Sultan Barghash of Zanzibar, who regards the mainland as his, has protested loudly."
 scramble_africa.16.a: "Imperial protection for Usagara."
 scramble_africa.16.tt: "§YLuguru§! comes under our rule."
 # 31 March 1885
 scramble_africa.17.t: "The Bechuanaland Protectorate"
 scramble_africa.17.d: "Sir Charles Warren's expedition has marched north from the Cape without firing a shot, and Britain has proclaimed a protectorate over the Tswana lands up to the 22nd parallel, including the country of Khama III of the Bangwato. The aim is strategic: to keep the road to the interior open, the 'Suez Canal into the interior' as Rhodes calls it, and to prevent the Transvaal Boers from linking up with the Germans in Lüderitzland."
 scramble_africa.17.a: "Keep the road north open."
 scramble_africa.17.tt: "§YBechuanaland§! comes under our rule."
 # 5 June 1885
 scramble_africa.18.t: "The Oil Rivers Protectorate"
 scramble_africa.18.d: "Last year Consul Hewett went from creek to creek in the Niger delta, signing treaties of protection with the rulers of Bonny, Opobo, Old Calabar, Brass and other trading states. Those treaties have now been notified to the powers under the Berlin Act, and a British protectorate is declared over the Oil Rivers. The palm-oil trade is secure. King Jaja of Opobo, who controls most of it, insists his treaty did not give Britain any right to interfere with his business."
 scramble_africa.18.a: "Palm oil flows under the British flag."
 scramble_africa.18.tt: "§YWest Aro§!, §YOpobo§! and §YIjaw§! come under our rule."
 # 30 September 1885
 scramble_africa.19.t: "British Bechuanaland"
 scramble_africa.19.d: "The freebooter republics of Stellaland and Goshen, set up by Boer adventurers on Tswana land, have been dissolved. South of the Molopo river, Britain has made the territory a crown colony of its own, British Bechuanaland, with its seat at Vryburg. Its settlers expect it to be joined to the Cape before long."
 scramble_africa.19.a: "Order on the border."
 scramble_africa.19.tt: "§YStellaland§!, §YGoshen§! and §YSiyanda§! come under our rule."
 # 21 October 1885
 scramble_africa.20.t: "The Treaty of Okahandja"
 scramble_africa.20.d: "The Imperial Commissioner, Heinrich Göring, has persuaded Maharero, paramount chief of the Herero, to accept a treaty of protection at Okahandja. Maharero hopes German support will help him against the Nama raiders of Hendrik Witbooi. In truth the Reich has barely a handful of officials in the whole territory, and Maharero will soon find that its protection means very little."
 scramble_africa.20.a: "Sign the treaty."
 scramble_africa.20.tt: "§YGrootfontein§!, §YHerero§! and §YDamaraland§! come under our rule."
 # 17 December 1885
 scramble_africa.21.t: "The Treaty of Tamatave"
 scramble_africa.21.d: "The two-year war with the Merina kingdom has ended in a compromise. Queen Ranavalona III keeps her throne and her government at Antananarivo, but a French Resident will direct Madagascar's foreign relations. France also receives the great natural harbour of Diego-Suarez in the north and an indemnity of ten million francs. In Antananarivo, the Prime Minister Rainilaiarivony is counting on reading the treaty in his own way."
 scramble_africa.21.a: "Diego-Suarez is ours."
 scramble_africa.21.tt: "§YNorthern Madagascar§! comes under our rule."
 # 24 December 1885
 scramble_africa.22.t: "The Campo Line"
 scramble_africa.22.d: "A Franco-German protocol settles the southern boundary of Kamerun at the Campo river. The coast at Batanga and Kribi, and the forests behind it toward the Beti country, fall to the Reich. In exchange Germany has dropped its claims in the Rivières du Sud and has settled the Togo coast with France. Nobody living in the forest has been consulted."
 scramble_africa.22.a: "Secure the southern coast."
 scramble_africa.22.tt: "§YBeti§! and §YBulu§! come under our rule."
 # 24 December 1885
 scramble_africa.23.t: "The Franco-German Protocol"
 scramble_africa.23.d: "Earlier this year the German agent Colin signed treaties at Koba and Kabitai on the Guinea coast, in the middle of territory France regards as its own. The new Franco-German protocol settles the matter: Germany renounces these claims, and the Kamerun-Gabon boundary is fixed at the Campo river, leaving the Woleu-Ntem forests north of Gabon to France."
 scramble_africa.23.a: "The Guinea coast is French."
 scramble_africa.23.tt: "§YKoba§! and §YWoleu-Ntem§! come under our rule."
 # 12 May 1886
 scramble_africa.24.t: "The Casamance"
 scramble_africa.24.d: "A Franco-Portuguese convention has transferred Ziguinchor and the Casamance valley from Portugal to France. In return Paris has recognised Portugal's claims to Guinea further south and, in an annex Lisbon values more than anything, has accepted in principle Portugal's right to the lands between Angola and Mozambique. Inland, Musa Molo of Fouladou has accepted French protection."
 scramble_africa.24.a: "The Casamance joins Senegal."
 scramble_africa.24.tt: "§YJola§! and §YKolda§! come under our rule."
 # 12 May 1886
 scramble_africa.25.t: "Portuguese Guinea Delimited"
 scramble_africa.25.d: "In return for giving up the Casamance, Portugal has had its Guinea colony recognised by France between the Cacheu river and the Cogon, including the old Kaabu lands around Gabú. More important to Lisbon, the convention's annex recognises in principle Portugal's right to influence the interior between Angola and Mozambique. In Lisbon the newspapers are printing maps that paint the whole width of the continent pink."
 scramble_africa.25.a: "The Rose-Coloured Map advances."
 scramble_africa.25.tt: "§YKaabu§! comes under our rule."
 # 10 July 1886
 scramble_africa.26.t: "The Royal Niger Company"
 scramble_africa.26.d: "George Goldie bought out his French competitors on the river two years ago and has since signed hundreds of treaties with rulers along the lower Niger and the Benue. Today the Crown granted his company a royal charter. The Royal Niger Company may now govern, tax and police the territories it has acquired, keeping them British at almost no cost to the Treasury. Its rivals, and the delta traders it squeezes out, call it a monopoly in all but name."
 scramble_africa.26.a: "Let the Company govern."
 scramble_africa.26.tt: "§YIgala§! comes under our rule."
 # c. June 1886
 scramble_africa.27.t: "Socotra"
 scramble_africa.27.d: "The Mahra sultan of Qishn and Socotra has signed a treaty placing his island under British protection. Socotra lies across the shipping lane from Aden to the Indian Ocean, and the government in Bombay was alarmed at reports of German interest in it. Britain has no intention of administering it. It simply wants no one else there."
 scramble_africa.27.a: "No one else shall have it."
 scramble_africa.27.tt: "§YSocotra§! comes under our rule."
 # 27 October 1886
 scramble_africa.28.t: "Dekhelé"
 scramble_africa.28.d: "Lat Dior Diop, the damel of Cayor, had fought for years against the Dakar to Saint-Louis railway, which he knew would hand his kingdom to France. Today he was killed with a small band of loyal followers at Dekhelé. The railway, opened last year, now runs through a country under French protection. Cayor and the neighbouring kingdom of Baol have lost their last effective defender."
 scramble_africa.28.a: "The railway is safe."
 scramble_africa.28.tt: "§YBaol§! comes under our rule."
 # 1 November 1886
 scramble_africa.29.t: "The Agreement on East Africa"
 scramble_africa.29.d: "London and Berlin have settled the claims of the Sultan of Zanzibar between them. The Sultan keeps his islands and a coastal strip ten miles deep. Inland, a line running from the Umba river to Lake Victoria divides the British sphere to the north from the German one to the south. Kilimanjaro, which British agents had their eye on, ends up on the German side."
 scramble_africa.29.a: "Kilimanjaro is German."
 scramble_africa.29.tt: "§YSukuma§! comes under our rule."
 # 30 December 1886
 scramble_africa.30.t: "The Kunene Boundary"
 scramble_africa.30.d: "A convention with Portugal fixes the frontier between Angola and the German protectorate along the Kunene and Okavango rivers. On paper the Ovambo kingdoms south of the line now lie within the German sphere. In practice no German official has set foot there, and the Ovambo kings continue to rule as before."
 scramble_africa.30.a: "Draw the line at the Kunene."
 scramble_africa.30.tt: "§YOvamboland§! comes under our rule."
 # 30 December 1886
 scramble_africa.31.t: "The Kunene Boundary"
 scramble_africa.31.d: "Germany has accepted the Kunene as the southern frontier of Angola and has recognised Portugal's claim to the Huíla highlands, where Portuguese and Boer settlers have been farming around Humpata and Lubango. Lisbon is even more pleased with a clause recognising its rights in the interior between Angola and Mozambique. London has already let Lisbon know that it does not consider itself bound by that clause."
 scramble_africa.31.a: "Angola's south is secure."
 scramble_africa.31.tt: "§YAngolan Herero§! comes under our rule."
 # 29 April 1887
 scramble_africa.32.t: "The Ubangi Protocol"
 scramble_africa.32.d: "A protocol with the Congo Free State has made the Ubangi river the boundary north of the equator. The Sangha valley and the right bank of the Ubangi are open to French posts. With the Free State held back on the far bank, the way north towards Lake Chad and the Nile lies before France."
 scramble_africa.32.a: "North along the Ubangi."
 scramble_africa.32.tt: "§YBanda§! and §YTeke§! come under our rule."
 # c. May 1887
 scramble_africa.33.t: "Zululand Annexed"
 scramble_africa.33.d: "After the war of 1879 the Zulu kingdom was split into thirteen chiefdoms, and civil war soon followed. Boers who helped Dinuzulu to the throne took most of the northwest as their New Republic in payment. To prevent further Boer advances, and to make sure no foreign power gets a port at St Lucia Bay, Britain has annexed what is left of Zululand as a crown colony."
 scramble_africa.33.a: "Annex Zululand."
 scramble_africa.33.tt: "§YUmfolozi§! and §YEningizimu§! come under our rule."
 # c. July 1887
 scramble_africa.34.t: "The Somali Coast Protectorate"
 scramble_africa.34.d: "Since Egypt withdrew from Zeila and Berbera in 1884, Major Hunter has signed treaties with the Isaaq, Gadabuursi and other Somali clans, who supply Aden's garrison with meat. Britain has now notified the powers under Article 34 of the Berlin Act that its protection covers the coast from Ras Jibuti to Bandar Ziyada. The administration is still run from Aden, and it does not extend far inland."
 scramble_africa.34.a: "Notify the powers."
 scramble_africa.34.tt: "§YWarsangeli§! comes under our rule."
 # 8 February 1889
 scramble_africa.35.t: "The Sultanate of Hobyo"
 scramble_africa.35.d: "Sultan Yusuf Ali Kenadid of Hobyo, at war with his rivals in the Majeerteen sultanate, has accepted Italian protection in exchange for an annual subsidy. The consul at Zanzibar, Vincenzo Filonardi, has negotiated the agreement, giving Italy its first foothold on the Indian Ocean coast of Somalia. The Benadir ports to the south, including Mogadishu, are still held by the Sultan of Zanzibar."
 scramble_africa.35.a: "A foothold on the Indian Ocean."
 scramble_africa.35.tt: "§YHobyo§! comes under our rule."
 # 7 April 1889
 scramble_africa.36.t: "The Majeerteen Protectorate"
 scramble_africa.36.d: "At Alula, at the Horn's tip, Boqor Osman Mahamuud of the Majeerteen has signed a treaty of protection with Italy. Like his rival at Hobyo, he hopes to use Italian money and Italian guns against his enemies. Rome now claims the coast from Cape Guardafui to the Benadir and has notified the powers under the Berlin Act."
 scramble_africa.36.a: "The Horn of Africa is ours."
 scramble_africa.36.tt: "§YSomaliland§! comes under our rule."
 # c. August 1889
 scramble_africa.37.t: "The Eritrean Highlands"
 scramble_africa.37.d: "The Emperor Yohannes IV has been killed fighting the Mahdists at Metemma, and Ethiopia is in confusion. Menelik of Shewa, who is claiming the throne, has signed the Treaty of Wuchale with Italy. The Italians have used the opportunity to occupy Keren and now Asmara, on the plateau above Massawa. The colony of Eritrea will be proclaimed on New Year's Day. The Italian and Amharic texts of the Wuchale treaty do not say quite the same thing about Ethiopia's foreign relations."
 scramble_africa.37.a: "Up onto the plateau."
 scramble_africa.37.tt: "§YOuter Eritrea§! comes under our rule."
 # 21 September 1889
 scramble_africa.38.t: "The Shire Highlands"
 scramble_africa.38.d: "The Scottish missionaries at Blantyre and the African Lakes Company have long feared Portuguese rule over the Shire valley. With Serpa Pinto's Portuguese column advancing up the river, acting consul John Buchanan has declared a British protectorate over the Shire Highlands on his own authority. London has decided to back him."
 scramble_africa.38.a: "Stand by the consul."
 scramble_africa.38.tt: "§YSouth Malawi§! comes under our rule."
 # 6 April 1890
 scramble_africa.39.t: "The Fall of Ségou"
 scramble_africa.39.d: "Colonel Archinard's artillery has opened the walls of Ségou, capital of the Toucouleur empire built by al-Hajj Umar. Sultan Ahmadu was away at Nioro, and his son Madani fled the city. Archinard has installed a Bambara prince as a puppet king over the city his people ruled before Umar conquered it. Ahmadu has lost his capital, but not yet his army."
 scramble_africa.39.a: "Ségou is taken."
 scramble_africa.39.tt: "§YSégou§! comes under our rule."
 # c. May 1890
 scramble_africa.40.t: "The Jolof"
 scramble_africa.40.d: "Alboury N'Diaye, buurba of the Jolof, has been the last Wolof ruler still openly defying France. A column under Colonel Dodds has occupied his kingdom, and Alboury has gone east into exile to join Ahmadu's Toucouleurs. The Jolof is joined to the protectorates of Senegal."
 scramble_africa.40.a: "Senegal is pacified."
 scramble_africa.40.tt: "§YWolof§! comes under our rule."
 # 27 June 1890
 scramble_africa.41.t: "The Lochner Concession"
 scramble_africa.41.d: "Lewanika, Litunga of the Lozi, has long feared the Ndebele and admired the protection Khama of the Bangwato obtained from the Queen. Advised by the French missionary François Coillard, he has signed a concession with Frank Lochner, agent of Rhodes' British South Africa Company. The concession grants mining rights in exchange for protection. Lewanika believes he has made an agreement with the Crown, not with a company."
 scramble_africa.41.a: "Barotseland under the Company."
 scramble_africa.41.tt: "§YWest Zambia§! comes under our rule."
 # 30 June 1890
 scramble_africa.42.t: "Ngamiland"
 scramble_africa.42.d: "An Order in Council has extended the Bechuanaland Protectorate north to the Chobe river and west across the Kalahari to the German frontier, taking in Ngamiland and the Okavango delta."
 scramble_africa.42.a: "Extend the protectorate."
 scramble_africa.42.tt: "§YNorthern Kalahari§! comes under our rule."
 # 1 July 1890
 scramble_africa.43.t: "The Anglo-German Agreement"
 scramble_africa.43.d: "Chancellor Caprivi has made a sweeping settlement with London. Germany gives up its protectorate at Witu and its ambitions in Uganda, and accepts a British protectorate over Zanzibar. In return, Britain recognises German East Africa up to Lake Tanganyika and Lake Victoria, including Karagwe and the kingdoms of Rwanda and Burundi, and grants the South West African protectorate a narrow corridor to the Zambezi. The colonial societies call it a betrayal. Caprivi thinks good relations with Britain are worth more than extra African land."
 scramble_africa.43.a: "A sound bargain."
 scramble_africa.43.tt: "§YCaprivi Strip§!, §YKagera§!, §YTanganyika§! and §YUjiji§! come under our rule."
 # 12 September 1890
 scramble_africa.44.t: "Fort Salisbury"
 scramble_africa.44.d: "Armed with the Rudd Concession that Lobengula signed two years ago and a royal charter granted last October, Rhodes' Pioneer Column has made its way around the Ndebele heartland, guided by the hunter Selous. On a kopje at Harare it has raised the flag and named the spot Fort Salisbury. Mashonaland is occupied, and the pioneers are pegging out gold claims. Lobengula insists he never gave away the land."
 scramble_africa.44.a: "Peg the claims."
 scramble_africa.44.tt: "§YMashonaland§! and §YMasvingo§! come under our rule."
 # 4 November 1890
 scramble_africa.45.t: "The Zanzibar Protectorate"
 scramble_africa.45.d: "With German consent secured in the summer agreement, Britain has formally proclaimed a protectorate over the dominions of Sultan Ali bin Said. The Sultan keeps his palace, his flag and his title. British officers, led by General Lloyd Mathews as first minister, now direct his government, and London has promised to end the slave trade that still passes through his island's markets."
 scramble_africa.45.a: "Zanzibar under protection."
 # 1 January 1891
 scramble_africa.46.t: "The Mrima Coast Purchased"
 scramble_africa.46.d: "The German East Africa Company could not hold the coast against the Abushiri rising, and Hermann von Wissmann's troops had to crush the revolt in its place. The Reich has now bought the Sultan of Zanzibar's sovereign rights over the mainland coast for four million marks and taken over administration from the struggling company. Dar es Salaam will be the capital of German East Africa."
 scramble_africa.46.a: "The Reich takes charge."
 scramble_africa.46.tt: "§YKilwa§! comes under our rule."
 # 1 January 1891
 scramble_africa.47.t: "Nioro"
 scramble_africa.47.d: "Archinard has taken Nioro, the last great fortress of Sultan Ahmadu, on New Year's Day. Ahmadu has fled east toward Massina with what remains of his court. Dinguiraye, the town where al-Hajj Umar began his holy war forty years ago, is now held by France."
 scramble_africa.47.a: "The Toucouleur empire is broken."
 scramble_africa.47.tt: "§YUpper Guinea§! comes under our rule."
 # 11 April 1891
 scramble_africa.48.t: "Kankan"
 scramble_africa.48.d: "Ignoring the 1887 treaty of Bissandougou, Archinard has turned against Samori Touré and taken Kankan, the trading town at the heart of his empire. Samori has not given battle. He is burning his own villages, moving his people and workshops east, and buying repeating rifles through Sierra Leone. This war will be long."
 scramble_africa.48.a: "Take Kankan."
 scramble_africa.48.tt: "§YWassoulou§! comes under our rule."
 # 14 May 1891
 scramble_africa.49.t: "British Central Africa"
 scramble_africa.49.d: "Harry Johnston has been appointed Commissioner, and a protectorate is proclaimed over the lands west and south of Lake Nyasa. Rhodes' company has agreed to pay most of the cost in exchange for rights to the lands beyond. Johnston has a few dozen Sikh soldiers, a country nearly the size of England to govern, and Swahili and Yao slave-trading chiefs who have no intention of accepting his rule."
 scramble_africa.49.a: "Raise the protectorate."
 scramble_africa.49.tt: "§YMalawi§! comes under our rule."
 # 25 May 1891
 scramble_africa.50.t: "The Lunda Treaty"
 scramble_africa.50.d: "A treaty signed with Portugal in Lisbon divides the lands of the Mwant Yav, ruler of the Lunda empire, along the Kasai. The Free State receives the eastern Lunda country around the royal capital at Musumba, and the Kwango-Kwilu lands to the west. Now the Free State's officers have to turn this paper title into real control."
 scramble_africa.50.a: "The Kasai is the line."
 scramble_africa.50.tt: "§YLunda§!, §YNorth Chokwe§! and §YHolo§! come under our rule."
 # 25 May 1891
 scramble_africa.51.t: "The Lunda Treaty"
 scramble_africa.51.d: "Henrique de Carvalho's long expedition to the court of the Mwant Yav has paid off. The Lisbon treaty with the Congo Free State gives Portugal the western Lunda and Chokwe country, and the upper Kwango, extending Angola deep into the interior."
 scramble_africa.51.a: "Angola grows eastward."
 scramble_africa.51.tt: "§YChokwe§! and §YNorth Kimbundu§! come under our rule."
 # 11 June 1891
 scramble_africa.52.t: "The Treaty of Lisbon"
 scramble_africa.52.d: "After the humiliation of last year's ultimatum and a first treaty that the Cortes refused to accept, Portugal has signed a final settlement with Britain. The dream of linking Angola and Mozambique is over. In return Portugal keeps the Angolan plateau and the far southeast, and Mozambique's frontiers are fixed, including the lands between the Zambezi and the Rovuma, which will be handed to a chartered concern, the Nyassa Company."
 scramble_africa.52.a: "Accept what can be held."
 scramble_africa.52.tt: "§YZambezi§!, §YAngolan Plateaus§! and §YMbundu§! come under our rule."
 # c. April 1891
 scramble_africa.53.t: "Sine, Saloum and Futa Toro"
 scramble_africa.53.d: "Treaties have brought the Serer kingdoms of Sine and Saloum under French protection, and their rulers now govern under the eye of French administrators. In the Futa Toro, the last resistance has collapsed with the flight of Abdul Bokar Kan into the Moorish lands across the river, where he will be killed later this year. Senegal's river valley and the groundnut country belong to France."
 scramble_africa.53.a: "The Senegal valley is ours."
 scramble_africa.53.tt: "§YSine§!, §YSaloum§! and §YMatam§! come under our rule."
 # 20 December 1891
 scramble_africa.54.t: "Bunkeya"
 scramble_africa.54.d: "Katanga's copper drew both Rhodes and the King. Msiri, the Yeke king at Bunkeya, refused the British South Africa Company's treaty last year. Now Captain Stairs' Free State expedition has reached Bunkeya. When Msiri refused to accept the Free State flag, Captain Bodson shot him dead and was himself killed in return. Katanga belongs to the Free State."
 scramble_africa.54.a: "Katanga is ours."
 scramble_africa.54.tt: "§YKatanga§! and §YYeke§! come under our rule."
 # 17 November 1892
 scramble_africa.55.t: "Abomey"
 scramble_africa.55.d: "Colonel Alfred Dodds, a Senegal-born officer, marched north from Porto-Novo with marines, Senegalese and Foreign Legion troops. In battle after battle, including against Dahomey's famous women soldiers, his column fought its way to Abomey. King Béhanzin set fire to his capital before abandoning it. France will set up a protectorate over coastal Dahomey and put a more pliant king on the throne. Béhanzin is still at large, but his kingdom is gone."
 scramble_africa.55.a: "Abomey has fallen."
 scramble_africa.55.tt: "§YDahomey§! comes under our rule."
 # 8 December 1892
 scramble_africa.56.t: "The Franco-Liberian Treaty"
 scramble_africa.56.d: "Monrovia claimed the coast as far as the San Pedro river but had never been able to occupy it. Faced with French pressure, Liberia has given up its claims beyond the Cavally. The river is now the eastern frontier of the republic, and the coast and forests to its east are added to the Ivory Coast."
 scramble_africa.56.a: "The Cavally is the frontier."
 scramble_africa.56.tt: "§YMan§! comes under our rule."
 # 10 March 1893
 scramble_africa.57.t: "The Ivory Coast"
 scramble_africa.57.d: "Louis-Gustave Binger's great journey from the Niger to Kong and the coast has shown that the hinterland of Grand-Bassam and Assinie can be linked to French Sudan. Paris has now made the Ivory Coast a colony in its own right, with Binger as its first governor. The Baoulé chiefs of the interior have not been asked and will not accept French authority quietly."
 scramble_africa.57.a: "Binger to Grand-Bassam."
 scramble_africa.57.tt: "§YBaoule§! comes under our rule."
 # c. February 1893
 scramble_africa.58.t: "Yorubaland"
 scramble_africa.58.d: "Last year's expedition against Ijebu-Ode reopened the trade routes from Lagos to the interior. This year Governor Gilbert Carter has toured Yorubaland, signing treaties with Oyo, Ibadan and the Ijesha that end the long Yoruba wars and bring the interior under the authority of the Lagos government. Only the Egba at Abeokuta have kept a semi-independent status."
 scramble_africa.58.a: "Peace in Yorubaland."
 scramble_africa.58.tt: "§YOyo§! comes under our rule."
 # 29 April 1893
 scramble_africa.59.t: "Djenné and Bandiagara"
 scramble_africa.59.d: "Archinard's last campaign has taken the old trading city of Djenné and then Bandiagara, where Ahmadu had re-established his court. Ahmadu has fled east toward Sokoto. Archinard has installed his brother Aguibou as a client king at Bandiagara, on condition that he rules on France's terms."
 scramble_africa.59.a: "Massina is ours."
 scramble_africa.59.tt: "§YMassina§! comes under our rule."
 # 4 November 1893
 scramble_africa.60.t: "Bulawayo"
 scramble_africa.60.d: "Leander Starr Jameson used a clash between Ndebele warriors and Shona near Fort Victoria as a pretext for war. Company columns with Maxim guns cut down the Ndebele regiments on the Shangani and the Bembezi. Lobengula burned his capital and fled north. The Company's men have entered Bulawayo, and Matabeleland is open to settlers."
 scramble_africa.60.a: "Bulawayo is taken."
 scramble_africa.60.tt: "§YMatabeleland§! comes under our rule."
 # 16 December 1893
 scramble_africa.61.t: "Timbuktu"
 scramble_africa.61.d: "Naval lieutenant Boiteux has taken his gunboats down the Niger and occupied the famous city of Timbuktu without orders. A column under Colonel Bonnier marched to support him, but in January Tuareg warriors killed Bonnier and most of his men at Tacoubao. Major Joffre's column will now have to make the conquest secure. In Paris, an officer who acts first and asks permission later is said to have shown initiative."
 scramble_africa.61.a: "Timbuktu is French."
 scramble_africa.61.tt: "§YTimbuktu§! comes under our rule."
 # c. January 1894
 scramble_africa.62.t: "The Arab War Ends"
 scramble_africa.62.d: "For two years the Free State has fought the Swahili-Arab traders of the upper Congo, the successors to Tippu Tip's commercial empire, under the banner of fighting the slave trade. Francis Dhanis' Force Publique and Ngongo Lutete's warriors, who changed sides, took Nyangwe and Kasongo last year. Now Rumaliza has fled to German territory. The Lualaba, the Lomami and the western shore of Lake Tanganyika belong to the Free State."
 scramble_africa.62.a: "The east is ours."
 scramble_africa.62.tt: "§YLukuga§!, §YKivu§!, §YTetala§! and §YBukama§! come under our rule."
 # 15 March 1894
 scramble_africa.63.t: "The Kamerun Hinterland"
 scramble_africa.63.d: "A Franco-German treaty fixes Kamerun's eastern boundary down to the Sangha and gives the colony a narrow strip of land reaching Lake Chad. The stations at Yaoundé and further inland now have a fixed border to work up to, though most of the land within it has yet to see a German official."
 scramble_africa.63.a: "A road to Lake Chad."
 scramble_africa.63.tt: "§YCameroon§! and §YBaboute§! come under our rule."
 # 12 May 1894
 scramble_africa.64.t: "The Lado Lease"
 scramble_africa.64.d: "Britain has leased the Upper Nile lands to Leopold, hoping to block France's way to the Nile. Paris protested so fiercely that the King has had to settle for a smaller area, the Lado enclave on the west bank of the Nile, held only for his lifetime. The Free State's columns still have to reach the river and push out the Mahdists."
 scramble_africa.64.a: "To the Nile!"
 scramble_africa.64.tt: "§YEquatoria§! comes under our rule."
 # 18 June 1894
 scramble_africa.65.t: "The Uganda Protectorate"
 scramble_africa.65.d: "Captain Lugard's intervention in Buganda's wars between Protestant, Catholic and Muslim factions nearly bankrupted the Imperial British East Africa Company. Missionaries campaigned hard against withdrawal, and the government has now declared a protectorate over Buganda. Kabaka Mwanga keeps his throne. The real power belongs to the Protestant chiefs and the British commissioner."
 scramble_africa.65.a: "Keep Uganda."
 scramble_africa.65.tt: "§YBuganda§! and §YWest Luo§! come under our rule."
 # 14 August 1894
 scramble_africa.66.t: "The Mbomu Frontier"
 scramble_africa.66.d: "To end the quarrel over the Upper Nile, the Free State has signed a treaty with France fixing the frontier along the Mbomu river. Leopold gives up his claims to the north and to the Bahr al-Ghazal. In return France recognises the Uele basin, with its Zande sultanates, as Free State territory."
 scramble_africa.66.a: "The Uele is ours."
 scramble_africa.66.tt: "§YAzandeland§! and §YNdkala§! come under our rule."
 # 15 September 1894
 scramble_africa.67.t: "Witbooi Submits"
 scramble_africa.67.d: "Hendrik Witbooi, the Nama leader who refused all protection treaties, has fought the Germans for more than a year. Captain von François' surprise attack on his base at Hornkranz last year killed many women and children but did not end his resistance. The new governor, Theodor Leutwein, has now surrounded Witbooi in the Naukluft mountains and offered terms: Witbooi accepts German protection but keeps his people's guns and becomes a German ally."
 scramble_africa.67.a: "Make peace with Witbooi."
 scramble_africa.67.tt: "§YNama§! comes under our rule."
 # 11 June 1895
 scramble_africa.68.t: "Tongaland"
 scramble_africa.68.d: "Britain has annexed Amatongaland, the coastal country between Zululand and the Portuguese at Delagoa Bay. The Transvaal had hoped to reach the sea through Kosi Bay. That route is now closed."
 scramble_africa.68.a: "Close the road to the sea."
 scramble_africa.68.tt: "§YAmatonga§! comes under our rule."
 # 1 July 1895
 scramble_africa.69.t: "The East Africa Protectorate"
 scramble_africa.69.d: "The Imperial British East Africa Company has gone bankrupt, and the Crown has taken over its territory between the coast and Uganda. The coastal strip remains nominally the Sultan of Zanzibar's, leased to Britain. Parliament is asked to pay for a railway from Mombasa to Lake Victoria; its critics are already mocking it as a lunatic line. On the coast, the Mazrui clan has taken up arms against the new order."
 scramble_africa.69.a: "Build the railway."
 scramble_africa.69.tt: "§YKenyan Coast§!, §YKenya§!, §YEast Kenya§!, §YJubaland§! and §YEast Turkana§! come under our rule."
 # 30 September 1895
 scramble_africa.70.t: "Antananarivo"
 scramble_africa.70.d: "The expedition General Duchesne landed at Majunga has lost thousands of men, nearly all to fever. But a flying column has finally reached Antananarivo, and a few shells on the queen's palace brought surrender. Queen Ranavalona III has signed a treaty accepting a full protectorate. Annexation will follow, and the new governor, General Gallieni, will abolish the Merina monarchy altogether."
 scramble_africa.70.a: "Madagascar is French."
 scramble_africa.70.tt: "§YToamsina§! and §YWestern Madagascar§! come under our rule."
 # 28 December 1895
 scramble_africa.71.t: "Chaimite"
 scramble_africa.71.d: "António Enes' campaign defeated the Gaza armies at Marracuene and Coolela, and today Captain Mouzinho de Albuquerque has captured Gungunhana, emperor of Gaza, at the sacred village of Chaimite. The last great African state in southern Mozambique has fallen. Gungunhana will be shipped to Lisbon and exiled to the Azores. Portugal has a victory to celebrate at last."
 scramble_africa.71.a: "Lisbon has its hero."
 scramble_africa.71.tt: "§YGaza§! comes under our rule."
 # 20 January 1896
 scramble_africa.72.t: "Kumasi"
 scramble_africa.72.d: "Asantehene Prempeh I refused British protection and sent envoys to London to plead his case directly with the Queen. They were not received. Colonel Scott's expedition has entered Kumasi unopposed, and Prempeh, his mother and his chiefs have been arrested and deported. Asante is a protectorate. The British have not found the Golden Stool, the throne in which the spirit of the Asante nation is said to reside."
 scramble_africa.72.a: "Asante is ours."
 scramble_africa.72.tt: "§YAshanti§! comes under our rule."
 # c. June 1896
 scramble_africa.73.t: "Bunyoro and Toro"
 scramble_africa.73.d: "The Uganda Protectorate has been extended over Toro, where Lugard restored Kasagama to the throne, and over Bunyoro. But Omukama Kabarega of Bunyoro has not surrendered. He has taken to the bush and is waging a guerrilla war against British troops and their Ganda allies."
 scramble_africa.73.a: "Extend the protectorate."
 scramble_africa.73.tt: "§YToro§! and §YBunyoro§! come under our rule."
 # 31 August 1896
 scramble_africa.74.t: "The Sierra Leone Protectorate"
 scramble_africa.74.d: "The hinterland of the Freetown colony, the Temne and Mende country, has been declared a British protectorate and divided into districts. Each district will have a commissioner and a company of frontier police. To pay for the administration, a tax on every dwelling is to be levied from 1898. The chiefs are not happy about it."
 scramble_africa.74.a: "Proclaim the protectorate."
 scramble_africa.74.tt: "§YKailahun§! and §YBombali§! come under our rule."
 # 1 September 1896
 scramble_africa.75.t: "Ouagadougou"
 scramble_africa.75.d: "A British envoy got the Mossi to sign a treaty two years ago, but France has not waited for it to mean anything. Captains Voulet and Chanoine have marched into Ouagadougou, and the Mogho Naba Wobgo has fled. A protectorate over the Mossi will be signed with a more cooperative successor. The Mossi plateau is too valuable for London or Berlin to have."
 scramble_africa.75.a: "The Mossi plateau is French."
 scramble_africa.75.tt: "§YOuagadougou§! comes under our rule."
 # 14 November 1896
 scramble_africa.76.t: "Porédaka"
 scramble_africa.76.d: "The Futa Jallon, the Fula theocracy ruled from Timbo, kept its independence for nearly two centuries. Almamy Bokar Biro had seized power by force and could count on little support among the chiefs. At Porédaka his army has been crushed by a French column, and he is dead. The Futa Jallon becomes a French protectorate."
 scramble_africa.76.a: "The Futa Jallon is ours."
 scramble_africa.76.tt: "§YFaranah§! comes under our rule."
 # c. February 1897
 scramble_africa.77.t: "Bida and Ilorin"
 scramble_africa.77.d: "Goldie himself has led the Royal Niger Company's constabulary against the Nupe emirate at Bida and then Ilorin, on the grounds that they were raiding for slaves. Company rifles and Maxim guns broke the cavalry of both emirates. New emirs rule under the Company's eye, and the southern frontier of the Sokoto Caliphate has been pushed back."
 scramble_africa.77.a: "The Company marches."
 scramble_africa.77.tt: "§YKwara§! comes under our rule."
 # 18 February 1897
 scramble_africa.78.t: "Benin City"
 scramble_africa.78.d: "In January, a British party under acting consul Phillips set out for Benin City during a sacred festival despite warnings, and most of its members were killed. A punitive expedition under Admiral Rawson has now taken the city. Much of it burned, and the bronzes and ivories of the royal palace were carried off as spoils. Oba Ovonramwen has been deposed and exiled to Calabar."
 scramble_africa.78.a: "Benin is taken."
 scramble_africa.78.tt: "§YBenin§! comes under our rule."
 # c. March 1897
 scramble_africa.79.t: "Rwanda"
 scramble_africa.79.d: "Rwanda was shaken last year by the coup of Rucunshu, which put the young Musinga on the throne under the control of his mother's clan. When the German officer Captain Ramsay reached the royal court, the new rulers chose to accept the German flag and protection rather than risk another enemy. Germany will rule through the mwami, at least for now."
 scramble_africa.79.a: "Rule through the court."
 scramble_africa.79.tt: "§YRwanda§! comes under our rule."
 # c. September 1897
 scramble_africa.80.t: "The Bagirmi Protectorate"
 scramble_africa.80.d: "Émile Gentil has hauled the steamer Léon Blot overland from the Congo to the Chari and steamed onto Lake Chad. Mbang Gaourang of Bagirmi, whose capital Massenya was burned by the warlord Rabih az-Zubayr, has signed a treaty of protection with France. He wants French help to take his revenge. France wants Lake Chad."
 scramble_africa.80.a: "To Lake Chad."
 scramble_africa.80.tt: "§YBagirmi§! comes under our rule."
 # 1 May 1898
 scramble_africa.81.t: "Sikasso"
 scramble_africa.81.d: "The fortress city of Sikasso, capital of Kenedugu, held out for weeks behind its massive walls. Faama Babemba Traoré refused to surrender and died as the French broke in. The last independent state between the Niger and the Ivory Coast forests has fallen."
 scramble_africa.81.a: "Sikasso has fallen."
 scramble_africa.81.tt: "§YKenedugu§! comes under our rule."
 # 14 June 1898
 scramble_africa.82.t: "The Niger Convention"
 scramble_africa.82.d: "Since Lugard and the French officer Decoeur raced each other to sign treaties in Borgu four years ago, British and French officers have nearly come to blows on the middle Niger. A convention signed in Paris settles the matter: Bussa and the navigable Niger below it stay British, and the northern frontier of the Gold Coast is fixed. Wa and the Dagomba country are now the Northern Territories."
 scramble_africa.82.a: "A line on the Niger."
 scramble_africa.82.tt: "§YBussa§! and §YDagomba§! come under our rule."
 # 14 June 1898
 scramble_africa.83.t: "The Niger Convention"
 scramble_africa.83.d: "The convention signed in Paris leaves Nikki and western Borgu to France, connecting Dahomey with the middle Niger. The French officers at Bussa have had to lower their flag, but France now has a continuous territory from the Bight of Benin to Timbuktu."
 scramble_africa.83.a: "From the sea to the Niger."
 scramble_africa.83.tt: "§YBorgu§! comes under our rule."
 # 29 September 1898
 scramble_africa.84.t: "Samori Captured"
 scramble_africa.84.d: "For seventeen years Samori Touré fought France, moving his entire state east when he was driven out of the Wassoulou. Last year he destroyed the trading city of Kong. Today, cornered and starving in the forests, he has been surprised and taken at Guélémou by a column under Captain Gouraud. He will be exiled to Gabon. The north of the Ivory Coast lies open."
 scramble_africa.84.a: "Samori is ours."
 scramble_africa.84.tt: "§YKong§! and §YKankan§! come under our rule."
 # 19 January 1899
 scramble_africa.85.t: "The Anglo-Egyptian Condominium"
 scramble_africa.85.d: "With the Mahdist state destroyed at Omdurman and the French gone from Fashoda, London and Cairo have signed an agreement on the Sudan. The country will be governed by a governor-general appointed by the Khedive on British recommendation, under both the British and Egyptian flags. The Upper Nile, the Shilluk country around Fashoda and the swamps of the Bahr al-Ghazal will fall within the new condominium."
 scramble_africa.85.a: "Two flags over the Sudan."
 scramble_africa.85.tt: "§YFashoda§!, §YBahr el Ghazal§! and §YSudanese Desert§! come under the Anglo-Egyptian Sudan: held by Egypt if it is our subject, otherwise by us."
 # c. January 1899
 scramble_africa.86.t: "The Middle Niger"
 scramble_africa.86.d: "French posts have spread east along the river from Timbuktu, past Gao to Say. Some Zarma and Songhai rulers have made their peace with France, while those who refused have been dealt with by force. The new Voulet-Chanoine column is now marching east through the region, and stories of the villages it has burned have already begun to reach the coast."
 scramble_africa.86.a: "Hold the river."
 scramble_africa.86.tt: "§YGao§!, §YDendi§! and §YDosso§! come under our rule."
 # 9 April 1899
 scramble_africa.87.t: "Kabarega Captured"
 scramble_africa.87.d: "After years of guerrilla war, Kabarega of Bunyoro has been captured in the Lango country along with Mwanga, the Kabaka of Buganda, who rebelled against the British two years ago. Both men will be exiled to the Seychelles. The country north of Lake Kyoga, including the Acholi lands, is now open to the protectorate."
 scramble_africa.87.a: "The north is open."
 scramble_africa.87.tt: "§YUganda§! comes under our rule."
 # c. July 1899
 scramble_africa.88.t: "Zinder"
 scramble_africa.88.d: "The Voulet-Chanoine column became notorious across the Sahel for its brutality. When Colonel Klobb was sent to relieve its commanders, Voulet had him shot. A few days later, Voulet and Chanoine were themselves killed by their own soldiers. The remnant of the column, now under Lieutenants Joalland and Pallier, has entered Zinder, capital of Damagaram, and is moving on toward Lake Chad."
 scramble_africa.88.a: "Push on to Lake Chad."
 scramble_africa.88.tt: "§YDamagaram§! comes under our rule."
 # 1 January 1900
 scramble_africa.89.t: "Northern Nigeria"
 scramble_africa.89.d: "The Royal Niger Company's charter has been revoked in return for compensation, and at Lokoja Frederick Lugard has read the proclamation establishing the Protectorate of Northern Nigeria. Lugard has a West African Frontier Force of a few thousand men to govern a country of millions. Most of the emirates of the Sokoto Caliphate do not yet recognise British authority."
 scramble_africa.89.a: "Lugard takes command."
 scramble_africa.89.tt: "§YWukari§! and §YTaraba§! come under our rule."
 # 29 January 1900
 scramble_africa.90.t: "North-Eastern Rhodesia"
 scramble_africa.90.d: "The powerful Bemba chieftaincies have long resisted outsiders, but the death of Chief Mwamba and the work of the missionary bishop Dupont have opened the way to British South Africa Company posts at Kasama and beyond. An Order in Council now formally makes the lands between Lake Nyasa and the Luapula into North-Eastern Rhodesia, under Company rule."
 scramble_africa.90.a: "Company rule in the north."
 scramble_africa.90.tt: "§YBemba§! comes under our rule."
 # 22 April 1900
 scramble_africa.91.t: "Kousséri"
 scramble_africa.91.d: "Three French columns have met at Lake Chad: the Foureau-Lamy mission from Algeria, the Joalland-Meynier column from the Niger, and Gentil's force from the Congo. At Kousséri they have destroyed the army of Rabih az-Zubayr. Rabih and the French commander Lamy were both killed in the battle. A new post, Fort-Lamy, will be the capital of the military territory of Chad."
 scramble_africa.91.a: "Fort-Lamy shall stand."
 scramble_africa.91.tt: "§YTschad§!, §YLogone§!, §YSara-Kaba§! and §YDiffa§! come under our rule."
 # 27 June 1900
 scramble_africa.92.t: "The Treaty of Paris"
 scramble_africa.92.d: "After sixteen years of argument, France and Spain have settled their claims on the Gulf of Guinea. Madrid had hoped for much more, but it receives the mainland territory of Río Muni between the Campo and the Muni rivers, together with the islands of Corisco and the Elobeys. The same treaty also fixes the southern frontier of Río de Oro."
 scramble_africa.92.a: "Río Muni is Spanish."
 scramble_africa.92.tt: "§YEquatorial Guinea§! comes under our rule."
 # c. January 1900
 scramble_africa.93.t: "In Salah and the Tuat"
 scramble_africa.93.d: "Escorting the geologist Flamand, French troops have entered In Salah, and after it the other oases of the Tidikelt, the Gourara and the Tuat. The Sultan of Morocco protests that the oases have long recognised his authority. Paris replies that the Anglo-French declaration of 1890 put the Sahara in the French sphere."
 scramble_africa.93.a: "The oases are French."
 scramble_africa.93.tt: "§YTuat§! and §YAlgerian Desert§! come under our rule."
 # c. August 1901
 scramble_africa.94.t: "The Ankole Agreement"
 scramble_africa.94.d: "On the model of the Buganda Agreement signed last year, the Mugabe of Ankole and his chiefs have signed an agreement that brings their kingdom into the Uganda Protectorate. They keep their offices and their lands. In return they collect taxes for the British administration."
 scramble_africa.94.a: "Sign the agreement."
 scramble_africa.94.tt: "§YAnkole§! comes under our rule."
 # 2 September 1901
 scramble_africa.95.t: "Yola"
 scramble_africa.95.d: "Colonel Morland's column has stormed Yola, capital of the Adamawa emirate. Lamido Zubairu, who had refused to recognise British authority, has fled. A more cooperative relative has been installed under British protection. The emirate, already divided on the map between British and German spheres, is now divided on the ground as well."
 scramble_africa.95.a: "Yola is taken."
 scramble_africa.95.tt: "§YAdamawa§! comes under our rule."
 # c. November 1901
 scramble_africa.96.t: "Garoua"
 scramble_africa.96.d: "German forces pressing north from the forests have taken Ngaoundéré and now Garoua on the Benue. The Fulbe lamidos of northern Adamawa are submitting, one after another, to the Kamerun government."
 scramble_africa.96.a: "Advance to the Benue."
 scramble_africa.96.tt: "§YEast Adamawa§! comes under our rule."
 # 20 January 1902
 scramble_africa.97.t: "Bir Alali"
 scramble_africa.97.d: "In Kanem the Sanusiyya, the Sufi order that leads resistance to Europeans across the eastern Sahara, held a fortified lodge at Bir Alali. French troops have stormed it, and Kanem is now within the military territory of Chad. The Sanusi have fallen back to the north, but they are not finished."
 scramble_africa.97.a: "Kanem is ours."
 scramble_africa.97.tt: "§YKanem§! and §YEast Kanem§! come under our rule."
 # c. January 1902
 scramble_africa.98.t: "Maroua"
 scramble_africa.98.d: "German columns have reached the Mandara mountains and occupied Maroua, the gateway to the Lake Chad plain. The northern tip of Kamerun is now under German control."
 scramble_africa.98.a: "On to Lake Chad."
 scramble_africa.98.tt: "§YMandara§! comes under our rule."
 # c. March 1902
 scramble_africa.99.t: "Borno"
 scramble_africa.99.d: "Rabih's son Fadlallah, who tried to rebuild his father's power in Borno, has been killed by a French column. The British have restored the old Shehu dynasty in the person of Abubakar Garbai, under their protection. Borno's capital was left in ruins by Rabih; the Shehu's court will need a new seat."
 scramble_africa.99.a: "Restore the Shehu."
 scramble_africa.99.tt: "§YBorno§! comes under our rule."
 # c. March 1902
 scramble_africa.100.t: "Arochukwu"
 scramble_africa.100.d: "For generations the Aro network ran the trade of the Igbo interior, backed by the authority of the oracle at Arochukwu that British officials called the Long Juju. Four columns of the Southern Nigeria Regiment have now broken it. The oracle's shrine has been destroyed, and the country between the Niger and the Cross River is open to British administration."
 scramble_africa.100.a: "Open the interior."
 scramble_africa.100.tt: "§YAro§! comes under our rule."
 # 7 May 1902
 scramble_africa.101.t: "Tit"
 scramble_africa.101.d: "A small camel-mounted force of Chaamba auxiliaries, led by Lieutenant Cottenest, has defeated the Kel Ahaggar Tuareg at Tit. After centuries of controlling the central Sahara, the Ahaggar confederation will now have to come to terms with France. The new Territories of the South, governed from Algiers, extend French authority deep into the desert."
 scramble_africa.101.a: "The Ahaggar submits."
 scramble_africa.101.tt: "§YAhaggar Mountains§! comes under our rule."
 # 3 February 1903
 scramble_africa.102.t: "Kano"
 scramble_africa.102.d: "Lugard's Frontier Force has blown open the gates in Kano's great earthen walls and taken the city with little loss. Emir Aliyu, who had refused to receive British officers, was away from the city; he will not stay free for long. Zaria is already under British control. The road to Sokoto lies open."
 scramble_africa.102.a: "Kano has fallen."
 scramble_africa.102.tt: "§YHausaland§! comes under our rule."
 # 15 March 1903
 scramble_africa.103.t: "Sokoto"
 scramble_africa.103.d: "Outside Sokoto, the Caliph's cavalry charged the British squares and was cut down. Caliph Attahiru I has fled east with a large following. Lugard has installed a new Caliph who will rule under British protection. The Sokoto Caliphate's emirs will keep their courts, their judges and their taxes, but they will answer to a British resident."
 scramble_africa.103.a: "Rule through the emirs."
 scramble_africa.103.tt: "§YSokoto§! comes under our rule."
 # c. June 1903
 scramble_africa.104.t: "The Treaty of Kiganda"
 scramble_africa.104.d: "Mwami Mwezi IV Gisabo of Burundi resisted the Germans for years. Worn down by a punitive campaign and by rebel chiefs supported by German officers, he has submitted at Kiganda. He keeps his throne, but recognises German overlordship."
 scramble_africa.104.a: "Burundi submits."
 scramble_africa.104.tt: "§YBurundi§! comes under our rule."
 # c. December 1903
 scramble_africa.105.t: "Trarza and Brakna"
 scramble_africa.105.d: "Xavier Coppolani has spent two years in the emirates north of the Senegal, using the support of influential Sufi leaders such as Sheikh Sidiyya Baba to win over the Trarza and Brakna Moors without much fighting. Both emirates have accepted French protection. Next year they will be combined into a civil territory of Mauritania."
 scramble_africa.105.a: "Peaceful penetration."
 scramble_africa.105.tt: "§YTrarza§! and §YBrakant§! come under our rule."
 # 19 March 1905
 scramble_africa.106.t: "The Benadir"
 scramble_africa.106.d: "Company rule on the Benadir coast has failed. The Filonardi company and then the Benadir Company lost money, and the latter was caught up in scandal over its toleration of slavery. Italy has now bought the coastal ports from the Sultan of Zanzibar outright and taken direct control of Mogadishu, Merca and Brava, with the sultanate of Geledi inland under its protection."
 scramble_africa.106.a: "Rome takes direct control."
 scramble_africa.106.tt: "§YGeledi§! comes under our rule."
 # c. April 1905
 scramble_africa.107.t: "The Tagant"
 scramble_africa.107.d: "Coppolani has occupied Tidjikja, the main town of the Tagant. Shaykh Ma al-Aynayn, the great religious leader of the western Sahara, is urging resistance, and warriors from the north have been gathering. Coppolani's methods may not work here as they did in the Trarza."
 scramble_africa.107.a: "Hold Tidjikja."
 scramble_africa.107.tt: "§YMauritania§! comes under our rule."
 # c. June 1906
 scramble_africa.108.t: "Posts in the Sahara"
 scramble_africa.108.d: "Camel companies and small garrisons now hold the main wells and caravan towns of the central Sahara, including Agadez in the Aïr, the salt oasis of Bilma and the desert routes north of the Niger bend. The Tuareg confederations remain armed and proud, but the caravans now pay their duties to France."
 scramble_africa.108.a: "Hold the wells."
 scramble_africa.108.tt: "§YAïr Mountains§!, §YBilma§!, §YSouthern Sahara§!, §YAdrar n Ifoghas§!, §YNorthern Mali§! and §YTaudenni§! come under our rule."
 # c. January 1909
 scramble_africa.109.t: "Atar"
 scramble_africa.109.d: "Colonel Gouraud's column has climbed into the Adrar and taken Atar. The sons of Ma al-Aynayn, who led the resistance in the Adrar, have fallen back north into the Spanish zone. With the Adrar in French hands, the western Sahara has no remaining stronghold."
 scramble_africa.109.a: "The Adrar is ours."
 scramble_africa.109.tt: "§YNorthern Mauritania§! comes under our rule."
 # 2 June 1909
 scramble_africa.110.t: "Abéché"
 scramble_africa.110.d: "The sultanate of Wadai, the last great Sudanic state between Lake Chad and Darfur, has lost its capital. A French column has entered Abéché, and Sultan Dudmurrah has fled into the hills to continue the fight. Wadai is placed under a sultan of France's choosing."
 scramble_africa.110.a: "Wadai is ours."
 scramble_africa.110.tt: "§YWaddai§! comes under our rule."
 # 10 June 1910
 scramble_africa.111.t: "The Lado Enclave Returns"
 scramble_africa.111.d: "Leopold II died in December, and with him ended his lifetime lease on the Lado enclave on the west bank of the Nile. Its Free State garrisons have withdrawn, and the district has been handed over to the Anglo-Egyptian Sudan."
 scramble_africa.111.a: "Take over Lado."
 scramble_africa.111.tt: "§YEquatoria§! comes under the Anglo-Egyptian Sudan: held by Egypt if it is our subject, otherwise by us."
 # c. January 1911
 scramble_africa.112.t: "Ndélé"
 scramble_africa.112.d: "Muhammad al-Sanusi, sultan of Dar al-Kuti, was France's ally for more than ten years. His slave raids supplied the markets of Wadai, and French officials looked the other way while they needed him. Those days are over. French troops have killed the sultan at his capital, Ndélé, and Dar al-Kuti is annexed to Ubangi-Shari."
 scramble_africa.112.a: "Dar al-Kuti is annexed."
 scramble_africa.112.tt: "§YCentral Africa§! comes under our rule."
 # 4 November 1911
 scramble_africa.113.t: "Neukamerun"
 scramble_africa.113.d: "The gunboat Panther's appearance off Agadir has led to a long negotiation with Paris, and finally a treaty. Germany accepts a French protectorate over Morocco. In return, France hands over about 275,000 square kilometres of its equatorial colonies, including strips reaching the Congo and the Ubangi rivers, while Germany cedes the small Duck's Bill area near Lake Chad. The colonial lobby in Berlin calls it a poor exchange."
 scramble_africa.113.a: "Neukamerun is ours."
 scramble_africa.113.tt: "§YWoleu-Ntem§! comes under our rule."
 # c. November 1913
 scramble_africa.114.t: "Aïn Galakka"
 scramble_africa.114.d: "Colonel Largeau's troops have taken the Sanusi lodge at Aïn Galakka in the Borkou after a hard fight. The oases of the Borkou and the Ennedi plateau are now in French hands. Only the Tibesti mountains, further north, remain beyond French control."
 scramble_africa.114.a: "Borkou is ours."
 scramble_africa.114.tt: "§YFaya-Fada§! and §YNorthern Chad§! come under our rule."

 scramble_africa.900.t: "A Foreign Claim"
 scramble_africa.900.d: "[scramble_last_claimant.GetNameDef] has laid claim to land that we hold. For now the claim is only ink on a European map, but claims like this have a way of being enforced."
 scramble_africa.900.d_act: "Under the terms of the General Act of [GetBerlinConferenceCity], [scramble_last_claimant.GetNameDef] has notified the powers that it considers part of our territory to be within its sphere. For now the claim is only ink on a European map, but claims like this have a way of being enforced."
