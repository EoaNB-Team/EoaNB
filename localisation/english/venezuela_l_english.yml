#EVENTS
 venezuela.1.t: "The March Revolution"
 venezuela.1.d: "After years since Venezuela was under a huge social, political and economical crisis, the opposition began to heavily oppose the liberal government of Monagas. Julían Castro, the governor of the province of Carabobo and a conservative politician, spoke out against the government and rallied generals José Laurencio and Léon Febres for his cause. After a minor fight, the unstable government was couped in a revolution who took Caracas back to the conservatives. The victorious conservatives have convoked a national assembly in Valencia to stabilize the government and officially establish Julían Castro as the president. Also, deals have been made with Great Britain and France on a protocol to peacefully solve the situation between conservatives and liberals."
 venezuela.1.a: "The liberal government is over."
 venezuela.1.b: "The government will endure!"

 venezuela.2.t: "The 1858 Constitution"
 venezuela.2.d: "The national assembly of Valencia has declared a new constitution, rejecting the liberal reforms of the previous one that didn't appeal to their interest and weakened the oligarchy. The conservatives have given more autonomy to the states, reaffirming a federation. With this, the name 'Republic of Venezuela' has been officialized. Some liberals have been pleased with this federation, but others claim it's only temporary."
 venezuela.2.a: "This might ease the tensions.."

 venezuela.3.t: "La Galipanada"
 venezuela.3.d: "A protest against the government of Júlian Castro happened in Caracas and Galipan. A liberal conspiracy against the conservative government began with the diplomatic tensions with Britain and France, as the Urrutia Protocol was not honored and the government is imprisoning and persecuting the opposition. In response, the protest began and was quickly taken down, due to the disorganization of their plans and the lack of support, that lead to them being easily arrested and put down."
 venezuela.3.a: "It seems the tensions only have gotten worse."

 venezuela.4.t: "The Fall of Coro"
 venezuela.4.d: "Commander Tirso Salaverria has betrayed the Venezuelan government and with his troops, invaded the headquarters of the army in Coro, gathering 900 rifles and declaring a Venezuelan Federation, claiming for liberty, equality and the end of the oligarchy. They asked for further decentralization, as Ezequiel Zamora and other exiled generals had arrived to join the revolt, it spread throughout the nation, as liberal forces spread throughout Zulia and seized the local port."
 venezuela.4.a: "This is absurd! We are the legitimate government!"
 venezuela.4.b: "The federation stays free!"

 venezuela.5.t: "Failure in Coplé"
 venezuela.5.d: "The strengh of the central army is weakening us, as our guerrilla tactics are still weak and our army is focused on trying to conquer Caracas. We have been defeated easily by the conservative forces, who are holding us off and slowly waiting to push. Falcon has suggested that we divide our army into many forces to fight a guerrilla warfare and get support from all around the nation, specially in the Miranda region."
 venezuela.5.a: "Resist until the end!"

 venezuela.6.t: "Falcón's troops and guerrillas organize!"
 venezuela.6.d: "After years of fighting and returning in 1861, Falcón was finally able to organize his troops in an enormous push. Since our failure, our strengh is growing more than ever. We have called troops all around Venezuela to try to take Caracas, so we seize the government's main city and achieve victory!"
 venezuela.6.a: "The federation shall win!"

 venezuela.7.t: "The Treaty of Coche"
 venezuela.7.d: "After years of violent conflict, the conservative government has agreed to settle the civil war in a peace treaty. Our forces have captured most of their main cities and ports, leaving them powerless against our influence. Peace has finally been achieved, as the government's army has recognized our government as legitimate and Juan Falcón and Jose Paéz representatives have signed a deal at the city of Coche. They convoked the national assembly, electing 88 new officials and finally instituting the liberal party as the governing one. The government has been united and the civil war has finished, with the federation achieving victory."
 venezuela.7.a: "For liberty!"

 venezuela.8.t: "Jose Tadeo begins a rebellion!"
 venezuela.8.d: "After a harsh discussion about the army, Falcón imprisoned the navy minister Manuel Bruzual. This greatly angered most of the liberals and the conservatives, causing a split in the party, that lead to Monagas creating a committee of rebels, planning to overthrow the government. This is a problem, as they are widespread and our forces have been severely weakened since the civil war!"
 venezuela.8.a: "This is extremely worrying!"

 venezuela.9.t: "The Blue Revolution"
 venezuela.9.d: "The coalition known as the Blues has marched on Caracas under the leadership of José Tadeo Monagas. After months of rebellion against Juan Crisóstomo Falcón and his successor Manuel Ezequiel Bruzual, the government's defenses have collapsed. Caracas is in rebel hands, and the old caudillo has reorganized the national administration under the victorious Blue movement. The Federal government has fallen, but Venezuela's long cycle of revolt is far from over."
 venezuela.9.a: "The Blues have taken Caracas."
 venezuela.9.b: "May Monagas guide us.."

 venezuela.10.t: "The Yellow Revolution"
 venezuela.10.d: "A campaign was started by Antonio Guzmán Blanco, general of Venezuela and other veterans of the federal war to overthrow the conservative-liberal coalition of the Blue government. They began secretly their plan by coming from Curaçao, with the rebel army arriving in the port of Coro. Now, their army has invaded Caracas and were supported by the people, who were very angered at the unstable Monagas government. The same Monagas signed an agreement, surrendering and handing the power to Blanco, as the yellow liberals take control once again of the country."
 venezuela.10.a: "Liberty for us!"


 venezuela.11.t: "The Constitution of 1857"
 venezuela.11.d: "Congress has approved a new constitution under José Tadeo Monagas. The presidential term has been extended from four to six years and immediate reelection is now permitted, while authority is further concentrated in the national government. To its supporters, the charter promises continuity and reform; to its opponents, it looks like Monagas has rewritten the state to prolong his rule."
 venezuela.11.a: "A new constitution for a new Venezuela."

 venezuela.12.t: "The March Revolution Triumphs"
 venezuela.12.d: "The Monagas government has collapsed. Julián Castro's movement gathered support faster than Caracas could respond, and the president has resigned rather than continue a struggle his government can no longer win. Castro and his allies now control the capital, and the conservatives have returned to the center of Venezuelan politics."
 venezuela.12.a: "The Conservatives return to power."

 venezuela.13.t: "The March Revolution Is Defeated"
 venezuela.13.d: "The uprising against José Tadeo Monagas has failed. Julián Castro's supporters were unable to break the government's hold over the capital, and the revolutionary coalition is beginning to scatter. For the moment, the liberal government has survived its greatest challenge."
 venezuela.13.a: "The Liberal government survives."

 venezuela.14.t: "The Caudillos Question"
 venezuela.14.d: "With Julián Castro's government established, the caudillos who helped overturn the old order expect their interests to be respected. Leaving them untouched risks preserving the same armed regional power that has destabilized Venezuela for years, but moving against them could turn former allies into enemies. We must decide how the new government will deal with them."
 venezuela.14.a: "Send the caudillos into exile."
 venezuela.14.b: "Make peace with the caudillos."

 venezuela.15.t: "The Fate of José Tadeo Monagas"
 venezuela.15.d: "After resigning the presidency, José Tadeo Monagas has taken refuge under foreign diplomatic protection in Caracas. His enemies demand that the former president answer for the abuses of his government, while France expects the sanctity of its legation to be respected. Whatever we do will define the authority of the new regime at home and its reputation abroad."
 venezuela.15.a: "Leave him under diplomatic protection."
 venezuela.15.b: "Send him into exile."
 venezuela.15.c: "He will never threaten Venezuela again."

 venezuela.16.t: "Who Shall Lead Venezuela?"
 venezuela.16.d: "The conservative seizure of power has succeeded, but the question of leadership remains unresolved. Carlos Soublette could provide a respectable civilian face for the new government while José Antonio Páez guides events from behind the scenes. Alternatively, Páez can assume power himself and accept full responsibility for restoring order."
 venezuela.16.a: "Carlos Soublette will lead the government."
 venezuela.16.b: "Páez will take responsibility."

 venezuela.17.t: "The Partido Igualitario"
 venezuela.17.d: "A new egalitarian movement is attempting to turn popular frustration into organized politics. Its activists denounce oligarchic rule and promise a government rooted in social equality. We can build support carefully and quietly, or bring the movement into the open and force the country to take notice."
 venezuela.17.a: "Build support quietly."
 venezuela.17.b: "Take the movement into the open."

 venezuela.18.t: "The Future of the Armed Forces"
 venezuela.18.d: "The army remains divided between national institutions, personal loyalties and the influence of the caudillos. Pedro Gual Escandón and his allies now face a fundamental choice: expand the professional military staff and build a stronger national force, or reduce the military's political weight and demilitarize the state."
 venezuela.18.a: "Expand the military staff."
 venezuela.18.b: "Demilitarize the nation."

 venezuela.19.t: "The Caudillos Must Be Dealt With"
 venezuela.19.d: "The caudillos remain the greatest obstacle to a government that intends to rule Venezuela rather than bargain with armed regional patrons. We can confront their influence openly by building a professional national army, or make careful preparations in secret and wait until the balance of power favors us."
 venezuela.19.a: "Reform the army openly."
 venezuela.19.b: "Prepare in silence."

 venezuela.20.t: "Venezuelan Arms Arrive"
 venezuela.20.d: "A shipment of Venezuelan rifles and military stores has arrived for our forces. Caracas has chosen more than words of sympathy and is now materially supporting our cause in the American conflict."
 venezuela.20.a: "Their support is welcome."

 venezuela.21.t: "The State of Venezuela"
 venezuela.21.d: "Venezuela enters 1857 under José Tadeo Monagas with the institutions of a republic but the habits of a country still shaped by independence-era caudillos. Political power is divided, regional strongmen command armed followers, and the government must constantly balance reform against the risk of revolt. Before we decide where Venezuela should go, we must understand the state we have inherited."
 venezuela.21.a: "We must understand the country before we can change it."

 venezuela.22.t: "A Nation in Crisis"
 venezuela.22.d: "Behind the formal institutions lies a fragile state. The treasury is strained, the army suffers from corruption and divided loyalties, illiteracy limits modernization, and food shortages weigh on the population. The caudillos remain powerful enough to challenge Caracas whenever their interests are threatened. Venezuela has survived independence, but survival alone will not make it strong."
 venezuela.22.a: "Then there is much work to do."

 venezuela.23.t: "The Federal War"
 venezuela.23.d: "Filled with instability, a divide was growing in Venezuela. As the conservative oligarchy grew richer, centralized and authoritarian as they couped the government in 1858 and treated their opposition brutally, not meeting european demands that tried to stabilize the situation. The liberal federalists have been claiming for a social change from the colonial structure and gathered a large support within the generals. As the conservative presidents failed to stabilize the situation, it all came together in small revolts and by the end, Tirso Salaverria proclaimed a new government in Coro and brought a large number of generals to fight, gathering support from troops all around the country, that began to stage guerrilla warfare against the central government. \n\nVenezuela is now in a state of civil war."
 venezuela.23.a: "Liberals and Conservatives will never get along.."
 venezuela.23.b: "Stand united!"
 venezuela.23.c: "Long live the federation!"

 venezuela.24.t: "Páez Returns to Power"
 venezuela.24.d: "Venezuela has undergone another conservative seizure of power. Supporters of José Antonio Páez have broken the existing government and placed the veteran caudillo once again at the center of national politics. His admirers promise order and experience; his opponents see only the return of the old oligarchy and another reason to take up arms."
 venezuela.24.a: "Venezuela changes hands once again."
 venezuela.24.b: "Order will be restored."

 venezuela.25.t: "The Partido Igualitario Steps Into the Open"
 venezuela.25.d: "The Partido Igualitario has burst into public politics, denouncing the power of the traditional oligarchy and appealing directly to Venezuelans frustrated by years of repression, civil conflict and caudillo rule. Its egalitarian message is spreading quickly, unsettling established parties and giving the discontented a new banner around which to organize."
 venezuela.25.a: "Another movement enters Venezuela's turbulent politics."
 venezuela.25.b: "The old order is beginning to crack."

 venezuela.26.t: "Venezuela Enforces the Abolition of Slavery"
 venezuela.26.d: "Slavery has been formally abolished in Venezuela, yet abuses and forms of coerced servitude have persisted in practice, especially where wealthy landowners exercise overwhelming local influence. The government has now ordered a stronger enforcement campaign to ensure that abolition is respected throughout the country, even at the cost of angering powerful interests."
 venezuela.26.a: "No Venezuelan will be held as a slave."
 venezuela.26.b: "A new blow against slavery in the Americas."

#===============================================================================
# VENEZUELA CHARACTERS
#===============================================================================

 VEN_Jose_Tadeo_Monagas: "José Tadeo Monagas"
 POLITICS_JOSE_TADEO_MONAGAS_DESC: "Veteran of the wars of independence and one of Venezuela's dominant caudillos, José Tadeo Monagas returned to the presidency in 1855 after years of exercising decisive influence over national politics. Once elevated with conservative support, he broke with Páez and the old oligarchy, aligned himself with the Liberals, and concentrated power around his family. His second administration now faces mounting opposition, economic crisis, and anger over the Constitution of 1857, which strengthened the presidency and opened the door to reelection."

 VEN_Julian_Castro: "Julián Castro"
 POLITICS_JULIAN_CASTRO_DESC: "An army officer and governor of Carabobo, Julián Castro became the military figurehead of the March Revolution of 1858, a temporary alliance of Conservatives and Liberals united against Monagas. His rapid victory brought him to the presidency, but the coalition that carried him to Caracas is fragile. Attempts to balance rival factions, foreign diplomatic pressure, and growing federalist unrest threaten to pull his government apart."

 VEN_Jose_Antonio_Paez: "José Antonio Páez"
 POLITICS_JOSE_ANTONIO_PAEZ_DESC: "Hero of independence, llanero caudillo, and one of the chief architects of early republican Venezuela, José Antonio Páez helped separate Venezuela from Gran Colombia and repeatedly served as president or the power behind the government. Driven into exile after his break with Monagas, he returned during the Federal War and again became the rallying point of the conservative cause. His prestige is immense, but so is the opposition to the old political order he represents."

 VEN_Jose_Paez: "José Antonio Páez"
 VEN_Leon_de_Cordero_y_Orberto: "León de Febres Cordero y Oberto"
 VEN_Pedro_Estanislao_Ramos: "Pedro Estanislao Ramos"

 USV_Juan_Falcon: "Juan Crisóstomo Falcón"
 POLITICS_JUAN_CRISOSTOMO_FALCON_DESC: "General Juan Crisóstomo Falcón emerged as one of the principal leaders of Venezuelan federalism after the March Revolution drove him into exile. Returning to lead the Federalist movement, he shared the struggle with Ezequiel Zamora and became its foremost political leader. Victory in the Federal War would place him at the head of a new federal republic, but first the forces of the central government must be defeated."

 USV_Ezequiel_Zamora: "Ezequiel Zamora"
 USV_Manuel_Bruzual: "Manuel Ezequiel Bruzual"

 USV_Jose_Ruperto_Monagas: "José Ruperto Monagas"
 POLITICS_JOSE_RUPERTO_MONAGAS_DESC: "Son of José Tadeo Monagas, José Ruperto Monagas was a soldier and politician shaped by the upheavals surrounding his family's rule. Imprisoned after the March Revolution and later drawn into the Federalist cause, he would return to prominence during the Blue Revolution, commanding forces for his father and eventually becoming provisional president in 1869. His authority rests as much on the Monagas name as on his own military following."