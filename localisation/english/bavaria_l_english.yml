bavaria_focus: "Bavaria Focus Tree"

BAV_focus_hail_king_maximilian: "Hail King Maximilian II"
BAV_focus_hail_king_maximilian_desc: "King Maximilian II restored the stability of the [BAV.GetName]. He is a calm but great man, taking more interest in governmental issues than personal extravagance. Surely his reforms can do wonders for us?"

#ECONOMY
BAV_focus_bavarias_economy: "Bavaria's Economy"
BAV_focus_bavarias_economy_desc: "Bavaria remains a largely agrarian kingdom, but railways, banks, mines, and factories are beginning to change the foundations of its prosperity. We must decide how to turn the resources of the provinces into lasting economic strength."
BAV_focus_the_riches_of_our_lands: "The Riches of our Lands"
BAV_focus_the_riches_of_our_lands_desc: "From the Alpine forests to the iron deposits of the Upper Palatinate, Bavaria possesses resources that have not yet been fully exploited. Better surveys, transport, and investment could transform provincial wealth into national power."
BAV_focus_agrarian_reform: "Agrarian Reform"
BAV_focus_agrarian_reform_desc: "Agriculture still sustains most Bavarians, yet outdated arrangements and fragmented holdings limit its productivity. Reform must improve rural production without destroying the communities and customs that hold the countryside together."
BAV_focus_farms: "Farms"
BAV_focus_farms_desc: "The kingdom's farms need better tools, improved methods, and access to reliable markets. Supporting agricultural improvement will strengthen food supplies and provide the foundation upon which industrial growth can safely rest."
BAV_focus_lumber: "Lumber"
BAV_focus_lumber_desc: "Bavaria's forests provide timber, fuel, and employment, but careless exploitation would squander them. A more systematic forestry policy can supply industry while preserving one of the kingdom's most valuable natural assets."
BAV_focus_trade_and_commerce: "Trade and Commerce"
BAV_focus_trade_and_commerce_desc: "Bavarian producers are separated from many markets by distance, tariffs, and inadequate transport. Encouraging merchants and improving commercial connections will allow the kingdom's goods to travel farther than its borders."
BAV_focus_mining_and_metallurgy: "Mining and Metallurgy"
BAV_focus_mining_and_metallurgy_desc: "The link between mines, furnaces, railways, and workshops offers Bavaria a path towards industrial independence. Developing these sectors together will be difficult, but each can strengthen the others."
BAV_focus_iron_mining: "Iron Mining"
BAV_focus_iron_mining_desc: "Iron ore deposits in the Upper Palatinate can supply the railways and workshops that Bavaria is beginning to build. Better extraction and transport will determine whether these deposits become a strategic asset or remain a provincial curiosity."
BAV_focus_coal_mining: "Coal Mining"
BAV_focus_coal_mining_desc: "Steam power requires dependable fuel. Bavaria's own coalfields are limited, but increased production and access to Bohemian coal may provide the energy needed by its railways, furnaces, and growing cities."
BAV_focus_resource_boom: "Resource Boom"
BAV_focus_resource_boom_desc: "New mines and improved transport have begun to alter the economic balance of the kingdom. If managed carefully, this expansion can create jobs and revenue; if left uncontrolled, it may enrich a few investors while leaving entire districts dependent on a single industry."
BAV_focus_investments_into_infrastructure: "Investments into Infrastructure"
BAV_focus_investments_into_infrastructure_desc: "Factories cannot thrive without roads, bridges, waterways, and reliable stations. Public and private investment in infrastructure will bind the provinces together and make the movement of people and goods more predictable."
BAV_focus_strenghten_the_construction_industry: "Strengthen the Construction Industry"
BAV_focus_strenghten_the_construction_industry_desc: "Railways, barracks, bridges, and factories all require a capable construction sector. Encouraging local firms and skilled labour will reduce our dependence on foreign contractors and accelerate the kingdom's modernisation."
BAV_focus_roads_and_canals: "Roads and Canals"
BAV_focus_roads_and_canals_desc: "Railways are not useful if villages, mines, and workshops cannot reach them. Better roads and waterways will connect the kingdom's economic hinterlands to its main commercial arteries."
BAV_focus_steel_mills: "Steel Mills"
BAV_focus_steel_mills_desc: "Iron is sufficient for many traditional purposes, but modern railways and machinery increasingly demand stronger and more uniform steel. New furnaces and improved methods can place Bavaria at the beginning of this transformation."
BAV_focus_maxhutte: "Maxhütte"
BAV_focus_maxhutte_desc: "The Maxhütte represents the possibility of a Bavarian iron industry built around local ore and reliable railway orders. Supporting its expansion will create a durable connection between mining, metallurgy, transport, and state development."
BAV_focus_industrialisation: "Industrialisation"
BAV_focus_industrialisation_desc: "Bavaria cannot remain solely a land of farms and workshops while neighbouring states build modern industrial economies. We will encourage the growth of factories, skilled employment, and the institutions required to sustain them."
BAV_focus_civilian_economy: "Civilian Economy"
BAV_focus_civilian_economy_desc: "Industrialisation should first improve the kingdom's ordinary prosperity. Consumer goods, agricultural machinery, housing, and commercial production will help ensure that growth benefits more than the army and the state."
BAV_focus_banking: "Banking"
BAV_focus_banking_desc: "Large projects require capital that individual merchants cannot always provide. Stronger banks and joint-stock finance will allow Bavaria to fund railways, factories, and mines while giving investors a stake in the kingdom's future."
BAV_focus_railways: "Railways"
BAV_focus_railways_desc: "The railway network is the backbone of Bavaria's economic development. Extending its lines will unite markets, move raw materials to factories, and allow the government to reach every corner of the kingdom more quickly."
BAV_focus_improved_mobility: "Improved Mobility"
BAV_focus_improved_mobility_desc: "Railways and canals are more than just commercial instruments. Along with traditional roads, they will allow workers, officials, soldiers, and information to move across Bavaria with a speed that earlier governments could scarcely imagine."
BAV_focus_maschinenfabrik_augsburg_ag: "Maschinenfabrik Augsburg AG"
BAV_focus_maschinenfabrik_augsburg_ag_desc: "Augsburg's machinery works demonstrate that Bavarian industry can design and build complex equipment at home. Supporting this enterprise will give local engineers a place to turn technical knowledge into practical production."
BAV_focus_military_economy: "Military Economy"
BAV_focus_military_economy_desc: "The army's needs can stimulate domestic production of metal, machinery, weapons, and transport equipment. We must ensure that military contracts strengthen the wider economy rather than creating a costly industry dependent on permanent mobilization."
BAV_focus_business_subsidies: "Business Subsidies"
BAV_focus_business_subsidies_desc: "Private capital remains cautious when new industries require expensive machinery and uncertain markets. Temporary state support can encourage investment, provided that subsidies create productive capacity rather than protected inefficiency."
BAV_focus_grants_for_engineers: "Grants for Engineers"
BAV_focus_grants_for_engineers_desc: "Machines cannot replace the people who design, operate, and improve them. Scholarships and research grants will help Bavaria retain talented engineers and give its factories access to the expertise they require."
BAV_focus_machine_parts_industry: "Machine Parts Industry"
BAV_focus_machine_parts_industry_desc: "An industrial economy needs more than finished machines; it needs precision tools, boilers, components, and replacement parts. Developing these suppliers will make the Bavarian industry more resilient and less dependent on imported equipment."
BAV_focus_lokomotivfabrik_krauss_und_comp: "Lokomotivfabrik Krauss & Comp."
BAV_focus_lokomotivfabrik_krauss_und_comp_desc: "The establishment of Krauss & Comp. offers Munich a new centre for locomotive construction. Its success could provide Bavaria with reliable engines for branch lines, mines, forests, and the expanding railway network."
BAV_focus_take_notes_from_our_neighbours: "Take Notes From our Neighbours"
BAV_focus_take_notes_from_our_neighbours_desc: "Bavaria does not need to develop every industrial method alone. The experience of Prussia, Austria, France, and the other German states offers useful examples - if we borrow selectively rather than surrendering control of our development."
BAV_focus_new_weapons_technologies: "New Weapons Technologies"
BAV_focus_new_weapons_technologies_desc: "The modern battlefield is increasingly shaped by industry. Investments in metallurgy, precision manufacturing, and chemical knowledge will allow Bavaria to improve its weapons without relying entirely on foreign suppliers."
BAV_focus_rifling_and_artillery: "Rifling and Artillery"
BAV_focus_rifling_and_artillery_desc: "Improved barrels, ammunition, and artillery design can give our soldiers greater range and accuracy. The challenge will be to turn promising experiments into weapons that can be manufactured and maintained in sufficient numbers."
BAV_focus_maschinenbau_gesellschaft_nurnberg_klett_und_co: "Maschinenbau-Gesellschaft Klett und Co."
BAV_focus_maschinenbau_gesellschaft_nurnberg_klett_und_co_desc: "Nuremberg's foundries and machine works are well placed to serve both civilian industry and state projects. Encouraging their expansion will strengthen Franconia's economy and provide us with another centre of heavy manufacturing."
BAV_focus_expand_koniglich_bayerische_gewehrfabrik: "Expand Kgl. Bayerische Gewehrfabrik"
BAV_focus_expand_koniglich_bayerische_gewehrfabrik_desc: "The Royal Bavarian Rifle Factory at Amberg must be able to keep pace with changes in infantry weaponry. Expanded workshops and improved machinery will help secure the army's supply while preserving a measure of strategic independence."

#ARMY
BAV_focus_bavarias_army: "Bavaria's Army"
BAV_focus_bavarias_army_desc: "The Bavarian army is large enough to matter, but not yet organized or equipped to withstand a modern great-power conflict. Its future will depend on whether we prioritize professional excellence, mass mobilisation, or a compromise acceptable to the Landtag and the Crown."
BAV_focus_focus_on_quality: "Focus on Quality"
BAV_focus_focus_on_quality_desc: "A smaller force of well-trained soldiers may serve Bavaria better than a larger army that cannot be properly trained, equipped, and commanded. We will invest in discipline, instruction, and reliable cadres rather than pursue numbers for their own sake."
BAV_focus_focus_on_quantity: "Focus on Quantity"
BAV_focus_focus_on_quantity_desc: "Bavaria cannot match the largest German powers man for man, but it can ensure that every district contributes to the defence of the kingdom. Broader recruitment and larger reserves will give us strength when the army is mobilised."
BAV_focus_accept_landtag_influence: "Accept Landtag Influence"
BAV_focus_accept_landtag_influence_desc: "The army is maintained by the resources of the kingdom, and the Landtag therefore has a legitimate interest in its size and cost. Accepting parliamentary scrutiny may hinder more substantial reform, but it can give military policy a broader political foundation and, thus, a more stable development in other areas."
BAV_focus_convince_the_landtag: "Convince the Landtag"
BAV_focus_convince_the_landtag_desc: "Military expenditure will not be approved merely because generals demand it. We must demonstrate that improved training, equipment, and mobilisation are necessary for Bavaria's security rather than luxuries for the officer corps."
BAV_focus_fight_landtag_influence: "Fight Landtag Influence"
BAV_focus_fight_landtag_influence_desc: "The readiness of the army cannot be subjected to every fluctuation in parliamentary politics. The Crown and the military leadership must retain sufficient freedom to prepare Bavaria before a crisis leaves no time for debate."
BAV_focus_modernise_the_army: "Modernise the Army"
BAV_focus_modernise_the_army_desc: "The lessons of recent wars are clear: organisation, communications, firepower, and mobilisation matter as much as courage. A systematic programme of reform will bring the Bavarian army closer to the requirements of modern warfare."
BAV_focus_train_our_generals: "Train our Generals"
BAV_focus_train_our_generals_desc: "Bravery cannot replace preparation at the highest level of command. Staff exercises, map studies, and a closer examination of foreign campaigns will help our generals coordinate large formations in the confusion of war."
BAV_focus_learn_from_the_french: "Learn from the French"
BAV_focus_learn_from_the_french_desc: "French military institutions place great emphasis on professional soldiers, centralised administration, and battlefield experience. Studying their methods may help Bavaria improve its army without simply copying the systems of its German neighbours."
BAV_focus_learn_from_the_austrians: "Learn from the Austrians"
BAV_focus_learn_from_the_austrians_desc: "Austria remains Bavaria's most familiar great-power partner and possesses extensive experience in multinational warfare. Its successes and failures offer valuable lessons for an army that may one day fight beside Austrian troops."
BAV_focus_learn_from_the_prussians: "Learn from the Prussians"
BAV_focus_learn_from_the_prussians_desc: "Prussia's system of mobilisation, staff work, and reserve organisation has transformed the expectations of German warfare. Adopting selected elements could improve our efficiency, even if political concerns make complete imitation impossible."
BAV_focus_introduce_modern_weapons: "Introduce Modern Weapons"
BAV_focus_introduce_modern_weapons_desc: "Bavarian soldiers must not enter the next war carrying weapons that belong to the last. Better rifles and artillery will require difficult choices between proven designs, domestic production, and the cost of rapid rearmament."
BAV_focus_prepare_for_the_worst: "Prepare for the Worst"
BAV_focus_prepare_for_the_worst_desc: "Diplomacy may postpone a conflict, but it cannot guarantee peace. We will prepare supply depots, mobilisation schedules, defensive positions, and reserve formations before the next German crisis becomes a war."
BAV_focus_build_maximilian_ii_kaserne: "Build the Maximilian-II-Kaserne"
BAV_focus_build_maximilian_ii_kaserne_desc: "A modern army requires modern barracks. A new complex bearing the late king's name will provide better facilities for training, administration, and the permanent forces needed to protect Bavaria."
BAV_focus_renovate_the_isarkaserne: "Renovate the Isarkaserne"
BAV_focus_renovate_the_isarkaserne_desc: "The Isarkaserne remains an important military site in Munich, but its facilities no longer meet the demands of a growing and increasingly technical army. Renovation will improve readiness while making better use of existing infrastructure."
BAV_focus_develop_war_plans: "Develop War Plans"
BAV_focus_develop_war_plans_desc: "Bavaria's position makes several wars conceivable: against Prussia, alongside Austria, or in defence of the southern states. Our commanders must prepare practical plans for each possibility without committing the kingdom to a conflict it does not seek."
BAV_focus_war_in_the_german_confederation: "War In The German Confederation"
BAV_focus_war_in_the_german_confederation_desc: "The German question can no longer be settled by speeches alone. Bavaria must be ready to defend its sovereignty and determine the future of southern Germany."
BAV_focus_bavaria_victorious: "Bavaria Victorious"
BAV_focus_bavaria_victorious_desc: "Victory has given Bavaria an opportunity that no minister could have safely demanded before the war. We must now decide whether to use our success to preserve the Confederation, lead the southern states, or impose a new balance in Germany."
BAV_focus_stalemate: "Stalemate"
BAV_focus_stalemate_desc: "Neither side has achieved the decisive victory it expected. The army remains in the field, the treasury is strained, and diplomacy must now accomplish what military force could not."
BAV_focus_bavaria_defeated: "Bavaria Defeated"
BAV_focus_bavaria_defeated_desc: "Defeat has exposed every weakness in our organisation and preparation. Bavaria must reform its army and negotiate from a position of necessity, while ensuring that military failure does not become the end of the kingdom's independence."
BAV_focus_bayerische_heeresreform: "Bayerische Heeresreform"
BAV_focus_bayerische_heeresreform_desc: "The army's shortcomings can no longer be dismissed as temporary misfortune. A comprehensive Bavarian military reform will reorganise recruitment, command, training, and equipment for the realities revealed by modern war."
BAV_focus_expand_the_landesfestung_ingolstadt: "Expand Landesfestung Ingolstadt"
BAV_focus_expand_the_landesfestung_ingolstadt_desc: "Ingolstadt is the kingdom's central fortress and an important safeguard for the Danube approaches. Expanding its works and improving its artillery will provide Bavaria with a stronger defensive position in any future conflict."
BAV_focus_introduce_breech_loader_weapons: "Introduce Breech-Loader Weapons"
BAV_focus_introduce_breech_loader_weapons_desc: "The slow loading of muzzle-loaders places our infantry at a serious disadvantage. Converting existing rifles may offer an affordable first step, while new breech-loaders can gradually equip the formations expected to bear the heaviest fighting."
BAV_focus_abandon_the_landwehr: "Abandon the Landwehr"
BAV_focus_abandon_the_landwehr_desc: "The Landwehr provides depth, but its separate organisation can weaken cohesion between active and reserve formations. We will consider replacing it with a more integrated reserve system built around the needs of the field army."
BAV_focus_enforce_mandatory_conscription: "Enforce Mandatory Conscription"
BAV_focus_enforce_mandatory_conscription_desc: "Enforce Mandatory Conscription"
BAV_focus_enforce_mandatory_conscription_desc: "A credible field army cannot depend on volunteers, substitutes, and uneven local arrangements. Universal military obligations would provide Bavaria with a predictable flow of trained men, although the measure will face resistance from the Church, taxpayers, and - most importantly - the Landtag."

#POLITICS
BAV_focus_bavarias_politics: "Bavaria's Politics"
BAV_focus_bavarias_politics_desc: "The kingdom's future will be shaped by the balance between the Crown, the Landtag, and the competing visions of Bavaria's political factions. We must decide how much authority Bavaria is willing to entrust to either tradition or reform."
BAV_focus_our_place_in_the_world: "Our Place in the World"
BAV_focus_our_place_in_the_world_desc: "[BAV.GetNameDef], at the moment, is neither a great power nor a minor principality. Between Austria, Prussia, and the rising forces of nationalism, we must determine how an independent kingdom can defend its interests and preserve its influence."
BAV_focus_try_to_play_a_role_in_the_concert_europe: "Try to Play a Role in the Concert of Europe"
BAV_focus_try_to_play_a_role_in_the_concert_europe_desc: "The great powers maintain Europe's uneasy balance through diplomacy, conferences, and carefully measured interventions. Bavaria cannot dictate the rules, but it may still find a place among those who shape them."
BAV_focus_bolster_our_position: "Bolster our Position"
BAV_focus_bolster_our_position_desc: "Diplomatic influence rests upon more than declarations. By strengthening our finances, administration, and military potential, we can ensure that Bavaria's voice is not dismissed when the future of Germany is discussed."
BAV_focus_expand_our_diplomatic_reach: "Expand Our Diplomatic Reach"
BAV_focus_expand_our_diplomatic_reach_desc: "Our envoys must look beyond the immediate concerns of the German Confederation. Closer contact with European courts will provide Bavaria with information, partners, and room for manoeuvre in an uncertain age."
BAV_focus_demand_seat_in_directory: "Demand a Seat in the Directory"
BAV_focus_demand_seat_in_directory_desc: "The German Confederation cannot remain permanently balanced between Vienna and Berlin while leaving Bavaria without a commensurate voice. We shall call for a federal directory in which the middle states, and the [BAV.GetName] at their head, can defend their interests."
BAV_focus_pursue_trias_policy: "Pursue Trias Policy"
BAV_focus_pursue_trias_policy_desc: "Neither Austria nor Prussia should be allowed to decide Germany's fate alone. A concert of the middle states could form a third force, preserving the independence of its members while ensuring Bavaria also plays a leading role."
BAV_focus_increase_our_influence_in_the_confederation: "Increase Our Influence in the Confederation"
BAV_focus_increase_our_influence_in_the_confederation_desc: "The Confederation offers Bavaria a legal and diplomatic arena in which to resist domination by the two great powers. We must use every committee, vote, and negotiation to make our position impossible to ignore."
BAV_focus_champion_demands_of_middle_states: "Champion the Demands of the Middle States"
BAV_focus_champion_demands_of_middle_states_desc: "Saxony, Württemberg, Hanover, and the other middle states share many of our fears, even if they do not always share our leadership. Bavaria will present their demands as a common defence of German particularism."
BAV_focus_rally_middle_states_behind_us: "Rally the Middle States Behind Us"
BAV_focus_rally_middle_states_behind_us_desc: "A Trias cannot be proclaimed from Munich alone. We must convince the middle states that cooperation under Bavarian guidance offers them greater security than submission to either Vienna or Berlin."
BAV_focus_stay_humble_and_focus_on_ourselves: "Stay Humble and Focus on Ourselves"
BAV_focus_stay_humble_and_focus_on_ourselves_desc: "Grand designs have repeatedly foundered on the suspicion of Bavaria's neighbours. Rather than seeking leadership we cannot enforce, we can concentrate on making the kingdom prosperous, stable, and difficult to coerce."
BAV_focus_find_comfort_in_moderation: "Find Comfort in Moderation"
BAV_focus_find_comfort_in_moderation_desc: "Bavaria need not choose between isolation and grand German ambitions. A cautious policy of limited cooperation, constitutional restraint, and firm particularism may preserve more than any premature show of strength."
BAV_focus_armed_neutrality: "Armed Neutrality"
BAV_focus_armed_neutrality_desc: "Neutrality is meaningful only when others believe we can defend it. A capable army and clear preparations will allow Bavaria to remain outside foreign quarrels without appearing helpless."
BAV_focus_uncompromising_particularism: "Uncompromising Particularism"
BAV_focus_uncompromising_particularism_desc: "Bavaria's crown, laws, army, and traditions are not bargaining pieces for a distant national project. We shall defend the kingdom's sovereignty against every attempt to replace it with uniformity from Berlin or Vienna."
BAV_focus_in_treue_fest: "In Treue Fest"
BAV_focus_in_treue_fest_desc: "Our strength lies in the loyalty binding Crown, people, army, and homeland together. By reaffirming this bond, Bavaria can face the storms of German politics without surrendering the character that makes it a kingdom."

BAV_focus_crown_and_assembly: "The Crown and the Assembly"
BAV_focus_crown_and_assembly_desc: "The Bavarian constitution grants the Crown considerable authority, but the Landtag controls the purse and remains a force that no ministry can ignore. The kingdom's stability will depend on how these institutions manage their uneasy partnership."
BAV_focus_dealing_with_the_past: "Dealing with the Past"
BAV_focus_dealing_with_the_past_desc: "Bavaria's present institutions were shaped by reforms, wars, annexations, and foreign influence. Before we can decide the kingdom's future, we must determine which parts of this inheritance deserve preservation and which must be left behind."
BAV_focus_aftermath_of_napoleonic_era: "Aftermath of the Napoleonic Era"
BAV_focus_aftermath_of_napoleonic_era_desc: "The Napoleonic period transformed Bavaria's borders and administration while leaving behind both useful reforms and deep resentment. The settlement that followed still shapes the relationship between Munich and the kingdom's newly acquired lands."
BAV_focus_embrace_montgelas_legacy: "Embrace Montgelas' Legacy"
BAV_focus_embrace_montgelas_legacy_desc: "The reforms associated with Montgelas created a more centralised and capable Bavarian state. We should preserve their administrative clarity while adapting them to the constitutional and social realities of the present."
BAV_focus_protect_denominational_equality: "Protect Denominational Equality"
BAV_focus_protect_denominational_equality_desc: "With the territorial additions in the Napoleonic Era, the number of Protestants in our realm greatly increased, not always to the liking of the dominant Catholic institutions. However, Montgelas knew that there is greater benefit in denominational equality. Religious balance is not merely a matter of principle; it is essential for binding together a kingdom whose development, stability, and wealth are in the best interest of everybody."
BAV_focus_complete_cadastral_survey: "Complete the Cadastral Survey"
BAV_focus_complete_cadastral_survey_desc: "A modern state must know what land is held, by whom, and under which obligations. Completing the cadastral survey started by Montgelas will clarify property rights, improve taxation, and give the government a firmer foundation for future reforms."
BAV_focus_reconcile_provinces: "Reconcile the Provinces"
BAV_focus_reconcile_provinces_desc: "Old Bavaria, Franconia, Swabia, and the Rhenish Palatinate possess distinct traditions and interests. Despite Montgelas' centralisation efforts, a durable kingdom cannot rely on loyalty to Munich alone; it must give every province a reason to see Bavaria as its own state."
BAV_focus_rhenish_privileges: "The Rhenish Privileges"
BAV_focus_rhenish_privileges_desc: "The Palatinate's legal and economic traditions differ from those of the old Bavarian lands. Rather than erasing these peculiarities, we may preserve selected Rhenish privileges and turn local particularism into loyalty to the Crown."
BAV_focus_acknowledge_franconian_autonomy_claims: "Acknowledge Franconian Autonomy Claims"
BAV_focus_acknowledge_franconian_autonomy_claims_desc: "Franconian officials and notables have long feared that Munich treats their provinces as conquered territories. Limited recognition of local customs and administrative interests could ease these tensions without endangering the unity of the kingdom."
BAV_focus_new_penal_and_criminal_codes: "New Penal and Criminal Codes"
BAV_focus_new_penal_and_criminal_codes_desc: "The kingdom's legal order still bears the marks of different provinces and earlier decades. A clearer and more consistent criminal code would strengthen royal administration while making justice less dependent on local custom."
BAV_focus_change_administrative_responsibilities: "Change Administrative Responsibilities"
BAV_focus_change_administrative_responsibilities_desc: "Too many responsibilities remain divided between ministries, district authorities, and local bodies. A careful redistribution and separation of powers can make the state more efficient without forcing every province into the same mould."
BAV_focus_aftermath_of_eighteen_forty_eight: "Aftermath of 1848"
BAV_focus_aftermath_of_eighteen_forty_eight_desc: "The Revolutions of 1848 shook the foundations of every German monarchy. Bavaria avoided the worst outcome, but demands for representation, reform, and national unity have not disappeared."
BAV_focus_uphold_constitution: "Uphold the Constitution"
BAV_focus_uphold_constitution_desc: "The constitution remains the framework through which Crown, ministers, and Landtag can coexist. By respecting its provisions, the monarchy may contain opposition without turning every disagreement into a crisis."
BAV_focus_pardon_forty_eighters: "Pardon the Forty Eighters"
BAV_focus_pardon_forty_eighters_desc: "Many who challenged the old order were driven by conviction rather than treason. A carefully framed pardon could bring former opponents back into public life while demonstrating confidence in both, the benevolence and strength of the Bavarian monarchy."
BAV_focus_establish_liberal_press_code: "Establish a Liberal Press Code"
BAV_focus_establish_liberal_press_code_desc: "The press has become an arena in which many Bavarians debate the future of the kingdom. Whilst radical opinions could find a voice here as well, a liberal press code also ensures that open debates can lead to pragmatic and beneficial solutions."
BAV_focus_challenge_remnants_of_forty_eight: "Challenge the Remants of 1848"
BAV_focus_challenge_remnants_of_forty_eight_desc: "Not every revolutionary demand disappeared with the barricades. The government can either tolerate the constitutional restraints the revolution brought or move against those who still seek to weaken royal authority and overturn the existing order."
BAV_focus_attempt_suffrage_reform: "Attempt a Suffrage Reform"
BAV_focus_attempt_suffrage_reform_desc: "The composition of the Landtag no longer serves the needs and interests of the kingdom, but it is set in cement by the suffrage law that survived the revolution. A revision of said law could strengthen the authority of the Crown's proponents in order to stabilise the realm."
BAV_focus_take_action_against_kings_enemies: "Take Action Against the King's Enemies"
BAV_focus_take_action_against_kings_enemies_desc: "The Crown cannot permit conspirators and openly subversive movements to operate without consequence. Stronger policing and closer supervision of political associations would protect the monarchy, though at the cost of trust among liberals."
BAV_focus_abolish_feudal_residues: "Abolish Feudal Residues"
BAV_focus_abolish_feudal_residues_desc: "Remaining feudal obligations burden rural communities and preserve privileges that no longer fit the modern kingdom. Their removal would complete an unfinished task of state-building and make property relations more predictable."
BAV_focus_weaken_guilds: "Weaken the Guilds"
BAV_focus_weaken_guilds_desc: "The guilds protect established craftsmen but restrict entry, innovation, and competition. Reducing their influence would encourage economic growth, even if it provokes resistance from urban artisans who fear being displaced."
BAV_focus_dealing_with_the_present: "Dealing with the Present"
BAV_focus_dealing_with_the_present_desc: "Bavaria now faces problems that cannot be solved by appealing to either old privileges or revolutionary memories. Industrial growth, confessional tensions, and national politics demand practical choices from the government."
BAV_focus_matrikel_question: "The Matrikel Question"
BAV_focus_matrikel_question_desc: "The Matrikel system preserves distinctions between established citizens and those whose rights remain tied to local registration and inherited status. Its defenders call it a safeguard of order; its critics see an obstacle to equal participation in the kingdom."
BAV_focus_abolish_matrikel: "Abolish the Matrikel"
BAV_focus_abolish_matrikel_desc: "Removing the Matrikel distinctions would affirm that Bavarian citizenship rests on allegiance to the state rather than on local privilege. The reform would strengthen legal unity, but many communities will regard it as an attack on their traditional autonomy."
BAV_focus_uphold_traditional_order: "Uphold the Traditional Order"
BAV_focus_uphold_traditional_order_desc: "Rapid reform risks alienating the very institutions that have preserved Bavaria through decades of upheaval. We shall defend established privileges and proceed only where change can be reconciled with throne, altar, and local custom."
BAV_focus_spirit_of_munich: "The Spirit of Munich"
BAV_focus_spirit_of_munich_desc: "Munich has become a centre of administration, culture, and political debate. Its universities, salons, and ministries can provide the kingdom with a new sense of purpose, provided that the capital's confidence does not become provincial arrogance."
BAV_focus_stick_with_northern_lights: "Stick with the Northern Lights"
BAV_focus_stick_with_northern_lights_desc: "The Protestant states have demonstrated that administrative and educational modernization need not destroy monarchical government. We can learn from that example by providing well-educated and determined people from Northern Germany to hold positions of influence in Bavaria, as we have done thus far."
BAV_focus_appease_clerics: "Appease the Clerics"
BAV_focus_appease_clerics_desc: "The Catholic Church remains one of the kingdom's most influential institutions, especially in the countryside. By respecting clerical concerns in education, public morality, and state affairs, the Crown can secure valuable support for its wider programme."
BAV_focus_fidelis_ad_scientiam: "Fidelis ad Scientiam"
BAV_focus_fidelis_ad_scientiam_desc: "Loyalty to Bavaria need not mean suspicion of modern knowledge. By encouraging universities, technical instruction, and scientific inquiry, the kingdom can prepare its citizens for an industrial age without abandoning its political traditions."
BAV_focus_beneficium_in_moderatione_est: "Beneficium in Moderatione Est"
BAV_focus_beneficium_in_moderatione_est_desc: "The greatest benefit lies in moderation. Neither clerical domination nor reckless secularization serves Bavaria; a cautious settlement can preserve religious peace while allowing the state to govern according to its own needs."
BAV_focus_fidelis_baviariae: "Fidelis Baviariae"
BAV_focus_fidelis_baviariae_desc: "Whatever reforms we undertake, they must serve Bavaria first. Loyalty to the kingdom means preserving its crown, customs, and traditions while ensuring that its people can enter the modern age without losing their distinct identity."

BAV_focus_reign_of_ludwig_ii: "Reign of Ludwig II"
BAV_focus_reign_of_ludwig_ii_desc: "A young king has inherited a kingdom caught between constitutional obligations, competing political factions, and the growing rivalry of Austria and Prussia. Ludwig II must now decide whether the Crown will guide Bavaria from above or share more of its authority with the Landtag."
BAV_focus_the_monarchs_divine_right: "The Monarch's Divine Right"
BAV_focus_the_monarchs_divine_right_desc: "The Bavarian Crown is not merely an office granted by popular approval. It is an inherited authority bound to duty, tradition, and divine sanction. The government must ensure that constitutional arrangements do not become a pretext for replacing royal sovereignty with parliamentary rule."
BAV_focus_strengthen_the_first_chamber: "Strenghten the First Chamber"
BAV_focus_strengthen_the_first_chamber_desc: "The Chamber of Imperial Councillors provides the monarchy with a natural counterweight to the elected deputies. By reinforcing the influence of the first chamber, the Crown can preserve the traditional order while remaining within the forms of the constitution."
BAV_focus_curtail_parliamentary_rights: "Curtail Parliamentary Rights"
BAV_focus_curtail_parliamentary_rights_desc: "The Landtag has gained influence since the reforms of 1848, particularly through its control of taxation and legislation. We must prevent these powers from developing into a parliamentary government that the Constitution never intended."
BAV_focus_repressive_measures: "Repressive Measures"
BAV_focus_repressive_measures_desc: "Where persuasion fails, the state must defend itself. Closer surveillance of radical associations, stricter control of public agitation, and firm action against threats to royal authority will discourage those who mistake constitutional government for popular sovereignty."
BAV_focus_the_landtags_prerogative: "The Landtag's Prerogative"
BAV_focus_the_landtags_prerogative_desc: "The Landtag's authority over taxation and legislation is not a concession to revolution but a constitutional safeguard. Respecting these prerogatives can give the monarchy the legitimacy required to govern during an increasingly unsettled period."
BAV_focus_expand_parliamentary_rights: "Expand Parliamentary Rights"
BAV_focus_expand_parliamentary_rights_desc: "The elected chamber should not merely approve decisions made elsewhere. Carefully extending its role in legislation and public finances could turn political conflict into constructive debate without abolishing the Crown's constitutional position."
BAV_focus_separation_of_powers: "Separation of Powers"
BAV_focus_separation_of_powers_desc: "A stable constitutional order requires clear boundaries between the Crown, the ministry, and the Landtag. By defining these responsibilities more precisely, Bavaria can prevent personal rule from becoming arbitrary and parliamentary influence from becoming unchecked."
BAV_focus_a_modern_constitutional_state: "A Modern Constitutional State"
BAV_focus_a_modern_constitutional_state_desc: "Bavaria can remain a kingdom while becoming a more coherent constitutional state. If the Crown, ministers, courts, and Landtag accept their proper roles, reform need not mean revolution and tradition need not mean stagnation."

#SOCIETY
BAV_focus_bavarias_society: "Bavaria's Society"
BAV_focus_bavarias_society_desc: "Bavaria is changing beneath the authority of the Crown. Rural traditions, confessional loyalties, urban growth, industrial employment, and an expanding educated middle class are creating new opportunities - and new tensions - for the kingdom."
BAV_focus_education_reforms: "Education Reforms"
BAV_focus_education_reforms_desc: "The existing school system has laid the foundations for public education, but strong clerical influence, limited funding, and shortages of qualified teachers remain serious obstacles. Better schools will be essential if Bavaria is to meet the demands of a modern state."
BAV_focus_open_schools_for_natural_sciences: "Open Schools for the Natural Sciences"
BAV_focus_open_schools_for_natural_sciences_desc: "Classical learning alone cannot provide the engineers, surveyors, chemists, and administrators required by an industrializing kingdom. We will give mathematics and the natural sciences a greater place in Bavarian education."
BAV_focus_establish_a_technical_university: "Establish a Technical University"
BAV_focus_establish_a_technical_university_desc: "Bavaria needs an institution dedicated to the practical application of science. A technical university in Munich could train the specialists required for railways, factories, construction, and the new industries of the age."
BAV_focus_compulsory_education: "Enforce Compulsory Education"
BAV_focus_compulsory_education_desc: "School attendance has existed in law for decades, but laws are meaningful only when they are being applied. Better oversight and cooperation with local authorities will bring more Bavarian children into the classroom."
BAV_focus_further_restrict_child_labour: "Further Restrict Child Labour"
BAV_focus_further_restrict_child_labour_desc: "Children working in factories often receive little education and face conditions unsuited to their age. Restrictions on their employment can protect the young without ignoring the economic needs of poor families and manufacturers."
BAV_focus_the_fate_of_lower_classes: "The Fate of the Lower Classes"
BAV_focus_the_fate_of_lower_classes_desc: "Industrial growth has created wealth, but it has also produced crowded housing, insecure employment, and long working days. The government must decide whether the social question is a matter for reform, charity, or police action."
BAV_focus_attempt_social_legislation: "Attempt Social Legislation"
BAV_focus_attempt_social_legislation_desc: "Limited legislation concerning workplace safety, factory inspection, and assistance for the poor could ease the worst hardships. Such measures would not abolish poverty, but they may prevent social misery from becoming a political crisis."
BAV_focus_try_to_improve_the_workers_situation: "Try to Improve the Workers' Situation"
BAV_focus_try_to_improve_the_workers_situation_desc: "Workers' associations and mutual-aid societies can become useful partners rather than enemies of the state. Additionally, social legislation by the state is something worth considering. By addressing legitimate grievances, Bavaria may preserve public order while encouraging responsibility and cooperation."
BAV_focus_suppress_workers_associations: "Suppress Workers Associations"
BAV_focus_suppress_workers_associations_desc: "The authorities fear that workers' associations could become vehicles for revolutionary politics. Restricting their meetings and publications may protect the existing order, although it will drive discontent away from lawful channels."
BAV_focus_crush_strikes_and_arrest_worker_leaders: "Crush Strikes and Arrest Worker Leaders"
BAV_focus_crush_strikes_and_arrest_worker_leaders_desc: "A strike threatens production, public order, and the authority of the state. The government can respond with force and make an example of its leaders, but repression will deepen the divide between the industrial population and the monarchy."
BAV_focus_development_of_a_true_bavarian_identity: "Develop a True Bavarian Identity"
BAV_focus_development_of_a_true_bavarian_identity_desc: "The kingdom's people are divided by province, confession, and local custom. A broader Bavarian identity can unite these communities around the Crown without demanding that they abandon the traditions that distinguish them."
BAV_focus_bavarian_traditions: "Bavarian Traditions"
BAV_focus_bavarian_traditions_desc: "Local festivals, religious customs, folk dress, and regional memories provide a language of loyalty understood far beyond Munich. The state should preserve these traditions and present them as part of a common Bavarian heritage."
BAV_focus_oktoberfest: "The Oktoberfest"
BAV_focus_oktoberfest_desc: "What began as a royal celebration has become one of Bavaria's most visible public traditions. Supporting the Oktoberfest will give the kingdom a shared spectacle in which provincial identities can gather beneath the Bavarian colours."
BAV_focus_maximilianeum: "The Maximilianeum"
BAV_focus_maximilianeum_desc: "The Maximilianeum can embody the connection between education, public service, and the monarchy's sense of duty. By supporting talented young men from across Bavaria, the Crown can cultivate a loyal and capable administrative elite."
BAV_focus_bavarian_national_museum: "The Bavarian National Museum"
BAV_focus_bavarian_national_museum_desc: "Bavaria's history is preserved in churches, castles, workshops, and private collections throughout the kingdom. A national museum would gather this heritage into a public institution and turn regional memory into a source of shared identity."
BAV_focus_patronage_of_the_arts: "Patronage of the Arts"
BAV_focus_patronage_of_the_arts_desc: "Music, architecture, theatre, and painting have long flourished under Bavarian rulers. Renewed royal patronage can make Munich a cultural capital and demonstrate that modernity and monarchy need not stand opposed."

#Old stuff - potentially obsolete
BAV_bavarian_agriculture: "Bavarian Agriculture"
BAV_bavarian_agriculture_desc: "Bavaria is mainly an agricultural society. We should keep this in mind and expand on it."
BAV_bavarian_industry: "Bavarian Industry"
BAV_bavarian_industry_desc: "The big powers around the world are starting to industrialize. We should begin doing that too, as to not be even more inferior to them."
BAV_bavarian_trade_and_commerce: "Bavarian Trade and Commerce"
BAV_bavarian_trade_and_commerce_desc: ""
BAV_bavarianarmy: "Bavarian Army"
BAV_bavarianarmy_desc: "Our army is a mess and in dire need of modernization. A strong army will keep our state and people safe behind our borders, and would provide us a sufficient scope of action, in the context of alliance politics."
BAV_bavariannationalguard: "Bavarian National Guard"
BAV_bavariannationalguard_desc: "We now have the option to establish a national guard for our country. A national guard would provide us with enough military reserves, in the case of emergency."
BAV_nurembergsindustrieundkulturverein: "Nuremberg's Industrie- und Kulturverein"
BAV_nurembergsindustrieundkulturverein_desc: "The Industrie- und Kulturverein in Nuremberg was founded in 1827 to stimulate the agriculture and industry. Expanding its reach would be of great benefit to us."
BAV_developearlyweaponfactories: "Early Weapon Factory Designs"
BAV_developearlyweaponfactories_desc: "If we start developing designs for weapon factories now, maybe then we can catch up to the great European powers. Either way, our army could use some new weapons."
BAV_concertofeurope: "Concert of Europe"
BAV_concertofeurope_desc: "The Concert of Europe, also known as the Vienna System, is a complex system of dispute resolution adopted by the major conservative powers. If we want to play a role in it, we should act now."
BAV_middlepower: "Middle Power"
BAV_middlepower_desc: "Bavaria never really had the potential of becoming a great or even superpower. Instead, we should focus on maintaining our moderate influence and international recognition."
BAV_triaspolitik: "Triaspolitik"
BAV_triaspolitik_desc: "The Trias is the attempt of the German middle states to make common policy. Bavaria, being a rather large kingdom when compared to the other middle states, should play a bigger role in the Triaspolitik, at least that's what our King Maximilian II proposes. Whether this will be of any use will show later."
BAV_heilunsermknigheil: "Heil unserm' König, Heil!"
BAV_heilunsermknigheil_desc: "Maximilian II is a great king and the people love him, we all do in fact. Let us spread the word of our great King and his generosity."
BAV_constitutionalmonarchy: "Constitutional Monarchy"
BAV_constitutionalmonarchy_desc: "'I am proud to call myself a constitutional king', Maximilian II said when ascending the throne. Bavaria is a constitutional monarchy, meaning that the sovereign must act accordingly to a constitution. This allows us and the King to think our actions through and not make silly mistakes."
BAV_bavarianpechkohle: "Bavarian Pechkohle"
BAV_bavarianpechkohle_desc: "Our pitch coal mining industry in Upper Bavaria would be able to deliver more coal if we would support it. We could use this to our advantage."
BAV_extendludwigdonaumainkanal: "Extend Donau-Main-Kanal"
BAV_extendludwigdonaumainkanal_desc: "The Ludwig-Donau-Main-Kanal was finished in 1846, connecting the Donau and Main. If we could extend it a bit further, our trading ships could profit even more."
BAV_grundentlastung: "Grundentlastung"
BAV_grundentlastung_desc: "The Grundentlastung, or Bauernbefreiung, relieves our people of personal obligations towards their landlords. This way our farmers can concentrate on more important things."
BAV_berzirksamterlangen: "Bezirksamt Erlangen"
BAV_berzirksamterlangen_desc: "Thanks to the Ludwig-Donau-Main-Kanal, Erlangen, a town in Middle Franconia, has been developing rather quickly as of late. Let us establish a Bezirksamt, making it easier for us to influence that area and draw more taxes."
BAV_knivesforthebrgermilitr: "Knives for the Bürgermilitär"
BAV_knivesforthebrgermilitr_desc: "Our army, at the moment, is pathetic when compared to the European powers. We should start off improving it by building more factories."
BAV_learnfromthefrench: "Learn from the French"
BAV_learnfromthefrench_desc: "The French under Napoleon had great success in Europe. If we analyze and try to understand their tactics they could be put to good use."
BAV_learnfromtheprussians: "Learn from the Prussians"
BAV_learnfromtheprussians_desc: "Even if we don't want to admit it, the Prussians are strong. Their military power is incredible, equipped with the latest guns. Our guns, however, are outdated beyond belief. How about we get the same guns as them?"
BAV_learnfromtheaustrians: "Learn from the Austrians"
BAV_learnfromtheaustrians_desc: "Our neighbors, the Austrians, are known for their generals. We should convince them to teach us a thing or another about war."
BAV_givepowertolandtag: "Give Power to Landtag"
BAV_givepowertolandtag_desc: "Our King believes in our parliament and suggested giving the Landtag the right of initiative. The Landtag then would be able to pass reforms on its own, taking off a load of work from our shoulders."
BAV_socialdistressoftheworkingclass: "Social Distress of the Working Class"
BAV_socialdistressoftheworkingclass_desc: "As of late the workers of Bavaria haven't been doing all that great. Maximilian II is open to the their social distress and wants to lend them an ear."
BAV_palatinatelumber: "Palatinate Lumber"
BAV_palatinatelumber_desc: "Palatinate lumber is of great quality. We should use it effectively."
BAV_extendludwigsdnordbahn: "Extend Süd-Nord-Bahn"
BAV_extendludwigsdnordbahn_desc: "The Ludwig-Süd-Nord-Bahn was built between 1843 and 1854, connecting Nuremberg, Augsburg, Bamberg and other important cities. Expanding it would do wonders for our infrastructure."
BAV_extendbavarianindustry: "Extend Bavarian Industry"
BAV_extendbavarianindustry_desc: "The Bavarian industry is still in its developing phase. Helping it grow surely wouldn't be wrong."
BAV_mnchnerculture: "Münchner Culture"
BAV_mnchnerculture_desc: "Ludwig I made Munich the center of Bavarian culture and arts. He built universities and reformed Bavarian schools. We should follow his steps and spread our culture."
BAV_horsesforthelandwehr: "Horses for the Landwehr"
BAV_horsesforthelandwehr_desc: "The equipment of the Bavarian army is getting better, but we still have miles to go. We need to speed up the process."
BAV_traingenerals: "Train Generals"
BAV_traingenerals_desc: "If we would go to war now, we would embarrass ourselves. Our generals have no experience whatsoever, and we need to change that."
BAV_improvethekreuzkaserne: "Improve the Kreuzkaserne"
BAV_improvethekreuzkaserne_desc: "The Kreuzkaserne is the oldest barrack of the Munich garrison. Improving it could in turn improve our manpower."
BAV_improvetheisarkaserne: "Improve the Isarkaserne"
BAV_improvetheisarkaserne_desc: "The Isarkaserne is a cavalry-barrack of the Bavarian army in Munich. As of late our army has been lacking in cavalry. Maybe improving the barrack could fix that."
BAV_stopthelandtag: "Stop the Landtag"
BAV_stopthelandtag_desc: "The Landtag is hindering our army from evolving with budget cuts, they are the main reason why the Bavarian army is in such a bad state. If this is to continue we will not be able to defend ourselves."
BAV_bavariansteel: "Bavarian Steel"
BAV_bavariansteel_desc: "The steel of our country is a real opportunity. Expanding our steel industry will help our exports and arms industry."
BAV_reformarmsindustry: "Reform Arms Industry"
BAV_reformarmsindustry_desc: "Having extended the Bavarian industry, we should now focus on our arms. We are in dire need of new guns, uniforms and other equipment."
BAV_civiliancooperation: "Civilian Cooperation"
BAV_civiliancooperation_desc: "There is no country without people and there is no industry without workers. Let us motivate our workers and farmers to work for our King."
BAV_theprideofthebavarians: "The Pride of the Bavarians"
BAV_theprideofthebavarians_desc: "Bavaria is a proud kingdom, with proud people. Announce this to our people and neighbors, and every Bavarian will be delighted to follow our King, even to death!"
BAV_gunsfortheknigsarmee: "Guns for the Königsarmee"
BAV_gunsfortheknigsarmee_desc: "We have more guns now, but still not nearly enough. Build more arms factories. Maybe then we will be able to build up a worthwhile army."
BAV_thebavarianwarstrategy: "The Bavarian War Strategy"
BAV_thebavarianwarstrategy_desc: "It is time for us to think of our future, and our borders, as war is inevitable. We should prepare for the worst."
BAV_armyfirst: "Army First"
BAV_armyfirst_desc: "Now that the Landtag finally gave in, we can start growing our army. Let us make it the first priority."
BAV_ludwigii: "Ludwig II"
BAV_ludwigii_desc: "Maximilian II is dead, but Ludwig II, his son, will shortly ascend to the throne. Heil to our new King!"
BAV_getridofthewittelsbachs: "Get Rid of the Wittelsbachs"
BAV_getridofthewittelsbachs_desc: "This is the opportunity of a lifetime. The Wittelsbachs have ruled for long enough, it is time for them to go."
BAV_prinzkarltheodorslessons: "Prinz Karl Theodor's Lessons"
BAV_prinzkarltheodorslessons_desc: "Prinz Karl Theodor is an experienced general, having fought in the German Campaign of 1813. He should be able to teach our generals a thing or two about the art of war."
BAV_recoverfromtherussiancampaign: "Recover from the Russian Campaign"
BAV_recoverfromtherussiancampaign_desc: "The Russian Campaign of 1812 was a disaster. Napoleon lost the war, and we aided him with more than 30.000 men. However, the past should not hold us back, instead let us learn from our mistakes."
BAV_convincethelandtag: "Convince the Landtag"
BAV_convincethelandtag_desc: "Sure, we convinced the Landtag from cutting the budget of our army, but that is not nearly enough for us to survive these times. We need to convince them again - this time to actually support the Bavarian army with funds."
BAV_likefatherlikeson: "Like Father, Like Son"
BAV_likefatherlikeson_desc: "No doubt, Ludwig II is the son of King Max. Ludwig will continue his father's legacy, and we should support him."
BAV_gottstehunsbei: "Gott, steh' uns bei!"
BAV_gottstehunsbei_desc: "Ludwig II, our new King, decided to abandon his fathers policies. Instead he will act according to his own thoughts. Maybe this will bring the fresh political air our country needs."
BAV_voicesofthepeople: "Voices of the People"
BAV_voicesofthepeople_desc: "Enough, we say! The country is its people, and Bavaria's people want more freedom and egality. Bavaria, having lost two Kings in a short time, is in turmoil, so we need to act quickly. Let the people decide what is good and what is bad for them!"
BAV_newideasnewwinds: "New Ideas, New Winds"
BAV_newideasnewwinds_desc: "The Bavarian monarchy is dead. What we need now is new ideas about a state where everyone can be happy. How about a country with egality instead of social segregation?"
BAV_prepareforwar: "Prepare for War"
BAV_prepareforwar_desc: "The time has come for us to prepare for war. Our army has been reformed and is ready to move out at any moment. Let us make clear to our enemies that we are not afraid of them and will welcome them with raised guns."
BAV_militarystrength: "Military Strength"
BAV_militarystrength_desc: "Maximilian II was all for military strength and Ludwig II wants to continue this thought. In our times, this is probably the most effective way of stating ones strength."
BAV_withdrawfromthezollverein: "Withdraw from the Zollverein"
BAV_withdrawfromthezollverein_desc: "The Zollverein is merely a pathetic try of the Prussians to harmonize the German states. Let us put an end to this laughable propaganda."
BAV_pickourside: "Pick our Side"
BAV_pickourside_desc: "There simply is no way for us to survive without allies. Luckily, we have two options, namely Prussia and Austria."
BAV_thenewrepublic: "The New Republic"
BAV_thenewrepublic_desc: "Finally a state where the people are their kings can become reality! All related political issues have been solved and we can declare the new Republic of Bavaria!"
BAV_reformthecountry: "Reform the Country"
BAV_reformthecountry_desc: "For our ideas to become reality, the whole of Bavaria must be reformed. Let us start right away."
BAV_forthegermanbavaria: "For the German Bavaria!"
BAV_forthegermanbavaria_desc: "The fuse has been lit. Whoever dares to say that Bavaria is not German will get the shock of his life. Heil to the German Bavaria!"
BAV_bavariaspower: "Bavaria's Power"
BAV_bavariaspower_desc: "Bavaria is the second biggest German state after Prussia, if one could call them 'German' at all. Anyway, Bavaria should not be forced to subordinate herself to anybody. We should make this clear to every opposing force."
BAV_thegermanmiddle: "The German Middle"
BAV_thegermanmiddle_desc: "Positioned between the great powers of Austria and Prussia, Bavaria seeks to carve out a distinct path - the German Middle. Neither dominated nor subordinate, this vision champions a third way: a federation of sovereign German states united in cooperation, culture, and shared destiny."
BAV_prussiaisright: "Prussia is Right"
BAV_prussiaisright_desc: "Even if the Prussians are different in a way or two from us, they have proven to be a force to be reckoned with. Bavaria decided, and she decided that an alliance with the Prussians are a lesser evil."
BAV_austriaisright: "Austria is Right"
BAV_austriaisright_desc: "If one thinks about it for a second, then Austria is more German than Prussia is. Or in other words, Bavaria is more Austrian than German. Our two countries have a lot of similarities, and on top of that the Austrian forces could protect us from the Prussian ones. An alliance with Austria is the way to go."
BAV_blueskiesofbavaria: "Blue Skies of Bavaria"
BAV_blueskiesofbavaria_desc: "Now that the Republic has become reality, we should embed the rights of the people for eternity. No one shall take them away anymore!"
BAV_voting: "Voting"
BAV_voting_desc: "While the people are the ones who decide where our country is heading in, we will still need a representative. Establishing votes will solve this problem."
BAV_takeover: "Take Over"
BAV_takeover_desc: "If we were to strike now, we could take over nearly all governmental organs without any bloodshed. Everything from there on will be a piece of Weißwurst."
BAV_revolution: "Revolution"
BAV_revolution_desc: "There is absolutely no way the monarchist government will give in that easily. With no blood there will be no justice. This is a call for revolution, and a call for egality!"
BAV_athirddeutschland: "A Third Deutschland"
BAV_athirddeutschland_desc: "We and our allies are now ready to form the Third Deutschland, the South German Confederation. With it we will be the third big power, capable of sustaining ourselves without external help. This is the moment we write history."
BAV_jointhenorth: "Join the North"
BAV_jointhenorth_desc: "It is done. Relations between Bavaria and Prussia have been improving, as of late, and we are now able to join the Prussian alliance. This will be a big step towards German unification."
BAV_jointhesouth: "Join the South"
BAV_jointhesouth_desc: "The Austrians agreed to our proposals and will welcome us with open arms. Together we stand against the Prussian pigs."
BAV_visionariesofeurope: "Visionaries of Europe"
BAV_visionariesofeurope_desc: "Our Republic is probably the first of its kind in Europe. Many just do not understand that monarchies are not the way to go. Give them time and they will understand. For now let us be the European example of a state focused on freedom."
BAV_democracy: "Democracy"
BAV_democracy_desc: "What we have established is a modern democracy, with the people voting for the representative. Let us officially declare this to the European states."
BAV_newmnchnerrte: "New Münchner Räte"
BAV_newmnchnerrte_desc: "The Councils of Munich are the main directive political forces to guide our new country. We will have to organize the Councils to make them capable of dealing with every occurring political issue."
BAV_menandwomenofbavaria: "Men and Women of Bavaria"
BAV_menandwomenofbavaria_desc: "Every man and woman should be able to work and help make our Republic great. This surely will boost our economy too."
BAV_newvolunteers: "New Volunteers"
BAV_newvolunteers_desc: "Having called out the Bavarian revolution, we need more volunteers for our new army. If we advertise it a bit surely some of our people will be ready to serve our country."
BAV_customs: "Customs?"
BAV_customs_desc: "Bavaria has a lot of customs. As an example, the Catholic Church has been a big part of Bavarian culture throughout history. We should take a look at these and maybe change them up a bit."
BAV_agriculturalreforms: "Agricultural Reforms"
BAV_agriculturalreforms_desc: "The agriculture needs some reforming. The current system restrains the rights of the farmers."
BAV_industrialreforms: "Industrial Reforms"
BAV_industrialreforms_desc: "Our industry has been formed with the monarchist thought in mind. If we want egality, we should focus on changing it."
BAV_schoolreforms: "School Reforms"
BAV_schoolreforms_desc: "Everyone deserves schooling, not only the wealthy. As follows we need to reform the whole of the schooling system."
BAV_therightcause: "The Right Cause"
BAV_therightcause_desc: "What we are doing is freeing the people from the clutches of the monarchy. What we are doing is just. Spread the word and soon all of Bavaria will support our cause!"
BAV_bavarianconstitution: "Revised Bavarian Constitution"
BAV_bavarianconstitution_desc: "Now that we have come this far, we should make sure no one and nothing will undo our progress. Let us establish a new constitution and immortalize it."
BAV_nomorenobles: "No more Nobles!"
BAV_nomorenobles_desc: "By banning nobility we would make sure that no tyranny resurfaces on our much-loved Bavarian soil. This necessary step is of great importance to the future of our country."
BAV_stateschools: "State Schools"
BAV_stateschools_desc: "We reformed the schooling system, but it still needs some attention. Simply put, there are too little of them. By building more schools and making them state-owned we will make sure that no child will grow up uneducated."
BAV_convincewuerttemberg: "Convince Württemberg"
BAV_convincewuerttemberg_desc: "Württemberg, our neighbor, shares many similarities with us. We should convince them to pursue policies with us."
BAV_convincebaden: "Convince Baden"
BAV_convincebaden_desc: "Baden, the neighbor of Württemberg, also takes part in the Triaspolitik. Convincing them will play a big role in the Triaspolitik."
BAV_swayhessedarmstadt: "Sway Hesse-Darmstadt"
BAV_swayhessedarmstadt_desc: "Now that we have extended the Trias, we can get to swaying the other German states. Let us start off with Hesse-Darmstadt."
BAV_swayfrankfurt: "Sway Frankfurt"
BAV_swayfrankfurt_desc: "Frankfurt is a small independent city. With the Trias extended, we can sway them to our side."
BAV_swaysachsen: "Sway Sachsen"
BAV_swaysachsen_desc: "Sachsen will be the next ally to seek. With the allies we have gathered, maybe they will join us."
BAV_thegermantwo: "The German Two"
BAV_thegermantwo_desc: "Württemberg and Bavaria had common interests for a long time now. If we combine our strengths, we can kickstart the Trias again."
BAV_extendthetrias: "Extend the Trias"
BAV_extendthetrias_desc: "The current Triaspolitik only concerns the southern German states. If we extend it, however, then maybe we will be able to get German allies in the north too."
BAV_swaythueringen: "Sway Thüringen"
BAV_swaythueringen_desc: "Thüringen could be a great ally to have, seeing how they are right in-between Bavaria and Prussia. we should send someone over to try to sway them."
BAV_swayhannover: "Sway Hannover"
BAV_swayhannover_desc: "Hannover is a German state up north, but we should at least try to get them on our side. If we succeed, Prussia will be cut off from its western territories."
BAV_sueddeutscherzollverein: "Süddeutscher Zollverein"
BAV_sueddeutscherzollverein_desc: "We rejected the Zollverein to be able to move freely from Prussian influence, but it took a toll on our economy. We could propose our own version of the Zollverein and not include Prussia and their allies to reverse the effect."
BAV_catholicchurch: "Catholic Church"
BAV_catholicchurch_desc: "The Catholic Church is officially accepted by our government and is an important part of our culture. We should reinforce the significance of it."
BAV_acceptprotestantism: "Accept Protestantism"
BAV_acceptprotestantism_desc: "Even if our culture is closely tied with classic Catholicism, Protestantism has shown to be the dominant form of it. Not to forget we would gain some good recognition from the Prussians if we were to officially accept it."
BAV_ludwigvonderpfordten: "Ludwig von der Pfordten"
BAV_ludwigvonderpfordten_desc: "Von der Pfordten has shown to be a great politician and professor in the Leipzig University. Making him the Chairman in the Council of Ministers would be a good idea."
BAV_supportbismarcksparliament: "Support Bismarck's Parliament"
BAV_supportbismarcksparliament_desc: "Bismarck, to the surprise of many, proposed a national parliament, effectively making the proposal to reform the German Bund in its whole. If we were to support it we would do Prussia a favor."
BAV_commoncontempt: "Common Contempt"
BAV_commoncontempt_desc: "We and Austria have a common rival - Prussia. Surely Austria would not decline our proposals if the said proposals would be of no benefit to Prussia."
BAV_austriasresigntowar: "Austrias Resign to War"
BAV_austriasresigntowar_desc: "As the Russian Zar Alexander II had put it, 'Austria already resigned to war', meaning Austria was not and is not looking for a peaceful solution to the German question in the first place. It is probably a good idea to not trust and count on the Austrians."
BAV_myenemysenemy: "My Enemy's Enemy"
BAV_myenemysenemy_desc: "Austria is a great ally we will need in the inevitable war. We should immediately propose an alliance between Bavaria and Austria."
BAV_anotherwaytounity: "Another Way to Unity"
BAV_anotherwaytounity_desc: "Every peaceful try by the Prussians to unificate the German states failed. Now, there is only one way for them to reach their goal. We should act quickly and support them to not completely get in the crossfire without any allies."
BAV_militaryconsultativecommission: "Military Consultative Commission"
BAV_militaryconsultativecommission_desc: "A Military Consultative Commission will be held to consider every military move Bavaria could take. This Commission and the following decisions will literally decide the future of Bavaria."
BAV_supportfarmers: "Support Farmers"
BAV_supportfarmers_desc: "If we were to support the Bavarian farmers we could gain access to more manpower, after a certain period of time. Let us think of the future a bit too, it surely would not be wrong."
BAV_focusoncivilianindustry: "Focus on Civilian Industry"
BAV_focusoncivilianindustry_desc: "Bavaria needs to support its farmers, workers and people. We should focus on improving our economy and industry instead of spending ludicrous amounts of money on experimental weapons and technology."
BAV_focusonmilitaryindustry: "Focus on Military Industry"
BAV_focusonmilitaryindustry_desc: "What we need right now are new weapons, horses and cannons, not pitchforks, cows and seeds. The times we are in are the times of war, and we should prepare for it."
BAV_investinthearmy: "Invest in the Arms Industry"
BAV_investinthearmy_desc: "Seeing how the matter becomes more important by the day, we should invest in our arms industry to help out our army. One can never have too many guns."
BAV_newcropsandfields: "New Crops and Fields"
BAV_newcropsandfields_desc: "Our nation is an agricultural one. However, we still do not have enough fields to plant all the new different crops. We should financially support this cause."
BAV_uselocalresources: "Use Local Resources"
BAV_uselocalresources_desc: "We are not using our resources efficiently, instead we are wasting them on arms factories. As such, we should focus on getting these resources to where they are needed."
BAV_newfactorylayout: "New Factory Layout"
BAV_newfactorylayout_desc: "By redesigning the layout of our arms factories we could make them more efficient. This will greatly help our arms industry grow."
BAV_reassurepower: "Reassure Power"
BAV_reassurepower_desc: "Even if Bavaria is a constitutional monarchy, it seems that some politicians forgot that our King still is our highest political figure. By disobeying our King you are disobeying Bavaria. Let us remind everyone of this fact."
BAV_thegermanstrongest: "The German Strongest"
BAV_bavariaandthegermanstates: "Bavaria and the German States"
BAV_bavariaandthegermanstates_desc: "Bavaria and some other German middle states have tried to do common policy in the past, sometimes failing and sometimes succeeding. We could continue going down this path, as many of the German states seem to dislike our enemy - Prussia."
BAV_thegermanstrongest_desc: "Bavaria is the biggest and strongest German middle state. We should make this clear to the others, so not a single middle state gets any bad ideas."
BAV_cottonexperiments: "Cotton Experiments"
BAV_cottonexperiments_desc: "Cotton seems to become more and more important. Maybe we should start trying to grow some of it in our homeland, as to not completely become dependent on imports in the future."
BAV_bavariansupremacy: "Bavarian Supremacy"
BAV_bavariansupremacy_desc: "Bavaria is great, and no one shall question this fact. The small German middle states should look up to us, instead of neglecting our policies. Whoever is against Bavaria, is against our King, and such is unforgivable."

################################
####          IDEAS         ####
################################

#ECONOMY
BAV_idea_the_riches_of_our_lands_1: "The Riches of our Lands"
BAV_idea_the_riches_of_our_lands_1_desc: "[BAV.GetNameDef] is still mainly an agrarian state, and this is not necessarily a bad thing. We can use the advantages our lands offer in order to maximise their potential for the benefit of the entire country."
BAV_idea_the_riches_of_our_lands_2: "The Riches of our Lands"
BAV_idea_the_riches_of_our_lands_2_desc: "[BAV.GetNameDef] is still mainly an agrarian state, and this is not necessarily a bad thing. We can use the advantages our lands offer in order to maximise their potential for the benefit of the entire country."
BAV_idea_the_riches_of_our_lands_3: "The Riches of our Lands"
BAV_idea_the_riches_of_our_lands_3_desc: "[BAV.GetNameDef] is still mainly an agrarian state, and this is not necessarily a bad thing. We can use the advantages our lands offer in order to maximise their potential for the benefit of the entire country."
BAV_idea_the_riches_of_our_lands_4: "The Riches of our Lands"
BAV_idea_the_riches_of_our_lands_4_desc: "[BAV.GetNameDef] is still mainly an agrarian state, and this is not necessarily a bad thing. We can use the advantages our lands offer in order to maximise their potential for the benefit of the entire country."
BAV_idea_supported_construction_sector: "Supported the Construction Sector"
BAV_idea_supported_construction_sector_desc: "We have financially supported the construction sector and should make use of the resulting benefits to improve our infrastructure and speed up industrialisation."
BAV_idea_business_subsidies: "Business Subsidies"
BAV_idea_business_subsidies_desc: "We have provided substantial subsidies for Bavarian businesses to help them grow and prosper. This should help in overcoming some of the limitations we had before in terms of industrialisation and economic development."
BAV_idea_railway_concessions: "Bavarian Railway Concessions"
BAV_idea_railway_concessions_desc: "As part of our industrialization efforts, railway projects have been started by several semi-private and public initiatives across our realm. We can decide to support and pursue their plans for railway expansion, which are already underway for the lines below, with construction in total scheduled to last until 1862. Or we can decide to cancel our support for these lines, which will mean we will have to build them ourselves.\n\n[BAV.GetFlag] - [AUS.GetFlag] Connection to the Austrian Westbahn:\nMunich-Vienna Railway Line via Rosenheim, Salzburg, and Linz\n[BAV.GetFlag] - [AUS.GetFlag] Connection to the Austrian Nordtiroler Staatsbahn:\nRosenheim-Innsbruck Railway Line via Kufstein\n[BAV.GetFlag] - [AUS.GetFlag] Bayerische Ostbahn:\nMunich-Passau via Landshut and Straubing"
BAV_idea_german_war_reparations: "Bavarian War Reparations"
BAV_idea_german_war_reparations_desc: "In accordance with the to stipulations of our peace deal with France, we will pay a fixed amount of war reparations to France over the next time."

#ARMY
dynmod_BAV_army: "State of the Bavarian Army"
dynmod_BAV_army_desc: "The [BAV.GetAdjective] Army is a testament of our strength and independence. There are, however, some problems and challenges we have to overcome in order to maximise its potential."
dynmod_BAV_army_effect_tt: "§CThis will §Ymodify§! the §YState of the Bavarian Army§! spirit with the following effects:§!\n"
BAV_idea_inexperienced_generals: "Inexperienced Generals"
BAV_idea_inexperienced_generals_desc: "Very few Bavarian generals have ever led a unit larger than a brigade. This is mainly because of financial difficulties and the Landtag's reluctance to grant the necessary funds for larger manoeuvres."
BAV_idea_trained_generals: "Trained Generals"
BAV_idea_trained_generals_desc: "Most Bavarian generals will now be able to train with larger troop formations and will, thus, hopefully do better once on the battlefield."

#POLITICS
BAV_idea_landtag_hindrance: "Landtag Hindrance"
BAV_idea_landtag_hindrance_desc: "The Landtag is currently reluctant to grant the Bavarian Army and Kriegsministerium the needed funds to reform, modernise and evolve in line with the necessities of modern warfare. Instead, many delegates are even calling for larger budget cuts in order to balance the treasury."
BAV_idea_landtag_convinced: "Convinced Landtag"
BAV_idea_landtag_convinced_desc: "We have finally convinced the Landtag of supporting the Bavarian Army with additional funds in order to reform, modernise and evolve our armed forces in line with the necessities of modern warfare."
BAV_idea_centralised_administration_1: "Centralised Administration"
BAV_idea_centralised_administration_1_desc: "Following the example of our great state reformer of the Napoleonic Era, Maximilian von Montgelas, we will establish a more centralised administration, meaning the day-to-day administrative politics will stay open to the monarch's influence."
BAV_idea_centralised_administration_2: "Centralised Administration"
BAV_idea_centralised_administration_2_desc: "Following the example of our great state reformer of the Napoleonic Era, Maximilian von Montgelas, we will not only establish a more centralised administration, meaning the day-to-day administrative politics will stay open to the monarch's influence, both also protect the denominational equality of our subjects."
BAV_idea_centralised_administration_3: "Centralised Administration"
BAV_idea_centralised_administration_3_desc: "Following the example of our great state reformer of the Napoleonic Era, Maximilian von Montgelas, we will not only establish a more centralised administration, meaning the day-to-day administrative politics will stay open to the monarch's influence, both also protect the denominational equality of our subjects. Additionally, a cadastral survey will make sure we know who owns what and to what extent we can expect taxes on land properties."
BAV_idea_decentralised_administration_1: "Decentralised Administration"
BAV_idea_decentralised_administration_1_desc: "Despite the reasonable centralisation efforts our government has undertaken, we need to acknowledge the respectable demands and concerns of our various provinces."
BAV_idea_decentralised_administration_2: "Decentralised Administration"
BAV_idea_decentralised_administration_2_desc: "Despite the reasonable centralisation efforts our government has undertaken, we need to acknowledge the respectable demands and concerns of our various provinces, like the special privileges that our Palatinate territories have enjoyed since Napoleonic times."
BAV_idea_decentralised_administration_3: "Decentralised Administration"
BAV_idea_decentralised_administration_3_desc: "Despite the reasonable centralisation efforts our government has undertaken, we need to acknowledge the respectable demands and concerns of our various provinces, like the special privileges that our Palatinate and Franconian territories have enjoyed since Napoleonic times."
BAV_idea_fidelis_ad_scientiam: "Fidelis ad Scientiam"
BAV_idea_fidelis_ad_scientiam_desc: "Belief in Bavaria does not mean abandoning science. By encouraging universities, technical instruction, and scientific inquiry, the [BAV.GetName] can prepare its citizens for an industrial age without abandoning its political traditions."

#SOCIETY
BAV_idea_matrikelparagraph_1: "Matrikelparagraph"
BAV_idea_matrikelparagraph_1_desc: "The Matrikelparagraph sets the exact number of Jewish families permitted to live in a specific locality in Bavaria. Every marriage or relocation was contingent upon the availability of a registration number. Only when a head of household dies or moves away, a new family can take their place. The regulation stifles natural population growth, restricts freedom of movement, and hinders economic growth."
BAV_idea_matrikelparagraph_2: "Judenedikt"
BAV_idea_matrikelparagraph_2_desc: "The Judenedikt not only sets the exact number of Jewish families permitted to live in a specific locality in Bavaria, it also makes professional and political careers within state or state-related businesses and institutions near impossible for Jewish citizens. Thus, the regulation stifles natural population growth, restricts freedom of movement, and hinders economic growth, whilst avoiding confrontation with the Church."
BAV_idea_bavarian_idyll_1: "Alpine Romanticism"
BAV_idea_bavarian_idyll_1_desc: "King Max's hiking endeavours have caused a great increase in Alpine tourism. Walking stick in hand, the King famously prefers to meet his subjects on mountain paths rather than in formal court audiences. This royal endorsement of 'Alpinismus' has sparked a sweeping trend among the Munich bourgeoisie, who are eagerly purchasing hiking boots to emulate the Wittelsbachs."
BAV_idea_bavarian_idyll_2: "A Bavarian Idyll"
BAV_idea_bavarian_idyll_2_desc: "Not only King Max's hiking endeavours have caused a great increase in Bavarian tourism. Now, guidebooks, Alpine clubs, mountain inns, and vibrant spa resorts proliferate across Bavaria, turning remote regions into fashionable destinations. Bavaria's image as a land of blue lakes, white peaks and contented peasants is carefully cultivated at home and abroad, binding romantic nostalgia to a modern leisure economy and a distinctly Wittelsbach vision of the kingdom."
