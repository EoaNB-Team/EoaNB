###SUCCESSION, STARTING, GENERAL INFO, FLAVOUR AND ADVISOR EVENTS
#SUCCESSION AND ROYAL FAMILY EVENTS
bavaria.1.t: "Bavaria under King Maximilian II"
bavaria.1.d: "Munich, [GetMonth] [GetYear] - King Maximilian II sits upon a throne that balances reform and reaction. Despite the unsuccessful revolutions of 1848, Bavaria has enjoyed cautious liberalization: freedom of the press, ministerial responsibility, and the abolition of most feudal dues have reshaped public life, even as the king grows wary of further democratic agitation.\n\nThe [BAV.GetName] remains a pillar of the German Confederation, yet its rulers fear being squeezed between the ambitions of the [AUS.GetName] in the south and the [PRS.GetName]in the north, each seeking to dominate the German lands.\n\nInternally, Bavaria faces economic challenges as industrialization lags behind its northern neighbors, while rural discontent simmers over the future state of our agriculture. Culturally, Munich flourishes under royal patronage of science and the arts, but this cosmopolitan vision clashes with conservative Catholic as well as traditionally conservative Bavarian sentiments, especially over Jewish emancipation and secular education.\n\nLooking ahead, the dream of a Bavarian-led “Trias” of German middle states appears increasingly fragile, as Vienna and Berlin manoeuvre to undermine any unwanted intervention in German affairs. In the coming years, Bavaria must decide whether to preserve its independence through delicate diplomacy, or risk being drawn into the orbit of a greater power."
bavaria.1.a: "We'll see what the future might hold for us."
bavaria.2.t: "Maximilian II Dead!"
bavaria.2.d: "Today, the realm is in mourning. For quite some time, our precious King Maximilian II had been suffering from severe illness. After months of battling disease, His Majesty fell very sick three days ago. Maximilian's body could no longer withstand the disease, and this morning he eventually succumbed to it. Maximilian II, being King of Bavaria for 16 years, died on 10th March 1864, ultimately leaving the throne empty. This event will certainly influence the very existence of our Kingdom."
bavaria.2.a: "May the King rest in peace."
bavaria.3.t: "Ludwig II Decides"
bavaria.3.d: "As the oldest son of the late Maximilian II, Ludwig II Otto Friedrich Wilhelm von Wittelsbach ascends the throne at the age of just 18 years and is now officially the new King of Bavaria.\n\nSeeing as how the young King could be or have been a subject of manipulation from a foreign state, many politicians are worried about how Ludwig could behave in the future. In an attempt to eliminate this risk, a proposal has been made by some of the worried, which would try to persuade the King to follow in his father's footsteps. The proposal would try to steer Ludwig into the direction of the advisor circle and the ministers of his late father, and maybe even push for the continuation of the Triaspolitik.\n\nHowever, a lot of people think that this would lead to no result, as Ludwig seems a character of his own ways. The young king never was and probably never will be as interested and deeply involved as his father was in the day-to-day politics of running the country. Additionally, Ludwig seems to lack the sort of work ethic that would enable him to become a monarch of vigour and assertiveness.\n\nWhatever we decide to do will impact the future of the [BAV.GetName] greatly. So, how do we proceed from here?"
bavaria.3.a: "We must try to persuade the King."
bavaria.3.b: "He's still just a kid. Let him be. This won't change anything."
bavaria.4.t: "Maximilian II Dead!"
bavaria.4.d: "Munich, [GetMonth] [GetYear] - The [BAV.GetName] is shaken by the sudden and mysterious death of King Ludwig II in the waters of Lake Starnberg. Only days earlier, the monarch had been declared mentally unfit by his ministers and placed under the care of Dr. Bernhard von Gudden, who perished alongside him under circumstances that remain unexplained to this hour. The official verdict speaks of suicide by drowning, yet whispers of foul play and political conspiracy circulate through court circles and the public alike.\n\nBy right of succession, the crown passes to Ludwig's younger brother Otto, but he too has long been deemed incapable of ruling due to severe mental illness. Thus, the regency falls to their uncle, Prince Luitpold, who now assumes the governance of Bavaria as Administrator of the Kingdom. The people mourn their 'fairytale king', the builder of Neuschwanstein and patron of Wagner, even as ministers in Munich brace for a new era of conservative stability under the Prince Regent. Abroad, observers wonder whether Bavaria's independence can endure as shadows lengthen over Germany, and, possibly even more importantly right now, whether the Wittelsbach dynasty can recover from this double tragedy of madness and death."
bavaria.4.a: "May he rest in peace."
bavaria.5.t: "Ludwig II Dead!"
bavaria.5.d: "Yet again a tragedy hits the Wittelsbachs. Today Ludwig II, the eldest son of Maximilian II, was found dead, bleeding onto the white duvet cover, in his room by a maid, after she seemingly heard some kind of commotion going on inside. After she hesitantly entered the room no one aside from the dead Ludwig was in it anymore. His throat was pierced with a sharp knife or sword. The assassination and its real reason remain a mistery for now, but it is clear that the murder is connected to Maximilian's death and Ludwig's planned ascension of the throne."
bavaria.5.a: "Everything went according to plan then."
bavaria.6.t: "Luitpold von Bayern Takes the Throne!"
bavaria.6.d: "After the death of Ludwig II and the following public commotion, Luitpold Karl Joseph Wilhelm von Bayern felt obligated on his own behalf to restore part of the stability lost due to the lack of a reigning monarch. As Otto I, Ludwig's younger brother and the next Prince to succeed the throne of their father, suffers archly from a mental illness, Luitpold has risen to act as Prince Regent of Bavaria until his sibling is considered adequate or a proper heir can be assorted."
bavaria.6.a: "This might become a nuisance for us."
bavaria.7.t: "Death of Former King Ludwig I"
bavaria.7.d: "Nice, France, [GetMonth] [GetYear] - Ludwig I, former King of Bavaria and patron of the arts, has died at the age of 81 in his winter residence on the French Riviera.\n\nThough he abdicated the throne two decades earlier amid the revolutions of 1848 and the scandal of Lola Montez, Ludwig never ceased to shape Bavaria's cultural landscape from afar. His legacy is monumental: the Walhalla above the Danube, the Befreiungshalle at Kelheim, the Glyptothek and Alte Pinakothek in Munich, and the neoclassical transformation of the Ludwigstraße. He is buried in the Benedictine abbey of St. Boniface, which he himself commissioned, while his heart rests in the Gnadenkapelle at Altötting, in keeping with Wittelsbach tradition.\n\nFor many Bavarians, Ludwig remains the 'Kunst-König' (King of the Arts), the monarch who turned Munich into a 'German Athens' and championed Hellenism, Catholic revival, and German unity. Yet critics recall his autocratic tendencies, his costly building programs, and the affair that forced his abdication in favor of his son Maximilian II."
bavaria.7.a: "May he rest in peace."

bavaria.11.t: "Engagement of Ludwig II and Duchess Sophie Charlotte"
bavaria.11.d: "Munich, [GetMonth] [GetYear] - After years of evading dynastic expectations, the 21-year-old King Ludwig II has formally announced his engagement to his cousin, Duchess Sophie Charlotte in Bavaria, youngest sister of Empress Elisabeth of Austria.\n\nThe betrothal proclaimed on 22 January 1867, comes under intense pressure from ministers, courtiers, and the Bavarian public, all eager to see the king marry and secure the Wittelsbach succession. Sophie, a Catholic 'Landeskind' from Possenhofen, is celebrated as the ideal bride: beautiful, cultured, and devoted to Wagner's operas, which she and Ludwig have discussed at length in their correspondence. The court photographer Joseph Albert captures the couple in formal portraits, and medals bearing their likenesses are struck in anticipation of the wedding. Munich rejoices: the city commissions a lavish coach adorned with cupids, costing 100,000 gulden, while wedding gifts pour in from across the kingdom."
bavaria.11.a: "Congratulations!"
bavaria.12.t: "King Ludwig's Wedding in Danger?"
bavaria.12.d: "Munich, [GetMonth] [GetYear] - The engagement ball celebrating King Ludwig II's betrothal to Duchess Sophie Charlotte has descended into scandal, casting doubt on whether the wedding will ever take place.\n\nHeld in the grand hall of the Bavarian Foreign Ministry, the festivities drew 750 guests from all estates - diplomats, nobles, bourgeoisie, and press - eager to witness the royal couple's public display of affection. Ludwig arrived at 9 p.m., danced briefly with Sophie and select ladies of the diplomatic corps, then, shortly after 10 p.m., the king departed, leaving his bride to face the assembled crowd alone, and made his way to the Hoftheater for a performance of Schiller's Maria Stuart.\n\nThe affront was immediate and profound: courtiers whispered of disrespect, newspapers hinted at the king's 'melancholy disposition,' and Sophie's family, the Dukes in Bavaria, expressed 'deep concern' over Ludwig's commitment to the bride-to-be. In the corridors of power, ministers already brace for the worst: a broken engagement would not only humiliate the Wittelsbachs but raise the specter of a succession crisis, with Ludwig's brother Otto as the only heir."
bavaria.12.a: "Let's hope they can work it out."
bavaria.13.t: "Pope Pius Grants Dispensation for the Wedding"
bavaria.13.d: "Munich, [GetMonth] [GetYear] - Pope Pius IX has granted the required dispensation for the marriage of King Ludwig II to his cousin, Duchess Sophie Charlotte in Bavaria, removing the final canonical obstacle to their union.\n\nAs first cousins once removed - both descended from King Maximilian I - the couple needed papal approval under Catholic canon law, a formality now secured through the Bavarian nuncio in Rome. The dispensation, announced in early April, is hailed by courtiers as a sign that the wedding, long delayed, will finally proceed."
bavaria.13.a: "Looks like things are settled then?"
bavaria.14.t: "King Ludwig's Wedding Postponed"
bavaria.14.d: "Munich, [GetMonth] [GetYear] - The royal wedding, originally set for 25 August (Ludwig's birthday), then 12 October (the anniversary of his parents' and grandparents' marriages), has been postponed once more, this time to late November.\n\nCourt circulars blame 'medical advice' and the need for 'grand preparations,' but rumors swirl that the king's 'state of health' - both physical and mental - is the true cause. Sophie's family, growing impatient, presses for a firm date; Duke Max was told that 'this were impossible on account of the King's state of health,' a reply that would provide reasonable pretext for the ducal house to consider ending the engagement. The bride, however, seems reluctant to do so and believes in the certainty of the marriage."
bavaria.14.a: "Well, okay. Let's prepare for November then."
bavaria.15.t: "King Ludwig's Engagement Broken"
bavaria.15.d: "Munich, [GetMonth] [GetYear] - King Ludwig II has formally dissolved his engagement to Duchess Sophie Charlotte in Bavaria, ending months of postponements and public speculation with a single, decisive act. The announcement, issued from the king's private chambers, cites 'not that true inclination of the heart exists which would guarantee a happy marriage' - a phrase that masks the deeper reality of Ludwig's reluctance and inner turmoil.\n\nFor Sophie, the repudiation is a humiliation: after months of wedding preparations, including the commissioning of a lavish coach and the striking of commemorative medals, she is left to face Munich's courtly society as a jilted bride. The court is stunned: ministers had counted on the marriage to secure the succession; the public had celebrated the fairy-tale union; and Sophie's family, the Dukes in Bavaria, had grown increasingly impatient with Ludwig's evasions.\n\nNow, with the engagement broken, Bavaria faces the prospect of an unmarried king, his brother Otto as the only heir, and a succession crisis looming on the horizon."
bavaria.15.a: "Oh dear, what a disaster..."

#STARTING AND GENERAL INFO EVENTS
bavaria.21.t: "Bavaria's Economic Situation"
bavaria.21.d: "[BAV.GetNameDef] stands at an economic crossroads, caught between its deeply rooted agrarian traditions and the stirrings of modern industry.\n\nOver two-thirds of the population still toil in agriculture and forestry, with smallholding peasant farmers dominating the countryside and subsistence practices lingering despite earlier reforms.\n\nYet the 1850s have brought the first true breakthrough of industrialization: railway construction, linking Munich, Nuremberg, Augsburg, and the Palatinate, and opening eastern Bavaria to coal, timber, and iron traffic. Membership in the Zollverein since 1834 has integrated Bavaria into a vast German customs area, but it has also exposed local artisans and nascent manufacturers to competition from more advanced Prussian and Saxon producers.\n\nWhilst industrial efforts expand, so do the risks of financial speculation and overexpansion, as banks, state funds and private investors begin to channel capital into factories and railroads. In the cities, a small but growing industrial workforce faces harsh conditions: low wages, high infant mortality, and social dislocation, while rural regions remain impoverished and sceptical of the rapid changes happening around them.\n\nLooking ahead, Bavaria must decide how to balance protection of its agrarian base with the demands of an industrial future, lest it fall further behind its German neighbors or surrender economic sovereignty to Prussia's gravitational pull."
bavaria.21.a: "Sounds like we have some work to do."
bavaria.22.t: "Bavaria's Army"
bavaria.22.d: "The Royal Bavarian Army stands as a proud but aging instrument of state power, tasked with defending the kingdom's sovereignty within the fragile framework of the German Confederation. In peacetime, the force is organized into two army corps, each comprising infantry, cavalry, and artillery divisions, supported by a modest engineer corps.\n\nYet beneath this imposing structure lie deep structural weaknesses: recruitment still relies on a mix of conscription and paid substitutes, allowing wealthier citizens to avoid service while burdening the poor. Equipment and doctrine lag behind Prussia's rapidly modernizing forces; though new rifles and modern artillery pieces are being tested, many units still carry outdated smoothbore muskets, and artillery remains largely horse-drawn and slow to deploy. The officer corps, steeped in tradition and loyal to the Wittelsbach crown, resists radical reform even as younger voices urge adoption of Prussian-style reserves and general staff methods.\n\nPolitically, Bavaria's military autonomy is increasingly precarious: defensive agreements within the German Confederation stipulate that in case of common defense, Bavarian troops could fall under Prussian supreme command, a bitter pill to swallow after the experiences of the Crimean War. Internally, the Landtag has recently stopped several attempts of modernisation reform in fear of rising costs and overburdening the state budget.\n\nAs tensions rise across Germany and Italy, Munich must decide whether to invest heavily in modernisation, risk closer alignment with Vienna or Berlin, or gamble that neutrality and diplomacy can preserve the army - and the kingdom - from the storms ahead."
bavaria.22.a: "Forward for Bavaria!"
bavaria.23.t: "Bavaria's Politics"
bavaria.23.d: "The political atmosphere in Bavaria is charged with tension as King Maximilian II navigates between liberal reformers and conservative reactionaries in the Landtag.\n\nSince the revolutions of 1848, the kingdom has lived under a constitutional framework, yet the king's initial liberal impulses have given way to a policy of cautious restoration, with stricter press laws and the removal of the army's oath to the constitution. In parliament, liberal deputies - advocating free trade, individual rights, and reduced clerical influence in education - clash with the emerging Catholic-conservative 'Patriotic' faction, which defends traditional monarchy and the Church's privileged role.\n\nThe king's chief minister, [BAV.GetLeader], has become a lightning rod for opposition, his pro-Austrian foreign policy and domestic retrenchment alienating both liberals and moderate conservatives. The resulting parliamentary deadlock might well force his untimely dismissal, and the king might be forced to look elsewhere for political leadership.\n\nYet beneath the surface, even deeper fault lines are forming: the question of Bavaria's place in Germany - whether to preserve full sovereignty, align with Austria, or accommodate somehow with Prussian leadership - divides parties and threatens to destabilize the kingdom from within. As Europe watches the rise of Italian and German nationalism, Munich's politicians must balance domestic reform with external survival, lest Bavaria become a pawn in a greater game."
bavaria.23.a: "Let's take matters into our hands."
bavaria.24.t: "Bavaria's Society"
bavaria.24.d: "Bavarian society remains deeply stratified, with nobility, clergy, and a small urban bourgeoisie at the apex, while the vast majority of the population consists of peasants, artisans, and landless laborers.\n\nIn the countryside, traditional three-field farming and subsistence agriculture still dominate, leaving many rural families vulnerable to harvest failures, debt, and seasonal hunger despite earlier reforms abolishing feudal dues. Yet the first stirrings of change are visible: railways and nascent factories draw young men and women into growing towns like Munich, Nuremberg, and Augsburg, where a working class begins to take shape amid low wages, overcrowded housing, and minimal social protection.\n\nThe middle strata - civil servants, merchants, schoolteachers, and master craftsmen - expand slowly, their sons increasingly attending modern secondary schools that promise upward mobility, though elite schools remain dominated by the children of officials and academics.\n\nThe Catholic Church continues to exert immense influence over daily life, education, and morality, even as liberal voices call for reduced clerical privilege and greater religious tolerance. Jewish communities, long constrained by the Matrikel laws limiting residence and marriage, stand on the cusp of emancipation, potentially opening new paths into commerce, the professions, and civic life.\n\nEmigration to America rises as economic hardship and social rigidity push thousands to seek opportunity abroad, while at home, the 'social question' of poverty, inequality, and class tension begins to unsettle a kingdom still proud of its monarchical and confessional order."
bavaria.24.a: "Interesting times, indeed."
bavaria.25.t: "Bavaria's History"
bavaria.25.d: "For over seven centuries, the House of Wittelsbach has ruled Bavaria, steering it from a medieval duchy to a sovereign kingdom within the German Confederation.\n\nIn 1806, Maximilian IV Joseph, rewarded for his alliance with Napoleon, proclaimed himself King Maximilian I, transforming Bavaria into a centralized modern state with expanded borders that included Franconia, Swabia, and parts of the former ecclesiastical principalities. The Napoleonic era brought sweeping reforms: abolition of serfdom, secularization of church lands, and the creation of a unified bureaucracy and legal code.\n\nAfter 1815, Bavaria joined the German Confederation, balancing loyalty to Vienna with cautious engagement in German affairs, while King Ludwig I (1825-1848) turned Munich into a cultural capital of neoclassicism and romantic nationalism. The revolutions of 1848 forced Ludwig's abdication in favor of his son Maximilian II, who introduced constitutional government, ministerial responsibility, and cautious liberalization, even as he sought to preserve monarchical authority.\n\nBy now, Bavaria stands as the strongest of Germany's middle powers - proudly Catholic, culturally distinct, and determined to maintain its independence amid the rising tensions between the hegemons of Germany, the [AUS.GetName] and the [PRS.GetName] as well as the other great powers of Europe."
bavaria.25.a: "Time to shape our own history."
bavaria.26.t: "The Landtag Situation"
bavaria.26.d: "The Landtag of the [BAV.GetName] has convened in a climate of heightened tension between crown and parliament, as liberal deputies challenge the limits of the constitutional monarchy. The Chamber of Deputies, elected under a restricted franchise that favours property owners and the educated bourgeoisie, is divided into four loose factions: democratic leftists demanding popular sovereignty, left-liberals committed to constitutional monarchy, moderate liberal-conservatives, and a coalition of Catholic-conservative 'Greater Germans' loyal to the Wittelsbach throne.\n\nRegional cleavages deepen the split: Old Bavaria returns mostly conservative deputies, while Franconia, Swabia, and the Palatinate send liberal and sometimes even radical representatives, creating a parliament polarised between tradition and reform. In response, the crown asserts its prerogatives, refusing to grant ministerial responsibility or expand suffrage, even as liberals demand accountability and civil liberties. For Bavaria's political class, the Landtag is both a forum for debate and a battleground: can the kingdom modernise without surrendering monarchical authority, or must the crown and parliament eventually choose sides?"
bavaria.26.a: "We need to tread carefully."
bavaria.27.t: "Napoleon's Influence in Bavaria"
bavaria.27.d: "The alliance with Napoleon Bonaparte has transformed Bavaria from a middling electorate into a sovereign kingdom, but at a steep and lasting cost.\n\nBy the treaties of Bogenhausen (1805) and Pressburg (1805), Maximilian IV Joseph exchanged the elector's cap for a royal crown, gaining 17,000 km² of territory, 800,000 new subjects, and 6.5 million gulden in revenue through the annexation of Franconia, Swabia, and parts of Tyrol. In 1806, Bavaria became a founding member of the Confederation of the Rhine, formally severing ties with the Holy Roman Empire and binding itself to French hegemony in Central Europe.\n\nBut Napoleon's influence extended beyond geopolitics: his pressure forced the secularisation of ecclesiastical principalities - Freising, Würzburg, Bamberg, and Augsburg were absorbed into the [BAV.GetName], while monasteries were dissolved and their lands redistributed. The French emperor also orchestrated dynastic ties, marrying his stepson Eugène de Beauharnais to Maximilian's daughter Augusta, cementing the alliance through blood.\n\nYet the price was blood on distant battlefields: over 50,000 Bavarian soldiers perished in Napoleon's campaigns in Prussia, Russia, and France, a sacrifice that left deep scars on the kingdom's demography and collective memory.\n\nWhen the tide turned in 1813, Bavaria switched sides at the Treaty of Ried, preserving its sovereignty and territorial gains - but the Napoleonic inheritance remained: a centralised state, a modern bureaucracy, and a territorial shape that defined modern Bavaria. For generations, the question lingered: was the [BAV.GetName] Napoleon's creation, his victim, or both - and - perhaps even more importantly - does Bavaria have what it takes to leave the past behind and build a future of its own?"
bavaria.27.a: "Time to step out of this shadow."
bavaria.28.t: "Legacy of the March Revolution of 1848 in Bavaria"
bavaria.28.d: "Quite some time has passed since the revolutions that swept across Europe forced King Ludwig I from the throne and ushered in a new constitutional era for Bavaria.\n\nThe 'Märzerlass' of March 1848, which granted press freedom and judicial reform, gave way to the Reforming Assembly's 14 transformative laws: ministerial responsibility, a liberalized electoral system, and full civic rights for Jewish citizens. King Maximilian II, who ascended in his father's stead, initially embraced these reforms, presenting himself as a liberal monarch attuned to the spirit of the age.\n\nYet the past ten years have seen a gradual retreat: by 1850, the crown reasserted its authority, restoring press restrictions, removing the army's oath to the constitution, and rolling back the most democratic elements of the electoral law. The Landtag remains a forum for debate, but ministers answer to the king, not to parliament, and conservative-clerical forces have regained ground. For liberals, 1848 is both a beacon and a warning: the revolution proved that change was possible, but also that the old order could bend without breaking.\n\nAs Bavaria navigates the 1850s, the question lingers: will the kingdom fulfil the promise of 1848, or will the 'New Era' prove merely a pause in the march of reaction?"
bavaria.28.a: "An earthquake that still lingers."
bavaria.29.t: "The Matrikelparagraph"
bavaria.29.d: "For over four decades, the 'Matrikelparagraph' has cast a long shadow over Bavaria's Jewish communities, restricting their right to settle, marry, and pursue livelihoods without state approval.\n\nEnshrined in the 1813 'Judenedikt', the law caps the number of Jewish households permitted in each locality, maintaining a central registry of 'Matrikelnummern', numbers that must be inherited or purchased for a family to establish itself. Second and third sons, denied the right to marry or found households, face a stark choice: emigrate or remain in limbo, dependent on the death of a registered Jew to free a slot.\n\nLiberal deputies in the Landtag have long denounced the Matrikel as an insult to civil equality, and in 1848, the Reforming Assembly moved to abolish it - but the Upper House of Reichsräte, swayed by conservative and anti-Jewish petitions, blocked the reform in 1850.\n\nNow, with a new liberal majority emerging in the lower chamber and public opinion shifting, pressure mounts for repeal: petitions from Jewish communities, backed by progressive newspapers and civic associations, demand an end to what critics call 'a Pharaonic law against Jewish increase.' The government, however, remains cautious: while King Maximilian II has signaled openness to reform, the crown fears alienating Catholic-conservative allies and triggering a backlash in rural Bavaria, where anti-Jewish sentiment runs deep."
bavaria.29.a: "We have to make a decision."
bavaria.30.t: "The Nordlichterstreit"
bavaria.30.d: "A cultural and confessional storm has erupted over the king's policy of recruiting leading scholars from across Germany to elevate Munich's universities and academies.\n\nDubbed 'Nordlichter' (Northern Lights) by their detractors, these professors - many of them Protestant, liberal, and hailing from Prussia, Saxony, or Hanover - include luminaries such as the historian Heinrich von Sybel, the philologist Friedrich Thiersch, and the chemist Justus von Liebig. To the king, they represent the pinnacle of Wissenschaft, embodying his vision of Bavaria, and Munich in particular, as a 'German Athens' where science and learning flourish under royal patronage.\n\nYet to conservative Catholics, the Nordlichter are interlopers, their presence a threat to Bavaria's confessional identity and a sign of creeping 'Prussianisation'. Catholic newspapers, led by the Augsburger Postzeitung, have launched a bitter campaign, accusing the king of favoring Protestant outsiders over 'Nativisten' (native-born Bavarians) like Graf Pocci and Franz von Kobell.\n\nThe controversy has spilled beyond academia: courtiers, officers, and bureaucrats resent the scholars' influence, seeing them as rivals for royal favour and architects of a Lesser-German agenda that sidelines Austria.\n\nIn response, the king has tightened press laws, censoring Catholic attacks and defending a 'scientific monarchy' - but the damage is done. For liberals, the Nordlichterstreit is a proxy war over Bavaria's soul: will the kingdom embrace modernity, pluralism, and national unity under Prussian leadership, or retreat into Catholic particularism and Austrian alignment? As the decade closes, the question remains unresolved - and the kingdom more divided than ever."
bavaria.30.a: "Will we favour science over tradition?"

#FLAVOUR EVENTS
bavaria.31.t: "King Max's Hike"
bavaria.31.d: "Maximilian II today hiked in the Alpine region in Upper Bavaria. The total length of the path amounts up to 26 km and stretches from the Hörnle summit by Bad Kohlgrub, the royal Jagdhaus on the Pürschling and the Klammspitze summit to the Brunnenkopfhäuser built by King Max himself."
bavaria.31.a: "We should name this path after our King!"
bavaria.32.t: "Spaten Brewery becomes Munich's Largest Brewery"
bavaria.32.d: "Munich, [GetMonth] [GetYear] - The Spaten Brewery, once one of the smallest in the city, has risen to become Munich's largest producer of beer. Under the Sedlmayr family's stewardship since 1807, the brewery has embraced modern techniques and expanded its facilities, moving in the 1850s to a spacious new site on Marsstraße. This year, Spaten's output surpasses all rivals, earning it a gold medal at the World Exposition and cementing its reputation for quality. As demand grows across Bavaria and beyond, Spaten's success signals the arrival of industrial-scale brewing in the kingdom. Yet competition remains fierce: Augustiner, Löwenbräu, and Hacker-Nockher all vie for dominance in a city where beer is both culture and commerce. The Sedlmayrs now face the challenge of maintaining excellence while scaling production to meet an ever-thirsty market."
bavaria.32.a: "Surely, something to celebrate later tonight?"
bavaria.33.t: "Opening of the Marienbrücke"
bavaria.33.d: "Hohenschwangau, [GetMonth] [GetYear] - The iron truss bridge spanning the Pöllat Gorge has been rebuilt and reopened, now bearing the name Marienbrücke in honor of Queen Marie, mother of King Ludwig II. Originally constructed in wood two decades ago, the bridge was damaged by flooding and has been replaced with a sturdier iron structure, manufactured by the Maschinenbau-Gesellschaft Nürnberg, Cramer-Klett & Co, offering visitors a breathtaking view of Neuschwanstein's towers rising above the Alpine forest.\n\nFor the king, who has made this spot a private retreat, the bridge symbolizes both engineering progress and romantic devotion to his family's legacy. Locals whisper that the monarch spends hours gazing from its planks, lost in visions of medieval chivalry and Wagnerian grandeur. As tourism slowly begins to trickle into the region, the Marienbrücke stands as a testament to Bavaria's blend of natural beauty and royal ambition."
bavaria.33.a: "Let's enjoy the sight."
bavaria.34.t: "Foundation of the Historical Commission at the Bavarian Academy of Sciences and Humanities"
bavaria.34.d: "Munich, [GetMonth] [GetYear] - At the urging of the renowned historian Leopold Ranke, King Maximilian II has established the Historical Commission at the Bavarian Academy of Sciences. Its mission is to locate, edit, and publish source materials and scholarly works on German history, elevating Munich as a center of rigorous historical research.\n\nRanke, widely regarded as a father of modern historiography, is shortly going to be appointed the Commission's first president, lending his prestige to the enterprise. The new body brings together leading German scholars - Sybel, Pertz, Droysen, and others - to collaborate on critical editions and national narratives.\n\nFor Bavaria, the Commission represents both cultural prestige and a subtle assertion of independence within the German Confederation. As Europe's historians turn their gaze to Munich, the kingdom stakes its claim as guardian of the German past."
bavaria.34.a: "Our future shall be even brighter!"
bavaria.35.t: "Leopold Ranke President of the Historical Commission"
bavaria.35.d: "Munich, [GetMonth] [GetYear] - Leopold Ranke, the pre-eminent historian of his age, has assumed presidency of Bavaria's newly founded Historical Commission. At 63, Ranke brings unparalleled authority to the role, having pioneered source-based, 'scientific' history that rejects romantic speculation in favor of archival rigor.\n\nHis leadership signals Bavaria's commitment to serious scholarship, aligning the kingdom with the intellectual currents of Berlin and Göttingen. Under Ranke's direction, the Commission will prioritize critical editions of medieval chronicles, imperial documents, and Reformation records.\n\nFor King Maximilian II, a patron of science and letters, Ranke's presence in Munich enhances the capital's reputation as a haven for learning. As the Commission begins its work, historians across Germany watch closely to see whether Bavaria can rival Prussia in the realm of letters as well as arms."
bavaria.35.a: "Our future shall be even brighter!"
bavaria.36.t: "First Meat Extract Sold at Munich Pharmacy"
bavaria.36.d: "Munich, [GetMonth] [GetYear] - A dark, syrupy paste labeled 'Extractum Carnis Liebig' has appeared on the shelves of Munich's Royal Pharmacy, marking the first commercial sale of Justus von Liebig's beef extract in Bavaria.\n\nDeveloped by the celebrated chemist as a nutritious, affordable substitute for meat, the extract was originally prepared in small batches for hospital and military use.\n\nNow, following its inclusion in the Bavarian pharmacopoeia, apothecaries across the kingdom are legally required to stock or produce it on demand. Physicians praise its restorative properties for convalescents, while urban families see it as a practical solution to high meat prices. Though production remains modest, Liebig's invention hints at a future where science transforms everyday nutrition."
bavaria.36.a: "Get better soon!"
bavaria.37.t: "Foundation of Liebig's Extract of Meat Company"
bavaria.37.d: "Munich, [GetMonth] [GetYear] - The Liebig's Extract of Meat Company has been formally incorporated in London with substantial capital, launching the industrial-scale production of beef extract in South America. Justus von Liebig, now scientific director, has lent his name and expertise to the venture, which sources cattle from Uruguay's grasslands to produce a concentrated, shelf-stable foodstuff. The first shipments have already arrived in Europe, surpassing earlier trials in quality and consistency. Marketed through physicians and pharmacists, the extract is promoted as both medicine and sustenance for the working classes.\n\nFor Bavaria, Liebig's enterprise represents a triumph of applied chemistry and global commerce, linking Munich's laboratories to the pampas of the New World. As demand grows, the company promises to reshape diets far beyond the kingdom's borders."
bavaria.37.a: "I hope the ministry will get a sample?"
bavaria.38.t: "Foundation of Liebig's Extract of Meat Company"
bavaria.38.d: "Munich/London, [GetMonth] [GetYear] - The Liebig's Extract of Meat Company has been formally incorporated in London with substantial capital, launching the industrial-scale production of beef extract in South America. Justus von Liebig, now scientific director, has lent his name and expertise to the venture, which sources cattle from Uruguay's grasslands to produce a concentrated, shelf-stable foodstuff. The first shipments have already arrived in Europe, surpassing earlier trials in quality and consistency. Marketed through physicians and pharmacists, the extract is promoted as both medicine and sustenance for the working classes."
bavaria.38.a: "A meaty revolution?"
bavaria.39.t: "First University Chair of Hygiene"
bavaria.39.d: "Munich, [GetMonth] [GetYear] - Max von Pettenkofer has been appointed the world's first Professor of Hygiene at the University of Munich, inaugurating a new era of public health science.\n\nAt Pettenkofer's urging, King Ludwig II has committed to establishing hygiene chairs at all three Bavarian universities, recognizing the field's importance to urban welfare and statecraft. Trained as a chemist, Pettenkofer views hygiene not merely as cleanliness but as a systematic study of environment, nutrition, and disease prevention.\n\nHis appointment follows years of advocacy for sanitary reform, clean water, and ventilation in homes and factories. For Munich, a rapidly growing city, the new discipline promises to reduce mortality and improve living conditions. As lectures begin this winter, Bavaria positions itself at the forefront of a movement that could redefine the relationship between science, state, and society."
bavaria.39.a: "A step towards cleaner streets perhaps?"
bavaria.40.t: "New Premises for Augustinerbräu"
bavaria.40.d: "Munich, [GetMonth] [GetYear] - Therese Wagner, matriarch of the Augustiner Brewery, has acquired the Butlerkeller on Landsberger Straße, securing a sprawling site just outside the city walls for future expansion. Already a pioneer of steam-powered brewing since 1852, Wagner envisions moving the entire production operation to this modern location, freeing the historic Neuhauser Straße premises for its traditional tavern. The purchase reflects Augustiner's ambition to keep pace with Munich's surging demand for beer and to rival the city's other great breweries."
bavaria.40.a: "More beer? Sounds good."
bavaria.41.t: "Death of Legendary Brewery-Widow Therese Wagner"
bavaria.41.d: "Munich, [GetMonth] [GetYear] - Therese Wagner, the formidable widow who transformed Augustinerbräu into a modern industrial brewery, has died at the age of 61. Since taking over the business after her husband Anton's death in 1844, she has introduced steam engines, expanded cellars, and secured key properties. Her passing comes just months after the tragic loss of her son Anton in an accident, a double blow from which she never fully recovered. Leadership now passes to her eldest son Joseph, who must steer the brewery through a period of rapid change and competition. Munich mourns not only a successful entrepreneur but a symbol of resilience and vision in an age when few women commanded such enterprise."
bavaria.41.a: "May she rest in peace."
bavaria.42.t: "Augustinerbräu Purchases New Storage and Alehouse Premises"
bavaria.42.d: "Munich, [GetMonth] [GetYear] - The Augustiner Brewery has acquired a large storage cellar and alehouse complex on Arnulfstraße, soon to be known as the Augustiner-Keller. Under Joseph Wagner's direction, the site will serve as both a lagering facility and a festive beer garden where Munich's citizens gather for music, dancing, and strong beer. The purchase follows the earlier acquisition of the Landsberger Straße property and signals Augustiner's continued expansion in a booming market. Already, the hall and garden host lavish celebrations, drawing crowds from across the city and beyond. For the Wagner family, the Augustiner-Keller is more than real estate - it is a statement of permanence, tradition, and civic pride in a kingdom where beer remains the lifeblood of society."
bavaria.42.a: "Do we have plans for the afternoon already?"
bavaria.43.t: "Opening Ceremony of the Befreiungshalle"
bavaria.43.d: "Kelheim, [GetMonth] [GetYear] - High above the confluence of the Danube and Altmühl, the great neoclassical rotunda of the Befreiungshalle has been solemnly inaugurated, its 18 columns and 45-metre dome dominating the Bavarian landscape. Commissioned by the aging King Ludwig I and completed by Leo von Klenze after Friedrich von Gärtner's death, the monument commemorates the Wars of Liberation (1813-1815) and the victory over Napoleon at Leipzig. The dedication reads 'Den Teutschen Befreiungskämpfern - Ludwig I, König von Bayern' (To the German Liberation Fighters - Ludwig I, King of Bavaria), a deliberate appeal to all German tribes rather than Bavaria alone.\n\nSome 15,000 visitors have gathered for the four-day festival, including gray-haired veterans who still bear the scars of Lützen, Bautzen, and the Völkerschlacht itself. For Ludwig, now 77 and long withdrawn from active rule, the hall is the culmination of a lifelong dream: a monument to German unity under Bavarian patronage."
bavaria.43.a: "Truly something to behold."
bavaria.44.t: "Completion of the Assyrian Hall at the Glyptothek"
bavaria.44.d: "Munich, [GetMonth] [GetYear] - The Glyptothek, one of the largest museums for artefacts and sculptures from ancient times, has been expanded with the completion of the Assyrian Hall in the inner courtyard, a purpose-built annex designed by the late Leo von Klenze to house Bavaria's newest collection of antiquities from Assyria.\n\nThe hall displays seven monumental reliefs from the Northwest Palace of Ashurnasirpal II at Nimrud, acquired in 1863 through Klenze's friendship with the British excavator Austen Henry Layard. For former King Ludwig I and reigning King Maximilian II as well as the [BAV.GetName]'s scholars, the hall signals Munich's place among Europe's great cultural capitals, rivaling London and Paris in the race to possess the treasures of the cradles of civilisation."
bavaria.44.a: "Wonderful!"
bavaria.45.t: "Grand Opening of the Maximilianstraße"
bavaria.45.d: "Munich, [GetMonth] [GetYear] - The grand boulevard stretching from Max-Joseph-Platz to the banks of the Isar has been officially consecrated as the Maximilianstraße, bearing the name of the reigning monarch Maximilian II.\n\nConstruction began in 1852 under the direction of architect Friedrich Bürklein, who sought to create a new architectural idiom - the “Maximilianstil” - blending neo-Gothic, Renaissance, and other elements into a distinctly modern Bavarian aesthetic. The ceremony coincides with Munich's 700th anniversary, marked by the completion of new bridges over the Isar and Praterinsel, designed by city architect Arnold Zenetti.\n\nFor King Maximilian II, the avenue represents more than urban beautification: it is a deliberate departure from his father Ludwig I's Hellenic vision, asserting a new cultural direction for the kingdom. Lined with stately facades, the street will soon house museums, government buildings, and luxury shops, becoming one of Europe's most prestigious addresses.\n\nYet critics whisper that the eclectic style lacks coherence, and that the project's cost - borne largely by the king himself - could have been spent on more pressing social needs."
bavaria.45.a: "Marvellous!"
bavaria.46.t: "A New Building for the Government of Upper Bavaria"
bavaria.46.d: "Munich, [GetMonth] [GetYear] - The monumental administrative palace on the Maximilianstraße has been officially handed over to the Royal Government of Upper Bavaria, marking the completion of one of Friedrich Bürklein's most ambitious works.\n\nStretching 180 metres along the northern edge of the Maximiliansforum, the building's terracotta-clad façade rises in the distinctive 'Maximilianstil', blending neo-Gothic verticality with Renaissance proportions. Its cornerstone was laid on 28 November 1856, the 45th birthday of King Maximilian II, who personally commissioned the project to consolidate the previously scattered offices of the Kreisregierung.\n\nNow, after eight years of construction, officials move into spacious chambers adorned with ornate staircases, vaulted ceilings, and symbolic frescoes celebrating Bavarian governance. For Bürklein, present at the ceremony, the building stands as the architectural anchor of the new boulevard, balancing the Maximilianeum at the avenue's eastern terminus."
bavaria.46.a: "Maginificent!"
bavaria.47.t: "Foundation of the Museum of the Royal Ethnographical Collection"
bavaria.47.d: "Munich, [GetMonth] [GetYear] - [BAV.GetNameDef] has established the Königlich Ethnographische Sammlung (Royal Ethnographical Collection), Germany's first ethnological museum, by royal decree of King Maximilian II.\n\nThe collection draws upon decades of Wittelsbach acquisitions: 'transatlantic' objects from Brazilian, South Pacific, and Russian-American expeditions, gifts from travelers and missionaries, and the scientific holdings of naturalists like Philipp von Siebold, who first proposed such a museum in 1835. Moritz Wagner, geographer and former explorer, has been appointed founding curator, tasked with organizing previously scattered artifacts into a unified, research-oriented institution.\n\nFor King Maximilian, a patron of science and folk culture, the museum represents Munich's ascent as a center of universal knowledge, rivaling Berlin, Vienna, and London in the study of non-European peoples. The collection will initially reside in the Hofgarten arcades, though plans are already afoot to house it in a grand new building on the Maximilianstraße. Yet the enterprise is not without controversy: some scholars question whether 'ethnography' belongs alongside classical antiquities, while others see in it a tool for understanding the origins of mankind, the great migrations, trade, and Bavaria's place in a globalizing world. As crates of masks, textiles, and ritual objects arrive from distant shores, Munich becomes a window onto five continents - and a mirror of its own ambitions."
bavaria.47.a: "Interesting."
bavaria.48.t: "First German General and Historical Art Exhibition"
bavaria.48.d: "Munich, [GetMonth] [GetYear] - The Glaspalast, Munich's iron-and-glass exhibition hall modeled on London's Crystal Palace, has opened its doors to the First German General and Historical Art Exhibition, a landmark showcase of the nation's artistic heritage.\n\nConceived by King Maximilian II and organized by the Munich Artists' Cooperative, the exhibition brings together over a thousand works spanning centuries - from medieval altarpieces to Romantic masterpieces by Caspar David Friedrich and Moritz von Schwind. The Academy of Fine Arts participates prominently, marking its 50th anniversary with a display of historical and contemporary pieces that affirm Munich's status as Germany's leading art capital.\n\nVisitors file through the luminous nave, marveling at the unprecedented breadth of German art assembled under one roof - a deliberate assertion of cultural unity in a politically fragmented land. The exhibition might prove both critically acclaimed and financially successful, drawing collectors, critics, and curious citizens from across the Confederation."
bavaria.48.a: "Surely not the last?"
bavaria.48.b: "Surely not the last?"
bavaria.49.t: "First International Art Exhibition Closes"
bavaria.49.d: "Munich, [GetMonth] [GetYear] - The Glaspalast has thrown open its iron-and-glass doors to the First International Art Exhibition, Munich's first truly global art showcase, that run from 20 July to 31 October has closed its door.\n\nOrganized by the Munich Artists' Cooperative, the exhibition brought together over 1,300 works from Germany, France, Belgium, the Netherlands, Scandinavia, and beyond, transforming the Old Botanical Garden into a crossroads of European culture. The star of the show was Gustave Courbet, the controversial French Realist, who had spent six weeks in Munich to oversee the installation of his paintings in a dedicated gallery. King Ludwig II, an ardent admirer, has knighted Courbet in the Order of St. Michael, signalling Bavaria's openness to avant-garde currents despite conservative academic tastes.\n\nYoung German painters - Wilhelm Leibl, Franz von Lenbach, and others - crowded the halls, studying Courbet's bold brushwork and unidealized subjects. The exhibition has proven a sensation: tens of thousands of visitors filed through, debating whether art should mirror nature or elevate it. For Munich, the success cements its reputation as Germany's artistic capital, rivaling Paris and Vienna."
bavaria.49.a: "Another great event in Munich."
bavaria.49.b: "Another great event in Munich."
bavaria.50.t: "Visit of Hans Christian Andersen"
bavaria.50.d: "Starnberg, [GetMonth] [GetYear] - The celebrated Danish storyteller Hans Christian Andersen has arrived in Bavaria, bearing the freshly conferred Maximilian Order for Science and Art from King Maximilian II.\n\nThe king, an avid admirer of Andersen's fairy tales - The Improvisatore, A Poet's Bazaar, The Little Mermaid, and The Garden of Paradise - has invited the author to his private retreat on the Roseninsel in Lake Starnberg. There, amid roses and Alpine vistas, the two men converse in French and German about literature, folklore, and the nature of imagination itself.\n\nThe visit extends to Hohenschwangau, where Andersen not only marvels at the romantic ruins and mountain scenery but also by the king's warmth, saying that Maximilian 'understands the poet's soul better than any monarch' he has met.\n\nIn nearby Munich, literary circles welcome the visitor with banquets and readings, though Andersen notes in his diary the occasional stiffness of Bavarian court etiquette. For Maximilian, Andersen's presence affirms Bavaria's place in the European cultural scene - a kingdom where kings and poets meet as equals. As the Dane departs for home, he carries not only a royal decoration but the memory of a monarch who, like himself, believed in the transformative power of stories."
bavaria.50.a: "Kindred spirits, it seems?"
bavaria.51.t: "Foundation of the History Seminar at Königliche Ludwig-Maximilians-Universität"
bavaria.51.d: "Munich, [GetMonth] [GetYear] - By royal decree of King Maximilian II, the History Seminar has been established at the Ludwig-Maximilians-Universität, marking a new era for historical studies in Bavaria.\n\nThe seminar is the brainchild of Heinrich von Sybel, a disciple of Leopold von Ranke, who was called to Munich in 1856 to revitalize a discipline deemed rather barren and empty in the Bavarian capital. Modelled on Ranke's Berlin seminar, the institution divides its mission into two sections: one training future historians in methodological research and source criticism, the other preparing gymnasium teachers in the historico-critical method. Equipped with a specialized library of editions, maps, and visual aids, the seminar fosters close collaboration between professors and students, emphasising original archival work over textbook learning.\n\nFor Maximilian, a patron of science and history, the seminar complements his founding of the Historical Commission at the Academy and signals Munich's ambition to rival Berlin and Göttingen as a center of German scholarship. Sybel's appointment, however, is not uncontested: ultramontane circles favor the Catholic historian Karl Adolf Cornelius, leading to a dual-chair system that is likely to shape the seminar's intellectual life in the future."
bavaria.51.a: "A dual-system? Will that work?"
bavaria.52.t: "First Edition of the Historische Zeitschrift"
bavaria.52.d: "Munich, [GetMonth] [GetYear] - Heinrich von Sybel, professor of history at the University of Munich, has founded the Historische Zeitschrift, Europe's first dedicated scholarly journal of historical research.\n\nThe inaugural issue bears Sybel's manifesto: to defend 'the true method of historical research' while ensuring that history remains in living dialogue with the present. The journal quickly attracts luminaries - Leopold von Ranke, Johann Gustav Droysen, Theodor Mommsen, Hermann Baumgarten - establishing itself as the organ of the 'scientific' historical school trained in the seminar tradition of Ranke himself.\n\nFor Bavaria, the venture signals intellectual prestige: Munich now rivals Berlin and Göttingen as a center of German historiography, complementing the Historical Commission and the university's History Seminar. Yet the journal's orientation is unmistakably political: Sybel, a proponent of the 'Lesser German' solution under Prussian leadership, uses the jounral to advance a Protestant, national-liberal vision of history, often at odds with Bavaria's Catholic-conservative establishment. As copies circulate through university libraries and reading rooms, the Historische Zeitschrift becomes both a beacon of methodological rigor and a battleground for the soul of German historical writing."
bavaria.52.a: "Surely an interesting read."
bavaria.53.t: "Kaulbach's „Krönung Karls des Großen“ Completed"
bavaria.53.d: "Munich, [GetMonth] [GetYear] - Friedrich Kaulbach has finished his monumental history painting Krönung Karls des Großen, depicting the coronation of Charlemagne as Holy Roman Emperor by Pope Leo III on Christmas Day, 800, in St. Peter's Basilica.\n\nCommissioned by King Maximilian II in 1850 for the Maximilianeum's grand hall, the work forms part of a cycle celebrating pivotal moments in German and European history. The canvas captures the solemn moment as the pope raises the imperial crown above Charlemagne's head, surrounded by clergy, nobles, and members of the Frankish court in richly detailed medieval regalia.\n\nFor Maximilian, the subject is deeply symbolic: Charlemagne represents the unity of church and empire, the fusion of Germanic and Roman traditions, and the legitimacy of monarchical authority - themes central to the king's own vision of Bavaria's role in Germany. Kaulbach, nephew and pupil of the more famous Wilhelm von Kaulbach, spent over a decade refining the composition, drawing on historical sources and costume studies to achieve archaeological accuracy.\n\nThe painting will soon be installed in the Maximilianeum, where it joins works by Piloty, Anschütz, and other masters of the Munich historical school. As visitors gaze upon Charlemagne's coronation, they are invited to reflect on Bavaria's place in the continuum of imperial history - and on the question of who, in this age of rising nationalism, might once again unite the German lands."
bavaria.53.a: "What a painting!"
bavaria.53.b: "What a painting!"
bavaria.54.t: "Foundation of Turnverein 1860 Munich"
bavaria.54.d: "Munich, [GetMonth] [GetYear] - In a city still marked by the echoes of 1848, a group of young gymnasts and liberal-minded citizens has formally re-established the Turnverein München.\n\nThe association's roots trace back to July 1848, when revolutionaries and patriots gathered in the Buttlesche Brauerei zum Bayerischen Löwen to found a gymnastics club in the spirit of the Turnbewegung - a movement that linked physical fitness with national unity and civic virtue. But the club was banned the following year by royal decree, accused of 'republican intrigues' and subversive activities during the failed revolutions.\n\nNow, with political tensions eased and civic associations tolerated once more, the Turnverein has been reborn. For its members - primarily artisans, clerks, and students - the club is more than a place for exercise: it is a statement of bourgeois identity, a space for camaraderie, and a quiet assertion of the freedoms won in 1848, even if not yet fully realized."
bavaria.54.a: "Sport frei!"

###POLITICAL AND WAR EVENTS
#DOMESTIC POLITICS
bavaria.201.t: "Fate of the Lower Classes"
bavaria.201.d: "In the shadow of Munich's neoclassical grandeur and the kingdom's cultural triumphs, Bavaria's lower classes endure a harsh and precarious existence.\n\nIn the countryside, where nearly 70 percent of Bavarians still toil, landless laborers and smallholding peasants face chronic insecurity: harvest failures, rising rye prices, and debt push families toward destitution. Many young men and women flee to the cities, seeking work in Augsburg's textile mills, Nuremberg's foundries, or Munich's breweries, only to find overcrowded tenements, unsanitary conditions, and wages barely sufficient for bread. Along the Isar's poorer districts, entire neighborhoods lack clean water, sewage, or ventilation, while infant mortality remains staggeringly high. The 'social question' has entered public discourse, yet organized labor is still in its infancy, and the state offers little beyond charity and occasional poor relief.\n\nFor thousands, emigration to America appears the only escape: between 1847 and 1855, crop failures and famine drove a mass exodus, and the flow continues as economic stagnation bites. Without meaningful reform - such as compulsory education, housing initiatives, labor protections, or even expanded civil rights and suffrage - Bavaria risks a future of unrest, as the gap between the kingdom's cultural aspirations and its social realities grows ever wider."
bavaria.201.a: "Is it time to act?"
bavaria.202.t: "Foundation of the Bayerische Fortschrittspartei"
bavaria.202.d: "Augsburg, [GetMonth] [GetYear] - In a decisive break with the 'Greater-German' liberals, a group of reformers supporting a German unification has established the Bayerische Fortschrittspartei (Bavarian Progressive Party), aligning with the German Progressive Party founded in Prussia two years prior.\n\nLed by Karl Brater, editor of the Augsburger Abendzeitung, and supported by deputies from the Palatinate and Franconia, the party advocates a 'Lesser-German' solution: a federal state under Prussian leadership, predicated on Berlin's transformation into a liberal constitutional monarchy. The Progressives demand universal suffrage, ministerial responsibility, freedom of the press, and economic liberalisation - positions that resonate with the urban bourgeoisie, academics, and commercial elites.\n\nIn the Landtag, the party has quickly become the voice of left-liberal opposition, challenging the conservative-clerical majority and the crown's resistance to parliamentary accountability. For Bavaria's traditional elites, the Progressives are dangerous radicals, their pro-Prussian stance a betrayal of Wittelsbach sovereignty. Yet for younger liberals, the party offers a path to national unity and modern governance, even if it means accepting Prussian dominance. As the German question intensifies, Munich finds itself divided: between those who look to Vienna for protection and those who see Berlin as the engine of progress."
bavaria.202.a: "Will that mean trouble?"
bavaria.203.t: "Foundation of the Deutscher Reformverein"
bavaria.203.d: "Frankfurt, [GetMonth] [GetYear] - In the shadow of Prussia's rising power, Bavarian liberals and conservatives have joined with 'Greater-German' patriots across the Confederation to found the Deutscher Reformverein. Established on 26 October in Frankfurt, the organization seeks to preserve Austrian participation in any future German union, opposing the 'Lesser-German' ambitions of the pro-Prussian Nationalverein.\n\nIn Bavaria, the Reformverein finds its strongest base in Munich, where over a thousand members - including prominent liberals like Gustav von Lerchenfeld and Moritz Möhl - have enrolled in its local branch. The party's program calls for reform of the Federal Diet, greater civil liberties, and a 'Greater-German' federation encompassing all German-speaking lands, including Austria.\n\nFor many Bavarians, the Reformverein represents a bulwark against Prussian hegemony and a defense of the kingdom's independence within a reformed Confederation. Yet critics note the movement's limited appeal: with only around 1,500 members nationwide at the moment, it remains an elite association, seemingly unlikely to mobilise the broader public."
bavaria.203.a: "This will surely cause some raised eyebrows..."
bavaria.204.t: "Verein der bayerischen Patrioten"
bavaria.204.d: "Frankfurt, [GetMonth] [GetYear] - In the shadow of Prussia's rising power, Bavarian liberals and conservatives have joined with 'Greater-German' patriots across the Confederation to found the Deutscher Reformverein. Established on 26 October in Frankfurt, the organization seeks to preserve Austrian participation in any future German union, opposing the 'Lesser-German' ambitions of the pro-Prussian Nationalverein.\n\nIn Bavaria, the Reformverein finds its strongest base in Munich, where over a thousand members - including prominent liberals like Gustav von Lerchenfeld and Moritz Möhl - have enrolled in its local branch. The party's program calls for reform of the Federal Diet, greater civil liberties, and a 'Greater-German' federation encompassing all German-speaking lands, including Austria.\n\nFor many Bavarians, the Reformverein represents a bulwark against Prussian hegemony and a defense of the kingdom's independence within a reformed Confederation. Yet critics note the movement's limited appeal: with only around 1,500 members nationwide at the moment, it remains an elite association, seemingly unlikely to mobilise the broader public."
bavaria.204.a: "This will surely cause some raised eyebrows..."

#FOREIGN POLITICS AND WAR
bavaria.401.t: "The Trias Idea"
bavaria.401.d: "In the corridors of the Bavarian Foreign Ministry, a strategic vision has taken shape that could redefine the German Confederation: the Trias, or 'Third Germany', a coalition of middle states - preferably under Bavarian leadership - to balance the rival ambitions of Austria and Prussia.\n\nThe concept, championed by King Maximilian II and his ministers, envisions a federation of the Mittelstaaten - Bavaria, Württemberg, Saxony, Hanover, Baden and the Hessian states - united to preserve their sovereignty, protect the integrity of the Confederation, and prevent either Vienna or Berlin from dominating German affairs.\n\nFor Bavaria, the Trias seems both a defensive necessity and an assertion of prestige: as the largest and most influential of the middle kingdoms, Munich claims the natural right to lead a bloc that could tip the scales in any dispute between the great powers. The idea gained traction after the 1850 Four Kings Alliance (Vierkönigsbündnis), when Bavaria, Saxony, Hanover, and Württemberg briefly coordinated against Prussian hegemony, but lasting cooperation has proven elusive. Yet for Bavarian statesmen, the Trias remains a viable path to secure independence."
bavaria.401.a: "Alright, sounds challenging though?"
bavaria.402.t: "Bavaria Voices Support for the Augustenburger"
bavaria.402.d: "Munich, [GetMonth] [GetYear] - King Ludwig II and his ministers have thrown Bavaria's weight behind Duke Frederick of Augustenburg in the Schleswig-Holstein succession crisis, aligning the kingdom with the majority of the German Confederation against Denmark's annexation of the duchies.\n\nFollowing the violation of the 1852 London Protocol by Denmark, conflict surrounding the question of national identity of the Duchies of Schleswig, Holstein and Lauenburg has erupted once again. Bavaria, under its current government, has now publically voiced their support to recognize the Augustenburg as the legitimate duke of Schleswig-Holstein, outright rejecting the Danish claim to the duchies perceived by Bavaria to be legitimately German.\n\nIt remains to be seen, however, how far the Bavarian government is willing to go in order to enforce these claims."
bavaria.402.a: "An interesting development..."
bavaria.403.t: "[FROM.GetNameDef] Drums up Support for Trias Policy"
bavaria.403.d: "The [FROM.GetName] has increased their diplomatic efforts in convincing us of the Trias idea. They claim that cooperation among the German middle states would certainly be in our best interest in order to protect our sovereignty from the increasingly expansionist ideas of the [AUS.GetName] and the [PRS.GetName]. A reform of the German Confederation alongside a more collusive approach to all aspects concerning the German Confederation would thus drastically increase our chances of staying out of trouble, they suggest.\n\nHow should we respond to their diplomatic advances?"
bavaria.403.a: "Agree with their argumentation."
trias_influenced_by_bavaria_pos_effect_tt: "This will §Gimprove our relationship with the [BAV.GetName]§! and make it §Ymore likely that the Trias idea will succeed§!."
bavaria.403.b: "Respectfully decline."
trias_influenced_by_bavaria_neg_effect_tt: "This will §Rdeteriorate our relationship with the [BAV.GetName]§! and make it §Yless likely that the Trias idea will succeed§!."
bavaria.404.t: "[FROM.GetNameDef] Reacts Positively to our Diplomatic Advance"
bavaria.404.d: "The [FROM.GetName] has reacted positively to our diplomatic advances regarding the Trias policy. This makes it more likely that they will support the idea going forward."
bavaria.404.a: "Good news."
bavaria.405.t: "[FROM.GetNameDef] Respectfully Declines our Diplomatic Advance"
bavaria.405.d: "The [FROM.GetName] has respectfully declined our diplomatic advances regarding the Trias policy. This makes it less likely that they will support the idea going forward."
bavaria.405.a: "Too bad. I guess we'll have to try again."
bavaria.406.t: "[BAV.GetNameDef] Successfully Secured Support for Trias Policy in the [FROM.GetName]"
bavaria.406.d: "The [BAV.GetName] has undertaken diplomatic advances regarding the Trias policy in the [FROM.GetName]. Their diplomatic delegation has returned home with positive news: the [FROM.GetName] seems open to further support for the Trias idea."
bavaria.406.a: "Sounds good!"
bavaria.407.t: "[BAV.GetNameDef] Seeks Military Convention"
bavaria.407.d: "In a bold diplomatic overture, the [BAV.GetName] has approached us with a proposal for a military convention, seeking to establish a framework for mutual defense and coordinated armed neutrality amid the growing tensions between Austria and Prussia, but also the other European powers.\n\nBavarian envoys, citing the shared interest of small and middle powers in preserving independence from great-power domination, have suggested joint planning for border security, intelligence sharing, and possible coordination in the event of foreign troop movements through southern Germany or the Alpine passes. For Switzerland, the proposal presents both opportunity and peril. Whilst we acknowledge Bavaria's sincerity, we have to remain cautious: any formal military alignment, even for defensive purposes, could compromise Swiss neutrality under the Hague principles and draw the Confederation into German conflicts. Yet some Swiss officers and politicians see merit in informal cooperation: Bavaria's army could serve as a buffer against Prussian or Austrian incursions, while Swiss mobilization on the northern border might deter violations of either country's territory.\n\nSo, how should we respond to Munich?"
bavaria.407.a: "We're open to the idea."
bavaria.407.b: "Respectfully decline."
bavaria.408.t: "[SWI.GetNameDef] Reacts Positively to the Idea of a Military Convention"
bavaria.408.d: "Our delegation has reported back from their diplomatic mission to Switzerland. The diplomats claim that they have secured Swiss support for the idea of a military convention with us, despite the discussions being 'difficult at times'. This means we can go forward with the preparations for a military convention."
bavaria.408.a: "Great!"
bavaria.409.t: "[SWI.GetNameDef] Respectfully Declines the Idea of a Military Convention at Present"
bavaria.409.d: "Our delegation has reported back from their diplomatic mission to Switzerland, but the diplomats' concerned expressions speak for themselves. They have failed to secure Swiss support for the idea of a military convention with us for the moment. The Swiss delegation claimed that whilst the idea might become a possibility in the future, they did not feel the urgent need to change their outlook on foreign policy at present."
bavaria.409.a: "Surely a setback, but we can try again."
BAV_event_seek_military_convention_with_swi_neg_effect_tt: "§YWe can try again in about a year's time. Good relations with Switzerland will §Gincrease our chances of success§! the next time.§!"

###ECONOMY AND TRADE EVENTS
bavaria.501.t: "Railway Line from Munich to Vienna - Planning Complete"
bavaria.501.d: "Plans have existed since the early 1850s to connect the Bavarian capital Munich to Vienna via railway. After initial failure, the plan has recently been revitalized, much to the joy of the Austrian Empress Elisabeth, who is a Bavarian native. The planning for the railway line has been completed now. It will run southeast from Munich to Rosenheim, from where it will continue in eastern direction to Berchtesgaden and meet the line from Austria behind the border at Salzburg. The line is scheduled to go into service in approximately three years time. If we decide to support this initiative, the new railway line would surely benefit our economy and our mutual understanding with the Austrians."
bavaria.501.a: "Sounds good."
bavaria.501.b: "Stop our support for the railway projects."
bavaria.502.t: "Segment from Rosenheim to Traunstein in Service"
bavaria.502.d: "As part of our effort to construct a railway line from Munich to Vienna, the segment between Rosenheim and Traunstein has finally been opened for service. Construction was delayed due to the difficult terrain and soil conditions around the Chiemsee."
bavaria.502.a: "Gute Reise!"
bavaria.502.b: "Stop our support for the railway projects."
bavaria.503.t: "Segment from Traunstein to Salzburg in Service"
bavaria.503.d: "As part of our effort to construct a railway line from Munich to Vienna, the last segment between Traunstein and Salzburg has finally been opened for service. The line from Munich to Vienna can now operate without change and interruption. The inauguration ceremony, attented by Emperor Franz Joseph of Austria and the Empress Elisabeth as well as her relative, King Maximilian II, will commence in a few days."
bavaria.503.a: "Gute Reise!"
bavaria.503.b: "Stop our support for the railway projects."
bavaria.504.t: "Rosenheim-Kufstein Line in Service"
bavaria.504.d: "As part of the railway concessions agreed upon by the state and the investors, the railway line from Rosenheim to Kufstein, at the Austrian border, has been completed. It's the first railway line in the southern part of Bavaria and connects the region to Munich via railway, which will surely promote industry and tourism in the whole region."
bavaria.504.a: "Gute Reise!"
bavaria.504.b: "Stop our support for the railway projects."
bavaria.505.t: "Ostbahn - Segment Munich-Landshut in Service"
bavaria.505.d: "As part of the railway concessions agreed upon by the state and the investors, the Ostbahn segment from Munich to Landshut has been completed. The line will continue to Passau via Straubing. That railway line is supposed to be finished in around two years time, if we decide to continue our support for the railway projects."
bavaria.505.a: "Gute Reise!"
bavaria.505.b: "Stop our support for the railway projects."
bavaria.506.t: "Ostbahn - Segment Landshut-Regensburg-Nürnberg in Service"
bavaria.506.d: "As part of the railway concessions agreed upon by the state and the investors, the Ostbahn segment from Landshut to Regensburg and the connection to Nuremburg has been completed. The line will continue to Passau. That railway line is supposed to be finished in about a year, if we decide to continue our support for the railway projects."
bavaria.506.a: "Gute Reise!"
bavaria.506.b: "Stop our support for the railway projects."
bavaria.507.t: "Ostbahn - Segment Regensburg-Straubing-Passau in Service"
bavaria.507.d: "As part of the railway concessions agreed upon by the state and the investors, the Ostbahn segment from Regensburg via Straubing to Passau has been completed. The line will continue to Passau. There are other railway lines planned connecting the northeast of Bavaria to Bohemia, if we decide to continue our support for the railway projects."
bavaria.507.a: "Gute Reise!"
bavaria.507.b: "Stop our support for the railway projects."
bavaria.508.t: "Ostbahn - Segment Schwandorf-Cham-Bohemian Border in Service"
bavaria.508.d: "As part of the railway concessions agreed upon by the state and the investors, the Ostbahn segment from Schwandorf to the Bohemian border via Cham has been completed. The line will eventually connect the Bavarian railway network to Prague."
bavaria.508.a: "Gute Reise!"

###MILITARY EVENTS
bavaria.751.t: "50th Anniversary of the Disastrous Russian Campaign of 1812"
bavaria.751.d: "Half a century has passed since the Grande Armée crossed the Niemen, and with it the Bavarian VI Corps - over 30,000 strong - marched into the frozen hell of Russia. Of those men, fewer than 4,000 ever saw their homeland again; the rest perished at Polotsk, on the Berezina, or in the endless retreat through snow and starvation.\n\nThis year, the [BAV.GetName] marks the anniversary with somber ceremonies: veterans, now gray and frail, gather beneath the Karolinenplatz obelisk inscribed 'Den dreyssig tausend Bayern die im russischen Kriege den Tod fanden' (To the 30,000 Bavarian who found death in the Russian War). The state has granted a small honorarium to surviving veterans - 162 men received five Gulden each - but the gesture feels hollow against the scale of the loss.\n\nFor officers and army reformers, the commemoration is a stark reminder: the army that bled in Russia was poorly led, ill-supplied, and unprepared for modern warfare. If Bavaria had pursued serious military reforms earlier - modern rifles, professional staff training, improved logistics, and universal conscription - the veterans nod in approval - the outcome might have been different.\n\nA long time has passed since the events of 1812 and the [BAV.GetName] now stands tall and independent of foreign influence. But have we done enough to ensure that the mistakes of the past will not repeat themselves?"
bavaria.751.a: "We have to do more..."
bavaria.751.b: "We've made some progress since then."
bavaria.751.c: "We've learned from our mistakes!"

bavariafocus.2.t: "Pick our Side"
bavariafocus.2.d: "We are now at the point where we have to choose a side. The Prussians in the north could be a strong ally, but the Austrians share a lot of similarities with us, unlike the Prussians. If we want to keep our Kingdom, culture and people safe, we have to act now."
bavariafocus.2.a: "The Prussians are different than us, but they'll be a great ally and able to protect us."
bavariafocus.2.b: "No way we will ally with the Prussian beasts. Austria is a much better choice."

bavariafocus.5.t: "Triaspolitik"
bavariafocus.5.d: "The so-called Trias is a try of the southern German states to strengthen their bond and affront the great Germanic powers, being Prussia and Austria. The main contributors to this idea are Württemberg with Karl Augustus von Wangenheim, Bavaria with Maximilian II, the current King of Bavaria, and Prime Minister Friedrich Ferdinand von Beust from Hannover. This idea of a unified coalition in the south again experienced an upsurge in popularity after the German Revolution and is even being supported by France. Following the Prussian attempt at pulling through the Lesser Germany, the Four Kings Alliance became reality, consisting of Bavaria, Saxony, Hannover and Württemberg, which mainly supports the Greater Austrian Plan."
bavariafocus.5.a: "Bavaria should be the one to lead the Trias."

bavariafocus.8.t: "Bavaria Proposes a Süddeutscher Zollverein"
bavariafocus.8.d: "As of late the relations between our country and Bavaria have been developing very well. We gained a few new allies, too, and now they proposed a new kind of Zollverein. Accepting this new South German Zollverein would mean getting rid of the old one and upsetting Prussia. Still, this proposal is not a bad move from Bavaria, wanting to exclude their enemies from the new Zollverein. In other words, Bavaria thinks of us as an ally."
bavariafocus.8.a: "A brilliant idea! This will be of great benefit to our economy."
bavariafocus.8.b: "This is just an attempt by Bavaria to grab more power. Don't let them succeed."
bavariafocus.9.t: "Bavaria proposes the South German Confederation!"
bavariafocus.9.d: "The South German Zollverein became reality and now Bavaria wants to push even further. The proposed South German Confederation is a military and economic alliance between allied German middle states. Accepting it means giving up on getting Prussia or Austria as allies and being on our own. There are two ways this could turn out - either the new South German Confederation is not supported by many middle states, marking its demise, or it becomes the Third Deutschland, the third big power in middle Europe. We do not like to gamble with the future with our country, but in this case it seems to be inevitable."
bavariafocus.9.a: "Our country wants to be a part of this new Confederation. This will mark a new era."
bavariafocus.9.b: "There is no way we will agree. It's suicide."
bavariafocus.10.t: "Bavarian Protestantism Dead?"
bavariafocus.10.d: "Catholicism is a part of Bavarian history and culture. Abolishing it would mean abolishing our culture, and no one wants that to happen. The Catholic Church will be a part of our country forever."
bavariafocus.10.a: "This is for the best."
bavariafocus.11.t: "Bavaria Accepts Protestantism"
bavariafocus.11.d: "Today Bavaria lost a piece of its culture. The state officially recognized Protestantism, making it the state religion. Many are not content with this development, however, namely the 'classic' Catholic Church and conservative groups."
bavariafocus.11.a: "Let us see how this will develop."
bavariafocus.12.t: "Conservatives Resist!"
bavariafocus.12.d: "Following our recent pro-Protestantism policies, a bunch of conservative Bavarian groups have been raising their voices. They demand that we stop 'destroying their beloved culture' and come back to old standards. Whatever we do, we should prepare for the backlash."
bavariafocus.12.a: "Let them scream for a bit and eventually their cries will dampen. We're doing the right thing."
bavariafocus.12.b: "Maybe we shouldn't be as aggressive. Let's do some talking first."
bavariafocus.13.t: "Bavarian Protestantism Fails!"
bavariafocus.13.d: "Our try to officially recognize Protestantism backfired. Many armed groups went on to strike and protest against our recent non-conservative moves. The Catholic Church prevailed and only widened its reach. All this effort - for nothing."
bavariafocus.13.a: "Can't they see that they're destroying our country?!"
bavariafocus.14.t: "Bavarian Protestantism Accepted!"
bavariafocus.14.d: "No one believed this could happen - and yet it did. The conservative groups simply could not get the government to accept classic Catholicism again. Instead, Protestantism now plays a big role in the everyday-life of the Bavarian citizen. Still, the conservative groups refuse to give up on their beloved Catholic Church and the Bavarian people are now clearly divided."
bavariafocus.14.a: "New times require new standards."
bavariafocus.15.t: "Bavaria - A Friend?"
bavariafocus.15.d: "Bavarian advisors and politicians today arrived in Vienna and proposed silent cooperation between Bavaria and Austria, as both of us have something against Prussia, to say the least. While it would make sense for them to ask us to become allies, maybe we should not meddle with the German middle states too much. On the other hand, with some political work, we could get a foothold in Bavaria, possibly making a battle against Prussia easier."
bavariafocus.15.a: "The more allies on our side - the better."
bavariafocus.15.b: "We don't need them."
bavariafocus.16.t: "Bavaria - An Ally?"
bavariafocus.16.d: "Yet again Bavarian advisors arrive in Vienna. This time their proposal is more drastic - seeing how Prussia keeps pushing their demands, Bavaria now wants us an official ally against them, feeling threatened by Prussia. This might be our chance to completely bring Bavaria on our side. However, this might incite the Prussians."
bavariafocus.16.a: "If you think about it, Bavaria is not that different from Austria."
bavariafocus.16.b: "We may have a common enemy, but we can manage alone."
bavariafocus.17.t: "Talks With Austria Going Well"
bavariafocus.17.d: "Today our advisors came back from Vienna with good news. Our proposals to Austria were accepted and the relationship between our two countries is steadily growing. While this is good news to us, Prussia should not be that happy about this development. We should tread with caution."
bavariafocus.17.a: "This will help our relationship grow."
bavariafocus.18.t: "Talks With Austria Continue to Go Well"
bavariafocus.18.d: "And again our advisors come back, bringing good news with them. Austria now officially sees us as an ally after considering the pros and cons of this coalition. As long as our common enemy Prussia exists, this coalition will too."
bavariafocus.18.a: "In these times allies are a must."
bavariafocus.19.t: "Bavaria Wants to Support Bismarck's Parliament"
bavariafocus.19.d: "Bismarck's proposal for a parliament seems to have found some popularity in Bavaria. This proposal is Bismarck's last try to bring the German middle states together and maybe with Bavaria agreeing to it it could succeed. Time will tell, but for now Bavaria seems to have become a little more open to Prussian politics. We could either accept their support, or reject it, the choice is still ours."
bavariafocus.19.a: "It's not too late for them."
bavariafocus.19.b: "They're just trying to kiss up to us."
bavariafocus.20.t: "Prussia Accepts our Support!"
bavariafocus.20.d: "Prussia just accepted our support for Bismarck's parliament. Maybe this will bring us a step closer to a German unification, or at least improve the relation between Bavaria and Prussia. Either way, this is good news, and we can stop holding our breath."
bavariafocus.20.a: "Maybe we can avoid escalation after all."
bavariafocus.21.t: "Bavaria Wants Unity"
bavariafocus.21.d: "Bavaria once again wants to support our deed, and this time it is about German unity. Seeing how a war is probably inevitable, Bavaria wants to support us. While we do not think that Bavaria really wants to go to war, but only tries to gain some allies in case of it, they could be a good ally to have in the south. At the very least the Bavarian territory could be used as a temporary buffer between the German middle states and us."
bavariafocus.21.a: "Very well, there shall be unity."
bavariafocus.21.b: "Nothing but lies. We shouldn't trust them."
bavariafocus.22.t: "Prussia Agrees!"
bavariafocus.22.d: "After some wait, we have received message that Prussia agreed to our support. Now we have a strong ally on our side, but are right between the other German states and Austria, all of whom are strictly against Prussian reforms. Still, we now do not have to fear being alone in the case of war."
bavariafocus.22.a: "Today is a good day."
#(Austria)
bavariafocus.23.t: "Military Consultative Commission"
bavariafocus.23.d: "Today the Military Consultative Commission was held. The results state that there is a high possibility of us surviving the upcoming war if we were to fight on Austrias side, as the latest developments have shown that Austria has a high enough political opinion of us to be our ally. Ultimately we did not learn anything we did not know before, seeing how Austria agreed to all of our proposals. Either way, the Military Consultative Commission thinks it would be a good idea to be on Austrias side."
bavariafocus.23.a: "The commission is over."
#(lean Austria)
bavariafocus.24.d: "Today the Military Consultative Commission was held. The results were less clear than we had hoped them to be, stating that while Austria has its differences, it would probably be still a better idea to fight on their side instead of trying to survive alone. The Austrians agreed to most of our proposals, making an alliance in the case of war likely, but not definite. Either way, the Military Consultative Commission thinks it would be a good idea to be on Austrias side in case of war, but still be careful around them."
#(Prussia)
bavariafocus.25.d: "Today the Military Consultative Commission was held. The results were surprising, to say the least, with the commission recommending Prussia as an ally. Prussia and Bavaria are not the best friends per se and have their cultural and political differences, but recent developments have shown that the Prussians might not be as aggressive against Bavaria as we thought them to be. Either way, the Military Consultative Commission thinks it would be a good idea to be on Prussia's side."
#(lean Prussia)
bavariafocus.26.d: "Today the Military Consultative Commission was held. The results were slightly surprising, with the commission recommending Prussia as an ally in case of war. However, the commission pointed out that Prussia's main goal is to expand their reach, meaning one day they might turn against us. As such we should be very careful when joining an alliance with Prussia. Either way, the Military Consultative Commission thinks it would be a good idea to be on Prussias side, but still have an eye on their actions."
#(neutral)
bavariafocus.27.d: "Today the Military Consultative Commission was held. The results were disappointing at most, if anything. Instead of producing a clear statement, the commission could not find an agreement between its members. As such, not Prussia nor Austria seem to be good options in case of war. Maybe we should try to stay neutral, even if that seems unlikely at first."
bavariafocus.28.t: "Bavarian Customs"
bavariafocus.28.d: "Bavaria is a country of culture, arts and customs. With the new Republic established, however, we now have to ask ourselves if this can go on like this. We could try convincing our people to be more understanding towards other cultures and religions, and separate state and religion."
bavariafocus.28.a: "Our customs and culture are important to our people."
bavariafocus.28.b: "Maybe a change of pace would be good."
bavariafocus.29.t: "Bavaria Decides"
bavariafocus.29.d: "With two Kings gone in such a short time and new social ideas embraced, the government is in a turmoil. Now is our chance to form the future of our country, by taking the leashes in our own hands. Before we do any mistakes we will regret doing in the future though, we must first decide how to approach this. We could either try to take over the government from the inside, or call for a revolution."
bavariafocus.29.a: "This is our chance to take over the government without any bloodshed."
bavariafocus.29.b: "There is no way the nobles will give in. The only way is revolution."
bavariafocus.30.t: "[From.GetName] Accepts!"
bavariafocus.30.d: "[From.GetName] seemingly liked our proposal, and accepted it! Now we can move on and gather other allies. Together we are strong!"
bavariafocus.30.a: "Great news!"
bavariafocus.31.t: "[From.GetName] Denies!"
bavariafocus.31.d: "To our regret, [From.GetName] denied our proposal. We should move on and try convincing others to join us."
bavariafocus.31.a: "They don't understand how important this is."
bavariafocus.32.t: "Nuremberg's Industrie- und Kulturverein Established!"
bavariafocus.32.d: "As we have instructed, the Industrie- und Kulturverein in Nuremberg has been established. It will actively try to support and stimulate our industry and spread of our culture. Additionally it will help us gain more local influence in Nuremberg."
bavariafocus.32.a: "Good to hear!"
bavariafocus.33.t: "Bezirksamt Erlangen Established!"
bavariafocus.33.d: "As we have instructed, the Bezirksamt Erlangen has been established. Because of how fast Erlangen, the small city in the proximity of Nuremberg has grown, the Bezirksamt makes sure that we as the Bavarian government have full control over the agrarian culture and industry in that area."
bavariafocus.33.a: "Wunderbar!"
bavariafocus.34.t: "The Culture of Munich"
bavariafocus.34.d: "Since Ludwig I Munich has been the centre of Bavarian culture. The city is the main contributor to the Bavarian image and is our capital at the same time. As instructed by us, Bavarian culture will now go beyond Munich and reach even the smallest villages and towns of the [Root.GetName]."
bavariafocus.34.a: "Ausgezeichnet!"
bavariafocus.35.t: "The Pride of the Bavarians"
bavariafocus.35.d: "Today [Root.GetLeader] made a speech, telling the people that they, as [From.GetAdjectiveCap]s, should be proud of themselves. The speech was received with loud clapping and the following night one could hear and see joyful singing, dancing and drinking everywhere. Ein Prosit auf Bayern!"
bavariafocus.35.a: "We are a proud nation!"
bavariafocus.36.t: "Bavaria Wants to Play Big"
bavariafocus.36.d: "Today the Kingdom of Bavaria announced that from now on it wants to play a bigger role in the Concert of Europe, and find its place in it. Seeing how it is the biggest and most influential German middle state, some think that Bavaria's wish to be noticed by others could be successful, provided they take part in international politics, like the big powers do. Others, however, think that this wish is merely that, noting that the Kingdom of Bavaria never before had any interest in being a part of the Concert. While small countries like some other German middle states seemingly want Bavaria to succeed in becoming more important, the main and long-established powers in Europe, mainly France, Prussia and Austria, would like Bavaria to stay in its current position."
bavariafocus.36.a: "Onwards, Bavaria!"
bavariafocus.36.b: "This is merely wishful thinking."
bavariafocus.37.t: "Bavaria Wants to Play Safe"
bavariafocus.37.d: "For the current time, the Kingdom of Bavaria stated today that it will stay out of major European issues. While Bavaria wants to continue to play a role in German affairs, it does not want to get involved in any prominent foreign affairs. This choice, on the other hand, does not appear to have surprised anyone, especially given the size of the major powers that border the small kingdom, namely the Empire of France, the Kingdom of Prussia, and the Austrian Empire. Bavaria, ostensibly unwilling to abandon its isolated policies and culture, prefers to concentrate on German regions rather than compete with neighboring powerhouses that surround it and its allies."
bavariafocus.37.a: "We shall keep our principles."
bavariafocus.37.b: "A wise decision."
bavariafocus.38.t: "Ludwig-Donau-Main-Kanal Extended!"
bavariafocus.38.d: "As we have instructed, the Ludwig-Donau-Main-Kanal has been extended. Finished in 1846 and built during the reign of Ludwig I, the Donau-Main-Kanal has been an important tool for Bavarian trade ever since. With the expansion finished, it now allows us to use more ships for trade, making Bavaria more important when it comes to trading."
bavariafocus.38.a: "Ships sure are something."
bavariafocus.39.t: "Ludwig-Süd-Nord-Bahn Extended!"
bavariafocus.39.d: "As we have instructed, the Ludwig-Süd-Nord-Bahn has been extended. Named after Ludwig I, just like the Ludwig-Donau-Main-Kanal, it allows for fast transportation between Franconia and Upper Bavaria, even going so far to reach Saxony. After extending it with additional lines, it now grants us the possibility to transport our goods to more corners of Bavaria faster than ever before."
bavariafocus.39.a: "Trains sure are something."
bavariafocus.40.t: "Southgerman Confederation Formed!"
bavariafocus.40.d: "It seems that the Triaspolitik of Bavaria and the other German middle states finally payed off. As of late, the middle states have been making common policy, guided by Bavaria, the biggest and most probably strongest middle state in the German area. Today, after endless discourses and debates, the Southgerman Confederation was born, officially lead by Bavaria. It is advertised by its members as the Third Deutschland, the third big Germanic power, right beside Austria and Prussia. However, it still remains a mystery whether this brand new alliance will bear any fruit and keep up with the European powers."
bavariafocus.40.a: "We will be a power to be reckoned with."
bavariafocus.40.b: "The Third Deutschland is now formed."
bavariafocus.41.t: "[From.GetName] Joins the Southgerman Zollverein!"
bavariafocus.41.d: "We just received word that [From.GetName] has joined the Southgerman Zollverein. As follows, they have abandoned the old one."
bavariafocus.41.a: "This will benefit our economy greatly."
bavariafocus.42.t: "[From.GetName] Denies the Southgerman Zollverein!"
bavariafocus.42.d: "We just received word that [From.GetName] has refused our proposal. Seeing no future in the new Southgerman Zollverein, they decided to stick to the old one."
bavariafocus.42.a: "What do they even gain from this decision!?"
bavariafocus.43.t: "[From.GetName] Joins the Southgerman Confederation!"
bavariafocus.43.d: "The [From.GetAdjectiveCap] government today told us that they will support our cause, agreeing to our proposal and that [From.GetName] will join the Southgerman Zollverein. They are now de jure a member."
bavariafocus.43.a: "United we are strong!"
bavariafocus.44.t: "[From.GetName] Denies the Southgerman Confederation!"
bavariafocus.44.d: "After having considered the up- and downsides of our proposal, [From.GetName] decided to not join the new Southgerman Confederation. We will have to search for other members."
bavariafocus.44.a: "After all this trouble we went through!?"
bavariafocus.45.t: "[BAV.GetNameDef] Proposes the Establishment of the Trias"
bavariafocus.45.d: "[BAV.GetName], our neighbour in the south of the German lands, lately has been motivating the middle states for the formation of the Trias, or the Third Deutschland, as some people call it. Essentially being a confederation or league of sorts, the Trias will establish a third power besides Prussia and Austria in the south. Liking this idea, [BAV.GetName] now officially proposed the formation of said Trias league. As such, both us and [BAD.GetNameDef] receive an invitation. If one of us declines, the Trias will break down, as it requires both [WUR.GetName] and [BAD.GetName] for its formation. When deciding on whether to accept or deny this proposal, however, we should keep in mind that becoming the third German power could have consequences."
bavariafocus.45.a: "May this be the birthing hour of the Third Deutschland!"
bavariafocus.45.b: "It is an old and unrealistic idea; fantasy."
bavariafocus.48.d: "[BAV.GetName], our neighbour in the south of the German lands, lately has been motivating the middle states for the formation of the Trias, or the Third Deutschland, as some people call it. Essentially being a confederation or league of sorts, the Trias will establish a third power besides Prussia and Austria in the south. Liking this idea, [BAV.GetName] now officially proposed the formation of said Trias league. As such, we now receive this invitation, with [WUR.GetNameDef] already having accepted it. If we were to decline, the Trias would break down, as it requires both [WUR.GetName] and [BAD.GetName] for its formation. When deciding on whether to accept or deny this proposal, however, we should keep in mind that becoming the third German power could have consequences."
bavariafocus.46.t: "Trias Established!"
bavariafocus.46.d: "As both [WUR.GetNameDef] and [BAD.GetNameDef] have accepted our proposal regarding the formation of the Trias, we, the three south German states of the Trias, are now allied to each other. As this form of Trias has no leader per se, each and every member can voice their concerns and ambitions if they want to. However, to ensure the inner stability of this structure, [BAV.GetName] will act as a representative of the Trias."
bavariafocus.46.a: "May the Third Deutschland flourish and thrive!"
bavariafocus.49.t: "[WUR.GetName] Accepts!"
bavariafocus.49.d: "Word reached us that [WUR.GetNameDef] has accepted our proposal regarding the Trias. Now, it is up to [BAD.GetNameDef] to decide whether the Trias will be established or not."
bavariafocus.49.a: "We welcome our [WUR.GetAdjective] friends!"
bavariafocus.47.t: "[FROM.GetName] Denies!"
bavariafocus.47.d: "As [FROM.GetNameDef] has denied our proposal regarding the Trias, no such structure can be formed anymore from our side as such requires both [WUR.GetName] and [BAD.GetName] to accept. Unfortunately for us, and for all of the southern German states wishing for a Third Deutschland, there is nothing we can do anymore to ensure the sovereignty of the middle states, including ourselves."
bavariafocus.47.a: "The dream of the Trias - shattered into a thousand pieces..."
bavariafocus.50.t: "Invitation to the Trias"
bavariafocus.50.d: "With the Trias established in the South, [BAV.GetNameDef] asks us whether we would like to join it or not. The three founding nations of the Trias, namely [BAV.GetName], [WUR.GetName] and [BAD.GetName], now are on the lookout for more allies, as the Trias is still quite small as it is right now. By deciding to join them we may be able to participate in creating the Third Deutschland, although it must be said that doing so may also have consequences."
bavariafocus.50.a: "The Third Deutschland, we shall be a part of it!"
bavariafocus.50.b: "We do not want to aggravate the political situation Central Europe is already in."
bavariafocus.51.t: "[FROM.GetName] Accepts!"
bavariafocus.51.d: "Following our invitation into the Trias, [FROM.GetNameDef] decided that being a part of the newly formed Trias would benefit them in the long run."
bavariafocus.51.a: "Welcome to the Third Deutschland!"
bavariafocus.52.t: "[FROM.GetName] Denies!"
bavariafocus.52.d: "Following our invitation into the Trias, [FROM.GetNameDef] decided that they would rather stay away from the newly formed Trias."
bavariafocus.52.a: "Curse those damn [FROM.GetAdjective]s!"

bavariaevent.1.t: "Frankfurter Fürstentag"
bavariaevent.1.d: "The Frankfurter Fürstentag session began today on the 17th August 1863. The Fürstentag was initiated by the Austrian Kaiser and deals with proposed reforms regarding the German Confederation. The proposed reforms, if enacted, would inter alia set up a parliamentary committee, bringing the German Confederation nearer to being a Federal State. On the other hand, Prussia proposed other plans for the reorganization of the German Confederation. We either could support the Austrian proposals, disapprove of them and support the Prussian ones or stay neutral."
bavariaevent.1.a: "We will support the Austrian proposals."
bavariaevent.1.b: "We don't want to incite anybody."
bavariaevent.1.c: "We will support the Prussia proposals."
bavariaevent.3.t: "Common Policy with [From.GetNameDef]"
bavariaevent.3.d: "Our recent political actions have impressed the [From.GetAdjectiveCap] ministers and politicians. After many discussions, proposals and debates, our two countries finally agreed to make common policy and to grow stronger together in the future - side by side."
bavariaevent.3.a: "A Prost to our new [From.GetAdjectiveCap] friends!"
bavariaevent.4.t: "Common Policy with [From.GetNameDef]"
bavariaevent.4.d: "Afraid that our latest try to make common policy with the [From.GetAdjectiveCap] would stir up the relations between them and other German states, [From.GetName] denied our proposal. However, they seem to be moved by our newly embraced open politics and want to stay on friendly terms."
bavariaevent.4.a: "It is a shame, but we will have to respect their decision."
bavariaevent.5.t: "[From.GetName] Proposes Common Policy"
bavariaevent.5.d: "Today [From.GetNameDef] proposed common policy between our two countries. They think that this is a good way to improve the relations between us."
bavariaevent.5.a: "[From.GetNameDef] are our friends. We should accept."
bavariaevent.5.b: "Even if our countries are both German, there is a reason for why we are independent."
#Unification
bavariaevent.7.t: "The German Question"
bavariaevent.7.d: "Now that the German threat is gone, the Austrians will look forward to unite Germany as they like. Luckily, we chose the right side and are now one of the winners. As such, we are allowed to partake in the peace talks. We could try to have a say and get a few advantages for ourselves, but we also could leave it up to the Austrians. However, if we were to take part in the peace talks, we would need to keep in mind that our chance of achieving what we want would be dependent on how much our country developed or performed in the war."
bavariaevent.7.a: "We should try to have a say."
bavariaevent.7.b: "Let's leave it up to the Austrians."
bavariaevent.8.t: "Treaty of Frankfurt"
bavariaevent.8.d: "The peace talks are finally here. As we decided to have a say and be present during the talks, we now have to propose our demands or suggestions. As the North, led by Prussia, lost the war, we now have full control over Germany and can push through our interests.\n\nFirstly, we could demand the annexation of the Ruhrgebiet by Bavaria, as we already own Palatinate in that region. This could greatly benefit our industry, but we should be aware that if the Austrians do not recognize Bavaria as an industrializing country, we would have little chances in succeeding with this demand.\n\nAnother approach would be to just sit at the table, but let the Austrians do all the actual work. Being present at the peace talks and being victorious already makes us quite popular. Additionally, it would not be a bad idea to be on the good side of the Austrians.\n\nThe by far most daring suggestions would be the ones concerning the German unification. As to not be completely thrown aside, we could try to submit some ideas on how the unification should go."
bavariaevent.8.a: "The Ruhr is rightfully Bavarian soil. We should demand it to be handed over to us."
bavariaevent.8.b: "Whatever the Austrians say, we should agree for the sake of relations."
bavariaevent.8.c: "Unification is key. Conveniently, we have some ideas how it could be reached."
bavariaevent.9.t: "Bavaria Demands the Ruhrgebiet"
bavariaevent.9.d: "Taking part in the peace talks, [BAV.GetNameDef] today demanded the Ruhr to be officially handed over to them. As we have defeated the Prussians on the field, we theoretically can do whatever we want with that piece of land. In fact, if Bavaria were to annex the Ruhrgebiet, it would weaken the industry of [PRS.GetNameDef] immensely. We could, however, decline and do something else with it."
bavariaevent.9.a: "Let them have it. Bavaria is a friend."
bavariaevent.9.b: "We shouldn't give Bavaria more power."
bavariaevent.10.t: "Deutscher Staatenbund"
bavariaevent.10.d: "As no apparent answer to the German Question could have been found until now, we have to decide what to do for the time being. Unification seems to be a much more complicated thing to accomplish than we thought it would be, and now we have to act before the German states turn away from us.\nMany in our government have come to like the temporary idea of forming a Schutzbund, a temporary, protective federation, to ensure stability and safety along the German areas. It was decided that this faction is to be established within the next days. However, it is yet to be decided how to handle this federation; we could either directly subjugate the German states and initiate the Schutzbund to play safe, or we could create the Schutzbund without subjugating anyone, as that could lead to mistrust."
bavariaevent.10.a: "Let's play safe."
bavariaevent.10.b: "The Schutzbund alone should be enough."
bavariaevent.11.t: "Bavaria Proposes Unification"
bavariaevent.11.d: "Today [BAV.GetNameDef] proposed the final unification of Germany under Bavaria as our subject. Every German state would be forcefully annexed by them, to be ruled from Vienna through Munich. If we were to agree to this proposal, German unification would finally be accomplished and we would have full power over all German land without risking too much, like protests in our home country. However, we have to keep in mind that this possibly could be a power grab from Bavaria, even though they have been quite well-disposed towards us."
bavariaevent.11.a: "So be it."
bavariaevent.11.b: "We will decide by ourselves how to handle this."
bavariaevent.12.t: "Bavaria Proposes Unification"
bavariaevent.12.d: "Today [BAV.GetNameDef] proposed the final unification of Germany under Bavaria as our subject. Every German state would be annexed by them, to be ruled from Vienna through Munich, except from the ones who were our allies in the past war. Instead, our past allies, mostly consisting of the southern German states, would be asked whether they would like to become a part of the to be formed German Confederation. If they deny, they will simply become subjects of the new Germany, maintaining their old and rightful borders and territories. It is now up to us to decide whether this new Germany becomes reality, or not."
bavariaevent.12.a: "Bavaria has been a good friend of ours. For a new Germany!"
bavariaevent.12.b: "We have better ideas than that."
bavariaevent.13.t: "The Road to Unification"
bavariaevent.13.d: "The time has come to present our plans for Germany to the Austrians. Still, we need to decide what exactly we will propose to them; on that matter we have two major ideas on how to establish a unified Germany.\n\nThe first idea would be to forcefully unify Germany under Bavaria, while Bavaria itself becomes a subjugated state of Austria. This would make our dream of a Bavarian Germany reality, even if Austria would become our overlord.\n\nThe second idea would be to give the German states who were our allies in the previous war a choice: either they join us and become a part of the New Germany, or they maintain their borders, but are subjugated to us.\n\nWhile the first idea sounds more pleasing, the second one would ensure that no previous ally turns sour on us. However, we should note that the ones who have the final say remain the Austrians. Whether they will accept our proposal depends on how we decided to be seen by the other European powers."
bavariaevent.13.a: "We will unite Germany, even if this could bother some people."
bavariaevent.13.b: "We can not afford to upset our allies."
bavariaevent.14.t: "German Unification"
bavariaevent.14.d: "The German peace talks seem to be coming to an end, and with that it seems that Austria has accepted Bavaria's proposal of unification; unification is but a step away. All German states who have been allied to [AUS.GetNameDef] have now to make a decision. Either they become a direct part of the new Germany, or they maintain their borders and territories, but become a subject. As we are one of the past allies, we have to make a choice."
bavariaevent.14.a: "We will become a part of the new Confederation."
bavariaevent.14.b: "Unification was never our dream. We want our [Root.GetAdjectiveCap] borders."
bavariaevent.15.t: "[From.GetNameDef] Becomes Part of Germany"
bavariaevent.15.d: "As the [From.GetName] today announced, their realm will become a part of the newly formed Germany. [From.GetAdjectiveCap] politicians will be integrated into the new political system as ministers and general members of the government."
bavariaevent.15.a: "Finally the German dream becomes reality."
bavariaevent.16.t: "[From.GetNameDef] Becomes Subject of Germany"
bavariaevent.16.d: "As the [From.GetName] today announced, the [From.GetName] will hold on to their borders and territories. Instead of becoming a part of the new Germany, they rather would preserve their culture, political system, and land, but turn into our subject."
bavariaevent.16.a: "They have to suit themselves."
bavariaevent.17.t: "Germany United!"
bavariaevent.17.d: "Today we received word that the German war between Austria and Prussia concluded in a victory of the South - meaning Austria and it's allies. A peace conference was held, deciding on how to proceed with the German states. Bavaria, the biggest southern German state, proposed uniting Germany under her, to be ruled from Vienna, Austria. The Austrians accepted the Bavarian proposal, seemingly liking the sound of finally uniting the German states, and as such [GEC.GetNameDef] was born. However, as the former Prussian allies and Prussia itself were forcefully integrated into the new country, it is yet to be seen whether this new Germany will hold."
bavariaevent.17.a: "Hurra!"
bavariaevent.17.b: "Good for them."
bavariaevent.18.t: "[From.GetNameDef] Agrees"
bavariaevent.18.d: "Austria has agreed to our proposal. The German unification under Bavaria can now become a real thing. "
bavariaevent.18.a: "Cheers!"
bavariaevent.19.t: "[From.GetNameDef] Denies"
bavariaevent.19.d: "Austria denied our proposal. They will now push through their own ideas and plans, instead of listening to others."
bavariaevent.19.a: "Damn."

