 FRA_suez_processing_of_the_report: "Processing of the Report"
 FRA_suez_processing_of_the_report_desc: "The Commission Internationale pour le percement de l'isthme de Suez, a multinational venture founded in early 1856, has submitted a unanimous report detailing how the Suez Canal could be constructed. The difficult nature of the terrain and the fact that it will be constructed on foreign soil means that it is going to take some time to gain the necessary permissions and the capital before the construction process may begin."
