 egy_debt_system.1.t: "Public Worried About Debt!"
 egy_debt_system.1.d: "Our debt is increasing and we many are worried about it. The people demand we lower the debt so they can no longer carry the burden of paying the debt."
 egy_debt_system.1.a: "They must endure the taxes..."
 egy_debt_system.2.t: "Public Concerns On Debt!"
 egy_debt_system.2.d: "Our debt is high and we many are concerned about bankruptcy. The people demand we lower the debt so they can no longer carry the burden of paying the debt."
 egy_debt_system.2.a: "They must endure the taxes..."
 egy_debt_system.3.t: "Public Concerns On Debt!"
 egy_debt_system.3.d: "Our debt is high and we many are concerned about bankruptcy. The people demand we lower the debt so they can no longer carry the burden of paying the debt."
 egy_debt_system.3.a: "They must endure the taxes..."
 egy_debt_system.4.t: "Public Angered About Debt!"
 egy_debt_system.4.d: "Our debt is high and we many are concerned about bankruptcy. The people demand we lower the debt so they can no longer carry the burden of paying the debt."
 egy_debt_system.4.a: "They must endure the taxes..."
 egy_debt_system.5.t: "Public Outrage About Debt!"
 egy_debt_system.5.d: "Our debt is dangerously high and we may have to declare bankruptcy soon! The people are outraged and demand we lower the debt or remove the burden we've placed on them."
 egy_debt_system.5.a: "We cannot hide our troubles any further..."
 egy_debt_system.6.t: "Impending Bankruptcy!"
 egy_debt_system.6.d: "Our debt is at [?ROOT.debt_level] which places us near bankruptcy. To avoid such a terrible fate, legislators are scrambling an emergency action plan to alleviate some of our debt. It will undoubtedly anger anyone who ends up paying the emergancy tax. This leaves us with one question, who will pay the bill to help bail out our nation's debt?"
 egy_debt_system.6.a: "Make the People Pay"
 egy_debt_system.6.b: "Make the Industry Pay"
 egy_debt_system.6.c: "Make the Army Pay"
 egy_debt_system.6.e: "Continue paying the debt"
 edc_bankrupt: "§RBankrupt§!"
 remove_debt_effects: "§YRemoves all other debt effects§!"
 afr_EGY_vic.10.t: "USA civil war bolsters our Fabric sales"
 afr_EGY_vic.10.d: "Due to the ongoing civil war in [USA.GetNameDef] the worlds Fabric prices have drastically increased. As one of the worlds major fabric exporters this has increased our profits by five times!"
 afr_EGY_vic.10.a: "Invest the extra taxes in our government"
 afr_EGY_vic.10.b: "Use this to pay off our debt"
 EGY_vic_begin_army_exspansion: "Begin Army Expansion"
 EGY_vic_begin_army_exspansion_desc: "Egypt's armed forces must grow if we are to defend our interests without relying on Istanbul. A measured expansion will provide the manpower needed for a more ambitious military policy."
 EGY_vic_army_innovations: "Army Innovations"
 EGY_vic_army_innovations_desc: "Numbers alone will not make the Egyptian Army formidable. New weapons, organization, and battlefield methods must be studied if our soldiers are to compete with modern powers."
 EGY_vic_new_doctrines: "New Doctrines"
 EGY_vic_new_doctrines_desc: "The lessons of recent European wars have transformed the art of war. Egyptian officers must adapt those lessons to the conditions of the Nile Valley and our African frontiers."
 EGY_vic_increase_army_budget: "Increase Army Budget"
 EGY_vic_increase_army_budget_desc: "Reform requires money. Expanding the army budget will allow us to equip, train, and maintain a force worthy of Egypt's growing ambitions."
 EGY_vic_military_schools: "Military Schools"
 EGY_vic_military_schools_desc: "A professional army requires professional officers. New military schools will create a better educated corps capable of mastering modern weapons and tactics."
 EGY_vic_military_production: "Military Production"
 EGY_vic_military_production_desc: "Dependence on imported arms leaves Egypt vulnerable to foreign pressure. Expanding domestic military production will give us a reliable source of weapons and ammunition."
 EGY_vic_advances_in_the_army: "Advances in the Army"
 EGY_vic_advances_in_the_army_desc: "The old pre-industrial military system has reached its limits. By institutionalizing our reforms, the army can finally move beyond outdated organization and methods."
 EGY_vic_expanded_military_production: "Expanded Military Production"
 EGY_vic_expanded_military_production_desc: "A modest investment can broaden the network of arsenals and workshops supplying our forces. Even one additional center of production will lessen our dependence on foreign suppliers."
 EGY_vic_expanded_military_production_overhaul: "Expanded Military Production Overhaul"
 EGY_vic_expanded_military_production_overhaul_desc: "Rather than expand piecemeal, we can commit substantial funds to a wider military-industrial overhaul. The cost will be heavy, but the resulting capacity will serve Egypt for years to come."
 EGY_vic_new_army_expansion: "New Army Expansion"
 EGY_vic_new_army_expansion_desc: "With the foundations of a modern force in place, another expansion of the army is now practical. Egypt must be able to field enough trained soldiers to defend its long frontiers."
 EGY_vic_the_said_reforms: "The Sa'id Reforms"
 EGY_vic_the_said_reforms_desc: "Sa'id Pasha has sought to ease burdens on the fellahin, reorganize administration, and strengthen the army while opening Egypt to new commerce. We should turn these measures into a coherent program of reform."
 EGY_vic_the_question_of_the_sudanese_slave_raids: "The Question of the Sudanese Slave Raids"
 EGY_vic_the_question_of_the_sudanese_slave_raids_desc: "Slave-raiding in Sudan supplies manpower and profit to powerful interests, but it damages stability and Egypt's standing abroad. The government must decide whether this system can be tolerated any longer."
 EGY_vic_enforce_the_ban: "Enforce the Ban"
 EGY_vic_enforce_the_ban_desc: "A prohibition means little if officials and local notables ignore it. Cairo will devote the authority necessary to suppress the slave raids and enforce the ban throughout Egyptian territory."
 EGY_vic_the_welfare_of_the_fellahin: "The Welfare of the Fellahin"
 EGY_vic_the_welfare_of_the_fellahin_desc: "The fellahin carry much of Egypt's tax and labour burden. Improving their legal and economic position will strengthen the countryside and reduce resentment toward the state."
 EGY_vic_promulgate_the_saidiyah: "Promulgate the Saidiyah"
 EGY_vic_promulgate_the_saidiyah_desc: "The Saidiyah land regulations will strengthen the rights of cultivators and clarify rural obligations. A more secure peasantry will be better able to invest in and improve the land."
 EGY_vic_expand_cairo: "Expand Cairo"
 EGY_vic_expand_cairo_desc: "Cairo is the heart of the Egyptian state, yet its infrastructure has not kept pace with its importance. New construction and urban improvements will prepare the capital for an age of rapid growth."
 EGY_vic_education_investments: "Education Investments"
 EGY_vic_education_investments_desc: "Education received too little attention during the first years of Sa'id's rule. Targeted investment can repair that weakness and train the specialists demanded by a modernizing Egypt."
 EGY_vic_reforms_of_ismail: "Reforms of Ismail"
 EGY_vic_reforms_of_ismail_desc: "Isma'il intends to transform Egypt into a state able to stand beside the powers of Europe. Administrative, infrastructural, and cultural modernization will be pursued on an unprecedented scale."
 EGY_vic_OTO_chains: "[OTO.GetNameDef] chains"
 EGY_vic_OTO_chains_desc: "[OTO.GetNameDef] chains"
 EGY_vic_accept_OTO: "Accept [OTO.GetNameDef] Overlordship"
 EGY_vic_accept_OTO_desc: "Openly affirming Ottoman overlordship will reassure the Sultan that Egypt does not seek immediate separation. Loyalty may purchase the trust needed to win concessions by peaceful means."
 EGY_vic_a_loyal_state: "A Loyal State"
 EGY_vic_a_loyal_state_desc: "By presenting Egypt as the empire's most dependable autonomous province, we can turn obedience into political capital and make further concessions harder for Istanbul to refuse."
 EGY_vic_bring_gov_into_line_with_OTO: "Bring Our Government into line with [OTO.GetNameDef]"
 EGY_vic_bring_gov_into_line_with_OTO_desc: "Bring Our Government into line with [OTO.GetName]'s Administration"
 EGY_vic_glorify_muhammed_ali: "Glorify Muhammed Ali"
 EGY_vic_glorify_muhammed_ali_desc: "Glorify Muhammed Ali, the founder of our dynasty, in the public consciousness. Encouraging a sense of national pride in our modern Egyptian state"
 EGY_vic_request_more_automony: "Request more Autonomy"
 EGY_vic_request_more_automony_desc: "Our loyalty has earned the right to ask for more. A carefully worded petition to the Porte may expand Egypt's freedom without provoking a confrontation with the Sultan."
 EGY_vic_request_firman_stab_succ: "Request a Firman to Stabilize our Succession"
 EGY_vic_request_firman_stab_succ_desc: "The traditional succession by seniority threatens future instability within the Muhammad Ali dynasty. We will ask the Sultan to recognize a clearer hereditary order and secure the continuity of the Khedivate."
 EGY_vic_firman_1867: "The Firman of 1867"
 EGY_vic_firman_1867_desc: "The new firman elevates Egypt's ruler to the title of Khedive and broadens Cairo's authority over internal regulations and non-political arrangements. Our autonomy is becoming increasingly difficult to distinguish from sovereignty."
 EGY_vic_firman_1873: "The Firman of 1873"
 EGY_vic_firman_1873_desc: "The firman of 1873 gathers and expands Egypt's privileges, granting wide authority over laws, loans, commerce, and the armed forces while preserving only the formal bonds of Ottoman suzerainty."
 EGY_vic_our_OTO_independance: "Our Independence"
 EGY_vic_our_OTO_independance_desc: "The Porte's authority over Egypt has been reduced to little more than formal suzerainty. We should now decide whether even that final bond still serves Egyptian interests."
 EGY_vic_egyptian_industry: "Egyptian Industry"
 EGY_vic_egyptian_industry_desc: "Egypt's wealth still rests overwhelmingly on agriculture. Encouraging workshops, factories, and modern infrastructure will begin the long process of building a diversified national economy."
 EGY_vic_develop_local_infrastucture: "Develop Local Infrastructure"
 EGY_vic_develop_local_infrastucture_desc: "Roads, bridges, and local transport links are essential if crops, goods, and officials are to move efficiently. Provincial infrastructure must be improved alongside grand national projects."
 EGY_vic_start_construction_of_a_main_rail_line: "Start Construction of a Main Rail Line"
 EGY_vic_start_construction_of_a_main_rail_line_desc: "Railways can bind the Nile Valley together more effectively than traditional transport. A main line will become the backbone of a future Egyptian rail network."
 EGY_vic_expand_the_rail_network: "Expand the Rail Network"
 EGY_vic_expand_the_rail_network_desc: "The first railway has demonstrated the value of steam transport. New lines and connections will extend its benefits to more of the country."
 EGY_vic_expand_the_cotton_industry: "Expand the Cotton Industry"
 EGY_vic_expand_the_cotton_industry_desc: "Egyptian long-staple cotton is increasingly valuable on world markets. Expanding cultivation and processing can fill the treasury and finance further modernization."
 EGY_vic_increase_cotton_investments: "Increase Cotton Investments"
 EGY_vic_increase_cotton_investments_desc: "The cotton boom offers a chance to attract capital into irrigation, ginning, storage, and transport. Greater investment will turn favorable prices into lasting productive capacity."
 EGY_vic_encourage_industry_investments: "Encourage Industry Investments"
 EGY_vic_encourage_industry_investments_desc: "Private investors remain wary of expensive modern enterprises. Government encouragement and favorable terms can draw capital into factories and workshops."
 EGY_vic_increase_industry_investments: "Increase Industry Investments"
 EGY_vic_increase_industry_investments_desc: "The first industrial ventures must be followed by a broader wave of investment. Expanding access to capital will accelerate the growth of Egyptian manufacturing."
 EGY_vic_telegraph_investments: "Telegraph Investments"
 EGY_vic_telegraph_investments_desc: "The electrical telegraph can transmit orders and information across Egypt in hours rather than days. Initial investment will bring this new technology into government and commercial use."
 EGY_vic_telegraph_expansion: "Telegraph Expansion"
 EGY_vic_telegraph_expansion_desc: "A few telegraph lines are useful; a national network is transformative. Extending the wires will connect Cairo, Alexandria, Suez, and the provinces to one another."
 EGY_vic_alexandrian_breakwaters: "Alexandrian Breakwaters"
 EGY_vic_alexandrian_breakwaters_desc: "Alexandria is Egypt's principal Mediterranean gateway. New breakwaters and harbor works will protect shipping and allow the port to handle growing volumes of trade."
 EGY_vic_suez_harbour_expansion: "Suez Harbor Expansion"
 EGY_vic_suez_harbour_expansion_desc: "The rise of the Suez route demands a larger and better equipped harbor. Expanding the port will ensure Egypt can profit from the traffic passing between two seas."
 EGY_vic_local_branches: "Local Branches"
 EGY_vic_local_branches_desc: "A national trunk line alone cannot serve every district. Local branches will connect provincial towns and productive regions to the main railway system."
 EGY_vic_plan_military_campaigns: "Plan Military Campaigns"
 EGY_vic_plan_military_campaigns_desc: "Our officers must stop reacting to crises and begin planning campaigns in advance. Detailed preparations will give Egypt options in Sudan, Abyssinia, and beyond."
 EGY_vic_prepare_to_annex_south_sudan: "Prepare to Annex South Sudan"
 EGY_vic_prepare_to_annex_south_sudan_desc: "The southern reaches of Sudan remain only loosely connected to Cairo. Administrative and military preparations will allow us to bring these territories firmly under Egyptian rule."
 EGY_vic_abyssian_campaign: "Abyssinian Campaign"
 EGY_vic_abyssian_campaign_desc: "The highlands of Abyssinia stand across Egypt's ambitions in the upper Nile. We must decide whether our next campaign will confront Ethiopia or seek a different relationship with it."
 afr_EGY_vic.6.t: "Death of Muhammad Sa'id Pasha"
 afr_EGY_vic.6.d: "This Morning Wāli Muhammad Sa'id Pasha died, leaving our country leaderless, who is to be crowned"
 afr_EGY_vic.6.a: "Crown Isma'il Pasha"
 afr_EGY_vic.6.b: "Crown Ahmad Rifaat Pasha"
 afr_EGY_vic.6.c: "Until a Heir is Found, the regency council must rule"
 EDC_egypt_vic_age_of_egpyt: "Switches to the §YIndependant Victorian§! Focus Tree"
 EDC_egypt_the_new_paraoh: "Switches to the §YPharaonic Victorian§! Focus tree"
 EGY_vic_expand_military_training: "Expand Egyptian Military Training"
 EGY_vic_expand_military_training_desc: "In order to take our rightful place as an independent nation, our army must be well trained"
 EGY_vic_major_industry_investments: "Major Industrial Investments"
 EGY_vic_major_industry_investments_desc: "If Egypt is serious about industrialization, half measures will no longer suffice. Major state-backed investments can create the industrial base our ambitions demand."
