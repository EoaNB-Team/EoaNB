 # === Completed Ottoman-Egypt Focus Descriptions ===
 EGY_vic_rally_the_men_against_ETH_desc: "The Ethiopian state is the chief obstacle to our designs in the upper Nile. We will rally the army and public behind a campaign to break its resistance."
 EGY_vic_prepare_invasion_forces_desc: "A campaign into the Ethiopian highlands will be unlike warfare along the Nile. Supplies, routes, and invasion forces must be assembled before we commit ourselves."
 EGY_vic_declare_war_on_ETH_desc: "Preparations are complete. Egypt will settle its claims against [ETH.GetNameDef] by force of arms and seek mastery of the upper Nile."
 EGY_vic_rally_the_men_with_ETH_desc: "Conflict with Ethiopia is not inevitable. By presenting our peoples as partners against outside threats, we may turn a dangerous rival into a valuable ally."
 EGY_vic_send_envoy_to_ETH_desc: "Warm words must be followed by diplomacy. An Egyptian envoy will travel to the Ethiopian court with a formal proposal for closer relations."
 EGY_vic_ETH_investments_desc: "If our partnership with [ETH.GetNameDef] is to endure, it must rest on more than promises. Egyptian capital can help develop our ally while binding its economy more closely to ours."
 EGY_vic_remodel_the_customs_system_desc: "The existing customs regime limits trade and government revenue alike. A more coherent mercantilist system will better protect Egyptian commerce and strengthen the treasury."
 EGY_vic_establish_the_egyptian_post_office_desc: "A modern state cannot be governed at the speed of a caravan. A national postal service will connect Cairo with the provinces and allow orders, reports, and commerce to move more quickly."
 EGY_vic_admin_reforms_desc: "Egypt's expanding responsibilities have outgrown older administrative practices. The first round of reforms will clarify authority and make the government more effective."
 EGY_vic_continue_admin_reforms_desc: "The work of reform has only begun. Further standardization and professionalization will strengthen the state and reduce the disorder inherited from older institutions."
 EGY_vic_finish_admin_reforms_desc: "The final phase of administrative reform will turn a patchwork of offices into a more coherent Egyptian state apparatus capable of carrying out policy across the country."
 EGY_vic_import_european_tech_desc: "European industry and science are advancing rapidly. Purchasing machinery, books, and expertise from abroad will allow Egyptian researchers to close part of the technological gap."
 EGY_vic_expand_our_schooling_system_desc: "Egypt cannot modernize without educated officials, engineers, and officers. Expanding the school system will create the human foundation for further reform."
 EGY_vic_fund_a_national_research_group_desc: "Foreign expertise can only take us so far. A nationally funded research group will give Egyptian scholars the means to adapt new discoveries to our own needs."
 EGY_vic_administration_restructuring_desc: "As the state grows more complex, overlapping offices and antiquated procedures must be swept aside. A thorough restructuring will make the government more responsive and efficient."
 EGY_vic_reform_the_working_day_desc: "Modernization cannot rest indefinitely on arbitrary labour practices. Regulating the working day will improve conditions while giving employers clearer and more predictable standards."
 EGY_vic_under_the_cresant_desc: "Whatever autonomy Cairo enjoys, Egypt remains formally beneath the Ottoman crescent. Accepting that relationship may bring stability and favor from the Porte, but it also limits our freedom of action."
 EGY_vic_reforms_of_ahmad_desc: "Ahmad Rifaat's accession offers an opportunity to set a different course for the dynasty. His government can combine administrative modernization with a more cautious approach to Egypt's mounting ambitions."
 EGY_vic_found_fabric_mills_desc: "Exporting raw cotton leaves much of its value in foreign hands. Domestic fabric mills will allow Egyptian workers to process more of our own crop before it leaves the country."
 EGY_vic_telegraph_investment_desc: "The electrical telegraph can transmit orders and information across Egypt in hours rather than days. Initial investment will bring this new technology into government and commercial use."
 EGY_vic_army_expansion_desc: "Egypt's ambitions require a larger standing force. Expanding recruitment and support services will give the state the manpower needed to defend its frontiers and interests."
 EGY_vic_new_officer_corps_desc: "The army needs officers chosen for competence rather than custom alone. A renewed officer corps will improve command, planning, and professionalism throughout the ranks."
 EGY_vic_follow_ottoman_exsample_desc: "The Ottoman Army has undertaken its own program of modernization and remains culturally and politically close to Egypt. Its methods offer a natural model for our reforms."
 EGY_vic_follow_the_british_desc: "British military organization has proven effective across a global empire. Studying its doctrine and training methods may provide Egypt with a more modern alternative to Ottoman practice."
 EGY_vic_invest_in_artillary_designs_desc: "Modern artillery can decide battles before infantry ever closes with the enemy. Egyptian funds will be directed toward better guns, ammunition, and the knowledge needed to employ them."
 EGY_vic_purchase_british_arms_desc: "Britain's factories can supply rifles and equipment in quantities our own workshops cannot yet match. Purchasing British arms will accelerate the re-equipment of the Egyptian Army."
 EGY_vic_ENG_style_army_desc: "Adopting British drill, staff work, and planning methods will reshape the Egyptian Army into a more disciplined and cohesive force, even if the transition demands greater training."
 EGY_vic_obtain_rifles_desc: "The age of the smoothbore is ending. Acquiring modern rifles in quantity will give Egyptian infantry the range and accuracy required on a contemporary battlefield."
 EGY_vic_side_with_ottoman_training_desc: "Rather than imitate distant powers wholesale, we will deepen our reliance on Ottoman instructors and methods, adapting imperial military experience to Egyptian needs."
 EGY_vic_new_times_old_tactics_desc: "Not every traditional method has become obsolete. We will combine modern weapons with proven tactics suited to Egypt's terrain and military culture."
 EGY_vic_conscript_beduoins_desc: "The Bedouin tribes possess manpower and skills that the regular army has too often ignored. Bringing selected tribesmen into state service will strengthen our forces in the desert."
 EGY_vic_camel_cavalry_desc: "Camel-mounted troops are uniquely suited to patrol and fight across Egypt's arid frontiers. Formalizing such units will give the army speed and endurance where conventional cavalry struggles."
 EGY_vic_naval_rebuilding_desc: "Egypt once possessed one of the strongest fleets in the eastern Mediterranean. Rebuilding a capable navy will restore a measure of the maritime power lost since Muhammad Ali's era."
 EGY_vic_alexandrian_dockyards_desc: "Alexandria has the craftsmen, harbor, and strategic position to become the center of Egyptian naval construction. Expanding its dockyards is the first step toward a fleet of our own."
 EGY_vic_naval_reconstruction_desc: "Our dockyards and naval administration require a coordinated reconstruction program. Concentrated investment will improve the rate at which Egypt can build and repair warships."
 EGY_vic_modern_naval_designs_desc: "Steam power, armor, and new gunnery are changing war at sea. Egyptian naval architects must study these developments if our ships are not to be obsolete before they launch."
 EGY_vic_purchase_ironcads_desc: "Ironclad warships represent the new standard of naval power. Buying or licensing foreign designs will give Egypt the knowledge needed to enter the armored age."
 EGY_vic_western_naval_methods_desc: "Modern ships require modern doctrine. Western methods of gunnery, navigation, fleet organization, and engineering will be incorporated into the Egyptian Navy."

 # === Independent Egypt Focus Tree ===
 EGY_mac_take_dafur: "Conquer Darfur"
 EGY_mac_take_dafur_desc: "Darfur lies beyond the western reaches of our Sudanese possessions and remains outside Cairo's control. Bringing it into our sphere will secure the frontier and open the way toward a more coherent African empire."
 EGY_mac_control_blue_nile: "Control the Blue Nile"
 EGY_mac_control_blue_nile_desc: "Control of the Blue Nile is essential to Egypt's security and ambitions in the south. Claims along its course will prepare the ground for a decisive confrontation over the upper river."
 EGY_mac_strike_ETH: "Strike at [ETH.GetNameDef]"
 EGY_mac_strike_ETH_desc: "Our rivalry with [ETH.GetNameDef] can no longer be left unresolved. The army and public must be prepared for a campaign that will decide who dominates the upper Nile."
 EGY_mac_into_gondar: "Into Gondar"
 EGY_mac_into_gondar_desc: "A campaign limited to the frontier will not break Ethiopian resistance. We must carry the war into the highlands and threaten the historic heartland around Gondar."
 EGY_mac_recovering_from_failure: "Recovering from Failure"
 EGY_mac_recovering_from_failure_desc: "The Ethiopian campaign has exposed painful weaknesses in our army and policy. We must absorb the defeat, restore confidence, and ensure that Egypt is not crippled by one disastrous expedition."
 EGY_mac_fortify_blue_nile_source: "Fortify the Blue Nile Source"
 EGY_mac_fortify_blue_nile_source_desc: "Success in the south gives us a chance to make our gains permanent. Fortifications and garrisons near the Blue Nile's source will protect the position for which so much blood was spent."
 EGY_mac_faithful_lion: "The Faithful Lion"
 EGY_mac_faithful_lion_desc: "Egypt and Ethiopia need not remain enemies. Recognizing the Lion of Judah as a partner can form the basis of an African alignment strong enough to resist European encroachment."
 EGY_mac_ties_that_bind: "Ties That Bind"
 EGY_mac_ties_that_bind_desc: "Diplomatic friendship must be tied to common interests. Trade, military consultation, and political cooperation will make the Egyptian-Ethiopian relationship harder for outside powers to break."
 EGY_mac_investing_in_pact: "Investing in the Pact"
 EGY_mac_investing_in_pact_desc: "A durable pact requires material foundations. Joint investment will deepen economic links among its members and turn diplomatic promises into shared prosperity."
 EGY_mac_nile_railways: "Nile Railways"
 EGY_mac_nile_railways_desc: "Railways running along the Nile and toward our allies will carry troops and commerce faster than river traffic alone. The network will bind the pact together from north to south."
 EGY_mac_arsenal_of_the_pact: "Arsenal of the Pact"
 EGY_mac_arsenal_of_the_pact_desc: "Egypt possesses the largest industrial base among our partners. Expanding arms production will make Cairo the arsenal upon which the pact can rely in time of war."
 EGY_mac_securing_uganda: "Securing Uganda"
 EGY_mac_securing_uganda_desc: "The lands around the upper Nile and Great Lakes are increasingly coveted by foreign powers. Securing Uganda will deny rivals a foothold at the river's distant sources."
 EGY_mac_pushing_south: "Pushing South"
 EGY_mac_pushing_south_desc: "With our northern routes secured, Egyptian influence can press farther into equatorial Africa. Each expedition extends the frontier and places new territory beyond the reach of European adventurers."
 EGY_mac_fate_of_uganda: "The Fate of Uganda"
 EGY_mac_fate_of_uganda_desc: "Uganda cannot remain indefinitely under improvised military administration. We must decide whether its future lies in partnership, dominion, or direct colonial rule."
 EGY_mac_an_equal_member: "An Equal Member"
 EGY_mac_an_equal_member_desc: "A cooperative Uganda will be more stable than a resentful possession. Granting it an equal place within our African system can transform conquest into partnership."
 EGY_mac_new_ugandan_army: "A New Ugandan Army"
 EGY_mac_new_ugandan_army_desc: "Uganda must contribute to its own defense. Raising and training local forces will reduce the burden on Egyptian garrisons while giving the new administration a dependable army."
 EGY_mac_dominion_of_uganda: "Dominion of Uganda"
 EGY_mac_dominion_of_uganda_desc: "Uganda is strategically valuable but difficult to govern directly from Cairo. A subordinate dominion can manage local affairs while remaining firmly within Egypt's political and military orbit."
 EGY_mac_colonial_garrisons: "Colonial Garrisons"
 EGY_mac_colonial_garrisons_desc: "If Uganda is to remain a possession, Egyptian authority must be visible on the ground. Permanent colonial garrisons will secure roads, towns, and the approaches to the upper Nile."
 EGY_mac_UGA_estabilishing_industry: "Establish Ugandan Industry"
 EGY_mac_UGA_estabilishing_industry_desc: "Political control will mean little without economic development. Workshops, infrastructure, and local industry will make Uganda more productive and less dependent on distant supply lines."
 EGY_mac_lion_of_judah: "The Lion of Judah"
 EGY_mac_lion_of_judah_desc: "Ethiopia's independence and prestige make it the natural southern pillar of an African alliance. Closer cooperation with the Lion of Judah will strengthen both states against foreign pressure."
 EGY_mac_a_shared_research_clause: "A Shared Research Clause"
 EGY_mac_a_shared_research_clause_desc: "Our partners face many of the same technological challenges. A formal research clause will allow discoveries and expertise to circulate throughout the pact instead of being duplicated in isolation."
 EGY_mac_road_to_pharoh: "The Road to Pharaoh"
 EGY_mac_road_to_pharoh_desc: "Modern Egypt stands atop the remains of one of the world's oldest states. Invoking the pharaonic past may provide a national identity distinct from both Ottoman rule and European tutelage."
 EGY_mac_unearthing_past: "Unearthing the Past"
 EGY_mac_unearthing_past_desc: "Archaeology and historical scholarship are revealing an Egyptian civilization far older than the dynasties that now rule Cairo. The state can use this rediscovered past to shape a new national story."
 EGY_mac_modern_take: "A Modern Take"
 EGY_mac_modern_take_desc: "The pharaonic legacy need not mean a return to ancient government. We can reinterpret Egypt's past as the foundation of a modern, civic, and forward-looking national identity."
 EGY_mac_egpytian_representation: "Egyptian Representation"
 EGY_mac_egpytian_representation_desc: "A modern Egyptian nation requires institutions through which Egyptians themselves can speak. Broader representation will tie the language of ancient nationhood to contemporary political participation."
 EGY_mac_ancient_rites_future_paths: "Ancient Rites, Future Paths"
 EGY_mac_ancient_rites_future_paths_desc: "Ancient symbols can be adapted without abandoning the realities of the present. Ceremonies and state imagery will connect Egypt's remote past to its ambitions for the future."
 EGY_mac_into_past: "Into the Past"
 EGY_mac_into_past_desc: "Rather than merely borrow imagery from antiquity, we will elevate the pharaonic model as a guide for authority and national renewal. Egypt will look backward in order to move forward."
 EGY_mac_the_morning_and_evening_star: "The Morning and Evening Star"
 EGY_mac_the_morning_and_evening_star_desc: "The ruler will be presented as the guardian of Egypt from sunrise to sunset, drawing upon ancient concepts of sacred kingship to reinforce the legitimacy of the modern state."
 EGY_mac_a_paraohs_right: "A Pharaoh's Right"
 EGY_mac_a_paraohs_right_desc: "If Egypt is to revive the mantle of the Pharaohs, its ruler must possess the authority associated with that ancient office. Dynastic power will be recast as an expression of Egyptian continuity."
 EGY_mac_nubar_pasha_reforms: "Nubar Pasha's Reforms"
 EGY_mac_nubar_pasha_reforms_desc: "Nubar Pasha believes Egypt can strengthen itself through administrative and judicial reform rather than spectacle alone. His program will rationalize government and address the legal chaos surrounding foreign privileges."
 EGY_mac_language_of_courts: "Language of the Courts"
 EGY_mac_language_of_courts_desc: "Foreign communities and consular jurisdictions have created a confusing legal patchwork. Standardizing the language and procedure of the courts is a necessary first step toward a coherent judiciary."
 EGY_mac_reglement_d_organisation_judiciaire: "Reglement d'Organisation Judiciaire"
 EGY_mac_reglement_d_organisation_judiciaire_desc: "A formal judicial regulation will define the structure and competence of the new courts, replacing improvisation with a system that foreign powers and Egyptians alike can recognize."
 EGY_mac_found_mixed_courts: "Found the Mixed Courts"
 EGY_mac_found_mixed_courts_desc: "The Mixed Courts will hear disputes involving Egyptians and foreigners under a common legal framework. They cannot end every capitulatory privilege, but they can restore a measure of order and Egyptian authority."
 EGY_mac_road_to_consitiution: "The Road to a Constitution"
 EGY_mac_road_to_consitiution_desc: "Modern administration has concentrated enormous power in the Khedive's hands. A constitutional path offers a way to regularize government and give political institutions a firmer legal foundation."
 EGY_mac_ways_of_the_west: "Ways of the West"
 EGY_mac_ways_of_the_west_desc: "European constitutional practice offers models for limiting arbitrary government and organizing representation. Egypt can borrow from these institutions without surrendering its own identity."
 EGY_mac_slow_governmental_westerization: "Slow Governmental Westernization"
 EGY_mac_slow_governmental_westerization_desc: "Sudden political transformation would provoke both the palace and conservative society. A gradual westernization of ministries and procedure may achieve lasting reform with less resistance."
 EGY_mac_parliamentarism: "Parliamentarism"
 EGY_mac_parliamentarism_desc: "Representative institutions must become more than advisory decoration. Strengthening parliament will give organized political opinion a genuine role in the affairs of the state."
 EGY_mac_limit_power_constitution: "Limit Power Through a Constitution"
 EGY_mac_limit_power_constitution_desc: "A written constitution can define the rights of government and governed alike. By placing limits on personal rule, Egypt may build institutions strong enough to survive individual rulers."
 EGY_mac_ways_of_the_past: "Ways of the Past"
 EGY_mac_ways_of_the_past_desc: "Foreign political models are not the only path to stability. The dynasty can instead strengthen traditional authority and rule through institutions rooted in Egypt's own established order."
 EGY_mac_children_of_muhammad_ali: "Children of Muhammad Ali"
 EGY_mac_children_of_muhammad_ali_desc: "The descendants of Muhammad Ali built the modern Egyptian state through military strength and centralized rule. Reasserting that dynastic legacy will place the house itself at the center of national politics."
 EGY_mac_baring_report: "The Baring Report"
 EGY_mac_baring_report_desc: "Evelyn Baring and other foreign financial experts have produced a harsh assessment of Egypt's finances. Their conclusions will provide creditors with new arguments for intervention unless Cairo responds decisively."
 EGY_mac_responding_to_the_baring_report: "Responding to the Baring Report"
 EGY_mac_responding_to_the_baring_report_desc: "Ignoring foreign criticism will not make the debt disappear. We must answer the report with a program credible enough to reassure lenders without surrendering every lever of Egyptian policy."
 EGY_mac_enforced_liberalisation: "Enforced Liberalisation"
 EGY_mac_enforced_liberalisation_desc: "Creditors insist that freer trade and fiscal retrenchment are the price of renewed confidence. Implementing these demands may stabilize the books, but it will also deepen foreign influence over our economy."
 EGY_mac_convene_western_gov: "Convene a Western Government"
 EGY_mac_convene_western_gov_desc: "The pressure for reform has reached the cabinet itself. A government organized on Western administrative lines may satisfy foreign observers while giving Egypt a more regular machinery of state."
 EGY_mac_question_of_authority: "The Question of Authority"
 EGY_mac_question_of_authority_desc: "Reform has created competing centers of power among the Khedive, ministers, foreign controllers, and representative institutions. Egypt must decide where final authority is to reside."
 EGY_mac_governmental_compromise: "Governmental Compromise"
 EGY_mac_governmental_compromise_desc: "No faction is strong enough to govern alone without risking crisis. A compromise can preserve the dynasty while granting ministers and representatives a meaningful share in administration."
 EGY_mac_british_model: "The British Model"
 EGY_mac_british_model_desc: "Britain's constitutional system combines monarchy with powerful ministers and parliament. Adapting that balance to Egypt may offer an orderly alternative to both absolutism and revolution."
 EGY_mac_sideling_new_government: "Sideline the New Government"
 EGY_mac_sideling_new_government_desc: "The new institutions have become an obstacle to decisive rule. By sidelining them, the Khedive can restore personal authority before constitutional habits become too deeply entrenched."
 EGY_mac_debt_management: "Debt Management"
 EGY_mac_debt_management_desc: "Years of borrowing for war, prestige, and infrastructure have left Egypt dangerously exposed to foreign creditors. The debt must be managed before it becomes a weapon in European hands."
 EGY_mac_levy_more_taxes: "Levy More Taxes"
 EGY_mac_levy_more_taxes_desc: "The simplest way to meet our obligations is to raise more revenue at home. Additional taxation will anger property holders, but it may buy the treasury desperately needed time."
 EGY_mac_levy_greater_taxes: "Levy Greater Taxes"
 EGY_mac_levy_greater_taxes_desc: "Existing levies are still insufficient to satisfy creditors. A heavier round of taxation will squeeze the countryside and elites alike in the hope of preventing outright default."
 EGY_mac_tax_everything: "Tax Everything"
 EGY_mac_tax_everything_desc: "The treasury has exhausted moderate remedies. Every taxable source of wealth must contribute, even if the resulting burden threatens political stability and economic growth."
 EGY_mac_manage_the_debt_crisis: "Manage the Debt Crisis"
 EGY_mac_manage_the_debt_crisis_desc: "Rather than bleed the country through endless taxation, we will seek a structured solution to the debt crisis. Assets, revenues, and foreign negotiations must all be placed on the table."
 EGY_mac_sell_etreria: "Sell Eritrea"
 EGY_mac_sell_etreria_desc: "Our Red Sea possessions have strategic value, but distant territories are difficult to defend and expensive to administer. Selling Eritrean holdings could raise funds quickly at the cost of future influence."
 EGY_mac_sell_suez_shares: "Sell the Suez Shares"
 EGY_mac_sell_suez_shares_desc: "Egypt's shares in the Suez Canal are among the state's most valuable assets. Selling them would provide immediate cash for the treasury while surrendering part of our stake in the waterway we helped create."
 EGY_mac_founding_of_caisse_de_la_dette: "Found the Caisse de la Dette"
 EGY_mac_founding_of_caisse_de_la_dette_desc: "Foreign creditors demand guarantees that Egyptian revenues will service the public debt. The Caisse de la Dette will provide those guarantees, but at the price of a profound loss of fiscal sovereignty."
 EGY_mac_dealing_with_dual_control: "Dealing with Dual Control"
 EGY_mac_dealing_with_dual_control_desc: "British and French controllers now stand inside the machinery of Egyptian finance. We must decide how to work within this system, exploit rivalry between the powers, or prepare to resist their growing authority."
 EGY_mac_british_investments: "British Investments"
 EGY_mac_british_investments_desc: "British capital can keep factories, railways, and government projects moving when Egyptian funds are scarce. Accepting it will also give London another lever over our economy."
 EGY_mac_british_military_officers: "British Military Officers"
 EGY_mac_british_military_officers_desc: "British officers possess experience in organization, logistics, and colonial warfare. Inviting them into Egyptian service may improve the army while tying its development more closely to Britain."
 EGY_mac_british_processing_aid: "British Industrial Aid"
 EGY_mac_british_processing_aid_desc: "British machinery and technical assistance can expand the processing of Egyptian raw materials at home. The arrangement promises industrial growth, though foreign firms will expect favorable terms in return."
 EGY_mac_french_investments: "French Investments"
 EGY_mac_french_investments_desc: "French banks and companies remain deeply interested in Egypt, particularly after the Suez project. Their capital can balance British influence while financing further development."
 EGY_mac_french_military_officers: "French Military Officers"
 EGY_mac_french_military_officers_desc: "French military thought has long influenced Egypt's armed forces. Bringing French officers into our reform program will provide expertise while counterbalancing British advisers."
 EGY_mac_french_industrial_aid: "French Industrial Aid"
 EGY_mac_french_industrial_aid_desc: "French engineers and industrial firms can supply machinery, expertise, and credit for Egyptian development. Closer cooperation will strengthen industry and Paris's stake in our independence from British dominance."
 EGY_mac_dealing_with_army_backlash: "Dealing with Army Backlash"
 EGY_mac_dealing_with_army_backlash_desc: "Austerity, foreign officers, and political interference have stirred anger inside the Egyptian Army. The government must address the officers' grievances before military discontent becomes open rebellion."
 EGY_mac_question_of_urabi: "The Question of Urabi"
 EGY_mac_question_of_urabi_desc: "Ahmad Urabi has become the voice of officers and Egyptians who resent foreign control and Turco-Circassian privilege. Cairo must decide whether to accommodate his movement or break it before it grows stronger."
 EGY_mac_continue_industrialisation: "Continue Industrialisation"
 EGY_mac_continue_industrialisation_desc: "Debt and political turmoil must not bring Egypt's economic transformation to a halt. Continued investment in productive industry is essential if the country is ever to escape dependence on creditors."
 EGY_mac_encorage_more_industry: "Encourage More Industry"
 EGY_mac_encorage_more_industry_desc: "The state can create conditions in which more private workshops and factories become viable. Credit, infrastructure, and incentives will encourage a broader industrial sector."
 EGY_mac_canal_construction: "Develop the Canal Zone"
 EGY_mac_canal_construction_desc: "The completed Suez Canal has created an economic corridor of immense importance. Developing the canal zone, its ports, and supporting infrastructure will allow Egypt to capture more of the traffic it carries."
 EGY_mac_life_blood_nation: "Lifeblood of the Nation"
 EGY_mac_life_blood_nation_desc: "The Nile is not merely a river but the foundation of Egyptian life and state power. Investment in irrigation and river infrastructure will make its waters serve a growing population and economy."
 EGY_mac_a_navy_of_our_own: "A Navy of Our Own"
 EGY_mac_a_navy_of_our_own_desc: "A country controlling the approaches to the Suez Canal cannot rely forever on foreign fleets. Egypt must restore an independent naval force capable of protecting its coasts and commerce."
 EGY_mac_wooden_warships: "Wooden Warships"
 EGY_mac_wooden_warships_desc: "Modern iron ships are expensive and technically demanding. A renewed fleet of conventional wooden warships can be built sooner and in greater numbers with the resources already available to us."
 EGY_mac_outdated_but_cheap: "Outdated but Cheap"
 EGY_mac_outdated_but_cheap_desc: "Quantity and affordability may matter more than cutting-edge design for a country rebuilding its navy under financial strain. Proven older vessels can still patrol coasts and show the flag effectively."
 EGY_mac_sneak_ironclad_construction: "Secret Ironclad Construction"
 EGY_mac_sneak_ironclad_construction_desc: "Restrictions and foreign scrutiny make open armored construction difficult. A discreet program can nevertheless acquire the expertise and hulls needed to place Egypt among the ironclad powers."
 EGY_mac_comission_ibrahim: "Commission the Ibrahim"
 EGY_mac_comission_ibrahim_desc: "A major modern frigate will demonstrate that Egypt remains capable of maintaining serious naval power. Commissioning the Ibrahim will give the fleet a prestigious new centerpiece."
 EGY_mac_comission_lutfi_dejelil: "Commission the Lutfi Djelil"
 EGY_mac_comission_lutfi_dejelil_desc: "Armored vessels of the Lutfi Djelil type represent a more ambitious step into modern naval warfare. Bringing such a ship into Egyptian service will strengthen both the fleet and national prestige."
 EGY_mac_expand_the_order: "Expand the Order"
 EGY_mac_expand_the_order_desc: "New ships are useful only if the institutions behind them can sustain a fleet. Expanding naval organization, training, and procurement will turn individual vessels into lasting maritime power."
 EGY_mac_rethinking_our_army_standards: "Rethinking Our Army Standards"
 EGY_mac_rethinking_our_army_standards_desc: "Financial crisis and battlefield experience have exposed contradictions in the army. We must choose between a smaller affordable force and a more demanding program of professional standards."
 EGY_mac_army_reductions: "Army Reductions"
 EGY_mac_army_reductions_desc: "The treasury cannot support every regiment inherited from earlier ambitions. Reducing the army will ease the fiscal burden, even though it limits Egypt's ability to project force."
 EGY_mac_military_budget_cuts: "Military Budget Cuts"
 EGY_mac_military_budget_cuts_desc: "A smaller army should also cost less. Cutting the military budget will redirect scarce resources toward debt service and civil development at the price of slower rearmament."
 EGY_mac_greater_army_standards: "Greater Army Standards"
 EGY_mac_greater_army_standards_desc: "Egypt will answer weakness not by shrinking the army but by improving it. Higher standards of training, discipline, and equipment will create a force that is smaller in waste and greater in effectiveness."
 EGY_mac_increasing_artilery_investments: "Increasing Artillery Investments"
 EGY_mac_increasing_artilery_investments_desc: "Artillery remains one of the clearest measures of a modern army's striking power. Increased investment in guns and crews will ensure Egyptian forces are not outmatched in the next major war."

 # === Egypt Event Localisation ===
 afr_EGY_vic.2.t: "The Porte Demands We Halt the Expansion"
 afr_EGY_vic.2.d: "The Ottoman government has answered our military buildup with an ultimatum. Istanbul regards the growing Egyptian Army as a challenge to imperial authority and demands that we abandon the expansion or face the consequences."
 afr_EGY_vic.2.a: "Submit to the Sultan"
 afr_EGY_vic.2.b: "Refuse to Back Down"
 afr_EGY_vic.3.t: "Egypt Refuses to Back Down"
 afr_EGY_vic.3.d: "Cairo has rejected our demand to curb its military expansion. If we allow this defiance to pass unanswered, Ottoman authority in Egypt may become little more than a fiction."
 afr_EGY_vic.3.a: "Then War It Is"
 afr_EGY_vic.3.b: "We Cannot Risk a War"
 afr_EGY_vic.4.t: "Egypt Proposes an Alliance"
 afr_EGY_vic.4.d: "[FROM.GetNameDef] has approached us with an offer of alliance. Cairo argues that cooperation will strengthen both states against common rivals and the growing pressure of foreign powers."
 afr_EGY_vic.4.a: "Accept the Alliance"
 afr_EGY_vic.4.b: "Reject the Offer"
 afr_EGY_vic.5.t: "[FROM.GetNameDef] Rejects Our Offer"
 afr_EGY_vic.5.d: "Our diplomatic approach has been rebuffed. The refusal weakens hopes for a peaceful alignment and leaves us to decide whether the relationship should be abandoned or settled by other means."
 afr_EGY_vic.5.a: "Then We Will Settle This by Force"
 afr_EGY_vic.5.b: "We Can Do Without Them"
 afr_EGY_vic.7.t: "The Egyptian Succession Crisis"
 afr_EGY_vic.7.d: "The Egyptian throne has fallen vacant amid uncertainty over the succession. The Porte now has an opportunity to restore direct influence in Cairo, but recognizing a dynastic claimant may avoid a dangerous confrontation."
 afr_EGY_vic.7.a: "Install a Loyal Governor"
 afr_EGY_vic.7.b: "Recognize Isma'il Pasha"
 afr_EGY_vic.8.t: "Victory in Abyssinia"
 afr_EGY_vic.8.d: "Our campaign against [ETH.GetNameDef] has achieved its immediate objectives. With the enemy shaken, we must decide whether to secure limited gains or continue the war in pursuit of complete domination."
 afr_EGY_vic.8.a: "Take What We Came For"
 afr_EGY_vic.8.b: "Press On Until All Ethiopia Is Ours"
 afr_EGY_vic.9.t: "Disaster in Abyssinia"
 afr_EGY_vic.9.d: "The Ethiopian campaign has turned against us. Heavy losses, difficult terrain, and stubborn resistance have shattered expectations of an easy victory, leaving Cairo to choose between peace and a costly attempt to continue."
 afr_EGY_vic.9.a: "Make Peace While We Still Can"
 afr_EGY_vic.9.b: "This Is Only a Setback"
 afr_EGY_vic.11.t: "Egypt's Debt Crisis"
 afr_EGY_vic.11.d: "Egypt's debts have reached a point where British commercial and strategic interests are at risk. Intervention in Cairo's finances could protect our creditors and the route to India, but it would draw us directly into Egyptian affairs."
 afr_EGY_vic.11.a: "The Egyptian Question Cannot Be Ignored"
 afr_EGY_vic.12.t: "Foreign Controllers Arrive in Cairo"
 afr_EGY_vic.12.d: "Our creditors have moved from advice to direct supervision. British, and perhaps French, representatives now demand authority over Egyptian revenues and expenditures as the price of continued financial support."
 afr_EGY_vic.12.a: "We Have No Choice but to Accept"
 afr_EGY_vic.13.t: "Britain Invites Us to Intervene in Egypt"
 afr_EGY_vic.13.d: "Britain intends to impose tighter financial controls on Egypt and has invited France to participate. Joining London would protect French creditors and influence, but it would also bind us to a common policy in Cairo."
 afr_EGY_vic.13.a: "France Must Weigh Its Interests"
 afr_EGY_vic.14.t: "Egypt Submits to Financial Control"
 afr_EGY_vic.14.d: "The Egyptian government has accepted foreign supervision of its finances. This agreement protects British interests and gives us unprecedented influence over the administration of the Nile Valley."
 afr_EGY_vic.14.a: "Our Position on the Nile Is Secured"
 afr_EGY_vic.15.t: "The Dual Control"
 afr_EGY_vic.15.d: "British and French influence over Egyptian finances has been formalized into a system of Dual Control. Foreign controllers will oversee revenues and expenditure, greatly limiting the Khedive's freedom of action."
 afr_EGY_vic.15.a: "Our Finances Are No Longer Ours Alone"
 afr_EGY_vic.18.t: "A Journey Across the Nile"
 afr_EGY_vic.18.d: "The heir's train approaches the Nile crossing at Kafr el-Zayyat. The journey should be routine, yet the dynasty's future now travels with him across the river."
 afr_EGY_vic.18.a: "May the Journey Be Uneventful"
 afr_EGY_vic.25.t: "Britain Demands an End to Corvee Labour"
 afr_EGY_vic.25.d: "British diplomats have condemned the use of compulsory corvee labour on the Suez Canal works and demand that Cairo put an end to the practice. Compliance will slow construction and raise costs, but refusal risks a wider confrontation."
 afr_EGY_vic.25.a: "End the Corvee on the Canal"
 afr_EGY_vic.25.b: "Reject British Interference"
 afr_EGY_vic.32.t: "The Urabi Revolt"
 afr_EGY_vic.32.d: "Discontent within the army has merged with a broader movement against foreign control and Turco-Circassian privilege. Officers led by Ahmad Urabi now demand political change, and the authority of the Khedive is rapidly slipping away."
 afr_EGY_vic.32.a: "Allow Urabi to Take Control"
 afr_EGY_vic.32.b: "Crack Down on the Officers"

 # === Egypt Custom Tooltips ===
 ETH_EGY_no_Ties_trigger: "§Y[EGY.GetNameDef]§! and §Y[ETH.GetNameDef]§! do not have established ties."
 ETH_EGY_Rivalry_trigger: "§Y[EGY.GetNameDef]§! and §Y[ETH.GetNameDef]§! are rivals."
 ETH_EGY_no_Rivalry_trigger: "§Y[EGY.GetNameDef]§! and §Y[ETH.GetNameDef]§! are not rivals."
 ETH_EGY_alliance_trigger: "§Y[EGY.GetNameDef]§! and §Y[ETH.GetNameDef]§! have formed an alliance."
 afr_rrp_inspiration_to_africa: "Our reforms will serve as an example of §Ynon-colonial industrialisation§! in Africa."
 afr_gains_telegraphs_1: "Gain the §YElectrical Telegraph§! technology."
 FRA_help_ENG_attempt_seize_EGY: "France will join Britain in imposing financial control over Egypt."
 ENG_attempt_seize_EGY: "Britain will proceed with imposing financial control over Egypt without French assistance."

 # === Egypt National Spirit Descriptions ===
 egy_sudan_slave_raids_desc: "Raiding networks in Sudan bring manpower and profit to Egypt, but the human cost, unrest, and international condemnation steadily undermine the authority of the state."
 egy_naval_reconstruction_desc: "A concentrated naval reconstruction program is improving Egypt's dockyards and administrative capacity, allowing warships to be built and repaired more efficiently."
 EGY_bedouin_cavalry_desc: "Bedouin riders know the desert better than any conventional regiment. Organized as camel cavalry, they provide fast and effective forces for Egypt's arid frontiers."
 EGY_caisse_de_la_dette_desc: "Foreign creditors now supervise revenues pledged to service Egypt's public debt. The Caisse protects bondholders at the cost of fiscal freedom and grants Britain and France privileged access to Egyptian commerce."
 EGY_dual_control_desc: "British and French controllers have embedded themselves in Egyptian finance. Their oversight keeps the debt machinery functioning while diverting part of the country's productive capacity toward foreign interests."
 egy_ENG_style_army_desc: "British drill, staff methods, and planning are reshaping the Egyptian Army into a more coherent professional force, though the new system demands longer and more exacting training."
 EGY_independant_in_all_but_name_OTO_desc: "Egypt remains formally tied to the Ottoman Empire, but Cairo now exercises most of the powers of an independent state. Only a narrowing set of obligations still reveals the Sultan's suzerainty."
 EGY_independant_in_all_but_name_OTO_1_desc: "Further concessions from the Porte have reduced Ottoman influence over Egyptian affairs. The bond remains real, but it increasingly resembles tribute and ceremony rather than direct rule."
 EGY_independant_in_all_but_name_OTO_2_desc: "Ottoman authority in Egypt has become little more than a constitutional shadow. Cairo conducts almost all internal affairs independently while maintaining the final outward forms of allegiance."
 egy_vic_postal_service_desc: "A state-run postal network connects Cairo with the provinces, accelerating government correspondence, commercial information, and military planning across Egypt."
 egy_public_consered_debt_1_desc: "Public concern over Egypt's growing debt is becoming difficult to ignore. The burden is still manageable, but confidence in the government's finances has begun to weaken."
 egy_public_consered_debt_2_desc: "Borrowing and rising obligations are creating widespread anxiety. Rumors of new taxes and foreign interference are beginning to erode confidence in the government."
 egy_public_consered_debt_3_desc: "Egypt's debt has become a national political problem. Creditors demand guarantees while the public fears that the treasury is sacrificing the country's future to meet its obligations."
 egy_public_consered_debt_4_desc: "The financial crisis is destabilizing the state. Severe austerity, creditor pressure, and the prospect of foreign control are destroying confidence in the Khedive's administration."
 egy_public_consered_debt_5_desc: "Egypt stands on the edge of financial collapse. Public confidence has evaporated, military and political discontent is spreading, and foreign creditors are poised to dictate terms."
 egy_industry_cuts_desc: "Austerity has reached factories and development programs. Reduced investment is slowing production, limiting industrial efficiency, and making recovery from the debt crisis more difficult."
 EGY_overtaxed_landowners_desc: "Repeated emergency levies have pushed landowners beyond patience. Investment is drying up as rural elites resist a government they increasingly see as predatory."
 EGY_ENG_controlled_government_desc: "British financial and political influence now reaches deep into the Egyptian administration. London receives favorable access while Cairo sacrifices part of its political and commercial freedom."
 EGY_FRA_controlled_government_desc: "French creditors and officials exercise decisive influence over the Egyptian administration. Their support comes with commercial privileges and a continuing loss of fiscal sovereignty."
 EGY_ITA_controlled_government_desc: "Italian influence has become entrenched in Egyptian government and commerce. Foreign backing offers short-term stability while narrowing Cairo's ability to pursue an independent policy."
 EGY_government_for_egyptians_desc: "The administration has been reclaimed from foreign controllers and reorganized around Egyptian interests. Restored sovereignty is strengthening political confidence and public stability."

 # === Egypt Character Descriptions ===
 EGY_Muhammad_Sa_id_Pasha_desc: "Muhammad Sa'id Pasha, a son of Muhammad Ali, became Wali of Egypt in 1854. He showed a genuine concern for the welfare of the fellahin, curtailed some state monopolies, and supported the 1858 land law that strengthened private rights to agricultural land. His reign was also marked by strong French influence and the concession granted to Ferdinand de Lesseps that set construction of the Suez Canal in motion. His reforms promised a more open and modern Egypt, but they also drew the country more deeply into European finance and diplomacy."
 EGY_Ahmad_Rifaat_Pasha_desc: "Ahmad Rifaat Pasha, son of Ibrahim Pasha and nephew of Sa'id Pasha, stood as heir presumptive to Egypt under the seniority rules governing the Muhammad Ali dynasty. He served his uncle in high office, including as deputy ruler and as one of the first heads of Egypt's Interior Ministry. His position made him the expected successor to Sa'id, but his death in the 1858 Kafr el-Zayyat railway disaster would historically clear the way for his younger brother Isma'il."
 EGY_regency_council_desc: "Formed amid uncertainty over the succession, the Egyptian Regency Council is a temporary body of senior officials charged with preserving order and keeping the machinery of government functioning until a new ruler can be confirmed. Its authority rests on necessity rather than dynastic legitimacy, leaving Cairo's court, the Muhammad Ali family, and the Ottoman Porte to struggle over the shape of the next reign."
 EGY_Ismail_Pasha_desc: "Isma'il Pasha, son of Ibrahim Pasha and grandson of Muhammad Ali, came to power determined to transform Egypt into a modern state. His reign saw rapid expansion of railways, telegraphs, irrigation works, schools, administrative institutions, and the completion of the Suez Canal. Successive firmans from Constantinople increased Egypt's autonomy and eventually granted him the title of Khedive. Yet the extraordinary cost of his ambitions was financed through heavy borrowing, leaving Egypt increasingly vulnerable to European creditors and intervention."
 EGY_Abdulkerim_Nadir_Pasha_desc: "Abdülkerim Nadir Pasha is a veteran Ottoman commander shaped by the Tanzimat-era military establishment. Educated in Istanbul and Vienna, he rose through staff, field, and administrative commands to become one of the Porte's senior soldiers. Placing him at the head of Egypt would strengthen the Sultan's influence and impose a disciplined imperial hand on Cairo, but his authority would depend far more on Ottoman backing than on Egyptian dynastic legitimacy."
 EGY_Antoni_Aleksander_Ilinski_desc: "Antoni Aleksander Iliński, known in Ottoman service as Iskender Pasha, is a Polish-born soldier and former independence activist who converted to Islam and built a new career in the Ottoman Army. He distinguished himself as a daring cavalry commander during the Crimean War and later served in Baghdad. A celebrated war hero but an outsider to the Muhammad Ali dynasty, his elevation in Egypt would represent a dramatic break with the established order of succession."