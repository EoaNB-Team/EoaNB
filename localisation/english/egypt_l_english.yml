 afr_EGY_vic.16.t: "Lost our grip on Abyssinia"
 afr_EGY_vic.16.d: "Due to the recent loss of access to our Abyssinian vassals has caused them to no longer remain within our sphere"
 afr_EGY_vic.16.a: "there was nothing of worth there anyway"
 afr_EGY_vic.17.t: "Tragedy on the Nile"
 afr_EGY_vic.17.d: "Early today our Heir Ahmad Rifaat Pasha, was in a train being ferried across the Nile at Kafr el-Zayyat when the train car fell of the boat drowning the prince"
 afr_EGY_vic.17.a: "Announce Isma'il as our new heir"
 afr_EGY_vic.19.t: "Accident on the Nile"
 afr_EGY_vic.19.d: "Early today our Heir Ahmad Rifaat Pasha, was in a train being ferried across the Nile at Kafr el-Zayyat when the train car fell of the boat, due to the swift actions of the Prince and the quick reactions of the Ferryman, The Prince managed to escape the Carriage before the Nile claimed it"
 afr_EGY_vic.19.a: "A close Call"
 afr_EGY_vic.20.t: "The Grand Opening of the Suez Canal"
 afr_EGY_vic.20.1.desc: "For the last decade, the French company 'Compagnie Universelle du Canal Maritime de Suez', in collaboration with the Egyptian government, has been building the Suez Canal, a new gateway to the riches of the East. Today signals the grand opening of the Suez Canal with the French Ship L'Aigle completing the first voyage through the various lakes and man made passages that make up the full canal system that connects the Mediterranean Sea with Red Sea. Truly a groundbreaking project and a testament to the virtues of mankind!"
 afr_EGY_vic.20.2.desc: "For the last decade the Egyptian Government have been slaving away building the Suez Canal, a new gateway to the riches of the East based on the plans laid by the French company 'Compagnie Universelle du Canal Maritime de Suez'. Today signals the grand opening of the Suez Canal with Egyptian Ships completing the first voyage through the various lakes and man made passages that make up the full canal system that connects the Mediterranean Sea with Red Sea. Truly a groundbreaking project and a testament to the virtues of mankind!"
 afr_EGY_vic.20.3.desc: "For the last decade the French company 'Compagnie Universelle du Canal Maritime de Suez' in collaboration with the Egyptian Government and various other backers has been building the Suez Canal, a new gateway to the riches of the East. Today signals the grand opening of the Suez Canal with the French Ship L'Aigle supposedly completing the first journey through canal. However, the small [ENG.GetNameDef] vassal HMS Newport, benefitting from the problems of the larger vassels with the sporadically shallow water of the yet unfamiliar canal, was the first to actually fully navigate the network of man made passages and lakes that make up the full canal system that connects the Mediterranean Sea with Red Sea."
 afr_EGY_vic.20.a: "Truly a marvellous achievement!"
 afr_EGY_vic.20.b: "A new gateway to the East."
 afr_EGY_vic.20.c: "We should have been there..."
 afr_EGY_vic.20.e: "Impressive."
 afr_EGY_vic.20.f: "I guess we might be less irrelevant now?"
 afr_EGY_vic.21.t: "[From.GetName] is using forced labour to build the Suez"
 afr_EGY_vic.21.d: "It has come to our attention that Egypt is using forced labor to build the Suez Canal. This is no better than slavery, we should do something about it"
 afr_EGY_vic.21.a: "Put pressure on the [From.GetNameDef] Government"
 afr_EGY_vic.21.b: "Incite a Bedouin revolt"
 afr_EGY_vic.22.t: "Formation of the Compagnie Universelle du Canal Maritime de Suez"
 afr_EGY_vic.22.d: "After securing enough capital and the necessary permissions, the Compagnie Universelle du Canal Maritime de Suez has been formed. Backed by various French businesses and the Egyptian Grand Vizier as well as private individuals from the [OTO.GetName], the company is going to lead and supervise the construction of the Suez Canal. Construction is scheduled to start in spring next year."
 afr_EGY_vic.22.a: "Alright, let's get started then."
 afr_EGY_vic.23.t: "Suez Canal Construction to Start in Spring"
 afr_EGY_vic.23.d: "After many negotiations and a lot of preparation, the French are now ready to begin the construction of the Suez Canal. Construction is set to start in spring next year."
 afr_EGY_vic.23.a: "Great!"
 afr_EGY_vic.24.t: "France Offers Shares in the Suez Canal Project"
 afr_EGY_vic.24.d: "After obtaining a concession from Sa'id Pasha, the Khedive of Egypt and Sudan, that would allow the construction of a canal across the Egyptian desert connecting the Mediterranean Sea with the Red Sea, former French diplomat Ferdinand de Lesseps successfully managed to secure the initial funding for the giant project. The Compagnie Universelle du Canal Maritime de Suez, a French business  better known as the Suez Canal Company, has been set up to oversee the construction process and will be allowed to operate the canal for 99 years from its opening.\n\nThey have sent out offers to other European powers to participate in the project by obtaining shares in the company and fund the construction. This might be a welcome opportunity for international investment and influence. Should we buy some shares in the company?"
 afr_EGY_vic.24.a: "Buy the offered shares."
 afr_EGY_vic.24.b: "Let others bear the costs."
 afr_EGY_vic.26.t: "[EGY.GetName] offers shares in the Suez"
 afr_EGY_vic.26.d: "Our Ally [EGY.GetNameDef] has offered us shares in the construction of the Suez Canal. Which if finished, would give us influence over one of the most strategic trade lanes in the world"
 afr_EGY_vic.26.a: "Invest"
 afr_EGY_vic.26.b: "We cannot afford to"
 afr_EGY_vic.27.t: "The Colony of Equatoria"
 afr_EGY_vic.27.d: "Equatoria, a colony built by British explorers that we had commissioned. It is now no longer isolated from our government control of Sudan and we can now integrate it into our nation"
 afr_EGY_vic.27.a: "Fully Annex them"
