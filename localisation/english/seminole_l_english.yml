SEM_idea_the_unconquered_seminoles: "The Unconquered Seminoles"
SEM_idea_the_unconquered_seminoles_desc: "Despite years of war, broken promises, and immense pressure from the United States, our people have refused to be fully removed. Small bands remain hidden in the heart of the Everglades and Big Cypress Swamp. The white man has grown weary and withdrawn his soldiers from the deepest wetlands. We have not won the war in the way of the white man, but we have kept our home. Florida is still Seminole land.\n\n“They could not take us all. The swamps are still ours.” - Holata Micco"


