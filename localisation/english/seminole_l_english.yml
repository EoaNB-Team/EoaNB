### Dynamic Modifiers ###
dynmod_SEM_seminole_swamp_mire: "Seminole Swamp Mire"

### Events ###
seminole.1.t: "Contact with the Coastal Traders"
seminole.1.d: "We moved quiet through the tangled waterways back from the Gulf shore. Boatmen from Cuba and the Bahamas met us there under darkness. They know the currents and the sandbars. They brought strong blades for tools and fighting, hooks for fish, powder that explodes, and new guns. We gave them deer pelts, alligator hides, and egret feathers we gathered when the tide was right.\n\nWe slipped back through the soaked trails, past the river guards and coast watchers without a sound. The rifles and powder bring hope to our people. Young men take the guns with fresh rounds because silence will not save us when the soldiers come again. Women plant coontie and other roots in secret spots under the cypress.\n\nThe risk is high. The white soldiers watch the rivers more closely now. Getting caught could mean quick death or chains. Still, the sea gives us another way to keep fighting. As long as we can trade, we can hold on in these swamps that are our home."
seminole.1.a: "The traders have come again."
seminole.2.t: "Ambush at the Mangrove Inlet"
seminole.2.d: "We sent a party of our fighters through the secret water paths to meet the traders from Cuba and the Bahamas. They carried deer hides, egret feathers, and whatever else we could gather. They were to bring back metal blades, gunpowder, bullets, and maybe new guns.\n\nThey have not returned.\n\nScouts went later and found the signs at a mangrove inlet. Bullet shells lay thick on the ground. Red blood stained the wet sand. Paddles were broken. The white soldiers must have waited for them there. Our men fought hard, but none came back alive. The powder and guns we needed sank with them.\n\nThis loss cuts deep. Every man we lose makes our circle smaller. The American eyes along the coast never sleep now. When our powder runs low and our blades grow dull, fighting becomes harder.\n\nDo we risk more lives when the next moon is right, or do we pull back deeper into the dark swamps where the water hides us? The sea once gave us hope. Now it brings only grief and silence."
seminole.2.a: "Our warriors will not return."
seminole.3.t: "The Western Delegation Brings Terms"
seminole.3.d: "That cold morning the men from the western country came. Chief John Jumper and Halleck Tustenuggee walked with the white agent watching them. They sat with us at the council fire.\n\nThe white men offer much silver if we go west. Seven thousand five hundred dollars to Holata Micco. One thousand to each of four headmen. Five hundred to every fighting man. One hundred to the women and children. They say safe travel and no soldiers after we leave Florida.\n\nSome of our people are tired now. The soldiers burn our villages again and again. They destroy the corn every season. Hunger grows worse for the women and children. Going west might bring food and safety at last.\n\nBut Abiaka speaks strong against it. This is the land of our fathers and grandfathers. If we leave these swamps and hammocks we lose who we are. The white man may grow tired of losing men and silver chasing us through the sawgrass.\n\nThe chiefs must choose soon. One path takes our families far away on their ships. The other keeps us here with the waters and earth of our grandfathers. Our children and grandchildren will remember the choice."
seminole.3.a: "We will accept the white man's offer and go to the western land."
seminole.3.b: "We will not sell our homes or leave this land. We will stay and fight as our fathers did."
seminole.4.t: "The Second Offer from the Americans"
seminole.4.d: "The fight still goes on. After we said no at Fort Myers, the white scouts keep circling and their ships watch the shore. Food is harder to find every week. Our hidden patches grow smaller and the people grow tired crossing the wet ground.\n\nRiders brought new word. The United States makes another offer. Ten thousand dollars to Billy Bowlegs. Fifteen hundred to each of the four headmen. Seven hundred fifty to each warrior. One hundred fifty to the women and children. They promise faster boats, more food on the journey, and say no soldiers will come into the swamps after we leave.\n\nSome elders say we should take it. The young ones are hungry and coughing in the cold nights. Taking the silver would bring food and safety for our children at last.\n\nOthers stand strong against it. This is the land of our grandfathers. The bones of our people are buried here. If we take their money and leave these swamps we lose more than ground. We lose who we are. The white man may yet grow tired of chasing us through the sawgrass.\n\nThe council must decide soon. Take the silver and walk away to the west, or say no again and hold this ground where our ancestors lived. Our children will remember the choice we make."
seminole.4.a: "We will take the new offer and go west."
seminole.4.b: "We will not sell our land or our freedom."
seminole.5.t: "The Final Offer from the Americans"
seminole.5.d: "Hunger walks beside us every day. The fighting burned our fields and drove the deer far. Meals grow smaller with every moon. The sea road brings fear. The Americans watch the coast and the paths to Cuba more closely. Strength leaves the young men who still fight. The little ones cry at night with tight bellies, and even the old ones who once spoke strong now sit quiet, worn like old stone.\n\nTravelers reached our hidden camps. The white officials sent what they call their last offer. Twelve thousand and five hundred dollars to Billy Bowlegs. Two thousand to each of the four headmen. One thousand to each warrior. Two hundred to the women and children. They promise food for the journey west, and the quiet word that small bands who stay might be left alone in the deep marshes and tree islands the soldiers cannot reach.\n\nSome elders say take it. Peace might keep our families alive and let the children grow. Others hold to Abiaka's words and say accepting would betray the bones of our fathers and the land that carries our names and songs. One road gives silver and full bellies but leaves the ground we have known. The other keeps the land but brings more hunger, more graves, and thinner ranks with each season.\n\nThe council must choose. The white men wait. Take their offer and walk away, or say no and hold this ground for the generations still to come. The decision rests here with us."
seminole.5.a: "We will take this last offer and go west."
seminole.5.b: "We will not sell our land or our freedom."
seminole.6.t: "Armistice Negotiations"
seminole.6.d: "The long fighting has cost the white soldiers more than they wish to pay. Hunger still walks with us, but their big raids have grown fewer. Messengers came with new words from the Americans. They say they will stop chasing us deep into the Big Cypress and the Everglades. They will no longer burn every hidden patch or hunt us far into the wet places. Small bands like ours may stay in the remote marshes and tree islands if we do not attack their settlements.\n\nNo paper with many promises was signed. No big removal is demanded now. They grow tired of spending so much silver and losing so many men in these swamps.\n\nSome of our people say this is a kind of victory. We keep our ground. Not all of it, but enough for our families to live quietly. Others warn it is only a pause. The soldiers may come again when they are stronger.\n\nFor now the guns are quiet and the children can sleep without fear of sudden shouts in the night. We watch the trails closely. The land that holds our fathers' bones is still beneath our feet. That is what matters most."
seminole.6.a: "An end, of sorts, has been reached."

### Ideas ###
SEM_idea_the_fight_to_remain: "The Fight to Remain"
SEM_idea_the_fight_to_remain_desc: "The white soldiers press deeper into our lands in the Big Cypress and Everglades, using boat patrols and raids to burn our hidden villages, destroy our corn, rice, pumpkins, and fields, and capture our people. Our small bands under Holata Micco evade their columns with guerrilla tactics, striking from the swamps and vanishing before they can bring their full strength to bear, but the constant pursuit and destruction of our provisions bring growing hardship and hunger to warriors and families alike.\n\n“Am I an African, a slave? I am an Indian. The white man shall not make me black. I will make the white man red with blood, and then blacken him in the sun and rain, where the wolf shall smell his bones and the vulture live upon his flesh.” - Holata Micco"
SEM_idea_the_fight_to_remain_2: "The Fight to Remain"
SEM_idea_the_fight_to_remain_2_desc: "The white soldiers press deeper into our lands in the Big Cypress and Everglades, using boat patrols and raids to burn our hidden villages, destroy our corn, rice, pumpkins, and fields, and capture our people. Our small bands under Holata Micco evade their columns with guerrilla tactics, striking from the swamps and vanishing before they can bring their full strength to bear, but the constant pursuit and destruction of our provisions bring growing hardship and hunger to warriors and families alike.\n\n“Am I an African, a slave? I am an Indian. The white man shall not make me black. I will make the white man red with blood, and then blacken him in the sun and rain, where the wolf shall smell his bones and the vulture live upon his flesh.” - Holata Micco"
SEM_idea_gulf_coast_contraband_trade: "Gulf Coast Contraband Trade"
SEM_idea_gulf_coast_contraband_trade_desc: "Cuban fishing boats and Bahamian trading sails quietly slip along the Gulf shore and up the winding bends of the Caloosahatchee River. In exchange for deer hides and egret feathers, they bring us precious powder, blades, and other scarce supplies. These hidden landings allow our scattered bands to replenish what the long war has taken from us and continue resisting the American advance.\n\n“The white man watches the rivers, but he cannot watch all the paths that bring us strength.” - Holata Micco"
SEM_idea_gulf_coast_contraband_trade_2: "Gulf Coast Contraband Trade"
SEM_idea_gulf_coast_contraband_trade_2_desc: "Cuban fishing boats and Bahamian trading sails quietly slip along the Gulf shore and up the winding bends of the Caloosahatchee River. In exchange for deer hides and egret feathers, they bring us precious powder, blades, and other scarce supplies. These hidden landings allow our scattered bands to replenish what the long war has taken from us and continue resisting the American advance.\n\n“The white man watches the rivers, but he cannot watch all the paths that bring us strength.” - Holata Micco"
SEM_idea_provisions_destroyed: "Provisions Destroyed"
SEM_idea_provisions_destroyed_desc: "American raiders have struck our hidden settlements west of the Okaloacoochee Swamp and south of Fort Doane, destroying forty dwellings filled with food stores of corn, rice, pumpkins, and tools. Our 40-acre vegetable fields near Royal Palm Hammock lie wasted, leaving our warriors and families hungry and fatigued amid the Big Cypress.\n\n“The only course was to track them to their fastnesses, burn their villages, destroy their crops, and reduce them by starvation.” - Harper's Weekly Magazine"
