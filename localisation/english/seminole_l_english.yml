SEM_idea_western_seminole_delegation: "Western Seminole Delegation"
SEM_idea_western_seminole_delegation_desc: "A delegation of about forty Seminoles and six Creeks from Indian Territory, led by Chief John Jumper and accompanied by Creek leader Halleck Tustenuggee, has arrived at Fort Brooke in Tampa. Sent by the federal government and Indian agents, they seek to persuade the remaining Florida Seminoles under Holata Micco to emigrate west voluntarily with promises of money, land, and safe passage. Their presence creates division among our bands—some see wisdom in ending the long struggle, while others remain defiant.\n\n“I have listened to the talk of my brothers from the west. But the white man has broken many promises before.” - Holata Micco"
SEM_idea_emigration_agreed: "Emigration Agreed"
SEM_idea_emigration_agreed_desc: "After tense negotiations near Fort Myers, Holata Micco and the main Seminole leaders have accepted the U.S. terms. Payment has been promised, safe passage offered, and the journey west to Indian Territory is now planned. While some families prepare to leave, doubt and sadness linger among the bands. The long struggle in the swamps appears to be ending, but the pain of leaving their homeland weighs heavily on those who will depart.\n\n“We have talked long. The white man offers money and peace. My people are tired. We will go west.” - Holata Micco"
SEM_idea_unyielding_defiance: "Unyielding Defiance"
SEM_idea_unyielding_defiance_desc: "Following the collapse of negotiations near Fort Myers, Holata Micco and the remaining Seminole leaders have firmly rejected the American offers of money and safe passage west. Their refusal has steeled the resolve of our scattered bands. Determined to remain on their ancestral lands, the warriors and families now draw strength from their defiance, relying on their deep knowledge of the Everglades and Big Cypress to continue evading U.S. forces.\n\n“The white man offers gold for our homeland. We have listened, but we will not sell the ground where our fathers are buried.” - Holata Micco"
SEM_idea_unyielding_defiance_2: "Unyielding Defiance"
SEM_idea_unyielding_defiance_2_desc: "Following the collapse of negotiations near Fort Myers, Holata Micco and the remaining Seminole leaders have firmly rejected the American offers of money and safe passage west. Their refusal has steeled the resolve of our scattered bands. Determined to remain on their ancestral lands, the warriors and families now draw strength from their defiance, relying on their deep knowledge of the Everglades and Big Cypress to continue evading U.S. forces.\n\n“The white man offers gold for our homeland. We have listened, but we will not sell the ground where our fathers are buried.” - Holata Micco"
SEM_idea_unyielding_defiance_3: "Unyielding Defiance"
SEM_idea_unyielding_defiance_3_desc: "Following the collapse of negotiations near Fort Myers, Holata Micco and the remaining Seminole leaders have firmly rejected the American offers of money and safe passage west. Their refusal has steeled the resolve of our scattered bands. Determined to remain on their ancestral lands, the warriors and families now draw strength from their defiance, relying on their deep knowledge of the Everglades and Big Cypress to continue evading U.S. forces.\n\n“The white man offers gold for our homeland. We have listened, but we will not sell the ground where our fathers are buried.” - Holata Micco"
SEM_idea_the_unconquered_seminoles: "The Unconquered Seminoles"
SEM_idea_the_unconquered_seminoles_desc: "Despite years of war, broken promises, and immense pressure from the United States, our people have refused to be fully removed. Small bands remain hidden in the heart of the Everglades and Big Cypress Swamp. The white man has grown weary and withdrawn his soldiers from the deepest wetlands. We have not won the war in the way of the white man, but we have kept our home. Florida is still Seminole land.\n\n“They could not take us all. The swamps are still ours.” - Holata Micco"