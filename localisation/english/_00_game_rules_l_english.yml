RULE_OPTION_ENG_SEPOY_WAR_OUTCOME_DEFAULT: "Default"
RULE_OPTION_ENG_SEPOY_WAR_OUTCOME_DEFAULT_DESC: "§LThe outcome will be decided on the battlefield, and influenced by historical focuses being on or off.§!"
RULE_OPTION_ENG_SEPOY_WAR_OUTCOME_BRITISH_VICTORY: "Historical / British Victory Ensured"
RULE_OPTION_ENG_SEPOY_WAR_OUTCOME_BRITISH_VICTORY_DESC: "§LBritain will crush the rebellion and restore order.§!"
RULE_OPTION_ENG_SEPOY_WAR_OUTCOME_SEPOY_VICTORY: "Sepoy Victory Ensured"
RULE_OPTION_ENG_SEPOY_WAR_OUTCOME_SEPOY_VICTORY_DESC: "§LThe Mutineers will expell the British out of India.§!"
