######## CUSTOM COUNTRY PATHS (By Maxty) ########

### EUROPE ###

RULE_GROUP_EOANB_RULES_EUROPE: "Country Paths - Europe"

## France

# Orsini Affair - Emperor's fate (Alive or Dead)

FRA_EMPEROR_FATE: "£GFX_EOANB_game_rule_flag_FRA   Orsini Affair - Emperor's Fate"
RULE_OPTION_FRA_EMPEROR_FATE_RANDOM: "Default"
RULE_OPTION_FRA_EMPEROR_FATE_RANDOM_DESC: "§LItalian nationalists, led by Felice Orsini, will try to assassinate Napoleon III by throwing bombs towards the Emperor's carriage. Whether the attempt is successful or not will be left to fate.§!"
RULE_OPTION_FRA_EMPEROR_FATE_ALIVE: "The Emperor survives"
RULE_OPTION_FRA_EMPEROR_FATE_ALIVE_DESC: "§LThe Orsini attempt will fail, leading to the continued rule of Napoleon III in France.§!"
RULE_OPTION_FRA_EMPEROR_FATE_DEAD: "The Emperor is murdered"
RULE_OPTION_FRA_EMPEROR_FATE_DEAD_DESC: "§LThe Orsini attempt will succeed, and the Emperor will perish after a bomb lands next to his carriage. With the French Empire in chaos, a temporary regency will be established and some liberal reforms implemented until a new leader is chosen.§!"

## Sardinia-Piedmont

# Risorgimento - Austro-Sardinian War - Russian Assistance

PIE_RISORGIMENTO_RUSSIA: "£GFX_EOANB_game_rule_flag_PIE   £GFX_EOANB_game_rule_flag_RUS   Russo-Sardinian Meeting"
RULE_OPTION_PIE_RISORGIMENTO_RUSSIA_RANDOM: "Default"
RULE_OPTION_PIE_RISORGIMENTO_RUSSIA_RANDOM_DESC: "§LSardinia-Piedmont's bid for the war against the Lombardo-Venetian Kingdom and Austria will involve asking Russia for assistance. The level of assistance that Russia provides, wether it is an alliance, assistance or just a guarantee of neutrality will be taken randomly or according to other settings.§!"
RULE_OPTION_PIE_RISORGIMENTO_RUSSIA_ALLIANCE: "Alliance for Galicia"
RULE_OPTION_PIE_RISORGIMENTO_RUSSIA_ALLIANCE_DESC: "§LThe upcoming war is seen as an opportunity to take Galicia from Austria, remedying the humilliation suffered during the Crimean War. Therefore, Russia will join the war on Sardinia-Piedmont's side, recognizing it as the rightful nation to unify Italy.\n\n§RRequires:§!\n§YSardinia-Piedmont is NOT already in an alliance with France.§!§!"
RULE_OPTION_PIE_RISORGIMENTO_RUSSIA_ASSISTANCE: "Russian Assistance"
RULE_OPTION_PIE_RISORGIMENTO_RUSSIA_ASSISTANCE_DESC: "§LThe upcoming conflict is seen as an opportunity to punish Austria for their betrayal in the Crimean War. The Russian Empire will limit its assistance to placing troops at the austrian border, distracting them during the Second Italian War of Independence.§!"
RULE_OPTION_PIE_RISORGIMENTO_RUSSIA_NEUTRALITY: "Russian Neutrality"
RULE_OPTION_PIE_RISORGIMENTO_RUSSIA_NEUTRALITY_DESC: "§LNot wanting to be involved in Italian affairs, Russia will give a guarantee of neutrality in the upcoming war and be done with it, refusing to give further assistance.\n\n§RRequires:§!\n§YSardinia-Piedmont is already in an alliance with France.§!"

## Kingdom of Two Sicilies

# House Divided - BoP after Ferdinando's death

NSC_HOUSE_DIVIDED: "£GFX_EOANB_game_rule_flag_NSC   Royal House Divided"
RULE_OPTION_NSC_HOUSE_DIVIDED_RANDOM: "Default"
RULE_OPTION_NSC_HOUSE_DIVIDED_RANDOM_DESC: "§LThe Kingdom of the Two Sicilies is at a crossroads. The current ruler, Ferdinand II, is gravely ill, and doctors speculate that his reign is nearing its end. His son, Prince Francesco, intends to continue his father's legacy by maintaining close ties with Austria. However, not everyone at court shares his vision.§!"
RULE_OPTION_NSC_HOUSE_DIVIDED_FRANCESCO_II: "Francesco II Secures Throne"
RULE_OPTION_NSC_HOUSE_DIVIDED_FRANCESCO_II_DESC: "§LDespite doubts about his youth and inexperience, Francesco II secures victory in the balance of power against Maria Theresia. Backed by loyalists and the Church, he carries the Bourbon banner forward, determined to preserve tradition and resist Austrian influence over the Kingdom of the Two Sicilies.§!"
RULE_OPTION_NSC_HOUSE_DIVIDED_A_NEW_REPUBLIC: "A New Republic Born!"
RULE_OPTION_NSC_HOUSE_DIVIDED_A_NEW_REPUBLIC_DESC: "§LThe people have long suffered under the authoritarian Bourbon monarchy, and they yearn for its end. They aspire to seize the nation's future and shape the destiny of the region together.§!"
RULE_OPTION_NSC_HOUSE_DIVIDED_MARIA_TERESAS_COUP: "Maria Teresa's Coup"
RULE_OPTION_NSC_HOUSE_DIVIDED_MARIA_TERESAS_COUP_DESC: "§LWith growing support among aristocrats and nationalists, Maria Theresia triumphs in the balance of power against Francesco II. Seen as a stronger and more independent leader, she promises to steer the Kingdom toward progress, loosen Austria's grip, and shape a new future for Italy.§!"

## Kingdom of Württemberg

# Status of Liberalism (Integrated or Suppressed)

WUR_LIBERALISM_STATUS: "£GFX_EOANB_game_rule_flag_WUR   Status of Liberalism in Württemberg"
RULE_OPTION_WUR_LIBERALISM_STATUS_RANDOM: "Default"
RULE_OPTION_WUR_LIBERALISM_STATUS_RANDOM_DESC: "§LThe Kingdom of Württemberg will have to make a choice between integrating and suppressing liberalism. This choice will be taken randomly.§!"
RULE_OPTION_WUR_LIBERALISM_STATUS_SUPPRESS: "Suppress Liberalism"
RULE_OPTION_WUR_LIBERALISM_STATUS_SUPPRESS_DESC: "§LRefusing to allow its continued growth, King Wilhelm will focus on suppressing liberal movements in the country.§!"
RULE_OPTION_WUR_LIBERALISM_STATUS_INTEGRATE: "Integrate Liberalism"
RULE_OPTION_WUR_LIBERALISM_STATUS_INTEGRATE_DESC: "§LAfter careful consideration, King Wilhelm will decide to integrate liberalism in the kingdom.§!"

## Prussia

# Political Path

PRS_IDEOLOGICAL_PATH: "£GFX_EOANB_game_rule_flag_PRS   Prussia at a Crossroads"
RULE_OPTION_PRS_IDEOLOGICAL_PATH_DEFAULT: "Default"
RULE_OPTION_PRS_IDEOLOGICAL_PATH_DEFAULT_DESC: "§LDuring the constitutional crisis, King Wilhelm I finds himself at a crossroads. Will he decide to fight the rebellious majority in parliament with the help of a strong-willed politician who does not shy away from escalating the conflict, or will he abdicate in favor of his son Friedrich who, married to the daughter of Queen Victoria, seems much more open to liberal ideas like constitutionalism and the rule of law?§!"
RULE_OPTION_PRS_IDEOLOGICAL_PATH_BISMARCK: "Konfliktminister Bismarck"
RULE_OPTION_PRS_IDEOLOGICAL_PATH_BISMARCK_DESC: "§LKing Wilhelm recognizes that only one man can solve the conflict with parliament in his sense, the ultra-conservative Prussian squire Otto von Bismarck. Although this move may seem understandable on the part of the King in this situation, the further escalation of the constitutional conflict poses numerous risks to internal stability and, ultimately, to the King's legitimacy in Prussia.§!"
RULE_OPTION_PRS_IDEOLOGICAL_PATH_LIBERAL: "The King's Abdication"
RULE_OPTION_PRS_IDEOLOGICAL_PATH_LIBERAL_DESC: "§LThe rise of political liberalism and the chaos caused by the constitutional crisis drive King Wilhelm to despair. Realising that he will no longer be able to rule as he sees fit, he promptly abdicates in favor of his liberal-minded son Friedrich, who ascends the Prussian throne as Friedrich III.§!"

