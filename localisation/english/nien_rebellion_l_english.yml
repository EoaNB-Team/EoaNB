############### DECISIONS ###############

 NIE_decision_raise_the_yellow_banner: "Raise the Yellow Banner"
 NIE_decision_raise_the_yellow_banner_desc: "Zhang Lexing's own banner. Call up the families of the Yellow Banner and put them in the field."
 NIE_decision_raise_the_blue_banner: "Raise the Blue Banner"
 NIE_decision_raise_the_blue_banner_desc: "Call up the families of the Blue Banner and put them in the field."
 NIE_decision_raise_the_white_banner: "Raise the White Banner"
 NIE_decision_raise_the_white_banner_desc: "Call up the families of the White Banner and put them in the field."
 NIE_decision_raise_the_red_banner: "Raise the Red Banner"
 NIE_decision_raise_the_red_banner_desc: "Call up the families of the Red Banner and put them in the field."
 NIE_decision_raise_the_black_banner: "Raise the Black Banner"
 NIE_decision_raise_the_black_banner_desc: "Call up the families of the Black Banner and put them in the field."
 NIE_decision_the_mourners_disguise: "The Mourner's Disguise"
 NIE_decision_the_mourners_disguise_desc: "Dress our soldiers as mourners and hide their uniforms in empty coffins. The Imperial columns will let a funeral procession pass, and a wailed rumour of plague will keep them from looking too closely."
 NIE_decision_the_three_column_offensive: "The Three Column Offensive"
 NIE_decision_the_three_column_offensive_desc: "Divide the army into three columns in the manner of Sunzi: one to fix the enemy, two to envelop him."
 NIE_decision_mount_the_infantry: "Mount the Infantry"
 NIE_decision_mount_the_infantry_desc: "Following Taiping practice, convert whole bodies of foot soldiers into mounted raiders."
 NIE_decision_ambush_government_convoys: "Ambush Government Convoys"
 NIE_decision_ambush_government_convoys_desc: "Our agents inside the Green Standard Army will tell us exactly where the next payroll and powder convoy passes."
 NIE_decision_recruit_neutral_militia_bands: "Recruit Neutral Militia Bands"
 NIE_decision_recruit_neutral_militia_bands_desc: "Negotiate with the leaders of the independent local defence forces and bring their arms and men under the Nian banners."
 NIE_decision_desperate_equipment_raids: "Desperate Equipment Raids"
 NIE_decision_desperate_equipment_raids_desc: "Throw men at the enemy's depots and take their rifles by hand. It will cost us dearly."
 NIE_decision_establish_a_tang_lodge: "Establish a Tang Lodge"
 NIE_decision_establish_a_tang_lodge_desc: "Open a secret meeting hall in this province. Its members will report on every Imperial movement without a single one of our agents being placed at risk."
 NIE_decision_lightning_raid_infrastructure: "Lightning Raid: Roads and Bridges"
 NIE_decision_lightning_raid_infrastructure_desc: "Strike at the weakest Imperial detachments and tear up the roads behind them."
 NIE_decision_lightning_raid_supply_hub: "Lightning Raid: Supply Depots"
 NIE_decision_lightning_raid_supply_hub_desc: "Burn the Imperial depots and sabotage the railways feeding this province."
 NIE_decision_incite_local_uprising: "Incite a Local Uprising"
 NIE_decision_incite_local_uprising_desc: "Send lodge masters and militia chiefs into this province to raise the peasantry against the Manchus."
 NIE_decision_smugglers_at_lao_shan_kou: "Smugglers at Lao-shan-k'ou"
 NIE_decision_smugglers_at_lao_shan_kou_desc: "Meet the foreigners at Lao-shan-k'ou near Chefoo and pay them to buy modern arms on our behalf."
 NIE_decision_purchase_european_artillery: "Purchase European Artillery"
 NIE_decision_purchase_european_artillery_desc: "Pay cash to European traders for a recurring off-map shipment of modern artillery and equipment."
 NIE_decision_rally_taiping_remnants: "Rally the Taiping Remnants"
