############### EVENTS ###############

 nian.1.t: "Rebellious Forces"
 nian.1.d: "Our bands answer to their own chiefs and fight where they please. The Zhiheji alliance gave us a name; it did not give us an army. If the Nian are to face the Imperial columns in the open field, our chiefs must accept a single command, our banners must know their order of battle, and our raiders must learn to fight as soldiers as well as bandits."
 nian.1.a: "Let the chiefs assemble."

 nian.3.t: "Chen Bagu's Vanguard"
 nian.3.d: "Chen Bagu has arrived in camp at the head of several hundred women, armed and mounted. She asks for no place at the council and no share of the plunder - only for a banner of her own and a place in the vanguard. The older chiefs mutter, but nobody who has seen her ride is willing to say no to her face."
 nian.3.a: "Give her the vanguard."

 nian.4.t: "The Fake Plague"
 nian.4.d: "A column of Imperial troops is on the road ahead. Our men strip off their uniforms, bundle them into an empty black coffin, dress themselves in mourning white, and walk directly past the Manchu vanguard wailing about a pestilence that has carried off half their village. The soldiers cover their faces and let the funeral pass. By nightfall the rumour of plague has emptied three villages behind the Imperial lines."
 nian.4.a: "Let the dead do our marching."

 nian.6.t: "Studying the Art of War"
 nian.6.d: "Gong Deshu has read the old texts aloud to the assembled chiefs, and for once they listened. The Nian Army will fight in three columns: the centre will close and hold, and the two wings will ride around the flanks and fall upon the enemy's rear. It is two thousand years old and it will still work on the North China plain."
 nian.6.a: "The centre holds, the wings envelop."

 nian.7.t: "Unearthed Jesuit Cannons"
 nian.7.d: "Buried in the earth outside Chih-ho, our diggers have found the guns the Jesuits cast for the Ming two centuries ago. Some of them weigh more than five thousand pounds and take a dozen oxen to move. They will never keep pace with our cavalry - but they will never have to. Emplaced behind the walls of our headquarters, they will make Chih-ho a fortress."
 nian.7.a: "Mount them on the walls."

 nian.9.t: "The Weapon Shortage"
 nian.9.d: "Years of war have stripped our arsenals bare. There is no powder to be had at any price, and the heavy guns we do possess slow the columns to a crawl. Some of the chiefs propose to arm the new levies with swords, spears and bamboo cut along our own line of march. Others want to take what we need at the point of a bayonet from the Imperial depots."
 nian.9.a: "Cut bamboo along the roads."
 nian.9.b: "Take what we need from the enemy."

 nian.10.t: "The Taiping Alliance Formalized"
 nian.10.d: "The agreement with the Heavenly Kingdom is signed. Taiping officers now drill our columns in their own methods, and the most striking of their proposals is also the simplest: put the infantry on horses. Whole bodies of footmen are to be remounted as raiders, trading their staying power for the speed that has always been our greatest weapon."
 nian.10.a: "Mount them all."

 nian.12.t: "Victory at Gaolouzhai"
 nian.12.d: "Sengge Rinchen has been drawn out of his fortifications at last. Our horsemen led his cavalry a chase across the whole of the district before turning at Gaolouzhai, and in the confusion of the night the Mongol prince was cut down in a ditch by a common soldier who did not know who he was killing. The road south is open, and the Qing have lost their finest field commander."
 nian.12.a: "The prince is dead."

 nian.13.t: "The Mongol Escapes Us"
 nian.13.d: "Sengge Rinchen has withdrawn behind the walls before our columns could close on him. Our men have ridden themselves and their horses to exhaustion for nothing, and the Imperial court will make much of the fact that the Mongol prince still lives."
 nian.13.a: "He will not escape us twice."

 nian.14.t: "Modern Firepower Achieved"
 nian.14.d: "The shipments from the coast have arrived: explosive-shell guns and heavy pieces of European manufacture, with powder and shot to match. Our riders have taken to them with astonishing speed, handling the foreign firearms from the saddle as though they had been born to it."
 nian.14.a: "Now let the Manchus stand before us."

 nian.15.t: "The 90,000 March on Beijing"
 nian.15.d: "Lai Wenguang commands ninety thousand horsemen, the largest force the Nian have ever put in the field. The plan is as simple as it is audacious: ride north, surround the capital of the Manchus, and end the dynasty in a single stroke. Our chiefs are entirely confident. Our quartermasters are not."
 nian.15.a: "Ride for Beijing."

 nian.16.t: "The Fall of the Qing"
 nian.16.d: "The gates of Beijing have been forced. The court has fled north in disorder, abandoning the seals and the treasury, and the Green Standard garrisons of the northern provinces have simply dissolved. Two hundred years of Manchu rule have ended in a single autumn."
 nian.16.a: "The Mandate has passed."

 nian.17.t: "The Exhausted Retreat"
 nian.17.d: "The siege has failed. Our horsemen could not force the walls and could not feed themselves outside them, and the Huai Army is now closing from the south. The columns are streaming away from the capital, leaderless and starving, abandoning guns and wounded along the road."
 nian.17.a: "Save what can be saved."

 nian.18.t: "Ninety Thousand Ride on Peking"
 nian.18.d: "Reports from the treaty ports describe an enormous host of Nian cavalry moving north across the plain toward the Imperial capital. The legations are alarmed; the Qing court is said to be in a state of open panic."
 nian.18.a: "The dynasty totters."

 nian.19.t: "The Court in Flight"
 nian.19.d: "The capital has fallen to the rebels. The court has fled, the seals are lost, and the northern garrisons have melted away. Whatever remains of the dynasty must now be rebuilt from nothing."
 nian.19.a: "All is lost."

 nian.20.t: "The Nian Seek Our Hand"
 nian.20.d: "Envoys from the Nian bands of the northern plain have arrived. They propose a formal brotherhood: their cavalry for our discipline, their raids in the north to draw Imperial armies away from our own front. Zhang Lexing offers to serve as commander of a Northern Expedition under our banner."
 nian.20.a: "Welcome them as brothers."
 nian.20.b: "We have no need of bandits."

 nian.21.t: "The Taiping Accept Our Hand"
 nian.21.d: "The Heavenly Kingdom has accepted our proposal. Their envoys speak of us as brothers in the same struggle, and their armies will grant our columns free passage through their territory. For the first time the rebellion has two arms that move together."
 nian.21.a: "Brothers against the Manchus."

 nian.22.t: "The Fertile King"
 nian.22.d: "The investiture has arrived from Tianjing, wrapped in yellow silk. Zhang Lexing is henceforth the Wowang, the 'Fertile King', a prince of the Heavenly Kingdom in his own right. Some of the older chiefs grumble about taking titles from southerners. Most of them are far too busy celebrating to care."
 nian.22.a: "Long live the Wowang!"

 nian.23.t: "Commander of the Northern Expedition"
 nian.23.d: "Zhang Lexing has taken formal command of the Northern Expedition. He is no longer merely the Lord of the Alliance presiding over quarrelsome chiefs; he now directs whole armies, and the discipline of the Taiping staff has begun to tell in the way our columns move."
 nian.23.a: "The Lord of the Alliance takes the field."

 nian.24.t: "The Pact at Zhengyang Pass"
 nian.24.d: "At Zhengyang Pass our envoys and the Nian chiefs have sworn a formal compact. We guarantee the independence of the Nian domains, they guarantee free passage to our armies, and Zhang Lexing takes command of the Northern Expedition in our name."
 nian.24.a: "Let the pact be sworn."

 nian.25.t: "Elevate the King of Zun"
 nian.25.d: "Tianjing has fallen and the King of Zun has come north with the remnants of his army. Lai Wenguang is a Taiping prince, a veteran of a decade of campaigning, and quite possibly the finest cavalry commander in China. He will take charge of our eastern armies."
 nian.25.a: "The King of Zun rides with us."

 nian.26.t: "The Army Splits"
 nian.26.d: "The front now stretches from the sea to the western passes, and no single council can direct it. In October the chiefs have agreed to divide: the Eastern Nian under Lai Wenguang will hold the line against the modernizing Huai Army, while the Western Nian under Zhang Zongyu strike deep into the northwestern provinces. Neither half entirely trusts the other."
 nian.26.a: "Divide the domains."

 nian.27.t: "The Eastern Vanguard"
 nian.27.d: "Political authority has passed to the Eastern Nian. Lai Wenguang, the former King of Zun, now leads the movement, with Ren Zhu at his side. Our grand strategy is set: march westwards into Sichuan and Shaanxi and join hands with every force still in arms against the Manchus."
 nian.27.a: "Westwards, then."

 nian.28.t: "Rumors of an Aisin Gioro Coup"
 nian.28.d: "Handbills are circulating in every market town of the north claiming that the princes of the Aisin Gioro clan are preparing to depose the Empress Dowager. The claims are absurd, the sources untraceable, and the rumour is everywhere. Half the provincial officials appear to believe it."
 nian.28.a: "Find whoever is printing these."

 nian.29.t: "The Ningbo Precedent"
 nian.29.d: "Fan Ruzeng governed Ningbo for six months and held it against a British squadron by simple refusal. We will follow his example: the opium trade is prohibited, merchant ships will pay their taxes according to regulation, and every unequal treaty and foreign concession within our reach is declared void. The consuls at the treaty ports will be furious. Fan Ruzeng himself has come north to join us."
 nian.29.a: "Let the foreigners complain."

 nian.30.t: "The Western Expedition"
 nian.30.d: "The political centre has shifted west. Zhang Zongyu and Zhang Zhuo now lead the movement, and the plan is to roam through Shaanxi and Shanxi before turning into Zhili to threaten Beijing directly. It is a strategy of pure movement, and it will demand everything our horsemen have."
 nian.30.a: "Ride until the Manchus break."

 nian.31.t: "The Miao Peilin Pact"
 nian.31.d: "Miao Peilin has offered us his allegiance, and with it dozens of counties around Fengtai and Shouzhou and a militia numbering in the thousands. He has also rebelled against the Qing three times and against the Taiping twice, and he handed the Taiping King Chen Yucheng over to the Manchus in chains. The Heavenly Kingdom named him Zou Wang before he betrayed them. Everyone in our camp knows exactly what he is."
 nian.31.a: "Take his men and watch him closely."

 nian.32.t: "A Blade of Grass on a Wall"
 nian.32.d: "A blade of grass on a wall bends whichever way the wind blows. With our fortunes failing, Miao Peilin has done precisely what everyone expected: his militias have declared for the Qing overnight, several of our own commanders were seized in their beds and sent south in chains, and Fengtai has closed its gates against us."
 nian.32.a: "We should have known better."

 nian.33.t: "The Siege of Mengcheng"
 nian.33.d: "Our columns have closed around Mengcheng. Miao Peilin's militias are penned inside the walls, the countryside around them has been stripped bare, and every Imperial convoy that tries to reach Anhui vanishes into the hands of our raiders. He has no friends left to call upon - he betrayed all of them."
 nian.33.a: "Let him starve."

 nian.34.t: "Assassinated by Wang Wanqing"
 nian.34.d: "The gates of Mengcheng opened this morning. Wang Wanqing, one of Miao Peilin's own subordinates, cut his master down in the courtyard and rode out to claim credit for it. The garrison surrendered without a shot and handed over its arsenals intact. Anhui is ours."
 nian.34.a: "A fitting end for the opportunist."

 nian.35.t: "Envoys of the White Lotus"
 nian.35.d: "The lodge masters of the White Lotus have come to us openly for the first time. They have plagued the Qing for two centuries and have no interest whatever in our councils or our titles - only in the destruction of the Manchus. Their followers will fight without regard for their own lives, and will die accordingly."
 nian.35.a: "The Eternal Mother wills it."

 nian.36.t: "Miao Peilin Slips Away"
 nian.36.d: "The opportunist has escaped us. Miao Peilin abandoned Mengcheng before our columns closed and has taken his militias into the hills, where he will no doubt sell his allegiance to whichever side offers the better price."
 nian.36.a: "He will resurface soon enough."

 nian.37.t: "The Taiping Turn Us Away"
 nian.37.d: "The Heavenly Kingdom has refused our envoys. Their court regards us as bandits and heretics, unfit to share the Heavenly King's mandate. Very well - the Nian have never needed anyone's permission to fight the Manchus, and our chiefs are frankly relieved to be spared the southerners' sermons."
 nian.37.a: "We will manage alone."

 nian.40.t: "The Defection of Li Zhaoshou"
 nian.40.d: "The Imperialists have taken Li Zhaoshou's family hostage, and he has made his choice. Eighteen thousand men rode out of camp last night behind him and are now encamped under Imperial colours a day's march to the south. He has sent a letter explaining himself. Nobody has read past the first line."
 nian.40.a: "Eighteen thousand traitors."

 nian.41.t: "The Desertion of Xue Zhiyuan"
 nian.41.d: "Xue Zhiyuan has gone, and taken his personal following with him. He was never loyal to anything but his own prospects, and with our fortunes as they are, our prospects no longer interest him. The damage he has done to the confidence of the council will outlast his absence."
 nian.41.a: "Let him go."