 modifier_army_sub_unit_light_cavalry_defence_factor: "Light Cavalry Defense"
 modifier_army_sub_unit_light_cavalry_speed_factor: "Light Cavalry Speed"

 ############### FOCUS TREE ###############

 NIE_cooperation_with_minor_forces: "Cooperation with Minor Forces"
 NIE_cooperation_with_minor_forces_desc: "The Qing Empire is too vast to defeat alone. We must look beyond our banners and seek out the localized peasant militias and clandestine societies that share our hatred for the Manchus."
 NIE_rally_the_anhui_peasantry: "Rally the Anhui Peasantry"
 NIE_rally_the_anhui_peasantry_desc: "Northern Anhui is the cradle of our rebellion. By appealing directly to the poor and displaced farmers of this region, we can swell our ranks and fortify our heartland."
 NIE_approach_the_local_militias: "Approach the Local Militias"
 NIE_approach_the_local_militias_desc: "Several independent local defence forces operate in our territory. We must negotiate with their leaders to bring their arms and men under the Nian banners."
 NIE_the_miao_peilin_pact: "The Miao Peilin Pact"
 NIE_the_miao_peilin_pact_desc: "Miao Peilin controlled dozens of counties around Fengtai and Shouzhou. He was a powerful but incredibly treacherous warlord who rebelled against the Qing three times and the Taiping twice. He was even named 'Zou Wang' (Prince of Zou) by the Taiping Heavenly Kingdom before betraying them and handing over the Taiping King Chen Yucheng to the Qing."
 NIE_crush_the_opportunist: "Crush the Opportunist"
 NIE_crush_the_opportunist_desc: "Miao Peilin expanded his power by ruthlessly killing anyone who did not follow him. Because of his constant betrayals, he was eventually besieged in Mengcheng. Seeing the situation was hopeless, he was killed by his own subordinate, Wang Wanqing, who sought to claim credit for the assassination."
 NIE_embrace_the_societies: "Embrace the Societies"
 NIE_embrace_the_societies_desc: "The underground lodges hold immense influence over the common folk. It is time we officially recognize these secret societies and integrate their shadow networks into our intelligence apparatus."
 NIE_white_lotus_alliances: "White Lotus Alliances"
 NIE_white_lotus_alliances_desc: "The White Lotus society has plagued the Qing for centuries. Formalizing our ties with their lodge masters will provide us with a network of devoted, fanatic fighters."
 NIE_infiltrate_the_green_standard_army: "Infiltrate the Green Standard Army"
 NIE_infiltrate_the_green_standard_army_desc: "The Qing's traditional Han army is poorly paid and deeply corrupt. Our agents can easily bribe quartermasters and convince disillusioned soldiers to send their weapons our way."
 NIE_martial_arts_sanctuaries: "Martial Arts Sanctuaries"
 NIE_martial_arts_sanctuaries_desc: "The study of martial arts by many Nian members provides a strong foundation for our fighters. By training with the martial artists of the secret societies, our troops will be much more effective in hand-to-hand combat."
 NIE_lord_of_the_underground_alliance: "Lord of the Underground Alliance"
 NIE_lord_of_the_underground_alliance_desc: "By uniting the clandestine lodges, martial arts sects, and underground smuggling rings, our leader has become the undisputed master of China's shadow world. The Imperial armies will fight an enemy they cannot see."

 NIE_the_zhiheji_gathering: "The Zhiheji Gathering"
 NIE_the_zhiheji_gathering_desc: "In the autumn of 1855, the scattered local Nian movements converged on Zhiheji. Bound by regional ties and kinship, they forged a unified alliance under Zhang Lexing, setting aside local squabbles to wage a true war of liberation."
 NIE_formalize_the_banner_system: "Formalize the Banner System"
 NIE_formalize_the_banner_system_desc: "To turn a loose coalition of raiders into an army, Zhang Lexing has introduced the Banner System. Inspired by the Qing's own martial structure, our forces are divided into five colored clans - Yellow, White, Blue, Black, and Red - giving tactical structure to our nomadic swiftness."
 NIE_anti_qing_propaganda: "Anti-Qing Propaganda"
 NIE_anti_qing_propaganda_desc: "We will attract many northern Chinese to unite and fight against the Qing government. We will spread the rumor that the ruling Aisin Gioro clan has a secret agenda to stage a coup against Empress Dowager Cixi."
 NIE_women_of_the_nian: "Women of the Nian"
 NIE_women_of_the_nian_desc: "Women have historically played an important role in our movement. We will actively encourage them to fight alongside their men to bolster our ranks."
 NIE_base_of_the_uneducated_peasantry: "Base of the Uneducated Peasantry"
 NIE_base_of_the_uneducated_peasantry_desc: "Our social base relies primarily on the uneducated peasantry of northern Anhui. We will inspire local uprisings of the common folk against the local elites."
 NIE_the_ningbo_precedent: "The Ningbo Precedent"
 NIE_the_ningbo_precedent_desc: "Following the administrative example of General Fan Ruzeng in Ningbo, we will establish strict political and trade policies. We will prohibit the opium trade, order merchant ships to pay taxes according to regulations, and abolish all unequal treaties and concessions with Britain and the United States."
 NIE_the_taiping_brotherhood: "The Taiping Brotherhood"
 NIE_the_taiping_brotherhood_desc: "This path aligns the Nian with the Taiping Rebellion, echoing Zhang Lexing's historical role as the 'Commander of the Northern Expedition' for the Taiping. It elevates leaders like Lai Wenguang, who served under the Taiping Heavenly Kingdom and was known as the King of Zun."
 NIE_accept_the_fertile_king_title: "Accept the Fertile King Title"
 NIE_accept_the_fertile_king_title_desc: "We will accept the political investiture from the Taiping, recognizing Zhang Lexing as the 'Fertile King'."
 NIE_commander_of_the_northern_expedition: "Commander of the Northern Expedition"
 NIE_commander_of_the_northern_expedition_desc: "Zhang Lexing will officially join forces with the Taiping Rebellion and become the 'Commander of the Northern Expedition'."
 NIE_the_tianjing_promise: "The Tianjing Promise"
 NIE_the_tianjing_promise_desc: "We will formally meet with Taiping leaders, such as Chen Decai and Lai Wenguang, and promise to support them in the defence of their capital, Tianjing."
 NIE_elevate_the_king_of_zun: "Elevate the King of Zun"
 NIE_elevate_the_king_of_zun_desc: "Following the fall of the Taiping capital, we will integrate Lai Wenguang, the former Taiping 'King of Zun', into our leadership to guide our eastern armies."
 NIE_the_october_division: "The October Division"
 NIE_the_october_division_desc: "With our central leadership fractured and operating over a vast frontline, the Nian domains must split. The Eastern Nian under Lai Wenguang will hold the line against the modernizing Huai Army, while the Western Nian under Zhang Zongyu strikes deep into the northwestern provinces."
 NIE_support_the_eastern_nian: "Support the Eastern Nian"
 NIE_support_the_eastern_nian_desc: "We will consolidate political power under the Eastern Nian, led by former Taiping King Lai Wenguang and Ren Zhu. Our grand strategy will be to march westwards into Sichuan and Shaanxi to liaise with allied forces."
 NIE_support_the_western_nian: "Support the Western Nian"
 NIE_support_the_western_nian_desc: "We will shift our political center to the Western Nian, led by Zhang Zongyu and Zhang Zhuo. We will roam through Shaanxi and Shanxi, eventually moving into Zhili to directly threaten the Qing capital of Beijing."

 NIE_nian_military: "Nian Military"
 NIE_nian_military_desc: "Our bands are brave, but they are bands nonetheless. If the Nian are to become an army capable of standing against the Imperial forces, we must give them structure, doctrine and purpose."
 NIE_implement_the_banner_system_in_army: "Implement the Banner System in Army"
 NIE_implement_the_banner_system_in_army_desc: "Zhang Lexing imposed a 'banner system' of organization. Various Nian families and factions were grouped under yellow, blue, white, red, and black flags. This structure suited the nomadic raiders perfectly. It enabled them to conduct raids against enemies across northwestern China."
 NIE_arm_the_women_warriors: "Arm the Women Warriors"
 NIE_arm_the_women_warriors_desc: "Women played an important role in the movement. They actively fought alongside the men in the Nian Army. Small forces of female Nian soldiers even fought under female generals like Chen Bagu."
 NIE_the_coffin_trick: "The Coffin Trick"
 NIE_the_coffin_trick_desc: "The Nian relied on their peasant ingenuity and cunning to survive. Nian soldiers used a trick where they dressed as mourners and hid their uniforms inside an empty black coffin. This allowed them to pass right in front of advancing Imperial troops while loudly lamenting a fake plague to delay discovery."
 NIE_establish_the_lodge_system: "Establish the Lodge System (Tang)"
 NIE_establish_the_lodge_system_desc: "Before the larger Banners can be fully trusted, we must secure the loyalty of the individual gang leaders. By formalizing the 'Tang' (Lodge) system, we create secret meeting halls across the provinces to coordinate our regional bandit chiefs, share intelligence, and unify our command structure."
 NIE_sunzis_three_columns: "Sunzi's Three Columns"
 NIE_sunzis_three_columns_desc: "Nian generals relied heavily on traditional military tactics, with many dating back to Sunzi. In encounters with Imperial forces, the Nian Army was often divided into three columns. The central column tied down the enemy in hand-to-hand combat while the two flanking wings surrounded and attacked from the rear."
 NIE_scavenge_jesuit_artillery: "Scavenge Jesuit Artillery"
 NIE_scavenge_jesuit_artillery_desc: "Huge guns left by the Jesuits in the early seventeenth century were dug up by the Nian. Some of these cannons weighed over 5,000 pounds. The Nian used these large cannons in the defence of their headquarters around Chih-ho."
 NIE_hit_and_run_tactics: "Hit-and-Run Tactics"
 NIE_hit_and_run_tactics_desc: "Forced to adopt guerrilla tactics, the Nian avoided direct confrontations with Imperial troops. Instead, they launched lightning attacks against the weakest forces of the Manchus. They sought to wear down the enemy by exhausting their manpower and supplies through constant attacks."
 NIE_bamboo_weapons_and_swords: "Bamboo Weapons and Swords"
 NIE_bamboo_weapons_and_swords_desc: "Constant warfare in their later years left the Nian very short of weapons. As heavy guns reduced speed and mobility, the Nian switched to swords, spears, and bamboo weapons. They were even forced to cut down bamboo along their escape routes to craft weapons."
 NIE_the_taiping_military_transformation: "The Taiping Military Transformation"
 NIE_the_taiping_military_transformation_desc: "Nian leaders like Zhang Zongyu and Ren Zhu allied with Taiping leaders like Lai Wenguang. The newly formed army adopted Taiping military tactics. This included the transformation of infantry units into cavalry units for quick raids and surprise attacks."
 NIE_the_swift_cavalrymen: "The Swift Cavalrymen"
 NIE_the_swift_cavalrymen_desc: "The Nian forces consisted of 50,000 splendid horsemen who were ferocious fighters. These swift cavalrymen could quickly surround and destroy the enemy. Their rapid mobility allowed them to cover 1,000 li in just a few days."
 NIE_eliminate_the_mongol_commander: "Eliminate the Mongol Commander"
 NIE_eliminate_the_mongol_commander_desc: "The Mongolian commander Sengge Rinchen blocks the way south and previously killed Nian leader Zhang Lexing. In May 1865, Lai Wenguang's army defeated Sengge Rinchen at the Battle of Gaolouzhai and killed him."
 NIE_contact_european_smugglers: "Contact European Smugglers"
 NIE_contact_european_smugglers_desc: "The Nian sought to acquire modern Western weapons. Leaders like Ren Zhu and Lai Wenguang had interviews with foreigners at Lao-shan-k'ou near Chefoo. These foreigners were ordered to secretly buy foreign artillery for the Nian army."
 NIE_deploy_explosive_shell_artillery: "Deploy Explosive-Shell Artillery"
 NIE_deploy_explosive_shell_artillery_desc: "In the later years of the rebellion, the Nian had access to modern Western guns and muskets. They equipped their forces with explosive-shell guns (k'ai-hua p'ao) and heavy artillery pieces (p'i-shan p'ao). They handled these foreign firearms on horseback with ease."
 NIE_advance_on_beijing: "Advance on Beijing"
 NIE_advance_on_beijing_desc: "With massive strength, Lai Wenguang commands Nian cavalry forces numbering around 90,000. The Nian Armies are planning to use this force to surround and attack the capital of Beijing, an effort they are confident will succeed."

############### NATIONAL SPIRITS ###############

 NIE_idea_nian_cavalry: "Nian Cavalry"
 NIE_idea_nian_cavalry_desc: "Fifty thousand splendid horsemen ride under the Nian banners. Fast, ferocious and utterly at home in the North China plain, they are the beating heart of our rebellion."
 NIE_idea_nian_cavalry_2: "Nian Cavalry"
 NIE_idea_nian_cavalry_2_desc: "Our swift cavalrymen can cover a thousand li in a matter of days. No Imperial column can escape them, and none can catch them."
 NIE_idea_plundering_over_politics: "Plundering Over Politics"
 NIE_idea_plundering_over_politics_desc: "The Nian are raiders before they are statesmen. Our chiefs care far more for loot and grain than for the tedious business of government, and our administration suffers accordingly."
 NIE_idea_defenders_of_chihho: "Defenders of Chih-ho"
 NIE_idea_defenders_of_chihho_desc: "The enormous Jesuit cannons dug up from the earth now glower over the earthworks of Chih-ho. Behind them, our headquarters can hold out against any Imperial assault."
 NIE_idea_bamboo_weaponry: "Bamboo Weaponry"
 NIE_idea_bamboo_weaponry_desc: "Swords, spears and bamboo poles cut from the roadside cost us almost nothing and can be issued to any peasant who joins us. Against armour and fortifications, however, they are of little use."
 NIE_idea_horseback_artillery: "Horseback Artillery"
 NIE_idea_horseback_artillery_desc: "Explosive-shell guns handled from the saddle. The weight slows our riders a little, but nothing in the Qing line can withstand the shock of a Nian charge supported by modern shot."
 NIE_idea_the_tianjing_promise: "The Tianjing Promise"
 NIE_idea_the_tianjing_promise_desc: "We have sworn to the Heavenly King's ministers that Nian horsemen will ride to the defence of Tianjing. Our volunteers stand ready to march wherever the Taiping call."
 NIE_idea_zhiheji_alliance: "Zhiheji Alliance"
 NIE_idea_zhiheji_alliance_desc: "At Zhiheji the scattered bands of the plain swore themselves into a single alliance. Kinship and locality now bind our armies together far more tightly than any Imperial decree ever could."
 NIE_idea_the_five_banners: "The Five Banners"
 NIE_idea_the_five_banners_desc: "Yellow, White, Blue, Black and Red. Each banner gathers its own families and chiefs, and each knows its place in the line of battle."
 NIE_idea_societal_mobilization: "Societal Mobilization"
 NIE_idea_societal_mobilization_desc: "Men and women alike take up arms for the Nian cause. A movement that mobilizes its whole society cannot be stamped out by garrisons and proclamations."
 NIE_idea_peasant_social_base: "Peasant Social Base"
 NIE_idea_peasant_social_base_desc: "Our strength is drawn from the poorest villages of northern Anhui. They give us endless recruits and unshakeable loyalty, but not a single literate clerk."
 NIE_idea_abolished_unequal_treaties: "Abolished Unequal Treaties"
 NIE_idea_abolished_unequal_treaties_desc: "The opium trade is banned, merchant ships pay their taxes according to regulation, and every foreign concession within our reach has been declared void."
 NIE_idea_the_eastern_vanguard: "The Eastern Vanguard"
 NIE_idea_the_eastern_vanguard_desc: "Under Lai Wenguang and Ren Zhu, the Eastern Nian have become the sharpened point of the rebellion: swift, disciplined horsemen who live off the land they ride through."
 NIE_idea_the_western_expedition: "The Western Expedition"
 NIE_idea_the_western_expedition_desc: "The Western Nian roam through Shaanxi and Shanxi, far beyond any supply line. Hunger and distance are simply conditions of the march."
 NIE_idea_anhui_peasant_base: "Anhui Peasant Base"
 NIE_idea_anhui_peasant_base_desc: "Northern Anhui is the cradle of the rebellion. Every displaced farmer in the region is a potential Nian soldier."
 NIE_idea_zou_wangs_support: "The Zou Wang's Support"
 NIE_idea_zou_wangs_support_desc: "Miao Peilin's militias have joined our banners, bringing dozens of counties and thousands of men with them. Nobody in our camp trusts him for a moment."
 NIE_idea_anhui_purged_of_traitors: "Anhui Purged of Traitors"
 NIE_idea_anhui_purged_of_traitors_desc: "With the opportunist dead at the hands of his own subordinate, Anhui is finally ours alone. Our soldiers fight with the confidence of men who need not watch their own flanks."
 NIE_idea_secret_society_networks: "Networks of the Societies"
 NIE_idea_secret_society_networks_desc: "The lodges of the secret societies pass word from village to village faster than any Imperial courier could ride."
 NIE_idea_white_lotus_cooperation: "Cooperation with the White Lotus"
 NIE_idea_white_lotus_cooperation_desc: "The White Lotus have plagued the Qing for centuries. Their fanatics fight without regard for their own lives, seizing enemy weapons and rousing the countryside behind Imperial lines, but they take terrible losses doing it."
 NIE_idea_green_standard_infiltration: "Infiltration of the Green Standard"
 NIE_idea_green_standard_infiltration_desc: "Bribed quartermasters and disillusioned soldiers open the gates of the Green Standard depots to us, and sometimes the gates of their forts as well."
 NIE_idea_martial_arts_sanctuaries: "Martial Arts Sanctuaries"
 NIE_idea_martial_arts_sanctuaries_desc: "Our infantry, cavalry and militia have all trained with the martial artists of the secret societies. In close quarters, no Imperial soldier is their equal."
 NIE_idea_lord_of_the_alliance: "Lord of the Alliance"
 NIE_idea_lord_of_the_alliance_desc: "Lodges, sects and smuggling rings all answer to one man now. The Imperial armies march against an enemy they cannot see and cannot starve."
 NIE_idea_the_fake_plague: "The Fake Plague"
 NIE_idea_the_fake_plague_desc: "Rumours of pestilence spread by wailing 'mourners' have thrown the front into disarray. Nobody wants to billet in a village that may be infected."
 NIE_idea_siege_of_mengcheng: "The Siege of Mengcheng"
 NIE_idea_siege_of_mengcheng_desc: "The countryside around Mengcheng has been stripped bare. Every convoy that enters Anhui vanishes into the hands of raiders."
 NIE_idea_the_exhausted_retreat: "The Exhausted Retreat"
 NIE_idea_the_exhausted_retreat_desc: "Ninety thousand horsemen rode on the capital and ninety thousand rode away again, beaten, hungry and leaderless."

############### TRAITS ###############

 NIE_trait_fertile_king: "Fertile King (Wowang)"
 NIE_trait_fertile_king_desc: "Invested by the Taiping Heavenly Kingdom as the Wowang, the 'Fertile King', and recognized as commander of the northern armies."
 chen_bagu_advisor_trait: "Phantom Mourner"
 chen_bagu_advisor_trait_desc: "Chen Bagu leads her women warriors through country the Imperial scouts believe to be impassable, and is gone before they realise she was ever there."
 NIE_trait_improviser: "Improviser"
 NIE_trait_improviser_desc: "Famous for using psychological distractions - swimming a horse in the moat - to fix the defenders' attention while gunpowder charges were set during the siege of Jiaozhou."
 NIE_trait_defender_of_the_ten_acres: "Defender of the Ten Acres"
 NIE_trait_defender_of_the_ten_acres_desc: "Remembered in the regional accounts for her resolute resistance against Imperial forces on a single plot of land, becoming a symbol of local defiance."
 NIE_trait_folklore_hero: "Folklore Hero"
 NIE_trait_folklore_hero_desc: "A leader whose military exploits were preserved in popular rebellion stories, representing the grassroots leadership of the Nian bands."
 NIE_trait_mr_gong: "Mr. Gong"
 NIE_trait_mr_gong_desc: "Literate and highly resourceful, he served as the Nian's primary military advisor, earning the respectful title of 'Mr. Gong' from the ranks."
 NIE_trait_daring_raider: "Daring Raider"
 NIE_trait_daring_raider_desc: "Often appearing alongside Pa Sheng-wen in Nian oral traditions, he represents the rapid strike and guerrilla spirit of the rebellion's soldiers."
 NIE_trait_the_disillusioned_runner: "The Disillusioned Runner"
 NIE_trait_the_disillusioned_runner_desc: "A former yamen runner who turned against the Qing, bringing intimate knowledge of local militia logistics with him."
 NIE_trait_rallying_martyr: "Rallying Martyr"
 NIE_trait_rallying_martyr_desc: "A recurring character in oral tradition whose personal struggles and eventual death served as a powerful rallying point for the Nian cause."
 NIE_trait_gentry_liaisons: "Gentry Liaisons"
 NIE_trait_gentry_liaisons_desc: "Individual Nian members whose exploits were preserved in folk tradition, representing the movement's connection to the local rural elite and peasantry."
 NIE_trait_salt_syndicate_liaison: "Salt Syndicate Liaison"
 NIE_trait_salt_syndicate_liaison_desc: "A folklore figure representing the salt smuggling industry, the primary profitable trade and economic engine of the Nian in Anhui."
 NIE_trait_catalyst_for_collapse: "Catalyst for Collapse"
 NIE_trait_catalyst_for_collapse_desc: "His personal following brings a short-term political windfall, but his history of desertion undermines the very foundations of the revolutionary cause."

 NIE_militia_warlord: "Militia Warlord"
 NIE_militia_warlord_desc: "Commands dozens of counties worth of local militia, raised and paid outside any formal chain of command."
 NIE_treacherous: "Treacherous"
 NIE_treacherous_desc: "He has rebelled against the Qing three times and the Taiping twice. There is no reason to believe we will be the exception."
 NIE_unreliable_loyalist: "Unreliable Loyalist"
 NIE_unreliable_loyalist_desc: "A Nian chief whose family has been taken hostage by the Imperialists. His loyalty lasts exactly as long as our fortunes do."
 NIE_slayer_of_commanders: "Slayer of Commanders"
 NIE_slayer_of_commanders_desc: "He killed Sengge Rinchen in the field at Gaolouzhai. His men believe no Imperial general can stand before him."

