############### COMBAT TACTICS ###############

 tactic_three_column_encirclement: "Three Column Encirclement"
 tactic_three_column_encirclement_desc: "The central column ties the enemy down in hand-to-hand combat while the two flanking wings sweep around and attack from the rear."
 tactic_militia_infiltration: "Militia Infiltration"
 tactic_militia_infiltration_desc: "Bribed and disillusioned Green Standard soldiers open the way for us from inside the enemy's own positions."

