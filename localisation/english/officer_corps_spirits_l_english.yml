###ARMY SPIRITS

##ACADEMY
#GENERIC
arisocratic_officer_corps_spirit: "Aristocratic Officer Corps"
arisocratic_officer_corps_spirit_desc: "Our officers are drawn almost solely from the aristocracy. They are usually well-educated and well-connected, which has led to an officer corps that is highly esteemed, at least in terms of prestige, but it also means that merit is not the primary factor in promotions."
arisocratic_officer_corps_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Media Personality'§! on level up."
merit_based_officer_corps_spirit: "Merit-Based Officer Corps"
merit_based_officer_corps_spirit_desc: "Our officers are drawn from the best and brightest, regardless of their social class. This has led to an officer corps that is highly competent, but some of them may lack the social connections necessary for advancement."
merit_based_officer_corps_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Career Officer'§! or §Y'Skilled Staffer'§! on level up."
traditional_army_academies_spirit: "Traditional Army Academies"
traditional_army_academies_spirit_desc: "Our officers are trained in the traditional ways of the past, and they are usually hand-selected from families with a history of military service. This has led to an officer corps with a strong legacy, but it has also made it difficult for new ideas to take hold."
traditional_army_academies_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Cautious'§! or §Y'Cavalry Leader'§! on level up."
innovative_academies_spirit: "Innovative Academies"
innovative_academies_spirit_desc: "Our officers are trained in the latest military theories and practices. This has led to an officer corps that is more open to new ideas, but new ideas can be dangerous when they have not been proven in the field."
innovative_academies_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Trickster'§! or §Y'Engineer'§! on level up."
nationalist_ideals_spirit: "Nationalist Ideals"
nationalist_ideals_spirit_desc: "Our officers are trained to be loyal to the nation, its people, and values above all else. This has led to an officer corps that is more willing to take risks and make sacrifices for the good of the country, but this could come at a cost."
nationalist_ideals_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Reckless'§! on level up."
revolutionary_ideals_spirit: "Revolutionary Ideals"
revolutionary_ideals_spirit_desc: "Our officers are loyal to the ideals of the revolution above all else. This makes them reliable and willing to make sacrifices for the good of the revolution, but it also makes them less willing to compromise or work with those who do not share their ideals."
revolutionary_ideals_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Politically Connected'§! or §Y'Reckless'§! on level up."
