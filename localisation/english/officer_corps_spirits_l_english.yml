##ARMY
#GENERIC
professional_army_spirit: "Professional Army"
professional_army_spirit_desc: "Our army is made up of professional soldiers who are well-trained and well-equipped. This has led to an army that is highly effective in combat, but it also means that we have a smaller pool of soldiers to draw from in times of war."
peasant_levies_spirit: "Peasant Levies"
peasant_levies_spirit_desc: "Our army is made up of peasant levies who are poorly trained and poorly equipped. This has led to an army that is less effective in combat, but it also means that we have a larger pool of soldiers to draw from in times of war."
cult_of_the_offensive_spirit: "Cult of the Offensive"
cult_of_the_offensive_spirit_desc: "Our army is trained to be aggressive and to take the fight to the enemy. This has led to an army that is highly effective in combat, but it also means that we are more likely to suffer heavy casualties in battle."
defense_first_spirit: "Defense First"
defense_first_spirit_desc: "Our army is trained to be defensive and to hold the line against the enemy. This has led to an army that is highly capable of defending our territory, but it also means that we are less likely to take the fight to the enemy."
grand_artillery_barrages_spirit: "Grand Artillery Barrages"
grand_artillery_barrages_spirit_desc: "Our army is trained to use artillery to devastating effect. This has led to an army that is highly effective in overwhelming the enemy with artillery fire, but it also means that we are using more resources and advance more slowly."
cavalry_and_shock_tactics_spirit: "Cavalry and Shock Tactics"
cavalry_and_shock_tactics_spirit_desc: "Our army is trained to use cavalry and shock tactics to break the enemy's lines. This has led to an army that is highly effective and fast in breaking through enemy defenses, but it also means that we are more vulnerable to counterattacks and supply shortages."
living_off_the_country_and_foraging_spirit: "Living Off the Country and Foraging"
living_off_the_country_and_foraging_spirit_desc: "Our army is trained to live off the land and forage for supplies. This has led to an army that is highly mobile and can operate in enemy territory, but it also means that we are going to face more resistance from the local populace."
#COUNTRY-SPECIFIC
getrennt_marschieren_vereint_schlagen_spirit: "Getrennt Marschieren, Vereint Schlagen"
getrennt_marschieren_vereint_schlagen_spirit_desc: "Our army is trained to march separately and strike together. This has led to an army that is highly effective in coordinating attacks, but it also means that our success depends on every unit performing their role correctly."

##DIVISION COMMAND
#GENERIC
line_infantry_discipline_spirit: "Line Infantry Discipline"
line_infantry_discipline_spirit_desc: "Our commanders are trained to maintain strict discipline among their units. This has led to divisions that are highly effective in combat, but it also means that they are less flexible and adaptable to changing circumstances."
quick_improvisation_spirit: "Quick Improvisation"
quick_improvisation_spirit_desc: "Our commanders are trained to think on their feet and to improvise when necessary. This has led to divisions that are highly adaptable and capable of responding to changing circumstances, but it also means that they may be less effective in maintaining strict discipline."
reserve_officers_spirit: "Reserve Officers"
reserve_officers_spirit_desc: "We can rely on well-trained reserve officers in times of need. This means that we have a larger pool of qualified commanders available to lead our divisions. These commanders, however, may not be as experienced as our regular officers."
railway_logistics_and_mobilization_spirit: "Railway Logistics and Mobilization"
railway_logistics_and_mobilization_spirit_desc: "Our army is trained to use railways to move troops and supplies quickly. This has led to an army that is highly mobile and capable of responding to changing circumstances, but it also means that we are more dependent on railways and vulnerable to disruptions in the rail network."
colonial_departments_spirit: "Colonial Departments"
colonial_departments_spirit_desc: "We have established colonial departments to command our forces in overseas territories. This has led to a more effective command structure abroad, but it also means that we are more reliant on the loyalty and competence of our colonial administrators."
guerilla_warfare_spirit: "Guerilla Warfare"
guerilla_warfare_spirit_desc: "Our commanders are trained in the art of guerilla warfare. This has led to divisions that are highly effective in unconventional warfare, but it also means that they may be less effective in conventional battles and more reliant on local support."
#COUNTRY-SPECIFIC
auftragstaktik_spirit: "Auftragstaktik"
auftragstaktik_spirit_desc: "Our commanders are trained in the art of Auftragstaktik, which emphasizes initiative and decentralized decision-making. This has led to divisions that are highly effective in combat, but it also means that we rely on the competence of our lower-rank officers."