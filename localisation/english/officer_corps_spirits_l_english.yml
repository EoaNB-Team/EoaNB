###ARMY SPIRITS

##ACADEMY
#GENERIC
arisocratic_officer_corps_spirit: "Aristocratic Officer Corps"
arisocratic_officer_corps_spirit_desc: "Our officers are drawn almost solely from the aristocracy. They are usually well-educated and well-connected, which has led to an officer corps that is highly esteemed, at least in terms of prestige, but it also means that merit is not the primary factor in promotions."
arisocratic_officer_corps_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Media Personality'§! on level up."
merit_based_officer_corps_spirit: "Merit-Based Officer Corps"
merit_based_officer_corps_spirit_desc: "Our officers are drawn from the best and brightest, regardless of their social class. This has led to an officer corps that is highly competent, but some of them may lack the social connections necessary for advancement."
merit_based_officer_corps_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Career Officer'§! or §Y'Skilled Staffer'§! on level up."
traditional_army_academies_spirit: "Traditional Army Academies"
traditional_army_academies_spirit_desc: "Our officers are trained in the traditional ways of the past, and they are usually hand-selected from families with a history of military service. This has led to an officer corps with a strong legacy, but it has also made it difficult for new ideas to take hold."
traditional_army_academies_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Cautious'§! or §Y'Cavalry Leader'§! on level up."
innovative_academies_spirit: "Innovative Academies"
innovative_academies_spirit_desc: "Our officers are trained in the latest military theories and practices. This has led to an officer corps that is more open to new ideas, but new ideas can be dangerous when they have not been proven in the field."
innovative_academies_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Trickster'§! or §Y'Engineer'§! on level up."
nationalist_ideals_spirit: "Nationalist Ideals"
nationalist_ideals_spirit_desc: "Our officers are trained to be loyal to the nation, its people and values above all else. This has led to an officer corps that is more willing to take risks and make sacrifices for the good of the country, but this could come at a cost."
nationalist_ideals_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Reckless'§! or §Y'War Hero'§! on level up."
revolutionary_ideals_spirit: "Revolutionary Ideals"
revolutionary_ideals_spirit_desc: "Our officers are loyal to the ideals of the revolution above all else. This makes them reliable and willing to make sacrifices for the good of the revolution, but it also makes them less willing to compromise or work with those who do not share their ideals."
revolutionary_ideals_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Politically Connected'§! or §Y'Reckless'§! on level up."
#COUNTRY-SPECIFIC
preussische_kriegsakademie_spirit: "Preußische Kriegsakademie"
preussische_kriegsakademie_spirit_desc: "Founded in Berlin to educate the finest military minds, the Preußische Kriegsakademie emphasizes rigorous staff work, operational planning, and the intellectual study of strategy. Officers trained here excel in organizational logistics and methodical staff management, forming the backbone of a disciplined general staff."
preussische_kriegsakademie_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Organizer'§! or §Y'Skilled Staffer'§! on level up."
saint_cyr_cadres_spirit: "Saint-Cyr Cadres"
saint_cyr_cadres_spirit_desc: "Established by Napoleon to forge an elite officer corps, the École Spéciale Militaire de Saint-Cyr instills tactical initiative, personal courage, and adaptability under fire. Cadres trained at Saint-Cyr carry forward a tradition of brilliant battlefield maneuver and fierce regimental leadership."
saint_cyr_cadres_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Organizer'§! or §Y'Adaptable'§! on level up."
west_point_academy_spirit: "West Point Academy"
west_point_academy_spirit_desc: "The United States Military Academy at West Point provides a rigorous education grounded in civil engineering, discipline, and administrative science. Producing competent leaders and staff officers capable of constructing vast supply lines, fortifications, and organizational structures, West Point forms the foundation of American military leadership."
west_point_academy_spirit_tt: "Officers: §G50% chance§! of §Ygaining§! the trait §Y'Organizer'§! or §Y'Skilled Staffer'§! on level up."

##ARMY
#GENERIC
professional_army_spirit: "Professional Army"
professional_army_spirit_desc: "Our army is made up of professional soldiers who are well-trained and well-equipped. This has led to an army that is highly effective in combat, but it also means that we have a smaller pool of soldiers to draw from in times of war."
peasant_levies_spirit: "Peasant Levies"
peasant_levies_spirit_desc: "Our army is made up of peasant levies who are poorly trained and poorly equipped. This has led to an army that is less effective in combat, but it also means that we have a larger pool of soldiers to draw from in times of war."
cult_of_the_offensive_spirit: "Cult of the Offensive"
cult_of_the_offensive_spirit_desc: "Our army is trained to be aggressive and to take the fight to the enemy. This has led to an army that is highly effective in combat, but it also means that we are more likely to suffer heavy casualties in battle."
defense_first_spirit: "Defense First"
defense_first_spirit_desc: "Our army is trained to be defensive and to hold the line against the enemy. This has led to an army that is highly capable of defending our territory, but it also means that we are less likely to take the fight to the enemy."
grand_artillery_barrages_spirit: "Grand Artillery Barrages"
grand_artillery_barrages_spirit_desc: "Our army is trained to use artillery to devastating effect. This has led to an army that is highly effective in overwhelming the enemy with artillery fire, but it also means that we are using more resources and advance more slowly."
cavalry_and_shock_tactics_spirit: "Cavalry and Shock Tactics"
cavalry_and_shock_tactics_spirit_desc: "Our army is trained to use cavalry and shock tactics to break the enemy's lines. This has led to an army that is highly effective and fast in breaking through enemy defenses, but it also means that we are more vulnerable to counterattacks and supply shortages."
living_off_the_country_and_foraging_spirit: "Living Off the Country and Foraging"
living_off_the_country_and_foraging_spirit_desc: "Our army is trained to live off the land and forage for supplies. This has led to an army that is highly mobile and can operate in enemy territory, but it also means that we are going to face more resistance from the local populace."
#COUNTRY-SPECIFIC
getrennt_marschieren_vereint_schlagen_spirit: "Getrennt Marschieren, Vereint Schlagen"
getrennt_marschieren_vereint_schlagen_spirit_desc: "Our army is trained to march separately and strike together. This has led to an army that is highly effective in coordinating attacks, but it also means that our success depends on every unit performing their role correctly."

##DIVISION COMMAND
#GENERIC
line_infantry_discipline_spirit: "Line Infantry Discipline"
line_infantry_discipline_spirit_desc: "Our commanders are trained to maintain strict discipline among their units. This has led to divisions that are highly effective in combat, but it also means that they are less flexible and adaptable to changing circumstances."
quick_improvisation_spirit: "Quick Improvisation"
quick_improvisation_spirit_desc: "Our commanders are trained to think on their feet and to improvise when necessary. This has led to divisions that are highly adaptable and capable of responding to changing circumstances, but it also means that they may be less effective in maintaining strict discipline."
reserve_officers_spirit: "Reserve Officers"
reserve_officers_spirit_desc: "We can rely on well-trained reserve officers in times of need. This means that we have a larger pool of qualified commanders available to lead our divisions. These commanders, however, may not be as experienced as our regular officers."
railway_logistics_and_mobilization_spirit: "Railway Logistics and Mobilization"
railway_logistics_and_mobilization_spirit_desc: "Our army is trained to use railways to move troops and supplies quickly. This has led to an army that is highly mobile and capable of responding to changing circumstances, but it also means that we are more dependent on railways and vulnerable to disruptions in the rail network."
colonial_departments_spirit: "Colonial Departments"
colonial_departments_spirit_desc: "We have established colonial departments to command our forces in overseas territories. This has led to a more effective command structure abroad, but it also means that we are more reliant on the loyalty and competence of our colonial administrators."
guerilla_warfare_spirit: "Guerilla Warfare"
guerilla_warfare_spirit_desc: "Our commanders are trained in the art of guerilla warfare. This has led to divisions that are highly effective in unconventional warfare, but it also means that they may be less effective in conventional battles and more reliant on local support."
#COUNTRY-SPECIFIC
auftragstaktik_spirit: "Auftragstaktik"
auftragstaktik_spirit_desc: "Our commanders are trained in the art of Auftragstaktik, which emphasizes initiative and decentralized decision-making. This has led to divisions that are highly effective in combat, but it also means that we rely on the competence of our lower-rank officers."


###NAVY SPIRITS

##ACADEMY
#GENERIC
sail_gunnery_tradition_spirit: "Sail Gunnery Tradition"
sail_gunnery_tradition_spirit_desc: "Our naval officers are trained in the traditional ways of sail gunnery. This has led to a naval officer corps that is highly skilled in the use of sail-powered ships, but it also means that they may be less open to adapting to new technology."
sail_gunnery_tradition_spirit_tt: "Naval Officers: §G50% chance§! of §Ygaining§! the trait §Y'Big Gun Adherent'§! or §Y'Headstrong'§! on level up."
naval_officer_meritocracy_spirit: "Naval Officer Meritocracy"
naval_officer_meritocracy_spirit_desc: "Our naval officers are selected based on merit rather than social class. This has led to a naval officer corps that is highly competent, but it also means that some officers may lack the social connections necessary for advancement."
naval_officer_meritocracy_spirit_tt: "Naval Officers: §G50% chance§! of §Ygaining§! the trait §Y'Career Officer'§! on level up."
navigation_schools_spirit: "Navigation Schools"
navigation_schools_spirit_desc: "Our naval officers are carefully trained in the ways of navigation. This has led to a naval officer corps that is highly flexible and can adapt well to changing circumstances, but it also means that there was less focus on actually striking at the enemy."
navigation_schools_spirit_tt: "Naval Officers:\n§G50% chance§! of §Ygaining§! the trait §Y'Corvette Enthusiast'§! on level up.\n§G20% chance§! of §Ygaining§! the trait §Y'Sixth Sense'§! on level up."
ironclad_adaptation_spirit: "Ironclad Adaptation"
ironclad_adaptation_spirit_desc: "We are making steady progress in adapting our fleet to the challenges and opportunities of technological developments. The future clearly belongs to ships made of metal, and we must do everything in our power to make the transition as fast as possible, even though this might cause some disturbances in the meantime."
ironclad_adaptation_spirit_tt: "Naval Officers:\n§G70% chance§! of §Ygaining§! the trait §Y'Headstrong'§! on level up.\n§G30% chance§! of §Ygaining§! the trait §Y'Bold'§! on level up."
naval_engineering_academies_spirit: "Naval Engineering Academies"
naval_engineering_academies_spirit_desc: "With the rapid transition from sail to steam and iron, specialized engineering academies ensure our naval officers master propulsion, boiler management, and damage control. This technical grounding prepares commanders to maintain operational readiness under live fire and wring maximum speed and efficiency from complex warship machinery."
naval_engineering_academies_spirit_tt: "Naval Officers:\n§G50% chance§! of §Ygaining§! the trait §Y'Torpedo Pioneer'§! or §Y'Shipwright'§! on level up.\n§G30% chance§! of §Ygaining§! the trait §Y'Industry Connections'§! on level up."
naval_reform_spirit: "Naval Reform"
naval_reform_spirit_desc: "Recognizing that outdated tactical dogmas cannot survive the era of modern artillery and armored fleets, our navy has undertaken comprehensive organizational and instructional reforms. By fostering flexible tactical thinking, rigorous maneuver exercises, and strategic innovation, we train an officer corps capable of commanding complex fleet actions with decisive precision."
naval_reform_spirit_tt: "Naval Officers: §G70% chance§! of §Ygaining§! the trait §Y'Career Officer'§! on level up."
#COUNTRY-SPECIFIC
satsuma_naval_heritage_spirit: "Satsuma Naval Heritage"
satsuma_naval_heritage_spirit_desc: "Ever since the first contact with modern Western naval power, the Satsuma Clan has realized that Japan needs a stronger navy if it wants to survive this age of conquest and domination. Thus, Satsuma has turned into the hub for Japanese naval expertise - something we surely can take advantage of."
satsuma_naval_heritage_spirit_tt: "Naval Officers: §G50% chance§! of §Ygaining§! the trait §Y'Naval Heritage'§! on level up."
britannia_royal_naval_college_spirit: "Britannia Royal Naval College"
britannia_royal_naval_college_spirit_desc: "Britannia Rules the Waves - but it cannot do so without competent naval officers. For this reason, the Britannia Royal Naval College has been set up at Dartmouth, ensuring the highest quality education for the ambitious candidates for a future naval command."
britannia_royal_naval_college_spirit_tt: "Naval Officers: §G50% chance§! of §Ygaining§! the trait §Y'Gentlemanly'§! on level up."

##NAVY
#GENERIC
wooden_walls_spirit: "Wooden Walls"
wooden_walls_spirit_desc: "For centuries, the wooden hulls of our line-of-battle ships have formed an impenetrable bulwark against foreign aggression. While steam and iron begin to dominate the high seas, the proud traditions, discipline and seamanship forged aboard these wooden walls continue to anchor our naval identity."
grand_battlefleet_spirit: "Grand Battlefleet"
grand_battlefleet_spirit_desc: "True naval supremacy is achieved by concentrating our capital ships into a single, irresistible battlefleet. By organizing our battlships and corvettes into disciplined battlelines, we stand prepared to seek out the enemy's main fleet and destroy it in a decisive engagement."
jeune_ecole_spirit: "Jeune École"
jeune_ecole_spirit_desc: "Pioneered by naval strategists seeking to disrupt traditional sea power, the Jeune École advocates for swarms of fast torpedo craft, commerce raiders and stealthy submersibles. By targeting commercial trade lanes and harassing capital ships, we can paralyze a superior naval power without the ruinous cost of a big gun naval arms race."
high_seas_fleet_spirit: "High Seas Fleet"
high_seas_fleet_spirit_desc: "Designed for high-intensity surface engagements, our battlefleet emphasizes heavy armor protection, superior optics and rigorous gunnery drills. Built to endure heavy punishment and strike back with lethal precision, this force ensures that any adversary will pay a terrible toll to challenge our influence at sea."
commerce_raiding_spirit: "Commerce Raiding"
commerce_raiding_spirit_desc: "Rather than seeking costly battles against big-gun dominated enemy fleets, our navy focuses on strangling the adversary's economic bloodstream. By deploying fast cruisers and raiders across vital trade routes, we can inflict crippling merchant losses and force the enemy to disperse their warships in a futile search."
blockade_runners_spirit: "Blockade Runners"
blockade_runners_spirit_desc: "When hostile fleets attempt to seal our ports, fast, low-profile and daring blockade runners keep our vital supply lines open. Specializing in high-speed night runs, fog navigation and evasive maneuvers, these ships ensure that essential trade and military material continue to flow despite enemy patrols."
fleet_in_being_spirit: "Fleet-in-Being"
fleet_in_being_spirit_desc: "We can rely on the fact that the sheer power of our fleet is usually enough to scare away any enemy, without the ships ever having to leave their safe harbor. This doctrine seems compelling and cost-effective - as long as our naval power is not actually challenged."
#COUNTRY-SPECIFIC
risikoflotte_spirit: "Risikoflotte"
risikoflotte_spirit_desc: "By constructing a battlefleet so formidable that even the world's leading naval power cannot attack us without risking its global supremacy, we create an effective strategic deterrent. Even while riding at anchor, this force forces prospective rivals to respect our geopolitical ambitions."
two_power_standard_spirit: "Two-Power Standard"
two_power_standard_spirit_desc: "To guarantee our national survival and safeguard a global empire, our navy must maintain a battlefleet at least equal in strength to the combined forces of the next two largest naval powers. This doctrine demands continuous naval expansion, industrial dominance and unwavering financial investment."
regia_marina_spirit: "Regia Marina"
regia_marina_spirit_desc: "Formed to unite regional maritime traditions under one banner, our navy prioritizes fast capital ships, agile light craft and high-speed maneuvers tailored for the Mediterranean. Combining engineering innovation with daring tactical initiative, we aim to secure our national sea lanes and dominate our home waters."

##NAVAL COMMAND
#GENERIC
control_of_the_seas_spirit: "Control of the Seas"
control_of_the_seas_spirit_desc: "Securing total command of sea lanes enables uninterrupted global projection and commerce, denying the adversary any capacity to challenge our naval superiority across open waters."
line_of_battle_spirit: "Line of Battle"
line_of_battle_spirit_desc: "Rigidly coordinating capital ships in parallel lines maximizes total broadside fire, allowing our battlefleet to deliver overwhelming, synchronized salvoes into the enemy formation."
coastal_patrol_spirit: "Coastal Patrol"
coastal_patrol_spirit_desc: "By deploying light gunboats, monitors and screening craft along our shorelines, we safeguard vital estuaries, harbors and trade routes from enemy incursions and surprise raids."
efficient_communications_spirit: "Efficient Communications"
efficient_communications_spirit_desc: "From flag signal hoists and searchlight telegraphy to early wireless installations, disciplined communication channels ensure rapid transmission of orders across sprawling battle fleets."
unrestricted_trade_interdiction_spirit: "Unrestricted Trade Interdiction"
unrestricted_trade_interdiction_spirit_desc: "Authorizing unannounced commerce attacks by surface raiders and submersibles paralyzes enemy shipping networks, turning the open ocean into a deadly zone for merchant traffic."
gunboat_diplomacy_spirit: "Gunboat Diplomacy"
gunboat_diplomacy_spirit_desc: "A heavily armed warship anchored off a foreign port speaks louder than a dozen diplomats. Deploying naval force to distant waters projects national power and compels foreign compliance without firing a shot."
#COUNTRY-SPECIFIC
first_naval_lord_spirit: "First Naval Lord"
first_naval_lord_spirit_desc: "The professional head of the admiralty shapes grand strategy, driving rapid technological innovation, capital ship modernization and uncompromising doctrine to preserve global naval dominance."


###AIR SPIRITS

##AIRFORCE
#GENERIC
aviation_pioneers_spirit: "Aviation Pioneers"
aviation_pioneers_spirit_desc: "From tethered observation balloons to daring barnstormers and early biplanes, adventurous inventors and brave aviators lay the groundwork for military aviation."
aerial_recon_spirit: "Aerial Recon"
aerial_recon_spirit_desc: "By ascending above the battlefield in balloons, dirigibles, or light aircraft, observers gain an unhindered view of enemy troop movements, fortifications and strategic positions."
artillery_spotting_spirit: "Artillery Spotting"
artillery_spotting_spirit_desc: "Equipped with flag signals, lamps, or early wireless telegraphs, airborne observers transmit precise target corrections directly to battery commanders, increasing artillery lethality."
aerial_bombardment_spirit: "Aerial Bombardment"
aerial_bombardment_spirit_desc: "Dropping explosives from airships and early aircraft introduces a terrifying new dimension to warfare, striking enemy supply depots, industrial nodes and frontline trenches from above."
chivalry_of_the_skies_spirit: "Chivalry of the Skies"
chivalry_of_the_skies_spirit_desc: "Fought by daring pilots who view aerial combat as a romantic duel in the clouds, this warrior ethos breeds legendary aces and inspires high morale across the aviation corps."
naval_aviation_focus_spirit: "Naval Aviation Focus"
naval_aviation_focus_spirit_desc: "Recognizing the potential of aircraft over sea lanes, we invest in seaplane tenders and coastal aviation stations to scout far beyond the visual range of shipboard lookouts."

##AIRFORCE COMMAND
#GENERIC
private_enterprise_initiatives_spirit: "Private Enterprise Initiatives"
private_enterprise_initiatives_spirit_desc: "Partnering with civilian aviators, commercial aviation companies and independent inventors accelerates aircraft design iterations and technical breakthroughs without rigid bureaucratic delay and the cost of running a designated army branch."
subordination_to_army_spirit: "Subordination to Army"
subordination_to_army_spirit_desc: "Treating aviation primarily as an auxiliary branch of the land forces ensures that aircraft and balloon units directly serve infantry advancement, field reconnaissance, and artillery support."
subordination_to_navy_spirit: "Subordination to Navy"
subordination_to_navy_spirit_desc: "Integrating air units firmly into naval command optimizes aerial assets for fleet reconnaissance, coastal patrol, anti-submarine spotting, and over-the-horizon gunnery direction."
partial_subordination_to_army_spirit: "Partial Subordination to Army"
partial_subordination_to_army_spirit_desc: "Maintaining an operational air command under army oversight balances direct field tactical support with the flexibility to conduct broader theater reconnaissance and interdiction missions."
partial_subordination_to_navy_spirit: "Partial Subordination to Navy"
partial_subordination_to_navy_spirit_desc: "Granting the navy operational oversight over coastal and maritime air units ensures seamless cooperation in fleet scouting while preserving specialized air tactical development."
independent_air_command_spirit: "Independent Air Command"
independent_air_command_spirit_desc: "Establishing aviation as an autonomous military branch elevates air power to a strategic level, enabling unified air defense, long-range bombardment and dedicated doctrine development."