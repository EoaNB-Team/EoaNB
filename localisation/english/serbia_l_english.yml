    SER_begin_economic_recovery: "Begin Economic Recovery"
    SER_begin_economic_recovery_desc: "Under the Defenders of the Constitution, usurers charged interest of up to three hundred percent, and small traders and peasants went bankrupt by the thousand. The government covered its deficits from the state reserve and did almost nothing to build a proper credit system, leaving the country dependent on foreign coin and foreign lenders. It is time to change course and rebuild the Serbian economy."

    SER_dobra_mine_question: "The Dobra Mine Question"
    SER_dobra_mine_question_desc: "Serbian merchants want a steamship line to carry passengers and goods along the Danube, but pressure from Austria and an empty treasury have kept the government from supporting them. Foreign investors have offered partnerships, yet many seem more interested in the coal of the Dobra mines than in Serbian commerce."

    SER_french_mind_buisness: "Reject French Offers"
    SER_french_mind_buisness_desc: "The French navigation company is plainly more interested in the Dobra mines than in helping Serbian trade. We will thank them politely, part ways, and look for other partners to build our steamship line, keeping our mineral wealth in our own hands."

    SER_build_own_mines: "Build Our Own Mines"
    SER_build_own_mines_desc: "Coal is the bread of the steam engine, and Serbia has plenty of it. With funding from the Prince and the Ministry of Finance, the state will open its own pits at Senje and elsewhere, so that the profits of our coal stay in Serbia."

    SER_welcome_french_support: "Accept French Businessmen"
    SER_welcome_french_support_desc: "The French firm Magnan, Bouillon, Alphonse Conte & Co. offers to run six steamships between Galaţi and Gradiška, calling at ports along the Serbian bank and connecting them with Marseille. In return, the company wants the right to exploit the Dobra mines. It is a high price, but it would bring steam navigation to Serbia almost overnight."

    SER_invest_mining: "French Mining Investments"
    SER_invest_mining_desc: "The French have agreed to a thirty-year lease on the mines of Majdanpek and Dobra, and in return will help build a steam navigation service on the Sava and the Danube. Foreign capital and engineers will develop our mines far faster than we could alone, though much of the profit will flow to Paris."

    SER_search_experience_engineers: "Search for Experienced Engineers"
    SER_search_experience_engineers_desc: "The new mines have drawn young men looking for work, but there are far too few trained engineers to run them. Mining has become a science, and we need schools to teach it and experts to lead them. We will search at home and abroad for experienced engineers and send our best students to the mining academies of Germany and Austria."

    SER_pancics_time: "Pančić's Time"
    SER_pancics_time_desc: "Josif Pančić, professor of natural history at the Belgrade Lyceum, has spent years travelling the length of Serbia, collecting plants and minerals unknown to European science. His work has made Serbian scholarship known abroad, and the state would do well to support it."

    SER_review_ami_boue_work: "Review Ami Boué's Work"
    SER_review_ami_boue_work_desc: "The geologist Ami Boué, born in Hamburg to a Huguenot family and later settled in Vienna, travelled the Balkans in the 1830s and published the first serious studies of their geology and peoples. His work, shared with the Society of Serbian Letters, remains the best starting point for any survey of our lands."

    SER_explore_serbian_geology: "Explore Serbian Geology"
    SER_explore_serbian_geology_desc: "The mineral wealth of Serbia is still largely unknown to the world and even to ourselves. The government will invite geologists from across Europe, fund their expeditions and require that their findings be shared with the Serbian authorities."

    SER_pek_river_auriferous_sediments: "Pek River Auriferous Sediments"
    SER_pek_river_auriferous_sediments_desc: "Gold has been panned from the sands of the Pek since Roman times. Surveys of the river in eastern Serbia have confirmed rich gold-bearing sediments, which could be worked on a far larger scale with modern methods."

    SER_copper_in_bor: "Copper in Bor"
    SER_copper_in_bor_desc: "Old Roman and medieval workings near Bor, in eastern Serbia, have caught the attention of our geologists. Samples suggest copper deposits of considerable size. Their full extent is not yet known, but the discovery could one day make Bor one of the great mining centres of Europe."

    SER_awala_mercury: "Mercury on Mount Avala"
    SER_awala_mercury_desc: "On Mount Avala, just south of Belgrade, cinnabar has been mined since prehistoric times for its brilliant red pigment. Our geologists have confirmed that the mountain still holds mercury ore worth exploiting, almost within sight of the capital."

    SER_j_szabo: "József Szabó's Research"
    SER_j_szabo_desc: "József Szabó, professor of mineralogy at the University of Pest, is one of the leading geologists in the Habsburg lands and a pioneer of studying rocks under the microscope. His analysis of rock samples from Serbia, systematised and published by his students, could give us the first scientific picture of our volcanic and ore-bearing regions."

    SER_serbian_geological_sketches: "Serbian Geological Sketches"
    SER_serbian_geological_sketches_desc: "Foreign and Serbian geologists alike have filled their notebooks with sketches and observations from the field. Gathered, edited and published, these geological sketches of Serbia will appear in foreign and domestic journals and lay the foundation for the first geological map of the principality."

    SER_idea_serbian_geological_sketches: "Serbian Geological Sketches"
    SER_idea_serbian_geological_sketches_desc: "The collected field notes of foreign and Serbian geologists have given us, for the first time, a reliable picture of where our coal, ores and building stone are to be found, and how best to extract them."

    SER_invite_felix_hoffman: "Invite Felix Hofmann"
    SER_invite_felix_hoffman_desc: "Felix Hofmann, a German mining engineer from an old mining family, has worked in Serbia for years and knows our mountains better than any foreigner alive. Offering him a post in the state service as a geologist will put his knowledge of our coal and iron deposits at the disposal of the government."

    SER_stari_kostolac_quarry: "Stari Kostolac Quarry"
    SER_stari_kostolac_quarry_desc: "The Ministry of Finance has granted Franja Všetečki the right to dig for coal at Kostolac for fifty years. He has taken over 31 mining fields and begun production at the pit of Stari Kostolac, close to the Danube and the markets of Belgrade."

    SER_kucajna_mine: "Kučajna Mine"
    SER_kucajna_mine_desc: "Felix Hofmann has worked the old mines of Kučajna in the hills of eastern Serbia for a decade. The venture has struggled to turn a profit, but with state support the mine could become a steady source of ore and of experience for our engineers."

    SER_balgojev_gold_mine: "Blagojev Kamen Gold Mine"
    SER_balgojev_gold_mine_desc: "Guided by Felix Hofmann, prospectors have reopened the old gold workings at Blagojev Kamen and Deli Jovan in eastern Serbia. Gold in our own soil would help fill the treasury and give weight to a future Serbian currency."

    SER_export_vojvodina_romania: "Exports to Vojvodina and Romania"
    SER_export_vojvodina_romania_desc: "Stari Kostolac has tripled its output to some 900 tons of coal a year. For the first time Serbian coal is being exported, across the Danube to the Serbs of Vojvodina and to the Romanian principalities."

    SER_foreign_geologist: "Foreign Geologists"
    SER_foreign_geologist_desc: "Geologists from across Europe will be invited to survey Serbia at the government's expense. Every new deposit of iron, copper, lead or coal they find brings us closer to an industry of our own, and to the metals our army will need in the struggle for liberation."

    SER_improve_mining_conditions: "Improve Mining Conditions"
    SER_improve_mining_conditions_desc: "Our mines are dangerous, poorly ventilated and badly equipped. Investment in timbering, pumps, ventilation and hoisting machinery will make them safer for the miners and allow us to work deeper seams and new metals."

    SER_educate_new_staff: "Educate New Staff"
    SER_educate_new_staff_desc: "Jovan Žujović, educated in Belgrade and Paris, has become professor of geology and mineralogy at the Great School in Belgrade. Under his guidance a generation of Serbian geologists and mining engineers will be trained at home, ending our dependence on foreign experts."

    SER_lyubomir_state_service_job: "Ljubomir Klerić Enters State Service"
    SER_lyubomir_state_service_job_desc: "Ljubomir Klerić, trained at the mining academies of Freiberg and Berlin and at the Zürich Polytechnic, has returned to Serbia after years working for foreign mining companies. A post in the state service and a chair at the Great School will put his remarkable talents as an engineer and inventor to work for the nation."

    SER_science_innovations: "Science Innovations"
    SER_science_innovations_desc: "Klerić's practical, many-sided approach has borne fruit: new drills for deep boreholes, mining cartridges, drawing instruments and a generation of students who learned engineering from a man who invents as easily as he teaches."

    SER_improve_credit_organisation: "Improve Credit Organisation"
    SER_improve_credit_organisation_desc: "For years the state has lent money to the public directly from its own reserves, draining the treasury while doing little to curb usury. It is time to build proper credit institutions that can lend to farmers and craftsmen without bankrupting the state."

    SER_captain_misha_construction: "Captain Miša's Mansion"
    SER_captain_misha_construction_desc: "The mansion of Captain Miša Anastasijević, designed by the Czech architect Jan Nevole, is nearly complete. With its Venetian Gothic façade and rich ornament, it will show Belgrade what a European city can look like."

    SER_begin_modernise_belgrade: "Begin to Modernise Belgrade"
    SER_begin_modernise_belgrade_desc: "Captain Miša's Mansion has captured the imagination of Belgrade. Following its example, the city will be replanned with straight, paved streets, public squares and buildings in the European style, replacing the crooked lanes of the old Ottoman town."

    SER_european_architecture: "European Architecture"
    SER_european_architecture_desc: "New schools, ministries and townhouses in the European style are rising across Belgrade and the provincial towns. Serbian architecture has firmly joined the European mainstream, and with it Serbia's builders have learned new skills and methods."

    SER_secret_russian_appeal: "Secret Russian Appeal"
    SER_secret_russian_appeal_desc: "Russian merchants and bankers could help us through the hard years ahead. A discreet appeal for funds, kept out of the eyes of Vienna and Constantinople, would ease our financial troubles and strengthen our ties with St. Petersburg."

    SER_british_bank_loan: "British Bank Loans"
    SER_british_bank_loan_desc: "The City of London lends to governments all over the world, and Serbia's credit is untested but promising. If British banks agree to a loan, it will keep the treasury afloat and show Europe that Serbia is a reliable borrower."

    SER_ask_peterbug_help: "Ask St. Petersburg for Help"
    SER_ask_peterbug_help_desc: "Our first appeal to Russia was well received. A formal request for financial aid from the Russian government is the natural next step, and one that will be read in St. Petersburg as a sign of Serbian loyalty."

    SER_invest_in_army: "Invest In the Army"
    SER_invest_in_army_desc: "The loans have given us breathing room. Part of the money will be invested in the army's infrastructure: depots, roads and the first railway lines that will allow our troops and supplies to reach the frontier quickly."

    SER_use_of_coal: "Use Of Coal"
    SER_use_of_coal_desc: "Our forests are being cut down faster than they can grow back, yet we sit on rich coal deposits. Encouraging coal as the fuel of industry, workshops and households will power our factories and spare our woodlands."

    SER_deforestation_problem: "Deforestation Problem"
    SER_deforestation_problem_desc: "Rampant logging has stripped whole hillsides bare. It is not only an environmental travesty but an economic one: less timber regrown means less to harvest, and floods and erosion are already damaging fields and roads. We must act before the damage is irreversible."

    SER_follow_french_model: "Follow the French Model"
    SER_follow_french_model_desc: "France has built one of the most successful credit systems in Europe, with savings banks, mortgage institutions and the mighty Crédit Mobilier. Modelling our credit organisation on the French example will give Serbia institutions that European investors understand and trust."

    SER_serbian_egalitarianism: "Serbian Egalitarianism"
    SER_serbian_egalitarianism_desc: "Serbia was built by free peasants, not by lords and serfs. Our credit system should serve the smallholder and the craftsman first, with cheap loans, protection from usurers and fair treatment for every worker, rather than leaving them behind for the sake of industry."

    SER_rapid_industralisation: "Rapid Industrialisation"
    SER_rapid_industralisation_desc: "Serbia has coal, ores and willing hands. Channelling credit into factories, mines and workshops as fast as possible will make the country rich and strong, even if the cost in social upheaval is high."

    SER_poor_working_condition: "Poor Standard of Life"
    SER_poor_working_condition_desc: "In the new workshops and mines, men, women and children work long hours in dangerous conditions for little pay. Basic rules on working hours, child labour and safety will protect our workers. After all, when a worker is injured or killed, nobody wins."

    SER_fight_epidemics: "Fight Epidemics"
    SER_fight_epidemics_desc: "Cholera, typhus and smallpox sweep through our towns and villages again and again. For the first time the state will spend public money on public health: vaccination, district physicians and hospitals to fight these diseases at their source."

    SER_compulsory_chemical_analysis: "Compulsory Chemical Analysis"
    SER_compulsory_chemical_analysis_desc: "Adulterated food, poisoned wells and quack medicines kill as surely as any epidemic. Requiring chemical analysis of medicines, foodstuffs and water supplies, and publishing the results, will protect the public and give our chemists valuable experience."

    SER_border_quarantine_service: "Border Quarantine Service"
    SER_border_quarantine_service_desc: "Plague and cholera often reach Serbia from the Ottoman provinces and along the Danube trade routes. A proper quarantine service at the border crossings and river ports will protect both our population and our soldiers, or at least keep the sick from infecting others."

    SER_serbian_sanitary_history: "Serbian Sanitary History"
    SER_serbian_sanitary_history_desc: "Since the first quarantine stations of Prince Miloš's day, Serbia has fought a long and hard battle against disease. Learning from that history, we can face the future with optimism. Research into new medicines is the first step."

    SER_merich_lindenmeier_legacy: "Lindenmayer's Legacy"
    SER_merich_lindenmeier_legacy_desc: "Dr. Emerich Lindenmayer, for decades the head of the Serbian sanitary service, organised our first hospitals, quarantines and public health regulations, and saved countless lives in the process. Following in his footsteps is essential if we are to improve healthcare in Serbia."

    SER_military_medical_school: "Military Medical School"
    SER_military_medical_school_desc: "More field hospitals will save the lives of many soldiers, but only if they are staffed by trained surgeons and orderlies. A military medical school will train them at home, and its graduates will serve both the army and the civilian population."

    SER_fund_administration: "Fund the Administration"
    SER_fund_administration_desc: "Fiscal reform is the key to turning our finances around. The Ministry of Finance, under Kosta Cukić, will be given the funds and staff it needs to collect taxes fairly, keep proper accounts and prepare a modern currency."

    SER_begin_commercial_investment_banking: "Begin Commercial Investment Banking"
    SER_begin_commercial_investment_banking_desc: "Serbia has no proper banks, and its merchants and craftsmen borrow from usurers at ruinous rates. Commercial and investment banks will give citizens and small businesses access to the loans they need to grow."

    SER_introduce_bronze_coins: "Introduce Bronze Coins"
    SER_introduce_bronze_coins_desc: "Dozens of foreign coins circulate in Serbia, and their values change from town to town. Minting our own bronze coins, bearing the Prince's image, is the first step towards a national currency, and a powerful symbol of Serbian sovereignty."

    SER_first_serbian_bank: "First Serbian Bank"
    SER_first_serbian_bank_desc: "A national bank, the first in Serbia's history, will collect savings, issue loans and support the state's finances. It will centralise our banking and make the whole economy more efficient."

    SER_join_latin_monetary_union: "Join the Latin Monetary Union"
    SER_join_latin_monetary_union_desc: "France, Belgium, Italy and Switzerland have bound their currencies together in the Latin Monetary Union. By minting a silver dinar to the same standard as the franc, Serbia will gain a stable currency, easier trade with Western Europe and a place among the modern states."

    SER_develop_serbia_banking: "Develop Serbian Banking"
    SER_develop_serbia_banking_desc: "Our fiscal reforms have triumphed, but there is more to be done. New credit houses, a bank for the Danube trade and a proper law on minting will complete the foundation of a modern Serbian financial system."

    SER_kragujevac_technical_school: "Kragujevac Technical School"
    SER_kragujevac_technical_school_desc: "Kragujevac already has the foundry and the arsenal; now it will have a technical school worthy of them. Training engineers, mechanics and technicians at home will be costly, but it will give Serbia a centre of research and the skilled workers its industry needs."

    SER_educational_reform: "Educational Reform"
    SER_educational_reform_desc: "Education has long been a privilege for a few Serbs. It should be a right for all. A new school law will make primary education compulsory, train more teachers and open new gymnasiums and specialised schools across the country."

    SER_sima_andreevich_theological_teaching: "Prizren Seminary"
    SER_sima_andreevich_theological_teaching_desc: "Sima Andrejević Igumanov, a native of Prizren who made his fortune in the tobacco trade in Russia, wishes to found a seminary in his home town to educate priests, teachers and scholars for the Serbs of Old Serbia. With our support, it could become a beacon for the Serbs still living under Ottoman rule."

    SER_merchants_issue: "The Merchant Issue"
    SER_merchants_issue_desc: "Our merchants are being outcompeted by their Austrian rivals, who have better credit, better connections and commercial laws that protect them. If we are to save our trade, Serbian merchants need the same tools: clear commercial law, proper courts and access to credit."

    SER_jewish_merchant_discrimination: "Jewish Merchant Discrimination"
    SER_jewish_merchant_discrimination_desc: "Jealous rivals and some of our own newspapers have stirred up hatred against Belgrade's Jewish merchants, and old laws restrict where Jews may live and trade. The government must decide whether to enforce these laws or to protect a community that has long been part of Serbian commerce."

    SER_three_member_comittee: "Three-Member Committee"
    SER_three_member_comittee_desc: "The draft commercial code has passed between the Ministry, the State Council and the Commercial Committee for years. A three-member committee of the Ministry of Justice will make the final revisions and prepare the document for the Prince's signature."

    SER_1860_commercial_code: "1860 Commercial Code"
    SER_1860_commercial_code_desc: "After more than a decade of drafts and debates, Serbia will at last have a commercial code covering trade, companies, bills of exchange and commercial courts. It will put our merchants on an equal footing with their foreign partners."

    SER_anti_austrian_policiy: "Anti-Austrian Policy"
    SER_anti_austrian_policiy_desc: "Austria uses its commercial dominance to keep Serbia dependent: its merchants flood our markets, its river company controls the Danube and its customs officers decide what we may sell. Protecting Serbian trade will strain our relations with Vienna, but Serbia comes first."

    SER_deligrad_ship: "The Deligrad"
    SER_deligrad_ship_desc: "The Franco-Serbian company having failed, the government has bought a steamship of its own at Galaţi, together with eight barges. Renamed Deligrad after the great victory of the First Uprising, she is the first steamer to sail the Danube under the Serbian flag."

    SER_hand_to_defence_ministry: "Hand it to the Defence Ministry"
    SER_hand_to_defence_ministry_desc: "The Deligrad is too valuable to be left to a single trading venture. Placing her under the Ministry of War will give the army its first means of moving men and supplies along the Danube and the Sava."
    SER_decision_hand_it_to_the_ministry: "Hand it to the Defence Ministry"
    SER_decision_hand_it_to_the_ministry_desc: "Transfer the steamship Deligrad to the Ministry of War, laying the foundation of a Serbian river flotilla."

    SER_serbian_steam_navigation_company: "Serbian Steam Navigation Company"
    SER_serbian_steam_navigation_company_desc: "The First Danube Steamship Company of Austria carries almost all the traffic on our rivers and sets its prices as it pleases. A Serbian steam navigation company, backed by the state and by our merchants, will break that monopoly and keep the profits of our trade at home."

    SER_english_danube_company_request: "English Danube Company Request"
    SER_english_danube_company_request_desc: "An English steamship company has asked for the right to call at Serbian river ports and carry goods along our stretch of the Danube. Its presence would weaken the Austrian monopoly, but we must make sure it does not simply replace one foreign master with another."

    SER_navigate_morava_river: "Navigate the Morava River"
    SER_navigate_morava_river_desc: "The Morava is the spine of Serbia, yet its shallows, sandbanks and mills make it almost useless for shipping. Surveying the river, dredging its channel and clearing obstacles will open it to barges and small steamers from the Danube deep into the interior."

    SER_dig_topcider_river_quay: "Dig the Topčider River Quay"
    SER_dig_topcider_river_quay_desc: "A proper river quay near Topčider, on the Sava at Belgrade, would let barges and steamers load and unload quickly instead of waiting for days. It will serve both our merchants and, in time of war, our army."

    SER_begin_negotiations: "Begin Negotiations"
    SER_begin_negotiations_desc: "We cannot build steamships ourselves yet, so we must buy them. Negotiations with shipyards and governments abroad will find vessels suited to our rivers at a price we can afford."

    SER_purchase_steamships: "Purchase Steamships"
    SER_purchase_steamships_desc: "Our first purchase has proved its worth. Expanding our fleet with more foreign-built steamships will strengthen our trade and give us the beginnings of a river force of our own."

    SER_franco_serbian_navigation_company: "Franco-Serbian Navigation Company"
    SER_franco_serbian_navigation_company_desc: "After long negotiations we have founded a joint Franco-Serbian navigation company. With French ships and capital and Serbian ports and cargo, the future of Serbian navigation looks bright, provided the Austrians do not strangle it in its cradle."

    SER_allow_french_sail_danube: "Allow French Sailing along the Danube"
    SER_allow_french_sail_danube_desc: "France has asked that its trading companies be allowed to sail and trade along the Serbian stretch of the Danube. Granting the request will strengthen our friendship with Paris and bring welcome competition to the Austrian shippers."

    SER_salt_monopoly: "Salt Monopoly"
    SER_salt_monopoly_desc: "Captain Miša Anastasijević, the richest man in Serbia, has built his fortune on the salt trade from Wallachia. Expanding the state's partnership with him will give the treasury a share of his profits and use his fleet of river boats for the good of the country."

    SER_royal_serbian_shipyard: "Royal Serbian Shipyard"
    SER_royal_serbian_shipyard_desc: "With a number of steamships now in our hands, we need a shipyard to repair and eventually build them. A state shipyard on the Sava will be the home of the first Serbian river fleet."

    SER_serbian_flotilla_beginning: "Serbian Flotilla Beginning"
    SER_serbian_flotilla_beginning_desc: "Steamships, barges and pontoons now fly the Serbian flag on the Danube and the Sava. The river fleet has proved its worth in trade, and many believe that a Serbian naval force is here to stay."

    SER_begin_modernisation: "Begin Modernisation"
    SER_begin_modernisation_desc: "With schools, banks, mines and engineers of our own, Serbia now has the resources to move beyond its roots as a purely agrarian society. The age of Serbian industry begins."

