    SER_decision_category_saint_adrews_assembly_desc: "The Saint Andrew's Assembly has opened the struggle for the throne. Every speech, every bribe and every crowd in the streets shifts the balance between the Karađorđević and Obrenović factions. When the Assembly reaches its verdict, the faction with the upper hand will decide who rules Serbia."
    SER_mission_the_saint_adrews_assembly: "The Saint Andrew's Assembly"
    SER_mission_the_saint_adrews_assembly_desc: "The deputies cannot debate forever. Before the Assembly makes its decision, both factions will do everything in their power to win over the undecided."
    SER_decision_strengthen_dynasty: "Strengthen the Karađorđević Dynasty"
    SER_decision_strengthen_dynasty_desc: "Rally the Prince's supporters in the bureaucracy and the army, and remind the waverers who pays their salaries."
