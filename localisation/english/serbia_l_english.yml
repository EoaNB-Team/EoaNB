    ### CUKUR FOUNTAIN ###
    SER_decision_category_cukur: "The Čukur Fountain Incident"
    SER_decision_category_cukur_desc: "The bloodshed at the Čukur Fountain has turned Belgrade into a battlefield. How we respond to the crisis will decide whether the Ottoman garrisons stay or go."
    SER_begin_operation: "Begin a §CSpecial Military Operation§!"
    SER_begin_operation_desc: "Serbian troops are moving into Belgrade to restore order and contain the Ottoman garrison before the violence spreads any further."
    SER_declare_belgrade_siege: "Declare §CBelgrade§! in a State of §RSiege§!"
    SER_declare_belgrade_siege_desc: "Belgrade has been placed under a state of siege. Soldiers and volunteers are fortifying the town against the guns of the fortress and preparing for whatever comes next."
    SER_siege: "Belgrade is in a State of Siege"
    SER_ottoman_withdrawal: "We will withdraw from Serbia."
    SER_ottoman_withdrawal_desc: "§YSerbia§! will not become fully independent if you accept this mission, but it will be one more sign that [FROM.GetNameDef] is in decline. If you choose to fight instead, you may demand anything a peace conference allows, but besides §YSerbia§! you will also have to fight every §YGreat Power§! that chose to back its §Cindependence§!. Good luck!"
    SER_Great_power_intervention_tt: "is backing the independence of Serbia.\n"
    Serbian_War_Independence_Peace_Treaty_Mission_Serbia: "Peace Treaty Terms"
    Serbian_War_Independence_Peace_Treaty_Mission_Serbia_desc: "The Great Powers will not let this war drag on for long. If Belgrade and its fortress are still in our hands when this mission expires, the Porte will be forced to make peace and recognise our gains."

    ###Political Decisions
    SER_decision_strong_partisan: "Deal with the Partisans"
    SER_decision_strong_partisan_desc: "Bring the opposition's partisans into the streets of Belgrade to show the deputies, and the Prince, how many people stand behind the cause of change."
    SER_decision_appeal_masses: "Appeal to the Masses"
    SER_decision_appeal_masses_desc: "Send speakers into the markets, churchyards and village squares to rally the people behind the Assembly."
    SER_decision_improve_public_image: "Improve the Prince's Public Image"
    SER_decision_improve_public_image_desc: "Public appearances, charity and generous pardons could soften the Prince's reputation as a tool of the oligarchs and of Vienna."
    SER_decision_category_political: "Political Situation of Serbia"
    SER_decision_category_political_desc: "The internal politics of the principality: the struggle between the Prince, the State Council and the Assembly, and the conspirators who threaten the throne."
    SER_decision_foreign_relation_direction: "Direction of Foreign Relations"
    SER_decision_foreign_relation_direction_desc: "Garašanin's quarrel with the Prince has forced the question of Serbia's foreign allegiances into the open. It is time to decide which of the Great Powers we will court."
    SER_unlocked_foreign_tt: "Diplomatic actions have been unlocked."
    SER_mission_the_malogospojinska_assembly: "The Malogospojinska Assembly"
    SER_mission_the_malogospojinska_assembly_desc: "The first fully elected Assembly in Serbian history must prove that it can govern responsibly. If the state remains stable and the Civil Servants Law is in force before the Assembly adjourns, the new order will be firmly established."
    SER_decision_commercial_court: "Creation of the First Single Commercial Court"
    SER_decision_commercial_court_desc: "Establish a single commercial court in Belgrade, with judges and assessors versed in trade, to settle merchants' disputes quickly and fairly."
    SER_decisions_houses: "Sell Turkish Houses"
    SER_decisions_houses_desc: "We acquired the houses of the departing Turkish population at a low price. Selling them to our own people for a little more will help fill the budget."
    SER_decisions_buy: "Buy Some Land"
    SER_decisions_buy_desc: "Purchase land for state and military use."
    SER_decision_category_balkan_politics: "Balkan Affairs"
    SER_decision_category_balkan_politics_desc: "Our network of alliances and contacts across the Balkans. Treaties with our neighbours and support for the peoples still under Ottoman rule will prepare the ground for the war of liberation."
    SER_decision_support_albanians: "Aid the Albanian Resistance"
    SER_decision_support_albanians_desc: "Smuggle money and weapons to the Albanian clans who resist the Porte's tax collectors and recruiting officers."
    SER_decision_ljubomir_ivanovic: "Send Captain Ljubomir Ivanović to Albania"
    SER_decision_ljubomir_ivanovic_desc: "Send Captain Ljubomir Ivanović across the border with a shipment of our own rifles to help organise the Albanian resistance."
    SER_decision_voslau_treaty: "The Vöslau Treaty"
    SER_decision_voslau_treaty_desc: "Send our envoys to meet the Greek delegation at Vöslau and propose a formal alliance against the Porte."
    SER_decision_churches_macedonia: "Support the Orthodox in Macedonia"
    SER_decision_churches_macedonia_desc: "Fund the repair of Orthodox churches and the salaries of Serbian priests in Macedonia, strengthening our influence among its Christians."
    SER_decision_finance_schools: "Finance Schools in Macedonia"
    SER_decision_finance_schools_desc: "Pay for Serbian schools, teachers and textbooks in Macedonia, so that the next generation grows up looking to Belgrade."
    SER_decision_raise_first_bulgarian_legion: "Raise the First Bulgarian Legion"
    SER_decision_raise_first_bulgarian_legion_desc: "Arm the Bulgarian volunteers in Serbia and send them to raise their homeland against the Ottomans while our army holds the line."
    SER_imprison_pro_russian_supporters: "Imprison Pro-Russian Supporters"
    SER_imprison_pro_russian_supporters_desc: "Arrest the most outspoken Russophiles in the administration and the army. St. Petersburg will protest, and our stability will suffer for a while, but the government will be rid of men who take their orders from the Russian consulate."
    SER_forced_resignation_decision: "Force the Council's Resignation"
    SER_forced_resignation_decision_desc: "Force the councillors implicated in the plot against the Prince to resign their seats."
    SER_trusted_councillors: "Install Trusted Councillors"
    SER_trusted_councillors_desc: "Fill the vacant seats of the State Council with men of proven loyalty to the throne. The Porte, which regards the Council as its guarantee, will not be pleased."
    SER_purged_council: "Has Purged the Council"
    SER_decision_category_maistorovich_affair: "The Majstorović Affair"
    SER_decision_category_maistorovich_affair_desc: "Conspirators loyal to the exiled Karađorđević family are preparing to strike against the Prince. Our police must find and break up their cells in the towns of the interior before the plot can be carried out."
    SER_decision_police_smederevo: "Concentrate Police Units in Smederevo"
    SER_decision_police_smederevo_desc: "Move police and gendarmes into Smederevo, where the conspirators have friends among the merchants and former officials."
    SER_focus_police_kragujevac: "Concentrate Police Units in Kragujevac"
    SER_focus_police_kragujevac_desc: "Move police and gendarmes into Kragujevac, where the arsenal and the foundry make any conspiracy doubly dangerous."
    SER_focus_police_posarevac: "Concentrate Police Units in Požarevac"
    SER_focus_police_posarevac_desc: "Move police and gendarmes into Požarevac, where the conspirators are said to be gathering weapons."
    SER_doing_police_mission_tt: "No active police decision."
    SER_mission_maistorovich_coup: "Coup Attempt"
    SER_mission_maistorovich_coup_desc: "The conspirators have set a date. If our police can pacify the towns where they gather before then, the plot will be exposed. If not, the Prince's life will be in grave danger."
    SER_pacified_cities_tt: "Pacifies the coup perpetrators in the area."
    SER_coup_effect_tt: "The results of the coup attempt will be revealed."
    SER_pacified_cities_all_tt: "Has pacified all the cities."

    #Army Decisions
    SER_decision_category_french_mission: "Serbian Army Reforms"
    SER_decision_category_french_mission_desc: "The Serbian army is small, poorly armed and not ready to defend the country's borders. During the Crimean War, the French officer Hippolyte Mondain impressed us with his plans for the defence of Serbia, and he has now been invited back to lead our reforms. Just as important is one of our own officers, Milivoje Blaznavac, who may one day succeed him."
    SER_mission_army_modernization: "Modernisation of the Serbian Army"
    SER_mission_mondain_army_reforms: "Hippolyte Mondain's Army Reform"
    SER_mission_mondain_army_reforms_desc: "Mondain has been given five years to transform our army. To succeed, we must keep him at the head of our military thought, stockpile rifles for the new regiments, broaden conscription and fund the army properly. If we fail, he will leave with his work unfinished."
    SER_decision_kragujevac_fortress_renovation: "Renovation of Kragujevac Fortress"
    SER_decision_kragujevac_fortress_renovation_desc: "Restore the old fortifications of Kragujevac to protect the arsenal and the cannon foundry."
    SER_decision_purchase_foreign_firearms: "Purchase Foreign Firearms"
    SER_decision_purchase_foreign_firearms_desc: "Buy a consignment of rifles from our foreign suppliers to arm the new regiments."
    SER_decision_purchase_support_equipment: "Purchase Foreign Support Equipment"
    SER_decision_purchase_support_equipment_desc: "Order wagons, tools, field kitchens and other support equipment from abroad."
    SER_decision_purchase_foreign_artillery: "Purchase French Artillery"
    SER_decision_purchase_foreign_artillery_desc: "Buy modern rifled guns of the La Hitte system from France."
    SER_decree_on_state_armory: "Decree on the State Armory - Kragujevac"
    SER_decree_on_state_armory_desc: "Issue a decree founding a state armory at Kragujevac to manufacture and repair weapons for the whole army."
    SER_decision_zajecar_fortification: "Zaječar Fortress"
    SER_decision_zajecar_fortification_desc: "Build the earthworks and redoubts designed by Mondain to guard Zaječar and the Timok valley."
    SER_decision_danube_forts: "Danube Forts"
    SER_decision_danube_forts_desc: "Build fortified posts along the Danube to guard the river crossings."
    SER_decision_belgrad_fortification: "Fortifications of Belgrade"
    SER_decision_belgrad_fortification_desc: "Construct a ring of field fortifications on the heights around Belgrade."
    SER_stragari_gunpodwer_magazine: "Rise of the Stragari Gunpowder Magazine"
    SER_stragari_gunpodwer_magazine_desc: "Rebuild the Stragari works so that they produce gunpowder in quantity instead of merely storing it."
    SER_decision_increase_army_budget: "Increase the Army Budget"
    SER_decision_increase_army_budget_desc: "Raise the army's share of the budget. The taxpayers will not thank us, but Mondain's reforms cannot be carried out on promises alone."
    SER_decision_belgrade_infantry_exercises: "Infantry Exercises in Belgrade with Kosta Protić"
    SER_decision_belgrade_infantry_exercises_desc: "Hold large-scale infantry manoeuvres outside Belgrade under Kosta Protić, testing the regiments' drill and their commanders."
    SER_decision_belgrade_artillery_exercises: "Artillery Training Outside the Capital"
    SER_decision_belgrade_artillery_exercises_desc: "Take the batteries of the Belgrade garrison into the countryside for live-fire training."
    SER_decision_franco_prussian_observer: "Send Milojko Lešjanin to Prussia"
    SER_decision_franco_prussian_observer_desc: "Send Milojko Lešjanin to observe the Prussian army, its staff work and its rifled artillery at first hand."
    SER_decision_franco_prussian_observer_fra: "Send Sava Grujić to France"
    SER_decision_franco_prussian_observer_fra_desc: "Send Sava Grujić to observe the French army and its new breech-loading rifles."
    SER_decision_military_foundry: "Expand the Military Foundries"
    SER_decision_military_foundry_desc: "Equip the foundries of Kragujevac with new machinery and bring in skilled workers from abroad."

    #Economy Decisions
    SER_decision_category_foreign_geologists: "Hire Foreign Geologists"
    SER_decision_category_foreign_geologists_desc: "Foreign geologists invited by the government are exploring the mineral wealth of Serbia. Every expedition adds to our knowledge, and to our resources."
    SER_decision_invite_abroad_serbs: "Invite Serbs from Abroad"
    SER_decision_invite_abroad_serbs_desc: "Offer posts and good salaries to Serbian engineers and scholars working abroad, above all in the Habsburg lands, to bring them home to serve the principality."
    SER_decision_b_cotta_explore_northeast_serbia: "Bernhard von Cotta Explores Northeastern Serbia"
    SER_decision_b_cotta_explore_northeast_serbia_desc: "Invite the Saxon geologist Bernhard von Cotta, renowned for his studies of ore deposits, to survey the mining districts of northeastern Serbia."
    SER_decision_ferdinand_von_holchstetter_explore_southeast: "Ferdinand von Hochstetter Explores Southeastern Serbia"
    SER_decision_ferdinand_von_holchstetter_explore_southeast_desc: "Invite the Austrian geologist Ferdinand von Hochstetter, famous for his explorations of New Zealand and the Ottoman Balkans, to examine the geology of southeastern Serbia."
    SER_decision_emil_teze_conduct_research: "Emil Tietze's Geological Research"
    SER_decision_emil_teze_conduct_research_desc: "Commission the Austrian geologist Emil Tietze to study the rock formations and ore deposits of eastern Serbia."
    SER_decision_unemployment_problem: "Unemployment Problem"
    SER_decision_unemployment_problem_desc: "Public works, credit for craftsmen and relief for the destitute will put people back to work and ease the crisis."
    SER_decision_fight_inflation: "Fight Inflation"
    SER_decision_fight_inflation_desc: "Limit the issue of credit and the circulation of debased foreign coin to bring rising prices under control."
    SER_decision_problematic_recession: "Problematic Recession"
    SER_decision_problematic_recession_desc: "Help struggling merchants and workshops through the recession with tax relief and cheap state loans."
    SER_decision_succed_reforms: "Complete the Financial Reform"
    SER_decision_succed_reforms_desc: "With the worst of the crisis behind us, the last emergency measures can be lifted and the economy returned to normal."
    SER_decision_dig_tocider_river_quay: "Topčider River Quay"
    SER_decision_dig_tocider_river_quay_desc: "Build a proper river quay at Topčider so that barges and steamers can load and unload quickly."
    SER_decision_category_purchase_steamship: "Purchase Foreign River Steamships"
    SER_decision_category_purchase_steamship_desc: "Our negotiations have opened the way to buying river steamers abroad. Each new ship strengthens our trade and the beginnings of a Serbian flotilla."
    SER_decision_stari_kostolac_quarry: "Stari Kostolac Quarry"
    SER_decision_stari_kostolac_quarry_desc: "Invest in the Stari Kostolac coal pit, sinking new shafts and building a loading quay on the Danube."
    SER_decision_SER_kucajna_mine: "Kučajna Mine"
    SER_decision_SER_kucajna_mine_desc: "Invest in the mines of Kučajna to turn Felix Hofmann's struggling venture into a profitable enterprise."
    SER_decision_plant_tree: "Plant New Trees"
    SER_decision_plant_tree_desc: "Mobilise villagers to replant the cleared hillsides. It will take labour away from the fields, but our grandchildren will thank us."
    SER_decision_reduce_wood_use: "Reduce the Use of Wood"
    SER_decision_reduce_wood_use_desc: "Regulate logging and encourage coal as a fuel, giving our forests time to recover."
    SER_decision_category_banking: "Financial Development of Serbia"
    SER_decision_category_banking_desc: "The financial institutions of the young Serbian state: banks, credit houses and a national currency of our own."
    SER_decision_belgrade_credit_house: "Belgrade Credit House"
    SER_decision_belgrade_credit_house_desc: "Found a credit house in Belgrade to lend to merchants and craftsmen at fair rates, breaking the hold of the usurers."
    SER_decision_serbian_danube_bank: "Serbian Danube Bank"
    SER_decision_serbian_danube_bank_desc: "Found a bank to finance the Danube trade, the river ports and the shipping companies that serve them."
    SER_decision_category_lyumbomir_kleric: "Ljubomir Klerić's Projects"
    SER_decision_category_lyumbomir_kleric_desc: "Ljubomir Klerić is one of the most inventive minds in Serbia. Each of his projects - surveys, inventions and textbooks - advances our knowledge of mining and engineering, but he can only work on one of them at a time."
    SER_decision_examine_african_iron: "Examine the Algerian Iron Mine"
    SER_decision_examine_african_iron_desc: "Allow Klerić to travel to Oran in Algeria on behalf of a foreign mining company to examine an iron deposit. The experience he gains abroad will benefit our own surveys."
    SER_decision_explore_awala_deposit: "Explore the Avala Deposit"
    SER_decision_explore_awala_deposit_desc: "Send Klerić to survey the mercury deposits of Mount Avala near Belgrade."
    SER_decision_patent_polar_pantograph: "Patent the Polar Pantograph"
    SER_decision_patent_polar_pantograph_desc: "Help Klerić patent his polar pantograph, an ingenious instrument for copying and scaling technical drawings."
    SER_decision_patent_mud_drill: "Patent the Mud Drill"
    SER_decision_patent_mud_drill_desc: "Help Klerić patent his drill for boring through soft and waterlogged ground."
    SER_decision_patent_deep_well_drill: "Patent the Deep Well Drill"
    SER_decision_patent_deep_well_drill_desc: "Help Klerić patent his new drill for deep wells and exploratory boreholes, of great use in mining and water supply."
    SER_decision_scientific_paper_textbook: "Publish Scientific Textbooks"
    SER_decision_scientific_paper_textbook_desc: "Have Klerić write and publish textbooks on mechanics and mining for the students of the Great School."
    SER_decision_stone_breaking_device_inventions: "Stone-Breaking Device Inventions"
    SER_decision_stone_breaking_device_inventions_desc: "Fund Klerić's work on a mechanical rock breaker for mines and quarries."
    SER_mission_financy_reform: "Serbian Fiscal Reform"
    SER_mission_financy_reform_desc: "Kosta Cukić's reform will give Serbia a modern currency and sound public finances. To complete it, Cukić must remain in office, Serbia must adopt the Latin Monetary standard, and our economists must master the new continental theories of economics before the deadline."
    SER_decision_increase_taxes: "Increase Funds for the Administration"
    SER_decision_increase_taxes_desc: "Raise taxes to pay for the expanded staff and offices of the Ministry of Finance."
    SER_decision_law_on_minting_coinage: "The Act on Minting Serbian Silver Coin"
    SER_decision_law_on_minting_coinage_desc: "Pass the law establishing the silver dinar as Serbia's national currency, minted to the standard of the French franc."
    SER_decision_coordinate_policy: "Coordinate Budget Policy"
    SER_decision_coordinate_policy_desc: "Bring the spending of every ministry under a single budget, approved in advance and audited afterwards."
    SER_decision_new_agricultural_model: "New Agricultural Model"
    SER_decision_new_agricultural_model_desc: "Encourage new crops, better tools and modern methods of cultivation on peasant holdings."
    SER_decision_measured_working_hours: "Measured Working Hours"
    SER_decision_measured_working_hours_desc: "Limit working hours in workshops and mines, calming the workers and improving their productivity."
    SER_decision_encourage_farmers_coop: "Encourage Farmers' Cooperatives"
    SER_decision_encourage_farmers_coop_desc: "Help peasants and craftsmen form cooperatives to buy, sell and borrow together, ending the boycott and the strikes."
    SER_decision_succed_reforms2: "Complete the Financial Reform"
    SER_decision_succed_reforms2_desc: "Our reforms have done their work. The last emergency measures can be lifted and the reformed institutions left to run on their own."
    SER_decision_new_capitals: "New Capital"
    SER_decision_new_capitals_desc: "Use the capital provided by our foreign partners to rebuild credit and restart idle workshops."
    SER_decision_new_foreign_investors: "New Foreign Investors"
    SER_decision_new_foreign_investors_desc: "Invite foreign investors into Serbian mines, trade and transport, with state guarantees for their capital."
    SER_decision_revitalising_eco: "Revitalise the Economy"
    SER_decision_revitalising_eco_desc: "Put the new capital to work restarting production, ending the boycotts and settling the strikes."
    SER_decision_crisis_over: "Serbia Out of the Crisis"
    SER_decision_crisis_over_desc: "Declare the crisis over and lift the emergency measures. Our foreign partners will expect to be repaid."
    SER_decision_spend_austro_dosh: "Circulate Austrian Capital in the Serbian Economy"
    SER_decision_spend_austro_dosh_desc: "Channel the Austrian loan into the Serbian economy. It will ease the crisis, but leave us in Vienna's debt for years."
    SER_decision_higher_interest: "Higher Interest Rates"
    SER_decision_higher_interest_desc: "Raise the interest rates on state lending to encourage saving and slow the rise in prices."
    SER_decision_control_money_supply: "Control the Money Supply"
    SER_decision_control_money_supply_desc: "Restrict the circulation of foreign coin and state credit to bring inflation under control."
    SER_decision_crisis_contained: "Contain the Crisis"
    SER_decision_crisis_contained_desc: "Having met the people's demands, we can declare the crisis contained and send the protesters home."
    SER_decision_crisis_stabalised: "Stabilise the Crisis"
    SER_decision_crisis_stabalised_desc: "Pay the wages owed to the strikers and restore normal economic life, whatever it costs."
    SER_decision_purchase_steamship: "Purchase Foreign Steamships"
    SER_decision_purchase_steamship_desc: "Buy another river steamer from a British shipyard, along with the know-how to operate and maintain her."

    #SPIRITS

    SER_idea_Internal_Conflicts: "Internal Conflicts"
    SER_idea_1838constitution: "1838 Constitution"
    SER_idea_1838constitution_desc: "The Constitution of 1838, better known as the 'Turkish Constitution', was issued by the Sultan and guaranteed by Russia. It created a State Council of seventeen members appointed for life, who could only be removed with the Porte's consent, to keep the Prince in check. Miloš Obrenović abdicated in favour of his sons rather than rule under it, and it remains the foundation of the current regime - and a constant reminder that Serbia is still subordinate to Constantinople."
    SER_idea_1838constitution_2: "Weakened 1838 Constitution"
    SER_idea_1838constitution_2_desc: "Through careful diplomacy and selective obedience, the 'Turkish Constitution' has been weakened. The Council no longer dares to obstruct the Prince openly, though the old institutions still slow down every reform."
    SER_idea_1838constitution_3: "Bureaucratised 1838 Constitution"
    SER_idea_1838constitution_3_desc: "By reorganising the administration, the Prince has turned the institutions of the 1838 Constitution into instruments of his own power. The government works more efficiently than ever, but the opposition resents the change bitterly."
    SER_idea_serbianarmy: "Garnizono Vojinstvo"
    SER_idea_serbianarmy_desc: "Serbia's regular army, the 'garrison soldiery', is a small force of a few thousand men, poorly armed and scattered among the towns, while Ottoman fortresses still dominate the country. Most Serbs have never been trained to fight, and the government could call on very few soldiers in an emergency."
    SER_idea_serbianarmy1: "Garnizono Vojinstvo"
    SER_idea_serbianarmy1_desc: "The National Army is taking shape, but the legacy of the old garrison system still weighs on our military. Training is irregular, weapons are scarce, and the reserves are not yet ready for war."
    SER_idea_alliance: "The Balkan Alliance"
    SER_idea_alliance_desc: "An alliance of Serbia, Montenegro, Greece and the Romanian principalities, created to defeat the Ottomans and free their peoples from the Sultan's rule."
    SER_idea_dual_government_of_belgrade: "Dual Government of Belgrade"
    SER_idea_dual_government_of_belgrade_desc: "Belgrade has two masters: the Serbian authorities in the town, and the Ottoman pasha in the fortress, whose garrison and Muslim quarter answer only to the Porte. The mistrust sown by the fall of the First Uprising has never healed, disputes between Serbs and Turks are a daily occurrence, and every incident threatens to end in bloodshed. If nothing is done, the people will lose all faith in the government."
    SER_idea_the_sultans_watchful_eyes: "The Sultan's Watchful Eyes"
    SER_idea_the_sultans_watchful_eyes_desc: "At the heart of Serbia, in the fortress of Belgrade, sits the Sultan's pasha with his garrison, and Ottoman troops still hold several other fortresses across the principality. As long as they remain, we have little freedom in our internal or foreign policy, and must keep our heads down until the opportunity comes."
    SER_idea_legacy_of_the_serbian_uprisings: "Legacy of the Serbian Uprisings"
    SER_idea_legacy_of_the_serbian_uprisings_desc: "The uprisings of 1804 and 1815 live on in songs, in the memories of their veterans and in the pride of every village. Against all odds the Serbs rose against their overlords in the hope of liberty, and their sacrifice will be remembered until the last Ottoman soldier has left our land."
    SER_idea_legacy_of_the_serbian_uprisings1: "Legacy of the Serbian Uprisings"
    SER_idea_legacy_of_the_serbian_uprisings1_desc: "The spirit of the uprisings has been rekindled. With allies across the Balkans and an army prepared for war, the Serbs are ready to rise once more and finish the work that Karađorđe and Miloš began."
    SER_idea_educated_austrian_serbs: "Austrian-Educated Serbians"
    SER_idea_educated_austrian_serbs_desc: "In the 18th and 19th centuries, Serbian communities of merchants, officers and students grew up in the great cities of the Habsburg monarchy, under the spiritual authority of the Metropolitanate of Karlovci. Many of the best-educated Serbs live in Vojvodina, across the Danube, and in Vienna and Pest. Now they are returning to serve in the principality's schools, courts and ministries."
    SER_idea_civil_war: "Fight until the End"
    SER_idea_civil_war_desc: "Serbia is at war with itself. Every district must choose a side, and neither side can afford to give up."
    #Military Ideas
    SER_idea_mondain_reform: "Mondain's Army Reform"
    SER_idea_mondain_reform_desc: "Hippolyte Florentin Mondain, a French officer who first came to Serbia during the Crimean War, has been invited back to lead the newly formed Ministry of War. He is reorganising the army of the principality on the French model, from its staff and regulations to the training of officers and recruits, laying the foundation on which it will develop for decades."
    SER_idea_mondain_reform1: "Mondain's Army Reform"
    SER_idea_mondain_reform1_desc: "With the artillery reorganised under a single administration and František Zach at the head of its schools, Mondain's reforms have entered their second phase. Our gunners are better trained, our batteries better organised, and the army is learning to fight as a modern force."
    SER_idea_army_corruption: "Army Political Influence"
    SER_idea_army_corruption_desc: "Under Blaznavac, the army has become a political force in its own right. Its officers sit in the ministries and its contracts enrich their friends. The country is ready for war, but the politicians fear the generals, and corruption is spreading."
    SER_idea_army_corruption1: "Army Political Influence"
    SER_idea_army_corruption1_desc: "The army's role in politics has been brought into the open and partly regulated. Its influence is still great, but the worst abuses are being curbed."
    SER_idea_army_corruption2: "Army Political Influence"
    SER_idea_army_corruption2_desc: "With the corruption affair exposed and the guilty punished, the army's political influence has become more restrained, though it still casts a long shadow over the government."
    SER_idea_prepare_for_war: "On The Road to War"
    SER_idea_prepare_for_war_desc: "The country is mobilising. Conscripts are reporting to their units, the depots are being filled and the drill grounds are crowded day and night. Training is being cut short to get men to the front as quickly as possible."
    SER_idea_russian_industry_help: "Heavy Industry Help from Russia"
    SER_idea_russian_industry_help_desc: "Russian money and engineers are helping us expand our arsenals and foundries. With the help of our Slavic brothers, we will in the end emerge victorious."
    SER_idea_grujic_war_plan: "Major Grujić's War Plan"
    SER_idea_grujic_war_plan_desc: "On 4 November 1876, at a critical moment for the principality, Colonel Sava Grujić was appointed Minister of War in the cabinet of Stevča Mihailović. He reorganised the army into five active corps and one reserve corps, and realised that the Serbian militia needed a firmer backbone. In the first war Prince Milan had kept the standing army out of combat, seeing it chiefly as the protection of his dynasty; Grujić split it into smaller units that served as cadres for the militia, led by officers who had proven their courage and skill. His reforms turned the standing army into the core of a much stronger Serbian fighting force."
    #Economy Ideas
    SER_idea_improve_mining_conditions: "Advancement of Mining and Industry Technologies"
    SER_idea_improve_mining_conditions_desc: "New pumps, ventilation and hoisting machinery are making our mines safer and more productive, and our engineers are learning to adapt quickly to new methods of work."
    SER_idea_improve_mining_conditions1: "Advancement of Mining and Industry Technologies"
    SER_idea_improve_mining_conditions1_desc: "With Serbian geologists and mining engineers now trained at home under Jovan Žujović, our mines no longer depend on foreign experts, and research into the extraction of our resources is advancing rapidly."
    SER_idea_european_architecture1: "Captain Miša's Mansion"
    SER_idea_european_architecture1_desc: "Captain Miša's 'Venetian Palace' has shown Belgrade what modern European architecture can look like, and its example is inspiring builders and patrons across the city."
    SER_idea_european_architecture2: "European Style Architecture"
    SER_idea_european_architecture2_desc: "Schools, ministries and townhouses in the European style are transforming Belgrade and the provincial towns. Our builders have mastered new materials and methods, and the state's prestige grows with every new façade."
    SER_idea_blagojev_gold_mine: "Blagojev Kamen Gold Mine"
    SER_idea_blagojev_gold_mine_desc: "As the country develops, we keep discovering rich ore deposits. The old gold workings of Blagojev Kamen are in operation once more, adding precious metal to the treasury and new knowledge to our schools."
    SER_idea_widespread_bankrupcies: "Frequent Bankruptcies"
    SER_idea_widespread_bankrupcies_desc: "Under the Defenders of the Constitution, usurious interest rates soared to 300%, and bankruptcies among small traders and peasants were widespread. The regime did almost nothing to promote economic development or a proper credit system, rejecting every proposal for a note-issuing bank. Worse, it ran permanent deficits covered from the state reserve, the 'immovable chest', which also lent money to the public. Its cash shrank from 380,000 ducats to barely 25,000, while outstanding debts rose to 266,000 ducats."
    SER_idea_widespread_bankrupcies2: "Frequent Bankruptcies"
    SER_idea_widespread_bankrupcies2_desc: "The first measures against the crisis are taking effect. Fewer businesses are failing each month, but credit remains scarce, prices unstable and the treasury nearly empty."
    SER_idea_widespread_bankrupcies3: "Frequent Bankruptcies"
    SER_idea_widespread_bankrupcies3_desc: "The worst of the bankruptcy wave has passed. Workshops are reopening and merchants are cautiously extending credit again, though the economy is still fragile and inflation persists."
    SER_idea_widespread_bankrupcies4: "Frequent Bankruptcies"
    SER_idea_widespread_bankrupcies4_desc: "The economy is recovering, and the reforms have even left our industry more efficient than before. A few final measures will be enough to put the crisis behind us for good."
    SER_idea_poor_standar_of_life: "Poor Standard of Life"
    SER_idea_poor_standar_of_life_desc: "Most Serbs live in timber or mud-brick houses without proper sanitation, epidemics are frequent and infant mortality is high. Poverty and disease sap the strength of the nation and make every reform harder."
    SER_idea_navigate_morava_river: "Navigation on the Morava River"
    SER_idea_navigate_morava_river_desc: "With its channel surveyed and cleared, the Morava now carries barges deep into the interior, making it far cheaper to move building materials and goods."
    SER_idea_navigate_morava_river1: "Navigation on the Morava River"
    SER_idea_navigate_morava_river1_desc: "With a state shipyard to build and repair river craft, traffic on the Morava has grown into a steady trade that benefits the whole interior."
    SER_idea_salt_monopoly: "Salt Monopoly"
    SER_idea_salt_monopoly_desc: "The state's partnership with Captain Miša Anastasijević gives the treasury a share of the salt trade from Wallachia and puts his fleet of river boats at the service of the country."
    SER_idea_royal_serbian_shipyard: "River Shipyards"
    SER_idea_royal_serbian_shipyard_desc: "The state shipyard on the Sava repairs our steamers and barges and is beginning to build vessels of its own, giving our merchants better access to the river trade."
    SER_idea_serbian_flotilla_beginning: "Serbian River Flotilla"
    SER_idea_serbian_flotilla_beginning_desc: "Steamers, barges and pontoons under the Serbian flag now ply the Danube and the Sava, carrying our goods to foreign markets and forming the nucleus of a future river flotilla."
    SER_idea_explore_serbian_geology: "Serbian Geology"
    SER_idea_explore_serbian_geology_desc: "Geologists invited by the government are surveying the principality, and their findings are already guiding the building of roads and mines."
    SER_idea_review_ami_boue_works: "Review Ami Boué's Works"
    SER_idea_review_ami_boue_works_desc: "Ami Boué, born in Hamburg to a Huguenot family, educated in Edinburgh and settled in Vienna, was one of the pioneers of geology. In 1820 he published a geological study of Scotland, and between 1836 and 1838 he travelled the Balkan Peninsula with the topographer Auguste Viquesnel, carrying out lengthy naturalistic and ethnographic research. His great work on European Turkey remains the starting point for anyone studying our lands."
    SER_idea_improve_credit_organisation: "First Credit Organisations"
    SER_idea_improve_credit_organisation_desc: "The state no longer lends directly from its own reserves. The first credit institutions are taking over that role, freeing the treasury and offering farmers and craftsmen an alternative to the usurers."
    SER_idea_improve_credit_organisation1: "First Credit Organisations"
    SER_idea_improve_credit_organisation1_desc: "Modelled on the French example, our credit institutions are growing in number and reputation, and foreign investors are beginning to take Serbian finance seriously."
    SER_idea_improve_credit_organisation2: "First Credit Organisations"
    SER_idea_improve_credit_organisation2_desc: "Our credit system serves the smallholder and the craftsman first. Cheap loans and protection from usury are helping Serbian families prosper and grow."
    SER_idea_improve_credit_organisation3: "First Credit Organisations"
    SER_idea_improve_credit_organisation3_desc: "Credit is flowing into factories, mines and workshops. Industry is growing quickly, even if many in the villages feel left behind."
    SER_idea_first_serbian_bank: "First Serbian Bank"
    SER_idea_first_serbian_bank_desc: "The first Serbian bank has opened its doors, collecting savings, issuing loans and helping the state manage its finances more efficiently."
    SER_idea_kragujevac_technical_school: "Kragujevac Technical School"
    SER_idea_kragujevac_technical_school_desc: "The new technical school in Kragujevac trains engineers, mechanics and technicians beside the foundry and the arsenal, giving Serbia a centre of applied research."
    SER_idea_use_coal: "Increased Use of Coal"
    SER_idea_use_coal_desc: "Coal from our own pits is fuelling workshops, steamers and even households, making our industry more efficient and less dependent on scarce materials."
    SER_idea_army_investment: "Serbian Army Investment"
    SER_idea_army_investment_desc: "Loans from abroad are being invested in the army's infrastructure: depots, military roads and the first railway lines needed to move troops to the frontier."
    SER_idea_foreign_geologist_1: "Foreign Geologists"
    SER_idea_foreign_geologist_1_desc: "The first foreign geologists have begun their surveys, and their findings are already improving how we build and what we extract."
    SER_idea_foreign_geologist_2: "Foreign Geologists"
    SER_idea_foreign_geologist_2_desc: "More expeditions have mapped new deposits of coal and ore across the principality, and our resource output is rising accordingly."
    SER_idea_foreign_geologist_3: "Foreign Geologists"
    SER_idea_foreign_geologist_3_desc: "The surveys of Europe's leading geologists have given us a detailed picture of Serbia's mineral wealth, and we are exploiting it more fully than ever."
    SER_idea_lyubomir_1: "Klerić's Engineering Works"
    SER_idea_lyubomir_1_desc: "Ljubomir Klerić's first inventions are already improving the way our mines are surveyed and worked."
    SER_idea_lyubomir_2: "Klerić's Engineering Works"
    SER_idea_lyubomir_2_desc: "Klerić's growing list of patents and publications is spreading modern methods through our mines and quarries."
    SER_idea_lyubomir_3: "Klerić's Engineering Works"
    SER_idea_lyubomir_3_desc: "Klerić's drills and instruments are now in regular use across Serbia, and his students are carrying his methods into the field."
    SER_idea_lyubomir_4: "Klerić's Engineering Works"
    SER_idea_lyubomir_4_desc: "Klerić's inventions have earned patents across Europe, and his reputation brings foreign attention and capital to Serbian mining."
    SER_idea_lyubomir_5: "Klerić's Engineering Works"
    SER_idea_lyubomir_5_desc: "Ljubomir Klerić has become one of the most celebrated engineers in the Balkans, and his life's work has transformed Serbian mining."
    SER_idea_lyubomir_0a: "Klerić's Engineering Works"
    SER_idea_lyubomir_0a_desc: "Klerić's survey of an iron mine in Algeria has given him valuable experience of large-scale ore deposits, which he is now applying at home."
    SER_idea_lyubomir_1a: "Klerić's Engineering Works"
    SER_idea_lyubomir_1a_desc: "Combining his early inventions with the experience gained in Algeria, Klerić is improving the way our iron deposits are assessed and worked."
    SER_idea_lyubomir_2a: "Klerić's Engineering Works"
    SER_idea_lyubomir_2a_desc: "Klerić's patents and his experience abroad complement each other, making our mining surveys faster and more reliable."
    SER_idea_lyubomir_3a: "Klerić's Engineering Works"
    SER_idea_lyubomir_3a_desc: "Klerić's tools and his knowledge of foreign mines are now standard in Serbian mining, and output is rising steadily."
    SER_idea_lyubomir_4a: "Klerić's Engineering Works"
    SER_idea_lyubomir_4a_desc: "Klerić's international reputation, built on his inventions and his work abroad, is opening doors for Serbian mining across Europe."
    SER_idea_lyubomir_5a: "Klerić's Engineering Works"
    SER_idea_lyubomir_5a_desc: "Drawing on a lifetime of invention and experience in mines at home and abroad, Klerić has made Serbian mining among the most modern in the Balkans."
    SER_idea_lyubomir_0b: "Klerić's Engineering Works"
    SER_idea_lyubomir_0b_desc: "Klerić's survey of Mount Avala, building on his experience abroad, has revealed how the mercury deposits near the capital can best be exploited."
    SER_idea_lyubomir_1b: "Klerić's Engineering Works"
    SER_idea_lyubomir_1b_desc: "With the Avala survey complete and his first inventions in use, Klerić has given our mines both new deposits and new tools."
    SER_idea_lyubomir_2b: "Klerić's Engineering Works"
    SER_idea_lyubomir_2b_desc: "Klerić's surveys at home and abroad, together with his growing list of patents, are steadily increasing the output of our mines."
    SER_idea_lyubomir_3b: "Klerić's Engineering Works"
    SER_idea_lyubomir_3b_desc: "Avala, Algeria and a workshop full of inventions: Klerić's varied career is paying off in every mine in Serbia."
    SER_idea_lyubomir_4b: "Klerić's Engineering Works"
    SER_idea_lyubomir_4b_desc: "Klerić's surveys and inventions have made our resource extraction among the most efficient in the region."
    SER_idea_lyubomir_5b: "Klerić's Engineering Works"
    SER_idea_lyubomir_5b_desc: "Ljubomir Klerić's surveys, inventions and teaching have left a permanent mark on Serbian mining. Few men have done more for the industry of their country."
    SER_idea_protests: "Peaceful Protests"
    SER_idea_protests_desc: "Craftsmen, apprentices and ruined traders are protesting in the streets of Belgrade against the usurers and the rising cost of living. Order is holding, for now."
    SER_idea_worker_strikes: "Worker Strikes"
    SER_idea_worker_strikes_desc: "Workers across the country have laid down their tools, demanding the wages they are owed. Workshops are idle and tempers are running high."
    SER_idea_boycott: "Labourers Boycott Goods"
    SER_idea_boycott_desc: "The strikers' boycott has spread across the country. Workshops cannot sell their goods, and production has collapsed."
    SER_idea_economic_dependency: "Economic Dependency"
    SER_idea_economic_dependency_desc: "Foreign credit has rescued us from the crisis, but at a heavy price. Our creditors' interests come first, a large share of our revenue goes to paying them, and our economic policy is no longer entirely our own."
    SER_idea_build_own_mines: "Our Own Mines"
    SER_idea_build_own_mines_desc: "State-owned coal pits supply our workshops with cheap fuel, and their profits stay in Serbia."
    SER_idea_invest_mining: "Foreign Mining Investments"
    SER_idea_invest_mining_desc: "French capital is developing our mines and river transport, but the profits flow to Paris and our own industry has to compete for resources."
    SER_idea_educate_new_staff: "Educated Mining Staff"
    SER_idea_educate_new_staff_desc: "A new generation of Serbian geologists and engineers, trained at home, is taking over from the foreign experts."
    SER_idea_latin_monetary_union: "Latin Monetary Standard"
    SER_idea_latin_monetary_union_desc: "Our silver dinar is minted to the same standard as the French franc, making trade with Western Europe easier and lending the state new credibility."
    SER_idea_understaffed_government: "Understaffed Government"
    SER_idea_understaffed_government_desc: "The purges and resignations have left the ministries short of experienced officials. Business piles up, and the government struggles to keep the country under control."
    SER_idea_corrupt_government: "Corrupt Government"
    SER_idea_corrupt_government_desc: "Bribes, favours and embezzlement have become a normal part of government business. Public trust is draining away, and so is the treasury."
    SER_idea_military_operation: "Military Operation in Belgrade"
    SER_idea_military_operation_desc: "Serbian troops and volunteers are fighting to contain the Ottoman garrison in Belgrade, and every street is a battleground."
    SER_idea_belgrade_operation: "Defence of Belgrade"
    SER_idea_belgrade_operation_desc: "Belgrade has been fortified against the guns of the fortress, and its defenders know every street and courtyard."
    SER_idea_experienced_engineer: "Experienced Engineers"
    SER_idea_experienced_engineer_desc: "Serbian engineers and scholars from abroad have answered our call and returned to serve the principality."
    SER_idea_renovated_finance_schools: "Renovated Finance Schools"
    SER_idea_renovated_finance_schools_desc: "New schools of commerce and finance are training the officials, bankers and merchants a modern economy needs."

    ###Balkan Pact Ideas
    SER_idea_slavic_friendship: "Serbian-Bulgarian Cooperation"
    SER_idea_slavic_friendship_desc: "Serbs and Bulgarians have grown closer than ever before: Bulgarian refugees settle among us, Bulgarian revolutionaries plan in Belgrade, and both peoples look forward to the day when they will rise together."

