    ### EVENTS ###

    SERkar.1.t: "Restoring the People's Faith"
    SERkar.1.d: "That was close! The people let us stay, but their trust is badly shaken. The quickest way to win it back is to accept their demands. It will cost us some of our authority, but we will gain stability and the nation's support."
    SERkar.1.a: "We will work on it."
    SERkar.1.b: "Who cares about the people?"

    SERkar.2.t: "The Villagers Want Change"
    SERkar.2.d: "The villagers are still unhappy and angry with us. Lowering some of their taxes would go a long way towards winning them back. We could refuse, but turning our backs on them now, after we promised to help, would be unwise."
    SERkar.2.a: "Lower the taxes."
    SERkar.2.b: "Don't lower the taxes."

    SERkar.3.t: "The Townsfolk Want Lower Taxes"
    SERkar.3.d: "Townsfolk may be a minority in our agrarian country, but they deserve the same respect. Traders, craftsmen and others in the towns are asking for their taxes to be lowered as well."
    SERkar.3.a: "Lower the taxes."
    SERkar.3.b: "Don't lower the taxes."

    SERkar.4.t: "The Liberal Question"
    SERkar.4.d: "The liberals who opposed the Prince remain active in Belgrade's cafés, newspapers and reading rooms. Some of them are talented men who could serve the state; others will never forgive the dynasty. How we treat them now will shape Serbian politics for years."
    SERkar.4.a: "Be good to them."
    SERkar.4.b: "Pressure them."

    SERkar.8.t: "Aleksandar's Walk"
    SERkar.8.d: "Prince Aleksandar wishes to take a walk around the city."
    SERkar.8.a: "What could go wrong?"

    SERkar.5.t: "Assassination Attempt!"
    SERkar.5.d: "Someone has shot the Prince while he was walking through Belgrade! He is in a stable condition for now, but the doctors cannot say whether he will survive."
    SERkar.5.a: "Will Aleksandar survive?"

    SERkar.6.t: "Aleksandar Karađorđević Survives!"
    SERkar.6.d: "The Prince has survived the assassination attempt! We must make sure that this never happens again."
    SERkar.6.a: "Thank God!"

    SERkar.7.t: "Aleksandar Karađorđević Dies!"
    SERkar.7.d: "The Prince has succumbed to his wounds. His son, Petar, will inherit the throne."
    SERkar.7.a: "Hopefully he won't die too."

    SERmisc.1.t: "Anniversary of the First Serbian Uprising"
    SERmisc.1.d: "Sixty years ago, in February 1804, the Serbs of the Sanjak of Smederevo gathered at Orašac and rose against the murderous Dahije. Led by Đorđe Petrović, known to all as Karađorđe, the revolt became a war of liberation that for nine years kept a free Serbian state alive, until the Ottomans crushed it in 1813. Whatever our politics, every Serb owes something to the men of 1804, and today the whole country remembers them."
    SERmisc.1.a: "He will be remembered."

    SERmisc.2.t: "Anniversary of the Second Serbian Uprising"
    SERmisc.2.d: "Fifty years ago, on Palm Sunday 1815, Miloš Obrenović raised the banner of revolt at Takovo. Where the First Uprising had relied on courage alone, the Second combined arms with shrewd diplomacy, and within months the Porte agreed to let the Serbs govern themselves. The autonomous principality we live in today was born that spring."
    SERmisc.2.a: "He will be remembered."

    SERmisc.3.t: "Vuk Karadžić Dies"
    SERmisc.3.d: "News has arrived from Vienna that Vuk Stefanović Karadžić has died. Born in 1787 in the village of Tršić, the self-taught son of peasants became the great reformer of the Serbian language. He rebuilt our Cyrillic alphabet on the simple principle of 'write as you speak', giving one letter to every sound, and championed the language of the people over the archaic Slavonic of the Church. He collected and published thousands of folk songs, tales, proverbs and riddles, compiled the first Serbian dictionary and translated the New Testament into the common tongue. His reforms were bitterly resisted in his lifetime, but his work has already made the Serbian folk epic famous throughout Europe, and his legacy will outlive all his critics."
    SERmisc.3.a: "We lost a great Serb today..."

    SERmisc.4.t: "The Best Man"
    SERmisc.4.d: "Prince Nikola of Montenegro has invited our prince to become the 'kum' of his house - godfather and sworn friend of the Petrović-Njegoš family. Among Serbs, kumstvo is a bond almost as strong as blood, and accepting would bind Belgrade and Cetinje closer than any treaty. Refusing would be taken as a grave insult."
    SERmisc.4.a: "We accept with honour."
    SERmisc.4.b: "We must decline."

    SERmisc.5.t: "WARNING: Serbia is WIP"
    SERmisc.5.d: "Serbia is currently not really playable. So if you decide to play it anyway, remember that it will probably not work very well or even at all in some parts.\n-Serbian dev"
    SERmisc.5.a: "Ok"

    SERmisc.6.t: "Establishing the Serbian Gendarmerie"
    SERmisc.6.d: "The French gendarmerie has been imitated across Europe since the beginning of the century: Prussia created its Landgendarmerie in 1812, Piedmont its Royal Carabinieri in 1814, and Austria and Russia followed soon after. During the revolutions of 1848 these forces grew rapidly, and they have become an important factor in the political life of every state.\nBy decree of Prince Mihailo, Serbia now has a gendarmerie of its own, charged with maintaining public order and peace in Belgrade. The first detachment numbers 120 men, including 15 mounted gendarmes, with their own uniforms and weapons."
    SERmisc.6.a: "Glory to Serbia!"

    SERmisc.7.t: "Act on Establishment of the National Army"
    SERmisc.7.d: "The Prince has signed the act establishing the National Army. Every able-bodied man between twenty and fifty will be registered in his district, issued arms and called up for regular drill, while the small regular army will provide officers, instructors and artillery. On paper, Serbia can now field tens of thousands of soldiers. The Porte has protested, but the old garrison system, in which Serbia's defence depended on a handful of troops and the goodwill of the Sultan, is finally coming to an end."
    SERmisc.7.a: "Glory to Serbia!"

    SERmisc.8.t: "Decree of the People's Army"
    SERmisc.8.d: "With the Decree of the People's Army, military service is no longer a matter for volunteers alone. Every district must supply its quota of trained men, and the government openly declares that the army exists to liberate the Serbian nation. Our arsenals are not yet ready to arm everyone who will answer the call, but the principle has been established."
    SERmisc.8.a: "Glory to Serbia!"

    SERmisc.9.t: "Hippolyte Mondain's Army Reform"
    SERmisc.9.d: "Hippolyte Mondain has arrived in Belgrade to head the Main Military Administration. The French officer already knows Serbia well from his first mission during the Crimean War. He has drawn up an ambitious programme: a general staff, new regulations on the French model, schools for officers and non-commissioned officers, and a complete overhaul of the army's administration and supply. The task is enormous, and the clock is already ticking."
    SERmisc.9.a: "This should improve our army."

    SERmisc.10.t: "Law of Artillery Administration"
    SERmisc.10.d: "The Law of Artillery Administration has placed the cannon foundry, the arsenals and the powder works under a single command, with Kragujevac as the centre of Serbian military production. To lead the new artillery and its schools, Mondain has called on František Zach, the Czech-born veteran who founded our Artillery School and has trained a generation of Serbian officers."
    SERmisc.10.a: "Glory to Serbia!"

    SERmisc.11.t: "Hippolyte Mondain's Army Reform - A Success!"
    SERmisc.11.d: "Hippolyte Mondain has completed his mission and resigned his post, having stayed in Serbia longer than he ever promised. The army he leaves behind is unrecognisable: it has a ministry, a staff, regulations, schools, modern rifles and artillery. Mondain returns to France with the gratitude of the whole nation, and the Ministry of War passes into the capable hands of Milivoje Blaznavac."
    SERmisc.11.a: "Our army is glorious!"

    SERmisc.12.t: "Hippolyte Mondain's Army Reform - A Failure"
    SERmisc.12.d: "Despite his best efforts, Hippolyte Mondain could not overcome the shortages of money, weapons and trained men, nor the jealousy of Serbian officers who resented a foreigner's authority. He has resigned and returned to France, leaving behind an army only half reformed. Milivoje Blaznavac takes over the Ministry of War with much still to be done."
    SERmisc.12.a: "Our army has fallen short."

    SERmisc.13.t: "Convocation of the Second Bulgarian Legion"
    SERmisc.13.d: "In 1862, Georgi Rakovski gathered hundreds of Bulgarian émigrés and revolutionaries in Belgrade into the First Bulgarian Legion. During the clashes with the Ottoman garrison that summer, the legionaries fought beside the Serbs at the Varoš and Vidin gates and held a section of the city's defences. Lack of money and the failure of a planned rising in Bulgaria eventually forced the Legion to disband, but its memory lives on.\nNow, with Serbian funds and arms, a Second Bulgarian Legion is being formed in Belgrade. Its volunteers will train alongside our army and, when the day comes, march with us into the Ottoman lands."
    SERmisc.13.a: "Glory to Serbia!"

    SERmisc.14.t: "New Talented Serbian Generals"
    SERmisc.14.d: "A new generation of Serbian commanders has emerged from the Artillery School and from study abroad. Foremost among them are Milojko Lešjanin, an energetic officer who has studied the armies of the Great Powers, and Sava Grujić, a gifted artilleryman and organiser. With men like these at the head of our divisions, the army can face the future with confidence."
    SERmisc.14.a: "Glory to Serbia!"

    SERmisc.15.t: "Question of the Montenegro-Serbia Military Agreement"
    SERmisc.15.d: "One of the central aims of Prince Mihailo's reign is a united Balkan movement against the Ottoman Empire. The first step is Montenegro. Our envoy has travelled to Cetinje with a draft treaty: the two Serbian principalities would coordinate their military actions against the Porte, Belgrade would provide Montenegro with money and arms, and should the two states one day unite, Prince Nikola would yield the throne in exchange for generous privileges. Will this be the beginning of the end of Ottoman rule?"
    SERmisc.15.a: "Glory to Serbia!"
    SERmisc.15.b: "We are not ready for such a commitment."

    SERmisc.16.t: "Serbia Proposes an Alliance"
    SERmisc.16.d: "An envoy from [FROM.GetNameDef] has arrived in Cetinje with a draft treaty. Belgrade offers money and weapons, and asks that we coordinate our struggle against the Porte with theirs. The Serbians also hint at a future union of the two principalities, a prospect that excites some of our chieftains and alarms others. Whatever we decide, our relations with Belgrade will never be the same."
    SERmisc.16.a: "Montenegro stands with Serbia."
    SERmisc.16.b: "Montenegro will walk its own path."

    SERmisc.17.t: "Commercial Code of 1860"
    SERmisc.17.d: "The adoption of the Commercial Code is an important milestone in the codification of Serbian commercial law, a process that has taken more than a decade. It began in 1849 at the initiative of the Ministry of Finance, and in 1851 a commission of civil servants and Belgrade merchants produced a first draft. The State Council at first approved the codification, but in 1853 rejected the draft, arguing that it said nothing about commercial courts, that poorly educated Serbs would not understand its complex concepts, and that Serbian merchants were not yet ripe for codified law.\nThe Commercial Committee, founded in January 1856 to promote trade, revived the project. In 1857 the Council formed a new committee to revise the 1851 draft and prepare laws on commercial courts and procedure, all three to form part of a single code. The draft went to the Commercial Committee in February 1859 and back to the Ministry that October; after final revisions by a three-member committee of the Ministry of Justice, the Prince approved the Code on 22 December 1859, and it entered into force on 26 January 1860.\nThe driving force behind it was trade with Austria, which had grown rapidly since 1848. Austrian merchants relied on bills of exchange, which forced their Belgrade partners to meet their obligations precisely, yet Serbian merchants could not enforce their own claims against debtors in the provinces under the slow civil procedure of our courts. From 1852 onwards, Belgrade's merchants petitioned again and again for a commercial code, with more signatures each time. Only when the problem spread to the provincial towns as well did the code finally arrive, placing Serbia among the countries with codified commercial law."
    SERmisc.17.a: "Glory to Serbia!"

    SERmisc.19.t: "Pančić's Time!"
    SERmisc.19.d: "Born in 1814 in the village of Ugrini in Croatia, Josif Pančić studied medicine in Pest and earned his doctorate there, but his true passion was botany. Since the 1850s he has taught natural history and agronomy at the Lyceum in Belgrade, travelling every summer into the mountains to collect plants, many of them unknown to science. He is preparing the first complete description of the flora of Serbia, and is rightly regarded as the founder of the natural sciences in our country."
    SERmisc.19.a: "Glory to Serbia!"

    SERmisc.20.t: "Construction of Captain Miša's Mansion"
    SERmisc.20.d: "Over the last decade Serbia has seen remarkable development in its architecture. New schools, small hospitals and coaching inns are being built in the countryside, while in Belgrade European-style buildings are beginning to replace the old Ottoman houses.\nThe finest of them is Captain Miša's Mansion, built over five years by the Czech architect Jan Nevole for the merchant Miša Anastasijević. Its richly decorated façades draw on Byzantine, Gothic and early Renaissance models, and the people of Belgrade have taken to calling it the 'Venetian Palace'. The statues of Apollo with his lyre and Minerva with her spear and shield hint at its intended purpose: the captain means to give it to the nation as a home for education, science and the arts."
    SERmisc.20.a: "Glory to Serbia!"

    SERmisc.21.t: "[FROM.GetNameDef] Seeks Financial Help"
    SERmisc.21.d: "The government of [FROM.GetNameDef] has approached us with a request for a loan. Years of debt, usury and bankruptcies have left its treasury nearly empty, and its ministers hope that our bankers will lend on reasonable terms. In return, they offer friendship, access to their markets and, no doubt, a more attentive ear to our advice in the future."
    SERmisc.21.a: "We can help them. Send the funds."
    SERmisc.21.b: "[ROOT.GetNameDef] does not need such an agreement."

    SERmisc.22.t: "Foreign Loans"
    SERmisc.22.d: "Good news from abroad: [FROM.GetNameDef] has agreed to our request. The loan will refill the treasury and give us room to carry out the reforms our economy so desperately needs. We must use it wisely, for it will have to be repaid."
    SERmisc.22.a: "A welcome relief."

    SERmisc.23.t: "Our Request Has Been Refused"
    SERmisc.23.d: "[FROM.GetNameDef] has turned down our request for a loan. Its bankers consider Serbia too poor and too unstable to be worth the risk. The news has already reached Belgrade's cafés, and our enemies at home are quick to blame the government."
    SERmisc.23.a: "We will manage without them."

    SERmisc.24.t: "The Prizren Seminary"
    SERmisc.24.d: "Sima Andrejević Igumanov, a Prizren-born merchant who made his fortune in the tobacco trade in Russia, is one of the great benefactors of Serbian education. In 1871 the seminary he founded in his native Prizren opened its doors, and a dormitory and new buildings followed the next year. Education there is free: Igumanov has secured a permanent income for the school, its textbooks and its pupils' needs. The seminary will train priests and teachers not only for Old Serbia but for Montenegro, Bosnia and Herzegovina as well, keeping the Serbian schools of the Ottoman lands alive."
    SERmisc.24.a: "Glory to Serbia!"

    SERmisc.25.t: "The Deligrad"
    SERmisc.25.d: "Our trade is growing, and with it our need for ships of our own. Since the Franco-Serbian Navigation Company has failed to establish a regular service, the government has bought a paddle steamer, the former Italian Piacenza, at Galaţi along with eight barges. She has been renamed Deligrad, after the great victory of the First Serbian Uprising over the Ottoman army in 1806, and is the first steamer to sail the Danube under the Serbian flag."
    SERmisc.25.a: "Glory to Serbia!"

    SERmisc.26.t: "Situation with the Dobra Mines"
    SERmisc.26.d: "The Dobra mines near the Danube have become famous for their rich coal deposits, and European investors are showing great interest in gaining access to them. Every offer to help Serbian navigation and trade seems to come with a request for mining rights attached."
    SERmisc.26.a: "Let us make our decision on this matter."

    SERmisc.27.t: "The Question of Mining Rights"
    SERmisc.27.d: "The French company of Magnan, Bouillon, Alphonse Conte & Co. has made its offer: it will establish a steamship service along the Danube and the Sava, connecting Serbian ports with Galaţi and Marseille, if we grant it the right to work the Dobra mines for thirty years. Accepting would bring steam navigation and foreign capital at once. Refusing would keep our coal in Serbian hands, but leave us to build our mines and our fleet alone."
    SERmisc.27.a: "Agree to the French proposal."
    SERmisc.27.b: "The mining rights are ours."

    SERmisc.28.t: "Geological Sketches of Serbia"
    SERmisc.28.d: "This week a remarkable work has been published in Belgrade and distributed across the country: a collection of geological sketches of Serbia, gathered from the field notes of foreign and Serbian scholars. It is one of the first works to bring Western scientific methods to Serbian readers in their own language, and it adds many original observations of its own. Our scientific community is celebrating it as a great step forward for science in the Balkans."
    SERmisc.28.a: "Truly marvellous!"

    SERmisc.29.t: "Serbian Students Are Back!"
    SERmisc.29.d: "Our country needs far more educated people if it is to develop its medicine, schools, mines and administration. Hundreds of young Serbs have studied at the universities and academies of Vienna, Pest, Paris, Berlin and Freiberg, many of them on state scholarships, and the Serbian communities of Austria and the Ottoman Empire are full of talent. Now the first of them are returning home, bringing new knowledge and new ideas with them."
    SERmisc.29.a: "Glory to Serbia!"

    SERmisc.30.t: "Petition of the Jewish Merchants"
    SERmisc.30.d: "A delegation of Belgrade's Jewish merchants has presented a petition to the government. They ask that the old restrictions on where Jews may live and trade be lifted, and that the state protect their shops and homes from the threats that have followed recent newspaper campaigns against them."
    SERmisc.30.a: "We will consider their petition."

    SERmisc.31.t: "Introduction of Bronze Coins"
    SERmisc.31.d: "Since the Ottoman conquest, Serbia has used whatever coins came to hand. The Ottomans struck money at Novo Brdo, Kučajna and Belgrade, and even our 'para' takes its name from a Turkish silver coin. When the principality was established, dozens of foreign coins circulated side by side, until in 1819 Prince Miloš published an official table of exchange rates for 43 of them, 10 gold, 28 silver and 5 copper, using the groat as the unit of account.\nWith the Ottoman garrisons gone, Prince Mihailo ordered the first national coinage. Bronze coins of 1, 5 and 10 para, bearing his portrait, have now been introduced, the first step towards a true Serbian currency."
    SERmisc.31.a: "Glory to Serbia!"

    SERmisc.32.t: "Secret Russian Appeal"
    SERmisc.32.d: "Our envoy has quietly approached Russian bankers and officials with a request for financial support. The answer has been encouraging: St. Petersburg is willing to help a fellow Orthodox nation, provided that the arrangement stays out of the newspapers of Vienna and Constantinople. The money will not solve all our problems, but it buys us time and goodwill."
    SERmisc.32.a: "Glory to Serbia and Russia!"

    SERmisc.33.t: "Jewish Merchant Discrimination"
    SERmisc.33.d: "Jews have lived in the Serbian lands since Roman times. Their communities grew greatly after 1492, when Sephardic refugees expelled from Spain and Portugal found shelter in the Ottoman Empire, and Belgrade's Jewish quarter on the Danube became a centre of the salt trade and of commerce with Central Europe. Many Jews supplied the insurgents with weapons during the uprisings and suffered for it at Ottoman hands.\nRelations between Serbs and Jews have generally been good, but restrictions have crept in. In 1839 Jewish shops were ordered to close on Sundays and Serbian holidays, though their own faith already closed them on Saturdays and Jewish feast days. Later laws barred Jews from settling or trading outside Belgrade, and in recent years these have been enforced more harshly, driving families out of provincial towns. Some newspapers have joined in with hostile articles, part of a wave of prejudice sweeping across much of Europe, and threats against Jewish merchants are growing."
    SERmisc.33.a: "A rather tragic history..."

    SERmisc.34.t: "Hand it over to the Ministry of Defence"
    SERmisc.34.d: "Now that we have a steamship of our own, it must be kept in safe and secure hands. The government has decided that the Deligrad will be handed over to the Ministry of War, where she will serve as the nucleus of a future river flotilla."
    SERmisc.34.a: "May many more soon join her!"

    SERmisc.35.t: "Serbian Steam Navigation Company"
    SERmisc.35.d: "Backed by the government and by Belgrade's leading merchants, the Serbian Steam Navigation Company has been founded. Its first task is modest: regular services between Belgrade, Smederevo and the river ports downstream. But for the first time, Serbian cargo can travel on Serbian ships, at prices set in Belgrade rather than in Vienna."
    SERmisc.35.a: "Glory to Serbia!"

    SERmisc.36.t: "The English Danube Company's Request"
    SERmisc.36.d: "An English steamship company operating on the lower Danube has asked for permission to call at Serbian ports and carry goods and passengers along our stretch of the river. The Austrians are furious at the prospect of competition. For us, the English offer a welcome counterweight, so long as Serbian shippers are not squeezed out in the process."
    SERmisc.36.a: "Glory to Serbia!"

    SERmisc.37.t: "Negotiations for Steamships"
    SERmisc.37.d: "Our envoys have opened talks with shipyards and shipping companies abroad. Several vessels suitable for the Danube and the Sava are on offer, some new, some second-hand, all expensive. With patience and some hard bargaining, we can expand our fleet without emptying the treasury."
    SERmisc.37.a: "Glory to Serbia!"

    SERmisc.38.t: "Franco-Serbian Navigation Company"
    SERmisc.38.d: "Since winning its freedom, Serbia has built up a sizeable merchant fleet of river boats, but the age of sail and oar on the Danube is ending. Every independent attempt to establish Serbian steam navigation has been blocked by the Austrian First Danube Steamship Company and the authorities in Vienna. With French capital and French ships, the new Franco-Serbian Navigation Company may finally break their grip."
    SERmisc.38.a: "Glory to Serbia and France!"

    SERmisc.39.t: "Deforestation of Serbia"
    SERmisc.39.d: "For some time now, the deforestation of Serbia has been growing steadily worse. Without proper regulations, and certainly without their enforcement, loggers have stripped whole hillsides of their oaks and beeches. Floods, landslides and failing springs are already the result, and Serbia's beautiful forests may soon be a memory."
    SERmisc.39.a: "That's a problem!"

    SERmisc.40.t: "The Danube Rothschild"
    SERmisc.40.d: "Known as the 'Prince of the Danube' or the 'Rothschild of the Danube', Miša Anastasijević has proved himself the most capable merchant in Serbia and perhaps in all the Balkans.\nHe was born in Poreč on the Danube, the son of a small landowner and merchant. As a boy he twice fled to Austria with his stepmother during the uprisings, and at eleven he was already teaching other children in his home town, since he could read and write. He became a business associate of Prince Miloš, who made him a captain of the Danube at the age of thirty. Since then he has taken control of much of the import and export of salt from Wallachia and Moldavia, with a fleet of some 80 boats and thousands of employees. He has helped many authors publish their books, supported schools and is giving his great mansion in Belgrade to the cause of education. His career marks a new stage in the development of Serbian commerce and the Serbian middle class."
    SERmisc.40.a: "A true patriot, and a shrewd partner."

    SERmisc.41.t: "The Day of the Serbian Police"
    SERmisc.41.d: "With the Čukur Fountain crisis now over, the government has decided that the brave members of the police and gendarmerie deserve to be honoured. A day of the Serbian police will be observed every year, so that no Serb forgets Sima Nešić, Đorđe Nišlija and the others who gave their lives to keep the peace in those dreadful days."
    SERmisc.41.a: "May we never forget!"

    SERmisc.42.t: "The Opening of the Serbian National Theatre in Novi Sad"
    SERmisc.42.d: "Although Vojvodina remains under Austrian rule, its Serbs have founded the Serbian National Theatre in Novi Sad, the first permanent professional theatre of our people. Its stage will bring plays in the Serbian language to audiences on both sides of the Danube, and its actors will soon be touring our own towns."
    SERmisc.42.a: "Glory to Serbia!"

    SER_politics.20.t: "Tenka's Plot"
    SER_politics.20.d: "For two years there has been constant friction between Prince Aleksandar Karađorđević and the State Council. Since the Crimean War the Prince has clung to Austria and kept Russophiles out of the ministries, and with the liberals uniting against him, almost the entire Council now stands in opposition. Most of his enemies want him deposed lawfully, but a group of hardened, influential councillors - Stefan Stefanović Tenka, Paun Janković and Radovan Damjanović, together with the president of the Supreme Court - have resolved to kill him. They found a gunman, armed him, gave him money and a passport, and sent him to Brestovačka Banja, where the Prince was taking the waters. But one of the conspirators' confidants has gone to the authorities..."
    SER_politics.20.a: "The Prince survives."
    SER_politics.20.b: "The assassination is a success!"

    SER_politics.21.t: "Security of the Prince"
    SER_politics.21.d: "The near miss with the assassins cannot be ignored. The plotters sat in the State Council itself, and their friends still fill the ministries. We can strike first and purge the Council by force, or we can try to calm the internal struggle and win back the moderates."
    SER_politics.21.a: "Coup d'état against the Council."
    SER_politics.21_decisions_tt: "Unlocks §Ydecisions§! to purge disloyal councillors and officials from the government."
    SER_politics.21.b: "Stabilise the internal struggle."
    SER_assembly_allowed: "The Assembly Is Allowed"

    SER_politics.22.t: "Search for a New Prince"
    SER_politics.22.d: "The throne of Serbia is empty, and the country cannot remain without a prince for long. The Assembly has turned to the house of Obrenović. Old Miloš, the hero of the Second Uprising, still lives in exile in Bucharest, and his son Mihailo, who reigned briefly before 1842, waits in Vienna. Which of them shall we call home?"
    SER_politics.22.a: "Miloš Obrenović is a great candidate!"
    SER_politics.22.b: "No, the old man is too old to rule us."

    SER_politics.23.t: "Miloš on the Throne"
    SER_politics.23.d: "Miloš Obrenović fought in the First Serbian Uprising, led the Second in 1815 and founded both the Obrenović dynasty and the autonomous principality. He ruled from 1815 to 1839 as an autocrat who refused to share power, and his harshness made him many enemies. Now, at nearly eighty, he returns to Belgrade as the people's choice, as determined as ever to be master in his own house."
    SER_politics.23.a: "Miloš Obrenović it is!"
    SER_politics.23.b: "His son Mihailo seems better..."

    SER_politics.24.t: "Mihailo on the Throne"
    SER_politics.24.d: "Mihailo was only sixteen when he first became prince in 1839, and his inexperience left him at the mercy of the Defenders of the Constitution. In 1842 Toma Vučić-Perišić's rebellion drove him into exile, and the Karađorđević dynasty took power. Sixteen years in Vienna and abroad have made him an educated, serious and ambitious man. Serbia will find him a very different prince."
    SER_politics.24.a: "Mihailo Obrenović it is!"
    SER_politics.24.b: "His father Miloš seems better..."

    SER_politics.25.t: "The Ottoman Empire Sends a Commission of Inquiry"
    SER_politics.25.d: "On hearing of the coup in Belgrade, the Porte has dispatched a commission, led by Ethem Pasha, to investigate the arrests of the councillors. The commissioners demand that the political prisoners be released at once, and hint that the Sultan may withdraw his recognition of the Prince if we do not comply."
    SER_politics.25.a: "Very well, we shall set them free."
    SER_politics.25.b: "Ethem Pasha can go to hell."

    SER_politics.26.t: "The Opposition Demands Change"
    SER_politics.26.d: "Emboldened by the crisis, the opposition is now organised enough to demand change once and for all. Liberals, Obrenović loyalists and disgruntled councillors alike insist that the National Assembly be summoned and allowed to speak for the nation."
    SER_politics.26.a: "We have no choice but to accept."

    SER_politics.27.t: "Growing Foreign Pressure"
    SER_politics.27.d: "The guaranteeing powers have joined the Porte in demanding the release of the political prisoners. The consuls of Russia, France and Britain have all delivered notes, and even Austria, our usual friend, is urging moderation. Defying them all would be dangerous."
    SER_politics.27.a: "We have no choice but to give in."
    SER_politics.27.b: "Serbia shall not be bullied!"

    SER_politics.28.t: "Ottoman Military Intervention"
    SER_politics.28.d: "The Ottomans have imposed sanctions on us and are reinforcing the garrisons on Serbian soil. The Pasha of Belgrade warns that his troops will intervene if the political prisoners are not released immediately."
    SER_politics.28.a: "We have no choice but to release the prisoners."

    SER_politics.29.t: "The Old Prince Is Dead"
    SER_politics.29.d: "Miloš Obrenović, founder of the dynasty and hero of the Second Uprising, has died. For friends and enemies alike, an era of Serbian history has come to an end. If his house holds the throne, his son Mihailo succeeds him. If not, the most dangerous rival of the reigning prince has gone to his grave."
    SER_politics.29.a: "May he rest in peace."

    SER_politics.30.t: "Situation of Oligarchic Rule"
    SER_politics.30.d: "Since 1842, Serbia has been ruled by the Defenders of the Constitution: a small group of councillors and officials who deposed Prince Miloš in 1839 and his son Mihailo in 1842, and made Aleksandar Karađorđević prince in their place. They promised constitutional government under the 1838 Constitution and did build schools, courts and a modern bureaucracy. Ilija Garašanin even formulated, in his secret 'Načertanije' of 1844, the first programme for uniting the Serbs in a single state.\nBut their regime turned Serbia away from Russia and into economic dependence on Austria. The police and bureaucracy grew ever more powerful, the Assembly was almost never summoned, and the economy sank into debt and bankruptcy. Now their rule is crumbling. Shall we side with the reformers who want to break the oligarchy, or with the old guard who built the state?"
    SER_politics.30.a: "Side with the reformers."
    SER_politics.30.b: "Side with the old guard."

    SER_politics.8.t: "Čukur Fountain Incident"
    SER_politics.8.d: "On a hot afternoon in June 1862, the Čukur Fountain in Belgrade's Dobračina Street was crowded with townspeople and Ottoman soldiers waiting for water. A quarrel broke out between the nizams and a young Serbian apprentice, Sava Petković, over who should fill his jug first, and the boy was struck down and mortally wounded. Serbian gendarmes arrested the soldiers responsible, and the police interpreter Sima Nešić was sent to escort them and calm the situation. As they passed the Ottoman police post, the prisoners tried to break free and shots rang out from the building. Nešić was killed on the spot and the gendarme Đorđe Nišlija was mortally wounded. Within the hour, all of Belgrade knew."
    SER_politics.8.a: "Send troops into the city."

    SER_politics.9.t: "Conflict Escalation"
    SER_politics.9.d: "The Minister of the Interior, Nikola Hristić, has taken command of the Serbian forces in the city, but he has only a few hundred gendarmes and the night watch against an Ottoman garrison and several thousand armed Muslim townsmen. A general alarm has been raised. The Turks have barricaded themselves in the city gates, taverns and mosques, while Serbs arm themselves in the streets. The Pasha has sent a strong detachment from the fortress towards the Ottoman barracks. Prime Minister Ilija Garašanin persuaded its commander to turn back, sending Serbian gendarmes as escort, but on the way someone in the crowd killed an Ottoman officer, and the soldiers opened fire on the Serbs around them."
    SER_politics.9.a: "The head of the gendarmerie has fallen." #Gendarmie dies
    SER_politics.9.b: "The head of the gendarmerie lives." #Gendarmie Lives

    SER_politics.10.t: "Civilians Arm Themselves"
    SER_politics.10.d: "Many people in Belgrade have barricaded themselves in their homes, but hundreds of others have taken up arms. Through the night, armed townsmen stormed the Varoš Gate and fought for the Sava and Stambol gates, which were torn down. Some mosques and Muslim houses were taken by force, others surrendered after negotiation, and many Muslim families fled towards the fortress. By the morning, only the fortress and a few strongpoints held by Ottoman soldiers remain outside Serbian control."
    SER_politics.10.a: "Oh dear..."

    SER_politics.11.t: "The Pasha Orders the Bombardment of Belgrade"
    SER_politics.11.d: "Overnight the foreign consuls intervened. The British consul, Longworth, mediated between the Pasha and Ilija Garašanin, and an agreement was reached: the Ottoman soldiers would withdraw into the fortress, and the safety of Muslim property in the town would be guaranteed. But on the morning of the funeral of the fallen Serbs, the fortress guns opened fire on the city and kept firing for hours. The roof of the Cathedral and Captain Miša's Mansion were hit, around fifty people were killed and hundreds of houses burned or damaged.\nMost of the consuls, the Austrian excepted, have sided with Serbia and declared the bombardment unprovoked. The government is using the outrage to demand that the Turks leave Serbia altogether, and the matter will now be decided by the guaranteeing powers."
    SER_politics.11.a: "Those damned Turks!"

    SER_politics.12.t: "Volunteers from the Interior of Serbia"
    SER_politics.12.d: "As news of the bombardment spreads, volunteers are pouring into Belgrade from every district of the interior, armed with whatever they could find. They have come to defend the capital from the Ottoman garrison, and they will not go home until the guns of the fortress fall silent for good."
    SER_politics.12.a: "God bless them!"

    SER_politics.13.t: "Proclamation of [ROOT.GetLeader]"
    SER_politics.13.d: "[ROOT.GetLeader] has issued a proclamation to the Sultan: the Ottoman garrisons must withdraw completely from Serbia, the keys of the Belgrade fortress must be handed over, and no Ottoman soldier is ever to set foot on Serbian soil again."
    SER_politics.13.a: "Hand over the ultimatum!"

    SER_politics.14.t: "Serbian Intervention"
    SER_politics.14.d: "Serbia has asked us to support its demand that the Ottoman garrisons leave Serbian soil. If the Porte refuses and the situation gets out of hand, our support might drag us into a war with the Ottomans."
    SER_politics.14.a: "We shall aid the Serbians."
    SER_cukur_fountain_incident7_tt: "\n§RIf the situation escalates and the Ottomans don't back down, this option will lead you to war with the Ottomans.§!"
    SER_politics.14.b: "Meh, don't trouble me with Serbia."

    SER_politics.15.t: "Serbia Demands Our Withdrawal"
    SER_politics.15.d: "The Serbians have issued a proclamation demanding that we withdraw completely from Serbia, hand over the keys of the Belgrade fortress and never set foot on Serbian soil again. The Great Powers are watching closely to see how we respond."
    SER_politics.15.a: "Give us 30 days to decide."
    SER_cukur_fountain_incident8_tt: "§RCheck your Missions!§!"

    SER_politics.16.t: "The Ottomans Agree"
    SER_politics.16.d: "The Sultan has agreed to withdraw his garrisons from Serbia! After long negotiations it has been decided that the fortresses will be handed over to the custody of Prince Mihailo. The Ottoman flag will still fly beside the Serbian one over Belgrade, but the Turkish soldiers are going home."
    SER_politics.16.a: "A triumph for Serbia!"

    SER_politics.17.t: "The Ottomans Refuse!"
    SER_politics.17.d: "As expected, the Sultan has refused to withdraw from Serbia or even to negotiate with us. It seems that war is the only answer left, and we can only hope that the Great Powers will stand behind our cause."
    SER_politics.17.a: "Prepare for war!"

    SER_politics.18.t: "[FROM.GetName] Agrees to Support Our Independence"
    SER_politics.18.d: "[FROM.GetFlag][FROM.GetName] has decided to intervene and help us win our independence if the Ottomans refuse to back down! Their diplomats assure us, however, that they expect a diplomatic solution and do not believe the crisis will come to war."
    SER_politics.18.a: "Excellent!"

    SER_politics.19.t: "[FROM.GetName] Refuses to Support Our Independence"
    SER_politics.19.d: "[FROM.GetFlag][FROM.GetName] has decided that it will not help us in our struggle for independence."
    SER_politics.19.a: "Damn!"

    SER_politics.1.t: "The Saint Andrew's Day Assembly"
    SER_politics.1.d: "Faced with growing hostility, the Prince had no choice but to meet the opposition's demands. On Saint Andrew's Day, 30 November 1858, the National Assembly gathered in Belgrade. Three priest-deputies consecrated the hall, the members of the State Council entered led by Toma Vučić-Perišić, and Prince Aleksandar arrived with his ministers. The Prince greeted the deputies with the traditional 'God help you, brothers', and the Assembly answered 'God help you, Lord'. The Prince's address was read by the foreign minister, the Assembly was declared open, and the Prince withdrew.\nWhat followed was not the obedient session the court expected. Deputy after deputy rose to denounce sixteen years of oligarchic rule, and voices calling for the Prince's abdication grew louder every day. The capital is full of rumours, the Ottoman fortress watches in silence, and both the Karađorđević loyalists and the friends of the Obrenović house are counting their supporters. The struggle for the throne of Serbia has begun."
    SER_politics.1.a: "The status quo is changing."

    SER_politics.2.t: "Alliance of the Liberals"
    SER_politics.2.d: "During the revolution of 1848-49 Serbia sent volunteers to aid the Serbs of Vojvodina, and the Defenders of the Constitution were forced to loosen their grip at home: the Assembly's powers were extended and all direct taxpayers received the vote. During the Crimean War Serbia stayed neutral, and the Peace of Paris in 1856 placed its autonomy under the guarantee of the Great Powers.\nIn recent years, economic crisis has soured relations between the Prince and the Council and given rise to a vigorous liberal opposition. The young liberals now hope to use the Saint Andrew's Assembly to curb the State Council and transfer legislative power to the National Assembly, the Skupština. Whether Prince Aleksandar will survive their campaign remains uncertain. Will this be the end of the Defenders of the Constitution?"
    SER_politics.2.a: "Support it!"
    SER_politics.2.b: "Don't support it!"

    SER_politics.3.t: "The Idea of Parliamentarism"
    SER_politics.3.d: "Inspired by Western Europe, young liberals like Jevrem Grujić and Vladimir Jovanović argue that the Prince should rule together with an elected Assembly that meets every year, approves the budget and makes the laws. Until now the Assembly has been an occasional gathering summoned at the Prince's pleasure; they want it to become the true voice of the nation. The idea is spreading fast among students, merchants and the younger officials."
    SER_politics.3.a: "A strong force for the opposition."

    SER_politics.4.t: "The Serbian Elites Unite"
    SER_politics.4.d: "After weeks of debates, intrigues and street demonstrations, the leading men of Serbia - councillors, deputies, officers and merchants - have reached a decision. The Assembly will no longer tolerate a stalemate, and the balance of forces in Belgrade will now decide who sits on the throne."
    SER_politics.4.a: "So be it."

    SER_politics.5.t: "Second Reign of Miloš Obrenović"
    SER_politics.5.d: "Twenty years after he abdicated, Miloš Obrenović has returned to Belgrade to cheering crowds. The old prince is nearly eighty, but he has lost none of his will. He has made it clear that he means to rule as he always did, and that the councillors who drove him out in 1839 should expect no mercy. His son Mihailo, now his heir, stands at his side."
    SER_politics.5.a: "Long live Prince Miloš!"

    SER_politics.6.t: "Turmoil within the Liberal Formation"
    SER_politics.6.d: "Liberal thinking has been one of the three main currents in Serbian politics. During the Saint Andrew's Assembly, liberals from across the country rallied against Aleksandar Karađorđević and in support of the Obrenović dynasty. But without the backing of the Assembly or of the Obrenović family itself, the movement has split into quarrelling factions, and the liberal formation is on the verge of collapse."
    SER_politics.6.a: "Oh no!"

    SER_politics.7.t: "The Karađorđević Dynasty Remains"
    SER_politics.7.d: "The great challenge to the throne has failed. The Assembly's radicals were outmanoeuvred, the liberals divided, and the army and bureaucracy stood by the Prince. The leaders of the opposition are fleeing across the Sava or waiting for arrest. Prince Aleksandar remains on the throne, but he now knows how close he came to losing it."
    SER_politics.7.a: "The opposition has been crushed."

    SER_politics.37.t: "The Malogospojinska Assembly Begins!"
    SER_politics.37.d: "The Saint Andrew's Assembly, which changed the dynasty and passed the Law on the National Assembly, also set a date for the Assembly to meet every year. Before dissolving, it appointed a committee to review and classify its unfinished business and present it, with its opinion, to the Council for further study.\nNow, before the feast of the Nativity of the Mother of God, elections have been held across the country under the new law. Many of those who served at Saint Andrew's have been elected again. There are no councillors, no appointed 'people's elders', and no district chiefs or judges sitting by right of office. The Malogospojinska Assembly of 1859 is therefore the first National Assembly in Serbian history made up entirely of elected deputies."
    SER_politics.37.a: "Glory to Serbia!"

    SER_politics.38.t: "The Situation of the Croats in the Austrian Monarchy"
    SER_politics.38.d: "From 1848 to 1850 Croatia was governed by the Ban's Council and the Croatian-Slavonian Diet. Under Bach's absolutism it was ruled directly from Vienna, until the fall of absolutism in 1860-61 brought a Croatian Court Chancellery in Vienna and a Royal Council of Lieutenancy in Zagreb.\nBan Jelačić's abolition of serfdom transformed Croatian society, weakening the great landowners and dividing the land into ever smaller plots. Many Croats have begun emigrating to the New World.\nThe People's Party, heir of the Illyrian movement and led by the Catholic Bishop Josip Juraj Strossmayer, preaches the unity of the South Slavs. Its foreign affairs are handled by Matija Mrazović, and through him the Serbian government has been negotiating a secret agreement with the party. Its main aim is the liberation of Ottoman Bosnia by Serbia as the first step towards an independent South Slav state, for Mrazović believes that if Austria takes Bosnia and Herzegovina, Serbia can never survive as an independent state."
    SER_politics.38.a: "We should support them!"
    SER_politics.38.b: "They are too weak to be worth supporting."

    SER_politics.39.t: "Our Reaction to Serbian Moves"
    SER_politics.39.d: "Our police have uncovered evidence that the Serbian government is in secret contact with the Croatian People's Party, promising cooperation against both the Ottomans and, perhaps, ourselves. Bishop Strossmayer's dreams of South Slav unity are dangerous enough without Belgrade's encouragement. We must decide whether to counter this intrigue or dismiss it as idle talk."
    SER_politics.39.a: "We will counter them!"
    SER_politics.39.b: "They are too weak to be worth worrying about."

    SER_politics.40.t: "Serbia Establishes a Balkan Pact"
    SER_politics.40.d: "Our agents report that Belgrade has been signing secret treaties with Montenegro, Greece and the Romanian principalities, and that Serbian money is reaching Bulgarian and Albanian rebels. Prince Mihailo is building a league of our Christian vassals and neighbours aimed squarely at the Sublime Porte."
    SER_politics.40.a: "What?!"

    SER_politics.41.t: "A Treaty with Greece?"
    SER_politics.41.d: "Greek diplomats have been meeting our envoys quietly at the spa of Vöslau near Vienna. Both sides have kinsmen under Ottoman rule, and both know that neither can defeat the Porte alone. A formal alliance would commit Athens and Belgrade to fight together and divide the liberated lands in advance. It would also cost us dearly in diplomatic effort and might provoke the Porte before we are ready."
    SER_politics.41.a: "An interesting idea!"
    SER_politics.41.b: "A worthless idea!"

    SER_politics.42.t: "A Treaty with Serbia?"
    SER_politics.42.d: "The Serbian government has proposed an alliance against the Ottoman Empire. In return for joint action, Belgrade suggests that Thessaly and Epirus should fall to Greece and Bosnia and Herzegovina to Serbia, with the fate of other lands left to future agreement. Such a treaty would strengthen our hand, but it might also drag us into a war on Serbia's timetable rather than our own."
    SER_politics.42.a: "An interesting idea!"
    SER_politics.42.b: "A worthless idea!"

    SER_politics.43.t: "Cooperation with Rakovski"
    SER_politics.43.d: "Georgi Sava Rakovski is one of the most remarkable figures in Bulgarian and Balkan history. Born in 1821 in Kotel to a well-off family, he threw himself into revolutionary work from an early age and has become the pioneer of the Bulgarian national liberation movement. Since 1860 he has lived in Belgrade, where he publishes the newspaper 'Dunavski Lebed' (The Danube Swan) and has drafted a 'Plan for the Liberation of Bulgaria' built on armed bands and Serbian support. His writings are known throughout the Balkans. Working with him could open the way to a common Serbo-Bulgarian struggle."
    SER_politics.43.a: "An interesting idea!"
    SER_politics.43.b: "A worthless idea!"

    SER_politics.44.t: "Tension in Bulgaria and Macedonia"
    SER_politics.44.d: "Our governors in Bulgaria and Macedonia report growing unrest. Armed bands are crossing from Serbia, Bulgarian volunteers are being organised into a legion in Belgrade, and revolutionary pamphlets are circulating in the villages. Belgrade denies everything, but no one doubts where the money and weapons are coming from."
    SER_politics.44.a: "What?!"

    SER_politics.45.t: "Mihailo Obrenović"
    SER_politics.45.d: "Mihailo Obrenović is the son of Prince Miloš, founder of the dynasty, and Princess Ljubica. He first came to the throne at sixteen, after his father's abdication and the early death of his elder brother Milan.\nHis first reign (1839-1842) was a constant struggle with the supporters of the 1838 Constitution, who sought to restrain the Prince's power and enjoyed the backing of Sultan Abdülmecid. In August 1842 the confrontation became an open rebellion led by Toma Vučić-Perišić, and Mihailo was forced to flee across the Sava into Austria.\nHe spent the next sixteen years in exile in Vienna and on the family estates in Wallachia. In 1853 he married the Hungarian Countess Júlia Hunyady. He returned to Serbia after Aleksandar Karađorđević was deposed at the end of 1858, and took the throne for the second time on his father's death in 1860.\nThe future of our country now lies in the hands of the Obrenović dynasty and Prince Mihailo."
    SER_politics.45.a: "Interesting!"

    SER_politics.46.t: "The Constitution of 1838"
    SER_politics.46.d: "Serbs rose again and again against Prince Miloš's autocratic and often brutal rule. After Mileta's Rebellion he agreed in 1835 to the remarkably liberal Sretenje Constitution, which divided power between the Prince, a State Council and the Assembly. Russia, Austria and the Porte all saw it as a threat to their own autocratic systems; Metternich mocked the idea that a vassal principality should have its own flag and ministries. Within weeks Miloš suspended it.\nIn 1838 the Sultan issued a new constitution instead, drafted under Russian influence. Since the Hatt-i Sharif of 1830 had already granted Serbia its political rights, it contained mostly administrative provisions. Its real purpose was to bind the Prince to a State Council of seventeen members appointed for life, who could only be removed with the Sultan's consent. Russia insisted on the Council so that it could exert pressure on the Prince, and Miloš abdicated in 1839 rather than live under it. The 'Turkish Constitution' has defined Serbian politics ever since."
    SER_politics.46.a: "Interesting!"

    SER_politics.47.t: "Bulgarian Immigration from the Ottoman Empire"
    SER_politics.47.d: "Bulgarians have left their homeland for freer lands for centuries, settling in Wallachia, Serbia, the Austrian Empire and Russia, from Bessarabia and the Crimea to Craiova and Vojvodina. In the last decade the number of Bulgarians within Serbia's borders has grown markedly, as Serbian and Bulgarian revolutionaries alike have stirred up the idea of national liberation on both sides of the border. We look forward to seeing what this Serbo-Bulgarian friendship will bring..."
    SER_politics.47.a: "Interesting!"

    SER_politics.48.t: "Great Power Intervention?"
    SER_politics.48.d: "The coup in Serbia has alarmed the neighbouring powers, above all the Ottoman Empire, which regards any upheaval in its vassal as a challenge to its authority. Threats of military intervention are already arriving from Constantinople."
    SER_politics.48.a: "We shall wait and see."

    SER_politics.49.t: "The Serbian Coup"
    SER_politics.49.d: "Prince Aleksandar of our vassal Serbia has turned on his own State Council. Councillors have been forced out of office and arrested, although the Sultan's constitution of 1838 placed the Council there to restrain the Prince, and its members may not be removed without the Porte's consent. How should we respond?"
    SER_politics.49.a: "Send in the commission."

    SER_politics.50.t: "The Karađorđević Dynasty Prevails"
    SER_politics.50.d: "The Karađorđević dynasty has won the power struggle and cemented its rule over Serbia!"
    SER_politics.50.a: "Long live Serbia!"

    SER_politics.51.t: "The Obrenović Dynasty Prevails"
    SER_politics.51.d: "The Obrenović dynasty has won the power struggle and returned to the throne of Serbia!"
    SER_politics.51.a: "Long live Serbia!"

    SER_politics.52.t: "Ilija Garašanin's Diplomatic Manoeuvres"
    SER_politics.52.d: "On the advice of the Austrian consul, Prince Aleksandar has let it be known that he suspects Ilija Garašanin of involvement in Tenka's Plot. The accusation has turned Garašanin, the most capable statesman in Serbia, against the Prince, and his friends in Vienna and Constantinople are now asking whether Aleksandar is still fit to rule. What should the Prince do?"
    SER_politics.52.a: "Do nothing."
    SER_politics.52.b: "Give concessions to Austria and the Porte."

    SER_politics.53.t: "The Direction of Serbian Foreign Affairs"
    SER_politics.53.d: "Serbia cannot stand alone between the empires. We must decide which of the Great Powers we will try to win to our side: Austria, our powerful neighbour and main trading partner, or a wider circle of friends in Paris, St. Petersburg and even Constantinople."
    SER_politics.53.a: "Improve ties with several Great Powers."
    SER_politics.53.b: "Improve ties with Austria exclusively."

    SER_politics.54.t: "Death of Miloš Obrenović"
    SER_politics.54.d: "On 26 September 1860, Miloš Obrenović, the hero of the Second Uprising and founder of modern Serbia, died of natural causes at the age of eighty."
    SER_politics.54.a: "May he rest in peace."

    SER_politics.55.t: "Rumours of a Coup against the Prince"
    SER_politics.55.d: "Aleksandar Karađorđević has never accepted the verdict of the Saint Andrew's Assembly. Our agents report that his friends and relatives are plotting to bring him back, and that money is changing hands in Pest and Belgrade. We must make sure that the Prince remains safe."
    SER_politics.55.a: "Strengthen the police force!"

    SER_politics.56.t: "The Majstorović Plot Exposed"
    SER_politics.56.d: "Our police have caught the conspirators before they could strike. Weapons, letters and money have been seized, and the trail leads back to the friends of the exiled Karađorđević family. What should their fate be?"
    SER_politics.56.a: "To the Supreme Court."
    SER_politics.56.b: "Kill them all."

    SER_politics.57.t: "Mihailo Obrenović Is Dead"
    SER_politics.57.d: "Today our Prince, Mihailo Obrenović, has been assassinated. Our failure to uncover the plot in time has allowed the conspirators to succeed, and the country is in shock."
    SER_politics.57.a: "Rest in peace."

    SER_politics.58.t: "Aleksandar Karađorđević Returns"
    SER_politics.58.d: "Following the assassination of Mihailo Obrenović, Aleksandar Karađorđević has returned to Belgrade to reclaim his title as Prince of Serbia. His supporters have seized the government offices, and the army, leaderless and confused, has not resisted."
    SER_politics.58.a: "Long live the Karađorđević dynasty!"

    SER_politics.59.t: "The Plot Organisers Fall Out!"
    SER_politics.59.d: "Having seized power, Prince Aleksandar has quarrelled with the conspirators who put him back on the throne. One of them, Milovan Janković, has raised the standard of revolt and taken control of part of the country. Serbia stands on the edge of civil war."
    SER_politics.59.a: "God help Serbia!"

    SER_politics.60.t: "Assassination of Mihailo Obrenović"
    SER_politics.60.d: "On 10 June 1868, Prince Mihailo was walking with his cousin Anka Konstantinović and her daughter Katarina in the park of Košutnjak, near his country residence on the outskirts of Belgrade. The brothers Kosta and Pavle Radovanović, dressed in formal black suits, appeared on the path, and Kosta approached with a loaded pistol. The Prince recognised him: the Radovanović family bore him a grudge over the case of their brother Ljubomir. His last words, Kosta later admitted at his trial, were: 'So it is true.' Mihailo and Anka were shot dead and Katarina was wounded. Who stood behind the assassins has never been fully established; the supporters and relatives of the Karađorđević dynasty were suspected, but nothing was ever proven."
    SER_politics.60.a: "God help Serbia!"
    SER_unlock_tree_tt: "Unlocks a new political tree."

    SER_politics.61.t: "Milan Obrenović"
    SER_politics.61.d: "Following the assassination of his cousin Mihailo, the fourteen-year-old Milan Obrenović, grandson of Prince Miloš's brother Jevrem, has been proclaimed Prince of Serbia. Until he comes of age, the country must be governed by a regency. Our first task is to make sure that a functioning government is in place."
    SER_politics.61.a: "Long live Serbia!"

    SER_politics.62.t: "Prince Milan Visits the Tsar"
    SER_politics.62.d: "Prince Milan of Serbia has travelled to the Crimea to pay his respects to Tsar Alexander II at Livadia. Relations between Belgrade and St. Petersburg cooled during the early years of the regency, when the regents looked to Vienna and Pest for support. The young Prince's visit, warmly received by the Tsar and his court, marks a reconciliation between the two Orthodox nations."
    SER_politics.62.a: "An important move."

    SER_politics.31.t: "Aleksandar Karađorđević Found Dead"
    SER_politics.31.d: "News has reached Belgrade that Aleksandar Karađorđević, the deposed prince, has died in exile. For his supporters it is a bitter blow; for his enemies, the removal of a constant threat. His claim now passes to his son Petar, a young man who has already shown more taste for adventure than for patience."
    SER_politics.31.a: "Interesting."

    SER_politics.32.t: "The Army Interferes in Politics"
    SER_politics.32.d: "Regent Blaznavac has brought troops into Belgrade and made it clear that the army will not tolerate ministers who defy the regency. Officers loyal to him have taken control of the ministries and the telegraph. The politicians must decide whether to accept the army's guardianship or resist it."
    SER_politics.32.a: "Support the army."
    SER_politics.32.b: "Do not support the army."

    SER_politics.33.t: "Unite All Democratic Forces"
    SER_politics.33.d: "Faced with the threat of military rule, liberals, moderate conservatives and even some of the young radicals have set aside their quarrels. Together they demand that the regency respect the constitution and the Assembly, and that the army return to its barracks."
    SER_politics.33.a: "In unity there is strength."

    SER_politics.34.t: "The Democratic Bloc Shows Resistance"
    SER_politics.34.d: "The new democratic bloc refuses to be intimidated. Deputies are meeting openly, newspapers are printing appeals to the people, and crowds are gathering in front of the Assembly. Blaznavac's officers are waiting for orders. One wrong step, and Belgrade could see blood in its streets."
    SER_politics.34.a: "We will not surrender."
    SER_politics.34.b: "We have no choice but to back down."

    SER_politics.35.t: "Coup d'État in Serbia"
    SER_politics.35.d: "With the backing of the politicians who chose to support him, Regent Blaznavac has completed his seizure of power. Opposition leaders have been placed under arrest or forced into exile, and the army now stands behind every decision of the regency."
    SER_politics.35.a: "The army has spoken."

    SER_politics.36.t: "Address to the Serbian People"
    SER_politics.36.d: "The leaders of the democratic bloc have published an address to the Serbian people, calling on every citizen to defend the constitution. Across the country, district assemblies, priests and officers have declared their support. Faced with the prospect of firing on his own people, Blaznavac has given way: the troops are returning to their barracks."
    SER_politics.36.a: "Blaznavac is forced to back down."

    SER_economy.1.t: "Widespread Bankruptcy"
    SER_economy.1.d: "Unfortunate news has arrived on our doorstep: bankruptcies are spreading across the country, among merchants, craftsmen and indebted peasants alike. Our economy has been severely wounded, and many question whether Serbia can remain economically independent if nothing is done. What should be our course of action?"
    SER_economy.1.a: "Take any measures to avoid future bankruptcies."
    SER_economy.1.b: "It will all just blow over."
    SER_economy.1.c: "Call the Austrians, they might help us."

    SER_economy.2.t: "Increasing Property Prices"
    SER_economy.2.d: "With so many debtors forced to sell, and so few with money to buy, the price of land and houses in the towns has swung wildly. Speculators are buying up property cheaply and reselling it at inflated prices, while the poor can no longer afford a roof over their heads. Unemployment and inflation are growing hand in hand."
    SER_economy.2.a: "Take any measures to avoid future bankruptcies."

    SER_economy.3.t: "Peaceful Protests in Belgrade"
    SER_economy.3.d: "Craftsmen, apprentices and ruined small traders have gathered in front of the government buildings in Belgrade, demanding help against the usurers and the rising cost of living. So far the protests are peaceful, but the crowd grows every day. Should we send in the police to break them up?"
    SER_economy.3.a: "Yes, send in the police."
    SER_economy.3.b: "No, don't send in the police."
    SER_tt_worker_strikes: "§YThis option will lead to§! §Rworker strikes§! §Yacross the country!§!"

    SER_economy.4.t: "Workers Strike"
    SER_economy.4.d: "The crackdown in Belgrade has backfired. Workers in the workshops, mines and river ports have laid down their tools, demanding the wages they are owed. Promising to pay them would cost money we do not have; refusing could turn the strike into something worse."
    SER_economy.4.a: "Promise them their wages."
    SER_economy.4.b: "No promises."

    SER_economy.5.t: "Labourers Boycott Goods"
    SER_economy.5.d: "Denied their wages, the strikers have called on the whole country to stop buying from the merchants and manufacturers they blame for the crisis. The boycott is spreading from town to town, and many workshops have stopped production altogether."
    SER_economy.5.a: "This is not good."

    SER_economy.6.t: "Looming Bankruptcy"
    SER_economy.6.d: "The treasury is nearly empty, the boycott has crippled what was left of our industry, and the state itself is close to bankruptcy. We can attempt a programme of reforms of our own, or wait in the hope that one of the Great Powers will step in rather than see Serbia collapse."
    SER_economy.6.a: "Do something."
    SER_economy.6.b: "Wait it out."

    SER_economy.7.t: "Corporate Changes"
    SER_economy.7.d: "Our reforms are beginning to take effect. Budget policy is being coordinated across the ministries, new agricultural methods are spreading and working hours are being regulated. Encouraged by the government, peasants and craftsmen are forming cooperatives to buy, sell and borrow together, freeing themselves from the usurers."
    SER_economy.7.a: "This is what we needed."

    SER_economy.8.t: "Britain Intervenes"
    SER_economy.8.d: "London has no wish to see a bankrupt Serbia fall into the arms of Russia or Austria. British bankers, encouraged by the Foreign Office, have offered short-term credit to keep the Serbian treasury afloat while we put our affairs in order."
    SER_economy.8.a: "Just in time..."

    SER_economy.9.t: "France Intervenes"
    SER_economy.9.d: "Paris has decided that Serbia is too useful a friend to be allowed to go under. French financiers have extended emergency credit to our treasury, and the French consul has promised that more help will follow if we carry out the necessary reforms."
    SER_economy.9.a: "Just in time..."

    SER_economy.10.t: "Britain Intervenes - New Capital"
    SER_economy.10.d: "Satisfied with our progress, British investors are now bringing in fresh capital. Several London houses are prepared to invest in Serbian trade, mines and transport, provided that the government guarantees their security."
    SER_economy.10.a: "This will help our economy stabilise."

    SER_economy.11.t: "France Intervenes - New Capital"
    SER_economy.11.d: "Following the emergency credit, French banks are ready to invest in Serbia for the long term. Their capital could rebuild our credit system and finance new enterprises, though it will also bind us more closely to Paris."
    SER_economy.11.a: "This will help our economy stabilise."

    SER_economy.12.t: "Serbia Asks Us to Help Its Economy"
    SER_economy.12.d: "Serbia has been hit by widespread bankruptcies and has asked us for help. If we provide capital, Belgrade will be in our debt for a long time to come, and our influence there will grow accordingly."
    SER_economy.12.a: "Decline."
    SER_economy.12.b: "Accept."

    SER_economy.13.t: "Austria Declines to Help"
    SER_economy.13.d: "Vienna has refused our request. We can now either take foreign credit at a much higher cost, or hope that the crisis will pass on its own."
    SER_economy.13.a: "It will blow over."
    SER_economy.13.b: "Take foreign credit."

    SER_economy.14.t: "Austria Agrees to Help"
    SER_economy.14.d: "Vienna has stepped in to prevent our bankruptcy! Austrian capital will flow into our economy, but in the long run we will be in Austria's debt, and Austria never forgets a debt."
    SER_economy.14.a: "This will help our economy stabilise."

    SER_economy.15.t: "The People Demand Action Against Inflation"
    SER_economy.15.d: "Prices are rising faster than wages, and the promised wages still have not been paid. Petitions are arriving from every district. We can no longer ignore the people; we must act to bring inflation under control."
    SER_economy.15.a: "We will stabilise the economy."

    SER_economy.16.t: "The Kučajna Mines"
    SER_economy.16.d: "Engineers working the old mines of Kučajna have opened new coal seams. The output is modest, but with the steamships and workshops of the capital hungry for fuel, every ton counts."
    SER_economy.16.a: "Put them to work."

    #HEAD OF State

