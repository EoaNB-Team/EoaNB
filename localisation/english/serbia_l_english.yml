    SER_establish_national_army: "Act on Establishment of the National Army"
    SER_establish_national_army_desc: "Our regular army numbers barely a few thousand men, and the Sublime Porte cannot be trusted to defend our borders. The Prince will promulgate an act creating a National Army in which every able-bodied Serb is registered, armed and trained, giving the principality tens of thousands of soldiers in time of war. The Ottomans will protest, but Serbia will no longer depend on anyone else for its defence."

    SER_people_army_decree: "Decree of the People's Army"
    SER_people_army_decree_desc: "With the Decree of the People's Army we openly declare what everyone already knows: our army exists for the liberation of the nation. Arming it will not be easy. We lack factories, foundries and even uniforms, and much will have to be bought abroad at great cost. Perhaps we will still fall short of our goals, but this is the course we have chosen, and we will follow it."

    SER_mondain_army_reform: "Hippolyte Mondain's Army Reform"
    SER_mondain_army_reform_desc: "Hippolyte Mondain, the French engineer officer who first came to Belgrade during the Crimean War to plan the defence of Serbia, has accepted our invitation to return and head our new Ministry of War. He will be given broad powers to reorganise the army on the French model, and we will do our utmost to put his proposals into practice."

    SER_zajecar_fortification: "Zaječar Fortifications"
    SER_zajecar_fortification_desc: "Zaječar guards the Timok valley and the road from Vidin and Bulgaria, and any Ottoman offensive from the east will strike it first. Following Mondain's survey of the principality, we will fortify the approaches to the town with a ring of earthworks and redoubts built to his designs."

    SER_danub_fortification: "Danube Fortifications"
    SER_danub_fortification_desc: "Our future wars will most likely be fought to the south and west, but we cannot forget the long Danube frontier. Austria is no friend of Serbia, and the Ottomans still hold fortresses on the river. Fortified crossing points along the Danube will ensure that no enemy can simply march into the heart of the country."

    SER_belgrad_fortification: "Belgrade Forts"
    SER_belgrad_fortification_desc: "Belgrade is the capital, the seat of the government and the richest town in Serbia. In any war it would be the first target, and losing it would be a catastrophe. A line of field fortifications on the heights around the city will hold off any assault long enough for the army to come to its relief."

    SER_kragujevac_factory: "Kragujevac Factory"
    SER_kragujevac_factory_desc: "Since the cannon foundry was moved there in 1851, Kragujevac has become the arsenal of Serbia. Safe in the centre of the country, far from the Ottoman fortresses on the Danube, it is the ideal place to concentrate our military industry. The foundry will be enlarged, and new workshops built for small arms, ammunition and equipment."

    SER_modern_army_rifle: "Modern Army Rifle"
    SER_modern_army_rifle_desc: "Our soldiers still carry a jumble of old flintlocks and smoothbore muskets. A modern rifled weapon with a reliable percussion lock would multiply the strength of our small army. We cannot design and build such a rifle ourselves yet, so we must look to foreign gunmakers for the weapons or the patterns."

    SER_contract_with_belgian: "Contracts with Belgian Companies"
    SER_contract_with_belgian_desc: "The gunmakers of Liège are among the best and cheapest in Europe and sell to anyone who can pay. Firms like Auguste Francotte & Co. are already familiar with Serbian requirements, and a large contract would be welcome to them. Their designs are good, though our officers would have preferred weapons proven in a great war."

    SER_contract_with_french: "Contracts with French Companies"
    SER_contract_with_french_desc: "Few nations can match France's military reputation, and with a Frenchman leading our Ministry of War, Paris may look kindly on our requests. French arms are excellent but expensive, and we can only hope that the firms we approach are willing to deal with a small Balkan principality on terms we can afford."

    SER_petrovic_system_rifle: "Minié-Francotte-Petrović System Rifle"
    SER_petrovic_system_rifle_desc: "Our new service rifle is a Minié-system weapon made by Auguste Francotte in Liège and adapted to specifications drawn up by Milivoje Petrović Blaznavac. Rugged, accurate and designed for Serbian needs, it will be issued to the regular army first and then, as deliveries allow, to the National Army."

    SER_stragari_gunpowder: "Stragari Gunpowder Magazine"
    SER_stragari_gunpowder_desc: "Since the First Serbian Uprising, the gunpowder mill at Stragari has been one of the most important military sites in Serbia, but today it is little more than a storehouse. An expanding army cannot live on stockpiles and imports. Stragari will be rebuilt to manufacture powder in quantity once again."

    SER_artillery_administration_law: "Law of Artillery Administration"
    SER_artillery_administration_law_desc: "The production, storage and maintenance of our artillery is scattered between several offices that barely speak to one another. The new law will place the foundry, the arsenals and the powder works under a single artillery administration, and formally designate Kragujevac as the centre of Serbian military production."

    SER_artillery_school: "Artillery School"
    SER_artillery_school_desc: "Founded in 1850 under the direction of the Czech-born officer František Zach, the Artillery School is Serbia's first military academy, yet it is still small and short of teachers. We will invite officers from the Austrian army, especially Serbs from the Military Frontier, to teach there, and give the school the means to train every future officer of the Serbian army."

    SER_la_hitte_cannons: "La Hitte Cannons"
    SER_la_hitte_cannons_desc: "With our artillery reorganised, we can turn to modernising the guns themselves. The French La Hitte system, though still muzzle-loading, uses rifled barrels and fires explosive shells with far greater range and accuracy than our old smoothbores. Adopting it will give our batteries a firepower our neighbours will not expect."

    SER_serbian_gendarmerie: "Serbian Gendarmerie"
    SER_serbian_gendarmerie_desc: "Following the French model, we will create a gendarmerie of our own to fight banditry, guard the roads and keep order in the districts. It will begin as a small, well-trained force in Belgrade, but it can be expanded as the needs of the state grow."

    SER_military_uniform_regulation: "Military Uniform Regulation"
    SER_military_uniform_regulation_desc: "Our soldiers still turn up in whatever their villages could provide. Our French advisors insist that a proper uniform regulation, like the one adopted in France, would improve both discipline and morale. Every unit will receive a standard, practical uniform, and with it a sense of belonging to a real army."

    SER_french_medical_officer: "French Medical Officers"
    SER_french_medical_officer_desc: "In past wars, more Serbian soldiers died of wounds and disease than at the hands of the enemy. French military surgeons will be invited to organise our medical service, train our doctors and orderlies, and establish field hospitals. Their lessons will serve our army for decades."

    SER_blaznavac_war_minister: "Appoint Blaznavac as the Minister of War"
    SER_blaznavac_war_minister_desc: "Mondain has served Serbia well and beyond the term he promised, and now he returns to France. His natural successor is Milivoje Petrović Blaznavac, who ran the cannon foundry at Kragujevac, designed our rifles and knows the army better than any man alive. His relationship with the dynasty has had its ups and downs, but his loyalty and talent are beyond doubt."

    SER_army_political_influence: "Army's Influence in Politics"
    SER_army_political_influence_desc: "Our princes have been driven out and recalled more than once in a single generation, and every change of ruler has shaken the state. The army is the youngest and most disciplined of our institutions. Allowing it a voice in politics may give the country stability - or it may simply make the generals the new kingmakers."

    SER_corruption_affair: "Corruption Affair"
    SER_corruption_affair_desc: "An investigation into army procurement has uncovered a web of kickbacks, inflated contracts and missing supplies. Making an example of the guilty officers and their civilian partners will be painful, but it will restore confidence in the army and in the minister who leads it."

    SER_belgrade_military_drills: "Military Drills in Belgrade"
    SER_belgrade_military_drills_desc: "An army without drill is a mob. Large-scale exercises around Belgrade will test the regiments, the artillery and the new staff. They will also give the minister of war the chance to show the capital, and the politicians, who truly commands its garrison."

    SER_army_dominance: "Army Dominance"
    SER_army_dominance_desc: "The army's influence in politics has grown with every crisis. Now, with the plans of the military command coming into full effect, it has become the decisive force in the state. No government can survive without its consent."

    SER_fresh_russian_capitals: "Fresh Russian Capital"
    SER_fresh_russian_capitals_desc: "Russia has been our most reliable supporter for generations, and the money sent from St. Petersburg has come at just the right time. These funds will be devoted above all to our military industry, so that the next war finds Serbia armed with its own weapons."

    SER_rearm_serbian_military: "Rearmament of the Serbian Army"
    SER_rearm_serbian_military_desc: "The old garrison troops, poorly armed and barely trained, can no longer be the backbone of our defence. A full rearmament will issue modern rifles, uniforms and equipment to every regiment of the regular and National Army, and retire the garrison system once and for all."

    SER_military_foundry: "Military Foundry"
    SER_military_foundry_desc: "The workshops at Kragujevac are respectable, but they cannot keep up with an army that is growing year by year. A modern foundry with steam-driven machinery will let us cast our own guns, repair our own rifles and produce our own ammunition on a scale that frees us from foreign suppliers."

    SER_european_model_army: "European Model Army"
    SER_european_model_army_desc: "Serbia may not be the first country that comes to mind when Europeans think of a modern army, yet we have reformed our regiments, trained our soldiers and adopted modern weapons and tactics. Our army is no match for the Great Powers, but it is a model to all our neighbours, and it will prove its worth in the years to come."

    SER_new_generals: "New Generals in the Army"
    SER_new_generals_desc: "Our investment in education has borne fruit. A new generation of officers, trained at the Artillery School and abroad, is ready to take command. They may seem young, but they understand modern warfare far better than the veterans of the uprisings who still fill the senior ranks."

    SER_franco_prussian_observer: "Ask France and Prussia for Military Assistance"
    SER_franco_prussian_observer_desc: "The war between France and Prussia is the greatest conflict between the Great Powers in a generation. Sending observers to both armies will show us at first hand how breech-loading rifles, rifled artillery and railways have changed the battlefield, lessons that could give our small army a decisive edge."

    SER_greater_military_autonomy: "Greater Military Autonomy"
    SER_greater_military_autonomy_desc: "The Porte, eager to keep us loyal, has relaxed the last restrictions on our armed forces. It hopes that greater autonomy will make us content; instead, it gives us the freedom to expand and reorganise the army for the war we are preparing."

    SER_secret_military_council: "The Secret Military Council"
    SER_secret_military_council_desc: "Our highest generals and strategists will meet in secret to prepare the plan of campaign. We have friends among the Bulgarians, the Montenegrins and the Russians, but we cannot leave our fate to them. Who will lead, where we will strike, and how our allies are to be coordinated must be decided now, so that when war comes we can move faster than the Ottomans can react."

    SER_coordinate_military_actions: "Coordinate Military Actions"
    SER_coordinate_military_actions_desc: "Greeks, Bulgarians, Montenegrins and many other peoples of the Ottoman Empire share our aims, and fighting together would make victory far easier. Our greatest efforts will go to our nearest neighbours, the Bulgarians and Montenegrins: shared plans, shared intelligence and an agreed signal for the rising."

    SER_convocate_second_bulgarian_legion: "Convocation of the Second Bulgarian Legion"
    SER_convocate_second_bulgarian_legion_desc: "Serbia can only raise so many soldiers, but there are thousands of Bulgarian émigrés eager to fight. As in 1862, we will gather them into a Bulgarian Legion, arm and train them in Belgrade, and send them home when the time comes. They will fight hardest on their own soil, and may one day go their own way, but for now they are invaluable."

    SER_join_forces_montenegro: "Join Forces with Montenegro"
    SER_join_forces_montenegro_desc: "The Montenegrins are our closest kin, but they will not merge with Serbia today. They will, however, fight beside us to win back the lands both of our peoples claim from the Ottomans. If we succeed, our borders will meet in the Sandžak, and the two Serbian states will stand shoulder to shoulder."

    SER_prepare_for_war: "Prepare for the War"
    SER_prepare_for_war_desc: "War is coming, and Serbia must be ready. We will mobilise our forces, call up conscripts, fortify our towns and stockpile supplies. This war will decide the fate of the nation, and its burden will be shared by every household. We must hope the people can bear it, and that our armies will prevail."

    SER_grujic_war_plan: "Major Grujić's War Plan"
    SER_grujic_war_plan_desc: "One of our leading strategists, Sava Grujić, has proposed a bold plan: a concentrated drive south-east towards Niš to destroy the main Ottoman army before it can gather its strength. If it succeeds, the whole of the Morava valley will lie open to us. If it fails, or if the Russians do not march, it could end in disaster."

    SER_serbian_ottoman_war: "Serbian-Ottoman War"
    SER_serbian_ottoman_war_desc: "The time has come. We can no longer tolerate the Ottoman yoke. We will liberate every Serbian district we can reach, help free the rest of the Balkans from the Sultan's grasp, and trust that our historic rights, and the sympathy of Europe, will keep the other Great Powers from intervening against us."

