    ###Country Flags
    SER_obrenovic_dynasty: "The Obrenović Dynasty Rules"
    SER_karadjordjevic_dynasty: "The Karađorđević Dynasty Rules"

    SER_aleksandar_karadordevic: "Aleksandar Karađorđević was born in 1806 in Topola, the son of Karađorđe, leader of the First Serbian Uprising. After his father's murder in 1817 he grew up in exile in Bessarabia, and only returned to Serbia in the 1830s to serve in the princely army. When the Defenders of the Constitution drove Prince Mihailo out in 1842, they chose Aleksandar to replace him.\n\nA mild and modest man, Aleksandar has reigned more than ruled. Real power lies with the oligarchs of the State Council, who made him prince and never let him forget it. His cautious, Austrophile policy during the Crimean War has cost him the sympathy of Russia and of much of his own people, and now even the men who raised him to the throne are plotting against him."
    SER_milos_obrenovic: "Born in 1780 in the village of Gornja Dobrinja, Miloš Obrenović rose from a peasant cattle-dealer to become the founder of modern Serbia. A commander in the First Serbian Uprising, he stayed behind when Karađorđe fled in 1813, and in 1815 led the Second Uprising, winning autonomy through a shrewd mixture of war and diplomacy. In 1817 he had his rival Karađorđe killed and was proclaimed hereditary prince; in 1830 the Sultan confirmed Serbia's autonomy.\n\nMiloš ruled as an autocrat, treating the state as his personal estate, and his harshness provoked revolt after revolt. In 1839, rather than submit to the 'Turkish Constitution', he abdicated and went into exile. Now nearly eighty, he has returned at the call of the nation, as shrewd, stubborn and determined to rule as ever."
    SER_mihailo_obrenovic: "The younger son of Prince Miloš and Princess Ljubica, Mihailo Obrenović was born in 1823 in Kragujevac. He first became prince at sixteen, after his father's abdication and the death of his elder brother Milan, but was overthrown in 1842 by Toma Vučić-Perišić and spent sixteen years in exile, mostly in Vienna. There he studied, travelled widely and married the Hungarian Countess Júlia Hunyady.\n\nReturning to the throne on his father's death in 1860, Mihailo is the most European of Serbia's rulers: educated, reserved and ambitious. He rules as an enlightened absolute monarch, building a national army and a modern administration, and dreams of uniting the Balkan peoples in a war that will end Ottoman rule for good."
    SER_milan_obrenovic: "Milan Obrenović was born in 1854 in Mărăşeşti, Moldavia, the grandson of Jevrem Obrenović, Prince Miloš's brother. His father died when he was a child, and his cousin Prince Mihailo took charge of his upbringing, sending him to study at the Lycée Louis-le-Grand in Paris. When Mihailo was assassinated in 1868, the fourteen-year-old schoolboy suddenly found himself heir to the throne.\n\nIntelligent, impulsive and fond of Western culture, the young Prince reigns under the guardianship of a regency led by Milivoje Blaznavac and Jovan Ristić. He is learning quickly that the throne of Serbia is a dangerous inheritance."
    SER_national_assembly_desc: "With the throne vacant, the National Assembly and the ministers it trusts govern the principality, keeping the state running until the question of the succession is settled."

    SER_milivoje_blaznavac_army_chief_desc: "Milivoje Petrović Blaznavac, born in 1824, has become the leading figure of the Serbian army. He ran the cannon foundry at Kragujevac, had our first modern rifle built to his own specifications, and knows the army's needs better than anyone. Ambitious and ruthless, he is as much a politician as a soldier."
    SER_Milivoje_Blaznavac_HC_desc: "As Minister of War, Milivoje Blaznavac continues Mondain's reforms with a Serbian hand: expanding the arsenals, training the National Army and quietly building a loyal following among the officers."
    SER_ranko_alimpic_high_command_desc: "Ranko Alimpić is a hard-working infantry officer who has risen through the ranks of the princely army. His sound grasp of infantry tactics makes him a valuable member of the high command."
    SER_stevan_zdravkovic_high_command_desc: "A graduate of the Artillery School, Stevan Zdravković brings practical knowledge of the guns and their crews to the high command."
    SER_tihomilj_nikolic_high_command_desc: "Tihomilj Nikolić is a meticulous staff officer with a talent for supply and organisation, making sure our troops have what they need, where and when they need it."
    SER_Hipolit_Mondain_HC_desc: "Hippolyte Mondain, born in Paris in 1811, is an engineer officer of the French army who first came to Serbia during the Crimean War to plan its defence. Now he heads the Serbian Ministry of War, reorganising the army on the French model with tireless energy."
    SER_Frantisek_Zach_HC_desc: "František Zach, a Czech from Moravia and a veteran of the Polish uprising of 1830, came to Serbia in 1843. His plan for Serbian national policy served as the basis for Garašanin's Načertanije, and in 1850 he founded the Artillery School, through whose classrooms almost every educated officer in the Serbian army has passed."
    SER_advisor_jevrem_grujic_desc: "Jevrem Grujić is one of the 'Saint Andrew's liberals', the young lawyers and writers who led the Assembly of 1858 against the oligarchs. A tireless advocate of constitutional government, he wants the state to rest on clear laws rather than on the will of its rulers."
    SER_dorde_cenic_desc: "Đorđe Cenić is a respected jurist and one of the most capable administrators in Serbia. He works to modernise the courts and codify Serbian law, and to keep the government firmly within its bounds."
    SER_advisor_jan_nevole_desc: "Jan Nevole, a Czech architect, came to Serbia in the 1850s and built the famous mansion of Captain Miša Anastasijević in Belgrade. His work is introducing European building methods and styles to Serbian towns."
    SER_advisor_josif_pancic_desc: "Josif Pančić, physician and botanist, has spent years exploring the mountains of Serbia and describing its flora. As professor at the Belgrade Lyceum, he is training the first generation of Serbian natural scientists."
    SER_advisor_misha_anastasijevic_desc: "Captain Miša Anastasijević, the richest man in Serbia, built his fortune on the salt trade from Wallachia. Shrewd and generous in equal measure, he can bring both money and influence to the government's side."
    SER_advisor_sima_andreevic_desc: "Sima Andrejević Igumanov, a native of Prizren who made his fortune in the tobacco trade in Russia, devotes his wealth to the education of the Serbs still living under Ottoman rule."
    SER_advisor_milutin_garasanin_desc: "Milutin Garašanin, son of the statesman Ilija Garašanin, is a young conservative politician educated abroad. He favours a strong, orderly state, a professional administration and good relations with the Western powers."
    SER_lazar_brsenijevic_batalaka_desc: "Lazar Arsenijević Batalaka, born in 1793, is a veteran of the old administration and one of the pillars of the Defenders of the Constitution. A former minister and state councillor, he is also the author of a history of the First Serbian Uprising drawn from the recollections of its participants."
    SER_advisor_ilija_garasanin_desc: "Ilija Garašanin is the most experienced statesman in Serbia. As Minister of the Interior in 1844 he drew up the secret Načertanije, the programme for uniting the Serbian lands, and as Prime Minister and Foreign Minister under Prince Mihailo he is weaving the network of treaties that will bind the Balkan peoples together against the Porte."
    SER_vladimir_jovanovic_desc: "Vladimir Jovanović, economist and political writer, is the leading theorist of Serbian liberalism. Educated in Germany and widely travelled in the West, he is a guiding spirit of the United Serbian Youth and a champion of free institutions."
    SER_advisor_szabo_j_desc: "József Szabó, professor of mineralogy at the University of Pest, is one of the leading geologists of the Habsburg lands. His studies of volcanic rocks and ore deposits are helping us understand the mineral wealth of Serbia."
    SER_advisor_felix_hoffman_desc: "Felix Hofmann is a German mining engineer from an old mining family who has spent years working the mines of eastern Serbia. Now in the state service as a geologist, he is helping to discover and develop our deposits of coal, iron and gold."
    SER_advisor_konstantin_cukic_desc: "Konstantin 'Kosta' Cukić is one of the most capable financial minds in Serbia. As Minister of Finance he champions budgetary discipline, free trade and the creation of a Serbian national currency."
    SER_advisor_georgi_rakovski_desc: "Georgi Sava Rakovski, born in 1821 in Kotel, is the pioneer of the Bulgarian national liberation movement. From Belgrade he publishes revolutionary newspapers, plans armed risings and gathers Bulgarian volunteers into a legion ready to fight beside the Serbs."

    SER_ranko_alimpic_desc: "Ranko Alimpić, born in 1826, is a career officer of the princely army who has served in both staff and line posts. Steady and methodical, he is at his best leading infantry in the field."
    SER_antonije_bogicevic_desc: "Antonije Bogićević is an officer of the princely army, brave and eager, but not yet tested in command of large formations."
    SER_dimitrije_duric_desc: "Dimitrije Đurić has risen through the ranks by courage and hard work. Though he still lacks a formal education, he is a natural leader of men on the battlefield."
    SER_frantisek_zah_desc: "František Zach, the founder of the Artillery School, is better known as a teacher and theorist than as a field commander, but few men in Serbia understand the science of war as well as he does."
    SER_stevan_zdravkovic_desc: "Stevan Zdravković is an artillery officer trained at the Artillery School, competent and dependable, though still junior in rank."
    SER_kosta_protic_desc: "Kosta Protić, a graduate of the Artillery School, is one of the most gifted young officers in Serbia. His sharp mind and talent for organisation make him a rising star of the army."
    SER_dura_horvatovic_desc: "Born in Slavonia, across the Austrian border, Đura Horvatović chose to serve the Serbian principality. Brave, energetic and popular with his men, he is one of the most promising young officers in the army."
    SER_mirko_apostolovic_desc: "Mirko Apostolović is a grizzled veteran of the old guard, respected by his men for the courage and experience he gained in the struggles of the past."
    SER_tihomilj_nikolic_desc: "Tihomilj Nikolić is a careful, methodical officer whose strength lies in logistics and staff work rather than daring manoeuvres."
    SER_Milojko_Lesjanin_desc: "Milojko Lešjanin, born in 1830, is an energetic officer who has made a study of the armies of the Great Powers. Decisive and demanding, he belongs to the new generation of Serbian commanders."
    SER_Sava_Grujic_desc: "Sava Grujić, born in 1840, is a gifted artillery officer and organiser whose talents extend well beyond the battlefield. Many expect him to play a leading role in the state one day."

#Put these where you need it, almost lost them
    SERcuk.1.t: "Čukur Fountain Incident"
    SERcuk.1.d: "A hot summer day. Serbs and Ottoman soldiers are drinking water from a fountain in Belgrade when an argument breaks out over who will draw water first. In the heat of the moment, a Serbian apprentice named Sava Petković breaks a water jug belonging to a Turkish soldier. The soldier strikes the boy on the head and wounds him. The Serbian police send gendarmes to arrest the soldier, and other Turkish soldiers open fire, killing two Serbian policemen. Shots can be heard around the city all night."
    SERcuk.1.a: "Outrageous!"
    SERcuk.2.t: "Negotiate a Truce"
    SERcuk.2.d: "The riots have claimed dozens of lives and must be stopped. We need to negotiate a truce and calm the situation before it grows into an even bigger problem."
    SERcuk.2.a: "Hurry!"
    SERcuk.3.t: "Truce Accepted"
    SERcuk.3.d: "The truce has been accepted, and the situation has calmed, at least a little. We should hold a funeral for those who died. It will take place tomorrow."
    SERcuk.3.a: "Good."
    SERcuk.4.t: "Bombardment of Belgrade"
    SERcuk.4.d: "This morning, during the funeral, the Turks began bombarding Belgrade! People fled, leaving the coffins in the middle of the street. The shelling lasted for hours, leaving 50 people dead, 20 houses destroyed and some 350 damaged. Only the intervention of the British consul brought it to an end."
    SERcuk.4.a: "Unbelievable!"
    SERcuk.5.t: "Peace Conference"
    SERcuk.5.d: "Negotiations have been held near Constantinople with the participation of Russia, Austria, France and the United Kingdom. After some time, it was decided that:\n\n  - the Turkish civilian population must leave Serbia, except for the fortresses of Belgrade, Šabac, Smederevo and Kladovo\n  - the forts of Užice and Soko are to be demolished\n  - the Serbian government will compensate the Ottoman government for the properties the departing Turks leave behind."
    SERcuk.5.a: "We will accept."
    SERcuk.6.t: "Ask for Full Withdrawal"
    SERcuk.6.d: "The garrisons that remain are a constant threat to our capital and a humiliation to our people. With the backing of friendly powers, we will formally ask the Porte to withdraw its soldiers from every fortress in Serbia and hand them over to the Prince."
    SERcuk.6.a: "Send it."
    SERcuk.7.t: "The Ottoman Empire Accepts"
    SERcuk.7.d: "After months of negotiation, the Porte has agreed to hand over the fortresses of Belgrade, Šabac, Smederevo and Kladovo to Prince Mihailo. The last Ottoman soldiers are leaving Serbia, though the Sultan's flag will still fly beside ours over the Belgrade fortress."
    SERcuk.7.a: "Excellent!"
