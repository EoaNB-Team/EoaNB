    #IDEAS

    SER_kragujevac_cannons_foundry: "Kragujevac Cannon Foundry"
    SER_kragujevac_cannons_foundry_desc: "Moved from Belgrade to the safety of Kragujevac in the early 1850s, the state cannon foundry casts our guns, repairs our rifles and is the heart of Serbia's young arms industry."
    SER_serbian_postal_service: "Serbian Postal Service"
    SER_serbian_postal_service_desc: "The state post, with its relay stations and couriers along the main roads, keeps Belgrade in touch with the districts and the army with its headquarters."
    SER_bip: "Belgrade Brewery"
    SER_bip_desc: "Czech and German brewers have brought their craft to Belgrade, and Serbian beer is beginning to compete with imports from across the Sava."
    SER_idea_dissolve_council: "Dissolved Council"
    SER_idea_dissolve_council_desc: "The old State Council has been dissolved and replaced by men loyal to the throne. Opposition to the Prince's government is weakening, though the manner of the change has unsettled many."
    SER_idea_renovate_school: "Renovated Schools"
    SER_idea_renovate_school_desc: "Repaired and newly built state schools are teaching more children than ever, and a new generation is growing up able to read, write and reckon."
    SER_idea_austrian_educated_serbs: "Austrian-Educated Serbs"
    SER_idea_serbian_welfare: "Serbian Welfare"
    SER_idea_serbian_welfare_desc: "The most important mission of Serbian politicians is the prosperity of the nation and its people. Tax relief, help in hard years and care for the veterans of the uprisings bind the people to the throne."
    SER_idea_mandatory_conscription: "Mandatory Conscription"
    SER_idea_mandatory_conscription_desc: "Every able-bodied Serb is registered and liable to serve. Training is shorter and better organised, and the army can draw on the whole nation in the hour of need."
    SER_idea_civil_servant_law_1861: "Civil Servants Law of 1861"
    SER_idea_civil_servant_law_1861_desc: "The Law on Civil Servants has given Serbia a professional bureaucracy with clear rules for appointment, promotion and pay, and has put the state's affairs on a firmer, more orderly footing."
    SER_idea_strengthen_mihailo_regim: "Mihailo's Personal Rule"
    SER_idea_strengthen_mihailo_regim_desc: "Prince Mihailo governs personally, relying on loyal ministers rather than the State Council. His authority shields the government from the shifting currents of opposition."
    SER_idea_strengthen_mihailo_regim1: "Centralised Government"
    SER_idea_strengthen_mihailo_regim1_desc: "The districts have been brought under direct ministerial control, and officials across the country answer to Belgrade. The Prince's will is felt in every corner of Serbia."
    SER_idea_strengthen_mihailo_regim2: "Enlightened Absolutism"
    SER_idea_strengthen_mihailo_regim2_desc: "Prince Mihailo rules as an enlightened absolute monarch. Modern laws, a loyal bureaucracy and a national army have made his regime the strongest Serbia has known."
    SER_opinion_french_sail_danube: "French Companies on the Danube"
    SER_opinion_sarajevo_storming: "Storming of Sarajevo"

    ###Traits
    SER_sergeant: "Sergeant"
    SER_sergeant_desc: "Promoted from the ranks for courage rather than education, he has not yet been trusted with a large command."
    SER_first_captain: "First Captain"
    SER_first_captain_desc: "A captain of the princely army, experienced in leading companies and battalions but still learning to command larger formations."
    SER_lieutenant: "Lieutenant"
    SER_lieutenant_desc: "A junior officer who has shown promise, but whose experience does not yet extend beyond leading small units."
    SER_major: "Major"
    SER_major_desc: "A field officer of the princely army, used to staff work and the command of battalions rather than whole armies."

    SER_trait_georgi_rakovkski: "Bulgarian Independence Revolutionary"
    SER_trait_georgi_rakovkski_desc: "The founder of the Bulgarian Legion knows how to raise, train and move armed bands quickly through hostile country."
    SER_trait_svetozar_markovic: "Balkan Socialist Revolutionary"
    SER_trait_svetozar_markovic_desc: "A tireless critic of the bureaucracy and of capitalism, preaching municipal self-government and a free Balkan federation."
    SER_trait_lazar_brsenijevic_batalaka: "State Politician"
    SER_trait_lazar_brsenijevic_batalaka_desc: "A veteran official of the Defenders of the Constitution and a historian of the First Uprising, devoted to the old order and the traditions of the state."
    SER_trait_jevrem_grujic: "Law Reformer"
    SER_trait_jevrem_grujic_desc: "A liberal jurist determined to put the government of Serbia on a firm legal footing."
    SER_trait_vladimir_jovanovic: "Liberal Politician"
    SER_trait_vladimir_jovanovic_desc: "An eloquent liberal theorist who can win over the public and protect the government from radical currents."
    SER_trait_dorde_cenic: "Principality Minister of Justice"
    SER_trait_dorde_cenic_desc: "An experienced jurist whose courts and laws bring order and calm to the principality."
    SER_trait_alexander_bugarski: "Architect of the National Theatre"
    SER_trait_alexander_bugarski_desc: "A builder of Belgrade's public buildings, able to raise grand structures quickly and well."
    SER_trait_jan_nevole: "Czech Born Architect"
    SER_trait_jan_nevole_desc: "The architect of Captain Miša's Mansion brings European building methods to Serbian towns and roads."
    SER_trait_josif_pancic: "Serbian Botanist"
    SER_trait_josif_pancic_desc: "The father of the Serbian natural sciences inspires a whole generation of researchers."
    SER_trait_ilija_garasanin: "Creator of the Greater Serbia Idea"
    SER_trait_ilija_garasanin_desc: "The author of the Načertanije is a master of Balkan diplomacy, able to prepare Serbia's claims without alarming the Great Powers."
    SER_trait_felix_hoffman: "The Mining Expert"
    SER_trait_felix_hoffman_desc: "A German mining engineer who knows every seam and shaft in Serbia, and how to make them pay."
    SER_trait_szabo_j: "Hungarian Geologist"
    SER_trait_szabo_j_desc: "A leading Hungarian geologist whose research reveals the hidden wealth of Serbia's rocks."
    SER_trait_sima_andreevic: "Tobacco Merchant"
    SER_trait_sima_andreevic_desc: "A wealthy merchant and philanthropist who invests his fortune in schools and churches for his people."
    SER_trait_milutin_garasanin: "Politician of the Serbian Progressive Party"
    SER_trait_milutin_garasanin_desc: "A Western-oriented conservative, son of Ilija Garašanin, who favours a strong state, orderly administration and close ties with Vienna."
    SER_trait_konstantin_cukic: "Serbian Finances Reformer"
    SER_trait_konstantin_cukic_desc: "An economist and finance minister dedicated to sound budgets, free trade and a national currency."
    SER_trait_misha_anastasijevic: "Prince of the Danube"
    SER_trait_misha_anastasijevic_desc: "The richest man in Serbia, whose salt trade and river fleet can fill the treasury - at a price."

