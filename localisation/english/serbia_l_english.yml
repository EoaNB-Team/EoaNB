l_english:
    #FOCUS TREE
    SER_ban_russophile: "Ban Russophiles"
    SER_ban_russophile_desc: "Since the Crimean War, Prince Aleksandar has leaned on Vienna, and the Russophile party at court and in the State Council has never forgiven him for it. Russian agents, Russian money and Russian-minded officials undermine every decision we make. If the Prince is to remain master in his own house, the Russophiles must be removed from office and their leaders put where they can do no further harm."

    SER_tenka_plot: "Tenka's Plot"
    SER_tenka_plot_desc: "Councillors Stefan Stefanović Tenka, Paun Janković and Radovan Damjanović, men who once helped raise Aleksandar Karađorđević to the throne, have turned against him. In their eyes the Prince has become the tool of Austria and of his own favourites, and lawful means of removing him seem exhausted. Rumours speak of a hired gunman and a journey to Brestovačka Banja, where the Prince is taking the waters."

    SER_national_assembly_law: "National Assembly Law"
    SER_national_assembly_law_desc: "For sixteen years the Prince and the State Council have governed with barely a nod to the people. The Assembly has hardly ever been summoned, and when it was, its members were chosen by the authorities rather than elected. A new law will fix how the National Assembly is elected and convened, and open the way to genuine popular representation in Serbia."

    SER_saint_andrew_assembly: "Saint Andrew's Assembly"
    SER_saint_andrew_assembly_desc: "With the new law in force, the first freely elected National Assembly in years is due to meet in Belgrade on Saint Andrew's Day. Liberals, Obrenović loyalists and the disgruntled oligarchs of the Council will all be there, and everyone in Belgrade knows the deputies intend to do far more than approve the budget."

    SER_liberal_alliance: "Liberal Alliance"
    SER_liberal_alliance_desc: "The young liberals, many of them educated in Paris and the German universities, have found common cause with the old Obrenović loyalists and even with members of the oligarchy. For the first time in decades the whole opposition to the Karađorđević regime speaks with a single voice: for a constitution, for a working Assembly and for a change on the throne."

    SER_strong_partisan: "Strong Partisans"
    SER_strong_partisan_desc: "Years of bureaucratic arrogance, debt and heavy taxes have made Prince Aleksandar deeply unpopular in the villages. Local notables, priests and veterans of the uprisings are organising their neighbours and sending them to Belgrade to stand behind the opposition deputies. Their numbers alone may decide what the Assembly dares to do."

    SER_end_oligarch_rule: "End the Oligarch Rule"
    SER_end_oligarch_rule_desc: "Since 1842 the Defenders of the Constitution have ruled Serbia as a closed circle of councillors and officials, answerable to nobody but themselves and their patrons in Constantinople and Vienna. The time has come for the Assembly to break their hold on the State Council and decide for itself who will govern the principality."

    SER_karadjordjevic_remain: "Karađorđević Dynasty Remains"
    SER_karadjordjevic_remain_desc: "Against all expectations, Prince Aleksandar has weathered the storm. The opposition overplayed its hand, its alliance fell apart, and the Prince's supporters in the army and the bureaucracy held firm. The Karađorđević dynasty remains on the throne of Serbia, but its enemies are wounded, not destroyed."

    SER_eliminate_resistance: "Eliminate Resistance"
    SER_eliminate_resistance_desc: "Although the dynasty has survived, those who plotted against it are still at large in the Council, the ministries and the districts. They must be removed from office, watched, and where necessary tried, before they find another opportunity to strike."

    SER_dissolve_council: "Dissolve the Council"
    SER_dissolve_council_desc: "The State Council was meant to advise the Prince, yet it has spent fifteen years obstructing him and conspiring in his name against him. Dissolving it and appointing men loyal to the throne will make plain that there is only one legitimate authority in this country."

    SER_accelerate_serbian_development: "Accelerate Serbian Development"
    SER_accelerate_serbian_development_desc: "With the political crisis behind us, the state can finally turn to the work that has been neglected for years. New workshops, better roads and a modern administration in Belgrade will bring Serbia closer to the standards of Europe and show the people what a stable government can achieve."

    SER_renovate_school: "Renovate Schools"
    SER_renovate_school_desc: "Our schools are few, poorly built and dependent on the charity of the Church and local notables. The state will take responsibility for public education, repairing old schoolhouses, building new ones and paying teachers from the treasury so that no village is left without a place of learning."

    SER_imrpove_administration: "Improve the Administration"
    SER_imrpove_administration_desc: "Our administration still carries the habits of Ottoman rule: clerks who answer to patrons rather than laws, overlapping offices and endless delays. Clear rules, trained officials and proper record-keeping will make the state both more efficient and more firmly in the Prince's hands."

    SER_reform_judicial_system: "Reform the Judicial System"
    SER_reform_judicial_system_desc: "Too often a man's fate in our courts depends on his friends in the Council rather than on the law. A reformed judiciary, with trained judges, a published code of procedure and a proper appeals system, will restore trust in the state and deny our opponents one of their favourite complaints."

    SER_austria_educated_serbs: "Austrian-Educated Serbs"
    SER_austria_educated_serbs_desc: "Across the Sava and the Danube live tens of thousands of Serbs who were educated in Vienna, Pest and the schools of Karlovci and Novi Sad. Our ministries, schools and courts are desperate for men like them. Generous salaries and an open invitation will bring these 'prečani' home to serve the principality."

    SER_advance_science: "Advance Science"
    SER_advance_science_desc: "Serbia has neither a university nor a single proper laboratory, and our few scholars must go abroad to learn their trade. The Lyceum in Belgrade will be expanded, scholarships will be offered to promising students, and the state will begin to fund research of its own."

    SER_new_fertilisers: "New Fertilisers"
    SER_new_fertilisers_desc: "Nine Serbs in ten live from the land, yet our fields yield far less than those of our neighbours. Agronomists trained abroad report that new fertilisers and methods of crop rotation could transform Serbian agriculture. The state will test them on its own estates and spread the results to the villages."

    SER_deal_with_ustavobranitelji: "Deal With the 'Ustavobranitelji'"
    SER_deal_with_ustavobranitelji_desc: "The so-called 'Defenders of the Constitution' have spent two decades limiting the power of the throne while filling their own pockets. The men who once made Aleksandar prince now see him as their servant. Breaking their network of patronage will strengthen both the dynasty and the state."

    SER_serbian_welfare: "Serbian Welfare"
    SER_serbian_welfare_desc: "The prosperity of the people is the surest foundation of the throne. Lower taxes for the poorest households, state help in years of bad harvest and care for the veterans of the uprisings will bind the nation to its Prince more strongly than any police force."

    SER_increase_state_power: "Increase State Power"
    SER_increase_state_power_desc: "To make certain that the liberals never again come close to power, the central government must be strengthened. District chiefs will answer directly to Belgrade, and the police will receive broader powers. It will not be popular, but in time the people will come to value order above agitation."

    SER_continue_radical_reform: "Continue Radical Reforms"
    SER_continue_radical_reform_desc: "The opposition press has slandered the Prince for long enough, printing lies smuggled in from Pest and Vienna. From now on every newspaper in Serbia will be licensed and supervised by the state, and those who abuse the printed word will answer for it."

    SER_compulsory_conscription: "Compulsory Conscription"
    SER_compulsory_conscription_desc: "A small country surrounded by empires cannot rely on a handful of professional soldiers. Every able-bodied Serb will be registered, trained and liable to serve, so that in the hour of need the whole nation can stand under arms."

    SER_assasination_attempt: "Assassination Attempt"
    SER_assasination_attempt_desc: "Our reforms have made the state stronger, but they have also made enemies. The old oligarchs, the exiled Obrenović loyalists and the radicals all share one hope: that a single bullet could undo everything. The Prince's guard must be doubled, and every whisper of conspiracy followed to its source."

    SER_obrenovic_dynasty_return: "Return of the Obrenović Dynasty"
    SER_obrenovic_dynasty_return_desc: "After a long struggle the opposition has triumphed. The Assembly has deposed Aleksandar Karađorđević and recalled Miloš Obrenović, the founder of modern Serbia, to the throne he lost in 1839. The old prince returns from exile nearly eighty years old, as stubborn and as determined to rule as ever."

    SER_question_1838_constitution: "Question the 1838 Constitution"
    SER_question_1838_constitution_desc: "The so-called 'Turkish Constitution' of 1838 was granted by the Sultan and guaranteed by Russia precisely to shackle the Prince to an irremovable Council. As long as it stands, the Porte has the final word over how Serbia is governed. Through careful diplomacy and selective obedience we can hollow it out without openly defying the Sultan."

    #SER_milos_death: "Milos' Death"
    #SER_milos_death_desc: ""

    SER_constitutional_reform: "Constitutional Reforms"
    SER_constitutional_reform_desc: "The struggle between the throne, the Council and the Assembly cannot go on forever. Serbia needs a measured constitutional reform that defines the powers of each, before the next crisis decides the question by force."

    SER_strengthen_mihailo_regime: "Mihailo's Reign"
    SER_strengthen_mihailo_regime_desc: "Prince Mihailo has returned to the throne he lost in 1842, older, better educated and determined not to repeat his youthful mistakes. Like his father he intends to rule personally, but through modern laws, a loyal bureaucracy and a national army rather than through fear."

    SER_serbian_council_national_propoganda: "Serbian Council of National Propaganda"
    SER_serbian_council_national_propoganda_desc: "Serbs still living under Ottoman and Austrian rule look to Belgrade for leadership. A secret council of national propaganda will fund schools, churches, books and newspapers among them, keeping their national spirit alive until the day of liberation comes."

    SER_maintain_ravoski_tie: "Maintain Rakovski Ties"
    SER_maintain_ravoski_tie_desc: "Georgi Rakovski, the most energetic of the Bulgarian revolutionaries, has made Belgrade his base. He writes, organises and dreams of a common Serbo-Bulgarian rising against the Porte. His connections in Bulgaria are invaluable, and keeping him close costs us little."

    SER_bulgarian_immigrant_agreement: "Bulgarian Immigrant Agreement"
    SER_bulgarian_immigrant_agreement_desc: "Every year more Bulgarians cross into Serbia to escape Ottoman tax collectors and reprisals. Regulating their settlement, granting them land and protecting their communities will turn these refugees into loyal subjects and give us friends on the other side of the border."

    SER_macedonia_propoganda: "Propaganda in Macedonia"
    SER_macedonia_propoganda_desc: "Macedonia is a patchwork of Serbs, Bulgarians, Greeks, Albanians and Turks, and every one of its neighbours claims it. If Serbia wants a voice there in the future, we must fund Serbian schools and churches now, and make sure that the Serbian name is heard in every village."

    SER_establish_network: "Establish an Intelligence Network"
    SER_establish_network_desc: "Our enemies are well informed about us, while we learn about their plans from rumours and newspapers. A proper intelligence service, with agents in Constantinople, Vienna and the Ottoman provinces, will let us root out conspirators at home and follow the intrigues of the Great Powers abroad."

    SER_bulgarian_serbian_friendship: "Serbo-Bulgarian Friendship"
    SER_bulgarian_serbian_friendship_desc: "Common refugees, common revolutionaries and a common enemy have drawn Serbs and Bulgarians closer than ever before. With this friendship, a rising in Bulgaria and a Serbian army on the march could one day shake the Ottoman Empire to its foundations."

    SER_form_three_ministry: "Form Three Ministries"
    SER_form_three_ministry_desc: "The four ministries inherited from the old regime can no longer cope with the work of a modern state. New ministries of education, public works and war will relieve the overburdened offices and place the most important affairs of state directly under the Prince."

    SER_central_state_administration: "Central State Administration"
    SER_central_state_administration_desc: "The Law on the Central State Administration will raise the number of ministries to seven, creating new ministries of education, construction and the army. The ministers will be separated from the State Council and made answerable to the Prince alone, completing the transition to personal rule."

    SER_government_centralisation: "Government Centralisation"
    SER_government_centralisation_desc: "Power in Serbia is still scattered among district chiefs, councillors and local notables. Bringing the districts under direct ministerial control and appointing officials loyal to the throne will give the Prince the means to govern the whole country from Belgrade."

    SER_strong_absolutist_rule: "Strong Absolutist Rule"
    SER_strong_absolutist_rule_desc: "Prince Mihailo now rules as an enlightened absolute monarch. The Council advises, the Assembly meets when summoned, and the ministries carry out the Prince's will. For all its harshness, the regime has brought order, a national army and the respect of Europe."

    SER_create_balkan_alliance: "Create the Balkan Alliance"
    SER_create_balkan_alliance_desc: "Serbia alone cannot drive the Ottomans out of the Balkans. Prince Mihailo and Ilija Garašanin dream of a league of Balkan peoples - Serbs, Montenegrins, Greeks, Romanians and Bulgarians - that would rise together and settle the Eastern Question without waiting for the Great Powers."

    SER_serb_montenegrin_agreement: "Serbo-Montenegrin Agreement"
    SER_serb_montenegrin_agreement_desc: "Montenegro has never been conquered, and its fighters are the best in the Balkans. An agreement with Prince Nikola, promising Serbian money and weapons in return for coordinated action, would bind the two Serbian states together against the Porte."

    SER_voslau_treaty: "Vöslau Treaty"
    SER_voslau_treaty_desc: "Greece, too, still has kinsmen under Ottoman rule in Thessaly, Epirus and Crete. A treaty of alliance, negotiated quietly at the spa of Vöslau near Vienna, would commit Athens and Belgrade to fight side by side and to agree in advance on how the liberated lands are to be shared."

    SER_romanian_trade_deals: "Romanian Trade Deals"
    SER_romanian_trade_deals_desc: "The United Principalities across the Danube are still nominally Ottoman vassals, but their sympathies lie with us. Generous trade agreements and a promise of friendship will at least keep Bucharest neutral in any war we fight, and may yet bring it into our camp."

    SER_cooperate_with_albania: "Cooperate With Albania"
    SER_cooperate_with_albania_desc: "Many Albanian clans, especially the Catholic Mirdita, resent the Porte's centralising reforms and its tax collectors as much as we do. Arms, money and Serbian officers could turn their unrest into a rebellion that ties down Ottoman troops when we need it most."

    SER_united_balkans: "United Balkans"
    SER_united_balkans_desc: "For the first time in centuries, the Christian peoples of the Balkans stand bound by treaties and common purpose, and Serbia stands at their head. With our diplomatic groundwork complete, we can turn our attention to preparing for war."

    SER_work_with_omalandi: "Work With Omladina"
    SER_work_with_omalandi_desc: "The United Serbian Youth, the Omladina, founded in Novi Sad, gathers young Serbs from both sides of the border who dream of liberation and unification. Its liberal and patriotic writers are popular, influential and sometimes dangerous. Working with them, rather than against them, could put their energy to use for the state."

    SER_malogospojinska_assembly: "Malogospojinska Assembly"
    SER_malogospojinska_assembly_desc: "The Saint Andrew's Assembly left much unfinished business behind it. A committee reviewed its proposals, some were given legal force through the Council, and the rest were held over. Now, for the feast of the Nativity of the Mother of God, the new Assembly gathers in Kragujevac - the first in Serbian history whose members were all elected rather than appointed."

    SER_single_commercial_court: "Single Commercial Court"
    SER_single_commercial_court_desc: "Disputes between merchants drag on for years in the ordinary courts, which have neither the knowledge nor the patience for bills of exchange and company law. A single commercial court in Belgrade, staffed by judges who understand trade, will speed up justice and reassure foreign partners."

    SER_modern_organisation_army: "Modernise the Army Organisation"
    SER_modern_organisation_army_desc: "There is no denying that our army needs work. It is small, badly armed and commanded by men who learned their trade fighting in the hills. A central military administration, regular drill and modern regulations are the first steps towards a force that can actually defend the principality."

    SER_recognise_economic_administration: "Reorganise the Economic Administration"
    SER_recognise_economic_administration_desc: "The treasury has been run like a merchant's strongbox: money comes in, money goes out, and nobody quite knows where. Proper budgets, published accounts and a reorganised Ministry of Finance will keep spending under control and prepare the ground for wider financial reform."

    SER_civil_servants_law_1861: "Civil Servants Law of 1861"
    SER_civil_servants_law_1861_desc: "The new Law on Civil Servants will set out how officials are appointed, promoted, paid and dismissed. It gives the state an educated, professional bureaucracy - and gives the Prince the power to remove any official who does not carry out government policy."

    SER_cukur_fountain_incident: "Čukur Fountain Incident"
    SER_cukur_fountain_incident_desc: "A terrible tragedy has occurred at the Čukur Fountain in Belgrade. A quarrel between Ottoman soldiers and Serbian townsmen over who should draw water first ended with a young apprentice dead and Serbian policemen shot. Riots are spreading through the city, and all of Serbia is demanding that the Turks leave for good."

    SER_serbian_police_day: "Serbian Police Day"
    SER_serbian_police_day_desc: "The interpreter Sima Nešić and the gendarme Đorđe Nišlija died trying to keep the peace at the Čukur Fountain. Their sacrifice shall not be forgotten. The government will honour the police and gendarmerie with a day of national remembrance."

    SER_constantinople_visit: "Visit Constantinople"
    SER_constantinople_visit_desc: "The bombardment of Belgrade has shown that the Ottoman garrisons are a danger to Serbia, not a protection. With the support of the Great Powers and careful diplomacy, an envoy to Constantinople might persuade the Porte that withdrawing its last troops is cheaper than another crisis."

    SER_belgrade_negotiations: "Belgrade Negotiations"
    SER_belgrade_negotiations_desc: "At last the Porte has seen reason. The Ottoman garrisons will withdraw from Belgrade, Šabac, Smederevo and Kladovo, and the keys of the fortresses will be handed to Prince Mihailo. The Ottoman flag will still fly beside ours over the citadel, but for the first time in centuries no Ottoman soldier will stand guard over a Serbian town."

    SER_prince_milan_return: "Prince Milan Returns"
    SER_prince_milan_return_desc: "Prince Mihailo is dead and left no legitimate son. The heir under the law of succession is his young cousin Milan, grandson of Miloš's brother Jevrem, who is studying at a lycée in Paris. The boy must be brought home to Serbia at once, before rival claimants or the Karađorđević faction can exploit the vacuum."

    SER_three_member_governorship: "Three-Member Provisional Regency"
    SER_three_member_governorship_desc: "On the very day of the assassination, a provisional regency of three - Jovan Marinović, Rajko Lešjanin and Đorđe Petrović - has assumed the princely authority. Its task is simple and urgent: keep order in Belgrade, protect the succession and summon a Grand National Assembly to decide the future of the throne."

    SER_provisional_viceroyalty_princely_dignity: "Regency of the Princely Dignity"
    SER_provisional_viceroyalty_princely_dignity_desc: "Surrounded by Blaznavac's troops, the Grand National Assembly at Topčider has proclaimed fourteen-year-old Milan Prince of Serbia and elected a regency to govern in his name until he comes of age: the war minister Milivoje Blaznavac, the diplomat Jovan Ristić and the elder statesman Jovan Gavrilović."

    SER_review_nachertanije: "Review the Načertanije"
    SER_review_nachertanije_desc: "Ilija Garašanin's secret 'Draft' of 1844 has guided Serbian foreign policy for a generation, promising a great South Slav state built on the ruins of the Ottoman Empire. The regents must decide whether its ambitions still fit a Europe reshaped by the Austro-Hungarian Compromise and a Russia that no longer treats Serbia as its favourite."

    SER_montenegro_military_convention: "Montenegro Military Convention"
    SER_montenegro_military_convention_desc: "Prince Mihailo's alliance with Montenegro must not die with him. A military convention, setting out how many men each side will field and how their operations are to be coordinated, will keep Cetinje firmly at our side for the war that is sure to come."

    SER_convergence_with_austria_hungary: "Convergence With Austria-Hungary"
    SER_convergence_with_austria_hungary_desc: "Since 1867 the Dual Monarchy has had a Hungarian government in Pest and a Hungarian, Count Andrássy, among its leading statesmen. Andrássy fears Russia far more than he fears Serbia. A careful rapprochement with Vienna and Pest may win us economic support and a free hand against the Porte."

    SER_bosnia_herzegovinian_question: "The Bosnian Question"
    SER_bosnia_herzegovinian_question_desc: "Bosnia and Herzegovina are seething, and both Belgrade and Vienna look at them with hungry eyes. If Austria-Hungary takes them, Serbia will be encircled forever. We must determine what Andrássy is prepared to concede, and what we are prepared to risk, before the question is settled without us."

    SER_liberation_serbia_committee: "The Committee for Liberation"
    SER_liberation_serbia_committee_desc: "A secret committee for the liberation of the Serbian lands will gather money, weapons and volunteers, maintain contact with insurgent leaders in Bosnia, Herzegovina and Old Serbia, and make sure that when the uprising comes, it rises under Serbian banners."

    SER_suspend_bosnian_railway_project: "Suspend the Bosnian Railway Project"
    SER_suspend_bosnian_railway_project_desc: "The Porte's plans for a railway through Bosnia, built with Austrian capital, would tie the province to Vienna rather than to Belgrade and allow Ottoman troops to be moved to our border in days. We must use every diplomatic means to stall the project until its route serves Serbian interests."

    SER_serbian_turkish_railway_agreement: "Serbo-Turkish Railway Agreement"
    SER_serbian_turkish_railway_agreement_desc: "If a railway to Constantinople must be built, it should run through Belgrade and Niš rather than around us. An agreement with the Porte on linking Serbian and Ottoman lines would make Serbia the gateway between Central Europe and the East, with all the trade and influence that brings."

    SER_serbian_hungarian_friendship: "Serbo-Hungarian Friendship"
    SER_serbian_hungarian_friendship_desc: "The Hungarians have no love for the Habsburg court or for Russian Pan-Slavism, and their government in Pest is willing to treat Serbia as a partner rather than a nuisance. Regent Blaznavac's personal ties with Andrássy offer an opening that we would be foolish to ignore."

    SER_fight_austrian_secret_service: "Fight the Austrian Secret Service"
    SER_fight_austrian_secret_service_desc: "Austrian agents are everywhere in Belgrade, in the cafés, the ministries and the officer corps, and the Viennese police watch every Serb who crosses the Sava. Friendship with Pest does not mean blindness: a counter-intelligence service will keep our secrets our own."

    SER_ask_french_england_help: "Ask France and England for Help"
    SER_ask_french_england_help_desc: "Paris and London guaranteed Serbia's autonomy in 1856 and have no wish to see either Russia or Austria dominate the Balkans. If we present Serbia as a stable, moderate state, they may lend their weight to our cause at the Porte."

    SER_initiate_british_negotiations: "Initiate Negotiations with Britain"
    SER_initiate_british_negotiations_desc: "Britain is the Ottoman Empire's most important friend, which makes it the most important power to convince. If London can be persuaded that a Serbian administration in Bosnia would bring calm to the province rather than a Russian protectorate, the Porte may listen."

    SER_serbian_administration_bosnia: "Serbian Administration in Bosnia"
    SER_serbian_administration_bosnia_desc: "Our boldest proposal: Bosnia would remain under the Sultan's sovereignty but be administered by Serbia, just as Serbia itself once won autonomy within the empire. It would bring the Bosnian Serbs under our protection without a war, and present the Great Powers with an accomplished fact."

    SER_visit_russian_tsar: "Visit the Russian Tsar"
    SER_visit_russian_tsar_desc: "Relations with St. Petersburg have cooled since Prince Mihailo's death, and the regents' flirtation with Vienna has not gone unnoticed. A personal visit by the young Prince Milan to Tsar Alexander II would remind the Russians that Serbia remains a faithful Orthodox ally."

    SER_persuade_bosnian_muslims: "Persuade the Bosnian Muslims"
    SER_persuade_bosnian_muslims_desc: "Many Bosnian Muslim beys resent the Porte's reforms as much as the Christians do, and speak the same language as the Serbs. If they could be convinced that their lands and faith would be respected under Serbian rule, the way to Sarajevo would be far easier."

    SER_publish_historical_map_lands: "Publish a Historical Map of the Serbian Lands"
    SER_publish_historical_map_lands_desc: "Diplomats and newspaper readers in Europe have only the vaguest idea where the Serbs live. A scholarly map of the historical and ethnic Serbian lands, printed in several languages and sent to every chancellery, will make our claims plain and lend them the authority of science."

    SER_greater_serbian_doctrine: "'Greater Serbia' Doctrine"
    SER_greater_serbian_doctrine_desc: "From Garašanin's Načertanije to the songs of the Omladina, one idea has guided Serbian patriots: the union of all Serbs in a single state. It is time to make it the official doctrine of the principality, guiding our diplomacy, our schools and our army alike."

    SER_maintain_status_quo: "Maintain the Status Quo"
    SER_maintain_status_quo_desc: "Every road we have explored leads eventually to war, and Serbia is not yet ready. Until the army is strong and the Great Powers are favourable, our policy will be to keep the peace, keep our options open and give no one an excuse to move against us."

    SER_maintain_internal_peace: "Maintain Internal Peace"
    SER_maintain_internal_peace_desc: "The assassination has left Serbia shaken and divided. Conservatives, liberals and the followers of the Karađorđević house all suspect one another. The regency's first duty is to prevent the quarrel over who killed Prince Mihailo from becoming a civil war."

    SER_three_political_current: "The Three Political Currents"
    SER_three_political_current_desc: "Three currents now compete for the future of Serbia: the conservatives of the old bureaucracy, who want a strong state and a cautious foreign policy; the liberals around Jovan Ristić, who want an Assembly with real powers; and the young radicals and socialists inspired by Svetozar Marković, who want to sweep the whole system away."

    SER_blaznavac_coup: "Blaznavac's Coup"
    SER_blaznavac_coup_desc: "Milivoje Blaznavac controls the army, and the army controls Belgrade. Rather than wait for the politicians to settle their quarrels, the war minister has decided to settle them for them, placing the regency firmly under military authority."

    SER_strengthen_armys_role: "Strengthen the Army's Role"
    SER_strengthen_armys_role_desc: "The officer corps is the only institution in Serbia that is disciplined, educated and loyal. Giving it a greater role in administration and decision-making will make the state more efficient - and make sure that the regency is never left defenceless."

    SER_crush_russian_influence: "Crush Russian Influence"
    SER_crush_russian_influence_desc: "Russian consuls and Pan-Slavist committees have long meddled in Serbian politics, funding newspapers and courting ambitious officers. The regency will no longer tolerate a foreign power choosing its ministers. Russian agents will be expelled and their Serbian friends removed from office."

    SER_regulate_penal_institutions: "Regulate Penal Institutions"
    SER_regulate_penal_institutions_desc: "Serbian prisons are crowded, filthy and governed by little more than the whims of their wardens. Proper regulations, inspections and separate institutions for different kinds of prisoners will bring them closer to the standards of the civilised states of Europe."

    SER_abolish_corporal_punishment: "Abolish Corporal Punishment"
    SER_abolish_corporal_punishment_desc: "The stick and the lash are still common punishments in our courts and districts, a humiliating legacy of Ottoman times. Abolishing them will mark Serbia as a modern European state and remove one of the most hated symbols of arbitrary rule."

    SER_restrict_peoples_freedom: "Restrict the People's Freedoms"
    SER_restrict_peoples_freedom_desc: "Freedom of the press and of assembly has given radicals and foreign agents a platform to attack the regency. Until the Prince comes of age, the state must protect itself: public meetings will need permission, and newspapers that incite disorder will be closed."

    SER_modern_european_nation: "Modern European Nation"
    SER_modern_european_nation_desc: "With a disciplined army, an orderly administration and modern laws, Serbia can at last present itself to Europe as a state like any other, not a troubled Ottoman province. The regency has given the young Prince a country worthy of his inheritance."

    SER_limit_executive_power: "Limit Executive Power"
    SER_limit_executive_power_desc: "The regency holds the powers of a prince without his legitimacy. To calm the opposition and secure the support of the Assembly, the regents must accept clear limits on their authority and make ministers answerable for their actions."

    SER_support_obrenovic_dynasty: "Support the Obrenović Dynasty"
    SER_support_obrenovic_dynasty_desc: "Whatever their quarrels, all parties in the regency agree on one thing: the Obrenović dynasty must survive. The young Prince Milan will be presented to the people as the heir of Miloš and Mihailo and the guarantor of Serbia's continuity."

    SER_russophile_politics: "Russophile Politics"
    SER_russophile_politics_desc: "Russia is the only Great Power that has ever fought for the Serbs, and the only one with a reason to help us against the Turks. Restoring close ties with St. Petersburg will bring diplomatic support, money and perhaps, one day, Russian soldiers on the Danube."

    SER_defend_serbian_orthodox: "Defend Serbian Orthodoxy"
    SER_defend_serbian_orthodox_desc: "The Serbian Orthodox Church preserved the nation's memory through five centuries of Ottoman rule. The state will protect its rights, support its schools and stand by Orthodox Serbs in Bosnia, Old Serbia and Macedonia, whose churches are threatened by Ottoman neglect and rival propaganda."

    SER_start_radical_change: "Start Radical Changes"
    SER_start_radical_change_desc: "The followers of Svetozar Marković reject the whole system: the bureaucracy, the Prince's court and the moneylenders who are bleeding the villages dry. They want power to pass to the municipalities and the people. Their hour may have come."

    SER_reject_modernisation: "Reject Modernisation"
    SER_reject_modernisation_desc: "The 'modernisation' preached in Belgrade has brought the peasant nothing but new taxes, officials and debts. Serbia does not need to copy the factories and slums of the West; it can build on its own traditions of village self-government and communal property."

    SER_fight_capitalism: "Fight Capitalism"
    SER_fight_capitalism_desc: "Usurers, speculators and foreign concessionaires are turning free Serbian peasants into debtors and labourers. The state will protect the smallholding, curb usury and favour cooperatives over private capital."

    SER_serbian_adult_electoral_right: "Universal Male Suffrage"
    SER_serbian_adult_electoral_right_desc: "Only taxpayers vote, and the government appoints a quarter of the Assembly. If the people are to rule, every adult Serbian man must have the right to elect his representatives, and every deputy must be elected."

    SER_bureaucratic_serbian_rule: "End Bureaucratic Rule"
    SER_bureaucratic_serbian_rule_desc: "Serbia is governed by an army of clerks who answer to Belgrade rather than to the people they serve. Power must be returned to the districts and municipalities, and officials made responsible to elected local councils."

    SER_next_generation_social_revolutionaries: "Next Generation of Social Revolutionaries"
    SER_next_generation_social_revolutionaries_desc: "Marković's ideas have spread among students, teachers and young officers. A new generation, educated in Zürich, St. Petersburg and Belgrade, is ready to carry the struggle for social justice into the villages and the Assembly."

    SER_balkan_federation_idea: "Idea of a Balkan Federation"
    SER_balkan_federation_idea_desc: "Rather than a Greater Serbia built by conquest, the radicals dream of a free federation of Balkan peoples - Serbs, Bulgarians, Greeks, Romanians and others - living as equals once the empires have been driven out."

    SER_modern_serbia: "Modern Serbia"
    SER_modern_serbia_desc: "The years of regency have tested every institution in Serbia. Whatever path we chose, the country that emerges is no longer the frightened Ottoman vassal of 1858, but a modern state ready to determine its own destiny."

    SER_establish_svetonikolsky_committee: "Establish the 'Sveto Nikolsky' Committee"
    SER_establish_svetonikolsky_committee_desc: "Jovan Ristić is convinced that the regency must give Serbia a new constitution. A large committee of notables from the political and clerical elite will be convened to debate the drafts and prepare the ground for a Grand National Assembly."

    SER_economic_order_national_assembly_law: "Draft the Assembly's Rules of Procedure"
    SER_economic_order_national_assembly_law_desc: "If the National Assembly is to become a true legislature, it needs rules for how bills are introduced, debated and voted on, and how its president and committees are chosen. Without them, any Assembly can be dominated by whoever shouts loudest."

    SER_economic_order_council_state_law: "Draft the State Council's Rules of Procedure"
    SER_economic_order_council_state_law_desc: "The State Council will lose its legislative powers to the Assembly but remain the government's chief advisory and administrative body. Its organisation and procedure must be redrawn to fit its new, more modest role."

    SER_election_deputies_law: "Draft the Electoral Law"
    SER_election_deputies_law_desc: "Who may vote, who may stand for election and how the ballots are counted will decide the character of the new Assembly. The draft must balance the liberals' wish for a broad franchise against the regents' fear of radical majorities."

    SER_ministers_responsibility_law: "Draft the Ministerial Responsibility Law"
    SER_ministers_responsibility_law_desc: "Under the old system, ministers answered only to the Prince. The new law will allow the Assembly to accuse ministers who break the constitution or the laws, and bring them before a court."

    SER_freedom_press_act: "Draft the Press Law"
    SER_freedom_press_act_desc: "A modern constitution must guarantee the freedom of the press, but the regency fears the radicals' newspapers. The draft press law will abolish preventive censorship while keeping the courts' power to punish libel and incitement."

    SER_1869_constitution: "The 1869 Constitution"
    SER_1869_constitution_desc: "Meeting at Kragujevac, the Grand National Assembly is to adopt Serbia's first constitution written by Serbs rather than imposed by the Sultan. It makes the National Assembly a true legislature, though a quarter of its deputies will still be appointed by the Prince, and the old 'Turkish Constitution' of 1838 will finally pass into history."

    SER_ministerial_responsibility_act: "Ministerial Responsibility Act"
    SER_ministerial_responsibility_act_desc: "The Law on Ministerial Responsibility gives force to the new constitution: ministers may now be impeached by the Assembly for violations of the law. Whether any Assembly will dare to use this power against the regents is another matter."

    SER_commercial_order_national_assembly_law: "Assembly Rules of Procedure Act"
    SER_commercial_order_national_assembly_law_desc: "With the Rules of Procedure adopted, the National Assembly at last has a settled order of business: committees, readings of bills and rules of debate. Serbia's parliamentary life can begin in earnest."

    SER_commercial_order_state_council: "State Council Rules of Procedure Act"
    SER_commercial_order_state_council_desc: "The reformed State Council receives its new statute. It will prepare draft laws, decide administrative disputes and audit the accounts of the state, leaving lawmaking to the elected Assembly."

    SER_deputies_travelling_and_subsistence: "Deputies' Travel and Subsistence Act"
    SER_deputies_travelling_and_subsistence_desc: "Many deputies are peasants and craftsmen who cannot afford weeks in Belgrade or Kragujevac at their own expense. Paying for their travel and daily upkeep ensures that the Assembly is not reserved for the rich."

    SER_amending_state_steel_organisation_act: "Amend the State Organisation Act"
    SER_amending_state_steel_organisation_act_desc: "The laws governing the organisation of the state were written for a regime of princely and bureaucratic rule. They must be amended to match the new constitution, so that every office in the land knows where its authority begins and ends."

    SER_struggle_for_democracy: "Struggle For Democracy"
    SER_struggle_for_democracy_desc: "The constitution and its laws are only a beginning. The struggle to make the Assembly a real check on power, to hold free elections and to protect the rights of citizens will continue long after the young Prince comes of age."

