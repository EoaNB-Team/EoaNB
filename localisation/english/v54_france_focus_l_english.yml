 ## French opening branch 1854-1857
 FRA_v54_the_eastern_question: "The Eastern Question"
 FRA_v54_the_eastern_question_desc: "France has championed Catholic rights in the Holy Land and now sees Russian pressure on the Sultan as a chance to break out of the isolation of 1815. Napoleon III needs success abroad, but a long war could cost him the finances and the army that his regime stands on."
 FRA_v54_the_alliance_with_britain: "The Alliance with Britain"
 FRA_v54_the_alliance_with_britain_desc: "The Emperor's greatest diplomatic prize is within reach: an alliance with Britain, the power that destroyed his uncle. If the two nations fight side by side against Russia, the settlement of 1815 will have been broken by the powers that made it.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_mediation_at_vienna: "Mediation at Vienna"
 FRA_v54_mediation_at_vienna_desc: "The Emperor lets it be known that France would prefer a settlement. His ministers prepare notes for the Vienna conference, and the Emperor keeps his army at home and his options open."
 FRA_v54_neutrality_of_the_empire: "The Empire Stands Aside"
 FRA_v54_neutrality_of_the_empire_desc: "The Emperor decides that France has no interest in the Danube worth a war. The army is saved for Algeria and the finances are saved for Paris, and the opposition says that the nephew has none of his uncle's ambition."
 FRA_v54_an_understanding_with_russia: "An Understanding with Russia"
 FRA_v54_an_understanding_with_russia_desc: "The Emperor sees in the Tsar a possible partner against the settlement of 1815: Russia can help to undo the Vienna treaties and France can help Russia in the East. London is alarmed, and so are the Orleanists."
 FRA_v54_army_of_the_east: "The Army of the East"
 FRA_v54_army_of_the_east_desc: "Saint-Arnaud's divisions embark at Marseille for Gallipoli and Varna. The army has not fought a European war since 1815, its staff is improvised and its commissariat is untried, and every man in it believes that he is following the Emperor to glory.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_baltic_and_black_sea_fleets: "The Baltic and Black Sea Fleets"
 FRA_v54_the_baltic_and_black_sea_fleets_desc: "The French fleet sails with the British into the Baltic and the Black Sea. Its steam battleships are the equal of any in Europe, and the first campaign will show whether its officers and its dockyards are ready for a long war."
 FRA_v54_reinforce_the_crimea: "Reinforce the Crimea"
 FRA_v54_reinforce_the_crimea_desc: "The siege of Sevastopol swallows men by the thousand. Saint-Arnaud is dead, Canrobert has been replaced by Pélissier, and every regiment in France is combed for drafts. The Emperor has promised victory and must pay for it."
 FRA_v54_peace_feelers: "Peace Feelers"
 FRA_v54_peace_feelers_desc: "Sevastopol has fallen, but the army is exhausted and the Emperor's thoughts turn to a settlement that will give France its laurels without a further winter in the Crimea. Austria offers mediation and Britain wants the war to go on.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_congress_of_paris: "The Congress of Paris"
 FRA_v54_the_congress_of_paris_desc: "Paris is the capital of Europe for six weeks. Walewski presides, the plenipotentiaries of seven powers sit round the table, and the French Emperor is for the first time the arbiter of the Continent. The question is what he will do with the position.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_second_empire: "The Second Empire"
 FRA_v54_the_second_empire_desc: "Louis-Napoleon seized power on 2 December 1851 and was proclaimed Emperor a year later, confirmed by plebiscites with seven million votes. The Empire rests on the army, the Church, the peasants and the promise of prosperity, and it knows how little else it rests on.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_corps_legislatif: "The Corps Législatif"
 FRA_v54_the_corps_legislatif_desc: "The legislature is elected by universal male suffrage and has little else to recommend it. The prefects name the official candidates, the Corps Législatif votes the budget as a whole, and the Senate and the Council of State draft the laws."
 FRA_v54_press_and_censorship: "The Press Decree"
 FRA_v54_press_and_censorship_desc: "The decree of 1852 makes every newspaper depend on the government's good will: a licence, a stamp duty and a system of warnings that ends in suspension. The press that survives is dull, loyal and rich in advertisements."
 FRA_v54_the_opposition_in_exile: "Watch the Exiles"
 FRA_v54_the_opposition_in_exile_desc: "Victor Hugo writes his satires from Jersey, Ledru-Rollin and Mazzini plot from London, and the Orleanists meet at Claremont. The police are told to watch every letter, and the Emperor remarks that conspirators are best kept in sight."
 FRA_v54_conciliate_the_opposition: "Conciliate the Opposition"
 FRA_v54_conciliate_the_opposition_desc: "Amnesties are granted to those who will promise to behave, and a few of the exiled return. The Emperor reckons that a regime that is sure of itself can afford to forgive, and his police chiefs reckon the opposite."
 FRA_v54_the_church_and_the_empire: "The Church and the Empire"
 FRA_v54_the_church_and_the_empire_desc: "The Catholic party made the Empire possible and expects a return: schools, charities and a French garrison in Rome. The Emperor gives what he can without alienating the Voltairean middle class, and the Empress, a devout Spaniard, encourages him.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_empress: "The Empress Eugénie"
 FRA_v54_the_empress_desc: "Eugénie de Montijo, whom the Emperor married in January 1853, is beautiful, pious and political. She sets the fashions of Europe, takes sides in the quarrels of the court and has opinions on the foreign policy of France."
 FRA_v54_the_windsor_visit: "The State Visit to Windsor"
 FRA_v54_the_windsor_visit_desc: "The Emperor and Empress cross the Channel for a state visit to Queen Victoria, the first French sovereign to be received at Windsor in centuries. The Queen is charmed against her expectations, and the English newspapers print what Parisians wear.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_prince_imperial: "The Birth of the Prince Imperial"
 FRA_v54_the_prince_imperial_desc: "After three years without an heir, the Empress gives birth to a son on the eve of the congress, and the dynasty has a future. The cannon of the Invalides fire a hundred and one salvoes, and every Bonapartist in France sleeps better.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_exposition_universelle: "The Exposition Universelle"
 FRA_v54_the_exposition_universelle_desc: "Paris prepares to show the world what the Empire has made: a Palace of Industry on the Champs-Élysées, a gallery of fine arts, and a visit from the Queen of England. The Emperor wants the Exposition to outshine the Crystal Palace of 1851.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_official_tours: "The Imperial Tours"
 FRA_v54_the_official_tours_desc: "The Emperor travels the provinces to inspect works, bless railways and be seen. The prefects arrange the welcomes, the mayors compose the speeches, and the peasants of the Midi cheer the nephew of the man who gave them their land."
 FRA_v54_the_imperial_economy: "The Imperial Economy"
 FRA_v54_the_imperial_economy_desc: "The Emperor, a Saint-Simonian by conviction, believes that railways, banks and public works will make the French rich and the Empire loved. Cheap credit, great projects and a stable currency are the programme, and the harvest is the only variable he cannot command."
 FRA_v54_credit_mobilier: "The Crédit Mobilier"
 FRA_v54_credit_mobilier_desc: "The Pereire brothers' bank, founded in 1852 on the model of Saint-Simon's dreams, collects the savings of small investors to finance railways, shipping and industry. Its shares rise every month, and so does the opposition of the Rothschilds.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_railway_companies: "The Great Railway Companies"
 FRA_v54_the_railway_companies_desc: "The state encourages the many small companies to merge into six great networks, each with a guaranteed return and a monopoly of its region. The lines will reach every corner of France, and the shareholders will grow rich while they do it.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_haussmanns_paris: "Haussmann's Paris"
 FRA_v54_haussmanns_paris_desc: "Baron Haussmann, prefect of the Seine since 1853, is to tear open the medieval city: new boulevards, a new sewer system, parks, markets and a new Hôtel-Dieu. The Emperor wants a Paris that cannot be barricaded and that visitors will remember.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_free_trade_question: "Tariffs or Free Trade?"
 FRA_v54_the_free_trade_question_desc: "Michel Chevalier and the Saint-Simonians urge the Emperor to open French markets to British iron, coal and cloth. The manufacturers of the north and the Legislature say that it will ruin them. The decision may be the most important economic choice of the reign."
 FRA_v54_the_suez_concession: "The Suez Concession"
 FRA_v54_the_suez_concession_desc: "Ferdinand de Lesseps, a diplomat with a plan, has persuaded the Viceroy of Egypt, Said Pasha, to grant him a concession to dig a canal across the isthmus. The Emperor is willing to support him, and Palmerston is not.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_gold_and_credit: "Gold and Credit"
 FRA_v54_gold_and_credit_desc: "The gold of California and Australia has flooded Europe, prices are rising and money is cheap. The Banque de France discounts more paper than ever before, and the Emperor is tempted to let the boom run."
 FRA_v54_the_army_of_the_empire: "The Army of the Empire"
 FRA_v54_the_army_of_the_empire_desc: "The French army is the largest in Europe after Russia's, a long-service force of veterans of Algeria, officers who follow the Napoleonic legend and generals who learned their trade against Arabs. Its commanders have never faced a modern enemy, and they do not suspect that they will."
 FRA_v54_the_imperial_guard: "The Imperial Guard"
 FRA_v54_the_imperial_guard_desc: "The Emperor re-forms the Imperial Guard of his uncle: grenadiers, voltigeurs, chasseurs and cavalry, picked from the line and paid better. The Guard is a glittering escort for the Emperor and an elite at the army's centre, and its officers are close to the throne.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_rifled_musket: "The Rifled Musket"
 FRA_v54_the_rifled_musket_desc: "The Minié bullet makes the old musket a rifle, and the chasseurs de Vincennes are the first to carry it. Every regiment wants the new weapon, and the arsenals at Saint-Étienne and Tulle are asked to supply it.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_steam_navy: "The Steam Navy"
 FRA_v54_the_steam_navy_desc: "Dupuy de Lôme's Napoléon, launched in 1850, was the first steam ship of the line in the world, and the Emperor decides to make the French navy the first in the world to depend on steam. The dockyards of Toulon, Brest and Cherbourg are to build the new fleet.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_armoured_batteries: "The Floating Batteries"
 FRA_v54_armoured_batteries_desc: "Armoured, flat-bottomed batteries are built for the attack on the Russian forts at Kinburn. If they stand up to the guns, the wooden walls of every navy will be obsolete, and the Emperor will have shown the world something new.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_replacement_system: "The Replacement System"
 FRA_v54_the_replacement_system_desc: "Conscripts chosen by lot may buy a substitute, and the substitutes become the army's long-service cadre. The middle class keeps its sons at home, the army keeps its professionals, and the radicals complain that the rich buy their way out.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_universal_service: "Universal Service"
 FRA_v54_universal_service_desc: "A group of officers around Marshal Niel argues for a shorter term of service for every Frenchman, with no substitutes and a large reserve. The Emperor is tempted, and the Legislature is horrified by the cost and by the principle."
 FRA_v54_the_army_of_africa: "The Army of Africa"
 FRA_v54_the_army_of_africa_desc: "The Zouaves, Chasseurs d'Afrique and Spahis, hardened by thirty years of fighting in Algeria, are the army's elite. The conquest is not finished: the Kabyles hold their mountains, and the generals say that one more campaign will finish them."
 FRA_v54_faidherbe_in_senegal: "Faidherbe in Senegal"
 FRA_v54_faidherbe_in_senegal_desc: "Louis Faidherbe, a young engineer officer who knows the Antilles and Algeria, is named governor of Senegal at the end of 1854. He wants to turn a string of trading posts into a colony, with forts along the river, a native infantry and the trade of the Gambia.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_roman_garrison: "The Garrison in Rome"
 FRA_v54_the_roman_garrison_desc: "French soldiers have held Rome since 1849 to protect Pius IX from the revolution. The garrison pleases the clergy and displeases the Italians, and every politician in Paris knows that it cannot stay forever and cannot leave.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_french_foreign_policy: "The Emperor's Foreign Policy"
 FRA_v54_french_foreign_policy_desc: "Napoleon III conducts foreign policy himself, through private envoys and a few trusted ministers. He believes in nationalities, in congresses and in rewriting the map of 1815, and the foreign ministry has learned to read his intentions in his silences."
 FRA_v54_the_british_connection: "The British Connection"
 FRA_v54_the_british_connection_desc: "Since Waterloo the two nations have been enemies by instinct and trading partners by interest. The Emperor, who lived in England as an exile, believes that a good understanding with London is the first need of French policy, and says so often."
 FRA_v54_the_rhine_question: "France and the Rhine"
 FRA_v54_the_rhine_question_desc: "Every French government since 1815 has thought about the frontier of the Rhine, and none has said so aloud. The Emperor has promised that the Empire means peace; the army and the prefects of Alsace know what he privately means by it."
 FRA_v54_principle_of_nationalities: "The Principle of Nationalities"
 FRA_v54_principle_of_nationalities_desc: "The Emperor, a one-time Carbonaro, believes that Europe will be stable only when its peoples govern themselves: Italians, Poles, Romanians and Germans. The doctrine alarms Austria and Russia, delights the liberals and gives French policy a language that no other great power speaks.\n\n$V54_HISTORICAL_PATH$"
 FRA_v54_the_conservative_order: "The Conservative Order"
 FRA_v54_the_conservative_order_desc: "The Emperor's more cautious ministers argue that the safest French policy is to work with the established powers: with Austria to keep Italy quiet, with Britain to keep Russia out, and with the Church to keep France in order."
 FRA_v54_the_polish_exiles: "The Polish Exiles"
 FRA_v54_the_polish_exiles_desc: "The Hôtel Lambert in Paris is the capital of Polish exile, and Prince Czartoryski presents the Emperor with plans for a Polish legion and a Polish army. The war with Russia makes the exiles useful, and the Emperor's sympathy makes them hopeful."
 FRA_v54_the_danubian_union: "The Union of the Principalities"
 FRA_v54_the_danubian_union_desc: "The Romanians of Moldavia and Wallachia want to unite under one prince, and France is the great power that has most sympathy for them. Austria and the Ottoman Empire oppose it, and the Emperor must decide how hard to press.\n\n$V54_HISTORICAL_PATH$"
