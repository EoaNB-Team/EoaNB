l_english:
 transport_plane_equipment_2_desc: "Improved transport aircraft carry larger payloads over greater distances, making airborne supply, troop movement, and paratrooper operations more reliable and strategically useful."
 transport_plane_equipment_desc: "Transport aircraft devote internal volume to passengers, cargo, and military supplies rather than weapons. Even early transports can move personnel and urgent material over obstacles and poor roads, laying the groundwork for airborne logistics and troop movement."
 transport_plane_equipment: "Transport Aircraft"
 transport_plane_equipment_2: "Transport Plane II"
 small_plane_airframe_2_desc: "Improved small airframe design uses stronger alloys, refined aerodynamics, and better internal arrangement to carry greater loads at higher speed and altitude. More efficient structures leave additional weight available for fuel, armament, protection, and specialized equipment."
 medium_plane_airframe_1_desc: "Basic medium airframe construction standardizes stressed-skin structures, stronger landing gear, and more efficient aerodynamic layouts. The resulting airframe can carry better engines, weapons, and fuel while remaining practical for mass production."
 small_plane_airframe_0: "Interwar Small Airframe"
 small_plane_airframe_1: "Basic Small Airframe"
 small_plane_airframe_2: "Improved Small Airframe"
 small_plane_airframe_3: "Advanced Small Airframe"
 small_plane_airframe_4: "Modern Small Airframe"
 medium_plane_airframe_3_desc: "Advanced medium airframe construction incorporates wartime experience in structural strength, aerodynamics, cockpit layout, and high-powered engines. The airframe is designed to remain effective under heavier loads and at the much greater speeds demanded by modern air combat."
 small_plane_airframe: "Small Airframe"
 large_plane_airframe_1_desc: "Basic large airframe construction standardizes stressed-skin structures, stronger landing gear, and more efficient aerodynamic layouts. The resulting airframe can carry better engines, weapons, and fuel while remaining practical for mass production."
 small_plane_airframe_4_desc: "Modern small airframe design pushes piston-era and early high-speed aircraft construction toward its practical limits, using refined structures, high-performance systems, and efficient internal packaging. It supports heavier weapons and mission equipment without sacrificing the speed and range expected of late-war aviation."
 medium_plane_airframe_2_desc: "Improved medium airframe design uses stronger alloys, refined aerodynamics, and better internal arrangement to carry greater loads at higher speed and altitude. More efficient structures leave additional weight available for fuel, armament, protection, and specialized equipment."
 cv_small_plane_airframe_3_desc: "Advanced carrier airframes are designed from the outset for high-speed naval combat, with strong landing structures, compact deck footprints, and efficient control at low approach speeds. They support heavier weapons without compromising the demanding handling needed for carrier operations."
 cv_small_plane_airframe_4_desc: "Modern carrier airframes integrate late-war aerodynamic refinement with strengthened naval structures and improved deck compatibility. They provide the speed, range, payload, and ruggedness required for sustained high-tempo operations from fleet carriers."
 large_plane_airframe_0: "Interwar Large Airframe"
 large_plane_airframe_1: "Basic Large Airframe"
 large_plane_airframe_2: "Improved Large Airframe"
 large_plane_airframe_3: "Advanced Large Airframe"
 large_plane_airframe_4: "Modern Large Airframe"
 cv_small_plane_airframe_1_desc: "Basic carrier airframes improve landing gear, arresting points, wing structure, and corrosion protection. Better deck-handling characteristics allow naval fighters to operate more safely and reliably from increasingly capable aircraft carriers."
 large_plane_airframe_desc: "A large airframe provides the structural foundation, internal volume, and load-bearing strength needed for strategic bombers and other long-range heavy aircraft. Its design determines how much engine power, fuel, armament, protection, and mission equipment can be carried effectively."
 cv_small_plane_airframe: "Carrier Small Airframe"
 medium_plane_airframe_4_desc: "Modern medium airframe design pushes piston-era and early high-speed aircraft construction toward its practical limits, using refined structures, high-performance systems, and efficient internal packaging. It supports heavier weapons and mission equipment without sacrificing the speed and range expected of late-war aviation."
 large_plane_airframe_4_desc: "Modern large airframe design pushes piston-era and early high-speed aircraft construction toward its practical limits, using refined structures, high-performance systems, and efficient internal packaging. It supports heavier weapons and mission equipment without sacrificing the speed and range expected of late-war aviation."
 cv_small_plane_airframe_desc: "A carrier small airframe adapts light combat aircraft to the severe demands of naval aviation. Reinforced landing gear, arresting equipment, compact dimensions, and corrosion-resistant construction allow aircraft to operate repeatedly from short, moving flight decks."
 small_plane_airframe_0_desc: "Interwar small airframe design applies increasingly mature all-metal construction, enclosed crew stations, and more reliable engines to the needs of fighter and light attack aircraft. It provides a practical foundation for the rapid advances in military aviation expected during the coming decade."
 cv_small_plane_airframe_4: "Modern Carrier Small Airframe"
 cv_small_plane_airframe_0: "Interwar Carrier Small Airframe"
 cv_small_plane_airframe_1: "Basic Carrier Small Airframe"
 cv_small_plane_airframe_2: "Improved Carrier Small Airframe"
 cv_small_plane_airframe_3: "Advanced Carrier Small Airframe"
 small_plane_airframe_1_desc: "Basic small airframe construction standardizes stressed-skin structures, stronger landing gear, and more efficient aerodynamic layouts. The resulting airframe can carry better engines, weapons, and fuel while remaining practical for mass production."
 medium_plane_airframe_desc: "A medium airframe provides the structural foundation, internal volume, and load-bearing strength needed for tactical bombers, heavy fighters, and reconnaissance aircraft. Its design determines how much engine power, fuel, armament, protection, and mission equipment can be carried effectively."
 small_plane_airframe_3_desc: "Advanced small airframe construction incorporates wartime experience in structural strength, aerodynamics, cockpit layout, and high-powered engines. The airframe is designed to remain effective under heavier loads and at the much greater speeds demanded by modern air combat."
 cv_small_plane_airframe_0_desc: "Interwar carrier airframes reinforce light aircraft for hard deck landings while incorporating arrestor hooks and navalized structures. Early carrier operations remain demanding, but these adaptations make routine shipboard fighter and scout aviation possible."
 medium_plane_airframe: "Medium Airframe"
 large_plane_airframe_2_desc: "Improved large airframe design uses stronger alloys, refined aerodynamics, and better internal arrangement to carry greater loads at higher speed and altitude. More efficient structures leave additional weight available for fuel, armament, protection, and specialized equipment."
 medium_plane_airframe_0_desc: "Interwar medium airframe design applies increasingly mature all-metal construction, enclosed crew stations, and more reliable engines to the needs of tactical bombers, heavy fighters, and reconnaissance aircraft. It provides a practical foundation for the rapid advances in military aviation expected during the coming decade."
 medium_plane_airframe_4: "Modern Medium Airframe"
 medium_plane_airframe_2: "Improved Medium Airframe"
 medium_plane_airframe_3: "Advanced Medium Airframe"
 medium_plane_airframe_0: "Interwar Medium Airframe"
 medium_plane_airframe_1: "Basic Medium Airframe"
 small_plane_airframe_desc: "A small airframe provides the structural foundation, internal volume, and load-bearing strength needed for fighter and light attack aircraft. Its design determines how much engine power, fuel, armament, protection, and mission equipment can be carried effectively."
 large_plane_airframe_0_desc: "Interwar large airframe design applies increasingly mature all-metal construction, enclosed crew stations, and more reliable engines to the needs of strategic bombers and other long-range heavy aircraft. It provides a practical foundation for the rapid advances in military aviation expected during the coming decade."
 large_plane_airframe_3_desc: "Advanced large airframe construction incorporates wartime experience in structural strength, aerodynamics, cockpit layout, and high-powered engines. The airframe is designed to remain effective under heavier loads and at the much greater speeds demanded by modern air combat."
 cv_small_plane_airframe_2_desc: "Improved carrier airframes combine stronger structures with more efficient folding arrangements and higher-performance engines. They can carry greater armament and fuel while surviving the repeated stresses of takeoff, landing, and deck handling at sea."
 large_plane_airframe: "Large Airframe"
 extra_ammo_storage: "Extra Ammunition Storage"
 additional_machine_guns: "Additional Machine Guns"
 tank_radio_3_desc: "Advanced tank radios use more reliable components, clearer voice transmission, and better antennas to maintain communications during fast-moving operations. Integrated wireless networks let armored units react quickly to reconnaissance and command information."
 tank_super_heavy_three_man_tank_turret: "Super-Heavy Three-Man Turret"
 light_tank_chassis: "Light Tank Chassis"
 tank_welded_armor: "Welded Armor"
 tank_anti_air_cannon_desc: "A high-angle rapid-firing cannon mounted on an armored chassis protects mobile formations from low-flying aircraft. The weapon can also be effective against infantry and lightly armored vehicles."
 tank_anti_air_cannon: "Tank Anti-Air Cannon I"
 auto_loader: "Automatic Loader"
 amphibious_drive: "Amphibious Drive"
 additional_machine_guns_desc: "Extra hull and turret machine guns increase a tank’s ability to suppress infantry and engage close targets without using the main cannon. The additional mounts improve defensive fire but consume ammunition, crew attention, and internal space."
 tank_christie_suspension_desc: "Large road wheels and long-travel coil springs give Christie suspension excellent speed and cross-country mobility for its era. The design occupies considerable internal space but strongly influences the development of fast tank chassis."
 tank_rocket_launcher_2_desc: "Improved armored rocket launchers use better projectiles, aiming systems, and launcher arrangements to increase range and salvo weight. Their rapid massed fire is effective against troop concentrations and prepared positions."
 tank_auto_cannon_2: "Tank Autocannon II"
 tank_close_support_gun_desc: "A short-barreled, relatively large-caliber gun fires powerful high-explosive shells against infantry, buildings, and field fortifications. Low muzzle velocity limits anti-tank performance, but the compact weapon is well suited to direct infantry support."
 dozer_blade: "Dozer Blade"
 tank_medium_fixed_superstructure_turret: "Medium Fixed Superstructure"
 secondary_turret_hmg: "Heavy Machine-Gun Secondary Turret"
 tank_small_cannon_2: "Small Tank Cannon II"
 tank_heavy_howitzer: "Heavy Tank Howitzer"
 secondary_turret_hmg_desc: "A small auxiliary turret carrying a heavy machine gun adds all-around fire against infantry, light vehicles, and low-flying aircraft. The extra position increases fighting flexibility but requires additional crew space and complicates the vehicle layout."
 tank_high_velocity_cannon_3: "High-Velocity Cannon III"
 tank_high_velocity_cannon_2: "High-Velocity Cannon II"
 tank_medium_two_man_tank_turret_desc: "A 2-man medium tank turret separates some weapon handling from command duties, improving efficiency while keeping the turret relatively compact. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 heavy_tank_chassis: "Heavy Tank Chassis"
 tank_light_one_man_tank_turret: "Light One-Man Turret"
 tank_heavy_machine_gun: "Heavy Machine Gun"
 tank_anti_air_cannon_3_desc: "Advanced mobile anti-aircraft cannon combine fast traverse, high-velocity automatic weapons, and improved fire-control equipment. They can create a dense protective screen against increasingly fast and heavily armed aircraft."
 tank_high_velocity_cannon: "High-Velocity Cannon I"
 tank_welded_armor_desc: "Welding joins armor plates without heavy riveted seams, reducing weight and eliminating many internal splinter hazards. Strong welded construction requires good metallurgy, skilled labor, and reliable industrial quality control."
 tank_heavy_cannon: "Heavy Tank Cannon I"
 tank_light_three_man_tank_turret: "Light Three-Man Turret"
 secondary_turret_small_cannon: "Small-Cannon Secondary Turret"
 tank_modern_tank_turret_desc: "A 3-man modern tank turret lets commander, gunner, and loader concentrate on separate tasks, greatly improving observation, target engagement, and sustained combat efficiency. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 tank_interleaved_suspension: "Interleaved Road Wheels"
 tank_medium_fixed_superstructure_turret_desc: "A fixed medium fighting superstructure mounts the main gun directly in the hull instead of a rotating turret. Eliminating the turret saves weight and allows a larger weapon or thicker frontal armor, but the entire vehicle must turn to engage targets outside the gun’s limited traverse."
 tank_heavy_three_man_tank_turret_desc: "A 3-man heavy tank turret lets commander, gunner, and loader concentrate on separate tasks, greatly improving observation, target engagement, and sustained combat efficiency. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 tank_auto_cannon: "Tank Autocannon I"
 sloped_armor: "Sloped Armor"
 flamethrower: "Tank Flamethrower"
 tank_heavy_two_man_tank_turret_desc: "A 2-man heavy tank turret separates some weapon handling from command duties, improving efficiency while keeping the turret relatively compact. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 tank_torsion_bar_suspension: "Torsion-Bar Suspension"
 tank_super_heavy_four_man_tank_turret_desc: "A 4-man super-heavy tank turret provides enough crew space to divide command, gunnery, loading, and additional weapon or communications duties on an exceptionally large vehicle. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 tank_radio_1_desc: "A basic tank radio allows vehicle commanders to receive orders and coordinate movement beyond visual signaling range. Even limited wireless communication greatly improves control of dispersed armored formations."
 armor_skirts_desc: "Thin spaced plates mounted outside the main hull armor can disrupt certain projectiles before they reach the primary armor surface. Skirts also protect running gear from fragments, though they add width, weight, and maintenance burden."
 tank_heavy_cannon_desc: "A heavy tank cannon fires large, high-energy projectiles capable of defeating thick armor and strong fortifications. Its size, recoil, and ammunition weight demand a large turret and robust chassis."
 tank_light_fixed_superstructure_turret_desc: "A fixed light fighting superstructure mounts the main gun directly in the hull instead of a rotating turret. Eliminating the turret saves weight and allows a larger weapon or thicker frontal armor, but the entire vehicle must turn to engage targets outside the gun’s limited traverse."
 stabilizer: "Gun Stabilizer"
 wet_ammo_storage_desc: "Protective ammunition racks surrounded by liquid or otherwise isolated from the crew reduce the chance that penetrating hits ignite stored propellant. Better stowage greatly improves crew survival when a tank’s armor is penetrated."
 medium_tank_chassis_desc: "A medium tank chassis provides the hull, running gear, engine space, armor structure, and turret ring needed to build balanced armored fighting vehicles combining mobility, protection, and firepower. The basic chassis determines how much weight and equipment the final vehicle can carry while remaining mechanically reliable."
 tank_cast_armor_desc: "Casting armor allows curved shapes and thick integrated sections that are difficult to produce from flat plate. Large castings can simplify turret and hull forms, but require specialized foundries and careful control of steel quality."
 tank_medium_one_man_tank_turret_desc: "A 1-man medium tank turret forces the commander to load, aim, or fire the weapon as well as direct the vehicle, saving space but sharply increasing workload. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 tank_medium_howitzer_desc: "A medium howitzer mounted in an armored vehicle delivers heavy high-explosive shells against troops, strongpoints, and urban positions. Its low velocity favors explosive effect over armor penetration."
 armor_skirts: "Armor Skirts"
 tank_cast_armor: "Cast Armor"
 tank_torsion_bar_suspension_desc: "Torsion bars running across the hull provide compact springing with good wheel travel and strong cross-country performance. The system supports heavy armor efficiently, though damaged bars can be difficult to replace in the field."
 tank_medium_three_man_tank_turret: "Medium Three-Man Turret"
 dozer_blade_desc: "A front-mounted dozer blade lets a tank clear rubble, prepare firing positions, fill obstacles, and improve rough approaches under armor protection. It turns the vehicle into a useful battlefield engineering asset at the cost of extra weight and bulk."
 tank_medium_one_man_tank_turret: "Medium One-Man Turret"
 tank_petrol_electric_engine_desc: "A petrol engine driving electrical generators and traction motors allows flexible power transmission without a conventional mechanical gearbox. The system can provide smooth control for very heavy vehicles, but adds weight, cost, and electrical complexity."
 tank_medium_cannon_2: "Medium Tank Cannon II"
 tank_riveted_armor_desc: "Riveted armor plates are straightforward to manufacture with established industrial methods and can be assembled without advanced welding. Under heavy impact, however, rivets may shear or become dangerous fragments inside the fighting compartment."
 tank_small_cannon_2_desc: "Improved small-caliber tank guns use longer barrels, better ammunition, and stronger breeches to raise muzzle velocity and penetration. They remain light enough for compact turrets while becoming more effective against armored opponents."
 tank_heavy_cannon_3_desc: "Advanced heavy tank guns combine very high muzzle velocity with sophisticated ammunition and strong recoil mechanisms. They are designed to defeat the heaviest armored targets at combat ranges where earlier guns would struggle."
 extra_ammo_storage_desc: "Additional racks increase the number of main-gun rounds carried into battle, reducing dependence on immediate resupply. Unless carefully protected, however, extra ammunition also increases the amount of explosive material inside the fighting compartment."
 tank_heavy_three_man_tank_turret: "Heavy Three-Man Turret"
 tank_christie_suspension: "Christie Suspension"
 tank_medium_howitzer_2: "Medium Tank Howitzer II"
 tank_half_track_suspension_desc: "A half-track arrangement combines steerable front wheels with powered tracks, giving better cross-country traction than a truck while retaining simpler steering and road handling. It is useful for support vehicles but less protected than a true tank chassis."
 tank_auto_cannon_desc: "A rapid-firing automatic cannon gives light tanks strong firepower against infantry, soft vehicles, and lightly armored targets. Its small shells lack the penetration and explosive weight of larger tank guns, but the high rate of fire is useful at close range."
 tank_anti_air_cannon_2: "Tank Anti-Air Cannon II"
 tank_anti_air_cannon_3: "Tank Anti-Air Cannon III"
 tank_wheeled_suspension_desc: "A wheeled armored chassis emphasizes road speed, range, and low mechanical complexity. It is cheaper and easier to maintain than tracks but sacrifices traction and obstacle-crossing ability on difficult terrain."
 tank_petrol_electric_engine: "Petrol-Electric Drive"
 tank_close_support_gun: "Close-Support Gun"
 squeezebore_adaptor: "Squeeze-Bore Adaptor"
 tank_bogie_suspension_desc: "Bogie suspension groups road wheels on pivoting trucks, providing a simple and robust way to distribute vehicle weight over the tracks. It is easy to manufacture and maintain, though ride quality and high-speed performance are limited compared with more advanced systems."
 easy_maintenance_desc: "Standardized fittings, accessible service panels, simplified components, and attention to field repair reduce the time required to keep armored vehicles operational. Good maintainability is especially valuable during long campaigns where workshops and spare parts are limited."
 tank_medium_howitzer: "Medium Tank Howitzer I"
 tank_rocket_launcher: "Tank Rocket Launcher I"
 tank_light_three_man_tank_turret_desc: "A 3-man light tank turret lets commander, gunner, and loader concentrate on separate tasks, greatly improving observation, target engagement, and sustained combat efficiency. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 tank_gasoline_engine_desc: "Gasoline engines offer high power for relatively low weight and are familiar to civilian automotive industry, making them attractive for early tanks. Their fuel is volatile, however, and heavy armored vehicles place severe demands on cooling and reliability."
 tank_light_two_man_tank_turret_desc: "A 2-man light tank turret separates some weapon handling from command duties, improving efficiency while keeping the turret relatively compact. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 tank_gas_turbine_engine: "Gas-Turbine Engine"
 tank_medium_three_man_tank_turret_desc: "A 3-man medium tank turret lets commander, gunner, and loader concentrate on separate tasks, greatly improving observation, target engagement, and sustained combat efficiency. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 tank_super_heavy_cannon: "Super-Heavy Tank Cannon"
 sloped_armor_desc: "Angling armor plates increases the effective thickness a projectile must penetrate and improves the chance of deflection without adding the same amount of weight as vertical protection. Sloped layouts can reduce usable internal volume, requiring careful hull design."
 auto_loader_desc: "A mechanical loading system moves ammunition from ready racks into the gun, reducing manual work and allowing a smaller turret crew or higher sustained rate of fire. The mechanism requires careful ammunition stowage and adds considerable mechanical complexity."
 flamethrower_desc: "A vehicle-mounted flamethrower projects burning fuel into bunkers, trenches, and buildings that may resist ordinary small-arms fire. Armor protects the operator better than a man-portable system, but fuel tanks and short range remain serious hazards."
 tank_heavy_machine_gun_desc: "A heavy machine gun provides sustained fire against infantry, soft vehicles, and low-flying aircraft while occupying little turret space. It is an inexpensive secondary weapon but cannot replace a cannon against armored targets."
 tank_medium_two_man_tank_turret: "Medium Two-Man Turret"
 tank_radio_2_desc: "Improved radio sets provide better range, reliability, and voice communication between tanks and headquarters. More consistent communications make coordinated maneuvers and rapid changes of plan far easier."
 smoke_launchers: "Smoke Launchers"
 tank_medium_howitzer_2_desc: "Improved vehicle howitzers use better recoil systems, ammunition, and mountings to deliver heavier and more accurate high-explosive fire. They provide armored formations with mobile direct-fire support against fortified targets."
 tank_super_heavy_three_man_tank_turret_desc: "A 3-man super-heavy tank turret lets commander, gunner, and loader concentrate on separate tasks, greatly improving observation, target engagement, and sustained combat efficiency. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 tank_heavy_cannon_2: "Heavy Tank Cannon II"
 tank_heavy_cannon_3: "Heavy Tank Cannon III"
 tank_interleaved_suspension_desc: "Interleaving and overlapping road wheels spreads vehicle weight over many contact points and can provide a smooth ride for heavy tanks. The arrangement is mechanically complex and makes maintenance difficult when inner wheels are damaged."
 light_tank_chassis_desc: "A light tank chassis provides the hull, running gear, engine space, armor structure, and turret ring needed to build fast reconnaissance, exploitation, and infantry-support vehicles. The basic chassis determines how much weight and equipment the final vehicle can carry while remaining mechanically reliable."
 easy_maintenance: "Ease of Maintenance"
 tank_high_velocity_cannon_desc: "A long-barreled, high-velocity gun sacrifices some explosive shell weight in favor of flat trajectory and armor penetration. It is especially effective as an anti-tank weapon when mounted on vehicles able to absorb its recoil."
 tank_wheeled_suspension: "Wheeled Suspension"
 tank_anti_air_cannon_2_desc: "Improved self-propelled anti-aircraft cannon use higher rates of fire, better sights, and more powerful ammunition to track faster aircraft. Their armored mobility allows air defense to remain close to advancing formations."
 squeezebore_adaptor_desc: "A tapered-bore adaptor compresses a specially designed projectile as it travels down the barrel, producing very high muzzle velocity and improved armor penetration from a relatively small gun. Specialized ammunition and barrel wear limit widespread use."
 tank_medium_cannon: "Medium Tank Cannon I"
 tank_high_velocity_cannon_2_desc: "Improved high-velocity cannon design uses stronger barrels, larger propellant charges, and better armor-piercing projectiles. The flatter trajectory and greater impact energy improve accuracy and penetration against modern tanks."
 tank_heavy_two_man_tank_turret: "Heavy Two-Man Turret"
 tank_high_velocity_cannon_3_desc: "Advanced high-velocity guns push muzzle energy and armor penetration to extreme levels through improved metallurgy, ammunition, and recoil control. The result is a specialized weapon for defeating heavily armored vehicles at long range."
 tank_heavy_fixed_superstructure_turret: "Heavy Fixed Superstructure"
 amphibious_drive_desc: "Sealed hull fittings, flotation arrangements, and water propulsion allow an armored vehicle to cross rivers and calm coastal waters without a bridge. The equipment adds weight and complexity, but greatly expands tactical mobility during amphibious and river-crossing operations."
 secondary_turret_small_cannon_desc: "An auxiliary turret armed with a small cannon gives a large tank a second weapon for engaging infantry and light vehicles independently of the main gun. The concept increases fire coverage but adds weight, crew requirements, and mechanical complexity."
 tank_light_one_man_tank_turret_desc: "A 1-man light tank turret forces the commander to load, aim, or fire the weapon as well as direct the vehicle, saving space but sharply increasing workload. Turret size determines crew efficiency, weapon space, armor weight, and the size of turret ring required by the hull."
 tank_diesel_engine: "Diesel Engine"
 tank_medium_cannon_desc: "A medium-caliber tank gun offers enough shell weight and muzzle velocity to engage armored vehicles while retaining a useful high-explosive round against infantry and fortifications. It becomes the standard general-purpose armament for balanced tank designs."
 tank_heavy_howitzer_desc: "A heavy howitzer gives an armored vehicle exceptional demolition power against bunkers, buildings, and entrenched troops. The enormous shells and recoil require a large fighting compartment and reduce ammunition capacity."
 smoke_launchers_desc: "Dedicated smoke dischargers rapidly create a local screen that obscures a tank from enemy observation and direct fire. They give the crew an immediate way to break contact, conceal movement, or cover a short withdrawal."
 stabilizer_desc: "A gun stabilizer counteracts vehicle movement so the main weapon remains closer to the target while the tank is moving. Early systems do not permit perfect firing on the move, but they shorten the time needed to settle and aim after maneuvering."
 tank_diesel_engine_desc: "Diesel engines provide strong low-speed torque and better fuel economy than comparable gasoline engines. Less volatile fuel and longer operational range make them well suited to armored vehicles, though the engines can be heavier and more expensive to manufacture."
 tank_riveted_armor: "Riveted Armor"
 medium_tank_chassis_0: "Interwar Medium Tank Chassis"
 tank_auto_cannon_2_desc: "An improved automatic cannon uses better ammunition, feed mechanisms, and higher velocity to increase lethality against light armor and aircraft-sized targets. It remains compact enough for small turrets while providing much greater volume of fire than a conventional cannon."
 tank_medium_cannon_2_desc: "Improved medium tank guns combine higher velocity, stronger barrels, and better armor-piercing ammunition. The weapon remains versatile against soft targets while gaining the penetration needed to defeat increasingly well-protected enemy tanks."
 tank_modern_tank_turret: "Modern Tank Turret"
 tank_light_two_man_tank_turret: "Light Two-Man Turret"
 heavy_tank_chassis_desc: "A heavy tank chassis provides the hull, running gear, engine space, armor structure, and turret ring needed to build heavily protected breakthrough vehicles carrying large weapons. The basic chassis determines how much weight and equipment the final vehicle can carry while remaining mechanically reliable."
 tank_gas_turbine_engine_desc: "A gas turbine offers exceptional power density and smooth high-output operation for armored vehicles. Rapid fuel consumption, heat, and demanding maintenance offset the strong acceleration and compact mechanical layout."
 tank_heavy_cannon_2_desc: "A more powerful heavy cannon uses improved metallurgy, longer barrels, and better armor-piercing ammunition to increase effective range and penetration. The weapon imposes substantial weight and space penalties but gives heavy tanks formidable anti-armor performance."
 tank_half_track_suspension: "Half-Track Suspension"
 light_tank_chassis_0: "Interwar Light Tank Chassis"
 tank_radio_2: "Tank Radio II"
 tank_radio_3: "Tank Radio III"
 tank_radio_1: "Tank Radio I"
 tank_small_cannon_desc: "A compact tank gun provides a useful balance of armor penetration, explosive effect, and low weight for early armored vehicles. Its modest recoil and ammunition size make it suitable for small turrets and light chassis."
 tank_rocket_launcher_desc: "An armored rocket launcher carries multiple explosive rockets on a mobile, protected chassis. It can deliver a sudden concentration of fire against area targets, though accuracy and ammunition supply are inferior to conventional guns."
 tank_heavy_fixed_superstructure_turret_desc: "A fixed heavy fighting superstructure mounts the main gun directly in the hull instead of a rotating turret. Eliminating the turret saves weight and allows a larger weapon or thicker frontal armor, but the entire vehicle must turn to engage targets outside the gun’s limited traverse."
 tank_bogie_suspension: "Bogie Suspension"
 tank_rocket_launcher_2: "Tank Rocket Launcher II"
 tank_small_cannon: "Small Tank Cannon I"
 heavy_tank_chassis_0: "Interwar Heavy Tank Chassis"
 tank_gasoline_engine: "Gasoline Engine"
 tank_super_heavy_four_man_tank_turret: "Super-Heavy Four-Man Turret"
 wet_ammo_storage: "Wet Ammunition Storage"
 medium_tank_chassis: "Medium Tank Chassis"
 tank_light_fixed_superstructure_turret: "Light Fixed Superstructure"
 tank_super_heavy_cannon_desc: "A super-heavy cannon is designed to defeat the strongest fortifications and thickest armor with extremely large, high-energy projectiles. Its tremendous size and recoil demand a massive chassis and severely limit ammunition capacity and mobility."
